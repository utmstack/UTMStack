# Microsoft Graph filter, version 1.2.0

# Normalizes raw Microsoft Graph security records into the event schema.
# Tags each record with its source in log.graphSource so rules can branch,
# and promotes each source's own time field to deviceTime.

pipeline:
  - dataTypes: [o365-graph]
    order: 37
    steps:
      - json:
          source: raw
      - add:
          function: string
          params:
            key: log.graphSource
            value: unknown
      # appDisplayName + ipAddress: signIns
      - add:
          function: string
          params:
            key: log.graphSource
            value: sign-ins
          where: exists("appDisplayName") && exists("ipAddress")
      # riskLastUpdatedDateTime: riskyUsers (before risk-detections, which
      # also carries riskState+riskLevel)
      - add:
          function: string
          params:
            key: log.graphSource
            value: risky-user
          where: exists("riskLastUpdatedDateTime")
      # riskState + riskLevel: riskDetections
      - add:
          function: string
          params:
            key: log.graphSource
            value: risk-detections
          where: exists("riskState") && exists("riskLevel") && !exists("riskLastUpdatedDateTime")
      # activityDisplayName + result: directoryAudits
      - add:
          function: string
          params:
            key: log.graphSource
            value: directory-audit
          where: exists("activityDisplayName") && exists("result")
      # Url + AccountUpn: UrlClickEvents (before hunting, which also carries
      # NetworkMessageId)
      - add:
          function: string
          params:
            key: log.graphSource
            value: url-click
          where: exists("Url") && exists("AccountUpn")
      # NetworkMessageId: hunting query result rows (no RowKey in results)
      - add:
          function: string
          params:
            key: log.graphSource
            value: hunting
          where: exists("NetworkMessageId") && !exists("Url")
      # ActivityDisplayName + ActivityDateTime (capital A): Purview audit records
      - add:
          function: string
          params:
            key: log.graphSource
            value: purview-audit
          where: exists("ActivityDisplayName") && exists("ActivityDateTime")
      # alertDisplayName: securityAlerts v1 and v2
      - add:
          function: string
          params:
            key: log.graphSource
            value: security-alerts
          where: exists("alertDisplayName")
      # incidentType + alertCount: securityIncidents
      - add:
          function: string
          params:
            key: log.graphSource
            value: security-incidents
          where: exists("incidentType") && exists("alertCount")
      # Promote each source's time field to deviceTime so the event keeps the
      # record's own time instead of ingest wall-clock time.
      - rename:
          from:
            - log.alertDateTime
          to: deviceTime
          where: exists("log.alertDateTime")
      - rename:
          from:
            - log.modifiedDateTime
          to: deviceTime
          where: exists("log.modifiedDateTime")
      - rename:
          from:
            - log.lastUpdateDateTime
          to: deviceTime
          where: exists("log.lastUpdateDateTime")
      - rename:
          from:
            - log.activityDateTime
          to: deviceTime
          where: exists("log.activityDateTime")
      - rename:
          from:
            - log.createdDateTime
          to: deviceTime
          where: exists("log.createdDateTime")
      - rename:
          from:
            - log.Timestamp
          to: deviceTime
          where: exists("log.Timestamp")
      - rename:
          from:
            - log.riskLastUpdatedDateTime
          to: deviceTime
          where: exists("log.riskLastUpdatedDateTime")
      - rename:
          from:
            - log.ActivityDateTime
          to: deviceTime
          where: exists("log.ActivityDateTime")
      # Human-readable action name.
      - rename:
          from:
            - log.alertDisplayName
          to: action
          where: exists("log.alertDisplayName")
      - rename:
          from:
            - log.activityDisplayName
          to: action
          where: exists("log.activityDisplayName")
      - rename:
          from:
            - log.ActivityDisplayName
          to: action
          where: exists("log.ActivityDisplayName")
      - rename:
          from:
            - log.incidentType
          to: action
          where: exists("log.incidentType")
      - add:
          function: string
          params:
            key: action
            value: sign-in
          where: exists("appDisplayName") && exists("ipAddress")
      - add:
          function: string
          params:
            key: action
            value: email-event
          where: exists("NetworkMessageId") && !exists("Url")
      - add:
          function: string
          params:
            key: action
            value: url-click
          where: exists("Url") && exists("AccountUpn")
      - add:
          function: string
          params:
            key: action
            value: risky-user
          where: exists("riskLastUpdatedDateTime")
      # Result outcome.
      - rename:
          from:
            - log.result
          to: actionResult
          where: exists("log.result")
      # Graph sign-in reports errorCode 0 on success, a non-zero code on failure.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: exists("status.errorCode") && equals("status.errorCode", 0)
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: exists("status.errorCode") && !equals("status.errorCode", 0)
      # User attribution.
      - rename:
          from:
            - log.userPrincipalName
          to: origin.user
          where: exists("log.userPrincipalName")
      - rename:
          from:
            - log.AccountUpn
          to: origin.user
          where: exists("log.AccountUpn")
      - rename:
          from:
            - log.initiatedBy.user.userPrincipalName
          to: origin.user
          where: exists("log.initiatedBy.user.userPrincipalName")
      - rename:
          from:
            - log.activityUser.userPrincipalName
          to: origin.user
          where: exists("log.activityUser.userPrincipalName")
      # Hunting rows: external sender becomes the origin, recipient the target.
      - rename:
          from:
            - log.SenderFromAddress
          to: origin.user
          where: exists("log.SenderFromAddress")
      - rename:
          from:
            - log.RecipientEmailAddress
          to: target.user
          where: exists("log.RecipientEmailAddress")
      # Network attribution.
      - rename:
          from:
            - log.ipAddress
          to: origin.ip
          where: exists("log.ipAddress")
      - rename:
          from:
            - log.IPAddress
          to: origin.ip
          where: exists("log.IPAddress")
      - rename:
          from:
            - log.initiatedBy.user.ipAddress
          to: origin.ip
          where: exists("log.initiatedBy.user.ipAddress")
