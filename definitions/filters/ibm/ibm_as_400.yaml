# IBM AS 400 filter version 4.1.1
# Support for JT400 Java Collector with full field mapping

pipeline:
  - dataTypes: [ibm-as400]
    order: 18  # global pipeline order -- unique across all filters, customer-adjustable
    steps:
      # ========================================
      # PHASE 1: EXTRACTION
      # ========================================
      
      # Drop non-AS400 logs (internal system logs, noise)
      - drop:
          where: 'startsWith("raw", "[") || contains("raw", "RunExecutor") || contains("raw", "ETL pool")'

      # Parse JSON logs from Java collector
      - json:
          source: raw
          where: 'startsWith("raw", "{")'

      # The collector sometimes writes digits before the JSON object
      # (observed: 48{...}); parse the JSON text after them the same way
      - grok:
          source: raw
          patterns:
            - pattern: '[0-9]+'
            - fieldName: log.jsonText
              pattern: '\{(?s:.*)\}'
          where: 'regexMatch("raw", "^[0-9]+\\{")'

      - json:
          source: log.jsonText
          where: 'exists("log.jsonText")'

      # Fallback: Parse non-JSON logs (raw syslog format)
      - grok:
          source: raw
          patterns:
            - fieldName: log.message
              pattern: '{{.greedy}}'
          where: '!startsWith("raw", "{") && !exists("log.jsonText")'

      - delete:
          fields:
            - log.jsonText

      # ========================================
      # PHASE 2: NORMALIZATION (Standard Schema)
      # ========================================

      # Map action/event classification
      - rename:
          from:
            - log.eventType
          to: action
          where: exists("log.eventType")

      # Map severity level
      - rename:
          from:
            - log.severityLabel
          to: severity
          where: exists("log.severityLabel")

      # Map origin side attributes
      - rename:
          from:
            - log.hostname
          to: origin.host
          where: exists("log.hostname")

      - rename:
          from:
            - log.jobUser
          to: origin.user
          where: exists("log.jobUser")

      - rename:
          from:
            - log.jobName
          to: origin.process
          where: exists("log.jobName")

      - rename:
          from:
            - log.sourceIp
          to: origin.ip
          where: exists("log.sourceIp")

      - rename:
          from:
            - log.file
          to: origin.file
          where: exists("log.file")

      # Map outcome and client address (actionResult: success, failed or none)
      # CPIAD09 reports that a user from a client address connected to a host
      # server job, and CPIAD02 that a user from a client connected to a host
      # server; their text is localized and names the address after the word
      # client (cliente in Spanish). CPF2234 reports a password that is not
      # correct. Other messages, such as CPIAD0B, carry no final result.
      - grok:
          source: log.message
          patterns:
            - pattern: '(?i)^.*?\bclient\w*\s+'
            - fieldName: log.clientAddress
              pattern: '(?:[0-9]{1,3}\.){3}[0-9]{1,3}|[0-9A-Fa-f]{0,4}:[0-9A-Fa-f:.]*'
          where: oneOf("log.messageId", ["CPIAD09", "CPIAD02"]) && !exists("origin.ip")

      - rename:
          from:
            - log.clientAddress
          to: origin.ip
          where: (inCIDR("log.clientAddress", "0.0.0.0/0") || inCIDR("log.clientAddress", "::/0")) && !inCIDR("log.clientAddress", "0.0.0.0/32") && !inCIDR("log.clientAddress", "::/128")

      - delete:
          fields:
            - log.clientAddress

      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: oneOf("log.messageId", ["CPIAD09", "CPIAD02"])

      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: equals("log.messageId", "CPF2234")

      # ========================================
      # PHASE 3: ENRICHMENT
      # ========================================
      
      # Add geolocation for source IP
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")