# System Linux filter version 5.0.0
# Support for:
#   - systemd/journald JSON format (SCREAMINGSNAKECASE fields)
#   - Native auditd collector JSON format (type: "auditd")
# Converts SCREAMINGSNAKECASE and snakecase to camelCase
# Maps to UTMStack Standard Event Schema
# Optimized: Direct mapping to standard schema (no intermediate steps)

pipeline:
  - dataTypes: [linux]
    order: 20  # global pipeline order -- unique across all filters, customer-adjustable
    steps:
      # ========================================
      # PHASE 1: EXTRACTION
      # ========================================

      # Parse JSON from systemd/journald
      - json:
          source: raw
          where: 'startsWith("raw", "{")'

      # ========================================
      # PHASE 2: FIELD NORMALIZATION (camelCase conversion)
      # ========================================

      # Convert SCREAMINGSNAKECASE to camelCase
      #
      # IMPORTANT -- two independent bugs stacked here, both confirmed
      # against real output on V11-DEV-18:
      #
      # 1. journald's real `journalctl -o json` field names carry
      #    underscores (_PID, _UID, _SYSTEMD_UNIT, SYSLOG_IDENTIFIER, ...;
      #    see the field-name reference below). A previous version of this
      #    file checked plain-uppercase no-underscore keys that journald
      #    never emits at all, so nothing in this phase ever fired.
      # 2. Deeper and still current: the EventProcessor's `json` pipeline
      #    step (plugins/json/main.go) runs every parsed key through
      #    go-sdk's SanitizeField() before writing it under log.*, and that
      #    function's allow-list regex ([^a-zA-Z0-9.]) omits "_" -- so every
      #    underscore is silently stripped from TOP-LEVEL key names on the
      #    way into the `log` JSON column. `_HOSTNAME` lands as `log.HOSTNAME`,
      #    `_SYSTEMD_CGROUP` as `log.SYSTEMDCGROUP`, `subj_user` (auditd) as
      #    `log.subjuser`, etc. Nested object fields (execve.a0, userauth.acct)
      #    are unaffected -- SanitizeField only runs on the top-level keys
      #    plugins/json/main.go iterates, not recursively on nested values.
      #    Fixed upstream at the source (go-sdk/utils/fields.go, allow-list
      #    changed to [^a-zA-Z0-9_.]) but that fix is an uncommitted local
      #    patch as of this writing -- NOT in the EventProcessor image
      #    currently deployed anywhere. Every `from`/`exists()` below
      #    therefore intentionally checks the ALREADY-STRIPPED name, not the
      #    real journald/auditd one, so this filter keeps working against
      #    today's deployed EventProcessor. Once a build containing the
      #    go-sdk fix ships, every rename below must be reverted back to the
      #    real underscored name (e.g. log.HOSTNAME -> log._HOSTNAME,
      #    log.subjuser -> log.subj_user) or it will silently break again
      #    the same way, just in the opposite direction.
      #
      # journald field-name reference (real names, pre-stripping):
      #  - "trusted" fields (added by journald about the logging process,
      #    not settable by the process itself) get a single leading
      #    underscore: _PID, _UID, _GID, _EXE, _COMM, _CMDLINE, _HOSTNAME,
      #    _TRANSPORT, _SELINUX_CONTEXT, _SYSTEMD_*, _BOOT_ID, _MACHINE_ID,
      #    _CAP_EFFECTIVE, _AUDIT_*, _SOURCE_REALTIME_TIMESTAMP,
      #    _RUNTIME_SCOPE, _STREAM_ID.
      #  - journald's own internal "address fields" get a double leading
      #    underscore: __CURSOR, __REALTIME_TIMESTAMP,
      #    __MONOTONIC_TIMESTAMP, __SEQNUM, __SEQNUM_ID.
      #  - fields the logging client sets itself (or systemd sets about a
      #    unit action) have NO leading underscore, but still use
      #    underscores between words: MESSAGE, PRIORITY, SYSLOG_IDENTIFIER,
      #    SYSLOG_FACILITY, SYSLOG_PID, SYSLOG_TIMESTAMP, UNIT,
      #    INVOCATION_ID, CODE_FILE/LINE/FUNC, JOB_ID/TYPE/RESULT,
      #    MESSAGE_ID.
      - rename:
          from:
            - log.MESSAGE
          to: log.message
          where: exists("log.MESSAGE")

      - rename:
          from:
            - log.PRIORITY
          to: log.priority
          where: exists("log.PRIORITY")

      - rename:
          from:
            - log.SYSLOGIDENTIFIER
          to: log.syslogIdentifier
          where: exists("log.SYSLOGIDENTIFIER")

      - rename:
          from:
            - log.SYSLOGTIMESTAMP
          to: log.syslogTimestamp
          where: exists("log.SYSLOGTIMESTAMP")

      - rename:
          from:
            - log.SYSLOGFACILITY
          to: log.syslogFacility
          where: exists("log.SYSLOGFACILITY")

      - rename:
          from:
            - log.SYSLOGPID
          to: log.syslogPid
          where: exists("log.SYSLOGPID")

      # Convert snakecase to camelCase (only for fields staying in log.*)
      - rename:
          from:
            - log.PID
          to: log.pid
          where: exists("log.PID")

      - rename:
          from:
            - log.UID
          to: log.uid
          where: exists("log.UID")

      - rename:
          from:
            - log.GID
          to: log.gid
          where: exists("log.GID")

      - rename:
          from:
            - log.TID
          to: log.tid
          where: exists("log.TID")

      - rename:
          from:
            - log.EXE
          to: log.exe
          where: exists("log.EXE")

      - rename:
          from:
            - log.UNIT
          to: log.unit
          where: exists("log.UNIT")

      - rename:
          from:
            - log.SYSTEMDUNIT
          to: log.systemdUnit
          where: exists("log.SYSTEMDUNIT")

      - rename:
          from:
            - log.SYSTEMDSLICE
          to: log.systemdSlice
          where: exists("log.SYSTEMDSLICE")

      - rename:
          from:
            - log.SYSTEMDUSERSLICE
          to: log.systemdUserSlice
          where: exists("log.SYSTEMDUSERSLICE")

      - rename:
          from:
            - log.SYSTEMDSESSION
          to: log.systemdSession
          where: exists("log.SYSTEMDSESSION")

      - rename:
          from:
            - log.SYSTEMDOWNERUID
          to: log.systemdOwnerUid
          where: exists("log.SYSTEMDOWNERUID")

      - rename:
          from:
            - log.SYSTEMDCGROUP
          to: log.systemdCgroup
          where: exists("log.SYSTEMDCGROUP")

      - rename:
          from:
            - log.SYSTEMDINVOCATIONID
          to: log.systemdInvocationId
          where: exists("log.SYSTEMDINVOCATIONID")

      - rename:
          from:
            - log.BOOTID
          to: log.bootId
          where: exists("log.BOOTID")

      - rename:
          from:
            - log.MACHINEID
          to: log.machineId
          where: exists("log.MACHINEID")

      - rename:
          from:
            - log.TRANSPORT
          to: log.transport
          where: exists("log.TRANSPORT")

      - rename:
          from:
            - log.SELINUXCONTEXT
          to: log.selinuxContext
          where: exists("log.SELINUXCONTEXT")

      - rename:
          from:
            - log.AUDITSESSION
          to: log.auditSession
          where: exists("log.AUDITSESSION")

      - rename:
          from:
            - log.AUDITLOGINUID
          to: log.auditLoginUid
          where: exists("log.AUDITLOGINUID")

      - rename:
          from:
            - log.CAPEFFECTIVE
          to: log.capEffective
          where: exists("log.CAPEFFECTIVE")

      - rename:
          from:
            - log.REALTIMETIMESTAMP
          to: log.realtimeTimestamp
          where: exists("log.REALTIMETIMESTAMP")

      - rename:
          from:
            - log.SOURCEREALTIMETIMESTAMP
          to: log.sourceRealtimeTimestamp
          where: exists("log.SOURCEREALTIMETIMESTAMP")

      - rename:
          from:
            - log.MONOTONICTIMESTAMP
          to: log.monotonicTimestamp
          where: exists("log.MONOTONICTIMESTAMP")

      - rename:
          from:
            - log.CURSOR
          to: log.cursor
          where: exists("log.CURSOR")

      - rename:
          from:
            - log.SEQNUM
          to: log.seqnum
          where: exists("log.SEQNUM")

      - rename:
          from:
            - log.SEQNUMID
          to: log.seqnumId
          where: exists("log.SEQNUMID")

      - rename:
          from:
            - log.RUNTIMESCOPE
          to: log.runtimeScope
          where: exists("log.RUNTIMESCOPE")

      - rename:
          from:
            - log.STREAMID
          to: log.streamId
          where: exists("log.STREAMID")

      - rename:
          from:
            - log.CODEFILE
          to: log.codeFile
          where: exists("log.CODEFILE")

      - rename:
          from:
            - log.CODELINE
          to: log.codeLine
          where: exists("log.CODELINE")

      - rename:
          from:
            - log.CODEFUNC
          to: log.codeFunc
          where: exists("log.CODEFUNC")

      - rename:
          from:
            - log.INVOCATIONID
          to: log.invocationId
          where: exists("log.INVOCATIONID")

      - rename:
          from:
            - log.JOBID
          to: log.jobId
          where: exists("log.JOBID")

      - rename:
          from:
            - log.JOBRESULT
          to: actionResult
          where: exists("log.JOBRESULT") && !regexMatch("log.JOBRESULT", "(?i)\b(?:denied|blocked|failed)\b")

      - rename:
          from:
            - log.JOBTYPE
          to: log.jobType
          where: exists("log.JOBTYPE")

      - rename:
          from:
            - log.MESSAGEID
          to: log.messageId
          where: exists("log.MESSAGEID")

      - rename:
          from:
            - log.CPUUSAGENSEC
          to: log.cpuUsageNsec
          where: exists("log.CPUUSAGENSEC")

      - rename:
          from:
            - log.MEMORYPEAK
          to: log.memoryPeak
          where: exists("log.MEMORYPEAK")

      - rename:
          from:
            - log.MEMORYSWAPPEAK
          to: log.memorySwapPeak
          where: exists("log.MEMORYSWAPPEAK")

      # ========================================
      # PHASE 3: STANDARD SCHEMA MAPPING
      # ========================================

      # Map directly to Standard Event Schema (no intermediate camelCase step)
      - rename:
          from:
            - log.HOSTNAME
          to: origin.host
          where: exists("log.HOSTNAME")

      # journald has no native resolved-username field for arbitrary log
      # lines -- _UID is the numeric UID journald observed for the logging
      # process, not a name. For auth-specific events prefer the richer
      # auditd userauth.acct/subj_user mapping added in Phase 4 below,
      # which carries an actual account name.
      - rename:
          from:
            - log.UID
          to: origin.user
          where: 'exists("log.UID") && !exists("origin.user")'

      - rename:
          from:
            - log.COMM
          to: origin.process
          where: exists("log.COMM")

      - rename:
          from:
            - log.CMDLINE
          to: origin.command
          where: exists("log.CMDLINE")

      # Map syslog priority (0-7) to severity labels
      - add:
          function: string
          params:
            key: severity
            value: "emergency"
          where: 'equals("log.priority", "0")'

      - add:
          function: string
          params:
            key: severity
            value: "alert"
          where: 'equals("log.priority", "1")'

      - add:
          function: string
          params:
            key: severity
            value: "critical"
          where: 'equals("log.priority", "2")'

      - add:
          function: string
          params:
            key: severity
            value: "error"
          where: 'equals("log.priority", "3")'

      - add:
          function: string
          params:
            key: severity
            value: "warning"
          where: 'equals("log.priority", "4")'

      - add:
          function: string
          params:
            key: severity
            value: "notice"
          where: 'equals("log.priority", "5")'

      - add:
          function: string
          params:
            key: severity
            value: "info"
          where: 'equals("log.priority", "6")'

      - add:
          function: string
          params:
            key: severity
            value: "debug"
          where: 'equals("log.priority", "7")'

      # ========================================
      # PHASE 4: AUDITD NORMALIZATION
      # Process only when log.type == "auditd"
      # Auditd logs have lowercase fields and type: "auditd"
      # ========================================

      # Map auditd syscall to action (primary action identifier)
      - rename:
          from:
            - log.syscall
          to: action
          where: 'equals("log.type", "auditd") && exists("log.syscall")'

      # Fallback: map category to action if syscall not present
      - rename:
          from:
            - log.category
          to: action
          where: 'equals("log.type", "auditd") && !exists("action") && exists("log.category")'

      # Map result to actionResult (success/failure)
      - rename:
          from:
            - log.result
          to: actionResult
          where: 'equals("log.type", "auditd") && exists("log.result") && !regexMatch("log.result", "(?i)\b(?:denied|blocked|failed)\b")'

      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: regexMatch("log.result", "(?i)\bdenied\b")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'blocked'
          where: regexMatch("log.result", "(?i)\bblocked\b")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: regexMatch("log.result", "(?i)\bfailed\b")

      # Map exe to origin.process (full path to executable)
      # Only if journald's COMM didn't already set origin.process
      - rename:
          from:
            - log.exe
          to: origin.process
          where: 'equals("log.type", "auditd") && exists("log.exe") && !exists("origin.process")'

      # Fallback: map auditd comm to origin.process if exe not mapped
      - rename:
          from:
            - log.comm
          to: origin.process
          where: 'equals("log.type", "auditd") && !exists("origin.process") && exists("log.comm")'

      # Map proctitle to origin.command (full command line)
      - rename:
          from:
            - log.proctitle
          to: origin.command
          where: 'equals("log.type", "auditd") && exists("log.proctitle")'

      # Map audit login UID (auid) to origin.user -- the ORIGINAL authenticated
      # user, persists across su/sudo/setuid (unlike uid/euid, which change on
      # privilege escalation). Preferred over subj_user below: confirmed on
      # real V11-DEV-18 traffic that subj_user is "unconfined" (or
      # "docker-default" for container processes) for nearly everything on
      # this AppArmor-default Ubuntu host -- a confinement profile label, not
      # a user identity -- while auid correctly stayed "1000" (the real SSH
      # login) even for commands that had escalated to uid=0 via sudo/cron.
      # Still just a numeric UID, not a resolved username -- this filter has
      # no UID->username lookup capability, so a real name needs either an
      # agent-side /etc/passwd lookup or SOC-side correlation. auid=="unset"
      # (auditd's sentinel meaning "no login session": system daemons, cron,
      # container-internal processes) is deliberately excluded and falls
      # through to subj_user instead.
      - rename:
          from:
            - log.auid
          to: origin.user
          where: 'equals("log.type", "auditd") && exists("log.auid") && !equals("log.auid", "unset") && !equals("log.auid", "4294967295")'

      # Map subj_user to origin.user (AppArmor/SELinux subject label) --
      # fallback only, when auid gave no real login session to attribute to.
      - rename:
          from:
            - log.subjuser
          to: origin.user
          where: 'equals("log.type", "auditd") && exists("log.subjuser") && !exists("origin.user")'

      # USER_AUTH records (PAM authentication attempts, e.g. sshd password
      # auth) nest their fields under "userauth" instead of merging to root
      # (see agent/collector/auditd/parser.go's default/fallback branch --
      # only SYSCALL, CWD, PROCTITLE, EXECVE, PATH and SOCKADDR record types
      # get their own dedicated flattening). subj_user above is the SELinux
      # subject label ("unconfined"), not the account being authenticated --
      # confirmed on a real failed-login test against V11-DEV-18, where
      # subj_user was "unconfined" but userauth.acct was the actual
      # attempted username. Override with the real account name whenever a
      # USER_AUTH record is present.
      - rename:
          from:
            - log.userauth.acct
          to: origin.user
          where: 'equals("log.type", "auditd") && exists("log.userauth.acct")'

      - rename:
          from:
            - log.userauth.addr
          to: origin.ip
          where: 'equals("log.type", "auditd") && exists("log.userauth.addr")'

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: 'equals("log.type", "auditd") && equals("log.userauth.result", "fail")'

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: 'equals("log.type", "auditd") && equals("log.userauth.result", "success")'

      # USER_CMD records (sudo's own command audit -- separate from the
      # SYSCALL execve record sudo itself triggers) nest under "usercmd",
      # same reasoning as userauth above. usercmd.cmd carries the full
      # command sudo ran, which proctitle would otherwise only show as
      # "sudo <args>" without the invoking user's original request context
      # in some sudo configurations.
      - rename:
          from:
            - log.usercmd.cmd
          to: origin.command
          where: 'equals("log.type", "auditd") && exists("log.usercmd.cmd") && !exists("origin.command")'

      # Map cwd to origin.path (current working directory)
      - rename:
          from:
            - log.cwd
          to: origin.path
          where: 'equals("log.type", "auditd") && exists("log.cwd")'

      # Map exit code to statusCode (for correlation and alerting)
      - rename:
          from:
            - log.exit
          to: statusCode
          where: 'equals("log.type", "auditd") && exists("log.exit")'

      # Cast statusCode to integer (proto schema expects uint32)
      - cast:
          fields: [statusCode]
          to: int
          where: 'equals("log.type", "auditd") && exists("statusCode")'