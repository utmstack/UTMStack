# SonicWall Firewall — version 4.0.0
#
# Formats supported
#   - SonicOS syslog KV:  <pri>  id=firewall sn=... time="..." fw=... msg="..." src=IP:PORT:IF ...
#   - SonicOS syslog CEF: <pri> CEF:0|SonicWall|SonicOS|...|EventID|EventName|Sev|extension
#     where `extension` carries the same k=v pairs as the KV variant.
#
# References
# - https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-4-log-events-reference-guide.pdf
# - https://www.sonicwall.com/techdocs/pdf/SonicOS-X_7.0.1_LogEvents_ReferenceGuide.pdf

pipeline:
  - dataTypes: [firewall-sonicwall]
    order: 27  # global pipeline order -- unique across all filters, customer-adjustable
    steps:
      # -------------------------------------------------------------------
      # Syslog header (<pri>)
      # -------------------------------------------------------------------
      - grok:
          source: raw
          patterns:
            - fieldName: log.syslogPri
              pattern: '\<{{.integer}}\>'

      - trim:
          function: prefix
          substring: "<"
          fields:
            - log.syslogPri
      - trim:
          function: suffix
          substring: ">"
          fields:
            - log.syslogPri

      # -------------------------------------------------------------------
      # CEF header (only when the log line contains "CEF:")
      # -------------------------------------------------------------------
      - grok:
          source: raw
          patterns:
            - fieldName: ""
              pattern: '{{.data}}CEF:'
            - fieldName: log.cefVersion
              pattern: '{{.integer}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: log.deviceVendor
              pattern: '{{.data}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: log.deviceProduct
              pattern: '{{.data}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: log.deviceVersion
              pattern: '{{.data}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: log.eventCode
              pattern: '{{.data}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: log.eventName
              pattern: '{{.data}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: log.cefSeverity
              pattern: '{{.data}}'
            - fieldName: ""
              pattern: '\|'
          where: contains("raw", "CEF:")

      # -------------------------------------------------------------------
      # Key/Value pass over raw
      # -------------------------------------------------------------------
      - kv:
          source: raw
          fieldSplit: " "
          valueSplit: "="

      # -------------------------------------------------------------------
      # Rescue quoted / space-bearing values.
      # -------------------------------------------------------------------
      - delete:
          fields:
            - log.msg
          where: contains("raw", "msg=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(msg=)'
            - fieldName: log.message
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "msg=\"")

      - delete:
          fields:
            - log.note
          where: contains("raw", "note=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(note=)'
            - fieldName: log.note
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "note=\"")

      - delete:
          fields:
            - log.Category
          where: contains("raw", "Category=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(Category=)'
            - fieldName: log.contentCategory
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "Category=\"")

      - delete:
          fields:
            - log.rule
          where: contains("raw", "rule=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(rule=)'
            - fieldName: log.rule
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "rule=\"")

      - delete:
          fields:
            - log.sess
          where: contains("raw", "sess=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(sess=)'
            - fieldName: log.sessionType
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "sess=\"")

      - delete:
          fields:
            - log.vpnpolicy
          where: contains("raw", "vpnpolicy=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(vpnpolicy=)'
            - fieldName: log.vpnPolicy
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "vpnpolicy=\"")

      - delete:
          fields:
            - log.usr
          where: contains("raw", "usr=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(usr=)'
            - fieldName: log.userRaw
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "usr=\"")

      - delete:
          fields:
            - log.uuid
          where: contains("raw", "uuid=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(uuid=)'
            - fieldName: log.eventUuid
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "uuid=\"")

      - delete:
          fields:
            - log.fwaction
          where: contains("raw", "fw_action=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(fw_action=)'
            - fieldName: log.actionRaw
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "fw_action=\"")

      - delete:
          fields:
            - log.appName
          where: contains("raw", "appName='")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(appName=)'
            - fieldName: log.appName
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "appName='")

      - delete:
          fields:
            - log.time
          where: contains("raw", "time=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: log.grokTrash
              pattern: '{{.data}}(time=)'
            - fieldName: log.deviceTimeRaw
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: log.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "time=\"")

      # -------------------------------------------------------------------
      # Strip the trailing `word=` that the rescue groks include in
      # the captured value.
      # -------------------------------------------------------------------
      - grok:
          source: log.message
          patterns:
            - fieldName: log.message
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.message")

      - grok:
          source: log.note
          patterns:
            - fieldName: log.note
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.note")

      - grok:
          source: log.contentCategory
          patterns:
            - fieldName: log.contentCategory
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.contentCategory")

      - grok:
          source: log.rule
          patterns:
            - fieldName: log.rule
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.rule")

      - grok:
          source: log.sessionType
          patterns:
            - fieldName: log.sessionType
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.sessionType")

      - grok:
          source: log.vpnPolicy
          patterns:
            - fieldName: log.vpnPolicy
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.vpnPolicy")

      - grok:
          source: log.userRaw
          patterns:
            - fieldName: log.userRaw
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.userRaw")

      - grok:
          source: log.eventUuid
          patterns:
            - fieldName: log.eventUuid
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.eventUuid")

      - grok:
          source: log.actionRaw
          patterns:
            - fieldName: log.actionRaw
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.actionRaw")

      - grok:
          source: log.appName
          patterns:
            - fieldName: log.appName
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.appName")

      - grok:
          source: log.deviceTimeRaw
          patterns:
            - fieldName: log.deviceTimeRaw
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("log.deviceTimeRaw")

      # -------------------------------------------------------------------
      # Split src / dst  =>  ip[:port[:iface]]
      # -------------------------------------------------------------------
      - grok:
          source: log.src
          patterns:
            - fieldName: origin.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: log.sourceInterface
              pattern: '{{.word}}'
          where: contains("log.src", ":")

      - delete:
          fields:
            - log.src
          where: contains("log.src", ":")

      - rename:
          from:
            - log.src
          to: origin.ip

      - grok:
          source: log.dst
          patterns:
            - fieldName: target.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: log.targetInterface
              pattern: '{{.word}}'
          where: contains("log.dst", ":")

      - delete:
          fields:
            - log.dst
          where: contains("log.dst", ":")

      - rename:
          from:
            - log.dst
          to: target.ip

      - grok:
          source: log.natSrc
          patterns:
            - fieldName: log.natSourceIp
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: log.natSourcePort
              pattern: '{{.integer}}'
          where: contains("log.natSrc", ":")

      - delete:
          fields:
            - log.natSrc
          where: contains("log.natSrc", ":")

      - grok:
          source: log.natDst
          patterns:
            - fieldName: log.natTargetIp
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: log.natTargetPort
              pattern: '{{.integer}}'
          where: contains("log.natDst", ":")

      - delete:
          fields:
            - log.natDst
          where: contains("log.natDst", ":")

      # -------------------------------------------------------------------
      # Split protocol => transport / service
      # -------------------------------------------------------------------
      - grok:
          source: log.proto
          patterns:
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: ""
              pattern: '/'
            - fieldName: log.appProto
              pattern: '{{.notSpace}}'
          where: contains("log.proto", "/")

      - delete:
          fields:
            - log.proto
          where: contains("log.proto", "/")

      - rename:
          from:
            - log.proto
          to: protocol

      # -------------------------------------------------------------------
      # Canonical + human-readable renames
      # -------------------------------------------------------------------
      - rename:
          from:
            - log.dstname
          to: target.host
      - rename:
          from:
            - log.srcMac
          to: origin.mac
      - rename:
          from:
            - log.dstMac
          to: target.mac
      - rename:
          from:
            - log.smac
          to: origin.mac
      - rename:
          from:
            - log.dmac
          to: target.mac
      - rename:
          from:
            - log.sent
          to: origin.bytesSent
      - rename:
          from:
            - log.rcvd
          to: origin.bytesReceived
      - rename:
          from:
            - log.spkt
          to: origin.packagesSent
      - rename:
          from:
            - log.rpkt
          to: origin.packagesReceived
      - rename:
          from:
            - log.id
          to: log.sourceId
      - rename:
          from:
            - log.sn
          to: log.deviceSerial
      - rename:
          from:
            - log.fw
          to: log.deviceIp
      - rename:
          from:
            - log.pri
          to: log.priority
      - rename:
          from:
            - log.c
          to: log.messageClass
      - rename:
          from:
            - log.gcat
          to: log.groupCategoryId
      - rename:
          from:
            - log.m
          to: log.eventCode
      - rename:
          from:
            - log.n
          to: log.eventSerial
      - rename:
          from:
            - log.app
          to: log.appId
      - rename:
          from:
            - log.srcZone
          to: log.sourceZone
      - rename:
          from:
            - log.dstZone
          to: log.targetZone
      - rename:
          from:
            - log.code
          to: log.contentCode
      - rename:
          from:
            - log.arg
          to: log.webPath
      - rename:
          from:
            - log.dpi
          to: log.dpiEnabled
      - rename:
          from:
            - log.ipscat
          to: log.ipsCategory
      - rename:
          from:
            - log.ipspri
          to: log.ipsPriority
      - rename:
          from:
            - log.spycat
          to: log.spywareCategory
      - rename:
          from:
            - log.spypri
          to: log.spywarePriority
      - rename:
          from:
            - log.af_service
          to: log.appFirewallService
      - rename:
          from:
            - log.af_type
          to: log.appFirewallType
      - rename:
          from:
            - log.result
          to: log.threatResult
      - rename:
          from:
            - log.cs6
          to: log.threatContext

      # -------------------------------------------------------------------
      # Strip residual quotes / apostrophes from rescued values.
      # -------------------------------------------------------------------
      - trim:
          function: prefix
          substring: '"'
          fields:
            - log.message
            - log.note
            - log.contentCategory
            - log.rule
            - log.sessionType
            - log.vpnPolicy
            - log.eventUuid
            - log.deviceTimeRaw
            - log.actionRaw
            - log.userRaw
      - trim:
          function: suffix
          substring: '"'
          fields:
            - log.message
            - log.note
            - log.contentCategory
            - log.rule
            - log.sessionType
            - log.vpnPolicy
            - log.eventUuid
            - log.deviceTimeRaw
            - log.actionRaw
            - log.userRaw
      - trim:
          function: prefix
          substring: "'"
          fields:
            - log.appName
      - trim:
          function: suffix
          substring: "'"
          fields:
            - log.appName

      - rename:
          from:
            - log.actionRaw
          to: action
      - rename:
          from:
            - log.userRaw
          to: origin.user

      - rename:
          from:
            - log.fwaction
          to: action

      # -------------------------------------------------------------------
      # Type casts
      # -------------------------------------------------------------------
      - cast:
          fields:
            - origin.port
            - target.port
            - log.natSourcePort
            - log.natTargetPort
          to: int
      - cast:
          fields:
            - origin.bytesSent
            - origin.bytesReceived
          to: float
      - cast:
          fields:
            - origin.packagesSent
            - origin.packagesReceived
          to: int
      - cast:
          fields:
            - log.groupCategoryId
            - log.eventCode
            - log.priority
          to: string

      # -------------------------------------------------------------------
      # actionResult (canonical vocabulary)
      # -------------------------------------------------------------------
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("action", "forward")
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: oneOf("action", ["drop", "dropped", "deny", "denied", "block", "blocked"])

      # -------------------------------------------------------------------
      # Group category human label from log.groupCategoryId (1..17)
      # -------------------------------------------------------------------
      - add:
          function: string
          params:
            key: log.groupCategory
            value: System
          where: equals("log.groupCategoryId", "1")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Log
          where: equals("log.groupCategoryId", "2")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Security Services
          where: equals("log.groupCategoryId", "3")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Users
          where: equals("log.groupCategoryId", "4")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Firewall Settings
          where: equals("log.groupCategoryId", "5")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Network
          where: equals("log.groupCategoryId", "6")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: VPN
          where: equals("log.groupCategoryId", "7")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: High Availability
          where: equals("log.groupCategoryId", "8")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: 3G/4G, Modem, and Module
          where: equals("log.groupCategoryId", "9")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Firewall
          where: equals("log.groupCategoryId", "10")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Wireless
          where: equals("log.groupCategoryId", "11")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: VoIP
          where: equals("log.groupCategoryId", "12")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: SSL VPN
          where: equals("log.groupCategoryId", "13")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Anti-Spam
          where: equals("log.groupCategoryId", "14")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: WAN Acceleration
          where: equals("log.groupCategoryId", "15")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: SD-WAN
          where: equals("log.groupCategoryId", "16")
      - add:
          function: string
          params:
            key: log.groupCategory
            value: Multi-Tenancy
          where: equals("log.groupCategoryId", "17")

      # -------------------------------------------------------------------
      # Severity from syslog priority (SonicWall log.priority = 0..7)
      # -------------------------------------------------------------------
      - add:
          function: string
          params:
            key: severity
            value: critical
          where: oneOf("log.priority", ["0", "1", "2"])
      - add:
          function: string
          params:
            key: severity
            value: error
          where: equals("log.priority", "3")
      - add:
          function: string
          params:
            key: severity
            value: warning
          where: equals("log.priority", "4")
      - add:
          function: string
          params:
            key: severity
            value: info
          where: oneOf("log.priority", ["5", "6"])
      - add:
          function: string
          params:
            key: severity
            value: debug
          where: equals("log.priority", "7")

      # -------------------------------------------------------------------
      # Geolocation
      # -------------------------------------------------------------------
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # -------------------------------------------------------------------
      # 13. Cleanup
      # -------------------------------------------------------------------
      - delete:
          fields:
            - log.syslogPri
            - log.cefVersion
            - log.fwaction
            - log.grokTrash