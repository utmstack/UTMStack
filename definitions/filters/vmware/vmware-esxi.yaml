# VMWare-ESXi, version 3.2.0
# 
# Based on docs and real logs provided
# Support VMWare-ESXi log
#
# Documentations
# 1- https://core.vmware.com/esxi-log-message-formats
#
# Implementation
# 1. Parsing headers of syslog the message 
# 2. Parsing the RAW field containing the VMWare-ESXi
pipeline:
  - dataTypes: [vmware-esxi]
    order: 33  # global pipeline order -- unique across all filters, customer-adjustable
    steps:
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}(\:)'
            - fieldName: severity
              pattern: '{{.word}}'
            - fieldName: log.processName
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]'
            - fieldName: log.eventInfo
              pattern: '\[{{.data}}\]'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}T{{.time}}Z'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: log.originIdComponent
              pattern: '\[{{.data}}\]'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.moduleIdentifier
              pattern: '\[{{.data}}\@'
            - fieldName: log.irrelevant
              pattern: '{{.data}}\='
            - fieldName: log.subModuleIdentifier
              pattern: '{{.word}}\]'
          source: log.originIdComponent

      - grok:
          patterns:
            - fieldName: log.irrelevant2
              pattern: '{{.data}}level{{.space}}='
            - fieldName: log.level
              pattern: '{{.integer}}'
          source: log.message
              
      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.priority
      - trim:
          function: prefix
          substring: '['
          fields:
            - log.pid
            - log.eventInfo
            - log.moduleIdentifier
      - trim:
          function: prefix
          substring: '-'
          fields:
            - log.message
      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.priority
      - trim:
          function: suffix
          substring: ':'
          fields:
            - log.pid
            - log.process
      - trim:
          function: suffix
          substring: ']'
          fields:
            - log.pid
            - log.eventInfo
            - log.subModuleIdentifier
      - trim:
          function: suffix
          substring: '-'
          fields:
            - log.message
      - trim:
          function: suffix
          substring: '@'
          fields:
            - log.moduleIdentifier
                    
      # ESXi records a completed vSphere session as
      # "Event <n> : User <user>@<address> logged in as <client>". The address is
      # the client that signed in, so it is the origin. A user name can contain @,
      # so the user ends at the last @ before the address.
      - grok:
          patterns:
            - fieldName: log.loginEvent
              pattern: 'Event [0-9]+ : User'
            - fieldName: log.loginUser
              pattern: '\S+@'
            - fieldName: log.loginAddress
              pattern: '[0-9A-Fa-f:.]+'
            - fieldName: log.loginClient
              pattern: 'logged in as .+'
          source: log.message
          where: 'contains("log.message", " logged in as ")'
      - trim:
          function: suffix
          substring: '@'
          fields:
            - log.loginUser
      - rename:
          from:
            - log.loginUser
          to: origin.user
      - rename:
          from:
            - log.loginAddress
          to: origin.ip
          where: '(inCIDR("log.loginAddress", "0.0.0.0/0") || inCIDR("log.loginAddress", "::/0")) && !inCIDR("log.loginAddress", "0.0.0.0/32") && !inCIDR("log.loginAddress", "::/128")'

      # A refused vSphere sign-in is recorded as
      # "Event <n> : Cannot login [user ]<user>@<address>[: <reason>]" (sometimes just
      # "Event <n> : Cannot login"). It is the event for the attempt; the paired
      # "Rejected password for user ..." line is the password check and keeps no result,
      # like "Accepted password" does for a completed session.
      - grok:
          patterns:
            - fieldName: log.failEvent
              pattern: 'Event [0-9]+ : Cannot login( user\s)?'
            - fieldName: log.failUser
              pattern: '\S+@'
            - fieldName: log.failAddress
              pattern: '[0-9A-Fa-f:.]*[0-9A-Fa-f]'
          source: log.message
          where: 'regexMatch("log.message", "^Event [0-9]+ : Cannot login ")'
      - trim:
          function: suffix
          substring: '@'
          fields:
            - log.failUser
      - rename:
          from:
            - log.failUser
          to: origin.user
      - rename:
          from:
            - log.failAddress
          to: origin.ip
          where: '(inCIDR("log.failAddress", "0.0.0.0/0") || inCIDR("log.failAddress", "::/0")) && !inCIDR("log.failAddress", "0.0.0.0/32") && !inCIDR("log.failAddress", "::/128")'

      # SSH sign-ins, one sshd line per attempt:
      # "Accepted <method> for <user> from <address> port <n> ..." for a completed sign-in and
      # "error: PAM: Authentication failure for [illegal user ]<user> from <address>" for a
      # refused password (ESXi signs in through keyboard-interactive/PAM). The other lines of
      # the same attempt (pam_unix, "SSH session was opened", "SSH login has failed") keep no
      # result and no address, so each attempt is counted once.
      - grok:
          patterns:
            - fieldName: log.authResult
              pattern: 'Accepted'
            - fieldName: log.authMethod
              pattern: '\S+'
            - fieldName: log.irrelevant
              pattern: 'for'
            - fieldName: log.sshUser
              pattern: '\S+'
            - fieldName: log.irrelevant
              pattern: 'from'
            - fieldName: log.sshAddress
              pattern: '[0-9A-Fa-f:.]*[0-9A-Fa-f]'
            - fieldName: log.irrelevant
              pattern: 'port'
          source: log.message
          where: 'equals("log.process", "sshd") && regexMatch("log.message", "^Accepted \\S+ for \\S+ from \\S+ port [0-9]+")'
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'error: PAM: Authentication failure for( illegal user\s)?'
            - fieldName: log.sshUser
              pattern: '\S+'
            - fieldName: log.irrelevant
              pattern: 'from'
            - fieldName: log.sshAddress
              pattern: '\S+'
          source: log.message
          where: 'equals("log.process", "sshd") && regexMatch("log.message", "^error: PAM: Authentication failure for \\S+( \\S+ \\S+)? from \\S+$")'
      - rename:
          from:
            - log.sshUser
          to: origin.user
      - rename:
          from:
            - log.sshAddress
          to: origin.ip
          where: '(inCIDR("log.sshAddress", "0.0.0.0/0") || inCIDR("log.sshAddress", "::/0")) && !inCIDR("log.sshAddress", "0.0.0.0/32") && !inCIDR("log.sshAddress", "::/128")'

      # Adding action result: only success, failed or denied, or nothing when the record
      # states no final outcome. The first value wins (each later step checks
      # !exists("actionResult")), so failed and denied run before the success steps.
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("log.message") && contains("log.message", "authentication failed")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("log.message") && contains("log.message", "authentication of user") && contains("log.message", "failed") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("log.message") && (regexMatch("log.message", "^Event [0-9]+ : Cannot login( |$)") && !regexMatch("log.message", ": no permission$")) && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'equals("log.process", "sshd") && exists("log.message") && startsWith("log.message", "error: PAM: Authentication failure for ") && !exists("actionResult")'
      # The account signed in but holds no permission on the host: a permission refusal.
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("log.message") && regexMatch("log.message", "^Event [0-9]+ : Cannot login .*: no permission$") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("log.message") && contains("log.message", "permission denied") && !exists("actionResult")'

      # A completed session is a successful sign-in unless an explicit failure
      # or denial was already recorded. Logouts and password checks set no result.
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'exists("log.loginClient") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'equals("log.authResult", "Accepted") && !exists("actionResult")'

      # Removing unused fields
      - delete:
          fields:
            - log.processName
            - log.irrelevant
            - log.loginEvent
            - log.loginUser
            - log.loginAddress
            - log.loginClient
            - log.failEvent
            - log.failUser
            - log.failAddress
            - log.sshUser
            - log.sshAddress