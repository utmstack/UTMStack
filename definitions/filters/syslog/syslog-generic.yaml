# Generic syslog filter, version 2.0.0
# Allow processing of any syslog log
pipeline:
  - dataType: syslog
    order: 0  # system filters: 0-99 (this repo); custom/user filters: >=100
    steps:
      - grok:
          patterns:
            - fieldName: log.message
              pattern: '(.*)'
          source: raw