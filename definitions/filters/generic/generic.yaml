# Generic filter, version 2.0
# Allow processing of any one line json or syslog logs 
pipeline:
  - dataTypes: [generic]
    order: 14  # global pipeline order -- unique across all filters, customer-adjustable
    steps:
      - grok:
          patterns:
            - fieldName: log.message
              pattern: '(.*)'
          source: raw
      - json:
          source: log.message