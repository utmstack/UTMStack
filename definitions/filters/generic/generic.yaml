# Generic filter, version 2.0
# Allow processing of any one line json or syslog logs 
pipeline:
  - dataType: generic
    order: 0  # system filters: 0-99 (this repo); custom/user filters: >=100
    steps:
      - grok:
          patterns:
            - fieldName: log.message
              pattern: '(.*)'
          source: raw
      - json:
          source: log.message