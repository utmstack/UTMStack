name: "ibm-aix"
description: "IBM AIX activity: sudo commands, remote connections, programs and alerts."
widgets:
  - layout: { x: 0, y: 0, w: 3, h: 3 }
    spec:
      dataset: logs
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: metric
        title: "Total logs"

  - layout: { x: 3, y: 0, w: 3, h: 3 }
    spec:
      dataset: logs
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: origin.command, op: exists }
    config:
      __builder:
        chartType: metric
        title: "Sudo commands"

  - layout: { x: 6, y: 0, w: 3, h: 3 }
    spec:
      dataset: logs
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: origin.ip, op: exists }
    config:
      __builder:
        chartType: metric
        title: "Connections from remote IPs"

  - layout: { x: 9, y: 0, w: 3, h: 3 }
    spec:
      dataset: alerts
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: metric
        title: "Alerts"

  - layout: { x: 0, y: 3, w: 7, h: 6 }
    spec:
      dataset: logs
      chart: time
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: area
        title: "Log volume over time"

  - layout: { x: 7, y: 3, w: 5, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: dataSource
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: bar
        title: "Logs by AIX host"

  - layout: { x: 0, y: 9, w: 3, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: log.eventType
      metric:
        agg: count
      limit: 25
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: log.eventType, op: exists }
    config:
      __builder:
        chartType: table
        title: "Top programs"

  - layout: { x: 3, y: 9, w: 3, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: log.eventType
      metric:
        agg: count
      limit: 5
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: log.eventType, op: exists }
    config:
      __builder:
        chartType: line
        title: "Programs over time (top 5)"

  - layout: { x: 6, y: 9, w: 3, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: origin.command
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: origin.command, op: exists }
    config:
      __builder:
        chartType: table
        title: "Top sudo commands"

  - layout: { x: 9, y: 9, w: 3, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: origin.ip
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: origin.ip, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Top source IPs"

  - layout: { x: 0, y: 15, w: 6, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: origin.geolocation.country
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: origin.geolocation.country, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Source countries"

  - layout: { x: 6, y: 15, w: 6, h: 6 }
    spec:
      dataset: logs
      chart: category
      dimension: log.priority
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
        - { field: log.priority, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Logs by syslog priority code"

  - layout: { x: 0, y: 21, w: 6, h: 6 }
    spec:
      dataset: alerts
      chart: category
      dimension: name
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: bar
        title: "Alerts by rule"

  - layout: { x: 6, y: 21, w: 6, h: 6 }
    spec:
      dataset: alerts
      chart: category
      dimension: severity
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: bar
        title: "Alerts by severity"

  - layout: { x: 0, y: 27, w: 12, h: 8 }
    spec:
      dataset: logs
      chart: table
      metric:
        agg: count
      limit: 20
      columns: ["@timestamp", "dataSource", "log.eventType", "origin.user", "origin.ip", "origin.command", "log.message"]
      filters:
        - { field: dataType, op: eq, value: ibm-aix }
    config:
      __builder:
        chartType: table
        title: "Latest logs"
