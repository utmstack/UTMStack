name: "eset-project"
description: "ESET antivirus activity: threats, actions and alerts."
widgets:
  - layout: { x: 0, y: 0, w: 3, h: 3 }
    spec:
      dataset: logs
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: metric
        title: "Total logs"

  - layout: { x: 3, y: 0, w: 3, h: 3 }
    spec:
      dataset: logs
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.eventType, op: in, value: ["Threat_Event"] }
    config:
      __builder:
        chartType: metric
        title: "Threats detected"

  - layout: { x: 6, y: 0, w: 3, h: 3 }
    spec:
      dataset: logs
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.eventType, op: in, value: ["Threat_Event"] }
    config:
      __builder:
        chartType: metric
        title: "Threats not handled"

  - layout: { x: 9, y: 0, w: 3, h: 3 }
    spec:
      dataset: alerts
      chart: metric
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: metric
        title: "Alerts"

  - layout: { x: 0, y: 3, w: 7, h: 7 }
    spec:
      dataset: logs
      chart: time
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: area
        title: "Log volume over time"

  - layout: { x: 7, y: 3, w: 5, h: 7 }
    spec:
      dataset: logs
      chart: category
      dimension: dataSource
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: bar
        title: "Logs by ESET PROTECT server"

  - layout: { x: 0, y: 10, w: 3, h: 7 }
    spec:
      dataset: logs
      chart: category
      dimension: log.eventType
      metric:
        agg: count
      limit: 25
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.eventType, op: exists }
    config:
      __builder:
        chartType: table
        title: "Top event types"

  - layout: { x: 3, y: 10, w: 3, h: 7 }
    spec:
      dataset: logs
      chart: category
      dimension: log.eventType
      metric:
        agg: count
      limit: 5
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.eventType, op: exists }
    config:
      __builder:
        chartType: line
        title: "Event types over time (top 5)"

  - layout: { x: 6, y: 10, w: 3, h: 7 }
    spec:
      dataset: logs
      chart: category
      dimension: log.ThreatNames
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.ThreatNames, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Top threats"

  - layout: { x: 9, y: 10, w: 3, h: 7 }
    spec:
      dataset: logs
      chart: category
      dimension: target.host
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: target.host, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Top computers"

  - layout: { x: 0, y: 17, w: 4, h: 7 }
    spec:
      dataset: logs
      chart: time
      dimension: log.userDisplayName
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.userDisplayName, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Top users"

  - layout: { x: 4, y: 17, w: 4, h: 7 }
    spec:
      dataset: logs
      chart: time
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: bar
        title: "Actions taken"

  - layout: { x: 8, y: 17, w: 4, h: 7 }
    spec:
      dataset: logs
      chart: category
      dimension: log.process
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
        - { field: log.process, op: exists }
    config:
      __builder:
        chartType: bar
        title: "Top processes"

  - layout: { x: 0, y: 24, w: 6, h: 7 }
    spec:
      dataset: alerts
      chart: category
      dimension: name
      metric:
        agg: count
      limit: 10
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: bar
        title: "Alerts by rule"

  - layout: { x: 6, y: 24, w: 6, h: 7 }
    spec:
      dataset: alerts
      chart: category
      dimension: severity
      metric:
        agg: count
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: bar
        title: "Alerts by severity"

  - layout: { x: 0, y: 31, w: 12, h: 7 }
    spec:
      dataset: logs
      chart: table
      metric:
        agg: count
      limit: 20
      columns: ["@timestamp", "dataSource", "log.eventType", "target.host", "log.ThreatNames", "log.userDisplayName", "log.process"]
      filters:
        - { field: dataType, op: eq, value: antivirus-esmc-eset }
    config:
      __builder:
        chartType: table
        title: "Latest logs"
