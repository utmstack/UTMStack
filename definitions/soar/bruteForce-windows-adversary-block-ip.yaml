# UTMStack system SOAR flow
- name: 'Windows: Possible Brute Force Attack'
  description: Detects patterns of repeated and rapid login attempts from the same IP address or source, indicating a potential
    brute force attack. This playbook responds by blacklisting the adversary's IP in the firewall to block further connections.
  conditions:
  - operator: IS
    field: name
    value: 'Windows: Possible Brute Force Attack'
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: netsh advfirewall firewall add rule name="Block-Brute-Force-$(adversary.ip)" dir=in action=block remoteip="$(adversary.ip)" enable=yes
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: netsh advfirewall firewall add rule name="Block-Brute-Force-$(adversary.ip)" dir=in action=block remoteip="$(adversary.ip)" enable=yes
        shell: powershell
        platform: windows
        onSuccess:
          - step_2
        onError:
          - step_2
    step_2:
        kind: executor
        executor: shell
        command: net user $(adversary.user) /active:no
        shell: powershell
        platform: windows
