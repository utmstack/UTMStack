# UTMStack system SOAR flow
- name: 'Windows: PowerShell Keylogging Script'
  description: Detects the use of Win32 API Functions that can be used to capture user keystrokes in PowerShell scripts.  Terminate
    the process using the detected process name.
  conditions:
  - operator: IS
    field: name
    value: 'Windows: PowerShell Keylogging Script'
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: taskkill /F /PID $(log.winlogEventDataProcessId) ; taskkill /F /IM $(log.winlogEventDataProcessName)
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: taskkill /F /IM (Split-Path -Path "$(adversary.process)" -Leaf)
        shell: powershell
        platform: windows
