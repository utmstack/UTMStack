# UTMStack system SOAR flow
- name: 'Windows: Multiple remote access login failures'
  description: Block the IP that is establishing the connection.
  conditions:
  - operator: IS
    field: name
    value: 'Windows: Multiple remote access login failures'
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: New-NetFirewallRule -DisplayName "Blocked_BruteForce_IP" -Direction Inbound -RemoteAddress "$(origin.ip)" -Action Block -Protocol Any -Profile Any -Enabled True
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: netsh advfirewall firewall add rule name="Block-Brute-Force-$(adversary.ip)" dir=in action=block remoteip="$(adversary.ip)" enable=yes
        shell: powershell
        platform: windows
