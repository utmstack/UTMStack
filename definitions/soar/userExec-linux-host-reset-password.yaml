# UTMStack system SOAR flow
#
# Standard response for the 'userExec' liveops template. The relpath
# 'userExec-linux-host-reset-password' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Reset account password'
  description: 'User executed a malicious file. Reset the account password to invalidate any stolen credentials.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'echo ''utmstack-reset-$(date +%s)'' | sudo passwd --stdin $(alert.target.user) || sudo chage -d 0 $(alert.target.user)'
        shell: sh
        platform: ubuntu
