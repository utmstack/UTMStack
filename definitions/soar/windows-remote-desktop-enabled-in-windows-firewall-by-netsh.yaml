# UTMStack system SOAR flow.
#
# The trigger is a placeholder: this flow named a correlation rule the
# product does not ship, so it could never fire. Left inert and honest
# rather than pointed at a near-miss — picking which detection runs these
# commands is a decision, not a rename.
- name: 'Windows: Remote Desktop Enabled in Windows Firewall by Netsh'
  description: Disable inbound Remote Desktop Protocol and remove Firewall rule.
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  commands:
  - Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force;if ("$(lastEvent.log.message)" -match 'name=([^''"\s]+)') { Remove-NetFirewallRule -DisplayName $matches[1] -ErrorAction SilentlyContinue }
  - Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force; if ("$(lastEvent.log.message)" -match 'name=\"(.+?)\"') { Remove-NetFirewallRule -DisplayName $matches[1] -ErrorAction SilentlyContinue }
  shell: powershell
  agentPlatform: windows
