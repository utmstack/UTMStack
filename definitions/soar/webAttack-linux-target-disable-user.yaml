# UTMStack system SOAR flow
- name: Linux - CentOS/RHEL - RHEL-Specific Kernel Exploitation Attempt
  description: Detects attempts to exploit kernel vulnerabilities specific to RHEL-based systems. This playbook automates
    logging out and disabling the user account associated with the exploitation attempt.
  conditions:
  - operator: IS
    field: name
    value: RHEL-Specific Kernel Exploitation Attempt
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: sudo pkill -KILL -u $(target.user) ; sudo usermod --expiredate 1 $(target.user)
        shell: sh
        platform: centos
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: usermod -s /sbin/nologin $(adversary.user)
        shell: sh
        platform: centos
        onSuccess:
          - step_2
        onError:
          - step_2
    step_2:
        kind: executor
        executor: shell
        command: pkill -KILL -u $(target.user)
        shell: sh
        platform: centos
