# UTMStack system SOAR flow
#
# Standard response for the 'accountChange' liveops template. The relpath
# 'accountChange-macos-target-disable-user' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Disable changed user'
  description: 'Suspicious account change. Lock the account that was modified.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'sudo pwpolicy -u $(target.user) -setstatus On'
        shell: sh
        platform: macos
