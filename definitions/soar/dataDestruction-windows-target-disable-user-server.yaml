# UTMStack system SOAR flow
- name: Windows Server - Volume Shadow Copy Deletion
  description: Detects and responds to unauthorized deletion of Volume Shadow Copies by terminating suspicious processes,
    logging out the user, and disabling the user account.
  conditions:
  - operator: IS
    field: name
    value: Volume Shadow Copy Deletion
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: taskkill /F /IM "$(target.process)" ; logoff $(target.user) ; net user "$(target.user)" /active:no
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: taskkill /F /IM (Split-Path -Path "$(adversary.process)" -Leaf)
        shell: powershell
        platform: windows
        onSuccess:
          - step_2
        onError:
          - step_2
    step_2:
        kind: executor
        executor: shell
        command: net user $(adversary.user) /active:no
        shell: powershell
        platform: windows
        onSuccess:
          - step_3
        onError:
          - step_3
    step_3:
        kind: executor
        executor: shell
        command: logoff $(target.user)
        shell: powershell
        platform: windows
