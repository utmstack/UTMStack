# UTMStack system SOAR flow
- name: Windows Server - Failed RDP Brute Force Response
  description: Automates a simple, direct response to RDP brute-force attempts by blocking the attacker's IP.
  conditions:
  - operator: IS
    field: name
    value: RDP Brute Force Attack
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: netsh advfirewall firewall add rule name="Block-RDP-Brute-Force-$(adversary.ip)" dir=in action=block remoteip="$(adversary.ip)" enable=yes
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: netsh advfirewall firewall add rule name="Block-Brute-Force-$(adversary.ip)" dir=in action=block remoteip="$(adversary.ip)" enable=yes
        shell: powershell
        platform: windows
