# UTMStack system SOAR flow
#
# Standard response for the 'ransomware' liveops template. The relpath
# 'ransomware-linux-host-isolate' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Isolate host'
  description: 'Ransomware encrypting files on the host. Bring the network interfaces down to stop the spread while the incident is handled.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'for interface in $(ip link show | grep -E ''^[0-9]+:'' | grep -v '' lo:'' | awk -F: ''{print $2}'' | tr -d '' ''); do ip link set $interface down; done'
        shell: sh
        platform: ubuntu
