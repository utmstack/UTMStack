# UTMStack system SOAR flow.
#
# The trigger is a placeholder: this flow named a correlation rule the
# product does not ship, so it could never fire. Left inert and honest
# rather than pointed at a near-miss — picking which detection runs these
# commands is a decision, not a rename.
- name: Linux  - Process Injection Techniques Detection
  description: Detects and responds to suspicious process injection techniques on Ubuntu 20.04/22.04 LTS. This playbook automates disabling the user account associated with the anomalous process execution.
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  commands:
  - sudo usermod --expiredate 1 $(target.user)
  - usermod -s /sbin/nologin $(adversary.user)
  shell: sh
  agentPlatform: ubuntu
