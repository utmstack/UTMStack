# UTMStack system SOAR flow
#
# Standard response for the 'perimeterDetect' liveops template. The relpath
# 'perimeterDetect-linux-host-block-ip' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Block threat IP'
  description: 'Perimeter intrusion signature hit. Block the offending IP at the host firewall.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'iptables -I INPUT -s $(adversary.ip) -j DROP'
        shell: sh
        platform: ubuntu
