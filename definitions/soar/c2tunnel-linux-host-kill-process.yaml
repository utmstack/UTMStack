# UTMStack system SOAR flow
#
# Standard response for the 'c2tunnel' liveops template. The relpath
# 'c2tunnel-linux-host-kill-process' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Kill tunnel process'
  description: 'Covert tunnel running from the host. Capture the tunnel process as evidence, then kill it.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'ps aux | grep -v grep | grep ''$(target.process)'' | tee /var/log/utmstack-evidence.txt ; pkill -f ''$(target.process)'''
        shell: sh
        platform: ubuntu
