# UTMStack system SOAR flow
#
# Standard response for the 'softwareDeploy' liveops template. The relpath
# 'softwareDeploy-linux-target-disable-user' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Disable compromised user'
  description: 'Software pushed onto the host outside change control. Disable the account that performed it.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'sudo usermod -s /sbin/nologin $(alert.target.user) || sudo usermod -L $(alert.target.user)'
        shell: sh
        platform: ubuntu
