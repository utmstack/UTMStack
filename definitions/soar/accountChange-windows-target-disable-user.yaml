# UTMStack system SOAR flow.
#
# The trigger is a placeholder: this flow named a correlation rule the
# product does not ship, so it could never fire. Left inert and honest
# rather than pointed at a near-miss — picking which detection runs these
# commands is a decision, not a rename.
- name: 'Windows: A user account was added to administration groups'
  description: 'Disable the user account that was added to an administrative group to prevent privilege escalation.

    '
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: net user "$(target.user)" /active:no
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: net user $(adversary.user) /active:no
        shell: powershell
        platform: windows
