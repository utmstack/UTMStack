# UTMStack system SOAR flow
#
# Standard response for the 'persistence' liveops template. The relpath
# 'persistence-windows-host-remove-persistence' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Remove persistence and disable user'
  description: 'Adversary persistence on the host. Capture the scheduled tasks and Run keys as evidence, remove the scheduled task, then disable the account.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'schtasks /query /fo LIST /v | Out-File C:\utmstack-persistence-evidence.txt ; Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Run, HKCU:\Software\Microsoft\Windows\CurrentVersion\Run 2>$null | Add-Content C:\utmstack-persistence-evidence.txt'
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: 'schtasks /delete /tn "$(alert.target.process)" /f 2>$null ; net user $(alert.target.user) /active:no'
        shell: powershell
        platform: windows
