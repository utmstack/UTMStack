# UTMStack system SOAR flow
- name: 'Windows: Disable Windows Firewall Rules via Netsh'
  description: 'Re-enables Windows Firewall rules that were disabled by the detected netsh command.

    '
  conditions:
  - operator: IS
    field: name
    value: 'Windows: Disable Windows Firewall Rules via Netsh'
  commands:
  - netsh advfirewall set allprofiles state on
  - netsh advfirewall firewall set rule name=all new enable=yes
  shell: powershell
  agentPlatform: windows
