# UTMStack system SOAR flow.
#
# The trigger is a placeholder: this flow named a correlation rule the
# product does not ship, so it could never fire. Left inert and honest
# rather than pointed at a near-miss — picking which detection runs these
# commands is a decision, not a rename.
- name: 'Windows: Disable Windows Firewall Rules via Netsh'
  description: 'Re-enables Windows Firewall rules that were disabled by the detected netsh command.

    '
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: netsh advfirewall set allprofiles state on
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: netsh advfirewall firewall set rule name=all new enable=yes
        shell: powershell
        platform: windows
