# UTMStack system SOAR flow
- name: Windows Server - PowerShell Empire Detection
  description: Detects potential PowerShell Empire framework usage based on characteristic command patterns, obfuscation techniques,
    and encoded payloads. This playbook automates actions to kill suspicious processes, delete malicious files, and disable
    compromised user accounts.
  conditions:
  - operator: IS
    field: name
    value: PowerShell Empire Detection
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: taskkill /F /IM "$(alert.target.process)" ; Remove-Item -LiteralPath "$(alert.target.file)" -Force -Recurse ; net user "$(alert.target.user)" /active:no
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: Remove-Item -LiteralPath "$(alert.adversary.path)" -Force -Recurse
        shell: powershell
        platform: windows
        onSuccess:
          - step_2
        onError:
          - step_2
    step_2:
        kind: executor
        executor: shell
        command: net user $(alert.adversary.user) /active:no
        shell: powershell
        platform: windows
