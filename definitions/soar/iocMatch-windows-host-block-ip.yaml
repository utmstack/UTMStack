# UTMStack system SOAR flow
#
# Standard response for the 'iocMatch' liveops template. The relpath
# 'iocMatch-windows-host-block-ip' is the resolver key (frontend common-response.ts matches
# template + platform, linux preferred when the host is unknown).
# The trigger is a placeholder on purpose: a broad condition would
# auto-fire this on every alert, and these are destructive actions.
#
- name: 'Block threat IP'
  description: 'Threat feed indicator matched. Block the bad IP in both directions at the Windows Firewall.'
  conditions:
  - operator: IS
    field: name
    value: TODO-set-the-correlation-rule-that-triggers-this
  roots:
    - step_0
  nodes:
    step_0:
        kind: executor
        executor: shell
        command: 'netsh advfirewall firewall add rule name="BlockIOC-$(adversary.ip)" dir=in action=block remoteip="$(adversary.ip)"'
        shell: powershell
        platform: windows
        onSuccess:
          - step_1
        onError:
          - step_1
    step_1:
        kind: executor
        executor: shell
        command: 'netsh advfirewall firewall add rule name="BlockIOC-$(adversary.ip)-out" dir=out action=block remoteip="$(adversary.ip)"'
        shell: powershell
        platform: windows
