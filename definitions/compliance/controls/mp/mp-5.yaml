# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: mp-5
family: mp
familyName: Media Protection
name: Media Transport
scope: governance
statement: |-
  Protect and control [types of system media] during transport outside of controlled areas using [organization-defined controls];
    Maintain accountability for system media during transport outside of controlled areas;
    Document activities associated with the transport of system media; and
    Restrict the activities associated with the transport of system media to authorized personnel.
source: NIST SP 800-53 Rev 5 (public domain)
