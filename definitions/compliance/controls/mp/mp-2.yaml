# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: mp-2
family: mp
familyName: Media Protection
name: Media Access
scope: governance
statement: Restrict access to [organization-defined types of digital and/or non-digital media] to [organization-defined
  personnel or roles].
source: NIST SP 800-53 Rev 5 (public domain)
