# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: si-5
family: si
familyName: System and Information Integrity
name: Security Alerts, Advisories, and Directives
scope: governance
statement: |-
  Receive system security alerts, advisories, and directives from [external organizations] on an ongoing basis;
  Generate internal security alerts, advisories, and directives as deemed necessary;
  Disseminate security alerts, advisories, and directives to: [[organization-defined value] | [organization-defined value] | [organization-defined value]]; and
  Implement security directives in accordance with established time frames, or notify the issuing organization of the degree of noncompliance.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the configuration or the procedure that implements it.
source: NIST SP 800-53 Rev 5 (public domain)
