# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: si-14
family: si
familyName: System and Information Integrity
name: Non-persistence
scope: governance
statement: |-
  Implement non-persistent [system components and services] that are initiated in a known state and terminated [upon end of session of use | [organization-defined value]].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the configuration or the procedure that implements it.
source: NIST SP 800-53 Rev 5 (public domain)
