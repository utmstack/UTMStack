# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: si-6
family: si
familyName: System and Information Integrity
name: Security and Privacy Function Verification
scope: governance
statement: |-
  Verify the correct operation of [organization-defined security and privacy functions];
  Perform the verification of the functions specified in SI-6a [[organization-defined value] | upon command by user with appropriate privilege | [organization-defined value]];
  Alert [personnel or roles] to failed security and privacy verification tests; and
  [shut the system down | restart the system | [organization-defined value]] when anomalies are discovered.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the configuration or the procedure that implements it.
source: NIST SP 800-53 Rev 5 (public domain)
