# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: si-1
family: si
familyName: System and Information Integrity
name: Policy and Procedures
scope: governance
statement: |-
  Develop, document, and disseminate to [organization-defined personnel or roles]:
  [organization-level | mission/business process-level | system-level] system and information integrity policy that:
  Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
  Is consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and
  Procedures to facilitate the implementation of the system and information integrity policy and the associated system and information integrity controls;
  Designate an [official] to manage the development, documentation, and dissemination of the system and information integrity policy and procedures; and
  Review and update the current system and information integrity:
  Policy [frequency] and following [events]; and
  Procedures [frequency] and following [events].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the approved policy and procedure document, its owner and the date it was last reviewed.
source: NIST SP 800-53 Rev 5 (public domain)
