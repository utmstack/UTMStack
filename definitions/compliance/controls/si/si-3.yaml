    ruleValue: 0
  - key: crowdstrike-policy-disabled
    name: 'CrowdStrike: a Falcon policy was disabled'
    dataType: crowdstrike
    filters:
      - field: log.eventOperationName
        operator: IS
        value: 'disable_policy'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: crowdstrike-prevention-not-applied
    name: 'CrowdStrike: detection would have been blocked but prevention is disabled'
    dataType: crowdstrike
    filters:
      - field: log.metadataEventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'DetectionSummaryEvent'
          - 'EppDetectionSummaryEvent'
      - field: log.eventPatternDispositionFlagsPolicyDisabled
        operator: IS_ONE_OF_TERMS
        value:
          - 'true'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: ftd-malware-not-blocked
    name: 'Cisco FTD: no malware file let through'
    dataType: firewall-cisco-firepower
    filters:
      - field: log.messageId
        operator: IS
        value: '430005'
      - field: log.msg
        operator: CONTAIN
        value: 'SHA_Disposition: Malware'
      - field: log.msg
        operator: CONTAIN
        value: 'FileAction: Malware Cloud Lookup'
    rule: THRESHOLD_MAX
    ruleValue: 0
