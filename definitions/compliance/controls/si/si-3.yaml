    ruleValue: 0
  - key: sentinelone-agent-disabled
    name: 'SentinelOne: agent disabled or functionality limited'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS
        value: '128'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: sentinelone-mitigation-failed
    name: 'SentinelOne: mitigation failed'
    dataType: antivirus-sentinel-one
    filters:
      - field: actionResult
        operator: IS
        value: 'failed'
      - field: log.fileHash
        operator: EXIST
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: sentinelone-quarantine-failed
    name: 'SentinelOne: threat quarantine failed'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS
        value: '2009'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: sentinelone-threat-activity
    name: 'SentinelOne: new threats are reported'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS_ONE_OF_TERMS
        value:
          - '19'
          - '4003'
          - '2001'
          - '2004'
          - '2009'
          - '4008'
          - '71'
          - '90'
          - '92'
          - '3784'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: crowdstrike-detections
    name: 'CrowdStrike: endpoint detections'
    dataType: crowdstrike
    filters:
      - field: log.metadataEventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'DetectionSummaryEvent'
          - 'EppDetectionSummaryEvent'
          - 'XdrDetectionSummaryEvent'
          - 'IncidentSummaryEvent'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: crowdstrike-kill-failed
    name: 'CrowdStrike: prevention kill action failed'
    dataType: crowdstrike
    filters:
      - field: log.metadataEventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'DetectionSummaryEvent'
          - 'EppDetectionSummaryEvent'
      - field: log.eventPatternDispositionFlagsKillActionFailed
        operator: IS_ONE_OF_TERMS
        value:
          - 'true'
