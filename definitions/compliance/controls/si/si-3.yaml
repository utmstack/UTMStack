# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: si-3
family: si
familyName: System and Information Integrity
name: Malicious Code Protection
scope: data
statement: |-
  Implement [signature-based | non-signature-based] malicious code protection mechanisms at system entry and exit points to detect and eradicate malicious code;
  Automatically update malicious code protection mechanisms as new releases are available in accordance with organizational configuration management policy and procedures;
  Configure malicious code protection mechanisms to:
  Perform periodic scans of the system [frequency] and real-time scans of files from external sources at [endpoint | network entry and exit points] as the files are downloaded, opened, or executed in accordance with organizational policy; and
  [block malicious code | quarantine malicious code | take [organization-defined value]]; and send alert to [personnel or roles] in response to malicious code detection; and
  Address the receipt of false positives during malicious code detection and eradication and the resulting potential impact on the availability of the system.
remediation: |-
  Passes when an anti-malware or EDR product shows activity (scans, detections, protection updates or health reports) and no connected product reported protection switched off or malware it failed to remove.
  If it fails on activity: connect the anti-malware console or endpoint agent to UTMStack.
  If it fails on a limit: open the failing check, restore protection on that endpoint or remove the malware, and find out why it happened.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-defender-activity
    name: 'Windows: Microsoft Defender scans, detections, health and updates are recorded'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-Windows Defender'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '1000'
          - '1001'
          - '1002'
          - '1006'
          - '1007'
          - '1116'
          - '1117'
          - '1118'
          - '1119'
          - '1150'
          - '1151'
          - '2000'
          - '2002'
          - '2010'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: win-defender-disabled-by-setting
    name: 'Windows: Microsoft Defender protection was not switched off by a setting or policy'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-Windows Defender'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '5007'
      - field: log.data.New Value
        operator: CONTAIN_ONE_OF
        value:
          - 'DisableRealtimeMonitoring = 0x1'
          - 'DisableAntiSpyware = 0x1'
          - 'DisableAntiVirus = 0x1'
          - 'DisableBehaviorMonitoring = 0x1'
          - 'DisableIOAVProtection = 0x1'
          - 'DisableOnAccessProtection = 0x1'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: win-defender-protection-failed
    name: 'Windows: Microsoft Defender real-time protection and engine did not fail'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-Windows Defender'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '3002'
          - '5008'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: win-defender-remediation-failed
    name: 'Windows: Microsoft Defender removed or quarantined every detected threat'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-Windows Defender'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '1118'
          - '1119'
          - '1008'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: linux-antimalware-activity
    name: 'Linux: anti-malware agent activity is recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'clamd'
          - 'freshclam'
          - 'clamscan'
          - 'clamonacc'
          - 'clamav-milter'
          - 'clamav-freshclam'
          - 'imunify-realtime-av'
          - 'kesl'
          - 'falcon-sensor'
          - 'falcon-sensor-bpf'
          - 'falcond'
          - 'mdatp'
          - 'wdavdaemon'
          - 'ds_agent'
          - 'ds_am'
          - 'ds_agent.init'
          - 'sophos-spl'
          - 'savd'
          - 'sav-protect'
          - 'esets'
          - 'esets_daemon'
          - 'sentinelone'
          - 's1-agent'
          - 'sentinel-agent'
          - 'bdsec'
          - 'cbagentd'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-antimalware-service-failed
    name: 'Linux: anti-malware service did not fail to start'
    dataType: linux
    filters:
      - field: log.unit
        operator: IS_ONE_OF_TERMS
        value:
          - 'clamav-daemon.service'
          - 'clamav-freshclam.service'
          - 'clamd@scan.service'
          - 'clamonacc.service'
          - 'falcon-sensor.service'
          - 'mdatp.service'
          - 'sentinelone.service'
          - 'sophos-spl.service'
          - 'sav-protect.service'
          - 'ds_agent.service'
          - 'kesl.service'
          - 'esets.service'
          - 'imunify-antivirus.service'
          - 'imunify360.service'
          - 'cbagentd.service'
          - 'bdsec.service'
      - field: actionResult
        operator: IS
        value: 'failed'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: linux-antimalware-stopped
    name: 'Linux: anti-malware service not stopped by a command'
    dataType: linux
    filters:
      - field: action
        operator: IS
        value: 'execve'
      - field: origin.command
        operator: CONTAIN_ONE_OF
        value:
          - 'systemctl stop clamav'
          - 'systemctl disable clamav'
          - 'systemctl mask clamav'
          - 'systemctl stop falcon-sensor'
          - 'systemctl disable falcon-sensor'
          - 'systemctl stop mdatp'
          - 'systemctl disable mdatp'
          - 'real-time-protection --value disabled'
          - 'systemctl stop sentinelone'
          - 'sentinelctl control stop'
          - 'systemctl stop sophos-spl'
          - 'systemctl stop sav-protect'
          - 'systemctl stop ds_agent'
          - 'systemctl stop kesl'
          - 'systemctl stop imunify'
          - 'systemctl stop esets'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: linux-clamav-detection
    name: 'Linux: no ClamAV detection left in place'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'clamd'
          - 'clamonacc'
          - 'clamscan'
      - field: log.message
        operator: ENDS_WITH
        value: 'FOUND'
      - field: log.message
        operator: DOES_NOT_CONTAIN_ONE_OF
        value:
          - 'amavis'
          - 'milter'
          - '/var/spool/'
          - 'zimbra/data'
          - '/var/lib/clamav/tmp'
          - 'mailscanner'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: macos-gatekeeper-disabled
    name: 'macOS: Gatekeeper or XProtect not switched off'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS
        value: 'sudo'
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - 'spctl --master-disable'
          - 'spctl --global-disable'
          - 'spctl --disable'
          - 'launchctl unload -w /Library/Apple/System/Library/LaunchDaemons/com.apple.XProtect'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: macos-xprotect-activity
    name: 'macOS: XProtect anti-malware activity is recorded'
    dataType: macos
    filters:
      - field: log.subsystem
        operator: START_WITH
        value: 'com.apple.xprotect'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-xprotect-remediation-failed
    name: 'macOS: XProtect did not fail to remove malware'
    dataType: macos
    filters:
      - field: log.subsystem
        operator: START_WITH
        value: 'com.apple.XProtectFramework'
      - field: log.message
        operator: CONTAIN
        value: 'FailedToRemediate'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: o365-file-malware-detections
    name: 'Microsoft 365: malware detections in SharePoint, OneDrive and Teams files are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'FileMalwareDetected'
          - 'AtpDetection'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-mail-malware-detections
    name: 'Microsoft 365: anti-malware detections in mail are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'TIMailData'
      - field: log.Verdict
        operator: IS
        value: 'Malware'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-malware-left-in-mailbox
    name: 'Microsoft 365: a message with a malware verdict must not remain in a mailbox folder'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'TIMailData'
      - field: log.Verdict
        operator: IS
        value: 'Malware'
      - field: log.LatestDeliveryLocation
        operator: IS_ONE_OF_TERMS
        value:
          - 'Inbox'
          - 'JunkFolder'
          - 'DeletedFolder'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: o365-malware-not-zapped-alert
    name: 'Microsoft 365: malware found after delivery must not be left in place because ZAP is off'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'AlertTriggered'
      - field: log.Name
        operator: CONTAIN
        value: 'Malware not zapped'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: o365-malware-protection-disabled
    name: 'Microsoft 365: anti-malware, Safe Attachments and preset protection rules must not be disabled or removed'
    dataType: o365
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Disable-MalwareFilterRule'
          - 'Remove-MalwareFilterRule'
          - 'Remove-MalwareFilterPolicy'
          - 'Disable-SafeAttachmentRule'
          - 'Remove-SafeAttachmentRule'
          - 'Remove-SafeAttachmentPolicy'
          - 'Disable-ATPProtectionPolicyRule'
          - 'Disable-EOPProtectionPolicyRule'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: o365-safe-attachments-spo-off
    name: 'Microsoft 365: Safe Attachments for SharePoint, OneDrive and Teams must not be switched off'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'Set-AtpPolicyForO365'
      - field: log.Parameters
        operator: CONTAIN
        value: 'Name:EnableATPForSPOTeamsODB Value:False'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: azure-defender-antivirus-events
    name: 'Azure: Defender for Endpoint antivirus scan and detection events are recorded'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS
        value: 'endpoint-event'
      - field: action
        operator: CONTAIN
        value: 'antivirus'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-defender-malware-not-remediated
    name: 'Azure (Defender for Endpoint): detected malware must be remediated'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS
        value: 'endpoint-event'
      - field: action
        operator: IS
        value: 'AntivirusDetection'
      - field: log.properties.AdditionalFields
        operator: CONTAIN
        value: '"WasRemediated":false'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: azure-defender-tampering
    name: 'Azure (Defender for Endpoint): Defender must not be tampered with'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS
        value: 'endpoint-event'
      - field: action
        operator: IS
        value: 'TamperingAttempt'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: aws-guardduty-deleted
    name: 'AWS: GuardDuty detector or malware protection plan was deleted'
    dataType: aws
    filters:
      - field: target.domain
        operator: IS
        value: 'guardduty.amazonaws.com'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'DeleteDetector'
          - 'DeleteMalwareProtectionPlan'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: aws-guardduty-malware-scans
    name: 'AWS: GuardDuty Malware Protection scans S3 objects'
    dataType: aws
    filters:
      - field: log.source
        operator: IS
        value: 'aws.guardduty'
      - field: log.detailtype
        operator: IS
        value: 'GuardDuty Malware Protection Object Scan Result'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-guardduty-suspended
    name: 'AWS: GuardDuty detector was suspended'
    dataType: aws
    filters:
      - field: target.domain
        operator: IS
        value: 'guardduty.amazonaws.com'
      - field: action
        operator: IS
        value: 'UpdateDetector'
      - field: log.requestParameters.enable
        operator: IS
        value: 'false'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: bitdefender-antimalware-module-disabled
    name: 'Bitdefender: antimalware module disabled on an endpoint'
    dataType: antivirus-bitdefender-gz
    filters:
      - field: log.BitdefenderGZModule
        operator: IS
        value: 'modules'
      - field: log.BitdefenderGZMalwareModuleStatus
        operator: IS
        value: 'disabled'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: bitdefender-malware-still-present
    name: 'Bitdefender: malware detected but still present'
    dataType: antivirus-bitdefender-gz
    filters:
      - field: log.BitdefenderGZModule
        operator: IS_ONE_OF_TERMS
        value:
          - 'av'
          - 'avc'
      - field: actionResult
        operator: IS
        value: 'failed'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: bitdefender-protection-activity
    name: 'Bitdefender GravityZone: anti-malware, EDR and protection-status events are recorded'
    dataType: antivirus-bitdefender-gz
    filters:
      - field: log.BitdefenderGZModule
        operator: IS_ONE_OF_TERMS
        value:
          - 'av'
          - 'avc'
          - 'hd'
          - 'antiexploit'
          - 'ransomware-mitigation'
          - 'network-sandboxing'
          - 'new-incident'
          - 'exchange-malware'
          - 'network-monitor'
          - 'aph'
          - 'modules'
          - 'sva'
          - 'supa-update-status'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: bitdefender-update-server-outdated
    name: 'Bitdefender: update server outdated'
    dataType: antivirus-bitdefender-gz
    filters:
      - field: log.BitdefenderGZModule
        operator: IS
        value: 'supa-update-status'
      - field: log.BitdefenderGZStatus
        operator: IS
        value: 'outdated'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: eset-cleaning-failed
    name: 'ESET: threat cleaning or quarantine failed'
    dataType: antivirus-esmc-eset
    filters:
      - field: log.eventType
        operator: IS
        value: 'Threat_Event'
      - field: actionResult
        operator: IS
        value: 'failed'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: eset-detections
    name: 'ESET PROTECT: anti-malware, HIPS and ESET Inspect detections are recorded'
    dataType: antivirus-esmc-eset
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'Threat_Event'
          - 'HipsAggregated_Event'
          - 'HIPSAggregated_Event'
          - 'BlockedFiles_Event'
          - 'EnterpriseInspectorAlert_Event'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: eset-threat-not-handled
    name: 'ESET: threat not handled'
    dataType: antivirus-esmc-eset
    filters:
      - field: log.eventType
        operator: IS
        value: 'Threat_Event'
      - field: log.threat_handled
        operator: IS_ONE_OF_TERMS
        value:
          - 'false'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: kaspersky-active-threats-status
    name: 'Kaspersky: device status reports active (unprocessed) threats'
    dataType: antivirus-kaspersky
    filters:
      - field: log.eventType
        operator: IS
        value: 'KLSRV_HOST_STATUS_CRITICAL'
      - field: log.ksc.p1
        operator: CONTAIN
        value: 'Active threats'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: kaspersky-databases-outdated
    name: 'Kaspersky: anti-virus databases outdated'
    dataType: antivirus-kaspersky
    filters:
      - field: log.eventType
        operator: IS
        value: 'KLSRV_HOST_STATUS_CRITICAL'
      - field: log.ksc.p1
        operator: CONTAIN
        value: 'Databases are outdated'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: kaspersky-object-not-disinfected
    name: 'Kaspersky: malicious object not disinfected or let through'
    dataType: antivirus-kaspersky
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'GNRL_EV_OBJECT_NOTCURED'
          - 'GNRL_EV_VIRUS_FOUND_AND_PASSED'
    rule: THRESHOLD_MAX
    ruleValue: 0
  - key: kaspersky-protection-events-cef
    name: 'Kaspersky Security Center: detections, clean-ups and device protection status are recorded (CEF format)'
    dataType: antivirus-kaspersky
    filters:
      - field: log.signatureID
        operator: IS_ONE_OF_TERMS
        value:
          - 'GNRL_EV_VIRUS_FOUND'
          - 'GNRL_EV_SUSPICIOUS_OBJECT_FOUND'
          - 'GNRL_EV_OBJECT_CURED'
          - 'GNRL_EV_OBJECT_DELETED'
          - 'GNRL_EV_OBJECT_QUARANTINED'
          - 'GNRL_EV_OBJECT_NOTCURED'
          - 'GNRL_EV_OBJECT_BLOCKED'
          - 'GNRL_EV_VIRUS_FOUND_AND_BLOCKED'
          - 'GNRL_EV_ATTACK_DETECTED'
          - 'GNRL_EV_APPLICATION_LAUNCH_DENIED'
          - 'GNRL_EV_APPLICATION_LAUNCH_DENIE'
          - 'KLSRV_HOST_STATUS_CRITICAL'
          - 'KLSRV_HOST_STATUS_WARNING'
          - 'KLSRV_HOST_OUT_CONTROL'
          - 'KLSRV_UPD_BASES_UPDATED'
          - 'GNRL_EV_VIRUS_FOUND_AND_PASSED'
          - 'GNRL_EV_VIRUS_FOUND_AND_REPORTED'
          - 'GNRL_EV_VIRUS_FOUND_BY_KSN'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: kaspersky-protection-events-syslog
    name: 'Kaspersky Security Center: detections, clean-ups and device protection status are recorded (KSC syslog format)'
    dataType: antivirus-kaspersky
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'GNRL_EV_VIRUS_FOUND'
          - 'GNRL_EV_SUSPICIOUS_OBJECT_FOUND'
          - 'GNRL_EV_OBJECT_CURED'
          - 'GNRL_EV_OBJECT_DELETED'
          - 'GNRL_EV_OBJECT_QUARANTINED'
          - 'GNRL_EV_OBJECT_NOTCURED'
          - 'GNRL_EV_OBJECT_BLOCKED'
          - 'GNRL_EV_VIRUS_FOUND_AND_BLOCKED'
          - 'GNRL_EV_ATTACK_DETECTED'
          - 'GNRL_EV_APPLICATION_LAUNCH_DENIED'
          - 'GNRL_EV_APPLICATION_LAUNCH_DENIE'
          - 'KLSRV_HOST_STATUS_CRITICAL'
          - 'KLSRV_HOST_STATUS_WARNING'
          - 'KLSRV_HOST_OUT_CONTROL'
          - 'KLSRV_UPD_BASES_UPDATED'
          - 'GNRL_EV_VIRUS_FOUND_AND_PASSED'
          - 'GNRL_EV_VIRUS_FOUND_AND_REPORTED'
          - 'GNRL_EV_VIRUS_FOUND_BY_KSN'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: kaspersky-protection-not-running
    name: 'Kaspersky: protection disabled or security application not running'
    dataType: antivirus-kaspersky
    filters:
      - field: log.eventType
        operator: IS
        value: 'KLSRV_HOST_STATUS_CRITICAL'
      - field: log.ksc.p1
        operator: CONTAIN_ONE_OF
        value:
          - 'Protection is disabled'
          - 'Security application is not running'
          - 'Security application is not installed'
