  - key: ftd-intrusion-malware-events
    name: 'Cisco FTD: intrusion and malware events are recorded'
    dataType: firewall-cisco-firepower
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '430001'
          - '430005'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-ips-av-detections
    name: 'FortiGate: IPS, anomaly and antivirus detections are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.type
        operator: IS
        value: 'utm'
      - field: log.subtype
        operator: IS_ONE_OF_TERMS
        value:
          - 'ips'
          - 'anomaly'
          - 'virus'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-security-signature-updates
    name: 'FortiGate: IPS and antivirus signature updates are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.logid
        operator: IS_ONE_OF_TERMS
        value:
          - '0100041000'
          - '0100022813'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fortiweb-attack-detections
    name: 'FortiWeb: web application attacks are recorded'
    dataType: firewall-fortiweb
    filters:
      - field: log.type
        operator: IS
        value: 'attack'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: meraki-ids-alerts
    name: 'Meraki: IDS/IPS alerts are recorded'
    dataType: firewall-meraki
    filters:
      - field: log.alertType
        operator: IS
        value: 'ids_alerted'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-signature-updates
    name: 'Palo Alto: antivirus, content and WildFire updates are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS
        value: 'SYSTEM'
      - field: log.opaque
        operator: CONTAIN
        value: 'update job succeeded'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-threat-detections
    name: 'Palo Alto: threat prevention detections are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS
        value: 'THREAT'
      - field: log.paSubtype
        operator: IS_ONE_OF_TERMS
        value:
          - 'virus'
          - 'spyware'
          - 'vulnerability'
          - 'wildfire-virus'
          - 'ml-virus'
          - 'flood'
          - 'scan'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: pfsense-snort-suricata-alerts
    name: 'pfSense: Snort or Suricata package alerts are recorded'
    dataType: firewall-pfsense
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'snort'
          - 'suricata'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-ips-gav-spyware
    name: 'SonicWall: IPS, gateway antivirus, anti-spyware and botnet detections are recorded'
    dataType: firewall-sonicwall
