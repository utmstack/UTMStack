  - key: sophos-central-intrusion-prevention
    name: 'Sophos Central: intrusion prevention or advanced threat protection events'
    dataType: sophos-central
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Event::Endpoint::Threat::IpsInboundDetection'
          - 'Event::Firewall::FirewallAdvancedThreatProtection'
          - 'Event::Firewall::FirewallAdvancedThreatProtectionDetailed'
    rule: MIN_HITS_REQUIRED
