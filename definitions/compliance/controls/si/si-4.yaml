# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: si-4
family: si
familyName: System and Information Integrity
name: System Monitoring
scope: data
statement: |-
  Monitor the system to detect:
  Attacks and indicators of potential attacks in accordance with the following monitoring objectives: [monitoring objectives]; and
  Unauthorized local, network, and remote connections;
  Identify unauthorized use of the system through the following techniques and methods: [techniques and methods];
  Invoke internal monitoring capabilities or deploy monitoring devices:
  Strategically within the system to collect organization-determined essential information; and
  At ad hoc locations within the system to track specific types of transactions of interest to the organization;
  Analyze detected events and anomalies;
  Adjust the level of system monitoring activity when there is a change in risk to organizational operations and assets, individuals, other organizations, or the Nation;
  Obtain legal opinion regarding system monitoring activities; and
  Provide [system monitoring information] to [personnel or roles] [as needed | [organization-defined value]].
remediation: |-
  Passes when UTMStack is monitoring: logs arrive, detections are raised, or a network intrusion detection or prevention system reports.
  If it fails: connect the data sources and confirm the correlation rules are active.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: logs-collected
    name: 'Logs from at least one source reached UTMStack'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: alerts-raised
    name: 'Security alerts were raised and tracked'
    dataset: alerts
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-host-ips-bans
    name: 'Linux: host intrusion prevention bans are recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'fail2ban'
          - 'fail2ban.actions'
          - 'fail2ban-server'
          - 'sshguard'
          - 'crowdsec'
          - 'psad'
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - 'Ban '
          - 'Blocking '
          - 'blocked'
          - 'banned'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-firewall-idps-signatures
    name: 'Azure Firewall: intrusion detection and prevention signature hits are recorded'
    dataType: azure
    filters:
      - field: log.category
        operator: IS
        value: 'AZFWIdpsSignature'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-waf-rule-matches
    name: 'Azure: web application firewall rule matches are recorded'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS_ONE_OF_TERMS
        value:
          - 'waf'
          - 'frontdoor-waf'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-guardduty-findings
    name: 'AWS: GuardDuty threat findings are received'
    dataType: aws
    filters:
      - field: log.awsRecordType
        operator: IS
        value: 'guardduty'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-network-firewall-alerts
    name: 'AWS: Network Firewall intrusion alerts are recorded'
    dataType: aws
    filters:
      - field: log.event.event_type
        operator: IS
        value: 'alert'
      - field: log.event.alert.signature_id
        operator: EXIST
      - field: log.event.aws_category
        operator: DOES_NOT_EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-cloud-armor-denies
    name: 'Google: Cloud Armor blocks requests'
    dataType: google
    filters:
      - field: log.jsonPayloadStatusDetails
        operator: IS
        value: 'denied_by_security_policy'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-threat-logs
    name: 'Google: Cloud IDS or Cloud NGFW threat detections are recorded'
    dataType: google
    filters:
      - field: log.logName
        operator: CONTAIN_ONE_OF
        value:
          - 'ids.googleapis.com%2Fthreat'
          - 'networksecurity.googleapis.com%2Ffirewall_threat'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: bitdefender-network-attack-defense
    name: 'Bitdefender: Network Attack Defense detections'
    dataType: antivirus-bitdefender-gz
    filters:
      - field: log.BitdefenderGZModule
        operator: IS
        value: 'network-monitor'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: eset-network-attack-protection
    name: 'ESET: network attack protection detections'
    dataType: antivirus-esmc-eset
    filters:
      - field: log.eventType
        operator: IS
        value: 'FirewallAggregated_Event'
      - field: log.event
        operator: CONTAIN_ONE_OF
        value:
          - 'attack'
          - 'exploitation'
          - 'botnet'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: kaspersky-network-attack
    name: 'Kaspersky: network attack detected'
    dataType: antivirus-kaspersky
    filters:
      - field: log.eventType
        operator: IS
        value: 'GNRL_EV_ATTACK_DETECTED'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: asa-threat-detection-ips
    name: 'Cisco ASA: IP audit signatures, threat detection and botnet filter events are recorded'
