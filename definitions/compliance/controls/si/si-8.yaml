# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: si-8
family: si
familyName: System and Information Integrity
name: Spam Protection
scope: data
statement: |-
  Employ spam protection mechanisms at system entry and exit points to detect and act on unsolicited messages; and
  Update spam protection mechanisms when new releases are available in accordance with organizational configuration management policy and procedures.
remediation: |-
  Passes when the email service shows its threat protection at work (spam, phishing or malware filtering events).
  If it fails: connect the email security logs (Microsoft 365 Defender / Exchange Online Protection) to UTMStack.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: linux-mail-filtering
    name: 'Linux: mail gateway spam and malware filtering is recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'amavis'
          - 'amavisd'
          - 'amavisd-new'
          - 'spamd'
          - 'rspamd'
          - 'postfix/postscreen'
          - 'spamass-milter'
          - 'clamav-milter'
          - 'mimedefang'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-mail-threat-protection
    name: 'Microsoft 365: email threat detections, submissions and quarantine actions are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'TIMailData'
          - 'TIUrlClickData'
          - 'AtpDetection'
          - 'UserSubmission'
          - 'AdminSubmission'
          - 'UserSubmissionTriage'
          - 'AdminSubmissionTriage'
          - 'QuarantineReleaseMessage'
          - 'QuarantinePreviewMessage'
          - 'QuarantineDeleteMessage'
          - 'QuarantineExportMessage'
          - 'QuarantineRequestReleaseMessage'
          - 'QuarantineViewMessageHeader'
          - 'Release-QuarantineMessage'
          - 'Preview-QuarantineMessageV1'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-defender-email-threats
    name: 'Azure (Defender XDR stream): blocked or junked threat mail is recorded'
    dataType: azure
    filters:
      - field: log.category
        operator: IS
        value: 'AdvancedHunting-EmailEvents'
      - field: log.properties.DeliveryAction
        operator: IS_ONE_OF_TERMS
        value:
          - 'Blocked'
          - 'Junked'
          - 'Replaced'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-emailfilter-events
    name: 'FortiGate: email filter (antispam) events are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.type
        operator: IS
        value: 'utm'
      - field: log.subtype
        operator: IS
        value: 'emailfilter'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-antispam-events
    name: 'SonicWall: anti-spam events are recorded'
    dataType: firewall-sonicwall
    filters:
      - field: log.groupCategoryId
        operator: IS
        value: '14'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-xg-antispam
    name: 'Sophos Firewall: email protection events are recorded'
    dataType: firewall-sophos-xg
    filters:
      - field: log.type
        operator: IS
        value: 'Anti-Spam'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-graph-email-threats
    name: 'Microsoft Graph (Defender hunting): blocked or junked threat mail is recorded'
    dataType: o365-graph
    filters:
      - field: log.DeliveryAction
        operator: IS_ONE_OF_TERMS
        value:
          - 'Blocked'
          - 'Junked'
          - 'Replaced'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
