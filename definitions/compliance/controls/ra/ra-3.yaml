# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ra-3
family: ra
familyName: Risk Assessment
name: Risk Assessment
scope: governance
statement: |-
  Conduct a risk assessment, including:
  Identifying threats to and vulnerabilities in the system;
  Determining the likelihood and magnitude of harm from unauthorized access, use, disclosure, disruption, modification, or destruction of the system, the information it processes, stores, or transmits, and any related information; and
  Determining the likelihood and impact of adverse effects on individuals arising from the processing of personally identifiable information;
  Integrate risk assessment results and risk management decisions from the organization and mission or business process perspectives with system-level risk assessments;
  Document risk assessment results in [security and privacy plans | risk assessment report | [organization-defined value]];
  Review risk assessment results [frequency];
  Disseminate risk assessment results to [personnel or roles]; and
  Update the risk assessment [frequency] or when there are significant changes to the system, its environment of operation, or other conditions that may impact the security or privacy state of the system.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the risk assessment, vulnerability scan reports and remediation tracking.
source: NIST SP 800-53 Rev 5 (public domain)
