id: cm-6
family: cm
familyName: Configuration Management
name: Configuration Settings
scope: data
statement: |-
  Establish and document configuration settings for components employed within the system that reflect the most restrictive mode consistent with operational requirements using [common secure configurations];
    Implement the configuration settings;
    Identify, document, and approve any deviations from established configuration settings for [system components] based on [operational requirements] ; and
    Monitor and control changes to the configuration settings in accordance with organizational policies and procedures.
source: NIST SP 800-53 Rev 5 (public domain)
