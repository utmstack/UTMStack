# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: cm-2
family: cm
familyName: Configuration Management
name: Baseline Configuration
scope: governance
statement: |-
  Develop, document, and maintain under configuration control, a current baseline configuration of the system; and
  Review and update the baseline configuration of the system:
  [frequency];
  When required due to [circumstances]; and
  When system components are installed or upgraded.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the documented baseline, the change records or the inventory export.
source: NIST SP 800-53 Rev 5 (public domain)
