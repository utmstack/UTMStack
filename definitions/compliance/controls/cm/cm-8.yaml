# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: cm-8
family: cm
familyName: Configuration Management
name: System Component Inventory
scope: governance
statement: |-
  Develop and document an inventory of system components that:
  Accurately reflects the system;
  Includes all components within the system;
  Does not include duplicate accounting of components or components assigned to any other system;
  Is at the level of granularity deemed necessary for tracking and reporting; and
  Includes the following information to achieve system component accountability: [information]; and
  Review and update the system component inventory [frequency].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the documented baseline, the change records or the inventory export.
source: NIST SP 800-53 Rev 5 (public domain)
