# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: sa-11
family: sa
familyName: System and Services Acquisition
name: Developer Testing and Evaluation
scope: governance
statement: |-
  Require the developer of the system, system component, or system service, at all post-design stages of the system development life cycle, to:
    Develop and implement a plan for ongoing security and privacy control assessments;
    Perform [unit | integration | system | regression] testing/evaluation [frequency to conduct] at [depth and coverage];
    Produce evidence of the execution of the assessment plan and the results of the testing and evaluation;
    Implement a verifiable flaw remediation process; and
    Correct flaws identified during testing and evaluation.
source: NIST SP 800-53 Rev 5 (public domain)
