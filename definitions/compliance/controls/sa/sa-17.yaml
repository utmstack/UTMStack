# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sa-17
family: sa
familyName: System and Services Acquisition
name: Developer Security and Privacy Architecture and Design
scope: governance
statement: |-
  Require the developer of the system, system component, or system service to produce a design specification and security and privacy architecture that:
  Is consistent with the organization’s security and privacy architecture that is an integral part the organization’s enterprise architecture;
  Accurately and completely describes the required security and privacy functionality, and the allocation of controls among physical and logical components; and
  Expresses how individual security and privacy functions, mechanisms, and services work together to provide required security and privacy capabilities and a unified approach to protection.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example contracts, acquisition requirements, or development and testing records.
source: NIST SP 800-53 Rev 5 (public domain)
