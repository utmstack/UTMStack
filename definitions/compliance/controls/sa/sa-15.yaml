# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sa-15
family: sa
familyName: System and Services Acquisition
name: Development Process, Standards, and Tools
scope: governance
statement: |-
  Require the developer of the system, system component, or system service to follow a documented development process that:
  Explicitly addresses security and privacy requirements;
  Identifies the standards and tools used in the development process;
  Documents the specific tool options and tool configurations used in the development process; and
  Documents, manages, and ensures the integrity of changes to the process and/or tools used in development; and
  Review the development process, standards, tools, tool options, and tool configurations [frequency] to determine if the process, standards, tools, tool options and tool configurations selected and employed can satisfy the following security and privacy requirements: [organization-defined security and privacy requirements].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example contracts, acquisition requirements, or development and testing records.
source: NIST SP 800-53 Rev 5 (public domain)
