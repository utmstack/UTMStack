# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: sa-16
family: sa
familyName: System and Services Acquisition
name: Developer-provided Training
scope: governance
statement: 'Require the developer of the system, system component, or system service to provide the following
  training on the correct use and operation of the implemented security and privacy functions, controls,
  and/or mechanisms: [training].'
source: NIST SP 800-53 Rev 5 (public domain)
