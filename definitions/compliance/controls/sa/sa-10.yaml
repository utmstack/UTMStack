# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: sa-10
family: sa
familyName: System and Services Acquisition
name: Developer Configuration Management
scope: governance
statement: |-
  Require the developer of the system, system component, or system service to:
    Perform configuration management during system, component, or service [design | development | implementation | operation | disposal];
    Document, manage, and control the integrity of changes to [configuration items];
    Implement only organization-approved changes to the system, component, or service;
    Document approved changes to the system, component, or service and the potential security and privacy impacts of such changes; and
    Track security flaws and flaw resolution within the system, component, or service and report findings to [personnel].
source: NIST SP 800-53 Rev 5 (public domain)
