# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sa-4
family: sa
familyName: System and Services Acquisition
name: Acquisition Process
scope: governance
statement: |-
  Include the following requirements, descriptions, and criteria, explicitly or by reference, using [standardized contract language | [organization-defined value]] in the acquisition contract for the system, system component, or system service:
  Security and privacy functional requirements;
  Strength of mechanism requirements;
  Security and privacy assurance requirements;
  Controls needed to satisfy the security and privacy requirements.
  Security and privacy documentation requirements;
  Requirements for protecting security and privacy documentation;
  Description of the system development environment and environment in which the system is intended to operate;
  Allocation of responsibility or identification of parties responsible for information security, privacy, and supply chain risk management; and
  Acceptance criteria.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example contracts, acquisition requirements, or development and testing records.
source: NIST SP 800-53 Rev 5 (public domain)
