# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sa-3
family: sa
familyName: System and Services Acquisition
name: System Development Life Cycle
scope: governance
statement: |-
  Acquire, develop, and manage the system using [system-development life cycle] that incorporates information security and privacy considerations;
  Define and document information security and privacy roles and responsibilities throughout the system development life cycle;
  Identify individuals having information security and privacy roles and responsibilities; and
  Integrate the organizational information security and privacy risk management process into system development life cycle activities.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example contracts, acquisition requirements, or development and testing records.
source: NIST SP 800-53 Rev 5 (public domain)
