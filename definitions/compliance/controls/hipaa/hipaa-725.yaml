id: hipaa-725
family: hipaa
familyName: HIPAA
name: AWS DescribeLogStreams Logs
scope: data
statement: This report gathers and analyzes logs generated by the AWS DescribeLogStreams operation. This operation lists log streams in a specific log group, providing relevant information about who accesses and views log data that may contain ePHI (Electronic Protected Health Information). This report is essential for verifying compliance with HIPAA 164.312(a)(1), which establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that maintain ePHI. This report facilitates the identification and monitoring of access to log streams, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: aws-describelogstreams-logs
    name: AWS DescribeLogStreams Logs
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'DescribeLogStreams')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-describelogstreams-logs-by-source
    name: AWS DescribeLogStreams Logs by Source
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'DescribeLogStreams')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
