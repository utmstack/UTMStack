id: hipaa-713
family: hipaa
familyName: HIPAA
name: Windows Access to critical files or specific directories
scope: data
statement: This report contributes to compliance with the NIST CSF DE.CM-1 requirement, which establishes the need to continuously monitor network activity to detect potential malicious activity. By analyzing event ID 4663 on Windows systems, this report facilitates the monitoring of access and modifications to system objects, which may indicate unauthorized attempts to manipulate or alter critical data. Monitoring these types of events is essential for identifying suspicious activity that could compromise system security, enabling a rapid and effective response to potential threats and ensuring the protection of the network's digital assets.
strategy: ANY
checks:
  - key: windows-access-to-critical-files-or-specific-directories
    name: Windows Access to critical files or specific directories
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4663'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-distribution-of-access-results-to-critical-files-or-specific-directories
    name: Windows Distribution of access results to critical files or specific directories
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4663'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
