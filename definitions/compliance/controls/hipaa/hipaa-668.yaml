id: hipaa-668
family: hipaa
familyName: HIPAA
name: Windows User Accounts Created
scope: data
statement: This report collects and analyzes security events identified by ID 4720 on Windows systems. Event 4720 records the creation of new user accounts, providing relevant information about when, where, and by whom these accounts were created. These events are essential for verifying compliance with the HITRUST CSF 01.v requirement, which mandates the logging of key system activities. This report facilitates the identification and auditing of account creation, ensuring that all changes to the user directory are properly monitored and logged to maintain system integrity and security.
strategy: ANY
checks:
  - key: windows-user-accounts-created
    name: Windows User Accounts Created
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-new-accounts-created-over-time
    name: Windows New Accounts Created Over Time
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
