id: hipaa-644
family: hipaa
familyName: HIPAA
name: Windows Protected Object Permission Change
scope: data
statement: This report collects and analyzes security events identified by ID 4670 on Windows systems. Event 4670 records changes to security permissions for system objects, providing relevant information for verifying compliance with HIPAA requirement 164.312(a)(1). This requirement establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that store or process ePHI (Electronic Protected Health Information). This report facilitates the identification and monitoring of changes in access permissions to system resources, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-protected-object-permission-change
    name: Windows Protected Object Permission Change
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4670')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-distribution-of-protected-object-permission-change
    name: Windows Process Distribution of Protected Object Permission Change
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4670')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
