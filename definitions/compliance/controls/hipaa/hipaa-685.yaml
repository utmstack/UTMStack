id: hipaa-685
family: hipaa
familyName: HIPAA
name: Windows Failed logon attempt
scope: data
statement: This report collects and analyzes security events identified by ID 4690 on Windows systems. Event 4690 records attempts to modify the permissions of protected objects, such as files, folders, or critical resources that may contain ePHI (Electronic Protected Health Information). This event is essential for verifying compliance with HIPAA requirement 164.312(a)(1), which establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that maintain ePHI. This report facilitates the identification and monitoring of changes in access permissions, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-logon-attempt-failed
    name: Windows Logon attempt failed
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4690')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-failed-logon-attempt-by-domain-and-user
    name: Windows Failed logon attempt by Domain and User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4690')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
