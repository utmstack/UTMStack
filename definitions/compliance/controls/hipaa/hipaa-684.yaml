id: hipaa-684
family: hipaa
familyName: HIPAA
name: Windows Restoration of default security policies
scope: data
statement: This report collects and analyzes security events identified by ID 4907 on Windows systems. Event 4907 records changes in audit policy settings related to access to system resources, providing relevant information for verifying compliance with HIPAA requirement 164.312(a)(1). This requirement establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that store or process ePHI (Electronic Protected Health Information). This report facilitates the identification and monitoring of audit policy adjustments, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-restoration-of-default-security-policies
    name: Windows Restoration of default security policies
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4907')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-restoration-of-default-security-policies-by-outcome
    name: Windows Restoration of default security policies by outcome
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4907')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
