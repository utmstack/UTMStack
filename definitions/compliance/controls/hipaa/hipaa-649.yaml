id: hipaa-649
family: hipaa
familyName: HIPAA
name: Windows Registry Value Modification
scope: data
statement: This report collects and analyzes security events identified by ID 4657 on Windows systems. Event 4657 records changes to a system's security objects, providing relevant information about modifications to the permission settings or attributes of objects that store or process ePHI (Electronic Protected Health Information). This event is key to verifying compliance with HIPAA requirement 164.312(a)(1), which establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that maintain ePHI. This report facilitates the identification and monitoring of changes in access permissions, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-registry-value-modification-by-process
    name: Windows Registry Value Modification by Process
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4657'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-registry-value-modification
    name: Windows Registry Value Modification
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4657'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
