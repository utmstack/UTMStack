id: hipaa-674
family: hipaa
familyName: HIPAA
name: Windows Access to Shared Resources
scope: data
statement: This report contributes to compliance with the NIST CSF PR.DS-3 requirement, which requires protective monitoring of data both at rest and in transit. By analyzing events identified by ID 5145 on Windows systems, this report facilitates the monitoring of access and activities related to critical resources. This ensures that any attempt to access or manipulate sensitive data is properly logged, audited, and reviewed, thus guaranteeing the continuous protection of data confidentiality, integrity, and availability, strengthening security policies, and proactive monitoring of the IT infrastructure.
strategy: ANY
checks:
  - key: windows-access-to-shared-resources
    name: Windows Access to Shared Resources
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '5140'
          - '5145'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-access-to-shared-resources-by-resource
    name: Windows Access to Shared Resources by Resource
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '5140'
          - '5145'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
