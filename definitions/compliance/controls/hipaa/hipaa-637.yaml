id: hipaa-637
family: hipaa
familyName: HIPAA
name: Windows User Accounts Created
scope: data
statement: This report collects and analyzes security events identified by ID 4720 on Windows systems. Event 4720 records the creation of new user accounts, providing relevant information for verifying compliance with HIPAA requirement 164.312(a)(1). This requirement establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that store or process ePHI (Electronic Protected Health Information). This report facilitates the identification and monitoring of user account creation, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-user-accounts-created
    name: Windows User Accounts Created
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-new-accounts-created-over-time
    name: Windows New Accounts Created Over Time
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
