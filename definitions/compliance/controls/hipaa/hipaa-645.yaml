id: hipaa-645
family: hipaa
familyName: HIPAA
name: Windows Special privileges assigned to new logon
scope: data
statement: This report collects and analyzes security events identified by ID 4672 on Windows systems. Event 4672 records the assignment of special privileges to accounts during logon, providing relevant information for verifying compliance with HIPAA requirement 164.312(a)(1). This requirement establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that store or process ePHI (Electronic Protected Health Information). This report facilitates the identification of privileged access and contributes to the implementation and monitoring of secure access policies.
strategy: ANY
checks:
  - key: windows-special-privileges-assigned-to-new-logon
    name: Windows Special privileges assigned to new logon
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4672'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-special-privileges-assigned-to-new-logon-2
    name: Windows Special privileges assigned to new logon
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4672'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
