id: hipaa-704
family: hipaa
familyName: HIPAA
name: Windows Logins with explicit credentials
scope: data
statement: This report supports compliance with the NIST CSF DE.CM-1 requirement, which establishes the need for continuous monitoring of network activity to detect malicious activity. By analyzing event ID 4648 on Windows systems, this report facilitates the monitoring of login attempts using credentials from a different account, which may indicate anomalous or malicious behavior. This continuous monitoring allows suspicious activity to be identified and preventive or corrective actions to be taken in a timely manner, contributing to network protection and system security.
strategy: ANY
checks:
  - key: windows-logins-with-explicit-credentials
    name: Windows Logins with explicit credentials
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4648')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logins-with-explicit-credentials-by-user
    name: Windows Logins with explicit credentials by User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4648')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
