id: hipaa-726
family: hipaa
familyName: HIPAA
name: AWS DescribeLogGroups Logs
scope: data
statement: This report gathers and analyzes relevant information generated by the DescribeLogGroups action in AWS. This action lists the log groups configured in Amazon CloudWatch Logs, providing essential information for verifying compliance with HIPAA 164.312(a)(1), which establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that maintain ePHI (Electronic Protected Health Information). This report facilitates the identification and monitoring of available log groups, allowing you to validate the correct configuration of permissions and associated access controls, contributing to the implementation of secure access policies.
strategy: ANY
checks:
  - key: aws-describeloggroups-logs
    name: AWS DescribeLogGroups Logs
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'DescribeLogGroups')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-describeloggroups-logs-by-region
    name: AWS DescribeLogGroups Logs by Region
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'DescribeLogGroups')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
