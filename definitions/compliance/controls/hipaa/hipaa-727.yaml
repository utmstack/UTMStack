id: hipaa-727
family: hipaa
familyName: HIPAA
name: AWS PutObject Logs
scope: data
statement: This report gathers and analyzes relevant information generated by PutObject events in AWS, which record the upload of objects to an Amazon S3 bucket. This event provides details about data access and storage, essential for verifying compliance with the HITRUST CSF 01.p requirement, which establishes that access to log data and monitoring systems must be controlled. The report makes it easy to identify who uploaded objects, from which location, and with what permissions, allowing validation of the proper implementation of access and control policies for log data and monitoring systems, thus ensuring their protection and compliance.
strategy: ANY
checks:
  - key: aws-putobject-logs
    name: AWS PutObject Logs
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'PutObject')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-putobject-logs-by-source-ip
    name: AWS PutObject Logs by Source IP
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'PutObject')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
