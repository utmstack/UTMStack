id: hipaa-654
family: hipaa
familyName: HIPAA
name: Windows Access to critical files or specific directories
scope: data
statement: This report collects and analyzes security events identified by ID 4663 on Windows systems. Event 4663 records access to security objects, providing relevant information about the reading, writing, or deletion of protected files or resources within a system containing ePHI (Electronic Protected Health Information). This event is essential for verifying compliance with HIPAA requirement 164.312(a)(1), which establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that maintain ePHI. This report facilitates the identification and monitoring of access to sensitive resources, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-access-to-critical-files-or-specific-directories
    name: Windows Access to critical files or specific directories
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4663')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-distribution-of-access-results-to-critical-files-or-specific-directories
    name: Windows Distribution of access results to critical files or specific directories
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4663')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
