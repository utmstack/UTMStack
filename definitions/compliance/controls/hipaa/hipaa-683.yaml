id: hipaa-683
family: hipaa
familyName: HIPAA
name: Windows Policy changes
scope: data
statement: This report collects and analyzes security events identified by ID 4719 on Windows systems. Event 4719 records changes to the system's audit policy configuration, providing relevant information for verifying compliance with HIPAA requirement 164.312(a)(1). This requirement establishes the implementation of technical policies to ensure that only authorized individuals have access to electronic systems that store or process ePHI (Electronic Protected Health Information). This report facilitates the identification and monitoring of audit policy changes, contributing to adequate access control and the implementation of secure access policies.
strategy: ANY
checks:
  - key: windows-policy-changes
    name: Windows Policy changes
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4663'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-policy-changes-by-outcome
    name: Windows Policy changes by outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4719'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
