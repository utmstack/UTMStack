id: hipaa-728
family: hipaa
familyName: HIPAA
name: AWS GetBucketAcl Logs
scope: data
statement: This report gathers and analyzes relevant information generated by GetBucketAcl events in AWS, which record access requests to the access control list (ACL) of an Amazon S3 bucket. This event provides details on who has viewed or modified the permissions associated with the buckets, which is crucial for verifying compliance with the HITRUST CSF 01.p requirement, which establishes that access to log data and monitoring systems must be controlled. The report makes it easy to identify access to bucket permissions, ensuring that only authorized individuals can view or modify access controls to critical data and monitoring systems.
strategy: ANY
checks:
  - key: aws-getbucketacl-logs
    name: AWS GetBucketAcl Logs
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'GetBucketAcl')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-getbucketacl-logs-by-region
    name: AWS GetBucketAcl Logs by Region
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName.keyword = 'GetBucketAcl')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
