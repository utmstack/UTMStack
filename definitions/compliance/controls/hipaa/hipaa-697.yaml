id: hipaa-697
family: hipaa
familyName: HIPAA
name: Windows Credential Access
scope: data
statement: This report contributes to compliance with the NIST CSF PR.DS-3 requirement, which establishes the need to protectively monitor data both at rest and in transit. By collecting key events on Windows systems, this report enables continuous information security monitoring, ensuring that activities related to the access and use of sensitive data are adequately monitored and logged. This guarantees the protection of the confidentiality, integrity, and availability of critical data, helping to prevent unauthorized access or tampering.
strategy: ANY
checks:
  - key: windows-credential-access
    name: Windows Credential Access
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5379'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-credential-access-by-domain
    name: Windows Credential Access by Domain
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5379'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
