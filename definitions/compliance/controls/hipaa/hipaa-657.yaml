id: hipaa-657
family: hipaa
familyName: HIPAA
name: Windows Account Logon Failure
scope: data
statement: This report collects and analyzes security events identified with ID 4625 on Windows systems. Event 4625 records failed logon attempts. These events are essential for verifying compliance with the HITRUST CSF 01.v requirement, which requires the logging of key system activities. This report facilitates the identification and auditing of unauthorized access attempts, which helps detect suspicious or malicious activity and ensures effective security policy implementation and continuous monitoring.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    dataType: wineventlog
    filters:
      - field: log.statusDescription
        operator: IS_ONE_OF_TERMS
        value:
          - Logon failure
          - Clients credentials have been revoked
          - Pre-authentication information was invalid
          - Account restriction
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
