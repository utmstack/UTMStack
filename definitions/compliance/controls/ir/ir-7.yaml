# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ir-7
family: ir
familyName: Incident Response
name: Incident Response Assistance
scope: governance
statement: |-
  Provide an incident response support resource, integral to the organizational incident response capability, that offers advice and assistance to users of the system for the handling and reporting of incidents.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the incident response plan, the last exercise record, or the report sent to the authority.
source: NIST SP 800-53 Rev 5 (public domain)
