# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ps-7
family: ps
familyName: Personnel Security
name: External Personnel Security
scope: governance
statement: |-
  Establish personnel security requirements, including security roles and responsibilities for external providers;
  Require external providers to comply with personnel security policies and procedures established by the organization;
  Document personnel security requirements;
  Require external providers to notify [personnel or roles] of any personnel transfers or terminations of external personnel who possess organizational credentials and/or badges, or who have system privileges within [time period]; and
  Monitor provider compliance with personnel security requirements.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example screening, termination and transfer records, or signed access agreements.
source: NIST SP 800-53 Rev 5 (public domain)
