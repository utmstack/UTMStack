# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ps-8
family: ps
familyName: Personnel Security
name: Personnel Sanctions
scope: governance
statement: |-
  Employ a formal sanctions process for individuals failing to comply with established information security and privacy policies and procedures; and
  Notify [personnel or roles] within [time period] when a formal employee sanctions process is initiated, identifying the individual sanctioned and the reason for the sanction.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example screening, termination and transfer records, or signed access agreements.
source: NIST SP 800-53 Rev 5 (public domain)
