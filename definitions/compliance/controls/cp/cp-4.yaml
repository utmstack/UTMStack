# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: cp-4
family: cp
familyName: Contingency Planning
name: Contingency Plan Testing
scope: governance
statement: |-
  Test the contingency plan for the system [frequency] using the following tests to determine the effectiveness of the plan and the readiness to execute the plan: [organization-defined tests].
  Review the contingency plan test results; and
  Initiate corrective actions, if needed.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the contingency plan, the last test result, or backup and restore records.
source: NIST SP 800-53 Rev 5 (public domain)
