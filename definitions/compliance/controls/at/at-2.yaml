# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: at-2
family: at
familyName: Awareness and Training
name: Literacy Training and Awareness
scope: governance
statement: |-
  Provide security and privacy literacy training to system users (including managers, senior executives, and contractors):
  As part of initial training for new users and [organization-defined frequency] thereafter; and
  When required by system changes or following [organization-defined events];
  Employ the following techniques to increase the security and privacy awareness of system users [awareness techniques];
  Update literacy training and awareness content [frequency] and following [events]; and
  Incorporate lessons learned from internal or external security incidents or breaches into literacy training and awareness techniques.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example training records: who was trained, on what, and when.
source: NIST SP 800-53 Rev 5 (public domain)
