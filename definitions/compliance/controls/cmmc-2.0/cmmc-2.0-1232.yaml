id: cmmc-2.0-1232
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 4 (AU.4.053): MailItems Accessed'
scope: data
statement: This report presents relevant information collected from logs generated by the Office 365 MailItemsAccessed event, as part of the audit integrity monitoring and control activities required by the CMMC Level 4 standard (AU.4.053). This control requires the implementation of mechanisms to ensure the integrity of audit logs, ensuring their protection against unauthorized modification, deletion, or malicious alteration.<br/><br/>The collected logs include critical details about access to email items. Analyzing these logs allows for validating the integrity of the recorded events and detecting any anomalous activity that could compromise information security, thereby complying with CMMC requirement AU.4.053.
strategy: ANY
checks:
  - key: o365-mailitems-accessed
    name: O365 MailItems Accessed
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'MailItemsAccessed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-mailitems-accessed-by-user
    name: O365 MailItems Accessed by User
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'MailItemsAccessed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
