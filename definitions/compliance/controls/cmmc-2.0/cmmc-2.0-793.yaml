id: cmmc-2.0-793
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (SI.1.210): Windows Unexpected Service Failures'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 7031, which is triggered when the Service Control Manager (SCM) detects that a service has ended unexpectedly. The event is especially important when such termination is unplanned or may be related to malicious activities, such as malware infections, and is key to complying with CMMC Level 1 control SI.1.210, which requires identifying and correcting malware infections.<br/><br/>Event 7031 provides details about services that have stopped unexpectedly. These events allow security teams to detect possible attempts by attackers to disable critical system services through malware or other forms of manipulation.<br/><br/>Monitoring these types of events is essential to identify anomalous or malicious activities that may compromise the stability and security of systems. Collecting 7031 event information allows security teams to act quickly on unexpected termination of services, which could indicate that malware is attempting to interfere with system processes.<br/><br/>This report is essential to ensure that malware infections are detected in time and that essential system services are restored and protected. In addition, it contributes to compliance with CMMC Level 1 control SI.1.210, ensuring that systems are continuously monitored and protected against threats that may affect their operation and security.
strategy: ANY
checks:
  - key: windows-unexpected-service-failures
    name: Windows Unexpected Service Failures
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('7031'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-unexpected-service-failures-by-service
    name: Windows Unexpected Service Failures by Service
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '7031')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
