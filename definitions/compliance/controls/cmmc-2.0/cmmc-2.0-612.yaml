id: cmmc-2.0-612
family: cmmc-2.0
familyName: CMMC
name: 'AWS Level 2 (AU.2.042): Cloud'
scope: data
statement: This report compiles relevant information from AWS logs related to events in the cloud, providing visibility into the activity in the infrastructure and the services used. This monitoring is essential to comply with CMMC Level 2 control AU.2.042, which requires ensuring the collection of logs for the detection and analysis of security events.<br/><br/>Cloud logs include events generated by users and services within AWS, such as accesses, configuration modifications, permission changes, resource usage, and other critical activities. These logs, obtained through services such as AWS CloudTrail, AWS Config, AWS CloudWatch, and AWS Security Hub, allow organizations to track events and detect potential threats or unauthorized activity.<br/><br/>The analysis of these events contributes to strengthening the security of the environment by allowing the identification of anomalous patterns, the correlation of incidents and the performance of forensic audits. Additionally, it facilitates compliance with security regulations and standards by ensuring the traceability and availability of records for security investigations.<br/><br/>This report supports the implementation of effective monitoring controls in AWS, ensuring that logs are collected and used to detect and analyze security events, in compliance with CMMC Level 2 control AU.2.042.
strategy: ANY
checks:
  - key: aws-activity-console-logon
    name: AWS Activity Console Logon
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-events-by-service
    name: AWS Events by Service
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-events-by-asset
    name: AWS Events by Asset
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-iam-user-activity-per-hour
    name: AWS IAM User Activity per Hour
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.userIdentity.type.keyword = 'IAMUser')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-events-over-time
    name: AWS Events Over Time
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: processes-ran-with-administrator-privileges
    name: Processes Ran with Administrator Privileges
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_data.TokenElevationType IN ('%%1936', '%%1937'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
