id: cmmc-2.0-1027
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 1 (AU.1.001): File Renamed'
scope: data
statement: This report compiles relevant information from the logs generated by the FileRenamed event in Office 365, providing visibility into file renaming on platforms such as OneDrive and SharePoint. It is intended to support CMMC Level 1 (AU.1.001) compliance, which requires the capture of audit logs for basic security events.<br/><br/>The report documents key data that allows security administrators to monitor file modifications, detect possible attempts to conceal suspicious activities, and ensure the integrity of stored information.<br/><br/>Logging and analyzing these events is crucial for data traceability, identifying potential security incidents, and maintaining a secure and compliant work environment. Additionally, this report can be used to enforce change control policies and improve document management within the organization.
strategy: ANY
checks:
  - key: o365-file-renamed
    name: O365 File Renamed
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'FileRenamed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-file-renamed-by-workload
    name: O365 File Renamed by Workload
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation.keyword = 'FileRenamed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
