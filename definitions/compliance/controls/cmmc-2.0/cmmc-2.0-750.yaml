id: cmmc-2.0-750
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 5 (AU.5.055): Event Logging Service Shut Down'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 1100, which is triggered when the Windows Event Logging service stops. This event is crucial to comply with CMMC control AU.5.055, which requires the use of advanced tools to ensure the integrity and availability of the logs.<br/><br/>Event 1100 provides information about the stopping of the event log service, which is essential for monitoring potential interruptions in the audit process and ensuring that event logs are kept intact and accessible for future review. Collecting and analyzing these events can detect unauthorized shutdowns or issues with log integrity, which could impact the ability to perform accurate audits and respond to security incidents effectively.<br/><br/>This report facilitates the identification of events in which the event logging service has been stopped, allowing proactive monitoring to maintain continuity in the collection and preservation of logs. Additionally, it contributes to compliance with CMMC requirements, ensuring that log protection and availability mechanisms are effectively implemented and monitored in accordance with best security practices.
strategy: ANY
checks:
  - key: windows-event-logging-service-shut-down
    name: Windows Event Logging Service Shut Down
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1100')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-event-logging-service-shutdowns-count-by-host
    name: Windows Event Logging Service Shutdowns - Count by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1100')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
