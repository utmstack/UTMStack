id: cmmc-2.0-796
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (SI.3.219): Filtering Platform'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 5158, which is triggered when the Windows Filtering Platform (WFP) blocks a network connection due to configured filtering rules. The event is particularly important for CMMC Level 3 control SI.3.219, which requires the implementation of endpoint monitoring for malware detection.<br/><br/>The Windows Filtering Platform (WFP) is an infrastructure that enables filtering of network traffic, providing fine-grained control over incoming and outgoing connections. When a connection is blocked by network filtering policies, event 5158 records information related to that action, which helps identify suspicious traffic patterns, unauthorized access attempts, or the communication of malware across the network. .<br/><br/>Monitoring these types of events is crucial to detect malicious activity in real time, such as malware attempts to exfiltrate information or connect to command and control servers. This event provides key details about network connections that have been stopped by WFP filtering rules, allowing security teams to identify, investigate, and mitigate potential threats before they can compromise the system.<br/><br/>This report is essential to ensure that network infrastructure protection measures are working correctly, contributing to compliance with CMMC Level 3 control SI.3.219 by enabling effective monitoring of endpoints and early detection of malware and cyber attacks.
strategy: ANY
checks:
  - key: windows-filtering-platform
    name: Windows Filtering Platform
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5158'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-filtering-platform-by-protocol
    name: Windows Filtering Platform by Protocol
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5158'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
