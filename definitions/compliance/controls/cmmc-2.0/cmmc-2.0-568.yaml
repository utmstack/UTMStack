id: cmmc-2.0-568
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): User Account Attributes Changes'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4738, which is triggered when there is a change in the information of a user account, such as the modification of the password or other important attributes. This event is essential to comply with CMMC control AU.3.045, which establishes the need to correlate security events to identify suspicious behavior.<br/><br/>Event 4738 provides detailed information about any alterations to user accounts, which may indicate attempted credential manipulation or unauthorized modifications. By correlating this event with other security logs, such as system access logs and authentication event logs, you can identify unusual or malicious patterns of behavior, such as accessing critical accounts or modifying user privileges without justification.<br/><br/>This report allows you to identify potentially malicious activities that involve the modification of user accounts and is a key tool to detect suspicious changes that may compromise organizational security. Additionally, it facilitates CMMC compliance by implementing robust event correlation practices, crucial to identifying and mitigating risks related to unauthorized access.
strategy: ANY
checks:
  - key: windows-user-account-attributes-changes
    name: Windows User Account Attributes Changes
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4738'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: distribution-of-account-attribute-changes-by-operating-system
    name: Distribution of Account Attribute Changes by Operating System
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4738'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
