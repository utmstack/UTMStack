id: cmmc-2.0-763
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (SI.1.210): Logging Unexpected System Shutdowns'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 6008, which is triggered when the system detects an unexpected shutdown or unexpected restart of the operating system. This event is crucial to comply with CMMC control SI.1.210, which requires the identification and correction of system failures, including those caused by malware or other vulnerabilities.<br/><br/>Event 6008 provides details about the cause of an unexpected shutdown, which may indicate the presence of system crashes, critical errors, or malicious activities such as malware attacks that affect system stability. By analyzing these events, security teams can identify patterns that suggest tampering attempts or attacks that exploit vulnerabilities in the system.<br/><br/>This report allows the organization to quickly detect problems that may compromise security, facilitating the correction of system failures and the mitigation of risks associated with malware or operational failures. Additionally, it contributes to CMMC compliance by providing a tool for early detection of incidents and taking appropriate corrective actions, strengthening the organization's security posture.
strategy: ANY
checks:
  - key: windows-logging-unexpected-system-shutdowns
    name: Windows Logging Unexpected System Shutdowns
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '6008'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logging-unexpected-system-shutdowns-by-host
    name: Windows Logging Unexpected System Shutdowns by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '6008'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
