id: cmmc-2.0-1003
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 2 (AU.2.042): File Synchronization'
scope: data
statement: This report provides a detailed analysis of FileSyncDownloadedFull events in the O365 environment to verify compliance with CMMC Level 2 control AU.2.042, which requires ensuring that logs are collected to detect and analyze security events.<br/><br/>The report collects key information about file synchronizations, allowing you to identify unusual or suspicious activities related to file synchronization, such as unauthorized access or sensitive file transfers that could pose a security risk.<br/><br/>The purpose of this monitoring is to ensure that file synchronization actions are properly audited, detecting behavioral patterns that could indicate threats and providing relevant data for incident analysis.<br/><br/>This report is a key tool for CMMC Level 2 compliance, ensuring that all file synchronization events are collected and analyzed, contributing to the protection of information and the improvement of security in the O365 environment.
strategy: ANY
checks:
  - key: o365-filesyncdownloadedfull
    name: O365 FileSyncDownloadedFull
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: FileSyncDownloadedFull
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-filesyncdownloadedfull-by-ip
    name: O365 FileSyncDownloadedFull by IP
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: FileSyncDownloadedFull
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
