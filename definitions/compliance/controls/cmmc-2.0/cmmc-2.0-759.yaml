id: cmmc-2.0-759
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (SI.4.221): Cleaned Event Log'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 1102, which is triggered when the system audit log is cleared. This event is essential to comply with CMMC control SI.4.221, which requires the use of automated tools to detect and respond to network anomalies.<br/><br/>Event 1102 provides details on audit log deletion, which is critical to identifying unauthorized actions or attempts to manipulate system logs, behavior that could indicate an attack or malicious activity. Monitoring these types of events is crucial to detect attempts to hide traces of previous attacks, which is behavior that can compromise the integrity of the network security system.<br/><br/>This report is key to strengthening the detection of anomalies and the protection of the network infrastructure, allowing security teams to take preventive and response measures against the unauthorized deletion of logs. Additionally, it contributes to CMMC compliance by ensuring that appropriate incident detection tools are used and the integrity of system logs is maintained, facilitating the identification and mitigation of potential network threats.
strategy: ANY
checks:
  - key: windows-cleaned-event-log
    name: Windows Cleaned Event Log
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-cleaned-event-log-by-source
    name: Windows Cleaned Event Log by Source
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
