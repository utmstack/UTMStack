id: cmmc-2.0-571
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.054): Application Errors'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 1000, which is recorded when an application or process on the system experiences an error and closes unexpectedly. This event is critical to comply with CMMC control AU.4.054, which requires the implementation of advanced event correlation to detect evolving threats.<br/><br/>Event 1000 can be an indicator of possible malicious activity, such as attempts to exploit vulnerabilities, crashes in critical applications, or the execution of unauthorized code. By correlating it with other security events, such as suspicious process execution attempts, unusual access, or system configuration changes, it is possible to identify patterns that suggest attack attempts or infrastructure compromises.<br/><br/>This report facilitates the detection of possible advanced threats by providing visibility into application failures and their possible relationship with malicious activities. Additionally, it contributes to CMMC compliance by strengthening the ability to correlate and analyze critical events in the IT environment.
strategy: ANY
checks:
  - key: windows-application-errors
    name: Windows Application Errors
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1000')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-application-errors-by-exception-code
    name: Windows Application Errors by Exception Code
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1000')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
