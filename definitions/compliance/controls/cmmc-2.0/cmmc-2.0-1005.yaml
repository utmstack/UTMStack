id: cmmc-2.0-1005
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 3 (AU.3.045): File Renamed'
scope: data
statement: This report presents a detailed analysis of FileRenamed events in the Office 365 (SharePoint) environment to verify compliance with CMMC Level 3 control AU.3.045. Key information is collected to correlate audit records and facilitate analysis of security events.<br/><br/>The purpose of this report is to improve visibility into changes to sensitive files, detect unusual activity, and support the identification of potential security incidents by escalating events within the system for audit purposes.
strategy: ANY
checks:
  - key: o365-file-renamed
    name: O365 File Renamed
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'FileRenamed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-file-renamed-by-workload
    name: O365 File Renamed by Workload
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation.keyword = 'FileRenamed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
