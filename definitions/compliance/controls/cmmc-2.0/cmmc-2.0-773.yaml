id: cmmc-2.0-773
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (CM.3.068): Security enabled local group change'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4735, which is triggered when changes are made to the properties of a security group on the system. This event is key to complying with CMMC control CM.3.068, which requires the implementation of controls to manage system configurations and ensure infrastructure security.<br/><br/>Event 4735 provides details about modifications to security groups. Monitoring this event is critical to detect unauthorized changes to security groups, which could indicate attempted privilege escalation, alterations to access permissions, or misconfigurations that compromise system security.<br/><br/>This report allows security teams to identify and respond to changes in system configuration, ensuring that changes are authorized and aligned with established security policies. Its implementation strengthens configuration management and contributes to CMMC compliance, ensuring that controls over security groups remain within the parameters defined by the organization.
strategy: ANY
checks:
  - key: windows-security-enabled-local-group-change
    name: Windows Security enabled local group change
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4735'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-security-enabled-local-group-change-by-user
    name: Windows Security enabled local group change by User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4735'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
