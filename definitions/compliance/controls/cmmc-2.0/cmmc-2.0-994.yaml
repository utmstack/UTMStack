id: cmmc-2.0-994
family: cmmc-2.0
familyName: CMMC
name: Windows Permissions issues in DCOM
scope: data
statement: This report collects and analyzes Windows registry events 10016, which indicate permissions problems in activating COM (Component Object Model) components. These events can signal misconfigurations in the security of critical services and applications, impacting business continuity and disaster recovery.<br/><br/>Analysis of these events is essential to ensure compliance with Disaster Recovery and Business Continuity Monitoring requirements within the CMMC (Cybersecurity Maturity Model Certification) framework, ensuring that COM component permissions are correctly configured to avoid disruptions to key systems. This report helps identify and correct permission configurations that could compromise the operational resilience and security of the infrastructure.
strategy: ANY
checks:
  - key: windows-permissions-issues-in-dcom-by-level
    name: Windows Permissions issues in DCOM by Level
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '10016')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-permissions-issues-in-dcom
    name: Windows Permissions issues in DCOM
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '10016')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
