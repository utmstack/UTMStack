id: cmmc-2.0-788
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AC.3.027): Account Logon Success'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4624, which is triggered when a user logs on to the system. The event is especially important when it comes to logging in with elevated privileges, such as an administrator, and is key to complying with CMMC Level 3 control AC.3.027, which requires monitoring and restricting the use of privileged access.<br/><br/>Event 4624 provides details on successful login attempts, and in particular, those involving privileged accounts. This information allows us to identify users who access systems with elevated privileges and whether such access is being used appropriately.<br/><br/>Monitoring this access is essential to ensure that elevated accounts are used only by authorized users and for the specific tasks for which they have been assigned such access. Additionally, information from 4624 events helps detect anomalous or potentially dangerous behavior that could indicate abuse of privileges, unauthorized access, or malicious movements within the infrastructure.<br/><br/>This report supports security teams in the implementation of access controls and privilege management, thus contributing to the prevention of possible security incidents. In doing so, it reinforces compliance with CMMC Level 3 control AC.3.027, ensuring that privileged access is strictly controlled, monitored and restricted according to the operational and security needs of the organization.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4672'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4324'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: IS_NOT
        value: '-'
      - field: log.logonType
        operator: IS_ONE_OF_TERMS
        value:
          - '3'
          - '2'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
