    name: Linux Activity
    dataType: linux
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-activity-by-os
    name: Linux Activity by OS
    dataType: linux
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
