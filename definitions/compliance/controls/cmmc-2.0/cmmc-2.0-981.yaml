id: cmmc-2.0-981
family: cmmc-2.0
familyName: CMMC
name: Office 365 Activity Monitoring
scope: data
statement: This report aims to demonstrate that the security information and event management (SIEM) system effectively monitors user activities in Office 365, with an emphasis on identifying and mitigating risks associated with third parties. Through the analysis of the logs generated by Office 365, detailed information is recorded about the operations carried out, such as access to mailboxes, user activity and communications with external sources. Critical data, such as access IP addresses, actions taken (such as access to mail items), and validation of the operation (whether it was successful or not), allow comprehensive monitoring of third-party risks and verification that these accesses comply with established security policies.<br/><br/>Event monitoring in Office 365 aligns with CMMC (Cybersecurity Maturity Model Certification) practices, especially regarding external user access monitoring, authentication, and protection of sensitive data. This ensures that third party activities are recorded, analyzed and evaluated to meet critical data protection requirements, especially those related to access to CUI (Controlled Unclassified Information).
strategy: ANY
checks:
  - key: o365-activity
    name: O365 Activity
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-activity-by-operation
    name: O365 Activity by Operation
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
