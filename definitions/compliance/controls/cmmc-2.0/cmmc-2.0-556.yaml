id: cmmc-2.0-556
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.043): Account Logon Success'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4624, which is triggered when a user successfully logs into the system. This event is key to compliance with CMMC AU.2.043, which requires the review of logs and the correlation of events to detect inappropriate or unauthorized activities.<br/><br/>In this case, event 4624 provides details about successful login attempts to the systems, including the identity of the user, the origin of the session, the type of authentication used, and other relevant data. These events are essential for reviewing user activity and detecting access patterns that could indicate anomalous or suspicious behavior.<br/><br/>The report uses analysis tools to correlate login logs with other system security events, identifying potential inappropriate activity, such as unauthorized access or privilege escalation attempts. Continuous monitoring and correlation of these events allows the organization to quickly detect and respond to any suspicious activity, helping to strengthen the overall security posture.<br/><br/>This log review process is a critical part of access control and security event management, ensuring that only authorized users can access the organization's systems and resources, while quickly identifying potential threats.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4624', '4672') AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4624', '4324') AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$' AND logx.wineventlog.event_data.TargetUserName.keyword <> '-' AND logx.wineventlog.event_data.LogonType.keyword IN ('3', '2'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
