id: cmmc-2.0-771
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (CM.2.063): Installation of Services'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 7045, which is triggered when a new service is installed on the system. This event is crucial to comply with CMMC control CM.2.063, which requires monitoring system changes to detect unauthorized or suspicious modifications.<br/><br/>Reviewing these logs can identify the installation of unauthorized services, unapproved remote access tools, or malicious activity related to persistent threats on the system.<br/><br/>This report helps security teams quickly detect and respond to the installation of new services, ensuring the integrity of the environment and minimizing the risks associated with uncontrolled changes to the infrastructure. Its implementation contributes to CMMC compliance, ensuring that system configuration changes are monitored and potential threats are detected before compromising organizational security.
strategy: ANY
checks:
  - key: windows-installation-of-services
    name: Windows Installation of Services
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '7045'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-installation-of-services-by-services
    name: Windows Installation of Services by Services
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '7045'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
