id: cmmc-2.0-821
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): Protected Object Access Operation'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4662, which is triggered when an object in the system is accessed, modified or deleted. This event is key to complying with CMMC Level 1 control AU.1.001, which requires the capture of audit logs for review in order to maintain the integrity of the systems.<br/><br/>Event 4662 provides details about access to objects within the system. These logs allow you to monitor changes and access made to critical files or configurations, which is essential to detect suspicious or unauthorized activities.<br/><br/>Monitoring these events contributes to the early identification of unauthorized access or malicious actions, helping to ensure that system configurations and data are protected from tampering or improper access. Additionally, collecting this information ensures that a detailed analysis can be performed on any security incidents that may arise.<br/><br/>This report is essential to support the implementation of an effective audit monitoring strategy, ensuring that CMMC Level 1 control AU.1.001 is met by capturing and reviewing audit logs, which reinforces security and operational integrity within of the organization's technological infrastructure.
strategy: ANY
checks:
  - key: windows-protected-object-access-operation
    name: Windows Protected Object Access Operation
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4662'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-protected-object-access-operation-by-object
    name: Windows Protected Object Access Operation by Object
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4662'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
