id: cmmc-2.0-809
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (SI.1.210): Windows Defender Action Against Detected Threat'
scope: data
statement: 'This report gathers relevant information from the Windows logs generated by Windows Defender events 2001, 2003 and 3002, which record the actions taken by the protection system against detected threats. These events are key to compliance with CMMC Level 1 control SI.1.210, which focuses on the identification and correction of system failures, including the detection and response to malware.<br/><br/>Event 2001: This event indicates that Windows Defender has detected a threat on the system and has taken protective action, such as removing or quarantining malicious files.<br/>Event 2003: Records additional actions that Windows Defender may have taken, such as scanning in the background or responding to threats on critical files or locations.<br/>Event 3002: Provides additional details on the execution of threat mitigation measures, including user or administrator intervention if necessary, and the status of affected files.<br/><br/>Collecting these events allows you to verify that Windows Defender is actively monitoring and responding to system threats, which is critical to mitigating the risk of malware infections and other vulnerabilities. These logs provide detailed information about the threats detected and the actions implemented to contain or eliminate those threats, allowing security teams to monitor the effectiveness of protection responses.<br/><br/>This report contributes to compliance with CMMC Level 1 control SI.1.210 by ensuring that system failures caused by malware or malicious activities are detected and appropriately acted upon. Correctly configuring and monitoring Windows Defender and collecting these logs provides a solid foundation for conducting regular audits, evaluating the effectiveness of mitigation actions, and ultimately protecting critical systems from potential cyber threats.'
strategy: ANY
checks:
  - key: windows-defender-action-against-detected-threat
    name: Windows Defender Action Against Detected Threat
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('2001', '2003', '3002'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-defender-action-against-detected-threat-by-event
    name: Windows Defender Action Against Detected Threat by Event
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('2001', '2003', '3002'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
