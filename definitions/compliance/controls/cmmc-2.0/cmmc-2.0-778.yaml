id: cmmc-2.0-778
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (CM.4.070): Member Addition to a Security Local Group'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4732, which is triggered when a user is added to a security group on a system. This event is key to complying with CMMC Level 4 control CM.4.070, which requires automation of the detection of unauthorized changes to systems.<br/><br/>Event 4732 provides details on modifications made to security groups, which is essential for tracking changes in access privileges to critical resources within the IT infrastructure. An unauthorized change to security groups may indicate an attempt to elevate privileges or compromise access control to sensitive data. Detecting these events automatically helps prevent unauthorized users from gaining improper access to systems or applications.<br/><br/>This reporting is critical to identifying and preventing malicious internal movements, such as unauthorized access to privileged systems or escalation of privileges, ensuring that appropriate security configurations are maintained and that access controls are constantly monitored. Additionally, it contributes to CMMC Level 4 compliance by enabling the automation of unauthorized change detection, which is essential for rapid response to security incidents.
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
