id: cmmc-2.0-754
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (SI.2.216): Service Installed'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4697, which is activated when a service is installed on the system. This event is key to complying with CMMC control SI.2.216, which requires the detection of malicious code and effective response to malware infections.<br/><br/>Event 4697 provides details about newly installed services on the system, which may be indicative of the installation of unauthorized or malicious software. Many types of malware are installed on the system as services to maintain their persistence. By monitoring these events, you can quickly identify suspicious services that could have been introduced by malware.<br/><br/>This report makes it easier to detect potential malware infections by monitoring newly installed services, allowing security teams to respond efficiently to any signs of malicious activity. Additionally, it contributes to CMMC compliance by ensuring that the services installed on the system are legitimate and not related to malicious behavior.
strategy: ANY
checks:
  - key: windows-service-installed
    name: Windows Service Installed
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4697'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-service-installed-by-service
    name: Windows Service Installed by Service
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4697'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
