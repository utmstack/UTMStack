id: cmmc-2.0-815
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): Logins with explicit credentials'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4648, which is triggered when a user attempts to log on to a system with explicit credentials, such as a username and password. This event is key to compliance with CMMC Level 1 control AU.1.001, which requires the capture of audit logs for review.<br/><br/>Event 4648 provides details about login attempts. This information is vital for tracking system access activities, allowing security teams to detect potential unauthorized attempts or suspicious access.<br/><br/>Collecting these logs also helps identify unusual or malicious access patterns, such as access attempts through compromised accounts, which helps improve incident response capabilities. Additionally, detailed information about login attempts is essential for conducting security audits, especially when investigating the integrity of user accounts and access to critical systems.<br/><br/>This report supports security teams in capturing and reviewing audit logs related to access to systems, ensuring that adequate control is maintained over login attempts, and contributes to compliance with security policies and access control, as established in control AU.1.001 of CMMC Level 1.
strategy: ANY
checks:
  - key: windows-logins-with-explicit-credentials
    name: Windows Logins with explicit credentials
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4648')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logins-with-explicit-credentials-by-user
    name: Windows Logins with explicit credentials by User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4648')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
