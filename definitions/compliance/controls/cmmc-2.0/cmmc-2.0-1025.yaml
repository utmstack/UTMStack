id: cmmc-2.0-1025
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 1 (AU.1.001): File Accessed'
scope: data
statement: This report consolidates key information from logs generated by the FileAccessed event in Office 365, providing detailed insight into file accesses in environments such as OneDrive and SharePoint. It is intended to support CMMC Level 1 (AU.1.001) compliance, which requires capturing audit logs for basic security events.<br/><br/>Logging these events is critical to establishing information traceability, assisting in the investigation of security incidents, and ensuring compliance with auditing and data protection policies. Additionally, this report provides a foundation for future improvements in the security and monitoring of the organization's digital environment.
strategy: ANY
checks:
  - key: o365-file-accessed
    name: O365 File Accessed
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS_ONE_OF_TERMS
        value:
          - FileAccessed
          - FileAccessedExtended
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-file-accessed-by-object
    name: O365 File Accessed by Object
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS_ONE_OF_TERMS
        value:
          - FileAccessed
          - FileAccessedExtended
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
