id: cmmc-2.0-766
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (SI.3.219): Kerberos Service Ticket'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4769, which is triggered when a Kerberos authentication request is successfully processed in the network environment. This event is critical to comply with CMMC control SI.3.219, which requires the implementation of network monitoring to detect attacks.<br/><br/>Event 4769 provides details about Kerberos service ticket requests. Monitoring these types of events is essential to identify unusual activities, such as attempts to exploit vulnerabilities in the Kerberos protocol, replay attacks, or lateral movement of attackers within the network.<br/><br/>This report allows you to detect suspicious behavior that could indicate unauthorized access or attempts to abuse privileges through the Kerberos protocol. Additionally, it facilitates the ability of security teams to investigate potential authentication-related incidents and prevent potential attacks before they compromise the organization's sensitive systems, contributing to CMMC compliance and strengthening infrastructure protection.
strategy: ANY
checks:
  - key: windows-kerberos-service-ticket
    name: Windows Kerberos Service Ticket
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4769')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-kerberos-service-ticket-by-encryption-type
    name: Windows Kerberos Service Ticket by Encryption Type
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4769')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
