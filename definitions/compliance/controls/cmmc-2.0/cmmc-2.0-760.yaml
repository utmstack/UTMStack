id: cmmc-2.0-760
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (SI.4.221): Process Termination'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4689, which is activated when a process or service ends its execution on the system. This event is key to complying with CMMC control SI.4.221, which requires the use of automated tools to detect and respond to network anomalies.<br/><br/>Event 4689 provides details about the termination of processes in the system, allowing you to monitor the activities taking place on the network and detect unusual behavior, such as the termination of unexpected or malicious processes. Monitoring this event helps identify potential attacks, intrusions, or malware that attempt to disrupt critical systems or evade detection of malicious activity.<br/><br/>This report is essential to ensure that security teams are capable of detecting and responding to anomalies in the network in an automated manner, allowing rapid and effective intervention in the event of any event that may jeopardize the security of the system. Additionally, it contributes to compliance with CMMC guidelines by ensuring that appropriate tools are implemented for the detection and response to incidents related to malicious activities within the network infrastructure.
strategy: ANY
checks:
  - key: windows-process-termination
    name: Windows Process Termination
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4689')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-termination-by-process
    name: Windows Process Termination by Process
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4689')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
