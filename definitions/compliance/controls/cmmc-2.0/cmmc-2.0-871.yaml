id: cmmc-2.0-871
family: cmmc-2.0
familyName: CMMC
name: 'AWS Level 1 (AC.1.001): Access Roles Assumption'
scope: data
statement: This report presents a detailed analysis of AssumeRole events in AWS, with the objective of verifying that access to the systems is restricted to authorized users only. Through role assumption records, compliance with CMMC practice AC.1.001 is reviewed, which establishes the limitation of access to systems and data to duly authorized users and roles. The report includes key details such as the role assumed, among others, ensuring that only legitimate actors can obtain additional privileges on the systems.
strategy: ANY
checks:
  - key: aws-access-roles-assumption
    name: AWS Access Roles Assumption
    dataType: aws-cloudtrail
    filters:
      - field: log.eventName
        operator: IS
        value: AssumeRole
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-access-roles-assumption-by-source-ip
    name: AWS Access Roles Assumption by Source IP
    dataType: aws-cloudtrail
    filters:
      - field: log.eventName
        operator: IS
        value: AssumeRole
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
