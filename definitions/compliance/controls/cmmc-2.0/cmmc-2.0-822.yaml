id: cmmc-2.0-822
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): Protected Object Permission Change'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4670, which is triggered when the permission settings of an object, including files, folders, or registry keys, are modified. This event is crucial to comply with CMMC Level 1 control AU.1.001, which requires the capture and review of audit logs to ensure the security of the computing environment.<br/><br/>Event 4670 provides details about changes made to access permissions to system objects. This information is essential to monitor and audit access to sensitive resources within the system.<br/><br/>Monitoring modifications to object permissions is essential to detect unauthorized changes that may indicate attempted privilege escalation, malicious moves, or manipulations of critical configurations. In addition, the collection of these logs allows a detailed review of the actions taken, which is key to ensuring that access controls are being applied appropriately and in accordance with security policies.<br/><br/>This report facilitates compliance with CMMC Level 1 control AU.1.001, ensuring that audit logs related to permit modifications are adequately captured and reviewed, contributing to the detection and mitigation of possible security incidents within the company's infrastructure. organization.
strategy: ANY
checks:
  - key: windows-protected-object-permission-change
    name: Windows Protected Object Permission Change
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4670'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-distribution-of-protected-object-permission-change
    name: Windows Process Distribution of Protected Object Permission Change
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4670'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
