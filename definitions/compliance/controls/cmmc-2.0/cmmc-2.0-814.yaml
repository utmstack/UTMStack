id: cmmc-2.0-814
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): Account Logon Failure'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4625, which is triggered when a login attempt fails on the system. This event is critical to compliance with CMMC Level 1 control AU.1.001, which requires capturing audit logs for review.<br/><br/>Event 4625 provides details about failed login attempts. This type of information is crucial for detecting unauthorized access or security breach attempts, such as brute force attacks or password guessing attempts.<br/><br/>Collecting and reviewing logs from this event is essential to comply with security audit policies, allowing security teams to quickly identify and respond to suspicious patterns or repeated failed system access attempts. Additionally, these logs are useful for performing forensic analysis in the event of security incidents, contributing to the improvement of preventive defenses.<br/><br/>This report supports the implementation of appropriate auditing practices, ensuring that user activity logs are captured and reviewed, in line with CMMC Level 1 requirements. Through this review, adequate control over access can be maintained. to systems and detect potential security threats before they compromise infrastructure.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    dataType: wineventlog
    filters:
      - field: log.statusDescription
        operator: IS_ONE_OF_TERMS
        value:
          - Logon failure
          - Clients credentials have been revoked
          - Pre-authentication information was invalid
          - Account restriction
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
