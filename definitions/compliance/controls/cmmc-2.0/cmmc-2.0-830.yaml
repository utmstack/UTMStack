id: cmmc-2.0-830
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.053): Account Authentication Using NTLM'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4776, which is triggered when there is an attempt to authenticate a user using a username and password in a network environment. This event is key to meeting CMMC Level 4 control AU.4.053, which requires enhancing audit logs with advanced forensic analysis capabilities to detect and respond to security incidents.<br/><br/>Event 4776 provides details about authentication attempts that were not successful. This information is crucial for identifying attack patterns, such as unauthorized access attempts, brute force attacks, or phishing attempts.<br/><br/>Monitoring this event with an advanced forensic approach allows security teams to perform deeper analysis on failed authentication attempts. For example, they can correlate multiple failed attempts from different locations, which could indicate a distributed attack or privilege escalation effort. Additionally, this event can provide valuable information to trace an attacker's path through the network and improve incident response capabilities.<br/><br/>This report contributes to compliance with CMMC Level 4 control AU.4.053 by providing detailed analysis of failed authentication attempts and improving auditing capabilities through an advanced forensic approach. By doing so, it helps strengthen security by more effectively detecting and analyzing threats that could put the organization's infrastructure at risk.
strategy: ANY
checks:
  - key: windows-account-authentication-using-ntlm
    name: Windows Account authentication using NTLM
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4776'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-account-authentication-using-ntlm-by-outcome
    name: Windows Account authentication using NTLM by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4776'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
