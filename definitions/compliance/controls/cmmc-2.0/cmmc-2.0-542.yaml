id: cmmc-2.0-542
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (SI.3.217): Access to Shared Resources'
scope: data
statement: It allows you to verify that the system is recording access to network resources appropriately, which helps comply with level 4 (AU.4.053) of the CMMC. Additionally, you can see that the events are being correctly classified with important details about the user, type of access, and source of access (IP and port), which is essential to comply with access monitoring and auditing policies on a network.
strategy: ANY
checks:
  - key: windows-access-to-shared-resources
    name: Windows Access to Shared Resources
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('5140', '5145'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-access-to-shared-resources-by-resource
    name: Windows Access to Shared Resources by Resource
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('5140', '5145'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
