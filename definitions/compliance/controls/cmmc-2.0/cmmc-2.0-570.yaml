id: cmmc-2.0-570
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.054): Changes to Defender settings'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 5007, which is recorded when changes are made to the Windows audit policy configuration. This event is critical to comply with CMMC control AU.4.054, which requires the implementation of advanced event correlation to detect evolving threats.<br/><br/>Event 5007 can indicate legitimate modifications to audit policies, but it can also be a sign of malicious activity, such as attempts to disable security monitoring or evade detection of suspicious events. By correlating it with other security events, such as changes in user privileges, unusual access or disabling of security services, it is possible to identify patterns that suggest attempts at manipulation or compromise of the system.<br/><br/>This report makes it easier to detect potential advanced threats by providing visibility into alterations to auditing configurations. In addition, it contributes to CMMC compliance by strengthening the ability to monitor and analyze critical events that may affect the organization's security.
strategy: ANY
checks:
  - key: windows-changes-to-defender-settings
    name: Windows Changes to Defender settings
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5007'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-changes-to-defender-settings-by-host
    name: Windows Changes to Defender settings by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5007'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
