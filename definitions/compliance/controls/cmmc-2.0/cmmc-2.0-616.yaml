id: cmmc-2.0-616
family: cmmc-2.0
familyName: CMMC
name: 'AWS Level 2 (AU.2.042): DescribeLogGroups Logs'
scope: data
statement: This report collects and analyzes relevant information about DescribeLogGroups events in AWS, with the objective of verifying compliance with CMMC practice AU.2.042. Its purpose is to ensure that queries to log groups in Amazon CloudWatch Logs are recorded and monitored for the detection and analysis of security events.<br/><br/>The report includes key details such as the account involved, the user or service that made the request, the source IP address, the time of the event, and the source of the request. This information is essential to audit the access and display of log groups, identifying possible unauthorized activities and ensuring proper collection and monitoring of logs in the AWS environment.
strategy: ANY
checks:
  - key: aws-describeloggroups-logs
    name: AWS DescribeLogGroups Logs
    dataType: aws-cloudtrail
    filters:
      - field: log.eventName
        operator: IS
        value: DescribeLogGroups
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-describeloggroups-logs-by-region
    name: AWS DescribeLogGroups Logs by Region
    dataType: aws-cloudtrail
    filters:
      - field: log.eventName
        operator: IS
        value: DescribeLogGroups
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
