id: cmmc-2.0-802
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (SI.4.221): Service Control Manager Log Information'
scope: data
statement: This event is logged when a Windows service fails to start due to an error and may be linked to system services that are responsible for managing and controlling other services, including those involved in system security and monitoring.<br/><br/>The Service Control Manager manages interactions between Windows services, and when a service that should be monitoring or protecting the system against threats (such as malware detection) fails, event 7030 is an indication that something has gone wrong. This event is important because it can alert you to attempts to disable critical services that help protect the system.<br/><br/>In the context of CMMC Level 4, where automation of malware detection and response is required, the logs generated by SCM allow the identification of failures that could have been caused by a malicious attempt to disable security or monitoring services.<br/><br/>So, event 7030, being part of the SCM logs, has a direct relationship with monitoring the health of system services, especially those related to security and incident response, which is crucial to comply with CMMC Level 4 control SI.4.221.
strategy: ANY
checks:
  - key: windows-service-control-manager-log-information
    name: Windows Service Control Manager Log Information
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '7030')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-service-control-manager-log-information-distribution-by-host
    name: 'Windows Service Control Manager Log Information Distribution by Host '
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '7030')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
