id: cmmc-2.0-746
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.044): Unlocked Account'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4767, which is triggered when a user account is unlocked after being locked out due to failed login attempts or security policy violations. This event is crucial to comply with CMMC control AU.3.044, which requires maintaining logs for advanced review and appropriate response to security incidents.<br/><br/>Event 4767 provides details about the unlocked account. Monitoring this event allows us to detect situations in which a previously blocked account is restored, which could be indicative of a change in user behavior, or in some cases, a possible attempt to evade security measures.<br/><br/>This report is essential to retain logs of events related to account unlocking, which facilitates investigation and response to security incidents. By storing this information, security teams can perform advanced screening to identify suspicious patterns, contributing to rapid detection of potential threats. Additionally, this process helps ensure CMMC compliance by ensuring that account unlock events are appropriately reviewed and can be used for effective incident response.
strategy: ANY
checks:
  - key: windows-unlocked-account-by-subject-user
    name: Windows Unlocked Account by Subject User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4767'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-unlocked-account
    name: Windows Unlocked Account
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4767'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
