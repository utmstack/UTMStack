id: cmmc-2.0-1234
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 1 (SI.1.210): Changes Applied to Mailboxes'
scope: data
statement: 'This report gathers relevant information from logs generated by the Set-Mailbox event in Office 365, which is used to monitor configuration changes to user mailboxes. These events can reflect administrative actions that directly affect account security, such as permission modifications, email redirects, or changes to retention policies.<br/><br/>Monitoring these types of events is essential for compliance with CMMC Level 1 (SI.1.210): Identify and correct system flaws, including malware, as it allows for identifying potential system configuration flaws, malicious or unauthorized activity, and for a timely response to anomalies that could compromise the integrity of email services. This monitoring helps maintain a secure environment, detect potential attack vectors, and proactively apply corrective measures.'
strategy: ANY
checks:
  - key: o365-changes-applied-to-mailboxes
    name: O365 Changes Applied to Mailboxes
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'Set-Mailbox')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-changes-applied-to-mailboxes-by-user-type
    name: O365 Changes Applied to Mailboxes By User Type
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'Set-Mailbox')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
