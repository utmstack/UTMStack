id: cmmc-2.0-747
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.044): Kerberos pre-authentication failed'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4771, which is triggered when a login attempt via Kerberos is unsuccessful due to an authentication failure. This event is essential to comply with CMMC control AU.3.044, which requires retaining logs for advanced review and appropriate response to security incidents.<br/><br/>Event 4771 captures details about failed login attempts using the Kerberos protocol. Monitoring these events is key to identifying potential unauthorized access attempts or suspicious activities, such as brute force attacks or credential exploitation attempts.<br/><br/>This report is essential to maintain detailed records of failed login attempts and enable advanced review in case of security incidents. By storing this information, security teams can investigate patterns of failed attempts, detect unusual behavior, and take steps to prevent unauthorized access. Additionally, it contributes to CMMC compliance by ensuring that records are adequate for analysis and response to potential security incidents.
strategy: ANY
checks:
  - key: windows-kerberos-pre-authentication-failed
    name: Windows Kerberos pre-authentication failed
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4771'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-kerberos-pre-authentication-failed-by-user
    name: Windows Kerberos pre-authentication failed by User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4771'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
