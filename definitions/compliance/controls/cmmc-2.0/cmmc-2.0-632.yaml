id: cmmc-2.0-632
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.043): Local Security Group Member Removal'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4733, which is triggered when a user is removed from a security group. This event is crucial to comply with CMMC control AU.2.043, which requires log review and correlation of events to detect inappropriate activities.<br/><br/>Analysis of this event allows us to identify when a user is removed from a security group, which could indicate changes in access privileges, either for legitimate reasons or due to possible malicious activity. Correlating this event with other system logs helps detect unusual patterns that could signal attempted privilege escalation or lateral movements within the network, helping to identify activities that could compromise system security.<br/><br/>This report contributes to compliance with CMMC regulations by providing visibility into changes in access configurations and helping to identify anomalous behavior that may be indicative of inappropriate actions.
strategy: ANY
checks:
  - key: windows-local-security-group-member-removal
    name: Windows Local Security Group Member Removal
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4733'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-local-security-group-member-removal-by-group
    name: Windows Local Security Group Member Removal by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4733'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
