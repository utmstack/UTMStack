id: cmmc-2.0-790
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AC.3.027): Use of Elevated Privileges'
scope: data
statement: This report compiles relevant information from the Windows logs generated by events 4673 and 4674, which are related to monitoring the activity of privileged accounts. Event 4673 is triggered when a privileged user attempts to access a sensitive action, while event 4674 signals the performance of a privileged type operation on a system. Both events are critical to complying with CMMC Level 3 control AC.3.027, which requires monitoring and restricting the use of privileged access in the IT infrastructure.<br/><br/>Event 4673 provides information about the initiation of an attempt to use elevated privileges, and event 4674 is associated with the actual execution of these actions, such as installing software, modifying critical configurations, or accessing sensitive information. Together, they provide detailed insight into how and when privileged users interact with the system, which is essential for detecting and preventing inappropriate uses of privileges.<br/><br/>This report contributes to security by identifying patterns of activity that could indicate privilege abuse or attempted exploitation of privileged accounts, allowing stricter controls to be applied to restrict unauthorized access and closely monitor critical actions performed by privileged users. . In addition, it is a key tool to ensure that security policies and segregation of privileges are respected, minimizing the risks of unwanted or malicious access.<br/><br/>Monitoring these events directly contributes to compliance with AC.3.027 of CMMC Level 3, improving the organization's capabilities to restrict and monitor the use of privileged access, and ensuring that only authorized users can perform critical activities on the systems.
strategy: ANY
checks:
  - key: windows-use-of-elevated-privileges
    name: Windows Use of Elevated Privileges
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4673'
          - '4674'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-use-of-elevated-privileges-by-outcome
    name: Windows Use of Elevated Privileges by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4673'
          - '4674'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
