id: cmmc-2.0-776
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (CM.3.068): Certificate Configuration Changes'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 5058, which is triggered when a private key is loaded or modified in Windows Key and Certificate Manager. This event is crucial to comply with CMMC Level 3 control CM.3.068, which requires the implementation of controls to manage system configurations.<br/><br/>Event 5058 allows you to monitor changes in cryptographic key management, which is essential to detect possible attempts at certificate manipulation, unauthorized access to private keys, or improper configurations that may compromise system security. Identifying and recording these changes helps prevent attacks based on altered credentials or misuse of digital certificates.<br/><br/>This report provides visibility into changes to the key and certificate infrastructure, allowing security teams to evaluate the integrity of cryptographic mechanisms and ensure compliance with organizational security policies, thus strengthening risk management and protection of assets. critical assets.
strategy: ANY
checks:
  - key: windows-certificate-configuration-changes
    name: Windows Certificate Configuration Changes
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '5058')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-certificate-configuration-changes-by-key-name
    name: Windows Certificate Configuration Changes by Key Name
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '5058')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
