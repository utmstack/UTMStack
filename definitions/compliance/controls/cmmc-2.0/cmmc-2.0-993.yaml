id: cmmc-2.0-993
family: cmmc-2.0
familyName: CMMC
name: Windows Software installation failure
scope: data
statement: This report collects and analyzes Windows event log events 11708, which indicate failures in installing software through the MsiInstaller service.<br/><br/>The purpose of the report is to identify and evaluate failed application installation attempts on monitored systems, allowing for proactive review of potential configuration, permissions, or software integrity issues.<br/><br/>Within the framework of CMMC's Disaster Recovery and Business Continuity Monitoring (Cybersecurity Maturity Model Certification), this report contributes to change management and operational continuity, ensuring that critical systems are not affected by errors in software implementation. Key details relevant to incident resolution are included.
strategy: ANY
checks:
  - key: windows-software-installation-failure
    name: Windows Software installation failure
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '11708'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-software-installation-failure-by-os
    name: Windows Software installation failure by OS
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '11708'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
