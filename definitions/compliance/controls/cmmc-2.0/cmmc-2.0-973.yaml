id: cmmc-2.0-973
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (SC.4.229): Cleaned Event Log'
scope: data
statement: This report compiles relevant information from the logs of Windows Security Auditing event 1102 (Audit log cleared), used to verify compliance with CMMC Level 4 (SC.4.229), which seeks to improve cryptographic protections with advanced tools. Event 1102 is generated when the security audit log is deleted, which could affect the integrity of cryptographic tools and processes that protect sensitive information, including Controlled Unclassified Information (CUI). Monitoring these types of events is essential to detect attempts to tamper with or delete audit logs, which could include activities related to the use of cryptography or key management. This report provides visibility into actions that may compromise the traceability of crypto-related events, allowing administrators to take immediate action if an anomaly is identified that puts the security and integrity of the organization's cryptographic infrastructure at risk.
strategy: ANY
checks:
  - key: windows-cleaned-event-log
    name: Windows Cleaned Event Log
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-cleaned-event-log-by-source
    name: Windows Cleaned Event Log by Source
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
