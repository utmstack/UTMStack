id: cmmc-2.0-829
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): Cleaned Event Log'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 1102, which is activated when a shutdown or restart of the security logs is performed on the system. This event is crucial to comply with CMMC Level 3 control AU.3.045, which requires ensuring audit logs are available for review during security investigations.<br/><br/>Event 1102 provides details about when and why security logs were closed or reset, which is essential for monitoring the integrity of audit logs. In the context of security management, it is essential to ensure that logs are not lost or tampered with, as they could contain critical information about past security events, such as unauthorized access attempts or malicious activities within the network.<br/><br/>Monitoring this event allows security teams to detect if logs were closed or restarted by unauthorized users, which could indicate an attempt to hide illicit activities or tamper with evidence in the event of an attack or security incident. The correct management and storage of these logs are essential for the investigation after any security incident, ensuring that all necessary information is available for analysis and possible recovery.<br/><br/>This report contributes to compliance with CMMC Level 3 control AU.3.045 by ensuring that security logs remain accessible and are securely stored for review, allowing security teams to conduct detailed investigations into any suspicious activity or incident. that has taken place in the system.
strategy: ANY
checks:
  - key: windows-cleaned-event-log
    name: Windows Cleaned Event Log
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-cleaned-event-log-by-source
    name: Windows Cleaned Event Log by Source
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
