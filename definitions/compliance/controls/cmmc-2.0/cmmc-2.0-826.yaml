id: cmmc-2.0-826
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): Object Deletion'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4660, which is triggered when an object, such as a file or directory, is opened or modified. This event is especially important to comply with CMMC Level 3 control AU.3.045, which requires ensuring that logs are available for investigation in the event of security incidents.<br/><br/>Event 4660 provides details about actions performed on system objects. Additionally, it includes information about the user who performed the action, the exact date and time, and the identifier of the affected object. This information is crucial for detailed tracking of activities performed on critical data and resources within the organization's technological infrastructure.<br/><br/>Monitoring 4660 events is essential to identify suspicious changes to file systems, such as unauthorized deletion or alteration of important files, which may be indicative of a security breach or malicious activity. By keeping these logs available for review, incident investigation and forensic analysis are facilitated, allowing the origins and scope of potential security compromises to be traced.<br/><br/>This report supports compliance with CMMC Level 3 control AU.3.045, by ensuring that the logs of critical events related to the manipulation of objects and system resources are accessible, well managed and prepared to be analyzed during security investigations, improving the organization's ability to detect and respond to threats.
strategy: ANY
checks:
  - key: windows-object-deletion
    name: Windows Object Deletion
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4660')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-object-deletion-by-subject-user
    name: Windows Object Deletion by Subject User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4660')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
