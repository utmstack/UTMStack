id: cmmc-2.0-733
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.044): User Accounts Created'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4720, which is triggered when a new user account is created on the system. This event is crucial to comply with CMMC control AU.2.044, which requires review of audit logs to identify inappropriate behavior or suspicious activities.<br/><br/>Event 4720 provides details on creating user accounts. By reviewing and correlating this data with other activity logs, unusual patterns can be detected, such as account creation without justification or at unusual times, which could indicate malicious behavior or attempted privilege escalation.<br/><br/>This report makes it easy to identify potential inappropriate activities related to user account management, allowing security teams to quickly investigate and act on any unauthorized access attempts or account misuse. Additionally, contributes to compliance with CMMC regulations by ensuring that events that may flag suspicious behavior within the organization are appropriately reviewed.
strategy: ANY
checks:
  - key: windows-user-accounts-created
    name: Windows User Accounts Created
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-new-accounts-created-over-time
    name: Windows New Accounts Created Over Time
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
