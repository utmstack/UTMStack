id: cmmc-2.0-565
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): Access to Shared Resources'
scope: data
statement: This report compiles relevant information from the Windows logs generated by events 5140 and 5145, which are activated when accessing shared resources on the network. These events are critical to comply with CMMC control AU.3.045, which requires correlation of security events to identify suspicious behavior and detect malicious activity.<br/><br/>Events 5140 and 5145 provide details about shared resource accesses, including user identity, connection origin, and assigned permissions. By correlating these events with other activity logs, such as unauthorized access attempts or modifications to sensitive files, patterns can be identified that indicate potential threats, such as data exfiltration or lateral movements within the network.<br/><br/>This report helps detect suspicious events related to access to shared resources, allowing preventive measures to be taken against possible internal or external attacks. Additionally, it contributes to compliance with CMMC regulations by ensuring effective monitoring and correlation of key events for infrastructure protection.
strategy: ANY
checks:
  - key: windows-access-to-shared-resource
    name: Windows Access to shared resource
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5145'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-accesses-by-share-type
    name: Windows Accesses by share type
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5145'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
