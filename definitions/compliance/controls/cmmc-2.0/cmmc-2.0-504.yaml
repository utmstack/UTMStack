id: cmmc-2.0-504
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (SI.2.212): Filtering Platform'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 5158, related to the Windows Filtering Platform (WFP), with the objective of supporting compliance with control SI.2.212 of CMMC Level 2, which requires the implementation of mechanisms to real-time monitoring of security events.<br/><br/>Event 5158 is triggered when a network connection is allowed through the Windows Filtering Platform, a key component in the Windows network traffic filtering infrastructure. This system monitors and controls network traffic, allowing the detection of unauthorized or malicious connections and ensuring that only authorized connections can access system resources.<br/><br/>This report allows you to identify traffic patterns and network access, detecting possible threats or suspicious activities through the filtering platform. The data provided by event 5158 is essential to implement intrusion detection and prevention measures in real time, contributing to the early identification of security incidents.<br/><br/>In this way, the analysis of this event helps satisfy the requirements of CMMC Level 2 (SI.2.212), by providing continuous visibility of network connections and ensuring that security monitoring mechanisms are effective for the protection of network connections. systems and information.
strategy: ANY
checks:
  - key: windows-filtering-platform
    name: Windows Filtering Platform
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5158'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-filtering-platform-by-protocol
    name: Windows Filtering Platform by Protocol
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5158'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
