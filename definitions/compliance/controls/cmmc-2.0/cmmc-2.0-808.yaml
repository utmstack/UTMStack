id: cmmc-2.0-808
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.053): Use of Elevated Privileges'
scope: data
statement: 'This report compiles relevant information from the Windows logs generated by events 5061, 4673 and 4674, which are related to the access and manipulation of security objects and policies in the system. These events are crucial to compliance with CMMC Level 4 control SI.4.221, which requires automation of malware detection and response.<br/><br/>Event 5061: This event is triggered when a cryptography operation is performed, which may indicate malicious encryption attempts, such as ransomware attacks.<br/>Events 4673 and 4674: These events are generated when significant changes are made to security policies, such as the creation, modification, or deletion of critical objects, which could be an attempt to alter system configuration to facilitate attacks or circumvent security measures. security.<br/><br/>Automated collection and analysis of these events can detect patterns of anomalous behavior associated with the presence of malware, such as manipulation of security settings or execution of malicious encryption processes. Automation in the detection and response to these events is vital to mitigate the impact of any attempted infection or alteration of systems quickly and efficiently.<br/><br/>This report helps security teams implement automatic controls to monitor and respond to incidents related to security policy manipulation and cryptography, contributing to the prevention of attacks and strengthening the organization''s security posture. In addition, it reinforces compliance with CMMC Level 4 control SI.4.221, ensuring that the detection and response to possible threats is carried out in an effective and automated manner.'
strategy: ANY
checks:
  - key: windows-use-of-elevated-privileges
    name: Windows Use of Elevated Privileges
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4673', '4674'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-use-of-elevated-privileges-by-outcome
    name: Windows Use of Elevated Privileges by Outcome
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4673', '4674'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
