id: cmmc-2.0-753
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (SI.2.216): Process Creation'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4688, which is triggered when a new process is created on the system. This event is critical to comply with CMMC control SI.2.216, which requires detection of malicious code and response to malware infections.<br/><br/>Event 4688 provides details about the started processes, which is essential to identify suspicious processes that could be related to malware, such as unauthorized or unexpected programs running on the system. By analyzing this event, unusual activities can be identified that could indicate the presence of malicious software.<br/><br/>This report facilitates early malware detection by identifying potentially harmful processes that start on the system. It also allows security teams to investigate the source of suspicious processes and take corrective action before a more serious infection occurs. Additionally, it contributes to CMMC compliance by ensuring that risks associated with malware are proactively identified and managed.
strategy: ANY
checks:
  - key: windows-process-creation
    name: Windows Process Creation
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4688')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-creation-by-parent-process
    name: Windows Process Creation By Parent Process
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4688')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
