id: cmmc-2.0-767
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 5 (SI.5.223): Application of Group Policies Errors'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 1058, which is triggered when a problem accessing network resources or group policy files prevents the system from completing the update or application of security policies. . This event is essential to comply with CMMC control SI.5.223, which requires improving detection capabilities on endpoints using advanced tools.<br/><br/>Event 1058 provides details on failures in the update of group policies due to errors in accessing files or resources on the network, which may be indicative of an attempt to interfere with security settings or a system anomaly. Since group policies are essential for system security and configuration, any errors in your application could signal a tampering attack or the presence of malware attempting to bypass security settings.<br/><br/>This Reporting is crucial for detecting and responding to anomalies related to system configuration and security, helping to ensure that endpoints follow appropriate security policies. Additionally, it contributes to CMMC compliance by ensuring that advanced tools are used to detect failures and threats that may compromise the integrity of the organization's systems.
strategy: ANY
checks:
  - key: windows-application-of-group-policies-errors
    name: Windows Application of Group Policies Errors
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1058')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-application-of-group-policies-errors-by-domain-controller
    name: Windows Application of Group Policies Errors by Domain Controller
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1058')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
