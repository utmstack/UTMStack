id: cmmc-2.0-837
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): Unexpected Logon Process Termination'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4005, which is activated when the system registers a failure in a user's login to the system. This event is essential to comply with CMMC Level 3 control AU.3.045, which requires that logs be available for security investigations in the event of incidents.<br/><br/>Event 4005 provides details about failed login attempts. Monitoring these events allows security teams to identify possible threats and take preventive measures in situations that may put the integrity of the infrastructure at risk.<br/><br/>The availability of these logs is essential to enable detailed investigations in the event of a security incident, such as an unauthorized access attempt or a targeted attack on the IT infrastructure. The information from event 4005 allows you to trace failed login attempts, helping to identify vulnerabilities or security gaps that can be exploited.<br/><br/>This report contributes to compliance with CMMC Level 3 control AU.3.045 by ensuring that logs of failed login attempts are stored and accessible for review in the context of security incident investigations. This improves threat detection capabilities and facilitates rapid response to potential security breaches.
strategy: ANY
checks:
  - key: windows-unexpected-logon-process-termination
    name: Windows Unexpected Logon Process Termination
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4005'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-unexpected-logon-process-termination-by-host
    name: Windows Unexpected Logon Process Termination by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4005'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
