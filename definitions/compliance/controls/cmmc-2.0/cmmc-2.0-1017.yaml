id: cmmc-2.0-1017
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 3 (AU.3.045): Mailbox Permission Assigning'
scope: data
statement: This report collects relevant information from the Add-MailboxPermission event logs in Office 365, in order to verify compliance with CMMC Level 3 (AU.3.045) control, which requires correlating security events to identify suspicious behavior. The Add-MailboxPermission event records actions related to the assignment of permissions to mailboxes in Exchange, including details about which permissions were granted to which users and on which mailboxes.<br/><br/>The information contained in this event is critical for monitoring permission assignment, as unauthorized changes to mailbox permissions can indicate unusual behavior, such as privilege escalation or improper access to sensitive data. This report helps identify which users have been granted additional access to mailboxes, whether the access was appropriate and authorized, or whether it is a suspicious change that could be indicative of an insider threat or compromise attempt.<br/><br/>Correlating these logs with other related events, such as access to sensitive files or changes to mailbox security settings, makes it easier to detect unusual patterns that could indicate malicious or unauthorized activity. This correlation of events also helps to identify potential fraudulent behavior, such as assigning permissions to unauthorized users to gain access to sensitive or controlled information.<br/><br/>This report contributes to the early identification of potential threats and the implementation of preventive measures, which reinforces the overall security of the system and ensures that mailbox permissions are properly managed, avoiding risks of improper access or loss of critical data.
strategy: ANY
checks:
  - key: o365-add-mailboxpermission
    name: O365 Add-MailboxPermission
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: Add-MailboxPermission
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-add-mailboxpermission-by-origin-server
    name: O365 Add-MailboxPermission by Origin Server
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: Add-MailboxPermission
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
