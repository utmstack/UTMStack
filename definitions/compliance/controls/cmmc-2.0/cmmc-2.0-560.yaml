id: cmmc-2.0-560
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.043): User Password Reset Attempt'
scope: data
statement: This report gathers relevant information from the Windows logs generated by event 4723, which refers to an attempt to change the password of a user account. This event is essential for compliance with CMMC control AU.2.043, which establishes the need to review logs and correlate events to detect inappropriate activities.<br/><br/>Analysis of this event helps identify unauthorized or failed password modification attempts, which may be an indicator of suspicious activity or account compromise attempts. Correlating this event with other relevant logs allows for more accurate detection of anomalous patterns or unusual behavior, thus improving the ability to prevent unauthorized access or malicious behavior.<br/><br/>This report supports compliance with CMMC regulations by ensuring that password modification actions are reviewed efficiently, contributing to the identification and mitigation of risks related to unauthorized access and the integrity of user accounts.
strategy: ANY
checks:
  - key: windows-user-password-reset-attempt
    name: Windows User Password Reset Attempt
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4723'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-password-reset-attempt-by-outcome
    name: Windows User Password Reset Attempt by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4723'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
