id: cmmc-2.0-730
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.044): Account Logon Failure'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4625, which is triggered when a login attempt to the system is unsuccessful. This event is critical to comply with CMMC control AU.2.044, which requires review of audit logs to detect inappropriate behavior and unauthorized activities.<br/><br/>Event 4625 provides key details about failed login attempts. By analyzing these events, patterns of failed access attempts can be identified that could indicate a brute force attack, an unauthorized access attempt, or the exploitation of compromised credentials.<br/><br/>This report makes it easy to detect suspicious behavior related to unauthorized access attempts, and by correlating this information with other system logs, security teams can identify trends that require a proactive response. Additionally, it contributes to CMMC compliance by ensuring adequate review and monitoring of audit events that may flag inappropriate or malicious activities.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-*
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_data.StatusDescription.keyword IN ('Logon failure', 'Clients credentials have been revoked', 'Pre-authentication information was invalid', 'Account restriction') AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
