id: cmmc-2.0-1028
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 2 (AU.2.041): Mailbox Permission Assigning'
scope: data
statement: This report compiles relevant information from the logs generated by the Add-MailboxPermission event in Office 365, providing visibility into the assignment of permissions on mailboxes within the Exchange Online environment. Its objective is to support compliance with CMMC Level 2 (AU.2.041), which requires the retention of audit logs for security events, ensuring the traceability of access and modifications in systems.<br/><br/>The report documents key data that allows you to detect suspicious activities, identify unauthorized changes to mailbox permissions, and strengthen your ability to respond to potential security incidents.<br/><br/>Retaining these events in audit logs is essential to ensure regulatory compliance, provide evidence in security investigations, and improve internal access controls to confidential information. In addition, it allows administrators to effectively monitor and manage access to corporate mailboxes, minimizing risks associated with the exposure of sensitive data.
strategy: ANY
checks:
  - key: o365-add-mailboxpermission
    name: O365 Add-MailboxPermission
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'Add-MailboxPermission')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-add-mailboxpermission-by-origin-server
    name: O365 Add-MailboxPermission by Origin Server
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'Add-MailboxPermission')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
