id: cmmc-2.0-783
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AC.2.007): Security Group Member Removal'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4729, which is triggered when a user is removed from a group with elevated privileges on the system. This event is key to complying with CMMC Level 2 control AC.2.007, which establishes the need to apply the principle of "least privilege" to ensure that users only have the permissions strictly necessary to perform their tasks.<br/><br/>Event 4729 provides details on changes affecting user groups, especially those linked to the removal of elevated privileges. By monitoring this event, organizations can verify that users are being appropriately removed from groups with additional privileges when they no longer need them or have a valid justification for maintaining them.<br/><br/>Monitoring and reviewing these types of events ensures that security is maintained within the IT infrastructure, minimizing the risk of privilege abuse or unauthorized access. Proper removal of excessive privileges is essential to prevent privilege escalations or improper access to sensitive systems and applications.<br/><br/>This report is essential to strengthen CMMC Level 2 compliance by ensuring that the principle of least privilege is consistently implemented and respected within the organization, reducing the risk of potential internal or external threats associated with unnecessary privileges.
strategy: ANY
checks:
  - key: windows-security-group-member-removal
    name: Windows Security Group Member Removal
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4729')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-security-group-member-removal-by-group
    name: Windows Security Group Member Removal by Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4729')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
