id: cmmc-2.0-736
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.044): Unlocked Account'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4767, which is triggered when a user account is unlocked on the system after being locked out due to failed login attempts. This event is crucial to comply with CMMC control AU.2.044, which requires review of audit logs to detect inappropriate or suspicious behavior.<br/><br/>Event 4767 provides details about the account that was unlocked, the account that performed the action, among others. By reviewing and correlating this data with other activity logs, anomalous patterns can be identified, such as attempts to unlock accounts at unusual times or by unauthorized accounts, which could signal attempts to circumvent security policies or unauthorized access.<br/><br/>This report is useful for detecting suspicious behavior related to the management of blocked accounts, allowing security teams to respond quickly to possible incidents. Additionally, contributes to compliance with CMMC regulations by ensuring effective review of events that may indicate inappropriate or malicious behavior within the organization.
strategy: ANY
checks:
  - key: windows-unlocked-account-by-subject-user
    name: Windows Unlocked Account by Subject User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4767'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-unlocked-account
    name: Windows Unlocked Account
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4767'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
