id: cmmc-2.0-751
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.053): Audit File integrity Validation Failed'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 5038, which is triggered when modification or deletion of an audit log file is detected or when unauthorized access is made to a protected log file. This event is essential to comply with CMMC control AU.4.053, which requires the implementation of integrity controls on audit logs to prevent their manipulation or alteration.<br/><br/>Event 5038 provides details about access to the log files, indicating whether there has been an alteration or inappropriate access to them. This information is crucial to ensuring the integrity of audit logs, helping to detect possible attempts to hide malicious activity or modify critical records.<br/><br/>This report is key to ensuring that audit logs are adequately protected against alterations or manipulations, allowing security teams to take immediate action if suspicious behavior is detected. By implementing effective integrity controls on logs, the reliability of the information used for analysis and response to security incidents is guaranteed. Additionally, it contributes to compliance with CMMC standards by ensuring that audit logs are kept protected from unauthorized modifications.
strategy: ANY
checks:
  - key: windows-audit-file-integrity-validation-failed
    name: Windows Audit File Integrity Validation Failed
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5038'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-audit-file-integrity-validation-failed-by-host-over-time
    name: Windows Audit File Integrity Validation Failed by Host Over Time
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5038'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
