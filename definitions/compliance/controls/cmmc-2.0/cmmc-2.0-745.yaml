id: cmmc-2.0-745
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.044): Account Authentication Using NTLM'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4776, which is triggered during failed authentication attempts on a system through the use of incorrect credentials. This event is crucial to comply with CMMC control AU.3.044, which requires maintaining event logs for advanced review and effective response to security incidents.<br/><br/>Event 4776 provides details about authentication attempts. By monitoring this event, patterns of failed login attempts can be identified, which could indicate brute force attacks or unauthorized attempts to access the system.<br/><br/>This report is essential to retain relevant logs that can be reviewed later to identify possible threats or security incidents. Additionally, by storing these events appropriately, security teams can conduct subsequent investigations if suspicious activity is detected. This also facilitates CMMC compliance by ensuring that authentication records are thoroughly reviewed and can be used in effective incident response or analysis.
strategy: ANY
checks:
  - key: windows-account-authentication-using-ntlm
    name: Windows Account authentication using NTLM
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4776'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-account-authentication-using-ntlm-by-outcome
    name: Windows Account authentication using NTLM by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4776'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
