id: cmmc-2.0-961
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (MP.3.123): Shared Network Object Creation'
scope: data
statement: This report gathers relevant information extracted from the event logs generated by Windows event 5142, which is related to the creation and configuration of network shares. This type of event is crucial for compliance with CMMC Level 3 control (MP.3.123), which establishes the need to protect the CUI during its transport and prevent any loss or exposure of it.<br/><br/>Windows event 5142 is triggered when a share is created on the system, which could involve exposing sensitive data if not configured properly. Through this report, the activity related to the creation of shared resources is monitored and audited, ensuring that these resources are configured correctly to prevent unauthorized access to CUI and guaranteeing that security controls are applied in accordance with the best practices established in the CMMC.<br/><br/>This report helps identify any shared resource creation events that may represent a risk in terms of CUI protection. In addition, it allows verifying the correct configuration of access and use policies for shared resources on the network, thus supporting the implementation of protection measures in the transport of CUI. In combination with other data monitoring and security measures, these logs provide key evidence to meet information protection requirements during its transfer in the corporate environment.
strategy: ANY
checks:
  - key: windows-shared-network-object-creation
    name: Windows Shared Network Object Creation
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '5142')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-shared-network-object-creation-by-user
    name: Windows Shared Network Object Creation by User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '5142')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
