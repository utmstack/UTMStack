id: cmmc-2.0-820
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): User Account Attributes Changes'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4738, which is triggered when a change is made to the user account information, such as modifying account attributes. This event is critical to comply with CMMC Level 1 control AU.1.001, which requires capturing and reviewing audit logs of changes to user accounts.<br/><br/>Event 4738 provides details about modifications made to an account. This information allows you to audit account changes and detect suspicious or unauthorized activity, such as unauthorized access to privileged accounts or alteration of critical accounts.<br/><br/>Monitoring changes to user accounts is essential to ensure the integrity of credentials and access permissions within the organization. This event helps identify whether changes were made in accordance with security policies and whether there were attempts to modify accounts without proper authorization.<br/><br/>This report supports compliance with AU.1.001 by ensuring that all changes to user accounts are appropriately recorded and monitored. By doing so, you help protect the organization's infrastructure against unauthorized account manipulation, ensuring that logs are reviewed to identify potential security incidents and maintaining traceability of actions taken on user accounts.
strategy: ANY
checks:
  - key: windows-user-account-attributes-changes
    name: Windows User Account Attributes Changes
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4738')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: distribution-of-account-attribute-changes-by-operating-system
    name: Distribution of Account Attribute Changes by Operating System
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4738')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
