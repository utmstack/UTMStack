id: cmmc-2.0-942
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AU.1.001): Account Logon Success'
scope: data
statement: This report consolidates relevant information from the Windows event 4624 logs to evaluate compliance with the CMMC Level 1 requirement (AU.1.001), which requires the capture of basic security events. By recording successful logins, these logs provide evidence of activity in the system, allowing the organization to maintain access traceability and strengthen its monitoring and incident response capabilities. The collection and analysis of these logs contributes to the early detection of threats, facilitating audits and ensuring compliance with established security controls.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4672'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4324'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: IS_NOT
        value: '-'
      - field: log.logonType
        operator: IS_ONE_OF_TERMS
        value:
          - '3'
          - '2'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
