id: cmmc-2.0-752
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 5 (AU.5.055): Log Automatic Backup'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 1105, which is triggered when the Windows Event Logging Service backs up the event logs. This event is important to comply with CMMC control AU.5.055, which requires the use of advanced tools to guarantee the integrity and availability of the logs.<br/><br/>Event 1105 provides details on event log backup operations, allowing you to verify the integrity of the logs and their availability for future review or incident investigation. Collecting this event helps ensure that audit logs are adequately backed up, protecting their retention from unauthorized modifications or data loss.<br/><br/>This report is essential to ensure that event logs are backed up regularly and effectively, which contributes to the integrity of the logs and their availability for security analysis and investigations. Additionally, it helps meet CMMC requirements by providing an additional layer of protection and ensuring that log backup mechanisms are properly implemented and monitored across the organization's IT infrastructure.
strategy: ANY
checks:
  - key: windows-log-automatic-backup
    name: Windows Log automatic backup
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1105'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-log-automatic-backup-by-date
    name: Windows Log Automatic Backup by Date
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1105'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
