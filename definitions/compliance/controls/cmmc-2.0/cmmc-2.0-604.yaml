id: cmmc-2.0-604
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 2 (AC.2.007): Security Role Update'
scope: data
statement: This report collects and presents relevant information about SecurityRoleUpdated events in Office 365 logs, with the objective of verifying compliance with CMMC practice AC.2.007. The focus of the report is on ensuring that security role updates are managed appropriately, ensuring that users have access only to the resources necessary according to their role and responsibility within the organization.<br/><br/>The report includes essential details such as the user whose security role was modified, the account that performed the action, the time of the event, among others. This information is key to ensuring that role-based access controls (RBAC) are being properly implemented and maintained, which contributes to the protection of sensitive data and helps prevent unauthorized access to critical systems and resources.
strategy: ANY
checks:
  - key: o365-security-role-update
    name: O365 Security Role Update
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: SecurityRoleUpdated
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-security-role-update-by-workload
    name: O365 Security Role Update By Workload
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: SecurityRoleUpdated
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
