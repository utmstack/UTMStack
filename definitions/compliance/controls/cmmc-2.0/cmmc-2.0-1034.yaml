id: cmmc-2.0-1034
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 1 (AU.1.001): Account Logon Success'
scope: data
statement: This report gathers key information from UserLoggedIn events in Office 365, recording login attempts within the organization's environment. The information contained in this report supports compliance with CMMC Level 1 requirement AU.1.001, ensuring that essential audit logs are captured and retained for review and analysis.<br/><br/>Monitoring these events helps identify successful and failed accesses, logged in users, source IP addresses, devices used, and geographic locations. This is critical for detecting unauthorized access, auditing user activity, and reinforcing the organization's security through regular reviews of authentication logs.
strategy: ANY
checks:
  - key: o365-ad-successful-login-location
    name: O365 AD Successful Login Location
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: UserLoggedIn
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-ad-successful-login-by-user
    name: O365 AD Successful Login by User
    dataType: o365
    filters:
      - field: log.UserId
        operator: IS_NOT
        value: Not Available
      - field: log.Operation
        operator: IS
        value: UserLoggedIn
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
