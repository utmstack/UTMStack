id: cmmc-2.0-768
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 5 (SI.5.223): Created and Terminated Processes'
scope: data
statement: This report compiles key information from the Windows logs generated by events 4688 and 4689, which are related to the creation of new processes and the termination of processes in the system. These events are essential to comply with CMMC control SI.5.223, which requires the use of advanced tools to improve detection capabilities on endpoints and detect suspicious or malicious behavior.<br/><br/>Event 4688 is triggered when a process is created on the system, providing details about the executable, the user who started the process, and the command line used. Event 4689, for its part, records when a process ends, which allows monitoring the activity of the processes in real time.<br/><br/>By reviewing these events, suspicious process execution, rogue applications, or malware activity can be detected, enabling rapid response to security incidents. Additionally, correlating these events with other system logs makes it easier to identify behavioral patterns that could signal an imminent threat.<br/><br/>This report is crucial to strengthening threat detection at the endpoint level, allowing security teams to identify and respond to malicious activity more effectively. Likewise, it contributes to CMMC compliance by improving monitoring and incident response capabilities, especially with respect to the execution and termination of processes in the organization's systems.
strategy: ANY
checks:
  - key: windows-created-and-terminated-processes
    name: Windows Created and Terminated Processes
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4689', '4688'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-created-and-terminated-processes-by-process
    name: Windows Created and Terminated Processes by Process
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4688', '4689'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
