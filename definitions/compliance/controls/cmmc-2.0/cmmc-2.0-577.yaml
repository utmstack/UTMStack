id: cmmc-2.0-577
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AC.2.007): Creation of Security-Enabled Local Group'
scope: data
statement: This report collects the records of event 4731 from the Windows logs, which document the creation of a security group on the system. This information is essential to verify compliance with CMMC's Level 2 Authentication and Access Control policy (AC.2.007), which requires the implementation of role-based access controls (RBAC), ensuring that access to the system is assigned. appropriately and only to users with the roles necessary for their functions. <br/><br/>The report includes key details such as the name, the identities of the administrators responsible for the creation, the date and time of the action, and any other information related to the group configuration. The analysis of these events ensures that the creation of security groups is carried out in a controlled manner, in line with established security policies, to facilitate effective management of user roles and permissions.
strategy: ANY
checks:
  - key: windows-creation-of-security-enabled-local-group
    name: Windows Creation of Security-Enabled Local Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4731')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-creation-of-security-enabled-local-group-by-group
    name: Windows Creation of Security-Enabled Local Group by Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4731')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
