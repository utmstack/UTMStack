id: cmmc-2.0-828
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): Windows Connection blocked by Windows Firewall'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 5158, which is triggered when a new network connection is allowed through a specific port on a system. This event is essential to comply with CMMC Level 3 control AU.3.045, which requires ensuring that logs are available for security investigations.<br/><br/>Event 5158 provides details about established network connections. Additionally, event 5158 shows whether the connection was allowed or blocked by system security policies, which is key to detecting unauthorized access or anomalous behavior in the network infrastructure.<br/><br/>Monitoring 5158 events is crucial to track the flow of information and accesses through the network, allowing you to identify suspicious connection attempts, possible vulnerabilities or malicious activities, such as a privilege escalation attack or lateral movement within the network. By keeping these logs available, organizations can conduct effective investigations in the event of a security incident, analyzing the source, connection type, and impact of any unauthorized access.<br/><br/>This report supports compliance with CMMC Level 3 control AU.3.045, ensuring that detailed logs on network connections are adequately stored, accessible and are part of the investigation process for potential incidents, strengthening threat response capacity and improving security. security on the corporate network.
strategy: ANY
checks:
  - key: windows-connection-blocked-by-windows-firewall
    name: Windows Connection blocked by Windows Firewall
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '5158')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-connection-blocked-by-application
    name: Windows Connection blocked by Application
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '5158')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
