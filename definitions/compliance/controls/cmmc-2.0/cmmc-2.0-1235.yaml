id: cmmc-2.0-1235
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 4 (CM.4.070): Changes Applied to Mailboxes'
scope: data
statement: This report provides a detailed analysis of the event logs generated by the Set-Mailbox cmdlet in Office 365, which is used to monitor and detect unauthorized changes to mailbox settings. The purpose of this report is to ensure compliance with Level 4 (CM.4.070) of the CMMC cybersecurity maturity model, which establishes the need to automate the detection of unauthorized changes to systems. By reviewing these logs, we aim to identify any inappropriate access or modification of mailbox settings, facilitating risk management and compliance with security regulations
strategy: ANY
checks:
  - key: o365-changes-applied-to-mailboxes
    name: O365 Changes Applied to Mailboxes
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'Set-Mailbox')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-changes-applied-to-mailboxes-by-user-type
    name: O365 Changes Applied to Mailboxes By User Type
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'Set-Mailbox')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
