id: cmmc-2.0-1006
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 1 (SI.1.210): Account Logon Success'
scope: data
statement: This report collects and analyzes UserLoggedIn event logs in Office 365 to verify compliance with CMMC Level 1 (SI.1.210), which requires the identification and correction of security breaches in a timely manner.<br/><br/>Monitoring logins allows you to detect potential unauthorized access, connection attempts from unusual locations or devices, and anomalous activities that may indicate security risks. By centralizing these events, the report facilitates the evaluation of user behavior, helping to identify suspicious patterns or potential vulnerabilities in the authentication infrastructure.<br/><br/>In addition, this analysis contributes to the implementation of timely corrective measures, ensuring a rapid response to security incidents and strengthening platform access controls.
strategy: ANY
checks:
  - key: o365-ad-successful-login-location
    name: O365 AD Successful Login Location
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation.keyword = 'UserLoggedIn')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-ad-successful-login-by-user
    name: O365 AD Successful Login by User
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.UserId.keyword <> 'Not Available' AND logx.o365.Operation.keyword = 'UserLoggedIn')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
