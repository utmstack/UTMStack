id: cmmc-2.0-810
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (SI.1.210): Process Termination'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4689, which is activated when a process finishes executing on the system. This event is crucial for the detection of suspicious activities, such as the termination of malware-related processes, and is essential to comply with CMMC Level 1 control SI.1.210, which requires identifying and correcting malware infections.<br/><br/>Event 4689 provides details about processes that have terminated. This information is valuable for correlating malicious processes with their initial creation and determining whether a malicious process was appropriately killed or stopped. Monitoring process termination is essential to identify if an attack has been contained or if a suspicious process has been stopped in time.<br/><br/>Tracking these events allows security teams to analyze process termination patterns, detect potential malware infections that could have been neutralized, and ensure that legitimate processes have not been stopped inappropriately. Additionally, early detection of terminating malicious processes may indicate an attempt by an attacker to conceal or remove evidence.<br/><br/>This report supports security teams in the identification and correction of malware infections, thus contributing to compliance with CMMC Level 1 control SI.1.210.
strategy: ANY
checks:
  - key: windows-process-termination
    name: Windows Process Termination
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4689'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-termination-by-process
    name: Windows Process Termination by Process
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4689'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
