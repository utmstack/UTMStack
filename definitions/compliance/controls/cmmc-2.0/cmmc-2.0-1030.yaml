id: cmmc-2.0-1030
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 2 (AU.2.041): File Synchronization'
scope: data
statement: This report gathers relevant information from the logs generated by the FileSyncDownloadedFull event in Office 365, which records when a user downloads a full file from SharePoint or OneDrive using file synchronization. Its purpose is to support compliance with CMMC Level 2 (AU.2.041), which requires the retention of audit logs for security events, ensuring traceability of interactions with the organization's critical data.<br/><br/>The report provides key details that allow identifying access patterns, detecting suspicious downloads of confidential information, and setting alerts for possible data exfiltrations.<br/><br/>Retaining these logs is essential for security and regulatory compliance, as it facilitates incident investigation, information access control, and the implementation of data protection strategies. By maintaining a detailed audit of these events, organizations can reinforce their security policies and mitigate risks associated with the loss or leakage of sensitive information.
strategy: ANY
checks:
  - key: o365-filesyncdownloadedfull
    name: O365 FileSyncDownloadedFull
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'FileSyncDownloadedFull')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-filesyncdownloadedfull-by-ip
    name: O365 FileSyncDownloadedFull by IP
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'FileSyncDownloadedFull')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
