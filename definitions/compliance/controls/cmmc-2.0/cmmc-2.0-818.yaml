id: cmmc-2.0-818
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): User Password Reset Attempt'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4723, which is triggered when a user tries to change their password. This event is critical to comply with CMMC Level 1 control AU.1.001, which requires capturing audit logs for review.<br/><br/>Event 4723 provides details about password change attempts. This type of information is essential for tracking and auditing credential modification attempts, allowing unusual or unauthorized activity to be detected.<br/><br/>Monitoring password change events is key to ensuring that authentication processes follow proper procedures and preventing malicious actors from gaining access to user accounts through unauthorized password changes. It also helps identify potential attack attempts, such as password guessing or privilege abuse.<br/><br/>This report contributes to compliance with AU.1.001 by ensuring that all events related to password change attempts are effectively recorded, monitored, and reviewed. In this way, it facilitates the detection of inappropriate actions and reinforces the security of the system, protecting access credentials and sensitive data.
strategy: ANY
checks:
  - key: windows-user-password-reset-attempt
    name: Windows User Password Reset Attempt
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4723'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-password-reset-attempt-by-outcome
    name: Windows User Password Reset Attempt by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4723'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
