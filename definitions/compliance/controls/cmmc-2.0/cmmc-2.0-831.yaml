id: cmmc-2.0-831
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.053): Kerberos pre-authentication failed'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4771, which is triggered when a Kerberos authentication attempt fails due to a problem with the user's credentials. This event is critical to meeting CMMC Level 4 control AU.4.053, which requires enhancing audit logs with advanced forensics capabilities to detect and respond to security incidents.<br/><br/>Event 4771 provides details about failed Kerberos authentication attempts. This information is valuable in identifying attack patterns, such as unauthorized access attempts, brute force attacks, or issues related to system configuration.<br/><br/>Monitoring this event with an advanced forensic approach allows security teams to perform a thorough analysis of failed authentication attempts, helping to identify potential spoofing or privilege escalation attempts. Additionally, event 4771 allows failed attempts to be correlated with other security events on the network, providing broader context to detect persistent threats and suspicious activity.<br/><br/>This report contributes to compliance with CMMC Level 4 control AU.4.053 by providing a detailed analysis of failed Kerberos authentication attempts. By improving audit logs and using advanced forensics, the organization can improve its ability to detect and respond to security incidents more effectively, strengthening protection against unauthorized access and attacks.
strategy: ANY
checks:
  - key: windows-kerberos-pre-authentication-failed
    name: Windows Kerberos pre-authentication failed
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4771'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-kerberos-pre-authentication-failed-by-user
    name: Windows Kerberos pre-authentication failed by User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4771'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
