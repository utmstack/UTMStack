id: cmmc-2.0-781
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (CM.4.070): Firewall Exception List Changed'
scope: data
statement: 'This report compiles relevant information from the Windows logs generated by event 4946, which is triggered when a change is made to the audit policies related to the system''s security configuration. This event is essential to comply with CMMC Level 4 control CM.4.070, which requires automation in the detection of unauthorized changes to systems.<br/><br/>Event 4946 provides details about changes to security auditing configurations, which could be used by malicious actors to modify auditing parameters in order to hide their activities or interfere with incident detection mechanisms. Monitoring this event makes it easier to identify unauthorized alterations to auditing configurations, allowing administrators to detect attempts to tamper with the system and act quickly.<br/><br/>Automating the detection of these changes is crucial to ensure that the security infrastructure remains intact and that any alterations to audit policies are detected without delay. This report helps organizations prevent malicious or unauthorized changes from going undetected, ensuring that systems integrity and audit policies are not compromised.<br/><br/>Automated monitoring of these types of events also contributes to CMMC Level 4 compliance by improving the organization''s ability to quickly detect and respond to security incidents, increasing overall threat protection and strengthening network security posture. '
strategy: ANY
checks:
  - key: windows-firewall-exception-list-changed
    name: Windows Firewall Exception List Changed
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4946'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-firewall-exception-list-changed-by-day
    name: Windows Firewall Exception List Changed by Day
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4946'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
