id: cmmc-2.0-732
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.044): Logins with explicit credentials'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4648, which is triggered when a user account is used to log on to a system with explicit credentials, such as using network credentials or a service account. This event is crucial to comply with CMMC control AU.2.044, which requires review of audit logs to detect inappropriate behavior.<br/><br/>Event 4648 provides details about login attempts with explicit credentials. By reviewing these types of logs, it is possible to identify unusual access or authentication attempts that may be related to unauthorized or malicious activity.<br/><br/>This report allows security teams to identify suspicious patterns of behavior, such as login attempts at unusual times or from unusual locations, which could indicate a possible attack. Furthermore, by correlating these events with other logs related to access or activities in the system, the detection of security incidents and inappropriate behavior is facilitated.<br/><br/>In summary, this report is an important tool to ensure compliance with CMMC regulations, helping to detect inappropriate behavior and ensuring that audit logs are appropriately reviewed to protect organizational infrastructure.
strategy: ANY
checks:
  - key: windows-logins-with-explicit-credentials
    name: Windows Logins with explicit credentials
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4648')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logins-with-explicit-credentials-by-user
    name: Windows Logins with explicit credentials by User
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4648')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
