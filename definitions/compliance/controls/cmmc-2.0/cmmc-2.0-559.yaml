id: cmmc-2.0-559
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.043): User Accounts Enabled'
scope: data
statement: This report gathers relevant information from the Windows logs generated by event 4722, related to the enablement of user accounts on the system. Event 4722 is crucial for compliance with CMMC AU.2.043, which requires log review and event correlation to identify inappropriate or suspicious activity.<br/><br/>The review of this event, in conjunction with other security records, facilitates the detection of irregularities in the management of user accounts, contributing to the early identification of unauthorized activities. Correlating events allows you to detect unusual patterns or actions, which helps prevent potential security incidents.<br/><br/>This report supports compliance with CMMC guidelines by ensuring that activities related to enabling user accounts are appropriately monitored, strengthening the ability to detect inappropriate behavior and mitigate risks.
strategy: ANY
checks:
  - key: windows-user-accounts-enabled
    name: Windows User Accounts Enabled
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4722'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-accounts-enabled-by-target-user
    name: Windows User Accounts Enabled by Target User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4722'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
