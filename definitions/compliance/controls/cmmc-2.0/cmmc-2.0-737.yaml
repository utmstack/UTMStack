id: cmmc-2.0-737
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AC.3.032): Special privileges assigned to new logon'
scope: data
statement: This report compiles relevant information from the Windows logs generated by event 4672, which is triggered when a user gains elevated privileges, such as administrator, through an interactive or remote login. This event is crucial to comply with CMMC control AC.3.032, which requires monitoring and controlling remote access to sensitive systems to prevent misuse of elevated privileges.<br/><br/>Event 4672 provides key details about logging in for elevated users. Monitoring these events helps identify the use of elevated accounts in remote sessions, helping ensure that only authorized users access critical or sensitive systems.<br/><br/>This report is essential to control remote access to sensitive resources, ensuring that access is appropriate and authorized. Additionally, it contributes to CMMC compliance by strengthening security policies to protect sensitive systems from unauthorized access.
strategy: ANY
checks:
  - key: windows-special-privileges-assigned-to-new-logon
    name: Windows Special privileges assigned to new logon
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4672' AND logx.wineventlog.event_data.SubjectUserName NOT LIKE '%$')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-special-privileges-assigned-to-new-logon-2
    name: Windows Special privileges assigned to new logon
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4672')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
