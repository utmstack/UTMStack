id: cmmc-2.0-576
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AC.2.007): Security Group Member Removal'
scope: data
statement: This report groups the records of event 4729 from the Windows logs, which document the removal of a user from a security group on the system. This information is crucial to verify compliance with CMMC's Authentication and Access Control Policy Level 2 (AC.2.007), which establishes the implementation of role-based access controls (RBAC), ensuring that users maintain access only to the resources necessary for their assigned functions and roles.<br/><br/>The report includes important details such as the identities of users removed from security groups, the name of the group to which they belonged, the date and time of the removal, and the account that made the modification. The analysis of these events allows us to verify that the management of roles and permissions is carried out in a controlled manner, ensuring that access is adequate and minimizing the risk of unauthorized access.
strategy: ANY
checks:
  - key: windows-security-group-member-removal
    name: Windows Security Group Member Removal
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4729'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-security-group-member-removal-by-group
    name: Windows Security Group Member Removal by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4729'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
