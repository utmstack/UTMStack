id: cmmc-2.0-1026
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 1 (AU.1.001): File Deleted'
scope: data
statement: This report compiles key information from logs generated by the FileDeleted event in Office 365, providing visibility into file deletion on platforms such as OneDrive and SharePoint. Its purpose is to support CMMC Level 1 (AU.1.001) compliance, which requires the capture of audit logs for basic security events.<br/><br/>The report documents essential details that enable security administrators to track file deletion activities, identify accidental or malicious actions, and prevent the loss of critical information.<br/><br/>Maintaining an accurate record of these events is critical for information traceability, incident investigation, and enforcement of security controls. Additionally, this report can contribute to the improvement of data access and retention policies within the organization, ensuring better information management and regulatory compliance.
strategy: ANY
checks:
  - key: o365-filedeleted
    name: O365 FileDeleted
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: FileDeleted
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-filedeleted-by-geo-location
    name: O365 FileDeleted by Geo Location
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: FileDeleted
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
