id: cmmc-2.0-758
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (SI.3.219): Logins with explicit credentials'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4648, which is triggered when a user session is authenticated using explicitly provided credentials (for example, username and password) to access network resources. This event is critical to comply with CMMC control SI.3.219, which requires the implementation of network monitoring to detect attacks.<br/><br/>Event 4648 provides details about authentication attempts made with explicit credentials, which is crucial for identifying both legitimate and potentially malicious access to critical systems and resources. Monitoring these types of events helps detect unusual behavior, such as unauthorized access attempts through network services or the use of compromised credentials.<br/><br/>This report is essential for detecting suspicious access patterns that could indicate malicious activity, such as brute force attacks, password guessing attempts, or lateral movement of an attacker within the network. It makes it easier for security teams to identify threats early and respond quickly to incidents involving unauthorized access or credential abuse, contributing to CMMC compliance by ensuring effective monitoring of critical systems and protection against attacks.
strategy: ANY
checks:
  - key: windows-logins-with-explicit-credentials
    name: Windows Logins with explicit credentials
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4648'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logins-with-explicit-credentials-by-user
    name: Windows Logins with explicit credentials by User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4648'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
