id: cmmc-2.0-1035
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 2 (AU.2.043): File Renamed'
scope: data
statement: This report compiles key information about FileRenamed events in Office 365, ensuring the protection and retention of audit records against unauthorized modifications, in compliance with CMMC Level 2 requirement AU.2.043.<br/><br/>Analysis of these events allows you to track when and by whom files have been renamed within your organization's environment, verify changes to sensitive documents, and ensure record integrity. The information included in this report is essential for detecting suspicious activity, auditing file modifications, and implementing controls that prevent unauthorized alteration of audit logs.
strategy: ANY
checks:
  - key: o365-file-renamed
    name: O365 File Renamed
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: FileRenamed
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-file-renamed-by-workload
    name: O365 File Renamed by Workload
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: FileRenamed
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
