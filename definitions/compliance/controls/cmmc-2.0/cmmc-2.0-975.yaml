id: cmmc-2.0-975
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (SC.3.177): TLS protocol Errors'
scope: data
statement: This report consolidates and analyzes Windows log event ID 36874, generated by Schannel when a TLS connection attempt fails due to a lack of compatibility between the ciphers supported by the client and the server. The information collected is key to verify compliance with CMMC Level 3 control SC.3.177, which requires the implementation of cryptographic protections for controlled unclassified information (CUI). The analysis of these events makes it possible to identify failed TLS connection attempts, evaluating whether the encryption algorithms in use meet the required security standards, detect insecure configurations, such as the absence of modern protocols or the use of obsolete cipher suites, and verify the integrity of the communication channel, ensuring that information in transit is protected against unauthorized access and man-in-the-middle (MITM) attacks. This report is essential for the audit and optimization of cryptographic mechanisms in the organization, ensuring that the transmission of CUI is carried out under adequate security standards.
strategy: ANY
checks:
  - key: windows-tls-protocol-errors
    name: Windows TLS protocol Errors
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '36874'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-tls-protocol-errors-by-ip
    name: Windows TLS protocol Errors by IP
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '36874'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
