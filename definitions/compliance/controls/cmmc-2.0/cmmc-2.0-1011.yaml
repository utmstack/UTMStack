id: cmmc-2.0-1011
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 3 (SI.3.217): File Renamed'
scope: data
statement: This report gathers relevant information from the FileRenamed event logs in Office 365, used to verify compliance with CMMC Level 3 (SI.3.217), which establishes the need to use monitoring tools to detect potential attacks.<br/><br/>The FileRenamed event is generated when a file within Office 365 is renamed, which could be an indication of an attempt to hide the content or origin of the file, especially in cases of cyberattacks, such as ransomware or unauthorized access to critical information. File renaming can be an indicator of suspicious behavior that could compromise data integrity or regulatory compliance.<br/><br/>Monitoring file renaming events allows you to identify unauthorized changes to data or infrastructure, detecting possible attempts to hide information or illegitimate activities. This report facilitates early detection of security incidents, allowing a rapid response to mitigate any potential threats and protect critical information in the Office 365 environment.
strategy: ANY
checks:
  - key: o365-file-renamed
    name: O365 File Renamed
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation = 'FileRenamed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-file-renamed-by-workload
    name: O365 File Renamed by Workload
    indexPattern: v11-log-o365-*
    sql: SELECT count(*) AS c FROM v11-log-o365-* WHERE (logx.o365.Operation.keyword = 'FileRenamed')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
