id: cmmc-2.0-836
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): User Account Logoff'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4647, which is triggered when a user actively logs out of the system. This event is key to compliance with CMMC Level 1 control AU.1.001, which requires the capture of audit logs for review.<br/><br/>Event 4647 provides details about a user's logout action. The collection of these logs is essential to monitor user activities within systems and ensure that sessions are closed correctly, which is a preventative measure against unauthorized or unmonitored access.<br/><br/>Analyzing these logs allows security teams to detect anomalous activities, such as logouts at unexpected times or by unauthorized users, which could indicate potential security breaches. Furthermore, having a clear record of logout events is crucial for conducting complete audits, especially in forensic investigation situations related to security incidents.<br/><br/>This report supports the audit policies established at CMMC Level 1, ensuring that logs related to user login and logout are appropriately collected and reviewed. In this way, it contributes to greater visibility and control over user actions within the system, helping to detect possible threats and ensure compliance with security regulations.
strategy: ANY
checks:
  - key: windows-user-account-logoff
    name: Windows User Account Logoff
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4647'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-account-logoff-by-user
    name: Windows Account Logoff by User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4647'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
