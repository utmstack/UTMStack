id: cmmc-2.0-492
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 4 (AU.4.053): Windows Kerberos ticket requests'
scope: data
statement: This report collects relevant information from events 4768 (Kerberos Authentication Ticket Granted), 4769 (Kerberos Service Ticket Granted) and 4771 (Kerberos Pre-Authentication Failed) in the Windows logs, for the purpose of verifying compliance with the AU practice. 4.053 of CMMC Level 4, which requires advanced logging capabilities for threat detection.<br/><br/>Analysis of these events is essential to detect and respond to unauthorized access attempts, credential misuse, and suspicious activity in protected environments. The report includes key details such as user name, source IP address, authentication result, Kerberos error codes, and authentication device, allowing you to improve visibility into authentication traffic and strengthen strategies. cybersecurity.<br/><br/>This report facilitates proactive identification of anomalous patterns, potential privilege escalation attempts, or lateral movement within the network, ensuring logging capabilities are robust enough to support advanced threat detection and incident response.
strategy: ANY
checks:
  - key: windows-kerberos-ticket-requests
    name: Windows Kerberos ticket requests
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4768', '4769', '4771'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-kerberos-ticket-requests-by-outcome
    name: Windows Kerberos ticket requests by Outcome
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4768', '4769', '4771'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
