id: cmmc-2.0-948
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 2 (AU.2.041): Restoration of default security policies'
scope: data
statement: This report collects relevant information from the logs of Windows event 4907, which is generated when the audit policy retention configuration is modified. This event is essential to verify compliance with CMMC's Level 2 requirement (AU.2.041), which requires the retention of audit logs for security events. Monitoring this event can detect changes in the way records are stored and retained, which can impact an organization's ability to track security incidents and meet regulatory requirements. Analyzing these logs helps ensure audit integrity and the availability of critical data for security investigations and reviews.
strategy: ANY
checks:
  - key: windows-restoration-of-default-security-policies
    name: Windows Restoration of default security policies
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4907'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-restoration-of-default-security-policies-by-outcome
    name: Windows Restoration of default security policies by outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4907'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
