id: cmmc-2.0-978
family: cmmc-2.0
familyName: CMMC
name: Bitdefender Activity Monitoring
scope: data
statement: This report presents a detailed analysis of the security events recorded by Bitdefender GravityZone in Windows environments, with the objective of demonstrating effective monitoring of third-party risks, in accordance with the requirements of the Cybersecurity Maturity Model Certification (CMMC).<br/><br/>Analysis includes detecting and monitoring unauthorized access, port scans, exploitation attempts, changes to security configurations, and other suspicious activity generated by users, devices, or third-party services interacting with critical systems. Key events related to real-time protection, firewalls, and intrusion prevention mechanisms are examined, providing visibility into external threats that could compromise information integrity.<br/><br/>Through the correlation of logs in the SIEM, a rapid response to anomalies is ensured and an audit history is generated that allows evaluating the effectiveness of the implemented controls. This report supports CMMC compliance by ensuring that third-party activities are continually monitored and alerts are triggered for any deviation from established security policies.
strategy: ANY
checks:
  - key: bitdefender-activity
    name: Bitdefender Activity
    dataType: antivirus-bitdefender-gz
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: bitdefender-activity-by-event-source
    name: Bitdefender Activity by Event Source
    dataType: antivirus-bitdefender-gz
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
