id: cmmc-2.0-1029
family: cmmc-2.0
familyName: CMMC
name: 'Office 365 Level 2 (AU.2.041): Sharing Set'
scope: data
statement: This report compiles relevant information from the logs generated by the SharingSet event in Office 365, providing visibility into file and folder sharing actions within the SharePoint and OneDrive environment. Its goal is to support CMMC Level 2 (AU.2.041) compliance, which requires audit log retention for security events, ensuring traceability of information access and sharing within the organization.<br/><br/>The report documents key data whose log retention is critical for security and compliance, allowing organizations to identify potential exposures of sensitive data, detect unauthorized sharing, and improve monitoring of access to critical information. This data also facilitates incident response, risk assessment, and the implementation of more effective access controls to protect the confidentiality of information.
strategy: ANY
checks:
  - key: o365-sharing-set
    name: O365 Sharing Set
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: SharingSet
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-sharing-set-by-geo-location
    name: O365 Sharing Set By Geo Location
    dataType: o365
    filters:
      - field: log.Operation
        operator: IS
        value: SharingSet
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
