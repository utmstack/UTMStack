id: cmmc-2.0-761
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 5 (SI.5.223): Service Control Manager Log Information'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 7030, which is triggered when a service on the system stops unexpectedly or cannot start correctly. This event is essential to comply with CMMC control SI.5.223, which requires the use of advanced tools to improve endpoint detection capabilities.<br/><br/>Event 7030 provides details about failures to start or stop critical services, which may indicate security issues or attacks aimed at disrupting the normal operation of systems. Detecting these events is crucial as it could signal malicious activities such as disabling key services, manipulation of system configurations or attempts to hide traces of an attack.<br/><br/>This report allows security teams to identify compromised services that may have been affected by malware, ransomware or other types of threats. With the use of advanced monitoring tools, these events can be analyzed in conjunction with other logs to detect suspicious behavior patterns on endpoints and trigger immediate alerts.<br/><br/>By implementing this type of monitoring, the organization strengthens its ability to identify attacks or anomalous behavior on endpoints, allowing a faster and more effective response to security incidents. In addition, it contributes to compliance with CMMC regulations, ensuring the integration of advanced tools for threat detection and proactive protection of critical systems.
strategy: ANY
checks:
  - key: windows-service-control-manager-log-information
    name: Windows Service Control Manager Log Information
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '7030'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-service-control-manager-log-information-distribution-by-host
    name: 'Windows Service Control Manager Log Information Distribution by Host '
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '7030'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
