id: cmmc-2.0-819
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 1 (AC.1.001): Password Reset Attempts'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4724, which is triggered when a system administrator attempts to reset the password for a user account. This event is crucial to comply with CMMC Level 1 control AU.1.001, which requires capturing audit logs for review.<br/><br/>Event 4724 provides details about password reset attempts. This information allows you to track and audit changes to user account credentials, which is essential for identifying unauthorized access or malicious behavior.<br/><br/>Monitoring password reset attempts is vital to detect suspicious activity, such as attempts to bypass security controls, abuse of administrative privileges, or unauthorized access to critical accounts. This event also helps ensure that password change policies are followed appropriately.<br/><br/>This report contributes to compliance with AU.1.001 by ensuring that all password reset attempts are recorded, monitored, and reviewed. By doing so, it helps protect the integrity of access credentials, ensuring that control over access to critical systems and resources is maintained, strengthening the security of the organization's infrastructure.
strategy: ANY
checks:
  - key: windows-password-reset-attempts
    name: Windows Password Reset Attempts
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4724'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-password-reset-attempts-by-target-user
    name: Windows Password Reset Attempts by Target User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4724'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
