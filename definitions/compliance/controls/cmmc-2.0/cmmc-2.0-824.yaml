id: cmmc-2.0-824
family: cmmc-2.0
familyName: CMMC
name: 'Windows Level 3 (AU.3.045): Access to critical files or specific directories'
scope: data
statement: This report collects relevant information from the Windows logs generated by event 4663, which is triggered when a user performs an access operation on system objects, such as reading, writing or deleting files and folders. This event is crucial to comply with CMMC Level 3 control AU.3.045, which requires ensuring that logs are available for investigation in the event of security incidents.<br/><br/>Event 4663 provides details about operations performed on system objects. This allows detailed tracking of interactions with critical files and resources within the system. Maintaining a proper record of these events is essential to ensure that any unauthorized access or modification to the organization's resources can be tracked and audited effectively.<br/><br/>Ensuring that logs of these types of events are available for review and analysis is essential for the early identification of security incidents, such as unauthorized access, malicious modifications or security policy violations. This report contributes to the organization's ability to investigate and respond to incidents efficiently, ensuring that the information necessary for a complete investigation can be accessed.<br/><br/>In this way, the report supports compliance with CMMC Level 3 control AU.3.045, ensuring that the relevant logs are properly managed, stored and available for review at any time, facilitating a rapid and effective response to security incidents and contributing to the protection of organizational infrastructure.
strategy: ANY
checks:
  - key: windows-access-to-critical-files-or-specific-directories
    name: Windows Access to critical files or specific directories
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4663'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-distribution-of-access-results-to-critical-files-or-specific-directories
    name: Windows Distribution of access results to critical files or specific directories
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4663'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
