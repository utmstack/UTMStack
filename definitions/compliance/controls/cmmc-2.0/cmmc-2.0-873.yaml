id: cmmc-2.0-873
family: cmmc-2.0
familyName: CMMC
name: 'AWS Level 2 (AC.2.007): Attach Role Policy'
scope: data
statement: This report compiles and presents relevant information about AttachRolePolicy events in AWS, with the objective of verifying compliance with CMMC practice AC.2.007. It focuses on ensuring that access policies are properly associated with roles, ensuring that role-based access controls (RBAC) are implemented correctly. The report includes key details about the policies assigned to the roles, the specific role affected, the accounts involved, and the source of the request. This information is crucial to verify that access to sensitive resources is strictly controlled by assigning appropriate permissions based on user roles, ensuring that the principle of least privilege is maintained and risks of unauthorized access are minimized.
strategy: ANY
checks:
  - key: aws-attach-role-policy
    name: AWS Attach Role Policy
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName = 'AttachRolePolicy')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-attach-role-policy-mfa-distribution
    name: AWS Attach Role Policy - MFA Distribution
    indexPattern: v11-log-aws-*
    sql: SELECT count(*) AS c FROM v11-log-aws-* WHERE (logx.aws.eventName = 'AttachRolePolicy')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
