# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: ac-3
family: ac
familyName: Access Control
name: Access Enforcement
scope: data
statement: |-
  Enforce approved authorizations for logical access to information and system resources in accordance with applicable access control policies.
remediation: |-
  Passes when a connected source shows access that was refused (a file, object, share, mailbox or resource request denied).
  If it fails: enable failure auditing for object access (Windows: "File System", "Handle Manipulation" and "Detailed File Share" failure auditing on sensitive folders; Linux: auditd watches or SELinux/AppArmor denials) and confirm those records reach UTMStack.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-access-denied
    name: 'Windows: refused object and privilege access is recorded'
    dataType: wineventlog
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '4656'
          - '4661'
          - '4663'
          - '4673'
          - '4674'
          - '4675'
          - '4888'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: win-defender-folder-access-blocked
    name: 'Windows: Microsoft Defender Controlled Folder Access blocks are recorded'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-Windows Defender'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '1123'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-audit-access-denied
    name: 'Linux: refused access is recorded (audit)'
    dataType: linux
    filters:
      - field: log.type
        operator: IS
        value: 'auditd'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-access-denied
    name: 'macOS: refused access is recorded'
    dataType: macos
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-access-denied
    name: 'Microsoft 365: refused access (policy blocks, denied sign-ins, blocked sharing) is recorded'
    dataType: o365
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
      - field: action
        operator: IS_NOT
        value: 'TIMailData'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-access-denied
    name: 'Azure: refused requests (401/403, access restrictions, conditional access) are recorded'
    dataType: azure
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-access-denied
    name: 'AWS: API calls refused by IAM are recorded'
    dataType: aws
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-permission-denied
    name: 'Google: API calls refused for missing permission are recorded'
    dataType: google
    filters:
      - field: log.logName
        operator: CONTAIN
        value: 'cloudaudit.googleapis.com'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: bitdefender-threat-blocked
    name: 'Bitdefender GravityZone: threats, sites or files are blocked, quarantined or removed'
    dataType: antivirus-bitdefender-gz
    filters:
      - field: log.BitdefenderGZModule
        operator: IS_ONE_OF_TERMS
        value:
          - 'av'
          - 'avc'
          - 'hd'
          - 'antiexploit'
          - 'ransomware-mitigation'
          - 'network-sandboxing'
          - 'new-incident'
          - 'exchange-malware'
          - 'aph'
          - 'uc'
          - 'dp'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: eset-threat-blocked
    name: 'ESET PROTECT: threats, files and web pages are blocked, cleaned or quarantined'
    dataType: antivirus-esmc-eset
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'Threat_Event'
          - 'HipsAggregated_Event'
          - 'HIPSAggregated_Event'
          - 'BlockedFiles_Event'
          - 'FilteredWebsites_Event'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: kaspersky-object-blocked
    name: 'Kaspersky: object or launch blocked'
    dataType: antivirus-kaspersky
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sentinelone-threat-killed-quarantined
    name: 'SentinelOne: threat killed or quarantined'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS_ONE_OF_TERMS
        value:
          - '2001'
          - '2004'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: cisco-switch-port-security-denied
    name: 'Cisco switch: port security, ARP inspection and DHCP snooping denials are recorded'
    dataType: cisco-switch
    filters:
      - field: log.facility
        operator: IS_ONE_OF_TERMS
        value:
          - 'PORT_SECURITY'
          - 'SW_DAI'
          - 'DHCP_SNOOPING'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: crowdstrike-prevention-blocked
    name: 'CrowdStrike: prevention blocked a detection'
    dataType: crowdstrike
    filters:
      - field: log.metadataEventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'DetectionSummaryEvent'
          - 'EppDetectionSummaryEvent'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: deceptive-bytes-prevented
    name: 'Deceptive Bytes: activity prevented or blocked'
    dataType: deceptive-bytes
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-local-in-denied
    name: 'FortiGate: denied access to the firewall itself is recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.type
        operator: IS
        value: 'traffic'
      - field: log.subtype
        operator: IS
        value: 'local'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-unauthorized-config
    name: 'Palo Alto: refused configuration attempts are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS
        value: 'CONFIG'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-access-denied
    name: 'SonicWall: denied user and management access is recorded'
    dataType: firewall-sonicwall
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '986'
          - '1079'
          - '35'
          - '1672'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-xg-appliance-access-denied
    name: 'Sophos Firewall: denied access to the appliance itself is recorded'
    dataType: firewall-sophos-xg
    filters:
      - field: log.type
        operator: IS
        value: 'Firewall'
      - field: log.component
        operator: IS
        value: 'Appliance Access'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aix-sudo-refusals
    name: 'IBM AIX: refused sudo use is recorded'
    dataType: ibm-aix
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
      - field: log.returnCode
        operator: DOES_NOT_EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-graph-conditional-access-blocks
    name: 'Microsoft Graph: sign-ins refused by conditional access are recorded'
    dataType: o365-graph
    filters:
      - field: log.conditionalAccessStatus
        operator: IS
        value: 'failure'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-central-blocked
    name: 'Sophos Central: applications, devices, web pages or exploits are blocked'
    dataType: sophos-central
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: syslog-cef-denied
    name: 'Syslog: CEF devices report refused actions'
    dataType: syslog
    filters:
      - field: log.dataType
        operator: IS
        value: 'cef'
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: edr-blocked-execution
    name: 'UTMStack EDR: malicious files or processes are quarantined, killed or blocked'
    dataType: utmstack_edr
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'quarantined'
          - 'killed'
          - 'blocked'
          - 'ransomware_contained'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: esxi-access-denied
    name: 'VMware ESXi: refused access is recorded'
    dataType: vmware-esxi
    filters:
      - field: actionResult
        operator: IS
        value: 'denied'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
