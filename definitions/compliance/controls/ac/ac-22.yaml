# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ac-22
family: ac
familyName: Access Control
name: Publicly Accessible Content
scope: governance
statement: |-
  Designate individuals authorized to make information publicly accessible;
  Train authorized individuals to ensure that publicly accessible information does not contain nonpublic information;
  Review the proposed content of information prior to posting onto the publicly accessible system to ensure that nonpublic information is not included; and
  Review the content on the publicly accessible system for nonpublic information [frequency] and remove such information, if discovered.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the access policy, the account review record or a configuration export showing the setting.
source: NIST SP 800-53 Rev 5 (public domain)
