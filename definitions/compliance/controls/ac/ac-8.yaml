# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ac-8
family: ac
familyName: Access Control
name: System Use Notification
scope: governance
statement: |-
  Display [system use notification] to users before granting access to the system that provides privacy and security notices consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines and state that:
  Users are accessing a U.S. Government system;
  System usage may be monitored, recorded, and subject to audit;
  Unauthorized use of the system is prohibited and subject to criminal and civil penalties; and
  Use of the system indicates consent to monitoring and recording;
  Retain the notification message or banner on the screen until users acknowledge the usage conditions and take explicit actions to log on to or further access the system; and
  For publicly accessible systems:
  Display system use information [conditions] , before granting further access to the publicly accessible system;
  Display references, if any, to monitoring, recording, or auditing that are consistent with privacy accommodations for such systems that generally prohibit those activities; and
  Include a description of the authorized uses of the system.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the access policy, the account review record or a configuration export showing the setting.
source: NIST SP 800-53 Rev 5 (public domain)
