# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: ac-11
family: ac
familyName: Access Control
name: Device Lock
scope: data
statement: |-
  Prevent further access to the system by [initiating a device lock after [organization-defined value] of inactivity | requiring the user to initiate a device lock before leaving the system unattended]; and
  Retain the device lock until the user reestablishes access using established identification and authentication procedures.
remediation: |-
  Passes when a connected source shows screens or sessions being locked and unlocked.
  If it fails: enable "Other Logon/Logoff Events" auditing on Windows (workstation locked and unlocked) or the equivalent on other systems, and check the screen lock policy is applied.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-workstation-unlock
    name: 'Windows: workstation unlocks are recorded'
    dataType: wineventlog
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
      - field: log.eventDataLogonType
        operator: IS_ONE_OF_TERMS
        value:
          - '7'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-desktop-screen-unlock
    name: 'Linux: desktop screen unlock authentications are recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'cinnamon-screensaver-pam-helper'
          - 'gnome-screensaver-dialog'
          - 'xscreensaver'
          - 'light-locker'
          - 'kscreenlocker_greet'
          - 'xfce4-screensaver-dialog'
          - 'mate-screensaver-dialog'
          - 'swaylock'
          - 'i3lock'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-screen-lock
    name: 'macOS: screen lock and unlock are recorded'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS
        value: 'loginwindow'
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - 'com.apple.screenIsLocked'
          - 'com.apple.screenIsUnlocked'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-defender-workstation-unlock
    name: 'Azure (Defender for Endpoint): workstation unlocks are recorded'
    dataType: azure
    filters:
      - field: log.category
        operator: IS
        value: 'AdvancedHunting-DeviceLogonEvents'
      - field: log.properties.LogonType
        operator: IS_ONE_OF_TERMS
        value:
          - 'Unlock'
          - 'CachedUnlock'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
