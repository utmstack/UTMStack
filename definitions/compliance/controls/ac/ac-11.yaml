id: ac-11
family: ac
familyName: Access Control
name: Device Lock
scope: data
statement: |-
  Prevent further access to the system by [initiating a device lock after {{ insert: param, ac-11_odp.02 }} of inactivity | requiring the user to initiate a device lock before leaving the system unattended] ; and
