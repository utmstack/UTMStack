# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: ac-17
family: ac
familyName: Access Control
name: Remote Access
scope: data
statement: |-
  Establish and document usage restrictions, configuration/connection requirements, and implementation guidance for each type of remote access allowed; and
  Authorize each type of remote access to the system prior to allowing such connections.
remediation: |-
  Passes when a connected source shows remote access sessions (Remote Desktop, SSH, VPN or remote administration).
  If it fails: log remote access at the VPN, firewall or host and send it to UTMStack. If nobody used remote access during the window, set the status manually and note that.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-rdp-logon
    name: 'Windows: Remote Desktop logons are recorded'
    dataType: wineventlog
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
      - field: log.eventDataLogonType
        operator: IS_ONE_OF_TERMS
        value:
          - '10'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: win-rdp-user-authenticated
    name: 'Windows: Remote Desktop user authentications are recorded'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-TerminalServices-RemoteConnectionManager'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '1149'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-audit-ssh-logins
    name: 'Linux: SSH logins are recorded (audit)'
    dataType: linux
    filters:
      - field: action
        operator: IS
        value: 'USER_LOGIN'
      - field: actionResult
        operator: IS
        value: 'success'
      - field: log.userlogin.exe
        operator: CONTAIN
        value: 'sshd'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-ssh-sessions
    name: 'Linux: SSH remote sessions are recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'sshd'
          - 'sshd-session'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-screen-sharing-logins
    name: 'macOS: screen sharing (remote desktop) sign-ins are recorded'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS
        value: 'screensharingd'
      - field: log.message
        operator: CONTAIN
        value: 'Authentication: SUCCEEDED'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-ssh-logins
    name: 'macOS: accepted SSH sign-ins are recorded'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS_ONE_OF_TERMS
        value:
          - 'sshd'
          - 'sshd-session'
      - field: log.message
        operator: START_WITH
        value: 'Accepted '
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-remote-admin-signins
    name: 'Microsoft 365: remote administration sign-ins (Azure portal, CLI, PowerShell) are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'UserLoggedIn'
      - field: actionResult
        operator: IS
        value: 'success'
      - field: log.ObjectId
        operator: IS_ONE_OF_TERMS
        value:
          - '797f4846-ba00-4fd7-ba43-dac1f8f63013'
          - 'c44b4083-3bb0-49c1-b47d-974e53cbdf3c'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-remote-desktop-signins
    name: 'Microsoft 365: remote desktop and VPN sign-ins (Azure Virtual Desktop, Windows 365, Azure VPN) are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'UserLoggedIn'
      - field: actionResult
        operator: IS
        value: 'success'
      - field: log.ObjectId
        operator: IS_ONE_OF_TERMS
        value:
          - '9cdead84-a844-4324-93f2-b2e6bb768d07'
          - '270efc09-cd0d-444b-a71f-39af4910ec45'
          - 'a4a365df-50f1-4397-bc59-1a1564b8bb9c'
          - '0af06dc6-e4b5-4f28-818e-e78e62d137a5'
          - '41b23e61-6c1e-4545-b367-cd054e0ed4b4'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-defender-rdp-connections
    name: 'Azure: Defender for Endpoint remote desktop connections are recorded'
    dataType: azure
    filters:
      - field: action
        operator: IS
        value: 'RemoteDesktopConnection'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-remote-sessions
    name: 'AWS: Session Manager and EC2 Instance Connect remote sessions are recorded'
    dataType: aws
    filters:
      - field: target.domain
        operator: IS_ONE_OF
        value:
          - 'ssm.amazonaws.com'
          - 'ssm-guiconnect.amazonaws.com'
          - 'ec2-instance-connect.amazonaws.com'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'StartSession'
          - 'ResumeSession'
          - 'StartConnection'
          - 'SendSSHPublicKey'
          - 'SendSerialConsoleSSHPublicKey'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-iap-remote-access
    name: 'Google: Identity-Aware Proxy remote access is recorded'
    dataType: google
    filters:
      - field: log.protoPayloadServiceName
        operator: IS
        value: 'iap.googleapis.com'
      - field: log.protoPayloadMethodName
        operator: IS
        value: 'AuthorizeUser'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: cisco-switch-ssh-sessions
    name: 'Cisco switch: SSH administration sessions are recorded'
    dataType: cisco-switch
    filters:
      - field: log.facility
        operator: IS
        value: 'SSH'
      - field: log.facilityMnemonic
        operator: IS_ONE_OF_TERMS
        value:
          - 'SSH2_SESSION'
          - 'SSH2_USERAUTH'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: crowdstrike-rtr-sessions
    name: 'CrowdStrike: Real Time Response remote sessions'
    dataType: crowdstrike
    filters:
      - field: log.metadataEventType
        operator: IS
        value: 'RemoteResponseSessionStartEvent'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: asa-remote-access
    name: 'Cisco ASA: remote access VPN sessions and management sign-ins are recorded'
    dataType: firewall-cisco-asa
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '113039'
          - '716001'
          - '722022'
          - '722051'
          - '605005'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: ftd-remote-access
    name: 'Cisco Firepower: remote access VPN sessions are recorded'
    dataType: firewall-cisco-firepower
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '113039'
          - '716001'
          - '722022'
          - '722051'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-remote-access
    name: 'FortiGate: SSL VPN tunnels and remote admin sign-ins are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.logid
        operator: IS_ONE_OF_TERMS
        value:
          - '0101039424'
          - '0101039947'
          - '0100032001'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: meraki-client-vpn
    name: 'Cisco Meraki: client VPN connections are recorded'
    dataType: firewall-meraki
    filters:
      - field: log.merakiGroup
        operator: IS
        value: 'events'
      - field: log.vpnLocalIp
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: mikrotik-remote-admin
    name: 'MikroTik: remote admin sessions (SSH, Winbox, web, API) are recorded'
    dataType: firewall-mikrotik
    filters:
      - field: log.topics
        operator: CONTAIN
        value: 'account'
      - field: log.service
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-globalprotect-sessions
    name: 'Palo Alto: GlobalProtect gateway sign-ins are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS
        value: 'GLOBALPROTECT'
      - field: log.eventid
        operator: IS
        value: 'gateway-auth'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: pfsense-remote-access
    name: 'pfSense: OpenVPN and SSH sign-ins are recorded'
    dataType: firewall-pfsense
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'openvpn'
          - 'sshd'
      - field: log.authEvent
        operator: IS_ONE_OF_TERMS
        value:
          - 'authenticated'
          - 'Accepted'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-remote-access
    name: 'SonicWall: remote VPN sign-ins and admin sessions are recorded'
    dataType: firewall-sonicwall
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '237'
          - '238'
          - '1080'
          - '139'
          - '994'
          - '996'
          - '997'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-xg-remote-access
    name: 'Sophos Firewall: SSL VPN, L2TP and VPN portal sessions are recorded'
    dataType: firewall-sophos-xg
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '17824'
          - '17710'
          - '17707'
          - '17718'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aix-ssh-sessions
    name: 'IBM AIX: SSH remote sessions are recorded'
    dataType: ibm-aix
    filters:
      - field: log.authResult
        operator: IS
        value: 'Accepted'
      - field: origin.ip
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: as400-client-connections
    name: 'IBM i (AS/400): client connections are recorded'
    dataType: ibm-as400
    filters:
      - field: actionResult
        operator: IS
        value: 'success'
      - field: origin.ip
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-graph-remote-admin-signins
    name: 'Microsoft Graph: remote administration sign-ins (Azure management) are recorded'
    dataType: o365-graph
    filters:
      - field: log.resourceId
        operator: IS_ONE_OF_TERMS
        value:
          - '797f4846-ba00-4fd7-ba43-dac1f8f63013'
      - field: log.status.errorCode
        operator: IS
        value: '0'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-graph-remote-desktop-signins
    name: 'Microsoft Graph: remote desktop and VPN sign-ins are recorded'
    dataType: o365-graph
    filters:
      - field: log.resourceId
        operator: IS_ONE_OF_TERMS
        value:
          - '9cdead84-a844-4324-93f2-b2e6bb768d07'
          - '270efc09-cd0d-444b-a71f-39af4910ec45'
          - 'a4a365df-50f1-4397-bc59-1a1564b8bb9c'
          - '0af06dc6-e4b5-4f28-818e-e78e62d137a5'
          - '41b23e61-6c1e-4545-b367-cd054e0ed4b4'
      - field: log.status.errorCode
        operator: IS
        value: '0'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: esxi-remote-sessions
    name: 'VMware ESXi: remote management sessions are recorded'
    dataType: vmware-esxi
    filters:
      - field: actionResult
        operator: IS
        value: 'success'
      - field: origin.ip
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
