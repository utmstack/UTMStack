# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: ac-2
family: ac
familyName: Access Control
name: Account Management
scope: data
statement: |-
  Define and document the types of accounts allowed and specifically prohibited for use within the system;
  Assign account managers;
  Require [prerequisites and criteria] for group and role membership;
  Specify:
  Authorized users of the system;
  Group and role membership; and
  Access authorizations (i.e., privileges) and [attributes (as required)] for each account;
  Require approvals by [personnel or roles] for requests to create accounts;
  Create, enable, modify, disable, and remove accounts in accordance with [policy, procedures, prerequisites, and criteria];
  Monitor the use of accounts;
  Notify account managers and [personnel or roles] within:
  [time period] when accounts are no longer required;
  [time period] when users are terminated or transferred; and
  [time period] when system usage or need-to-know changes for an individual;
  Authorize access to the system based on:
  A valid access authorization;
  Intended system usage; and
  [attributes (as required)];
  Review accounts for compliance with account management requirements [frequency];
  Establish and implement a process for changing shared or group account authenticators (if deployed) when individuals are removed from the group; and
  Align account management processes with personnel termination and transfer processes.
remediation: |-
  Passes when at least one connected source shows account changes (created, enabled, disabled, deleted, changed, unlocked) during the report window.
  If it fails: turn on account management auditing at the source (Windows: Advanced Audit Policy "User Account Management" for success; Linux: keep auditd or the system journal; Microsoft 365: unified audit log on; AWS: CloudTrail management events) and check that the source reaches UTMStack.
  If no account really changed during the window, set the status manually and note that.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-account-lifecycle
    name: 'Windows: user account changes are recorded'
    dataType: wineventlog
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '4720'
          - '4722'
          - '4723'
          - '4724'
          - '4725'
          - '4726'
          - '4738'
          - '4767'
          - '4781'
      - field: target.user
        operator: EXIST
      - field: target.user
        operator: NOT_ENDS_WITH
        value: '$'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-account-tools
    name: 'Linux: account management commands are recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'useradd'
          - 'userdel'
          - 'usermod'
          - 'groupadd'
          - 'groupdel'
          - 'groupmod'
          - 'gpasswd'
          - 'chage'
          - 'newusers'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-audit-account-changes
    name: 'Linux: account and group changes are recorded (audit)'
    dataType: linux
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'ADD_USER'
          - 'DEL_USER'
          - 'USER_MGMT'
          - 'ADD_GROUP'
          - 'DEL_GROUP'
          - 'GRP_MGMT'
          - 'ACCT_LOCK'
          - 'ACCT_UNLOCK'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-account-changes
    name: 'macOS: local account changes made with sysadminctl are recorded'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS
        value: 'sysadminctl'
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - 'Creating user record'
          - 'Deleting record for'
          - 'Adding user to admin group'
          - 'Removing user from admin group'
          - 'Assigning UID'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-account-lifecycle
    name: 'Microsoft 365: user account creation, changes, disabling and deletion are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Add user.'
          - 'Delete user.'
          - 'Update user.'
          - 'Disable account.'
          - 'Enable account.'
          - 'Hard Delete user.'
          - 'Restore user.'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-entra-account-lifecycle
    name: 'Azure: Entra ID user creation, changes, disabling and deletion are recorded'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS
        value: 'audit'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'Add user'
          - 'Delete user'
          - 'Update user'
          - 'Hard delete user'
          - 'Hard Delete user'
          - 'Restore user'
          - 'Disable account'
          - 'Enable account'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-identity-lifecycle
    name: 'AWS: IAM and Identity Center user and role changes are recorded'
    dataType: aws
    filters:
      - field: target.domain
        operator: IS_ONE_OF
        value:
          - 'iam.amazonaws.com'
          - 'identitystore.amazonaws.com'
          - 'sso-directory.amazonaws.com'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'CreateUser'
          - 'DeleteUser'
          - 'UpdateUser'
          - 'CreateLoginProfile'
          - 'DeleteLoginProfile'
          - 'CreateRole'
          - 'DeleteRole'
          - 'UpdateRole'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-service-account-lifecycle
    name: 'Google Cloud: service account lifecycle changes are recorded'
    dataType: google
    filters:
      - field: log.protoPayloadMethodName
        operator: IS_ONE_OF
        value:
          - 'google.iam.admin.v1.CreateServiceAccount'
          - 'google.iam.admin.v1.DeleteServiceAccount'
          - 'google.iam.admin.v1.DisableServiceAccount'
          - 'google.iam.admin.v1.EnableServiceAccount'
          - 'google.iam.admin.v1.UpdateServiceAccount'
          - 'google.iam.admin.v1.PatchServiceAccount'
          - 'google.iam.admin.v1.UndeleteServiceAccount'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-workspace-user-lifecycle
    name: 'Google: Workspace users created, deleted, suspended or restored'
    dataType: google
    filters:
      - field: log.protoPayloadServiceName
        operator: IS
        value: 'admin.googleapis.com'
      - field: log.protoPayloadMethodName
        operator: IS_ONE_OF
        value:
          - 'google.admin.AdminService.createUser'
          - 'google.admin.AdminService.deleteUser'
          - 'google.admin.AdminService.undeleteUser'
          - 'google.admin.AdminService.suspendUser'
          - 'google.admin.AdminService.unsuspendUser'
          - 'google.admin.AdminService.archiveUser'
          - 'google.admin.AdminService.unarchiveUser'
          - 'google.admin.AdminService.renameUser'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: eset-console-user-changes
    name: 'ESET: console users or user groups created, changed or deleted'
    dataType: antivirus-esmc-eset
    filters:
      - field: log.eventType
        operator: IS
        value: 'Audit_Event'
      - field: log.domain
        operator: IS_ONE_OF_TERMS
        value:
          - 'Native user'
          - 'User group'
          - 'Domain group'
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Create'
          - 'Delete'
          - 'Edit'
          - 'Modify'
          - 'Update'
          - 'Enable'
          - 'Disable'
          - 'Deactivate'
          - 'Activate'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sentinelone-console-user-changes
    name: 'SentinelOne: console users are added, deleted or given roles'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS_ONE_OF_TERMS
        value:
          - '23'
          - '25'
          - '37'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: cisco-switch-username-commands
    name: 'Cisco switch: local account commands are recorded'
    dataType: cisco-switch
    filters:
      - field: log.facility
        operator: IS
        value: 'PARSER'
      - field: log.facilityMnemonic
        operator: IS
        value: 'CFGLOG_LOGGEDCMD'
      - field: log.ciscoMsg
        operator: CONTAIN
        value: 'username '
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: crowdstrike-user-changes
    name: 'CrowdStrike: Falcon console users created, changed or deleted'
    dataType: crowdstrike
    filters:
      - field: log.eventOperationName
        operator: IS_ONE_OF_TERMS
        value:
          - 'createUser'
          - 'deleteUser'
          - 'updateUser'
          - 'deactivateUser'
          - 'activateUser'
          - 'grantUserRoles'
          - 'revokeUserRoles'
          - 'updateUserRoles'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: asa-local-user-changes
    name: 'Cisco ASA: local user database changes are recorded'
    dataType: firewall-cisco-asa
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '502101'
          - '502102'
          - '502103'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-account-changes
    name: 'FortiGate: administrator and local user account changes are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.logid
        operator: IS_ONE_OF_TERMS
        value:
          - '0100044544'
          - '0100044545'
          - '0100044546'
          - '0100044547'
      - field: log.cfgpath
        operator: CONTAIN_ONE_OF
        value:
          - 'system.admin'
          - 'user.local'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: mikrotik-user-changes
    name: 'MikroTik: user account changes are recorded'
    dataType: firewall-mikrotik
    filters:
      - field: log.topics
        operator: CONTAIN
        value: 'system'
      - field: log.message
        operator: START_WITH
        value: 'user '
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - ' added by '
          - ' removed by '
          - ' changed by '
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-admin-account-changes
    name: 'Palo Alto: administrator and local user account changes are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS
        value: 'CONFIG'
      - field: log.path
        operator: CONTAIN_ONE_OF
        value:
          - 'mgt-config users'
          - 'local-user-database user'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: pfsense-user-changes
    name: 'pfSense: local user account changes are recorded'
    dataType: firewall-pfsense
    filters:
      - field: raw
        operator: CONTAIN_ONE_OF
        value:
          - 'Successfully created user'
          - 'Successfully edited user'
          - 'Successfully deleted user'
          - 'Adding user:'
          - 'Removing user:'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-local-user-changes
    name: 'SonicWall: local user account changes are recorded'
    dataType: firewall-sonicwall
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '1333'
          - '1334'
          - '1335'
          - '1337'
          - '1338'
          - '328'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: github-org-membership
    name: 'GitHub: organization members added, invited or removed'
    dataType: github
    filters:
      - field: log.action
        operator: IS_ONE_OF
        value:
          - 'member_added'
          - 'member_removed'
          - 'member_invited'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: as400-profile-disabled
    name: 'IBM i (AS/400): user profiles being disabled are recorded'
    dataType: ibm-as400
    filters:
      - field: log.messageId
        operator: IS
        value: 'CPF1393'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-graph-account-lifecycle
    name: 'Microsoft Graph: user account changes are recorded'
    dataType: o365-graph
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Add user'
          - 'Delete user'
          - 'Update user'
          - 'Disable account'
          - 'Enable account'
          - 'Hard delete user'
          - 'Hard Delete user'
          - 'Restore user'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: esxi-account-changes
    name: 'VMware ESXi: local account changes are recorded'
    dataType: vmware-esxi
    filters:
      - field: log.message
        operator: CONTAIN
        value: 'Account '
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - 'was created on host'
          - 'was removed on host'
          - 'was updated on host'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
