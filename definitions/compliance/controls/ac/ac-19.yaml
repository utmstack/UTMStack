# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ac-19
family: ac
familyName: Access Control
name: Access Control for Mobile Devices
scope: governance
statement: |-
  Establish configuration requirements, connection requirements, and implementation guidance for organization-controlled mobile devices, to include when such devices are outside of controlled areas; and
  Authorize the connection of mobile devices to organizational systems.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the access policy, the account review record or a configuration export showing the setting.
source: NIST SP 800-53 Rev 5 (public domain)
