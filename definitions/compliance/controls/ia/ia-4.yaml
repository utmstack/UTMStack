# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: ia-4
family: ia
familyName: Identification and Authentication
name: Identifier Management
scope: data
statement: |-
  Manage system identifiers by:
  Receiving authorization from [personnel or roles] to assign an individual, group, role, service, or device identifier;
  Selecting an identifier that identifies an individual, group, role, service, or device;
  Assigning the identifier to the intended individual, group, role, service, or device; and
  Preventing reuse of identifiers for [time period].
remediation: |-
  Passes when a connected source shows accounts (identifiers) being created or removed.
  If it fails: enable account management auditing. If no account was created or removed in the window, set the status manually and note that.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-account-create-delete
    name: 'Windows: user account creation and deletion are recorded'
    dataType: wineventlog
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '4720'
          - '4726'
      - field: target.user
        operator: EXIST
      - field: target.user
        operator: NOT_ENDS_WITH
        value: '$'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: win-account-lifecycle
    name: 'Windows: user account changes are recorded'
    dataType: wineventlog
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '4720'
          - '4722'
          - '4723'
          - '4724'
          - '4725'
          - '4726'
          - '4738'
          - '4767'
          - '4781'
      - field: target.user
        operator: EXIST
      - field: target.user
        operator: NOT_ENDS_WITH
        value: '$'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-account-create-delete-tools
    name: 'Linux: useradd and userdel runs are recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'useradd'
          - 'userdel'
          - 'newusers'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-account-tools
    name: 'Linux: account management commands are recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'useradd'
          - 'userdel'
          - 'usermod'
          - 'groupadd'
          - 'groupdel'
          - 'groupmod'
          - 'gpasswd'
          - 'chage'
          - 'newusers'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-audit-account-changes
    name: 'Linux: account and group changes are recorded (audit)'
    dataType: linux
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'ADD_USER'
          - 'DEL_USER'
          - 'USER_MGMT'
          - 'ADD_GROUP'
          - 'DEL_GROUP'
          - 'GRP_MGMT'
          - 'ACCT_LOCK'
          - 'ACCT_UNLOCK'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-audit-account-create-delete
    name: 'Linux: account creation and deletion are recorded (audit)'
    dataType: linux
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'ADD_USER'
          - 'DEL_USER'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-account-create-delete
    name: 'Microsoft 365: user account creation and deletion are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Add user.'
          - 'Delete user.'
          - 'Hard Delete user.'
          - 'New-Mailbox'
          - 'Remove-Mailbox'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-account-lifecycle
    name: 'Microsoft 365: user account creation, changes, disabling and deletion are recorded'
    dataType: o365
    filters:
      - field: action
        operator: IS_ONE_OF_TERMS
        value:
          - 'Add user.'
          - 'Delete user.'
          - 'Update user.'
          - 'Disable account.'
          - 'Enable account.'
          - 'Hard Delete user.'
          - 'Restore user.'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-entra-account-create-delete
    name: 'Azure: Entra ID user creation and deletion are recorded'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS
        value: 'audit'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'Add user'
          - 'Delete user'
          - 'Hard delete user'
          - 'Hard Delete user'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-entra-account-lifecycle
    name: 'Azure: Entra ID user creation, changes, disabling and deletion are recorded'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS
        value: 'audit'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'Add user'
          - 'Delete user'
          - 'Update user'
          - 'Hard delete user'
          - 'Hard Delete user'
          - 'Restore user'
          - 'Disable account'
          - 'Enable account'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-identity-create-delete
    name: 'AWS: IAM and Identity Center users and roles created or deleted'
    dataType: aws
    filters:
      - field: target.domain
        operator: IS_ONE_OF
        value:
          - 'iam.amazonaws.com'
          - 'identitystore.amazonaws.com'
          - 'sso-directory.amazonaws.com'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'CreateUser'
          - 'DeleteUser'
          - 'CreateRole'
          - 'DeleteRole'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-identity-lifecycle
    name: 'AWS: IAM and Identity Center user and role changes are recorded'
    dataType: aws
    filters:
      - field: target.domain
        operator: IS_ONE_OF
        value:
          - 'iam.amazonaws.com'
          - 'identitystore.amazonaws.com'
          - 'sso-directory.amazonaws.com'
      - field: action
        operator: IS_ONE_OF
        value:
          - 'CreateUser'
          - 'DeleteUser'
          - 'UpdateUser'
          - 'CreateLoginProfile'
          - 'DeleteLoginProfile'
          - 'CreateRole'
          - 'DeleteRole'
          - 'UpdateRole'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-service-account-create-delete
    name: 'Google Cloud: service accounts created or deleted'
    dataType: google
    filters:
      - field: log.protoPayloadMethodName
        operator: IS_ONE_OF
        value:
          - 'google.iam.admin.v1.CreateServiceAccount'
          - 'google.iam.admin.v1.DeleteServiceAccount'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-service-account-lifecycle
    name: 'Google Cloud: service account lifecycle changes are recorded'
    dataType: google
    filters:
      - field: log.protoPayloadMethodName
        operator: IS_ONE_OF
        value:
          - 'google.iam.admin.v1.CreateServiceAccount'
          - 'google.iam.admin.v1.DeleteServiceAccount'
          - 'google.iam.admin.v1.DisableServiceAccount'
          - 'google.iam.admin.v1.EnableServiceAccount'
          - 'google.iam.admin.v1.UpdateServiceAccount'
          - 'google.iam.admin.v1.PatchServiceAccount'
          - 'google.iam.admin.v1.UndeleteServiceAccount'
      - field: actionResult
        operator: IS
        value: 'success'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sentinelone-console-user-added-deleted
    name: 'SentinelOne: console users are added or deleted'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS_ONE_OF_TERMS
        value:
          - '23'
          - '25'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sentinelone-console-user-changes
    name: 'SentinelOne: console users are added, deleted or given roles'
    dataType: antivirus-sentinel-one
    filters:
      - field: log.activityType
        operator: IS_ONE_OF_TERMS
        value:
          - '23'
          - '25'
          - '37'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: github-org-member-add-remove
    name: 'GitHub: organization members added or removed'
    dataType: github
    filters:
      - field: log.action
        operator: IS_ONE_OF
        value:
          - 'member_added'
          - 'member_removed'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: github-org-membership
    name: 'GitHub: organization members added, invited or removed'
    dataType: github
    filters:
      - field: log.action
        operator: IS_ONE_OF
        value:
          - 'member_added'
          - 'member_removed'
          - 'member_invited'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-central-user-created
    name: 'Sophos Central: new user accounts created in the Central directory are recorded'
    dataType: sophos-central
    filters:
      - field: action
        operator: IS
        value: 'Event::Endpoint::UserAutoCreated'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
