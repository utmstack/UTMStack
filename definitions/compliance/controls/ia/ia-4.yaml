  - key: macos-account-changes
    name: 'macOS: local account changes made with sysadminctl are recorded'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS
        value: 'sysadminctl'
      - field: log.message
        operator: CONTAIN_ONE_OF
        value:
          - 'Creating user record'
          - 'Deleting record for'
          - 'Adding user to admin group'
          - 'Removing user from admin group'
