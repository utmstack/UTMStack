# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ia-5.1
family: ia
familyName: Identification and Authentication
name: Authenticator Management | Password-based Authentication
scope: governance
statement: |-
  For password-based authentication: maintain and check a list of commonly-used, expected or compromised passwords; transmit passwords only over cryptographically-protected channels; store passwords using an approved salted key derivation function; require immediate selection of a new password upon account recovery; allow long passwords and passphrases; employ automated tools to help users select strong passwords; and enforce [composition and complexity rules].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the authentication settings, such as MFA and password policy, as a screenshot or export.
source: NIST SP 800-53 Rev 5 (public domain)
