# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ca-3
family: ca
familyName: Assessment, Authorization, and Monitoring
name: Information Exchange
scope: governance
statement: |-
  Approve and manage the exchange of information between the system and other systems using [interconnection security agreements | information exchange security agreements | memoranda of understanding or agreement | service level agreements | user agreements | non-disclosure agreements | [organization-defined value]];
  Document, as part of each exchange agreement, the interface characteristics, security and privacy requirements, controls, and responsibilities for each system, and the impact level of the information communicated; and
  Review and update the agreements [frequency].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the assessment report, the plan of action and milestones, or the authorization record.
source: NIST SP 800-53 Rev 5 (public domain)
