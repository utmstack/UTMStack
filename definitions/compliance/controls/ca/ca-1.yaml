# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: ca-1
family: ca
familyName: Assessment, Authorization, and Monitoring
name: Policy and Procedures
scope: governance
statement: |-
  Develop, document, and disseminate to [organization-defined personnel or roles]:
      [organization-level | mission/business process-level | system-level] assessment, authorization, and monitoring policy that:
        Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
        Is consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and
      Procedures to facilitate the implementation of the assessment, authorization, and monitoring policy and the associated assessment, authorization, and monitoring controls;
    Designate an [official] to manage the development, documentation, and dissemination of the assessment, authorization, and monitoring policy and procedures; and
    Review and update the current assessment, authorization, and monitoring:
      Policy [frequency] and following [events] ; and
      Procedures [frequency] and following [events].
source: NIST SP 800-53 Rev 5 (public domain)
