# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ca-9
family: ca
familyName: Assessment, Authorization, and Monitoring
name: Internal System Connections
scope: governance
statement: |-
  Authorize internal connections of [system components] to the system;
  Document, for each internal connection, the interface characteristics, security and privacy requirements, and the nature of the information communicated;
  Terminate internal system connections after [conditions]; and
  Review [frequency] the continued need for each internal connection.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the assessment report, the plan of action and milestones, or the authorization record.
source: NIST SP 800-53 Rev 5 (public domain)
