# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pt-8
family: pt
familyName: Personally Identifiable Information Processing and Transparency
name: Computer Matching Requirements
scope: governance
statement: |-
  When a system or organization processes information for the purpose of conducting a matching program:
  Obtain approval from the Data Integrity Board to conduct the matching program;
  Develop and enter into a computer matching agreement;
  Publish a matching notice in the Federal Register;
  Independently verify the information produced by the matching program before taking adverse action against an individual, if required; and
  Provide individuals with notice and an opportunity to contest the findings before taking adverse action against an individual.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the privacy notice, consent records or the register of processing purposes.
source: NIST SP 800-53 Rev 5 (public domain)
