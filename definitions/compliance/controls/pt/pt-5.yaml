# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pt-5
family: pt
familyName: Personally Identifiable Information Processing and Transparency
name: Privacy Notice
scope: governance
statement: |-
  Provide notice to individuals about the processing of personally identifiable information that:
  Is available to individuals upon first interacting with an organization, and subsequently at [frequency];
  Is clear and easy-to-understand, expressing information about personally identifiable information processing in plain language;
  Identifies the authority that authorizes the processing of personally identifiable information;
  Identifies the purposes for which personally identifiable information is to be processed; and
  Includes [information].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the privacy notice, consent records or the register of processing purposes.
source: NIST SP 800-53 Rev 5 (public domain)
