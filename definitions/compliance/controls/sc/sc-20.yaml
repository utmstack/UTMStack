# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sc-20
family: sc
familyName: System and Communications Protection
name: Secure Name/Address Resolution Service (Authoritative Source)
scope: governance
statement: |-
  Provide additional data origin authentication and integrity verification artifacts along with the authoritative name resolution data the system returns in response to external name/address resolution queries; and
  Provide the means to indicate the security status of child zones and (if the child supports secure resolution services) to enable verification of a chain of trust among parent and child domains, when operating as part of a distributed, hierarchical namespace.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example network or cryptography configuration evidence: diagrams, TLS settings, key management records.
source: NIST SP 800-53 Rev 5 (public domain)
