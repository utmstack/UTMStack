# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sc-38
family: sc
familyName: System and Communications Protection
name: Operations Security
scope: governance
statement: |-
  Employ the following operations security controls to protect key organizational information throughout the system development life cycle: [operations security controls].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example network or cryptography configuration evidence: diagrams, TLS settings, key management records.
source: NIST SP 800-53 Rev 5 (public domain)
