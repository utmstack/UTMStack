# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: sc-7
family: sc
familyName: System and Communications Protection
name: Boundary Protection
scope: data
statement: |-
  Monitor and control communications at the external managed interfaces to the system and at key internal managed interfaces within the system;
  Implement subnetworks for publicly accessible system components that are [physically | logically] separated from internal organizational networks; and
  Connect to external networks or systems only through managed interfaces consisting of boundary protection devices arranged in accordance with an organizational security and privacy architecture.
remediation: |-
  Passes when a firewall or other boundary device sends its traffic logs to UTMStack.
  If it fails: connect the perimeter firewalls and log both allowed and denied traffic.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: azure-edge-traffic-logs
    name: 'Azure: Front Door, Application Gateway and WAF traffic logs are received'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS_ONE_OF_TERMS
        value:
          - 'frontdoor'
          - 'frontdoor-waf'
          - 'gateway'
          - 'waf'
          - 'appservice-ipsec'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-firewall-traffic-logs
    name: 'Azure Firewall: traffic logs are received'
    dataType: azure
    filters:
      - field: log.category
        operator: IS_ONE_OF_TERMS
        value:
          - 'AZFWNetworkRule'
          - 'AZFWApplicationRule'
          - 'AZFWNatRule'
          - 'AzureFirewallNetworkRule'
          - 'AzureFirewallApplicationRule'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-network-firewall-flows
    name: 'AWS: Network Firewall flow logs are received'
    dataType: aws
    filters:
      - field: log.event.event_type
        operator: IS
        value: 'netflow'
      - field: log.event.netflow.pkts
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-firewall-rule-logs
    name: 'Google Cloud: VPC firewall rule logs are received'
    dataType: google
    filters:
      - field: log.jsonPayloadDisposition
        operator: IS_ONE_OF
        value:
          - 'ALLOWED'
          - 'DENIED'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: asa-connection-logs
    name: 'Cisco ASA: connection build and teardown logs are recorded'
    dataType: firewall-cisco-asa
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '302013'
          - '302014'
          - '302015'
          - '302016'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: ftd-connection-events
    name: 'Cisco Firepower: connection events are recorded'
    dataType: firewall-cisco-firepower
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - '430002'
          - '430003'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-traffic-logs
    name: 'FortiGate: traffic logs are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.type
        operator: IS
        value: 'traffic'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fortiweb-traffic-attack-logs
    name: 'FortiWeb: web traffic and attack logs are recorded'
    dataType: firewall-fortiweb
    filters:
      - field: log.type
        operator: IS_ONE_OF_TERMS
        value:
          - 'attack'
          - 'traffic'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: meraki-flow-logs
    name: 'Cisco Meraki: flow, firewall and URL logs are recorded'
    dataType: firewall-meraki
    filters:
      - field: log.merakiGroup
        operator: IS_ONE_OF_TERMS
        value:
          - 'flows'
          - 'firewall'
          - 'vpn_firewall'
          - 'cellular_firewall'
          - 'l7_firewall'
          - 'ip_flow_start'
          - 'ip_flow_end'
          - 'urls'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: mikrotik-firewall-logs
    name: 'MikroTik: firewall logs are recorded'
    dataType: firewall-mikrotik
    filters:
      - field: log.topics
        operator: CONTAIN
        value: 'firewall'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-traffic-logs
    name: 'Palo Alto: traffic logs are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS
        value: 'TRAFFIC'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: pfsense-filterlog
    name: 'pfSense: packet filter logs are recorded'
    dataType: firewall-pfsense
    filters:
      - field: log.eventType
        operator: IS
        value: 'filterlog'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-traffic-logs
    name: 'SonicWall: connection and web traffic logs are recorded'
    dataType: firewall-sonicwall
    filters:
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '97'
          - '98'
          - '537'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-xg-traffic-logs
    name: 'Sophos Firewall: firewall traffic logs are recorded'
    dataType: firewall-sophos-xg
    filters:
      - field: log.type
        operator: IS
        value: 'Firewall'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: netflow-flow-records
    name: 'NetFlow: flow records with a protocol are recorded'
    dataType: netflow
    filters:
      - field: protocol
        operator: IS_NOT
        value: ''
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: suricata-flow-records
    name: 'Suricata: network flow records are recorded'
    dataType: suricata
    filters:
      - field: log.eventType
        operator: IS
        value: 'flow'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
