  - key: suricata-cleartext-flows
    name: 'Suricata: no established FTP, Telnet, rexec/rlogin or TFTP flows'
    dataType: suricata
    filters:
      - field: log.eventType
        operator: IS
        value: 'flow'
      - field: actionResult
        operator: IS
        value: 'success'
      - field: target.port
        operator: IS_ONE_OF_TERMS
        value:
          - '21'
          - '23'
          - '69'
          - '512'
          - '513'
    rule: THRESHOLD_MAX
    ruleValue: 0
