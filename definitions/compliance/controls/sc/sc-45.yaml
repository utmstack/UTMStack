# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: sc-45
family: sc
familyName: System and Communications Protection
name: System Time Synchronization
scope: data
statement: |-
  Synchronize system clocks within and between systems and system components.
remediation: |-
  Passes when a connected source shows its clock being synchronised with a time source.
  If it fails: configure time synchronisation against an authoritative source and log it.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-time-sync
    name: 'Windows: clock synchronization is recorded'
    dataType: wineventlog
    filters:
      - field: log.providerName
        operator: IS
        value: 'Microsoft-Windows-Time-Service'
      - field: log.eventCode
        operator: IS_ONE_OF_TERMS
        value:
          - '35'
          - '37'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-time-sync
    name: 'Linux: clock synchronization is recorded'
    dataType: linux
    filters:
      - field: log.syslogIdentifier
        operator: IS_ONE_OF_TERMS
        value:
          - 'systemd-timesyncd'
          - 'chronyd'
          - 'ntpd'
          - 'ntpdate'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-time-sync
    name: 'macOS: clock synchronization is recorded'
    dataType: macos
    filters:
      - field: origin.process
        operator: IS
        value: 'timed'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-ntp-sync
    name: 'Palo Alto: NTP synchronization is recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paSubtype
        operator: IS
        value: 'ntpd'
      - field: log.eventid
        operator: IS
        value: 'sync'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sonicwall-ntp-sync
    name: 'SonicWall: NTP time updates are recorded'
    dataType: firewall-sonicwall
    filters:
      - field: log.eventCode
        operator: IS
        value: '1231'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
