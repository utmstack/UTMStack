# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: sc-1
family: sc
familyName: System and Communications Protection
name: Policy and Procedures
scope: governance
statement: |-
  Develop, document, and disseminate to [organization-defined personnel or roles]:
      [organization-level | mission/business-process-level | system-level] system and communications protection policy that:
        Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
        Is consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and
      Procedures to facilitate the implementation of the system and communications protection policy and the associated system and communications protection controls;
    Designate an [official] to manage the development, documentation, and dissemination of the system and communications protection policy and procedures; and
    Review and update the current system and communications protection:
      Policy [frequency] and following [events] ; and
      Procedures [frequency] and following [events].
source: NIST SP 800-53 Rev 5 (public domain)
