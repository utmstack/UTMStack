# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-20
family: pe
familyName: Physical and Environmental Protection
name: Asset Monitoring and Tracking
scope: governance
statement: Employ [asset location technologies] to track and monitor the location and movement of [assets]
  within [controlled areas].
source: NIST SP 800-53 Rev 5 (public domain)
