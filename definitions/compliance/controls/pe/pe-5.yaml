# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-5
family: pe
familyName: Physical and Environmental Protection
name: Access Control for Output Devices
scope: governance
statement: Control physical access to output from [output devices] to prevent unauthorized individuals
  from obtaining the output.
source: NIST SP 800-53 Rev 5 (public domain)
