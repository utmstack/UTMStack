# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-22
family: pe
familyName: Physical and Environmental Protection
name: Component Marking
scope: governance
statement: Mark [system hardware components] indicating the impact level or classification level of the
  information permitted to be processed, stored, or transmitted by the hardware component.
source: NIST SP 800-53 Rev 5 (public domain)
