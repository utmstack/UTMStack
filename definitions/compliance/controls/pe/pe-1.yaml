# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-1
family: pe
familyName: Physical and Environmental Protection
name: Policy and Procedures
scope: governance
statement: |-
  Develop, document, and disseminate to [organization-defined personnel or roles]:
      [organization-level | mission/business process-level | system-level] physical and environmental protection policy that:
        Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
        Is consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and
      Procedures to facilitate the implementation of the physical and environmental protection policy and the associated physical and environmental protection controls;
    Designate an [official] to manage the development, documentation, and dissemination of the physical and environmental protection policy and procedures; and
    Review and update the current physical and environmental protection:
      Policy [frequency] and following [events] ; and
      Procedures [frequency] and following [events].
source: NIST SP 800-53 Rev 5 (public domain)
