# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-10
family: pe
familyName: Physical and Environmental Protection
name: Emergency Shutoff
scope: governance
statement: |-
  Provide the capability of shutting off power to [system or individual system components] in emergency situations;
    Place emergency shutoff switches or devices in [location] to facilitate access for authorized personnel; and
    Protect emergency power shutoff capability from unauthorized activation.
source: NIST SP 800-53 Rev 5 (public domain)
