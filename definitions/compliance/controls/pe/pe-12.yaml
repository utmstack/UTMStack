# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-12
family: pe
familyName: Physical and Environmental Protection
name: Emergency Lighting
scope: governance
statement: Employ and maintain automatic emergency lighting for the system that activates in the event
  of a power outage or disruption and that covers emergency exits and evacuation routes within the facility.
source: NIST SP 800-53 Rev 5 (public domain)
