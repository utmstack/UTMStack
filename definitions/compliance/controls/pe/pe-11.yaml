# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-11
family: pe
familyName: Physical and Environmental Protection
name: Emergency Power
scope: governance
statement: Provide an uninterruptible power supply to facilitate [an orderly shutdown of the system |
  transition of the system to long-term alternate power] in the event of a primary power source loss.
source: NIST SP 800-53 Rev 5 (public domain)
