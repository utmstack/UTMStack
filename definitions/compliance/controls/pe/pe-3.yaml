# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pe-3
family: pe
familyName: Physical and Environmental Protection
name: Physical Access Control
scope: governance
statement: |-
  Enforce physical access authorizations at [entry and exit points] by:
  Verifying individual access authorizations before granting access to the facility; and
  Controlling ingress and egress to the facility using [[organization-defined value] | guards];
  Maintain physical access audit logs for [entry or exit points];
  Control access to areas within the facility designated as publicly accessible by implementing the following controls: [physical access controls];
  Escort visitors and control visitor activity [circumstances];
  Secure keys, combinations, and other physical access devices;
  Inventory [physical access devices] every [frequency]; and
  Change combinations and keys [organization-defined frequency] and/or when keys are lost, combinations are compromised, or when individuals possessing the keys or combinations are transferred or terminated.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example physical access lists, visitor logs and facility protection evidence.
source: NIST SP 800-53 Rev 5 (public domain)
