# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-18
family: pe
familyName: Physical and Environmental Protection
name: Location of System Components
scope: governance
statement: Position system components within the facility to minimize potential damage from [physical
  and environmental hazards] and to minimize the opportunity for unauthorized access.
source: NIST SP 800-53 Rev 5 (public domain)
