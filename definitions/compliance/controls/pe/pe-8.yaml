# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: pe-8
family: pe
familyName: Physical and Environmental Protection
name: Visitor Access Records
scope: governance
statement: |-
  Maintain visitor access records to the facility where the system resides for [time period];
    Review visitor access records [frequency] ; and
    Report anomalies in visitor access records to [personnel].
source: NIST SP 800-53 Rev 5 (public domain)
