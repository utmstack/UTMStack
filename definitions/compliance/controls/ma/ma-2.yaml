# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: ma-2
family: ma
familyName: Maintenance
name: Controlled Maintenance
scope: governance
statement: |-
  Schedule, document, and review records of maintenance, repair, and replacement on system components in accordance with manufacturer or vendor specifications and/or organizational requirements;
  Approve and monitor all maintenance activities, whether performed on site or remotely and whether the system or system components are serviced on site or removed to another location;
  Require that [personnel or roles] explicitly approve the removal of the system or system components from organizational facilities for off-site maintenance, repair, or replacement;
  Sanitize equipment to remove the following information from associated media prior to removal from organizational facilities for off-site maintenance, repair, or replacement: [information];
  Check all potentially impacted controls to verify that the controls are still functioning properly following maintenance, repair, or replacement actions; and
  Include the following information in organizational maintenance records: [information].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example maintenance records, approvals and the list of authorised maintenance staff.
source: NIST SP 800-53 Rev 5 (public domain)
