# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sr-10
family: sr
familyName: Supply Chain Risk Management
name: Inspection of Systems or Components
scope: governance
statement: |-
  Inspect the following systems or system components [at random | at [organization-defined value] | upon [organization-defined value]] to detect tampering: [systems or system components].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example supplier assessments, the supply chain risk plan or contract clauses.
source: NIST SP 800-53 Rev 5 (public domain)
