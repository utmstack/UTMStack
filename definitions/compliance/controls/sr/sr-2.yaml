# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: sr-2
family: sr
familyName: Supply Chain Risk Management
name: Supply Chain Risk Management Plan
scope: governance
statement: |-
  Develop a plan for managing supply chain risks associated with the research and development, design, manufacturing, acquisition, delivery, integration, operations and maintenance, and disposal of the following systems, system components or system services: [systems, system components, or system services];
  Review and update the supply chain risk management plan [frequency] or as required, to address threat, organizational or environmental changes; and
  Protect the supply chain risk management plan from unauthorized disclosure and modification.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example supplier assessments, the supply chain risk plan or contract clauses.
source: NIST SP 800-53 Rev 5 (public domain)
