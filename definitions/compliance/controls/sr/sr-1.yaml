# Reusable control (NIST 800-53 r5). Governance control — not provable from log data.
id: sr-1
family: sr
familyName: Supply Chain Risk Management
name: Policy and Procedures
scope: governance
statement: |-
  Develop, document, and disseminate to [organization-defined personnel or roles]:
      [organization-level | mission/business process-level | system-level] supply chain risk management policy that:
        Addresses purpose, scope, roles, responsibilities, management commitment, coordination among organizational entities, and compliance; and
        Is consistent with applicable laws, executive orders, directives, regulations, policies, standards, and guidelines; and
      Procedures to facilitate the implementation of the supply chain risk management policy and the associated supply chain risk management controls;
    Designate an [official] to manage the development, documentation, and dissemination of the supply chain risk management policy and procedures; and
    Review and update the current supply chain risk management:
      Policy [frequency] and following [events] ; and
      Procedures [frequency] and following [events].
source: NIST SP 800-53 Rev 5 (public domain)
