id: banking-audit-850
family: banking-audit
familyName: BANKING AUDIT
name: Windows Changes in account status
scope: data
statement: "The Windows Changes in Account Status Report provides a detailed record of all modifications to user account status, such as activations, deactivations, or lockouts. This report is critical within the Banking Audit framework to ensure compliance with access control policies and to protect sensitive financial systems.<br/>\t•\tBanking Regulations: Aligns with the GLBA Safeguards Rule, ensuring proper monitoring and control over account status changes to safeguard customer information.<br/>\t•\tAccess Control Compliance: Supports compliance with PCI DSS Requirement 8, ensuring that account status changes are tracked, authorized, and appropriately managed.<br/>\t•\tAudit Readiness: Provides traceability for account status modifications, meeting the requirements of frameworks like SOC2 Type 2 and ISO 27001, ensuring secure account management.<br/>\t•\tIncident Detection: Identifies unauthorized or suspicious account status changes, such as unexpected activations or lockouts, which could indicate compromised accounts or insider threats.<br/>\t•\tData Protection: Ensures compliance with GDPR Article 32, demonstrating controls to monitor and restrict unauthorized changes to account status that could expose sensitive financial data."
strategy: ANY
checks:
  - key: windows-changes-in-account-status
    name: Windows Changes in account status
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4722'
          - '4723'
          - '4725'
          - '4726'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-security-events-by-category
    name: Windows Security Events by Category
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4722'
          - '4723'
          - '4725'
          - '4726'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
