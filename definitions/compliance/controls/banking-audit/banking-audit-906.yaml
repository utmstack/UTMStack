id: banking-audit-906
family: banking-audit
familyName: BANKING AUDIT
name: Windows PowerShell Remote Session Creation
scope: data
statement: "The Windows PowerShell Remote Session Creation Report provides detailed logs of events where remote PowerShell sessions are established, capturing information such as the initiating user, source IP address, session commands, and timestamps. This report is critical for ensuring compliance with Real-Time Alerting and Monitoring within the Banking Audit framework, as remote PowerShell sessions can be exploited for unauthorized access or malicious activities.<br/>\t•\tRegulatory Compliance: Aligns with the GLBA Safeguards Rule, ensuring oversight of remote session activities to protect sensitive financial systems and customer data.<br/>\t•\tAccess Control Monitoring: Supports compliance with PCI DSS Requirement 10, ensuring all remote access attempts and activities are logged and monitored.<br/>\t•\tReal-Time Alerting: Captures and notifies administrators immediately of remote PowerShell session creations, enabling rapid response to potential threats.<br/>\t•\tIncident Detection: Identifies unauthorized or suspicious remote session activities, such as from unusual IP addresses or privilege escalation attempts, which may indicate account compromise or insider threats.<br/>\t•\tAudit Readiness: Tracks all remote PowerShell session events to ensure compliance with frameworks like SOC2 Type 2 and ISO 27001, demonstrating secure and accountable access management practices."
strategy: ANY
checks:
  - key: windows-powershell-remote-session-creation
    name: Windows PowerShell Remote Session Creation
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4105'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-powershell-remote-session-creation-by-host
    name: Windows PowerShell Remote Session Creation by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4105'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
