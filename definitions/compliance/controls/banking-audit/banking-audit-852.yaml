id: banking-audit-852
family: banking-audit
familyName: BANKING AUDIT
name: Windows Use of Elevated Privileges
scope: data
statement: "The Windows Use of Elevated Privileges Report provides a comprehensive log of actions performed using elevated or administrative privileges. This report is critical for ensuring compliance within the Banking Audit framework, helping organizations monitor privileged user activities and safeguard sensitive financial systems.<br/>\t•\tBanking Regulations: Aligns with the GLBA Safeguards Rule, demonstrating oversight and control over the use of administrative privileges to protect customer data.<br/>\t•\tAccess Control Compliance: Supports compliance with PCI DSS Requirement 7, ensuring that elevated privileges are restricted and monitored to prevent unauthorized access to critical resources.<br/>\t•\tAudit Readiness: Documents all privileged operations, meeting the requirements of frameworks like SOC2 Type 2 and ISO 27001, ensuring traceability and accountability for administrative actions.<br/>\t•\tIncident Detection: Identifies suspicious or unauthorized use of elevated privileges, such as privilege escalation or misuse of administrative accounts.<br/>\t•\tData Protection: Ensures compliance with GDPR Article 32, showcasing controls to restrict and monitor access to sensitive data through elevated privileges."
strategy: ANY
checks:
  - key: windows-use-of-elevated-privileges
    name: Windows Use of Elevated Privileges
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4673'
          - '4674'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-use-of-elevated-privileges-by-outcome
    name: Windows Use of Elevated Privileges by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4673'
          - '4674'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
