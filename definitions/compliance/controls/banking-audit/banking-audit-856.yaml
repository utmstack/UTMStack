id: banking-audit-856
family: banking-audit
familyName: BANKING AUDIT
name: Windows PowerShell Remote Session Creation
scope: data
statement: "The Windows PowerShell Remote Session Creation Report provides a detailed log of remote PowerShell session creation events, including details about the initiating user, target system, and session activity. This report is critical within the Banking Audit framework, as PowerShell remote sessions can be used to manage systems but also pose significant security risks if misused.<br/>\t•\tBanking Regulations: Aligns with the GLBA Safeguards Rule, ensuring the monitoring of remote session activities to protect sensitive financial systems and customer data.<br/>\t•\tAccess Control Compliance: Supports compliance with PCI DSS Requirement 8, ensuring secure authentication and access control for remote sessions.<br/>\t•\tAudit Readiness: Tracks remote PowerShell session creation events, providing traceability for frameworks like SOC2 Type 2 and ISO 27001, ensuring accountability in remote system management.<br/>\t•\tThreat Detection: Identifies unauthorized or suspicious remote session activity, which could indicate compromised accounts, insider threats, or lateral movement by attackers.<br/>\t•\tData Protection: Ensures compliance with GDPR Article 32, demonstrating controls to monitor and restrict unauthorized remote access to systems handling sensitive financial data."
strategy: ANY
checks:
  - key: windows-powershell-remote-session-creation
    name: Windows PowerShell Remote Session Creation
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4105')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-powershell-remote-session-creation-by-host
    name: Windows PowerShell Remote Session Creation by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4105')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
