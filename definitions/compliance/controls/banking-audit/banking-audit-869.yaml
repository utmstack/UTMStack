id: banking-audit-869
family: banking-audit
familyName: BANKING AUDIT
name: Windows User Password Reset Attempt
scope: data
statement: "The Windows User Password Reset Attempt Report provides a detailed record of password reset activities, capturing both successful and failed attempts. This report is critical within the Banking Audit framework to monitor credential management processes and ensure compliance with access control policies.<br/>\t•\tBanking Regulations: Aligns with the GLBA Safeguards Rule, ensuring oversight of password reset attempts to protect financial systems and sensitive customer data.<br/>\t•\tAccess Control Compliance: Supports compliance with PCI DSS Requirement 8, which mandates secure authentication and password management practices.<br/>\t•\tAudit Readiness: Tracks all password reset attempts, providing traceability and accountability for frameworks like SOC2 Type 2 and ISO 27001.<br/>\t•\tIncident Detection: Identifies unauthorized or suspicious password reset attempts, which could indicate account compromise, phishing attacks, or insider threats.<br/>\t•\tData Protection: Ensures compliance with GDPR Article 32, demonstrating controls to monitor and restrict unauthorized password reset activities to prevent unauthorized access to sensitive data."
strategy: ANY
checks:
  - key: windows-user-password-reset-attempt
    name: Windows User Password Reset Attempt
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4723')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-password-reset-attempt-by-outcome
    name: Windows User Password Reset Attempt by Outcome
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4723')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
