id: banking-audit-860
family: banking-audit
familyName: BANKING AUDIT
name: Windows Credential Access
scope: data
statement: "The Windows Credential Access Report provides detailed logs of events related to credential access, including successful and failed attempts to retrieve or use user credentials, such as password hashes, security tokens, or Kerberos tickets. This report is critical within the Banking Audit framework to monitor unauthorized credential access and ensure the protection of sensitive financial systems.<br/>\t•\tBanking Regulations: Aligns with the GLBA Safeguards Rule, demonstrating oversight and control over credential access to safeguard sensitive customer data and financial systems.<br/>\t•\tAccess Control Compliance: Supports compliance with PCI DSS Requirement 8, which mandates secure authentication and management of user credentials to prevent unauthorized access.<br/>\t•\tAudit Readiness: Tracks credential access events, providing traceability for frameworks like SOC2 Type 2 and ISO 27001, ensuring accountability in credential management.<br/>\t•\tIncident Detection: Identifies unauthorized or suspicious attempts to access credentials, such as pass-the-hash attacks, keylogging, or unauthorized Kerberos ticket usage.<br/>\t•\tData Protection: Ensures compliance with GDPR Article 32, showcasing controls to monitor, restrict, and secure credential access to prevent unauthorized data breaches."
strategy: ANY
checks:
  - key: windows-credential-access
    name: Windows Credential Access
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5379'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-credential-access-by-domain
    name: Windows Credential Access by Domain
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5379'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
