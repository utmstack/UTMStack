id: banking-audit-889
family: banking-audit
familyName: BANKING AUDIT
name: Windows Member Addition to a Security Local Group
scope: data
statement: "he Windows Member Addition to a Security Local Group Report provides detailed logs of events where users or accounts are added to local security groups. This report is critical within the Banking Audit framework to ensure compliance with Real-Time Alerting and Monitoring, as group membership changes can directly impact access control and system security.<br/>\t•\tRegulatory Compliance: Aligns with the GLBA Safeguards Rule, ensuring visibility and control over group membership changes to protect financial systems and sensitive data.<br/>\t•\tAccess Control Compliance: Supports compliance with PCI DSS Requirement 7, ensuring restricted access to critical resources and tracking all group membership changes.<br/>\t•\tReal-Time Alerting: Captures and notifies administrators of member additions in real-time, enabling immediate review and action to address unauthorized changes.<br/>\t•\tIncident Detection: Identifies unauthorized or suspicious additions to privileged groups, such as the Administrators group, which could indicate insider threats or compromised accounts.<br/>\t•\tAudit Readiness: Provides traceability of group membership changes, ensuring compliance with frameworks like SOC2 Type 2 and ISO 27001, demonstrating secure access management practices."
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
