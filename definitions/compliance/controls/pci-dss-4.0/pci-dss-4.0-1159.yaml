id: pci-dss-4.0-1159
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 7.3 Account Logon Failure
scope: data
statement: This report compiles relevant information from Windows 4625 events, which record failed login attempts. These event data are essential for assessing compliance with PCI DSS Requirement 7.3, which mandates that access to system components and data must be managed through an access control system. 4625 events provide details on unauthorized access attempts, allowing you to verify that the system is configured to reject unauthorized access and to alert you to potential security risks. This report helps audit the effectiveness of access control, ensuring that only legitimate users with the necessary privileges have access to sensitive systems and data.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    dataType: wineventlog
    filters:
      - field: log.statusDescription
        operator: IS_ONE_OF_TERMS
        value:
          - Logon failure
          - Clients credentials have been revoked
          - Pre-authentication information was invalid
          - Account restriction
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
