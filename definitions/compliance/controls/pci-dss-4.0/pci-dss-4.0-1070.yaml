id: pci-dss-4.0-1070
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 User Accounts Enabled
scope: data
statement: This report collects the 4722 events generated by the Windows system, which indicate the enabling of user accounts. The analysis of these events is key to verify compliance with PCI DSS requirements, ensuring that the roles and responsibilities associated with the management of user accounts and their access to critical systems are properly documented, assigned, and understood. In addition, it provides visibility into the enabling of accounts and ensures that the activated accounts are aligned with established security policies and operating procedures.
strategy: ANY
checks:
  - key: windows-user-accounts-enabled
    name: Windows User Accounts Enabled
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4722'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-accounts-enabled-by-target-user
    name: Windows User Accounts Enabled by Target User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4722'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
