id: pci-dss-4.0-1079
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Account Logon Success
scope: data
statement: This report collects 4624 events generated by the Windows system, which record successful logons to the system. Analysis of these events is key to verifying compliance with PCI DSS requirements, ensuring that the roles and responsibilities associated with accessing the system and performing critical activities are properly documented, assigned, and understood. Additionally, it provides visibility into which users and accounts are accessing systems, allowing validation that the right people have the necessary permissions to perform security activities related to installing and maintaining network controls, in accordance with established operational policies and procedures.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4672'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4324'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: IS_NOT
        value: '-'
      - field: log.logonType
        operator: IS_ONE_OF_TERMS
        value:
          - '3'
          - '2'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
