id: pci-dss-4.0-1204
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.3 Account Logon Failure
scope: data
statement: This report is designed to assess compliance with PCI DSS Requirement 11.3.1.2, which requires internal vulnerability scans to be conducted using authenticated scans. Using logs generated by Windows event 4625, this report collects relevant information about failed login attempts, which may indicate issues with the credentials used in authenticated scans. The report helps verify that systems unable to accept credentials for authenticated scans are properly documented and that systems that allow such scans use sufficient privileges to ensure a proper security assessment. It also ensures that accounts used for authenticated scans that allow interactive logins are managed in accordance with the requirements established in PCI DSS Requirement 8.2.2, ensuring proper handling of credentials and their alignment with security best practices.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    dataType: wineventlog
    filters:
      - field: log.statusDescription
        operator: IS_ONE_OF_TERMS
        value:
          - Logon failure
          - Clients credentials have been revoked
          - Pre-authentication information was invalid
          - Account restriction
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
