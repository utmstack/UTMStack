id: pci-dss-4.0-1067
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Cleaned Event Log
scope: data
statement: This report captures Windows system event 1102, which indicates the cleanup of system audit logs. Analysis of these events is essential to verify compliance with PCI DSS requirements, ensuring that audit policies and procedures are documented, up-to-date, and in use. It also monitors the integrity of audit logs, ensuring that they are not inappropriately altered or deleted, and that defined operational best practices for security are followed.
strategy: ANY
checks:
  - key: windows-cleaned-event-log
    name: Windows Cleaned Event Log
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-cleaned-event-log-by-source
    name: Windows Cleaned Event Log by Source
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
