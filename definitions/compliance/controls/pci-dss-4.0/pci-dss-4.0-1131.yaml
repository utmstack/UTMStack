id: pci-dss-4.0-1131
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 5.1 Cleaned Event Log
scope: data
statement: This report collects and analyzes information generated by Windows 1102 events, which indicate the deletion of records in the system's Event Viewer. Since log integrity is critical for monitoring and detecting malicious activity, this report assesses compliance with PCI DSS Requirement 5.1, ensuring that malware protection mechanisms are documented, updated, and in use.<br/><br/>Analyzing these events helps identify potential attempts to hide suspicious activity, ensuring that the security infrastructure maintains adequate records for threat detection and prevention.
strategy: ANY
checks:
  - key: windows-cleaned-event-log
    name: Windows Cleaned Event Log
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-cleaned-event-log-by-source
    name: Windows Cleaned Event Log by Source
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1102'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
