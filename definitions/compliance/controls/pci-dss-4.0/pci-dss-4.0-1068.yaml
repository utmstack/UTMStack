id: pci-dss-4.0-1068
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Policy changes
scope: data
statement: This report consolidates the 4719 events generated by the Windows system, which record changes to the system audit policy configuration. Analysis of these events is key to verifying compliance with PCI DSS requirements, ensuring that audit policies related to the installation and maintenance of security controls are documented, up-to-date, and in use according to defined operating procedures. Additionally, it provides visibility into the adequacy and consistency of audit configurations, ensuring that security practices stipulated by organizational policies are followed.
strategy: ANY
checks:
  - key: windows-policy-changes
    name: Windows Policy changes
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4663'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-policy-changes-by-outcome
    name: Windows Policy changes by outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4719'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
