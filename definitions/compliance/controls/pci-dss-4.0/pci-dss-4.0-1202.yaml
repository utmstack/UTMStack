id: pci-dss-4.0-1202
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.3 Error Reporting
scope: data
statement: This report compiles and presents relevant information extracted from the logs generated by Windows Event 1001 to assess compliance with PCI DSS Requirement 11.3. This requirement mandates internal vulnerability scans at least every three months, prioritizing high-risk or critical vulnerabilities. This report verifies that scans are performed in accordance with the organization's standards, that critical vulnerabilities are resolved, and that rescans are executed to confirm the correction.
strategy: ANY
checks:
  - key: windows-error-reporting
    name: Windows Error Reporting
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1001')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-error-reporting-by-host
    name: Windows Error Reporting by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '1001')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
