id: pci-dss-4.0-1200
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.1 Local Security Group Member Removal
scope: data
statement: This report focuses on assessing compliance with PCI DSS requirement 11.1.2, which relates to the documentation, assignment, and understanding of roles and responsibilities for security testing activities. By analyzing logs generated by Windows event 4733, any changes to user roles can be verified, specifically the removal of a member from a security group, which is relevant to ensuring that security responsibilities are correctly assigned. This report ensures that the management of roles and privileges within the system remains aligned with the security processes defined and understood by all involved parties.
strategy: ANY
checks:
  - key: windows-local-security-group-member-removal
    name: Windows Local Security Group Member Removal
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4733')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-local-security-group-member-removal-by-group
    name: Windows Local Security Group Member Removal by Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4733')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
