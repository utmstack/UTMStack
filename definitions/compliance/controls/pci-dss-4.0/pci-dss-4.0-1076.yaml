id: pci-dss-4.0-1076
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Logins with explicit credentials
scope: data
statement: This report collects 4648 events generated by the Windows system, which record authentication attempts using specific user account credentials. Analysis of these events is crucial to verify compliance with PCI DSS requirements, ensuring that roles and responsibilities for authentication and access to critical systems are clearly documented, assigned, and understood by all responsible parties. Additionally, the report provides visibility into authentication attempts involving specific credentials, ensuring that access is managed appropriately and in line with defined security policies and operational procedures.
strategy: ANY
checks:
  - key: windows-logins-with-explicit-credentials
    name: Windows Logins with explicit credentials
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4648'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logins-with-explicit-credentials-by-user
    name: Windows Logins with explicit credentials by User
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4648'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
