id: pci-dss-4.0-1072
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Member Addition to a Security Local Group
scope: data
statement: This report collects 4732 events generated by the Windows system, which record the addition of users to security groups. Analyzing these events is essential for verifying compliance with PCI DSS Requirements, ensuring that roles and responsibilities for managing access to resources and privileges within the infrastructure are clearly documented, assigned, and understood. Additionally, this report provides visibility into the assignment of users to security groups, ensuring that access and permissions are granted according to defined security policies and procedures, and that activities are performed by the appropriate people.
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
