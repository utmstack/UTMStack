id: pci-dss-4.0-1057
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 Filtering Platform
scope: data
statement: This report compiles relevant information from logs generated by Windows event 5158, which is related to Windows Filtering Platform (WFP) configuration and network filtering rule changes. Event 5158 indicates when a service has started listening on a specific port, allowing you to audit and verify which services, protocols, and ports are enabled on the system. This event is essential for verifying that all allowed services, protocols, and ports have been identified, approved, and have a defined business need, as required by the PCI DSS standard. The information in this event helps ensure that only legitimate traffic necessary for the services to function is allowed, preventing potential vulnerabilities resulting from incorrect or unnecessary network configurations.
strategy: ANY
checks:
  - key: windows-filtering-platform
    name: Windows Filtering Platform
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5158'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-filtering-platform-by-protocol
    name: Windows Filtering Platform by Protocol
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '5158'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
