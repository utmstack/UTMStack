id: pci-dss-4.0-1080
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Account Logon Failure
scope: data
statement: This report captures 4625 events generated by the Windows system, which record failed logon attempts. Analysis of these events is crucial to verify compliance with PCI DSS requirements, ensuring that roles and responsibilities related to system access and security management are properly documented, assigned, and understood. It also helps detect potential unauthorized access attempts, helping to ensure that authentication and authorization activities are performed only by individuals designated to perform tasks related to security controls, in accordance with established policies and operating procedures.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    dataType: wineventlog
    filters:
      - field: log.statusDescription
        operator: IS_ONE_OF_TERMS
        value:
          - Logon failure
          - Clients credentials have been revoked
          - Pre-authentication information was invalid
          - Account restriction
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
