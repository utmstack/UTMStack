id: pci-dss-4.0-1199
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.1 Member Addition to a Security Local Group
scope: data
statement: This report assesses compliance with PCI DSS requirement 11.1.2, verifying that roles and responsibilities for security activities are documented, assigned, and understood.<br/><br/>By analyzing Windows 4732 events, changes to security groups are reviewed to ensure that privilege management is carried out in accordance with established policies. This allows for the detection of potential deviations and ensures the correct assignment of permissions within the monitored environment.
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
