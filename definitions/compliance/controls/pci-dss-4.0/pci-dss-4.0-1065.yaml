id: pci-dss-4.0-1065
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Process Creation
scope: data
statement: This report collects and analyzes the 4688 events generated by the Windows system, which record the creation and execution of critical processes. The analysis of these events is essential to ensure compliance with PCI DSS requirement, as it allows verifying that the processes related to the installation, configuration and maintenance of security controls are documented, updated and in proper use. In addition, it allows identifying the execution of relevant security tools and scripts, ensuring that operational practices are aligned with defined security policies and procedures.
strategy: ANY
checks:
  - key: windows-process-creation
    name: Windows Process Creation
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4688'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-creation-by-parent-process
    name: Windows Process Creation By Parent Process
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4688'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
