id: pci-dss-4.0-1203
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.3 Account Logon Success
scope: data
statement: This report focuses on gathering relevant information from logs generated by Windows event 4624 to assess compliance with PCI DSS Requirement 11.3.1.2. The purpose of this requirement is to ensure that internal vulnerability scans are performed using authenticated scans. By analyzing successful logon events, the report verifies that systems requiring credentials for authenticated scans are properly documented and managed. It also ensures that systems accepting credentials for scans use sufficient privileges and that, if accounts used for authenticated scanning can be used for interactive logins, these accounts are managed in accordance with the requirements established in PCI DSS Requirement 8.2.2. This report is essential to confirm that practices related to authenticated scans are aligned with the security policies and appropriate access controls defined by PCI DSS.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4672'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4324'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: IS_NOT
        value: '-'
      - field: log.logonType
        operator: IS_ONE_OF_TERMS
        value:
          - '3'
          - '2'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
