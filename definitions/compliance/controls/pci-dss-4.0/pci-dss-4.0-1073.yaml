id: pci-dss-4.0-1073
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Local Security Group Member Removal
scope: data
statement: This report compiles 4733 events generated by the Windows system, which record the removal of users from security groups. Analysis of these events is crucial to verify compliance with PCI DSS requirements, ensuring that roles and responsibilities for access and privilege management are clearly documented, assigned, and understood by all responsible parties. Additionally, this report provides visibility into changes in security group membership, ensuring that user removal is performed in accordance with established security policies and operating procedures, ensuring that activities are appropriately managed by the responsible individuals.
strategy: ANY
checks:
  - key: windows-local-security-group-member-removal
    name: Windows Local Security Group Member Removal
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4733'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-local-security-group-member-removal-by-group
    name: Windows Local Security Group Member Removal by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4733'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
