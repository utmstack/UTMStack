id: pci-dss-4.0-1060
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 File System Transaction Status Changes
scope: data
statement: This report compiles relevant information from logs generated by Windows event 4985, which is related to auditing activity related to changes in system object configurations. Event 4985 is triggered when an action is taken that affects security policies or access configurations, which may include relevant changes to network security controls (NSCs). This event is useful for confirming that NSC configurations are being regularly reviewed and that any modifications to the security infrastructure are properly documented. Analyzing these events allows verification that network controls are aligned with PCI DSS requirements, ensuring that NSC configurations are reviewed and adjusted, where necessary, to maintain their effectiveness and relevance.
strategy: ANY
checks:
  - key: windows-file-system-transaction-status-changes
    name: Windows File System Transaction Status Changes
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4985')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-file-system-transaction-status-changes-by-new-state
    name: Windows File System Transaction Status Changes by New State
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4985')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
