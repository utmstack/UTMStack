id: pci-dss-4.0-1054
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 Registry Value Modification
scope: data
statement: This report compiles relevant information from logs generated by Windows event 4657, which records configuration changes to security objects or system policies. This event is essential for auditing and verifying that changes made to network connection configurations and network security controls (NSC) have been made appropriately and in accordance with established control processes. This event ensures that all changes are approved and managed according to appropriate procedures, ensuring that the security infrastructure remains effective and free from unnecessary risks.
strategy: ANY
checks:
  - key: windows-registry-value-modification-by-process
    name: Windows Registry Value Modification by Process
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4657'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-registry-value-modification
    name: Windows Registry Value Modification
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4657'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
