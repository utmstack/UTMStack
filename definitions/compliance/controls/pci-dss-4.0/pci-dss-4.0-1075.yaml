id: pci-dss-4.0-1075
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Special privileges assigned to new logon
scope: data
statement: This report collects 4672 events generated by the Windows system, which records logons of accounts with elevated privileges. Analysis of these events is essential to verify compliance with PCI DSS requirements, ensuring that the roles and responsibilities of users with special privileges are clearly documented, assigned, and understood. Additionally, it provides visibility into the activities performed by users with administrative privileges, ensuring that access and permissions are assigned appropriately, in accordance with defined security policies and operating procedures, and that activities are managed by the responsible individuals.
strategy: ANY
checks:
  - key: windows-special-privileges-assigned-to-new-logon
    name: Windows Special privileges assigned to new logon
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4672'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-special-privileges-assigned-to-new-logon-2
    name: Windows Special privileges assigned to new logon
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4672'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
