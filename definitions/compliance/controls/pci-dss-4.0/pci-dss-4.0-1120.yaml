id: pci-dss-4.0-1120
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 3.4 Account Logon Success
scope: data
statement: This report compiles relevant information from Windows 4624 events to verify compliance with PCI DSS Requirement 3.4.2. This requirement establishes that, when remote access technologies are used, technical controls must prevent the copying and/or relocation of PANs (Primary Account Numbers) by all personnel, except those with express, documented authorization and a defined, legitimate business need.<br/><br/>Event 4624 provides details on successful login attempts to the system, allowing for effective auditing of system access. This event allows you to verify whether remote access is being performed by authorized personnel and whether technical measures are in place to prevent unauthorized manipulation of the PAN, thereby meeting the security requirements of PCI DSS.<br/><br/>Remote access to systems is analyzed, authenticated user identification is identified, and access controls and security policies are validated to prevent unauthorized access that could compromise the security of the PAN and other sensitive information stored or transmitted.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4624', '4672') AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4624', '4324') AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$' AND logx.wineventlog.event_data.TargetUserName.keyword <> '-' AND logx.wineventlog.event_data.LogonType.keyword IN ('3', '2'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
