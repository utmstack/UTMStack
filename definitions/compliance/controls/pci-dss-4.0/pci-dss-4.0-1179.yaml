id: pci-dss-4.0-1179
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 10.2 User Accounts Created
scope: data
statement: This report compiles relevant information from Windows Event 4720 logs, which indicate the creation of new user accounts. Its purpose is to verify that all actions performed by individuals with administrative access, including interactive use of system or application accounts, are logged in accordance with PCI DSS requirement 10.2.1.2. This monitoring contributes to the detection of suspicious activity and forensic analysis of events in the IT environment.
strategy: ANY
checks:
  - key: windows-user-accounts-created
    name: Windows User Accounts Created
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-new-accounts-created-over-time
    name: Windows New Accounts Created Over Time
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4720'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
