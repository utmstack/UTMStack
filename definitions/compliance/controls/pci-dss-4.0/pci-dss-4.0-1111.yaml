id: pci-dss-4.0-1111
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 3.1 Member Addition to a Security Local Group
scope: data
statement: This report compiles relevant information from 4732 events (A member was added to a security-enabled local group) generated in Windows, with the goal of verifying compliance with PCI DSS Requirement 3.1.2. This requirement establishes that roles and responsibilities for performing activities related to the protection of stored account data must be documented, assigned, and understood.<br/><br/>Event 4732 allows for auditing the assignment of users to local security groups, providing visibility into the delegation of roles and responsibilities within the system. This event allows for verifying that the appropriate roles are being assigned to the right people, ensuring that tasks related to the protection of account data are clearly defined and that those responsible understand their duties. This helps ensure that access controls and role management are consistent with established security policies.
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4732'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
