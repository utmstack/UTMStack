id: pci-dss-4.0-1056
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 Protected Object Permission Change
scope: data
statement: This report compiles relevant information from logs generated by Windows event 4670, which records changes in access permissions to system objects, such as files or directories. Although this event is related to auditing access and security permission changes, it can be useful for verifying whether modifications to the network security infrastructure affect connections between the Cardholder Data Environment (CDE) and other networks, including wireless networks. Additionally, the logged information helps ensure that network and data flow diagrams are kept up-to-date and accurately reflect any changes to the environment, such as the assignment of permissions or access to systems that handle sensitive data. Proper auditing of these changes helps ensure that network diagrams and data flows remain consistent with changes made to the infrastructure.
strategy: ANY
checks:
  - key: windows-protected-object-permission-change
    name: Windows Protected Object Permission Change
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4670'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-process-distribution-of-protected-object-permission-change
    name: Windows Process Distribution of Protected Object Permission Change
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4670'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
