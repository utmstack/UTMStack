id: pci-dss-4.0-1158
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 7.3 Account Logon Success
scope: data
statement: This report compiles relevant information from Windows 4624 events, which record successful system logins. The information contained in these events is crucial for assessing compliance with PCI DSS Requirement 7.3, which establishes that access to system components and data must be managed through an access control system. 4624 events verify that system access is carried out in accordance with defined access control policies, ensuring that only authorized users with the necessary privileges have access to sensitive systems and data. This allows for auditing and managing access based on business needs and assigned user roles.
strategy: ANY
checks:
  - key: windows-user-successful-logon-event-by-host
    name: Windows User Successful Logon Event by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4672'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-success-by-host
    name: Windows Logon success by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4624'
          - '4324'
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: IS_NOT
        value: '-'
      - field: log.logonType
        operator: IS_ONE_OF_TERMS
        value:
          - '3'
          - '2'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
