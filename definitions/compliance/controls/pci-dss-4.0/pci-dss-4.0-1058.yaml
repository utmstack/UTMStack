id: pci-dss-4.0-1058
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 Kerberos ticket requests
scope: data
statement: This report compiles relevant information from the logs generated by Windows events 4768, 4769, and 4771, which are related to the Kerberos authentication process on the system. Events 4768 and 4769 are generated when a Kerberos authentication ticket is issued and when a user attempts to authenticate using a Kerberos ticket, respectively. Event 4771 is generated when Kerberos authentication fails.<br/><br/>These events are important for verifying compliance with PCI DSS as they allow auditing authentication attempts and the validity of access tickets for services, protocols, and ports used. By reviewing these events, it is possible to ensure that the services and protocols in use are properly configured with defined security features, such as secure authentication using Kerberos, and that access attempts are not insecure or unauthorized. This helps mitigate the risks associated with using services and protocols that could be vulnerable if not properly protected by security controls.
strategy: ANY
checks:
  - key: windows-kerberos-ticket-requests
    name: Windows Kerberos ticket requests
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4768', '4769', '4771'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-kerberos-ticket-requests-by-outcome
    name: Windows Kerberos ticket requests by Outcome
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id IN ('4768', '4769', '4771'))
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
