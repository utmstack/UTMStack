id: pci-dss-4.0-1177
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 10.2 Account Logon Failure
scope: data
statement: This report compiles relevant information from Windows Event 4625 logs, which indicate failed login attempts. Its purpose is to support the detection of suspicious activity and authentication anomalies, as well as facilitate forensic analysis of security events. It also verifies that audit logging is enabled and active on all system components and in environments that handle cardholder data, in compliance with PCI DSS requirements 10.2 and 10.2.1.
strategy: ANY
checks:
  - key: windows-failed-logon-attempts-by-reason-status
    name: Windows Failed Logon Attempts by Reason Status
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-logon-failure-by-user-and-host
    name: Windows Logon Failure by User and Host
    dataType: wineventlog
    filters:
      - field: log.statusDescription
        operator: IS_ONE_OF_TERMS
        value:
          - Logon failure
          - Clients credentials have been revoked
          - Pre-authentication information was invalid
          - Account restriction
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
source: Migrated from UTMStack v11
