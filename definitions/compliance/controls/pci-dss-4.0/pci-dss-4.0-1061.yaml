id: pci-dss-4.0-1061
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 Attempt to Access a Protected Object
scope: data
statement: This report compiles relevant information from logs generated by Windows events 4663 and 4656, which are related to access and modification of system files and objects, including Network Security Controls (NSC) configuration files.<br/><br/>Event 4663 is generated when a user attempts to access a file or directory, providing details about the type of access requested. Event 4656 is triggered when a request is made to access an object, indicating whether the request was approved or denied. These events are essential for auditing access to NSC configuration files, ensuring that unauthorized access to these critical files is not occurring.<br/><br/>Analyzing these events is key to complying with PCI DSS Requirements, which states that NSC configuration files must be protected from unauthorized access and maintained consistent with the active network. These logs allow verification that appropriate access controls are in place, ensuring that only authorized users can modify configuration files and that any changes are properly logged to maintain the integrity of the network's security configuration.
strategy: ANY
checks:
  - key: windows-attempt-to-access-a-protected-object
    name: Windows Attempt to access a protected object
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4663'
          - '4656'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-file-access-events
    name: Windows File Access Events
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_NOT_ONE_OF
        value:
          - '4663'
          - '4656'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
