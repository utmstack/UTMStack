id: pci-dss-4.0-1168
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 8.2 User Accounts Deleted
scope: data
statement: This report collects and analyzes 4726 events (User Account Deletion) recorded in Windows logs to assess compliance with PCI DSS Requirement 8.2. User account deletions are monitored to ensure that access for terminated users is revoked immediately, in accordance with Section 8.2.5. Inactive accounts are also validated as being deleted or disabled within the stipulated 90-day period, in line with Section 8.2.6. This analysis helps ensure that account lifecycle management is strict and complies with the security and authentication controls defined in PCI DSS.
strategy: ANY
checks:
  - key: windows-user-accounts-deleted-over-time
    name: Windows User Accounts Deleted Over Time
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4726')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-accounts-deleted
    name: Windows User Accounts Deleted
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4726' AND logx.wineventlog.event_data.SubjectUserName NOT LIKE '%$' AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
