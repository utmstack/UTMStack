id: pci-dss-4.0-1126
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 4.1 Member Addition to a Security Local Group
scope: data
statement: This report compiles relevant information from the 4732 events (A user was added to a security group) generated in Windows, with the goal of verifying compliance with PCI DSS Requirement 4.1.2. This requirement establishes that roles and responsibilities for implementing security controls in the transmission of cardholder data must be documented, assigned, and understood by the involved parties.<br/><br/>Event 4732 is crucial for auditing access management to security groups, as it verifies the correct assignment of privileges to users responsible for applying cryptographic measures and other security controls in the transmission of sensitive data. Proper monitoring of this event facilitates the detection of improper assignments or unauthorized changes to the structure of roles and responsibilities.<br/><br/>This analysis assesses whether the assignment of roles in the security infrastructure is aligned with documented policies and whether access is controlled in accordance with operational and PCI DSS compliance requirements.
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4732')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4732')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
