id: pci-dss-4.0-1161
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 7.3 Kerberos ticket requests
scope: data
statement: 'This report compiles relevant information from Windows events 4768, 4769, and 4771, which are related to the user authentication process via the Kerberos protocol, used for access management on Windows systems. These events provide key information for verifying compliance with PCI DSS Requirement 7.3, which establishes that access to system components and data must be managed through an access control system.<br/><br/>Event 4768: Indicates the issuance of a Kerberos Authentication Ticket (TGT), confirming that a user has been authenticated to the system.<br/>Event 4769: Records the issuance of a Kerberos Service Ticket, detailing authorized access to specific applications or services.<br/>Event 4771: Reports failures in the Kerberos authentication attempt, providing information on unauthorized access. These events allow for auditing the authentication and access control process in systems, ensuring that only authenticated and authorized users can access resources, in accordance with PCI DSS access control principles. This report is essential for validating that access to systems and data is being properly managed and audited.'
strategy: ANY
checks:
  - key: windows-kerberos-ticket-requests
    name: Windows Kerberos ticket requests
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4768'
          - '4769'
          - '4771'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-kerberos-ticket-requests-by-outcome
    name: Windows Kerberos ticket requests by Outcome
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS_ONE_OF_TERMS
        value:
          - '4768'
          - '4769'
          - '4771'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
