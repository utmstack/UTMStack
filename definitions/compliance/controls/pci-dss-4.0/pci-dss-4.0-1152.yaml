id: pci-dss-4.0-1152
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 7.2 Member Addition to a Security Local Group
scope: data
statement: This report collects and analyzes Windows 4732 events, which record the addition of users to security groups on the system. Its purpose is to assess compliance with PCI DSS Requirement 7.2, which establishes that access to system components and data must be appropriately defined and assigned. By reviewing these events, we validate that access to resources and systems is granted according to users' specific roles and needs, ensuring the implementation of the principle of least privilege and guaranteeing that only authorized users have access to critical information based on their role.
strategy: ANY
checks:
  - key: windows-member-addition-to-a-security-local-group
    name: Windows Member Addition to a Security Local Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4732')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-member-addition-to-a-security-local-group-by-group
    name: Windows Member Addition to a Security Local Group by Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4732')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
