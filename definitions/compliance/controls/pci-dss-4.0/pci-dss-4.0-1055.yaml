id: pci-dss-4.0-1055
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 Access to critical files or specific directories
scope: data
statement: This report compiles relevant information from logs generated by Windows event 4663, which records access to specific files and directories. Although this event is not directly related to network diagrams, it can be useful for monitoring access to key files or resources that may contain critical information related to the network infrastructure or account data flow. Auditing these accesses allows you to verify that modifications to the network environment, such as changes to service or protocol configurations, are being appropriately monitored, which helps keep network and data flow diagrams up to date with changes in the environment.
strategy: ANY
checks:
  - key: windows-access-to-critical-files-or-specific-directories
    name: Windows Access to critical files or specific directories
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4663')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-distribution-of-access-results-to-critical-files-or-specific-directories
    name: Windows Distribution of access results to critical files or specific directories
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4663')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
