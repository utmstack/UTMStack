id: pci-dss-4.0-1069
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 User Accounts Created
scope: data
statement: This report collects 4720 events generated by the Windows system, which record the creation of new user accounts. Analysis of these events helps verify compliance with PCI DSS requirements, ensuring that the roles and responsibilities associated with user account management are properly documented, assigned, and understood. Additionally, it provides visibility into the assignment of new accounts and their relationship to security activities, helping to ensure that the right people are assigned to perform critical security activities appropriately.
strategy: ANY
checks:
  - key: windows-user-accounts-created
    name: Windows User Accounts Created
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4720' AND logx.wineventlog.event_data.SubjectUserName NOT LIKE '%$' AND logx.wineventlog.event_data.TargetUserName NOT LIKE '%$')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-new-accounts-created-over-time
    name: Windows New Accounts Created Over Time
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4720')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
