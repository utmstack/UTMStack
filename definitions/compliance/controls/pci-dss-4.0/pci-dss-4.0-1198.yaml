id: pci-dss-4.0-1198
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.1 Security Group Member Removal
scope: data
statement: This report consolidates events generated by ID 4729 in Windows, which indicates the removal of a user from a global security group. The collection and analysis of these events allows for verification of compliance with PCI DSS requirement 11.1.2, ensuring that roles and responsibilities for executing security activities are documented, assigned, and understood.<br/><br/>The report provides information on changes to security groups, including affected users, modified groups, accounts responsible for the changes, and timestamps. This allows for the identification of potential unauthorized changes or inconsistencies in role management, ensuring proper segregation of duties and compliance with established security policies.
strategy: ANY
checks:
  - key: windows-security-group-member-removal
    name: Windows Security Group Member Removal
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4729')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-security-group-member-removal-by-group
    name: Windows Security Group Member Removal by Group
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4729')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
