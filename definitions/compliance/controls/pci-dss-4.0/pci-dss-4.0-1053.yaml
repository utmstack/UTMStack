id: pci-dss-4.0-1053
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.2 Restoration of default security policies
scope: data
statement: This report compiles relevant information from logs generated by Windows event 4907, which indicates changes to the system's network filter configurations. This event is key to ensuring that any changes made to network connection configurations and network security controls (NSC) have been managed in a controlled manner and properly approved. Analyzing these events allows for verification that changes to network configurations have been made according to established procedures, ensuring that the security infrastructure remains consistent, secure, and aligned with organizational policies.
strategy: ANY
checks:
  - key: windows-restoration-of-default-security-policies
    name: Windows Restoration of default security policies
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4907')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-restoration-of-default-security-policies-by-outcome
    name: Windows Restoration of default security policies by outcome
    indexPattern: v11-log-wineventlog-*
    sql: SELECT count(*) AS c FROM v11-log-wineventlog-* WHERE (logx.wineventlog.event_id = '4907')
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
