id: pci-dss-4.0-1071
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 1.1 User Accounts Deleted
scope: data
statement: This report collects 4726 events generated by the Windows system, which record user account deletions. Analyzing these events is critical to verifying compliance with PCI DSS Requirements, ensuring that roles and responsibilities for managing the creation, enabling, and deletion of user accounts are properly documented, assigned, and understood. It also provides visibility into account deletion, ensuring that operational procedures and security policies are followed when managing access within the infrastructure.
strategy: ANY
checks:
  - key: windows-user-accounts-deleted-over-time
    name: Windows User Accounts Deleted Over Time
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4726'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-user-accounts-deleted
    name: Windows User Accounts Deleted
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '4726'
      - field: log.subjectUserName
        operator: NOT_ENDS_WITH
        value: $
      - field: log.targetUserName
        operator: NOT_ENDS_WITH
        value: $
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
