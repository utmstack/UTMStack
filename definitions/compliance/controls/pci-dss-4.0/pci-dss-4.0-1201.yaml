id: pci-dss-4.0-1201
family: pci-dss-4.0
familyName: PCI DSS
name: Windows 11.2 Event Logging Service Shut Down
scope: data
statement: This report is designed to assess compliance with PCI DSS Requirement 11.2, which establishes that wireless access points must be identified, monitored, and unauthorized access points must be appropriately managed. By analyzing logs generated by Windows Event 1100, the report gathers key information to verify that both authorized and unauthorized wireless access points are correctly detected and identified. It also ensures that the testing, detection, and identification process is performed at least every three months, as required.
strategy: ANY
checks:
  - key: windows-event-logging-service-shut-down
    name: Windows Event Logging Service Shut Down
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1100'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: windows-event-logging-service-shutdowns-count-by-host
    name: Windows Event Logging Service Shutdowns - Count by Host
    dataType: wineventlog
    filters:
      - field: log.eventID
        operator: IS
        value: '1100'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
