# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: au-16
family: au
familyName: Audit and Accountability
name: Cross-organizational Audit Logging
scope: governance
statement: |-
  Employ [methods] for coordinating [audit information] among external organizations when audit information is transmitted across organizational boundaries.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the logging configuration and the retention setting in UTMStack or the source system.
source: NIST SP 800-53 Rev 5 (public domain)
