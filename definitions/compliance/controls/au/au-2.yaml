  - key: sophos-xg-event-logs
    name: 'Sophos Firewall: event logs are recorded'
    dataType: firewall-sophos-xg
    filters:
      - field: log.type
        operator: IS
        value: 'Event'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aix-auth-program-events
    name: 'IBM AIX: sign-in and privilege program messages are recorded'
    dataType: ibm-aix
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'sshd'
          - 'sudo'
          - 'su'
          - 'login'
