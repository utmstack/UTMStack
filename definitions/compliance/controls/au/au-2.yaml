  - key: as400-security-messages
    name: 'IBM i (AS/400): sign-on and security messages are recorded'
    dataType: ibm-as400
    filters:
      - field: log.messageId
        operator: IS_ONE_OF_TERMS
        value:
          - 'CPIAD09'
          - 'CPIAD02'
          - 'CPF2234'
          - 'CPF1393'
          - 'CPF1397'
          - 'CPI2283'
          - 'CPI2284'
          - 'CPI9014'
          - 'CPI96C4'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-graph-directory-audit-present
    name: 'Microsoft Graph: Entra directory audit records are received'
    dataType: o365-graph
    filters:
      - field: log.loggedByService
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: suricata-alerts-anomalies
    name: 'Suricata: alerts, anomalies and drops are recorded'
    dataType: suricata
    filters:
      - field: log.eventType
        operator: IS_ONE_OF_TERMS
        value:
          - 'alert'
          - 'anomaly'
          - 'drop'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: esxi-audit-events
    name: 'VMware ESXi: host audit events are recorded'
    dataType: vmware-esxi
    filters:
      - field: log.process
        operator: IS
        value: 'vobd'
      - field: log.message
