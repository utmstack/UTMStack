# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: au-2
family: au
familyName: Audit and Accountability
name: Event Logging
scope: data
statement: |-
  Identify the types of events that the system is capable of logging in support of the audit function: [event types];
  Coordinate the event logging function with other organizational entities requiring audit-related information to guide and inform the selection criteria for events to be logged;
  Specify the following event types for logging within the system: [organization-defined event types (subset of the event types defined in [AU-2a.](#au-2_smt.a)) along with the frequency of (or situation requiring) logging for each identified event type];
  Provide a rationale for why the event types selected for logging are deemed to be adequate to support after-the-fact investigations of incidents; and
  Review and update the event types selected for logging [frequency].
remediation: |-
  Passes when at least one connected source sends security audit events (for example the Windows Security log, Linux audit records, cloud audit trails or firewall traffic logs).
  If it fails: configure the source's audit policy so security events are produced, then connect it to UTMStack.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-security-channel
    name: 'Windows: Security event log records are collected'
    dataType: wineventlog
    filters:
      - field: log.channel
        operator: IS
        value: 'Security'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-audit-records
    name: 'Linux: audit records are collected'
    dataType: linux
    filters:
      - field: log.type
        operator: IS
        value: 'auditd'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-auth-facility-messages
    name: 'Linux: authentication and authorization messages are recorded'
    dataType: linux
    filters:
      - field: log.syslogFacility
        operator: IS_ONE_OF_TERMS
        value:
          - '4'
          - '10'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: macos-system-policy-events
    name: 'macOS: Gatekeeper and system policy events are recorded'
    dataType: macos
    filters:
      - field: log.subsystem
        operator: START_WITH
        value: 'com.apple.syspolicy'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-entra-audit-present
    name: 'Microsoft 365: Entra ID sign-in and directory audit records are present'
    dataType: o365
    filters:
      - field: log.Workload
        operator: IS
        value: 'AzureActiveDirectory'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: o365-mailbox-audit-present
    name: 'Microsoft 365: mailbox access audit (MailItemsAccessed) is present'
    dataType: o365
    filters:
      - field: action
        operator: IS
        value: 'MailItemsAccessed'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: azure-audit-trail-present
    name: 'Azure: control-plane, Entra ID, Key Vault or Kubernetes audit records are present'
    dataType: azure
    filters:
      - field: log.azureKind
        operator: IS_ONE_OF_TERMS
        value:
          - 'signin'
          - 'audit'
          - 'activity'
          - 'eventgrid'
          - 'keyvault'
          - 'kubernetes'
          - 'cloud-kubernetes'
          - 'risk'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: aws-cloudtrail-records
    name: 'AWS: CloudTrail audit records are present'
    dataType: aws
    filters:
      - field: log.awsRecordType
        operator: IS
        value: 'cloudtrail'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: gcp-audit-logs
    name: 'Google Cloud: Cloud Audit Logs are present'
    dataType: google
    filters:
      - field: log.logName
        operator: CONTAIN
        value: 'cloudaudit.googleapis.com'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: fgt-event-logs
    name: 'FortiGate: system, user and VPN event logs are recorded'
    dataType: firewall-fortigate-traffic
    filters:
      - field: log.type
        operator: IS
        value: 'event'
      - field: log.subtype
        operator: IS_ONE_OF_TERMS
        value:
          - 'system'
          - 'user'
          - 'vpn'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: paloalto-system-config-logs
    name: 'Palo Alto: system and configuration logs are recorded'
    dataType: firewall-paloalto
    filters:
      - field: log.paType
        operator: IS_ONE_OF_TERMS
        value:
          - 'SYSTEM'
          - 'CONFIG'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: sophos-xg-event-logs
    name: 'Sophos Firewall: event logs are recorded'
    dataType: firewall-sophos-xg
    filters:
      - field: log.type
        operator: IS
        value: 'Event'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
