# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: au-3
family: au
familyName: Audit and Accountability
name: Content of Audit Records
scope: data
statement: |-
  Ensure that audit records contain information that establishes the following:
  What type of event occurred;
  When the event occurred;
  Where the event occurred;
  Source of the event;
  Outcome of the event; and
  Identity of any individuals, subjects, or objects/entities associated with the event.
remediation: |-
  Passes when the records of a connected source carry who and where: a user, a host or a network address.
  If it fails: check that the source's integration is the supported one and that its records are parsed; records without identity cannot support an investigation.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-records-carry-user
    name: 'Windows: event records identify the acting user'
    dataType: wineventlog
    filters:
      - field: origin.user
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
  - key: linux-host-identity
    name: 'Linux: records name the host'
    dataType: linux
    filters:
      - field: origin.host
        operator: EXIST
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
