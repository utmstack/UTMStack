# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: au-12
family: au
familyName: Audit and Accountability
name: Audit Record Generation
scope: data
statement: |-
  Provide audit record generation capability for the event types the system is capable of auditing as defined in [AU-2a](#au-2_smt.a) on [system components];
  Allow [personnel or roles] to select the event types that are to be logged by specific components of the system; and
  Generate audit records for the event types defined in [AU-2c](#au-2_smt.c) that include the audit record content defined in [AU-3](#au-3).
remediation: |-
  Passes when at least one connected source produced audit records during the window. Each source has its own check, so the report shows which ones are sending.
  If it fails: no source is sending; connect them to UTMStack.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: win-logs-received
    name: 'Windows: event logs are received'
    dataType: wineventlog
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
