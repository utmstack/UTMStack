# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Checked automatically.
id: au-7
family: au
familyName: Audit and Accountability
name: Audit Record Reduction and Report Generation
scope: data
statement: |-
  Provide and implement an audit record reduction and report generation capability that:
  Supports on-demand audit record review, analysis, and reporting requirements and after-the-fact investigations of incidents; and
  Does not alter the original content or time ordering of audit records.
remediation: |-
  Passes when UTMStack is collecting logs centrally, where they can be searched, filtered and reported on.
  If it fails: no logs reached UTMStack during the window; connect the data sources.
source: NIST SP 800-53 Rev 5 (public domain)
strategy: ANY
checks:
  - key: logs-collected
    name: 'Logs from at least one source reached UTMStack'
    rule: MIN_HITS_REQUIRED
    ruleValue: 1
