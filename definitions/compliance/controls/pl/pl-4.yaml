# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pl-4
family: pl
familyName: Planning
name: Rules of Behavior
scope: governance
statement: |-
  Establish and provide to individuals requiring access to the system, the rules that describe their responsibilities and expected behavior for information and system usage, security, and privacy;
  Receive a documented acknowledgment from such individuals, indicating that they have read, understand, and agree to abide by the rules of behavior, before authorizing access to information and the system;
  Review and update the rules of behavior [frequency]; and
  Require individuals who have acknowledged a previous version of the rules of behavior to read and re-acknowledge [[organization-defined value] | when the rules are revised or updated].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the system security plan or signed rules-of-behaviour acknowledgements.
source: NIST SP 800-53 Rev 5 (public domain)
