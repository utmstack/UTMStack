# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pl-7
family: pl
familyName: Planning
name: Concept of Operations
scope: governance
statement: |-
  Develop a Concept of Operations (CONOPS) for the system describing how the organization intends to operate the system from the perspective of information security and privacy; and
  Review and update the CONOPS [frequency].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the system security plan or signed rules-of-behaviour acknowledgements.
source: NIST SP 800-53 Rev 5 (public domain)
