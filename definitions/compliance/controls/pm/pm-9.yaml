# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pm-9
family: pm
familyName: Program Management
name: Risk Management Strategy
scope: governance
statement: |-
  Develops a comprehensive strategy to manage:
  Security risk to organizational operations and assets, individuals, other organizations, and the Nation associated with the operation and use of organizational systems; and
  Privacy risk to individuals resulting from the authorized processing of personally identifiable information;
  Implement the risk management strategy consistently across the organization; and
  Review and update the risk management strategy [frequency] or as required, to address organizational changes.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the security programme documents, assigned roles and measures.
source: NIST SP 800-53 Rev 5 (public domain)
