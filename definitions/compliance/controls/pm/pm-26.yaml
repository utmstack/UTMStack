# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pm-26
family: pm
familyName: Program Management
name: Complaint Management
scope: governance
statement: |-
  Implement a process for receiving and responding to complaints, concerns, or questions from individuals about the organizational security and privacy practices that includes:
  Mechanisms that are easy to use and readily accessible by the public;
  All information necessary for successfully filing complaints;
  Tracking mechanisms to ensure all complaints received are reviewed and addressed within [organization-defined time period];
  Acknowledgement of receipt of complaints, concerns, or questions from individuals within [time period]; and
  Response to complaints, concerns, or questions from individuals within [time period].
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the security programme documents, assigned roles and measures.
source: NIST SP 800-53 Rev 5 (public domain)
