# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pm-21
family: pm
familyName: Program Management
name: Accounting of Disclosures
scope: governance
statement: |-
  Develop and maintain an accurate accounting of disclosures of personally identifiable information, including:
  Date, nature, and purpose of each disclosure; and
  Name and address, or other contact information of the individual or organization to which the disclosure was made;
  Retain the accounting of disclosures for the length of the time the personally identifiable information is maintained or five years after the disclosure is made, whichever is longer; and
  Make the accounting of disclosures available to the individual to whom the personally identifiable information relates upon request.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the security programme documents, assigned roles and measures.
source: NIST SP 800-53 Rev 5 (public domain)
