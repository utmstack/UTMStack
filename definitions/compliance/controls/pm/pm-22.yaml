# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pm-22
family: pm
familyName: Program Management
name: Personally Identifiable Information Quality Management
scope: governance
statement: |-
  Develop and document organization-wide policies and procedures for:
  Reviewing for the accuracy, relevance, timeliness, and completeness of personally identifiable information across the information life cycle;
  Correcting or deleting inaccurate or outdated personally identifiable information;
  Disseminating notice of corrected or deleted personally identifiable information to individuals or other appropriate entities; and
  Appeals of adverse decisions on correction or deletion requests.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the security programme documents, assigned roles and measures.
source: NIST SP 800-53 Rev 5 (public domain)
