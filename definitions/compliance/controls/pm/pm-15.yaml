# Generic control (NIST SP 800-53 Rev 5), shared by every framework. Manual: set in the report.
id: pm-15
family: pm
familyName: Program Management
name: Security and Privacy Groups and Associations
scope: governance
statement: |-
  Establish and institutionalize contact with selected groups and associations within the security and privacy communities:
  To facilitate ongoing security and privacy education and training for organizational personnel;
  To maintain currency with recommended security and privacy practices, techniques, and technologies; and
  To share current security and privacy information, including threats, vulnerabilities, and incidents.
remediation: |-
  Manual control: logs cannot show whether this is in place, so the report lists it as "Out of scope" until a person decides. Open the framework report, set this control's status (Compliant, Non-compliant or At risk) and write the justification.
  Keep the evidence an auditor will ask for, for example the security programme documents, assigned roles and measures.
source: NIST SP 800-53 Rev 5 (public domain)
