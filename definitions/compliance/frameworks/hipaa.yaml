key: hipaa
name: HIPAA
description: HIPAA (Health Insurance Portability and Accountability Act) is a United States federal law designed to protect the privacy and security of patients' health information. It establishes national standards for the handling of protected health information (PHI) in electronic formats (ePHI) and regulates how covered entities (such as healthcare providers, insurers, and business associates) must ensure the confidentiality, integrity, and availability of this information. HIPAA also promotes the secure use of technology for health data sharing and establishes penalties for non-compliance.
