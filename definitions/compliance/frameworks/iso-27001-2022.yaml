# Provenance: ISO/IEC 27001:2022 and Amd 1:2024 (ISO copyright), public identifiers only, titles paraphrased.
#   Mapping guided by the NIST OLIR crosswalk of SP 800-53 Rev 5 to ISO/IEC 27001:2022, reduced to base controls
#   and adjusted so data controls are used only where logs evidence the requirement.
# ISO/IEC 27001:2022 (incl. Amd 1:2024): ISMS clauses 4-10 and the 93 Annex A controls. Identifiers only; titles are our own
# short wording, NO normative text (ISO copyright). Mapping to NIST SP 800-53 Rev 5 guided by NIST's OLIR crosswalk.
key: iso-27001-2022
name: ISO/IEC 27001:2022
description: ISO/IEC 27001:2022 with Amendment 1:2024, ISMS requirements (clauses 4 to 10) and all 93 Annex A controls,
  each mapped to shared NIST SP 800-53 Rev 5 controls. Reference identifiers and short titles in our own words only; the
  normative text is ISO copyright and is not reproduced.
source: 'ISO/IEC 27001:2022 + Amd 1:2024 (ISO copyright): identifiers only, titles paraphrased. Mapping guided by the NIST OLIR crosswalk.'
