# CMMC 2.0 (checklist). Practice IDs DOMAIN.L<level>-3.x.y = NIST 800-171 rev2. satisfiedBy = 800-53 controls.
key: cmmc-2.0
name: CMMC 2.0 (Level 1 & Level 2)
description: Cybersecurity Maturity Model Certification 2.0. Level 2 = the 110 practices of NIST SP 800-171
  Rev 2; Level 1 = the 17 FCI practices (tagged L1 in the practice ID).
source: CMMC 2.0 / NIST SP 800-171 Rev 2 (public domain). Practice titles authored from the public standard;
  verify against the official DoD CMMC model. 800-53 mapping best-effort.
