description: Cybersecurity Maturity Model Certification (32 CFR Part 170). Level 1 is the 15 FAR 52.204-21 requirements, Level 2 is the 110 NIST SP 800-171 Rev 2 requirements grouped by the 14 domains, Level 3 is the 24 selected NIST SP 800-172 requirements.
