# Provenance: NIST CSWP 29, The NIST Cybersecurity Framework (CSF) 2.0 (public domain). Mapping starts from the
#   NIST CSF 2.0 informative references to SP 800-53 Rev 5.1.1/5.2.0 (CPRT, public domain), reduced to base
#   controls (plus catalog enhancements for configuration items logs cannot prove) and adjusted so data controls
#   are used only where logs evidence the outcome.
# NIST Cybersecurity Framework (CSF) 2.0 Core: 22 categories (sections) and 106 subcategories (requirements).
# Source: NIST CSWP 29 (Feb 2024) and the CSF 2.0 Reference Tool / CPRT 800-53 references; US federal work, public domain.
key: nist-csf-2.0
name: NIST Cybersecurity Framework 2.0
description: 'NIST CSF 2.0 (February 2024): 6 functions, 22 categories and 106 subcategories. Sections are the categories, requirements are the subcategories, each mapped to controls of the shared NIST SP 800-53 Rev 5 library.'
source: 'NIST CSWP 29, CSF 2.0 (public domain). Mapping from the NIST CSF 2.0 informative references to SP 800-53 Rev 5.'
sections:
