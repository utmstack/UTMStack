    name: 'Key management covers generating strong keys'
    satisfiedBy: [sc-12]
  - id: '3.7.2'
    name: 'Key management covers distributing keys securely'
    satisfiedBy: [sc-12]
  - id: '3.7.3'
    name: 'Key management covers storing keys securely'
    satisfiedBy: [sc-12]
  - id: '3.7.4'
    name: 'Keys are changed at the end of their cryptoperiod'
