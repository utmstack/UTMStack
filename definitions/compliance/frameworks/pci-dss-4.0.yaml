    name: 'Network security controls sit between trusted and untrusted networks'
    satisfiedBy: [sc-7]
  - id: '1.4.2'
    name: 'Inbound traffic from untrusted to trusted networks is limited'
    satisfiedBy: [sc-7.5]
  - id: '1.4.3'
    name: 'Anti-spoofing measures block forged source addresses'
    satisfiedBy: [cm-2]
  - id: '1.4.4'
    name: 'Systems storing cardholder data cannot be reached directly from untrusted networks'
    satisfiedBy: [sc-32, sc-7.5]
  - id: '1.4.5'
    name: 'Internal IP addresses and routing details are disclosed only to authorized parties'
    satisfiedBy: [cm-2]
  - id: '1.5.1'
    name: 'Devices that connect to both untrusted networks and the cardholder data environment are secured'
    satisfiedBy: [ac-19, ac-20, sc-7.7, cm-6]
- key: req-2
