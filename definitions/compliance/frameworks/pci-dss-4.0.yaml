key: pci-dss-4.0
name: PCI DSS
description: The PCI DSS (Payment Card Industry Data Security Standard) establishes a set of security requirements to protect payment card data and ensure the integrity of financial transactions. In a SIEM (Security Information and Event Management), PCI DSS compliance is achieved by collecting, monitoring, measuring, and retaining event logs related to the access, use, and security of payment data.
