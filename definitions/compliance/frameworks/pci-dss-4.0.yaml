key: pci-dss-4.0
name: PCI DSS v4.0.1
description: Payment Card Industry Data Security Standard v4.0.1, every defined-approach requirement of the 12
  principal requirements and Appendices A1 and A2 by its official number. Titles are our own short paraphrases;
  the standard text is PCI SSC copyright and is not reproduced.
source: 'PCI DSS v4.0.1 (PCI SSC copyright): numbering only, titles paraphrased. Mapping to NIST SP 800-53 Rev 5 by UTMStack.'
sections:
- key: req-1
  name: 'Requirement 1: Install and maintain network security controls'
  requirements:
