    name: 'Network security policies and procedures are documented, current and known'
    satisfiedBy: [sc-1]
  - id: '1.1.2'
    name: 'Roles and responsibilities for network security controls are documented and assigned'
    satisfiedBy: [sc-1, ps-9]
  - id: '1.2.1'
    name: 'Configuration standards for network security control rulesets are defined and maintained'
    satisfiedBy: [cm-2, cm-7]
  - id: '1.2.2'
    name: 'Changes to network connections and security control configurations follow change control'
    satisfiedBy: [cm-3]
  - id: '1.2.3'
    name: 'An accurate network diagram is kept'
    satisfiedBy: [pl-8, cm-8]
  - id: '1.2.4'
    name: 'An accurate data-flow diagram for account data is kept'
    satisfiedBy: [cm-12, pl-8]
  - id: '1.2.5'
    name: 'Allowed services, protocols and ports are identified, approved and justified'
    satisfiedBy: [cm-7]
  - id: '1.2.6'
    name: 'Services, protocols and ports judged insecure have extra security features'
    satisfiedBy: [cm-7, sc-8]
  - id: '1.2.7'
    name: 'Network security control configurations are reviewed every six months'
    satisfiedBy: [cm-2, cm-7]
  - id: '1.2.8'
    name: 'Network security control configuration files are protected and match the running setup'
    satisfiedBy: [cm-5, cm-2]
  - id: '1.3.1'
    name: 'Inbound traffic to the cardholder data environment is limited to what is needed'
    satisfiedBy: [sc-7.5]
  - id: '1.3.2'
    name: 'Outbound traffic from the cardholder data environment is limited to what is needed'
    satisfiedBy: [sc-7.5]
  - id: '1.3.3'
    name: 'Wireless networks are separated from the cardholder data environment by security controls'
    satisfiedBy: [sc-7.5, ac-18]
