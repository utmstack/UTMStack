# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Possible Consent Grant Attack via Azure-Registered Application
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: T1078 - Valid Accounts
adversary: origin
description: Detects when a user grants permissions to an Azure-registered application or when an administrator grants tenant-wide
  permissions to an application. An adversary may create an Azure-registered application that requests access to data such as contact
  information, email, or documents. Consent grant attacks are commonly used in phishing campaigns where malicious OAuth applications
  trick users into granting excessive permissions, enabling data exfiltration or unauthorized access to organizational resources.
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://attack.mitre.org/techniques/T1566/
- https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/manage-consent-requests
- https://learn.microsoft.com/en-us/defender-cloud-apps/investigate-risky-oauth
where: 'equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.azureOperation","Consent
  to application")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
