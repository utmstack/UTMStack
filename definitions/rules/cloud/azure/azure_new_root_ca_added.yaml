# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Certificate Authentication Configuration Created
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity/authentication/concept-certificate-based-authentication
- https://attack.mitre.org/techniques/T1556/
description: 'A successful certificate authority entity or certificate-based authentication configuration creation. This may be
  approved PKI administration and does not by itself identify a rogue root CA.

  '
where: 'equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("log.azureOperation","Create
  CertificateAuthorityEntity") || equalsIgnoreCase("log.azureOperation","Add CertificateBasedAuthConfiguration"))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
