# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Risky Sign-in
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/active-directory/identity-protection/concept-identity-protection-risks
- https://attack.mitre.org/techniques/T1078/
description: 'The sign-in carries a high risk level or an active risk state. This signal does not establish impossible travel.

  '
where: 'equalsIgnoreCase("log.azureKind","signin") && (equalsIgnoreCase("log.properties.riskState","atRisk") || equalsIgnoreCase("log.properties.riskState","confirmedCompromised")
  || equalsIgnoreCase("log.properties.riskLevelDuringSignIn","high")) && !(equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.properties.riskLevelDuringSignIn","high"))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
