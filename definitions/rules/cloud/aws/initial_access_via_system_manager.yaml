# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Systems Manager Command Request Accepted
impact:
  confidentiality: 2
  integrity: 1
  availability: 1
category: Initial Access
technique: T1566 - Phishing
adversary: origin
description: |
  Identifies a successful SendCommand API request. Review the document, parameters and target instances for authorization, and inspect command execution results separately. API acceptance does not establish command execution success.
references:
- https://attack.mitre.org/tactics/TA0001/
- https://attack.mitre.org/techniques/T1566/
- https://docs.aws.amazon.com/systems-manager/latest/userguide/ssm-plugins.html
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "ssm.amazonaws.com") &&
  equals("log.eventName", "SendCommand") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
