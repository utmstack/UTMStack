# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS GuardDuty High or Critical Finding
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Threat Detection
adversary: origin
references:
- https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_findings.html
description: |
  Detects an explicitly identified GuardDuty EventBridge finding with severity from 7 through 10. The CloudWatch log group must receive those EventBridge events; GuardDuty management API calls are not findings. Review the original finding detail for affected resources and threat context.
where: |
  equals("log.awsRecordType","guardduty") &&
  greaterOrEqual("log.detail.severity",7) &&
  lessOrEqual("log.detail.severity",10)
groupBy:
- lastEvent.dataSource
- lastEvent.log.account
- lastEvent.log.region
- lastEvent.log.detail.id
