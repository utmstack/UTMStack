# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Compute-Intensive Instance Launch Request
impact:
  confidentiality: 1
  integrity: 2
  availability: 3
category: Resource Hijacking
technique: T1496 - Resource Hijacking
adversary: origin
references:
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html
- https://attack.mitre.org/techniques/T1496/
description: |
  Detects a successful RunInstances request for the listed GPU or large compute instance types. These types have legitimate uses; verify authorization, requested capacity and workload. The instance type does not establish cryptomining.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","ec2.amazonaws.com") &&
  oneOf("log.eventName",["RunInstances"]) &&
  equals("actionResult","success") &&
  regexMatch("log.requestParameters.instanceType", "^(p3|p4d|p4de|p5|g4dn|g4ad|g5|g5g)\\.[a-z0-9]+$|^(c5\\.(18|24)xlarge|c5a\\.24xlarge|c6i\\.32xlarge|c7g\\.16xlarge)$"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- lastEvent.log.requestParameters.instanceType
