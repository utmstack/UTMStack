# Rule contract revision 2026-09-25; SDK v1.1.36 (gap-fill set).
dataTypes:
- aws
name: AWS RDS Deletion Protection Disabled or Master Password Changed
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Impact
technique: T1485 - Data Destruction
adversary: origin
description: Identifies ModifyDBInstance that disables DeletionProtection or changes MasterUserPassword, preparing destructive deletion or seizing database control.
references:
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_ModifyDBInstance.html
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "rds.amazonaws.com") &&
  equals("log.eventName", "ModifyDBInstance") &&
  equals("actionResult","success") &&
  (equals("log.requestParameters.DeletionProtection",false) || exists("log.requestParameters.MasterUserPassword")))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
