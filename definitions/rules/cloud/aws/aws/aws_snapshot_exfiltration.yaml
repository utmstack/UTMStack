# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EBS Snapshot Sharing Permission Added
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Exfiltration
technique: T1537 - Transfer Data to Cloud Account
adversary: origin
references:
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-modifying-snapshot-permissions.html
- https://attack.mitre.org/techniques/T1537/
description: |
  Detects a successful ModifySnapshotAttribute request that adds volume-creation permissions. Removal-only changes do not match. Review the added accounts or public group; sharing permission does not establish completed data exfiltration.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","ec2.amazonaws.com") &&
  oneOf("log.eventName",["ModifySnapshotAttribute"]) &&
  equals("actionResult","success") &&
  (greaterThan("log.requestParameters.createVolumePermission.add.items.#",0) ||
  greaterThan("log.requestParameters.createVolumePermission.add.#",0) ||
  (equals("log.requestParameters.attribute","createVolumePermission") &&
  equals("log.requestParameters.operationType","add") &&
  (greaterThan("log.requestParameters.userIds.#",0) ||
  greaterThan("log.requestParameters.userGroups.#",0)))))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- lastEvent.log.requestParameters.snapshotId
