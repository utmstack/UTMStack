# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS RDS Publicly Accessible Restore Requested
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: System Integrity
adversary: origin
references:
- https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_RestoreFromSnapshot.html
description: |
  Identifies a successful database restore request explicitly setting publiclyAccessible to true. Verify the task status, subnet routing, security groups and approval. Request acceptance does not prove that the database is reachable from the internet or that any data was exfiltrated.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","rds.amazonaws.com") &&
  oneOf("log.eventName",["RestoreDBInstanceFromDBSnapshot", "RestoreDBClusterFromSnapshot"]) &&
  equals("actionResult","success") &&
  equals("log.requestParameters.publiclyAccessible",true))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- lastEvent.log.eventName
