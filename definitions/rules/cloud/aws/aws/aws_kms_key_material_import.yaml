# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS KMS Key Material Import or Deletion
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: System Integrity
adversary: origin
references:
- https://docs.aws.amazon.com/kms/latest/developerguide/importing-keys.html
description: |
  Identifies successful ImportKeyMaterial or DeleteImportedKeyMaterial requests. Verify the key, authorization and dependent resources. These are key-management operations and do not by themselves prove encryption of data or ransomware. Review key lifecycle and recovery plans before taking any containment action.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "kms.amazonaws.com") &&
  oneOf("log.eventName", ["ImportKeyMaterial", "DeleteImportedKeyMaterial"]) &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- lastEvent.log.eventName
