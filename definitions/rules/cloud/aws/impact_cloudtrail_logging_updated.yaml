# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS CloudTrail Log Updated
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Impact
technique: T1565 - Data Manipulation
adversary: origin
description: Identifies an update to an AWS log trail setting that specifies the delivery of log files
references:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1565/
- https://attack.mitre.org/tactics/TA0009/
- https://attack.mitre.org/techniques/T1530/
- https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_UpdateTrail.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/cloudtrail/update-trail.html
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "cloudtrail.amazonaws.com") &&
  equals("log.eventName", "UpdateTrail") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
