# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS CloudWatch Log Stream Deletion
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Impact
technique: T1485 - Data Destruction
adversary: origin
description: Identifies the deletion of an AWS CloudWatch log stream, which permanently deletes all associated archived log
  events with the stream
references:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1485/
- https://attack.mitre.org/tactics/TA0005/
- https://attack.mitre.org/techniques/T1562/
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/logs/delete-log-stream.html
- https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_DeleteLogStream.html
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "logs.amazonaws.com") &&
  equals("log.eventName", "DeleteLogStream") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
