# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS CloudTrail Log Suspended
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Defense Evasion
technique: T1562 - Impair Defenses
adversary: origin
description: Identifies suspending the recording of AWS API calls and log file delivery for the specified trail. An adversary
  may suspend trails in an attempt to evade defenses
references:
- https://attack.mitre.org/tactics/TA0005/
- https://attack.mitre.org/techniques/T1562/
- https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_StopLogging.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/cloudtrail/stop-logging.html
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "cloudtrail.amazonaws.com") &&
  equals("log.eventName", "StopLogging") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
