# Rule version v1.0.0 (ported from v11, merged from two near-duplicate v11
# rules -- keychain_credential_dumping.yml and keychain_dumping_cli.yml --
# into one: kept the -w-flag requirement on find-generic-password/
# find-internet-password from the CLI variant (those subcommands are used
# constantly for read-only existence checks by legitimate apps; only -w
# actually prints the cleartext secret, so requiring it avoids a rule that
# would fire on routine Keychain lookups), plus find-certificate and the
# correct "export -t" flag syntax from the other variant ("export-keychain"
# in the CLI variant isn't a real `security` subcommand). Adapted:
# log.message -> log.eventMessage, origin.process -> log.process (exposed
# directly by v12's macOS filter). Complements keychain_access_violations.yaml
# (subsystem/securityd-log-based, catches failed/denied access) with a
# CLI-command-based surface for successful extraction.

dataTypes:
  - macos
name: Keychain Credential Dumping via CLI
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1555.001 - Credentials from Password Stores: Keychain"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1555/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_creds_from_keychain.yml
description: |
  Detects the use of the macOS `security` command-line tool to extract credentials from the Keychain. dump-keychain, find-certificate, export -t, and unlock-keychain -p are used by attackers to harvest stored certificates, passwords, and private keys. find-generic-password/find-internet-password only fire when passed -w (the flag that actually prints the cleartext secret), since without it these subcommands are routine existence checks apps make constantly.

  Next Steps:
  1. Identify the user and process that executed the security command
  2. Determine which keychain items were accessed or exported
  3. Check if credentials were exfiltrated to an external location
  4. Reset any credentials that may have been compromised
  5. Review the process tree for the parent process and execution context
  6. Check for lateral movement using any harvested credentials
where: |
  (equals("log.process", "security") || contains("log.eventMessage", "/usr/bin/security")) &&
  (
    contains("log.eventMessage", "dump-keychain") ||
    contains("log.eventMessage", "find-certificate") ||
    contains("log.eventMessage", "export -t") ||
    (contains("log.eventMessage", "find-generic-password") && contains("log.eventMessage", "-w")) ||
    (contains("log.eventMessage", "find-internet-password") && contains("log.eventMessage", "-w")) ||
    (contains("log.eventMessage", "unlock-keychain") && contains("log.eventMessage", "-p"))
  )
groupBy:
  - adversary.host
  - adversary.user
