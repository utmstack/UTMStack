# Rule version v1.0.0

dataTypes:
  - o365-graph
name: Graph Password Spray from One Address
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Credential Access
technique: "T1110.003 - Brute Force: Password Spraying"
adversary: origin
references:
  - https://learn.microsoft.com/en-us/graph/api/resources/signin
  - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
  - https://attack.mitre.org/techniques/T1110/003/
description: |
  One address had at least 50 Entra ID sign-ins fail with a wrong user name or password (error 50126) within 30 minutes. Spraying tries a few common passwords against many accounts from the same address. The threshold sits above the busiest real day measured on customer Office 365 tenants, where a company gateway reached 20 such failures in half an hour.

  Graph publishes sign-ins up to ten minutes late and in batches, so the count looks back 30 minutes. One alert is raised per address; repeats are suppressed for seven days.

  Next Steps:
  1. Look up the address (origin ip) and list the accounts it tried.
  2. Check whether any of those accounts then signed in successfully from it.
  3. Block the address with Conditional Access or named locations, and reset the passwords of any account it guessed.
where: |
  equals("log.graphSource", "sign-ins") &&
  equals("actionResult", "failed") &&
  equals("log.status.errorCode", 50126) &&
  exists("origin.ip")
correlation:
  - within: 30m
    count: 50
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.graphSource
        operator: filter_term
        value: sign-ins
      - field: log.status.errorCode
        operator: filter_term
        value: '50126'
deduplicateBy:
  - adversary.ip
