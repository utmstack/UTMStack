# Rule version v1.1.0
dataTypes:
  - wineventlog
name: "Windows: Multiple Logon Failure Followed by Logon Success"
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: "Credential Access"
technique: "T1110 - Brute Force"
adversary: origin
description: "This rule is triggered when a sequence of multiple failed login attempts followed immediately by a successful login from the same IP address or source is detected. This unusual sequence of events may indicate a possible unauthorized access attempt using a brute force or password guessing technique. The purpose of this rule is to identify suspicious patterns of login activity and alert you to potential unauthorized access attempts. A successful logon (4624) alerts when the same computer recorded ten failed logons (4625) for the same account from the same source within the previous five minutes. Computer accounts (names ending in $) are skipped: their passwords are machine-generated and they make up almost half of all successful logons."
references:
  - "https://attack.mitre.org/tactics/TA0006/"
  - "https://attack.mitre.org/techniques/T1110/"
where: |
  equals("log.eventCode", 4624) &&
  !oneOf("dataSource", ["", "unknown"]) &&
  exists("log.authenticationSource") &&
  exists("target.user") && !endsWith("target.user", "$")
afterEvents:
  - with:
      - field: log.eventCode
        operator: filter_term
        value: 4625
      - field: dataSource
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.authenticationSource
        operator: filter_term
        value: '{{.log.authenticationSource}}'
      - field: target.user
        operator: filter_term
        value: '{{.target.user}}'
    within: 5m
    count: 10
deduplicateBy:
  - dataSource
  - lastEvent.log.authenticationSource
  - target.user
