# Rule version v1.0.0

dataTypes:
  - wineventlog
name: "Windows: LSA Secrets or DPAPI Backup Key Access"
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
category: "Credential Access"
technique: "T1003.004 - OS Credential Dumping: LSA Secrets"
adversary: origin
references:
  - "https://attack.mitre.org/techniques/T1003/004/"
description: |
  A handle was opened to a registry SecretObject with write-DAC/read access,
  including the domain's DPAPI backup key (BCKUPKEY) -- the object class
  tools like Mimikatz's lsadump::secrets and lsadump::backupkeys query to
  recover service account passwords, cached credentials and DPAPI master
  keys. This object is never touched during normal administration.

  Next Steps:
  1. Identify the process and user that opened the handle
  2. Check whether the process is a known credential-dumping tool
  3. If BCKUPKEY was accessed, treat DPAPI-protected secrets domain-wide as compromised
  4. Isolate the host and rotate affected credentials
where: |
  equals("log.eventCode", 4662) &&
  equals("log.channel", "Security") &&
  equals("log.eventDataObjectType", "SecretObject") &&
  equals("log.eventDataAccessMask", "2") &&
  contains("log.eventDataObjectName", "BCKUPKEY")
groupBy:
  - target.host
  - adversary.user
