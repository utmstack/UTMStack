# Rule version v1.0.0

dataTypes:
  - wineventlog
name: "Windows: Directory Services Restore Mode Password Set"
impact:
  confidentiality: 2
  integrity: 2
  availability: 0
category: Administrative Awareness
technique: Domain controller recovery password change
adversary: origin
references:
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4794
  - https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-concepts-account-management-modes
description: |
  A domain controller recorded an attempt to set the Directory Services Restore Mode administrator password (event 4794). This local administrator account is used to start a domain controller in repair mode. Microsoft recommends alerting on every occurrence. The event covers successful and failed attempts; check the status in the event.

  Windows LAPS can manage this password on domain controllers. Its scheduled changes run as SYSTEM and, like other repeated changes by the same account on the same domain controller, are grouped under one alert.

  Requires the "Audit User Account Management" success and failure audit on domain controllers.

  Next Steps:
  1. Confirm the change came from an approved administrator or from Windows LAPS.
  2. If it was not expected, set a new password through the approved process and check the domain controller for other changes by the same account.
where: |
  equals("log.eventCode", 4794) &&
  equals("log.channel", "Security") &&
  equals("log.providerName", "Microsoft-Windows-Security-Auditing")
groupBy:
  - dataSource
  - lastEvent.log.eventDataSubjectUserSid
