# Rule version v1.0.2

dataTypes:
  - "wineventlog"
name: "Windows: Possible ransomware attack detected. Unusual File Extensions."
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: "Impact"
technique: "T1486 - Data Encrypted for Impact"
adversary: origin
description: "Ransomware, is a type of malware that prevents users from accessing their system or 
              personal files and requires payment of a ransom in order to gain access to them again. Identifies 
              ransomware attempts. Files with unusual file extensions have been detected, potentially indicating encrypted files created by ransomware."
references:
  - "https://attack.mitre.org/tactics/TA0040/"
where: |
  equals("log.eventCode", 4663) && regexMatch("log.eventDataObjectName", "[.](locky|wcry|wncry|wannacry|cryptolocker|cryptowall|cerber[0-9]?|zepto|aesir|osiris|spora|jaff|globe|purge|xtbl|crinf|crjoker|cryptotorlocker|xrtn|cripttt|kraken|darkness|nochance|comrade|encrypted|crypted)$")
groupBy: []
deduplicateBy:
  - dataSource
