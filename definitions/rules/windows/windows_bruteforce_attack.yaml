# Rule version v1.1.0
dataTypes:
  - wineventlog
name: "Windows: Possible Brute Force Attack"
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: "Credential Access"
technique: "T1110 - Brute Force"
adversary: origin
description: "This rule is triggered when a pattern of repeated and rapid login attempts from the same IP address or source is detected. These login attempts may target specific user accounts or services in an attempt to crack passwords through automated brute force. The purpose of this rule is to identify possible malicious unauthorized access attempts and prevent a brute force attack against the system. It counts failed logons (4625) on one computer from one source (the network address, else the workstation name, else the domain-qualified account), whichever accounts they target, so password spraying that tries each account only a few times is caught as well. Ten failures within five minutes raise one alert per computer and source; repeats are suppressed for seven days."
references:
  - "https://attack.mitre.org/tactics/TA0006/"
  - "https://attack.mitre.org/techniques/T1110/"
where: |
  equals("log.eventCode", 4625) &&
  !oneOf("dataSource", ["", "unknown"]) &&
  exists("log.authenticationSource")
afterEvents:
  - with:
      - field: log.eventCode
        operator: filter_term
        value: 4625
      - field: dataSource
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.authenticationSource
        operator: filter_term
        value: '{{.log.authenticationSource}}'
    within: 5m
    count: 10
deduplicateBy:
  - dataSource
  - lastEvent.log.authenticationSource
