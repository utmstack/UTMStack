# Rule version v2.1.0

dataTypes:
  - firewall-sonicwall
name: SonicWall SSL VPN Authentication Failures
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1133 - External Remote Services"
adversary: origin
references:
  - https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-4-log-events-reference-guide.pdf
  - https://attack.mitre.org/techniques/T1133/
description: |
  Detects failed SSL VPN / NetExtender authentication attempts on a SonicWall
  firewall. Repeated failures from a single source IP indicate brute-force or
  credential-stuffing attacks against the remote access surface.

  Next Steps:
  1. Investigate the source IP against threat intel; check for scanning.
  2. Verify whether the targeted usernames exist and are enabled.
  3. Look for a successful VPN login from the same IP after the failures.
  4. Enforce MFA on VPN, geo-restrict where possible, and block confirmed
     malicious sources at the perimeter.
where: |
  (
    oneOf("log.eventCode", ["548", "549", "550"]) ||
    (
      contains("log.message", ["VPN", "SSL VPN", "SSL-VPN", "NetExtender"]) &&
      contains("log.message", ["failed", "fail", "denied", "invalid", "rejected"])
    ) ||
    (equals("log.groupCategory", "SSL VPN") && contains("log.message", ["failed", "denied", "rejected"]))
  ) && exists("origin.ip")
afterEvents:
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: 15m
    count: 5
groupBy:
  - adversary.ip
  - adversary.user
