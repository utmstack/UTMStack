# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb Cross Site Scripting Attack Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Web Application Attack
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/445549/attack
- https://attack.mitre.org/techniques/T1190/
description: |
  Detects cross-site scripting classified by FortiWeb, including extended signatures.

  Both Alert (log-only) and explicit blocking decisions are covered. Check log.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review log.subtype, log.attacktype, log.signatureid and log.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("log.type", "attack") &&
  regexMatch("log.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  ((regexMatch("log.subtype", "(?i)^(Cross Site Scripting(?:\\s*\\(Extended\\))?|XSS)$") || regexMatch("log.attacktype", "(?i)^(Cross Site Scripting(?:\\s*\\(Extended\\))?|XSS)$") || regexMatch("log.signaturesubclass", "(?i)^(Cross Site Scripting(?:\\s*\\(Extended\\))?|XSS)$")) || ((!exists("log.subtype") && !exists("log.attacktype")) && regexMatch("log.msg", "(?i)\\b(cross[ _-]*site[ _-]*scripting|xss)\\b")))
groupBy:
- adversary.ip
- target.ip
