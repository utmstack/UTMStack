# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Sophos Critical Priority Event
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Device Health
technique: Vendor critical event
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
description: Sophos reports Emergency, Alert or Critical priority/severity. Review the vendor event details; this
  broad device signal alone does not establish exploitation.
where: equals("severity","critical") && !regexMatch("log.application", "(Torrent|Proxy|EXE File Download|eMule P2P|Ares
  P2P|Avast Antivirus|NetFlix|McAfee Antivirus|AVG Antivirus|ISAKMP VPN|WeTransfer Base|Xbox LIVE|OSC_AMU)") &&
  !regexMatch("log.applicationName", "(Torrent|Proxy|EXE File Download|eMule P2P|Ares P2P|Avast Antivirus|NetFlix|McAfee
  Antivirus|AVG Antivirus|ISAKMP VPN|WeTransfer Base|Xbox LIVE|OSC_AMU)")
groupBy:
- lastEvent.dataSource
- lastEvent.log.sophosScope
- adversary.ip
- target.ip
