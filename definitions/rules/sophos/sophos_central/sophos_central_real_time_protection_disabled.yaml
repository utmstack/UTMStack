# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Real-Time Protection Disabled
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Defense Evasion
technique: T1562 - Impair Defenses
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/ManagementEventTypes/
description: Sophos reports disabled real-time protection. Review approved maintenance and device health before
  concluding that an adversary impaired defenses.
where: (equals("log.type", "Event::Endpoint::SavDisabled")) && !regexMatch("log.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
groupBy:
- lastEvent.dataSource
- lastEvent.log.customerId
- lastEvent.log.endpointId
- lastEvent.log.type
- target.host
- target.ip
