# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Credential Theft Attemp detected in Sophos Central
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Credential Access
technique: T1003 - OS Credential Dumping
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/EventTypes/
- https://attack.mitre.org/tactics/TA0006/
- https://attack.mitre.org/techniques/T1003/
description: The theft of access credentials to different pages or apps occurs due to the use of insecure passwords,
  which are used in different accounts. This data is often exposed as a result of leaks that arise from the exploitation
  of vulnerabilities in different platforms.
where: (startsWith("log.type","Event::Endpoint::HmpaCred")) && !regexMatch("log.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
groupBy:
- lastEvent.dataSource
- lastEvent.log.customerId
- lastEvent.log.endpointId
- lastEvent.log.type
- target.host
- target.ip
