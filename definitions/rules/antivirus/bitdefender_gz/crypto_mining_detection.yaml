# Rule version v2.0.0

dataTypes:
  - antivirus-bitdefender-gz
name: Bitdefender GravityZone Crypto Mining Detected
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: Impact
technique: "T1496 - Resource Hijacking"
adversary: origin
references:
  - https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
  - https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
  - https://attack.mitre.org/techniques/T1496/
description: |
  Detects cryptocurrency mining that Bitdefender itself classified as such, from any of three signals:

  - An antimalware, ATC or HyperDetect detection whose family name calls it a coin miner: CoinMiner, CryptoMiner, XMRig, Monero, Cryptonight, JsCoinminer, Coinhive.
  - A HyperDetect verdict with attack_type "grayware" and a name matching the miner families above. HyperDetect's grayware label is where cryptojacking often lands because miners are technically not classical malware.
  - Content Control blocking a URL for a known mining infrastructure host (coinhive, xmrig pools, minepool, nicehash, monerohash).

  Cryptojacking is not just theft of CPU. A running miner is confirmation that arbitrary code executed on the endpoint, so the operator can equally choose to run anything else next.

  Next Steps:
  1. Identify the process: target.process and target.path if the antimalware engine caught it, or origin.url if Content Control blocked the pool.
  2. Kill the miner process only after you have grabbed its command line - many droppers restart the miner under a new name.
  3. Look for persistence: scheduled tasks, run keys, services, cron jobs and startup items on the endpoint. The miner did not install itself; something else placed it there.
  4. Check every host the same target.user touched. Cryptojacking is opportunistic and often distributed via user-mode delivery.
  5. Verify that no data was staged for exfiltration in the same session. A "just mining" verdict without checking is unsafe.
  6. Block the mining pool host at the perimeter and add its hash to blocklists across the estate before closing.
where: |
  oneOf("log.BitdefenderGZModule", ["av", "avc", "hd"]) &&
  (regexMatch("log.BitdefenderGZDetectionName", "(?i)(coin.?miner|crypto.?miner|xmrig|monero|cryptonight|coinhive|jscoinminer|bitcoin.?miner)") ||
   regexMatch("target.malware", "(?i)(coin.?miner|crypto.?miner|xmrig|monero|cryptonight|coinhive|jscoinminer|bitcoin.?miner)")) ||
  (equals("log.BitdefenderGZModule", "uc") &&
   regexMatch("origin.url", "(?i)(coinhive|xmrig|minepool|nicehash|monerohash|nanopool|supportxmr)"))
groupBy:
  - target.host
  - target.malware