# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Mining-Related Threat Detection
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: Impact
technique: T1496 - Resource Hijacking
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1496/
description: 'An antimalware signature names mining software, or a Content Control URL matches a mining-related indicator. Detection
  or blocking does not establish that a miner ran. Check authorization, the exact hostname or URL (a substring can be coincidental),
  vendor action, process activity and resource usage before attributing cryptojacking.

  '
where: "oneOf(\"log.BitdefenderGZModule\", [\"av\", \"avc\", \"hd\"]) &&\n(regexMatch(\"log.BitdefenderGZDetectionName\", \"(?i)(coin.?miner|crypto.?miner|xmrig|monero|cryptonight|coinhive|jscoinminer|bitcoin.?miner)\"\
  ) ||\n regexMatch(\"target.malware\", \"(?i)(coin.?miner|crypto.?miner|xmrig|monero|cryptonight|coinhive|jscoinminer|bitcoin.?miner)\"\
  )) ||\n(equals(\"log.BitdefenderGZModule\", \"uc\") &&\n regexMatch(\"origin.domain\", \"(?i)(coinhive|xmrig|minepool|nicehash|monerohash|nanopool|supportxmr)\"\
  ))\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.malware
