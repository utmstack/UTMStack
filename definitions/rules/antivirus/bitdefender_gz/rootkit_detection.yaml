# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Rootkit Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: T1014 - Rootkit
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1014/
description: 'An antimalware detection name matches a rootkit-related family or indicator. Review the exact vendor classification, affected
  object and remediation outcome. A signature match does not prove that the rootkit installed or that all endpoint evidence is untrustworthy.
  Use the incident response process and trusted forensic collection when the evidence supports compromise.

  '
where: "oneOf(\"log.BitdefenderGZModule\", [\"av\", \"avc\", \"hd\"]) &&\n(regexMatch(\"log.BitdefenderGZDetectionName\", \"(?i)(rootkit|tdss|zeroaccess|necurs|alureon|rustock|sinowal|trojan\\\
  \\.rootkit)\") ||\n regexMatch(\"target.malware\", \"(?i)(rootkit|tdss|zeroaccess|necurs|alureon|rustock|sinowal|trojan\\\\.rootkit)\"\
  ))\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.malware
