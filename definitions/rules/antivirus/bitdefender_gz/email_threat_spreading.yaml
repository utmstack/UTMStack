# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Exchange Malware Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: 'T1566.001 - Phishing: Spearphishing Attachment'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1566/001/
description: 'The Exchange antimalware module reports a detection. Determine whether the affected object was quarantined, removed, blocked
  or delivered using the original vendor details and mail-system records. A matching endpoint hash is a correlation lead, not proof
  that a specific user opened a message. Investigate affected messages and recipients before choosing containment.

  '
where: 'equals("log.BitdefenderGZModule", "exchange-malware")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.malware
