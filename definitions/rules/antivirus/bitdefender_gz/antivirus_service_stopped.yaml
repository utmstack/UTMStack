# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Antitampering Detection
impact:
  confidentiality: 2
  integrity: 3
  availability: 3
category: Defense Evasion
technique: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1562/001/
description: 'GravityZone reported an antitampering event. This identifies attempted interference with protection; it does not by itself
  prove that a service stopped or that the attempt succeeded. Review the vendor event details, endpoint state and authorized maintenance
  before containment.

  '
where: equals("log.BitdefenderGZModule", "antitampering")
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- lastEvent.log.BitdefenderGZModule
