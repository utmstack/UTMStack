# Rule version v2.0.0

dataTypes:
  - antivirus-bitdefender-gz
name: Bitdefender GravityZone High Severity Malware Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1204.002 - User Execution: Malicious File"
adversary: origin
references:
  - https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
  - https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
  - https://attack.mitre.org/techniques/T1204/002/
description: |
  Detects a high-severity malware finding from any of Bitdefender's three antimalware engines: Antimalware (signature and on-access), Advanced Threat Control (behavioural) and HyperDetect (machine learning tuned for advanced threats).

  This is the baseline malware alert for the data source. Whether the threat was actually neutralised is a separate question, answered by actionResult: a value of "failed" means it is still on the endpoint, and that case has its own rule with a higher impact.

  Next Steps:
  1. Read the outcome before deciding how urgent this is:
     - actionResult "success" with action blocked, deleted, quarantined or disinfected means the control worked; treat this as an exposure and hygiene finding
     - actionResult "failed" means the threat is live and the endpoint should be isolated immediately
  2. Identify what was found:
     - target.malware and target.malwareType give the threat name and whether it is a file or a process
     - target.sha256 and target.md5 let you pivot to threat intelligence and across the estate
     - target.path is the artefact, target.process is the process that touched it
  3. Establish how it arrived:
     - origin.url is populated when the threat came in over the web
     - target.user identifies who was logged on, which usually explains the delivery path
     - Correlate with Antiphishing events on the same target.host around deviceTime
  4. Look for related activity on the same host in the surrounding hours - a single detection is often one step of a longer chain
  5. Hunt the estate for the same target.sha256 to find endpoints where nothing was reported
  6. Follow up on the endpoint:
     - Run a full scan and confirm it comes back clean
     - Check that signatures were current at deviceTime, using log.BitdefenderGZSignaturesNumber
where: oneOf("log.BitdefenderGZModule", ["av", "avc", "hd"]) && greaterOrEqual("severity", 8)
groupBy:
  - target.host
  - target.malware