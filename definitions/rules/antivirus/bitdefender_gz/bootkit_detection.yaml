# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Boot-Related Malware Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Defense Evasion
technique: 'T1542.001 - Pre-OS Boot: System Firmware'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1542/001/
description: 'An antimalware detection identifies a boot object, a boot/rootkit-related signature, or an artifact in a boot-related
  path. The signature or path does not establish successful persistence or firmware compromise. Review log.BitdefenderGZMalwareType
  (the infected-object category), target.malware, log.filePath and the vendor action. Use trusted forensic methods if the evidence supports
  boot-level compromise.

  '
where: "oneOf(\"log.BitdefenderGZModule\", [\"av\", \"avc\", \"hd\"]) &&\n(equals(\"log.BitdefenderGZMalwareType\", \"boot\") ||\n regexMatch(\"\
  log.BitdefenderGZDetectionName\",\n   \"(?i)(bootkit|rootkit|uefi|tdss|alureon|zeroaccess|necurs|rustock|sinowal|trojan\\\\.boot|master.?boot)\"\
  ) ||\n regexMatch(\"target.malware\",\n   \"(?i)(bootkit|rootkit|uefi|tdss|alureon|zeroaccess|necurs|rustock|sinowal|trojan\\\\.boot|master.?boot)\"\
  ) ||\n regexMatch(\"log.filePath\",\n   \"(?i)(\\\\\\\\efi\\\\\\\\|/efi/|\\\\\\\\boot\\\\\\\\|/boot/|master\\\\.?boot\\\\.?record|mbr)\"\
  ))\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.malware
