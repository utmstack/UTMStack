# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Real-Time Antimalware Disabled
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1562/001/
description: 'A Product Modules Status event reports real-time antimalware disabled. Confirm the applied policy, licensing, maintenance
  state and actual endpoint protection status. The event does not identify the person responsible or establish tampering. Review related
  protection events and restore expected coverage through the approved management process.

  '
where: "equals(\"log.BitdefenderGZModule\", \"modules\") &&\n(equals(\"log.malwarestatus\", \"0\") ||\n equals(\"log.BitdefenderGZMalwareStatus\"\
  , \"0\"))\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
