# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: ESET Host Intrusion Prevention System Triggered
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion, Privilege Escalation
technique: "T1055 - Process Injection"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1055/
description: |
  Detects warning-or-higher HIPS blocks whose operation or rule explicitly identifies suspicious or malicious behavior, injection, exploitation, tampering, or self-defense. Ordinary blocked operations from a restrictive policy are excluded from this generic security-behavior rule. The event class identifies HIPS; it is not an action result. A block records an attempted operation, not successful compromise.

  Next Steps:
  1. Review the blocked process or action details in the ESET console
  2. Identify the source application attempting the blocked behavior
  3. Check if the blocked action is from legitimate software (false positive)
  4. If malicious, isolate the affected system and perform full malware scan
  5. Review system logs for any successful compromise attempts before HIPS activation
  6. Update HIPS rules if necessary to prevent similar attacks
  7. Check for persistence mechanisms on the affected host
  8. Review network connections from the suspicious process if applicable
where: |
  (oneOf("log.eventType", ["HipsAggregated_Event", "HIPSAggregated_Event"]) && equals("actionResult", "denied") && oneOf("severity", ["warning", "error", "critical"]) &&
  (regexMatch("log.operation", "(?i)(suspicious|malicious|injection|exploit|tamper|self[- ]defen[sc]e)") ||
   regexMatch("log.rulename", "(?i)(suspicious|malicious|injection|exploit|tamper|self[- ]defen[sc]e)"))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - lastEvent.log.rulename
  - lastEvent.log.ruleid
