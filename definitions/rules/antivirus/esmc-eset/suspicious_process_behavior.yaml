# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: Suspicious Process Behavior Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion, Privilege Escalation
technique: "T1055 - Process Injection"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1055/
description: |
  Detects HIPS operations or ESET Inspect rules that explicitly identify process injection, suspicious objects/behavior, or anomalous processes. Generic blocked, terminated, or prevented action text alone does not establish one of these behaviors.

  Next Steps:
  1. Immediately review the alert details to identify:
     - Affected hostname (check target.host)
     - Specific threat or behavior detected (check the structured operation and rule name)
     - Process name and path if available
     - Time of detection (check deviceTime)
  2. Investigate the process that triggered the alert:
     - Verify if it's a legitimate application or unknown/suspicious
     - Check process creation chain and parent-child relationships
     - Review file hash against threat intelligence sources
  3. Check for related security events:
     - Look for other ESET alerts from the same host
     - Search for network connections from the suspicious process
     - Review authentication events around the same timeframe
  4. Containment actions if malicious:
     - Isolate the affected host from the network
     - Kill the suspicious process if still running
     - Preserve forensic evidence (memory dump, logs)
  5. Remediation steps:
     - Run full antivirus scan on the affected system
     - Check for persistence mechanisms (registry, scheduled tasks)
     - Update ESET signatures and perform system hardening
  6. Prevention measures:
     - Review and update application control policies
     - Ensure ESET real-time protection is enabled
     - Consider implementing application whitelisting
where: |
  ((oneOf("log.eventType", ["HipsAggregated_Event", "HIPSAggregated_Event"]) && (regexMatch("log.operation", "(?i)(process injection|suspicious (object|behavior)|anomalous process|injecting)") || regexMatch("log.rulename", "(?i)(process injection|suspicious (object|behavior)|anomalous process|injecting)"))) ||
  (equals("log.eventType", "EnterpriseInspectorAlert_Event") && regexMatch("log.rulename", "(?i)(process injection|suspicious (object|behavior)|anomalous process|injecting)"))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - lastEvent.log.eventType
