# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: Suspicious Encrypted File Activity
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Impact
technique: "T1486 - Data Encrypted for Impact"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1486/
description: |
  Detects ransomware or Filecoder labels in antivirus detection name/type fields. An encrypted file name or an ordinary encryption-related path alone is not ransomware evidence, and the detection does not establish that file encryption succeeded.

  Next Steps:
  1. Immediately isolate the affected system to prevent spread
  2. Check if backup systems are accessible and uncompromised
  3. Review the structured threat name and type for the reported ransomware variant
  4. Look for other systems showing similar encryption patterns
  5. Preserve forensic evidence before remediation
  6. Consider engaging incident response team for ransomware cases
  7. Do not power off the system if encryption is in progress
where: |
  (equals("log.eventType", "Threat_Event") &&
  (regexMatch("log.threat_name", "(?i)(ransomware|filecoder)") || regexMatch("log.threat_type", "(?i)(ransomware|filecoder)"))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - lastEvent.log.threat_name
