# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: Registry Modification Attempts Blocked
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion, Persistence
technique: "T1112 - Modify Registry"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1112/
description: |
  Detects warning-or-higher HIPS blocks involving a registry operation or Windows registry target. Review the operation and target to distinguish malicious persistence or tampering from legitimate software blocked by policy.

  Next Steps:
  1. Review the blocked action details to understand what registry key was targeted
  2. Investigate the source process and user account involved in the attempt
  3. Check for other security events from the same host around the same time
  4. Verify if this is legitimate administrative activity or potential malicious behavior
  5. If suspicious, isolate the affected system and perform a full malware scan
  6. Review system logs for any successful registry modifications before the block occurred
where: |
  (oneOf("log.eventType", ["HipsAggregated_Event", "HIPSAggregated_Event"]) && equals("actionResult", "denied") && oneOf("severity", ["warning", "error", "critical"]) &&
  (regexMatch("log.operation", "(?i)registry") || regexMatch("log.target", "(?i)^(HKEY_|HKLM|HKCU|HKCR|HKU|HKCC)"))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - lastEvent.log.target
