# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: ESET Security Agent Tampering Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Defense Evasion
technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1562/001/
description: |
  Detects a blocked HIPS self-defense or agent-tampering rule, or an ESET Inspect alert explicitly naming security-agent tampering. A blocked attempt does not establish that the agent was disabled. Routine audit policy changes and generic agent status text are not tampering evidence.

  Next Steps:
  1. Immediately investigate the affected endpoint
  2. Verify whether protection was disabled and identify the responsible process or account
  3. Check for concurrent malicious activity on the endpoint
  4. Restore or reinstall ESET protection only if it was affected
  5. Review the endpoint for malware or unauthorized software
  6. Check if similar tampering occurred on other endpoints
where: |
  (((oneOf("log.eventType", ["HipsAggregated_Event", "HIPSAggregated_Event"]) && equals("actionResult", "denied")) || equals("log.eventType", "EnterpriseInspectorAlert_Event")) &&
  regexMatch("log.rulename", "(?i)(eset|ekrn|egui|self[- ]defen[sc]e)") &&
  regexMatch("log.rulename", "(?i)(tamper|self[- ]defen[sc]e|disable|stopp?ed|terminat)")) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - lastEvent.log.rulename
  - lastEvent.log.ruleid
