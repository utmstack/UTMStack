# Rule version v1.1.0
dataTypes:
- antivirus-kaspersky
name: Kaspersky Command and Control Communication Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Command and Control
technique: T1071 - Application Layer Protocol
adversary: origin
references:
- https://attack.mitre.org/techniques/T1071/
- https://support.kaspersky.com/KLMS/8.2/en-US/151504.htm
description: |
  Reports Kaspersky CEF command-and-control indicators without an explicit block outcome. Missing or unknown actions do not prove that a connection succeeded. Confirm the vendor event, source/destination roles, process and traffic before containment. A generic NetworkThreat category alone is insufficient.
where: |
  equals("log.format","cef") && ((contains("log.cs2", ["Bot", "bot", "C2", "Command", "command"]) ||
   contains("log.msg", ["callback", "beacon", "botnet", "command and control"])) &&
  exists("target.ip") &&
  !equals("actionResult", "denied"))
groupBy:
- adversary.host
- target.ip
