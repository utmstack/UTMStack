# Rule version v2.0.0

dataTypes:
  - linux
name: OpenShift Security Violations
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: "T1552.007 - Unsecured Credentials: Container API"
adversary: origin
references:
  - https://docs.openshift.com/container-platform/latest/security/index.html
  - https://attack.mitre.org/techniques/T1552/007/
description: |
  Best-effort, low-confidence detection for OpenShift-related security events, limited to node-level journald text
  from any unit whose syslog identifier mentions OpenShift/CRI-O components.

  Rewritten v2.0.0, and left intentionally weak: this rule is architecturally unable to see what it was written to
  detect. RBAC violations, Security Context Constraint breaches, admission webhook denials, and API audit
  responses (403s) are recorded by the OpenShift API server's own structured audit log
  (kube-apiserver-audit / openshift-apiserver-audit), which this Linux host agent never reads -- it only collects
  this node's own journald/auditd output. The previous version invented fields for this
  (log.service/log.program/log.kubernetes_component/log.namespace/log.audit_verb/log.audit_response_code/
  log.privileged/log.resource/log.verb/log.response_code/log.event_type) that do not and cannot exist in this
  agent's data. Real detection needs a dedicated collector ingesting the OpenShift audit log (e.g. via the
  cluster's own logging pipeline or the kube-apiserver-audit webhook), which is out of scope for this agent and not
  built. Until that exists, keep this only as a coarse, best-effort fallback on the rare node-level text that does
  reach journald, and do not rely on it for real RBAC/SCC/admission-control coverage.

  Next Steps:
  1. Immediately investigate the user account and source IP involved in the violation
  2. Review the specific OpenShift namespace and resources being accessed
  3. Check RBAC configurations and Security Context Constraints (SCC) policies
  4. Examine pod specifications for security violations or privileged access attempts
  5. Verify API audit logs for additional unauthorized access patterns
  6. Review admission controller and webhook configurations
  7. Consider temporarily restricting access for the affected user/service account
  8. Document findings and update security policies if needed
where: |
  (contains("log.SYSLOGIDENTIFIER", "openshift") || contains("log.SYSLOGIDENTIFIER", "crio") || contains("log.SYSLOGIDENTIFIER", "kubelet")) &&
  (
    contains("log.message", "forbidden") ||
    contains("log.message", "RBAC") ||
    contains("log.message", "denied") ||
    contains("log.message", "admission webhook")
  )
groupBy:
  - adversary.host
