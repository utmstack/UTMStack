# Rule version v2.0.0

dataTypes:
  - linux
name: SystemD Unit File Attack Detected
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Persistence, Privilege Escalation
technique: "T1543.002 - Create or Modify System Process: Systemd Service"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1543/002/
  - https://www.linuxjournal.com/content/systemd-service-strengthening
description: |
  Detects systemd's own journal text for a unit-file parse failure that names a numeric/invalid user, or a
  systemd-generator reporting it created/modified something.

  Rewritten v2.0.0: `log.process` does not exist for systemd's own journal lines -- the real, populated field for
  "which service wrote this journal line" is log.SYSLOGIDENTIFIER (journald's SYSLOG_IDENTIFIER), which is
  "systemd" for the daemon's own messages. Also dropped two conditions as unlikely to ever fire in practice even
  though log.message itself is a real field: systemd does not echo unit-file directives like
  "NoNewPrivileges=false" or "ProtectSystem=false" to the journal during normal operation (those are static config
  values, not something systemd logs about), and the "unit file ... ExecStart ... /tmp/" combination assumes a
  specific verbose-failure message format that was not confirmed against real systemd journal output in this
  pass -- kept as a lower-confidence branch rather than dropped outright, since the individual substrings
  (ExecStart, /tmp/, bash -c) are all real text systemd can plausibly include in a unit-load error.

  Next Steps:
  1. Investigate the user account attempting to modify systemd unit files
  2. Examine the specific unit file content for malicious directives
  3. Check for any new services that were created or started
  4. Review system logs for privilege escalation attempts
  5. Verify the legitimacy of any new systemd generators
  6. Check file permissions and ownership of modified unit files
  7. Look for persistence mechanisms in systemd configuration
  8. Consider isolating the affected system if malicious activity is confirmed
where: |
  equals("log.SYSLOGIDENTIFIER", "systemd") &&
  (
    (contains("log.message", "Failed to parse user") && regexMatch("log.message", "[0-9].*")) ||
    (contains("log.message", "unit file") &&
     (contains("log.message", "ExecStart") || contains("log.message", "ExecStartPre") || contains("log.message", "ExecStartPost")) &&
     (contains("log.message", "/tmp/") || contains("log.message", "/dev/shm/") || contains("log.message", "bash -c") || contains("log.message", "sh -c"))) ||
    (contains("log.message", "User=") && regexMatch("log.message", "User=[0-9].*")) ||
    (contains("log.message", "systemd-generator") && (contains("log.message", "created") || contains("log.message", "modified")))
  )
groupBy:
  - adversary.host
  - adversary.user
