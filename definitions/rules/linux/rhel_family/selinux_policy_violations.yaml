# Rule version v2.0.0

dataTypes:
  - linux
name: Critical SELinux Policy Violation
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: "T1068 - Exploitation for Privilege Escalation"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1068/
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/using_selinux/troubleshooting-problems-related-to-selinux_using-selinux
description: |
  Detects critical SELinux policy violations that may indicate privilege escalation attempts, unauthorized access, or malicious activity bypassing mandatory access controls. This rule identifies AVC denials for sensitive capabilities and SELinux security operations, attempts to access shadow files, modifications to critical system directories, unconfined processes accessing executables, SELinux management commands run from a confined domain, and SELinux being switched from enforcing to permissive mode.

  AVC denials come from the agent's audit collector (log.avc). A denial with log.avc.permissive "1" was logged but not blocked. Mode changes come from the MAC_STATUS audit record (log.macstatus), from the journal's audit transport, or from sudo running setenforce.

  Next Steps:
  1. Immediately review the specific SELinux violation details including source context (scontext), target context (tcontext), and attempted permission
  2. Identify the process (comm field) and user attempting the action
  3. Determine if this is legitimate administrative activity or potential attack
  4. Check system logs around the time of violation for related suspicious activities
  5. Verify current SELinux enforcement status using 'getenforce' command
  6. Review recent policy changes and user activities on the affected system
  7. If malicious, isolate the system and perform forensic analysis
  8. Update SELinux policies if legitimate access was incorrectly denied
  9. Monitor for additional violations from the same source
where: |
  (
    equals("log.avc.seresult", "denied") &&
    (
      (oneOf("log.avc.tclass", ["capability", "capability2"]) &&
       regexMatch("log.avc.seperms", "(^|,)(sys_admin|sys_module|sys_ptrace|setuid|setgid|dac_override|dac_read_search)(,|$)")) ||
      (equals("log.avc.tclass", "security") &&
       regexMatch("log.avc.seperms", "(^|,)(load_policy|setenforce|setbool|setsecparam)(,|$)")) ||
      (equals("log.avc.tclass", "file") &&
       contains("log.avc.tcontext", ":shadow_t:") &&
       regexMatch("log.avc.seperms", "(^|,)(read|write|append)(,|$)")) ||
      (equals("log.avc.tclass", "dir") &&
       (contains("log.avc.tcontext", ":etc_t:") || contains("log.avc.tcontext", ":boot_t:") || contains("log.avc.tcontext", ":lib_t:")) &&
       regexMatch("log.avc.seperms", "(^|,)(write|add_name|remove_name)(,|$)")) ||
      (contains("log.avc.scontext", ":unconfined_t:") &&
       contains("log.avc.tcontext", "_exec_t:")) ||
      (oneOf("log.avc.comm", ["setenforce", "semodule", "restorecon"]) &&
       !contains("log.avc.scontext", ":unconfined_t:"))
    )
  ) ||
  (
    equals("log.macstatus.enforcing", "0") &&
    equals("log.macstatus.old_enforcing", "1")
  ) ||
  (
    equals("log.syslogIdentifier", "audit") &&
    startsWith("log.message", "MAC_STATUS ") &&
    contains("log.message", " enforcing=0 old_enforcing=1 ")
  ) ||
  (
    equals("log.syslogIdentifier", "sudo") &&
    regexMatch("log.message", "COMMAND=\\S*setenforce\\s+(0|[Pp]ermissive)(\\s|$)")
  )
deduplicateBy:
  - dataSource
  - lastEvent.log.avc.scontext
  - lastEvent.log.avc.tcontext
  - lastEvent.log.avc.tclass
  - lastEvent.log.macstatus.enforcing
  - lastEvent.log.message
