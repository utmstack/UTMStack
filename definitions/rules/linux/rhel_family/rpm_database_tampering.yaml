# Rule version v2.0.0

dataTypes:
  - linux
name: RPM Database Tampering Detection
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1070 - Indicator Removal"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1070/
  - https://access.redhat.com/articles/3763
description: |
  Detects `rpm --rebuilddb` run by a non-root user, and journald text suggesting rpmdb corruption.

  Rewritten v2.0.0: the previous version's direct-file-tamper branch checked log.path/log.operation and
  `oneOf("log.syscall", ["2","257","82","83","87"])` (raw syscall numbers) -- this filter renames log.syscall to
  `action` and auparse resolves syscalls to their NAME (e.g. "openat"), not a number, so that check could never
  match even before considering field names. It also assumed /var/lib/rpm/* is under a file-integrity watch
  (log.eventType=="FILE_MODIFIED") and that install-time provenance is tracked (log.package_source,
  log.gpg_verification) -- neither exists in this pipeline. This agent does not currently audit writes to
  /var/lib/rpm/* at all (no `-w` rule for that path); doing so would need adding one to
  agent/dependency/auditd_linux.go's auditRulesContent. Until then, direct tampering with the RPM database files
  themselves (bypassing rpm/yum/dnf entirely) is an undetected gap, not something fixable by renaming fields.
  RHEL/CentOS-only; cannot be live-fire verified on the Debian-family V11-DEV-18 test VM.

  Next Steps:
  1. Immediately investigate the source host and verify system integrity
  2. Check for unauthorized package installations or removals using 'rpm -qa --last'
  3. Verify RPM database integrity with 'rpm --verifydb'
  4. Review system logs for suspicious process execution around the time of detection
  5. Examine file system integrity and check for signs of rootkit installation
  6. Correlate with other security events from the same host
  7. If compromise is confirmed, isolate the system and initiate incident response procedures
  8. Consider rebuilding the system from known good backups if extensive tampering is detected
where: |
  (
    equals("action", "execve") &&
    oneOf("origin.process", ["/usr/bin/rpm", "/usr/bin/rpmdb"]) &&
    contains("origin.command", "--rebuilddb") &&
    !equals("log.uid", "0")
  ) ||
  (
    contains("log.message", "rpmdb") &&
    (
      contains("log.message", "corrupted") ||
      contains("log.message", "checksum") ||
      contains("log.message", "mismatch")
    )
  )
groupBy:
  - adversary.host
  - adversary.user
