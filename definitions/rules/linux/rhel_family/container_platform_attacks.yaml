# Rule version v2.0.0

dataTypes:
  - linux
name: Container Platform Security Attacks
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: "T1611 - Escape to Host"
adversary: origin
references:
  - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/building_running_and_managing_containers/index
  - https://attack.mitre.org/techniques/T1611/
description: |
  Detects command-line patterns commonly used to escape a container's isolation (nsenter into another namespace,
  re-exec via /proc/self/exe, a container CLI invoked with --privileged) and, where the underlying syscall is
  actually audited, mount/pivot_root/chroot calls that were denied.

  Rewritten v2.0.0: the previous version checked log.service/log.process_name/log.event_type/log.container_id and
  free-text log.message strings ("container escape", "seccomp violation", "runtime manipulation", "SELinux denial")
  that dockerd/podman/crio/containerd do not actually emit verbatim to their logs -- those were invented, not
  observed. It also checked `log.syscall`/`log.result`, but this filter's Phase 4 renames log.syscall -> action and
  log.result -> actionResult, so those source fields no longer exist by the time a rule evaluates them; fixed to
  check the renamed fields. Whether mount/pivot_root/chroot are even audited at all on this host depends on the
  agent's installed audit rules including those syscalls explicitly -- not confirmed one way or the other in this
  pass. Real container escape detection (writes to /proc/[pid]/root, container-breakout-specific seccomp/AppArmor
  denials with structured detail) would need dedicated container-runtime log ingestion, which this rule set does
  not have; this is a documented gap, not something patched around here.

  Next Steps:
  1. Investigate the affected container and host system for signs of compromise
  2. Review container logs and runtime configurations for unauthorized changes
  3. Check for unusual process execution or file system modifications
  4. Verify container image integrity and scan for malicious content
  5. Review security policies for containers (seccomp, AppArmor, SELinux)
  6. Consider isolating the affected container and host system
  7. Update container security policies and runtime configurations as needed
where: |
  equals("action", "execve") &&
  (
    (oneOf("origin.process", ["/usr/bin/nsenter", "/bin/nsenter"])) ||
    (oneOf("origin.process", ["/usr/bin/docker", "/usr/bin/podman", "/usr/bin/crictl", "/usr/bin/runc"]) &&
     (contains("origin.command", "--privileged") || contains("origin.command", "/proc/self/exe") || contains("origin.command", "--pid=host") || contains("origin.command", "--mount=/proc/1/ns")))
  ) ||
  (oneOf("action", ["mount", "pivot_root", "chroot"]) && equals("actionResult", "denied"))
groupBy:
  - adversary.host
  - adversary.user
