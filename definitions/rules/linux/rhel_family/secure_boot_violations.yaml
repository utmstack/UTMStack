# Rule version v2.0.0

dataTypes:
  - linux
name: RHEL Secure Boot Violation Detection
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1553.006 - Subvert Trust Controls: Code Signing Policy Modification"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1553/006/
  - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/security_hardening/using-uefi-secure-boot_security-hardening
description: |
  Detects mokutil being used to disable Secure Boot validation, reset, or delete an enrolled key, and real
  kernel-transport journald lines the kernel actually emits for signature-verification failures at module load
  time (PKCS#7 signature not signed with a trusted key, module verification failed, Secure Boot forbids loading).

  Rewritten v2.0.0. Two categories were dropped as genuine, currently-uncloseable gaps rather than patched with
  real field names:
  - EFI variable modification (SecureBoot/PK/KEK/db/dbx, or writes under /sys/firmware/efi/efivars/) -- not
    watched by this agent's audit rules today (would need a `-w` rule added to
    agent/dependency/auditd_linux.go's auditRulesContent), and even then a raw byte-level EFI variable write
    carries no field telling you WHICH variable changed without decoding the write's contents, which this
    collector does not do.
  - shim-emitted verification failures -- shim is the first-stage UEFI bootloader; it runs before Linux, before
    journald exists, and does not log to it. There is no host-agent-observable signal for shim's own decisions at
    all; this would need UEFI/firmware-level log collection, which is out of scope for this agent entirely.
  RHEL-family only for the mokutil/GRUB angle; cannot be live-fire verified on the Debian-family V11-DEV-18 test VM.

  Next Steps:
  1. Immediately isolate the affected system to prevent lateral movement
  2. Verify current Secure Boot status with 'mokutil --sb-state' command
  3. Check for unauthorized kernel modules with 'lsmod' and compare against baseline
  4. Review recent system changes, updates, or administrative activities
  5. Examine MOK database contents with 'mokutil --list-enrolled'
  6. Check system logs for any unauthorized access or privilege escalation
  7. Validate boot chain integrity and consider system restoration from known good backup
  8. Review and strengthen access controls for system administration
where: |
  (equals("action", "execve") && contains("origin.command", "mokutil") &&
   (contains("origin.command", "--disable-validation") || contains("origin.command", "--reset") || contains("origin.command", "--delete"))) ||
  (equals("log.TRANSPORT", "kernel") &&
   (contains("log.message", "PKCS#7 signature not signed with a trusted key") ||
    contains("log.message", "module verification failed") ||
    contains("log.message", "Secure Boot forbids loading")))
groupBy:
  - adversary.host
  - adversary.user
