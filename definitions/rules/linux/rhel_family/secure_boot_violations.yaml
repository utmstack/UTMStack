# Rule version v2.0.0

dataTypes:
  - linux
name: RHEL Secure Boot Violation Detection
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1553.006 - Subvert Trust Controls: Code Signing Policy Modification"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1553/006/
  - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/security_hardening/using-uefi-secure-boot_security-hardening
description: |
  Detects violations of UEFI Secure Boot policy including unsigned kernel modules, tampering with MOK (Machine Owner Key) database, attempts to disable Secure Boot, or loading of unauthorized boot components. This indicates potential compromise of the boot chain integrity or attempts to bypass security controls.

  The rule reads the kernel's module signature and lockdown messages from the journal, module loads that the audit collector saw fail with a key or signature error, and mokutil commands that change the MOK database or disable shim validation. Read-only mokutil commands such as --sb-state and --test-key do not match.

  Next Steps:
  1. Immediately isolate the affected system to prevent lateral movement
  2. Verify current Secure Boot status with 'mokutil --sb-state' command
  3. Check for unauthorized kernel modules with 'lsmod' and compare against baseline
  4. Review recent system changes, updates, or administrative activities
  5. Examine MOK database contents with 'mokutil --list-enrolled'
  6. Check system logs for any unauthorized access or privilege escalation
  7. Validate boot chain integrity and consider system restoration from known good backup
  8. Review and strengthen access controls for system administration
where: |
  (
    equals("log.syslogIdentifier", "kernel") &&
    (
      regexMatch("log.message", "^Loading of (unsigned module|module with unavailable key|module with unsupported crypto) is rejected") ||
      contains("log.message", "PKCS#7 signature not signed with a trusted key") ||
      contains("log.message", "module verification failed: signature and/or required key missing") ||
      (startsWith("log.message", "Lockdown: ") &&
       (contains("log.message", "unsigned module loading is restricted") ||
        contains("log.message", "kexec of unsigned images is restricted")))
    )
  ) ||
  (
    oneOf("action", ["init_module", "finit_module"]) &&
    oneOf("log.exit", ["EKEYREJECTED", "ENOKEY", "EBADMSG"])
  ) ||
  (
    equals("action", "execve") &&
    endsWith("origin.process", "/mokutil") &&
    (contains("origin.command", "--disable-validation") || contains("origin.command", "--import") ||
     contains("origin.command", "--delete") || contains("origin.command", "--reset"))
  ) ||
  (
    equals("log.syslogIdentifier", "sudo") &&
    regexMatch("log.message", "COMMAND=\\S*mokutil\\s.*--(disable-validation|import|delete|reset)")
  )
deduplicateBy:
  - dataSource
  - lastEvent.log.message
  - lastEvent.origin.command
  - lastEvent.log.kernmodule.name
