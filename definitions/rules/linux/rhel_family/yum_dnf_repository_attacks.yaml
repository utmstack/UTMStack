# Rule version v2.0.0

dataTypes:
  - linux
name: YUM/DNF Repository Manipulation Attack
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: "T1195.001 - Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1195/001/
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html-single/managing_software_with_the_dnf_tool/index
description: |
  Detects yum/dnf/rpm invoked with --nogpgcheck, which disables package signature verification for that install.

  Rewritten v2.0.0: dropped everything else in the previous version as either unfixable-by-renaming or fictional:
  - Direct writes to a .repo file or a gpgkey path -- /etc/yum.repos.d/* is not under an audit watch in this
    agent's rule set (would need a `-w` rule added to agent/dependency/auditd_linux.go's auditRulesContent), and
    the previous check also used raw syscall NUMBERS (`oneOf("log.syscall", ["2","257"])`) against a field that
    this filter renames to `action` and resolves to a syscall NAME, not a number -- it could never have matched
    even with a working file watch.
  - "Repository ... added" / "GPG key ... imported" journal text -- yum/dnf do not write these to journald by
    default (they print to their own stdout/log file); presented as real detection here, this was unverified
    invented text, so it's dropped rather than kept as a weak fallback.
  - Package-install provenance (log.eventType/log.package_source/log.gpg_verification/log.repository) -- this
    collector captures no per-package install metadata at all; there is no signal here to check regardless of
    field name.
  RHEL-family only; cannot be live-fire verified on the Debian-family V11-DEV-18 test VM (no yum/dnf present).

  **Next Steps:**
  1. **Immediate Response**: Isolate the affected system to prevent further compromise
  2. **Investigate Repository Changes**: Review all recent repository configuration changes and verify legitimacy
  3. **Package Verification**: Check all recently installed packages for authenticity and integrity
  4. **GPG Key Analysis**: Verify all GPG keys and remove any unauthorized or suspicious keys
  5. **System Integrity**: Perform full system integrity checks using tools like AIDE or Tripwire
  6. **Network Analysis**: Monitor network traffic for suspicious download sources
  7. **User Activity**: Review user activities and access logs for the timeframe of the incident
  8. **Rollback Planning**: Prepare to rollback unauthorized changes and remove malicious packages
  9. **Policy Review**: Strengthen package management policies and access controls
  10. **Documentation**: Document all findings and remediation steps for incident response records
where: |
  equals("action", "execve") &&
  oneOf("origin.process", ["/usr/bin/yum", "/usr/bin/dnf", "/usr/bin/rpm"]) &&
  contains("origin.command", "install") &&
  contains("origin.command", "--nogpgcheck")
groupBy:
  - adversary.host
  - adversary.user
