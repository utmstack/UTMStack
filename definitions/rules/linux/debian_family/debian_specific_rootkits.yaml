# Rule version v1.0.0

dataTypes:
  - linux
name: Debian-Specific Rootkits
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Defense Evasion
technique: "T1014 - Rootkit"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1014/
  - https://www.debian.org/security/
  - https://wiki.debian.org/Teams/Security
description: |
  Detects indicators of known Debian/Linux rootkits including file modifications, hidden processes, network backdoors, and kernel module manipulation commonly seen in Debian environments. This rule identifies various rootkit behaviors such as unauthorized modifications to system binaries, kernel module loading, hidden processes, and suspicious network activity.

  Next Steps:
  1. Immediately isolate the affected system from the network
  2. Examine the detected file paths and processes for signs of tampering
  3. Check for additional indicators of compromise using antimalware tools
  4. Review system logs for the timeline of infection
  5. Verify integrity of critical system files using package manager verification (dpkg -V)
  6. Consider reimaging the system if rootkit persistence is confirmed
  7. Analyze network connections for command and control communications
  8. Update security tools and perform full system scan
# Original version referenced entirely fictional fields (log.file_path,
# log.event_type, log.process_name, log.command_line, log.network_port,
# log.user) that our collector never produces under any name -- same class of
# hallucinated-schema bug found across several other legacy rules this
# session. Rewritten to the subset actually detectable with the agent's real
# audit watches (agent/dependency/auditd_linux.go) and execve telemetry:
#  - known rootkit process names -> real execve detection.
#  - insmod with suspicious args -> real execve detection.
#  - /etc/ld.so.preload tampering -> IS watched (-w /etc/ld.so.preload -p wa
#    -k utmstack_persistence) but the resulting PATH record's file name isn't
#    currently promoted to any origin.* field by linux.yaml, so it can't be
#    matched here yet; see ld_preload_hijacking.yaml, which already covers
#    LD_PRELOAD via the execve-time environment variable instead (a different,
#    already-working detection angle for the same technique).
# Dropped entirely (would need telemetry we don't collect at all, not just a
# field-name fix): /usr/bin/passwd binary tampering (only /etc/passwd DATA is
# watched, not the passwd BINARY), /proc/*/maps deletion messages, listening
# on ports 31337/12345/6666 (no network-listen telemetry -- see
# RULE_COVERAGE_METHODOLOGY.md's documented network-telemetry gap), anomalous
# /dev/ptmx creation, and free-text "LKM ... hiding" kernel messages (no
# evidence our kernels actually log that phrase; would need a real sample to
# justify a regex).
where: |
  (equals("action", "execve") && oneOf("origin.process", ["/usr/bin/reptile", "/usr/bin/bdvl", "/usr/bin/azazel", "/usr/bin/jynx", "/usr/bin/xorddos"])) ||
  (equals("action", "execve") && contains("origin.command", "reptile")) ||
  (equals("action", "execve") && contains("origin.command", "bdvl")) ||
  (equals("action", "execve") && oneOf("origin.process", ["/usr/sbin/insmod", "/sbin/insmod"]) &&
   (regexMatch("origin.command", "(?i)rootkit") || regexMatch("origin.command", "(?i)\\bhide\\b") || regexMatch("origin.command", "(?i)backdoor")))
groupBy:
  - adversary.host
  - adversary.user
