# Rule version v1.0.0

dataTypes:
  - linux
name: Shell RC File Modification for Persistence
impact:
  confidentiality: 2
  integrity: 3
  availability: 1
category: Persistence
technique: "T1546.004 - Event Triggered Execution: Unix Shell Configuration Modification"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1546/004/
description: |
  Detects modifications to shell configuration files (.bashrc, .bash_profile, /etc/profile.d/) that attackers use for persistence by inserting malicious commands executed on every shell session.

  Next Steps:
  1. Review the modified shell configuration file for injected commands
  2. Compare the file against a known-good baseline
  3. Identify the user account that made the modification
  4. Check for reverse shells, downloaders, or credential harvesters in the added content
  5. Review all shell RC files for the affected user and system-wide profiles
  6. Remove malicious entries and investigate the compromise vector
# The second AND clause ("modified"/"opened for writing"/"write"/"changed")
# reads like structured file-event keywords, not real execve argv text -- a
# real `echo payload >> ~/.bashrc` or `vim .bashrc` origin.command never
# contains those words. This makes the whole rule (an AND, not an OR) close
# to permanently dead for real shell-invoked edits. Not redesigned here
# (out of scope for this pass, flagging for a follow-up): a real fix would
# drop this second clause and instead pair the path check with either a
# oneOf on common editors/appenders (vim/nano/echo/tee/cat/sed) or, better,
# a PATH-record-based write watch if/when that becomes available through the
# filter (see RULE_COVERAGE_METHODOLOGY.md open gaps).
where: |
  equals("action", "execve") &&
  (contains("origin.command", ".bashrc") || contains("origin.command", ".bash_profile") ||
   contains("origin.command", ".profile") || contains("origin.command", "/etc/profile.d/") ||
   contains("origin.command", ".zshrc") || contains("origin.command", ".zprofile") ||
   contains("origin.command", "/etc/bash.bashrc") || contains("origin.command", "/etc/profile")) &&
  (contains("origin.command", "modified") || contains("origin.command", "opened for writing") ||
   contains("origin.command", "write") || contains("origin.command", "changed"))
groupBy:
  - adversary.host
  - adversary.user
