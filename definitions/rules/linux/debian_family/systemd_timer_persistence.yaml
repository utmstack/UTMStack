# Rule version v1.0.0

dataTypes:
  - linux
name: Systemd Timer Persistence Mechanism
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Persistence
technique: "T1053.003 - Scheduled Task/Job: Cron"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1053/003/
  - https://www.freedesktop.org/software/systemd/man/systemd.timer.html
description: |
  Detects creation or modification of systemd timer units which can be used as a persistence mechanism. Systemd timers are an alternative to cron and can execute commands on a schedule.

  Next Steps:
  1. Review the timer unit file and associated service unit
  2. Check the OnCalendar or OnBoot directives for scheduling
  3. Examine the ExecStart command in the associated service
  4. Verify the timer was created by an authorized administrator
  5. Compare against baseline of known legitimate timers
  6. If unauthorized, disable the timer and investigate
# Rewritten after live-testing on V11-DEV-18 disproved the log.message premise
# entirely: a real `systemctl enable foo.timer` never journals its "Created
# symlink ...timer" confirmation -- that text is CLI stdout only, confirmed
# via direct `journalctl` inspection during the test. What systemd[1] DOES
# journal for this (the generic "Reloading requested/Reloading/Reloading
# finished" trio) never mentions ".timer" or the unit name, so the AND with
# contains(log.message,".timer") could never be satisfied by any real timer
# operation -- this rule was permanently dead. Rewritten to detect the same
# intent directly from the execve that does it: `systemctl enable/start
# foo.timer`. This is strictly more reliable than trying to infer it from
# journald text that was never actually being logged.
where: |
  equals("action", "execve") &&
  oneOf("origin.process", ["/usr/bin/systemctl", "/bin/systemctl"]) &&
  (contains("origin.command", "enable") || contains("origin.command", "start")) &&
  contains("origin.command", ".timer")
groupBy:
  - adversary.host
  - adversary.user
