# Rule version v1.0.0

dataTypes:
  - linux
name: SSH Authorized Keys Modification
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Persistence
technique: "T1098.004 - Account Manipulation: SSH Authorized Keys"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1098/004/
  - https://man.openbsd.org/sshd.8
description: |
  Detects modifications to SSH authorized_keys files, which attackers use to establish persistent access by adding their own public keys to user accounts.

  Next Steps:
  1. Review the authorized_keys file contents for unauthorized public keys
  2. Identify the user account and process that made the modification
  3. Compare current authorized_keys with a known-good baseline
  4. Check SSH logs for any connections using the newly added key
  5. Verify the change was authorized by the account owner
  6. Remove unauthorized keys and rotate affected credentials
  7. Monitor for subsequent SSH connections from unknown sources
# "modified"/"opened for writing"/"changed"/"write" in the second OR read
# like structured file-event keywords rather than real execve argv text; only
# the `contains("log.process", "sshd")` branch is grounded in something real
# (though unusual -- sshd itself doesn't normally exec anything when reading
# a key). Left as-is (out of scope for this pass, not redesigned) -- a real
# fix should pair the path check with a oneOf on actual editors/appenders
# (vim/nano/echo/tee/cat/ssh-copy-id) instead of these keyword guesses.
where: |
  equals("action", "execve") &&
  (contains("origin.command", "authorized_keys") || contains("origin.command", "authorized_keys2")) &&
  (contains("origin.command", "modified") || contains("origin.command", "opened for writing") ||
   contains("origin.command", "changed") || contains("log.process", "sshd") ||
   contains("origin.command", ".ssh") && contains("origin.command", "write"))
groupBy:
  - adversary.host
  - adversary.user
