# Rule version v1.0.0

dataTypes:
  - linux
name: Unauthorized /etc/shadow or /etc/passwd Access
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Credential Access
technique: "T1003.008 - OS Credential Dumping: /etc/passwd and /etc/shadow"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1003/008/
description: |
  Detects unauthorized reading of /etc/shadow or suspicious modifications to /etc/passwd, which may indicate credential harvesting or account manipulation by an attacker.

  Next Steps:
  1. Identify the process and user account that accessed the sensitive file
  2. Determine if the access was from a legitimate system process (e.g., login, passwd, useradd)
  3. Check for tools like unshadow, john, or hashcat on the system
  4. Review if password hashes may have been exfiltrated
  5. Force password resets for all accounts if credential theft is confirmed
  6. Investigate the compromise vector and check for lateral movement
# "read"/"open"/"copy"/"modified"/"changed"/"write" read like structured
# access-log-message keywords, not real execve argv text -- a real
# `cat /etc/shadow` execve's origin.command is just that literal string, it
# never contains the word "read". Only "cat " (with trailing space) among
# these actually matches real command text; the rest make their OR branch
# wider than intended but harmless since it's an OR, not a silent AND-kill
# like user_added_to_admin_group.yaml had. Left as-is rather than redesigned
# (out of scope for this pass) -- flagging for a future pass that should
# replace this whole OR with real command patterns (cat/less/more/head/tail/
# cp/scp targeting /etc/shadow) instead of these keyword guesses.
where: |
  equals("action", "execve") &&
  (contains("origin.command", "/etc/shadow") || contains("origin.command", "/etc/passwd")) &&
  (contains("origin.command", "read") || contains("origin.command", "open") ||
   contains("origin.command", "cat ") || contains("origin.command", "copy") ||
   contains("origin.command", "modified") || contains("origin.command", "changed") ||
   contains("origin.command", "write")) &&
  !(contains("log.process", "passwd") || contains("log.process", "useradd") ||
    contains("log.process", "usermod") || contains("log.process", "groupadd") ||
    contains("log.process", "chpasswd") || contains("log.process", "login"))
groupBy:
  - adversary.host
  - adversary.user
