# Rule version v1.0.0

dataTypes:
  - linux
name: LD_PRELOAD Hijacking Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1574.006 - Hijack Execution Flow: Dynamic Linker Hijacking"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1574/006/
  - https://man7.org/linux/man-pages/man8/ld.so.8.html
description: |
  Detects modifications to LD_PRELOAD environment variable or /etc/ld.so.preload file, which attackers use to load malicious shared libraries into every process for persistence and credential interception.

  Next Steps:
  1. Check /etc/ld.so.preload contents for unauthorized shared library paths
  2. Examine any LD_PRELOAD environment variable settings in shell profiles
  3. Analyze the referenced shared library for malicious functionality
  4. Review the user and process that made the modification
  5. Check for credential harvesting or rootkit functionality in the loaded library
  6. Remove the malicious preload entry and the shared library
  7. Audit all running processes for injected libraries
# "modified"/"write"/"opened"/"changed" read like structured file-event
# keywords rather than real execve argv text; "export" is the one real,
# useful branch here (a real `export LD_PRELOAD=/tmp/evil.so` execve,
# typically visible only when it's part of a single compound `sh -c "..."`
# invocation -- see linux.yaml's Phase-2 comment on why a piped/chained shell
# doesn't otherwise expose a sibling process's env var text). Left as-is
# (out of scope for this pass, not redesigned).
where: |
  equals("action", "execve") &&
  (contains("origin.command", "ld.so.preload") ||
   contains("origin.command", "LD_PRELOAD") ||
   contains("origin.command", "ld.so.conf")) &&
  (contains("origin.command", "modified") || contains("origin.command", "write") ||
   contains("origin.command", "opened") || contains("origin.command", "export") ||
   contains("origin.command", "changed"))
groupBy:
  - adversary.host
  - adversary.user
