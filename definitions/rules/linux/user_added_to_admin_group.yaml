# Rule version v1.0.0

dataTypes:
  - linux
name: "System Linux: A user has been added to the administrators group"
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: "Privilege Escalation"
technique: "T1484 - Domain Policy Modification"
adversary: origin
description: "Detects when a user has been added to the administrators group (sudo) on a Linux system."
references:
  - "https://attack.mitre.org/tactics/TA0004"
  - "https://attack.mitre.org/techniques/T1484/"
# The original regexMatch branch (dropped here) required text like "Added
# user X to group" inside origin.command, ANDed with the real
# usermod -aG sudo check below -- that phrase reads like adduser's own
# human-readable log OUTPUT (log.message material for a journald line), not
# a real execve argv (a real `usermod -aG sudo bob` execve's origin.command
# is just that literal argv, no "Added user...to...group" phrase). Since it
# was ANDed rather than ORed with the real check, it made the whole rule
# permanently dead, not just weaker -- removed rather than gated.
where: equals("action", "execve") && contains("origin.command", "usermod -aG sudo")
groupBy:
  - adversary.ip
  - adversary.user
