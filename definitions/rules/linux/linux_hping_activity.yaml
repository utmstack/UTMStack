# Rule version v1.0.1

dataTypes:
  - "linux"
name: "System Linux: Hping Process Activity"
impact:
  confidentiality: 1
  integrity: 1
  availability: 2
category: "Discovery"
technique: "T1082 - System Information Discovery"
adversary: origin
description: "Hping ran on a Linux host. Hping is a FOSS command-line packet analyzer and has the ability to construct network packets
              for a wide variety of network security testing applications, including scanning and firewall auditing."
references:
  - "https://attack.mitre.org/tactics/TA0007/"
  - "https://attack.mitre.org/techniques/T1082/"
# Was deduplicateBy -- see linux_nping_activity.yaml's comment for why this
# was switched to groupBy (confirmed on real data: deduplicateBy silently
# dropped repeat matches instead of accumulating them).
where: equals("action", "execve") && contains("origin.command", "hping")
groupBy:
  - adversary.ip
  - adversary.user
