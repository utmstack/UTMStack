# Rule version v1.0.2

dataTypes:
  - "linux"
name: "System Linux: Persistence via KDE AutoStart Script or Desktop File Modification"
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: "Persistence"
technique: "T1547 - Boot or Logon Autostart Execution"
adversary: origin
description: "Identifies the creation or modification of a K Desktop Environment (KDE) AutoStart script or desktop file that will
              execute upon each user logon. Adversaries may abuse this method for persistence."
references:
  - "https://attack.mitre.org/tactics/TA0003/"
  - "https://attack.mitre.org/techniques/T1547/"
where: |
  regexMatch("origin.command", "(.config/autostart/|.local/share/autostart/|/etc/xdg/autostart/|.config/autostart-scripts/)") && !regexMatch("origin.command", "(dpkg|apt|dnf|yum)")
deduplicateBy:
  - dataSource
