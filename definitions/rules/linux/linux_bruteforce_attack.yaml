# Rule version v1.0.1

dataTypes:
  - "linux"
name: "System Linux: Possible Brute Force Attack"
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: "Credential Access"
technique: "T1110 - Brute Force"
adversary: origin
description: "Identifies multiple SSH login failures followed by a successful one from the same source address. Adversaries can attempt
              to login into multiple users with a common or known password to gain access to accounts."
references:
  - "https://attack.mitre.org/tactics/TA0006/"
  - "https://attack.mitre.org/techniques/T1110/"
# Uses the native auditd collector's USER_AUTH (PAM) records, not journald's
# free-text sshd messages: journald's "session opened for user X" line only
# carries X inside unstructured log.message text (no discrete field), and
# origin.user for that path resolves to journald's _UID, which is the PID
# that wrote the log line (sshd itself, running as root) -- not the account
# being authenticated. USER_AUTH's userauth.acct/userauth.addr (mapped to
# origin.user/origin.ip in definitions/filters/linux/linux.yaml) carry the
# actual attempted account and real source IP. Confirmed against a real
# failed-login test on V11-DEV-18.
where: equals("action", "USER_AUTH") && equals("actionResult", "success") && exists("origin.user") && exists("origin.ip")
afterEvents:
  - with:
      - field: origin.user
        operator: filter_term
        value: '{{.origin.user}}'
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: actionResult
        operator: filter_term
        value: 'failed'
    within: 15m
    count: 10
groupBy:
  - adversary.ip
  - adversary.user
