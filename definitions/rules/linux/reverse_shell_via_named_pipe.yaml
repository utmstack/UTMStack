# Rule version v1.0.0

dataTypes:
  - linux
name: "System Linux: Reverse Shell Created via Named Pipe"
impact:
  confidentiality: 3
  integrity: 2
  availability: 3
category: "Execution"
technique: "T1059.004 - Command and Scripting Interpreter"
adversary: origin
description: "Identifies a reverse shell via the abuse of named pipes on Linux with the help of OpenSSL or Netcat. First in, first out
                (FIFO) files are special files for reading and writing to by Linux processes. For this to work, a named pipe is created
                and passed to a Linux shell where the use of a network connection tool such as Netcat or OpenSSL has been established.
                The stdout and stderr are captured in the named pipe from the network connection and passed back to the shell for
                execution."
references:
  - "https://attack.mitre.org/tactics/TA0002/"
  - "https://attack.mitre.org/techniques/T1059/004/"
# exists("origin.host") dropped: origin.host is only populated for
# journald-sourced Linux events (via log.HOSTNAME), never for the native
# auditd execve records this rule actually needs -- confirmed via live data
# on V11-DEV-18 -- so the original condition made this rule permanently dead.
where: equals("action", "execve") && regexMatch("origin.command", "((sh|bash|openssl) (-i|-connect))")
groupBy:
  - adversary.ip
  - adversary.user
