# Rule version v1.0.0

dataTypes:
  - "linux"
name: "System Linux: Third-Party Remote Access Software Executed"
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: "Command and Control"
technique: "T1219 - Remote Access Software"
adversary: origin
description: "Detects execution of commercial/consumer remote-access tools (AnyDesk, TeamViewer, Chrome Remote Desktop's helper) on a
              server. These are rarely part of a standard server deployment and are a common way for an adversary (or a social
              engineering victim) to maintain interactive access alongside or instead of SSH."
references:
  - "https://attack.mitre.org/techniques/T1219/"
where: equals("action", "execve") && oneOf("origin.process", ["/usr/bin/anydesk", "/opt/anydesk/anydesk", "/usr/bin/teamviewer", "/opt/teamviewer/tv_bin/teamviewerd"])
groupBy:
  - adversary.host
  - adversary.user
