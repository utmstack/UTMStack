# Deceptive Bytes filter, version 3.0.4
# Based on previous version of the same filter

pipeline:
  - dataTypes:
      - deceptive-bytes
    steps:
      # Using grok to parse header of the message
      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: event.notDefined
              pattern: '{{.integer}}'
            - fieldName: event.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: event.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: event.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: event.0trash
              pattern: '{{.word}}\:'
            - fieldName: event.userWithTrash
              pattern: '{{.data}}CEF'
            - fieldName: event.1trash
              pattern: '\:{{.integer}}'
            - fieldName: event.messageWithTrash
              pattern: '{{.data}}{{.word}}\={{.data}}{{.space}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: event.0trash
              pattern: '{{.word}}\:'
            - fieldName: event.userWithTrash
              pattern: '{{.data}}CEF'
            - fieldName: event.1trash
              pattern: '\:{{.integer}}'
            - fieldName: event.messageWithTrash
              pattern: '{{.data}}{{.word}}\={{.data}}{{.space}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.user
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.userWithTrash

      - grok:
          patterns:
            - fieldName: event.message
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.restMessageToKv
              pattern: '{{.greedy}}'
          source: event.messageWithTrash

      # Parsing the common fields
      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.eventTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.restMessage
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.eventTime
              pattern: '\[{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.hour}}\:{{.minute}}\:{{.seconds}}'
            - fieldName: event.restMessage
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.eventTime
              pattern: '{{.monthDay}}-{{.monthNumber}}{{.space}}{{.hour}}\:{{.minute}}\:{{.seconds}}'
            - fieldName: event.restMessage
              pattern: '{{.greedy}}'
          source: raw

      # Parse the restMessage field from the rest of the common fields
      - grok:
          patterns:
            - fieldName: event.processId
              pattern: '\,{{.integer}}'
            - fieldName: event.trheadId
              pattern: '\,\-'
            - fieldName: event.eventType
              pattern: '\,{{.integer}}'
            - fieldName: event.eventSource
              pattern: '\,{{.word}}'
            - fieldName: event.processName
              pattern: '\,{{.integer}}'
            - fieldName: event.processPath
              pattern: '\,{{.word}}'
            - fieldName: event.platform
              pattern: '\,{{.data}}\,'
            - fieldName: origin.path
              pattern: '{{.greedy}}\,'
            - fieldName: origin.command
              pattern: '{{.greedy}}'
          source: event.restMessage

      - grok:
          patterns:
            - fieldName: event.processId
              pattern: '\,{{.integer}}'
            - fieldName: event.trheadId
              pattern: '\,{{.data}}\,'
            - fieldName: event.eventType
              pattern: '{{.integer}}'
            - fieldName: event.eventSource
              pattern: '\,\-'
            - fieldName: event.processName
              pattern: '\,{{.word}}\.{{.word}}'
          source: event.restMessage

      - grok:
          patterns:
            - fieldName: event.processId
              pattern: '\,{{.integer}}'
            - fieldName: event.trheadId
              pattern: '\,{{.data}}\,'
            - fieldName: event.eventType
              pattern: '{{.integer}}'
            - fieldName: event.eventSource
              pattern: '\,\-\,'
          source: event.restMessage

      - grok:
          patterns:
            - fieldName: event.severityLabelCharacter
              pattern: '{{.word}}\s'
            - fieldName: event.trheadId
              pattern: '{{.integer}}\,'
            - fieldName: event.eventSource
              pattern: '{{.integer}}\s'
            - fieldName: event.component
              pattern: '{{.word}}\,'
            - fieldName: event.errorCode
              pattern: '{{.integer}}\]'
            - fieldName: event.restDataMessage
              pattern: '{{.greedy}}'
          source: event.restMessage

      - grok:
          patterns:
            - fieldName: event.severityLabelCharacter
              pattern: '{{.word}}\s'
            - fieldName: event.trheadId
              pattern: '{{.integer}}\,'
            - fieldName: event.eventSource
              pattern: '{{.integer}}\s'
            - fieldName: event.component
              pattern: '{{.word}}\,'
            - fieldName: event.trheadId
              pattern: '{{.integer}}\,'
            - fieldName: event.eventSource
              pattern: '{{.integer}}\s'
            - fieldName: event.component
              pattern: '{{.word}}\,'
            - fieldName: event.errorCode
              pattern: '{{.integer}}\]\s'
            - fieldName: origin.path
              pattern: '(?:[A-Z]:\\(?:[^\\\n]+\\)*[^\\\n]*|\/(?:[^\/\n]+\/)*[^\/\n]*)'
          source: event.restMessage
          where: contains("event.severityLabelCharacter", "V")

      - grok:
          patterns:
            - fieldName: event.severityLabelCharacter
              pattern: '{{.word}}\s'
            - fieldName: event.processId
              pattern: '{{.integer}}\,'
            - fieldName: event.trheadId
              pattern: '{{.integer}}\s'
            - fieldName: event.methodName
              pattern: '\:\:{{.data}}\,'
            - fieldName: event.returnCode
              pattern: '{{.integer}}\]\s'
            - fieldName: event.detailedMessage
              pattern: '\({{.data}}\)'
          source: event.restMessage

      - grok:
          patterns:
            - fieldName: event.severityLabelCharacter
              pattern: '{{.word}}\s'
            - fieldName: event.processId
              pattern: '{{.integer}}\,'
            - fieldName: event.trheadId
              pattern: '{{.integer}}\s'
            - fieldName: event.methodName
              pattern: '{{.data}}\:\:{{.data}}\,'
            - fieldName: event.returnCode
              pattern: '{{.integer}}\]\s'
            - fieldName: event.message
              pattern: '{{.greedy}}'
          source: event.restMessage

      - grok:
          patterns:
            - fieldName: event.severityLabelCharacter
              pattern: '\[{{.data}}\]'
            - fieldName: event.processId
              pattern: '\[{{.integer}}\/'
            - fieldName: event.trheadId
              pattern: '{{.data}}\]:?\s'
            - fieldName: event.message
              pattern: '{{.greedy}}'
          source: event.restMessage

      # Using kv for the rest of the trash in the message
      - kv:
          fieldSplit: " "
          valueSplit: "="
          source: event.restMessageToKv
          where: exists("event.restMessageToKv")

      # Using grok to analyze the rest of the data
      - grok:
          patterns:
            - fieldName: event.productVendor
              pattern: '\|{{.data}}\|'
            - fieldName: event.product
              pattern: '{{.data}}\|'
            - fieldName: event.productVersion
              pattern: '{{.data}}\|'
            - fieldName: event.signatureID
              pattern: '{{.data}}\|'
            - fieldName: event.eventType
              pattern: '{{.data}}\|'
            - fieldName: event.severity
              pattern: '{{.data}}\|'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.restData

      - grok:
          patterns:
            - fieldName: event.pidStatusToKv
              pattern: '\[{{.data}}\]'
            - fieldName: event.message
              pattern: '{{.greedy}}'
          source: event.restDataMessage

      - grok:
          patterns:
            - fieldName: event.0trash
              pattern: '{{.data}}PID='
            - fieldName: event.pid
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: raw
          where: contains("event.severityLabelCharacter", "W")

      # Removing unnecessary characters
      - trim:
          function: prefix
          substring: '|'
          fields:
            - event.productVendor

      - trim:
          function: suffix
          substring: '|'
          fields:
            - event.productVendor
            - event.product
            - event.productVersion
            - event.signatureID
            - event.eventType
            - event.severity

      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.trheadId

      - trim:
          function: suffix
          substring: '/'
          fields:
            - event.processId

      - trim:
          function: prefix
          substring: '<'
          fields:
            - event.syslogPriority

      - trim:
          function: suffix
          substring: '>'
          fields:
            - event.syslogPriority

      - trim:
          function: prefix
          substring: ','
          fields:
            - event.trheadId
            - event.processId
            - event.eventType
            - event.eventSource
            - event.processName
            - event.processPath
            - event.platform
            - origin.path

      - trim:
          function: suffix
          substring: ','
          fields:
            - event.trheadId
            - event.component
            - event.platform
            - origin.path
            - event.eventSource
            - event.processId
            - event.methodName

      - trim:
          function: prefix
          substring: '"'
          fields:
            - origin.command

      - trim:
          function: suffix
          substring: '"'
          fields:
            - origin.command

      - trim:
          function: prefix
          substring: '['
          fields:
            - event.eventTime
            - event.processId
            - event.severityLabelCharacter

      - trim:
          function: suffix
          substring: ']'
          fields:
            - event.status
            - event.errorCode
            - event.returnCode
            - event.severityLabelCharacter
            - event.trheadId

      # Using the kv filter with default config, usefull in key-value logs
      - kv:
          fieldSplit: " "
          valueSplit: "="
          source: event.restData
          where: exists("event.restData")

      # Using the kv filter with other config, usefull in key-value logs
      - kv:
          fieldSplit: ", "
          valueSplit: "="
          source: event.pidStatusToKv
          where: exists("event.pidStatusToKv")

      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("event.action") && oneOf("event.action", ["blocked", "prevented"])'

      # Adding severity based on log.severityLabelCharacter
      - add:
          function: 'string'
          params:
            key: severity
            value: 'high'
          where: oneOf("event.severityLabelCharacter", ["C", "A", "E"])

      - add:
          function: 'string'
          params:
            key: severity
            value: 'medium'
          where: equals("event.severityLabelCharacter", "W")

      - add:
          function: 'string'
          params:
            key: severity
            value: 'low'
          where: oneOf("event.severityLabelCharacter", ["D", "V", "N", "I", "T"])

      # Removing unused fields
      - delete:
          fields:
            - event.0trash
            - event.1trash
            - event.restData
            - event.restMessage
            - event.restDataMessage
            - event.irrelevant
            - event.messageWithTrash
            - event.restMessageToKv
            - event.pidStatusToKv
            - event.userWithTrash
            - event.severityLabelCharacter
