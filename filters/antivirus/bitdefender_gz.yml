      - fieldName: ''
        pattern: '^(?:(?:<[0-9]{1,3}>)?(?:[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+(?:\S+(?:\[[0-9]+\])?:\s*)?|(?:[0-9]+\s+)?[0-9]{4}-[0-9]{2}-[0-9]{2}T\S+\s+(?:\S+\s+){0,5})|<[0-9]{1,3}>)?CEF:'
      - fieldName: event.cefVersion
        pattern: '[0-9]+'
      - fieldName: ''
        pattern: \|Bitdefender\|GravityZone\|
      - fieldName: event.productVersion
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.signatureID
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.eventType
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.cefSeverity
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.cefExtension
        pattern: (?s:.*)$
  - kv:
      source: event.cefExtension
      fieldSplit: ' '
      valueSplit: '='
      where: exists("event.cefExtension")
  - delete:
