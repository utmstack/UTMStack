      - log.BitdefenderGZFwProtocolId
      - log.BitdefenderGZIgnoredMalwareCnt
      - log.BitdefenderGZIncidentId
      - log.BitdefenderGZIncidentNumber
      - log.BitdefenderGZIsFilelessAttack
      - log.BitdefenderGZMainAction
      - log.BitdefenderGZMalwareHash
      - log.BitdefenderGZMalwareName
      - log.BitdefenderGZMalwareStatus
