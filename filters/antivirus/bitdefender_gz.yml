      patterns:
      - fieldName: ''
        pattern: '^(?:(?:<[0-9]{1,3}>)?(?:[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+(?:\S+(?:\[[0-9]+\])?:\s*)?|(?:[0-9]+\s+)?[0-9]{4}-[0-9]{2}-[0-9]{2}T\S+\s+(?:\S+\s+){0,5})|<[0-9]{1,3}>)?CEF:'
      - fieldName: log.cefVersion
        pattern: '[0-9]+'
      - fieldName: ''
        pattern: \|Bitdefender\|GravityZone\|
      - fieldName: log.productVersion
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.signatureID
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.eventType
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.cefSeverity
        pattern: (?:\\.|[^\\|])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.cefExtension
        pattern: (?s:.*)$
  - kv:
      source: log.cefExtension
      fieldSplit: ' '
      valueSplit: '='
      where: exists("log.cefExtension")
  - delete:
