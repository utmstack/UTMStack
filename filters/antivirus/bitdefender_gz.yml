# Bitdefender GravityZone filter, version 3.1.0
# Based on https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
# and the previous version of the same filter

pipeline:
  - dataTypes:
      - antivirus-bitdefender-gz
    steps:
      # Using grok to parse header of the message
      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: log.notDefined
              pattern: '{{.integer}}'
            - fieldName: log.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.hostId
              pattern: '{{.word}}'
            - fieldName: log.0trash
              pattern: '{{.word}}'
            - fieldName: log.processPid
              pattern: '\[{{.integer}}\]'
            - fieldName: log.1trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.hostId
              pattern: '{{.word}}'
            - fieldName: log.0trash
              pattern: '{{.word}}'
            - fieldName: log.processPid
              pattern: '\[{{.integer}}\]'
            - fieldName: log.1trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.syslogHostIP
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.word}}'
            - fieldName: log.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.0trash
              pattern: '{{.word}}\:{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.cefVersion
              pattern: 'CEF\:{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      # Using grok to parse components of the cef_message
      - grok:
          patterns:
            - fieldName: log.productVendor
              pattern: '\|{{.data}}\|'
            - fieldName: log.product
              pattern: '{{.data}}\|'
            - fieldName: log.productVersion
              pattern: '{{.data}}\|'
            - fieldName: log.signatureID
              pattern: '{{.data}}\|'
            - fieldName: log.eventType
              pattern: '{{.data}}\|'
            - fieldName: log.severity
              pattern: '{{.data}}\|'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: log.restData

      # ---- CEF-aware extraction of space-bearing extension values ----

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}dvc='
            - fieldName: log.dvcToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.dvcFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.dvcToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}dvc='
            - fieldName: log.dvcFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.dvcFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}request='
            - fieldName: log.requestToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.requestFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.requestToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}request='
            - fieldName: log.requestFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.requestFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}act='
            - fieldName: log.actToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.actFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.actToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}act='
            - fieldName: log.actFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.actFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}sproc='
            - fieldName: log.sprocToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.sprocFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.sprocToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}sproc='
            - fieldName: log.sprocFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.sprocFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}filePath='
            - fieldName: log.filePathToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.filePathFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.filePathToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}filePath='
            - fieldName: log.filePathFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.filePathFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}BitdefenderGZDetectionName='
            - fieldName: log.BitdefenderGZDetectionNameToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.BitdefenderGZDetectionNameFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.BitdefenderGZDetectionNameToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}BitdefenderGZDetectionName='
            - fieldName: log.BitdefenderGZDetectionNameFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.BitdefenderGZDetectionNameFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}BitdefenderGZAttackTypes='
            - fieldName: log.BitdefenderGZAttackTypesToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.BitdefenderGZAttackTypesFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.BitdefenderGZAttackTypesToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}BitdefenderGZAttackTypes='
            - fieldName: log.BitdefenderGZAttackTypesFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.BitdefenderGZAttackTypesFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}suser='
            - fieldName: log.suserToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.suserFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.suserToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}suser='
            - fieldName: log.suserFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.suserFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}fname='
            - fieldName: log.fnameToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.fnameFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.fnameToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}fname='
            - fieldName: log.fnameFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.fnameFull")'

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}BitdefenderGZMalwareName='
            - fieldName: log.BitdefenderGZMalwareNameToParse
              pattern: '{{.data}}{{.word}}\='
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.BitdefenderGZMalwareNameFull
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.BitdefenderGZMalwareNameToParse

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}BitdefenderGZMalwareName='
            - fieldName: log.BitdefenderGZMalwareNameFull
              pattern: '{{.greedy}}'
          source: log.restData
          where: '!exists("log.BitdefenderGZMalwareNameFull")'

      - kv:
          fieldSplit: " "
          valueSplit: "="
          source: log.restData

      # Renaming useful fields
      - rename:
          from:
            - log.spt
          to: origin.port

      - rename:
          from:
            - log.src
          to: target.ip

      - rename:
          from:
            - log.dvcFull
          to: target.ip
          where: '!exists("target.ip")'

      - rename:
          from:
            - log.dvchost
          to: target.host

      - rename:
          from:
            - log.sprocFull
          to: target.process

      - rename:
          from:
            - log.filePathFull
          to: target.path

      - rename:
          from:
            - log.actFull
            - log.BitdefenderGZMainAction
          to: action

      - rename:
          from:
            - log.BitdefenderGZDetectionNameFull
          to: log.BitdefenderGZDetectionName

      - rename:
          from:
            - log.BitdefenderGZAttackTypesFull
          to: log.BitdefenderGZAttackTypes

      # Removing unnecessary characters
      - trim:
          function: prefix
          substring: '|'
          fields:
            - log.productVendor

      - trim:
          function: suffix
          substring: '|'
          fields:
            - log.productVendor
            - log.product
            - log.productVersion
            - log.signatureID
            - log.eventType
            - log.severity

      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.syslogPriority

      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.syslogPriority

      - trim:
          function: prefix
          substring: '['
          fields:
            - log.processPid

      - trim:
          function: suffix
          substring: ']'
          fields:
            - log.processPid

      - rename:
          from:
            - log.start
            - log.end
            - log.BitdefenderGZDetectionTime
          to: deviceTime

      - rename:
          from:
            - log.severity
          to: severity

      - rename:
          from:
            - log.BitdefenderGZComputerFQDN
          to: target.domain

      - rename:
          from:
            - log.suserFull
          to: target.user

      - rename:
          from:
            - log.BitdefenderGZMalwareNameFull
          to: target.malware

      - rename:
          from:
            - log.BitdefenderGZMalwareType
          to: target.malwareType

      - rename:
          from:
            - log.BitdefenderGZMalwareHash
            - log.BitdefenderGZFileHashSha256
          to: target.sha256

      - rename:
          from:
            - log.fileHash
          to: target.md5

      - rename:
          from:
            - log.fnameFull
          to: target.filename

      - rename:
          from:
            - log.requestFull
          to: origin.url

      - rename:
          from:
            - log.BitdefenderGZDetectionLocalPort
          to: target.port

      - rename:
          from:
            - log.BitdefenderGZDetectionAttackerIp
          to: origin.ip

      - rename:
          from:
            - log.BitdefenderGZEventSourceIP
          to: origin.ip

      # Adding actionResult field to indicate whether the action was successful or failed
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'oneOf("action", ["blocked", "block", "aph_blocked", "portscan_blocked", "deleted", "disinfected", "quarantined", "restored"])'

      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: 'oneOf("action", ["still present", "ignored", "no action", "reportOnly"])'

      # Adding geolocation to origin ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # Reformat and field conversions
      - cast:
          fields:
            - origin.port
            - target.port
          to: int

      # Removing unused fields.
      - delete:
          fields:
            - log.0trash
            - log.1trash
            - log.2trash
            - log.3trash
            - log.restData
            - log.irrelevant
            - log.cefVersion
            - log.dvcFull
            - log.dvcToParse
            - log.requestToParse
            - log.actToParse
            - log.sprocToParse
            - log.filePathToParse
            - log.fnameToParse
            - log.BitdefenderGZDetectionNameToParse
            - log.BitdefenderGZMalwareNameToParse
            - log.BitdefenderGZAttackTypesToParse
            - log.suserToParse
            - log.act
            - log.sproc
            - log.filePath
            - log.dvc
            - log.request
            - log.suser
            - log.fname