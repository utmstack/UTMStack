      - event.BitdefenderGZFwProtocolId
      - event.BitdefenderGZIgnoredMalwareCnt
      - event.BitdefenderGZIncidentId
      - event.BitdefenderGZIncidentNumber
      - event.BitdefenderGZIsFilelessAttack
      - event.BitdefenderGZMainAction
      - event.BitdefenderGZMalwareHash
      - event.BitdefenderGZMalwareName
