# Bitdefender GravityZone CEF filter, version 3.3.0
# CEF-encoded originals remain under log; no unsupported decoder is assumed.
# Re-read the protected raw header after generic KV so extension text cannot overwrite it.
# The grok plugin matches each pattern in turn against what is left of the text,
# stops at the first pattern that matches nothing and writes nothing unless every
# pattern matched. Each CEF key therefore uses two patterns: everything up to
# "key=", then the whole value. The value is one or more words, each followed by
# spaces or the end of the text, so it stops before the next "key=" and keeps
# values with spaces; an empty value matches nothing and is left unset.
# Field names written here and read by rules use letters, digits and dots only,
# because the parser plugins remove every other character from the names they write.
pipeline:
- dataTypes:
  - antivirus-bitdefender-gz
  steps:
  - delete:
      fields:
      - log.cefExtension
      - log.endpointKey
      - log.endpointKeyType
      - log.correlationCandidate
      - log.eventType
      - log.cefSeverity
      - log.BitdefenderGZAction
