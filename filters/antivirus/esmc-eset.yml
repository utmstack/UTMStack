# ESET filter version 3.0.3
# Based in docs
# 
# Documentations
# 1- https://help.eset.com/esmc_admin/70/en-US/events-exported-to-json-format.html#custom_keys
# 
# Implementation
# 1. Parsing headers of syslog the message
# 2. Parsing RAW field log
pipeline:
  - dataTypes:
      - antivirus-esmc-eset
    steps:
      # Parsing RAW field log
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.msgType
              pattern: '{{.integer}}'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: log.headHostname
              pattern: '{{.hostname}}'
            - fieldName: log.serviceName
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '{{.integer}}'
            - fieldName: log.restHead
              pattern: '\-{{.data}}\-'
            - fieldName: log.jsonMessage
              pattern: '{{.greedy}}'

      # Remove inecesarie caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.priority
      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.priority

      # Parsing jsonMessage field log
      - json:
          source: log.jsonMessage
      
      - rename:
          from:
            - log.ipv4
          to: target.ip
      - rename:
          from:
            - log.hostname
          to: target.host
      - rename:
          from:
            - log.action
          to: action
      - rename:
          from:
            - log.sourceaddress
          to: origin.ip
      - rename:
          from:
            - log.protocol
          to: protocol
      - rename:
          from:
            - log.sourceport
          to: origin.port
      - rename:
          from:
            - log.targetaddress
          to: target.ip
      - rename:
          from:
            - log.targetport
          to: target.port

      # Adding action result


      
      # Adding severity field based on log.severity
      - add:
          function: string
          params:
            key: severity
            value: info
          where: oneOf("log.severity", ["INFO", "Info"])

      - add:
          function: string
          params:
            key: severity
            value: warning
          where: oneOf("log.severity", ["WARNING", "Warning"])

      - add:
          function: string
          params:
            key: severity
            value: error
          where: oneOf("log.severity", ["ERROR", "Error"])

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Removing unused fields
      - delete:
          fields:
            - log.jsonMessage
            - log.severity

      # Normalize explicit outcomes; an unknown outcome remains unset.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: regexMatch("log.result", "(?i)^(success|succeeded|successful|ok|done|accepted|accept|allowed|allow|permitted|permit|passed|pass|true)$")
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: regexMatch("log.result", "(?i)^(failure|failed|fail|error|invalid|timeout|false)$")
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: regexMatch("log.result", "(?i)^(denied|deny|blocked|block|dropped|drop|rejected|reject|forbidden|unauthorized|quarantined)$")
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: regexMatch("action", "(?i)^(deny|denied|block|blocked)$") || regexMatch("log.event", "(?i)^(deny|denied|block|blocked)$")

      # Keep addresses in IP fields and retain other source values under log.
      - rename:
          from:
          - origin.ip
          to: log.unparsedOriginIp
          where: exists("origin.ip") && (!(inCIDR("origin.ip","0.0.0.0/0") || inCIDR("origin.ip","::/0")) || oneOf("origin.ip",["0.0.0.0","::"]))
      - rename:
          from:
          - target.ip
          to: log.unparsedTargetIp
          where: exists("target.ip") && (!(inCIDR("target.ip","0.0.0.0/0") || inCIDR("target.ip","::/0")) || oneOf("target.ip",["0.0.0.0","::"]))
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: log.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)
