# ESET filter version 3.1.0
# JSON export contract: https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
# Original vendor keys are sanitized by JSON extraction (event_type -> log.event_type).
# Header host identifies the management server, never the managed endpoint.
# Only explicit decisions set actionResult; remediation and event classes do not.
pipeline:
  - dataTypes:
      - antivirus-esmc-eset
    steps:
      - grok:
          source: raw
          patterns:
            - pattern: ^\s*
            - fieldName: log.jsonMessage
              pattern: \{(?s:.*)\}
            - pattern: \s*$
      - grok:
          source: raw
          patterns:
            - pattern: ^(?:<[0-9]{1,3}>)?
            - fieldName: log.deviceTime
              pattern: '[A-Z][a-z]{2}\s+[0-9]{1,2}\s+[0-9]{1,2}:[0-9]{2}:[0-9]{2}'
            - pattern: \s+
            - fieldName: log.headHostname
              pattern: '[^\s]+'
            - pattern: \s+
            - fieldName: log.serviceName
              pattern: ERAServer
            - pattern: \[
            - fieldName: log.pid
              pattern: '[0-9]+'
            - pattern: \]:\s*
            - fieldName: log.jsonMessage
              pattern: \{(?s:.*)\}
            - pattern: \s*$
          where: '!exists("log.jsonMessage")'
      - grok:
          source: raw
          patterns:
            - pattern: ^<
            - fieldName: log.priority
              pattern: '[0-9]{1,3}'
            - pattern: '>'
            - fieldName: log.syslogVersion
              pattern: '[1-9][0-9]*'
            - pattern: \s+
            - fieldName: log.deviceTime
              pattern: \S+
            - pattern: \s+
            - fieldName: log.headHostname
              pattern: \S+
            - pattern: \s+
            - fieldName: log.serviceName
              pattern: ERAServer
            - pattern: \s+
            - fieldName: log.pid
              pattern: (?:[0-9]+|-)
            - pattern: \s+\S+\s+(?:-|\[[^\r\n]*\])\s+
            - fieldName: log.jsonMessage
              pattern: \{(?s:.*)\}
            - pattern: \s*$
          where: '!exists("log.jsonMessage")'
      - json:
          source: log.jsonMessage
          where: exists("log.jsonMessage")

      - rename:
          from: [log.process_name]
          to: log.processname
      - rename:
          from: [log.rule_name]
          to: log.rulename
      - delete:
          fields:
            - log.jsonMessage
            - log.eventType
            - log.endpointKey
            - log.endpointKeyType
            - log.correlationCandidate
            - log.esetOccurredTime
      - grok:
          source: log.event_type
          patterns:
            - fieldName: log.eventType
              pattern: (?s)^.+$
          where: regexMatch("log.event_type", "(?s)^.+$")
      - grok:
          source: log.source_uuid
          patterns:
            - fieldName: log.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("log.endpointKey")
            && (regexMatch("log.source_uuid", "^[^\\s].*$") && !oneOf("log.source_uuid", ["-","unknown"]))) && regexMatch("log.source_uuid",
            "(?s)^.+$")
      - add:
          function: string
          params:
            key: log.endpointKeyType
            value: uuid
          where: exists("log.endpointKey") && !exists("log.endpointKeyType")
      - grok:
          source: log.hostname
          patterns:
            - fieldName: log.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("log.endpointKey")
            && (regexMatch("log.hostname", "^[^\\s].*$") && !oneOf("log.hostname", ["-","unknown"]))) && regexMatch("log.hostname",
            "(?s)^.+$")
      - add:
          function: string
          params:
            key: log.endpointKeyType
            value: host
          where: exists("log.endpointKey") && !exists("log.endpointKeyType")
      - grok:
          source: log.ipv4
          patterns:
            - fieldName: log.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("log.endpointKey")
            && ((inCIDR("log.ipv4","0.0.0.0/0") || inCIDR("log.ipv4","::/0")) && !inCIDR("log.ipv4","0.0.0.0/32") &&
            !inCIDR("log.ipv4","::/128"))) && regexMatch("log.ipv4", "(?s)^.+$")
      - add:
          function: string
          params:
            key: log.endpointKeyType
            value: ip
          where: exists("log.endpointKey") && !exists("log.endpointKeyType")
      - grok:
          source: log.ipv6
          patterns:
            - fieldName: log.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("log.endpointKey")
            && ((inCIDR("log.ipv6","0.0.0.0/0") || inCIDR("log.ipv6","::/0")) && !inCIDR("log.ipv6","0.0.0.0/32") &&
            !inCIDR("log.ipv6","::/128"))) && regexMatch("log.ipv6", "(?s)^.+$")
      - add:
          function: string
          params:
            key: log.endpointKeyType
            value: ip
          where: exists("log.endpointKey") && !exists("log.endpointKeyType")
      - rename:
          from:
            - log.source_address
          to: origin.ip
          where: (equals("log.eventType","FirewallAggregated_Event") || equals("log.eventType","FilteredWebsites_Event"))
            && (inCIDR("log.source_address","0.0.0.0/0") || inCIDR("log.source_address","::/0")) && !inCIDR("log.source_address","0.0.0.0/32")
            && !inCIDR("log.source_address","::/128")
      - rename:
          from:
            - log.target_address
          to: target.ip
          where: (equals("log.eventType","FirewallAggregated_Event") || equals("log.eventType","FilteredWebsites_Event"))
            && (inCIDR("log.target_address","0.0.0.0/0") || inCIDR("log.target_address","::/0")) && !inCIDR("log.target_address","0.0.0.0/32")
            && !inCIDR("log.target_address","::/128")
      - rename:
          from:
            - log.ipv4
          to: origin.ip
          where: (equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && !exists("origin.ip") && (inCIDR("log.ipv4","0.0.0.0/0") || inCIDR("log.ipv4","::/0"))
            && !inCIDR("log.ipv4","0.0.0.0/32") && !inCIDR("log.ipv4","::/128")
      - rename:
          from:
            - log.ipv6
          to: origin.ip
          where: (equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && !exists("origin.ip") && (inCIDR("log.ipv6","0.0.0.0/0") || inCIDR("log.ipv6","::/0"))
            && !inCIDR("log.ipv6","0.0.0.0/32") && !inCIDR("log.ipv6","::/128")
      - grok:
          source: log.hostname
          patterns:
            - fieldName: origin.host
              pattern: (?s)^.+$
          where: (equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && regexMatch("log.hostname", "(?s)^.+$")
      - grok:
          source: log.os_name
          patterns:
            - fieldName: origin.operatingSystem
              pattern: (?s)^.+$
          where: (equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && regexMatch("log.os_name", "(?s)^.+$")
      - rename:
          from:
            - log.ipv4
          to: target.ip
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true)) && !exists("target.ip")
            && (inCIDR("log.ipv4","0.0.0.0/0") || inCIDR("log.ipv4","::/0")) && !inCIDR("log.ipv4","0.0.0.0/32") && !inCIDR("log.ipv4","::/128")
      - rename:
          from:
            - log.ipv6
          to: target.ip
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true)) && !exists("target.ip")
            && (inCIDR("log.ipv6","0.0.0.0/0") || inCIDR("log.ipv6","::/0")) && !inCIDR("log.ipv6","0.0.0.0/32") && !inCIDR("log.ipv6","::/128")
      - grok:
          source: log.hostname
          patterns:
            - fieldName: target.host
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true)) && regexMatch("log.hostname",
            "(?s)^.+$")
      - grok:
          source: log.os_name
          patterns:
            - fieldName: target.operatingSystem
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true)) && regexMatch("log.os_name",
            "(?s)^.+$")
      - grok:
          source: log.action
          patterns:
            - fieldName: action
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"])) && regexMatch("log.action",
            "(?s)^.+$")
      - grok:
          source: log.action_taken
          patterns:
            - fieldName: action
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","BlockedFiles_Event","FilteredWebsites_Event"]))
            && regexMatch("log.action_taken", "(?s)^.+$")
      - grok:
          source: log.username
          patterns:
            - fieldName: origin.user
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("log.eventType","FilteredWebsites_Event")) && regexMatch("log.username", "(?s)^.+$")
      - grok:
          source: log.user
          patterns:
            - fieldName: origin.user
              pattern: (?s)^.+$
          where: (equals("log.eventType","Audit_Event")) && regexMatch("log.user", "(?s)^.+$")
      - grok:
          source: log.account
          patterns:
            - fieldName: origin.user
              pattern: (?s)^.+$
          where: (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", true) == false) && regexMatch("log.account",
            "(?s)^.+$")
      - grok:
          source: log.account
          patterns:
            - fieldName: target.user
              pattern: (?s)^.+$
          where: (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true) && regexMatch("log.account",
            "(?s)^.+$")
      - grok:
          source: log.target
          patterns:
            - fieldName: target.user
              pattern: (?s)^.+$
          where: (equals("log.eventType","Audit_Event") && equalsIgnoreCase("log.domain","Native user") && equalsIgnoreCase("action","Login
            attempt")) && regexMatch("log.target", "(?s)^.+$")
      - grok:
          source: log.processname
          patterns:
            - pattern: ^(?:.*[\\/])?
            - fieldName: origin.process
              pattern: '[^\\/]+$'
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && regexMatch("log.processname", "(?s)^.+$")
      - grok:
          source: log.processname
          patterns:
            - pattern: ^
            - fieldName: origin.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && regexMatch("log.processname", "(?s)^.+$")
      - grok:
          source: log.processname
          patterns:
            - pattern: ^
            - fieldName: origin.path
              pattern: /(?:[^/\r\n]+/)*
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("log.eventType","FilteredWebsites_Event") || (equals("log.eventType","FirewallAggregated_Event")
            && safe("log.inbound", true) == false)) && regexMatch("log.processname", "(?s)^.+$")
      - grok:
          source: log.processname
          patterns:
            - pattern: ^(?:.*[\\/])?
            - fieldName: target.process
              pattern: '[^\\/]+$'
          where: (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true) && regexMatch("log.processname",
            "(?s)^.+$")
      - grok:
          source: log.processname
          patterns:
            - pattern: ^
            - fieldName: target.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - pattern: '[^\\/\r\n]+$'
          where: (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true) && regexMatch("log.processname",
            "(?s)^.+$")
      - grok:
          source: log.processname
          patterns:
            - pattern: ^
            - fieldName: target.path
              pattern: /(?:[^/\r\n]+/)*
            - pattern: '[^\\/\r\n]+$'
          where: (equals("log.eventType","FirewallAggregated_Event") && safe("log.inbound", false) == true) && regexMatch("log.processname",
            "(?s)^.+$")
      - grok:
          source: log.application
          patterns:
            - pattern: ^(?:.*[\\/])?
            - fieldName: origin.process
              pattern: '[^\\/]+$'
          where: (oneOf("log.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("log.application",
            "(?s)^.+$")
      - grok:
          source: log.application
          patterns:
            - pattern: ^
            - fieldName: origin.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("log.application",
            "(?s)^.+$")
      - grok:
          source: log.application
          patterns:
            - pattern: ^
            - fieldName: origin.path
              pattern: /(?:[^/\r\n]+/)*
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("log.application",
            "(?s)^.+$")
      - grok:
          source: log.object_uri
          patterns:
            - fieldName: target.url
              pattern: (?s)^.+$
          where: ((oneOf("log.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","BlockedFiles_Event","FilteredWebsites_Event"]))
            && regexMatch("log.object_uri", "(?i)^https?://[^\\s]+$")) && regexMatch("log.object_uri", "(?s)^.+$")
      - grok:
          source: log.hash
          patterns:
            - fieldName: target.sha1
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event","BlockedFiles_Event","FilteredWebsites_Event"]) && regexMatch("log.hash",
            "^[0-9a-fA-F]{40}$")) && regexMatch("log.hash", "(?s)^.+$")
      - grok:
          source: log.occurred
          patterns:
            - fieldName: log.esetOccurredTime
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("deviceTime")
            && !exists("log.esetOccurredTime") && regexMatch("log.occurred", "^(?:(?:0[1-9]|[12][0-9]|3[01])-(?:Jan|Mar|May|Jul|Aug|Oct|Dec)-[1-9][0-9]{3}|(?:0[1-9]|[12][0-9]|30)-(?:Apr|Jun|Sep|Nov)-[1-9][0-9]{3}|(?:0[1-9]|1[0-9]|2[0-8])-Feb-[1-9][0-9]{3}|29-Feb-(?:[1-9][0-9](?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00))
            (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$")) && regexMatch("log.occurred", "(?s)^.+$")
      - grok:
          source: log.occured
          patterns:
            - fieldName: log.esetOccurredTime
              pattern: (?s)^.+$
          where: (oneOf("log.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("deviceTime")
            && !exists("log.esetOccurredTime") && regexMatch("log.occured", "^(?:(?:0[1-9]|[12][0-9]|3[01])-(?:Jan|Mar|May|Jul|Aug|Oct|Dec)-[1-9][0-9]{3}|(?:0[1-9]|[12][0-9]|30)-(?:Apr|Jun|Sep|Nov)-[1-9][0-9]{3}|(?:0[1-9]|1[0-9]|2[0-8])-Feb-[1-9][0-9]{3}|29-Feb-(?:[1-9][0-9](?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00))
            (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$")) && regexMatch("log.occured", "(?s)^.+$")
      - reformat:
          fields:
            - log.esetOccurredTime
          function: time
          fromFormat: 02-Jan-2006 15:04:05
          toFormat: '2006-01-02T15:04:05Z'
          where: exists("log.esetOccurredTime")
      - rename:
          from:
            - log.esetOccurredTime
          to: deviceTime
          where: exists("log.esetOccurredTime")
      - grok:
          source: log.target
          patterns:
            - pattern: ^
            - fieldName: target.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("log.target",
            "(?s)^.+$") && !contains("log.target", "%")
      - grok:
          source: log.target
          patterns:
            - pattern: ^
            - fieldName: target.path
              pattern: /(?:[^/\r\n]+/)*
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("log.target",
            "(?s)^.+$") && !contains("log.target", "%")
      - grok:
          source: log.object_uri
          patterns:
            - pattern: ^file:///
            - fieldName: target.path
              pattern: '[A-Za-z]:/(?:[^/\r\n]+/)*'
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["Threat_Event","BlockedFiles_Event"])) && regexMatch("log.object_uri", "(?s)^.+$")
            && !contains("log.object_uri", "%") && !contains("log.object_uri", ["?","#"])
      - grok:
          source: log.object_uri
          patterns:
            - pattern: ^file://
            - fieldName: target.path
              pattern: /(?:[^/:\r\n]+/)*
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("log.eventType", ["Threat_Event","BlockedFiles_Event"])) && regexMatch("log.object_uri", "(?s)^.+$")
            && !contains("log.object_uri", "%") && !contains("log.object_uri", ["?","#"])
      - grok:
          source: log.threat_name
          patterns:
            - fieldName: target.malware
              pattern: (?s)^.+$
          where: (equals("log.eventType","Threat_Event")) && regexMatch("log.threat_name", "(?s)^.+$")
      - grok:
          source: log.threat_type
          patterns:
            - fieldName: target.malwareType
              pattern: (?s)^.+$
          where: (equals("log.eventType","Threat_Event")) && regexMatch("log.threat_type", "(?s)^.+$")
      - grok:
          source: log.threat_name
          patterns:
            - fieldName: target.cve
              pattern: ^CVE-[0-9]{4}-[0-9]{4,}
            - pattern: (?:[.].*)?$
          where: equals("log.eventType","FirewallAggregated_Event")
      - rename:
          from:
            - log.source_port
          to: origin.port
          where: equals("log.eventType","FirewallAggregated_Event") && (safe("log.source_port", "") == "" || regexMatch("log.source_port",
            "^[0-9]+$")) && safe("log.source_port", -1.0) >= 0.0 && safe("log.source_port", -1.0) <= 65535.0 && safe("log.source_port",
            -1.0) == double(int(safe("log.source_port", -1.0)))
      - cast:
          fields:
            - origin.port
          to: int
          where: exists("origin.port")
      - rename:
          from:
            - log.target_port
          to: target.port
          where: equals("log.eventType","FirewallAggregated_Event") && (safe("log.target_port", "") == "" || regexMatch("log.target_port",
            "^[0-9]+$")) && safe("log.target_port", -1.0) >= 0.0 && safe("log.target_port", -1.0) <= 65535.0 && safe("log.target_port",
            -1.0) == double(int(safe("log.target_port", -1.0)))
      - cast:
          fields:
            - target.port
          to: int
          where: exists("target.port")
      - grok:
          source: log.protocol
          patterns:
            - fieldName: protocol
              pattern: (?s)^.+$
          where: (equals("log.eventType","FirewallAggregated_Event")) && regexMatch("log.protocol", "(?s)^.+$")
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
