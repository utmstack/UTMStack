# ESET filter version 3.2.1
# JSON export contract: https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
# Original vendor keys are sanitized by JSON extraction (event_type -> log.event_type).
# Header host identifies the management server, never the managed endpoint.
# actionResult is only success, failed or denied, from explicit results, block words, completed
# removals or quarantines (denied) and stated action errors (failed); pure detections stay empty.
pipeline:
  - dataTypes:
      - antivirus-esmc-eset
    steps:
      # The EventProcessor grok plugin trims whitespace before each pattern, needs
      # each pattern to match non-empty text at the start of what remains and writes
      # nothing unless every pattern matches. Separators are therefore not patterns,
      # an optional priority needs its own grok, and each envelope's full shape is
      # checked in where, so trailing text after the JSON object is still refused.
      - grok:
          source: raw
          patterns:
            - fieldName: event.jsonMessage
              pattern: \{(?s:.*)\}
          where: 'regexMatch("raw", "^\\s*\\{(?s:.*)\\}\\s*$")'
      - grok:
          source: raw
          patterns:
            - pattern: <[0-9]{1,3}>
            - fieldName: event.deviceTime
              pattern: '[A-Z][a-z]{2}\s+[0-9]{1,2}\s+[0-9]{1,2}:[0-9]{2}:[0-9]{2}'
            - fieldName: event.headHostname
              pattern: '[^\s]+'
            - fieldName: event.serviceName
              pattern: ERAServer
            - pattern: \[
            - fieldName: event.pid
              pattern: '[0-9]+'
            - pattern: '\]:'
            - fieldName: event.jsonMessage
              pattern: \{(?s:.*)\}
          where: '!exists("event.jsonMessage") && regexMatch("raw", "^\\s*<[0-9]{1,3}>[A-Z][a-z]{2}\\s+[0-9]{1,2}\\s+[0-9]{1,2}:[0-9]{2}:[0-9]{2}\\s+\\S+\\s+ERAServer\\[[0-9]+\\]:\\s*\\{(?s:.*)\\}\\s*$")'
      - grok:
          source: raw
          patterns:
            - fieldName: event.deviceTime
              pattern: '[A-Z][a-z]{2}\s+[0-9]{1,2}\s+[0-9]{1,2}:[0-9]{2}:[0-9]{2}'
            - fieldName: event.headHostname
              pattern: '[^\s]+'
            - fieldName: event.serviceName
              pattern: ERAServer
            - pattern: \[
            - fieldName: event.pid
              pattern: '[0-9]+'
            - pattern: '\]:'
            - fieldName: event.jsonMessage
              pattern: \{(?s:.*)\}
          where: '!exists("event.jsonMessage") && regexMatch("raw", "^\\s*[A-Z][a-z]{2}\\s+[0-9]{1,2}\\s+[0-9]{1,2}:[0-9]{2}:[0-9]{2}\\s+\\S+\\s+ERAServer\\[[0-9]+\\]:\\s*\\{(?s:.*)\\}\\s*$")'
      - grok:
          source: raw
          patterns:
            - pattern: <
            - fieldName: event.priority
              pattern: '[0-9]{1,3}'
            - pattern: '>'
            - fieldName: event.syslogVersion
              pattern: '[1-9][0-9]*'
            - fieldName: event.deviceTime
              pattern: \S+
            - fieldName: event.headHostname
              pattern: \S+
            - fieldName: event.serviceName
              pattern: ERAServer
            - fieldName: event.pid
              pattern: (?:[0-9]+|-)
            - pattern: \S+
            - pattern: '(?:-|(?:\[(?:[^\]\\\r\n]|\\.)*\])+)'
            - fieldName: event.jsonMessage
              pattern: \{(?s:.*)\}
          where: '!exists("event.jsonMessage") && regexMatch("raw", "^\\s*<[0-9]{1,3}>[1-9][0-9]*\\s+\\S+\\s+\\S+\\s+ERAServer\\s+(?:[0-9]+|-)\\s+\\S+\\s+(?:-|(?:\\[(?:[^\\]\\\\\\r\\n]|\\\\.)*\\])+)\\s+\\{(?s:.*)\\}\\s*$")'
      - json:
          source: event.jsonMessage
          where: exists("event.jsonMessage")

      - rename:
          from: [event.process_name]
          to: event.processname
      - rename:
          from: [event.rule_name]
          to: event.rulename
      - delete:
          fields:
            - event.jsonMessage
            - event.eventType
            - event.endpointKey
            - event.endpointKeyType
            - event.correlationCandidate
            - event.esetOccurredTime
      - grok:
          source: event.event_type
          patterns:
            - fieldName: event.eventType
              pattern: (?s)^.+$
          where: regexMatch("event.event_type", "(?s)^.+$")
      - grok:
          source: event.source_uuid
          patterns:
            - fieldName: event.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("event.endpointKey")
            && (regexMatch("event.source_uuid", "^[^\\s].*$") && !oneOf("event.source_uuid", ["-","unknown"]))) && regexMatch("event.source_uuid",
            "(?s)^.+$")
      - add:
          function: string
          params:
            key: event.endpointKeyType
            value: uuid
          where: exists("event.endpointKey") && !exists("event.endpointKeyType")
      - grok:
          source: event.hostname
          patterns:
            - fieldName: event.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("event.endpointKey")
            && (regexMatch("event.hostname", "^[^\\s].*$") && !oneOf("event.hostname", ["-","unknown"]))) && regexMatch("event.hostname",
            "(?s)^.+$")
      - add:
          function: string
          params:
            key: event.endpointKeyType
            value: host
          where: exists("event.endpointKey") && !exists("event.endpointKeyType")
      - grok:
          source: event.ipv4
          patterns:
            - fieldName: event.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("event.endpointKey")
            && ((inCIDR("event.ipv4","0.0.0.0/0") || inCIDR("event.ipv4","::/0")) && !inCIDR("event.ipv4","0.0.0.0/32") &&
            !inCIDR("event.ipv4","::/128"))) && regexMatch("event.ipv4", "(?s)^.+$")
      - add:
          function: string
          params:
            key: event.endpointKeyType
            value: ip
          where: exists("event.endpointKey") && !exists("event.endpointKeyType")
      - grok:
          source: event.ipv6
          patterns:
            - fieldName: event.endpointKey
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("event.endpointKey")
            && ((inCIDR("event.ipv6","0.0.0.0/0") || inCIDR("event.ipv6","::/0")) && !inCIDR("event.ipv6","0.0.0.0/32") &&
            !inCIDR("event.ipv6","::/128"))) && regexMatch("event.ipv6", "(?s)^.+$")
      - add:
          function: string
          params:
            key: event.endpointKeyType
            value: ip
          where: exists("event.endpointKey") && !exists("event.endpointKeyType")
      - rename:
          from:
            - event.source_address
          to: origin.ip
          where: (equals("event.eventType","FirewallAggregated_Event") || equals("event.eventType","FilteredWebsites_Event"))
            && (inCIDR("event.source_address","0.0.0.0/0") || inCIDR("event.source_address","::/0")) && !inCIDR("event.source_address","0.0.0.0/32")
            && !inCIDR("event.source_address","::/128")
      - rename:
          from:
            - event.target_address
          to: target.ip
          where: (equals("event.eventType","FirewallAggregated_Event") || equals("event.eventType","FilteredWebsites_Event"))
            && (inCIDR("event.target_address","0.0.0.0/0") || inCIDR("event.target_address","::/0")) && !inCIDR("event.target_address","0.0.0.0/32")
            && !inCIDR("event.target_address","::/128")
      - rename:
          from:
            - event.ipv4
          to: origin.ip
          where: (equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && !exists("origin.ip") && (inCIDR("event.ipv4","0.0.0.0/0") || inCIDR("event.ipv4","::/0"))
            && !inCIDR("event.ipv4","0.0.0.0/32") && !inCIDR("event.ipv4","::/128")
      - rename:
          from:
            - event.ipv6
          to: origin.ip
          where: (equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && !exists("origin.ip") && (inCIDR("event.ipv6","0.0.0.0/0") || inCIDR("event.ipv6","::/0"))
            && !inCIDR("event.ipv6","0.0.0.0/32") && !inCIDR("event.ipv6","::/128")
      - grok:
          source: event.hostname
          patterns:
            - fieldName: origin.host
              pattern: (?s)^.+$
          where: (equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && regexMatch("event.hostname", "(?s)^.+$")
      - grok:
          source: event.os_name
          patterns:
            - fieldName: origin.operatingSystem
              pattern: (?s)^.+$
          where: (equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && regexMatch("event.os_name", "(?s)^.+$")
      - rename:
          from:
            - event.ipv4
          to: target.ip
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true)) && !exists("target.ip")
            && (inCIDR("event.ipv4","0.0.0.0/0") || inCIDR("event.ipv4","::/0")) && !inCIDR("event.ipv4","0.0.0.0/32") && !inCIDR("event.ipv4","::/128")
      - rename:
          from:
            - event.ipv6
          to: target.ip
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true)) && !exists("target.ip")
            && (inCIDR("event.ipv6","0.0.0.0/0") || inCIDR("event.ipv6","::/0")) && !inCIDR("event.ipv6","0.0.0.0/32") && !inCIDR("event.ipv6","::/128")
      - grok:
          source: event.hostname
          patterns:
            - fieldName: target.host
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true)) && regexMatch("event.hostname",
            "(?s)^.+$")
      - grok:
          source: event.os_name
          patterns:
            - fieldName: target.operatingSystem
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true)) && regexMatch("event.os_name",
            "(?s)^.+$")
      - grok:
          source: event.action
          patterns:
            - fieldName: action
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"])) && regexMatch("event.action",
            "(?s)^.+$")
      - grok:
          source: event.action_taken
          patterns:
            - fieldName: action
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","BlockedFiles_Event","FilteredWebsites_Event"]))
            && regexMatch("event.action_taken", "(?s)^.+$")
      - grok:
          source: event.username
          patterns:
            - fieldName: origin.user
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("event.eventType","FilteredWebsites_Event")) && regexMatch("event.username", "(?s)^.+$")
      - grok:
          source: event.user
          patterns:
            - fieldName: origin.user
              pattern: (?s)^.+$
          where: (equals("event.eventType","Audit_Event")) && regexMatch("event.user", "(?s)^.+$")
      - grok:
          source: event.account
          patterns:
            - fieldName: origin.user
              pattern: (?s)^.+$
          where: (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", true) == false) && regexMatch("event.account",
            "(?s)^.+$")
      - grok:
          source: event.account
          patterns:
            - fieldName: target.user
              pattern: (?s)^.+$
          where: (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true) && regexMatch("event.account",
            "(?s)^.+$")
      - grok:
          source: event.target
          patterns:
            - fieldName: target.user
              pattern: (?s)^.+$
          where: (equals("event.eventType","Audit_Event") && equalsIgnoreCase("event.domain","Native user") && equalsIgnoreCase("action","Login
            attempt")) && regexMatch("event.target", "(?s)^.+$")
      - grok:
          source: event.processname
          patterns:
            - pattern: '.*[\\/]'
            - fieldName: origin.process
              pattern: '[^\\/]+$'
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && regexMatch("event.processname", "(?s)^.+$")
      - grok:
          source: event.processname
          patterns:
            - fieldName: origin.process
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && regexMatch("event.processname", "(?s)^.+$") && regexMatch("event.processname", "^[^\\\\/]+$")
      - grok:
          source: event.processname
          patterns:
            - fieldName: origin.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && regexMatch("event.processname", "(?s)^.+$")
      - grok:
          source: event.processname
          patterns:
            - fieldName: origin.path
              pattern: /(?:[^/\r\n]+/)*
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","Audit_Event","EnterpriseInspectorAlert_Event","BlockedFiles_Event"])
            || equals("event.eventType","FilteredWebsites_Event") || (equals("event.eventType","FirewallAggregated_Event")
            && safe("event.inbound", true) == false)) && regexMatch("event.processname", "(?s)^.+$")
      - grok:
          source: event.processname
          patterns:
            - pattern: '.*[\\/]'
            - fieldName: target.process
              pattern: '[^\\/]+$'
          where: (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true) && regexMatch("event.processname",
            "(?s)^.+$")
      - grok:
          source: event.processname
          patterns:
            - fieldName: target.process
              pattern: (?s)^.+$
          where: (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true) && regexMatch("event.processname",
            "(?s)^.+$") && regexMatch("event.processname", "^[^\\\\/]+$")
      - grok:
          source: event.processname
          patterns:
            - fieldName: target.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - pattern: '[^\\/\r\n]+$'
          where: (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true) && regexMatch("event.processname",
            "(?s)^.+$")
      - grok:
          source: event.processname
          patterns:
            - fieldName: target.path
              pattern: /(?:[^/\r\n]+/)*
            - pattern: '[^\\/\r\n]+$'
          where: (equals("event.eventType","FirewallAggregated_Event") && safe("event.inbound", false) == true) && regexMatch("event.processname",
            "(?s)^.+$")
      - grok:
          source: event.application
          patterns:
            - pattern: '.*[\\/]'
            - fieldName: origin.process
              pattern: '[^\\/]+$'
          where: (oneOf("event.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("event.application",
            "(?s)^.+$")
      - grok:
          source: event.application
          patterns:
            - fieldName: origin.process
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("event.application",
            "(?s)^.+$") && regexMatch("event.application", "^[^\\\\/]+$")
      - grok:
          source: event.application
          patterns:
            - fieldName: origin.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("event.application",
            "(?s)^.+$")
      - grok:
          source: event.application
          patterns:
            - fieldName: origin.path
              pattern: /(?:[^/\r\n]+/)*
            - pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("event.application",
            "(?s)^.+$")
      - grok:
          source: event.object_uri
          patterns:
            - fieldName: target.url
              pattern: (?s)^.+$
          where: ((oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","BlockedFiles_Event","FilteredWebsites_Event"]))
            && regexMatch("event.object_uri", "(?i)^https?://[^\\s]+$")) && regexMatch("event.object_uri", "(?s)^.+$")
      - grok:
          source: event.hash
          patterns:
            - fieldName: target.sha1
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event","BlockedFiles_Event","FilteredWebsites_Event"]) && regexMatch("event.hash",
            "^[0-9a-fA-F]{40}$")) && regexMatch("event.hash", "(?s)^.+$")
      - grok:
          source: event.occurred
          patterns:
            - fieldName: event.esetOccurredTime
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("deviceTime")
            && !exists("event.esetOccurredTime") && regexMatch("event.occurred", "^(?:(?:0[1-9]|[12][0-9]|3[01])-(?:Jan|Mar|May|Jul|Aug|Oct|Dec)-[1-9][0-9]{3}|(?:0[1-9]|[12][0-9]|30)-(?:Apr|Jun|Sep|Nov)-[1-9][0-9]{3}|(?:0[1-9]|1[0-9]|2[0-8])-Feb-[1-9][0-9]{3}|29-Feb-(?:[1-9][0-9](?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00))
            (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$")) && regexMatch("event.occurred", "(?s)^.+$")
      - grok:
          source: event.occured
          patterns:
            - fieldName: event.esetOccurredTime
              pattern: (?s)^.+$
          where: (oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && !exists("deviceTime")
            && !exists("event.esetOccurredTime") && regexMatch("event.occured", "^(?:(?:0[1-9]|[12][0-9]|3[01])-(?:Jan|Mar|May|Jul|Aug|Oct|Dec)-[1-9][0-9]{3}|(?:0[1-9]|[12][0-9]|30)-(?:Apr|Jun|Sep|Nov)-[1-9][0-9]{3}|(?:0[1-9]|1[0-9]|2[0-8])-Feb-[1-9][0-9]{3}|29-Feb-(?:[1-9][0-9](?:0[48]|[2468][048]|[13579][26])|(?:[2468][048]|[13579][26])00))
            (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$")) && regexMatch("event.occured", "(?s)^.+$")
      - reformat:
          fields:
            - event.esetOccurredTime
          function: time
          fromFormat: 02-Jan-2006 15:04:05
          toFormat: '2006-01-02T15:04:05Z'
          where: exists("event.esetOccurredTime")
      - rename:
          from:
            - event.esetOccurredTime
          to: deviceTime
          where: exists("event.esetOccurredTime")
      - grok:
          source: event.target
          patterns:
            - fieldName: target.path
              pattern: '[A-Za-z]:[\\/](?:[^\\/\r\n]+[\\/])*'
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("event.target",
            "(?s)^.+$") && !contains("event.target", "%")
      - grok:
          source: event.target
          patterns:
            - fieldName: target.path
              pattern: /(?:[^/\r\n]+/)*
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["HipsAggregated_Event","HIPSAggregated_Event"])) && regexMatch("event.target",
            "(?s)^.+$") && !contains("event.target", "%")
      - grok:
          source: event.object_uri
          patterns:
            - pattern: ^file:///
            - fieldName: target.path
              pattern: '[A-Za-z]:/(?:[^/\r\n]+/)*'
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["Threat_Event","BlockedFiles_Event"])) && regexMatch("event.object_uri", "(?s)^.+$")
            && !contains("event.object_uri", "%") && !contains("event.object_uri", ["?","#"])
      - grok:
          source: event.object_uri
          patterns:
            - pattern: ^file://
            - fieldName: target.path
              pattern: /(?:[^/:\r\n]+/)*
            - fieldName: target.filename
              pattern: '[^\\/\r\n]+$'
          where: (oneOf("event.eventType", ["Threat_Event","BlockedFiles_Event"])) && regexMatch("event.object_uri", "(?s)^.+$")
            && !contains("event.object_uri", "%") && !contains("event.object_uri", ["?","#"])
      - grok:
          source: event.threat_name
          patterns:
            - fieldName: target.malware
              pattern: (?s)^.+$
          where: (equals("event.eventType","Threat_Event")) && regexMatch("event.threat_name", "(?s)^.+$")
      - grok:
          source: event.threat_type
          patterns:
            - fieldName: target.malwareType
              pattern: (?s)^.+$
          where: (equals("event.eventType","Threat_Event")) && regexMatch("event.threat_type", "(?s)^.+$")
      - grok:
          source: event.threat_name
          patterns:
            - fieldName: target.cve
              pattern: ^CVE-[0-9]{4}-[0-9]{4,}
          where: equals("event.eventType","FirewallAggregated_Event") && regexMatch("event.threat_name", "^CVE-[0-9]{4}-[0-9]{4,}(?:[.].*)?$")
      - rename:
          from:
            - event.source_port
          to: origin.port
          where: equals("event.eventType","FirewallAggregated_Event") && (safe("event.source_port", "") == "" || regexMatch("event.source_port",
            "^[0-9]+$")) && safe("event.source_port", -1.0) >= 0.0 && safe("event.source_port", -1.0) <= 65535.0 && safe("event.source_port",
            -1.0) == double(int(safe("event.source_port", -1.0)))
      - cast:
          fields:
            - origin.port
          to: int
          where: exists("origin.port")
      - rename:
          from:
            - event.target_port
          to: target.port
          where: equals("event.eventType","FirewallAggregated_Event") && (safe("event.target_port", "") == "" || regexMatch("event.target_port",
            "^[0-9]+$")) && safe("event.target_port", -1.0) >= 0.0 && safe("event.target_port", -1.0) <= 65535.0 && safe("event.target_port",
            -1.0) == double(int(safe("event.target_port", -1.0)))
      - cast:
          fields:
            - target.port
          to: int
          where: exists("target.port")
      - grok:
          source: event.protocol
          patterns:
            - fieldName: protocol
              pattern: (?s)^.+$
          where: (equals("event.eventType","FirewallAggregated_Event")) && regexMatch("event.protocol", "(?s)^.+$")
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("event.eventType","FirewallAggregated_Event") && equals("event.protocol",132)
      - rename:
          from:
            - protocol
          to: event.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)
      - add:
          function: string
          params:
            key: severity
            value: info
          where: oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && regexMatch("event.severity",
            "(?i)^(information|notice|info)$")
      - add:
          function: string
          params:
            key: severity
            value: warning
          where: oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && regexMatch("event.severity",
            "(?i)^(warning)$")
      - add:
          function: string
          params:
            key: severity
            value: error
          where: oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && regexMatch("event.severity",
            "(?i)^(error)$")
      - add:
          function: string
          params:
            key: severity
            value: critical
          where: oneOf("event.eventType", ["Threat_Event", "FirewallAggregated_Event", "HipsAggregated_Event", "HIPSAggregated_Event",
            "Audit_Event", "FilteredWebsites_Event", "EnterpriseInspectorAlert_Event", "BlockedFiles_Event"]) && regexMatch("event.severity",
            "(?i)^(critical|fatal)$")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.eventType","Audit_Event") && regexMatch("event.result", "(?i)^(success|succeeded|successful|ok)$")
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: equals("event.eventType","Audit_Event") && regexMatch("event.result", "(?i)^(failure|failed|fail|error|invalid|timeout)$")
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equals("event.eventType","Audit_Event") && regexMatch("event.result", "(?i)^(denied|deny|blocked|block|rejected|reject|unauthorized|access denied)$")
      # A console login refused with "Access denied" is a failed logon, not a policy refusal.
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: equals("event.eventType","Audit_Event") && equalsIgnoreCase("action","Login attempt") && regexMatch("event.result", "(?i)^access denied$")
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: (oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","BlockedFiles_Event","FilteredWebsites_Event"])
            || equals("event.eventType","FirewallAggregated_Event")) && regexMatch("action", "(?i)^(deny|denied|block|blocked|blocked url|blocked and cleaned|prevented)$")
      # The HTTP filter cut the download, or the product removed or quarantined the
      # detected object: the threat was stopped, so denied. "Retained" and detections
      # without an action stay empty; a stated action_error (next step) wins with failed.
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equals("event.eventType","Threat_Event") && !equals("event.threat_handled", false)
            && regexMatch("action", "(?i)^(connection terminated|cleaned|cleaned by deleting|deleted|quarantined|contained infected files)$")
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: oneOf("event.eventType", ["Threat_Event","HipsAggregated_Event","HIPSAggregated_Event","BlockedFiles_Event","FilteredWebsites_Event"])
            && regexMatch("event.action_error", "(?s)^.+$")
      - add:
          function: string
          params:
            key: event.correlationCandidate.heuristicRemediation
            value: match
          where: '(equals("event.eventType", "Threat_Event") &&

            (regexMatch("event.threat_name", "(?i)(heuristic|newheur|suspicious behavior)") || regexMatch("event.threat_type",
            "(?i)(heuristic|newheur|suspicious behavior)") || regexMatch("event.scanner_id", "(?i)(heuristic|newheur|suspicious
            behavior)")) &&

            regexMatch("action", "(?i)^(cleaned|deleted|quarantined|blocked|denied|prevented)$") &&

            (!exists("event.action_error") || equals("event.action_error", "")) &&

            !equals("event.threat_handled", false)) &&

            exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&

            oneOf("event.endpointKeyType", ["uuid", "host", "ip"]) &&

            exists("event.endpointKey") && !equals("event.endpointKey", "")

            '
      - add:
          function: string
          params:
            key: event.correlationCandidate.consoleAuthenticationFailure
            value: match
          where: '(equals("event.eventType", "Audit_Event") &&

            equalsIgnoreCase("event.domain", "Native user") &&

            equalsIgnoreCase("action", "Login attempt") && oneOf("actionResult", ["failed", "denied"]) &&

            exists("target.user") && !oneOf("target.user", ["", "unknown", "-"])) &&

            exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&

            oneOf("event.endpointKeyType", ["uuid", "host", "ip"]) &&

            exists("event.endpointKey") && !equals("event.endpointKey", "")

            '
      - add:
          function: string
          params:
            key: event.correlationCandidate.quarantineFailure
            value: match
          where: '(equals("event.eventType", "Threat_Event") && equals("actionResult", "failed") &&

            regexMatch("event.action_error", "(?s).+") &&

            (regexMatch("action", "(?i)(quarantin|clean)") || regexMatch("event.action_error", "(?i)(quarantin|clean)")))
            &&

            exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&

            oneOf("event.endpointKeyType", ["uuid", "host", "ip"]) &&

            exists("event.endpointKey") && !equals("event.endpointKey", "")

            '
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")
