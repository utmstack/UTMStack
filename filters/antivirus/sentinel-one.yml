# SentinelOne filter, version 3.2.1
# Supports CEF Syslog format and [something@number something="xxxx"] format
# Based on https://docs.centrify.com/Content/IntegrationContent/SIEM/arcsight-cef/arcsight-cef-format.htm
# and https://docs.fortinet.com/document/fortisiem/6.1.0/external-systems-configuration-guide/298395/sentinelone

pipeline:
  - dataTypes:
      - antivirus-sentinel-one
    steps:
      # Parsing the common fields
      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.0trash
              pattern: '{{.data}}\='
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}'
            - fieldName: event.1trash
              pattern: '{{.integer}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.0trash
              pattern: '{{.data}}Mgmt\|'
            - fieldName: event.1trash
              pattern: '{{.integer}}'
            - fieldName: event.eventDescription
              pattern: '\|{{.data}}\|'
            - fieldName: event.2trash
              pattern: '{{.integer}}\|'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.0trash
              pattern: '{{.data}}Mgmt\|'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: event.2trash
              pattern: '{{.data}}\|rt='
            - fieldName: event.ruleTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.year}}{{.space}}{{.time}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.restData

      - grok:
          patterns:
            - fieldName: event.2trash
              pattern: '{{.data}}\|rt=#{{.word}}'
            - fieldName: event.ruleTime
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.restData

      # Parsing raw field for log when it has the format [something@number something="xxxx"]
      - grok:
          patterns:
            - fieldName: event.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: event.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: event.syslogHostIP
              pattern: '{{.ipv4}}'
            - fieldName: event.0trash
              pattern: '({{.word}}{{.space}})+'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw

      # Parse the CEF header by position, whatever syslog header precedes "CEF:".
      # Header fields are pipe-delimited; a backslash escapes a pipe inside a field.
      # log.restData then holds only the extension, so no header text reaches kv.
      # The header severity stays vendor detail in log.cefSeverity; its scale is
      # not documented, so the standard severity field is not set here.
      - grok:
          patterns:
            - fieldName: event.0trash
              pattern: '{{.data}}CEF:{{.integer}}\|'
            - fieldName: event.cefDeviceVendor
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: event.1trash
              pattern: '\|'
            - fieldName: event.cefDeviceProduct
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: event.1trash
              pattern: '\|'
            - fieldName: event.cefDeviceVersion
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: event.1trash
              pattern: '\|'
            - fieldName: event.cefSignatureId
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: event.1trash
              pattern: '\|'
            - fieldName: event.eventDescription
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: event.1trash
              pattern: '\|'
            - fieldName: event.cefSeverity
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: event.1trash
              pattern: '\|'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          source: raw
          where: 'contains("raw", "CEF:")'

      - kv:
          fieldSplit: " "
          valueSplit: "="
          source: event.restData
          where: 'exists("event.restData")'

      # CEF rt=#arcsightDate(<day>, <d> <Mon> <yyyy>, <hh:mm:ss> UTC) anywhere in the
      # extension. kv keeps only its first word, so the complete value is taken here.
      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])rt=#arcsightDate\('
            - fieldName: event.rt
              pattern: '[^)]+'
          source: event.restData

      # The same value becomes deviceTime only when it has exactly the expected
      # UTC layout; any other rt format is left alone and deviceTime keeps its default.
      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])rt=#arcsightDate\('
            - fieldName: event.deviceTimeCandidate
              pattern: '[^)]+'
          source: event.restData
      - reformat:
          fields:
            - event.deviceTimeCandidate
          function: time
          fromFormat: 'Mon, 2 Jan 2006, 15:04:05 MST'
          toFormat: '2006-01-02T15:04:05Z07:00'
          where: 'regexMatch("event.deviceTimeCandidate", "^[A-Z][a-z]{2}, [0-9]{1,2} [A-Z][a-z]{2} [0-9]{4}, [0-9]{2}:[0-9]{2}:[0-9]{2} UTC$")'
      - rename:
          from:
            - event.deviceTimeCandidate
          to: deviceTime
          where: 'regexMatch("event.deviceTimeCandidate", "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")'

      # Values that can contain spaces: take the text after "<key>=" up to the next
      # " <key>=", or to the end when the key is last, then strip that next key.
      # kv keeps only the first word of these values.
      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])accountName='
            - fieldName: event.accName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])accountName=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])eventDesc='
            - fieldName: event.eventDescription
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])eventDesc=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])suser='
            - fieldName: event.sourceUser
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])suser=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])duser='
            - fieldName: event.destinationUser
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])duser=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])endpointDeviceControlDeviceName='
            - fieldName: event.endpointDeviceName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])endpointDeviceControlDeviceName=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])sourceGroupName='
            - fieldName: event.sourceGpName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])sourceGroupName=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])sourceIpAddresses='
            - fieldName: event.sourceIps
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])sourceIpAddresses=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])sourceMacAddresses='
            - fieldName: event.sourceMacs
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])sourceMacAddresses=\\S")'

      - grok:
          patterns:
            - fieldName: event.3trash
              pattern: '{{.data}}(?:^|[\s|])siteName='
            - fieldName: event.siteName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: event.restData
          where: 'regexMatch("event.restData", "(^|[\\s|])siteName=\\S")'

      - trim:
          function: regex
          substring: '\s+[A-Za-z0-9_.]+=$'
          fields:
            - event.accName
            - event.eventDescription
            - event.sourceUser
            - event.destinationUser
            - event.endpointDeviceName
            - event.sourceGpName
            - event.sourceIps
            - event.sourceMacs
            - event.siteName

      # In SentinelOne management (console) events, suser is the console account
      # that made the change. Copy it to the standard actor field and keep the
      # vendor value. Its meaning in other event classes is not established.
      - grok:
          patterns:
            - fieldName: origin.user
              pattern: '(?s:.+)'
          source: event.sourceUser
          where: 'equals("event.cat", "SystemEvent") && exists("event.sourceUser") && !oneOf("event.sourceUser", ["", "-", "N/A", "unknown"])'

      # Removing unnecessary characters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - event.syslogPriority

      - trim:
          function: suffix
          substring: '>'
          fields:
            - event.syslogPriority

      - trim:
          function: prefix
          substring: '|'
          fields:
            - event.eventDescription

      - trim:
          function: suffix
          substring: '|'
          fields:
            - event.eventDescription

      - trim:
          function: prefix
          substring: '('
          fields:
            - event.syslogDeviceTime

      - trim:
          function: suffix
          substring: ')'
          fields:
            - event.syslogDeviceTime

      # Renaming useful fields
      - rename:
          from:
            - event.rt
          to: event.ruleTime

      # Adding action result: only success, failed or denied, or nothing when
      # the record states no final outcome. add overwrites, so success comes
      # first, then failed, then denied.
      #
      # Console account and role changes are logged once they are done:
      # activityType 23 (user added), 25 (user deleted), 37 (role assigned).
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'oneOf("event.activityType", ["23", "25", "37"])'

      # An explicit failed mitigation or operation status: exact values, not
      # substrings, and contradictory statuses stay unknown.
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: >-
            (equalsIgnoreCase("event.threatStatus", "mitigation_failed") ||
             equalsIgnoreCase("event.status", "failed") ||
             regexMatch("event.mitigationStatus", "(?i)^(failed|failure|mitigation_failed)$")) &&
            !regexMatch("event.mitigationStatus", "(?i)^(success|succeeded|mitigated)$") &&
            !regexMatch("event.status", "(?i)^(success|succeeded)$")

      # CEF:0 mitigation records carry fileHash and state their result only in
      # the event name. "Quarantine failed" and the like are failed mitigations.
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("event.fileHash") && regexMatch("event.eventDescription", "(?i)^[A-Za-z ]+ failed$")'

      # A kill or quarantine that completed stopped the threat. Other names,
      # such as "Kill pending to reboot" or a detection, stay empty.
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("event.fileHash") && regexMatch("event.eventDescription", "(?i)^(kill|quarantine) performed successfully$")'

      # Removing unused fields
      - delete:
          fields:
            - event.0trash
            - event.1trash
            - event.2trash
            - event.3trash
            - event.4trash
            - event.restData
            - event.1rt
            - event.rt
            - event.deviceTimeCandidate
            - event.irrelevant
            - event.accountNameToParse
            - event.accountName
            - event.eventDescToParse
            - event.eventDesc
            - event.suserToParse
            - event.suser
            - event.duserToParse
            - event.duser
            - event.endpointDeviceControlDeviceNameToParse
            - event.endpointDeviceControlDeviceName
            - event.sourceGroupNameToParse
            - event.sourceGroupName
            - event.sourceIpAddressesToParse
            - event.sourceIpAddresses
            - event.sourceMacAddressesToParse
            - event.sourceMacAddresses
