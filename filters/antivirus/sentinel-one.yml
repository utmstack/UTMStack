# SentinelOne filter, version 3.0.1
# Supports CEF Syslog format and [something@number something="xxxx"] format
# Based on https://docs.centrify.com/Content/IntegrationContent/SIEM/arcsight-cef/arcsight-cef-format.htm
# and https://docs.fortinet.com/document/fortisiem/6.1.0/external-systems-configuration-guide/298395/sentinelone

pipeline:
  - dataTypes:
      - antivirus-sentinel-one
    steps:
      # Parsing the common fields
      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: log.0trash
              pattern: '{{.data}}\='
            - fieldName: log.syslogHostIP
              pattern: '{{.ipv4}}'
            - fieldName: log.1trash
              pattern: '{{.integer}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: log.0trash
              pattern: '{{.data}}Mgmt\|'
            - fieldName: log.1trash
              pattern: '{{.integer}}'
            - fieldName: log.eventDescription
              pattern: '\|{{.data}}\|'
            - fieldName: log.2trash
              pattern: '{{.integer}}\|'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: log.0trash
              pattern: '{{.data}}Mgmt\|'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}\|rt='
            - fieldName: log.ruleTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.year}}{{.space}}{{.time}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      - grok:
          patterns:
            - fieldName: log.2trash
              pattern: '{{.data}}\|rt=#{{.word}}'
            - fieldName: log.ruleTime
              pattern: '\({{.data}}\)'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.restData

      # Parsing raw field for log when it has the format [something@number something="xxxx"]
      - grok:
          patterns:
            - fieldName: log.syslogPriority
              pattern: '\<{{.data}}\>'
            - fieldName: log.syslogDeviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}\w{{.time}}\w'
            - fieldName: log.syslogHostIP
              pattern: '{{.ipv4}}'
            - fieldName: log.0trash
              pattern: '({{.word}}{{.space}})+'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw

      # Parse the CEF header by position, whatever syslog header precedes "CEF:".
      # Header fields are pipe-delimited; a backslash escapes a pipe inside a field.
      # log.restData then holds only the extension, so no header text reaches kv.
      # The header severity stays vendor detail in log.cefSeverity; its scale is
      # not documented, so the standard severity field is not set here.
      - grok:
          patterns:
            - fieldName: log.0trash
              pattern: '{{.data}}CEF:{{.integer}}\|'
            - fieldName: log.cefDeviceVendor
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: log.1trash
              pattern: '\|'
            - fieldName: log.cefDeviceProduct
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: log.1trash
              pattern: '\|'
            - fieldName: log.cefDeviceVersion
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: log.1trash
              pattern: '\|'
            - fieldName: log.cefSignatureId
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: log.1trash
              pattern: '\|'
            - fieldName: log.eventDescription
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: log.1trash
              pattern: '\|'
            - fieldName: log.cefSeverity
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: log.1trash
              pattern: '\|'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: raw
          where: 'contains("raw", "CEF:")'

      - kv:
          fieldSplit: " "
          valueSplit: "="
          source: log.restData
          where: 'exists("log.restData")'

      # CEF rt=#arcsightDate(<day>, <d> <Mon> <yyyy>, <hh:mm:ss> UTC) anywhere in the
      # extension. kv keeps only its first word, so the complete value is taken here.
      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])rt=#arcsightDate\('
            - fieldName: log.rt
              pattern: '[^)]+'
          source: log.restData

      # The same value becomes deviceTime only when it has exactly the expected
      # UTC layout; any other rt format is left alone and deviceTime keeps its default.
      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])rt=#arcsightDate\('
            - fieldName: log.deviceTimeCandidate
              pattern: '[^)]+'
          source: log.restData
      - reformat:
          fields:
            - log.deviceTimeCandidate
          function: time
          fromFormat: 'Mon, 2 Jan 2006, 15:04:05 MST'
          toFormat: '2006-01-02T15:04:05Z07:00'
          where: 'regexMatch("log.deviceTimeCandidate", "^[A-Z][a-z]{2}, [0-9]{1,2} [A-Z][a-z]{2} [0-9]{4}, [0-9]{2}:[0-9]{2}:[0-9]{2} UTC$")'
      - rename:
          from:
            - log.deviceTimeCandidate
          to: deviceTime
          where: 'regexMatch("log.deviceTimeCandidate", "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")'

      # Values that can contain spaces: take the text after "<key>=" up to the next
      # " <key>=", or to the end when the key is last, then strip that next key.
      # kv keeps only the first word of these values.
      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])accountName='
            - fieldName: log.accName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])accountName=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])eventDesc='
            - fieldName: log.eventDescription
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])eventDesc=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])suser='
            - fieldName: log.sourceUser
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])suser=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])duser='
            - fieldName: log.destinationUser
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])duser=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])endpointDeviceControlDeviceName='
            - fieldName: log.endpointDeviceName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])endpointDeviceControlDeviceName=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])sourceGroupName='
            - fieldName: log.sourceGpName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])sourceGroupName=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])sourceIpAddresses='
            - fieldName: log.sourceIps
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])sourceIpAddresses=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])sourceMacAddresses='
            - fieldName: log.sourceMacs
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])sourceMacAddresses=\\S")'

      - grok:
          patterns:
            - fieldName: log.3trash
              pattern: '{{.data}}(?:^|[\s|])siteName='
            - fieldName: log.siteName
              pattern: '(?:.*?\s[A-Za-z0-9_.]+=|.+)'
          source: log.restData
          where: 'regexMatch("log.restData", "(^|[\\s|])siteName=\\S")'

      - trim:
          function: regex
          substring: '\s+[A-Za-z0-9_.]+=$'
          fields:
            - log.accName
            - log.eventDescription
            - log.sourceUser
            - log.destinationUser
            - log.endpointDeviceName
            - log.sourceGpName
            - log.sourceIps
            - log.sourceMacs
            - log.siteName

      # In SentinelOne management (console) events, suser is the console account
      # that made the change. Copy it to the standard actor field and keep the
      # vendor value. Its meaning in other event classes is not established.
      - grok:
          patterns:
            - fieldName: origin.user
              pattern: '(?s:.+)'
          source: log.sourceUser
          where: 'equals("log.cat", "SystemEvent") && exists("log.sourceUser") && !oneOf("log.sourceUser", ["", "-", "N/A", "unknown"])'

      # Removing unnecessary characters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.syslogPriority

      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.syslogPriority

      - trim:
          function: prefix
          substring: '|'
          fields:
            - log.eventDescription

      - trim:
          function: suffix
          substring: '|'
          fields:
            - log.eventDescription

      - trim:
          function: prefix
          substring: '('
          fields:
            - log.syslogDeviceTime

      - trim:
          function: suffix
          substring: ')'
          fields:
            - log.syslogDeviceTime

      # Renaming useful fields
      - rename:
          from:
            - log.rt
          to: log.ruleTime

      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'equals("log.threatStatus", "mitigation_failed")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'equals("log.status", "failed") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'contains("log.mitigationStatus", "fail") && !exists("actionResult")'

      # Removing unused fields
      - delete:
          fields:
            - log.0trash
            - log.1trash
            - log.2trash
            - log.3trash
            - log.4trash
            - log.restData
            - log.1rt
            - log.rt
            - log.deviceTimeCandidate
            - log.irrelevant
            - log.accountNameToParse
            - log.accountName
            - log.eventDescToParse
            - log.eventDesc
            - log.suserToParse
            - log.suser
            - log.duserToParse
            - log.duser
            - log.endpointDeviceControlDeviceNameToParse
            - log.endpointDeviceControlDeviceName
            - log.sourceGroupNameToParse
            - log.sourceGroupName
            - log.sourceIpAddressesToParse
            - log.sourceIpAddresses
            - log.sourceMacAddressesToParse
            - log.sourceMacAddresses
