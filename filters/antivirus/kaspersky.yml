# Kaspersky filter v3.2.0; native KSC structured syslog and CEF.
# The grok plugin trims input before each pattern and rejects empty matches;
# separator spaces therefore belong to nonempty captures, not their own steps.
pipeline:
- dataTypes:
  - antivirus-kaspersky
  steps:
  - delete:
      fields:
      - event.format
      - event.cefExtension
      - event.ksc
      - event.eventType
      - event.endpointKey
      - event.endpointKeyType
      - event.correlationCandidate
  - grok:
      source: raw
      patterns:
      - fieldName: ''
        pattern: '^(?:(?:<[0-9]{1,3}>)?[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+(?:[^\s:\"]+(?:\[[0-9]+\])?:\s*)?|<[0-9]{1,3}>[1-9][0-9]*\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+-\s+|<[0-9]{1,3}>)?CEF:'
      - fieldName: event.cefVersion
        pattern: '[0-9]+'
      - fieldName: ''
        pattern: \|
      - fieldName: event.embDeviceVendor
        pattern: (?:\\.|[^\\|\r\n])+
      - fieldName: ''
        pattern: \|
      - fieldName: event.embDeviceProduct
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.deviceVersion
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.signatureID
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.descMsg
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.cefDeviceSeverity
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: event.cefExtension
        pattern: (?s:.*)$
  - kv:
      source: event.cefExtension
      fieldSplit: ' '
      valueSplit: '='
      where: exists("event.cefExtension")
  - delete:
      fields:
      - event.act
      - event.agt
      - event.ahost
      - event.amac
      - event.cat
      - event.cn1
      - event.cn10
      - event.cn10Label
      - event.cn1Label
      - event.cn2
      - event.cn2Label
      - event.cn3
      - event.cn3Label
      - event.cn4
      - event.cn4Label
      - event.cn5
      - event.cn5Label
      - event.cn6
      - event.cn6Label
      - event.cn7
      - event.cn7Label
      - event.cn8
      - event.cn8Label
      - event.cn9
      - event.cn9Label
      - event.cs1
      - event.cs10
      - event.cs10Label
      - event.cs1Label
      - event.cs2
