# Kaspersky filter v3.2.0; native KSC structured syslog and CEF.
# The grok plugin trims input before each pattern and rejects empty matches;
# separator spaces therefore belong to nonempty captures, not their own steps.
pipeline:
- dataTypes:
  - antivirus-kaspersky
  steps:
  - delete:
      fields:
      - log.format
      - log.cefExtension
      - log.ksc
      - log.eventType
      - log.endpointKey
      - log.endpointKeyType
      - log.correlationCandidate
  - grok:
      source: raw
      patterns:
      - fieldName: ''
        pattern: '^(?:(?:<[0-9]{1,3}>)?[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+(?:[^\s:\"]+(?:\[[0-9]+\])?:\s*)?|<[0-9]{1,3}>[1-9][0-9]*\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+-\s+|<[0-9]{1,3}>)?CEF:'
      - fieldName: log.cefVersion
        pattern: '[0-9]+'
      - fieldName: ''
        pattern: \|
      - fieldName: log.embDeviceVendor
        pattern: (?:\\.|[^\\|\r\n])+
      - fieldName: ''
        pattern: \|
      - fieldName: log.embDeviceProduct
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.deviceVersion
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.signatureID
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.descMsg
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.cefDeviceSeverity
        pattern: (?:\\.|[^\\|\r\n])*
      - fieldName: ''
        pattern: \|
      - fieldName: log.cefExtension
        pattern: (?s:.*)$
  - kv:
      source: log.cefExtension
      fieldSplit: ' '
      valueSplit: '='
      where: exists("log.cefExtension")
  - delete:
      fields:
      - log.act
      - log.agt
      - log.ahost
      - log.amac
      - log.cat
      - log.cn1
      - log.cn10
      - log.cn10Label
      - log.cn1Label
      - log.cn2
      - log.cn2Label
      - log.cn3
      - log.cn3Label
      - log.cn4
      - log.cn4Label
      - log.cn5
      - log.cn5Label
      - log.cn6
      - log.cn6Label
      - log.cn7
      - log.cn7Label
      - log.cn8
      - log.cn8Label
      - log.cn9
      - log.cn9Label
      - log.cs1
      - log.cs10
      - log.cs10Label
      - log.cs1Label
      - log.cs2
      - log.cs2Label
      - log.cs3
      - log.cs3Label
      - log.cs4
      - log.cs4Label
      - log.cs5
