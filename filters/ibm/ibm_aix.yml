# IBM AIX filter, version 3.2.0
# Based on docs and samples log provided
# Support 
#
# Documentations
# 1- https://www.ibm.com/support/knowledgecenter/en/SSGMCP_9.0.0/com.ibm.aix.log.doc/filter.html
#
# Implementation
# 1. Parsing the RAW field containing the IBM AIX filter
# 2. Parsing headers of syslog the message 
# 3. Parsing the fields of the message

pipeline:
  - dataTypes:
      - ibm-aix
    steps:
      #......................................................................#
      # Using grok to parse syslogHeader of the message
      #......................................................................#
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.msgInit
              pattern: '{{.greedy}}'
          source: raw

      #......................................................................#
      # Removing unnecessary characters of the syslogHeader
      #......................................................................#
      - trim:
          function: prefix
          substring: "<"
          fields:
            - event.priority
      - trim:
          function: suffix
          substring: ">"
          fields:
            - event.priority

      # .......................................................................#
      # Checking that the message contains Message forwarded from
      # .......................................................................#
      - grok:
          patterns:
            - fildName: event.irrelevant
              pattern: 'Message(\s)forwarded(\s)from'
            - fieldName: from.host
              pattern: '{{.data}}(\:)'
            - fieldName: event.msgAll
              pattern: '{{.greedy}}'
          source: event.msgInit
          where: contains("event.msgInit", "Message forwarded from")
      
      # Removing unnecessary characters
      - trim:
          function: suffix
          substring: ":"
          fields:
            - from.host

      #......................................................................#
      # Checking that the message contains TTY= or PWD= or COMMAND= or USER=
      #......................................................................#
      - grok:
          patterns:
            - fieldName: event.commandType
              pattern: '{{.data}}(\:)'
            - fieldName: origin.user
              pattern: '{{.data}}(\s)?(\:)'
            - fieldName: event.msgWithTTY
              pattern: '{{.greedy}}'
          source: event.msgAll
          where: contains("event.msgAll", "TTY=") || contains("event.msgAll", "PWD=") || contains("event.msgAll", "USER=") || contains("event.msgAll", "COMMAND=")

      # Removing unnecessary characters
      - trim:
          function: suffix
          substring: ":"
          fields:
            - event.commandType
            - origin.user
      # ......................................................................#
      # Using grok to parse msgWithTTY individual fields
      # If "TTY=" in [msgWithTTY]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(TTY=)'
            - fieldName: event.tty
              pattern: '{{.data}}(\;)'
            - fieldName: event.msgWithTTY
              pattern: '{{.greedy}}'
          source: event.msgWithTTY
          where: contains("event.msgWithTTY", "TTY=") || contains("event.msgWithTTY", "PWD=") || contains("event.msgWithTTY", "USER=") || contains("event.msgWithTTY", "COMMAND=")

      # ......................................................................#
      # If "PWD=" in [msgWithTTY]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(PWD=)'
            - fieldName: event.pwd
              pattern: '{{.data}}(\;)'
            - fieldName: event.msgWithTTY
              pattern: '{{.greedy}}'
          source: event.msgWithTTY
          where: contains("event.msgWithTTY", "TTY=") || contains("event.msgWithTTY", "PWD=") || contains("event.msgWithTTY", "USER=") || contains("event.msgWithTTY", "COMMAND=")

      # ......................................................................#
      # If "USER=" in [msgWithTTY]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(USER=)'
            - fieldName: origin.user
              pattern: '{{.data}}(\;)'
            - fieldName: event.msgWithTTY
              pattern: '{{.greedy}}'
          source: event.msgWithTTY
          where: contains("event.msgWithTTY", "TTY=") || contains("event.msgWithTTY", "PWD=") || contains("event.msgWithTTY", "USER=") || contains("event.msgWithTTY", "COMMAND=")

      # ......................................................................#
      # If "COMMAND=" in [msgWithTTY]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(COMMAND=)'
            - fieldName: origin.command
              pattern: '{{.greedy}}'
          source: event.msgWithTTY
          where: contains("event.msgWithTTY", "TTY=") || contains("event.msgWithTTY", "PWD=") || contains("event.msgWithTTY", "USER=") || contains("event.msgWithTTY", "COMMAND=")

      # ......................................................................#
      # Using grok to parse msgAll
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.commandType
              pattern: '{{.data}}(\:)'
            - fieldName: origin.user
              pattern: '{{.data}}(\s)?(\:)'
            - fieldName: event.irrelevant
              pattern: '{{.data}}\)'
            - fieldName: origin.command
              pattern: '{{.greedy}}'
          source: event.msgAll
          where: contains("event.msgAll", "(command continued)")

      # ......................................................................#
      # Removing unnecessary characters
      # ......................................................................#
      - trim:
          function: suffix
          substring: ";"
          fields:
            - event.tty
            - event.pwd
            - origin.user
      - trim:
          function: suffix
          substring: ":"
          fields:
            - event.commandType
            - origin.user

      # ......................................................................#
      # if message.matches("\\w+\\[[0-9]+\\]\\:") to parse msgAll 
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.eventType
              pattern: '{{.data}}\['
            - fieldName: event.pid
              pattern: '{{.integer}}\]:'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msgAll
          where: regexMatch("event.msgAll", "\\w+\\[[0-9]+\\]\\:")

      # ......................................................................#
      #  Removing unnecessary characters
      # ......................................................................#
      - trim:
          function: suffix
          substring: "["
          fields:
            - event.eventType
      - trim:
          function: suffix
          substring: "]:"
          fields:
            - event.pid

      # ......................................................................#
      # Format where the LENGTH, SESSIONID, ENTRYID, STATEMENT, USERID, USERHOST, ACTION, RETURNCODE, OBJ$CREATOR, OBJ$NAME, and OS$USERID fields exist
      # ......................................................................#
      # if ("LENGTH" in [message] or "SESSIONID" in [message] or "ENTRYID" in [message] or "STATEMENT" in [message] or "USERID" in [message] or "USERHOST" in [message] or "ACTION" in [message]
      # or "RETURNCODE" in [message] or "OBJ$CREATOR" in [message] or "OBJ$NAME" in [message] or "OS$USERID" in [message])
      # ......................................................................#
      # Using grok to parse msg individual fields
      # ......................................................................#
      # If "LENGTH:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(LENGTH:)'
            - fieldName: event.length
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "SESSIONID:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(SESSIONID:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.sessionID
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "ENTRYID:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(ENTRYID:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.entryID
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "STATEMENT:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(STATEMENT:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.statement
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "USERID:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(USERID:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.userID
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "USERHOST:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(USERHOST:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.userHost
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "ACTION:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(ACTION:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: action
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "RETURNCODE:" in [msg]
      # The return code is read wherever it sits, so optional keys that come
      # before it (TERMINAL, COMMENT$TEXT) no longer hide the outcome. It does
      # not consume log.msg, which is deleted below anyway.
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(.*?\s)?RETURNCODE:\[[0-9]+\]'
            - fieldName: event.returnCode
              pattern: '"[^"]*"'
          source: event.msg
          where: contains("event.msg", "RETURNCODE:")

      # ......................................................................#
      # If "OBJ$CREATOR:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(OBJ$CREATOR:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.objCreator
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "OBJ$NAME:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(OBJ$NAME:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.objName
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # If "OS$USERID:" in [msg]
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '(OS$USERID:)'
            - fieldName: event.irrelevant
              pattern: '\[{{.data}}\]'
            - fieldName: event.osUserID
              pattern: '\"{{.data}}\"'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................
      # Removing msg field
      # ......................................................................
      - delete:
          fields:
            - event.msg
          where: contains("event.msg", "LENGTH:") || contains("event.msg", "SESSIONID:") || contains("event.msg", "ENTRYID:") || contains("event.msg", "STATEMENT:") || contains("event.msg", "USERID:") || contains("event.msg", "USERHOST:") || contains("event.msg", "ACTION:") || contains("event.msg", "RETURNCODE:") || contains("event.msg", "OBJ$CREATOR:") || contains("event.msg", "OBJ$NAME:") || contains("event.msg", "OS$USERID:")

      # ......................................................................#
      # if ([msg]=~/from(.+)port/)
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}from(\s)'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}'
            - fieldName: event.irrelevant
              pattern: '(port)'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.restMsg
              pattern: '{{.greedy}}'
          source: event.msg
          where:  regexMatch("event.msg", "from(.+)port")

      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}from(\s)user(\s)'
            - fieldName: origin.user
              pattern: '{{.word}}'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}'
            - fieldName: event.irrelevant
              pattern: '(port)'
            - fieldName: origin.port
              pattern: '{{.greedy}}'
          source: event.msg
          where:  regexMatch("event.msg", "from(.+)port")

      # ......................................................................#
      # if restmsg contains protocol SSH  and SHA256
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: protocol
              pattern: '{{.data}}(\:)'
            - fieldName: event.sshKey
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}(\:)'
            - fieldName: origin.sha256
              pattern: '{{.greedy}}'
          source: event.restMsg
          where: contains("event.restMsg", "ssh") && contains("event.restMsg", "SHA256")
         
      # ......................................................................#
      # Fileds conversions
      # ......................................................................#
      - cast:
          fields:
            - origin.port
          to: int

      # ......................................................................#
      # Removing unnecessary characters
      # ......................................................................#
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.eventType
            - protocol

      # ......................................................................#
      # Using grok to parse msgAll
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.eventType
              pattern: '{{.word}}(\:)'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msgAll

      - grok:
          patterns:
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msgAll

      # ......................................................................#
      # Using grok to parse msgInit
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.eventType
              pattern: '{{.word}}(\:)'
            - fieldName: event.irrelevant
              pattern: '{{.data}}(\[)'
            - fieldName: event.pid
              pattern: '{{.integer}}(\])'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: event.msgInit
      # ......................................................................#

      # ......................................................................#
      # Removing unnecessary characters
      # ......................................................................#
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.eventType
            
      - trim:
          function: suffix
          substring: ']'
          fields:
            - event.pid

      # ......................................................................#
      # Removing unnecessary characters
      # ......................................................................#
      - trim:
          function: suffix
          substring: '"'
          fields:
            - event.length
            - event.sessionID
            - event.entryID
            - event.statement
            - event.userID
            - event.userHost
            - action
            - event.returnCode
            - event.objCreator
            - event.objName
            - event.osUserID
      
      - trim:
          function: prefix
          substring: '"'
          fields:
            - event.length
            - event.sessionID
            - event.entryID
            - event.statement
            - event.userID
            - event.userHost
            - action
            - event.returnCode
            - event.objCreator
            - event.objName
            - event.osUserID

      # ......................................................................#
      # sshd sign-in result, method and account:
      # "sshd[<pid>]: Accepted|Failed <method> for [invalid user ]<user> from <ip> port <n>"
      # The "Accepted key ... found at" line is an intermediate step and is not matched.
      # ......................................................................#
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '[^\s\[]+\[[0-9]+\]:'
            - fieldName: event.authResult
              pattern: '(Accepted|Failed)'
            - fieldName: event.authMethod
              pattern: '[^\s]+'
            - fieldName: event.irrelevant
              pattern: 'for(\s+invalid\s+user)?'
            - fieldName: origin.user
              pattern: '[^\s]+'
            - fieldName: event.irrelevant
              pattern: 'from'
          source: event.msgAll
          where: 'regexMatch("event.msgAll", "^sshd[^\\[ ]*\\[[0-9]+\\]: (Accepted|Failed) [^ ]+ for ")'

      # ......................................................................#
      # Adding action result: only success, failed or denied, or nothing when
      # the record states no final outcome. add overwrites, so the steps run
      # success, then failed, then denied.
      # success: Oracle audit RETURNCODE 0 (the operation completed), sshd
      #   Accepted, su "from <user> to <user>", and sudo lines that go straight
      #   to TTY= or PWD= (the command was allowed and run).
      # failed: any other Oracle RETURNCODE (for example 1017 wrong password,
      #   28000 account locked), sshd Failed, AIX "ssh: failed login attempt",
      #   su "BAD SU", sudo "incorrect password attempts" and AIX 3004-303
      #   "Login restricted" (account locked after too many failed logins).
      # denied: Oracle privilege refusals (1031 insufficient privileges, 1035
      #   restricted session, 1045 no CREATE SESSION privilege) and sudoers
      #   refusals (NOT in sudoers, NOT authorized on host, command not allowed).
      # ......................................................................#
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: '(exists("event.returnCode") && equals("event.returnCode", "0")) || equals("event.authResult", "Accepted") || regexMatch("event.msgAll", "^su: from [^ ]+ to ") || regexMatch("event.msgAll", "^sudo:\\s+[^ ]+ : (TTY|PWD)=")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: '(exists("event.returnCode") && !equals("event.returnCode", "0")) || equals("event.authResult", "Failed") || startsWith("event.msgAll", "syslog: ssh: failed login attempt for ") || startsWith("event.msgAll", "su: BAD SU from ") || regexMatch("event.msgAll", "^sudo:\\s+[^ ]+ : [0-9]+ incorrect password attempts? ; ") || regexMatch("event.msgAll", "^[^ ]+\\[[0-9]+\\]: Login restricted for [^ ]+: 3004-303 ")'
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: '(exists("event.returnCode") && oneOf("event.returnCode", ["1031", "1035", "1045"])) || regexMatch("event.msgAll", "^sudo:\\s+[^ ]+ : (user NOT in sudoers|user NOT authorized on host|command not allowed) ; ")'

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # ..........................................................................#
      # Remove issues fileds
      # ..........................................................................#
      - delete:
          fields:
            - event.irrelevant
            - event.msgWithTTY
            - event.msgAll
            - event.msgInit
            - event.restMsg