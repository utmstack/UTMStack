# IBM AS 400 filter version 4.1.0
# Support for JT400 Java Collector with full field mapping

pipeline:
  - dataTypes:
      - ibm-as400
    steps:
      # ========================================
      # PHASE 1: EXTRACTION
      # ========================================
      
      # Drop non-AS400 logs (internal system logs, noise)
      - drop:
          where: 'startsWith("raw", "[") || contains("raw", "RunExecutor") || contains("raw", "ETL pool")'

      # Parse JSON logs from Java collector
      - json:
          source: raw
          where: 'startsWith("raw", "{")'

      # Fallback: Parse non-JSON logs (raw syslog format)
      - grok:
          source: raw
          patterns:
            - fieldName: event.message
              pattern: '{{.greedy}}'
          where: '!startsWith("raw", "{")'

      # ========================================
      # PHASE 2: NORMALIZATION (Standard Schema)
      # ========================================

      # Map action/event classification
      - rename:
          from:
            - event.eventType
          to: action
          where: exists("event.eventType")

      # Map severity level
      - rename:
          from:
            - event.severityLabel
          to: severity
          where: exists("event.severityLabel")

      # Map origin side attributes
      - rename:
          from:
            - event.hostname
          to: origin.host
          where: exists("event.hostname")

      - rename:
          from:
            - event.jobUser
          to: origin.user
          where: exists("event.jobUser")

      - rename:
          from:
            - event.jobName
          to: origin.process
          where: exists("event.jobName")

      - rename:
          from:
            - event.sourceIp
          to: origin.ip
          where: exists("event.sourceIp")

      - rename:
          from:
            - event.file
          to: origin.file
          where: exists("event.file")

      # Map outcome and client address
      # CPIAD09 reports that a user from a client address connected to a host
      # server job; its text is localized and names the address after the word
      # client (cliente in Spanish). CPF2234 reports a password that is not
      # correct. Other messages, such as CPIAD0B, carry no final result.
      - grok:
          source: event.message
          patterns:
            - pattern: '(?i)^.*?\bclient\w*\s+'
            - fieldName: event.clientAddress
              pattern: '(?:[0-9]{1,3}\.){3}[0-9]{1,3}|[0-9A-Fa-f]{0,4}:[0-9A-Fa-f:.]*'
          where: equals("event.messageId", "CPIAD09") && !exists("origin.ip")

      - rename:
          from:
            - event.clientAddress
          to: origin.ip
          where: (inCIDR("event.clientAddress", "0.0.0.0/0") || inCIDR("event.clientAddress", "::/0")) && !inCIDR("event.clientAddress", "0.0.0.0/32") && !inCIDR("event.clientAddress", "::/128")

      - delete:
          fields:
            - event.clientAddress

      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.messageId", "CPIAD09")

      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("event.messageId", "CPF2234")

      # ========================================
      # PHASE 3: ENRICHMENT
      # ========================================
      
      # Add geolocation for source IP
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")