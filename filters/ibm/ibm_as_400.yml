# IBM AS 400 filter version 3.0.1
# Support Java Collector Syslog messsages

pipeline:
  - dataTypes:
      - ibm-as400
    steps:
      - json:
          source: raw
          where: contains("raw", "\"msg\":") && contains("raw", "\"args\":")

      - grok:
          source: raw
          patterns:
            - fieldName: log.message
              pattern: '{{.greedy}}'
          where: '!contains("raw", "\"msg\":") || !contains("raw", "\"args\":")'

      - rename:
          from:
            - log.hostname
          to: origin.host

      - rename:
          from:
            - log.sourceIp
          to: origin.ip

      - rename:
          from:
            - log.destinationIp
          to: target.ip

      - rename:
          from:
            - log.file
          to: origin.file

      - rename:
          from:
            - log.severityText
          to: severity

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")