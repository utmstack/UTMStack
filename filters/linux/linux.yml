# System Linux filter version 5.2.0
# Support for:
#   - systemd/journald JSON format (SCREAMINGSNAKECASE fields)
#   - Native auditd collector JSON format (type: "auditd")
# Converts SCREAMINGSNAKECASE and snakecase to camelCase
# Maps to UTMStack Standard Event Schema
# Optimized: Direct mapping to standard schema (no intermediate steps)

pipeline:
  - dataTypes:
      - linux
    steps:
      # ========================================
      # PHASE 1: EXTRACTION
      # ========================================

      # Parse JSON from systemd/journald
      - json:
          source: raw
          where: 'startsWith("raw", "{")'

      # ========================================
      # PHASE 2: FIELD NORMALIZATION (camelCase conversion)
      # ========================================

      # Convert SCREAMINGSNAKECASE to camelCase
      # Parsers on go-sdk v1.1.35 or later keep "_" in key names and older ones remove it,
      # so a journald key such as _HOSTNAME arrives as log._HOSTNAME or log.HOSTNAME.
      # Renames of those keys read both spellings.
      - rename:
          from:
            - log.MESSAGE
          to: log.message
          where: exists("log.MESSAGE")

      - rename:
          from:
            - log.PRIORITY
          to: log.priority
          where: exists("log.PRIORITY")

      - rename:
          from:
            - log.SYSLOGIDENTIFIER
            - log.SYSLOG_IDENTIFIER
          to: log.syslogIdentifier
          where: exists("log.SYSLOGIDENTIFIER") || exists("log.SYSLOG_IDENTIFIER")

      - rename:
          from:
            - log.SYSLOGTIMESTAMP
            - log.SYSLOG_TIMESTAMP
          to: log.syslogTimestamp
          where: exists("log.SYSLOGTIMESTAMP") || exists("log.SYSLOG_TIMESTAMP")

      - rename:
          from:
            - log.SYSLOGFACILITY
            - log.SYSLOG_FACILITY
          to: log.syslogFacility
          where: exists("log.SYSLOGFACILITY") || exists("log.SYSLOG_FACILITY")

      - rename:
          from:
            - log.SYSLOGPID
            - log.SYSLOG_PID
          to: log.syslogPid
          where: exists("log.SYSLOGPID") || exists("log.SYSLOG_PID")

      # Convert snakecase to camelCase (only for fields staying in log.*)
      - rename:
          from:
            - log.PID
            - log._PID
          to: log.pid
          where: exists("log.PID") || exists("log._PID")

      - rename:
          from:
            - log.UID
            - log._UID
          to: log.uid
          where: exists("log.UID") || exists("log._UID")

      - rename:
          from:
            - log.GID
            - log._GID
          to: log.gid
          where: exists("log.GID") || exists("log._GID")

      - rename:
          from:
            - log.TID
          to: log.tid
          where: exists("log.TID")

      - rename:
          from:
            - log.EXE
            - log._EXE
          to: log.exe
          where: exists("log.EXE") || exists("log._EXE")

      - rename:
          from:
            - log.UNIT
          to: log.unit
          where: exists("log.UNIT")

      - rename:
          from:
            - log.SYSTEMDUNIT
            - log._SYSTEMD_UNIT
          to: log.systemdUnit
          where: exists("log.SYSTEMDUNIT") || exists("log._SYSTEMD_UNIT")

      - rename:
          from:
            - log.SYSTEMDSLICE
            - log._SYSTEMD_SLICE
          to: log.systemdSlice
          where: exists("log.SYSTEMDSLICE") || exists("log._SYSTEMD_SLICE")

      - rename:
          from:
            - log.SYSTEMDUSERSLICE
            - log._SYSTEMD_USER_SLICE
          to: log.systemdUserSlice
          where: exists("log.SYSTEMDUSERSLICE") || exists("log._SYSTEMD_USER_SLICE")

      - rename:
          from:
            - log.SYSTEMDSESSION
            - log._SYSTEMD_SESSION
          to: log.systemdSession
          where: exists("log.SYSTEMDSESSION") || exists("log._SYSTEMD_SESSION")

      - rename:
          from:
            - log.SESSIONID
            - log.SESSION_ID
          to: log.sessionId
          where: exists("log.SESSIONID") || exists("log.SESSION_ID")

      - rename:
          from:
            - log.LEADER
          to: log.leader
          where: exists("log.LEADER")

      - rename:
          from:
            - log.SYSTEMDOWNERUID
            - log._SYSTEMD_OWNER_UID
          to: log.systemdOwnerUid
          where: exists("log.SYSTEMDOWNERUID") || exists("log._SYSTEMD_OWNER_UID")

      - rename:
          from:
            - log.SYSTEMDCGROUP
            - log._SYSTEMD_CGROUP
          to: log.systemdCgroup
          where: exists("log.SYSTEMDCGROUP") || exists("log._SYSTEMD_CGROUP")

      - rename:
          from:
            - log.BOOTID
            - log._BOOT_ID
          to: log.bootId
          where: exists("log.BOOTID") || exists("log._BOOT_ID")

      - rename:
          from:
            - log.MACHINEID
            - log._MACHINE_ID
          to: log.machineId
          where: exists("log.MACHINEID") || exists("log._MACHINE_ID")

      - rename:
          from:
            - log.TRANSPORT
            - log._TRANSPORT
          to: log.transport
          where: exists("log.TRANSPORT") || exists("log._TRANSPORT")

      - rename:
          from:
            - log.SELINUXCONTEXT
            - log._SELINUX_CONTEXT
          to: log.selinuxContext
          where: exists("log.SELINUXCONTEXT") || exists("log._SELINUX_CONTEXT")

      - rename:
          from:
            - log.AUDITSESSION
            - log._AUDIT_SESSION
          to: log.auditSession
          where: exists("log.AUDITSESSION") || exists("log._AUDIT_SESSION")

      - rename:
          from:
            - log.AUDITLOGINUID
            - log._AUDIT_LOGINUID
          to: log.auditLoginUid
          where: exists("log.AUDITLOGINUID") || exists("log._AUDIT_LOGINUID")

      - rename:
          from:
            - log.CAPEFFECTIVE
            - log._CAP_EFFECTIVE
          to: log.capEffective
          where: exists("log.CAPEFFECTIVE") || exists("log._CAP_EFFECTIVE")

      - rename:
          from:
            - log.REALTIMETIMESTAMP
            - log.__REALTIME_TIMESTAMP
          to: log.realtimeTimestamp
          where: exists("log.REALTIMETIMESTAMP") || exists("log.__REALTIME_TIMESTAMP")

      - rename:
          from:
            - log.SOURCEREALTIMETIMESTAMP
            - log._SOURCE_REALTIME_TIMESTAMP
          to: log.sourceRealtimeTimestamp
          where: exists("log.SOURCEREALTIMETIMESTAMP") || exists("log._SOURCE_REALTIME_TIMESTAMP")

      - rename:
          from:
            - log.MONOTONICTIMESTAMP
            - log.__MONOTONIC_TIMESTAMP
          to: log.monotonicTimestamp
          where: exists("log.MONOTONICTIMESTAMP") || exists("log.__MONOTONIC_TIMESTAMP")

      - rename:
          from:
            - log.CURSOR
            - log.__CURSOR
          to: log.cursor
          where: exists("log.CURSOR") || exists("log.__CURSOR")

      - rename:
          from:
            - log.SEQNUM
            - log.__SEQNUM
          to: log.seqnum
          where: exists("log.SEQNUM") || exists("log.__SEQNUM")

      - rename:
          from:
            - log.SEQNUMID
            - log.__SEQNUM_ID
          to: log.seqnumId
          where: exists("log.SEQNUMID") || exists("log.__SEQNUM_ID")

      - rename:
          from:
            - log.RUNTIMESCOPE
            - log._RUNTIME_SCOPE
          to: log.runtimeScope
          where: exists("log.RUNTIMESCOPE") || exists("log._RUNTIME_SCOPE")

      - rename:
          from:
            - log.STREAMID
            - log._STREAM_ID
          to: log.streamId
          where: exists("log.STREAMID") || exists("log._STREAM_ID")

      - rename:
          from:
            - log.SYSTEMDINVOCATIONID
            - log._SYSTEMD_INVOCATION_ID
          to: log.systemdInvocationId
          where: exists("log.SYSTEMDINVOCATIONID") || exists("log._SYSTEMD_INVOCATION_ID")

      - rename:
          from:
            - log.CODEFILE
            - log.CODE_FILE
          to: log.codeFile
          where: exists("log.CODEFILE") || exists("log.CODE_FILE")

      - rename:
          from:
            - log.CODELINE
            - log.CODE_LINE
          to: log.codeLine
          where: exists("log.CODELINE") || exists("log.CODE_LINE")

      - rename:
          from:
            - log.CODEFUNC
            - log.CODE_FUNC
          to: log.codeFunc
          where: exists("log.CODEFUNC") || exists("log.CODE_FUNC")

      - rename:
          from:
            - log.INVOCATIONID
            - log.INVOCATION_ID
          to: log.invocationId
          where: exists("log.INVOCATIONID") || exists("log.INVOCATION_ID")

      - rename:
          from:
            - log.JOBID
            - log.JOB_ID
          to: log.jobId
          where: exists("log.JOBID") || exists("log.JOB_ID")

      - rename:
          from:
            - log.JOBTYPE
            - log.JOB_TYPE
          to: log.jobType
          where: exists("log.JOBTYPE") || exists("log.JOB_TYPE")

      - rename:
          from:
            - log.MESSAGEID
            - log.MESSAGE_ID
          to: log.messageId
          where: exists("log.MESSAGEID") || exists("log.MESSAGE_ID")

      - rename:
          from:
            - log.CPUUSAGENSEC
            - log.CPU_USAGE_NSEC
          to: log.cpuUsageNsec
          where: exists("log.CPUUSAGENSEC") || exists("log.CPU_USAGE_NSEC")

      - rename:
          from:
            - log.MEMORYPEAK
            - log.MEMORY_PEAK
          to: log.memoryPeak
          where: exists("log.MEMORYPEAK") || exists("log.MEMORY_PEAK")

      - rename:
          from:
            - log.MEMORYSWAPPEAK
            - log.MEMORY_SWAP_PEAK
          to: log.memorySwapPeak
          where: exists("log.MEMORYSWAPPEAK") || exists("log.MEMORY_SWAP_PEAK")

      # ========================================
      # PHASE 3: STANDARD SCHEMA MAPPING
      # ========================================

      # Map directly to Standard Event Schema (no intermediate camelCase step)
      - rename:
          from:
            - log.HOSTNAME
            - log._HOSTNAME
          to: origin.host
          where: exists("log.HOSTNAME") || exists("log._HOSTNAME")

      - rename:
          from:
            - log.USERID
            - log.USER_ID
          to: origin.user
          where: exists("log.USERID") || exists("log.USER_ID")

      - rename:
          from:
            - log.COMM
            - log._COMM
          to: origin.process
          where: exists("log.COMM") || exists("log._COMM")

      - rename:
          from:
            - log.CMDLINE
            - log._CMDLINE
          to: origin.command
          where: exists("log.CMDLINE") || exists("log._CMDLINE")

      # Map syslog priority (0-7) to severity labels
      - add:
          function: string
          params:
            key: severity
            value: "emergency"
          where: 'equals("log.priority", "0")'

      - add:
          function: string
          params:
            key: severity
            value: "alert"
          where: 'equals("log.priority", "1")'

      - add:
          function: string
          params:
            key: severity
            value: "critical"
          where: 'equals("log.priority", "2")'

      - add:
          function: string
          params:
            key: severity
            value: "error"
          where: 'equals("log.priority", "3")'

      - add:
          function: string
          params:
            key: severity
            value: "warning"
          where: 'equals("log.priority", "4")'

      - add:
          function: string
          params:
            key: severity
            value: "notice"
          where: 'equals("log.priority", "5")'

      - add:
          function: string
          params:
            key: severity
            value: "info"
          where: 'equals("log.priority", "6")'

      - add:
          function: string
          params:
            key: severity
            value: "debug"
          where: 'equals("log.priority", "7")'

      # ========================================
      # PHASE 4: AUDITD NORMALIZATION
      # Process only when log.type == "auditd"
      # Auditd logs have lowercase fields and type: "auditd"
      # ========================================

      # Map auditd syscall to action (primary action identifier)
      - rename:
          from:
            - log.syscall
          to: action
          where: 'equals("log.type", "auditd") && exists("log.syscall")'

      # Fallback: map category to action if syscall not present
      - rename:
          from:
            - log.category
          to: action
          where: 'equals("log.type", "auditd") && !exists("action") && exists("log.category")'

      # Derive documented final outcomes, retaining their vendor fields.
      # Do not promote job cancellation/skipping or unknown values to success.
      - delete:
          fields: [actionResult]

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            !equals("log.type", "auditd") &&
            (equals("log.JOBRESULT", "done") || equals("log.JOB_RESULT", "done")) &&
            (!exists("log.JOBRESULT") || equals("log.JOBRESULT", "done")) &&
            (!exists("log.JOB_RESULT") || equals("log.JOB_RESULT", "done"))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            !equals("log.type", "auditd") &&
            (oneOf("log.JOBRESULT", ["failed", "timeout", "dependency"]) ||
             oneOf("log.JOB_RESULT", ["failed", "timeout", "dependency"]))

      # The native collector flattens SYSCALL results to the root. Its pinned
      # audit parser emits success/fail, and can decode negative exits to errno names.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.type", "auditd") && equals("log.category", "SYSCALL") &&
            equals("log.result", "success") &&
            (!exists("log.exit") || (regexMatch("log.exit", "^[0-9]+$") && greaterOrEqual("log.exit", 0)))

      # A nonblocking connect still in progress has no final connection outcome.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.type", "auditd") && equals("log.category", "SYSCALL") &&
            equals("log.result", "fail") &&
            !(equals("action", "connect") &&
              oneOf("log.exit", ["EINPROGRESS", "EALREADY", "EAGAIN", "EWOULDBLOCK", "-115", "-114", "-11"]))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.type", "auditd") && equals("log.category", "SYSCALL") &&
            equals("log.result", "fail") && oneOf("log.exit", ["EACCES", "EPERM", "-13", "-1"])

      # USER_LOGIN is the completed-login record; USER_AUTH/USER_ACCT are earlier
      # checks. Repeated records become arrays and deliberately remain ambiguous.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_LOGIN") &&
            equals("log.userlogin.result", "success") && !exists("log.result")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_LOGIN") &&
            equals("log.userlogin.result", "fail") && !exists("log.result")

      # USER_AUTH is PAM's authentication decision (a wrong password is res=failed) and
      # USER_ACCT its account check (a refusal, for example by pam_access or an expired
      # account, is res=failed). Each states the final result of its own step.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.type", "auditd") && oneOf("action", ["USER_AUTH", "USER_ACCT"]) &&
            (equals("log.userauth.result", "success") || equals("log.useracct.result", "success")) &&
            !exists("log.result")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_AUTH") &&
            equals("log.userauth.result", "fail") && !exists("log.result")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_ACCT") &&
            equals("log.useracct.result", "fail") && !exists("log.result")

      # Account and group management records state the result of the change they describe.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.type", "auditd") && !exists("log.result") &&
            (equals("log.adduser.result", "success") || equals("log.deluser.result", "success") ||
             equals("log.addgroup.result", "success") || equals("log.delgroup.result", "success") ||
             equals("log.usermgmt.result", "success") || equals("log.grpmgmt.result", "success") ||
             equals("log.userchauthtok.result", "success") || equals("log.acctlock.result", "success") ||
             equals("log.acctunlock.result", "success"))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.type", "auditd") && !exists("log.result") &&
            (equals("log.adduser.result", "fail") || equals("log.deluser.result", "fail") ||
             equals("log.addgroup.result", "fail") || equals("log.delgroup.result", "fail") ||
             equals("log.usermgmt.result", "fail") || equals("log.grpmgmt.result", "fail") ||
             equals("log.userchauthtok.result", "fail") || equals("log.acctlock.result", "fail") ||
             equals("log.acctunlock.result", "fail"))

      # A standalone AVC record is an enforced refusal only for AppArmor DENIED or SELinux
      # denied with permissive=0. AppArmor STATUS, AUDIT and ALLOWED, SELinux permissive=1
      # and a missing permissive flag refused nothing, so they stay empty.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.type", "auditd") && equals("action", "AVC") &&
            (equals("log.avc.apparmor", "DENIED") ||
             (equals("log.avc.seresult", "denied") && equals("log.avc.permissive", "0")))

      # USER_LOGIN addr is the user's network address. Preserve the original,
      # and expose only a valid, non-unspecified peer address to correlation.
      - grok:
          source: log.userlogin.addr
          patterns:
            - fieldName: origin.ip
              pattern: (?s:.*)
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_LOGIN") &&
            (inCIDR("log.userlogin.addr", "0.0.0.0/0") || inCIDR("log.userlogin.addr", "::/0")) &&
            !inCIDR("log.userlogin.addr", "0.0.0.0/32") && !inCIDR("log.userlogin.addr", "::/128")

      # The USER_AUTH and USER_ACCT peer address, with the same guard, only on records that
      # carry an outcome.
      - grok:
          source: log.userauth.addr
          patterns:
            - fieldName: origin.ip
              pattern: (?s:.*)
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_AUTH") && exists("actionResult") &&
            (inCIDR("log.userauth.addr", "0.0.0.0/0") || inCIDR("log.userauth.addr", "::/0")) &&
            !inCIDR("log.userauth.addr", "0.0.0.0/32") && !inCIDR("log.userauth.addr", "::/128")

      - grok:
          source: log.useracct.addr
          patterns:
            - fieldName: origin.ip
              pattern: (?s:.*)
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_ACCT") && exists("actionResult") &&
            (inCIDR("log.useracct.addr", "0.0.0.0/0") || inCIDR("log.useracct.addr", "::/0")) &&
            !inCIDR("log.useracct.addr", "0.0.0.0/32") && !inCIDR("log.useracct.addr", "::/128")

      # Journald copies of audit records (_TRANSPORT=audit) get the outcomes of the native
      # records above. Parsers on go-sdk v1.1.35 or later keep "_" in these keys
      # (_AUDIT_TYPE_NAME, AUDIT_FIELD_RES); older ones remove it (AUDITTYPENAME, AUDITFIELDRES).
      # No address is promoted from these copies.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.transport", "audit") &&
            (oneOf("log._AUDIT_TYPE_NAME", ["USER_LOGIN", "USER_AUTH", "USER_ACCT", "ADD_USER", "DEL_USER", "ADD_GROUP", "DEL_GROUP", "USER_MGMT", "GRP_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK"]) ||
             oneOf("log.AUDITTYPENAME", ["USER_LOGIN", "USER_AUTH", "USER_ACCT", "ADD_USER", "DEL_USER", "ADD_GROUP", "DEL_GROUP", "USER_MGMT", "GRP_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK"])) &&
            (equals("log.AUDIT_FIELD_RES", "success") || equals("log.AUDITFIELDRES", "success"))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.transport", "audit") &&
            (oneOf("log._AUDIT_TYPE_NAME", ["USER_LOGIN", "USER_AUTH", "ADD_USER", "DEL_USER", "ADD_GROUP", "DEL_GROUP", "USER_MGMT", "GRP_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK"]) ||
             oneOf("log.AUDITTYPENAME", ["USER_LOGIN", "USER_AUTH", "ADD_USER", "DEL_USER", "ADD_GROUP", "DEL_GROUP", "USER_MGMT", "GRP_MGMT", "USER_CHAUTHTOK", "ACCT_LOCK", "ACCT_UNLOCK"])) &&
            (equals("log.AUDIT_FIELD_RES", "failed") || equals("log.AUDITFIELDRES", "failed"))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.transport", "audit") &&
            (equals("log._AUDIT_TYPE_NAME", "USER_ACCT") || equals("log.AUDITTYPENAME", "USER_ACCT")) &&
            (equals("log.AUDIT_FIELD_RES", "failed") || equals("log.AUDITFIELDRES", "failed"))

      # Journald SYSCALL copies carry success=yes|no and a signed decimal exit, but only the
      # syscall number. A would-block or in-progress exit (-115, -114, -11) stays empty for
      # every syscall, because the number alone does not reliably name connect.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.transport", "audit") &&
            (equals("log._AUDIT_TYPE_NAME", "SYSCALL") || equals("log.AUDITTYPENAME", "SYSCALL")) &&
            (equals("log._AUDIT_FIELD_SUCCESS", "yes") || equals("log.AUDITFIELDSUCCESS", "yes")) &&
            (regexMatch("log._AUDIT_FIELD_EXIT", "^[0-9]+$") || regexMatch("log.AUDITFIELDEXIT", "^[0-9]+$") ||
             (!exists("log._AUDIT_FIELD_EXIT") && !exists("log.AUDITFIELDEXIT")))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.transport", "audit") &&
            (equals("log._AUDIT_TYPE_NAME", "SYSCALL") || equals("log.AUDITTYPENAME", "SYSCALL")) &&
            (equals("log._AUDIT_FIELD_SUCCESS", "no") || equals("log.AUDITFIELDSUCCESS", "no")) &&
            !oneOf("log._AUDIT_FIELD_EXIT", ["-115", "-114", "-11"]) && !oneOf("log.AUDITFIELDEXIT", ["-115", "-114", "-11"])

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.transport", "audit") &&
            (equals("log._AUDIT_TYPE_NAME", "SYSCALL") || equals("log.AUDITTYPENAME", "SYSCALL")) &&
            (equals("log._AUDIT_FIELD_SUCCESS", "no") || equals("log.AUDITFIELDSUCCESS", "no")) &&
            (oneOf("log._AUDIT_FIELD_EXIT", ["-13", "-1"]) || oneOf("log.AUDITFIELDEXIT", ["-13", "-1"]))

      # Journald keeps the quotes of the kernel's apparmor="DENIED".
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.transport", "audit") &&
            (equals("log._AUDIT_TYPE_NAME", "AVC") || equals("log.AUDITTYPENAME", "AVC")) &&
            (oneOf("log._AUDIT_FIELD_APPARMOR", ["DENIED", "\"DENIED\""]) || oneOf("log.AUDITFIELDAPPARMOR", ["DENIED", "\"DENIED\""]))

      # Kernel netfilter LOG lines (UFW, CSF, firewalld, custom iptables or nftables prefixes)
      # carry SRC, DST, PROTO, SPT and DPT as key=value text. Only a prefix that names a
      # refusal (drop, reject, block, deny, invalid) states an outcome; UFW AUDIT and ALLOW
      # lines and prefixes with an unknown verdict stay empty and keep their addresses in the
      # message.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.transport", "kernel") &&
            contains("log.message", " SRC=") && contains("log.message", " DST=") &&
            regexMatch("log.message", "^[^=]*(?i:drop|reject|block|deny|invalid)[^=]*IN=") &&
            !regexMatch("log.message", "^[^=]*(?i:audit|allow|accept)[^=]*IN=")

      - kv:
          source: log.message
          fieldSplit: " "
          valueSplit: "="
          where: >-
            equals("log.transport", "kernel") && equals("actionResult", "denied") &&
            contains("log.message", " SRC=") && contains("log.message", " DST=")

      - grok:
          source: log.SRC
          patterns:
            - fieldName: origin.ip
              pattern: (?s:.*)
          where: >-
            equals("log.transport", "kernel") && equals("actionResult", "denied") &&
            (inCIDR("log.SRC", "0.0.0.0/0") || inCIDR("log.SRC", "::/0")) &&
            !inCIDR("log.SRC", "0.0.0.0/32") && !inCIDR("log.SRC", "::/128")

      - grok:
          source: log.DST
          patterns:
            - fieldName: target.ip
              pattern: (?s:.*)
          where: >-
            equals("log.transport", "kernel") && equals("actionResult", "denied") &&
            (inCIDR("log.DST", "0.0.0.0/0") || inCIDR("log.DST", "::/0")) &&
            !inCIDR("log.DST", "0.0.0.0/32") && !inCIDR("log.DST", "::/128")

      - grok:
          source: log.SPT
          patterns:
            - fieldName: origin.port
              pattern: (?s:.*)
          where: >-
            equals("log.transport", "kernel") && equals("actionResult", "denied") &&
            exists("origin.ip") && regexMatch("log.SPT", "^[0-9]{1,5}$")

      - grok:
          source: log.DPT
          patterns:
            - fieldName: target.port
              pattern: (?s:.*)
          where: >-
            equals("log.transport", "kernel") && equals("actionResult", "denied") &&
            exists("target.ip") && regexMatch("log.DPT", "^[0-9]{1,5}$")

      - add:
          function: 'string'
          params:
            key: protocol
            value: 'tcp'
          where: 'equals("log.transport", "kernel") && equals("actionResult", "denied") && equals("log.PROTO", "TCP")'

      - add:
          function: 'string'
          params:
            key: protocol
            value: 'udp'
          where: 'equals("log.transport", "kernel") && equals("actionResult", "denied") && equals("log.PROTO", "UDP")'

      # OpenSSH, PAM, unix_chkpwd and sudo lines from journald. Each sshd form has its own
      # step, guarded by a regex over the whole form, because the grok step matches each
      # pattern alone. The peer lands in log.sshRemoteIp; it becomes origin.ip below only on
      # lines that state an outcome. log.message is kept.

      # "Failed|Accepted <method> for invalid user <name> from <ip> port <n> ..."
      - grok:
          source: log.message
          patterns:
            - pattern: '(?:Failed|Accepted)'
            - fieldName: log.sshMethod
              pattern: '\S+'
            - pattern: 'for\s+invalid\s+user'
            - pattern: '\S+'
            - pattern: 'from'
            - fieldName: log.sshRemoteIp
              pattern: '\S+'
            - pattern: 'port'
            - fieldName: log.sshRemotePort
              pattern: '[0-9]{1,5}'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^(?:Failed|Accepted) \\S+ for invalid user \\S+ from \\S+ port [0-9]{1,5}(?: |$)")

      # "Failed|Accepted <method> for <name> from <ip> port <n> ..." (exactly one name token)
      - grok:
          source: log.message
          patterns:
            - pattern: '(?:Failed|Accepted)'
            - fieldName: log.sshMethod
              pattern: '\S+'
            - pattern: 'for'
            - pattern: '\S+'
            - pattern: 'from'
            - fieldName: log.sshRemoteIp
              pattern: '\S+'
            - pattern: 'port'
            - fieldName: log.sshRemotePort
              pattern: '[0-9]{1,5}'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^(?:Failed|Accepted) \\S+ for \\S+ from \\S+ port [0-9]{1,5}(?: |$)")

      # "Invalid user <name> from <ip> port <n>"
      - grok:
          source: log.message
          patterns:
            - pattern: 'Invalid\s+user'
            - pattern: '\S+'
            - pattern: 'from'
            - fieldName: log.sshRemoteIp
              pattern: '\S+'
            - pattern: 'port'
            - fieldName: log.sshRemotePort
              pattern: '[0-9]{1,5}'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^Invalid user \\S+ from \\S+ port [0-9]{1,5}(?: |$)")

      # "Disconnected from|Connection closed by (invalid|authenticating) user <name> <ip> port <n>"
      - grok:
          source: log.message
          patterns:
            - pattern: '(?:Disconnected\s+from|Connection\s+closed\s+by)\s+(?:invalid\s+user|authenticating\s+user|user)'
            - pattern: '\S+'
            - fieldName: log.sshRemoteIp
              pattern: '\S+'
            - pattern: 'port'
            - fieldName: log.sshRemotePort
              pattern: '[0-9]{1,5}'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^(?:Disconnected from|Connection closed by) (?:invalid user|authenticating user|user) \\S+ \\S+ port [0-9]{1,5}(?:[ :]|$)")

      # Connection-level lines that name only the peer
      - grok:
          source: log.message
          patterns:
            - pattern: '(?:Received\s+disconnect\s+from|Connection\s+closed\s+by|Disconnected\s+from|Unable\s+to\s+negotiate\s+with|Did\s+not\s+receive\s+identification\s+string\s+from|Connection\s+reset\s+by|Timeout\s+before\s+authentication\s+for|banner\s+exchange:\s+Connection\s+from)'
            - fieldName: log.sshRemoteIp
              pattern: '\S+'
            - pattern: 'port'
            - fieldName: log.sshRemotePort
              pattern: '[0-9]{1,5}'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^(?:Received disconnect from|Connection closed by|Disconnected from|Unable to negotiate with|Did not receive identification string from|Connection reset by|Timeout before authentication for|banner exchange: Connection from) \\S+ port [0-9]{1,5}(?:[ :]|$)")

      # PAM "pam_unix(<service>:auth): authentication failure; ... rhost=<peer> ..."
      - grok:
          source: log.message
          patterns:
            - pattern: 'pam_unix\([^:()\s]+:auth\):\s+authentication\s+failure;.*?\srhost='
            - fieldName: log.pamRhost
              pattern: '[^\s=]+'
          where: >-
            regexMatch("log.message", "^pam_unix\\([^:()\\s]+:auth\\): authentication failure;.* rhost=[^\\s=]+(?: |$)")

      - grok:
          source: log.pamRhost
          patterns:
            - fieldName: log.sshRemoteIp
              pattern: (?s:.*)
          where: >-
            exists("log.pamRhost") && !exists("log.sshRemoteIp") &&
            (inCIDR("log.pamRhost", "0.0.0.0/0") || inCIDR("log.pamRhost", "::/0"))

      # Final outcomes: an accepted or failed authentication, a PAM or unix_chkpwd password
      # failure, and sudo's decision. Session notices and session ends get none.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^Accepted \\S+ for ")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) &&
            regexMatch("log.message", "^Failed \\S+ for ")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            regexMatch("log.message", "^pam_unix\\([^:()\\s]+:auth\\): authentication failure;") ||
            (equals("log.syslogIdentifier", "unix_chkpwd") && regexMatch("log.message", "^password check failed for user "))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.syslogIdentifier", "sudo") &&
            regexMatch("log.message", "^\\s*[^\\s:;]+ : (?:TTY|PWD)=[^;]* ; (?:[^;]*; )*USER=[^\\s;]+ ; COMMAND=\\S")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            equals("log.syslogIdentifier", "sudo") &&
            regexMatch("log.message", "^\\s*[^\\s:;]+ : (?:[0-9]+ incorrect password attempts?|a password is required) ; ")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.syslogIdentifier", "sudo") &&
            regexMatch("log.message", "^\\s*[^\\s:;]+ : (?:command not allowed|user NOT in sudoers|user NOT authorized on host) ; ")

      # An SSH connection that ended before any user signed in (sshd marks these "[preauth]",
      # or names an invalid user or a failed handshake) is a failed attempt. "Postponed" is a
      # step inside a public-key sign-in, and session ends after a sign-in, stay empty.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: >-
            oneOf("log.syslogIdentifier", ["sshd", "sshd-session"]) && !exists("actionResult") &&
            !regexMatch("log.message", "^Postponed ") &&
            (regexMatch("log.message", "\\[preauth\\]\\s*$") ||
             regexMatch("log.message", "^(?:Invalid user \\S+ from |Did not receive identification string from |Unable to negotiate with |banner exchange: Connection from |Timeout before authentication for |Connection closed by (?:invalid|authenticating) user |Disconnected from (?:invalid|authenticating) user )"))

      # The SSH or PAM peer becomes origin.ip only when it is a valid, specified IP and the
      # line states an outcome.
      - rename:
          from:
            - log.sshRemoteIp
          to: origin.ip
          where: >-
            exists("log.sshRemoteIp") && exists("actionResult") && !exists("origin.ip") &&
            (inCIDR("log.sshRemoteIp", "0.0.0.0/0") || inCIDR("log.sshRemoteIp", "::/0")) &&
            !inCIDR("log.sshRemoteIp", "0.0.0.0/32") && !inCIDR("log.sshRemoteIp", "::/128")

      - rename:
          from:
            - log.sshRemotePort
          to: origin.port
          where: 'exists("log.sshRemotePort") && exists("origin.ip") && !exists("log.sshRemoteIp") && !exists("origin.port")'

      - cast:
          fields: [origin.port]
          to: int
          where: 'exists("origin.port")'

      - cast:
          fields: [target.port]
          to: int
          where: 'exists("target.port")'

      # Map exe to origin.process (full path to executable)
      # Only if journald's COMM didn't already set origin.process
      - rename:
          from:
            - log.exe
          to: origin.process
          where: 'equals("log.type", "auditd") && exists("log.exe") && !exists("origin.process")'

      # Fallback: map auditd comm to origin.process if exe not mapped
      - rename:
          from:
            - log.comm
          to: origin.process
          where: 'equals("log.type", "auditd") && !exists("origin.process") && exists("log.comm")'

      # Map proctitle to origin.command (full command line)
      - rename:
          from:
            - log.proctitle
          to: origin.command
          where: 'equals("log.type", "auditd") && exists("log.proctitle")'

      # Map cwd to origin.path (current working directory)
      - rename:
          from:
            - log.cwd
          to: origin.path
          where: 'equals("log.type", "auditd") && exists("log.cwd")'

      # statusCode is uint32. Preserve signed/decoded errno values under log.exit;
      # copying only an in-range integer avoids rejecting the entire Event.
      - grok:
          source: log.exit
          patterns:
            - fieldName: statusCode
              pattern: (?s:.*)
          where: >-
            equals("log.type", "auditd") && regexMatch("log.exit", "^[0-9]+$") &&
            greaterOrEqual("log.exit", 0) && lessOrEqual("log.exit", 4294967295)

      # Cast statusCode to integer (proto schema expects uint32)
      - cast:
          fields: [statusCode]
          to: int
          where: 'equals("log.type", "auditd") && exists("statusCode")'
