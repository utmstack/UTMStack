# System Linux filter version 5.1.0
# Support for:
#   - systemd/journald JSON format (SCREAMINGSNAKECASE fields)
#   - Native auditd collector JSON format (type: "auditd")
# Converts SCREAMINGSNAKECASE and snakecase to camelCase
# Maps to UTMStack Standard Event Schema
# Optimized: Direct mapping to standard schema (no intermediate steps)

pipeline:
  - dataTypes:
      - linux
    steps:
      # ========================================
      # PHASE 1: EXTRACTION
      # ========================================

      # Parse JSON from systemd/journald
      - json:
          source: raw
          where: 'startsWith("raw", "{")'

      # ========================================
      # PHASE 2: FIELD NORMALIZATION (camelCase conversion)
      # ========================================

      # Convert SCREAMINGSNAKECASE to camelCase
      # Parsers on go-sdk v1.1.35 or later keep "_" in key names and older ones remove it,
      # so a journald key such as _HOSTNAME arrives as log._HOSTNAME or log.HOSTNAME.
      # Renames of those keys read both spellings.
      - rename:
          from:
            - log.MESSAGE
          to: log.message
          where: exists("log.MESSAGE")

      - rename:
          from:
            - log.PRIORITY
          to: log.priority
          where: exists("log.PRIORITY")

      - rename:
          from:
            - log.SYSLOGIDENTIFIER
            - log.SYSLOG_IDENTIFIER
          to: log.syslogIdentifier
          where: exists("log.SYSLOGIDENTIFIER") || exists("log.SYSLOG_IDENTIFIER")

      - rename:
          from:
            - log.SYSLOGTIMESTAMP
            - log.SYSLOG_TIMESTAMP
          to: log.syslogTimestamp
          where: exists("log.SYSLOGTIMESTAMP") || exists("log.SYSLOG_TIMESTAMP")

      - rename:
          from:
            - log.SYSLOGFACILITY
            - log.SYSLOG_FACILITY
          to: log.syslogFacility
          where: exists("log.SYSLOGFACILITY") || exists("log.SYSLOG_FACILITY")

      - rename:
          from:
            - log.SYSLOGPID
            - log.SYSLOG_PID
          to: log.syslogPid
          where: exists("log.SYSLOGPID") || exists("log.SYSLOG_PID")

      # Convert snakecase to camelCase (only for fields staying in log.*)
      - rename:
          from:
            - log.PID
            - log._PID
          to: log.pid
          where: exists("log.PID") || exists("log._PID")

      - rename:
          from:
            - log.UID
            - log._UID
          to: log.uid
          where: exists("log.UID") || exists("log._UID")

      - rename:
          from:
            - log.GID
            - log._GID
          to: log.gid
          where: exists("log.GID") || exists("log._GID")

      - rename:
          from:
            - log.TID
          to: log.tid
          where: exists("log.TID")

      - rename:
          from:
            - log.EXE
            - log._EXE
          to: log.exe
          where: exists("log.EXE") || exists("log._EXE")

      - rename:
          from:
            - log.UNIT
          to: log.unit
          where: exists("log.UNIT")

      - rename:
          from:
            - log.SYSTEMDUNIT
            - log._SYSTEMD_UNIT
          to: log.systemdUnit
          where: exists("log.SYSTEMDUNIT") || exists("log._SYSTEMD_UNIT")

      - rename:
          from:
            - log.SYSTEMDSLICE
            - log._SYSTEMD_SLICE
          to: log.systemdSlice
          where: exists("log.SYSTEMDSLICE") || exists("log._SYSTEMD_SLICE")

      - rename:
          from:
            - log.SYSTEMDUSERSLICE
            - log._SYSTEMD_USER_SLICE
          to: log.systemdUserSlice
          where: exists("log.SYSTEMDUSERSLICE") || exists("log._SYSTEMD_USER_SLICE")

      - rename:
          from:
            - log.SYSTEMDSESSION
            - log._SYSTEMD_SESSION
          to: log.systemdSession
          where: exists("log.SYSTEMDSESSION") || exists("log._SYSTEMD_SESSION")

      - rename:
          from:
            - log.SESSIONID
            - log.SESSION_ID
          to: log.sessionId
          where: exists("log.SESSIONID") || exists("log.SESSION_ID")

      - rename:
          from:
            - log.LEADER
          to: log.leader
          where: exists("log.LEADER")

      - rename:
          from:
            - log.SYSTEMDOWNERUID
            - log._SYSTEMD_OWNER_UID
          to: log.systemdOwnerUid
          where: exists("log.SYSTEMDOWNERUID") || exists("log._SYSTEMD_OWNER_UID")

      - rename:
          from:
            - log.SYSTEMDCGROUP
            - log._SYSTEMD_CGROUP
          to: log.systemdCgroup
          where: exists("log.SYSTEMDCGROUP") || exists("log._SYSTEMD_CGROUP")

      - rename:
          from:
            - log.BOOTID
            - log._BOOT_ID
          to: log.bootId
          where: exists("log.BOOTID") || exists("log._BOOT_ID")

      - rename:
          from:
            - log.MACHINEID
            - log._MACHINE_ID
          to: log.machineId
          where: exists("log.MACHINEID") || exists("log._MACHINE_ID")

      - rename:
          from:
            - log.TRANSPORT
            - log._TRANSPORT
          to: log.transport
          where: exists("log.TRANSPORT") || exists("log._TRANSPORT")

      - rename:
          from:
            - log.SELINUXCONTEXT
            - log._SELINUX_CONTEXT
          to: log.selinuxContext
          where: exists("log.SELINUXCONTEXT") || exists("log._SELINUX_CONTEXT")

      - rename:
          from:
            - log.AUDITSESSION
            - log._AUDIT_SESSION
          to: log.auditSession
          where: exists("log.AUDITSESSION") || exists("log._AUDIT_SESSION")

      - rename:
          from:
            - log.AUDITLOGINUID
            - log._AUDIT_LOGINUID
          to: log.auditLoginUid
          where: exists("log.AUDITLOGINUID") || exists("log._AUDIT_LOGINUID")

      - rename:
          from:
            - log.CAPEFFECTIVE
            - log._CAP_EFFECTIVE
          to: log.capEffective
          where: exists("log.CAPEFFECTIVE") || exists("log._CAP_EFFECTIVE")

      - rename:
          from:
            - log.REALTIMETIMESTAMP
            - log.__REALTIME_TIMESTAMP
          to: log.realtimeTimestamp
          where: exists("log.REALTIMETIMESTAMP") || exists("log.__REALTIME_TIMESTAMP")

      - rename:
          from:
            - log.SOURCEREALTIMETIMESTAMP
            - log._SOURCE_REALTIME_TIMESTAMP
          to: log.sourceRealtimeTimestamp
          where: exists("log.SOURCEREALTIMETIMESTAMP") || exists("log._SOURCE_REALTIME_TIMESTAMP")

      - rename:
          from:
            - log.MONOTONICTIMESTAMP
            - log.__MONOTONIC_TIMESTAMP
          to: log.monotonicTimestamp
          where: exists("log.MONOTONICTIMESTAMP") || exists("log.__MONOTONIC_TIMESTAMP")

      - rename:
          from:
            - log.CURSOR
            - log.__CURSOR
          to: log.cursor
          where: exists("log.CURSOR") || exists("log.__CURSOR")

      - rename:
          from:
            - log.SEQNUM
            - log.__SEQNUM
          to: log.seqnum
          where: exists("log.SEQNUM") || exists("log.__SEQNUM")

      - rename:
          from:
            - log.SEQNUMID
            - log.__SEQNUM_ID
          to: log.seqnumId
          where: exists("log.SEQNUMID") || exists("log.__SEQNUM_ID")

      - rename:
          from:
            - log.RUNTIMESCOPE
            - log._RUNTIME_SCOPE
          to: log.runtimeScope
          where: exists("log.RUNTIMESCOPE") || exists("log._RUNTIME_SCOPE")

      - rename:
          from:
            - log.STREAMID
            - log._STREAM_ID
          to: log.streamId
          where: exists("log.STREAMID") || exists("log._STREAM_ID")

      - rename:
          from:
            - log.SYSTEMDINVOCATIONID
            - log._SYSTEMD_INVOCATION_ID
          to: log.systemdInvocationId
          where: exists("log.SYSTEMDINVOCATIONID") || exists("log._SYSTEMD_INVOCATION_ID")

      - rename:
          from:
            - log.CODEFILE
            - log.CODE_FILE
          to: log.codeFile
          where: exists("log.CODEFILE") || exists("log.CODE_FILE")

      - rename:
          from:
            - log.CODELINE
            - log.CODE_LINE
          to: log.codeLine
          where: exists("log.CODELINE") || exists("log.CODE_LINE")

      - rename:
          from:
            - log.CODEFUNC
            - log.CODE_FUNC
          to: log.codeFunc
          where: exists("log.CODEFUNC") || exists("log.CODE_FUNC")

      - rename:
          from:
            - log.INVOCATIONID
            - log.INVOCATION_ID
          to: log.invocationId
          where: exists("log.INVOCATIONID") || exists("log.INVOCATION_ID")

      - rename:
          from:
            - log.JOBID
            - log.JOB_ID
          to: log.jobId
          where: exists("log.JOBID") || exists("log.JOB_ID")

      - rename:
          from:
            - log.JOBTYPE
            - log.JOB_TYPE
          to: log.jobType
          where: exists("log.JOBTYPE") || exists("log.JOB_TYPE")

      - rename:
          from:
            - log.MESSAGEID
            - log.MESSAGE_ID
          to: log.messageId
          where: exists("log.MESSAGEID") || exists("log.MESSAGE_ID")

      - rename:
          from:
            - log.CPUUSAGENSEC
            - log.CPU_USAGE_NSEC
          to: log.cpuUsageNsec
          where: exists("log.CPUUSAGENSEC") || exists("log.CPU_USAGE_NSEC")

      - rename:
          from:
            - log.MEMORYPEAK
            - log.MEMORY_PEAK
          to: log.memoryPeak
          where: exists("log.MEMORYPEAK") || exists("log.MEMORY_PEAK")

      - rename:
          from:
            - log.MEMORYSWAPPEAK
            - log.MEMORY_SWAP_PEAK
          to: log.memorySwapPeak
          where: exists("log.MEMORYSWAPPEAK") || exists("log.MEMORY_SWAP_PEAK")

      # ========================================
      # PHASE 3: STANDARD SCHEMA MAPPING
      # ========================================

      # Map directly to Standard Event Schema (no intermediate camelCase step)
      - rename:
          from:
            - log.HOSTNAME
            - log._HOSTNAME
          to: origin.host
          where: exists("log.HOSTNAME") || exists("log._HOSTNAME")

      - rename:
          from:
            - log.USERID
            - log.USER_ID
          to: origin.user
          where: exists("log.USERID") || exists("log.USER_ID")

      - rename:
          from:
            - log.COMM
            - log._COMM
          to: origin.process
          where: exists("log.COMM") || exists("log._COMM")

      - rename:
          from:
            - log.CMDLINE
            - log._CMDLINE
          to: origin.command
          where: exists("log.CMDLINE") || exists("log._CMDLINE")

      # Map syslog priority (0-7) to severity labels
      - add:
          function: string
          params:
            key: severity
            value: "emergency"
          where: 'equals("log.priority", "0")'

      - add:
          function: string
          params:
            key: severity
            value: "alert"
          where: 'equals("log.priority", "1")'

      - add:
          function: string
          params:
            key: severity
            value: "critical"
          where: 'equals("log.priority", "2")'

      - add:
          function: string
          params:
            key: severity
            value: "error"
          where: 'equals("log.priority", "3")'

      - add:
          function: string
          params:
            key: severity
            value: "warning"
          where: 'equals("log.priority", "4")'

      - add:
          function: string
          params:
            key: severity
            value: "notice"
          where: 'equals("log.priority", "5")'

      - add:
          function: string
          params:
            key: severity
            value: "info"
          where: 'equals("log.priority", "6")'

      - add:
          function: string
          params:
            key: severity
            value: "debug"
          where: 'equals("log.priority", "7")'

      # ========================================
      # PHASE 4: AUDITD NORMALIZATION
      # Process only when log.type == "auditd"
      # Auditd logs have lowercase fields and type: "auditd"
      # ========================================

      # Map auditd syscall to action (primary action identifier)
      - rename:
          from:
            - log.syscall
          to: action
          where: 'equals("log.type", "auditd") && exists("log.syscall")'

      # Fallback: map category to action if syscall not present
      - rename:
          from:
            - log.category
          to: action
          where: 'equals("log.type", "auditd") && !exists("action") && exists("log.category")'

      # Derive documented final outcomes, retaining their vendor fields.
      # Do not promote job cancellation/skipping or unknown values to success.
      - delete:
          fields: [actionResult]

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            !equals("log.type", "auditd") &&
            (equals("log.JOBRESULT", "done") || equals("log.JOB_RESULT", "done")) &&
            (!exists("log.JOBRESULT") || equals("log.JOBRESULT", "done")) &&
            (!exists("log.JOB_RESULT") || equals("log.JOB_RESULT", "done"))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failure'
          where: >-
            !equals("log.type", "auditd") &&
            (oneOf("log.JOBRESULT", ["failed", "timeout", "dependency"]) ||
             oneOf("log.JOB_RESULT", ["failed", "timeout", "dependency"]))

      # The native collector flattens SYSCALL results to the root. Its pinned
      # audit parser emits success/fail, and can decode negative exits to errno names.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.type", "auditd") && equals("log.category", "SYSCALL") &&
            equals("log.result", "success") &&
            (!exists("log.exit") || (regexMatch("log.exit", "^[0-9]+$") && greaterOrEqual("log.exit", 0)))

      # A nonblocking connect still in progress has no final connection outcome.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failure'
          where: >-
            equals("log.type", "auditd") && equals("log.category", "SYSCALL") &&
            equals("log.result", "fail") &&
            !(equals("action", "connect") &&
              oneOf("log.exit", ["EINPROGRESS", "EALREADY", "EAGAIN", "EWOULDBLOCK", "-115", "-114", "-11"]))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("log.type", "auditd") && equals("log.category", "SYSCALL") &&
            equals("log.result", "fail") && oneOf("log.exit", ["EACCES", "EPERM", "-13", "-1"])

      # USER_LOGIN is the completed-login record; USER_AUTH/USER_ACCT are earlier
      # checks. Repeated records become arrays and deliberately remain ambiguous.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_LOGIN") &&
            equals("log.userlogin.result", "success") && !exists("log.result")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failure'
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_LOGIN") &&
            equals("log.userlogin.result", "fail") && !exists("log.result")

      # USER_LOGIN addr is the user's network address. Preserve the original,
      # and expose only a valid, non-unspecified peer address to correlation.
      - grok:
          source: log.userlogin.addr
          patterns:
            - fieldName: origin.ip
              pattern: (?s:.*)
          where: >-
            equals("log.type", "auditd") && equals("action", "USER_LOGIN") &&
            (inCIDR("log.userlogin.addr", "0.0.0.0/0") || inCIDR("log.userlogin.addr", "::/0")) &&
            !inCIDR("log.userlogin.addr", "0.0.0.0/32") && !inCIDR("log.userlogin.addr", "::/128")

      # Map exe to origin.process (full path to executable)
      # Only if journald's COMM didn't already set origin.process
      - rename:
          from:
            - log.exe
          to: origin.process
          where: 'equals("log.type", "auditd") && exists("log.exe") && !exists("origin.process")'

      # Fallback: map auditd comm to origin.process if exe not mapped
      - rename:
          from:
            - log.comm
          to: origin.process
          where: 'equals("log.type", "auditd") && !exists("origin.process") && exists("log.comm")'

      # Map proctitle to origin.command (full command line)
      - rename:
          from:
            - log.proctitle
          to: origin.command
          where: 'equals("log.type", "auditd") && exists("log.proctitle")'

      # Map cwd to origin.path (current working directory)
      - rename:
          from:
            - log.cwd
          to: origin.path
          where: 'equals("log.type", "auditd") && exists("log.cwd")'

      # statusCode is uint32. Preserve signed/decoded errno values under log.exit;
      # copying only an in-range integer avoids rejecting the entire Event.
      - grok:
          source: log.exit
          patterns:
            - fieldName: statusCode
              pattern: (?s:.*)
          where: >-
            equals("log.type", "auditd") && regexMatch("log.exit", "^[0-9]+$") &&
            greaterOrEqual("log.exit", 0) && lessOrEqual("log.exit", 4294967295)

      # Cast statusCode to integer (proto schema expects uint32)
      - cast:
          fields: [statusCode]
          to: int
          where: 'equals("log.type", "auditd") && exists("statusCode")'
