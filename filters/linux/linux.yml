# System Linux filter version 5.1.0
# Support for:
#   - systemd/journald JSON format (SCREAMINGSNAKECASE fields)
#   - Native auditd collector JSON format (type: "auditd")
# Converts SCREAMINGSNAKECASE and snakecase to camelCase
# Maps to UTMStack Standard Event Schema
# Optimized: Direct mapping to standard schema (no intermediate steps)

pipeline:
  - dataTypes:
      - linux
    steps:
      # ========================================
      # PHASE 1: EXTRACTION
      # ========================================

      # Parse JSON from systemd/journald
      - json:
          source: raw
          where: 'startsWith("raw", "{")'

      # ========================================
      # PHASE 2: FIELD NORMALIZATION (camelCase conversion)
      # ========================================

      # Convert SCREAMINGSNAKECASE to camelCase
      # Parsers on go-sdk v1.1.35 or later keep "_" in key names and older ones remove it,
      # so a journald key such as _HOSTNAME arrives as log._HOSTNAME or log.HOSTNAME.
      # Renames of those keys read both spellings.
      - rename:
          from:
            - event.MESSAGE
          to: event.message
          where: exists("event.MESSAGE")

      - rename:
          from:
            - event.PRIORITY
          to: event.priority
          where: exists("event.PRIORITY")

      - rename:
          from:
            - event.SYSLOGIDENTIFIER
            - event.SYSLOG_IDENTIFIER
          to: event.syslogIdentifier
          where: exists("event.SYSLOGIDENTIFIER") || exists("event.SYSLOG_IDENTIFIER")

      - rename:
          from:
            - event.SYSLOGTIMESTAMP
            - event.SYSLOG_TIMESTAMP
          to: event.syslogTimestamp
          where: exists("event.SYSLOGTIMESTAMP") || exists("event.SYSLOG_TIMESTAMP")

      - rename:
          from:
            - event.SYSLOGFACILITY
            - event.SYSLOG_FACILITY
          to: event.syslogFacility
          where: exists("event.SYSLOGFACILITY") || exists("event.SYSLOG_FACILITY")

      - rename:
          from:
            - event.SYSLOGPID
            - event.SYSLOG_PID
          to: event.syslogPid
          where: exists("event.SYSLOGPID") || exists("event.SYSLOG_PID")

      # Convert snakecase to camelCase (only for fields staying in log.*)
      - rename:
          from:
            - event.PID
            - event._PID
          to: event.pid
          where: exists("event.PID") || exists("event._PID")

      - rename:
          from:
            - event.UID
            - event._UID
          to: event.uid
          where: exists("event.UID") || exists("event._UID")

      - rename:
          from:
            - event.GID
            - event._GID
          to: event.gid
          where: exists("event.GID") || exists("event._GID")

      - rename:
          from:
            - event.TID
          to: event.tid
          where: exists("event.TID")

      - rename:
          from:
            - event.EXE
            - event._EXE
          to: event.exe
          where: exists("event.EXE") || exists("event._EXE")

      - rename:
          from:
            - event.UNIT
          to: event.unit
          where: exists("event.UNIT")

      - rename:
          from:
            - event.SYSTEMDUNIT
            - event._SYSTEMD_UNIT
          to: event.systemdUnit
          where: exists("event.SYSTEMDUNIT") || exists("event._SYSTEMD_UNIT")

      - rename:
          from:
            - event.SYSTEMDSLICE
            - event._SYSTEMD_SLICE
          to: event.systemdSlice
          where: exists("event.SYSTEMDSLICE") || exists("event._SYSTEMD_SLICE")

      - rename:
          from:
            - event.SYSTEMDUSERSLICE
            - event._SYSTEMD_USER_SLICE
          to: event.systemdUserSlice
          where: exists("event.SYSTEMDUSERSLICE") || exists("event._SYSTEMD_USER_SLICE")

      - rename:
          from:
            - event.SYSTEMDSESSION
            - event._SYSTEMD_SESSION
          to: event.systemdSession
          where: exists("event.SYSTEMDSESSION") || exists("event._SYSTEMD_SESSION")

      - rename:
          from:
            - event.SESSIONID
            - event.SESSION_ID
          to: event.sessionId
          where: exists("event.SESSIONID") || exists("event.SESSION_ID")

      - rename:
          from:
            - event.LEADER
          to: event.leader
          where: exists("event.LEADER")

      - rename:
          from:
            - event.SYSTEMDOWNERUID
            - event._SYSTEMD_OWNER_UID
          to: event.systemdOwnerUid
          where: exists("event.SYSTEMDOWNERUID") || exists("event._SYSTEMD_OWNER_UID")

      - rename:
          from:
            - event.SYSTEMDCGROUP
            - event._SYSTEMD_CGROUP
          to: event.systemdCgroup
          where: exists("event.SYSTEMDCGROUP") || exists("event._SYSTEMD_CGROUP")

      - rename:
          from:
            - event.BOOTID
            - event._BOOT_ID
          to: event.bootId
          where: exists("event.BOOTID") || exists("event._BOOT_ID")

      - rename:
          from:
            - event.MACHINEID
            - event._MACHINE_ID
          to: event.machineId
          where: exists("event.MACHINEID") || exists("event._MACHINE_ID")

      - rename:
          from:
            - event.TRANSPORT
            - event._TRANSPORT
          to: event.transport
          where: exists("event.TRANSPORT") || exists("event._TRANSPORT")

      - rename:
          from:
            - event.SELINUXCONTEXT
            - event._SELINUX_CONTEXT
          to: event.selinuxContext
          where: exists("event.SELINUXCONTEXT") || exists("event._SELINUX_CONTEXT")

      - rename:
          from:
            - event.AUDITSESSION
            - event._AUDIT_SESSION
          to: event.auditSession
          where: exists("event.AUDITSESSION") || exists("event._AUDIT_SESSION")

      - rename:
          from:
            - event.AUDITLOGINUID
            - event._AUDIT_LOGINUID
          to: event.auditLoginUid
          where: exists("event.AUDITLOGINUID") || exists("event._AUDIT_LOGINUID")

      - rename:
          from:
            - event.CAPEFFECTIVE
            - event._CAP_EFFECTIVE
          to: event.capEffective
          where: exists("event.CAPEFFECTIVE") || exists("event._CAP_EFFECTIVE")

      - rename:
          from:
            - event.REALTIMETIMESTAMP
            - event.__REALTIME_TIMESTAMP
          to: event.realtimeTimestamp
          where: exists("event.REALTIMETIMESTAMP") || exists("event.__REALTIME_TIMESTAMP")

      - rename:
          from:
            - event.SOURCEREALTIMETIMESTAMP
            - event._SOURCE_REALTIME_TIMESTAMP
          to: event.sourceRealtimeTimestamp
          where: exists("event.SOURCEREALTIMETIMESTAMP") || exists("event._SOURCE_REALTIME_TIMESTAMP")

      - rename:
          from:
            - event.MONOTONICTIMESTAMP
            - event.__MONOTONIC_TIMESTAMP
          to: event.monotonicTimestamp
          where: exists("event.MONOTONICTIMESTAMP") || exists("event.__MONOTONIC_TIMESTAMP")

      - rename:
          from:
            - event.CURSOR
            - event.__CURSOR
          to: event.cursor
          where: exists("event.CURSOR") || exists("event.__CURSOR")

      - rename:
          from:
            - event.SEQNUM
            - event.__SEQNUM
          to: event.seqnum
          where: exists("event.SEQNUM") || exists("event.__SEQNUM")

      - rename:
          from:
            - event.SEQNUMID
            - event.__SEQNUM_ID
          to: event.seqnumId
          where: exists("event.SEQNUMID") || exists("event.__SEQNUM_ID")

      - rename:
          from:
            - event.RUNTIMESCOPE
            - event._RUNTIME_SCOPE
          to: event.runtimeScope
          where: exists("event.RUNTIMESCOPE") || exists("event._RUNTIME_SCOPE")

      - rename:
          from:
            - event.STREAMID
            - event._STREAM_ID
          to: event.streamId
          where: exists("event.STREAMID") || exists("event._STREAM_ID")

      - rename:
          from:
            - event.SYSTEMDINVOCATIONID
            - event._SYSTEMD_INVOCATION_ID
          to: event.systemdInvocationId
          where: exists("event.SYSTEMDINVOCATIONID") || exists("event._SYSTEMD_INVOCATION_ID")

      - rename:
          from:
            - event.CODEFILE
            - event.CODE_FILE
          to: event.codeFile
          where: exists("event.CODEFILE") || exists("event.CODE_FILE")

      - rename:
          from:
            - event.CODELINE
            - event.CODE_LINE
          to: event.codeLine
          where: exists("event.CODELINE") || exists("event.CODE_LINE")

      - rename:
          from:
            - event.CODEFUNC
            - event.CODE_FUNC
          to: event.codeFunc
          where: exists("event.CODEFUNC") || exists("event.CODE_FUNC")

      - rename:
          from:
            - event.INVOCATIONID
            - event.INVOCATION_ID
          to: event.invocationId
          where: exists("event.INVOCATIONID") || exists("event.INVOCATION_ID")

      - rename:
          from:
            - event.JOBID
            - event.JOB_ID
          to: event.jobId
          where: exists("event.JOBID") || exists("event.JOB_ID")

      - rename:
          from:
            - event.JOBTYPE
            - event.JOB_TYPE
          to: event.jobType
          where: exists("event.JOBTYPE") || exists("event.JOB_TYPE")

      - rename:
          from:
            - event.MESSAGEID
            - event.MESSAGE_ID
          to: event.messageId
          where: exists("event.MESSAGEID") || exists("event.MESSAGE_ID")

      - rename:
          from:
            - event.CPUUSAGENSEC
            - event.CPU_USAGE_NSEC
          to: event.cpuUsageNsec
          where: exists("event.CPUUSAGENSEC") || exists("event.CPU_USAGE_NSEC")

      - rename:
          from:
            - event.MEMORYPEAK
            - event.MEMORY_PEAK
          to: event.memoryPeak
          where: exists("event.MEMORYPEAK") || exists("event.MEMORY_PEAK")

      - rename:
          from:
            - event.MEMORYSWAPPEAK
            - event.MEMORY_SWAP_PEAK
          to: event.memorySwapPeak
          where: exists("event.MEMORYSWAPPEAK") || exists("event.MEMORY_SWAP_PEAK")

      # ========================================
      # PHASE 3: STANDARD SCHEMA MAPPING
      # ========================================

      # Map directly to Standard Event Schema (no intermediate camelCase step)
      - rename:
          from:
            - event.HOSTNAME
            - event._HOSTNAME
          to: origin.host
          where: exists("event.HOSTNAME") || exists("event._HOSTNAME")

      - rename:
          from:
            - event.USERID
            - event.USER_ID
          to: origin.user
          where: exists("event.USERID") || exists("event.USER_ID")

      - rename:
          from:
            - event.COMM
            - event._COMM
          to: origin.process
          where: exists("event.COMM") || exists("event._COMM")

      - rename:
          from:
            - event.CMDLINE
            - event._CMDLINE
          to: origin.command
          where: exists("event.CMDLINE") || exists("event._CMDLINE")

      # Map syslog priority (0-7) to severity labels
      - add:
          function: string
          params:
            key: severity
            value: "emergency"
          where: 'equals("event.priority", "0")'

      - add:
          function: string
          params:
            key: severity
            value: "alert"
          where: 'equals("event.priority", "1")'

      - add:
          function: string
          params:
            key: severity
            value: "critical"
          where: 'equals("event.priority", "2")'

      - add:
          function: string
          params:
            key: severity
            value: "error"
          where: 'equals("event.priority", "3")'

      - add:
          function: string
          params:
            key: severity
            value: "warning"
          where: 'equals("event.priority", "4")'

      - add:
          function: string
          params:
            key: severity
            value: "notice"
          where: 'equals("event.priority", "5")'

      - add:
          function: string
          params:
            key: severity
            value: "info"
          where: 'equals("event.priority", "6")'

      - add:
          function: string
          params:
            key: severity
            value: "debug"
          where: 'equals("event.priority", "7")'

      # ========================================
      # PHASE 4: AUDITD NORMALIZATION
      # Process only when log.type == "auditd"
      # Auditd logs have lowercase fields and type: "auditd"
      # ========================================

      # Map auditd syscall to action (primary action identifier)
      - rename:
          from:
            - event.syscall
          to: action
          where: 'equals("event.type", "auditd") && exists("event.syscall")'

      # Fallback: map category to action if syscall not present
      - rename:
          from:
            - event.category
          to: action
          where: 'equals("event.type", "auditd") && !exists("action") && exists("event.category")'

      # Derive documented final outcomes, retaining their vendor fields.
      # Do not promote job cancellation/skipping or unknown values to success.
      - delete:
          fields: [actionResult]

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            !equals("event.type", "auditd") &&
            (equals("event.JOBRESULT", "done") || equals("event.JOB_RESULT", "done")) &&
            (!exists("event.JOBRESULT") || equals("event.JOBRESULT", "done")) &&
            (!exists("event.JOB_RESULT") || equals("event.JOB_RESULT", "done"))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failure'
          where: >-
            !equals("event.type", "auditd") &&
            (oneOf("event.JOBRESULT", ["failed", "timeout", "dependency"]) ||
             oneOf("event.JOB_RESULT", ["failed", "timeout", "dependency"]))

      # The native collector flattens SYSCALL results to the root. Its pinned
      # audit parser emits success/fail, and can decode negative exits to errno names.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("event.type", "auditd") && equals("event.category", "SYSCALL") &&
            equals("event.result", "success") &&
            (!exists("event.exit") || (regexMatch("event.exit", "^[0-9]+$") && greaterOrEqual("event.exit", 0)))

      # A nonblocking connect still in progress has no final connection outcome.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failure'
          where: >-
            equals("event.type", "auditd") && equals("event.category", "SYSCALL") &&
            equals("event.result", "fail") &&
            !(equals("action", "connect") &&
              oneOf("event.exit", ["EINPROGRESS", "EALREADY", "EAGAIN", "EWOULDBLOCK", "-115", "-114", "-11"]))

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: >-
            equals("event.type", "auditd") && equals("event.category", "SYSCALL") &&
            equals("event.result", "fail") && oneOf("event.exit", ["EACCES", "EPERM", "-13", "-1"])

      # USER_LOGIN is the completed-login record; USER_AUTH/USER_ACCT are earlier
      # checks. Repeated records become arrays and deliberately remain ambiguous.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: >-
            equals("event.type", "auditd") && equals("action", "USER_LOGIN") &&
            equals("event.userlogin.result", "success") && !exists("event.result")

      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failure'
          where: >-
            equals("event.type", "auditd") && equals("action", "USER_LOGIN") &&
            equals("event.userlogin.result", "fail") && !exists("event.result")

      # USER_LOGIN addr is the user's network address. Preserve the original,
      # and expose only a valid, non-unspecified peer address to correlation.
      - grok:
          source: event.userlogin.addr
          patterns:
            - fieldName: origin.ip
              pattern: (?s:.*)
          where: >-
            equals("event.type", "auditd") && equals("action", "USER_LOGIN") &&
            (inCIDR("event.userlogin.addr", "0.0.0.0/0") || inCIDR("event.userlogin.addr", "::/0")) &&
            !inCIDR("event.userlogin.addr", "0.0.0.0/32") && !inCIDR("event.userlogin.addr", "::/128")

      # Map exe to origin.process (full path to executable)
      # Only if journald's COMM didn't already set origin.process
      - rename:
          from:
            - event.exe
          to: origin.process
          where: 'equals("event.type", "auditd") && exists("event.exe") && !exists("origin.process")'

      # Fallback: map auditd comm to origin.process if exe not mapped
      - rename:
          from:
            - event.comm
          to: origin.process
          where: 'equals("event.type", "auditd") && !exists("origin.process") && exists("event.comm")'

      # Map proctitle to origin.command (full command line)
      - rename:
          from:
            - event.proctitle
          to: origin.command
          where: 'equals("event.type", "auditd") && exists("event.proctitle")'

      # Map cwd to origin.path (current working directory)
      - rename:
          from:
            - event.cwd
          to: origin.path
          where: 'equals("event.type", "auditd") && exists("event.cwd")'

      # statusCode is uint32. Preserve signed/decoded errno values under log.exit;
      # copying only an in-range integer avoids rejecting the entire Event.
      - grok:
          source: event.exit
          patterns:
            - fieldName: statusCode
              pattern: (?s:.*)
          where: >-
            equals("event.type", "auditd") && regexMatch("event.exit", "^[0-9]+$") &&
            greaterOrEqual("event.exit", 0) && lessOrEqual("event.exit", 4294967295)

      # Cast statusCode to integer (proto schema expects uint32)
      - cast:
          fields: [statusCode]
          to: int
          where: 'equals("event.type", "auditd") && exists("statusCode")'
