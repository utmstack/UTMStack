pipeline:
  - dataTypes:
      - firewall-ufw
    steps:
      # 1. Handle Agent Wrapper (Optional)
      - grok:
          source: raw
          patterns:
            - fieldName: log.wrapper_open
              pattern: '\[utm_stack_agent_ds='
            - fieldName: log.datasource_override
              pattern: '{{.data}}'
            - fieldName: log.wrapper_close
              pattern: '\]-'
            - fieldName: log.inner_msg
              pattern: '{{.greedy}}'
            - fieldName: log.inner_msg # Fallback if no wrapper, match everything
              pattern: '{{.greedy}}' 

      # 2. Parse UFW Log
      - grok:
          source: log.inner_msg
          patterns:
            - fieldName: log.timestamp
              pattern: '{{.monthName}}(\s+){{.monthDay}}(\s+){{.time}}'
            - fieldName: log.separator
              pattern: '{{.space}}'
            - fieldName: log.ufw_host
              pattern: '{{.hostname}}'
            - fieldName: log.separator
              pattern: '{{.space}}'
            - fieldName: log.process
              pattern: '{{.data}}'
            - fieldName: log.separator
              pattern: '\[UFW '
            - fieldName: log.action
              pattern: '{{.word}}'
            - fieldName: log.separator
              pattern: '\] '
            - fieldName: log.ufw_data
              pattern: '{{.greedy}}' 

      # 2b. Parse the Key-Value part of UFW
      - kv:
          source: log.ufw_data
          fieldSplit: " "
          valueSplit: "="

      # 3. Standardize Fields from KV
      - rename:
          from: [SRC]
          to: origin.ip
      - rename:
          from: [DST]
          to: target.ip
      - rename:
          from: [SPT]
          to: origin.port
      - rename:
          from: [DPT]
          to: target.port
      - rename:
          from: [PROTO]
          to: protocol
      - rename:
          from: [MAC]
          to: log.mac
      - rename:
          from: [IN]
          to: log.interface

      # 4. Standardize Action
      - rename:
          from: [log.action]
          to: action
      
      # 5. Cast Types
      - cast:
          fields: [origin.port, target.port]
          to: int
      
      # 6. Cleanup
      - delete:
          fields: [log.wrapper_open, log.wrapper_close, log.inner_msg, log.ufw_data, log.separator]
