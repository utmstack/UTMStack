# AWS filter v1.1.1: CloudTrail JSON and identified GuardDuty EventBridge findings.
# Original vendor objects and legacy aliases are retained. API success is request success.
# Correlation candidates are generated here, never trusted from input.
pipeline:
- dataTypes:
  - aws
  steps:
  - json:
      source: raw
  - rename:
      from:
      - event.userIdentity.accessKeyId
      to: event.userIdentityAccessKeyId
  - rename:
      from:
      - event.userIdentity.accountId
      to: event.userIdentityAccountId
  - rename:
      from:
      - event.userIdentity.arn
      to: event.userIdentityArn
  - rename:
      from:
      - event.userIdentity.invokedBy
      to: event.userIdentityInvokedBy
  - rename:
      from:
      - event.userIdentity.principalId
      to: event.userIdentityPrincipalId
  - rename:
      from:
      - event.userIdentity.sessionContext.attributes.creationDate
      to: event.userIdentitySessionContextAttributesCreationDate
  - rename:
      from:
      - event.userIdentity.sessionContext.attributes.mfaAuthenticated
      to: event.userIdentitySessionContextAttributesMfaAuthenticated
  - rename:
      from:
      - event.userIdentity.sessionContext.sessionIssuer.accountId
      to: event.userIdentitySessionContextSessionIssuerAccountId
  - rename:
      from:
      - event.userIdentity.sessionContext.sessionIssuer.arn
      to: event.userIdentitySessionContextSessionIssuerArn
  - rename:
      from:
      - event.userIdentity.sessionContext.sessionIssuer.principalId
      to: event.userIdentitySessionContextSessionIssuerPrincipalId
  - rename:
      from:
      - event.userIdentity.sessionContext.sessionIssuer.type
      to: event.userIdentitySessionContextSessionIssuerType
  - rename:
      from:
      - event.userIdentity.sessionContext.sessionIssuer.userName
      to: event.userIdentitySessionContextSessionIssuerUserName
  - rename:
      from:
      - event.userIdentity.sessionContext.webIdFederationData
      to: event.userIdentitySessionContextWebIdFederationData
  - rename:
      from:
      - event.userIdentity.type
      to: event.userIdentityType
  - rename:
      from:
      - event.requestParameters.durationSeconds
      to: event.requestParametersDurationSeconds
  - rename:
      from:
      - event.requestParameters.roleArn
      to: event.requestParametersRoleArn
  - rename:
      from:
      - event.requestParameters.roleSessionName
      to: event.requestParametersRoleSessionName
  - rename:
      from:
      - event.responseElements.assumedRoleUser.arn
      to: event.responseElementsAssumedRoleUserArn
  - rename:
      from:
      - event.responseElements.assumedRoleUser.assumedRoleId
      to: event.responseElementsAssumedRoleUserAssumedRoleId
  - rename:
      from:
      - event.responseElements.credentials.accessKeyId
      to: event.responseElementsCredentialsAccessKeyId
  - rename:
      from:
      - event.responseElements.credentials.expiration
      to: event.responseElementsCredentialsExpiration
  - rename:
      from:
      - event.responseElements.credentials.sessionToken
      to: event.responseElementsCredentialsSessionToken
  - rename:
      from:
      - event.requestParameters.Host
      to: event.requestParametersHost
  - rename:
      from:
      - event.requestParameters.acl
      to: event.requestParametersAcl
  - rename:
      from:
      - event.requestParameters.bucketName
      to: event.userIdentityAccessrequestParametersBucketNamesKeyId
  - rename:
      from:
      - event.additionalEventData.SignatureVersion
      to: event.additionalEventDataSignatureVersion
  - rename:
      from:
      - event.additionalEventData.AuthenticationMethod
      to: event.additionalEventDataAuthenticationMethod
  - rename:
      from:
      - event.additionalEventData.CipherSuite
      to: event.additionalEventDataCipherSuite
  - rename:
      from:
      - event.additionalEventData.bytesTransferredIn
      to: origin.bytesReceived
      where: greaterOrEqual("event.additionalEventData.bytesTransferredIn",0) && lessOrEqual("event.additionalEventData.bytesTransferredIn",1.7976931348623157e308)
  - rename:
      from:
      - event.additionalEventData.bytesTransferredOut
      to: origin.bytesSent
      where: greaterOrEqual("event.additionalEventData.bytesTransferredOut",0) && lessOrEqual("event.additionalEventData.bytesTransferredOut",1.7976931348623157e308)
  - rename:
      from:
      - event.additionalEventData.xamzid2
      - event.additionalEventData.x-amz-id-2
      to: event.additionalEventDataXamzId2
  - rename:
      from:
      - event.additionalEventData.SSEApplied
      to: event.additionalEventDataSSEApplied
  - rename:
      from:
      - event.requestParameters.key
      to: event.requestParametersKey
  - rename:
      from:
      - event.requestParameters.xamzacl
      - event.requestParameters.x-amz-acl
      to: event.requestParametersXAmzAcl
  - rename:
      from:
      - event.requestParameters.xamzserversideencryption
      - event.requestParameters.x-amz-server-side-encryption
      to: event.requestParametersXAmzServerSideEncryption
  - rename:
      from:
      - event.responseElements.xamzexpiration
      - event.responseElements.x-amz-expiration
      to: event.responseElementsXAmzExpiration
  - rename:
      from:
      - event.responseElements.xamzserversideencryption
      - event.responseElements.x-amz-server-side-encryption
      to: event.responseElementsXAmzServerSideEncryption
  - rename:
      from:
      - event.responseElements.assumedRoleUser
      to: event.responseElementsAssumedRoleUser
  - rename:
      from:
      - event.responseElements.credentials
      to: event.responseElementsCredentials
  - rename:
      from:
      - event.tlsDetails.cipherSuite
      to: event.tlsDetailsCipherSuite
  - rename:
      from:
      - event.tlsDetails.clientProvidedHostHeader
      to: event.tlsDetailsClientProvidedHostHeader
  - rename:
      from:
      - event.tlsDetails.tlsVersion
      to: event.tlsDetailsTlsVersion
  - json:
      source: raw
  - delete:
      fields:
      - event.awsRecordType
      - event.awsActorKey
      - event.awsActorKeyType
      - event.awsAccountKey
      - event.awsAccountKeyType
      - event.correlationCandidate
  - add:
      function: string
      params:
        key: event.awsRecordType
        value: cloudtrail
      where: regexMatch("event.eventName","^[A-Za-z][A-Za-z0-9]*$") && regexMatch("event.eventVersion","^[0-9]+\\.[0-9]+$") && regexMatch("event.eventSource","^[A-Za-z0-9.-]+\\.amazonaws\\.com(\\.cn)?$")
  - add:
      function: string
      params:
        key: event.awsRecordType
        value: guardduty
      where: equals("event.source","aws.guardduty") && equals("event.detailtype","GuardDuty Finding") && exists("event.detail.id") && exists("event.detail.type")
  - grok:
      source: event.eventName
      patterns:
      - fieldName: action
        pattern: (?s)^.+$
      where: regexMatch("event.eventName","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail"))
  - grok:
      source: event.sourceIPAddress
      patterns:
      - fieldName: origin.ip
        pattern: (?s)^.+$
      where: regexMatch("event.sourceIPAddress","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && (inCIDR("event.sourceIPAddress","0.0.0.0/0")
        || inCIDR("event.sourceIPAddress","::/0")) && !inCIDR("event.sourceIPAddress","0.0.0.0/32") && !inCIDR("event.sourceIPAddress","::/128"))
  - grok:
      source: event.sourceIPAddress
      patterns:
      - fieldName: origin.host
        pattern: (?s)^.+$
      where: regexMatch("event.sourceIPAddress","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && !exists("origin.ip") && regexMatch("event.sourceIPAddress","^[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z][A-Za-z0-9-]*$"))
  - grok:
      source: event.userIdentity.arn
      patterns:
      - fieldName: origin.user
        pattern: (?s)^.+$
      where: regexMatch("event.userIdentity.arn","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("event.userIdentity.arn","(?s)^.+$")
        && !oneOf("event.userIdentity.arn",["","-","HIDDEN_DUE_TO_SECURITY_REASONS"]))
  - grok:
      source: event.userIdentity.userName
      patterns:
      - fieldName: origin.user
        pattern: (?s)^.+$
      where: regexMatch("event.userIdentity.userName","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && !exists("origin.user")
        && regexMatch("event.userIdentity.userName","(?s)^.+$") && !oneOf("event.userIdentity.userName",["","-","HIDDEN_DUE_TO_SECURITY_REASONS"]))
  - grok:
      source: event.eventSource
      patterns:
      - fieldName: target.domain
        pattern: (?s)^.+$
      where: regexMatch("event.eventSource","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail"))
  - grok:
      source: event.eventTime
      patterns:
      - fieldName: deviceTime
        pattern: (?s)^.+$
      where: regexMatch("event.eventTime","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("event.eventTime","^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?(Z|[+-][0-2][0-9]:[0-5][0-9])$"))
  - grok:
      source: event.time
      patterns:
      - fieldName: deviceTime
        pattern: (?s)^.+$
      where: regexMatch("event.time","(?s)^.+$") && (equals("event.awsRecordType","guardduty") && regexMatch("event.time","^[0-9]{4}-(0[1-9]|1[0-2])-([0-2][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\\.[0-9]+)?(Z|[+-][0-2][0-9]:[0-5][0-9])$"))
  - grok:
      source: event.requestParameters.bucketName
      patterns:
      - fieldName: event.requestParametersBucketName
        pattern: (?s)^.+$
      where: regexMatch("event.requestParameters.bucketName","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail"))
  - add:
      function: string
      params:
        key: actionResult
        value: failure
      where: equals("event.awsRecordType","cloudtrail") && ((exists("event.errorCode") && !equals("event.errorCode","")) || (exists("event.errorMessage")
        && !equals("event.errorMessage","")) || (exists("event.responseElements.errorCode") && !equals("event.responseElements.errorCode",""))
        || (exists("event.responseElements.errorMessage") && !equals("event.responseElements.errorMessage","")) || equalsIgnoreCase("event.responseElements.ConsoleLogin","Failure")
        || equalsIgnoreCase("event.responseElements.GetSigninToken","Failure") || equalsIgnoreCase("event.responseElements.CheckMfa","Failure"))
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: equals("event.awsRecordType","cloudtrail") && (regexMatch("event.errorCode","(^|[.])(AccessDenied(?:Exception)?|VpceAccessDenied|UnauthorizedOperation|UnauthorizedException|NotAuthorizedException|AuthorizationError)$")
        || regexMatch("event.responseElements.errorCode","(^|[.])(AccessDenied(?:Exception)?|VpceAccessDenied|UnauthorizedOperation|UnauthorizedException|NotAuthorizedException|AuthorizationError)$"))
  - add:
      function: string
      params:
        key: actionResult
        value: success
      # CheckMfa only checks whether MFA is required; it does not finish a sign-in.
      # Preserve its vendor response without promoting the intermediate success.
      where: equals("event.awsRecordType","cloudtrail") && !((exists("event.errorCode") && !equals("event.errorCode","")) || (exists("event.errorMessage")
        && !equals("event.errorMessage","")) || (exists("event.responseElements.errorCode") && !equals("event.responseElements.errorCode",""))
        || (exists("event.responseElements.errorMessage") && !equals("event.responseElements.errorMessage","")) || equalsIgnoreCase("event.responseElements.ConsoleLogin","Failure")
        || equalsIgnoreCase("event.responseElements.GetSigninToken","Failure") || equalsIgnoreCase("event.responseElements.CheckMfa","Failure"))
        && (equals("event.eventType","AwsApiCall") || (equals("event.eventName","ConsoleLogin") && equals("event.responseElements.ConsoleLogin","Success"))
        || (equals("event.eventName","GetSigninToken") && equals("event.responseElements.GetSigninToken","Success")))
  - grok:
      source: event.recipientAccountId
      patterns:
      - fieldName: event.awsAccountKey
        pattern: (?s)^.+$
      where: regexMatch("event.recipientAccountId","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("event.recipientAccountId","^[0-9]{12}$")
        && !exists("event.awsAccountKey"))
  - add:
      function: string
      params:
        key: event.awsAccountKeyType
        value: recipient
      where: exists("event.awsAccountKey") && !exists("event.awsAccountKeyType")
  - grok:
      source: event.userIdentity.accountId
      patterns:
      - fieldName: event.awsAccountKey
        pattern: (?s)^.+$
      where: regexMatch("event.userIdentity.accountId","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("event.userIdentity.accountId","^[0-9]{12}$")
        && !exists("event.awsAccountKey"))
  - add:
      function: string
      params:
        key: event.awsAccountKeyType
        value: caller
      where: exists("event.awsAccountKey") && !exists("event.awsAccountKeyType")
  - grok:
      source: event.userIdentity.arn
      patterns:
      - fieldName: event.awsActorKey
        pattern: (?s)^.+$
      where: regexMatch("event.userIdentity.arn","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("event.userIdentity.arn","(?s)^.+$")
        && !oneOf("event.userIdentity.arn",["","-","HIDDEN_DUE_TO_SECURITY_REASONS"]) && !exists("event.awsActorKey"))
  - add:
      function: string
      params:
        key: event.awsActorKeyType
        value: arn
      where: exists("event.awsActorKey") && !exists("event.awsActorKeyType")
  - grok:
      source: event.userIdentity.principalId
      patterns:
      - fieldName: event.awsActorKey
        pattern: (?s)^.+$
      where: regexMatch("event.userIdentity.principalId","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("event.userIdentity.principalId","(?s)^.+$")
        && !oneOf("event.userIdentity.principalId",["","-","HIDDEN_DUE_TO_SECURITY_REASONS"]) && !exists("event.awsActorKey"))
  - add:
      function: string
      params:
        key: event.awsActorKeyType
        value: principal
      where: exists("event.awsActorKey") && !exists("event.awsActorKeyType")
  - grok:
      source: origin.ip
      patterns:
      - fieldName: event.awsActorKey
        pattern: (?s)^.+$
      where: regexMatch("origin.ip","(?s)^.+$") && (equals("event.awsRecordType","cloudtrail") && regexMatch("origin.ip","(?s)^.+$") &&
        !oneOf("origin.ip",["","-","HIDDEN_DUE_TO_SECURITY_REASONS"]) && !exists("event.awsActorKey"))
  - add:
      function: string
      params:
        key: event.awsActorKeyType
        value: ip
      where: exists("event.awsActorKey") && !exists("event.awsActorKeyType")
  - add:
      function: string
      params:
        key: severity
        value: info
      where: equals("event.awsRecordType","guardduty") && greaterOrEqual("event.detail.severity",1) && lessOrEqual("event.detail.severity",3.9)
  - add:
      function: string
      params:
        key: severity
        value: warning
      where: equals("event.awsRecordType","guardduty") && greaterOrEqual("event.detail.severity",4) && lessOrEqual("event.detail.severity",6.9)
  - add:
      function: string
      params:
        key: severity
        value: error
      where: equals("event.awsRecordType","guardduty") && greaterOrEqual("event.detail.severity",7) && lessOrEqual("event.detail.severity",8.9)
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: equals("event.awsRecordType","guardduty") && greaterOrEqual("event.detail.severity",9) && lessOrEqual("event.detail.severity",10)
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: origin.ip
        destination: origin.geolocation
      where: equals("event.awsRecordType","cloudtrail") && exists("origin.ip")
  - add:
      function: string
      params:
        key: event.correlationCandidate.awsEcsCredentialTheft
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "ecs.amazonaws.com") &&
        oneOf("event.eventName", ["DescribeTaskDefinition", "RunTask", "StartTask"]) &&
        equals("actionResult","success") &&
        equals("event.userIdentity.type", "AssumedRole") &&
        contains("event.userIdentity.arn", ":assumed-role/"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.samlProviderChange
        value: match
      where: equals("event.awsRecordType","cloudtrail") && equals("event.eventSource","iam.amazonaws.com") && oneOf("event.eventName",["CreateSAMLProvider",
        "UpdateSAMLProvider"]) && equals("actionResult","success")
  - add:
      function: string
      params:
        key: event.correlationCandidate.awsSecurityhubFindingEvasion
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "securityhub.amazonaws.com") &&
        oneOf("event.eventName", ["BatchUpdateFindings", "DeleteInsight", "UpdateFindings", "DeleteActionTarget"]) &&
        equals("actionResult","success") &&
        !equals("event.userIdentity.type", "AWSService"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.awsSsmSendcommandAbuse
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "ssm.amazonaws.com") &&
        oneOf("event.eventName", ["SendCommand", "StartSession"]) &&
        equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.awsSsoSuspiciousActivities
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource","sso.amazonaws.com") && oneOf("event.eventName",["CreatePermissionSet",
        "AttachManagedPolicyToPermissionSet", "DeletePermissionSet", "PutInlinePolicyToPermissionSet"]) && equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.cloudformationStackDeletion
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "cloudformation.amazonaws.com") && equals("event.eventName",
        "DeleteStack") && equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.consoleLoginImpossibleTravel
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource","signin.amazonaws.com") && oneOf("event.eventName",["ConsoleLogin"])
        && equals("actionResult","success") && regexMatch("origin.geolocation.countryCode","^[A-Z]{2}$"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.crossAccountAccessAnomalies
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource","sts.amazonaws.com") && oneOf("event.eventName",["AssumeRole"])
        && equals("actionResult","success") && regexMatch("event.userIdentity.accountId","^[0-9]{12}$") && regexMatch("event.responseElements.assumedRoleUser.arn","^arn:[^:]+:sts::[0-9]{12}:assumed-role/.+$")
        && !regexMatch("event.responseElements.assumedRoleUser.arn","^arn:[^:]+:sts::" + safe("event.userIdentity.accountId", "") + ":assumed-role/"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.iamBackdoorCreationAttempts
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "iam.amazonaws.com") && oneOf("event.eventName", ["CreateUser",
        "CreateAccessKey", "AttachUserPolicy", "PutUserPolicy", "CreateLoginProfile"]) && equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.iamPrivilegeEscalationPaths
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "iam.amazonaws.com") &&
        oneOf("event.eventName", ["CreatePolicyVersion", "SetDefaultPolicyVersion", "AttachUserPolicy", "AttachGroupPolicy", "AttachRolePolicy", "PutUserPolicy", "PutGroupPolicy", "PutRolePolicy", "AddUserToGroup"]) &&
        equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.lambdaPrivilegeEscalation
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource","iam.amazonaws.com") && oneOf("event.eventName",["AttachRolePolicy",
        "AttachUserPolicy"]) && equals("actionResult","success") && regexMatch("event.requestParameters.policyArn","^arn:(aws|aws-cn|aws-us-gov):iam::aws:policy/(AdministratorAccess|IAMFullAccess)$"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.massResourceDeletion
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (regexMatch("event.eventName","^(Delete|Terminate|Remove)[A-Z]") && equals("actionResult","success")
        && !equals("event.eventSource","s3.amazonaws.com"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.route53DnsHijacking
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "route53.amazonaws.com") && equals("event.eventName",
        "ChangeResourceRecordSets") && equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.s3BulkDataExfiltration
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "s3.amazonaws.com") &&
        equals("event.eventName", "GetObject") &&
        equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.secretsManagerSuspiciousAccess
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "secretsmanager.amazonaws.com") && (equals("event.eventName",
        "GetSecretValue") || equals("event.eventName", "BatchGetSecretValue")) && equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.securityGroupModifications
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource","ec2.amazonaws.com") && oneOf("event.eventName",["AuthorizeSecurityGroupIngress",
        "AuthorizeSecurityGroupEgress", "ModifySecurityGroupRules"]) && equals("actionResult","success") && (exists('event.requestParameters.ipPermissions.items.#(ipRanges.items.#(cidrIp=="0.0.0.0/0"))')
        || exists('event.requestParameters.ipPermissions.items.#(ipv6Ranges.items.#(cidrIpv6=="::/0"))') || exists('event.requestParameters.securityGroupRuleSet.items.#(securityGroupRule.cidrIpv4=="0.0.0.0/0")')
        || exists('event.requestParameters.securityGroupRuleSet.items.#(securityGroupRule.cidrIpv6=="::/0")')))
  - add:
      function: string
      params:
        key: event.correlationCandidate.ssmSessionAbuse
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "ssm.amazonaws.com") &&
        oneOf("event.eventName", ["StartSession", "ResumeSession", "SendCommand", "StartAutomationExecution"]) &&
        equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.stsTokenAbuse
        value: match
      where: |-
        equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource", "sts.amazonaws.com") &&
        equals("event.eventName", "AssumeRole") &&
        equals("actionResult","success") &&
        equals("event.userIdentity.sessionContext.attributes.mfaAuthenticated", "false") &&
        !equals("event.userIdentity.type", "AWSService") &&
        !contains("event.userAgent", "aws-sdk") &&
        !contains("event.userAgent", "Botocore"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.unusualApiCallPatterns
        value: match
      where: "equals(\"event.awsRecordType\",\"cloudtrail\") && (exists(\"event.eventSource\") && \nexists(\"event.sourceIPAddress\") &&\n\
        exists(\"event.eventName\") &&\n(\n  oneOf(\"event.eventName\", [\"DescribeSecurityGroups\", \"DescribeNetworkAcls\", \"DescribeVpcs\"\
        , \"DescribeSubnets\", \"DescribeRouteTables\", \"DescribeInstances\", \"DescribeSnapshots\", \"DescribeVolumes\", \"DescribeImages\"\
        , \"DescribeKeyPairs\", \"ListBuckets\", \"GetBucketAcl\", \"GetBucketPolicy\", \"ListAccessKeys\", \"ListUsers\", \"ListRoles\"\
        , \"ListPolicies\", \"GetAccountAuthorizationDetails\", \"GenerateCredentialReport\", \"GetCredentialReport\"])\n) &&\nequals(\"\
        actionResult\",\"success\"))"
  - add:
      function: string
      params:
        key: event.correlationCandidate.vpcFlowLogAnomalies
        value: match
      where: equals("event.awsRecordType","cloudtrail") && (equals("event.eventSource","ec2.amazonaws.com") && oneOf("event.eventName",["DeleteFlowLogs"])
        && equals("actionResult","success"))
  - add:
      function: string
      params:
        key: event.correlationCandidate.credentialAccessAwsIamAssumeRoleBruteForce
