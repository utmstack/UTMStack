# macOS native JSON and forwarding-wrapper filter, version 3.1.0
pipeline:
  - dataTypes: [macos]
    steps:
      # Optional forwarding wrapper. Anchoring prevents payload text from
      # overriding the source, and the message is captured exactly once.
      - grok:
          source: raw
          patterns:
            - fieldName: ''
              pattern: '^\[utm_stack_agent_ds='
            - fieldName: event.datasourceoverride
              pattern: '[^\]\r\n]*'
            - fieldName: ''
              pattern: '\]-'
            - fieldName: event.wrapperMessage
              pattern: '(?s:.*)'
          where: startsWith("raw", "[utm_stack_agent_ds=") && !exists("event.message")
      - json:
          source: raw
          where: regexMatch("raw", "^\\s*\\{")
      - json:
          source: event.wrapperMessage
          where: regexMatch("event.wrapperMessage", "^\\s*\\{")
      - grok:
          source: event.wrapperMessage
          patterns:
            - fieldName: event.message
              pattern: '(?s:.*)'
          where: exists("event.wrapperMessage") && !regexMatch("event.wrapperMessage", "^\\s*\\{")
      # Normalize the legacy level before applying the existing noise policy.
      - grok:
          source: event.messageType
          patterns:
            - fieldName: event.level
              pattern: '(?s:.*)'
          where: '!exists("event.level")'
      # All fields used by the drop predicate are now available.
      - drop:
          where: equals("event.level", "notice") && contains("event.subsystem", "com.apple.cloudkit") || contains("event.subsystem", "com.apple.CoreDuet") || oneOf("event.subsystem", ["com.apple.apsd", "com.apple.bluetooth", "com.apple.SkyLight", "com.apple.mDNSResponder", "com.apple.homed", "com.apple.identityservicesd", "com.apple.powerlogd", "com.apple.analyticsd", "com.apple.UIKit", "com.apple.runningboard", "com.apple.WiFiManager", "com.apple.xpc", "com.apple.cache_delete", "com.apple.spotlightindex"])

      - rename:
          from: [event.activity_identifier]
          to: event.activityIdentifier
      - rename:
          from: [event.process_identifier]
          to: event.processIdentifier
      - rename:
          from: [event.store_category]
          to: event.storeCategory
      - rename:
          from: [event.thread_identifier]
          to: event.threadIdentifier
      - grok:
          source: event.class_name
          patterns:
            - fieldName: event.className
              pattern: '(?s:.*)'
          where: '!exists("event.className")'
      - grok:
          source: event.eventMessage
          patterns:
            - fieldName: event.message
              pattern: '(?s:.*)'
          where: '!exists("event.message")'

      # Native JSON preserves the vendor key (datasource_override); the
      # forwarding-wrapper grok carrier is datasourceoverride. The native rename
      # runs first, the wrapper rename second, so the wrapper wins when a wrapped
      # payload carries both.
      - rename:
          from: [event.datasource_override]
          to: dataSource
          where: regexMatch("event.datasource_override", "^[^\\s]+$") && !equals("event.datasource_override", "unknown")
      - rename:
          from: [event.datasourceoverride]
          to: dataSource
          where: regexMatch("event.datasourceoverride", "^[^\\s]+$") && !equals("event.datasourceoverride", "unknown")
      - grok:
          source: dataSource
          patterns:
            - fieldName: origin.host
              pattern: '(?s:.*)'
          where: '!oneOf("dataSource", ["", "unknown"])'
      - grok:
          source: event.process
          patterns:
            - fieldName: origin.process
              pattern: '(?s:.*)'
          where: exists("event.process")
      - grok:
          source: event.processImagePath
          patterns:
            - fieldName: origin.path
              pattern: '(?s:.*)'
          where: exists("event.processImagePath")
      - grok:
          source: event.timestamp
          patterns:
            - fieldName: deviceTime
              pattern: '(?s:.*)'
          where: regexMatch("event.timestamp", "^\\d{4}-\\d{2}-\\d{2}T")
      - add:
          function: string
          params:
            key: severity
            value: debug
          where: equals("event.level", "debug")
      - add:
          function: string
          params:
            key: severity
            value: info
          where: equals("event.level", "info")
      - add:
          function: string
          params:
            key: severity
            value: info
          where: equals("event.level", "notice")
      - add:
          function: string
          params:
            key: severity
            value: error
          where: equals("event.level", "error")
      - add:
          function: string
          params:
            key: severity
            value: critical
          where: equals("event.level", "fault")

      # Only matching security candidates may satisfy historical thresholds.
      # The raw contract tests check parity against the two rule predicates.
      - delete:
          fields: [event.correlationCandidate, event.wrapperMessage]
      - add:
          function: string
          params:
            key: event.correlationCandidate.endpointSecurity
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            (equals("event.subsystem", "com.apple.endpointsecurity") ||
             contains("origin.process", "EndpointSecurity") ||
             contains("event.message", "ES_EVENT_TYPE")) &&
            (contains("event.message", "bypass") ||
             contains("event.message", "failed authorization") ||
             contains("event.message", "client disconnected") ||
             contains("event.message", "authorization denied") ||
             contains("event.message", "invalid client") ||
             contains("event.message", "ES_RETURN_ERROR") ||
             equals("event.level", "error") ||
             contains("event.message", "memory leak detected"))
      - add:
          function: string
          params:
            key: event.correlationCandidate.ransomware
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            (  (contains("event.message", ["encrypted", "encrypt", ".locked", ".crypto", ".crypt"]) ||
             regexMatch("event.message", "(?i)\\.(locky|cerber|wannacry|ryuk|maze|conti|lockbit)$")) &&
            (contains("event.message", "rename") || contains("event.message", "modified") ||
             contains("event.message", "write")))
