# Compatibility wrapper extraction; macos.yml also handles this format.
pipeline:
  - dataTypes: [macos]
    steps:
      # Optional forwarding wrapper. Anchoring prevents payload text from
      # overriding the source, and the message is captured exactly once.
      - grok:
          source: raw
          patterns:
            - fieldName: ''
              pattern: '^\[utm_stack_agent_ds='
            - fieldName: event.datasourceoverride
              pattern: '[^\]\r\n]*'
            - fieldName: ''
              pattern: '\]-'
            - fieldName: event.wrapperMessage
              pattern: '(?s:.*)'
          where: startsWith("raw", "[utm_stack_agent_ds=") && !exists("event.message")
      - json:
          source: event.wrapperMessage
          where: regexMatch("event.wrapperMessage", "^\\s*\\{") && !exists("event.message")
      - grok:
          source: event.wrapperMessage
          patterns:
            - fieldName: event.message
              pattern: '(?s:.*)'
          where: exists("event.wrapperMessage") && !regexMatch("event.wrapperMessage", "^\\s*\\{") && !exists("event.message")
      - delete:
          fields: [event.wrapperMessage]
