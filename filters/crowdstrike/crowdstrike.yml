          to: event.eventPatternDispositionFlagsRegistryOperationBlocked
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.Rooting
          to: event.eventPatternDispositionFlagsRooting
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.SensorOnly
          to: event.eventPatternDispositionFlagsSensorOnly
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.SuspendParent
          to: event.eventPatternDispositionFlagsSuspendParent
          
      - rename:
          from:
