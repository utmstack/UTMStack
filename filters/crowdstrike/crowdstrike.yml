          to: event.metadataOffset
          
      - rename:
          from:
            - event.metadata.version
          to: event.metadataVersion
          
      - rename:
          from:
            - event.event.AgentId
          to: event.eventAgentId
          
      - rename:
          from:
            - event.event.AggregateId
          to: event.eventAggregateId
          
      - rename:
          from:
            - event.event.CloudIndicator
          to: event.eventCloudIndicator
          
      - rename:
          from:
            - event.event.CommandLine
          to: event.eventCommandLine
          
      - rename:
          from:
            - event.event.CompositeId
          to: event.eventCompositeId
          
      - rename:
          from:
            - event.event.DataDomains
          to: event.eventDataDomains
          
      - rename:
