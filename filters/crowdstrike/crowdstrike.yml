          to: origin.operatingSystem
          
      - rename:
          from:
            - event.event.ProcessEndTime
          to: event.eventProcessEndTime
          
      - rename:
          from:
            - event.event.ProcessId
          to: event.eventProcessId
          
      - rename:
          from:
            - event.event.ProcessStartTime
          to: event.eventProcessStartTime
          
      - rename:
          from:
            - event.event.RiskScore
          to: event.eventRiskScore
          
      - rename:
          from:
            - event.event.SHA1String
          to: origin.sha1
          
      - rename:
          from:
            - event.event.SHA256String
          to: origin.sha256
          
      - rename:
          from:
            - event.event.Severity
          to: event.eventSeverity
          
      - rename:
          from:
            - event.event.SeverityName
          to: event.eventSeverityName
          
      - rename:
          from:
            - event.event.SourceProducts
          to: event.eventSourceProducts
          
      - rename:
          from:
            - event.event.SourceVendors
          to: event.eventSourceVendors
          
      - rename:
          from:
            - event.event.Tactic
          to: event.eventTactic
          
      - rename:
          from:
            - event.event.Technique
          to: event.eventTechnique
          
      - rename:
          from:
            - event.event.Type
          to: event.eventType
          
      - rename:
          from:
            - event.event.UserName
          to: origin.user
          
      - rename:
          from:
            - event.event.FilesAccessed
          to: event.eventFilesAccessed

      # .......................................................................#
      # Remove inecesarie caracters
      # .......................................................................#
      - trim:
          function: prefix
          substring: '[{'
          fields:
            - event.eventCommandLine

      - trim:
          function: suffix
          substring: '}]'
          fields:
            - event.eventCommandLine

      # .......................................................................#
      # Reformat and field conversions
      # .......................................................................#
      - cast:
          fields:
            - event.statusCode
          to: float

      # .......................................................................#
      # Renaming "log.statusCode" to "statusCode" to add it to the event structure
      # .......................................................................#
      - rename:
          from:
            - event.statusCode
          to: statusCode

      # .......................................................................#
      # Adding geolocation to origin ip
      # .......................................................................#
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # .......................................................................#
      # Adding action result: only success, failed or denied, or no value when the
      # record states no final outcome.
      # An explicit Success=false or a 4xx/5xx response is a failed operation.
      # API records report Success=true even when the request failed, so a
      # response code decides success: only a final 2xx. Redirects and other
      # codes stay unset. Records without a response code use Success.
      # The denied steps run last, so a refusal replaces failed.
      # .......................................................................#
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'oneOf("event.eventSuccess", [false, "false"]) || greaterOrEqual("statusCode", 400)'
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: '!exists("actionResult") && ((exists("statusCode") && greaterOrEqual("statusCode", 200) && lessOrEqual("statusCode", 299)) || (!exists("statusCode") && oneOf("event.eventSuccess", [true, "true"])))'
      # A request refused for missing or insufficient rights (401, 403) is denied.
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'oneOf("statusCode", [401, 403])'
      # A detection whose prevention action really ran (process blocked or killed,
      # operation blocked, file quarantined) is denied. "Detection, ... would have
      # been blocked" records carry PolicyDisabled: nothing ran, so no value.
      # A failed kill (KillActionFailed) stopped nothing, so no value either.
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: >-
            oneOf("event.metadataEventType", ["DetectionSummaryEvent", "EppDetectionSummaryEvent"]) &&
            regexMatch("event.eventPatternDispositionDescription", "^Prevention") &&
            !oneOf("event.eventPatternDispositionFlagsPolicyDisabled", [true, "true"]) &&
            !oneOf("event.eventPatternDispositionFlagsKillActionFailed", [true, "true"]) &&
            (oneOf("event.eventPatternDispositionFlagsProcessBlocked", [true, "true"]) ||
             oneOf("event.eventPatternDispositionFlagsKillProcess", [true, "true"]) ||
             oneOf("event.eventPatternDispositionFlagsOperationBlocked", [true, "true"]) ||
             oneOf("event.eventPatternDispositionFlagsQuarantineFile", [true, "true"]) ||
             oneOf("event.eventPatternDispositionFlagsFsOperationBlocked", [true, "true"]) ||
             oneOf("event.eventPatternDispositionFlagsRegistryOperationBlocked", [true, "true"]))

      # .......................................................................#
      # Normalizing request method and renaming to action
      # .......................................................................#
      - add:
          function: 'string'
          params:
            key: action
            value: 'get'
          where: equals("event.eventAttributesRequestMethod", "GET")

      - add:
          function: 'string'
          params:
            key: action
            value: 'post'
          where: equals("event.eventAttributesRequestMethod", "POST")

      - add:
          function: 'string'
          params:
            key: action
            value: 'put'
          where: equals("event.eventAttributesRequestMethod", "PUT")

      - add:
          function: 'string'
          params:
            key: action
            value: 'delete'
          where: equals("event.eventAttributesRequestMethod", "DELETE")

      - add:
          function: 'string'
          params:
            key: action
            value: 'request'
          where: equals("event.eventAttributesRequestMethod", "REQUEST")

      # .......................................................................#
      # Removing unused fields
      # .......................................................................#
      - delete:
          fields:
            - event.statusCode
            - event.event.UserIp
            - event.event.Attributes.user_ip
            - event.event.Attributes.action_target_name