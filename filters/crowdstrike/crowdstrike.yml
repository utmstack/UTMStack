            - event.event.FileName
          to: origin.filename
          
      - rename:
          from:
            - event.event.FilePath
          to: origin.path
          
      - rename:
          from:
            - event.event.GrandParentCommandLine
          to: event.eventGrandParentCommandLine
          
      - rename:
          from:
            - event.event.GrandParentImageFileName
          to: event.eventGrandParentImageFileName
          
      - rename:
          from:
            - event.event.GrandParentImageFilePath
          to: event.eventGrandParentImageFilePath
          
      - rename:
          from:
            - event.event.Hostname
          to: origin.host
          
      - rename:
          from:
            - event.event.LocalIP
          to: origin.ip

      # Console sign-in records (AuthActivityAuditEvent) carry the client address
      # only as UserIp. API and stream records already set origin.ip from SourceIp,
      # which holds the same address, so an existing origin.ip is kept.
      - rename:
          from:
            - event.event.UserIp
          to: origin.ip
          where: '!exists("origin.ip") && (inCIDR("event.event.UserIp", "0.0.0.0/0") || inCIDR("event.event.UserIp", "::/0")) && !inCIDR("event.event.UserIp", "0.0.0.0/32") && !inCIDR("event.event.UserIp", "::/128")'
          
      - rename:
          from:
            - event.event.LocalIPv6
          to: event.eventLocalIPv6
          
      - rename:
          from:
            - event.event.LogonDomain
          to: event.eventLogonDomain
          
      - rename:
          from:
            - event.event.MACAddress
          to: origin.mac
          
      - rename:
          from:
            - event.event.MD5String
          to: origin.md5
          
      - rename:
          from:
            - event.event.MitreAttack
          to: event.eventMitreAttack
          
      - rename:
          from:
            - event.event.Name
          to: event.eventName
          
      - rename:
          from:
            - event.event.Objective
          to: event.eventObjective
          
      - rename:
          from:
            - event.event.ParentCommandLine
          to: event.eventParentCommandLine
          
      - rename:
          from:
            - event.event.ParentImageFileName
          to: event.eventParentImageFileName
          
      - rename:
          from:
            - event.event.ParentImageFilePath
          to: event.eventParentImageFilePath
          
      - rename:
          from:
