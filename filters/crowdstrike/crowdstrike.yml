          to: event.eventParentProcessId
          
      - rename:
          from:
            - event.event.PatternDispositionDescription
          to: event.eventPatternDispositionDescription
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.BlockingUnsupportedOrDisabled
          to: event.eventPatternDispositionFlagsBlockingUnsupportedOrDisabled
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.BootupSafeguardEnabled
          to: event.eventPatternDispositionFlagsBootupSafeguardEnabled
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.ContainmentFileSystem
          to: event.eventPatternDispositionFlagsContainmentFileSystem
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.CriticalProcessDisabled
          to: event.eventPatternDispositionFlagsCriticalProcessDisabled
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.Detect
          to: event.eventPatternDispositionFlagsDetect
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.FsOperationBlocked
          to: event.eventPatternDispositionFlagsFsOperationBlocked
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.HandleOperationDowngraded
          to: event.eventPatternDispositionFlagsHandleOperationDowngraded
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.InddetMask
          to: event.eventPatternDispositionFlagsInddetMask
          
      - rename:
          from:
            - event.event.PatternDispositionFlags.Indicator
          to: event.eventPatternDispositionFlagsIndicator
          
      - rename:
          from:
