# Crowdstrike module filter, version 1.3.1
# Based in docs and samples provided
# 
# Documentations
# 1- https://docs.cyderes.cloud/parser-knowledge-base/cs_stream

pipeline:
  - dataTypes:
      - crowdstrike
    steps:
      - json:
          source: raw

      # .......................................................................#
