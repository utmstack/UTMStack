          to: event.eventPatternDispositionValue
          
      - rename:
          from:
            - event.event.PatternId
          to: event.eventPatternId
          
      - rename:
          from:
            - event.event.PlatformId
          to: event.eventPlatformId
          
      - rename:
          from:
