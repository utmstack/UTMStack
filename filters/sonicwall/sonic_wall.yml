# SonicWall Firewall — version 4.2.0
#
# Formats supported
#   - SonicOS syslog KV:  <pri>  id=firewall sn=... time="..." fw=... msg="..." src=IP:PORT:IF ...
#   - SonicOS syslog CEF: <pri> CEF:0|SonicWall|SonicOS|...|EventID|EventName|Sev|extension
#     where `extension` carries the same k=v pairs as the KV variant.
#
# References
# - https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-4-log-events-reference-guide.pdf
# - https://www.sonicwall.com/techdocs/pdf/SonicOS-X_7.0.1_LogEvents_ReferenceGuide.pdf

pipeline:
  - dataTypes:
      - firewall-sonicwall
    steps:
      # -------------------------------------------------------------------
      # Syslog header (<pri>)
      # -------------------------------------------------------------------
      - grok:
          source: raw
          patterns:
            - fieldName: event.syslogPri
              pattern: '\<{{.integer}}\>'

      - trim:
          function: prefix
          substring: "<"
          fields:
            - event.syslogPri
      - trim:
          function: suffix
          substring: ">"
          fields:
            - event.syslogPri

      # -------------------------------------------------------------------
      # CEF header (only when the log line contains "CEF:")
      # The grok step matches each pattern alone and rejects an empty match,
      # so header fields use a non-empty pattern instead of a lazy one.
      # -------------------------------------------------------------------
      - grok:
          source: raw
          patterns:
            - fieldName: ""
              pattern: '{{.data}}CEF:'
            - fieldName: event.cefVersion
              pattern: '{{.integer}}'
            - fieldName: ""
              pattern: '\|'
            - fieldName: event.deviceVendor
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: ""
              pattern: '\|'
            - fieldName: event.deviceProduct
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: ""
              pattern: '\|'
            - fieldName: event.deviceVersion
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: ""
              pattern: '\|'
            - fieldName: event.eventCode
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: ""
              pattern: '\|'
            - fieldName: event.eventName
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: ""
              pattern: '\|'
            - fieldName: event.cefSeverity
              pattern: '(?:[^|\\]|\\.)+'
            - fieldName: ""
              pattern: '\|'
          where: contains("raw", "CEF:")

      # -------------------------------------------------------------------
      # Key/Value pass over raw
      # -------------------------------------------------------------------
      - kv:
          source: raw
          fieldSplit: " "
          valueSplit: "="

      # -------------------------------------------------------------------
      # Rescue quoted / space-bearing values.
      # -------------------------------------------------------------------
      - delete:
          fields:
            - event.msg
          where: contains("raw", "msg=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(msg=)'
            - fieldName: event.message
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "msg=\"")

      - delete:
          fields:
            - event.note
          where: contains("raw", "note=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(note=)'
            - fieldName: event.note
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "note=\"")

      - delete:
          fields:
            - event.Category
          where: contains("raw", "Category=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(Category=)'
            - fieldName: event.contentCategory
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "Category=\"")

      - delete:
          fields:
            - event.rule
          where: contains("raw", "rule=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(rule=)'
            - fieldName: event.rule
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "rule=\"")

      - delete:
          fields:
            - event.sess
          where: contains("raw", "sess=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(sess=)'
            - fieldName: event.sessionType
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "sess=\"")

      - delete:
          fields:
            - event.vpnpolicy
          where: contains("raw", "vpnpolicy=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(vpnpolicy=)'
            - fieldName: event.vpnPolicy
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "vpnpolicy=\"")

      - delete:
          fields:
            - event.usr
          where: contains("raw", "usr=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(usr=)'
            - fieldName: event.userRaw
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "usr=\"")

      - delete:
          fields:
            - event.uuid
          where: contains("raw", "uuid=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(uuid=)'
            - fieldName: event.eventUuid
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "uuid=\"")

      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(fw_action=)'
            - fieldName: event.actionRaw
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "fw_action=\"")

      - delete:
          fields:
            - event.appName
          where: contains("raw", "appName='")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(appName=)'
            - fieldName: event.appName
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "appName='")

      - delete:
          fields:
            - event.time
          where: contains("raw", "time=\"")
      - grok:
          source: raw
          patterns:
            - fieldName: event.grokTrash
              pattern: '{{.data}}(time=)'
            - fieldName: event.deviceTimeRaw
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.grokTrash
              pattern: '{{.greedy}}'
          where: contains("raw", "time=\"")

      # -------------------------------------------------------------------
      # Strip the trailing `word=` that the rescue groks include in
      # the captured value.
      # -------------------------------------------------------------------
      - grok:
          source: event.message
          patterns:
            - fieldName: event.message
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.message")

      - grok:
          source: event.note
          patterns:
            - fieldName: event.note
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.note")

      - grok:
          source: event.contentCategory
          patterns:
            - fieldName: event.contentCategory
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.contentCategory")

      - grok:
          source: event.rule
          patterns:
            - fieldName: event.rule
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.rule")

      - grok:
          source: event.sessionType
          patterns:
            - fieldName: event.sessionType
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.sessionType")

      - grok:
          source: event.vpnPolicy
          patterns:
            - fieldName: event.vpnPolicy
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.vpnPolicy")

      - grok:
          source: event.userRaw
          patterns:
            - fieldName: event.userRaw
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.userRaw")

      - grok:
          source: event.eventUuid
          patterns:
            - fieldName: event.eventUuid
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.eventUuid")

      - grok:
          source: event.actionRaw
          patterns:
            - fieldName: event.actionRaw
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.actionRaw")

      - grok:
          source: event.appName
          patterns:
            - fieldName: event.appName
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.appName")

      - grok:
          source: event.deviceTimeRaw
          patterns:
            - fieldName: event.deviceTimeRaw
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.grokTrash
              pattern: '{{.word}}(=)'
          where: exists("event.deviceTimeRaw")

      # -------------------------------------------------------------------
      # Split src / dst  =>  ip[:port[:iface]], ip:port or ip::iface.
      # Each shape has its own step: a step writes only when all its patterns match.
      # -------------------------------------------------------------------
      # ip:port:interface
      - grok:
          source: event.src
          patterns:
            - fieldName: origin.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: event.sourceInterface
              pattern: '{{.word}}'
          where: regexMatch("event.src", "^[0-9.]+:[0-9]+:.")
      # ip:port, used by VPN negotiation events
      - grok:
          source: event.src
          patterns:
            - fieldName: origin.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: origin.port
              pattern: '{{.integer}}'
          where: regexMatch("event.src", "^[0-9.]+:[0-9]+$")
      # ip::interface, used by user login events
      - grok:
          source: event.src
          patterns:
            - fieldName: origin.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: '::'
            - fieldName: event.sourceInterface
              pattern: '{{.word}}'
          where: regexMatch("event.src", "^[0-9.]+::.")

      - delete:
          fields:
            - event.src
          where: exists("origin.ip")

      # A bare address; any other value stays under its vendor key.
      - rename:
          from:
            - event.src
          to: origin.ip
          where: inCIDR("event.src", "0.0.0.0/0")

      # ip:port:interface
      - grok:
          source: event.dst
          patterns:
            - fieldName: target.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: event.targetInterface
              pattern: '{{.word}}'
          where: regexMatch("event.dst", "^[0-9.]+:[0-9]+:.")
      # ip:port, used by VPN negotiation events
      - grok:
          source: event.dst
          patterns:
            - fieldName: target.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: target.port
              pattern: '{{.integer}}'
          where: regexMatch("event.dst", "^[0-9.]+:[0-9]+$")
      # ip::interface, used by user login events
      - grok:
          source: event.dst
          patterns:
            - fieldName: target.ip
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: '::'
            - fieldName: event.targetInterface
              pattern: '{{.word}}'
          where: regexMatch("event.dst", "^[0-9.]+::.")

      - delete:
          fields:
            - event.dst
          where: exists("target.ip")

      # A bare address; any other value stays under its vendor key.
      - rename:
          from:
            - event.dst
          to: target.ip
          where: inCIDR("event.dst", "0.0.0.0/0")

      - grok:
          source: event.natSrc
          patterns:
            - fieldName: event.natSourceIp
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: event.natSourcePort
              pattern: '{{.integer}}'
          where: contains("event.natSrc", ":")

      - delete:
          fields:
            - event.natSrc
          where: contains("event.natSrc", ":")

      - grok:
          source: event.natDst
          patterns:
            - fieldName: event.natTargetIp
              pattern: '{{.ipv4}}'
            - fieldName: ""
              pattern: ':'
            - fieldName: event.natTargetPort
              pattern: '{{.integer}}'
          where: contains("event.natDst", ":")

      - delete:
          fields:
            - event.natDst
          where: contains("event.natDst", ":")

      # -------------------------------------------------------------------
      # Split protocol => transport / service
      # -------------------------------------------------------------------
      - grok:
          source: event.proto
          patterns:
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: ""
              pattern: '/'
            - fieldName: event.appProto
              pattern: '{{.notSpace}}'
          where: contains("event.proto", "/")

      - delete:
          fields:
            - event.proto
          where: contains("event.proto", "/")

      - rename:
          from:
            - event.proto
          to: protocol

      # -------------------------------------------------------------------
      # Canonical + human-readable renames
      # -------------------------------------------------------------------
      - rename:
          from:
            - event.dstname
          to: target.host
      - rename:
          from:
            - event.srcMac
          to: origin.mac
      - rename:
          from:
            - event.dstMac
          to: target.mac
      - rename:
          from:
            - event.smac
          to: origin.mac
      - rename:
          from:
            - event.dmac
          to: target.mac
      - rename:
          from:
            - event.sent
          to: origin.bytesSent
      - rename:
          from:
            - event.rcvd
          to: origin.bytesReceived
      - rename:
          from:
            - event.spkt
          to: origin.packagesSent
      - rename:
          from:
            - event.rpkt
          to: origin.packagesReceived
      - rename:
          from:
            - event.id
          to: event.sourceId
      - rename:
          from:
            - event.sn
          to: event.deviceSerial
      - rename:
          from:
            - event.fw
          to: event.deviceIp
      - rename:
          from:
            - event.pri
          to: event.priority
      - rename:
          from:
            - event.c
          to: event.messageClass
      - rename:
          from:
            - event.gcat
          to: event.groupCategoryId
      - rename:
          from:
            - event.m
          to: event.eventCode
      - rename:
          from:
            - event.n
          to: event.eventSerial
      - rename:
          from:
            - event.app
          to: event.appId
      - rename:
          from:
            - event.srcZone
          to: event.sourceZone
      - rename:
          from:
            - event.dstZone
          to: event.targetZone
      - rename:
          from:
            - event.code
          to: event.contentCode
      - rename:
          from:
            - event.arg
          to: event.webPath
      - rename:
          from:
            - event.dpi
          to: event.dpiEnabled
      - rename:
          from:
            - event.ipscat
          to: event.ipsCategory
      - rename:
          from:
            - event.ipspri
          to: event.ipsPriority
      - rename:
          from:
            - event.spycat
          to: event.spywareCategory
      - rename:
          from:
            - event.spypri
          to: event.spywarePriority
      - rename:
          from:
            - event.af_service
          to: event.appFirewallService
      - rename:
          from:
            - event.af_type
          to: event.appFirewallType
      - rename:
          from:
            - event.result
          to: event.threatResult
      - rename:
          from:
            - event.cs6
          to: event.threatContext

      # fw_action is often the last key, which the rescue above cannot bound.
      # Fall back to the KV value; go-sdk v1.1.35 and later keep the underscore.
      - rename:
          from:
            - event.fw_action
            - event.fwaction
          to: event.actionRaw
          where: '!exists("event.actionRaw")'

      # -------------------------------------------------------------------
      # Strip residual quotes / apostrophes from rescued values.
      # -------------------------------------------------------------------
      - trim:
          function: prefix
          substring: '"'
          fields:
            - event.message
            - event.note
            - event.contentCategory
            - event.rule
            - event.sessionType
            - event.vpnPolicy
            - event.eventUuid
            - event.deviceTimeRaw
            - event.actionRaw
            - event.userRaw
      - trim:
          function: suffix
          substring: '"'
          fields:
            - event.message
            - event.note
            - event.contentCategory
            - event.rule
            - event.sessionType
            - event.vpnPolicy
            - event.eventUuid
            - event.deviceTimeRaw
            - event.actionRaw
            - event.userRaw
      - trim:
          function: prefix
          substring: "'"
          fields:
            - event.appName
      - trim:
          function: suffix
          substring: "'"
          fields:
            - event.appName

      - rename:
          from:
            - event.actionRaw
          to: action
      - rename:
          from:
            - event.userRaw
          to: origin.user

      # -------------------------------------------------------------------
      # Type casts
      # -------------------------------------------------------------------
      - cast:
          fields:
            - origin.port
            - target.port
            - event.natSourcePort
            - event.natTargetPort
          to: int
      - cast:
          fields:
            - origin.bytesSent
            - origin.bytesReceived
          to: float
      - cast:
          fields:
            - origin.packagesSent
            - origin.packagesReceived
          to: int
      - cast:
          fields:
            - event.groupCategoryId
            - event.eventCode
            - event.priority
          to: string

      # -------------------------------------------------------------------
      # actionResult: only success, failed or denied, or no value when the
      # record states no final outcome. The steps run success, then failed,
      # then denied. The failed and denied steps are not guarded, so a stated
      # failure or block always overwrites a broad success.
      # -------------------------------------------------------------------
      # The firewall let the traffic or the management request through.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: oneOf("action", ["forward", "mgmt"])
      # Events without a firewall decision, by the meaning of their message:
      # 29, 31, 236, 237, 238 and 1080 "... login allowed"; 942 "IKEv2
      # Authentication successful"; 978 "IKEv2 negotiation complete"; 89 "IKE
      # negotiation complete. Adding IPsec SA. (Phase 2)"; 139 "XAUTH Succeeded
      # with VPN client"; 357 "Main Mode complete (Phase 1)"; 1794 "Allowed a
      # login attempt by a user whose password ... compromised".
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: oneOf("event.eventCode", ["29", "31", "236", "237", "238", "1080", "942", "978", "89", "139", "357", "1794"])
      # 537 "Connection Closed" follows an allowed connection; only one that
      # received data back completed. Without received bytes it keeps no outcome.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!exists("actionResult") && equals("event.eventCode", "537") && greaterThan("origin.bytesReceived", 0)'
      # Attempted and not completed. 32, 33 and 200 "... login denied due to bad
      # credentials"; 34 "Pending login timed out"; 140 "XAUTH Failed ...
      # Authentication failure"; 243, 244, 746 and 747 RADIUS or LDAP failures;
      # 1035 "password expired"; 1117 "SSO probe failed"; failed IKE negotiations
      # 401 NO_PROPOSAL_CHOSEN, 402 and 981 proposal mismatch, 403 and 971
      # negotiation aborted (timeout, peer not responding), 405 and 616 payload
      # validation or processing failed, 414 INVALID_COOKIES, 545 tunnel end
      # point mismatch, 658 IKE ID mismatch, 914, 916 and 919 Phase 1 algorithm
      # or DH group mismatch, 953 IKEv2 payload error, 967 and 1305 VPN policy
      # not found, 983 IKEv2 notify error; 1222 "Invalid SNMPv3 User"; 1226
      # "HTTPS Handshake" alert; and any other "... denied due to bad
      # credentials" message. Retransmit notices (931, 972) keep no outcome.
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: oneOf("event.eventCode", ["32", "33", "34", "140", "200", "243", "244", "746", "747", "1035", "1117", "401", "402", "403", "405", "414", "545", "616", "658", "914", "916", "919", "953", "967", "971", "981", "983", "1305", "1222", "1226"]) || contains("event.message", "denied due to bad credentials")
      # Refused by a control; runs last so a firewall decision or a stated
      # block wins. fw_action drop or deny; 986 "User login denied - not allowed
      # by Policy rule"; 1079 "SSLVPN service is not allowed on <zone>"; 27
      # "Land attack dropped"; 267 "TCP Xmas Tree dropped"; 1475 "Responder from
      # country blocked"; 809 Gateway Anti-Virus alerts that end "blocked.";
      # scan detections whose note starts "Pkt is dropped" (82, 83, 177); and
      # older SonicOS lines without fw_action for 14 "Web site access denied"
      # and 38 "ICMP packet dropped".
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: oneOf("action", ["drop", "dropped", "deny", "denied", "block", "blocked"]) || oneOf("event.eventCode", ["986", "1079", "27", "267", "1475"]) || (equals("event.eventCode", "809") && endsWith("event.message", "blocked.")) || startsWith("event.note", "Pkt is dropped") || (!exists("action") && oneOf("event.eventCode", ["14", "38"]))

      # -------------------------------------------------------------------
      # Group category human label from log.groupCategoryId (1..17)
      # -------------------------------------------------------------------
      - add:
          function: string
          params:
            key: event.groupCategory
            value: System
          where: equals("event.groupCategoryId", "1")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Log
          where: equals("event.groupCategoryId", "2")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Security Services
          where: equals("event.groupCategoryId", "3")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Users
          where: equals("event.groupCategoryId", "4")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Firewall Settings
          where: equals("event.groupCategoryId", "5")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Network
          where: equals("event.groupCategoryId", "6")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: VPN
          where: equals("event.groupCategoryId", "7")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: High Availability
          where: equals("event.groupCategoryId", "8")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: 3G/4G, Modem, and Module
          where: equals("event.groupCategoryId", "9")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Firewall
          where: equals("event.groupCategoryId", "10")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Wireless
          where: equals("event.groupCategoryId", "11")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: VoIP
          where: equals("event.groupCategoryId", "12")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: SSL VPN
          where: equals("event.groupCategoryId", "13")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Anti-Spam
          where: equals("event.groupCategoryId", "14")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: WAN Acceleration
          where: equals("event.groupCategoryId", "15")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: SD-WAN
          where: equals("event.groupCategoryId", "16")
      - add:
          function: string
          params:
            key: event.groupCategory
            value: Multi-Tenancy
          where: equals("event.groupCategoryId", "17")

      # -------------------------------------------------------------------
      # Severity from syslog priority (SonicWall log.priority = 0..7)
      # -------------------------------------------------------------------
      - add:
          function: string
          params:
            key: severity
            value: critical
          where: oneOf("event.priority", ["0", "1", "2"])
      - add:
          function: string
          params:
            key: severity
            value: error
          where: equals("event.priority", "3")
      - add:
          function: string
          params:
            key: severity
            value: warning
          where: equals("event.priority", "4")
      - add:
          function: string
          params:
            key: severity
            value: info
          where: oneOf("event.priority", ["5", "6"])
      - add:
          function: string
          params:
            key: severity
            value: debug
          where: equals("event.priority", "7")

      # -------------------------------------------------------------------
      # Geolocation
      # -------------------------------------------------------------------
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # -------------------------------------------------------------------
      # 13. Cleanup
      # -------------------------------------------------------------------
      - delete:
          fields:
            - event.syslogPri
            - event.cefVersion
            - event.fwaction
            - event.fw_action
            - event.grokTrash
