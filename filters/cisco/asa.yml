      #......................................................................#
      # ASA-302003,302004
      # First variant
      - grok:
          patterns:
            - fieldName: action
              pattern: '(Built H245 connection|Pre-allocate H323 UDP backconnection)'
            - fieldName: event.irrelevant
              pattern: 'for'
            - fieldName: event.foreignAddress
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.tmpToip
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})((\s)?/(\s)?{{.integer}}|(\s)?/)?'
            - fieldName: event.localAddress
              pattern: '(?:to\s+)?({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.tmpFromip
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})((\s)?/(\s)?{{.integer}}|(\s)?/)?'
          source: event.msg
          where: equals("event.messageId", 302003) || equals("event.messageId", 302004)
      # The optional "to" is read with the local address above; keep only the address.
      - trim:
          function: regex
          substring: '^to\s+'
          fields:
