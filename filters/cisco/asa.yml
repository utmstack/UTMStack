# CISCO ASA filter, version 3.2.0
# Based on examples provided and https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog.html
# Filter Input requirements -> Syslog
#
# 1. Parsing the message field containing the Cisco ASA log
pipeline:
  - dataTypes:
      - firewall-cisco-asa
    steps:
      # Common ASA fields
      - grok:
          patterns:
            - fieldName: event.syslogPri
              pattern: '(\<{{.integer}}\>)'
            - fieldName: event.ciscoTime
              pattern: '({{.day}}\s)?{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: event.localIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.asaHeader
              pattern: '{{.data}}ASA-'
            - fieldName: event.severity
              pattern: '{{.integer}}'
            - fieldName: event.messageId
              pattern: '-{{.integer}}'
            - fieldName: event.ciscoSeparator
              pattern: '\:{{.space}}'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
      - grok:
          patterns:
            - fieldName: event.ciscoTime
              pattern: '({{.day}}\s)?{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: event.localIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.asaHeader
              pattern: '{{.data}}ASA-'
            - fieldName: event.severity
              pattern: '{{.integer}}'
            - fieldName: event.messageId
              pattern: '-{{.integer}}'
            - fieldName: event.ciscoSeparator
              pattern: '\:{{.space}}'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
      #......................................................................#
      # Adding log.localIp geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.localIp
            destination: event.localIpGeolocation
          where: exists("event.localIp")
      # Removing unwanted prefixes
      - trim:
          function: prefix
          substring: '-'
          fields:
            - event.messageId
      # Field conversions
      - cast:
          fields:
            - event.messageId
          to: int
      # Begining specific message parsing
      #......................................................................#
      # ASA-2-106001
      - grok:
          patterns:
            - fieldName: event.direction
              pattern: '{{.word}}'
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'connection'
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: origin.port
              pattern: '/{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'to'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: target.port
              pattern: '/{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'flags'
            - fieldName: event.flags
              pattern: '{{.data}}\s'
            - fieldName: event.irrelevant
              pattern: 'on\sinterface'
            - fieldName: event.srcInterface
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106001)

      - trim:
          function: prefix
          substring: '/'
          fields:
            - origin.port
            - target.port
          where: equals("event.messageId", 106001)
      # The security policy denied the inbound TCP connection.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 106001)

      #......................................................................#
      #ASA-2-106017
      - grok:
          patterns:
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'IP\sdue\sto'
            - fieldName: action
              pattern: '{{.greedy}}from'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'to'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
          source: event.msg
          where: equals("event.messageId", 106017)
      - trim:
          function: suffix
          substring: 'from'
          fields:
            - action
          where: equals("event.messageId", 106017)
      # The firewall dropped the land-attack packet.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 106017)
      #......................................................................#
      # ASA-1-106021
      - grok:
          patterns:
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: action
              pattern: '{{.greedy}}from'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'to'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'on\sinterface'
            - fieldName: event.srcInterface
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106021)
      - trim:
          function: suffix
          substring: 'from'
          fields:
            - action
          where: equals("event.messageId", 106021)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 106021)
      #......................................................................#
      # ASA-2-106101
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Number of cached deny-flows for ACL log has reached limit'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106101)
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Number of cached'
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 106101)
      # Parsing the limit number
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '\('
            - fieldName: event.numFlows
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.rest
          where: equals("event.messageId", 106101)
      # Field conversions
      - cast:
          fields:
            - event.numFlows
          to: int
          where: equals("event.messageId", 106101)
      
      #......................................................................#
      # ASA-6-106102,106103
      # First variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'access-list'
            - fieldName: event.accessList
              pattern: '{{.data}}\s'
            - fieldName: actionResult
              pattern: '{{.word}}'
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}})\s'
            - fieldName: event.srcInterface
              pattern: '{{.data}}/'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.dstInterface
              pattern: '{{.data}}/'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'hit-cnt'
            - fieldName: event.hitCount
              pattern: '{{.integer}}'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      # Second variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'access-list'
            - fieldName: event.accessList
              pattern: '{{.data}}\s'
            - fieldName: actionResult
              pattern: '{{.word}}'
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}})\s'
            - fieldName: event.srcInterface
              pattern: '{{.data}}/'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: origin.port
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: '-\>'
            - fieldName: event.dstInterface
              pattern: '{{.data}}/'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: target.port
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: 'hit-cnt'
            - fieldName: event.hitCount
              pattern: '{{.integer}}'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: suffix
          substring: '/'
          fields:
            - event.srcInterface
            - event.dstInterface
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: prefix
          substring: ''''
          fields:
            - origin.user
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: suffix
          substring: ''''
          fields:
            - origin.user
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: prefix
          substring: '('
          fields:
            - origin.port
            - target.port
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: suffix
          substring: ')'
          fields:
            - origin.port
            - target.port
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: exists("actionResult") && (equals("event.messageId", 106102) || equals("event.messageId", 106103)) && !equalsIgnoreCase("actionResult", "Permitted")
      # A permitted access-list hit states no final outcome: drop the verb the grok wrote.
      - delete:
          fields:
            - actionResult
          where: exists("actionResult") && (equals("event.messageId", 106102) || equals("event.messageId", 106103)) && equalsIgnoreCase("actionResult", "Permitted")
      #......................................................................#
      # ASA-4-109017
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'User at'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'exceeded auth proxy connection limit'
            - fieldName: event.limit
              pattern: '\({{.integer}}'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109017)

      - trim:
          function: prefix
          substring: '('
          fields:
            - event.limit
          where: equals("event.messageId", 109017)
      - cast:
          fields:
            - event.limit
          to: int
          where: equals("event.messageId", 109017)
      #......................................................................#
      # ASA-6-109101
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Received CoA disconnect request'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}}),'
            - fieldName: event.irrelevant
              pattern: 'with\saudit-session-id:'
            - fieldName: event.auditSessionId
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109101)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Received CoA'
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 109101)
      - trim:
          function: suffix
          substring: ','
          fields:
            - origin.user
          where: equals("event.messageId", 109101)
      # No actionResult: an informational notice with no final outcome.
      #......................................................................#
      # ASA-4-109102
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Received CoA {{.word}}'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: ', but cannot find named session'
            - fieldName: event.auditSessionId
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109102)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Received CoA'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 109102)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: equals("event.messageId", 109102)
      #......................................................................#
      # ASA-3-109103
      - grok:
          patterns:
            - fieldName: action
              pattern: 'CoA {{.word}}'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: 'failed for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}}),'
            - fieldName: event.irrelevant
              pattern: 'with session ID:'
            - fieldName: event.auditSessionId
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109103)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'CoA'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 109103)
      - trim:
          function: suffix
          substring: ','
          fields:
            - origin.user
          where: equals("event.messageId", 109103)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: equals("event.messageId", 109103)
      #......................................................................#
      # ASA-109201 to 109213
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'UAUTH(:)? Session(\s|=)'
            - fieldName: event.session
              pattern: '{{.data}},'
            - fieldName: event.irrelevant
              pattern: 'User(\s|=)'
            - fieldName: origin.user
              pattern: '{{.data}},'
            - fieldName: event.irrelevant
              pattern: 'Assigned IP(\s|=)'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: ','
            - fieldName: action
              pattern: '{{.greedy}}'
          source: event.msg
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213)
      - trim:
          function: suffix
          substring: ','
          fields:
            - event.session
            - origin.user
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213)
      # UAUTH entries: the text says Succeeded or Failed; other texts (for example stale-entry removal) get no value.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213) && contains("event.msg", "Succeeded")
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213) && contains("event.msg", "Failed")
      #......................................................................#
      # ASA-6-113004
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA user {{.word}} Successful'
            - fieldName: event.irrelevant
              pattern: '\:'
            - fieldName: event.irrelevant
              pattern: 'server(\s)?=(\s)?'
            - fieldName: target.ip
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(U|u)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113004)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'AAA user {{.word}}'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 113004)
      - trim:
          function: suffix
          substring: ':'
          fields:
            - target.ip
          where: equals("event.messageId", 113004)
      - trim:
          function: suffix
          substring: ','
          fields:
            - target.ip
          where: equals("event.messageId", 113004)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: equals("event.messageId", 113004)
      #......................................................................#
      # ASA-6-113005
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA user authentication Rejected(\s)?'
            - fieldName: event.irrelevant
              pattern: '\:(\s)?reason(\s)?=(\s)'
            - fieldName: event.reason
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(server|Server)(\s)?=(\s)?'
            - fieldName: target.ip
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(U|u)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(U|u)ser IP(\s)?=(\s)?'
            - fieldName: origin.ip
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113005)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'AAA user authentication'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 113005)
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.reason
            - target.ip
            - origin.user
          where: equals("event.messageId", 113005)
      # Rejected authentication is a failed sign-in; rejected authorization stays denied.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'failed'
          where: equals("event.messageId", 113005) && contains("event.msg", "authentication Rejected")
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 113005) && !contains("event.msg", "authentication Rejected")
      #......................................................................#
      # ASA-6-113008
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA transaction status ACCEPT(\s)?'
            - fieldName: event.irrelevant
              pattern: '\:(\s)?(u|U)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113008)
      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: equals("event.messageId", 113008)
      #......................................................................#
      # ASA-6-113009
      # First variant
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA retrieved default group policy'
            - fieldName: event.policy
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: 'for (u|U)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113009)
      - trim:
          function: prefix
          substring: '('
          fields:
            - event.policy
          where: equals("event.messageId", 113009)
      - trim:
          function: suffix
          substring: ')'
          fields:
            - event.policy
          where: equals("event.messageId", 113009)
      # Second variant
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA retrieved default group policy'
            - fieldName: event.policy
              pattern: '{{.data}}\sfor'
            - fieldName: event.irrelevant
              pattern: '(u|U)ser(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113009) && !exists("origin.user")
      - trim:
          function: suffix
          substring: 'for'
          fields:
            - event.policy
          where: equals("event.messageId", 113009)
      # No actionResult: an informational notice with no final outcome.
      #......................................................................#
      # ASA-6-113010
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA challenge received for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}}) from server'
            - fieldName: origin.ip
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113010)
      - trim:
          function: suffix
          substring: 'from server'
          fields:
            - origin.user
          where: equals("event.messageId", 113010)
      #......................................................................#
      # ASA-6-113011
      # First variant
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA retrieved user specific group policy'
            - fieldName: event.policy
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: 'for (u|U)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113011)
      - trim:
          function: prefix
          substring: '('
          fields:
            - event.policy
          where: equals("event.messageId", 113011)
      - trim:
          function: suffix
          substring: ')'
          fields:
            - event.policy
          where: equals("event.messageId", 113011)
      # Second variant
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA retrieved user specific group policy'
            - fieldName: event.policy
              pattern: '{{.data}}\sfor'
            - fieldName: event.irrelevant
              pattern: '(u|U)ser(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113011) && !exists("origin.user")
      - trim:
          function: suffix
          substring: 'for'
          fields:
            - event.policy
          where: equals("event.messageId", 113011)
      #......................................................................#
      # ASA-6-113012
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA user authentication Successful(\s)?'
            - fieldName: event.irrelevant
              pattern: '\:(\s)?local database(\s)?:(\s)?user(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113012)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'AAA user authentication'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 113012)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'success'
          where: equals("event.messageId", 113012)
      #......................................................................#
      # ASA-6-113013
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA unable to complete the request'
            - fieldName: event.irrelevant
              pattern: 'Error(\s)?:(\s)?reason(\s)?=(\s)?'
            - fieldName: event.reason
              pattern: '{{.data}}\:'
            - fieldName: event.irrelevant
              pattern: 'user(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113013)
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.reason
          where: equals("event.messageId", 113013)
      #......................................................................#
      # ASA-6-113014
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA authentication server not accessible(\s)?'
            - fieldName: event.irrelevant
