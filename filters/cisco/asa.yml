      # Cleaning fields
      - trim:
          function: suffix
          substring: '/'
          fields:
            - event.zoneName
          where: equals("event.messageId", 609002)
      # No actionResult: an informational notice with no final outcome.
      #......................................................................#
      # ASA-6-611305
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'VPNClient(\s)?\:'
            - fieldName: action
              pattern: 'DHCP Policy installed'
            - fieldName: event.irrelevant
              pattern: '{{.data}}DNS(\s)?\:'
            - fieldName: event.primaryDns
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: '{{.data}}DNS(\s)?\:'
            - fieldName: event.secondaryDns
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: '{{.data}}WINS(\s)?\:'
            - fieldName: event.primaryWins
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: '{{.data}}WINS(\s)?\:'
            - fieldName: event.secondaryWins
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
          source: event.msg
          where: equals("event.messageId", 611305)
      #......................................................................#
      # ASA-4-733100
      - grok:
          patterns:
            - fieldName: action
              pattern: '{{.data}}exceeded'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.burstRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.maxBurstRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.avgRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.maxAvgRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.cumulativeTotalCount
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 733100)
      # Cleaning cumulative total count
      - grok:
          patterns:
            - fieldName: event.cumulativeTotalCount
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.cumulativeTotalCount
          where: equals("event.messageId", 733100)
      # Parsing drop source object
      - grok:
          patterns:
            - fieldName: event.dropSourceObject
              pattern: '{{.data}}drop'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 733100)
      # Cleaning fields
      - trim:
          function: suffix
          substring: 'drop'
          fields:
            - event.dropSourceObject
          where: equals("event.messageId", 733100)
      - trim:
          function: suffix
          substring: ']'
          fields:
            - event.dropSourceObject
          where: equals("event.messageId", 733100)
      - trim:
          function: prefix
          substring: '['
          fields:
            - event.dropSourceObject
          where: equals("event.messageId", 733100)
      #......................................................................#
      # ASA-4-733101
      - grok:
          patterns:
            - fieldName: action
              pattern: '{{.data}}(targeted|attacking)'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.burstRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.maxBurstRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.avgRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.maxAvgRateValue
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.data}}is'
            - fieldName: event.cumulativeTotalCount
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 733101)
      # Cleaning cumulative total count
      - grok:
          patterns:
            - fieldName: event.cumulativeTotalCount
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.cumulativeTotalCount
          where: equals("event.messageId", 733101)
      # Parsing drop source object
      - grok:
          patterns:
            - fieldName: event.dropSourceObject
              pattern: '{{.word}}'
            - fieldName: event.tmpIp
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 733101)
      # Renaming from or to ip, according to -> if (targeted|attacking)
      - rename:
          from:
            - event.tmpIp
          to: origin.ip
          where: equals("event.messageId", 733101) && contains("action", "attacking")
      - rename:
          from:
            - event.tmpIp
          to: target.ip
          where: equals("event.messageId", 733101) && contains("action", "targeted")
      # No actionResult: a threat-detection rate notice is a detection, not an outcome.
      #......................................................................#
      # ASA-4-733102, 733103
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}host'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 733102) || equals("event.messageId", 733103)
      # Adding action
      - add:
          function: 'string'
          params:
            key: action
            value: 'Threat-detection add host to shun list'
          where: (equals("event.messageId", 733102) || equals("event.messageId", 733103)) && contains("event.msg", "add")
      - add:
          function: 'string'
          params:
            key: action
            value: 'Threat-detection removes host to shun list'
          where: (equals("event.messageId", 733102) || equals("event.messageId", 733103)) && contains("event.msg", "removes")
      # A host added to the shun list is blocked; 733103 (removed) gets no value.
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 733102)
      #......................................................................#
      # Decoding severity
      - add:
          function: 'string'
          params:
            key: severity
            value: 'high'
          where: oneOf("event.severity", ["1", "2", "3"])
      - add:
          function: 'string'
          params:
            key: severity
            value: 'medium'
          where: equals("event.severity", "4")
      - add:
          function: 'string'
          params:
            key: severity
            value: 'low'
          where: oneOf("event.severity", ["5", "6", "7"])
      #......................................................................#
      # Adding common geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")
      # Adding log.mappedIpFrom geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.mappedIpFrom
            destination: event.mappedIpFromGeolocation
          where: exists("event.mappedIpFrom")
      # Adding log.mappedIpTo geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.mappedIpTo
            destination: event.mappedIpToGeolocation
          where: exists("event.mappedIpTo")
      # Adding log.translatedIpFrom geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.translatedIpFrom
            destination: event.translatedIpFromGeolocation
          where: exists("event.translatedIpFrom")
      # Adding log.translatedIpTo geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.translatedIpTo
            destination: event.translatedIpToGeolocation
          where: exists("event.translatedIpTo")
      # Adding log.globalIp geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.globalIp
            destination: event.globalIpGeolocation
          where: exists("event.globalIp")
      # Adding log.remoteIp geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.remoteIp
            destination: event.remoteIpGeolocation
          where: exists("event.remoteIp")
      # Adding log.mappedIp geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.mappedIp
            destination: event.mappedIpGeolocation
          where: exists("event.mappedIp")
      # Adding log.decapsulatedPktDestAddr geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.decapsulatedPktDestAddr
            destination: event.decapsulatedPktDestAddrGeolocation
          where: exists("event.decapsulatedPktDestAddr")
      # Adding log.decapsulatedPktSrcAddr geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.decapsulatedPktSrcAddr
            destination: event.decapsulatedPktSrcAddrGeolocation
          where: exists("event.decapsulatedPktSrcAddr")
      # Adding log.localProxyIpAddr geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.localProxyIpAddr
            destination: event.localProxyIpAddrGeolocation
          where: exists("event.localProxyIpAddr")
      # Adding log.remoteProxyIpAddr geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.remoteProxyIpAddr
            destination: event.remoteProxyIpAddrGeolocation
          where: exists("event.remoteProxyIpAddr")
      # Adding log.primaryDns geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.primaryDns
            destination: event.primaryDnsGeolocation
          where: exists("event.primaryDns")
      # Adding log.secondaryDns geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.secondaryDns
            destination: event.secondaryDnsGeolocation
          where: exists("event.secondaryDns")
      # Adding log.primaryWins geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.primaryWins
            destination: event.primaryWinsGeolocation
          where: exists("event.primaryWins")
      # Adding log.secondaryWins geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.secondaryWins
            destination: event.secondaryWinsGeolocation
          where: exists("event.secondaryWins")
      #......................................................................#
      # Common field conversions
      - cast:
          fields:
            - origin.port
            - target.port
          to: int
      # Removing unused fields
      - delete:
          fields:
            - event.asaHeader
            - event.ciscoSeparator
            - event.irrelevant
            - event.syslogPri
            - event.rest