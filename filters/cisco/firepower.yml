# CISCO Firepower filter, version 3.1.1
# Based on examples provided and https://www.cisco.com/c/en/us/td/docs/security/firepower/Syslogs/b_fptd_syslog_guide.html
# Filter Input requirements -> Syslog
#
# 1. Parsing the message field containing the Cisco Firepower log
pipeline:
  - dataTypes:
      - firewall-cisco-firepower
    steps:
      # Common Firepower fields
      - grok:
          patterns:
            - fieldName: event.syslogPri
              pattern: '(\<{{.integer}}\>)'
            - fieldName: event.ciscoTime
              pattern: '{{.day}}\s{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: event.localIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.firePowerHeader
              pattern: '{{.data}}FTD-'
            - fieldName: event.severity
              pattern: '{{.integer}}'
            - fieldName: event.messageId
              pattern: '-{{.integer}}'
            - fieldName: event.ciscoSeparator
              pattern: '\:{{.space}}'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
      - grok:
          patterns:
            - fieldName: event.ciscoTime
              pattern: '{{.day}}\s{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: event.localIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.firePowerHeader
              pattern: '{{.data}}FTD-'
            - fieldName: event.severity
              pattern: '{{.integer}}'
            - fieldName: event.messageId
              pattern: '-{{.integer}}'
            - fieldName: event.ciscoSeparator
              pattern: '\:{{.space}}'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
      # Real Firepower Threat Defense shape: '<PRI>%FTD-<level>-<id>: <text>', with no
      # timestamp and no device name. Runs only when the two groks above set nothing.
      - grok:
          patterns:
            - fieldName: event.syslogPri
              pattern: '(\<{{.integer}}\>)'
            - fieldName: event.firePowerHeader
              pattern: '%FTD-'
            - fieldName: event.severity
              pattern: '{{.integer}}'
            - fieldName: event.messageId
              pattern: '-{{.integer}}'
            - fieldName: event.ciscoSeparator
              pattern: '\:{{.space}}'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
          where: '!exists("event.messageId")'
      #......................................................................#
      # Adding log.localIp geolocation
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.localIp
            destination: event.localIpGeolocation
          where: exists("event.localIp")
      # Removing unwanted prefixes
      - trim:
          function: prefix
          substring: '-'
          fields:
            - event.messageId
      # Field conversions
      - cast:
          fields:
            - event.messageId
          to: int
      #......................................................................#
      # FTD-1-4300xx security events seen in real records (430001 intrusion, 430002 and
      # 430003 connection start and end, 430007): the text is 'Key: Value, Key: Value, ...'.
      # Other 4300xx IDs (for example 430004/430005 file and malware events) are not parsed
      # until a real record or Cisco's field list confirms their layout.
      # Every key goes to log.<Key> (go-sdk v1.1.36 keeps letters, digits, dots and
      # underscores, so 'Prefilter Policy' becomes log.PrefilterPolicy and 'DNS_TTL'
      # stays log.DNS_TTL).
      # A record whose text holds a second '%FTD-' header (two syslog messages joined
      # by the collector) is not parsed, so no value can come from the second message.
      - kv:
          fieldSplit: ', '
          valueSplit: ': '
          source: event.msg
          where: 'exists("event.msg") && oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-")'
      # A UserAgent value can hold ', Key: value' text, and the kv split keeps the last
      # copy of a key. Split the text before UserAgent again, so every key that comes
      # before UserAgent keeps the device's own value.
      - grok:
          patterns:
            - fieldName: event.ftdHead
              pattern: '{{.data}}, UserAgent: '
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-") && contains("event.msg", ", UserAgent: ")'
      - kv:
          fieldSplit: ', '
          valueSplit: ': '
          source: event.ftdHead
          where: 'exists("event.ftdHead")'
      - delete:
          fields:
            - event.ftdHead
          where: 'exists("event.ftdHead")'
      # UserAgent values can contain ', ' (for example 'KHTML, like Gecko'); read the
      # whole value up to the key that follows it (Client, or AuthenticationSource)
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}, UserAgent: '
            - fieldName: event.UserAgent
              pattern: '{{.data}}, (Client|AuthenticationSource): '
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-") && contains("event.msg", ", UserAgent: ")'
      - trim:
          function: regex
          substring: ',\s(Client|AuthenticationSource):\s*$'
          fields:
            - event.UserAgent
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-") && contains("event.msg", ", UserAgent: ")'
      # Standard fields, each from the first occurrence of its key: a later copy of the
      # key inside a free-text value (for example a crafted UserAgent) cannot replace them
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}, SrcIP: '
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: ','
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-")'
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}, DstIP: '
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: ','
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-")'
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}, SrcPort: '
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: ','
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-")'
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}, DstPort: '
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: ','
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-")'
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}, Protocol: '
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: ','
          source: event.msg
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && !contains("event.msg", "%FTD-")'
      # Remove the kv copies of the five keys that now have a standard field
      - delete:
          fields:
            - event.SrcIP
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && exists("origin.ip")'
      - delete:
          fields:
            - event.DstIP
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && exists("target.ip")'
      - delete:
          fields:
            - event.SrcPort
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && exists("origin.port")'
      - delete:
          fields:
            - event.DstPort
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && exists("target.port")'
      - delete:
          fields:
            - event.Protocol
          where: 'oneOf("event.messageId", [430001, 430002, 430003, 430007]) && exists("protocol")'
      # Begining specific message parsing
      #......................................................................#
      # FTD-2-106001
      - grok:
          patterns:
            - fieldName: event.direction
              pattern: '{{.word}}'
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'connection'
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: origin.port
              pattern: '/{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'to'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: target.port
              pattern: '/{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'flags'
            - fieldName: event.flags
              pattern: '{{.data}}\s'
            - fieldName: event.irrelevant
              pattern: 'on\sinterface'
            - fieldName: event.srcInterface
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106001)

      - trim:
          function: prefix
          substring: '/'
          fields:
            - origin.port
            - target.port
          where: equals("event.messageId", 106001)
      #......................................................................#
      # FTD-2-106017
      - grok:
          patterns:
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'IP\sdue\sto'
            - fieldName: action
              pattern: '{{.greedy}}from'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'to'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
          source: event.msg
          where: equals("event.messageId", 106017)
      - trim:
          function: suffix
          substring: 'from'
          fields:
            - action
          where: equals("event.messageId", 106017)
      #......................................................................#
      # FTD-1-106021
      - grok:
          patterns:
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: action
              pattern: '{{.greedy}}from'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'to'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: event.irrelevant
              pattern: 'on\sinterface'
            - fieldName: event.srcInterface
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106021)
      - trim:
          function: suffix
          substring: 'from'
          fields:
            - action
          where: equals("event.messageId", 106021)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 106021)
      #......................................................................#
      # FTD-2-106101
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Number of cached deny-flows for ACL log has reached limit'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106101)
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Number of cached'
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 106101)
      # Parsing the limit number
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '\('
            - fieldName: event.numFlows
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.rest
          where: equals("event.messageId", 106101)
      # Field conversions
      - cast:
          fields:
            - event.numFlows
          to: int
          where: equals("event.messageId", 106101)
      #......................................................................#
      # FTD-6-106102,FTD-4-106103
      # First variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'access-list'
            - fieldName: event.accessList
              pattern: '{{.data}}\s'
            - fieldName: actionResult
              pattern: '{{.word}}'
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}})\s'
            - fieldName: event.srcInterface
              pattern: '{{.data}}/'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.dstInterface
              pattern: '{{.data}}/'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'hit-cnt'
            - fieldName: event.hitCount
              pattern: '{{.integer}}'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      # Second variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'access-list'
            - fieldName: event.accessList
              pattern: '{{.data}}\s'
            - fieldName: actionResult
              pattern: '{{.word}}'
            - fieldName: protocol
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}})\s'
            - fieldName: event.srcInterface
              pattern: '{{.data}}/'
            - fieldName: origin.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: origin.port
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: '-\>'
            - fieldName: event.dstInterface
              pattern: '{{.data}}/'
            - fieldName: target.ip
              pattern: '({{.ipv4}}|{{.ipv6}})'
            - fieldName: target.port
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: 'hit-cnt'
            - fieldName: event.hitCount
              pattern: '{{.integer}}'
            - fieldName: event.rest
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: suffix
          substring: '/'
          fields:
            - event.srcInterface
            - event.dstInterface
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: prefix
          substring: ''''
          fields:
            - origin.user
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: suffix
          substring: ''''
          fields:
            - origin.user
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: prefix
          substring: '('
          fields:
            - origin.port
            - target.port
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      - trim:
          function: suffix
          substring: ')'
          fields:
            - origin.port
            - target.port
          where: equals("event.messageId", 106102) || equals("event.messageId", 106103)
      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: exists("actionResult") && (equals("event.messageId", 106102) || equals("event.messageId", 106103)) && !equalsIgnoreCase("actionResult", "Permitted")
      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: exists("actionResult") && (equals("event.messageId", 106102) || equals("event.messageId", 106103)) && equalsIgnoreCase("actionResult", "Permitted")
      #......................................................................#
      # FTD-6-109101
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Received CoA disconnect request'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}}),'
            - fieldName: event.irrelevant
              pattern: 'with\saudit-session-id:'
            - fieldName: event.auditSessionId
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109101)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Received CoA'
            - fieldName: event.ciscoResult
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 109101)
      - trim:
          function: suffix
          substring: ','
          fields:
            - origin.user
          where: equals("event.messageId", 109101)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: equals("event.messageId", 109101)
      #......................................................................#
      # FTD-4-109102
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Received CoA {{.word}}'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: ', but cannot find named session'
            - fieldName: event.auditSessionId
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109102)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Received CoA'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 109102)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: equals("event.messageId", 109102)
      #......................................................................#
      # FTD-3-109103
      - grok:
          patterns:
            - fieldName: action
              pattern: 'CoA {{.word}}'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: 'failed for user'
            - fieldName: origin.user
              pattern: '(''{{.data}}''|{{.data}}),'
            - fieldName: event.irrelevant
              pattern: 'with session ID:'
            - fieldName: event.auditSessionId
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 109103)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'CoA'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 109103)
      - trim:
          function: suffix
          substring: ','
          fields:
            - origin.user
          where: equals("event.messageId", 109103)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: equals("event.messageId", 109103)
      #......................................................................#
      # FTD-109201 to 109213
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'UAUTH(:)? Session(\s|=)'
            - fieldName: event.session
              pattern: '{{.data}},'
            - fieldName: event.irrelevant
              pattern: 'User(\s|=)'
            - fieldName: origin.user
              pattern: '{{.data}},'
            - fieldName: event.irrelevant
              pattern: 'Assigned IP(\s|=)'
            - fieldName: origin.ip
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: event.irrelevant
              pattern: ','
            - fieldName: action
              pattern: '{{.greedy}}'
          source: event.msg
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213)
      - trim:
          function: suffix
          substring: ','
          fields:
            - event.session
            - origin.user
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213)
      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: greaterOrEqual("event.messageId", 109201) && lessOrEqual("event.messageId", 109213)
      #......................................................................#
      # FTD-6-113004
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA user {{.word}} Successful'
            - fieldName: event.irrelevant
              pattern: '\:'
            - fieldName: event.irrelevant
              pattern: 'server(\s)?=(\s)?'
            - fieldName: target.ip
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(U|u)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113004)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'AAA user {{.word}}'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 113004)
      - trim:
          function: suffix
          substring: ':'
          fields:
            - target.ip
          where: equals("event.messageId", 113004)
      - trim:
          function: suffix
          substring: ','
          fields:
            - target.ip
          where: equals("event.messageId", 113004)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: equals("event.messageId", 113004)
      #......................................................................#
      # FTD-6-113005
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA user authentication Rejected(\s)?'
            - fieldName: event.irrelevant
              pattern: '\:(\s)?reason(\s)?=(\s)'
            - fieldName: event.reason
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(server|Server)(\s)?=(\s)?'
            - fieldName: target.ip
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(U|u)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.data}}(\:|,)'
            - fieldName: event.irrelevant
              pattern: '(U|u)ser IP(\s)?=(\s)?'
            - fieldName: origin.ip
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113005)
      # Action result
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'AAA user authentication'
            - fieldName: event.ciscoResult
              pattern: '{{.greedy}}'
          source: action
          where: equals("event.messageId", 113005)
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.reason
            - target.ip
            - origin.user
          where: equals("event.messageId", 113005)
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: equals("event.messageId", 113005)
      #......................................................................#
      # FTD-6-113008
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA transaction status ACCEPT(\s)?'
            - fieldName: event.irrelevant
              pattern: '\:(\s)?(u|U)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113008)
      # Adding action result
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'accepted'
          where: equals("event.messageId", 113008)
      #......................................................................#
      # FTD-6-113009
      # First variant
      - grok:
          patterns:
            - fieldName: action
              pattern: 'AAA retrieved default group policy'
            - fieldName: event.policy
              pattern: '\({{.data}}\)'
            - fieldName: event.irrelevant
              pattern: 'for (u|U)ser(\s)?=(\s)?'
            - fieldName: origin.user
              pattern: '{{.greedy}}'
          source: event.msg
          where: equals("event.messageId", 113009)
