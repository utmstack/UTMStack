      - grok:
          source: event.msg
          patterns:
          - fieldName: ''
            pattern: ^Peer IP=
          - fieldName: event.sourceIp
            pattern: '.+?Peer port'
          - fieldName: ''
            pattern: '(?:=|\[)'
          - fieldName: origin.port
            pattern: '[0-9]+'
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && oneOf("event.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
      # The peer address is written against the next label; drop that label.
      - trim:
          function: suffix
          substring: Peer port
          fields:
            - event.sourceIp
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && oneOf("event.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
      - trim:
          function: suffix
          substring: ' '
          fields:
            - event.sourceIp
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && oneOf("event.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && oneOf("event.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
            && equals("event.type", "anyconnect_vpn_auth_failure")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && oneOf("event.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
            && equals("event.type", "anyconnect_vpn_auth_success")
      - grok:
          source: event.fields
          patterns:
          - fieldName: ''
            pattern: '{{.merakiKVPrefix}}pattern:\s*'
          - fieldName: event.pattern
            pattern: (?s:.*)
          where: equals("event.nativeFormat", "true") && oneOf("event.merakiGroup", ["flows", "firewall", "cellular_firewall", "vpn_firewall", "l7_firewall"])
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.nativeFormat", "true") && oneOf("event.merakiGroup", ["flows", "firewall", "cellular_firewall", "vpn_firewall", "l7_firewall"])
            && (equals("event.merakiResult", "allow") || regexMatch("event.pattern", "(?i)^allow(?:\\s|$)"))
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equals("event.nativeFormat", "true") && oneOf("event.merakiGroup", ["flows", "firewall", "cellular_firewall", "vpn_firewall", "l7_firewall"])
            && (equals("event.merakiResult", "deny") || regexMatch("event.pattern", "(?i)^deny(?:\\s|$)") || equals("event.decision", "blocked"))
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "security_event") && ((equals("event.alertType", "ids_alerted") && equals("event.decision",
            "blocked")) || (equals("event.alertType", "security_filtering_file_scanned") && equals("event.action", "block")))
      - grok:
          source: event.type
          patterns:
          - fieldName: action
            pattern: (?s:.*)
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && oneOf("event.type", ["vpn_connectivity_change", "disassociation"])
      - grok:
          source: event.fields
          patterns:
          - fieldName: ''
            pattern: '{{.merakiKVPrefix}}request:\s*'
          - fieldName: event.method
            pattern: \S+
          - fieldName: target.url
            pattern: https?://[^\s]+
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "urls")
      - grok:
          source: event.peerContact
          patterns:
          - fieldName: event.sourceIp
            pattern: (?:\[[^\]]+\]|[0-9.]+|[^\s:\[\]]+)
          - fieldName: ''
            pattern: ':'
          - fieldName: origin.port
            pattern: '[0-9]+'
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && equals("event.type", "vpn_connectivity_change")
      - trim:
          function: prefix
          substring: '['
          fields:
          - event.sourceIp
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && equals("event.type", "vpn_connectivity_change")
      - trim:
          function: suffix
          substring: ']'
          fields:
          - event.sourceIp
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && equals("event.type", "vpn_connectivity_change")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && equals("event.type", "vpn_connectivity_change") && equals("event.connectivity",
            "true")
      - grok:
          source: event.genericEvent
          patterns:
          - fieldName: action
            pattern: ^Cellular connection
          - fieldName: event.connectionState
            pattern: (?:up|down)
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.nativeFormat", "true") && equals("event.connectionState", "up")
      - grok:
          source: event.genericEvent
          patterns:
          - fieldName: action
            pattern: ^dhcp no offers
          - fieldName: ''
            pattern: 'for mac\s+'
          - fieldName: origin.mac
            pattern: \S+
          - fieldName: ''
            pattern: 'host\s*=\s*'
          - fieldName: event.sourceIp
            pattern: \S+
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events")
      - grok:
          source: event.genericEvent
          patterns:
          - fieldName: action
            pattern: ^dhcp lease
          - fieldName: ''
            pattern: 'of ip\s+'
          - fieldName: event.sourceIp
            pattern: \S+
          - fieldName: ''
            pattern: 'from server mac\s+'
          - fieldName: event.serverMac
            pattern: \S+
          - fieldName: ''
            pattern: 'for client mac\s+'
          - fieldName: origin.mac
            pattern: \S+
          - fieldName: ''
            pattern: 'from router\s+'
          - fieldName: event.routerIp
            pattern: \S+
          - fieldName: ''
            pattern: 'on subnet\s+'
          - fieldName: event.subnet
            pattern: \S+
          - fieldName: ''
            pattern: 'with dns\s+'
          - fieldName: event.dns
            pattern: '[^,]+'
          - fieldName: ''
            pattern: ',\s*'
          - fieldName: event.dns1
            pattern: \S+
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.nativeFormat", "true") && equals("action", "dhcp lease")
      - grok:
          source: event.genericEvent
          patterns:
          - fieldName: ''
            pattern: ^Port\s+
          - fieldName: event.switchPort
            pattern: '[0-9]+'
          - fieldName: ''
            pattern: 'received an\s+'
          - fieldName: protocol
            pattern: \S+
          - fieldName: ''
            pattern: 'BPDU from\s+'
          - fieldName: origin.mac
            pattern: \S+
          - fieldName: ''
            pattern: 'so the port was\s+'
          - fieldName: event.merakiResult
            pattern: blocked
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events")
      - grok:
          source: event.ip_src
          patterns:
          - fieldName: event.sourceIp
            pattern: (?s:.*)
          where: equals("event.nativeFormat", "true") && equals("event.merakiGroup", "events") && equals("event.type", "disassociation") && exists("event.ip_src")
      - trim:
          function: suffix
          substring: ':'
          fields:
          - event.localIp
          where: '!inCIDR("event.localIp", "::/0")'
      - trim:
          function: suffix
          substring: ':'
          fields:
          - event.sourceIp
          where: '!inCIDR("event.sourceIp", "::/0")'
      - trim:
          function: suffix
          substring: ':'
          fields:
          - event.destinationIp
          where: '!inCIDR("event.destinationIp", "::/0")'
      - trim:
          function: suffix
          substring: ':'
          fields:
          - event.serverIp
          where: '!inCIDR("event.serverIp", "::/0")'
      - trim:
          function: prefix
          substring: ''''
          fields:
            - event.sourceIp
            - event.peerIdent
            - event.connectivity
            - event.vpnType
      - trim:
          function: suffix
          substring: ''''
          fields:
            - origin.port
            - event.peerIdent
            - event.connectivity
            - event.vpnType
      #......................................................................#
      # Adding geolocation
      # Validate vendor captures before standard promotion and geolocation.
      - rename:
          from:
          - event.sourceIp
          to: origin.ip
          where: (inCIDR("event.sourceIp", "0.0.0.0/0") || inCIDR("event.sourceIp", "::/0")) && !inCIDR("event.sourceIp", "0.0.0.0/32") && !inCIDR("event.sourceIp",
            "::/128")
      - rename:
          from:
          - event.destinationIp
          to: target.ip
          where: (inCIDR("event.destinationIp", "0.0.0.0/0") || inCIDR("event.destinationIp", "::/0")) && !inCIDR("event.destinationIp", "0.0.0.0/32") &&
            !inCIDR("event.destinationIp", "::/128")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.serverIp
            destination: event.serverGeolocation
          where: '(inCIDR("event.serverIp", "0.0.0.0/0") || inCIDR("event.serverIp", "::/0")) && !inCIDR("event.serverIp", "0.0.0.0/32") && !inCIDR("event.serverIp", "::/128")'
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: event.localIp
            destination: event.localGeolocation
          where: '(inCIDR("event.localIp", "0.0.0.0/0") || inCIDR("event.localIp", "::/0")) && !inCIDR("event.localIp", "0.0.0.0/32") && !inCIDR("event.localIp", "::/128")'
      - rename:
          from:
          - origin.port
          to: event.unparsedOriginPort
          where: exists("origin.port") && !(regexMatch("origin.port", "^[0-9]{1,5}$") && lessOrEqual("origin.port", 65535))
      - rename:
          from:
          - target.port
          to: event.unparsedTargetPort
          where: exists("target.port") && !(regexMatch("target.port", "^[0-9]{1,5}$") && lessOrEqual("target.port", 65535))
      - cast:
          fields:
            - origin.port
            - target.port
          to: int
      #......................................................................#
      # Keep the vendor event group and message available to correlation rules.
      - grok:
          source: event.merakiGroup
          patterns:
            - fieldName: event.eventType
              pattern: '{{.greedy}}'
          where: 'exists("event.merakiGroup") && !exists("event.eventType")'
      - grok:
          source: event.genericEvent
          patterns:
            - fieldName: event.message
              pattern: '{{.greedy}}'
          where: exists("event.genericEvent")
      # Removing unused fields
      - delete:
          fields:
            - event.controlFlag
            - event.irrelevant
            - event.genericEvent

      # Normalize explicit outcomes; an unknown outcome remains unset.
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equalsIgnoreCase("event.merakiResult","blocked")

      # Keep addresses in IP fields and retain other source values under log.
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: event.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)
      - delete:
          fields:
          - event.vpnAuthenticationFailure
      - add:
          function: string
          params:
            key: event.vpnAuthenticationFailure
            value: match
          where: 'equals("event.eventType", "events") &&

            equals("event.type", "anyconnect_vpn_auth_failure") &&

            exists("origin.ip") &&

            exists("event.merakiType") && !oneOf("event.merakiType", ["", "unknown", "-"]) &&

            exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"])'
      - delete:
          fields:
          - event.malwareGroupingKey
          - event.malwareGroupingType
      - grok:
          source: event.sha256
          patterns:
          - fieldName: event.malwareGroupingKey
            pattern: (?s:.*)
          where: equals("event.eventType", "security_event") && oneOf("event.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("event.disposition", "malicious") && regexMatch("event.sha256", "(?i)^[0-9a-f]{64}$")
      - add:
          function: string
          params:
            key: event.malwareGroupingType
            value: hash
          where: equals("event.eventType", "security_event") && oneOf("event.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("event.disposition", "malicious") && regexMatch("event.sha256", "(?i)^[0-9a-f]{64}$")
      - grok:
          source: id
          patterns:
          - fieldName: event.malwareGroupingKey
            pattern: (?s:.*)
          where: equals("event.eventType", "security_event") && oneOf("event.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("event.disposition", "malicious") && !regexMatch("event.sha256", "(?i)^[0-9a-f]{64}$") && exists("id") && !equals("id", "")
      - add:
          function: string
          params:
            key: event.malwareGroupingType
            value: event
          where: equals("event.eventType", "security_event") && oneOf("event.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("event.disposition", "malicious") && !regexMatch("event.sha256", "(?i)^[0-9a-f]{64}$") && exists("id") && !equals("id", "")
      - delete:
          fields:
          - event.nativeFormat
          - event.nativeHandled
          - event.nativeMessage
          - event.fields
