            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && exists("log.protocol")
      - grok:
          source: log.mac
          patterns:
          - fieldName: origin.mac
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && !equals("log.eventType", "airmarshal_events") && exists("log.mac")
      - grok:
          source: log.url
          patterns:
          - fieldName: target.url
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && regexMatch("log.url", "(?i)^https?://[^\\s]+$")
      - grok:
          source: log.src
          patterns:
          - fieldName: origin.mac
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.eventType", "airmarshal_events") && exists("log.src")
      - grok:
          source: log.dst
          patterns:
          - fieldName: target.mac
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.eventType", "airmarshal_events") && exists("log.dst")
      - grok:
          source: log.device
          patterns:
          - fieldName: origin.mac
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && equals("log.type", "device_packet_flood") && exists("log.device")
      - grok:
          source: log.port
          patterns:
          - fieldName: log.switchPort
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && startsWith("log.type", "8021x_") && exists("log.port")
      - grok:
          source: log.identity
          patterns:
          - fieldName: origin.user
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && startsWith("log.type", "8021x_") && !oneOf("log.identity",
            ["", "-"]) && exists("log.identity")
      - grok:
          source: log.msg
          patterns:
          - fieldName: ''
            pattern: ^Peer IP=
          - fieldName: log.sourceIp
            pattern: '[^\s]+?'
          - fieldName: ''
            pattern: \s*Peer port(?:=|\[)
          - fieldName: origin.port
            pattern: '[0-9]+'
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && oneOf("log.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && oneOf("log.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
            && equals("log.type", "anyconnect_vpn_auth_failure")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && oneOf("log.type", ["anyconnect_vpn_auth_failure", "anyconnect_vpn_auth_success"])
            && equals("log.type", "anyconnect_vpn_auth_success")
      - grok:
          source: log.fields
          patterns:
          - fieldName: ''
            pattern: '{{.merakiKVPrefix}}pattern:\s*'
          - fieldName: log.pattern
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && oneOf("log.merakiGroup", ["flows", "firewall", "cellular_firewall", "vpn_firewall", "l7_firewall"])
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("log.nativeFormat", "true") && oneOf("log.merakiGroup", ["flows", "firewall", "cellular_firewall", "vpn_firewall", "l7_firewall"])
            && (equals("log.merakiResult", "allow") || regexMatch("log.pattern", "(?i)^allow(?:\\s|$)"))
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equals("log.nativeFormat", "true") && oneOf("log.merakiGroup", ["flows", "firewall", "cellular_firewall", "vpn_firewall", "l7_firewall"])
            && (equals("log.merakiResult", "deny") || regexMatch("log.pattern", "(?i)^deny(?:\\s|$)") || equals("log.decision", "blocked"))
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "security_event") && ((equals("log.alertType", "ids_alerted") && equals("log.decision",
            "blocked")) || (equals("log.alertType", "security_filtering_file_scanned") && equals("log.action", "block")))
      - grok:
          source: log.type
          patterns:
          - fieldName: action
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && oneOf("log.type", ["vpn_connectivity_change", "disassociation"])
      - grok:
          source: log.fields
          patterns:
          - fieldName: ''
            pattern: '{{.merakiKVPrefix}}request:\s*'
          - fieldName: log.method
            pattern: \S+
          - fieldName: ''
            pattern: \s+
          - fieldName: target.url
            pattern: https?://[^\s]+
          - fieldName: ''
            pattern: $
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "urls")
      - grok:
          source: log.peerContact
          patterns:
          - fieldName: log.sourceIp
            pattern: (?:\[[^\]]+\]|[^\s]+)
          - fieldName: ''
            pattern: ':'
          - fieldName: origin.port
            pattern: '[0-9]+'
          - fieldName: ''
            pattern: $
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && equals("log.type", "vpn_connectivity_change")
      - trim:
          function: prefix
          substring: '['
          fields:
          - log.sourceIp
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && equals("log.type", "vpn_connectivity_change")
      - trim:
          function: suffix
          substring: ']'
          fields:
          - log.sourceIp
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && equals("log.type", "vpn_connectivity_change")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && equals("log.type", "vpn_connectivity_change") && equals("log.connectivity",
            "true")
      - grok:
          source: log.genericEvent
          patterns:
          - fieldName: action
            pattern: ^Cellular connection
          - fieldName: ''
            pattern: \s+
          - fieldName: log.connectionState
            pattern: (?:up|down)
          - fieldName: ''
            pattern: $
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("log.nativeFormat", "true") && equals("log.connectionState", "up")
      - grok:
          source: log.genericEvent
          patterns:
          - fieldName: action
            pattern: ^dhcp no offers
          - fieldName: ''
            pattern: \s+for mac\s+
          - fieldName: origin.mac
            pattern: \S+
          - fieldName: ''
            pattern: \s+host\s*=\s*
          - fieldName: log.sourceIp
            pattern: \S+
          - fieldName: ''
            pattern: $
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events")
      - grok:
          source: log.genericEvent
          patterns:
          - fieldName: action
            pattern: ^dhcp lease
          - fieldName: ''
            pattern: \s+of ip\s+
          - fieldName: log.sourceIp
            pattern: \S+
          - fieldName: ''
            pattern: \s+from server mac\s+
          - fieldName: log.serverMac
            pattern: \S+
          - fieldName: ''
            pattern: \s+for client mac\s+
          - fieldName: origin.mac
            pattern: \S+
          - fieldName: ''
            pattern: \s+from router\s+
          - fieldName: log.routerIp
            pattern: \S+
          - fieldName: ''
            pattern: \s+on subnet\s+
          - fieldName: log.subnet
            pattern: \S+
          - fieldName: ''
            pattern: \s+with dns\s+
          - fieldName: log.dns
            pattern: '[^,]+'
          - fieldName: ''
            pattern: ',\s*'
          - fieldName: log.dns1
            pattern: \S+
          - fieldName: ''
            pattern: $
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("log.nativeFormat", "true") && equals("action", "dhcp lease")
      - grok:
          source: log.genericEvent
          patterns:
          - fieldName: ''
            pattern: ^Port\s+
          - fieldName: log.switchPort
            pattern: '[0-9]+'
          - fieldName: ''
            pattern: \s+received an\s+
          - fieldName: protocol
            pattern: \S+
          - fieldName: ''
            pattern: \s+BPDU from\s+
          - fieldName: origin.mac
            pattern: \S+
          - fieldName: ''
            pattern: \s+so the port was\s+
          - fieldName: log.merakiResult
            pattern: blocked
          - fieldName: ''
            pattern: $
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events")
      - grok:
          source: log.ip_src
          patterns:
          - fieldName: log.sourceIp
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true") && equals("log.merakiGroup", "events") && equals("log.type", "disassociation") && exists("log.ip_src")
      - trim:
          function: suffix
          substring: ':'
          fields:
          - log.localIp
          where: '!inCIDR("log.localIp", "::/0")'
      - trim:
          function: suffix
          substring: ':'
          fields:
          - log.sourceIp
          where: '!inCIDR("log.sourceIp", "::/0")'
      - trim:
          function: suffix
          substring: ':'
          fields:
          - log.destinationIp
          where: '!inCIDR("log.destinationIp", "::/0")'
      - trim:
          function: suffix
          substring: ':'
          fields:
          - log.serverIp
          where: '!inCIDR("log.serverIp", "::/0")'
      - trim:
          function: prefix
          substring: ''''
          fields:
            - log.sourceIp
            - log.peerIdent
            - log.connectivity
            - log.vpnType
      - trim:
          function: suffix
          substring: ''''
          fields:
            - origin.port
            - log.peerIdent
            - log.connectivity
            - log.vpnType
      #......................................................................#
      # Adding geolocation
      # Validate vendor captures before standard promotion and geolocation.
      - rename:
          from:
          - log.sourceIp
          to: origin.ip
          where: (inCIDR("log.sourceIp", "0.0.0.0/0") || inCIDR("log.sourceIp", "::/0")) && !inCIDR("log.sourceIp", "0.0.0.0/32") && !inCIDR("log.sourceIp",
            "::/128")
      - rename:
          from:
          - log.destinationIp
          to: target.ip
          where: (inCIDR("log.destinationIp", "0.0.0.0/0") || inCIDR("log.destinationIp", "::/0")) && !inCIDR("log.destinationIp", "0.0.0.0/32") &&
            !inCIDR("log.destinationIp", "::/128")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: log.serverIp
            destination: log.serverGeolocation
          where: '(inCIDR("log.serverIp", "0.0.0.0/0") || inCIDR("log.serverIp", "::/0")) && !inCIDR("log.serverIp", "0.0.0.0/32") && !inCIDR("log.serverIp", "::/128")'
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: log.localIp
            destination: log.localGeolocation
          where: '(inCIDR("log.localIp", "0.0.0.0/0") || inCIDR("log.localIp", "::/0")) && !inCIDR("log.localIp", "0.0.0.0/32") && !inCIDR("log.localIp", "::/128")'
      - rename:
          from:
          - origin.port
          to: log.unparsedOriginPort
          where: exists("origin.port") && !(regexMatch("origin.port", "^[0-9]{1,5}$") && lessOrEqual("origin.port", 65535))
      - rename:
          from:
          - target.port
          to: log.unparsedTargetPort
          where: exists("target.port") && !(regexMatch("target.port", "^[0-9]{1,5}$") && lessOrEqual("target.port", 65535))
      - cast:
          fields:
            - origin.port
            - target.port
          to: int
      #......................................................................#
      # Keep the vendor event group and message available to correlation rules.
      - grok:
          source: log.merakiGroup
          patterns:
            - fieldName: log.eventType
              pattern: '{{.greedy}}'
          where: 'exists("log.merakiGroup") && !exists("log.eventType")'
      - grok:
          source: log.genericEvent
          patterns:
            - fieldName: log.message
              pattern: '{{.greedy}}'
          where: exists("log.genericEvent")
      # Removing unused fields
      - delete:
          fields:
            - log.controlFlag
            - log.irrelevant
            - log.genericEvent

      # Normalize explicit outcomes; an unknown outcome remains unset.
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: equalsIgnoreCase("log.merakiResult","blocked")

      # Keep addresses in IP fields and retain other source values under log.
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: log.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)
      - delete:
          fields:
          - log.vpnAuthenticationFailure
      - add:
          function: string
          params:
            key: log.vpnAuthenticationFailure
            value: match
          where: 'equals("log.eventType", "events") &&

            equals("log.type", "anyconnect_vpn_auth_failure") &&

            exists("origin.ip") &&

            exists("log.merakiType") && !oneOf("log.merakiType", ["", "unknown", "-"]) &&

            exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"])'
      - delete:
          fields:
          - log.malwareGroupingKey
          - log.malwareGroupingType
      - grok:
          source: log.sha256
          patterns:
          - fieldName: log.malwareGroupingKey
            pattern: (?s:.*)
          where: equals("log.eventType", "security_event") && oneOf("log.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("log.disposition", "malicious") && regexMatch("log.sha256", "(?i)^[0-9a-f]{64}$")
      - add:
          function: string
          params:
            key: log.malwareGroupingType
            value: hash
          where: equals("log.eventType", "security_event") && oneOf("log.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("log.disposition", "malicious") && regexMatch("log.sha256", "(?i)^[0-9a-f]{64}$")
      - grok:
          source: id
          patterns:
          - fieldName: log.malwareGroupingKey
            pattern: (?s:.*)
          where: equals("log.eventType", "security_event") && oneOf("log.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("log.disposition", "malicious") && !regexMatch("log.sha256", "(?i)^[0-9a-f]{64}$") && exists("id") && !equals("id", "")
      - add:
          function: string
          params:
            key: log.malwareGroupingType
            value: event
          where: equals("log.eventType", "security_event") && oneOf("log.alertType", ["security_filtering_file_scanned", "security_filtering_disposition_change"])
            && equals("log.disposition", "malicious") && !regexMatch("log.sha256", "(?i)^[0-9a-f]{64}$") && exists("id") && !equals("id", "")
      - delete:
          fields:
          - log.nativeFormat
          - log.nativeHandled
          - log.nativeMessage
          - log.fields
