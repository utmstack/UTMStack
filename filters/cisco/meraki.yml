# CISCO Meraki filter, version 3.1.0
# Based on https://documentation.meraki.com/General_Administration/Monitoring_and_Reporting/Syslog_Event_Types_and_Log_Samples
# https://documentation.cysiv.com/articles/#!data-source-onboarding-device-configuration-reference/cisco-meraki-reference-information-and-cim-mapping
#
# Filter Input requirements -> Syslog
#
# 1. Parsing the message field
patterns:
  merakiKVPrefix: ^(?:[A-Za-z][A-Za-z0-9_-]*\s*=\s*(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[^\s"']*)\s+)*?
  merakiKVValue: (?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[^\s"']+)
pipeline:
  - dataTypes:
      - firewall-meraki
    steps:
      # Header fields
      # Documented native envelopes; never infer Meraki from arbitrary message text.
      - grok:
          source: raw
          patterns:
          - fieldName: ''
            pattern: ^(?:<[0-9]{1,3}>)?
          - fieldName: log.msgEventTime
            pattern: '[0-9]+\.[0-9]+'
          - fieldName: ''
            pattern: \s+
          - fieldName: log.merakiType
            pattern: \S+
          - fieldName: ''
            pattern: \s+
          - fieldName: log.merakiGroup
            pattern: (?:events|flows|firewall|cellular_firewall|vpn_firewall|l7_firewall|urls|ids-alerts|security_event|airmarshal_events)
          - fieldName: ''
            pattern: \s+
          - fieldName: log.genericEvent
            pattern: (?s:.*)
      - grok:
          source: raw
          patterns:
          - fieldName: ''
            pattern: ^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2}\s+[0-9]{1,2}\s+(?:[0-9]{4}\s+)?[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?\s+\S+\s+(?:[0-9]+\s+)?
          - fieldName: log.msgEventTime
            pattern: '[0-9]+\.[0-9]+'
          - fieldName: ''
            pattern: \s+
          - fieldName: log.merakiType
            pattern: \S+
          - fieldName: ''
            pattern: \s+
          - fieldName: log.merakiGroup
            pattern: (?:events|flows|firewall|cellular_firewall|vpn_firewall|l7_firewall|urls|ids-alerts|security_event|airmarshal_events)
          - fieldName: ''
            pattern: \s+
          - fieldName: log.genericEvent
            pattern: (?s:.*)
      - grok:
          source: raw
          patterns:
          - fieldName: ''
            pattern: ^(?:<[0-9]{1,3}>)?
          - fieldName: log.merakiGroup
            pattern: airmarshal_events
          - fieldName: ''
            pattern: \s+
          - fieldName: log.genericEvent
            pattern: (?s:.*)
      - add:
          function: string
          params:
            key: log.nativeFormat
            value: 'true'
          where: exists("log.genericEvent") && exists("log.merakiGroup")
      - add:
          function: string
          params:
            key: log.controlFlag
            value: Native
          where: equals("log.nativeFormat", "true")
      - add:
          function: string
          params:
            key: log.nativeHandled
            value: 'true'
          where: equals("log.nativeFormat", "true") && !(equals("log.merakiGroup", "events") && regexMatch("log.genericEvent", "^(dhcp (lease|no offers)[
            ]|Cellular connection[ ]|failover to[ ]|Site-to-site VPN:|Port[ ]|Blocked DHCP server[ ]|type=(splash_auth)([ ]|$))"))
      - grok:
          source: log.genericEvent
          patterns:
          - fieldName: log.nativeMessage
            pattern: (?s:.*)
          where: equals("log.nativeFormat", "true")
      - grok:
          where: '!equals("log.nativeFormat", "true")'
          patterns:
            - fieldName: log.irrelevant
              pattern: '^(\<{{.integer}}\>)'
            - fieldName: log.ciscoTime
              pattern: '{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: log.serverIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}(\s)?\:'
            - fieldName: log.msg
              pattern: '{{.greedy}}'
          source: raw
      - grok:
          where: '!equals("log.nativeFormat", "true")'
          patterns:
            - fieldName: log.ciscoTime
              pattern: '^{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: log.serverIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}(\s)?\:'
            - fieldName: log.msg
              pattern: '{{.greedy}}'
          source: raw
      # Adding control log.controlFlag field (Used to know if the message don't contains the header INT.INT mx_type mx_group)
      - add:
          where: '!equals("log.nativeFormat", "true")'
          function: 'string'
          params:
            key: log.controlFlag
            value: 'Init'
      # Begin message parsing
      # First extract the generic message, then parse it
      - grok:
          where: '!equals("log.nativeFormat", "true")'
          patterns:
            - fieldName: log.controlFlag
              pattern: '{{.data}}(\s)(events|flows|urls|ids-alerts|security_event)'
            - fieldName: log.genericEvent
              pattern: '{{.greedy}}'
          source: log.msg
      # Parsing variant INT.INT mx_type mx_group
      # Parsing from controlFlag (Format: Date? IP PORT INT.INT mx_type mx_group)
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: '{{.data}}{{.time}}'
            - fieldName: log.localIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.local.port
              pattern: '{{.integer}}'
            - fieldName: log.msgEventTime
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: log.merakiType
              pattern: '{{.data}}\s'
            - fieldName: log.merakiGroup
              pattern: '{{.greedy}}'
          source: log.controlFlag
          where: '!equals("log.nativeFormat", "true") && (!equals("log.controlFlag", "Init"))'
      - grok:
          patterns:
            - fieldName: log.msgEventTime
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: log.merakiType
              pattern: '{{.data}}\s'
            - fieldName: log.merakiGroup
              pattern: '{{.greedy}}'
          source: log.controlFlag
          where: '!equals("log.nativeFormat", "true") && (!equals("log.controlFlag", "Init"))'
      # ........................................
      # event vpn connectivity change
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'type(\s)?='
            - fieldName: action
              pattern: '{{.data}}\s'
            - fieldName: log.irrelevant
              pattern: 'vpn_type(\s)?='
            - fieldName: log.vpnType
              pattern: '''{{.data}}'''
            - fieldName: log.irrelevant
              pattern: 'peer_contact(\s)?='
            - fieldName: log.sourceIp
              pattern: '''{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'''
            - fieldName: log.irrelevant
              pattern: 'peer_ident(\s)?='
            - fieldName: log.peerIdent
              pattern: '''{{.data}}'''
            - fieldName: log.irrelevant
              pattern: 'connectivity(\s)?='
            - fieldName: log.connectivity
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("log.nativeHandled", "true") && (equals("log.connectivity", "true"))'
      # ........................................
      # event uplink connectivity change
      - rename:
          from:
            - log.genericEvent
          to: action
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("log.genericEvent", "failover to"))'
      # ........................................
      # event uplink connectivity change
      # Event: urls, HTTP GET requests in MR Access Points
      - rename:
          from:
            - log.genericEvent
          to: action
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("log.genericEvent", "Cellular connection"))'
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Cellular connection'
            - fieldName: log.connectionState
              pattern: '(up|Up|down|Down)'
            - fieldName: log.msgEventTime
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: log.merakiTypeIn
              pattern: '{{.data}}\s'
            - fieldName: log.merakiGroupIn
              pattern: '(events|flows|urls|ids-alerts|security_event)'
            - fieldName: log.irrelevant
              pattern: 'src(\s)?='
            - fieldName: log.sourceIp
              pattern: '{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: log.destinationIp
              pattern: '{{.data}}\:'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'mac(\s)?='
            - fieldName: origin.mac
              pattern: '{{.data}}(\s)'
            - fieldName: log.irrelevant
              pattern: 'request(\s)?\:'
            - fieldName: log.method
              pattern: '{{.word}}'
            - fieldName: target.url
              pattern: '{{.greedy}}'
          source: action
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("action", "Cellular connection"))'
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Cellular connection'
            - fieldName: log.connectionState
              pattern: '(up|Up|down|Down)'
          source: action
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("action", "Cellular connection"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("log.nativeHandled", "true") && (equalsIgnoreCase("log.connectionState", "up"))'
      # ........................................
      # Event: event, dhcp no offers
      - grok:
          patterns:
            - fieldName: action
              pattern: '{{.data}}for\smac'
            - fieldName: origin.mac
              pattern: '{{.data}}\s'
            - fieldName: log.irrelevant
              pattern: 'host(\s)?='
            - fieldName: log.sourceIp
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("log.genericEvent", "dhcp no offers"))'
      - trim:
          function: suffix
          substring: 'for mac'
          fields:
            - action
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("log.genericEvent", "dhcp no offers"))'
      # ........................................
      # Event: event, dhcp lease
      - grok:
          patterns:
            - fieldName: action
              pattern: '{{.data}}of\sip'
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'from server mac'
            - fieldName: log.serverMac
              pattern: '{{.data}}\s'
            - fieldName: log.irrelevant
              pattern: 'for client mac'
            - fieldName: origin.mac
              pattern: '{{.data}}\s'
            - fieldName: log.irrelevant
              pattern: 'from router'
            - fieldName: log.routerIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'on subnet'
            - fieldName: log.subnet
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'with dns'
            - fieldName: log.dns
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: ','
            - fieldName: log.dns1
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("log.genericEvent", "dhcp lease"))'
      - trim:
          function: suffix
          substring: 'of ip'
          fields:
            - action
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && contains("log.genericEvent", "dhcp lease"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("log.nativeHandled", "true") && (startsWith("log.genericEvent", "dhcp lease"))'
      # ........................................
      # Event: event, HTTP GET requests in Meraki MX Security Appliance
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'src(\s)?='
            - fieldName: log.sourceIp
              pattern: '{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: log.destinationIp
              pattern: '{{.data}}\:'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'mac(\s)?='
            - fieldName: origin.mac
              pattern: '{{.data}}(\s)'
            - fieldName: log.irrelevant
              pattern: 'request(\s)?\:'
            - fieldName: log.method
              pattern: '{{.word}}'
            - fieldName: target.url
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "src") && log.merakiGroup=="urls")'
      # Adding action result
      # ........................................
      # Event: flows, IP session initiated in Meraki MX Security Appliance
      # First variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'src(\s)?='
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: log.destinationIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'mac(\s)?='
            - fieldName: origin.mac
              pattern: '{{.data}}(\s)'
            - fieldName: log.irrelevant
              pattern: 'protocol(\s)?='
            - fieldName: protocol
              pattern: '{{.data}}(\s)'
            - fieldName: log.irrelevant
              pattern: 'sport(\s)?='
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'dport(\s)?='
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'pattern(\s)?\:'
            - fieldName: log.pattern
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "src") && equals("log.merakiGroup", "flows"))'
      # Second variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'src(\s)?='
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: log.destinationIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: 'protocol(\s)?='
            - fieldName: protocol
              pattern: '{{.data}}(\s)'
            - fieldName: log.irrelevant
              pattern: 'sport(\s)?='
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'dport(\s)?='
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'pattern(\s)?\:'
            - fieldName: log.pattern
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "src") && equals("log.merakiGroup", "flows"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "src") && equals("log.merakiGroup", "flows") && (startsWith("log.pattern", "0") || startsWith("log.pattern", "allow") || startsWith("log.pattern", "Allow")))'
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "src") && equals("log.merakiGroup", "flows") && (startsWith("log.pattern", "deny") || startsWith("log.pattern", "Deny")))'
      # ........................................
      # Event: ids-alerts, ids signature matched in Meraki MX Security Appliance
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'signature(\s)?='
            - fieldName: log.signature
              pattern: '{{.data}}priority'
            - fieldName: log.irrelevant
              pattern: '{{.data}}='
            - fieldName: log.priority
              pattern: '{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'timestamp(\s)?='
            - fieldName: log.msgEventTimeIn
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: log.irrelevant
              pattern: 'direction(\s)?='
            - fieldName: log.direction
              pattern: '{{.word}}'
            - fieldName: log.irrelevant
              pattern: 'protocol(\s)?='
            - fieldName: protocol
              pattern: '{{.data}}(\s)'
            - fieldName: log.irrelevant
              pattern: 'src(\s)?='
            - fieldName: log.sourceIp
              pattern: '{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "signature") && log.merakiGroup=="ids-alerts")'
      - trim:
          function: suffix
          substring: 'priority'
          fields:
            - log.signature
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "signature") && log.merakiGroup=="ids-alerts")'
      # ........................................
      # Event: event IPsec-SA request queued due to no phase 1 found, phase2 negotiation failed, initiate new phase 1 negotiation, 
      # ISAKMP-SA established, initiate new phase 2 negotiation, IPsec-SA established, ISAKMP-SA established, and ISAKMP-SA deleted 
      # in Meraki MX Security Appliance
      # This type of message mx_type=labs_appliance mx_group=events
      # First variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)(deleted|established)'
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: log.irrelevant
              pattern: '-'
            - fieldName: log.destinationIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: log.irrelevant
              pattern: 'spi(\s)?\:'
            - fieldName: log.spi
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      # Second variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)request(\s)for'
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: log.irrelevant
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      # Third variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)negotiation(\s)failed'
            - fieldName: log.irrelevant
              pattern: '{{.data}}ESP'
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: log.irrelevant
              pattern: '-\>'
            - fieldName: log.destinationIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      # Fourth variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)negotiation(\s)?\:'
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: log.irrelevant
              pattern: '\<=\>'
            - fieldName: log.destinationIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      # Fifth variant
      - grok:
          patterns:
            - fieldName: log.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)established\:(\s)?ESP/Tunnel'
            - fieldName: log.sourceIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: log.irrelevant
              pattern: '-\>'
            - fieldName: log.destinationIp
              pattern: '{{.ipv4}}|{{.ipv6}}|{{.hostname}}'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: log.irrelevant
              pattern: 'spi(\s)?='
            - fieldName: log.spi
              pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      - trim:
          function: prefix
          substring: '['
          fields:
            - origin.port
            - target.port
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      - trim:
          function: suffix
          substring: ']'
          fields:
            - origin.port
            - target.port
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Site") && equals("log.merakiGroup", "events") && contains("log.genericEvent", "established"))'
      # ........................................
      # Event: event spanning-tree guard state change in Meraki MS Switches
      - grok:
          patterns:
          - fieldName: log.irrelevant
            pattern: Port
          - fieldName: log.switchPort
            pattern: '{{.integer}}'
          - fieldName: log.irrelevant
            pattern: received an
          - fieldName: protocol
            pattern: '{{.data}}BPDU'
          - fieldName: log.irrelevant
            pattern: from
          - fieldName: origin.mac
            pattern: '{{.data}}so'
          - fieldName: log.irrelevant
            pattern: the port was
          - fieldName: log.merakiResult
            pattern: '{{.greedy}}'
          source: log.genericEvent
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Port") && equals("log.merakiGroup", "events"))'
      - trim:
          function: suffix
          substring: 'BPDU'
          fields:
            - protocol
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Port") && equals("log.merakiGroup", "events"))'
      - trim:
          function: suffix
          substring: 'so'
          fields:
            - origin.mac
          where: '!equals("log.nativeHandled", "true") && (!equals("log.controlFlag", "Init") && startsWith("log.genericEvent", "Port") && equals("log.merakiGroup", "events"))'
      # Adding action result
