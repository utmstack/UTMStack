# CISCO Meraki filter, version 3.2.0
# Based on https://documentation.meraki.com/General_Administration/Monitoring_and_Reporting/Syslog_Event_Types_and_Log_Samples
# https://documentation.cysiv.com/articles/#!data-source-onboarding-device-configuration-reference/cisco-meraki-reference-information-and-cim-mapping
#
# Filter Input requirements -> Syslog
#
# 1. Parsing the message field
patterns:
  merakiKVPrefix: ^(?:[A-Za-z][A-Za-z0-9_-]*\s*=\s*(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[^\s"']*)\s+)*?
  merakiKVValue: (?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[^\s"']+)
  # The grok step matches each pattern alone and rejects an empty match, so a
  # value checks its own end; an empty value is left unset instead of taking
  # the next pair, and a quoted value followed directly by text is rejected.
  merakiKVField: (?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[^\s"'A-Za-z][^\s"']*|[A-Za-z][A-Za-z0-9_-]*(?:[^\s"'A-Za-z0-9_=-][^\s"']*)?)(?:\s|$)
pipeline:
  - dataTypes:
      - firewall-meraki
    steps:
      # Header fields
      # Documented native envelopes; never infer Meraki from arbitrary message text.
      # The grok step rejects an empty match, so a line with a priority and a
      # line without one each have their own step.
      - grok:
          source: raw
          patterns:
          - fieldName: ''
            pattern: ^<[0-9]{1,3}>(?:1\s+)?
          - fieldName: event.msgEventTime
            pattern: '^[0-9]+\.[0-9]+'
          - fieldName: event.merakiType
            pattern: \S+
          - fieldName: event.merakiGroup
            pattern: (?:events|flows|firewall|cellular_firewall|vpn_firewall|l7_firewall|urls|ids-alerts|security_event|airmarshal_events)
          - fieldName: event.genericEvent
            pattern: (?s:.*)
          where: regexMatch("raw", "^<[0-9]{1,3}>(1\\s+)?[0-9]+\\.[0-9]+\\s")
      - grok:
          source: raw
          patterns:
          - fieldName: event.msgEventTime
            pattern: '^[0-9]+\.[0-9]+'
          - fieldName: event.merakiType
            pattern: \S+
          - fieldName: event.merakiGroup
            pattern: (?:events|flows|firewall|cellular_firewall|vpn_firewall|l7_firewall|urls|ids-alerts|security_event|airmarshal_events)
          - fieldName: event.genericEvent
            pattern: (?s:.*)
          where: regexMatch("raw", "^[0-9]+\\.[0-9]+\\s")
      - grok:
          source: raw
          patterns:
          - fieldName: ''
            pattern: ^(?:<[0-9]{1,3}>)?[A-Z][a-z]{2}\s+[0-9]{1,2}\s+(?:[0-9]{4}\s+)?[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?\s+\S+\s+(?:[0-9]+\s+)?
          - fieldName: event.msgEventTime
            pattern: '[0-9]+\.[0-9]+'
          - fieldName: event.merakiType
            pattern: \S+
          - fieldName: event.merakiGroup
            pattern: (?:events|flows|firewall|cellular_firewall|vpn_firewall|l7_firewall|urls|ids-alerts|security_event|airmarshal_events)
          - fieldName: event.genericEvent
            pattern: (?s:.*)
      - grok:
          source: raw
          patterns:
          - fieldName: ''
            pattern: ^<[0-9]{1,3}>
          - fieldName: event.merakiGroup
            pattern: airmarshal_events
          - fieldName: event.genericEvent
            pattern: (?s:.*)
          where: regexMatch("raw", "^<[0-9]{1,3}>airmarshal_events\\s")
      - grok:
          source: raw
          patterns:
          - fieldName: event.merakiGroup
            pattern: ^airmarshal_events
          - fieldName: event.genericEvent
            pattern: (?s:.*)
          where: regexMatch("raw", "^airmarshal_events\\s")
      - add:
          function: string
          params:
            key: event.nativeFormat
            value: 'true'
          where: exists("event.genericEvent") && exists("event.merakiGroup")
      - add:
          function: string
          params:
            key: event.controlFlag
            value: Native
          where: equals("event.nativeFormat", "true")
      - add:
          function: string
          params:
            key: event.nativeHandled
            value: 'true'
          where: equals("event.nativeFormat", "true") && !(equals("event.merakiGroup", "events") && regexMatch("event.genericEvent", "^(dhcp (lease|no offers)[
            ]|Cellular connection[ ]|failover to[ ]|Site-to-site VPN:|Port[ ]|Blocked DHCP server[ ]|type=(splash_auth)([ ]|$))"))
      - grok:
          source: event.genericEvent
          patterns:
          - fieldName: event.nativeMessage
            pattern: (?s:.*)
          where: equals("event.nativeFormat", "true")
      - grok:
          where: '!equals("event.nativeFormat", "true")'
          patterns:
            - fieldName: event.irrelevant
              pattern: '^(\<{{.integer}}\>)'
            - fieldName: event.ciscoTime
              pattern: '{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: event.serverIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: ''
              pattern: '\:'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
      - grok:
          where: '!equals("event.nativeFormat", "true")'
          patterns:
            - fieldName: event.ciscoTime
              pattern: '^{{.monthName}}\s{{.monthDay}}\s{{.year}}\s{{.time}}'
            - fieldName: event.serverIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: ''
              pattern: '\:'
            - fieldName: event.msg
              pattern: '{{.greedy}}'
          source: raw
      # Adding control log.controlFlag field (Used to know if the message don't contains the header INT.INT mx_type mx_group)
      - add:
          where: '!equals("event.nativeFormat", "true")'
          function: 'string'
          params:
            key: event.controlFlag
            value: 'Init'
      # Begin message parsing
      # First extract the generic message, then parse it
      - grok:
          where: '!equals("event.nativeFormat", "true")'
          patterns:
            - fieldName: event.controlFlag
              pattern: '{{.data}}(\s)(events|flows|urls|ids-alerts|security_event)'
            - fieldName: event.genericEvent
              pattern: '{{.greedy}}'
          source: event.msg
      # Parsing variant INT.INT mx_type mx_group
      # Parsing from controlFlag (Format: Date? IP PORT INT.INT mx_type mx_group)
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}{{.time}}'
            - fieldName: event.localIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.local.port
              pattern: '{{.integer}}'
            - fieldName: event.msgEventTime
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: event.merakiType
              pattern: '{{.data}}\s'
            - fieldName: event.merakiGroup
              pattern: '{{.greedy}}'
          source: event.controlFlag
          where: '!equals("event.nativeFormat", "true") && (!equals("event.controlFlag", "Init"))'
      - grok:
          patterns:
            - fieldName: event.msgEventTime
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: event.merakiType
              pattern: '{{.data}}\s'
            - fieldName: event.merakiGroup
              pattern: '{{.greedy}}'
          source: event.controlFlag
          where: '!equals("event.nativeFormat", "true") && (!equals("event.controlFlag", "Init"))'
      # ........................................
      # event vpn connectivity change
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'type(\s)?='
            - fieldName: action
              pattern: '{{.data}}\s'
            - fieldName: event.irrelevant
              pattern: 'vpn_type(\s)?='
            - fieldName: event.vpnType
              pattern: '''{{.data}}'''
            - fieldName: event.irrelevant
              pattern: 'peer_contact(\s)?='
            - fieldName: event.sourceIp
              pattern: '''{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'''
            - fieldName: event.irrelevant
              pattern: 'peer_ident(\s)?='
            - fieldName: event.peerIdent
              pattern: '''{{.data}}'''
            - fieldName: event.irrelevant
              pattern: 'connectivity(\s)?='
            - fieldName: event.connectivity
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("event.nativeHandled", "true") && (equals("event.connectivity", "true"))'
      # ........................................
      # event uplink connectivity change
      - rename:
          from:
            - event.genericEvent
          to: action
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("event.genericEvent", "failover to"))'
      # ........................................
      # event uplink connectivity change
      # Event: urls, HTTP GET requests in MR Access Points
      - rename:
          from:
            - event.genericEvent
          to: action
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("event.genericEvent", "Cellular connection"))'
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Cellular connection'
            - fieldName: event.connectionState
              pattern: '(up|Up|down|Down)'
            - fieldName: event.msgEventTime
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: event.merakiTypeIn
              pattern: '{{.data}}\s'
            - fieldName: event.merakiGroupIn
              pattern: '(events|flows|urls|ids-alerts|security_event)'
            - fieldName: event.irrelevant
              pattern: 'src(\s)?='
            - fieldName: event.sourceIp
              pattern: '{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: event.destinationIp
              pattern: '{{.data}}\:'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'mac(\s)?='
            - fieldName: origin.mac
              pattern: '{{.data}}(\s)'
            - fieldName: event.irrelevant
              pattern: 'request(\s)?\:'
            - fieldName: event.method
              pattern: '{{.word}}'
            - fieldName: target.url
              pattern: '{{.greedy}}'
          source: action
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("action", "Cellular connection"))'
      - grok:
          patterns:
            - fieldName: action
              pattern: 'Cellular connection'
            - fieldName: event.connectionState
              pattern: '(up|Up|down|Down)'
          source: action
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("action", "Cellular connection"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("event.nativeHandled", "true") && (equalsIgnoreCase("event.connectionState", "up"))'
      # ........................................
      # Event: event, dhcp no offers
      - grok:
          patterns:
            - fieldName: action
              pattern: '{{.data}}for\smac'
            - fieldName: origin.mac
              pattern: '{{.data}}\s'
            - fieldName: event.irrelevant
              pattern: 'host(\s)?='
            - fieldName: event.sourceIp
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("event.genericEvent", "dhcp no offers"))'
      - trim:
          function: suffix
          substring: 'for mac'
          fields:
            - action
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("event.genericEvent", "dhcp no offers"))'
      # ........................................
      # Event: event, dhcp lease
      - grok:
          patterns:
            - fieldName: action
              pattern: '{{.data}}of\sip'
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'from server mac'
            - fieldName: event.serverMac
              pattern: '{{.data}}\s'
            - fieldName: event.irrelevant
              pattern: 'for client mac'
            - fieldName: origin.mac
              pattern: '{{.data}}\s'
            - fieldName: event.irrelevant
              pattern: 'from router'
            - fieldName: event.routerIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'on subnet'
            - fieldName: event.subnet
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'with dns'
            - fieldName: event.dns
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: ','
            - fieldName: event.dns1
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("event.genericEvent", "dhcp lease"))'
      - trim:
          function: suffix
          substring: 'of ip'
          fields:
            - action
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && contains("event.genericEvent", "dhcp lease"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("event.nativeHandled", "true") && (startsWith("event.genericEvent", "dhcp lease"))'
      # ........................................
      # Event: event, HTTP GET requests in Meraki MX Security Appliance
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'src(\s)?='
            - fieldName: event.sourceIp
              pattern: '{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: event.destinationIp
              pattern: '{{.data}}\:'
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'mac(\s)?='
            - fieldName: origin.mac
              pattern: '{{.data}}(\s)'
            - fieldName: event.irrelevant
              pattern: 'request(\s)?\:'
            - fieldName: event.method
              pattern: '{{.word}}'
            - fieldName: target.url
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "src") && event.merakiGroup=="urls")'
      # Adding action result
      # ........................................
      # Event: flows, IP session initiated in Meraki MX Security Appliance
      # First variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'src(\s)?='
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: event.destinationIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'mac(\s)?='
            - fieldName: origin.mac
              pattern: '{{.data}}(\s)'
            - fieldName: event.irrelevant
              pattern: 'protocol(\s)?='
            - fieldName: protocol
              pattern: '{{.data}}(\s)'
            - fieldName: event.irrelevant
              pattern: 'sport(\s)?='
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'dport(\s)?='
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'pattern(\s)?\:'
            - fieldName: event.pattern
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "src") && equals("event.merakiGroup", "flows"))'
      # Second variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'src(\s)?='
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'dst(\s)?='
            - fieldName: event.destinationIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: 'protocol(\s)?='
            - fieldName: protocol
              pattern: '{{.data}}(\s)'
            - fieldName: event.irrelevant
              pattern: 'sport(\s)?='
            - fieldName: origin.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'dport(\s)?='
            - fieldName: target.port
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'pattern(\s)?\:'
            - fieldName: event.pattern
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "src") && equals("event.merakiGroup", "flows"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "src") && equals("event.merakiGroup", "flows") && (startsWith("event.pattern", "0") || startsWith("event.pattern", "allow") || startsWith("event.pattern", "Allow")))'
      - add:
          function: 'string'
          params:
            key: actionResult
            value: 'denied'
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "src") && equals("event.merakiGroup", "flows") && (startsWith("event.pattern", "deny") || startsWith("event.pattern", "Deny")))'
      # ........................................
      # Event: ids-alerts, ids signature matched in Meraki MX Security Appliance
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'signature(\s)?='
            - fieldName: event.signature
              pattern: '{{.data}}priority'
            - fieldName: event.irrelevant
              pattern: '{{.data}}='
            - fieldName: event.priority
              pattern: '{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'timestamp(\s)?='
            - fieldName: event.msgEventTimeIn
              pattern: '{{.integer}}\.{{.integer}}'
            - fieldName: event.irrelevant
              pattern: 'direction(\s)?='
            - fieldName: event.direction
              pattern: '{{.word}}'
            - fieldName: event.irrelevant
              pattern: 'protocol(\s)?='
            - fieldName: protocol
              pattern: '{{.data}}(\s)'
            - fieldName: event.irrelevant
              pattern: 'src(\s)?='
            - fieldName: event.sourceIp
              pattern: '{{.data}}\:'
            - fieldName: origin.port
              pattern: '{{.integer}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "signature") && event.merakiGroup=="ids-alerts")'
      - trim:
          function: suffix
          substring: 'priority'
          fields:
            - event.signature
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "signature") && event.merakiGroup=="ids-alerts")'
      # ........................................
      # Event: event IPsec-SA request queued due to no phase 1 found, phase2 negotiation failed, initiate new phase 1 negotiation, 
      # ISAKMP-SA established, initiate new phase 2 negotiation, IPsec-SA established, ISAKMP-SA established, and ISAKMP-SA deleted 
      # in Meraki MX Security Appliance
      # This type of message mx_type=labs_appliance mx_group=events
      # First variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)(deleted|established)'
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: event.irrelevant
              pattern: '-'
            - fieldName: event.destinationIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: event.irrelevant
              pattern: 'spi(\s)?\:'
            - fieldName: event.spi
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      # Second variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)request(\s)for'
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      # Third variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)negotiation(\s)failed'
            - fieldName: event.irrelevant
              pattern: '{{.data}}ESP'
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: event.irrelevant
              pattern: '-\>'
            - fieldName: event.destinationIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      # Fourth variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)negotiation(\s)?\:'
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: event.irrelevant
              pattern: '\<=\>'
            - fieldName: event.destinationIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      # Fifth variant
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'Site-to-site VPN(\s)?\:(\s)?{{.greedy}}(\s)established\:(\s)?ESP/Tunnel'
            - fieldName: event.sourceIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: origin.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: event.irrelevant
              pattern: '-\>'
            - fieldName: event.destinationIp
              pattern: '(?:{{.ipv4}}|{{.ipv6}}|{{.hostname}})'
            - fieldName: target.port
              pattern: '\[(\s)?{{.integer}}(\s)?\]'
            - fieldName: event.irrelevant
              pattern: 'spi(\s)?='
            - fieldName: event.spi
              pattern: '{{.greedy}}'
          source: event.genericEvent
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      - trim:
          function: prefix
          substring: '['
          fields:
            - origin.port
            - target.port
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      - trim:
          function: suffix
          substring: ']'
          fields:
            - origin.port
            - target.port
          where: '!equals("event.nativeHandled", "true") && (!equals("event.controlFlag", "Init") && startsWith("event.genericEvent", "Site") && equals("event.merakiGroup", "events"))'
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: success
