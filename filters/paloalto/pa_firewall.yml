# Palo Alto Firewall, version 3.1.0
# Palo Alto PAN-OS CSV and documented PAN-OS 10.0 CEF templates.
# The closed EventProcessor must be exercised in staging before rollout.
# The prior seven-field LEEF-labelled compatibility dialect is retained.
# Standard LEEF/custom layouts remain unverified; original raw is retained.
# https://docs.paloaltonetworks.com/resources/cef
# https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions
# See filters/audits/paloalto.md for layout/version and CEF escaping limits.
pipeline:
- dataTypes:
  - firewall-paloalto
  steps:
  - delete:
      fields:
      - log.correlationCandidate.paloalto
      - log.paScope
      - log.paVsys
      - log.paURLLayout
      - log.paConfigLayout
      - log.paDirection
      - log.paFormat
      - log.paPayload
      - log.paCefExtensions
      - log.paCefSignature
      - log.pa_type
      - log.pa_subtype
  - grok:
      source: raw
      patterns:
      - fieldName: log.paEnvelope
        pattern: '^<[0-9]{1,3}>[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} [^ ]+ '
      - fieldName: log.paPayload
        pattern: (?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo
          Alto Networks\|PAN-OS\|).*$
      where: '!exists("log.paPayload")'
  - grok:
      source: raw
      patterns:
      - fieldName: log.paEnvelope
        pattern: '^<[0-9]{1,3}>[1-9][0-9]* [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ (?:-|\[(?:\\.|[^\]\\])*\](?:\[(?:\\.|[^\]\\])*\])*) '
      - fieldName: log.paPayload
        pattern: (?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo
          Alto Networks\|PAN-OS\|).*$
      where: '!exists("log.paPayload")'
  - grok:
      source: raw
      patterns:
      - fieldName: log.paEnvelope
        pattern: ^(?:<[0-9]{1,3}>)?
      - fieldName: log.paPayload
        pattern: (?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo
          Alto Networks\|PAN-OS\|).*$
      where: '!exists("log.paPayload")'
  - add:
      function: string
      params:
        key: log.paFormat
        value: CSV
      where: regexMatch("log.paPayload", "^[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} ")
  - add:
      function: string
      params:
        key: log.paFormat
        value: CEF
      where: regexMatch("log.paPayload", "^CEF:[0-9]+\\|Palo Alto Networks\\|PAN-OS\\|")
  - add:
      function: string
      params:
        key: log.paFormat
        value: LEEF-legacy
      where: regexMatch("log.paPayload", "^LEEF:[0-9]+\\|Palo Alto Networks\\|PAN-OS\\|")
  - grok:
      source: log.paPayload
      patterns:
      - fieldName: log.paCefPrefix
        pattern: ^(?:CEF|LEEF):[0-9]+\|Palo Alto Networks\|PAN-OS\|
      - fieldName: log.paSenderSwVersion
        pattern: (?:\\.|[^|\\])*
      - fieldName: log.paSep1
        pattern: \|
      - fieldName: log.paCefSignature
        pattern: (?:\\.|[^|\\])*
      - fieldName: log.paSep2
        pattern: \|
      - fieldName: log.pa_type
        pattern: '[A-Z][A-Z0-9-]*'
      - fieldName: log.paSep3
        pattern: \|
      - fieldName: log.severityLabel
        pattern: '[^|]*'
      - fieldName: log.paSep4
        pattern: \|
      - fieldName: log.paCefExtensions
        pattern: .*$
      where: oneOf("log.paFormat", ["CEF", "LEEF-legacy"])
  - grok:
      source: log.paCefExtensions
      patterns:
      - fieldName: log.paIgnored
        pattern: ^(?:[A-Za-z][A-Za-z0-9_]*=(?:\\.|[^=\\])*?[ \t]+)*?DNSSICategory=
      - fieldName: log.DNSSICategory
        pattern: (?:\\.|[^=\\])*?
      - fieldName: log.paSuffix
        pattern: (?:[ \t]+[A-Za-z][A-Za-z0-9_]*=|$)
      where: oneOf("log.paFormat", ["CEF", "LEEF-legacy"])
