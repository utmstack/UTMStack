      - fieldName: event.DNSSICategory
        pattern: (?:\\.|[^=\\])*?(?:[ \t]+[A-Za-z][A-Za-z0-9_]*=|$)
      where: oneOf("event.paFormat", ["CEF", "LEEF-legacy"])
  - grok:
