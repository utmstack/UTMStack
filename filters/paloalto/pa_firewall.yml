# Palo Alto Firewall, version 3.1.2
# Palo Alto PAN-OS CSV and documented PAN-OS 10.0 CEF templates.
# Checked with the public EventProcessor 8a3ade7 parser plugins; exercise real export profiles before rollout.
# The prior seven-field LEEF-labelled compatibility dialect is retained.
# Standard LEEF/custom layouts remain unverified; original raw is retained.
# https://docs.paloaltonetworks.com/resources/cef
# https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions
# See filters/audits/paloalto.md for layout/version and CEF escaping limits.
pipeline:
- dataTypes:
  - firewall-paloalto
  steps:
  - delete:
      fields:
      - event.correlationCandidate.paloalto
      - event.paScope
      - event.paVsys
      - event.paURLLayout
      - event.paConfigLayout
      - event.paDirection
      - event.paFormat
      - event.paPayload
      - event.paCefExtensions
      - event.paCefSignature
      - event.paType
      - event.paSubtype
  - grok:
      source: raw
      patterns:
      - fieldName: event.paEnvelope
        pattern: '^<[0-9]{1,3}>[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2} [^ ]+ '
      - fieldName: event.paPayload
        pattern: (?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo
          Alto Networks\|PAN-OS\|).*$
      where: '!exists("event.paPayload")'
  - grok:
      source: raw
      patterns:
      - fieldName: event.paEnvelope
        pattern: '^<[0-9]{1,3}>[1-9][0-9]* [^ ]+ [^ ]+ [^ ]+ [^ ]+ [^ ]+ (?:-|\[(?:\\.|[^\]\\])*\](?:\[(?:\\.|[^\]\\])*\])*) '
      - fieldName: event.paPayload
        pattern: (?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo
          Alto Networks\|PAN-OS\|).*$
      where: '!exists("event.paPayload")'
  - grok:
      source: raw
      patterns:
      - fieldName: event.paEnvelope
        pattern: ^<[0-9]{1,3}>
      - fieldName: event.paPayload
        pattern: (?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo
          Alto Networks\|PAN-OS\|).*$
      where: '!exists("event.paPayload")'
  - grok:
      source: raw
      patterns:
      - fieldName: event.paPayload
        pattern: '(?:[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[^,]*,[A-Z][A-Z0-9-]*,|(?:CEF|LEEF):[0-9]+\|Palo Alto Networks\|PAN-OS\|).*$'
      where: '!exists("event.paPayload")'
  - add:
      function: string
      params:
        key: event.paFormat
        value: CSV
      where: regexMatch("event.paPayload", "^[0-9]*,[0-9]{4}/[0-9]{2}/[0-9]{2} ")
  - add:
      function: string
      params:
        key: event.paFormat
        value: CEF
      where: regexMatch("event.paPayload", "^CEF:[0-9]+\\|Palo Alto Networks\\|PAN-OS\\|")
  - add:
      function: string
      params:
        key: event.paFormat
        value: LEEF-legacy
      where: regexMatch("event.paPayload", "^LEEF:[0-9]+\\|Palo Alto Networks\\|PAN-OS\\|")
  - grok:
      source: event.paPayload
      patterns:
      - fieldName: event.paCefPrefix
        pattern: ^(?:CEF|LEEF):[0-9]+\|Palo Alto Networks\|PAN-OS\|
      - fieldName: event.paSenderSwVersion
        pattern: (?:\\.|[^|\\])*\|
      - fieldName: event.paCefSignature
        pattern: (?:\\.|[^|\\])*\|
      - fieldName: event.paType
        pattern: '[A-Z][A-Z0-9-]*'
      - fieldName: event.paSep3
        pattern: \|
      - fieldName: event.severityLabel
        pattern: '[^|]*\|'
      - fieldName: event.paCefExtensions
        pattern: .*$
      where: oneOf("event.paFormat", ["CEF", "LEEF-legacy"])
  - trim:
      function: suffix
      substring: '|'
      fields:
      - event.paSenderSwVersion
      - event.paCefSignature
      - event.severityLabel
      where: oneOf("event.paFormat", ["CEF", "LEEF-legacy"])
  - grok:
      source: event.paCefExtensions
      patterns:
      - fieldName: event.paIgnored
