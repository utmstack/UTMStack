# Mikrotik firewall module filter, version 3.2.0
# Based in docs and samples provided
# 
# Documentations
# 1- https://wiki.mikrotik.com/wiki/Manual:System/Log 
# 2- https://wiki.mikrotik.com/wiki/Manual:Routing_Table_Matcher 
# 3- https://datatracker.ietf.org/doc/html/rfc3164 
# 4- https://help.mikrotik.com/docs/spaces/ROS/pages/48660574/Filter (log action fields)
# 
# Implementation
# 1. Parsing the RAW field containing the Mikrotik
pipeline:
  - dataTypes:
      - firewall-mikrotik
    steps:

      # The EventProcessor grok step matches each pattern alone against the
      # trimmed remaining text, rejects an empty match and writes fields only
      # when every pattern matched, so each optional part has its own step.

      # Header with a timestamp: <pri>Mon DD HH:MM:SS [host ]topics message
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
      # Header without a timestamp: <pri>topics message
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '^<[0-9]{1,3}>'
            - fieldName: event.restData
              pattern: '{{.greedy}}'
          where: '!exists("event.restData") && regexMatch("raw", "^<[0-9]{1,3}>[a-z]+(,[a-z]+)+\\s")'
      # A host name before the topics; a host name has no comma, topics do
      - grok:
          source: event.restData
          patterns:
            - fieldName: event.deviceHost
              pattern: '^[^\s,]+'
            - fieldName: event.restData
              pattern: '(?s:.+)'
          where: regexMatch("event.restData", "^[^\\s,]+\\s+[a-z]+(,[a-z]+)+\\s")
      # Topics (for example firewall,info or system,error,critical), then the message
      - grok:
          source: event.restData
          patterns:
            - fieldName: event.topics
              pattern: '^[a-z]+(?:,[a-z]+)*'
            - fieldName: event.message
              pattern: '(?s:.+)'
          where: regexMatch("event.restData", "^[a-z]+(,[a-z]+)*\\s")

      # Firewall log action: [prefix ]chain: in:IF out:IF, [src-mac MAC, ]
      # proto P[ (flags)], SRC[:PORT]->DST[:PORT], [NAT ...,] len N
      - grok:
          source: event.message
          patterns:
            - fieldName: event.chainHeader
              pattern: '^.*?: in:'
          where: contains("event.topics", "firewall")
      - trim:
          function: suffix
          substring: ': in:'
          fields:
            - event.chainHeader
      - grok:
          source: event.chainHeader
          patterns:
            - fieldName: event.logPrefix
              pattern: '^.*\s'
            - fieldName: event.chain
              pattern: '^\S+$'
          where: contains("event.chainHeader", " ")
      - grok:
          source: event.chainHeader
          patterns:
            - fieldName: event.chain
              pattern: '^\S+$'
          where: exists("event.chainHeader") && !contains("event.chainHeader", " ")
      # A log prefix written as key:value (for example action:drop) becomes fields
      - kv:
          source: event.logPrefix
          fieldSplit: " "
          valueSplit: ":"
          where: exists("event.logPrefix") && contains("event.logPrefix", ":")
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^.*?: in:'
            - fieldName: event.inInterface
              pattern: '^(?:\([^)]*\)|[^\s,]+)'
            - fieldName: ''
              pattern: '^out:'
            - fieldName: event.outInterface
              pattern: '^(?:\([^)]*\)|[^\s,]+)'
          where: contains("event.topics", "firewall") && exists("event.chain")
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^.*?\bsrc-mac\s+'
            - fieldName: event.srcMac
              pattern: '^(?:{{.commonMacAddr}})'
          where: contains("event.topics", "firewall") && contains("event.message", "src-mac ")
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^.*?\bproto\s+'
            - fieldName: event.proto
              pattern: '^[A-Za-z0-9-]+'
          where: contains("event.topics", "firewall") && contains("event.message", "proto ")
      # Addresses with ports, for example 192.168.1.2:8080->10.5.5.1:3000
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^.*?\bproto\s+[A-Za-z0-9-]+(?:\s*\([^)]*\))?,'
            - fieldName: event.srcIp
              pattern: '^{{.ipv4}}'
            - fieldName: event.srcPort
              pattern: '^:[0-9]+'
            - fieldName: ''
              pattern: '^->'
            - fieldName: event.dstIp
              pattern: '^{{.ipv4}}'
            - fieldName: event.dstPort
              pattern: '^:[0-9]+'
          where: contains("event.topics", "firewall") && regexMatch("event.message", "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+:[0-9]+->[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+:[0-9]+")
      # Addresses without ports, for example ICMP: 192.168.1.2->10.5.5.1
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^.*?\bproto\s+[A-Za-z0-9-]+(?:\s*\([^)]*\))?,'
            - fieldName: event.srcIp
              pattern: '^{{.ipv4}}'
            - fieldName: ''
              pattern: '^->'
            - fieldName: event.dstIp
              pattern: '^{{.ipv4}}'
          where: contains("event.topics", "firewall") && !exists("event.srcIp") && regexMatch("event.message", "[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+->[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+")
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^.*,\s*len\s+'
            - fieldName: event.len
              pattern: '^[0-9]+'
          where: contains("event.topics", "firewall") && contains("event.message", " len ")

      # A /system logging rule prefix between the topics and a login message
      # ("system,error,critical mk_R1: login failure for user ...") is split off,
      # so the login steps below read the message itself
      - grok:
          source: event.message
          patterns:
            - fieldName: event.loggingPrefix
              pattern: '^[^\s:]+'
            - fieldName: ''
              pattern: '^:'
            - fieldName: event.message
              pattern: '(?s:.+)'
          where: 'contains("event.topics", "system") && regexMatch("event.message", "^[^\\s:]+: (login failure for user |user \\S.*\\slogged in from )")'

      # Documented failed login: "login failure for user root from 10.0.0.1 via telnet".
      # The address and service are read after the last " from ", so an empty user
      # name ("for user  from") or one with spaces keeps them; the user is read apart.
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^login failure for user.*\sfrom'
            - fieldName: event.loginSource
              pattern: '^\S+'
            - fieldName: ''
              pattern: '^via'
            - fieldName: event.service
              pattern: '^\S+'
          where: contains("event.topics", "system") && startsWith("event.message", "login failure for user ")
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^login failure for user'
            - fieldName: event.loginUser
              pattern: '^.*\S\s+from\s'
          where: contains("event.topics", "system") && regexMatch("event.message", "^login failure for user \\S.*\\sfrom\\s")
      # Documented successful login: "user admin logged in from 10.1.101.212 via winbox"
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^user\s.*\slogged in from'
            - fieldName: event.loginSource
              pattern: '^\S+'
            - fieldName: ''
              pattern: '^via'
            - fieldName: event.service
              pattern: '^\S+'
          where: contains("event.topics", "account") && regexMatch("event.message", "^user \\S.*\\slogged in from \\S+ via \\S+$")
      - grok:
          source: event.message
          patterns:
            - fieldName: ''
              pattern: '^user'
            - fieldName: event.loginUser
              pattern: '^.*\S\s+logged in from\s'
          where: contains("event.topics", "account") && regexMatch("event.message", "^user \\S.*\\slogged in from \\S+ via \\S+$")
      - trim:
          function: suffix
          substring: ' from'
          fields:
            - event.loginUser
      - trim:
          function: suffix
          substring: ' logged in'
          fields:
            - event.loginUser
      - rename:
          from:
            - event.loginUser
          to: origin.user
      - rename:
          from:
            - event.loginSource
          to: origin.ip
          where: (inCIDR("event.loginSource", "0.0.0.0/0") || inCIDR("event.loginSource", "::/0")) && !inCIDR("event.loginSource", "0.0.0.0/32") && !inCIDR("event.loginSource", "::/128")

      # Rename filds
      - rename:
          from:
            - event.srcIp
          to: origin.ip
      - rename:
          from:
            - event.dstIp
          to: target.ip
      - rename:
          from:
            - event.srcMac
          to: origin.mac
      - rename:
          from:
            - event.srcPort
          to: origin.port
      - rename:
          from:
            - event.dstPort
          to: target.port
      - rename:
          from:
            - event.proto
          to: protocol

      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - event.priority
      - trim:
          function: prefix
          substring: ':'
          fields:
            - target.port
            - origin.port
      - trim:
          function: prefix
          substring: ','
          fields:
            - event.chain
            - origin.ip
      - trim:
          function: suffix
          substring: '>'
          fields:
            - event.priority

      # Fields conversions
      - cast:
          to: 'int'
          fields:
            - event.priority
            - event.len
            - origin.port
            - target.port

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Adding action result: only success, failed or denied, or nothing when the
      # line states no outcome. The add step overwrites, so the order is success,
      # failed, denied. RouterOS firewall logs do not record the rule action; only
      # the rule's log prefix states it (action:accept, action:drop, or a word such
      # as Allow or Block). RouterOS logs nothing after an allowed packet, so an
      # allow prefix is the only proof of the outcome and gives success. A firewall
      # line without such a prefix keeps no value.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'contains("event.topics", "firewall") && ((exists("event.action") && oneOf("event.action", ["accept", "allow"])) || (exists("event.logPrefix") && regexMatch("event.logPrefix", "(?i)(^|[^a-z])(accept|accepted|allow|allowed|permit|permitted)([^a-z]|$)")))'
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'contains("event.topics", "account") && regexMatch("event.message", "^user \\S.*\\slogged in from \\S+ via \\S+$")'
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: 'contains("event.topics", "system") && startsWith("event.message", "login failure for user ")'
      # A block word wins over an allow word in the same prefix
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: '(exists("event.action") && oneOf("event.action", ["drop", "reject", "tarpit"])) || (contains("event.topics", "firewall") && exists("event.logPrefix") && regexMatch("event.logPrefix", "(?i)(^|[^a-z])(drop|dropped|deny|denied|block|blocked|reject|rejected|tarpit)([^a-z]|$)"))'

      # Removing unused fields
      - delete:
          fields:
            - event.trash
            - event.trash2
            - event.trash3
            - event.trash4
            - event.trash5
            - event.restData
            - event.chainHeader