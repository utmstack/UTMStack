# Mikrotik firewall module filter, version 3.0.1
# Based in docs and samples provided
# 
# Documentations
# 1- https://wiki.mikrotik.com/wiki/Manual:System/Log 
# 2- https://wiki.mikrotik.com/wiki/Manual:Routing_Table_Matcher 
# 3- https://datatracker.ietf.org/doc/html/rfc3164 
# 
# Implementation
# 1. Parsing the RAW field containing the Mikrotik
pipeline:
  - dataTypes:
      - firewall-mikrotik
    steps:

      # Using grok to parse header of the message
      # First if message begins with time format
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}'
            - fieldName: log.restData
              pattern: '{{.greedy}}'

      # Using grok to parse rest of the message        
      - grok:
          patterns:
            - fieldName: log.topics
              pattern: '{{.word}}'
            - fieldName: log.chain
              pattern: '\,{{.data}}\s'
            - fieldName: log.kvMessage
              pattern: '{{.data}}\,'
            - fieldName: log.restData
              pattern: '{{.greedy}}'
          source: log.restData

      # Using kv to parse message
      - kv:
          source: log.kvMessage
          fieldSplit: " "
          valueSplit: ":"

      # Removing unused fields
      - delete:
          fields:
            - log.kvMessage
      
      # Using grok to parse rest of the message with IP and Port  
      # Example 192.168.1.2:8080->10.5.5.1:3000 
      - grok:
          patterns:
            - fieldName: log.trash
              pattern: '{{.word}}(-){{.word}}'
            - fieldName: log.srcMac
              pattern: '{{.commonMacAddr}}'
            - fieldName: log.trash2
              pattern: '\,{{.space}}{{.word}}'
            - fieldName: log.proto
              pattern: '{{.word}}|{{.integer}}'
            - fieldName: log.trash3
              pattern: '{{.data}}\)'
            - fieldName: log.srcIp
              pattern: '\,{{.space}}{{.ipv4}}'
            - fieldName: log.srcPort
              pattern: '\:{{.integer}}'
            - fieldName: log.trash4
              pattern: '(->)'
            - fieldName: log.dstIp
              pattern: '{{.ipv4}}'
            - fieldName: log.dstPort
              pattern: '\:{{.integer}}'
            - fieldName: log.trash5
              pattern: '\,{{.space}}{{.word}}'
            - fieldName: log.len
              pattern: '{{.greedy}}'
          source: log.restData

      # Using grok to parse rest of the message with IP without Port  
      # Example 192.168.1.2->10.5.5.1
      - grok:
          patterns:
            - fieldName: log.trash
              pattern: '{{.word}}(-){{.word}}'
            - fieldName: log.srcMac
              pattern: '{{.commonMacAddr}}'
            - fieldName: log.trash2
              pattern: '\,{{.space}}{{.word}}'
            - fieldName: log.proto
              pattern: '{{.word}}|{{.integer}}'
            - fieldName: log.srcIp
              pattern: '\,{{.space}}{{.ipv4}}'
            - fieldName: log.trash4
              pattern: '(->)'
            - fieldName: log.dstIp
              pattern: '{{.ipv4}}'
            - fieldName: log.trash5
              pattern: '\,{{.space}}{{.word}}'
            - fieldName: log.len
              pattern: '{{.greedy}}'
          source: log.restData

      # Using grok to parse rest of the message with IP without Port  
      # Example 192.168.1.2->10.5.5.1:8080
      - grok:
          patterns:
            - fieldName: log.trash
              pattern: '{{.word}}(-){{.word}}'
            - fieldName: log.srcMac
              pattern: '{{.commonMacAddr}}'
            - fieldName: log.trash2
              pattern: '\,{{.space}}{{.word}}'
            - fieldName: log.proto
              pattern: '{{.word}}|{{.integer}}'
            - fieldName: log.trash3
              pattern: '{{.data}}\)'
            - fieldName: log.srcIp
              pattern: '\,{{.space}}{{.ipv4}}'
            - fieldName: log.trash4
              pattern: '(->)'
            - fieldName: log.dstIp
              pattern: '{{.ipv4}}'
            - fieldName: log.dstPort
              pattern: '\:{{.integer}}'
            - fieldName: log.trash5
              pattern: '\,{{.space}}{{.word}}'
            - fieldName: log.len
              pattern: '{{.greedy}}'
          source: log.restData

      # Rename filds
      - rename:
          from:
            - log.srcIp
          to: origin.ip
      - rename:
          from:
            - log.dstIp
          to: target.ip
      - rename:
          from:
            - log.srcMac
          to: origin.mac
      - rename:
          from:
            - log.srcPort
          to: origin.port
      - rename:
          from:
            - log.dstPort
          to: target.port
      - rename:
          from:
            - log.proto
          to: protocol

      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.priority
      - trim:
          function: prefix
          substring: ':'
          fields:
            - target.port
            - origin.port
      - trim:
          function: prefix
          substring: ','
          fields:
            - log.chain
            - origin.ip
      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.priority

      # Fields conversions
      - cast:
          to: 'int'
          fields:
            - log.priority
            - log.len
            - origin.port
            - target.port

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: exists("log.action") && equals("log.action", "drop")

      # Removing unused fields
      - delete:
          fields:
            - log.trash
            - log.trash2
            - log.trash3
            - log.trash4
            - log.trash5
            - log.restData

      # Keep addresses in IP fields and retain other source values under log.
      - rename:
          from:
          - origin.ip
          to: log.unparsedOriginIp
          where: exists("origin.ip") && (!(inCIDR("origin.ip","0.0.0.0/0") || inCIDR("origin.ip","::/0")) || oneOf("origin.ip",["0.0.0.0","::"]))
      - rename:
          from:
          - target.ip
          to: log.unparsedTargetIp
          where: exists("target.ip") && (!(inCIDR("target.ip","0.0.0.0/0") || inCIDR("target.ip","::/0")) || oneOf("target.ip",["0.0.0.0","::"]))
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: log.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)
