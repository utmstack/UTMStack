        "logon", "connect", "session start", "signed in", "signedin", "Allow", "Pass", "Accept", "Permit", "OK", "Success", "Allowed", "Open", "Opened", "Login",
        "Logon", "Connect", "Alerted", "alerted", "detected", "Detected"]) && equals("log.dataType", "leef")
  - add:
