      where: oneOf("log.act", ["block", "deny", "drop", "reject", "blocked", "denied", "dropped", "rejected", "quarantine", "teardown", "closed", "terminated", "invalid",
        "failed auth", "authentication failed", "Block", "Deny", "Drop", "Reject", "Blocked", "Denied", "Dropped", "Rejected", "Closed", "Terminated", "Quarantined",
        "failed", "Failed"]) && equals("log.dataType", "leef")
  - add:
      function: string
      params:
        key: actionResult
        value: failure
      where: oneOf("log.act", ["error", "fail", "timeout", "Error", "Fail", "Timeout"]) && equals("log.dataType", "leef")
  - rename:
      from:
      - log.act
      to: action
      where: exists("log.act") && equals("log.dataType", "leef")
  - rename:
      from:
      - log.dvchost
      to: origin.host
      where: '!exists("origin.host") && exists("log.dvchost") && equals("log.dataType", "leef")'
  - add:
      function: string
      params:
        key: severity
        value: info
      where: oneOf("log.leefSeverity", ["0", "1", "2", "3", "low", "Low", "LOW", "informational", "Informational", "none", "None", "debug", "Debug"]) && equals("log.dataType",
