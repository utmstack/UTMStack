      to: origin.bytesReceived
      where: exists("log.bytesIn") && equals("log.dataType", "leef")
  - rename:
      from:
      - log.bytesOut
      to: origin.bytesSent
      where: exists("log.bytesOut") && equals("log.dataType", "leef")
  - rename:
