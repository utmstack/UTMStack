# Plain syslog (RFC 5424 / RFC 3164) envelope filter, version 1.0.0
#
# Parses the envelope of plain (unstructured) syslog: the PRI severity and
# facility, the RFC 5424 structured header (timestamp, host, application,
# procid, msgid, structured data) and the RFC 3164 header (timestamp, host,
# tag), plus the free-form message body. This is the LAST stage of the
# syslog catch-all: CEF and LEEF messages are claimed first by
# syslog-cef-leef.yml (file order); every step here is guarded with
# !contains("raw","CEF:") && !contains("raw","LEEF:") so those are untouched.
#
# Replaces the previous stub that only copied raw into log.message. The body
# is still exposed there (for contains()-based rules), but severity, host,
# process and timestamp are now standard fields.
#
# Authoritative references:
#   - RFC 5424 (The Syslog Protocol)
#   - RFC 3164 (BSD syslog format)
#   - https://github.com/threatwinds/go-sdk/wiki/Filter-Steps-Reference
#
# Implementation notes:
#   - The filter `where` CEL has no arithmetic, so severity (PRI % 8) and
#     facility (PRI // 8) are derived by enumerating the 24 PRI values per
#     syslog severity (192 values; exact and bounded).
#   - The 8 syslog severities map onto the standard 5-value vocabulary:
#     emergency/alert/critical -> critical, error -> error, warning ->
#     warning, notice/informational/debug -> info.
#   - deviceTime is assigned only when the timestamp parses as RFC 3339
#     (RFC 5424). RFC 3164 timestamps carry no year and are kept under
#     log.syslogTime; the ingestion @timestamp stays authoritative.
#   - The RFC 3164 day match uses one-or-more spaces so both "Jun  4"
#     (padded) and "Jun 4" parse.

pipeline:
- dataTypes:
  - syslog
  steps:
  - add:
      function: string
      params:
        key: log.dataType
        value: plain
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:")'
  - grok:
      source: raw
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && regexMatch("raw", "^<[0-9]{1,3}>")'
      patterns:
      - fieldName: log.syslogPri
        pattern: <[0-9]{1,3}>
      - fieldName: log.syslogRest
        pattern: .*
  - grok:
      source: raw
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && !regexMatch("raw", "^<[0-9]{1,3}>")'
      patterns:
      - fieldName: log.syslogRest
        pattern: .*
  - trim:
      function: substring
      substring: <
      fields:
      - log.syslogPri
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:")'
  - trim:
      function: substring
      substring: '>'
      fields:
      - log.syslogPri
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:")'
  - cast:
      fields:
      - log.syslogPri
      to: int
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogPri")'
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: oneOf("log.syslogPri", [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152, 160, 168, 176, 184]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: oneOf("log.syslogPri", [1, 9, 17, 25, 33, 41, 49, 57, 65, 73, 81, 89, 97, 105, 113, 121, 129, 137, 145, 153, 161, 169, 177, 185]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: oneOf("log.syslogPri", [2, 10, 18, 26, 34, 42, 50, 58, 66, 74, 82, 90, 98, 106, 114, 122, 130, 138, 146, 154, 162, 170, 178, 186]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: error
      where: oneOf("log.syslogPri", [3, 11, 19, 27, 35, 43, 51, 59, 67, 75, 83, 91, 99, 107, 115, 123, 131, 139, 147, 155, 163, 171, 179, 187]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: warning
      where: oneOf("log.syslogPri", [4, 12, 20, 28, 36, 44, 52, 60, 68, 76, 84, 92, 100, 108, 116, 124, 132, 140, 148, 156, 164, 172, 180, 188]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: info
      where: oneOf("log.syslogPri", [5, 13, 21, 29, 37, 45, 53, 61, 69, 77, 85, 93, 101, 109, 117, 125, 133, 141, 149, 157, 165, 173, 181, 189]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: info
      where: oneOf("log.syslogPri", [6, 14, 22, 30, 38, 46, 54, 62, 70, 78, 86, 94, 102, 110, 118, 126, 134, 142, 150, 158, 166, 174, 182, 190]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: severity
        value: info
      where: oneOf("log.syslogPri", [7, 15, 23, 31, 39, 47, 55, 63, 71, 79, 87, 95, 103, 111, 119, 127, 135, 143, 151, 159, 167, 175, 183, 191]) && !contains("raw",
        "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '0'
      where: oneOf("log.syslogPri", [0, 1, 2, 3, 4, 5, 6, 7]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '1'
      where: oneOf("log.syslogPri", [8, 9, 10, 11, 12, 13, 14, 15]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '2'
      where: oneOf("log.syslogPri", [16, 17, 18, 19, 20, 21, 22, 23]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '3'
      where: oneOf("log.syslogPri", [24, 25, 26, 27, 28, 29, 30, 31]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '4'
      where: oneOf("log.syslogPri", [32, 33, 34, 35, 36, 37, 38, 39]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '5'
      where: oneOf("log.syslogPri", [40, 41, 42, 43, 44, 45, 46, 47]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '6'
      where: oneOf("log.syslogPri", [48, 49, 50, 51, 52, 53, 54, 55]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '7'
      where: oneOf("log.syslogPri", [56, 57, 58, 59, 60, 61, 62, 63]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '8'
      where: oneOf("log.syslogPri", [64, 65, 66, 67, 68, 69, 70, 71]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '9'
      where: oneOf("log.syslogPri", [72, 73, 74, 75, 76, 77, 78, 79]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '10'
      where: oneOf("log.syslogPri", [80, 81, 82, 83, 84, 85, 86, 87]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '11'
      where: oneOf("log.syslogPri", [88, 89, 90, 91, 92, 93, 94, 95]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '12'
      where: oneOf("log.syslogPri", [96, 97, 98, 99, 100, 101, 102, 103]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '13'
      where: oneOf("log.syslogPri", [104, 105, 106, 107, 108, 109, 110, 111]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '14'
      where: oneOf("log.syslogPri", [112, 113, 114, 115, 116, 117, 118, 119]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '15'
      where: oneOf("log.syslogPri", [120, 121, 122, 123, 124, 125, 126, 127]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '16'
      where: oneOf("log.syslogPri", [128, 129, 130, 131, 132, 133, 134, 135]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '17'
      where: oneOf("log.syslogPri", [136, 137, 138, 139, 140, 141, 142, 143]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '18'
      where: oneOf("log.syslogPri", [144, 145, 146, 147, 148, 149, 150, 151]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '19'
      where: oneOf("log.syslogPri", [152, 153, 154, 155, 156, 157, 158, 159]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '20'
      where: oneOf("log.syslogPri", [160, 161, 162, 163, 164, 165, 166, 167]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '21'
      where: oneOf("log.syslogPri", [168, 169, 170, 171, 172, 173, 174, 175]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '22'
      where: oneOf("log.syslogPri", [176, 177, 178, 179, 180, 181, 182, 183]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - add:
      function: string
      params:
        key: log.syslogFacility
        value: '23'
      where: oneOf("log.syslogPri", [184, 185, 186, 187, 188, 189, 190, 191]) && !contains("raw", "CEF:") && !contains("raw", "LEEF:")
  - grok:
      source: log.syslogRest
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogRest") && startsWith("log.syslogRest", "1 ")'
      patterns:
      - fieldName: log.syslogVersion
        pattern: '1 '
      - fieldName: log.syslogTime
        pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:?[0-9]{2})?'
      - fieldName: log.syslogHost
        pattern: '[^ ]+'
      - fieldName: log.application
        pattern: '[^ ]+'
      - fieldName: log.processId
        pattern: '[^ ]+'
      - fieldName: log.messageId
        pattern: '[^ ]+'
      - fieldName: log.structuredData
        pattern: -|\[[^\]]*\](\[[^\]]*\])*
      - fieldName: log.syslogMessage
        pattern: .*
  - delete:
      fields:
      - log.syslogMessage
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && equals("log.syslogMessage", "-")'
  - rename:
      from:
      - log.syslogHost
      to: origin.host
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogHost")'
  - rename:
      from:
      - log.application
      to: origin.process
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.application") && !equals("log.application", "-")'
  - reformat:
      function: time
      fields:
      - log.syslogTime
      fromFormat: 2006-01-02T15:04:05.999999999Z07:00
      toFormat: 2006-01-02T15:04:05Z07:00
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogTime") && regexMatch("log.syslogTime", "^[0-9]{4}-")'
  - rename:
      from:
      - log.syslogTime
      to: deviceTime
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogTime") && regexMatch("log.syslogTime", "^[0-9]{4}-")'
  - grok:
      source: log.syslogRest
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogRest") && !startsWith("log.syslogRest", "1 ") && regexMatch("log.syslogRest",
        "[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}[^0-9][^:]+:")'
      patterns:
      - fieldName: log.syslogTime
        pattern: '[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}'
      - fieldName: log.syslogHost
        pattern: '[^ ]+'
      - fieldName: log.application
        pattern: '[^ :]+(\[[0-9]+\])?:'
      - fieldName: log.syslogMessage
        pattern: .*
  - rename:
      from:
      - log.syslogHost
      to: origin.host
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogHost") && !exists("origin.host")'
  - rename:
      from:
      - log.application
      to: origin.process
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.application") && !exists("origin.process")'
  - trim:
      function: regex
      substring: (\[[0-9]+\])?:$
      fields:
      - origin.process
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("origin.process")'
  - rename:
      from:
      - log.syslogMessage
      to: log.message
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && exists("log.syslogMessage")'
  - grok:
      source: raw
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:") && !exists("log.message")'
      patterns:
      - fieldName: log.message
        pattern: .*
  - delete:
      fields:
      - log.syslogRest
      - log.syslogVersion
      where: '!contains("raw", "CEF:") && !contains("raw", "LEEF:")'
