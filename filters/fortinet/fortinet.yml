          where: exists("event.dstuser") && !oneOf("event.dstuser", ["", "-", "N/A", "unknown"])
      - rename:
          from: [event.remip]
          to: origin.ip
          where: '!exists("origin.ip") && equals("event.type", "event") && equals("event.subtype", "vpn") && (oneOf("action", ["ssl-login-fail", "ssl-login-succ"]) || equals("event.logid", "0101039426")) && (inCIDR("event.remip", "0.0.0.0/0") || inCIDR("event.remip", "::/0")) && !inCIDR("event.remip", "0.0.0.0/32") && !inCIDR("event.remip", "::/128")'
      - add:
