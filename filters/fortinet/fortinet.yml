          where: exists("log.dstuser") && !oneOf("log.dstuser", ["", "-", "N/A", "unknown"])
      - rename:
          from: [log.remip]
          to: origin.ip
          where: '!exists("origin.ip") && equals("log.type", "event") && equals("log.subtype", "vpn") && (oneOf("action", ["ssl-login-fail", "ssl-login-succ"]) || equals("log.logid", "0101039426")) && (inCIDR("log.remip", "0.0.0.0/0") || inCIDR("log.remip", "::/0")) && !inCIDR("log.remip", "0.0.0.0/32") && !inCIDR("log.remip", "::/128")'
      - add:
