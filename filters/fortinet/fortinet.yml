            value: "IP-in-IP"
          where: equals("event.proto", "4")
      - add:
          function: "string"
          params:
            key: protocol
            value: "ST"
          where: equals("event.proto", "5")
      - add:
          function: "string"
          params:
            key: protocol
            value: "TCP"
          where: equals("event.proto", "6")
      - add:
          function: "string"
          params:
            key: protocol
            value: "CBT"
          where: equals("event.proto", "7")
      - add:
