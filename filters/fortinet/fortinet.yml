      # Removing unused fields
      - delete:
          fields:
            - log.kvMessage
            - log.proto

      # Normalize explicit outcomes; an unknown outcome remains unset.
      # LOG_ID_TRAFFIC_FAIL_CONN (11) denotes failure; action=dns alone does not.
      # A normal close ends an allowed, established session. A reset or timeout
      # can end an attempt that got no usable reply, so it keeps no outcome.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equalsIgnoreCase("action", "accept") || equals("action", "close")
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("log.type", "traffic") && equals("log.logid", "0000000011")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("log.type", "event") && equals("log.subtype", "system") && equals("log.logid", "0100032001")
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("log.type", "event") && (equals("log.subtype", "system") && equals("log.logid", "0100032002") || equals("log.subtype", "vpn") && (equals("log.logid", "0101039426") || equals("action", "ssl-login-fail")))
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: regexMatch("action", "(?i)^(deny|denied|drop|dropped|block|blocked)$") || regexMatch("log.utmaction", "(?i)^(deny|denied|drop|dropped|block|blocked)$") || regexMatch("log.FTNTFGTutmaction", "(?i)^(deny|denied|drop|dropped|block|blocked)$")
      - add:
          function: string
          params:
            key: connectionStatus
            value: closed
          where: oneOf("action", ["close", "client-rst", "server-rst", "timeout"])

      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: log.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)

      # Ignore input-supplied markers. History counts only equivalent candidates.
      - delete:
          fields: [log.correlationCandidate]
      - add:
          function: string
          params:
            key: log.correlationCandidate.vpnAuthFailure
            value: match
          where: |
            exists("log.devid") && !equals("log.devid", "") && exists("log.vd") && !equals("log.vd", "") &&
            (equals("log.type", "event") && equals("log.subtype", "vpn") &&
            (equals("action", "ssl-login-fail") || equals("log.logid", "0101039426")) &&
            exists("origin.ip"))
      - add:
          function: string
          params:
            key: log.correlationCandidate.ipsCritical
            value: match
          where: |
            exists("log.devid") && !equals("log.devid", "") && exists("log.vd") && !equals("log.vd", "") &&
            (equals("log.type", "utm") && equals("log.subtype", "ips") &&
            oneOf("log.severity", ["critical", "high"]) &&
            equals("actionResult", "denied") && exists("origin.ip"))
      - add:
          function: string
          params:
            key: log.correlationCandidate.dlp
            value: match
          where: |
            equals("log.type", "utm") && equals("log.subtype", "dlp") &&
            exists("log.devid") && !equals("log.devid", "") && exists("log.vd") && !equals("log.vd", "") &&
            (exists("origin.ip") &&
            ((equals("log.subtype", "dlp") && oneOf("action", ["block", "blocked"])) ||
             contains("log.msg", "DLP sensor") ||
             contains("log.msg", "sensitive data detected") ||
             (exists("log.dlpprofile") && equals("log.dlpaction", "block")) ||
             contains("log.msg", "Data pattern matched")))
      - add:
          function: string
          params:
            key: log.correlationCandidate.virusOutbreak
            value: match
          where: |
            exists("log.devid") && !equals("log.devid", "") && exists("log.vd") && !equals("log.vd", "") &&
            (equals("log.type", "utm") && equals("log.subtype", "virus") &&
            equals("log.eventtype", "infected") && equals("actionResult", "denied") &&
            exists("origin.ip"))
