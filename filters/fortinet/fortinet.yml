# Fortinet firewall module filter, version 3.3.0
# Based in docs and samples provided
# 
# Documentations
# 1- https://docs.fortinet.com/document/fortigate/7.0.4/fortios-log-message-reference/357866/log-message-fields 
# 2- https://docs.fortinet.com/document/fortigate/7.0.4/fortios-log-message-reference/656858/log-id-definitions 
# 
# Implementation
# 1. Parsing the RAW field containing the Fortinet firewall
pipeline:
  - dataTypes:
      - firewall-fortigate-traffic
    steps:

      #Using grok to parse priority if present
      - grok:
          patterns:
            - {fieldName: log.priority, pattern: '^<[0-9]{1,3}>'}
            - {fieldName: log.kvMessage, pattern: '{{.greedy}}'}

      # Vendor disk-format samples do not include a syslog priority prefix.
      - grok:
          source: raw
          patterns:
            - {fieldName: log.kvMessage, pattern: '(?s:.*)'}
          where: '!exists("log.kvMessage")'

      # Extract the CEF extension before KV parsing; header text is not a KV key.
      # This also accepts the space after "CEF:" used by Fortinet's examples.
      - grok:
          source: log.kvMessage
          patterns:
            - {fieldName: '', pattern: '^(?:[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+)?CEF:\s*'}
            - {fieldName: log.cefVersion, pattern: '[0-9]+'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.cefVendor, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.cefProduct, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.cefProductVersion, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.cefSignatureId, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.cefName, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.cefSeverity, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: log.kvMessage, pattern: '(?s:.*)'}

      - kv:
          source: log.kvMessage
          fieldSplit: ' '
          valueSplit: '='

      # Rebuild consumed KV fields so tokens inside quoted messages cannot
      # manufacture an address, identity, action, or rule predicate field.
      - delete:
          fields:
            - log.FTNTFGTapp
            - log.FTNTFGTappcat
            - log.FTNTFGTdevtype
            - log.FTNTFGTdstcity
            - log.FTNTFGTdstcountry
            - log.FTNTFGTdstinetsvc
            - log.FTNTFGTdstintfrole
            - log.FTNTFGTdstmac
            - log.FTNTFGTdstname
            - log.FTNTFGTdstosname
            - log.FTNTFGTdstregion
            - log.FTNTFGTdstreputation
            - log.FTNTFGTduration
            - log.FTNTFGTeventtime
            - log.FTNTFGTeventtype
            - log.FTNTFGTfilehash
            - log.FTNTFGTfilename
            - log.FTNTFGTfilesize
            - log.FTNTFGTgroup
            - log.FTNTFGTlevel
            - log.FTNTFGTlocip
            - log.FTNTFGTlocport
            - log.FTNTFGTlogdesc
            - log.FTNTFGTlogid
            - log.FTNTFGTmastersrcmac
            - log.FTNTFGTosname
            - log.FTNTFGTpolicyid
            - log.FTNTFGTpolicyname
            - log.FTNTFGTpolicytype
            - log.FTNTFGTpoluuid
            - log.FTNTFGTprofile
            - log.FTNTFGTrcvdpkt
            - log.FTNTFGTremip
            - log.FTNTFGTremport
            - log.FTNTFGTrisk
            - log.FTNTFGTsentpkt
            - log.FTNTFGTseverity
            - log.FTNTFGTsrccountry
            - log.FTNTFGTsrchwvendor
            - log.FTNTFGTsrcintfrole
            - log.FTNTFGTsrcmac
            - log.FTNTFGTsrcname
            - log.FTNTFGTsrcserver
            - log.FTNTFGTstatus
            - log.FTNTFGTsubtype
            - log.FTNTFGTtrandisp
            - log.FTNTFGTtz
            - log.FTNTFGTuser
            - log.FTNTFGTutmaction
            - log.FTNTFGTvd
            - log.FTNTFGTverdict
            - log.FTNTFGTvwlid
            - log.act
            - log.action
            - log.agent
            - log.app
            - log.cat
            - log.catdesc
            - log.dest_ip
            - log.dest_port
            - log.deviceExternalId
            - log.deviceInboundInterface
            - log.deviceOutboundInterface
            - log.devid
            - log.devtype
            - log.dlpaction
            - log.dlpprofile
            - log.dpt
            - log.dst
            - log.dstcountry
            - log.dstip
            - log.dstmac
            - log.dstname
            - log.dstosname
            - log.dstport
            - log.dstuser
            - log.duser
            - log.eventtype
            - log.externalId
            - log.filehash
            - log.filename
            - log.group
            - log.hostname
            - log.in
            - log.level
            - log.locip
            - log.logdesc
            - log.logid
            - log.mastersrcmac
            - log.msg
            - log.osname
            - log.out
            - log.policyname
            - log.profile
            - log.proto
            - log.rcvdbyte
            - log.rcvdpkt
            - log.reason
            - log.remip
            - log.risk
            - log.sentbyte
            - log.sentpkt
            - log.severity
            - log.sourceTranslatedAddress
            - log.sourceTranslatedPort
            - log.spt
            - log.src
            - log.src_ip
            - log.src_port
            - log.srccountry
            - log.srchwvendor
            - log.srchwversion
            - log.srcip
            - log.srcmac
