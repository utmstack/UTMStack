            - log.srcport
            - log.srcswversion
            - log.status
            - log.subtype
            - log.type
            - log.unauthusersource
            - log.url
            - log.user
            - log.utmaction
            - log.vd
            - log.verdict
            - log.virus
            - log.virusid
            - log.vwlquality
      # The anchored prefix consumes quoted strings atomically. CEF unquoted
      # values end at the next key or end of input. Skip absent keys cheaply.
      - grok:
          source: log.kvMessage
          patterns:
            - {fieldName: '', pattern: '^(?:"(?:\\.|[^"\\])*"|[^"])*?(?:^|\s)FTNTFGTapp='}
            - {fieldName: log.FTNTFGTapp, pattern: '(?:"(?:\\.|[^"\\])*"|(?:[^"\sA-Za-z][^"\s]*|[A-Za-z][A-Za-z0-9_]*(?:[^"\sA-Za-z0-9_=][^"\s]*)?)(?:\s+(?:[^"=\s\\]|\\.)+)*)(?:\s|$)'}
