# Fortinet firewall module filter, version 3.3.0
# Based in docs and samples provided
# 
# Documentations
# 1- https://docs.fortinet.com/document/fortigate/7.0.4/fortios-log-message-reference/357866/log-message-fields 
# 2- https://docs.fortinet.com/document/fortigate/7.0.4/fortios-log-message-reference/656858/log-id-definitions 
# 
# Implementation
# 1. Parsing the RAW field containing the Fortinet firewall
pipeline:
  - dataTypes:
      - firewall-fortigate-traffic
    steps:

      #Using grok to parse priority if present
      - grok:
          patterns:
            - {fieldName: event.priority, pattern: '^<[0-9]{1,3}>'}
            - {fieldName: event.kvMessage, pattern: '{{.greedy}}'}

      # Vendor disk-format samples do not include a syslog priority prefix.
      - grok:
          source: raw
          patterns:
            - {fieldName: event.kvMessage, pattern: '(?s:.*)'}
          where: '!exists("event.kvMessage")'

      # Extract the CEF extension before KV parsing; header text is not a KV key.
      # This also accepts the space after "CEF:" used by Fortinet's examples.
      - grok:
          source: event.kvMessage
          patterns:
            - {fieldName: '', pattern: '^(?:[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+)?CEF:\s*'}
            - {fieldName: event.cefVersion, pattern: '[0-9]+'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.cefVendor, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.cefProduct, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.cefProductVersion, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.cefSignatureId, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.cefName, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.cefSeverity, pattern: '[^|]*'}
            - {fieldName: '', pattern: '\|'}
            - {fieldName: event.kvMessage, pattern: '(?s:.*)'}

      - kv:
          source: event.kvMessage
          fieldSplit: ' '
          valueSplit: '='

      # Rebuild consumed KV fields so tokens inside quoted messages cannot
      # manufacture an address, identity, action, or rule predicate field.
      - delete:
          fields:
            - event.FTNTFGTapp
            - event.FTNTFGTappcat
            - event.FTNTFGTdevtype
            - event.FTNTFGTdstcity
            - event.FTNTFGTdstcountry
            - event.FTNTFGTdstinetsvc
            - event.FTNTFGTdstintfrole
            - event.FTNTFGTdstmac
            - event.FTNTFGTdstname
            - event.FTNTFGTdstosname
            - event.FTNTFGTdstregion
            - event.FTNTFGTdstreputation
            - event.FTNTFGTduration
            - event.FTNTFGTeventtime
            - event.FTNTFGTeventtype
            - event.FTNTFGTfilehash
            - event.FTNTFGTfilename
            - event.FTNTFGTfilesize
            - event.FTNTFGTgroup
            - event.FTNTFGTlevel
            - event.FTNTFGTlocip
            - event.FTNTFGTlocport
            - event.FTNTFGTlogdesc
            - event.FTNTFGTlogid
            - event.FTNTFGTmastersrcmac
            - event.FTNTFGTosname
            - event.FTNTFGTpolicyid
            - event.FTNTFGTpolicyname
            - event.FTNTFGTpolicytype
            - event.FTNTFGTpoluuid
            - event.FTNTFGTprofile
            - event.FTNTFGTrcvdpkt
            - event.FTNTFGTremip
            - event.FTNTFGTremport
            - event.FTNTFGTrisk
            - event.FTNTFGTsentpkt
            - event.FTNTFGTseverity
            - event.FTNTFGTsrccountry
            - event.FTNTFGTsrchwvendor
            - event.FTNTFGTsrcintfrole
            - event.FTNTFGTsrcmac
            - event.FTNTFGTsrcname
            - event.FTNTFGTsrcserver
            - event.FTNTFGTstatus
            - event.FTNTFGTsubtype
            - event.FTNTFGTtrandisp
            - event.FTNTFGTtz
            - event.FTNTFGTuser
            - event.FTNTFGTutmaction
            - event.FTNTFGTvd
            - event.FTNTFGTverdict
            - event.FTNTFGTvwlid
            - event.act
            - event.action
            - event.agent
            - event.app
            - event.cat
            - event.catdesc
            - event.dest_ip
            - event.dest_port
            - event.deviceExternalId
            - event.deviceInboundInterface
            - event.deviceOutboundInterface
            - event.devid
            - event.devtype
            - event.dlpaction
            - event.dlpprofile
            - event.dpt
            - event.dst
            - event.dstcountry
            - event.dstip
            - event.dstmac
            - event.dstname
            - event.dstosname
            - event.dstport
            - event.dstuser
            - event.duser
            - event.eventtype
            - event.externalId
            - event.filehash
            - event.filename
            - event.group
            - event.hostname
            - event.in
            - event.level
            - event.locip
            - event.logdesc
            - event.logid
            - event.mastersrcmac
            - event.msg
            - event.osname
            - event.out
            - event.policyname
            - event.profile
            - event.proto
            - event.rcvdbyte
            - event.rcvdpkt
            - event.reason
            - event.remip
            - event.risk
            - event.sentbyte
            - event.sentpkt
            - event.severity
            - event.sourceTranslatedAddress
            - event.sourceTranslatedPort
            - event.spt
            - event.src
            - event.src_ip
            - event.src_port
            - event.srccountry
            - event.srchwvendor
            - event.srchwversion
            - event.srcip
            - event.srcmac
            - event.srcname
            - event.srcport
            - event.srcswversion
            - event.status
            - event.subtype
            - event.type
            - event.unauthusersource
            - event.url
            - event.user
            - event.utmaction
            - event.vd
            - event.verdict
            - event.virus
            - event.virusid
            - event.vwlquality
      # The anchored prefix consumes quoted strings atomically. CEF unquoted
      # values end at the next key or end of input. Skip absent keys cheaply.
      - grok:
          source: event.kvMessage
          patterns:
            - {fieldName: '', pattern: '^(?:"(?:\\.|[^"\\])*"|[^"])*?(?:^|\s)FTNTFGTapp='}
            - {fieldName: event.FTNTFGTapp, pattern: '(?:"(?:\\.|[^"\\])*"|(?:[^"\sA-Za-z][^"\s]*|[A-Za-z][A-Za-z0-9_]*(?:[^"\sA-Za-z0-9_=][^"\s]*)?)(?:\s+(?:[^"=\s\\]|\\.)+)*)(?:\s|$)'}
