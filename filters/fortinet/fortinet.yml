      # Removing unused fields
      - delete:
          fields:
            - event.kvMessage
            - event.proto

      # Normalize explicit outcomes; an unknown outcome remains unset.
      # LOG_ID_TRAFFIC_FAIL_CONN (11) denotes failure; action=dns alone does not.
      # A normal close ends an allowed, established session. A reset or timeout
      # can end an attempt that got no usable reply, so it keeps no outcome.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equalsIgnoreCase("action", "accept") || equals("action", "close")
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("event.type", "traffic") && equals("event.logid", "0000000011")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.type", "event") && equals("event.subtype", "system") && equals("event.logid", "0100032001")
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("event.type", "event") && (equals("event.subtype", "system") && equals("event.logid", "0100032002") || equals("event.subtype", "vpn") && (equals("event.logid", "0101039426") || equals("action", "ssl-login-fail")))
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: regexMatch("action", "(?i)^(deny|denied|drop|dropped|block|blocked)$") || regexMatch("event.utmaction", "(?i)^(deny|denied|drop|dropped|block|blocked)$") || regexMatch("event.FTNTFGTutmaction", "(?i)^(deny|denied|drop|dropped|block|blocked)$")
      - add:
          function: string
          params:
            key: connectionStatus
            value: closed
          where: oneOf("action", ["close", "client-rst", "server-rst", "timeout"])

      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: event.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)

      # Ignore input-supplied markers. History counts only equivalent candidates.
      - delete:
          fields: [event.correlationCandidate]
      - add:
          function: string
          params:
            key: event.correlationCandidate.vpnAuthFailure
            value: match
          where: |
            exists("event.devid") && !equals("event.devid", "") && exists("event.vd") && !equals("event.vd", "") &&
            (equals("event.type", "event") && equals("event.subtype", "vpn") &&
            (equals("action", "ssl-login-fail") || equals("event.logid", "0101039426")) &&
            exists("origin.ip"))
      - add:
          function: string
          params:
            key: event.correlationCandidate.ipsCritical
            value: match
          where: |
            exists("event.devid") && !equals("event.devid", "") && exists("event.vd") && !equals("event.vd", "") &&
            (equals("event.type", "utm") && equals("event.subtype", "ips") &&
            oneOf("event.severity", ["critical", "high"]) &&
            equals("actionResult", "denied") && exists("origin.ip"))
      - add:
          function: string
          params:
            key: event.correlationCandidate.dlp
            value: match
          where: |
            equals("event.type", "utm") && equals("event.subtype", "dlp") &&
            exists("event.devid") && !equals("event.devid", "") && exists("event.vd") && !equals("event.vd", "") &&
            (exists("origin.ip") &&
            ((equals("event.subtype", "dlp") && oneOf("action", ["block", "blocked"])) ||
             contains("event.msg", "DLP sensor") ||
             contains("event.msg", "sensitive data detected") ||
             (exists("event.dlpprofile") && equals("event.dlpaction", "block")) ||
             contains("event.msg", "Data pattern matched")))
      - add:
          function: string
          params:
            key: event.correlationCandidate.virusOutbreak
            value: match
          where: |
            exists("event.devid") && !equals("event.devid", "") && exists("event.vd") && !equals("event.vd", "") &&
            (equals("event.type", "utm") && equals("event.subtype", "virus") &&
            equals("event.eventtype", "infected") && equals("actionResult", "denied") &&
            exists("origin.ip"))
