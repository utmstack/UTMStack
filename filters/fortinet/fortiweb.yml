# FortiWeb filter, version 2.4.0
# https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/578387/header-body-fields
# https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/445549/attack
# KV retains other vendor fields. Authoritative fields are re-extracted with quote-aware
# token boundaries: spaces, escaped quotes and embedded key=value text must survive.
# Retain the existing sanitized log.* names so saved searches remain compatible.
# actionResult is only success, failed or denied, or absent.
# Attack logs: Alert means detection/logging, not successful exploitation. Only explicit
# blocking decisions set actionResult=denied. Raw decisions remain in log.action.
# Traffic logs: the HTTP return code decides (2xx success, 401/403 denied, other 4xx/5xx
# failed, 3xx and anything else absent). Administrator event logs: status decides.
# HTTP_url is a request path; HTTP_host is an untrusted header, retained in log.httphost.
# Severity policy: Low -> info, Medium -> warning, High -> error; preserve severitylevel.
patterns:
  fortiwebKVPrefix: ^(?:[A-Za-z0-9_.-]+=(?:"(?:\\.|[^"\\])*"|[^\s"]*)\s+)*?
  fortiwebKVValue: '"(?:\\.|[^"\\])*"|[^\s"]+'
  # The grok step matches each pattern alone, after trimming, and rejects an empty
  # match, so an extracted value must end at a space or the end of the text itself.
  # An empty value or a quoted value followed directly by text is left unset.
  fortiwebKVField: '(?:"(?:\\.|[^"\\])*"|[^\s"A-Za-z][^\s"]*|[A-Za-z][A-Za-z0-9_.-]*(?:[^\sA-Za-z0-9_.="-][^\s"]*)?)(?:\s|$)'
pipeline:
- dataTypes:
  - firewall-fortiweb
  steps:
  # Each grok pattern must match non-empty text, so a line without a priority or
  # syslog header is read by the second step.
  - grok:
      patterns:
      - fieldName: ''
        pattern: ^(?:<[0-9]+>(?:[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ )?|[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ )
      - fieldName: event.kvMessage
        pattern: '[A-Za-z0-9_.-]+=.*'
  - grok:
      patterns:
      - fieldName: event.kvMessage
        pattern: '^[A-Za-z0-9_.-]+=.*'
      where: '!exists("event.kvMessage")'
  - grok:
      patterns:
      - fieldName: ''
        pattern: ^<
      - fieldName: event.priority
        pattern: '[0-9]+'
      - fieldName: ''
        pattern: '>'
  - kv:
      source: event.kvMessage
      fieldSplit: ' '
      valueSplit: '='
  - delete:
      fields:
      - event.type
      - event.subtype
      - event.maintype
      - event.attacktype
      - event.signatureid
      - event.signaturesubclass
      - event.signaturecveid
      - event.severitylevel
      - event.msg
      - event.action
      - event.proto
      - event.src
      - event.dst
      - event.srcport
      - event.dstport
      - event.httpurl
      - event.httphost
      - event.httpmethod
      - event.httpagent
      - event.owasptop10
      - event.owaspapitop10
      - event.triggerpolicy
      - event.srcip
      - event.dstip
      - event.destip
      - event.destport
      - event.fileUploadViolation
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:type)='
      - fieldName: event.type
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:sub_type|subtype)='
      - fieldName: event.subtype
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:main_type)='
      - fieldName: event.maintype
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:attack_type)='
      - fieldName: event.attacktype
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:signature_id)='
      - fieldName: event.signatureid
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:signature_subclass)='
      - fieldName: event.signaturesubclass
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:signature_cve_id)='
      - fieldName: event.signaturecveid
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:severity_level)='
      - fieldName: event.severitylevel
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:msg)='
      - fieldName: event.msg
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:action)='
      - fieldName: event.action
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:proto)='
      - fieldName: event.proto
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:src|src_ip)='
      - fieldName: event.src
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:dst|dst_ip|dest_ip)='
      - fieldName: event.dst
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:src_port|srcport)='
      - fieldName: event.srcport
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:dst_port|dest_port|dstport)='
      - fieldName: event.dstport
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_url))='
      - fieldName: event.httpurl
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_host))='
      - fieldName: event.httphost
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_method))='
      - fieldName: event.httpmethod
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:owasp_top10)='
      - fieldName: event.owasptop10
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_agent))='
      - fieldName: event.httpagent
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:owasp_api_top10)='
      - fieldName: event.owaspapitop10
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:trigger_policy)='
      - fieldName: event.triggerpolicy
        pattern: '{{.fortiwebKVField}}'
  # Some native attack URLs contain bare quotes or a terminal backslash.
  # Recover HTTP metadata only from the final complete native HTTP field block.
  # Require a strict envelope and remainder; never relax security-field parsing.
  # Each pattern is matched alone against the trimmed remainder, so the URL block
  # runs to the final native http_host key and a second step removes that key.
  - grok:
      source: event.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?i:http_url)='
      - fieldName: event.httpUrlBlock
        pattern: '"[^\r\n]*"\s+(?i:http_host)='
      - fieldName: event.httphost
        pattern: '{{.fortiwebKVValue}}'
      - fieldName: ''
        pattern: '^(?i:http_agent)='
      - fieldName: event.httpagent
        pattern: '{{.fortiwebKVValue}}'
      - fieldName: ''
        pattern: '^(?i:http_session_id)=(?:{{.fortiwebKVValue}})\s+msg=(?:{{.fortiwebKVValue}})(?:\s+[A-Za-z0-9_.-]+=(?:{{.fortiwebKVValue}}))*\s*$'
      where: '!exists("event.httpagent")'
  - grok:
      source: event.httpUrlBlock
      patterns:
      - fieldName: event.httpurl
        pattern: '^"[^\r\n]*"'
      - fieldName: ''
        pattern: '^(?i:http_host)=$'
      where: exists("event.httpUrlBlock")
  - trim:
      function: prefix
      substring: '"'
      fields:
      - event.type
      - event.subtype
      - event.maintype
      - event.attacktype
      - event.signatureid
      - event.signaturesubclass
      - event.signaturecveid
      - event.severitylevel
      - event.msg
      - event.action
      - event.proto
      - event.src
      - event.dst
      - event.srcport
      - event.dstport
      - event.httpurl
      - event.httphost
      - event.httpmethod
      - event.httpagent
      - event.owasptop10
      - event.owaspapitop10
      - event.triggerpolicy
  - trim:
      function: suffix
      substring: '"'
      fields:
      - event.type
      - event.subtype
      - event.maintype
      - event.attacktype
      - event.signatureid
      - event.signaturesubclass
      - event.signaturecveid
      - event.severitylevel
      - event.msg
      - event.action
      - event.proto
      - event.src
      - event.dst
      - event.srcport
      - event.dstport
      - event.httpurl
      - event.httphost
      - event.httpmethod
      - event.httpagent
      - event.owasptop10
      - event.owaspapitop10
      - event.triggerpolicy
  # Keep repeated upload-policy correlation tied to classified violations.
  - add:
      function: string
      params:
        key: event.fileUploadViolation
        value: 'true'
      where: >-
        ((regexMatch("event.subtype", "(?i)^(File Upload(?: Restrictions?)?|File Security|Anti.?Virus|AV Detection)$") || regexMatch("event.attacktype", "(?i)^(File Upload(?: Restrictions?)?|File Security|Anti.?Virus|AV Detection)$") || regexMatch("event.signaturesubclass", "(?i)^(File Upload(?: Restrictions?)?|File Security|Anti.?Virus|AV Detection)$")) || ((equalsIgnoreCase("event.maintype", "Signature Detection") || (!exists("event.subtype") && !exists("event.attacktype"))) && regexMatch("event.msg", "(?i)\\b(file upload (?:violation|blocked|restriction)|malicious file|anti-virus|antivirus)\\b")))
  - rename:
      from:
      - event.src
      to: origin.ip
      # Retain an invalid selected alias in its canonical vendor field.
      where: (inCIDR("event.src", "0.0.0.0/0") || inCIDR("event.src", "::/0")) && !inCIDR("event.src", "0.0.0.0/32") && !inCIDR("event.src", "::/128")
  - rename:
      from:
      - event.dst
      to: target.ip
      where: (inCIDR("event.dst", "0.0.0.0/0") || inCIDR("event.dst", "::/0")) && !inCIDR("event.dst", "0.0.0.0/32") && !inCIDR("event.dst", "::/128")
  - rename:
      from:
      - event.srcport
      to: origin.port
  - rename:
      from:
      - event.dstport
      to: target.port
  - grok:
      source: event.action
      patterns:
      - fieldName: action
        pattern: '{{.greedy}}'
      where: exists("event.action")
  - add:
      function: string
      params:
        key: action
        value: http_request
      where: equalsIgnoreCase("event.type", "attack") || equalsIgnoreCase("event.type", "traffic")
  # Traffic logs: the answer FortiWeb returned to the client (http_retcode, spelled
  # HTTP_retcode by older firmware; KV may keep the quotes). Older engines remove "_".
  # The add step overwrites, so the order is success, failed, denied.
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: equalsIgnoreCase("event.type", "traffic") && (regexMatch("event.http_retcode", "^\"?2[0-9]{2}\"?$") || regexMatch("event.HTTP_retcode", "^\"?2[0-9]{2}\"?$") || regexMatch("event.httpretcode", "^\"?2[0-9]{2}\"?$") || regexMatch("event.HTTPretcode", "^\"?2[0-9]{2}\"?$"))
  - add:
      function: string
      params:
        key: actionResult
        value: failed
      where: equalsIgnoreCase("event.type", "traffic") && (regexMatch("event.http_retcode", "^\"?[45][0-9]{2}\"?$") || regexMatch("event.HTTP_retcode", "^\"?[45][0-9]{2}\"?$") || regexMatch("event.httpretcode", "^\"?[45][0-9]{2}\"?$") || regexMatch("event.HTTPretcode", "^\"?[45][0-9]{2}\"?$"))
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: equalsIgnoreCase("event.type", "traffic") && (regexMatch("event.http_retcode", "^\"?40[13]\"?$") || regexMatch("event.HTTP_retcode", "^\"?40[13]\"?$") || regexMatch("event.httpretcode", "^\"?40[13]\"?$") || regexMatch("event.HTTPretcode", "^\"?40[13]\"?$"))
  # Event logs: status is "the result of the action" and user is the administrator or
  # daemon that performed it. Daemon and system notices get no outcome.
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: equalsIgnoreCase("event.type", "event") && exists("event.user") && !regexMatch("event.user", "(?i)^\"?(system|daemon)?\"?$") && regexMatch("event.status", "(?i)^\"?success\"?$")
  - add:
      function: string
      params:
        key: actionResult
        value: failed
      where: equalsIgnoreCase("event.type", "event") && exists("event.user") && !regexMatch("event.user", "(?i)^\"?(system|daemon)?\"?$") && regexMatch("event.status", "(?i)^\"?(failure|failed)\"?$")
  # Blocking decisions win over every value above.
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: regexMatch("event.action", "(?i)^(deny|denied|alert_deny|block|blocked|period_block|return_403_error)$")
  # The administrator's client address is only in msg: "... from GUI(<ip>)" or
  # "... from GUI->HTTPS(<ip>)". Take the last such block (a failed login's user name is
  # client-controlled and comes first), and only on records that carry an outcome.
  - grok:
      source: event.msg
      patterns:
      - fieldName: ''
        pattern: '.*\bfrom [A-Za-z]+(?:->[A-Za-z]+)?\('
      - fieldName: event.adminSrcIp
        pattern: '[0-9A-Fa-f:.]+'
      - fieldName: ''
        pattern: '\).*'
      where: equalsIgnoreCase("event.type", "event") && exists("actionResult") && exists("event.msg")
  - rename:
      from:
      - event.adminSrcIp
      to: origin.ip
      where: exists("event.adminSrcIp") && !exists("origin.ip") && (inCIDR("event.adminSrcIp", "0.0.0.0/0") || inCIDR("event.adminSrcIp", "::/0")) && !inCIDR("event.adminSrcIp", "0.0.0.0/32") && !inCIDR("event.adminSrcIp", "::/128")
  - add:
      function: string
      params:
        key: protocol
        value: tcp
      where: regexMatch("event.proto", "(?i)^(tcp|6)$")
  - add:
      function: string
      params:
        key: protocol
        value: udp
      where: regexMatch("event.proto", "(?i)^(udp|17)$")
  - add:
      function: string
      params:
        key: protocol
        value: icmp
      where: regexMatch("event.proto", "(?i)^(icmp|1)$")
  - add:
      function: string
      params:
        key: protocol
        value: icmpv6
      where: regexMatch("event.proto", "(?i)^(icmpv6|ipv6-icmp|58)$")
  - add:
      function: string
      params:
        key: severity
        value: info
      where: regexMatch("event.severitylevel", "(?i)^(low|information|informational|info)$")
  - add:
      function: string
      params:
        key: severity
        value: warning
      where: regexMatch("event.severitylevel", "(?i)^(medium|warning)$")
  - add:
      function: string
      params:
        key: severity
        value: error
      where: regexMatch("event.severitylevel", "(?i)^(high|error)$")
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: regexMatch("event.severitylevel", "(?i)^(critical)$")
  - add:
      function: string
      params:
        key: severity
        value: debug
      where: regexMatch("event.severitylevel", "(?i)^(debug)$")
  # Relative request paths stay in log.httpurl; SDK path is a file directory.
  - grok:
      source: event.httpurl
      patterns:
      - fieldName: target.url
        pattern: '{{.greedy}}'
      where: regexMatch("event.httpurl", "(?i)^https?://")
  - rename:
      from:
      - origin.port
      to: event.unparsedOriginPort
      where: exists("origin.port") && !(regexMatch("origin.port", "^[0-9]{1,5}$") && lessOrEqual("origin.port",
        65535))
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: origin.ip
        destination: origin.geolocation
      where: exists("origin.ip")
  - rename:
      from:
      - target.port
      to: event.unparsedTargetPort
      where: exists("target.port") && !(regexMatch("target.port", "^[0-9]{1,5}$") && lessOrEqual("target.port",
        65535))
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: target.ip
        destination: target.geolocation
      where: exists("target.ip")
  - delete:
      fields:
      - event.kvMessage
      - event.httpUrlBlock
      - event.adminSrcIp
