# FortiWeb filter, version 2.3.0
# https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/578387/header-body-fields
# https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/445549/attack
# KV retains other vendor fields. Authoritative fields are re-extracted with quote-aware
# token boundaries: spaces, escaped quotes and embedded key=value text must survive.
# Retain the existing sanitized log.* names so saved searches remain compatible.
# Alert means detection/logging, not successful exploitation. Only explicit blocking
# decisions set actionResult=denied. Raw decisions remain in log.action.
# HTTP_url is a request path; HTTP_host is an untrusted header, retained in log.httphost.
# Severity policy: Low -> info, Medium -> warning, High -> error; preserve severitylevel.
patterns:
  fortiwebKVPrefix: ^(?:[A-Za-z0-9_.-]+=(?:"(?:\\.|[^"\\])*"|[^\s"]*)\s+)*?
  fortiwebKVValue: '"(?:\\.|[^"\\])*"|[^\s"]+'
  # The grok step matches each pattern alone, after trimming, and rejects an empty
  # match, so an extracted value must end at a space or the end of the text itself.
  # An empty value or a quoted value followed directly by text is left unset.
  fortiwebKVField: '(?:"(?:\\.|[^"\\])*"|[^\s"A-Za-z][^\s"]*|[A-Za-z][A-Za-z0-9_.-]*(?:[^\sA-Za-z0-9_.="-][^\s"]*)?)(?:\s|$)'
pipeline:
- dataTypes:
  - firewall-fortiweb
  steps:
  # Each grok pattern must match non-empty text, so a line without a priority or
  # syslog header is read by the second step.
  - grok:
      patterns:
      - fieldName: ''
        pattern: ^(?:<[0-9]+>(?:[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ )?|[A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} [^ ]+ )
      - fieldName: log.kvMessage
        pattern: '[A-Za-z0-9_.-]+=.*'
  - grok:
      patterns:
      - fieldName: log.kvMessage
        pattern: '^[A-Za-z0-9_.-]+=.*'
      where: '!exists("log.kvMessage")'
  - grok:
      patterns:
      - fieldName: ''
        pattern: ^<
      - fieldName: log.priority
        pattern: '[0-9]+'
      - fieldName: ''
        pattern: '>'
  - kv:
      source: log.kvMessage
      fieldSplit: ' '
      valueSplit: '='
  - delete:
      fields:
      - log.type
      - log.subtype
      - log.maintype
      - log.attacktype
      - log.signatureid
      - log.signaturesubclass
      - log.signaturecveid
      - log.severitylevel
      - log.msg
      - log.action
      - log.proto
      - log.src
      - log.dst
      - log.srcport
      - log.dstport
      - log.httpurl
      - log.httphost
      - log.httpmethod
      - log.httpagent
      - log.owasptop10
      - log.owaspapitop10
      - log.triggerpolicy
      - log.srcip
      - log.dstip
      - log.destip
      - log.destport
      - log.fileUploadViolation
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:type)='
      - fieldName: log.type
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:sub_type|subtype)='
      - fieldName: log.subtype
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:main_type)='
      - fieldName: log.maintype
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:attack_type)='
      - fieldName: log.attacktype
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:signature_id)='
      - fieldName: log.signatureid
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:signature_subclass)='
      - fieldName: log.signaturesubclass
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:signature_cve_id)='
      - fieldName: log.signaturecveid
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:severity_level)='
      - fieldName: log.severitylevel
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:msg)='
      - fieldName: log.msg
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:action)='
      - fieldName: log.action
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:proto)='
      - fieldName: log.proto
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:src|src_ip)='
      - fieldName: log.src
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:dst|dst_ip|dest_ip)='
      - fieldName: log.dst
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:src_port|srcport)='
      - fieldName: log.srcport
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:dst_port|dest_port|dstport)='
      - fieldName: log.dstport
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_url))='
      - fieldName: log.httpurl
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_host))='
      - fieldName: log.httphost
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_method))='
      - fieldName: log.httpmethod
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:owasp_top10)='
      - fieldName: log.owasptop10
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:(?i:http_agent))='
      - fieldName: log.httpagent
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:owasp_api_top10)='
      - fieldName: log.owaspapitop10
        pattern: '{{.fortiwebKVField}}'
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?:trigger_policy)='
      - fieldName: log.triggerpolicy
        pattern: '{{.fortiwebKVField}}'
  # Some native attack URLs contain bare quotes or a terminal backslash.
  # Recover HTTP metadata only from the final complete native HTTP field block.
  # Require a strict envelope and remainder; never relax security-field parsing.
  # Each pattern is matched alone against the trimmed remainder, so the URL block
  # runs to the final native http_host key and a second step removes that key.
  - grok:
      source: log.kvMessage
      patterns:
      - fieldName: ''
        pattern: '{{.fortiwebKVPrefix}}(?i:http_url)='
      - fieldName: log.httpUrlBlock
        pattern: '"[^\r\n]*"\s+(?i:http_host)='
      - fieldName: log.httphost
        pattern: '{{.fortiwebKVValue}}'
      - fieldName: ''
        pattern: '^(?i:http_agent)='
      - fieldName: log.httpagent
        pattern: '{{.fortiwebKVValue}}'
      - fieldName: ''
        pattern: '^(?i:http_session_id)=(?:{{.fortiwebKVValue}})\s+msg=(?:{{.fortiwebKVValue}})(?:\s+[A-Za-z0-9_.-]+=(?:{{.fortiwebKVValue}}))*\s*$'
      where: '!exists("log.httpagent")'
  - grok:
      source: log.httpUrlBlock
      patterns:
      - fieldName: log.httpurl
        pattern: '^"[^\r\n]*"'
      - fieldName: ''
        pattern: '^(?i:http_host)=$'
      where: exists("log.httpUrlBlock")
  - trim:
      function: prefix
      substring: '"'
      fields:
      - log.type
      - log.subtype
      - log.maintype
      - log.attacktype
      - log.signatureid
      - log.signaturesubclass
      - log.signaturecveid
      - log.severitylevel
      - log.msg
      - log.action
      - log.proto
      - log.src
      - log.dst
      - log.srcport
      - log.dstport
      - log.httpurl
      - log.httphost
      - log.httpmethod
      - log.httpagent
      - log.owasptop10
      - log.owaspapitop10
      - log.triggerpolicy
  - trim:
      function: suffix
      substring: '"'
      fields:
      - log.type
      - log.subtype
      - log.maintype
      - log.attacktype
      - log.signatureid
      - log.signaturesubclass
      - log.signaturecveid
      - log.severitylevel
      - log.msg
      - log.action
      - log.proto
      - log.src
      - log.dst
      - log.srcport
      - log.dstport
      - log.httpurl
      - log.httphost
      - log.httpmethod
      - log.httpagent
      - log.owasptop10
      - log.owaspapitop10
      - log.triggerpolicy
  # Keep repeated upload-policy correlation tied to classified violations.
  - add:
      function: string
      params:
        key: log.fileUploadViolation
        value: 'true'
      where: >-
        ((regexMatch("log.subtype", "(?i)^(File Upload(?: Restrictions?)?|File Security|Anti.?Virus|AV Detection)$") || regexMatch("log.attacktype", "(?i)^(File Upload(?: Restrictions?)?|File Security|Anti.?Virus|AV Detection)$") || regexMatch("log.signaturesubclass", "(?i)^(File Upload(?: Restrictions?)?|File Security|Anti.?Virus|AV Detection)$")) || ((equalsIgnoreCase("log.maintype", "Signature Detection") || (!exists("log.subtype") && !exists("log.attacktype"))) && regexMatch("log.msg", "(?i)\\b(file upload (?:violation|blocked|restriction)|malicious file|anti-virus|antivirus)\\b")))
  - rename:
      from:
      - log.src
      to: origin.ip
      # Retain an invalid selected alias in its canonical vendor field.
      where: (inCIDR("log.src", "0.0.0.0/0") || inCIDR("log.src", "::/0")) && !inCIDR("log.src", "0.0.0.0/32") && !inCIDR("log.src", "::/128")
  - rename:
      from:
      - log.dst
      to: target.ip
      where: (inCIDR("log.dst", "0.0.0.0/0") || inCIDR("log.dst", "::/0")) && !inCIDR("log.dst", "0.0.0.0/32") && !inCIDR("log.dst", "::/128")
  - rename:
      from:
      - log.srcport
      to: origin.port
  - rename:
      from:
      - log.dstport
      to: target.port
  - grok:
      source: log.action
      patterns:
      - fieldName: action
        pattern: '{{.greedy}}'
      where: exists("log.action")
  - add:
      function: string
      params:
        key: action
        value: http_request
      where: equalsIgnoreCase("log.type", "attack") || equalsIgnoreCase("log.type", "traffic")
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: regexMatch("log.action", "(?i)^(deny|denied|alert_deny|block|blocked|period_block)$")
  - add:
      function: string
      params:
        key: protocol
        value: tcp
      where: regexMatch("log.proto", "(?i)^(tcp|6)$")
  - add:
      function: string
      params:
        key: protocol
        value: udp
      where: regexMatch("log.proto", "(?i)^(udp|17)$")
  - add:
      function: string
      params:
        key: protocol
        value: icmp
      where: regexMatch("log.proto", "(?i)^(icmp|1)$")
  - add:
      function: string
      params:
        key: protocol
        value: icmpv6
      where: regexMatch("log.proto", "(?i)^(icmpv6|ipv6-icmp|58)$")
  - add:
      function: string
      params:
        key: severity
        value: info
      where: regexMatch("log.severitylevel", "(?i)^(low|information|informational|info)$")
  - add:
      function: string
      params:
        key: severity
        value: warning
      where: regexMatch("log.severitylevel", "(?i)^(medium|warning)$")
  - add:
      function: string
      params:
        key: severity
        value: error
      where: regexMatch("log.severitylevel", "(?i)^(high|error)$")
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: regexMatch("log.severitylevel", "(?i)^(critical)$")
  - add:
      function: string
      params:
        key: severity
        value: debug
      where: regexMatch("log.severitylevel", "(?i)^(debug)$")
  # Relative request paths stay in log.httpurl; SDK path is a file directory.
  - grok:
      source: log.httpurl
      patterns:
      - fieldName: target.url
        pattern: '{{.greedy}}'
      where: regexMatch("log.httpurl", "(?i)^https?://")
  - rename:
      from:
      - origin.port
      to: log.unparsedOriginPort
      where: exists("origin.port") && !(regexMatch("origin.port", "^[0-9]{1,5}$") && lessOrEqual("origin.port",
        65535))
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: origin.ip
        destination: origin.geolocation
      where: exists("origin.ip")
  - rename:
      from:
      - target.port
      to: log.unparsedTargetPort
      where: exists("target.port") && !(regexMatch("target.port", "^[0-9]{1,5}$") && lessOrEqual("target.port",
        65535))
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: target.ip
        destination: target.geolocation
      where: exists("target.ip")
  - delete:
      fields:
      - log.kvMessage
      - log.httpUrlBlock
