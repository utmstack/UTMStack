            key: event.statusDescription
            value: 'Incorrect password'
          where: equals("event.eventDataStatus", "3221225578")

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Account does not exist'
          where: equals("event.eventDataStatus", "3221225572")

      # Decoding the "eventStatus" field when the event code is 4771 and adding the "statusDescription"
      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Customer database entry has expired'
          where: equals("event.eventDataStatus", "1") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'The server database entry has expired'
          where: equals("event.eventDataStatus", "2") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Requested protocol version not supported'
          where: equals("event.eventDataStatus", "3") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Customer key encrypted in old master key'
          where: equals("event.eventDataStatus", "4") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Server key encrypted with old master key'
          where: equals("event.eventDataStatus", "5") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Client not found in Kerberos database'
          where: equals("event.eventDataStatus", "6") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Server not found in Kerberos database'
          where: equals("event.eventDataStatus", "7") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Multiple principal entries in database'
          where: equals("event.eventDataStatus", "8") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'The client or server has a null key'
          where: equals("event.eventDataStatus", "9") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Ticket not eligible for postdating'
          where: equals("event.eventDataStatus", "10") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Requested start time is later than end time'
          where: equals("event.eventDataStatus", "11") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'KDC policy rejects request'
          where: equals("event.eventDataStatus", "12") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'KDC cannot accommodate requested option'
          where: equals("event.eventDataStatus", "13") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'KDC has no support for encryption type'
          where: equals("event.eventDataStatus", "14") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'KDC has no support for checksum type'
          where: equals("event.eventDataStatus", "15") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'KDC has no support for padata type'
          where: equals("event.eventDataStatus", "16") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'KDC has no support for transited type'
          where: equals("event.eventDataStatus", "17") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Clients credentials have been revoked'
          where: equals("event.eventDataStatus", "18") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Credentials for server have been revoked'
          where: equals("event.eventDataStatus", "19") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'TGT has been revoked'
          where: equals("event.eventDataStatus", "20") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Client not yet valid - try again later'
          where: equals("event.eventDataStatus", "21") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Server not yet valid - try again later'
          where: equals("event.eventDataStatus", "22") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Password has expired'
          where: equals("event.eventDataStatus", "23") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Pre-authentication information was invalid'
          where: equals("event.eventDataStatus", "24") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Additional pre-authentication required'
          where: equals("event.eventDataStatus", "25") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Integrity check on decrypted field failed'
          where: equals("event.eventDataStatus", "31") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Ticket expired'
          where: equals("event.eventDataStatus", "32") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Ticket not yet valid'
          where: equals("event.eventDataStatus", "33") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Request is a replay'
          where: equals("event.eventDataStatus", "34") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'The ticket is not for us'
          where: equals("event.eventDataStatus", "35") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Ticket and authenticator is not match'
          where: equals("event.eventDataStatus", "36") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Clock skew too great'
          where: equals("event.eventDataStatus", "37") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Incorrect net address'
          where: equals("event.eventDataStatus", "38") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Protocol version mismatch'
          where: equals("event.eventDataStatus", "39") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Invalid msg type'
          where: equals("event.eventDataStatus", "40") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Message stream modified'
          where: equals("event.eventDataStatus", "41") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Message out of order'
          where: equals("event.eventDataStatus", "42") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Specified version of key is not available'
          where: equals("event.eventDataStatus", "44") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Service key not available'
          where: equals("event.eventDataStatus", "45") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Mutual authentication failed'
          where: equals("event.eventDataStatus", "46") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Incorrect message direction'
          where: equals("event.eventDataStatus", "47") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Alternative authentication method required'
          where: equals("event.eventDataStatus", "48") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Incorrect sequence number in message'
          where: equals("event.eventDataStatus", "49") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Inappropriate type of checksum in message'
          where: equals("event.eventDataStatus", "50") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Generic error (description in e-text)'
          where: equals("event.eventDataStatus", "60") && equals("event.eventCode", 4771)

      - add:
          function: 'string'
          params:
            key: event.statusDescription
            value: 'Field is too long for this implementation'
          where: equals("event.eventDataStatus", "61") && equals("event.eventCode", 4771)

      # Adding action result
      - delete:
          fields: [actionResult]
      - add:
          function: 'string'
          params:
            key: actionResult
            value: "success"
          where: 'oneOf("event.eventCode", [4624, 4672, 4720, 4722, 4728, 4732, 4756, 4767])'
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: oneOf("event.eventCode", [4725, 4726, 5156])
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: oneOf("event.eventCode", [5150, 5151, 5152, 5153, 5155, 5157, 5159])
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: oneOf("event.eventCode", [4625, 4771])
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: equals("event.eventCode", 4776) && (equals("event.eventDataStatus", 0) || regexMatch("event.eventDataStatus", "(?i)^(0|0x0+)$"))
      - add:
          function: string
          params:
            key: actionResult
            value: failure
          where: equals("event.eventCode", 4776) && exists("event.eventDataStatus") && !(equals("event.eventDataStatus", 0) || regexMatch("event.eventDataStatus", "(?i)^(0|0x0+)$"))

      - delete:
          fields:
            - event.agent
            - event.host
            - event.computer_name
            - event.process
            - event.metadata
            - event.event
            - event.ecs
            - event.log

      # Promote standard fields while retaining vendor fields used by rules.
      - grok:
          source: event.eventDataSubjectUserName
          patterns:
          - fieldName: origin.user
            pattern: '{{.greedy}}'
          where: exists("event.eventDataSubjectUserName") && !oneOf("event.eventDataSubjectUserName",["-",""])
      - grok:
          source: target.user
          patterns:
          - fieldName: origin.user
            pattern: '{{.greedy}}'
          where: oneOf("event.eventCode",[4624,4625,4634,4647,4768,4769,4770,4771,4776]) && exists("target.user") && !oneOf("target.user",["-",""])

      # Normalize source fields to the standard event schema.
      - delete:
          fields:
          - origin.user
          where: oneOf("origin.user",["-",""])
      - delete:
          fields:
          - target.user
          where: oneOf("target.user",["-",""])
      - delete:
          fields:
          - origin.host
          where: oneOf("origin.host",["-",""])
      - delete:
          fields:
          - target.host
          where: oneOf("target.host",["-",""])
      - delete:
          fields:
          - origin.domain
          where: oneOf("origin.domain",["-",""])
      - delete:
          fields:
          - target.domain
          where: oneOf("target.domain",["-",""])

      # Preserve the actor's domain and process path in standard fields too.
      # Logon/Kerberos TargetUserName is the authenticated account; its domain
      # must not be taken from an unrelated SubjectUserName service account.
      - grok:
          source: event.eventDataSubjectDomainName
          patterns:
            - fieldName: origin.domain
              pattern: '{{.greedy}}'
          where: exists("event.eventDataSubjectDomainName") && !oneOf("event.eventDataSubjectDomainName", ["-", ""]) && (!oneOf("event.eventCode", [4624,4625,4634,4647,4768,4769,4770,4771,4776]) || !exists("target.user"))
      - grok:
          source: target.domain
          patterns:
            - fieldName: origin.domain
              pattern: '{{.greedy}}'
          where: oneOf("event.eventCode", [4624,4625,4634,4647,4768,4769,4770,4771,4776]) && exists("target.user") && exists("target.domain")
      - grok:
          source: event.eventDataProcessName
          patterns:
            - fieldName: origin.path
              pattern: '{{.greedy}}'
          where: exists("event.eventDataProcessName") && !oneOf("event.eventDataProcessName", ["-", ""])

      # IpPort is the remote authentication port, not an event status code.
      # Keep the vendor alias for existing searches and only promote real ports.
      - cast:
          fields: [event.eventDataIpPort]
          to: string
      - grok:
          source: event.eventDataIpPort
          patterns:
            - fieldName: origin.port
              pattern: '{{.greedy}}'
          where: regexMatch("event.eventDataIpPort", "^[0-9]+$") && greaterThan("event.eventDataIpPort", 0) && lessOrEqual("event.eventDataIpPort", 65535)
      - cast:
          fields: [origin.port]
          to: int

      # Correlation requires a real identity, never the shared '-' placeholder.
      # Prefer the network source, then workstation, then authenticated account.
      # Rules also scope this derived value by its kind and by dataSource.
      - delete:
          fields: [event.authenticationSource, event.authenticationSourceType, event.authenticationSourceDomain, event.authenticationCandidate]
      - grok:
          source: origin.ip
          patterns:
            - fieldName: event.authenticationSource
              pattern: '{{.greedy}}'
          where: exists("origin.ip")
      - add:
          function: string
          params:
            key: event.authenticationSourceType
            value: ip
          where: exists("event.authenticationSource")
      - grok:
          source: origin.host
          patterns:
            - fieldName: event.authenticationSource
              pattern: '{{.greedy}}'
          where: >-
            !exists("event.authenticationSource") && exists("origin.host")
      - add:
          function: string
          params:
            key: event.authenticationSourceType
            value: host
          where: exists("event.authenticationSource") && !exists("event.authenticationSourceType")
      - grok:
          source: origin.user
          patterns:
            - fieldName: event.authenticationSource
              pattern: '{{.greedy}}'
          where: >-
            !exists("event.authenticationSource") && exists("origin.user") && (exists("origin.domain") || regexMatch("origin.user", "^[^@]+@[^@]+$"))
      - add:
          function: string
          params:
            key: event.authenticationSourceType
            value: user
          where: exists("event.authenticationSource") && !exists("event.authenticationSourceType")

      # User-only identities require a domain or an already qualified UPN. The
      # explicit scope prevents equal usernames from different domains joining.
      - grok:
          source: origin.domain
          patterns:
            - fieldName: event.authenticationSourceDomain
              pattern: '{{.greedy}}'
          where: equals("event.authenticationSourceType", "user") && exists("origin.domain")
      - add:
          function: string
          params:
            key: event.authenticationSourceDomain
            value: qualified-upn
          where: equals("event.authenticationSourceType", "user") && !exists("event.authenticationSourceDomain")
      - add:
          function: string
          params:
            key: event.authenticationSourceDomain
            value: network-source
          where: oneOf("event.authenticationSourceType", ["ip", "host"])

      # Historical searches support exact terms, not a CEL predicate. Mark the
      # same candidates tested by these authentication rules so routine events
      # with the same event ID cannot fill an attack threshold. Keep predicates
      # and markers together; the raw/CEL regression checks assert their parity.
      - add:
          function: string
          params:
            key: event.authenticationCandidate.kerberoastingDetection
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") &&
            (
            equals("event.eventCode", "4769") &&
            equals("event.channel", "Security") &&
            equals("event.eventDataTicketEncryptionType", "23") &&
            !regexMatch("event.eventDataServiceName", "(?i)\\$$") &&
            !equals("event.eventDataServiceName", "krbtgt") &&
            !oneOf("event.eventDataTicketOptions", ["1082195968", "1082130432", "1082130432"]) &&
            exists("event.eventDataServiceName")
            )
      - add:
          function: string
          params:
            key: event.authenticationCandidate.asrepRoastingDetection
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") &&
            (
            equals("event.eventCode", "4768") &&
            equals("event.channel", "Security") &&
            equals("event.eventDataTicketEncryptionType", "23") &&
            equals("event.eventDataPreAuthType", "0") &&
            !regexMatch("target.user", "(?i)\\$$") &&
            exists("target.user")
            )
      - add:
          function: string
          params:
            key: event.authenticationCandidate.silverTicketDetection
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") &&
            (
            equals("event.eventCode", "4769") &&
            equals("event.channel", "Security") &&
            (
              equals("event.eventDataTicketEncryptionType", "23") &&
              !regexMatch("event.eventDataServiceName", "(?i)(krbtgt|\\$$)") &&
              !oneOf("event.eventDataStatus", ["0", "6"]) &&
              exists("event.authenticationSource")
            )
            )
      - add:
          function: string
          params:
            key: event.authenticationCandidate.goldenTicketDetection
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") &&
            (
            (
              equals("event.eventCode", "4769") &&
              equals("event.channel", "Security") &&
              equals("event.eventDataServiceName", "krbtgt") &&
              !equals("event.eventDataStatus", "0") &&
              exists("event.authenticationSource")
            ) ||
            (
              equals("event.eventCode", "4768") &&
              equals("event.channel", "Security") &&
              !oneOf("event.eventDataTicketEncryptionType", ["18", "17"]) &&
              exists("target.user") &&
              !regexMatch("target.user", "(?i)\\$$")
            ) ||
            (
              equals("event.eventCode", "4672") &&
              equals("event.channel", "Security") &&
              contains("event.eventDataPrivilegeList", "SeTcbPrivilege") &&
              !regexMatch("event.eventDataSubjectUserName", "(?i)^(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)$") &&
              !regexMatch("event.eventDataSubjectUserName", "(?i)\\$$")
            )
            )
      - add:
          function: string
          params:
            key: event.authenticationCandidate.adfsAuthenticationAnomalies
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") &&
            (
            equals("event.providerName", "AD FS") && (equals("event.eventCode", "342") || equals("event.eventCode", "516")) && contains("event.message", "token validation failed")
            )
      - add:
          function: string
          params:
            key: event.authenticationCandidate.bruteforceAttack
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") && exists("target.user") &&
            (
            equals("event.eventCode", 4625)
            )
      - add:
          function: string
          params:
            key: event.authenticationCandidate.bruteforceMultipleLogonFailureFollowedBySuccess
            value: match
          where: |
            !oneOf("dataSource", ["", "unknown"]) &&
            exists("event.authenticationSource") && exists("event.authenticationSourceType") && exists("event.authenticationSourceDomain") && exists("target.user") &&
            (
            equals("event.eventCode", 4624)
            )

      # Copy event.eventName to the canonical action field (AWS idiom:
      # aws.yml grok-copy). The copy — not a rename — preserves
      # event.eventName for the file-management module's "Event name" column.
      # The dashboard "Top events" chart aggregates on action.
      - grok:
          source: event.eventName
          patterns:
            - fieldName: action
              pattern: (?s)^.+$
          where: exists("event.eventName")
