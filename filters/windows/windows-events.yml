# Windows_Agent filter, version 3.2.0
# Based on winlogbeat fields, reference [8.15]
# See https://www.elastic.co/guide/en/beats/winlogbeat/current/exported-fields-winlog.html

pipeline:
  - dataTypes:
      - wineventlog
    steps:
      - json:
          source: raw

      # Native agent and Winlogbeat aliases. The event-producing computer is the
      # target host; it must not overwrite the remote WorkstationName origin.
      - rename:
          from: [event.computer, event.computer_name, event.computername]
          to: target.host
      - rename:
          from: [event.timestamp, event.timeCreated]
          to: deviceTime

      # Renaming useful fields
      - rename:
          from:
            - event.provider_guid
          to: event.providerGuid

      - rename:
          from:
            - event.data.PrivilegeList
          to: event.eventDataPrivilegeList

      - rename:
          from:
            - event.data.ServiceName
          to: event.eventDataServiceName

      - rename:
          from:
            - event.data.SubjectDomainName
          to: event.eventDataSubjectDomainName

      - rename:
          from:
            - event.data.SubjectLogonId
          to: event.eventDataSubjectLogonId

      - rename:
          from:
            - event.data.SubjectUserName
          to: event.eventDataSubjectUserName

      - rename:
          from:
            - event.data.SubjectUserSid
          to: event.eventDataSubjectUserSid

      - rename:
          from:
            - event.data.SubStatus
          to: event.eventDataSubStatus

      - rename:
          from:
            - event.data.PrivilegeList
          to: event.eventDataPrivilegeList

      - rename:
          from:
            - event.data.ClientProcessId
          to: event.eventDataClientProcessId

      - rename:
          from:
            - event.data.Flags
          to: event.eventDataFlags

      - rename:
          from:
            - event.data.Identity
          to: event.eventDataIdentity

      - rename:
          from:
            - event.data.ProcessCreationTime
          to: event.eventDataProcessCreationTime

      - rename:
          from:
            - event.id
          to: event.eventId

      - rename:
          from:
            - event.data.Resource
          to: event.eventDataResource

      - rename:
          from:
            - event.data.ReturnCode
          to: event.eventDataReturnCode

      - rename:
          from:
            - event.data.Resource
          to: event.eventDataResource

      - rename:
          from:
            - event.data.Schema
          to: event.eventDataSchema

      - rename:
          from:
            - event.data.SchemaFriendlyName
          to: event.eventDataSchemaFriendlyName

      - rename:
          from:
            - event.data.Resource
          to: event.eventDataResource

      - rename:
          from:
            - event.data.AuthenticationPackageName
          to: event.eventDataAuthenticationPackageName

      - rename:
          from:
            - event.data.ElevatedToken
          to: event.eventDataElevatedToken

      - rename:
          from:
            - event.data.ImpersonationLevel
          to: event.eventDataImpersonationLevel

      - rename:
          from:
            - event.wineventlog.data.FailureReason
          to: event.eventDataFailureReason

      - rename:
          from:
            - event.data.IpAddress
          to: origin.ip
          where: (inCIDR("event.data.IpAddress", "0.0.0.0/0") || inCIDR("event.data.IpAddress", "::/0")) && !inCIDR("event.data.IpAddress", "0.0.0.0/32") && !inCIDR("event.data.IpAddress", "::/128")

      # WFP 5156 records an allowed connection; 5152/5157 record a blocked
      # packet/connection. Preserve the vendor addresses before promoting the
      # validated endpoints. A bind/listen event is not an allowed connection.
      - rename:
          from: [event.data.SourceAddress]
          to: event.eventDataSourceAddress
      - rename:
          from: [event.data.DestAddress]
          to: event.eventDataDestAddress
      - rename:
          from: [event.data.SourcePort]
          to: event.eventDataSourcePort
      - rename:
          from: [event.data.DestPort]
          to: event.eventDataDestPort
      - rename:
          from: [event.data.Direction]
          to: event.eventDataDirection
      - rename:
          from: [event.data.Protocol]
          to: event.eventDataProtocol
      - rename:
          from: [event.data.Application]
          to: event.eventDataApplication

      # In 5152, 5156 and 5157 the Source fields hold the side that sent or
      # started the traffic and the Destination fields the side that received
      # it, in both directions. Production records confirm this for inbound
      # traffic: remote senders appear in SourceAddress with ephemeral ports,
      # and local service ports (22, 443, 445, 7680, 10050) in DestPort, even
      # though Microsoft's 5152/5157 field text calls SourceAddress local.
      # Blocked records need a known direction before their endpoints are used.
      - grok:
          source: event.eventDataSourceAddress
          patterns:
          - fieldName: origin.ip
            pattern: (?s)^.+$
          where: >-
            (equals("event.eventCode",5156) ||
             (oneOf("event.eventCode",[5152,5157]) && oneOf("event.eventDataDirection",["%%14592","%%14593"]))) &&
            (inCIDR("event.eventDataSourceAddress","0.0.0.0/0") || inCIDR("event.eventDataSourceAddress","::/0")) &&
            !inCIDR("event.eventDataSourceAddress","0.0.0.0/32") && !inCIDR("event.eventDataSourceAddress","::/128") &&
            !exists("origin.ip")
      - grok:
          source: event.eventDataDestAddress
          patterns:
          - fieldName: target.ip
            pattern: (?s)^.+$
          where: >-
            (equals("event.eventCode",5156) ||
             (oneOf("event.eventCode",[5152,5157]) && oneOf("event.eventDataDirection",["%%14592","%%14593"]))) &&
            (inCIDR("event.eventDataDestAddress","0.0.0.0/0") || inCIDR("event.eventDataDestAddress","::/0")) &&
            !inCIDR("event.eventDataDestAddress","0.0.0.0/32") && !inCIDR("event.eventDataDestAddress","::/128") &&
            !exists("target.ip")

      - rename:
          from:
            - event.data.IpPort
          to: event.eventDataIpPort

      - rename:
          from:
            - event.data.Resource
          to: event.eventDataResource

      - rename:
          from:
            - event.data.KeyLength
          to: event.eventDataKeyLength

      - rename:
          from:
            - event.data.LmPackageName
          to: event.eventDataLmPackageName

      - rename:
          from:
            - event.data.LogonProcessName
          to: event.eventDataLogonProcessName

      - rename:
          from:
            - event.data.LogonType
          to: event.eventDataLogonType
      - rename:
          from:
            - event.data.Resource
          to: event.eventDataResource

      - rename:
          from:
            - event.data.ProcessId
          to: event.eventDataProcessId

      - rename:
          from:
            - event.data.ProcessName
          to: event.eventDataProcessName

      # Object-access field COPIED to canonical origin so the
      # file-management module can filter on typed (non-flattened) fields.
      # Copy, not rename: Windows rules read event.eventDataProcessName
      # directly, so the bag key must survive.
      - grok:
          source: event.eventDataProcessName
          patterns:
            - fieldName: origin.file
              pattern: (?s)^.+$
          where: exists("event.eventDataProcessName")

      - rename:
          from:
            - event.data.RestrictedAdminMode
          to: event.eventDataRestrictedAdminMode

      - rename:
          from:
            - event.data.TargetDomainName
          to: target.domain

      - rename:
          from:
            - event.data.TargetLinkedLogonId
          to: event.eventDataTargetLinkedLogonId

      - rename:
          from:
            - event.data.Resource
          to: event.eventDataResource

      - rename:
          from:
            - event.data.TargetLogonId
          to: event.eventDataTargetLogonId

      - rename:
          from:
            - event.data.TargetOutboundDomainName
          to: event.eventDataTargetOutboundDomainName

      - rename:
          from:
            - event.data.TargetOutboundUserName
          to: event.eventDataTargetOutboundUserName

      - rename:
          from:
            - event.data.TargetUserName
          to: target.user

      - rename:
          from:
            - event.data.TargetUserSid
          to: event.eventDataTargetUserSid

      - rename:
          from:
            - event.data.TargetSid
          to: event.eventDataTargetSid

      - rename:
          from:
            - event.data.CallerProcessId
          to: event.eventDataCallerProcessId

      - rename:
          from:
            - event.data.CallerProcessName
          to: event.eventDataCallerProcessName

      - rename:
          from:
            - event.data.TransmittedServices
          to: event.eventDataTransmittedServices

      - rename:
          from:
            - event.data.VirtualAccount
          to: event.eventDataVirtualAccount

      - rename:
          from:
            - event.data.WorkstationName
            - event.data.Workstation
          to: origin.host

      - rename:
          from:
            - event.data.FailureReason
          to: event.eventDataFailureReason

      - rename:
          from:
            - event.data.AccessMask
          to: event.eventDataAccessMask

      - rename:
          from:
            - event.data.Status
          to: event.eventDataStatus

      - rename:
          from:
            - event.process.thread
          to: event.processThread

      - rename:
          from:
            - event.execution.ThreadID
          to: event.processThreadId

      - rename:
          from:
            - event.process.pid
          to: event.processPid

      - rename:
          from:
            - event.provider_name
          to: event.providerName

      - rename:
          from:
            - event.record_id
            - event.recordid
          to: event.recordId

      - rename:
          from:
            - event.task
          to: event.task

      - rename:
          from:
            - event.event.code
          to: event.eventCode

      - rename:
          from:
            - event.event.kind
          to: event.eventKind

      - rename:
          from:
            - event.event.provider
          to: event.event.provider

      - rename:
          from:
            - event.level
          to: event.severityLabel

      - rename:
          from:
            - event.api
          to: event.api

      - rename:
          from:
            - event.ecs.version
          to: event.ecsVersion

      - rename:
          from:
            - event.correlation.ActivityID
          to: event.activityId

      - rename:
          from:
            - event.data.LogonGuid
          to: event.logonGuid

      - rename:
          from:
            - event.execution.ProcessID
          to: event.executionProcessID

      - rename:
          from:
            - event.data.ObjectType
          to: event.eventDataObjectType

      - rename:
          from:
            - event.data.OperationType
          to: event.eventDataOperationType

      - rename:
          from:
            - event.data.TicketEncryptionType
          to: event.eventDataTicketEncryptionType

      - rename:
          from:
            - event.data.PreAuthType
          to: event.eventDataPreAuthType

      - rename:
          from:
            - event.data.TicketOptions
          to: event.eventDataTicketOptions

      - rename:
          from:
            - event.data.ProcessPath
          to: event.eventDataProcessPath

      - rename:
          from:
            - event.data.ImagePath
          to: event.eventDataImagePath

      - rename:
          from:
            - event.data.ServiceType
          to: event.eventDataServiceType

      - rename:
          from:
            - event.data.StartType
          to: event.eventDataStartType

      - rename:
          from:
            - event.data.FileName
          to: event.eventDataFileName

      - rename:
          from:
            - event.data.LinkName
          to: event.eventDataLinkName

      - rename:
          from:
            - event.data.AccessList
          to: event.eventDataAccessList

      - rename:
          from:
            - event.data.HandleId
          to: event.eventDataHandleId

      - rename:
          from:
            - event.data.ObjectName
          to: event.eventDataObjectName

      # Object-access field COPIED to canonical target so the
      # file-management module can filter on typed (non-flattened) fields.
      # Copy, not rename: Windows rules read event.eventDataObjectName
      # directly, so the bag key must survive.
      - grok:
          source: event.eventDataObjectName
          patterns:
            - fieldName: target.path
              pattern: (?s)^.+$
          where: exists("event.eventDataObjectName")

      - rename:
          from:
            - event.data.ResourceAttributes
          to: event.eventDataResourceAttributes

      - rename:
          from:
            - event.data.OldSd
          to: event.eventDataOldSd

      - rename:
          from:
            - event.data.NewSd
          to: event.eventDataNewSd

      - rename:
          from:
            - event.data.ObjectServer
          to: event.eventDataObjectServer

      - rename:
          from:
            - event.data.TransactionId
          to: event.eventDataTransactionId

      - rename:
          from:
            - event.data.ScriptBlockText
          to: event.eventDataScriptBlockText

      - rename:
          from:
            - event.data.MessageNumber
          to: event.eventDataMessageNumber

      - rename:
          from:
            - event.data.MessageTotal
          to: event.eventDataMessageTotal

      - rename:
          from:
            - event.data.ScriptBlockId
          to: event.eventDataScriptBlockId

      - cast:
          to: "int"
          fields:
            - event.eventCode
    
      - trim:
          function: prefix
          substring: '{'
          fields:
            - event.providerGuid
            - event.activityId
            - event.logonGuid
            - event.eventDataSchema
            - event.processThread
            - event.eventDataTransactionId

      - trim:
          function: suffix
          substring: '}'
          fields:
            - event.providerGuid
            - event.activityId
            - event.logonGuid
            - event.eventDataSchema
            - event.processThread
            - event.eventDataTransactionId

      # Drop unnecessary events
      - drop:
          where: "oneOf('event.eventCode', [0, 1, 43, 44, 1040, 1042, 1105, 1500, 1501, 4608, 4609, 4614, 4615, 4616, 4626, 4627, 4650, 4651, 4652, 4653, 4654, 4655, 4659, 4665, 4666, 4667, 4668, 4689, 4696, 4709, 4710, 4711, 4712, 4778, 4779, 4826, 4864, 4866, 4898, 4899, 4902, 4904, 4905, 4906, 4909, 4910, 4911, 4928, 4929, 4930, 4931, 4932, 4933, 4934, 4935, 4936, 4937, 4944, 4945, 4951, 4952, 4953, 4957, 4958, 4965, 4979, 4980, 4981, 4982, 4983, 4984, 4985, 5024, 5027, 5028, 5029, 5033, 5034, 5035, 5038, 5039, 5051, 5056, 5057, 5058, 5059, 5060, 5061, 5062, 5063, 5064, 5065, 5066, 5067, 5068, 5069, 5070, 5071, 5120, 5121, 5122, 5123, 5125, 5126, 5127, 5137, 5138, 5139, 5141, 5145, 5168, 5169, 5170, 5376, 5377, 5378, 5379, 5380, 5381, 5440, 5441, 5442, 5443, 5444, 5446, 5450, 5451, 5452, 5456, 5457, 5458, 5459, 5460, 5461, 5462, 5463, 5464, 5465, 5466, 5467, 5468, 5471, 5472, 5473, 5474, 5477, 5478, 5712, 5888, 5889, 5890, 6145, 6274, 6275, 6281, 6400, 6401, 6402, 6403, 6405, 6406, 6407, 6408, 6409, 6410, 6417, 6418, 6423, 6424, 7040, 8191, 10000, 10010, 16384, 16394, 24578, 24579, 24581, 24582, 24583, 24584, 24586, 24588, 24592, 24593, 24594, 24595, 24621])"

      # Decoding event code
      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A product has been installed successfully'
          where: equals("event.eventCode", 1033)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'The event logging service has shut down'
          where: equals("event.eventCode", 1100)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'Audit events have been dropped by the transport.'
          where: equals("event.eventCode", 1101)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'The audit log was cleared'
          where: equals("event.eventCode", 1102)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'The security Log is now full'
          where: equals("event.eventCode", 1104)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'The event logging service encountered an error'
          where: equals("event.eventCode", 1108)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A PowerShell script block has been executed and the script text has been logged to the event viewer.'
          where: equals("event.eventCode", 4104)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'An authentication package has been loaded by the Local Security Authority'
          where: equals("event.eventCode", 4610)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A trusted logon process has been registered with the Local Security Authority'
          where: equals("event.eventCode", 4611)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'Internal resources allocated for the queuing of audit messages have been exhausted: leading to the loss of some audits.'
          where: equals("event.eventCode", 4612)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A monitored security event pattern has occurred'
          where: equals("event.eventCode", 4618)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'Administrator recovered system from CrashOnAuditFail'
          where: equals("event.eventCode", 4621)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A security package has been loaded by the Local Security Authority.'
          where: equals("event.eventCode", 4622)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'An account was successfully logged on'
          where: equals("event.eventCode", 4624)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'An account failed to log on'
          where: equals("event.eventCode", 4625)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'An account was logged off'
          where: equals("event.eventCode", 4634)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'IKE DoS-prevention mode started'
          where: equals("event.eventCode", 4646)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'User initiated logoff'
          where: equals("event.eventCode", 4647)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A logon was attempted using explicit credentials'
          where: equals("event.eventCode", 4648)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A replay attack was detected'
          where: equals("event.eventCode", 4649)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A handle to an object was requested'
          where: equals("event.eventCode", 4656)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A registry value was modified'
          where: equals("event.eventCode", 4657)

      - add:
          function: 'string'
