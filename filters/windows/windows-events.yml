      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A token right was adjusted'
          where: equals("event.eventCode", 4703)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A user right was assigned'
          where: equals("event.eventCode", 4704)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A user right was removed'
          where: equals("event.eventCode", 4705)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A new trust was created to a domain'
          where: equals("event.eventCode", 4706)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A trust to a domain was removed'
          where: equals("event.eventCode", 4707)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'Kerberos policy was changed'
          where: equals("event.eventCode", 4713)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'Encrypted data recovery policy was changed'
          where: equals("event.eventCode", 4714)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'The audit policy (SACL) on an object was changed'
          where: equals("event.eventCode", 4715)

