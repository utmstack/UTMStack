            key: event.eventName
            value: 'The handle to an object was closed'
          where: equals("event.eventCode", 4658)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'An object was deleted'
          where: equals("event.eventCode", 4660)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'A handle to an object was requested'
          where: equals("event.eventCode", 4661)

      - add:
          function: 'string'
          params:
            key: event.eventName
            value: 'An operation was performed on an object'
