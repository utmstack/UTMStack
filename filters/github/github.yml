          to: event.repositoryCollaboratorsUrl

      - rename:
          from:
            - event.repository.comments_url
          to: event.repositoryCommentsUrl

      - rename:
          from:
            - event.repository.commits_url
          to: event.repositoryCommitsUrl

      - rename:
          from:
            - event.repository.compare_url
          to: event.repositoryCompareUrl

      - rename:
          from:
            - event.repository.contents_url
          to: event.repositoryContentsUrl

      - rename:
          from:
            - event.repository.contributors_url
          to: event.repositoryContributorsUrl

      - rename:
          from:
