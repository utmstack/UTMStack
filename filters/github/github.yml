          to: event.repositorySshUrl

      - rename:
          from:
            - event.repository.stargazers
          to: event.repositoryStargazers

      - rename:
          from:
            - event.repository.stargazers_url
          to: event.repositoryStargazersUrl

      - rename:
          from:
            - event.repository.statuses_url
          to: event.repositoryStatusesUrl

      - rename:
          from:
            - event.repository.subscribers_url
          to: event.repositorySubscribersUrl

      - rename:
          from:
            - event.repository.subscription_url
          to: event.repositorySubscriptionUrl

      - rename:
          from:
            - event.repository.svn_url
          to: event.repositorySvnUrl

      - rename:
          from:
            - event.repository.tags_url
          to: event.repositoryTagsUrl

      - rename:
          from:
            - event.repository.teams_url
          to: event.repositoryTeamsUrl

      - rename:
          from:
            - event.repository.topics
          to: event.repositoryTopics

      - rename:
          from:
            - event.repository.trees_url
          to: event.repositoryTreesUrl

      - rename:
          from:
            - event.repository.updated_at
          to: event.repositoryUpdatedAt

      - rename:
          from:
            - event.repository.url
          to: event.repositoryUrl

      - rename:
          from:
            - event.repository.visibility
          to: event.repositoryVisibility

      - rename:
          from:
            - event.repository.watchers
          to: event.repositoryWatchers

      - rename:
          from:
            - event.repository.web_commit_signoff_required
          to: event.repositoryWebCommitSignoffRequired

      # Parsing sender section
      - rename:
          from:
            - event.sender.events_url
          to: event.senderEventsUrl

      - rename:
          from:
            - event.sender.followers_url
          to: event.senderFllowersUrl

      - rename:
          from:
            - event.sender.following_url
          to: event.senderFollowingUrl

      - rename:
          from:
            - event.sender.gists_url
          to: event.senderGistsUrl

      - rename:
          from:
            - event.sender.html_url
          to: event.senderHtmlUrl

      - rename:
          from:
            - event.sender.id
          to: event.senderId

      - rename:
          from:
            - event.sender.login
          to: event.senderLogin

      - rename:
          from:
            - event.sender.node_id
          to: event.senderNodeId

      - rename:
          from:
            - event.sender.organizations_url
          to: event.senderOrganizationsUrl

      - rename:
          from:
            - event.sender.received_events_url
          to: event.senderReceivedEventsUrl

      - rename:
          from:
            - event.sender.repos_url
          to: event.senderReposUrl

      - rename:
          from:
            - event.sender.site_admin
          to: event.senderSiteAdmin

      - rename:
          from:
            - event.sender.starred_url
          to: event.senderStarredUrl

      - rename:
          from:
            - event.sender.subscriptions_url
          to: event.senderSubscriptionsUrl

      - rename:
          from:
            - event.sender.type
          to: event.senderType

      - rename:
          from:
            - event.sender.url
          to: event.senderUrl

      - rename:
          from:
            - event.sender.user_view_type
          to: event.senderUserViewType

      # Adding action result
      # A completed run's conclusion is its final result: action_required
      # waits for approval, and cancelled, neutral, skipped and stale are
      # neither success nor failure, so they set no outcome.
      - rename:
          from:
            - event.workflow_run.conclusion
          to: event.conclusion
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'equals("event.conclusion", "success")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failure"
          where: 'oneOf("event.conclusion", ["failure", "timed_out", "startup_failure"])'

      # Removing unused fields
      - delete:
          fields:
            - event.repository.forks_count
            - event.repository.open_issues_count
            - event.repository.owner.avatar_url
            - event.repository.owner.gravatar_id
            - event.repository.stargazers_count
            - event.repository.watchers_count
            - event.sender.avatar_url
            - event.sender.gravatar_id
            - event.sender
            - event.pusher
            - event.repository.owner
            - event.repository