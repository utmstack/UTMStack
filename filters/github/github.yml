          to: event.repositoryDisabled

      - rename:
          from:
            - event.repository.downloads_url
          to: event.repositoryDownloadsUrl

      - rename:
          from:
            - event.repository.events_url
          to: event.repositoryEventsUrl

      - rename:
          from:
            - event.repository.fork
          to: event.repositoryFork

      - rename:
          from:
            - event.repository.forks
          to: event.repositoryForks

      - rename:
          from:
            - event.repository.forks_url
          to: event.repositoryForksUrl

      - rename:
          from:
            - event.repository.full_name
          to: event.repositoryFullName

      - rename:
          from:
            - event.repository.git_commits_url
          to: event.repositoryGitCommitsUrl

      - rename:
          from:
            - event.repository.git_refs_url
          to: event.repositoryGitRefsUrl

      - rename:
          from:
            - event.repository.git_tags_url
          to: event.repositoryGitTagsUrl

      - rename:
          from:
            - event.repository.git_url
          to: event.repositoryGitUrl

      - rename:
          from:
            - event.repository.has_discussions
          to: event.repositoryHasDiscussions

      - rename:
          from:
            - event.repository.has_downloads
          to: event.repositoryHasDownloads

      - rename:
          from:
