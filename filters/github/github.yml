          to: event.repositoryHasIssues

      - rename:
          from:
            - event.repository.has_pages
          to: event.repositoryHasPages

      - rename:
          from:
            - event.repository.has_projects
          to: event.repositoryHasProjects

      - rename:
          from:
            - event.repository.has_wiki
          to: event.repositoryHasWiki

      - rename:
          from:
            - event.repository.homepage
          to: event.repositoryHomepage

      - rename:
          from:
            - event.repository.hooks_url
          to: event.repositoryHooksUrl

      - rename:
          from:
            - event.repository.html_url
          to: event.repositoryHtmlUrl

      - rename:
          from:
            - event.repository.id
          to: event.repositoryId

      - rename:
          from:
            - event.repository.is_template
          to: event.repositoryIsTemplate

      - rename:
          from:
            - event.repository.issue_comment_url
          to: event.repositoryIssueCommentUrl

      - rename:
          from:
            - event.repository.issue_events_url
          to: event.repositoryIssueEventsUrl

      - rename:
          from:
            - event.repository.issues_url
          to: event.repositoryIssuesUrl

      - rename:
          from:
            - event.repository.keys_url
          to: event.repositoryKeysUrl

      - rename:
          from:
            - event.repository.labels_url
          to: event.repositoryLabelsUrl

      - rename:
          from:
            - event.repository.language
          to: event.repositoryLanguage

      - rename:
          from:
            - event.repository.languages_url
          to: event.repositoryLanguagesUrl

      - rename:
          from:
            - event.repository.license
          to: event.repositoryLicense

      - rename:
          from:
            - event.repository.master_branch
          to: event.repositoryMasterBranch

      - rename:
          from:
            - event.repository.merges_url
          to: event.repositoryMergesUrl

      - rename:
          from:
