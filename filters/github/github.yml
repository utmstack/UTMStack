# Github filter
# Based on https://docs.github.com/es/developers/webhooks-and-events/webhooks/webhook-events-and-payloads (october 2024)
# and real logs comming from github integration 
# Support json format

pipeline:
  - dataTypes:
      - github
    steps:
      - json:
          source: raw

      - rename:
          from:
            - event.base_ref
          to: event.baseRef

      # Parsing headCommit section
      - rename:
          from:
            - event.head_commit.added
          to: event.headCommitAdded

      - rename:
          from:
            - event.head_commit.author.email
          to: event.headCommitAuthorEmail

      - rename:
          from:
            - event.head_commit.author.name
          to: event.headCommitAuthorName

      - rename:
          from:
            - event.head_commit.committer.email
          to: event.headCommitCommitterEmail

      - rename:
          from:
            - event.head_commit.author.username
          to: event.headCommitAuthorUsername

      - rename:
          from:
            - event.head_commit.committer.name
          to: event.headCommitCommitterName

      - rename:
          from:
            - event.head_commit.committer.username
          to: event.headCommitCommitterUsername

      - rename:
          from:
            - event.head_commit.distinct
          to: event.headCommitDistinct

      - rename:
          from:
            - event.head_commit.id
          to: event.headCommitId

      - rename:
          from:
            - event.head_commit.message
          to: event.headCommitMessage

      - rename:
          from:
            - event.head_commit.modified.0
          to: event.headCommitModified

      - rename:
          from:
            - event.head_commit.removed
          to: event.headCommitRemoved

      - rename:
          from:
            - event.head_commit.timestamp
          to: event.headCommitTimesTamp

      - rename:
          from:
            - event.head_commit.tree_id
          to: event.headCommitTreeId

      - rename:
          from:
            - event.head_commit.url
          to: event.headCommitUrl

      # Parsing pusher section
      - rename:
          from:
            - event.pusher.email
          to: event.pusherEmail

      - rename:
          from:
            - event.pusher.name
          to: event.pusherName

      # Parsing repository section
      - rename:
          from:
            - event.repository.allow_forking
          to: event.repositoryAllowForking

      - rename:
          from:
            - event.repository.archive_url
          to: event.repositoryArchiveUrl

      - rename:
          from:
            - event.repository.archived
          to: event.repositoryArchived

      - rename:
          from:
            - event.repository.assignees_url
          to: event.repositoryAssigneesUrl

      - rename:
          from:
            - event.repository.blobs_url
          to: event.repositoryBlobsUrl

      - rename:
          from:
            - event.repository.branches_url
          to: event.repositoryBranchesUrl

      - rename:
          from:
            - event.repository.clone_url
          to: event.repositoryCloneUrl

      - rename:
          from:
