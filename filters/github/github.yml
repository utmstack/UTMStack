          to: event.repositoryMilestonesUrl

      - rename:
          from:
            - event.repository.mirror_url
          to: event.repositoryMirrorUrl

      - rename:
          from:
            - event.repository.name
          to: event.repositoryName

      - rename:
          from:
            - event.repository.node_id
          to: event.repositoryNodeId

      - rename:
          from:
            - event.repository.notifications_url
          to: event.repositoryNtificationsUrl

      - rename:
          from:
            - event.repository.open_issues
          to: event.repositoryOpenIssues

      - rename:
          from:
            - event.repository.owner.email
          to: event.repositoryOwnerEmail

      - rename:
          from:
            - event.repository.owner.events_url
          to: event.repositoryOwnerEventsUrl

      - rename:
          from:
            - event.repository.owner.followers_url
          to: event.repositoryOwnerFollowersUrl

      - rename:
          from:
            - event.repository.owner.following_url
          to: event.repositoryOwnerFollowingUrl

      - rename:
          from:
            - event.repository.owner.gists_url
          to: event.repositoryOwnerGistsUrl

      - rename:
          from:
            - event.repository.owner.html_url
          to: event.repositoryOwnerHtmlUrl

      - rename:
          from:
            - event.repository.owner.id
          to: event.repositoryOwnerId

      - rename:
          from:
            - event.repository.owner.login
          to: event.repositoryOwnerLogin

      - rename:
          from:
            - event.repository.owner.name
          to: event.repositoryOwnerName

      - rename:
          from:
            - event.repository.owner.node_id
          to: event.repositoryOwnerNodeId

      - rename:
          from:
            - event.repository.owner.organizations_url
          to: event.repositoryOwnerOrganizationsUrl

      - rename:
          from:
            - event.repository.owner.received_events_url
          to: event.repositoryOwnerReceivedEventsUrl

      - rename:
          from:
            - event.repository.owner.repos_url
          to: event.repositoryOwnerReposUrl

      - rename:
          from:
            - event.repository.owner.site_admin
          to: event.repositoryOwnerSiteAdmin

      - rename:
          from:
            - event.repository.owner.starred_url
          to: event.repositoryOwnerStarredUrl

      - rename:
          from:
            - event.repository.owner.subscriptions_url
          to: event.repositoryOwnerSubscriptionsUrl

      - rename:
          from:
            - event.repository.owner.type
          to: event.repositoryOwnerType

      - rename:
          from:
            - event.repository.owner.url
          to: event.repositoryOwnerUrl

      - rename:
          from:
            - event.repository.owner.user_view_type
          to: event.repositoryOwnerUserViewType

      - rename:
          from:
            - event.repository.private
          to: event.repositoryPrivate

      - rename:
          from:
            - event.repository.pulls_url
          to: event.repositoryPullsUrl

      - rename:
          from:
            - event.repository.pushed_at
          to: event.repositoryPushedAt

      - rename:
          from:
            - event.repository.releases_url
          to: event.repositoryReleasesUrl

      - rename:
          from:
