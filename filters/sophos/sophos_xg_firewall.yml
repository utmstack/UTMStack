# Sophos Firewall legacy and Central Reporting formats.
# https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
# Recover quoted fields independently: a missing subtype must not hide WAF.
# Validate original endpoints before enrichment; explicit rejection wins over Allow/HTTP 200.
# History markers are cleared and rebuilt from their rules’ predicates.
pipeline:
- dataTypes: [firewall-sophos-xg]
  steps:
  - grok:
      source: raw
      patterns:
      - {fieldName: '', pattern: '^(?:<[0-9]{1,3}>)?(?:(?:[A-Za-z]{3}\s+[0-9]{1,2}\s+[0-9]{2}:[0-9]{2}:[0-9]{2}\s+\S+\s+)|(?:[0-9]+\s+\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+(?:-|\[[^]]*\])\s+))?'}
      - {fieldName: event.sophosBody, pattern: '[A-Za-z_][A-Za-z0-9_]*=(?s:.*)'}
  # The header grok's optional prefix matches empty text when the line starts
  # with the first key, and an empty match stops a grok step.
  - grok:
      source: raw
      patterns:
      - {fieldName: event.sophosBody, pattern: '[A-Za-z_][A-Za-z0-9_]*=(?s:.*)'}
      where: '!exists("event.sophosBody") && regexMatch("raw", "^[A-Za-z_][A-Za-z0-9_]*=")'
  - kv:
      source: event.sophosBody
      fieldSplit: ' '
      valueSplit: '='
  # The current parser keeps underscores in KV keys, so the original key
  # names are removed too; the explicit grok steps below rebuild each field.
