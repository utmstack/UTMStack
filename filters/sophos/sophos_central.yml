# Sophos Central SIEM /siem/v1/events JSON, not Firewall syslog or the separate alerts API.
# https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/
# Native aliases remain compatible. Managed endpoint context is not remote-attacker identity.
# Remedy paths require exactly one file and exclude archive-member locators.
pipeline:
- dataTypes:
  - sophos-central
  steps:
  - json:
      source: raw
  - rename:
      from:
      - event.created_at
      to: event.createdAt
  - rename:
      from:
      - event.customer_id
      to: event.customerId
  - rename:
      from:
      - event.endpoint_id
      to: event.endpointId
  - rename:
      from:
      - event.endpoint_type
      to: event.endpointType
  - rename:
      from:
      - event.source_info.ip
      to: event.ip
  - rename:
      from:
      - event.userid
      to: event.userId
  - rename:
      from:
      - event.source_info
      to: event.sourceInfo
  - delete:
      fields:
      - event.sophosCentralScope
      - event.correlationCandidate
  - grok:
      source: event.customerId
      patterns:
      - fieldName: event.sophosCentralScope
        pattern: (?s)^.+$
      where: (regexMatch("event.customerId","[^[:space:]]") && !oneOf("event.customerId",["-","n/a","N/A","unknown"]))
        && (true)
  - grok:
      source: dataSource
      patterns:
      - fieldName: event.sophosCentralScope
        pattern: (?s)^.+$
      where: (regexMatch("dataSource","[^[:space:]]") && !oneOf("dataSource",["-","n/a","N/A","unknown"])) && (!exists("event.sophosCentralScope"))
  - grok:
      source: event.ip
      patterns:
      - fieldName: target.ip
        pattern: (?s)^.+$
      where: (regexMatch("event.ip","[^[:space:]]") && !oneOf("event.ip",["-","n/a","N/A","unknown"])) && ((regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && oneOf("event.endpointType",["computer","server"])
        && !(equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin")) && ((inCIDR("event.ip","0.0.0.0/0") ||
        inCIDR("event.ip","::/0")) && !inCIDR("event.ip","0.0.0.0/32") && !inCIDR("event.ip","::/128")))
  - grok:
      source: event.location
      patterns:
      - fieldName: target.host
        pattern: (?s)^.+$
      where: (regexMatch("event.location","[^[:space:]]") && !oneOf("event.location",["-","n/a","N/A","unknown"])) &&
        ((regexMatch("event.endpointId","[^[:space:]]") && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) &&
        oneOf("event.endpointType",["computer","server"]) && !(equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin")))
  - grok:
      source: event.source
      patterns:
      - fieldName: target.user
        pattern: (?s)^.+$
      where: (regexMatch("event.source","[^[:space:]]") && !oneOf("event.source",["-","n/a","N/A","unknown"])) && ((regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && oneOf("event.endpointType",["computer","server"])
        && !(equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin")))
  - grok:
      source: event.appSha256
      patterns:
      - fieldName: target.sha256
        pattern: (?s)^.+$
      where: (regexMatch("event.appSha256","[^[:space:]]") && !oneOf("event.appSha256",["-","n/a","N/A","unknown"]))
        && ((regexMatch("event.endpointId","[^[:space:]]") && !oneOf("event.endpointId",["-","n/a","N/A","unknown"]))
        && oneOf("event.endpointType",["computer","server"]) && !(equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin"))
        && regexMatch("event.appSha256","^[a-fA-F0-9]{64}$"))
  - grok:
      source: event.threat
      patterns:
      - fieldName: target.malware
        pattern: (?s)^.+$
      where: (regexMatch("event.threat","[^[:space:]]") && !oneOf("event.threat",["-","n/a","N/A","unknown"])) && ((regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && oneOf("event.endpointType",["computer","server"])
        && !(equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin")) && equals("event.group","MALWARE"))
  - grok:
      source: event.ip
      patterns:
      - fieldName: origin.ip
        pattern: (?s)^.+$
      where: (regexMatch("event.ip","[^[:space:]]") && !oneOf("event.ip",["-","n/a","N/A","unknown"])) && ((regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && oneOf("event.endpointType",["computer","server"])
        && equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin") && ((inCIDR("event.ip","0.0.0.0/0") || inCIDR("event.ip","::/0"))
        && !inCIDR("event.ip","0.0.0.0/32") && !inCIDR("event.ip","::/128")))
  - grok:
      source: event.location
      patterns:
      - fieldName: origin.host
        pattern: (?s)^.+$
      where: (regexMatch("event.location","[^[:space:]]") && !oneOf("event.location",["-","n/a","N/A","unknown"])) &&
        ((regexMatch("event.endpointId","[^[:space:]]") && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) &&
        oneOf("event.endpointType",["computer","server"]) && equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin"))
  - grok:
      source: event.source
      patterns:
      - fieldName: origin.user
        pattern: (?s)^.+$
      where: (regexMatch("event.source","[^[:space:]]") && !oneOf("event.source",["-","n/a","N/A","unknown"])) && ((regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && oneOf("event.endpointType",["computer","server"])
        && equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin"))
  - grok:
      source: event.appSha256
      patterns:
      - fieldName: origin.sha256
        pattern: (?s)^.+$
      where: (regexMatch("event.appSha256","[^[:space:]]") && !oneOf("event.appSha256",["-","n/a","N/A","unknown"]))
        && ((regexMatch("event.endpointId","[^[:space:]]") && !oneOf("event.endpointId",["-","n/a","N/A","unknown"]))
        && oneOf("event.endpointType",["computer","server"]) && equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin")
        && regexMatch("event.appSha256","^[a-fA-F0-9]{64}$"))
  - grok:
      source: event.threat
      patterns:
      - fieldName: origin.malware
        pattern: (?s)^.+$
      where: (regexMatch("event.threat","[^[:space:]]") && !oneOf("event.threat",["-","n/a","N/A","unknown"])) && ((regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && oneOf("event.endpointType",["computer","server"])
        && equals("event.type","Event::Endpoint::HmpaCryptoGuardSMBOrigin") && equals("event.group","MALWARE"))
  - grok:
      source: event.type
      patterns:
      - fieldName: action
        pattern: (?s)^.+$
      where: (regexMatch("event.type","[^[:space:]]") && !oneOf("event.type",["-","n/a","N/A","unknown"])) && (true)
  - grok:
      source: event.when
      patterns:
      - fieldName: deviceTime
        pattern: (?s)^.+$
      where: (regexMatch("event.when","[^[:space:]]") && !oneOf("event.when",["-","n/a","N/A","unknown"])) && (regexMatch("event.when","^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$"))
  - add:
      function: string
      params:
        key: severity
        value: info
      where: oneOf("event.severity",["low"])
  - add:
      function: string
      params:
        key: severity
        value: warning
      where: oneOf("event.severity",["medium"])
  - add:
      function: string
      params:
        key: severity
        value: error
      where: oneOf("event.severity",["high"])
  - add:
      function: string
      params:
        key: severity
        value: critical
      where: oneOf("event.severity",["critical"])
  # actionResult is only success, failed or denied, or nothing when the event
  # states no final outcome. The type (and for IPS the name) says whether the
  # product blocked something.
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: equalsIgnoreCase("event.action","blocked") || oneOf("event.type",["Event::Endpoint::Device::Blocked", "Event::Endpoint::Application::Blocked",
        "Event::Endpoint::WebFilteringBlocked", "Event::Endpoint::HmpaExploitPrevented", "Event::Endpoint::HmpaBehaviourPrevented",
        "Event::Endpoint::HmpaApplicationHijacking", "Event::Endpoint::HmpaPrivGuard", "Event::Endpoint::Threat::ExploitPrevented",
        "Event::Endpoint::Exploit::Prevented", "Event::Endpoint::CoreAmsiBlocked"])
  # "Malicious inbound network traffic blocked from remote computer at <ip> ..."
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: '!exists("actionResult") && equals("event.type","Event::Endpoint::Threat::IpsInboundDetection") && contains("event.name"," traffic blocked ")'
  - add:
      function: string
      params:
        key: actionResult
        value: failed
      where: '!exists("actionResult") && oneOf("event.type",["Event::ZTNA::ZTNAAuthenticationFailure","Event::Endpoint::AuthenticationFailure"])'
  # The named operation failed: update, malware cleanup ("Manual malware cleanup
  # required"), restore, or protecting the device ("Failed to protect ...").
  - add:
      function: string
      params:
        key: actionResult
        value: failed
      where: '!exists("actionResult") && (oneOf("event.type",["Event::Endpoint::UpdateFailure","Event::Endpoint::CoreCleanFailed","Event::Endpoint::CoreRestoreFailed"])
        || (equals("event.type","Event::Endpoint::NotProtected") && startsWith("event.name","Failed to protect")))'
  # The rename step copies an object or list as its JSON text, so nested paths
  # under a renamed object never resolve. The remedy object keeps its native name
  # and its values are read in place. A file at the root keeps the root as path.
  - grok:
      source: event.core_remedy_items.items.0.descriptor
      patterns:
      - fieldName: target.path
        pattern: ^(?:[A-Za-z]:[\\/]|/|\\\\)(?:[^<>:"|?*\r\n]*[\\/])?
      - fieldName: target.file
        pattern: '[^\\/<>:"|?*\r\n]+$'
      where: equals("event.core_remedy_items.totalItems",1) && equals("event.core_remedy_items.items.#",1) && equals("event.core_remedy_items.items.0.type","file")
        && !regexMatch("event.core_remedy_items.items.0.descriptor","(?i)[.](zip|cab|7z|rar|tar|gz|iso)[/\\\\]")
  # An IPS inbound block names the remote sender in ips_threat_data. Only records
  # that state the traffic was blocked (denied above) get the address.
  - grok:
      source: event.ips_threat_data.remoteIp
      patterns:
      - fieldName: origin.ip
        pattern: (?s)^.+$
      where: equals("event.type","Event::Endpoint::Threat::IpsInboundDetection") && contains("event.name"," traffic blocked ")
        && ((inCIDR("event.ips_threat_data.remoteIp","0.0.0.0/0") || inCIDR("event.ips_threat_data.remoteIp","::/0"))
        && !inCIDR("event.ips_threat_data.remoteIp","0.0.0.0/32") && !inCIDR("event.ips_threat_data.remoteIp","::/128"))
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: origin.ip
        destination: origin.geolocation
      where: exists("origin.ip")
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: target.ip
        destination: target.geolocation
      where: exists("target.ip")
  - add:
      function: string
      params:
        key: event.correlationCandidate.sophosCentral.behavior
        value: match
      where: '((oneOf("event.type", ["Event::Endpoint::Threat::BehavioralDetection", "Event::Endpoint::BehaviorDetected"])
        ||

        (oneOf("event.detectionMethod", ["Behavioral", "HIPS"]) && oneOf("event.severity", ["medium", "high", "critical"]))
        ||

        (contains("event.name", "Behavioral") && oneOf("event.severity", ["high", "critical"]))) || equals("event.type","Event::Endpoint::CoreBehavioralDetection"))
        && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$") && (regexMatch("event.endpointId","[^[:space:]]")
        && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && (regexMatch("dataSource","[^[:space:]]") &&
        !oneOf("dataSource",["-","n/a","N/A","unknown"])) && (regexMatch("event.sophosCentralScope","[^[:space:]]")
        && !oneOf("event.sophosCentralScope",["-","n/a","N/A","unknown"]))'
  - add:
      function: string
      params:
        key: event.correlationCandidate.sophosCentral.exploit
        value: match
      where: '(oneOf("event.type", ["Event::Endpoint::Threat::ExploitPrevented", "Event::Endpoint::Exploit::Prevented"])
        ||

        (equals("event.name", "Exploit prevented") && oneOf("event.severity", ["high", "critical"]))) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
        && (regexMatch("event.endpointId","[^[:space:]]") && !oneOf("event.endpointId",["-","n/a","N/A","unknown"]))
        && (regexMatch("dataSource","[^[:space:]]") && !oneOf("dataSource",["-","n/a","N/A","unknown"])) && (regexMatch("event.sophosCentralScope","[^[:space:]]")
        && !oneOf("event.sophosCentralScope",["-","n/a","N/A","unknown"]))'
  - add:
      function: string
      params:
        key: event.correlationCandidate.sophosCentral.mtr
        value: match
      where: '(oneOf("event.type", ["mtr_alert", "threat_detection"]) &&

        oneOf("event.severity", ["critical", "high"])) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
        && (regexMatch("event.endpointId","[^[:space:]]") && !oneOf("event.endpointId",["-","n/a","N/A","unknown"]))
        && (regexMatch("dataSource","[^[:space:]]") && !oneOf("dataSource",["-","n/a","N/A","unknown"])) && (regexMatch("event.sophosCentralScope","[^[:space:]]")
        && !oneOf("event.sophosCentralScope",["-","n/a","N/A","unknown"])) && equals("event.severity","critical")'
  - add:
      function: string
      params:
        key: event.correlationCandidate.sophosCentral.ztnaFailure
        value: match
      where: (equals("event.type", "Event::ZTNA::ZTNAAuthenticationFailure")) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
        && (regexMatch("event.ip","[^[:space:]]") && !oneOf("event.ip",["-","n/a","N/A","unknown"])) && (regexMatch("dataSource","[^[:space:]]")
        && !oneOf("dataSource",["-","n/a","N/A","unknown"])) && (regexMatch("event.sophosCentralScope","[^[:space:]]")
        && !oneOf("event.sophosCentralScope",["-","n/a","N/A","unknown"])) && ((inCIDR("event.ip","0.0.0.0/0") || inCIDR("event.ip","::/0"))
        && !inCIDR("event.ip","0.0.0.0/32") && !inCIDR("event.ip","::/128"))
