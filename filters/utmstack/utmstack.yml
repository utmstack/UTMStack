# UTMStack filter, version 1.0.2

pipeline:
  - dataTypes:
      - utmstack
    steps:
      # Only parse as JSON if it contains the standard schema with "msg": and "args":
      - json:
          source: raw
          where: 'contains("raw", "\"msg\":") && contains("raw", "\"args\":")'
      
      # If it doesn't have the standard schema, just store the content in log.message using grok
      - grok:
          source: raw
          patterns:
            - fieldName: event.message
              pattern: '{{.greedy}}'
          where: '!contains("raw", "\"msg\":") || !contains("raw", "\"args\":")'

      # Panel sign-in results written by the backend (UserJWTController.authorize).
      # actionResult is only success, failed or denied. args.remoteAddr is not promoted:
      # behind the panel's own nginx it is the proxy's address, not the client's.
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'startsWith("event.msg", "UserJWTController.authorize: Login successfully completed for user ")'
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: 'equals("event.msg", "UserJWTController.authorize: Bad credentials")'
      # On a completed sign-in args.username is the account that signed in; on a failed
      # one it is "anonymous", so it is not mapped there.
      - rename:
          from:
            - event.args.username
          to: origin.user
          where: 'equals("actionResult", "success") && exists("event.args.username") && !oneOf("event.args.username", ["", "anonymous"])'
