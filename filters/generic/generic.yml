# Generic filter, version 2.0.1
# Allow processing of any one line json or syslog logs 
pipeline:
  - dataTypes:
      - generic
    steps:
      - grok:
          patterns:
            - fieldName: event.message
              pattern: '(.*)'
          source: raw
      - json:
          source: event.message
          where: 'startsWith("event.message", "{")'