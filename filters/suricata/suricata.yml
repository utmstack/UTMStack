# Suricata filter version 1.1.0
# Based on https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
# Support json format

pipeline:
  - dataTypes:
      - suricata
    steps:
      # Drop log incomplete jSon structure
      - drop:
          where: regexMatch("raw", ".*\\\"event_type\\\"\\s*:\\s*\\\"stats\\\".*")

      # Parsing RAW field log
      - grok:
          patterns:
            - fieldName: log.syslogPri
              pattern: '\<{{.integer}}\>'
            - fieldName: log.syslogTimestamp
              pattern: '{{.monthName}}(\s+){{.monthDay}}(\s+){{.time}}'
            - fieldName: log.syslogHost
              pattern: '{{.hostname}}'
            - fieldName: log.syslogProgram
              pattern: '{{.word}}'
            - fieldName: log.syslogPid
              pattern: '\[{{.integer}}\]: '
            - fieldName: log.suricataJson
              pattern: '{{.greedy}}'

      # EVE's native format is JSON without a syslog envelope.
      - json:
          source: raw
          where: regexMatch("raw", "^\\s*\\{")

      # Parse Suricata JSON logs
      - json:
          source: log.suricataJson
          where: regexMatch("log.suricataJson", "^\\{.*\\}$")

      # Rename fields to conversion v11 schema
      - rename:
          from:
            - log.destip
          to: target.ip

      - rename:
          from:
            - log.destport
          to: target.port

      - rename:
          from:
            - log.flowid
          to: log.flowId

      - rename:
          from:
            - log.host
          to: target.host

      - rename:
          from:
            - log.iniface
          to: log.inFace

      - rename:
          from:
            - log.srcip
          to: origin.ip

      - rename:
          from:
            - log.srcport
          to: origin.port

      - rename:
          from:
            - log.txid
          to: log.txId

      - rename:
          from:
            - log.eventtype
          to: log.eventType

      - rename:
          from:
            - log.appproto
          to: log.appProto

      - rename:
          from:
            - log.proto
          to: protocol

    
      # EVE severity is the rule priority: 1 is highest, then 2 and 3.
      - add:
          function: "string"
          params:
            key: severity
            value: "critical"
          where: equals("log.alert.severity", 1)

      - add:
          function: "string"
          params:
            key: severity
            value: "warning"
          where: equals("log.alert.severity", 2)

      - add:
          function: "string"
          params:
            key: severity
            value: "info"
          where: equals("log.alert.severity", 3)

      #.......................................................................
      # Add new eventtypes to logx structure, detected in real logs, present in suricata 7.0.0
      - rename:
          from:
            - log.ftpdata
          to: log.ftpData
      
      - rename:
          from:
            - log.fileinfo
          to: log.fileInfo

      # The alert's own action is not the final packet verdict: a second
      # signature or a flow drop can override an alert marked allowed.
      # An observed bidirectional established flow is the connection proof;
      # a permitted alert packet alone is not a successful connection.
      - delete:
          fields: [actionResult]
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: >-
            equals("log.verdict.action", "drop") ||
            equals("log.flow.action", "drop") ||
            (equals("log.eventType", "alert") && equals("log.alert.action", "blocked") &&
             !exists("log.verdict.action") && !exists("log.flow.action"))
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: >-
            !equals("log.verdict.action", "drop") && !equals("log.flow.action", "drop") &&
            (greaterThan("log.flow.bytes_toserver", 0) || greaterThan("log.flow.bytestoserver", 0)) &&
            (greaterThan("log.flow.bytes_toclient", 0) || greaterThan("log.flow.bytestoclient", 0)) &&
            ((equals("log.eventType", "flow") &&
              oneOf("log.flow.state", ["established", "closed", "bypassed"]) &&
              (equals("log.flow.action", "pass") || !exists("log.flow.action"))) ||
             (equals("log.eventType", "alert") && equals("log.verdict.action", "pass")))

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Removing unused fields
      - delete:
          fields:
            - log.suricataJson
            - log.syslogPri
            - log.syslogTimestamp
            - log.syslogProgram
            - log.syslogPid
