# Suricata filter version 1.1.0
# Based on https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
# Support json format

pipeline:
  - dataTypes:
      - suricata
    steps:
      # Drop log incomplete jSon structure
      - drop:
          where: regexMatch("raw", ".*\\\"event_type\\\"\\s*:\\s*\\\"stats\\\".*")

      # Parsing RAW field log
      - grok:
          patterns:
            - fieldName: event.syslogPri
              pattern: '\<{{.integer}}\>'
            - fieldName: event.syslogTimestamp
              pattern: '{{.monthName}}(\s+){{.monthDay}}(\s+){{.time}}'
            - fieldName: event.syslogHost
              pattern: '{{.hostname}}'
            - fieldName: event.syslogProgram
              pattern: '{{.word}}'
            - fieldName: event.syslogPid
              pattern: '\[{{.integer}}\]: '
            - fieldName: event.suricataJson
              pattern: '{{.greedy}}'

      # EVE's native format is JSON without a syslog envelope.
      - json:
          source: raw
          where: regexMatch("raw", "^\\s*\\{")

      # Parse Suricata JSON logs
      - json:
          source: event.suricataJson
          where: regexMatch("event.suricataJson", "^\\{.*\\}$")

      # Rename fields to conversion v11 schema
      # Parsers on go-sdk v1.1.35 or later keep "_" in EVE keys (src_ip) and older ones remove it
      # (srcip), so these renames read both spellings.
      - rename:
          from:
            - event.destip
            - event.dest_ip
          to: target.ip

      - rename:
          from:
            - event.destport
            - event.dest_port
          to: target.port

      - rename:
          from:
            - event.flowid
            - event.flow_id
          to: event.flowId

      - rename:
          from:
            - event.host
          to: target.host

      - rename:
          from:
            - event.iniface
            - event.in_iface
          to: event.inFace

      - rename:
          from:
            - event.srcip
            - event.src_ip
          to: origin.ip

      - rename:
          from:
            - event.srcport
            - event.src_port
          to: origin.port

      - rename:
          from:
            - event.txid
            - event.tx_id
          to: event.txId

      - rename:
          from:
            - event.eventtype
            - event.event_type
          to: event.eventType

      - rename:
          from:
            - event.appproto
            - event.app_proto
          to: event.appProto

      - rename:
          from:
            - event.proto
          to: protocol

    
      # EVE severity is the rule priority: 1 is highest, then 2 and 3.
      - add:
          function: "string"
          params:
            key: severity
            value: "critical"
          where: equals("event.alert.severity", 1)

      - add:
          function: "string"
          params:
            key: severity
            value: "warning"
          where: equals("event.alert.severity", 2)

      - add:
          function: "string"
          params:
            key: severity
            value: "info"
          where: equals("event.alert.severity", 3)

      #.......................................................................
      # Add new eventtypes to logx structure, detected in real logs, present in suricata 7.0.0
      - rename:
          from:
            - event.ftpdata
          to: event.ftpData
      
      - rename:
          from:
            - event.fileinfo
          to: event.fileInfo

      # The alert's own action is not the final packet verdict: a second
      # signature or a flow drop can override an alert marked allowed.
      # An observed bidirectional established flow is the connection proof;
      # a permitted alert packet alone is not a successful connection.
      - delete:
          fields: [actionResult]
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: >-
            equals("event.verdict.action", "drop") ||
            equals("event.flow.action", "drop") ||
            (equals("event.eventType", "alert") && equals("event.alert.action", "blocked") &&
             !exists("event.verdict.action") && !exists("event.flow.action"))
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: >-
            !equals("event.verdict.action", "drop") && !equals("event.flow.action", "drop") &&
            (greaterThan("event.flow.bytes_toserver", 0) || greaterThan("event.flow.bytestoserver", 0)) &&
            (greaterThan("event.flow.bytes_toclient", 0) || greaterThan("event.flow.bytestoclient", 0)) &&
            ((equals("event.eventType", "flow") &&
              oneOf("event.flow.state", ["established", "closed", "bypassed"]) &&
              (equals("event.flow.action", "pass") || !exists("event.flow.action"))) ||
             (equals("event.eventType", "alert") && equals("event.verdict.action", "pass")))

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Removing unused fields
      - delete:
          fields:
            - event.suricataJson
            - event.syslogPri
            - event.syslogTimestamp
            - event.syslogProgram
            - event.syslogPid
