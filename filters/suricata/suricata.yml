# Suricata filter version 1.0.1
# Based on https://suricata.readthedocs.io/en/latest/output/eve/eve-json-format.html (latest 8.0.0) (august 2025)
# and real events log provided
# Support json format

pipeline:
  - dataTypes:
      - suricata
    steps:
      # Drop log incomplete jSon structure
      - drop:
          where: regexMatch("raw", ".*\\\"event_type\\\"\\s*:\\s*\\\"stats\\\".*")

      # Parsing RAW field log
      - grok:
          patterns:
            - fieldName: log.syslogPri
              pattern: '\<{{.integer}}\>'
            - fieldName: log.syslogTimestamp
              pattern: '{{.monthName}}(\s+){{.monthDay}}(\s+){{.time}}'
            - fieldName: log.syslogHost
              pattern: '{{.hostname}}'
            - fieldName: log.syslogProgram
              pattern: '{{.word}}'
            - fieldName: log.syslogPid
              pattern: '\[{{.integer}}\]: '
            - fieldName: log.suricataJson
              pattern: '{{.greedy}}'

      # Parse Suricata JSON logs
      - json:
          source: log.suricataJson
          where: regexMatch("log.suricataJson", "^\\{.*\\}$")
      - json:
          source: raw
          where: '!exists("log.suricataJson") && regexMatch("raw", "^\\s*\\{")'

      # Rename fields to conversion v11 schema
      - rename:
          from:
            - log.destip
          to: target.ip

      - rename:
          from:
            - log.destport
          to: target.port

      - rename:
          from:
            - log.flowid
          to: log.flowId

      - rename:
          from:
            - log.host
          to: target.host

      - rename:
          from:
            - log.iniface
          to: log.inFace

      - rename:
          from:
            - log.srcip
          to: origin.ip

      - rename:
          from:
            - log.srcport
          to: origin.port

      - rename:
          from:
            - log.txid
          to: log.txId

      - rename:
          from:
            - log.eventtype
          to: log.eventType

      - rename:
          from:
            - log.appproto
          to: log.appProto

      - rename:
          from:
            - log.proto
          to: protocol

    
      # Adding severity field based on log.alert.severity
      - add:
          function: string
          params:
            key: severity
            value: critical
          where: equals("log.alert.severity", 1)

      - add:
          function: string
          params:
            key: severity
            value: warning
          where: equals("log.alert.severity", 2)

      - add:
          function: string
          params:
            key: severity
            value: info
          where: equals("log.alert.severity", 3)

      #.......................................................................
      # Add new eventtypes to logx structure, detected in real logs, present in suricata 7.0.0
      - rename:
          from:
            - log.ftpdata
          to: log.ftpData
      
      - rename:
          from:
            - log.fileinfo
          to: log.fileInfo

      # Implementing action field used for established connections
          

      # Adding action result

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Removing unused fields
      - delete:
          fields:
            - log.suricataJson
            - log.syslogPri
            - log.syslogTimestamp
            - log.syslogProgram
            - log.syslogPid

      # Normalize explicit outcomes; an unknown outcome remains unset.
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: oneOf("log.verdict.action",["drop","reject"]) || exists("log.verdict.reject") || equals("log.flow.action","drop") || equals("log.alert.action","blocked")
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!exists("actionResult") && (equals("log.verdict.action","pass") || equals("log.flow.action","pass"))'
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: '!exists("actionResult") && equals("log.flow.state","established") && greaterThan("log.flow.bytestoserver",0) && greaterThan("log.flow.bytestoclient",0)'
      - add:
          function: string
          params:
            key: connectionStatus
            value: established
          where: equals("log.flow.state","established") && !equals("actionResult","denied")
      - add:
          function: string
          params:
            key: connectionStatus
            value: closed
          where: equals("log.flow.state","closed")

      # Keep addresses in IP fields and retain other source values under log.
      - rename:
          from:
          - origin.ip
          to: log.unparsedOriginIp
          where: exists("origin.ip") && (!(inCIDR("origin.ip","0.0.0.0/0") || inCIDR("origin.ip","::/0")) || oneOf("origin.ip",["0.0.0.0","::"]))
      - rename:
          from:
          - target.ip
          to: log.unparsedTargetIp
          where: exists("target.ip") && (!(inCIDR("target.ip","0.0.0.0/0") || inCIDR("target.ip","::/0")) || oneOf("target.ip",["0.0.0.0","::"]))
      - add:
          function: string
          params:
            key: protocol
            value: ICMP
          where: equals("protocol",1)
      - add:
          function: string
          params:
            key: protocol
            value: TCP
          where: equals("protocol",6)
      - add:
          function: string
          params:
            key: protocol
            value: UDP
          where: equals("protocol",17)
      - add:
          function: string
          params:
            key: protocol
            value: GRE
          where: equals("protocol",47)
      - add:
          function: string
          params:
            key: protocol
            value: ESP
          where: equals("protocol",50)
      - add:
          function: string
          params:
            key: protocol
            value: AH
          where: equals("protocol",51)
      - add:
          function: string
          params:
            key: protocol
            value: ICMPV6
          where: equals("protocol",58)
      - add:
          function: string
          params:
            key: protocol
            value: SCTP
          where: equals("protocol",132)
      - rename:
          from:
          - protocol
          to: log.ipProtocolNumber
          where: exists("protocol") && greaterOrEqual("protocol",0)
