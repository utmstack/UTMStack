s', 'SetRestrictiveRetentionUI', 'SharePointDataProactivelyPreserved', 'SharingInvitationRevoked', 'SharingInvitationUpdated', 'ShiftAdded', 'SiteAdminChangeRequest', 'SiteCollectionCreated', 'SiteCollectionQuotaModified', 'SiteColumnCreated', 'SiteColumnDeleted', 'SiteColumnUpdated', 'SiteContentTypeCreated', 'SiteContentTypeDeleted', 'SiteContentTypeUpdated', 'SoftDeleteSettingsUpdated', 'SubTaskCreated', 'SubmitResponse', 'SubmitUpdate', 'SubscribedToMessages', 'SupervisionRuleMatch', 'SupervisoryReviewTag', 'TabAdded', 'TabUpdated', 'TagFiles', 'TagJob', 'TaggingConfigurationUpdated', 'TaskAccessed', 'TaskAssigned', 'TaskCompleted', 'TaskCreated', 'TaskListCreated', 'TaskListRead', 'TaskRead', 'TeamCreated', 'ThreadAccessFailure', 'ThreadViewed', 'TimeClockEntryAdded', 'TimeOffAdded', 'UnlockRecord', 'Update', 'UpdateCopilotPlugin', 'UpdateCopilotPromptBook', 'UpdateCopilotSettings', 'UpdateIncidentStatus', 'UpdateResponse', 'UpdateTag', 'UpdateUsageReportsPrivacySetting', 'UpdateWorkingSetSearch', 'UpdatedPolicyConfigPriority', 'UploadedOrgData', 'UsagePolicyAcceptance', 'ViewBackupPolicyDetails', 'ViewDocument', 'ViewForm', 'ViewResponse', 'ViewResponses', 'ViewRuntimeForm', 'ViewUpdate', 'ViewedExplore', 'ViewedSearchExported', 'ViewedSearchPreviewed', 'WorkforceIntegrationAdded', 'WorkspaceCreated', 'updateddeviceconfiguration'])
  - cast:
      fields:
      - log.Parameters
      - log.Members
      to: string
  - rename:
      from:
      - log.AppAccessContext.AADSessionId
      to: log.appAccessContextAADSessionId
  - rename:
      from:
      - log.AppAccessContext.APIId
      to: log.appAccessContextAPIId
  - rename:
      from:
      - log.AppAccessContext.ClientAppId
      to: log.appAccessContextClientAppId
  - rename:
      from:
      - log.AppAccessContext.CorrelationId
      to: log.appAccessContextCorrelationId
  - rename:
      from:
      - log.CreationTime
      to: deviceTime
  - rename:
      from:
      - log.AppAccessContext.UniqueTokenId
      to: log.appAccessContextUniqueTokenId
  - rename:
      from:
      - log.ClientIPAddress
      to: origin.ip
  - rename:
      from:
      - log.Operation
      to: action
  - rename:
      from:
      - log.Version
      to: log.version
  - rename:
      from:
      - log.ClientIP
      to: origin.ip
  - rename:
      from:
      - log.UserId
      to: origin.user
  - rename:
      from:
      - log.Folder.Path
      to: log.folderPath
  - rename:
      from:
      - log.Folder.Id
      to: log.folderId
  - rename:
      from:
      - log.DestFolder.Id
      to: log.destFolderId
  - rename:
      from:
      - log.DestFolder.Path
      to: log.destFolderPath
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: oneOf("log.ResultStatus", ["Succeeded", "Success", "Successful", "True"]) && !equals("action", "UserLoginFailed")
  - add:
      function: string
      params:
        key: actionResult
        value: failed
      where: oneOf("log.ResultStatus", ["Failure", "Failed"])
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: origin.ip
        destination: origin.geolocation
      where: exists("origin.ip")
  - rename:
      from:
      - log.ActorIpAddress
      to: origin.ip
      where: equals("log.Workload", "AzureActiveDirectory")
  - rename:
      from:
      - log.Target.4.ID
      to: target.user
      where: equals("log.Workload", "AzureActiveDirectory") && equals("log.Target.2.ID", "User") && equals("log.Target.4.Type", 5)
  - rename:
      from:
      - log.MailboxOwnerUPN
      to: target.user
      where: exists("log.MailboxOwnerUPN")
  - rename:
      from:
      - log.ClientProcessName
      to: origin.process
      where: exists("log.ClientProcessName")
  - rename:
      from:
      - log.SiteUrl
      to: target.url
      where: exists("log.SiteUrl")
  - rename:
      from:
      - log.SourceRelativeUrl
      to: target.path
      where: exists("log.SourceRelativeUrl")
  - rename:
      from:
      - log.DestinationRelativeUrl
      to: target.path
      where: exists("log.DestinationRelativeUrl")
  - rename:
      from:
      - log.SourceFileName
      to: target.filename
      where: exists("log.SourceFileName")
  - rename:
      from:
      - log.DestinationFileName
      to: target.filename
      where: exists("log.DestinationFileName")
  - rename:
      from:
      - log.ItemName
      to: target.filename
      where: equals("log.Workload", "OneDrive") || equals("log.Workload", "SharePoint")
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: equals("log.ResultStatus", "PartiallySucceeded")
  - add:
      function: string
      params:
        key: actionResult
        value: blocked
      where: equals("log.ResultStatus", "Blocked")
  - add:
      function: string
      params:
        key: actionResult
        value: failed
      where: equals("action", "UserLoginFailed")
  - delete:
      fields:
      - log.AppAccessContext
