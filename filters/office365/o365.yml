# Microsoft 365 filter, version 1.4.1

pipeline:
- dataTypes:
  - o365
  steps:
  - json:
      source: raw
  - drop:
      where: oneOf("event.Operation", ['AINotesUpdate', 'AcceptedSharingLinkOnFolder', 'AccessRequestUpdated', 'AccessedOdataLink', 'AddCommentToIncident.', 'AddFormCoauthor', 'AddRemediatedData', 'AddTagsToIncident', 'AdminThreadMuted', 'AdminThreadUnmuted', 'AlertExcelDownloaded', 'AlertNotificationsRecipientAdded', 'AllowShareFormForCopy', 'AppPublishedToCatalog', 'AppUpdatedInCatalog', 'AppUpgraded', 'ApplyRecordLabel', 'ApproveDisposal', 'AssignUserToIncident', 'AuditSearchCancelled', 'AuditSearchCompleted', 'AuditSearchCreated', 'AuditSearchExportJobCompleted', 'AuditSearchExportJobCreated', 'AuditSearchExportResultsDownloaded', 'BackupItemAdded', 'BackupItemRemoved', 'BackupItemRestoreCompleted', 'BackupItemRestoreTriggered', 'BackupPolicyActivated', 'BackupPolicyPaused', 'BotAddedToTeam', 'BreakEnded', 'BurnJob', 'CanceledQuery', 'CaseUpdated', 'ChannelAdded', 'ChannelOwnerResponded', 'ChatRetrieved', 'ChatUpdated', 'ClassificationAdded', 'ClassificationDefinitionCreated', 'ClientViewSignaled', 'ClockedIn', 'ClockedOut', 'CloseConversation', 'CollectionCreated', 'CollectionHardDeleted', 'CollectionRenamed', 'CollectionSoftDeleted', 'CollectionUpdated', 'ComplianceManagerAutomationChange', 'ComplianceSettingChanged', 'ConnectToExcelWorkbook', 'ConnectorAdded', 'CopilotInteraction', 'Copy', 'Create', 'CreateComment', 'CreateCopilotPlugin', 'CreateCopilotPromptBook', 'CreateForm', 'CreateResponse', 'CreateTag', 'CreateUpdateRequest', 'CreateWorkingSet', 'CreateWorkingSetSearch', 'DataExport', 'DataShareCreated', 'DataShareDeleted', 'DeleteCopilotPlugin', 'DeleteCopilotPromptBook', 'DeleteSummaryLink', 'DeleteTag', 'DeleteWorkingSetSearch', 'DeletedResult', 'DisableCopilotPlugin', 'DisableCopilotPromptBook', 'DisallowShareFormForCopy', 'DocumentSensitivityMismatchDetected', 'DomainControllerCoverageExcelDownloaded', 'DownloadCopyOfLakeData', 'DownloadDocument', 'DownloadedReport', 'DraftRestoreTaskCreated', 'DraftRestoreTaskDeleted', 'DraftRestoreTaskEdited', 'EditUpdateRequest', 'EnableCopilotPlugin', 'EnableCopilotPromptBook', 'EntityCreated', 'ErrorRemediationJob', 'ExchangeDataProactivelyPreserved', 'ExecutedQuery', 'ExportForm', 'ExportJob', 'ExtendRetention', 'FailedValidation', 'FileCheckOutDiscarded', 'FileCheckedIn', 'FileCheckedOut', 'FileCopied', 'FileDeletedFirstStageRecycleBin', 'FileDeletedSecondStageRecycleBin', 'FileModifiedExtended', 'FileRecycled', 'FileRestored', 'FileSyncDownloadedFull', 'FileSyncUploadedFull', 'FileUpdateDescription', 'FileUploaded', 'FileVersionRecycled', 'FileVersionsAllMinorsRecycled', 'FileVersionsAllRecycled', 'FileVisited', 'FolderCopied', 'FolderCreated', 'FolderDeletedFirstStageRecycleBin', 'FolderDeletedSecondStageRecycleBin', 'FolderRecycled', 'FolderRestored', 'FolderSharingLinkShared', 'GenerateCopyOfLakeData', 'GetAllRestoreArtifactsInTask', 'GetBackupItem', 'GetRestoreTaskDetails', 'GetSummaryLink', 'GlossaryTermAssigned', 'GlossaryTermCreated', 'HoldRemoved', 'HoldUpdated', 'HubSiteJoined', 'HubSiteOrphanHubDeleted', 'HubSiteRegistered', 'InformationBarriersInsightsReportCompleted', 'InformationBarriersInsightsReportOneDriveSectionQueried', 'InformationBarriersInsightsReportSchedule', 'InformationBarriersInsightsReportSharePointSectionQueried', 'InviteSent', 'InviteeResponded', 'LabelContentExplorerAccessedItem', 'LegacyWorkflowEnabledSet', 'LinkedEntityCreated', 'ListAllBackupItemsInPolicies', 'ListAllBackupItemsInTenant', 'ListAllBackupItemsInWorkload', 'ListAllBackupPolicies', 'ListAllRestorePoints', 'ListAllRestoreTasks', 'ListColumnCreated', 'ListColumnUpdated', 'ListContentTypeCreated', 'ListContentTypeDeleted', 'ListContentTypeUpdated', 'ListCreated', 'ListForms', 'ListItemCreated', 'ListItemRecycled', 'ListItemRestored', 'LiveNotesUpdate', 'LockRecord', 'LogsCollection', 'ManagedSyncClientAllowed', 'MarkedMessageChanged', 'MeetingDetail', 'MeetingParticipantDetail', 'MessageCreatedHasLink', 'MessageCreatedNotification', 'MessageCreation', 'MessageDeleted', 'MessageDeletedNotification', 'MessageEditedHasLink', 'MessageHostedContentsListed', 'MessageRead', 'MessageUpdated', 'MessageUpdatedNotification', 'MonitoringAlertNotificationRecipientAdded', 'MonitoringAlertUpdated', 'MoveForm', 'MovedFormIntoCollection', 'MovedFormOutofCollection', 'NewAdaptiveScope', 'NewBackupPolicyCreated', 'NewComplianceTag', 'NewRetentionCompliancePolicy', 'NewsFeedEnabledSet', 'OffShiftDialogAccepted', 'OfficeOnDemandSet', 'OpenConversation', 'OpenShiftAdded', 'PagePrefetched', 'PageViewed', 'PageViewedExtended', 'PeopleResultsScopeSet', 'PerformedCardAction', 'PlanCopied', 'PlanListRead', 'PreviewForm', 'PreviewItemDownloaded', 'PreviewItemListed', 'PreviewModeEnabledSet', 'PreviewWorkingSetSearch', 'ProInvitation', 'ProjectCreated', 'ProjectListAccessed', 'PulseCancel', 'PulseCreate', 'PulseCreateDraft', 'PulseDeleteDraft', 'PulseExtendDeadline', 'PulseInvite', 'PulseShareResults', 'PulseSubmit', 'QuarantinePreview', 'QuarantineReleaseRequest', 'QuarantineReleaseRequestDeny', 'QuarantineViewHeader', 'RecordDelete', 'RelabelItem', 'RemediationActionAdded', 'RemediationActionUpdated', 'RemoveAdaptiveScope', 'RemoveComplianceTag', 'RemoveCuratedTopic', 'RemoveFormCoauthor', 'RemoveTagsFromIncident', 'RemovedSearchExported', 'RemovedSearchPreviewed', 'RemovedSearchResultsPurged', 'RemovedSearchResultsSentToZoom', 'ReportDownloaded', 'RequestAdded', 'RequestRespondedTo', 'RestoreTaskActivated', 'RestoreTaskCompleted', 'RoadmapAccessed', 'RoadmapCreated', 'RoadmapItemAccessed', 'RoadmapItemCreated', 'RunAntiVirusScan', 'ScheduleGroupAdded', 'ScheduleShared', 'SearchPermissionUpdated', 'SearchQueryPerformed', 'SearchRemoved', 'SearchReport', 'SearchReportRemoved', 'SearchResultsSentToZoom', 'SearchStopped', 'SearchUpdated', 'SearchViewed', 'Send', 'SensitivityLabelApplied', 'SensitivityLabelChanged', 'SensorActivationMethodConfigurationUpdated', 'SensorCreated', 'SensorDeploymentAccessKeyReceived', 'SensorDeploymentAccessKeyUpdated', 'SetAdvancedFeatures', 'SetRestrictiveRetentionUI', 'SharePointDataProactivelyPreserved', 'SharingInvitationRevoked', 'SharingInvitationUpdated', 'ShiftAdded', 'SiteAdminChangeRequest', 'SiteCollectionCreated', 'SiteCollectionQuotaModified', 'SiteColumnCreated', 'SiteColumnDeleted', 'SiteColumnUpdated', 'SiteContentTypeCreated', 'SiteContentTypeDeleted', 'SiteContentTypeUpdated', 'SoftDeleteSettingsUpdated', 'SubTaskCreated', 'SubmitResponse', 'SubmitUpdate', 'SubscribedToMessages', 'SupervisionRuleMatch', 'SupervisoryReviewTag', 'TabAdded', 'TabUpdated', 'TagFiles', 'TagJob', 'TaggingConfigurationUpdated', 'TaskAccessed', 'TaskAssigned', 'TaskCompleted', 'TaskCreated', 'TaskListCreated', 'TaskListRead', 'TaskRead', 'TeamCreated', 'ThreadAccessFailure', 'ThreadViewed', 'TimeClockEntryAdded', 'TimeOffAdded', 'UnlockRecord', 'Update', 'UpdateCopilotPlugin', 'UpdateCopilotPromptBook', 'UpdateCopilotSettings', 'UpdateIncidentStatus', 'UpdateResponse', 'UpdateTag', 'UpdateUsageReportsPrivacySetting', 'UpdateWorkingSetSearch', 'UpdatedPolicyConfigPriority', 'UploadedOrgData', 'UsagePolicyAcceptance', 'ViewBackupPolicyDetails', 'ViewDocument', 'ViewForm', 'ViewResponse', 'ViewResponses', 'ViewRuntimeForm', 'ViewUpdate', 'ViewedExplore', 'ViewedSearchExported', 'ViewedSearchPreviewed', 'WorkforceIntegrationAdded', 'WorkspaceCreated', 'updateddeviceconfiguration'])
  # Capture documented Name/Value parameter identities before the legacy string
  # cast loses their structure. The inbox rule and send-on-behalf flags mean a
  # setting was supplied, including clearing it. The mailbox flag needs a non-empty
  # forwarding address: Exchange records a cleared address as an empty value, and
  # DeliverToMailboxAndForward alone sets no destination. No flag establishes an
  # external recipient. Never trust markers supplied by the input record.
  - delete:
      fields:
      - event.o365InboxForwardingChange
      - event.o365MailboxForwardingSet
      - event.o365SendOnBehalfChange
  - add:
      function: string
      params:
        key: event.o365InboxForwardingChange
        value: "true"
      where: >-
        equals("event.Workload", "Exchange") &&
        oneOf("event.Operation", ["New-InboxRule", "Set-InboxRule"]) &&
        (exists("event.Parameters.#(Name==ForwardTo).Name") ||
         exists("event.Parameters.#(Name==ForwardAsAttachmentTo).Name") ||
         exists("event.Parameters.#(Name==RedirectTo).Name"))
  - add:
      function: string
      params:
        key: event.o365MailboxForwardingSet
        value: "true"
      where: >-
        equals("event.Workload", "Exchange") && equals("event.Operation", "Set-Mailbox") &&
        (regexMatch("event.Parameters.#(Name==ForwardingAddress).Value", "(?s)^.+$") ||
         regexMatch("event.Parameters.#(Name==ForwardingSmtpAddress).Value", "(?s)^.+$"))
  - add:
      function: string
      params:
        key: event.o365SendOnBehalfChange
        value: "true"
      where: >-
        equals("event.Workload", "Exchange") && equals("event.Operation", "Set-Mailbox") &&
        exists("event.Parameters.#(Name==GrantSendOnBehalfTo).Name")
  - cast:
      fields:
      - event.Parameters
      - event.Members
      to: string
  - rename:
      from:
      - event.AppAccessContext.AADSessionId
      to: event.appAccessContextAADSessionId
  - rename:
      from:
      - event.AppAccessContext.APIId
      to: event.appAccessContextAPIId
  - rename:
      from:
      - event.AppAccessContext.ClientAppId
      to: event.appAccessContextClientAppId
  - rename:
      from:
      - event.AppAccessContext.CorrelationId
      to: event.appAccessContextCorrelationId
  - rename:
      from:
      - event.CreationTime
      to: deviceTime
  - rename:
      from:
      - event.AppAccessContext.UniqueTokenId
      to: event.appAccessContextUniqueTokenId
  - rename:
      from:
      - event.ClientIPAddress
      to: origin.ip
  - rename:
      from:
      - event.Operation
      to: action
  - rename:
      from:
      - event.Version
      to: event.version
  - rename:
      from:
      - event.ClientIP
      to: origin.ip
  - rename:
      from:
      - event.UserId
      to: origin.user
  - rename:
      from:
      - event.Folder.Path
      to: event.folderPath
  - rename:
      from:
      - event.Folder.Id
      to: event.folderId
  - rename:
      from:
      - event.DestFolder.Id
      to: event.destFolderId
  - rename:
      from:
      - event.DestFolder.Path
      to: event.destFolderPath
  # ResultStatus is workload-specific. Preserve it and derive only established
  # operation outcomes; partial, pending and unknown results remain unset.
  - delete:
      fields:
      - actionResult
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: >-
        !oneOf("event.RecordType", [1, 15, 41, 188, 189, 190, 191, 192, 193, 194, 231, 386, 387, 401, 402]) &&
        oneOf("event.ResultStatus", ["Succeeded", "Success", "Successful"]) &&
        !equals("action", "UserLoginFailed")
  # ExchangeAdmin uses string True/False; these are not universal outcome codes.
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: equals("event.RecordType", 1) && equals("event.ResultStatus", "True")
  # STS HTTP success and UserLoggedIn alone do not prove completed authentication.
  # Require an explicit zero result code and reject contradictory/unknown errors.
  # ErrorNumber is the corresponding field in observed STS audit records.
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: >-
        equals("event.RecordType", 15) &&
        (equals("event.ErrorCode", 0) || equals("event.ErrorNumber", 0)) &&
        (!exists("event.ErrorCode") || equals("event.ErrorCode", 0)) &&
        (!exists("event.ErrorNumber") || equals("event.ErrorNumber", 0)) &&
        (!exists("event.LogonError") || regexMatch("event.LogonError", "^$")) &&
        (!exists("event.ResultStatus") || oneOf("event.ResultStatus", ["Succeeded", "Success", "Successful"])) &&
        !equals("action", "UserLoginFailed")
  # Planner defines its own result enum. Audit records also emit its member names.
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: >-
        oneOf("event.RecordType", [188, 189, 190, 191, 192, 193, 194, 231, 386, 387, 401, 402]) &&
        (equals("event.ResultStatus", 1) || equals("event.ResultStatus", "Success"))
  # Safe Links reports the navigation decision separately from event processing.
  # Values 4/5 mean the user overrode the page and navigated; 3 remains pending.
  - add:
      function: string
      params:
        key: actionResult
        value: success
      where: equals("event.RecordType", 41) && oneOf("event.URLClickAction", [4, 5])
  - add:
      function: string
      params:
        key: actionResult
        value: failure
      where: >-
        !oneOf("event.RecordType", [41, 188, 189, 190, 191, 192, 193, 194, 231, 386, 387, 401, 402]) &&
        (oneOf("event.ResultStatus", ["Failure", "Failed"]) ||
         (equals("event.RecordType", 1) && equals("event.ResultStatus", "False")))
  - add:
      function: string
      params:
        key: actionResult
        value: failure
      where: >-
        equals("event.RecordType", 15) &&
        (greaterThan("event.ErrorCode", 0) || regexMatch("event.LogonError", "(?s)^.+$"))
  - add:
      function: string
      params:
        key: actionResult
        value: failure
      where: >-
        oneOf("event.RecordType", [188, 189, 190, 191, 192, 193, 194, 231, 386, 387, 401, 402]) &&
        (equals("event.ResultStatus", 2) || equals("event.ResultStatus", "Failure"))
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: >-
        !oneOf("event.RecordType", [41, 188, 189, 190, 191, 192, 193, 194, 231, 386, 387, 401, 402]) &&
        equals("event.ResultStatus", "Blocked")
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: >-
        oneOf("event.RecordType", [188, 189, 190, 191, 192, 193, 194, 231, 386, 387, 401, 402]) &&
        (equals("event.ResultStatus", 3) || equals("event.ResultStatus", "AuthorizationFailure"))
  # These exact operation names describe prevented user access, not successful
  # administrative changes to a blocking policy.
  - add:
      function: string
      params:
        key: actionResult
        value: denied
      where: >-
        oneOf("action", ["SharingInvitationBlocked", "UnmanagedSyncClientBlocked", "URLNavigationBlocked", "AccessRequestDenied"]) ||
        (equals("event.RecordType", 41) && equals("event.URLClickAction", 2))
  # KmsiInterrupt is the expected "Keep me signed in" prompt, not a final result.
  - delete:
      fields:
      - actionResult
      where: >-
        equals("event.RecordType", 15) &&
        (equals("event.ErrorCode", 50140) || equals("event.ErrorNumber", 50140))
  # A failed login wins even when its HTTP request or audit operation succeeded.
  - add:
      function: string
      params:
        key: actionResult
        value: failure
      where: equals("action", "UserLoginFailed")
  - dynamic:
      plugin: com.utmstack.geolocation
      params:
        source: origin.ip
        destination: origin.geolocation
      where: exists("origin.ip")
  - rename:
      from:
      - event.ActorIpAddress
      to: origin.ip
      where: equals("event.Workload", "AzureActiveDirectory")
  - rename:
      from:
      - event.Target.4.ID
      to: target.user
      where: equals("event.Workload", "AzureActiveDirectory") && equals("event.Target.2.ID", "User") && equals("event.Target.4.Type", 5)
  - rename:
      from:
      - event.MailboxOwnerUPN
      to: target.user
      where: exists("event.MailboxOwnerUPN")
  - rename:
      from:
      - event.ClientProcessName
      to: origin.process
      where: exists("event.ClientProcessName")
  - rename:
      from:
      - event.SiteUrl
      to: target.url
      where: exists("event.SiteUrl")
  - rename:
      from:
      - event.SourceRelativeUrl
      to: target.path
      where: exists("event.SourceRelativeUrl")
  - rename:
      from:
      - event.DestinationRelativeUrl
      to: target.path
      where: exists("event.DestinationRelativeUrl")
  - rename:
      from:
      - event.SourceFileName
      to: target.filename
      where: exists("event.SourceFileName")
  - rename:
      from:
      - event.DestinationFileName
      to: target.filename
      where: exists("event.DestinationFileName")
  - rename:
      from:
      - event.ItemName
      to: target.filename
      where: equals("event.Workload", "OneDrive") || equals("event.Workload", "SharePoint")
  # Safe Links supplies the clicking user's IP and destination URL under its own
  # documented fields. Copy them so vendor-specific queries retain the originals.
  - grok:
      source: event.UserIp
      patterns:
      - fieldName: origin.ip
        pattern: (?s:.*)
      where: >-
        equals("event.RecordType", 41) &&
        (inCIDR("event.UserIp", "0.0.0.0/0") || inCIDR("event.UserIp", "::/0")) &&
        !inCIDR("event.UserIp", "0.0.0.0/32") && !inCIDR("event.UserIp", "::/128")
  - grok:
      source: event.URL
      patterns:
      - fieldName: target.url
        pattern: (?s:.*)
      where: equals("event.RecordType", 41) && regexMatch("event.URL", "(?s)^.+$")
  - delete:
      fields:
      - event.AppAccessContext
