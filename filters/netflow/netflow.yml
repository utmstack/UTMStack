            - event.srcMask
            - event.tcpFlags
            - event.dstAs
            - event.srcAs
            - event.dstPort
            - event.proto
            - event.protocol
            - event.irrelevant
            - event.irrelevant1
            - event.irrelevant2
            - event.irrelevant3
            - event.irrelevant4
            - event.irrelevant5
            - event.irrelevant6
            - event.irrelevant7
            - event.irrelevant8
            - event.irrelevant9
            - event.irrelevant10
            - event.irrelevant11