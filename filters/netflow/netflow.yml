# Netflow firewall module filter, version 3.1.2
# Based in docs and Netflow Generator (Solarwinds) for send log
# 
# Documentations
# 1- https://www.cisco.com/en/US/technologies/tk648/tk362/technologies_white_paper09186a00800a3db9.html 
# 2- http://www.iana.org/assignments/ipfix/ipfix.xhtml 
# 3- https://helpdesk.kaseya.com/hc/en-gb/articles/115003522631-How-to-view-NetFlow-in-WireShark 
# 4- https://www.solarwinds.com/free-tools/
# 
# Implementation
# 1. Parsing the RAW field containing the Netflow
pipeline:
  - dataTypes:
      - netflow
    steps:

      # Using the kv filter with default config, usefull in key-value logs
      - kv:
          fieldSplit: " "
          valueSplit: "="

      # Remove fields that have issues with kv filter
      - delete:
          fields:
            - event.msg
      
      # Using grok to parse kv issued fields
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}(msg=)'
            - fieldName: event.msg
              pattern: '{{.data}}({{.word}}=)'
            - fieldName: event.irrelevant
              pattern: '{{.greedy}}'
          source: event.kvMessage

      # Using grok to remove irrelevant data
      - grok:
          patterns:
            - fieldName: event.msg
              pattern: '{{.greedy}}{{.space}}'
            - fieldName: event.irrelevant
              pattern: '{{.word}}(=)'
          source: event.msg

      # Using grok to parse fields that have issues with kv filter
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: '{{.data}}bytes="\['
            - fieldName: event.totalBytes
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant1
              pattern: '{{.data}}packets="\['
            - fieldName: event.totalPackets
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant2
              pattern: '{{.data}}inEth="\['
            - fieldName: event.inEthernet
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant3
              pattern: '{{.data}}outEth="\['
            - fieldName: event.outEthernet
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant4
              pattern: '{{.data}}proto="/\['
            - fieldName: event.protocol
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant5
              pattern: '{{.data}}srcPort="\['
            - fieldName: event.srcPortg
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant6
              pattern: '{{.data}}dstPort="\['
            - fieldName: event.dstPortg
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant7
              pattern: '{{.data}}dstMask="\['
            - fieldName: event.destMask
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant8
              pattern: '{{.data}}srcMask="\['
            - fieldName: event.sourceMask
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant9
              pattern: '{{.data}}tcpFlags="\['
            - fieldName: event.tcpFlgs
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant10
              pattern: '{{.data}}dstAs="\['
            - fieldName: event.destAs
              pattern: '{{.data}}\]"'
          source: raw

      - grok:
          patterns:
            - fieldName: event.irrelevant11
              pattern: '{{.data}}srcAs="\['
            - fieldName: event.sourceAs
              pattern: '{{.data}}\]"'
          source: raw

      # Rename filds
      - rename:
          from:
            - event.srcIp
          to: origin.ip
      - rename:
          from:
            - event.dstIp
          to: target.ip
      - rename:
          from:
            - event.src_ip
          to: origin.ip
      - rename:
          from:
            - event.dest_ip
          to: target.ip
              
      # Remove unused caracters and estandarize fields
      - trim:
          function: prefix
          substring: '"'
          fields:
            - event.bytesIn
            - event.bytesOut
            - event.exporter
            - event.first
            - event.last
            - event.nextHop
            - event.packetsIn
            - event.packetsOut
            - event.version
            - target.ip
            - origin.ip

      - trim:
          function: suffix
          substring: '"'
          fields:
            - event.bytesIn
            - event.bytesOut
            - event.exporter
            - event.first
            - event.last
            - event.nextHop
            - event.packetsIn
            - event.packetsOut
            - event.version
            - target.ip
            - origin.ip

      - trim:
          function: suffix
          substring: ']"'
          fields:
            - event.totalBytes
            - event.totalPackets
            - event.inEthernet
            - event.outEthernet
            - event.protocol
            - event.srcPortg
            - event.src_port
            - event.dstPortg
            - event.dest_port
            - event.destMask
            - event.sourceMask
            - event.tcpFlgs
            - event.destAs
            - event.sourceAs

      - trim:
          function: prefix
          substring: '0'
          fields:
            - event.srcPortg
            - event.src_port
            - event.dstPortg
            - event.dest_port

      - trim: 
          function: substring
          substring: " "
          fields:
            - event.srcPortg
            - event.src_port
            - event.dstPortg
            - event.dest_port

      # Fields conversions
      - cast:
          to: 'int'
          fields:
            - event.srcPortg
            - event.src_port
            - event.dstPortg
            - event.dest_port

      # Rename fields to fields base
      - rename:
          from:
            - event.srcPortg
          to: origin.port
      - rename:
          from:
            - event.src_port
          to: origin.port
      - rename:
          from:
            - event.dstPortg
          to: target.port
      - rename:
          from:
            - event.dest_port
          to: target.port

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Adding protocol field based on IANA protocol numbers
      - add:
          function: "string"
          params:
            key: protocol
            value: "HOPOPT"
          where: equals("event.protocol", "0")
      - add:
          function: "string"
          params:
            key: protocol
            value: "ICMP"
          where: equals("event.protocol", "1")
      - add:
