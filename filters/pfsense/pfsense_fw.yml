# PfSense Firewall filter, version 3.2.0
# Based on docs and samples log provided
# Support CSV format  format
#
# Documentations
# 1- https://docs.netgate.com/pfsense/en/latest/monitoring/logs/raw-filter-format.html
#
# Implementation
# 1. Parsing the RAW field containing the PfSense
# 2. Parsing headers of syslog the message 
# 3. Parsing the CSV field containing the PfSense

pipeline:
  - dataTypes:
      - firewall-pfsense
    steps:
      #......................................................................#
      #......................................................................#
      # Using grok to parse syslogHeader of the message
      #......................................................................#
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.integer}}\>'
            - fieldName: event.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: event.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}(?:T|{{.space}}){{.time}}{{.iso8601Timezone}}'
            - fieldName: event.syslogHost
              pattern: '{{.hostname}}'
            - fieldName: event.msgAll
              pattern: '{{.greedy}}'
          source: raw
          where: regexMatch("raw", "\\d{4}-\\d{2}-\\d{2}")

      #......................................................................#
      # Parsing syslog format date (OPNsense/pfSense) — BSD WITH hostname
      #......................................................................#
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.integer}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}{{.space}}'
            - fieldName: event.syslogHost
              pattern: '{{.hostname}}{{.space}}'
            - fieldName: event.msgAll
              pattern: '{{.greedy}}'
          source: raw
          where: regexMatch("raw", "<\\d+>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2}\\s+\\S+\\s+\\S+[\\[:]")

      #......................................................................#
      # Parsing syslog format date (OPNsense/pfSense) — BSD WITHOUT hostname
      #......................................................................#
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.integer}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}{{.space}}'
            - fieldName: event.msgAll
              pattern: '{{.greedy}}'
          source: raw
          where: regexMatch("raw", "<\\d+>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2}\\s+[^\\s\\[:]+[\\[:]")

      #......................................................................#
      # Removing unnecessary characters of the syslogHeader
      #......................................................................#
      - trim:
          function: prefix
          substring: "<"
          fields:
            - event.priority
      - trim:
          function: suffix
          substring: ">"
          fields:
            - event.priority

      #......................................................................#
      # Checking that the msgAll field exists
      #......................................................................#
      - grok:
          patterns:
            - fieldName: event.eventType
              pattern: '{{.word}}'
            - fieldName: event.pid
              pattern: '(\[)?({{.integer}}?)(\])?\s*(- -|:)'
            - fieldName: event.csvMsg
              pattern: '{{.greedy}}'
          source: event.msgAll

      # webConfigurator sign-in lines come from php-fpm; the step above does not
      # read a program name with a hyphen, so these lines get their own step
      - grok:
          patterns:
            - fieldName: event.eventType
              pattern: 'php-fpm'
            - fieldName: event.pid
              pattern: '(\[)?({{.integer}}?)(\])?\s*(- -|:)'
            - fieldName: event.csvMsg
              pattern: '{{.greedy}}'
          source: event.msgAll
          where: '!exists("event.eventType") && regexMatch("event.msgAll", "^php-fpm(\\[\\d+\\]:| \\d+ - -) \\S+: (Successful login|webConfigurator authentication error) for user ")'

      #......................................................................#
      # Removing unnecessary characters
      #......................................................................#
      - trim:
          function: prefix
          substring: "["
          fields:
            - event.pid
      - trim:
          function: suffix
          substring: "]:"
          fields:
            - event.pid
      - trim:
          function: suffix
          substring: " - -"
          fields:
            - event.pid

      # ..........................................................................#
      # Remove issues fileds
      # ..........................................................................#
      - delete:
          fields:
            - event.msgAll
      
      #......................................................................#
      # Using csv to parse the message
      #......................................................................#      
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv4Tos
            - event.ipv4Ecn
            - event.ipv4Ttl
            - event.ipv4Id
            - event.ipv4Offset
            - event.ipv4Flags
            - event.ipv4ProtocolId
            - event.proto
            - event.ipLength
            - event.srcIp
            - event.dstIp
            - event.srcPort
            - event.dstPort
            - event.dataLength
            - event.tcpFlags
            - event.sequenceNumber
            - event.ackNumber
            - event.tcpWindow
            - event.urg
            - event.tcpOptions
          where: regexMatch("event.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){7}(?i:tcp),(?:[^,]*,){11}")

      # .......................................................................#
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv4Tos
            - event.ipv4Ecn
            - event.ipv4Ttl
            - event.ipv4Id
            - event.ipv4Offset
            - event.ipv4Flags
            - event.ipv4ProtocolId
            - event.proto
            - event.ipLength
            - event.srcIp
            - event.dstIp
            - event.srcPort
            - event.dstPort
            - event.dataLength
          where: regexMatch("event.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){7}(?i:udp),(?:[^,]*,){5}")

      #......................................................................#
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv4Tos
            - event.ipv4Ecn
            - event.ipv4Ttl
            - event.ipv4Id
            - event.ipv4Offset
            - event.ipv4Flags
            - event.ipv4ProtocolId
            - event.proto
            - event.ipLength
            - event.srcIp
            - event.dstIp
            - event.icmpType
            - event.icmpData1
          where: regexMatch("event.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){7}(?i:icmp),(?:[^,]*,){4}")

      #......................................................................#
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv6Class
            - event.ipv6FlowLabel
            - event.ipv6HopLimit
            - event.proto
            - event.ipv6ProtocolId
            - event.ipLength
            - event.srcIp
            - event.dstIp
            - event.srcPort
            - event.dstPort
            - event.dataLength
            - event.tcpFlags
            - event.sequenceNumber
            - event.ackNumber
            - event.tcpWindow
            - event.urg
            - event.tcpOptions
          where: regexMatch("event.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){3}(?i:tcp),(?:[^,]*,){12}")
      
      #......................................................................#
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv6Class
            - event.ipv6FlowLabel
            - event.ipv6HopLimit
            - event.proto
            - event.ipv6ProtocolId
            - event.ipLength
            - event.srcIp
            - event.dstIp
            - event.srcPort
            - event.dstPort
            - event.dataLength
          where: regexMatch("event.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){3}(?i:udp),(?:[^,]*,){6}")

      #......................................................................#
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv6Class
            - event.ipv6FlowLabel
            - event.ipv6HopLimit
            - event.proto
            - event.ipv6ProtocolId
            - event.ipLength
            - event.srcIp
            - event.dstIp
            - event.icmpType
          where: regexMatch("event.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){3}(?i:icmp6|icmpv6|ipv6-icmp|icmp),(?:[^,]*,){4}")

      # The CSV step fails when a line has fewer columns than headers, so each
      # step above also requires its column count. For any other protocol, or a
      # shorter line, read the common columns and the addresses.
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv4Tos
            - event.ipv4Ecn
            - event.ipv4Ttl
            - event.ipv4Id
            - event.ipv4Offset
            - event.ipv4Flags
            - event.ipv4ProtocolId
            - event.proto
            - event.ipLength
            - event.srcIp
            - event.dstIp
          where: 'regexMatch("event.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){10}") && !exists("event.action")'
      - csv:
          source: event.csvMsg
          separator: ","
          headers:
            - event.ruleNumber
            - event.subRuleNumber
            - event.anchor
            - event.tracker
            - event.realInterface
            - event.reason
            - event.action
            - event.direction
            - event.ipVersion
            - event.ipv6Class
            - event.ipv6FlowLabel
            - event.ipv6HopLimit
            - event.proto
            - event.ipv6ProtocolId
            - event.ipLength
            - event.srcIp
            - event.dstIp
          where: 'regexMatch("event.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){7}") && !exists("event.action")'
      # ................................................#
      # Rename fields
      # ................................................#
      - rename:
          from:
            - event.action
          to: action

      - rename:
          from:
            - event.proto
          to: protocol

      - rename:
          from:
            - event.srcIp
          to: origin.ip

      - rename:
          from:
            - event.dstIp
          to: target.ip

      - rename:
          from:
            - event.srcPort
          to: origin.port

      - rename:
          from:
            - event.dstPort
          to: target.port

      # ................................................#
      # Sign-in outcomes outside filterlog. An address is read only together
      # with the outcome the same line states.
      # ................................................#
      # webConfigurator: "/index.php: Successful login for user 'admin' from: 192.0.2.10 (Local Database)"
      # and "/index.php: webConfigurator authentication error for user 'admin' from: 192.0.2.10"
      - grok:
          patterns:
            - fieldName: ''
              pattern: '[^\s:]+:'
            - fieldName: event.authEvent
              pattern: '(?:webConfigurator authentication error|Successful login)'
            - fieldName: ''
              pattern: 'for user'
            - fieldName: origin.user
              pattern: '''[^'']*'''
            - fieldName: ''
              pattern: 'from:'
            - fieldName: origin.ip
              pattern: '(?:{{.ipv4}}|{{.ipv6}})(?:\s|$)'
          source: event.csvMsg
          where: 'equals("event.eventType", "php-fpm") && regexMatch("event.csvMsg", "^\\S+: (webConfigurator authentication error|Successful login) for user ''")'
      # sshd: "Failed password for [invalid user ]root from 192.0.2.10 port 2276 ssh2"
      # and "Accepted publickey for admin from 192.0.2.10 port 50000 ssh2"
      - grok:
          patterns:
            - fieldName: event.authEvent
              pattern: '(?:Failed|Accepted)'
            - fieldName: event.authMethod
              pattern: '\S+'
            - fieldName: ''
              pattern: 'for(?: invalid user)?'
            - fieldName: origin.user
              pattern: '\S+'
            - fieldName: ''
              pattern: 'from'
            - fieldName: origin.ip
              pattern: '(?:{{.ipv4}}|{{.ipv6}})(?:\s|$)'
            - fieldName: ''
              pattern: 'port'
            - fieldName: origin.port
              pattern: '{{.integer}}(?:\s|$)'
          source: event.csvMsg
          where: 'equals("event.eventType", "sshd") && regexMatch("event.csvMsg", "^(Failed|Accepted) \\S+ for (invalid user )?\\S+ from \\S+ port \\d+")'
      # sshguard block: 'Blocking "192.0.2.10/32" for 120 secs (3 attacks in 0 secs, ...)'.
      # "Attack from" lines are detections without an outcome and get no address.
      - grok:
          patterns:
            - fieldName: event.sshguardAction
              pattern: 'Blocking'
            - fieldName: ''
              pattern: '"'
            - fieldName: origin.ip
              pattern: '(?:{{.ipv4}}|{{.ipv6}})'
            - fieldName: ''
              pattern: '(?:/\d+)?"'
          source: event.csvMsg
          where: 'equals("event.eventType", "sshguard") && regexMatch("event.csvMsg", "^Blocking \"[0-9A-Fa-f.:]+(/\\d+)?\" for ")'
      # OpenVPN user authentication (the line names no address):
      # "user 'bob' authenticated" and "user 'bob' could not authenticate."
      - grok:
          patterns:
            - fieldName: ''
              pattern: 'user'
            - fieldName: origin.user
              pattern: '''[^'']*'''
            - fieldName: event.authEvent
              pattern: '(?:authenticated|could not authenticate)'
          source: event.csvMsg
          where: 'equals("event.eventType", "openvpn") && regexMatch("event.csvMsg", "^user ''[^'']*'' (authenticated|could not authenticate)")'
      - trim:
          function: prefix
          substring: "'"
          fields:
            - origin.user
      - trim:
          function: suffix
          substring: "'"
          fields:
            - origin.user

      # ................................................#
      # Adding action result: only success, failed or denied, or nothing when
      # the line states no outcome. The add step overwrites, so the order is
      # success, failed, denied. filterlog logs nothing after a pass, so a pass
      # gives success.
      # ................................................#
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'equalsIgnoreCase("action", "pass")'
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'oneOf("event.eventType", ["php-fpm", "sshd", "openvpn"]) && exists("event.authEvent") && oneOf("event.authEvent", ["Successful login", "Accepted", "authenticated"])'
      - add:
          function: string
          params:
            key: actionResult
            value: failed
          where: 'oneOf("event.eventType", ["php-fpm", "sshd", "openvpn"]) && exists("event.authEvent") && oneOf("event.authEvent", ["webConfigurator authentication error", "Failed", "could not authenticate"])'
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: 'equalsIgnoreCase("action", "block")'
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: 'equals("event.eventType", "sshguard") && equals("event.sshguardAction", "Blocking")'

      # ................................................#
      # Fileds conversions
      # ................................................#
      - cast:
          fields:
            - origin.port
            - target.port
          to: int

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # ..........................................................................#
      # Remove issues fileds
      # ..........................................................................#
      - delete:
          fields:
            - event.csvMsg