# PfSense Firewall filter, version 3.1.0
# Based on docs and samples log provided
# Support CSV format  format
#
# Documentations
# 1- https://docs.netgate.com/pfsense/en/latest/monitoring/logs/raw-filter-format.html
#
# Implementation
# 1. Parsing the RAW field containing the PfSense
# 2. Parsing headers of syslog the message 
# 3. Parsing the CSV field containing the PfSense

pipeline:
  - dataTypes:
      - firewall-pfsense
    steps:
      #......................................................................#
      #......................................................................#
      # Using grok to parse syslogHeader of the message
      #......................................................................#
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.integer}}\>'
            - fieldName: log.syslogVersion
              pattern: '{{.integer}}'
            - fieldName: log.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}(?:T|{{.space}}){{.time}}{{.iso8601Timezone}}'
            - fieldName: log.syslogHost
              pattern: '{{.hostname}}'
            - fieldName: log.msgAll
              pattern: '{{.greedy}}'
          source: raw
          where: regexMatch("raw", "\\d{4}-\\d{2}-\\d{2}")

      #......................................................................#
      # Parsing syslog format date (OPNsense/pfSense) — BSD WITH hostname
      #......................................................................#
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.integer}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}{{.space}}'
            - fieldName: log.syslogHost
              pattern: '{{.hostname}}{{.space}}'
            - fieldName: log.msgAll
              pattern: '{{.greedy}}'
          source: raw
          where: regexMatch("raw", "<\\d+>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2}\\s+\\S+\\s+\\S+[\\[:]")

      #......................................................................#
      # Parsing syslog format date (OPNsense/pfSense) — BSD WITHOUT hostname
      #......................................................................#
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.integer}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.monthName}}{{.space}}{{.monthDay}}{{.space}}{{.time}}{{.space}}'
            - fieldName: log.msgAll
              pattern: '{{.greedy}}'
          source: raw
          where: regexMatch("raw", "<\\d+>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2}\\s+[^\\s\\[:]+[\\[:]")

      #......................................................................#
      # Removing unnecessary characters of the syslogHeader
      #......................................................................#
      - trim:
          function: prefix
          substring: "<"
          fields:
            - log.priority
      - trim:
          function: suffix
          substring: ">"
          fields:
            - log.priority

      #......................................................................#
      # Checking that the msgAll field exists
      #......................................................................#
      - grok:
          patterns:
            - fieldName: log.eventType
              pattern: '{{.word}}'
            - fieldName: log.pid
              pattern: '(\[)?({{.integer}}?)(\])?\s*(- -|:)'
            - fieldName: log.csvMsg
              pattern: '{{.greedy}}'
          source: log.msgAll

      #......................................................................#
      # Removing unnecessary characters
      #......................................................................#
      - trim:
          function: prefix
          substring: "["
          fields:
            - log.pid
      - trim:
          function: suffix
          substring: "]:"
          fields:
            - log.pid
      - trim:
          function: suffix
          substring: " - -"
          fields:
            - log.pid

      # ..........................................................................#
      # Remove issues fileds
      # ..........................................................................#
      - delete:
          fields:
            - log.msgAll
      
      #......................................................................#
      # Using csv to parse the message
      #......................................................................#      
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv4Tos
            - log.ipv4Ecn
            - log.ipv4Ttl
            - log.ipv4Id
            - log.ipv4Offset
            - log.ipv4Flags
            - log.ipv4ProtocolId
            - log.proto
            - log.ipLength
            - log.srcIp
            - log.dstIp
            - log.srcPort
            - log.dstPort
            - log.dataLength
            - log.tcpFlags
            - log.sequenceNumber
            - log.ackNumber
            - log.tcpWindow
            - log.urg
            - log.tcpOptions
          where: regexMatch("log.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){7}(?i:tcp),(?:[^,]*,){11}")

      # .......................................................................#
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv4Tos
            - log.ipv4Ecn
            - log.ipv4Ttl
            - log.ipv4Id
            - log.ipv4Offset
            - log.ipv4Flags
            - log.ipv4ProtocolId
            - log.proto
            - log.ipLength
            - log.srcIp
            - log.dstIp
            - log.srcPort
            - log.dstPort
            - log.dataLength
          where: regexMatch("log.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){7}(?i:udp),(?:[^,]*,){5}")

      #......................................................................#
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv4Tos
            - log.ipv4Ecn
            - log.ipv4Ttl
            - log.ipv4Id
            - log.ipv4Offset
            - log.ipv4Flags
            - log.ipv4ProtocolId
            - log.proto
            - log.ipLength
            - log.srcIp
            - log.dstIp
            - log.icmpType
            - log.icmpData1
          where: regexMatch("log.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){7}(?i:icmp),(?:[^,]*,){4}")

      #......................................................................#
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv6Class
            - log.ipv6FlowLabel
            - log.ipv6HopLimit
            - log.proto
            - log.ipv6ProtocolId
            - log.ipLength
            - log.srcIp
            - log.dstIp
            - log.srcPort
            - log.dstPort
            - log.dataLength
            - log.tcpFlags
            - log.sequenceNumber
            - log.ackNumber
            - log.tcpWindow
            - log.urg
            - log.tcpOptions
          where: regexMatch("log.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){3}(?i:tcp),(?:[^,]*,){12}")
      
      #......................................................................#
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv6Class
            - log.ipv6FlowLabel
            - log.ipv6HopLimit
            - log.proto
            - log.ipv6ProtocolId
            - log.ipLength
            - log.srcIp
            - log.dstIp
            - log.srcPort
            - log.dstPort
            - log.dataLength
          where: regexMatch("log.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){3}(?i:udp),(?:[^,]*,){6}")

      #......................................................................#
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv6Class
            - log.ipv6FlowLabel
            - log.ipv6HopLimit
            - log.proto
            - log.ipv6ProtocolId
            - log.ipLength
            - log.srcIp
            - log.dstIp
            - log.icmpType
          where: regexMatch("log.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){3}(?i:icmp6|icmpv6|ipv6-icmp|icmp),(?:[^,]*,){4}")

      # The CSV step fails when a line has fewer columns than headers, so each
      # step above also requires its column count. For any other protocol, or a
      # shorter line, read the common columns and the addresses.
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv4Tos
            - log.ipv4Ecn
            - log.ipv4Ttl
            - log.ipv4Id
            - log.ipv4Offset
            - log.ipv4Flags
            - log.ipv4ProtocolId
            - log.proto
            - log.ipLength
            - log.srcIp
            - log.dstIp
          where: 'regexMatch("log.csvMsg", "^(?:[^,]*,){8}4,(?:[^,]*,){10}") && !exists("log.action")'
      - csv:
          source: log.csvMsg
          separator: ","
          headers:
            - log.ruleNumber
            - log.subRuleNumber
            - log.anchor
            - log.tracker
            - log.realInterface
            - log.reason
            - log.action
            - log.direction
            - log.ipVersion
            - log.ipv6Class
            - log.ipv6FlowLabel
            - log.ipv6HopLimit
            - log.proto
            - log.ipv6ProtocolId
            - log.ipLength
            - log.srcIp
            - log.dstIp
          where: 'regexMatch("log.csvMsg", "^(?:[^,]*,){8}6,(?:[^,]*,){7}") && !exists("log.action")'
      # ................................................#
      # Rename fields
      # ................................................#
      - rename:
          from:
            - log.action
          to: action

      - rename:
          from:
            - log.proto
          to: protocol

      - rename:
          from:
            - log.srcIp
          to: origin.ip

      - rename:
          from:
            - log.dstIp
          to: target.ip

      - rename:
          from:
            - log.srcPort
          to: origin.port

      - rename:
          from:
            - log.dstPort
          to: target.port

      # ................................................#
      # Adding action result
      # ................................................#
      - add:
          function: string
          params:
            key: actionResult
            value: success
          where: 'equalsIgnoreCase("action", "pass")'
      - add:
          function: string
          params:
            key: actionResult
            value: denied
          where: 'equalsIgnoreCase("action", "block")'

      # ................................................#
      # Fileds conversions
      # ................................................#
      - cast:
          fields:
            - origin.port
            - target.port
          to: int

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")
      
      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # ..........................................................................#
      # Remove issues fileds
      # ..........................................................................#
      - delete:
          fields:
            - log.csvMsg