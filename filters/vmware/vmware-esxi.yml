# VMWare-ESXi, version 3.1.0
# 
# Based on docs and real logs provided
# Support VMWare-ESXi log
#
# Documentations
# 1- https://core.vmware.com/esxi-log-message-formats
#
# Implementation
# 1. Parsing headers of syslog the message 
# 2. Parsing the RAW field containing the VMWare-ESXi
pipeline:
  - dataTypes:
      - vmware-esxi
    steps:
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: event.process
              pattern: '{{.hostname}}(\:)'
            - fieldName: severity
              pattern: '{{.word}}'
            - fieldName: event.processName
              pattern: '{{.hostname}}'
            - fieldName: event.pid
              pattern: '\[{{.data}}\]'
            - fieldName: event.eventInfo
              pattern: '\[{{.data}}\]'
            - fieldName: event.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: event.process
              pattern: '{{.hostname}}'
            - fieldName: event.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: event.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}T{{.time}}Z'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: event.process
              pattern: '{{.hostname}}'
            - fieldName: event.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: event.originIdComponent
              pattern: '\[{{.data}}\]'
            - fieldName: event.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: event.moduleIdentifier
              pattern: '\[{{.data}}\@'
            - fieldName: event.irrelevant
              pattern: '{{.data}}\='
            - fieldName: event.subModuleIdentifier
              pattern: '{{.word}}\]'
          source: event.originIdComponent

      - grok:
          patterns:
            - fieldName: event.irrelevant2
              pattern: '{{.data}}level{{.space}}='
            - fieldName: event.level
              pattern: '{{.integer}}'
          source: event.message
              
      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - event.priority
      - trim:
          function: prefix
          substring: '['
          fields:
            - event.pid
            - event.eventInfo
            - event.moduleIdentifier
      - trim:
          function: prefix
          substring: '-'
          fields:
            - event.message
      - trim:
          function: suffix
          substring: '>'
          fields:
            - event.priority
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.pid
            - event.process
      - trim:
          function: suffix
          substring: ']'
          fields:
            - event.pid
            - event.eventInfo
            - event.subModuleIdentifier
      - trim:
          function: suffix
          substring: '-'
          fields:
            - event.message
      - trim:
          function: suffix
          substring: '@'
          fields:
            - event.moduleIdentifier
                    
      # ESXi records a completed vSphere session as
      # "Event <n> : User <user>@<address> logged in as <client>". The address is
      # the client that signed in, so it is the origin. A user name can contain @,
      # so the user ends at the last @ before the address.
      - grok:
          patterns:
            - fieldName: event.loginEvent
              pattern: 'Event [0-9]+ : User'
            - fieldName: event.loginUser
              pattern: '\S+@'
            - fieldName: event.loginAddress
              pattern: '[0-9A-Fa-f:.]+'
            - fieldName: event.loginClient
              pattern: 'logged in as .+'
          source: event.message
          where: 'contains("event.message", " logged in as ")'
      - trim:
          function: suffix
          substring: '@'
          fields:
            - event.loginUser
      - rename:
          from:
            - event.loginUser
          to: origin.user
      - rename:
          from:
            - event.loginAddress
          to: origin.ip
          where: '(inCIDR("event.loginAddress", "0.0.0.0/0") || inCIDR("event.loginAddress", "::/0")) && !inCIDR("event.loginAddress", "0.0.0.0/32") && !inCIDR("event.loginAddress", "::/128")'

      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: "failure"
          where: 'exists("event.message") && contains("event.message", "authentication failed")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failure"
          where: 'exists("event.message") && contains("event.message", "authentication of user") && contains("event.message", "failed") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("event.message") && contains("event.message", "permission denied") && !exists("actionResult")'

      # A completed session is a successful sign-in unless an explicit failure
      # or denial was already recorded. Logouts and password checks set no result.
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'exists("event.loginClient") && !exists("actionResult")'

      # Removing unused fields
      - delete:
          fields:
            - event.processName
            - event.irrelevant
            - event.loginEvent
            - event.loginUser
            - event.loginAddress
            - event.loginClient