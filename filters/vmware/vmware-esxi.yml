# VMWare-ESXi, version 3.1.0
# 
# Based on docs and real logs provided
# Support VMWare-ESXi log
#
# Documentations
# 1- https://core.vmware.com/esxi-log-message-formats
#
# Implementation
# 1. Parsing headers of syslog the message 
# 2. Parsing the RAW field containing the VMWare-ESXi
pipeline:
  - dataTypes:
      - vmware-esxi
    steps:
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}(\:)'
            - fieldName: severity
              pattern: '{{.word}}'
            - fieldName: log.processName
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]'
            - fieldName: log.eventInfo
              pattern: '\[{{.data}}\]'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}T{{.time}}Z'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: log.originIdComponent
              pattern: '\[{{.data}}\]'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.moduleIdentifier
              pattern: '\[{{.data}}\@'
            - fieldName: log.irrelevant
              pattern: '{{.data}}\='
            - fieldName: log.subModuleIdentifier
              pattern: '{{.word}}\]'
          source: log.originIdComponent

      - grok:
          patterns:
            - fieldName: log.irrelevant2
              pattern: '{{.data}}level{{.space}}='
            - fieldName: log.level
              pattern: '{{.integer}}'
          source: log.message
              
      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.priority
      - trim:
          function: prefix
          substring: '['
          fields:
            - log.pid
            - log.eventInfo
            - log.moduleIdentifier
      - trim:
          function: prefix
          substring: '-'
          fields:
            - log.message
      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.priority
      - trim:
          function: suffix
          substring: ':'
          fields:
            - log.pid
            - log.process
      - trim:
          function: suffix
          substring: ']'
          fields:
            - log.pid
            - log.eventInfo
            - log.subModuleIdentifier
      - trim:
          function: suffix
          substring: '-'
          fields:
            - log.message
      - trim:
          function: suffix
          substring: '@'
          fields:
            - log.moduleIdentifier
                    
      # ESXi records a completed vSphere session as
      # "Event <n> : User <user>@<address> logged in as <client>". The address is
      # the client that signed in, so it is the origin. A user name can contain @,
      # so the user ends at the last @ before the address.
      - grok:
          patterns:
            - fieldName: log.loginEvent
              pattern: 'Event [0-9]+ : User'
            - fieldName: log.loginUser
              pattern: '\S+@'
            - fieldName: log.loginAddress
              pattern: '[0-9A-Fa-f:.]+'
            - fieldName: log.loginClient
              pattern: 'logged in as .+'
          source: log.message
          where: 'contains("log.message", " logged in as ")'
      - trim:
          function: suffix
          substring: '@'
          fields:
            - log.loginUser
      - rename:
          from:
            - log.loginUser
          to: origin.user
      - rename:
          from:
            - log.loginAddress
          to: origin.ip
          where: '(inCIDR("log.loginAddress", "0.0.0.0/0") || inCIDR("log.loginAddress", "::/0")) && !inCIDR("log.loginAddress", "0.0.0.0/32") && !inCIDR("log.loginAddress", "::/128")'

      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: "failure"
          where: 'exists("log.message") && contains("log.message", "authentication failed")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failure"
          where: 'exists("log.message") && contains("log.message", "authentication of user") && contains("log.message", "failed") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("log.message") && contains("log.message", "permission denied") && !exists("actionResult")'

      # A completed session is a successful sign-in unless an explicit failure
      # or denial was already recorded. Logouts and password checks set no result.
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'exists("log.loginClient") && !exists("actionResult")'

      # Removing unused fields
      - delete:
          fields:
            - log.processName
            - log.irrelevant
            - log.loginEvent
            - log.loginUser
            - log.loginAddress
            - log.loginClient