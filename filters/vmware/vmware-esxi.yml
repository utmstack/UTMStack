# VMWare-ESXi, version 3.2.0
# 
# Based on docs and real logs provided
# Support VMWare-ESXi log
#
# Documentations
# 1- https://core.vmware.com/esxi-log-message-formats
#
# Implementation
# 1. Parsing headers of syslog the message 
# 2. Parsing the RAW field containing the VMWare-ESXi
pipeline:
  - dataTypes:
      - vmware-esxi
    steps:
      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: event.process
              pattern: '{{.hostname}}(\:)'
            - fieldName: severity
              pattern: '{{.word}}'
            - fieldName: event.processName
              pattern: '{{.hostname}}'
            - fieldName: event.pid
              pattern: '\[{{.data}}\]'
            - fieldName: event.eventInfo
              pattern: '\[{{.data}}\]'
            - fieldName: event.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: event.process
              pattern: '{{.hostname}}'
            - fieldName: event.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: event.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: event.priority
              pattern: '\<{{.data}}\>'
            - fieldName: event.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}T{{.time}}Z'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: event.process
              pattern: '{{.hostname}}'
            - fieldName: event.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: event.originIdComponent
              pattern: '\[{{.data}}\]'
            - fieldName: event.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: event.moduleIdentifier
              pattern: '\[{{.data}}\@'
            - fieldName: event.irrelevant
              pattern: '{{.data}}\='
            - fieldName: event.subModuleIdentifier
              pattern: '{{.word}}\]'
          source: event.originIdComponent

      - grok:
          patterns:
            - fieldName: event.irrelevant2
              pattern: '{{.data}}level{{.space}}='
            - fieldName: event.level
              pattern: '{{.integer}}'
          source: event.message
              
      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - event.priority
      - trim:
          function: prefix
          substring: '['
          fields:
            - event.pid
            - event.eventInfo
            - event.moduleIdentifier
      - trim:
          function: prefix
          substring: '-'
          fields:
            - event.message
      - trim:
          function: suffix
          substring: '>'
          fields:
            - event.priority
      - trim:
          function: suffix
          substring: ':'
          fields:
            - event.pid
            - event.process
      - trim:
          function: suffix
          substring: ']'
          fields:
            - event.pid
            - event.eventInfo
            - event.subModuleIdentifier
      - trim:
          function: suffix
          substring: '-'
          fields:
            - event.message
      - trim:
          function: suffix
          substring: '@'
          fields:
            - event.moduleIdentifier
                    
      # ESXi records a completed vSphere session as
      # "Event <n> : User <user>@<address> logged in as <client>". The address is
      # the client that signed in, so it is the origin. A user name can contain @,
      # so the user ends at the last @ before the address.
      - grok:
          patterns:
            - fieldName: event.loginEvent
              pattern: 'Event [0-9]+ : User'
            - fieldName: event.loginUser
              pattern: '\S+@'
            - fieldName: event.loginAddress
              pattern: '[0-9A-Fa-f:.]+'
            - fieldName: event.loginClient
              pattern: 'logged in as .+'
          source: event.message
          where: 'contains("event.message", " logged in as ")'
      - trim:
          function: suffix
          substring: '@'
          fields:
            - event.loginUser
      - rename:
          from:
            - event.loginUser
          to: origin.user
      - rename:
          from:
            - event.loginAddress
          to: origin.ip
          where: '(inCIDR("event.loginAddress", "0.0.0.0/0") || inCIDR("event.loginAddress", "::/0")) && !inCIDR("event.loginAddress", "0.0.0.0/32") && !inCIDR("event.loginAddress", "::/128")'

      # A refused vSphere sign-in is recorded as
      # "Event <n> : Cannot login [user ]<user>@<address>[: <reason>]" (sometimes just
      # "Event <n> : Cannot login"). It is the event for the attempt; the paired
      # "Rejected password for user ..." line is the password check and keeps no result,
      # like "Accepted password" does for a completed session.
      - grok:
          patterns:
            - fieldName: event.failEvent
              pattern: 'Event [0-9]+ : Cannot login( user\s)?'
            - fieldName: event.failUser
              pattern: '\S+@'
            - fieldName: event.failAddress
              pattern: '[0-9A-Fa-f:.]*[0-9A-Fa-f]'
          source: event.message
          where: 'regexMatch("event.message", "^Event [0-9]+ : Cannot login ")'
      - trim:
          function: suffix
          substring: '@'
          fields:
            - event.failUser
      - rename:
          from:
            - event.failUser
          to: origin.user
      - rename:
          from:
            - event.failAddress
          to: origin.ip
          where: '(inCIDR("event.failAddress", "0.0.0.0/0") || inCIDR("event.failAddress", "::/0")) && !inCIDR("event.failAddress", "0.0.0.0/32") && !inCIDR("event.failAddress", "::/128")'

      # SSH sign-ins, one sshd line per attempt:
      # "Accepted <method> for <user> from <address> port <n> ..." for a completed sign-in and
      # "error: PAM: Authentication failure for [illegal user ]<user> from <address>" for a
      # refused password (ESXi signs in through keyboard-interactive/PAM). The other lines of
      # the same attempt (pam_unix, "SSH session was opened", "SSH login has failed") keep no
      # result and no address, so each attempt is counted once.
      - grok:
          patterns:
            - fieldName: event.authResult
              pattern: 'Accepted'
            - fieldName: event.authMethod
              pattern: '\S+'
            - fieldName: event.irrelevant
              pattern: 'for'
            - fieldName: event.sshUser
              pattern: '\S+'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: event.sshAddress
              pattern: '[0-9A-Fa-f:.]*[0-9A-Fa-f]'
            - fieldName: event.irrelevant
              pattern: 'port'
          source: event.message
          where: 'equals("event.process", "sshd") && regexMatch("event.message", "^Accepted \\S+ for \\S+ from \\S+ port [0-9]+")'
      - grok:
          patterns:
            - fieldName: event.irrelevant
              pattern: 'error: PAM: Authentication failure for( illegal user\s)?'
            - fieldName: event.sshUser
              pattern: '\S+'
            - fieldName: event.irrelevant
              pattern: 'from'
            - fieldName: event.sshAddress
              pattern: '\S+'
          source: event.message
          where: 'equals("event.process", "sshd") && regexMatch("event.message", "^error: PAM: Authentication failure for \\S+( \\S+ \\S+)? from \\S+$")'
      - rename:
          from:
            - event.sshUser
          to: origin.user
      - rename:
          from:
            - event.sshAddress
          to: origin.ip
          where: '(inCIDR("event.sshAddress", "0.0.0.0/0") || inCIDR("event.sshAddress", "::/0")) && !inCIDR("event.sshAddress", "0.0.0.0/32") && !inCIDR("event.sshAddress", "::/128")'

      # Adding action result: only success, failed or denied, or nothing when the record
      # states no final outcome. The first value wins (each later step checks
      # !exists("actionResult")), so failed and denied run before the success steps.
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("event.message") && contains("event.message", "authentication failed")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("event.message") && contains("event.message", "authentication of user") && contains("event.message", "failed") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("event.message") && (regexMatch("event.message", "^Event [0-9]+ : Cannot login( |$)") && !regexMatch("event.message", ": no permission$")) && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'equals("event.process", "sshd") && exists("event.message") && startsWith("event.message", "error: PAM: Authentication failure for ") && !exists("actionResult")'
      # The account signed in but holds no permission on the host: a permission refusal.
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("event.message") && regexMatch("event.message", "^Event [0-9]+ : Cannot login .*: no permission$") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("event.message") && contains("event.message", "permission denied") && !exists("actionResult")'

      # A completed session is a successful sign-in unless an explicit failure
      # or denial was already recorded. Logouts and password checks set no result.
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'exists("event.loginClient") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "success"
          where: 'equals("event.authResult", "Accepted") && !exists("actionResult")'

      # Removing unused fields
      - delete:
          fields:
            - event.processName
            - event.irrelevant
            - event.loginEvent
            - event.loginUser
            - event.loginAddress
            - event.loginClient
            - event.failEvent
            - event.failUser
            - event.failAddress
            - event.sshUser
            - event.sshAddress