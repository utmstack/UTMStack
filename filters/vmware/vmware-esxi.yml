# VMWare-ESXi, version 3.0.2
# 
# Based on docs and real logs provided
# Support VMWare-ESXi log
#
# Documentations
# 1- https://core.vmware.com/esxi-log-message-formats
#
# Implementation
# 1. Parsing headers of syslog the message 
# 2. Parsing the RAW field containing the VMWare-ESXi
pipeline:
  - dataTypes:
      - vmware-esxi
    steps:
      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}(\:)'
            - fieldName: severity
              pattern: '{{.word}}'
            - fieldName: log.processName
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]'
            - fieldName: log.eventInfo
              pattern: '\[{{.data}}\]'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}(-){{.monthNumber}}(-){{.monthDay}}(T){{.time}}(Z)'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.priority
              pattern: '\<{{.data}}\>'
            - fieldName: log.deviceTime
              pattern: '{{.year}}-{{.monthNumber}}-{{.monthDay}}T{{.time}}Z'
            - fieldName: origin.hostname
              pattern: '{{.hostname}}'
            - fieldName: log.process
              pattern: '{{.hostname}}'
            - fieldName: log.pid
              pattern: '\[{{.data}}\]:'
            - fieldName: log.originIdComponent
              pattern: '\[{{.data}}\]'
            - fieldName: log.message
              pattern: '{{.greedy}}'

      - grok:
          patterns:
            - fieldName: log.moduleIdentifier
              pattern: '\[{{.data}}\@'
            - fieldName: log.irrelevant
              pattern: '{{.data}}\='
            - fieldName: log.subModuleIdentifier
              pattern: '{{.word}}\]'
          source: log.originIdComponent

      - grok:
          patterns:
            - fieldName: log.irrelevant2
              pattern: '{{.data}}level{{.space}}='
            - fieldName: log.level
              pattern: '{{.integer}}'
          source: log.message
              
      # Removing unused caracters
      - trim:
          function: prefix
          substring: '<'
          fields:
            - log.priority
      - trim:
          function: prefix
          substring: '['
          fields:
            - log.pid
            - log.eventInfo
            - log.moduleIdentifier
      - trim:
          function: prefix
          substring: '-'
          fields:
            - log.message
      - trim:
          function: suffix
          substring: '>'
          fields:
            - log.priority
      - trim:
          function: suffix
          substring: ':'
          fields:
            - log.pid
            - log.process
      - trim:
          function: suffix
          substring: ']'
          fields:
            - log.pid
            - log.eventInfo
            - log.subModuleIdentifier
      - trim:
          function: suffix
          substring: '-'
          fields:
            - log.message
      - trim:
          function: suffix
          substring: '@'
          fields:
            - log.moduleIdentifier
                    
      # Adding action result
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("log.message") && contains("log.message", "authentication failed")'
      - add:
          function: string
          params:
            key: actionResult
            value: "failed"
          where: 'exists("log.message") && contains("log.message", "authentication of user") && contains("log.message", "failed") && !exists("actionResult")'
      - add:
          function: string
          params:
            key: actionResult
            value: "denied"
          where: 'exists("log.message") && contains("log.message", "permission denied") && !exists("actionResult")'

      # Removing unused fields
      - delete:
          fields:
            - log.processName
            - log.irrelevant