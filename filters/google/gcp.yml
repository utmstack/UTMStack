# GCP filter, version 2.3.0
#
# Documentations
# 1- https://cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
# 2- https://cloud.google.com/logging/docs/audit (protoPayload / AuditLog)

pipeline:
  - dataTypes:
      - google
    steps:
      - json:
          source: raw

      # .......................................................................#
      # Rename to utmstack format to normalize fields
      # .......................................................................#
      # Renaming httpRequest fields
      # .......................................................................#
      - rename:
          from:
            - event.timestamp
          to: deviceTime
          
      - rename:
          from:
            - event.httpRequest.cacheHit
          to: event.httpRequestCacheHit

      - rename:
          from:
            - event.httpRequest.cacheLookup
          to: event.httpRequestCacheLookup

      - rename:
          from:
            - event.httpRequest.latency
          to: event.httpRequestLatency

      - rename:
          from:
            - event.httpRequest.remoteIp
          to: origin.ip

      - rename:
          from:
            - event.httpRequest.requestMethod
          to: event.httpRequestMethod

      - rename:
          from:
            - event.httpRequest.requestSize
          to: origin.bytesSent

      - rename:
          from:
            - event.httpRequest.requestUrl
          to: target.url

      - rename:
          from:
            - event.httpRequest.responseSize
          to: target.bytesSent

      - rename:
          from:
            - event.httpRequest.status
          to: statusCode

      - rename:
          from:
            - event.httpRequest.userAgent
          to: event.httpUserAgent

      # .......................................................................#
      # Renaming jsonPayload fields
      # .......................................................................#
      - rename:
          from:
            - event.jsonPayload.type
          to: event.jsonPayloadType

      - rename:
          from:
            - event.jsonPayload.backendTargetProjectNumber
          to: event.jsonPayloadBackendTargetProjectNumber

      - rename:
          from:
            - event.jsonPayload.cacheDecision
          to: event.jsonPayloadCacheDecision

      - rename:
          from:
            - event.jsonPayload.cacheId
          to: event.jsonPayloadCacheId

      - rename:
          from:
            - event.jsonPayload.enforcedEdgeSecurityPolicy.configuredAction
          to: event.jsonPayloadEnforcedEdgeSecurityPolicyConfiguredAction

      - rename:
          from:
            - event.jsonPayload.enforcedEdgeSecurityPolicy.name
          to: event.jsonPayloadEnforcedEdgeSecurityPolicyName

      - rename:
          from:
            - event.jsonPayload.enforcedEdgeSecurityPolicy.outcome
          to: event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome

      - rename:
          from:
            - event.jsonPayload.enforcedSecurityPolicy.outcome
          to: event.jsonPayloadEnforcedSecurityPolicyOutcome

      - rename:
          from:
            - event.jsonPayload.enforcedEdgeSecurityPolicy.priority
          to: event.jsonPayloadEnforcedEdgeSecurityPolicyPriority

      - rename:
          from:
            - event.jsonPayload.remoteIp
          to: event.jsonPayloadRemoteIp

      - rename:
          from:
            - event.jsonPayload.statusDetails
          to: event.jsonPayloadStatusDetails

      - rename:
          from:
            - event.jsonPayload.authAnswer
          to: event.JsonPayloadAuthAnswer

      - rename:
          from:
            - event.jsonPayload.destinationIP
          to: target.ip

      - rename:
          from:
            - event.jsonPayload.dns64Translated
          to: event.jsonPayloadDns64Translated

      - rename:
          from:
            - event.jsonPayload.protocol
          to: protocol

      - rename:
          from:
            - event.jsonPayload.queryType
          to: event.jsonPayloadQueryType

      - rename:
          from:
            - event.jsonPayload.responseCode
          to: event.jsonPayloadResponseCode

      - rename:
          from:
            - event.jsonPayload.serverLatency
          to: event.jsonPayloadServerLatency

      - rename:
          from:
            - event.jsonPayload.sourceIP
          to: origin.ip

      - rename:
          from:
            - event.class
          to: event.dnsQuery.class

      - rename:
          from:
            - event.domainName
          to: event.dnsQuery.domain

      - rename:
          from:
            - event.rvalue
          to: event.dnsQuery.rValue

      - rename:
          from:
            - event.ttl
          to: event.dnsQuery.ttl

      - rename:
          from:
            - event.type
          to: event.dnsQuery.type

      # .......................................................................#
      # Renaming resource fields
      # .......................................................................#
      - rename:
          from:
            - event.resource.labels.backend_service_name
          to: event.resourceLabelsBackendServiceName

      - rename:
          from:
            - event.resource.labels.forwarding_rule_name
          to: event.resourceLabelsForwardingRuleName

      - rename:
          from:
            - event.resource.labels.project_id
          to: event.resourceLabelsProjectId

      - rename:
          from:
            - event.resource.labels.target_proxy_name
          to: event.resourceLabelsTargetProxyName

      - rename:
          from:
            - event.resource.labels.url_map_name
          to: event.resourceLabelsUrlMapName

      - rename:
          from:
            - event.resource.labels.zone
          to: event.resourceLabelsZone

      - rename:
          from:
            - event.resource.labels.location
          to: event.resourceLabelsLocation

      - rename:
          from:
            - event.resource.labels.projectId
          to: event.resourceLabelsProjectId

      - rename:
          from:
            - event.resource.labels.projectType
          to: event.resourceLabelsProjectType

      - rename:
          from:
            - event.resource.labels.targetName
          to: event.resourceLabelsTargetName

      - rename:
          from:
            - event.resource.labels.targetType
          to: event.resourceLabelsTargetType

      - rename:
          from:
            - event.resource.type
          to: event.resourceType

      # .......................................................................#
      # Renaming protoPayload fields (Cloud Audit Logs — AuditLog message)
      # .......................................................................#
      # NOTE: log.protoPayload.@type is NOT renamed here. The engine treats
      # paths containing '@' as complex and the rename plugin errors with
      # "cannot delete value from a complex path". The whole log.protoPayload
      # subtree is dropped in the final delete step, so the field is cleaned
      # up implicitly. We use log.protoPayloadMethodName (always present in
      # AuditLog) as the discriminator for protoPayload-derived actionResult.
      - rename:
          from:
            - event.protoPayload.authenticationInfo.principalEmail
          to: origin.user

      - rename:
          from:
            - event.protoPayload.authenticationInfo.principalSubject
          to: event.protoPayloadPrincipalSubject

      - rename:
          from:
            - event.protoPayload.authenticationInfo.oauthInfo.oauthClientId
          to: event.protoPayloadOauthClientId

      - rename:
          from:
            - event.protoPayload.requestMetadata.callerIp
          to: origin.ip

      - rename:
          from:
            - event.protoPayload.requestMetadata.callerSuppliedUserAgent
          to: event.httpUserAgent

      - rename:
          from:
            - event.protoPayload.methodName
          to: event.protoPayloadMethodName

      - rename:
          from:
            - event.protoPayload.serviceName
          to: event.protoPayloadServiceName

      - rename:
          from:
            - event.protoPayload.resourceName
          to: event.protoPayloadResourceName

      - rename:
          from:
            - event.protoPayload.resourceLocation.currentLocations
          to: event.protoPayloadResourceLocation

      - rename:
          from:
            - event.protoPayload.authorizationInfo
          to: event.protoPayloadAuthorizationInfo

      - rename:
          from:
            - event.protoPayload.status.code
          to: event.protoPayloadStatusCode

      - rename:
          from:
            - event.protoPayload.status.message
          to: event.protoPayloadStatusMessage

      # .......................................................................#
      # Renaming operation field
      # .......................................................................#
      - rename:
          from:
            - event.operation.id
          to: event.operationId

      - rename:
          from:
            - event.operation.producer
          to: event.operationProducer

      - rename:
          from:
            - event.operation.first
          to: event.operationFirst

      - rename:
          from:
            - event.operation.last
          to: event.operationLast

      # .......................................................................#
      # Renaming sourceLocation field
      # .......................................................................#
      - rename:
          from:
            - event.sourceLocation.file
          to: event.sourceLocationFile

      - rename:
          from:
            - event.sourceLocation.line
          to: event.sourceLocationLine

      - rename:
          from:
            - event.sourceLocation.function
          to: event.sourceLocationFunction

      # Fields conversions
      - cast:
          fields:
            - event.jsonPayloadCacheDecision
          to: '[]string'

      - cast:
          fields:
            - statusCode
          to: int

      - cast:
          fields:
            - event.protoPayloadStatusCode
          to: int

      # Adding severity field based on log.severity
      - add:
          function: "string"
          params:
            key: severity
            value: "debug"
          where: equals("event.severity", "DEBUG")

      - add:
          function: "string"
          params:
            key: severity
            value: "info"
          where: oneOf("event.severity", ["INFO", "NOTICE"])

      - add:
          function: "string"
          params:
            key: severity
            value: "warning"
          where: equals("event.severity", "WARNING")

      - add:
          function: "string"
          params:
            key: severity
            value: "error"
          where: equals("event.severity", "ERROR")

      - add:
          function: "string"
          params:
            key: severity
            value: "critical"
          where: oneOf("event.severity", ["CRITICAL", "ALERT", "EMERGENCY"])

      # Adding action field based on log.httpRequestMethod
      - add:
          function: "string"
          params:
            key: action
            value: "get"
          where: equals("event.httpRequestMethod", "GET")

      - add:
          function: "string"
          params:
            key: action
            value: "post"
          where: equals("event.httpRequestMethod", "POST")

      - add:
          function: "string"
          params:
            key: action
            value: "put"
          where: equals("event.httpRequestMethod", "PUT")

      - add:
          function: "string"
          params:
            key: action
            value: "patch"
          where: equals("event.httpRequestMethod", "PATCH")

      - add:
          function: "string"
          params:
            key: action
            value: "request"
          where: equals("event.httpRequestMethod", "REQUEST")

      - add:
          function: "string"
          params:
            key: action
            value: "delete"
          where: equals("event.httpRequestMethod", "DELETE")

      # A raw field must not become a trusted outcome. Derive the final result
      # from the vendor's operation-specific status after extraction.
      - delete:
          fields:
            - actionResult

      # The first record of a long-running AuditLog operation is not its final
      # result unless the same record is also marked last. Workspace sign-in
      # records and OAuth access denials or requests have no status either,
      # so their outcome is set from the documented method further below.
      - add:
          function: "string"
          params:
            key: actionResult
            value: "success"
          where: >-
            exists("event.protoPayloadMethodName") &&
            contains("event.logName","cloudaudit.googleapis.com") &&
            !equals("event.protoPayloadServiceName","login.googleapis.com") &&
            !oneOf("event.protoPayloadMethodName",["google.identity.oauth2.Deny","google.identity.oauth2.Request"]) &&
            (!equals("event.operationFirst",true) || equals("event.operationLast",true)) &&
            (!exists("event.protoPayloadStatusCode") || equals("event.protoPayloadStatusCode",0)) &&
            !exists("event.protoPayloadStatusMessage") &&
            (!exists("statusCode") || oneOf("statusCode",[200,201,203,204,205,206,208,226]))

      - add:
          function: "string"
          params:
            key: actionResult
            value: "denied"
          where: >-
            exists("event.protoPayloadMethodName") &&
            contains("event.logName","cloudaudit.googleapis.com") &&
            (!equals("event.operationFirst",true) || equals("event.operationLast",true)) &&
            oneOf("event.protoPayloadStatusCode",[7,16])

      - add:
          function: "string"
          params:
            key: actionResult
            value: "failure"
          where: >-
            exists("event.protoPayloadMethodName") &&
            contains("event.logName","cloudaudit.googleapis.com") &&
            (!equals("event.operationFirst",true) || equals("event.operationLast",true)) &&
            greaterThan("event.protoPayloadStatusCode",0) &&
            !oneOf("event.protoPayloadStatusCode",[7,16])

      # Google Workspace Login and SAML audit records (login.googleapis.com)
      # carry their result in the method: a failed or blocked sign-in has no
      # status. Only documented final results set an outcome. Sign-in
      # challenges, verifications, logouts, account warnings, sensitive actions
      # that were only allowed to be attempted, and undocumented methods keep
      # none. An explicit error status set above is not replaced by success.
      - add:
          function: "string"
          params:
            key: actionResult
            value: "success"
          where: >-
            !exists("actionResult") &&
            contains("event.logName","cloudaudit.googleapis.com") &&
            equals("event.protoPayloadServiceName","login.googleapis.com") &&
            oneOf("event.protoPayloadMethodName",["google.login.LoginService.loginSuccess",
            "google.login.LoginService.2svDisable","google.login.LoginService.2svEnroll",
            "google.login.LoginService.passwordEdit","google.login.LoginService.recoveryEmailEdit",
            "google.login.LoginService.recoveryPhoneEdit","google.login.LoginService.recoverySecretQaEdit",
            "google.login.LoginService.passkeyEnrolled","google.login.LoginService.passkeyRemoved",
            "google.login.LoginService.titaniumEnroll","google.login.LoginService.titaniumUnenroll",
            "google.login.LoginService.emailForwardingOutOfDomain"])

      - add:
          function: "string"
          params:
            key: actionResult
            value: "failure"
          where: >-
            contains("event.logName","cloudaudit.googleapis.com") &&
            equals("event.protoPayloadServiceName","login.googleapis.com") &&
            oneOf("event.protoPayloadMethodName",["google.login.LoginService.loginFailure",
            "google.apps.login.v1.SamlLoginFailed"])

      # Google blocked these sign-ins and sensitive actions. An OAuth Deny
      # record means an application's access request was denied.
      - add:
          function: "string"
          params:
            key: actionResult
            value: "denied"
          where: >-
            contains("event.logName","cloudaudit.googleapis.com") &&
            ((equals("event.protoPayloadServiceName","login.googleapis.com") &&
              oneOf("event.protoPayloadMethodName",["google.login.LoginService.suspiciousLogin",
              "google.login.LoginService.suspiciousLoginLessSecureApp",
              "google.login.LoginService.suspiciousProgrammaticLogin",
              "google.login.LoginService.riskySensitiveActionBlocked"])) ||
             (equals("event.protoPayloadServiceName","oauth2.googleapis.com") &&
              equals("event.protoPayloadMethodName","google.identity.oauth2.Deny")))

      # Cloud DNS documents numeric DNS RCODEs; preserve named values for
      # compatible producers. A response code alone is not a DNS discriminator.
      - add:
          function: "string"
          params:
            key: actionResult
            value: "success"
          where: >-
            !exists("actionResult") && !exists("event.protoPayloadMethodName") && !exists("statusCode") &&
            exists("event.jsonPayload.queryName") &&
            (equals("event.jsonPayloadResponseCode",0) || equals("event.jsonPayloadResponseCode","NOERROR"))

      - add:
          function: "string"
          params:
            key: actionResult
            value: "denied"
          where: >-
            !exists("actionResult") && !exists("event.protoPayloadMethodName") && !exists("statusCode") &&
            exists("event.jsonPayload.queryName") &&
            (equals("event.jsonPayloadResponseCode",5) || equals("event.jsonPayloadResponseCode","REFUSED"))

      - add:
          function: "string"
          params:
            key: actionResult
            value: "failure"
          where: >-
            !exists("actionResult") && !exists("event.protoPayloadMethodName") && !exists("statusCode") &&
            exists("event.jsonPayload.queryName") &&
            ((greaterThan("event.jsonPayloadResponseCode",0) && !equals("event.jsonPayloadResponseCode",5)) ||
            oneOf("event.jsonPayloadResponseCode",["FORMERR","SERVFAIL","NXDOMAIN","NOTIMP"]))

      # HTTP 202, 207, and redirects do not establish a completed successful
      # request. Other final 2xx codes do; explicit denials/failures follow.
      - add:
          function: "string"
          params:
            key: actionResult
            value: "success"
          where: >-
            !exists("actionResult") && !exists("event.protoPayloadMethodName") &&
            oneOf("statusCode",[200,201,203,204,205,206,208,226])

      - add:
          function: "string"
          params:
            key: actionResult
            value: "denied"
          where: >-
            !exists("actionResult") && !exists("event.protoPayloadMethodName") &&
            oneOf("statusCode",[401,403])

      - add:
          function: "string"
          params:
            key: actionResult
            value: "failure"
          where: >-
            !exists("actionResult") && !exists("event.protoPayloadMethodName") &&
            greaterOrEqual("statusCode",400) && lessThan("statusCode",600)

      # Edge and backend Cloud Armor policies are both enforced. An ACCEPT
      # cannot override an HTTP denial or an opposing policy outcome.
      - delete:
          fields:
            - actionResult
          where: >-
            equals("actionResult","success") &&
            ((exists("event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome") &&
              !oneOf("event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome",["ACCEPT","DENY"])) ||
             (exists("event.jsonPayloadEnforcedSecurityPolicyOutcome") &&
              !oneOf("event.jsonPayloadEnforcedSecurityPolicyOutcome",["ACCEPT","DENY"])))

      - add:
          function: "string"
          params:
            key: actionResult
            value: "success"
          where: >-
            !exists("actionResult") && !exists("statusCode") && !exists("event.protoPayloadMethodName") &&
            (equals("event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome","ACCEPT") ||
             equals("event.jsonPayloadEnforcedSecurityPolicyOutcome","ACCEPT")) &&
            (!exists("event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome") ||
             equals("event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome","ACCEPT")) &&
            (!exists("event.jsonPayloadEnforcedSecurityPolicyOutcome") ||
             equals("event.jsonPayloadEnforcedSecurityPolicyOutcome","ACCEPT")) &&
            !equals("event.jsonPayloadStatusDetails","denied_by_security_policy")

      - add:
          function: "string"
          params:
            key: actionResult
            value: "denied"
          where: >-
            equals("event.jsonPayloadEnforcedEdgeSecurityPolicyOutcome","DENY") ||
            equals("event.jsonPayloadEnforcedSecurityPolicyOutcome","DENY") ||
            equals("event.jsonPayloadStatusDetails","denied_by_security_policy")

      # Adding geolocation to origin.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: origin.ip
            destination: origin.geolocation
          where: exists("origin.ip")

      # Adding geolocation to target.ip
      - dynamic:
          plugin: com.utmstack.geolocation
          params:
            source: target.ip
            destination: target.geolocation
          where: exists("target.ip")

      # Removing unused fields
      - delete:
          fields:
            - event.httpRequest
            - event.jsonPayload
            - event.resource
            - event.httpRequestMethod
            - event.jsonPayloadStructuredRdata
