<div class="container-fluid py-3">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h4 class="label-header text-uppercase mb-1">Team Members</h4>
      <p class="text-muted mb-0">Manage federation team members across instances.</p>
    </div>
    <button type="button"
            class="btn utm-button utm-button-primary"
            (click)="openInvite()">
      <i class="icon-plus3 mr-2"></i>Invite user
    </button>
  </div>

  <div class="d-flex align-items-center mb-3 team-members-toolbar">
    <div class="flex-grow-1 mr-3">
      <app-team-members-search (searchChange)="onSearchChange($event)"></app-team-members-search>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <app-team-members-table
    [users]="users"
    [loading]="loading"
    [pendingActionId]="pendingActionId"
    (editUser)="openEdit($event)"
    (resendInvite)="resendInvite($event)"
    (disableTfa)="disableTfa($event)"
    (toggleActivation)="toggleActivation($event)">
  </app-team-members-table>

  <app-team-members-pagination
    [pageInfo]="pageInfo"
    [loading]="loading"
    (prev)="prevPage()"
    (next)="nextPage()">
  </app-team-members-pagination>
</div>
