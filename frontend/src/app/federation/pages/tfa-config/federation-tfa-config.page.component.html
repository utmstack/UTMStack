<div class="container-fluid py-3">
  <div class="mb-3">
    <h4 class="label-header text-uppercase mb-1">Two-Factor Authentication</h4>
    <ng-container *ngIf="user">
      <p class="text-muted mb-0">
        Method: <strong>TOTP (Authenticator App)</strong>
      </p>
    </ng-container>
  </div>

  <div class="form-group">
    <app-utm-toggle #toggle [active]="switchActive"
                    (toggleChange)="onToggle($event)"
                    [label]="'Enable Two-Factor Authentication'"
                    ></app-utm-toggle>
  </div>

  <div class="d-flex align-items-center mt-3">
    <app-utm-tfa-conf-check #tfaCheck
        [validConfig]="false"
        [config]="config"
        [configToSave]="config"
        (isChecked)="checkedTFAConfig($event)"
        class="mr-2"></app-utm-tfa-conf-check>
  </div>
</div>
