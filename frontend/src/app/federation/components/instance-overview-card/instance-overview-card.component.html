<div class="overview-card">
  <div class="overview-card__title">{{ entry.instanceName }}</div>

  <div class="overview-card__actions">
      <ng-content> </ng-content>
  </div>

  <div class="overview-card__rows" *ngIf="hasData">
    <div class="overview-card__row">
      <div class="overview-card__row-label">Severity</div>
      <div class="overview-card__row-meters">
        <ngx-gauge *ngFor="let meter of severityMeters"
                   [animate]="true"
                   cap="round"
                   [foregroundColor]="meter.color"
                   [label]="meter.label"
                   [max]="severityMax || 1"
                   [min]="0"
                   [thick]="3"
                   [size]="80"
                   type="full"
                   [value]="meter.value"
                   class="overview-card__gauge"></ngx-gauge>
      </div>
    </div>

    <div class="overview-card__row">
      <div class="overview-card__row-label">Status</div>
      <div class="overview-card__row-meters">
        <ngx-gauge *ngFor="let meter of statusMeters"
                   [animate]="true"
                   cap="round"
                   [foregroundColor]="meter.color"
                   [label]="meter.label"
                   [max]="statusMax || 1"
                   [min]="0"
                   [thick]="3"
                   [size]="80"
                   type="full"
                   [value]="meter.value"
                   class="overview-card__gauge"></ngx-gauge>
      </div>
    </div>
  </div>

  <div class="overview-card__empty" *ngIf="!hasData">
    <div class="overview-card__empty-msg">No alerts in window</div>
  </div>

  <div class="overview-card__nav">
    <button type="button"
            class="nav-icon"
            *ngFor="let action of actions"
            (click)="onSelect(action.route)"
            [title]="action.label">
      <span class="nav-icon__graphic">
        <span [inlineSVG]="iconPath+action.iconClass"
              class="svg-icon  svg-icon-primary"></span>
        <span *ngIf="action.counter && totalAlerts > 0"
              class="nav-icon__badge"
              [title]="totalAlerts + ' total alerts'">
          {{ totalAlerts }}
        </span>
      </span>
    </button>
  </div>
</div>
