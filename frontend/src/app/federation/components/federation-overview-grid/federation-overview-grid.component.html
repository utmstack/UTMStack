<div class="overview-grid">
  <div class="overview-grid__state" *ngIf="loading">
    <div class="overview-grid__spinner"></div>
    <div class="overview-grid__state-label">Loading federation overview…</div>
  </div>

  <div class="overview-grid__state" *ngIf="!loading && errorMessage">
    <i class="icon-cancel-circle2 overview-grid__state-icon overview-grid__state-icon--error"></i>
    <div class="overview-grid__state-label">{{ errorMessage }}</div>
    <button type="button" class="btn utm-button utm-button-primary mt-2" (click)="loadData()">
      <i class="icon-loop3 mr-2"></i>Retry
    </button>
  </div>

  <div class="overview-grid__state" *ngIf="!loading && !errorMessage && entries.length === 0">
    <i class="icon-cloud-check overview-grid__state-icon overview-grid__state-icon--muted"></i>
    <div class="overview-grid__state-label">No active instances are reporting data.</div>
  </div>

  <div class="overview-grid__items" *ngIf="!loading && !errorMessage && entries.length > 0">
    <app-instance-overview-card
      *ngFor="let entry of entries; trackBy: trackByInstance"
      [entry]="entry"
      [severityEntry]="severityFor(entry)"
      (select)="onSelect(entry, $event)">
      <div class="federation-instance-actions ml-2 d-flex align-items-center">
        <button type="button"
                class="btn btn-sm btn-link p-1"
                title="Edit"
                (click)="openEdit(entry, $event)">
          <i class="icon-pencil"></i>
        </button>
        <button type="button"
                class="btn btn-sm btn-link p-1 text-danger"
                title="Remove"
                [disabled]="pendingDeleteId === entry.id"
                (click)="remove(entry, $event)">
          <i class="icon-trash"></i>
        </button>
      </div>
    </app-instance-overview-card>

    <div class="overview-create-card" (click)="openCreate($event)">
      <i class="icon-plus3 overview-create-card__icon"></i>
      <span> add a new instance </span>
    </div>


  </div>
</div>
