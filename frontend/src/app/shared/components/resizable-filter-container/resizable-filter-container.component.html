<div [ngStyle]="{'width':filterWidth+'px'}"
     mwlResizable
     [enableGhostResize]="true"
     (resizeEnd)="onResize($event)"
     (resizing)="onResize($event)"
     class="alert-filter-container d-flex flex-column flex-1 h-100 resizable-filter-container mr-2">
     <div mwlResizeHandle [resizeEdges]="{ bottom: false, right: true, top: false, left: false }"></div>
  <ng-content></ng-content>
</div>
