<!-- html -->
<div class="editor-container">
  <div class="editor-header pr-2">
    <div class="header-title">
      <i class="icon-database"></i>
      <span>SQL Console</span>
    </div>
    <div class="header-actions">
      <button
        class="btn utm-button utm-button-primary"
        (click)="executeQuery()"
        [disabled]="isExecuting || !sqlQuery.trim()"
      >
        <i [ngClass]="isExecuting ? 'icon-spinner4 spinner' : 'icon-play3'"></i>
      </button>
      <button class="btn utm-button utm-button-primary"
              (click)="formatQuery()"
              title="Format SQL"
              [disabled]="isExecuting || !sqlQuery.trim()"
      >
        <i class="fa fa-indent"></i>
      </button>
      <button class="btn utm-button utm-button-primary"
              (click)="copyQuery()"
              title="Copy Query"
              [disabled]="isExecuting || !sqlQuery.trim()"
      >
        <i class="icon-copy3"></i>
      </button>
      <button class="btn utm-button utm-button-primary"
              (click)="clearQuery()"
              title="Clear"
              [disabled]="isExecuting || !sqlQuery.trim()"
      >
        <i class="icon-trash text-white"></i>
      </button>
    </div>
  </div>

  <div class="editor-section">
    <textarea
      class="editor-area"
      [(ngModel)]="sqlQuery"
      (ngModelChange)="resetMessages()"
      rows="12"
      placeholder="Write your SQL query here..."
      aria-label="SQL editor"
    ></textarea>
  </div>

  <div class="execution-info" *ngIf="successMessage || errorMessage">
    <div [ngClass]="errorMessage ? 'text-danger-800' : 'text-green-800'">
      <span>{{ errorMessage || successMessage }}</span>
    </div>
  </div>
</div>
