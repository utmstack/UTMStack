<app-utm-modal-header [name]="(control?'Edit':'Create') + ' compliance report'"></app-utm-modal-header>
<div class="container-fluid p-3">
  <div class="d-flex flex-column justify-content-start align-items-start">
    <div class="step-container">
      <div class="step">
         <span class="text-blue-800 font-weight-bold">
          Report Configuration
        </span>
        <div [ngClass]="isCompleted(1)?'step-success':step===1?'step-active':'step-inactive'"
             class="round-indicator">
          <i [ngClass]="isCompleted(1)?'icon-checkmark3':'icon-shield-check'"></i>
        </div>
      </div>
      <div class="step-link"></div>
      <div class="step">
          <span class="text-blue-800 font-weight-bold">
          Queries Configuration
        </span>
        <div [ngClass]="isCompleted(2)?'step-success':step===2?'step-active':'step-inactive'"
             class="round-indicator">
          <i [ngClass]="isCompleted(2)?'icon-checkmark3':'icon-pie-chart8'"></i>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="step===1 && !loading" class="configure-step mt-3">
    <form [formGroup]="complianceForm">
      <div class="d-flex flex-column w-75 mb-3">
        <label class="pb-1" for="standard">Standard</label>
        <app-utm-cp-standard-select
          (standardSelect)="onStandardChange($event)"
          [standardId]="control && control.section ? control.section.standardId : null"
          id="standard">
        </app-utm-cp-standard-select>
      </div>
      <div *ngIf="viewSection" class="d-flex flex-column w-100 mb-3">
        <label class="pb-1" for="standard">Standard section</label>
        <app-utm-cp-st-section-select
          (standardSectionSelect)="onStandardSectionChange($event)"
          [onlyWithReport]="false"
          [standardSectionEditId]="control ? control.standardSectionId : null"
          id="standardSection">
        </app-utm-cp-st-section-select>
      </div>
      <div class="form-group">
        <label for="controlName">Compliance Name</label>
        <input formControlName="controlName" type="text" class="form-control" id="controlName">
        <div *ngIf="complianceForm.get('controlName').dirty && complianceForm.get('controlName').invalid">
          <small *ngIf="complianceForm.get('controlName').hasError('required')" class="form-text text-danger">
            Report name is required.
          </small>
          <small *ngIf="complianceForm.get('controlName').hasError('minlength')" class="form-text text-danger">
            Report name must be at least 10 characters long.
          </small>
          <small *ngIf="complianceForm.get('controlName').hasError('maxlength')" class="form-text text-danger">
            Report name must not exceed 200 characters.
          </small>
        </div>
      </div>

      <div class="form-group">
        <label for="controlDesc">Solution ({{ 2000 - complianceForm.get('solution').value.length }})</label>
        <textarea formControlName="solution" class="form-control" id="controlDesc" rows="4" maxlength="2000"></textarea>
      </div>

      <div class="form-group">
        <label for="controlRemediation">Remediation ({{ 2000 - complianceForm.get('remediation').value.length }})</label>
        <textarea formControlName="remediation" class="form-control" id="controlRemediation" rows="4" maxlength="2000"></textarea>
      </div>

      <div>
        <label class="pb-1" for="standard">Strategy</label>
        <ng-select
          formControlName="strategy"
          [items]="strategies"
          bindLabel="strategy"
          bindValue="id"
          [clearable]="true"
          [loadingText]="'Loading strategies...'"
          [loading]="!strategies"
          class="w-50">
        </ng-select>
        <div *ngIf="complianceForm.get('strategy').dirty && complianceForm.get('strategy').invalid">
          <small *ngIf="complianceForm.get('strategy').hasError('required')" class="form-text text-danger">
            Strategy is required.
          </small>
        </div>
      </div>
    </form>
  </div>
  <div *ngIf="step===2" class="configure-step mt-3 mb-3">
    <app-utm-compliance-query-list
      [queries]="queriesList"
      (add)="onQueryAdd($event)"
      (remove)="onQueryRemove($event)">
    </app-utm-compliance-query-list>
  </div>
  <div class="button-container d-flex justify-content-end mt-3">
    <button (click)="backStep()" *ngIf="step > 1"
            class="btn utm-button utm-button-primary">
      <i class="icon-arrow-left22"></i>&nbsp;
      Back
    </button>
    <button (click)="nextStep()" *ngIf="step ===1"
            [disabled]="!standardSectionId || complianceForm.invalid"
            class="btn utm-button utm-button-primary ml-2">
      Next&nbsp;
      <i class="icon-arrow-right22"></i>
    </button>

    <button (click)="createCompliance()"
            *ngIf="step===2"
            [disabled]="complianceForm.invalid"
            class="btn utm-button utm-button-primary ml-2">
      <i [ngClass]="creating?'icon-spinner2 spinner':'icon-shield-check'"></i>
      {{ control ? 'Edit' : 'Create' }} compliance&nbsp;
    </button>
  </div>
</div>
