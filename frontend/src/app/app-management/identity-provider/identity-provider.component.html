<div class="card w-100 h-100 m-h-0">
  <div class="card-header d-flex justify-content-between align-items-center">
    <div class="mb-0 d-flex flex-column">
      <h6 class="card-title label-header text-uppercase">
        Identity Providers
      </h6>
      <span class="text-gray-500 mt-1 fw-semibold fs-6">
        Configure OAuth 2.0 / OpenID Connect providers.
      </span>
    </div>
    <button (click)="openModal()"
            class="btn utm-button utm-button-primary">
      <i class="icon-plus2 mr-2"></i> Add Provider
    </button>
  </div>

  <div class="card-body">
    <!-- Empty State -->
    <div *ngIf="!loading && providers.length === 0" class="text-center py-5">
      <i class="icon-shield icon-3x text-muted-300 mb-3"></i>
      <h5 class="text-muted">No providers configured</h5>
      <p class="text-muted">Add your first OAuth provider to enable SSO login</p>
      <button type="button" class="btn utm-button utm-button-primary mt-3" (click)="openModal()">
        <i class="icon-plus2 mr-1"></i>
        Add Provider
      </button>
    </div>

    <!-- Providers Grid -->
    <div *ngIf="!loading && providers.length > 0" class="row">
      <div class="col-xl-4 cursor-pointer col-md-6" *ngFor="let provider of providers">
        <app-provider-card
          [provider]="provider"
          (edit)="openModal($event)"
          (delete)="deleteProvider($event)"
          (toggleStatus)="toggleActive($event)">
        </app-provider-card>
      </div>
    </div>

    <!-- Loading -->
    <app-utm-spinner *ngIf="loading" [loading]="true" label="Loading providers"></app-utm-spinner>
  </div>
</div>
