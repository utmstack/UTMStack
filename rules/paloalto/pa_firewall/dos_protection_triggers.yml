- id: 1012
  dataTypes:
    - pa_firewall
  name: DoS Protection Triggers
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Denial of Service
  technique: "T1498 - Network Denial of Service"
  adversary: origin
  references:
    - https://docs.paloaltonetworks.com/pan-os/10-2/pan-os-admin/zone-protection-and-dos-protection
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects when Palo Alto firewall DoS protection is triggered, indicating potential denial of service attacks against protected resources. This rule identifies flood-type threats that are being dropped by the firewall's DoS protection mechanisms.
    
    Next Steps:
    1. Investigate the source IP address for malicious activity patterns
    2. Check if the attacking IP is from a known botnet or compromised host
    3. Review network traffic patterns to determine attack vectors and scale
    4. Verify firewall DoS protection settings are appropriately configured
    5. Consider implementing rate limiting or blocking the source IP if confirmed malicious
    6. Monitor for additional flood attacks from the same or related IP addresses
    7. Check if the attack is part of a larger coordinated DDoS campaign
  where: safe(log.type, "") == "THREAT" && safe(log.subtype, "") == "flood" && safe(log.action, "") == "drop" && safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-paloalto-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-5m
      count: 100
  deduplicateBy:
    - origin.ip
    - target.ip
