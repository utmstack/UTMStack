# Rule version v2.0.0

dataTypes:
- firewall-paloalto
name: PAN-OS Repeated Authentication Failures
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Credential Access
technique: T1110 - Brute Force
adversary: origin
references:
- https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/system-log-fields
- https://attack.mitre.org/techniques/T1110/
description: Detects ten SYSTEM auth-fail events from the same observed source, collector, firewall and virtual
  system within fifteen minutes. The event can come from different authentication services; it does not by itself
  prove a management-plane login. Check the authentication profile, requested user and any subsequent successes
  before treating the sequence as an attack.
where: equals("event.paType", "SYSTEM") && equals("event.eventid", "auth-fail") && equals("actionResult", "failure")
  && exists("origin.ip") && exists("dataSource") && !equals("dataSource", "") && exists("event.paScope") && exists("event.paVsys")
groupBy:
- lastEvent.dataSource
- lastEvent.event.paScope
- lastEvent.event.paVsys
- adversary.ip
- target.ip
- adversary.user
afterEvents:
- indexPattern: v11-log-firewall-paloalto-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.paScope
    operator: filter_term
    value: '{{.event.paScope}}'
  - field: event.paVsys
    operator: filter_term
    value: '{{.event.paVsys}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.paloalto.authFailure
    operator: filter_term
    value: match
  within: 15m
  count: 10
