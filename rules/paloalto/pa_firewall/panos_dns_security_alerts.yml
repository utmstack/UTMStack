# Rule version v2.0.0

dataTypes:
- firewall-paloalto
name: PAN-OS Repeated DNS Security Detections
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Intrusion Detection
technique: ''
adversary: origin
references:
- https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/threat-log-fields
- https://docs.paloaltonetworks.com/dns-security/administration/monitor-dns-security/view-dns-security-logs
description: Detects three relevant DNS security events from the same observed source, collector, firewall and virtual
  system within thirty minutes. Supports the legacy dns subtype and spyware sinkhole or dns-c2/dns-malware category
  events. A source can be a forwarding resolver rather than the original endpoint. Trace the DNS request and vendor
  action before attributing compromise; an alert action does not prove a successful connection.
where: equals("log.pa_type", "THREAT") && (equals("log.pa_subtype", "dns") || (equals("log.pa_subtype", "spyware")
  && (equals("action", "sinkhole") || oneOf("log.thr_category", ["dns-c2", "dns-malware"])))) && oneOf("action",
  ["sinkhole", "block-url", "alert", "drop", "reset-both", "reset-client", "reset-server", "block-ip"]) && exists("origin.ip")
  && exists("dataSource") && !equals("dataSource", "") && exists("log.paScope") && exists("log.paVsys")
groupBy:
- lastEvent.dataSource
- lastEvent.log.paScope
- lastEvent.log.paVsys
- adversary.ip
- target.ip
afterEvents:
- indexPattern: v11-log-firewall-paloalto-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.paScope
    operator: filter_term
    value: '{{.log.paScope}}'
  - field: log.paVsys
    operator: filter_term
    value: '{{.log.paVsys}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.paloalto.dns
    operator: filter_term
    value: match
  within: 30m
  count: 3
