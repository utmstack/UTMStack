# Rule version v2.0.0

dataTypes:
- firewall-paloalto
name: PAN-OS Blocked Threat Category Detection (session destination)
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Intrusion Detection
technique: ''
adversary: target
references:
- https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/threat-log-fields
description: Detects a blocked PAN-OS threat categorized as malware, command-and-control, phishing or botnet. The
  category alone does not establish membership in an external intelligence feed. Review the signature, vendor action,
  session endpoints and attack direction; a blocked event does not establish compromise. For URL-category events,
  the requested remote resource is the adversary; the request direction does not make the requesting client the
  malicious resource.
where: equals("log.paType", "THREAT") && oneOf("log.thrCategory", ["malware", "command-and-control", "phishing",
  "botnet"]) && equals("actionResult", "denied") && exists("origin.ip") && exists("target.ip") && (equals("log.paSubtype",
  "url") || equals("log.paDirection", "server-to-client"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.paScope
- lastEvent.log.paVsys
- adversary.ip
- target.ip
- lastEvent.log.paThreatid
