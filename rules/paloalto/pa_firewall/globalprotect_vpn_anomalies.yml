- id: 1014
  dataTypes:
    - pa_firewall
  name: GlobalProtect VPN Anomalies
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Remote Access
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://docs.paloaltonetworks.com/globalprotect/10-2/globalprotect-admin/monitoring/view-globalprotect-logs
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects anomalous GlobalProtect VPN connection patterns including failed authentications, unusual connection times, or suspicious source locations. This rule triggers when there are multiple failed authentication attempts for the same user within a 15-minute window.
    
    **Next Steps:**
    1. Review the failed authentication attempts for the affected user account
    2. Check the source IP addresses and geolocation of connection attempts
    3. Verify if the user account credentials have been compromised
    4. Review recent user activity and access patterns
    5. Consider implementing additional authentication factors if not already in place
    6. Check for any concurrent successful logins from different locations
  where: safe(log.log.type, "") == "GLOBALPROTECT" && (safe(log.log.eventid, "") == "gateway-auth-fail" || safe(log.log.eventid, "") == "portal-auth-fail") && safe(origin.user, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-paloalto-*
      with:
        - field: origin.user.keyword
          operator: filter_term
          value: '{{origin.user}}'
        - field: log.log.type.keyword
          operator: filter_term
          value: 'GLOBALPROTECT'
      within: now-15m
      count: 5
  deduplicateBy:
    - adversary.user
    - adversary.ip
