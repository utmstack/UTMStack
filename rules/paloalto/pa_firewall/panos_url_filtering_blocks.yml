# Rule version v2.0.0

dataTypes:
- firewall-paloalto
name: PAN-OS Repeated Risky URL Category Detections
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Intrusion Detection
technique: ''
adversary: target
references:
- https://docs.paloaltonetworks.com/ngfw/administration/monitoring/use-syslog-for-monitoring/syslog-field-descriptions/url-filtering-log-fields
description: Detects five URL events in the configured malware, phishing, command-and-control, grayware or hacking
  categories from the same observed source, collector, firewall and virtual system within thirty minutes. Includes
  alert-only detections and blocked/confirmation-page requests. Grayware or hacking categorization does not prove
  malware, and requesting a URL does not prove execution or compromise. The requested remote resource is the alert
  adversary; the requesting client is its target. Inspect the URL and action; a later continue/override is a separate
  event.
where: equals("event.paType", "THREAT") && equals("event.paSubtype", "url") && oneOf("action", ["block-url", "block-page",
  "block-continue", "block-override", "alert"]) && oneOf("event.category", ["malware", "phishing", "command-and-control",
  "grayware", "hacking"]) && exists("origin.ip") && exists("dataSource") && !equals("dataSource", "") && exists("event.paScope")
  && exists("event.paVsys")
groupBy:
- lastEvent.dataSource
- lastEvent.event.paScope
- lastEvent.event.paVsys
- adversary.ip
- target.ip
- lastEvent.event.category
afterEvents:
- indexPattern: v11-log-firewall-paloalto-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.paScope
    operator: filter_term
    value: '{{.event.paScope}}'
  - field: event.paVsys
    operator: filter_term
    value: '{{.event.paVsys}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.paloalto.url
    operator: filter_term
    value: match
  within: 30m
  count: 5
