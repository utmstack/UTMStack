- id: 1024
  dataTypes:
    - pa_firewall
  name: High Availability Failover Event
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: System Availability
  technique: "T1489 - Service Stop"
  adversary: device
  references:
    - https://docs.paloaltonetworks.com/pan-os/10-2/pan-os-admin/high-availability
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects high availability failover events including unexpected failovers, HA state changes, and synchronization failures that could indicate system instability or attacks targeting firewall availability.
    
    Next Steps:
    1. Verify if the failover was planned maintenance or unexpected
    2. Check the secondary firewall status and synchronization state
    3. Review logs for any errors or attacks preceding the failover
    4. Validate HA configuration and network connectivity between peers
    5. Monitor for repeated failovers which may indicate ongoing issues
    6. Check system resources and performance metrics on both firewalls
  where: (safe(log.message, "").contains("HA") || safe(log.message, "").contains("high availability") || safe(log.message, "").contains("failover") || safe(log.cat, "").contains("ha")) && (safe(log.message, "").contains("state change") || safe(log.message, "").contains("active") || safe(log.message, "").contains("passive") || safe(log.message, "").contains("sync fail"))
  afterEvents:
    - indexPattern: v11-log-firewall-paloalto-*
      with:
        - field: log.dhost.keyword
          operator: filter_term
          value: '{{log.dhost}}'
        - field: log.cat.keyword
          operator: filter_term
          value: 'ha'
      within: now-10m
      count: 3
  deduplicateBy:
    - lastEvent.log.dhost
