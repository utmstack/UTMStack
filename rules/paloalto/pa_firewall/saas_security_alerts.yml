- id: 1021
  dataTypes:
    - pa_firewall
  name: SaaS Security Alert Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Cloud Security
  technique: "T1526 - Cloud Service Discovery"
  adversary: origin
  references:
    - https://docs.paloaltonetworks.com/saas-security/saas-security-admin
    - https://attack.mitre.org/techniques/T1526/
  description: |
    Detects security alerts from Palo Alto SaaS Security platform including data exposure, unauthorized access, and policy violations in cloud applications. This rule identifies when SaaS applications generate security-related events that may indicate compromised accounts, data breaches, or policy violations.
    
    Next Steps:
    1. Review the specific SaaS application and user involved in the alert
    2. Examine the nature of the security violation or threat detected
    3. Check for additional suspicious activity from the same user or application
    4. Verify if the activity aligns with normal business operations
    5. Consider temporarily restricting access to the affected SaaS application if necessary
    6. Coordinate with the application owner to understand the context
    7. Review SaaS security policies and update if needed
  where: safe(log.is_saas_of_app, "") == "yes" && (safe(log.category, "").contains("security") || safe(log.category, "").contains("threat") || safe(log.severity, "") == "high" || safe(log.panOSSeverity, "") == "high" || safe(log.subtype, "").contains("threat"))
  deduplicateBy:
    - lastEvent.log.app
    - origin.user
