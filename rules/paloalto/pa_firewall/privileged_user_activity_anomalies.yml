- id: 1016
  dataTypes:
    - pa_firewall
  name: Privileged User Activity Anomalies
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Privilege Escalation
  technique: "T1548 - Abuse Elevation Control Mechanism"
  adversary: origin
  references:
    - https://docs.paloaltonetworks.com/pan-os/10-2/pan-os-admin/monitoring/use-syslog-for-monitoring/syslog-field-descriptions
    - https://attack.mitre.org/techniques/T1548/
  description: |
    Detects anomalous activity from privileged users including unusual administrative actions, access to sensitive resources, or configuration changes. This rule identifies potentially suspicious behavior from administrative accounts that could indicate compromised credentials or insider threats.
    
    Next Steps:
    1. Verify the legitimacy of the administrative action with the account owner
    2. Review the specific configuration changes made and their business justification
    3. Check for any unusual login patterns or source IPs for this user account
    4. Examine system logs for any other suspicious activities from this user
    5. If unauthorized, immediately disable the account and investigate potential compromise
    6. Review access logs to determine scope of potential unauthorized access
  where: |
    safe(log.pa_type, "") == "CONFIG" && 
    safe(origin.user, "") != "" &&
    (
      origin.user.contains("admin") || 
      origin.user.contains("root") || 
      origin.user.contains("administrator") ||
      safe(log.vsys, "") == "vsys1"
    ) &&
    (
      safe(log.act, "") == "edit" || 
      safe(log.act, "") == "delete" || 
      safe(log.act, "") == "set" ||
      safe(action, "") == "edit" ||
      safe(action, "") == "delete" ||
      safe(action, "") == "set"
    ) &&
    (
      safe(log.category, "").contains("critical") ||
      safe(log.severityLabel, "").contains("high") ||
      safe(log.severityLabel, "").contains("critical")
    )
  deduplicateBy:
    - origin.user
    - action
