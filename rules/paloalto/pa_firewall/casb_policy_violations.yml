- id: 1022
  dataTypes:
    - pa_firewall
  name: CASB Policy Violation Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Policy Violation
  technique: "T1078.004 - Valid Accounts: Cloud Accounts"
  adversary: origin
  references:
    - https://docs.paloaltonetworks.com/saas-security/data-security
    - https://attack.mitre.org/techniques/T1078/004/
  description: |
    Detects Cloud Access Security Broker (CASB) policy violations including unauthorized data sharing, risky user behavior, and non-compliant cloud application usage. This rule identifies when users attempt to access unsanctioned applications or trigger policy violations that result in denied access.
    
    Next Steps:
    1. Review the specific policy that was violated and the application involved
    2. Investigate the user's recent cloud application usage patterns
    3. Check if this is part of a pattern of policy violations by the same user
    4. Verify if the user has legitimate business need for the blocked application
    5. Consider additional user training on acceptable cloud application usage
    6. Review and update CASB policies if necessary
  where: (safe(log.sanctioned_state_of_app, "") == "unsanctioned" || safe(log.category, "").contains("policy-violation") || safe(log.category, "").contains("data-exposure")) && safe(log.act, "") == "deny"
  afterEvents:
    - indexPattern: v11-log-firewall-paloalto-*
      with:
        - field: log.srcuser.keyword
          operator: filter_term
          value: '{{log.srcuser}}'
        - field: log.act.keyword
          operator: filter_term
          value: 'deny'
      within: now-1h
      count: 5
  deduplicateBy:
    - origin.user
    - lastEvent.log.app
