- id: 1013
  dataTypes:
    - google
  name: Cloud Asset Inventory Suspicious Changes
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Resource Development
  technique: "T1496 - Resource Hijacking"
  adversary: origin
  references:
    - https://cloud.google.com/asset-inventory/docs/monitor-asset-changes
    - https://cloud.google.com/asset-inventory/docs/audit-logging
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects suspicious changes to Google Cloud assets including creation of resources with public IPs, deletion of critical assets, or modifications to security-sensitive resources. Monitors for unexpected asset inventory changes that could indicate unauthorized resource creation or modification.
    
    Next Steps:
    1. Review the specific asset changes and determine if they were authorized
    2. Investigate the principal email that performed the changes
    3. Check for any unusual patterns in asset creation/deletion timing
    4. Verify if the changes align with known maintenance windows or deployments
    5. Review IAM policies and permissions for the affected resources
    6. Check for any related security alerts or suspicious activities from the same user
    7. Monitor for additional asset changes from the same principal in the following hours
  where: |
    safe(log.protoPayload.serviceName, "") == "cloudasset.googleapis.com" && 
    (
      (safe(log.protoPayload.methodName, "") contains "Delete" && safe(log.protoPayload.request.parent, "") contains "organizations/") ||
      (safe(log.protoPayload.methodName, "") contains "Create" && safe(log.protoPayload.response.asset.resource.data.networkInterfaces[0].accessConfigs[0].natIP, "") != "") ||
      (safe(log.protoPayload.methodName, "") == "google.cloud.asset.v1.AssetService.UpdateFeed" && safe(log.protoPayload.request.feed.assetTypes, []) contains "iam.googleapis.com/Policy") ||
      (safe(log.protoPayload.request.contentType, "") == "IAM_POLICY" && safe(log.protoPayload.methodName, "") contains "Export")
    )
  afterEvents:
    - indexPattern: v11-log-google-*
      with:
        - field: log.protoPayload.authenticationInfo.principalEmail.keyword
          operator: filter_term
          value: '{{log.protoPayload.authenticationInfo.principalEmail}}'
      within: now-1h
      count: 10
  deduplicateBy:
    - lastEvent.log.protoPayload.authenticationInfo.principalEmail
    - lastEvent.log.protoPayload.resourceName
