- id: 1026
  dataTypes:
    - google
  name: Cloud Composer Environment Modifications
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Infrastructure Modification
  technique: Resource Hijacking
  adversary: origin
  references:
    - https://cloud.google.com/composer/docs/how-to/audit-logging
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects modifications to Google Cloud Composer environments which could indicate unauthorized changes to workflow orchestration infrastructure. Monitors for environment creation, updates, configuration changes, and workload modifications.
    
    Next Steps:
    1. Verify if the Composer environment change was authorized and scheduled
    2. Review the user account making the changes and validate legitimate access
    3. Examine the specific changes made to the environment configuration
    4. Check for any unauthorized workflow modifications or malicious DAGs
    5. Review network access logs for suspicious connections to the environment
    6. Validate that security policies and access controls remain intact
    7. Monitor for any unusual resource consumption or workload execution patterns
  where: safe(log.protoPayload.serviceName, "") == "composer.googleapis.com" && safe(log.protoPayload.methodName, "") in ["google.cloud.orchestration.airflow.service.v1.Environments.CreateEnvironment", "google.cloud.orchestration.airflow.service.v1.Environments.UpdateEnvironment", "google.cloud.orchestration.airflow.service.v1.Environments.DeleteEnvironment", "google.cloud.orchestration.airflow.service.v1.Environments.CreateUserWorkloadsConfigMap", "google.cloud.orchestration.airflow.service.v1.Environments.UpdateUserWorkloadsConfigMap", "google.cloud.orchestration.airflow.service.v1.Environments.DeleteUserWorkloadsConfigMap", "google.cloud.orchestration.airflow.service.v1.Environments.CreateUserWorkloadsSecret", "google.cloud.orchestration.airflow.service.v1.Environments.UpdateUserWorkloadsSecret", "google.cloud.orchestration.airflow.service.v1.Environments.DeleteUserWorkloadsSecret"] && safe(log.severity, "") != "low"
  deduplicateBy:
    - lastEvent.log.protoPayload.authenticationInfo.principalEmail
    - lastEvent.log.protoPayload.resourceName
