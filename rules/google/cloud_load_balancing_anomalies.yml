- id: 1021
  dataTypes:
    - google
  name: Cloud Load Balancing Anomalies Detection
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Performance Monitoring
  technique: "T1499 - Endpoint Denial of Service"
  adversary: origin
  references:
    - https://cloud.google.com/load-balancing/docs/https/https-logging-monitoring
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects anomalies in Google Cloud Load Balancing traffic patterns including high error rates, excessive latency, or unusual traffic spikes that could indicate DDoS attempts, misconfigurations, or service degradation.
    
    Next Steps:
    1. Review the load balancer configuration and backend service health
    2. Analyze traffic patterns and identify potential sources of anomalous requests
    3. Check backend service capacity and auto-scaling settings
    4. Investigate client IP addresses for potential DDoS patterns
    5. Review application logs for underlying issues causing 5xx errors
    6. Monitor network latency and backend response times
    7. Consider implementing rate limiting or traffic filtering if attack is confirmed
  where: |
    safe(log.resourceType, "") == "http_load_balancer" && 
    (
      (safe(log.statusCode, 0) >= 500 && safe(log.statusCode, 0) < 600) ||
      (safe(log.httpRequestLatency, 0.0) > 10.0) ||
      (safe(origin.bytesSent, 0) > 10485760)
    )
  afterEvents:
    - indexPattern: v11-log-google-*
      with:
        - field: log.resourceLabelsBackendServiceName.keyword
          operator: filter_term
          value: '{{log.resourceLabelsBackendServiceName}}'
      within: now-5m
      count: 50
  deduplicateBy:
    - log.resourceLabelsBackendServiceName
    - origin.ip
