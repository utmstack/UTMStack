- id: 1006
  dataTypes:
    - google
  name: VPC Firewall Rule Changes
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Network Security
  technique: "T1562.004 - Impair Defenses: Disable or Modify System Firewall"
  adversary: origin
  references:
    - https://cloud.google.com/vpc/docs/audit-logging
    - https://attack.mitre.org/techniques/T1562/004/
  description: |
    Detects changes to VPC firewall rules including creation, modification, or deletion which could indicate attempts to bypass security controls or enable unauthorized network access. Attackers may modify firewall rules to allow malicious traffic, disable security controls, or create backdoors for persistent access.
    
    Next Steps:
    1. Review the specific firewall rule changes in the audit log details
    2. Verify if the changes were authorized and documented
    3. Check the principal (user/service account) that made the changes
    4. Examine the modified rule configuration for suspicious changes (e.g., allowing all traffic, opening sensitive ports)
    5. Review any associated network traffic patterns after the rule change
    6. Validate the source IP and geolocation of the change request
    7. Check for any follow-up suspicious network activity from newly allowed sources
    8. Correlate with other security events from the same principal or timeframe
  where: safe(log.resourceType, "") == "gce_firewall_rule" && safe(log.protoPayload.methodName, "") in ["v1.compute.firewalls.patch", "v1.compute.firewalls.insert", "v1.compute.firewalls.delete", "beta.compute.firewalls.patch", "beta.compute.firewalls.insert", "beta.compute.firewalls.delete"]
  deduplicateBy:
    - lastEvent.log.protoPayload.authenticationInfo.principalEmail
    - lastEvent.log.protoPayload.resourceName
