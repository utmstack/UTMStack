- id: 1017
  dataTypes:
    - asa
  name: NTP Time Synchronization Failures
  impact:
    confidentiality: 1
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1070.006 - Timestomping: Timestomp"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1070/006/
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog/syslogs6.html
  description: |
    Detects NTP time synchronization failures on ASA devices. Time sync issues can indicate network problems, misconfiguration, or attempts to manipulate timestamps for evasion. Accurate time synchronization is critical for log correlation, security event analysis, and compliance requirements.
    
    Next Steps:
    1. Verify NTP server connectivity from the ASA device using 'show ntp associations' and 'show ntp status'
    2. Check if the configured NTP servers are reachable and responding (ping/traceroute from ASA)
    3. Review NTP authentication settings if configured - verify pre-shared keys match on both sides
    4. Examine firewall rules to ensure UDP port 123 is allowed to NTP servers
    5. Check for recent configuration changes to NTP settings in the ASA audit logs
    6. Verify the ASA system clock drift isn't excessive using 'show clock detail'
    7. Consider if this could be part of a timestomping attack to evade detection
    8. Review other security events around the same timeframe for suspicious activity
  where: |
    (safe(log.message_id, "") == "610001" || 
     safe(log.message_id, "") == "610002" ||
     safe(log.message_id, "") == "610101") &&
    safe(log.message, "").matches("(?i)(ntp.*denied|ntp.*authentication.*failed|time.*sync.*fail|clock.*unsynchronized|peer.*unreachable|stratum.*invalid)")
  deduplicateBy:
    - origin.ip
