- id: 1023
  dataTypes:
    - asa
  name: Security Context Configuration Changes
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Configuration Security
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog.html
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects changes to ASA security contexts which could indicate attempts to modify security boundaries or isolate administrative domains. Security context changes can affect the entire security posture of the device by potentially allowing an attacker to move between different security domains or bypass security controls.
    
    Next Steps:
    1. Verify if the context change was authorized by checking change management records
    2. Review the user account that made the change for suspicious activity
    3. Check for any other configuration changes made around the same time
    4. Examine the specific context changes made and their potential security impact
    5. Review access logs for the source IP to identify any anomalous patterns
    6. Consider temporarily increasing monitoring on the affected security contexts
  where: |
    safe(log.dataType, "") == "asa" && 
    (
      safe(log.messageId, "") in ["111009", "111010"] &&
      (contains(safe(log.message, ""), "context") ||
       contains(safe(log.message, ""), "changeto") ||
       contains(safe(log.command, ""), "context") ||
       contains(safe(log.command, ""), "changeto"))
    )
  deduplicateBy:
    - lastEvent.user
    - lastEvent.origin.ip
