- id: 1024
  dataTypes:
    - asa
  name: ASA Clustering Anomalies Detected
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Infrastructure Security
  technique: "T1489 - Service Stop"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog.html
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects anomalies in ASA clustering operations including replication failures, health check failures, and cluster member state changes. These could indicate network issues, hardware problems, or potential attacks on cluster infrastructure.
    
    Next Steps:
    1. Check cluster member status using 'show cluster info' and 'show cluster history' commands
    2. Review cluster health metrics and interface statistics for all members
    3. Verify network connectivity between cluster members (cluster control link and data interfaces)
    4. Check for hardware issues on affected cluster members (CPU, memory, interface errors)
    5. Review recent configuration changes that might impact clustering
    6. Examine logs for signs of DoS attacks or resource exhaustion
    7. If persistent issues, consider failing over to a healthy member and investigating the problematic unit
    8. Document the incident and update monitoring thresholds if needed
  where: |
    safe(log.dataType, "") == "asa" && 
    (
      safe(log.messageId, "") in ["747001", "747009", "747010", "747011", "747012", "747013", "747014", "747018", "747021", "747022", "747039", "747040"] ||
      (safe(log.severity, 0) <= 3 &&
       ((safe(log.message, "").contains("cluster") && safe(log.message, "").contains("fail")) ||
        (safe(log.message, "").contains("cluster") && safe(log.message, "").contains("error")) ||
        (safe(log.message, "").contains("cluster") && safe(log.message, "").contains("quit")) ||
        safe(log.message, "").contains("health check fail")))
    )
  deduplicateBy:
    - lastEvent.origin.host
    - lastEvent.log.messageId
