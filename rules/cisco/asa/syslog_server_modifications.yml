- id: 1016
  dataTypes:
    - cisco-asa
  name: Syslog Server Configuration Modifications
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1562/001/
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog/syslogs1.html
  description: |
    Detects modifications to syslog server configuration on Cisco ASA devices. Attackers may attempt to disable or redirect syslog to hide their activities, prevent security monitoring, or exfiltrate logs to attacker-controlled servers.
    
    Next Steps:
    1. Verify if the configuration change was authorized by checking change management records
    2. Review the specific syslog commands executed to understand the nature of the change
    3. Check if syslog forwarding was disabled, redirected to a new server, or logging levels were reduced
    4. Investigate other activities by the same user around the time of the change
    5. Verify that critical logs are still being collected and forwarded to the SIEM
    6. If unauthorized, immediately restore proper syslog configuration
    7. Consider implementing configuration change alerts and approval workflows
  where: |
    safe(lastEvent.log.message_id, "") == "111008" && 
    safe(origin.user, "") != "" &&
    safe(lastEvent.log.message, "").matches("(?i)(logging host|no logging|logging trap|logging facility|logging level|syslog server)")
  deduplicateBy:
    - origin.user
    - origin.ip
