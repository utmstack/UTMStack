- id: 1008
  dataTypes:
    - asa
  name: Threat Detection Triggered - Potential DDoS/Scanning Attack
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Intrusion Detection
  technique: Network Denial of Service
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/asa/asa920/configuration/firewall/asa-920-firewall-config/conns-threat.html
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects when ASA threat detection features are triggered, indicating potential DDoS attacks, port scanning, or other malicious activities. Monitors message IDs 733100-733105 which indicate various threat detection triggers including scanning and rate-based attacks.
    
    Next Steps:
    1. Review the specific threat detection message ID to understand the type of attack detected
    2. Check ASA logs for the source IP address to identify patterns of malicious behavior
    3. Verify if the source IP is known to be malicious using threat intelligence feeds
    4. Consider implementing rate limiting or blocking rules for confirmed malicious sources
    5. Review ASA threat detection thresholds to ensure they are appropriately tuned for your environment
    6. Check for any service degradation or availability issues on protected resources
  where: safe(log.messageId, "") in ["733100", "733101", "733102", "733104", "733105"] || (safe(log.message, "") =~ ".*threat.*detection.*" && safe(log.message, "") =~ ".*(triggered|exceeded|detected).*") || (safe(log.message, "") =~ ".*scanning.*threat.*" || safe(log.message, "") =~ ".*rate.*exceeded.*")
  afterEvents:
    - indexPattern: v11-log-cisco-asa-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-5m
      count: 10
  deduplicateBy:
    - origin.ip
    - log.messageId
