- id: 1007
  dataTypes:
    - asa
  name: Access Control List (ACL) Modifications
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Configuration Change
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog.html
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects modifications to Access Control Lists (ACLs) on Cisco ASA devices. Unauthorized ACL changes can open security holes, allow malicious traffic, or block legitimate communications. Monitors for access-list, access-group commands and related syslog messages.
    
    Next Steps:
    1. Verify if the user who made the ACL changes is authorized to modify firewall rules
    2. Review the specific ACL changes made - look for rules that allow broad access or bypass security controls
    3. Check if the changes were made during approved change windows
    4. Review the commands executed to understand the scope of modifications
    5. If unauthorized, immediately review current ACLs and consider reverting suspicious changes
    6. Check for any unusual network traffic patterns following the ACL modifications
  where: (safe(log.commandName, "") =~ "^access-(list|group).*" && safe(log.action, "") == "configuration_change") || (safe(log.message, "") =~ ".*access-list.*" && safe(log.message, "") =~ ".*(added|removed|modified|applied|deleted).*") || safe(log.messageId, "") in ["106001", "106002", "106006", "106007", "106018", "335005"]
  deduplicateBy:
    - origin.user
