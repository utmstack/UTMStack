- id: 1019
  dataTypes:
    - asa
  name: WebVPN Suspicious Activities and Session Anomalies
  impact:
    confidentiality: 3
    integrity: 2
    availability: 3
  category: Remote Access
  technique: "T1021 - Remote Services"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1021/
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog/syslogs8.html
  description: |
    Detects suspicious WebVPN activities including failed sessions, resource exhaustion, and abnormal session patterns that may indicate unauthorized access attempts or denial of service attacks against the Cisco ASA WebVPN service.
    
    Next Steps:
    - Review the source IP address for reputation and geolocation anomalies
    - Check if the origin.user (if available) is a valid user account
    - Examine concurrent WebVPN sessions from the same IP or user
    - Look for patterns of failed authentication attempts before successful connections
    - Verify if resource exhaustion messages correlate with legitimate high usage periods
    - Check ASA performance metrics and VPN license utilization
    - Review WebVPN access logs for unusual file access or application usage patterns
  where: |
    safe(log.message_id, "") =~ "^716" &&
    (safe(log.message_id, "") == "716007" ||
     safe(log.message, "") =~ "(?i)(webvpn.*unable.*create|session.*limit.*reached|webvpn.*fail|maximum.*login.*reached|webvpn.*error)")
  afterEvents:
    - indexPattern: v11-log-cisco-asa-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.message_id.keyword
          operator: filter_term
          value: '716*'
      within: now-2h
      count: 10
  deduplicateBy:
    - lastEvent.origin.ip
    - lastEvent.origin.user
