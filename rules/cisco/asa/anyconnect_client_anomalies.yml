- id: 1020
  dataTypes:
    - asa
  name: AnyConnect Client Connection Anomalies
  impact:
    confidentiality: 2
    integrity: 2
    availability: 3
  category: Command and Control
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1071/
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog/syslogs9.html
  description: |
    Detects AnyConnect VPN client anomalies including connection failures, session drops, IPv6 assignment issues, and suspicious reconnection patterns that may indicate compromised credentials or network attacks.
    
    Next Steps:
    1. Review the affected user account for any signs of compromise or unauthorized access
    2. Check the source IP address reputation and geolocation for anomalies
    3. Examine authentication logs around the same timeframe for failed login attempts
    4. Verify if the user reported any connectivity issues or if this is unexpected behavior
    5. Review VPN server logs for any configuration changes or system issues
    6. Consider resetting the user's VPN credentials if suspicious activity is confirmed
    7. Check for any other alerts or incidents associated with the same user or IP address
    8. Monitor for repeated anomalies from the same user/IP combination
  where: |
    (safe(log.message_id, "") =~ "^722" || 
     safe(log.message_id, "") == "716058") &&
    safe(log.message, "") =~ "(?i)(anyconnect.*lost.*connection|no.*ipv6.*address.*available|svc.*connection.*fail|anyconnect.*session.*inactive|ssl.*tunnel.*drop)"
  afterEvents:
    - indexPattern: v11-log-cisco-asa-*
      with:
        - field: origin.user.keyword
          operator: filter_term
          value: '{{origin.user}}'
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-4h
      count: 5
  deduplicateBy:
    - origin.user
    - origin.ip
