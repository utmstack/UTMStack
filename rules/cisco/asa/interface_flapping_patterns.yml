- id: 1012
  dataTypes:
    - asa
  name: Interface Flapping Patterns
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Network Stability
  technique: "T1489 - Service Stop"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/asa/syslog/b_syslog/syslogs4.html
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects interface flapping on Cisco ASA devices which could indicate hardware problems, cable issues, or a potential DoS attack. Rapid link state changes can cause network instability and service disruptions.
    
    Next Steps:
    1. Check the physical connection integrity for the affected interface
    2. Review interface statistics for errors, drops, or CRC failures
    3. Verify cable quality and connections on both ends
    4. Check for environmental factors (temperature, power fluctuations)
    5. Review recent configuration changes that might affect the interface
    6. Monitor for patterns - is it happening at specific times or intervals?
    7. Consider implementing interface dampening if flapping persists
    8. Check for potential DoS attacks targeting the interface
  where: |
    safe(lastEvent.dataType, "") == "asa" && (
      (safe(lastEvent.log.messageId, "") == "411001" && safe(lastEvent.log.message, "") contains "changed state to up") ||
      (safe(lastEvent.log.messageId, "") == "411002" && safe(lastEvent.log.message, "") contains "changed state to down")
    )
  afterEvents:
    - indexPattern: v11-log-cisco-asa-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.interface.keyword
          operator: filter_term
          value: '{{log.interface}}'
      within: now-5m
      count: 5
  deduplicateBy:
    - origin.ip
    - lastEvent.log.interface
