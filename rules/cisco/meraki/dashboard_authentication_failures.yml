- id: 1020
  dataTypes:
    - meraki
  name: Dashboard Authentication Failures
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Authentication
  technique: "T1110 - Brute Force"
  adversary: origin
  references:
    - https://documentation.meraki.com/General_Administration/Managing_Dashboard_Access/Managing_Dashboard_Administrators_and_Permissions
    - https://attack.mitre.org/techniques/T1110/
  description: |
    Detects multiple dashboard authentication failures that could indicate brute force attempts, credential stuffing, or unauthorized access attempts to the Meraki dashboard.
    
    Next Steps:
    1. Review the source IP address and check if it's from a known location or VPN
    2. Verify if the targeted user accounts exist and check their recent activity
    3. Look for any successful logins from the same IP following the failures
    4. Check if multiple user accounts are being targeted from the same source
    5. Consider blocking the source IP if the activity appears malicious
    6. Review and strengthen authentication policies (enforce MFA, account lockout policies)
    7. Contact the legitimate user to verify if they were experiencing login issues
  where: |
    safe(log.eventType, "") in ["login_failure", "auth_failed", "invalid_credentials"] &&
    safe(log.application, "") in ["meraki_dashboard", "dashboard", "web_ui"] &&
    (safe(log.failureReason, "") in ["invalid_password", "invalid_username", "account_locked", "mfa_failed"] ||
     safe(log.suspiciousActivity, false) == true)
  afterEvents:
    - indexPattern: v11-log-firewall-meraki-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.eventType.keyword
          operator: filter_match
          value: '{{log.eventType}}'
        - field: log.application.keyword
          operator: filter_match
          value: '{{log.application}}'
      within: now-15m
      count: 5
  deduplicateBy:
    - origin.ip
    - origin.user
