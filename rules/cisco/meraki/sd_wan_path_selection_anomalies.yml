- id: 1016
  dataTypes:
    - meraki
  name: SD-WAN Path Selection Anomalies
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Network Security
  technique: "T1046 - Network Service Discovery"
  adversary: origin
  references:
    - https://documentation.meraki.com/MX/Monitoring_and_Reporting/SD-WAN_Path_Selection
    - https://attack.mitre.org/techniques/T1046/
  description: |
    Detects anomalies in SD-WAN path selection that could indicate network issues, misconfigurations, or potential attacks attempting to manipulate traffic routing. This rule triggers when excessive path changes occur due to jitter, packet loss, path failures, or unknown reasons.
    
    Next Steps:
    1. Review the affected device's network connectivity and performance metrics
    2. Check for any recent configuration changes to SD-WAN policies
    3. Analyze network traffic patterns to identify potential DDoS or interference
    4. Verify WAN link health and ISP connectivity status
    5. Review Meraki dashboard for additional network health indicators
    6. Consider implementing additional monitoring for the affected network paths
  where: |
    safe(log.eventType, "") == "sdwan_path_change" && 
    safe(log.pathChangeReason, "") in ["excessive_jitter", "excessive_packet_loss", "path_failure", "unknown"] &&
    safe(log.pathChangeCount, 0) > 10
  afterEvents:
    - indexPattern: v11-log-firewall-meraki-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.eventType.keyword
          operator: filter_term
          value: 'sdwan_path_change'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - lastEvent.log.deviceName
