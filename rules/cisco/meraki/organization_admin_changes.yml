- id: 1021
  dataTypes:
    - meraki
  name: Meraki Organization Admin Changes
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Configuration Management
  technique: "T1098 - Account Manipulation"
  adversary: origin
  references:
    - https://documentation.meraki.com/General_Administration/Cross-Platform_Content/Meraki_Event_Log
    - https://attack.mitre.org/techniques/T1098/
  description: |
    Detects administrative changes made to Meraki organization settings including user account modifications, permission changes, and organization-wide configuration updates. These changes could indicate unauthorized access or insider threats attempting to maintain persistence or escalate privileges.
    
    Next Steps:
    1. Verify the legitimacy of the administrative change with the user account involved
    2. Review the specific changes made to organization settings or user permissions
    3. Check if the change was made during normal business hours and from expected locations
    4. Examine recent authentication logs for the admin account for signs of compromise
    5. Review other administrative actions performed by the same user account in the time period
    6. If unauthorized, immediately review and revoke any suspicious permission changes
  where: >
    safe(dataType, "") == "meraki" && 
    safe(lastEvent.log.eventType, "") == "api_request" &&
    (
      safe(lastEvent.log.message, "").contains("admin") || 
      safe(lastEvent.log.message, "").contains("organization") ||
      safe(lastEvent.log.message, "").contains("permission") ||
      safe(lastEvent.log.message, "").contains("role") ||
      safe(lastEvent.log.message, "").contains("user added") ||
      safe(lastEvent.log.message, "").contains("user removed") ||
      safe(lastEvent.log.message, "").contains("user modified") ||
      safe(lastEvent.log.message, "").contains("org_") ||
      safe(lastEvent.log.application, "") == "dashboard"
    )
  deduplicateBy:
    - origin.user
    - lastEvent.log.networkId
