- id: 1013
  dataTypes:
    - meraki
  name: Network Topology Changes
  impact:
    confidentiality: 2
    integrity: 4
    availability: 4
  category: Network Configuration
  technique: "T1046 - Network Service Discovery"
  adversary: origin
  references:
    - https://documentation.meraki.com/General_Administration/Cross-Platform_Content/Meraki_Event_Log
    - https://attack.mitre.org/techniques/T1046/
  description: |
    Detects significant changes to network topology including VLAN modifications, routing changes, or network segmentation alterations that could impact security posture. These changes can indicate configuration drift, unauthorized modifications, or potential network reconnaissance activities.

    Next Steps:
    1. Verify if the topology change was authorized through change management procedures
    2. Review the specific changes made and assess impact on network security
    3. Check if the changes align with documented network architecture
    4. Validate that proper authentication and authorization was used for the changes
    5. Monitor for any subsequent suspicious network activity following the topology changes
    6. Review access logs to identify who made the changes and from what location
  where: |
    safe(log.eventType, "") == "topology_change" ||
    safe(log.eventType, "") == "vlan_modified" ||
    safe(log.eventType, "") == "routing_table_changed" ||
    safe(log.eventType, "") == "network_added" ||
    safe(log.eventType, "") == "network_deleted" ||
    safe(log.eventType, "") == "subnet_modified" ||
    (safe(log.message, "").contains("topology") && safe(log.message, "").contains("change")) ||
    (safe(log.message, "").contains("VLAN") && safe(log.message, "").contains("change")) ||
    (safe(log.message, "").contains("routing") && safe(log.message, "").contains("change")) ||
    (safe(log.message, "").contains("network") && safe(log.message, "").contains("change")) ||
    (safe(log.eventType, "") == "configuration_change" && 
     (safe(log.details, "").contains("network") || 
      safe(log.details, "").contains("topology") || 
      safe(log.details, "").contains("vlan")))
  deduplicateBy:
    - lastEvent.log.networkId
    - lastEvent.log.changeType
