# Rule version v1.0.0

dataTypes:
  - firewall-meraki
name: Meraki Client VPN Brute Force Attempts
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1110 - Brute Force"
adversary: origin
references:
  - https://documentation.meraki.com/General_Administration/Monitoring_and_Reporting/Syslog_Event_Types_and_Log_Samples
  - https://documentation.meraki.com/MX/Client_VPN/Client_VPN_Overview
  - https://attack.mitre.org/techniques/T1110/
description: |
  Detects at least ten explicit AnyConnect VPN authentication failures within fifteen minutes from the same source IP, collector, and Meraki appliance. Connection teardown and site-to-site tunnel negotiation failures do not establish a credential failure.

  Next Steps:
  1. Review the source IP address and check geographic location
  2. Verify if the targeted user account exists and is active
  3. Check for any successful VPN connections from the same IP
  4. Consider blocking the source IP at the MX appliance
  5. Review VPN authentication settings and ensure MFA is enabled
  6. Notify the targeted user if the account is legitimate
where: |
  equals("log.eventType", "events") &&
  equals("log.type", "anyconnect_vpn_auth_failure") &&
  exists("origin.ip") &&
  exists("log.merakiType") && !oneOf("log.merakiType", ["", "unknown", "-"]) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"])
afterEvents:
  - indexPattern: v11-log-firewall-meraki-*
    with:
      - field: dataSource
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.merakiType
        operator: filter_term
        value: '{{.log.merakiType}}'
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.vpnAuthenticationFailure
        operator: filter_term
        value: 'match'
    within: 15m
    count: 10
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.merakiType
  - adversary.ip
