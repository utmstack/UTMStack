- id: 1010
  dataTypes:
    - meraki
  name: Location Analytics Anomaly Detection
  impact:
    confidentiality: 2
    integrity: 1
    availability: 1
  category: Physical Security
  technique: "T1428 - Location Tracking"
  adversary: origin
  references:
    - https://documentation.meraki.com/MR/Monitoring_and_Reporting/Location_Analytics
    - https://attack.mitre.org/techniques/T1428/
  description: |
    Detects anomalous patterns in location analytics data that could indicate unauthorized physical access, device spoofing, or abnormal movement patterns. Monitors for devices appearing in unexpected locations or exhibiting suspicious movement behavior.
    
    Next Steps:
    1. Verify the client MAC address and associated device identity
    2. Review physical access logs for the affected location
    3. Check if the device should have legitimate access to the detected location
    4. Investigate the dwell time and movement patterns for abnormal behavior
    5. Correlate with badge access systems if available
    6. Consider device fingerprinting to detect potential MAC spoofing
    7. Review network segmentation policies for the affected zone
    8. Check for patterns of multiple devices exhibiting similar anomalous behavior
    9. Validate Meraki access point configurations and coverage areas
  where: |
    safe(log.eventType, "") contains "location" && 
    safe(log.client_mac, "") != "" &&
    (safe(log.message, "") contains "anomaly" || 
     safe(log.zone_violation, false) == true ||
     safe(log.unexpected_location, false) == true ||
     (safe(log.dwell_time, 0) > 14400 && safe(log.location, "") contains "restricted"))
  deduplicateBy:
    - lastEvent.log.client_mac
    - lastEvent.log.location
