- id: 1015
  dataTypes:
    - meraki
  name: Security Appliance Critical Events
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Security Monitoring
  technique: "T1211 - Exploitation for Defense Evasion"
  adversary: origin
  references:
    - https://documentation.meraki.com/General_Administration/Monitoring_and_Reporting/Syslog_Event_Types_and_Log_Samples
    - https://attack.mitre.org/techniques/T1211/
  description: |
    Detects critical security events from Meraki security appliances including IDS/IPS alerts, content filtering violations, and advanced threat protection triggers. These events indicate potential security threats that require immediate attention.
    
    Next Steps:
    1. Review the specific event type and signature to understand the nature of the threat
    2. Investigate the source IP address for additional suspicious activity
    3. Check if this is part of a larger attack pattern by reviewing recent logs
    4. Verify if the blocked content or detected threat bypassed other security controls
    5. Consider blocking the source IP if malicious activity is confirmed
    6. Review and update security policies if necessary to prevent similar incidents
  where: |
    safe(log.priority, 5) <= 2 ||
    safe(log.eventType, "") == "ids_alert" ||
    safe(log.eventType, "") == "security_event" ||
    safe(log.eventType, "") == "content_filtering_block" ||
    safe(log.eventType, "") == "threat_detected" ||
    safe(log.eventType, "") == "malware_detected" ||
    safe(log.eventType, "") == "amp_alert" ||
    matches(safe(log.message, ""), ".*(security|threat|malware|attack|exploit).*detected.*") ||
    (safe(log.eventType, "") == "urls" && safe(log.action, "") == "blocked" && matches(safe(log.category, ""), ".*(malware|phishing|botnet).*"))
  deduplicateBy:
    - origin.ip
    - lastEvent.log.signature
