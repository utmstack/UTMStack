- id: 1009
  dataTypes:
    - meraki
  name: Bluetooth Beacon Anomaly Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: IoT Security
  technique: "T1200 - Hardware Additions"
  adversary: origin
  references:
    - https://documentation.meraki.com/MR/Bluetooth/Bluetooth_Low_Energy_(BLE)
    - https://attack.mitre.org/techniques/T1200/
  description: |
    Detects anomalous Bluetooth beacon activity that could indicate rogue beacons, beacon spoofing, or unauthorized tracking devices in the environment. Monitors for unexpected beacon appearances, signal strength anomalies, or suspicious beacon identifiers.
    
    Next Steps:
    1. Investigate the physical location of the detected beacon using RSSI measurements
    2. Cross-reference beacon UUID with authorized device inventory
    3. Check for unauthorized personnel in the area during the detection timeframe
    4. Verify if the beacon is part of legitimate IoT deployments or guest services
    5. Consider implementing beacon allowlisting and monitoring policies
    6. Review physical security controls around detected beacon locations
  where: |
    safe(log.eventType, "") contains "bluetooth" && 
    (safe(log.beacon_uuid, "") != "" || safe(log.beacon_major, "") != "" || safe(log.beacon_minor, "") != "") &&
    (safe(log.rssi, 0) <= -70 || safe(log.message, "") contains "anomaly" || safe(log.message, "") contains "unexpected")
  afterEvents:
    - indexPattern: v11-log-meraki-*
      with:
        - field: log.beacon_uuid.keyword
          operator: filter_term
          value: '{{log.beacon_uuid}}'
      within: now-1h
      count: 20
  deduplicateBy:
    - lastEvent.log.beacon_uuid
    - lastEvent.log.device_mac
