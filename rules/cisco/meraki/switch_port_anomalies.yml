- id: 1014
  dataTypes:
    - meraki
  name: Switch Port Anomalies
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Network Security
  technique: "T1200 - Hardware Additions"
  adversary: origin
  references:
    - https://documentation.meraki.com/General_Administration/Monitoring_and_Reporting/Syslog_Event_Types_and_Log_Samples
    - https://attack.mitre.org/techniques/T1200/
  description: |
    Detects anomalous switch port behavior including excessive link state changes, unauthorized device connections, or potential port security violations.
    
    Next Steps:
    1. Verify the affected switch port and device MAC address from the alert details
    2. Check physical access to the network switch and inspect for unauthorized devices
    3. Review switch port configuration and security policies
    4. Examine network topology changes and device connection patterns
    5. Investigate if the anomaly correlates with known maintenance activities
    6. Consider disabling the affected port temporarily if unauthorized access is suspected
    7. Review access logs and security camera footage for physical security incidents
    8. Update port security configurations if necessary to prevent future violations
  where: |
    safe(log.eventType, "") == "port_flapping" ||
    safe(log.eventType, "") == "port_security_violation" ||
    safe(log.eventType, "") == "unauthorized_device_connected" ||
    safe(log.eventType, "") == "port_down" ||
    safe(log.eventType, "") == "excessive_errors" ||
    matches(safe(log.message, ""), ".*port.*(flap|security|violation|anomaly).*") ||
    (safe(log.eventType, "") == "switch_event" && safe(log.portErrors, 0) > 1000) ||
    (safe(log.eventType, "") == "link_state_change" && safe(log.changeCount, 0) > 10)
  afterEvents:
    - indexPattern: v11-log-firewall-meraki-*
      with:
        - field: lastEvent.log.device.mac.keyword
          operator: filter_term
          value: '{{lastEvent.log.device.mac}}'
        - field: lastEvent.log.switch.port.keyword
          operator: filter_term
          value: '{{lastEvent.log.switch.port}}'
      within: now-30m
      count: 5
  deduplicateBy:
    - lastEvent.log.device.mac
    - lastEvent.log.switch.port
