- id: 1005
  dataTypes:
    - firepower
  name: File Policy Violations and Suspicious File Transfers
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Data Exfiltration
  technique: "T1048 - Exfiltration Over Alternative Protocol"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/firepower/640/configuration/guide/fpmc-config-guide-v64/file_policies_and_advanced_malware_protection.html
    - https://attack.mitre.org/techniques/T1048/
  description: |
    Detects file policy violations including blocked file types, oversized files, or attempts to transfer prohibited content that may indicate data exfiltration or policy bypass attempts.
    
    Next Steps:
    1. Identify the source IP and user attempting the file transfer
    2. Review the blocked file types and sizes to determine if legitimate business need exists
    3. Check for patterns of repeated attempts from the same source
    4. Investigate if the file transfers are to external destinations
    5. Review file hashes (SHA256) against threat intelligence sources
    6. Check if the source system shows signs of compromise
    7. Verify if the user has legitimate access to the attempted files
  where: |
    safe(log.eventType, "") == "FILE_EVENT" && 
    (safe(log.fileAction, "") == "BLOCK" || 
     safe(log.fileAction, "") == "RESET_BOTH" ||
     (safe(log.fileType, "") in ["EXECUTABLE", "ARCHIVE", "ENCRYPTED"] && safe(log.fileSize, 0) > 10485760) ||
     safe(log.fileStorageStatus, "") == "POLICY_VIOLATION")
  afterEvents:
    - indexPattern: v11-log-firepower-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-4h
      count: 5
  deduplicateBy:
    - origin.ip
    - log.sha256
