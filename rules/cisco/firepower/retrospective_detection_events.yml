- id: 1023
  dataTypes:
    - cisco-firepower
  name: Firepower Retrospective Malware Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Malware Detection
  technique: "T1055 - Process Injection"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/firepower/70/configuration/guide/fpmc-config-guide-v70/file_malware_events_and_network_file_trajectory.html
    - https://attack.mitre.org/techniques/T1055/
  description: |
    Detects when Firepower identifies a file retrospectively as malware after disposition change, indicating delayed threat identification. This occurs when a file initially deemed safe is later determined to be malicious based on updated threat intelligence.
    
    Next Steps:
    1. Immediately isolate the affected host(s) where the file was detected
    2. Search for all occurrences of the SHA256 hash across the network
    3. Review the file trajectory to identify:
       - Initial download/transfer source
       - All hosts that received or executed the file
       - Time elapsed between initial detection and retrospective identification
    4. Check if the file has been executed on any systems
    5. Initiate incident response procedures if execution is confirmed
    6. Update security controls to block the identified hash
    7. Review why initial detection failed and adjust policies if needed
    8. Search for similar files or variants using fuzzy hashing
  where: (safe(log.eventType, "") == "RETROSPECTIVE_MALWARE" || safe(log.eventType, "") == "MALWARE_DISPOSITION_CHANGED" || safe(log.message, "") contains "retrospective" || safe(log.message, "") contains "disposition changed") && (safe(log.disposition, "") in ["MALWARE", "MALICIOUS"] || safe(log.newDisposition, "") in ["MALWARE", "MALICIOUS"]) && safe(log.origin.ip, "") != "" && safe(log.sha256, "") != ""
  deduplicateBy:
    - lastEvent.log.sha256
    - lastEvent.log.origin.ip
