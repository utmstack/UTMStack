- id: 1015
  dataTypes:
    - cisco-firepower
  name: Encrypted Visibility Engine (EVE) Malicious Traffic Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Encrypted Threats
  technique: "T1573 - Encrypted Channel"
  adversary: origin
  references:
    - https://secure.cisco.com/secure-firewall/docs/encrypted-visibility-engine
    - https://attack.mitre.org/techniques/T1573/
  description: |
    Detects when Encrypted Visibility Engine identifies malicious encrypted traffic based on TLS fingerprinting, threat scores, and machine learning analysis without decryption.
    
    Next Steps:
    1. Review the TLS fingerprint and threat score details to understand the nature of the threat
    2. Check if the source IP has been involved in other suspicious activities
    3. Investigate the destination IP/domain reputation in threat intelligence sources
    4. Review network flows to/from the affected host for additional indicators
    5. If confirmed malicious, consider blocking the source IP and destination
    6. Check for lateral movement or data exfiltration attempts from the source host
  where: safe(log.eventType, "") == "EVE_EVENT" && (safe(log.eveThreatScore, 0) >= 70 || safe(log.eveDisposition, "") == "MALICIOUS" || safe(log.eveAction, "") == "BLOCK") && (safe(log.tlsFingerprint, "") != "" || safe(log.encryptedMalwareConfidence, 0) >= 80)
  deduplicateBy:
    - origin.ip
    - target.ip
    - log.tlsFingerprint
