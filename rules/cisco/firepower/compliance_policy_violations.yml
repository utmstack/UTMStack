- id: 1013
  dataTypes:
    - firepower
  name: Compliance Policy Violation Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Policy Violation
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/security/firepower/60/configuration/guide/fpmc-config-guide-v60/Correlation_and_Compliance_Events.html
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects when hosts or users violate compliance policies including whitelist violations, unauthorized software installations, or configuration compliance failures on Cisco Firepower devices.
    
    Next Steps:
    1. Review the specific violation type and affected system in the alert details
    2. Check if the violation is due to unauthorized software installation or configuration change
    3. Verify if the system should be exempt from this policy
    4. If legitimate, update compliance policies or whitelist; if not, remediate the violation
    5. Review recent changes or activities on the affected system
    6. Document the incident and remediation actions taken
  where: |
    (safe(log.eventType, "") == "COMPLIANCE_EVENT" || 
     safe(log.eventType, "") == "WHITE_LIST_EVENT") && 
    (safe(log.complianceStatus, "") == "NON_COMPLIANT" || 
     safe(log.whiteListViolation, "") != "" ||
     safe(log.action, "") == "VIOLATION") &&
    safe(log.violationType, "") != ""
  deduplicateBy:
    - origin.ip
    - log.violationType
