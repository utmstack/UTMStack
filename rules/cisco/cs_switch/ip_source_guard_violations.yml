- id: 1008
  dataTypes:
    - cs_switch
  name: IP Source Guard Violation
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Network Security
  technique: "T1557.002 - Adversary-in-the-Middle: ARP Cache Poisoning"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst6500/ios/15-0SY/configuration/guide/15_0_sy_swcg/ip_source_guard.html
    - https://attack.mitre.org/techniques/T1557/002/
  description: |
    Detects IP Source Guard violations which may indicate IP spoofing attempts. IP Source Guard provides security by filtering traffic based on DHCP snooping binding database.
    
    Next Steps:
    1. Investigate the source IP address and MAC address associated with the violation
    2. Check DHCP snooping binding database for legitimate entries
    3. Review recent DHCP requests from the affected interface
    4. Examine switch logs for other security violations from the same source
    5. Consider blocking the source MAC address if malicious activity is confirmed
    6. Verify IP Source Guard configuration on the affected interface
  where: (safe(log.eventType, "") == "IPSG" || safe(log.eventType, "") == "IP_SOURCE_GUARD") && (safe(log.action, "") == "deny" || safe(log.action, "") == "drop" || safe(log.violation, "") == "true" || (contains(safe(log.message, ""), "IP Source Guard") && (contains(safe(log.message, ""), "deny") || contains(safe(log.message, ""), "violation") || contains(safe(log.message, ""), "filtered"))))
  deduplicateBy:
    - origin.ip
    - origin.mac
