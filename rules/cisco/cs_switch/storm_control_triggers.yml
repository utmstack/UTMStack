- id: 1009
  dataTypes:
    - cs_switch
  name: Storm Control Triggered
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Network Security
  technique: "T1498 - Network Denial of Service"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst6500/ios/15-0SY/configuration/guide/15_0_sy_swcg/storm_control.html
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects storm control triggers which may indicate broadcast, multicast, or unicast storms that could be part of a DoS attack or network misconfiguration.
    
    Next Steps:
    1. Identify the affected interface and storm type from the alert details
    2. Review current storm control thresholds on the affected interface
    3. Check interface statistics for abnormal traffic patterns or packet counts
    4. Investigate the source of the storm (broadcast, multicast, or unicast)
    5. Review recent configuration changes on the switch or connected devices
    6. Check for malfunctioning network cards or misconfigured devices
    7. Consider temporarily increasing storm control thresholds if legitimate traffic is being blocked
    8. Document the incident and update storm control policies if necessary
  where: |
    (safe(log.eventType, "") == "STORM_CONTROL" || 
     contains(safe(log.facility, ""), "STORM")) && 
    (safe(log.action, "") == "shutdown" || 
     safe(log.action, "") == "trap" ||
     safe(log.status, "") == "exceeded" ||
     (contains(safe(log.message, ""), "storm control") && 
      (contains(safe(log.message, ""), "exceeded") || 
       contains(safe(log.message, ""), "shutdown") ||
       contains(safe(log.message, ""), "threshold"))))
  deduplicateBy:
    - lastEvent.log.interface
    - lastEvent.log.stormType
