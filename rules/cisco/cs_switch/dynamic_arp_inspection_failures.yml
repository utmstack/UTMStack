- id: 1007
  dataTypes:
    - cs_switch
  name: Dynamic ARP Inspection Failure
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Network Security
  technique: "T1557.002 - ARP Cache Poisoning"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst6500/ios/15-0SY/configuration/guide/15_0_sy_swcg/dynamic_arp_inspection.html
    - https://attack.mitre.org/techniques/T1557/002/
  description: |
    Detects Dynamic ARP Inspection (DAI) failures which may indicate ARP spoofing attempts. DAI validates ARP packets to prevent man-in-the-middle attacks by verifying that the IP-to-MAC address bindings in ARP packets are valid.
    
    Next Steps:
    1. Identify the source MAC address and switch port associated with the failed ARP packets
    2. Check if the source is a legitimate device that may have incorrect network configuration
    3. Review DHCP snooping binding table to verify expected IP-MAC mappings
    4. Examine switch logs for other suspicious activities from the same source
    5. If malicious activity is confirmed, isolate the affected port and investigate the connected device
    6. Consider implementing port security to restrict MAC addresses on the affected port
  where: (safe(log.eventType, "") == "DAI" || safe(log.eventType, "") == "ARP_INSPECTION") && (safe(log.action, "") == "drop" || safe(log.action, "") == "deny" || safe(log.result, "") == "failed" || (contains(safe(log.message, ""), "ARP Inspection") && (contains(safe(log.message, ""), "drop") || contains(safe(log.message, ""), "invalid") || contains(safe(log.message, ""), "mismatch"))))
  deduplicateBy:
    - origin.ip
    - origin.mac
