- id: 1010
  dataTypes:
    - cs_switch
  name: Port Mirroring Configuration Change
  impact:
    confidentiality: 2
    integrity: 2
    availability: 1
  category: Network Security
  technique: "T1040 - Network Sniffing"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst6500/ios/15-0SY/configuration/guide/15_0_sy_swcg/span.html
    - https://attack.mitre.org/techniques/T1040/
  description: |
    Detects port mirroring (SPAN/RSPAN) configuration changes which could indicate unauthorized network monitoring or data exfiltration attempts. Port mirroring allows traffic from one or more switch ports to be copied to another port, potentially enabling an attacker to capture sensitive network traffic.
    
    Next Steps:
    1. Verify if the configuration change was authorized by reviewing change management tickets
    2. Identify the user account that made the change and confirm their authorization
    3. Review the specific SPAN/RSPAN configuration to understand which ports are being monitored
    4. Check if sensitive network segments are being mirrored
    5. Look for any unusual data transfers from the destination port
    6. Review other configuration changes made by the same account in the past 24 hours
    7. If unauthorized, immediately remove the port mirroring configuration
  where: (safe(log.eventType, "") == "CONFIG" || safe(log.eventType, "") == "SPAN" || safe(log.facility, "") == "SYS") && (contains(safe(log.command, ""), "monitor session") || contains(safe(log.command, ""), "span") || contains(safe(log.command, ""), "rspan") || contains(safe(log.message, ""), "SPAN") && (contains(safe(log.message, ""), "configured") || contains(safe(log.message, ""), "created") || contains(safe(log.message, ""), "modified")))
  deduplicateBy:
    - lastEvent.origin.user
    - lastEvent.target.host
