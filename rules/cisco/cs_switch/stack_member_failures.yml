- id: 1016
  dataTypes:
    - cs_switch
  name: Stack Member Failures Detection
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Infrastructure
  technique: "T1489 - Service Stop"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750/software/release/12-2_58_se/configuration/guide/3750scg/swstack.html
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects failures in Cisco switch stack members, which could indicate hardware issues, configuration problems, or potential denial of service conditions affecting network availability.
    
    Next Steps:
    1. Verify the current stack status by logging into the affected switch and running "show switch" command
    2. Check the physical connections between stack members for loose or damaged cables
    3. Review recent configuration changes that might have affected stack operations
    4. Examine system logs for hardware errors or power supply issues
    5. If a member is consistently failing, consider replacing the hardware or stack cables
    6. Document the incident and any remediation steps taken for future reference
  where: |
    safe(log.facility, "") == "STACKMGR" && 
    (contains(safe(log.message, ""), "stack member") && 
     (contains(safe(log.message, ""), "fail") || 
      contains(safe(log.message, ""), "down") || 
      contains(safe(log.message, ""), "removed") || 
      contains(safe(log.message, ""), "lost"))) ||
    (safe(log.severity, 10) <= 3 && contains(safe(log.message, ""), "STACKMGR"))
  deduplicateBy:
    - origin.hostname
    - log.facility
