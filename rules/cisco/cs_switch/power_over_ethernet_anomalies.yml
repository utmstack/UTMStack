- id: 1015
  dataTypes:
    - cs_switch
  name: Power over Ethernet Anomaly Detected
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Power Management
  technique: "T1529 - System Shutdown/Reboot"
  adversary: target
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-16/configuration_guide/sys_mgmt/b_1716_sys_mgmt_9300_cg/configuring_system_message_logs.html
    - https://attack.mitre.org/techniques/T1529/
  description: |
    Detects Power over Ethernet (PoE) anomalies including power budget exceeded, device power faults, or unusual power consumption patterns that may indicate hardware issues or malicious devices attempting to disrupt network operations.
    
    Next Steps:
    1. Identify the affected interface and connected device from the alert details
    2. Check the switch's current power budget utilization (show power inline)
    3. Verify if the connected device is legitimate and authorized
    4. Review recent power consumption trends on the affected interface
    5. Investigate if multiple interfaces are experiencing similar issues (potential hardware failure)
    6. Check for any recently connected devices that may be drawing excessive power
    7. Consider temporarily disabling PoE on the affected interface if the issue persists
    8. Document the incident and update the power budget if legitimate devices require more power
  where: |
    (safe(log.facility, "") == "ILPOWER" || 
     safe(log.facility, "") == "POE" ||
     safe(log.facility, "") == "POWER") &&
    (contains(safe(log.message, ""), "power budget exceeded") ||
     contains(safe(log.message, ""), "power denied") ||
     contains(safe(log.message, ""), "power fault") ||
     contains(safe(log.message, ""), "overload condition") ||
     contains(safe(log.message, ""), "PoE fault") ||
     contains(safe(log.message, ""), "inline power") ||
     safe(log.mnemonic, "") == "POWER_BUDGET_EXCEEDED" ||
     safe(log.mnemonic, "") == "POWER_DENIED" ||
     safe(log.mnemonic, "") == "FAULT_DETECT" ||
     safe(log.mnemonic, "") == "OVERLOAD")
  deduplicateBy:
    - lastEvent.target.host
    - safe(log.interface, "")
