- id: 1022
  dataTypes:
    - cs_switch
  name: MAC Authentication Bypass Suspicious Attempts
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Credential Access
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/16-6/configuration_guide/sec/b_166_sec_9300_cg/configuring_ieee_802_1x_port_based_authentication.html
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects suspicious MAC Authentication Bypass (MAB) attempts including rapid authentication requests or unusual patterns that could indicate MAC spoofing or unauthorized device connection attempts. MAB allows network access based on MAC addresses when 802.1X authentication is not available, making it a potential attack vector.
    
    Next Steps:
    1. Verify if the MAC address is legitimate and belongs to an authorized device in your asset inventory
    2. Check if the interface should have MAB enabled or if it's misconfigured - review port configuration
    3. Review historical authentication logs for the same MAC address to identify patterns of suspicious behavior
    4. Compare the MAC address against known device inventory and approved MAC address whitelist
    5. If unauthorized, immediately block the MAC address at the switch level and investigate physical port location
    6. Look for other authentication attempts from the same interface or MAC address across different switches in the network
    7. Consider implementing 802.1X authentication as a more secure alternative to MAB for this interface
    8. Review DHCP logs to see if this MAC has been assigned an IP address recently
    9. Check for concurrent authentication attempts from multiple interfaces which may indicate MAC spoofing attacks
  where: |
    (safe(log.facility, "") == "MAB" || safe(log.facility, "") == "AUTHMGR") && 
    safe(log.mnemonic, "").contains("START") &&
    safe(log.message, "").contains("mab") &&
    safe(origin.mac, "") != "" &&
    safe(target.host, "") != ""
  afterEvents:
    - indexPattern: v11-log-cisco-switch-*
      with:
        - field: target.host.keyword
          operator: filter_term
          value: '{{target.host}}'
      within: now-5m
      count: 10
  deduplicateBy:
    - origin.mac
    - target.host
