- id: 1021
  dataTypes:
    - cs_switch
  name: 802.1X Authentication Failures Detection
  impact:
    confidentiality: 2
    integrity: 2
    availability: 1
  category: Unauthorized Access
  technique: "T1110 - Brute Force"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/16-6/configuration_guide/sec/b_166_sec_9300_cg/configuring_ieee_802_1x_port_based_authentication.html
    - https://attack.mitre.org/techniques/T1110/
  description: |
    Detects multiple 802.1X authentication failures from the same MAC address or interface, which could indicate unauthorized access attempts or misconfigured supplicants.
    
    Next Steps:
    1. Check the source MAC address and interface for any known devices
    2. Review the switch configuration to ensure 802.1X is properly configured
    3. Verify if the supplicant device has the correct credentials configured
    4. Check for any recent changes to the network authentication infrastructure
    5. Consider temporarily blocking the MAC address if the attempts continue
    6. Review RADIUS server logs for additional authentication failure details
  where: safe(log.facility, "") == "DOT1X" && safe(log.severity, 5) >= 5 && safe(log.mnemonic, "") == "FAIL" && safe(log.message, "").contains("authentication") && safe(origin.mac, "") != ""
  afterEvents:
    - indexPattern: v11-log-cisco-switch-*
      with:
        - field: origin.mac.keyword
          operator: filter_term
          value: '{{origin.mac}}'
        - field: log.facility.keyword
          operator: filter_term
          value: 'DOT1X'
        - field: log.mnemonic.keyword
          operator: filter_term
          value: 'FAIL'
      within: now-10m
      count: 5
  deduplicateBy:
    - origin.mac
    - origin.interface
