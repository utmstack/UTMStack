- id: 1004
  dataTypes:
    - cs_switch
  name: Spanning Tree Protocol Attack Detection
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Network Attack
  technique: "T1498 - Network Denial of Service"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/support/docs/lan-switching/spanning-tree-protocol/10556-16.html
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects potential Spanning Tree Protocol (STP) attacks including root bridge takeover attempts, BPDU spoofing, and topology change attacks. These attacks can cause network loops, denial of service, or allow traffic interception.
    
    Next Steps:
    1. Immediately identify the affected switch interface and connected device
    2. Review switch logs to determine the type of STP violation (BPDU Guard, Root Guard, Loop Guard)
    3. Physically trace the interface to identify the connected device
    4. If BPDU Guard violation: Check if a switch/bridge was connected to an access port
    5. If Root Guard violation: Investigate potential root bridge takeover attempt
    6. Consider temporarily shutting down the interface if attack is ongoing
    7. Review STP configuration and ensure proper security features are enabled (BPDU Guard on access ports, Root Guard on uplinks)
    8. Check for any network instability or loops that may have occurred
    9. Document the incident and update network diagrams if unauthorized devices were found
  where: |
    (safe(log.facility, "") == "SPANTREE" && safe(log.mnemonic, "") in ["BLOCK_BPDUGUARD", "RECV_1Q_NON_TRUNK", "ROOTGUARD_BLOCK", "LOOPGUARD_BLOCK"]) ||
    (safe(log.facility, "") == "SPANTREE" && safe(log.mnemonic, "") in ["INCONSISTENCY", "PVID_MISMATCH", "TYPE_MISMATCH"]) ||
    (safe(log.message, "") =~ "(?i)(bpdu.*guard.*violation|received.*bpdu.*on.*bpduguard.*enabled)") ||
    (safe(log.message, "") =~ "(?i)(root.*guard.*blocking|topology.*change.*notification|inferior.*bpdu.*received)") ||
    (safe(log.message, "") =~ "(?i)(spanning.*tree.*loop|stp.*inconsistent|port.*type.*inconsistent)") ||
    (safe(log.severity, 999) <= 3 && safe(log.message, "") =~ "(?i)(stp.*attack|bpdu.*flood|root.*bridge.*change)")
  deduplicateBy:
    - lastEvent.log.interface
    - origin.host
