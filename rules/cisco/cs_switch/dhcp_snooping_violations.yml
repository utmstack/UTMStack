- id: 1006
  dataTypes:
    - cs_switch
  name: DHCP Snooping Violation Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Security
  technique: "T1557.003 - Adversary-in-the-Middle: DHCP Spoofing"
  adversary: origin
  references:
    - https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst6500/ios/15-0SY/configuration/guide/15_0_sy_swcg/dhcp_snooping.html
    - https://attack.mitre.org/techniques/T1557/003/
  description: |
    Detects DHCP snooping violations which may indicate attempts to perform DHCP spoofing attacks. DHCP snooping is a security feature that acts like a firewall between untrusted hosts and trusted DHCP servers. These violations could indicate malicious DHCP servers attempting to redirect network traffic or perform man-in-the-middle attacks.
    
    Next Steps:
    1. Identify the source MAC address and switch port associated with the violation
    2. Check if the source is a legitimate DHCP server that needs to be added to the trusted list
    3. Review DHCP bindings table to identify any rogue DHCP offers
    4. Examine network traffic from the violating source for other suspicious activities
    5. If confirmed malicious, block the port and investigate the physical location of the device
    6. Review DHCP snooping configuration to ensure proper trusted ports are configured
  where: |
    safe(log.eventType, "") == "DHCP_SNOOPING" && 
    (safe(log.action, "") == "denied" || 
     safe(log.action, "") == "dropped" ||
     safe(log.violation, "") == "true" ||
     contains(safe(log.message, ""), "DHCP_SNOOPING") && 
     (contains(safe(log.message, ""), "dropped") || 
      contains(safe(log.message, ""), "violation") ||
      contains(safe(log.message, ""), "untrusted")))
  deduplicateBy:
    - origin.mac
    - origin.port
