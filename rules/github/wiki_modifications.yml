- id: 1028
  dataTypes:
    - github
  name: Wiki Modifications
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Defense Evasion
  technique: "T1070 - Indicator Removal"
  adversary: origin
  references:
    - https://docs.github.com/en/webhooks/webhook-events-and-payloads#gollum
    - https://attack.mitre.org/techniques/T1070/
  description: |
    Detects modifications to repository wikis which could be used to spread misinformation, hide malicious documentation, or remove important security guidelines and procedures. This rule monitors wiki page creation, editing, and deletion events.
    
    Next Steps:
    1. Review the modified wiki pages and their content changes
    2. Verify if the user has legitimate permissions to modify wiki content
    3. Check the user's recent activity for other suspicious wiki modifications
    4. Review the content that was added, modified, or deleted for malicious content
    5. If unauthorized, revert the changes and investigate the user account
    6. Consider implementing wiki access controls and approval workflows
  where: >-
    safe(log.action, "") in ["created", "edited", "destroyed"] &&
    (contains(safe(log.event, ""), "gollum") || safe(log.pages, "") != "")
  afterEvents:
    - indexPattern: v11-log-github-*
      with:
        - field: log.senderLogin.keyword
          operator: filter_term
          value: '{{log.senderLogin}}'
        - field: log.repositoryName.keyword
          operator: filter_term
          value: '{{log.repositoryName}}'
        - field: log.action.keyword
          operator: filter_term
          value: '{{log.action}}'
      within: now-1h
      count: 5
  deduplicateBy:
    - log.repositoryName
    - log.senderLogin
