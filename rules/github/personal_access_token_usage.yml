- id: 1007
  dataTypes:
    - github
  name: GitHub Personal Access Token Suspicious Usage
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Credential Access
  technique: "T1528 - Steal Application Access Token"
  adversary: origin
  references:
    - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
    - https://attack.mitre.org/techniques/T1528/
  description: |
    Detects suspicious personal access token (PAT) activities including creation, usage from unusual locations, or multiple token operations. This could indicate compromised credentials or unauthorized access attempts.
    
    Next Steps:
    1. Review the user account associated with the PAT activity for any unauthorized access
    2. Check if the PAT was created during normal business hours and from expected locations
    3. Verify with the user if they authorized the PAT creation or usage
    4. Review recent repository access and modifications made using this PAT
    5. If unauthorized, immediately revoke the PAT and reset user credentials
    6. Enable two-factor authentication if not already enabled
    7. Review audit logs for any data exfiltration or unauthorized changes
  where: |
    safe(log.action, "") in ["personal_access_token.create", "personal_access_token.destroy", "personal_access_token.request_created", "personal_access_token.request_approved", "personal_access_token.request_denied"] ||
    (safe(log.programmatic_access_type, "") in ["personal access token", "fine-grained personal access token"] && safe(log.action, "") in ["git.clone", "git.fetch", "git.push"]) ||
    safe(log.event, "") == "personal_access_token_request"
  deduplicateBy:
    - log.actor
    - log.action
