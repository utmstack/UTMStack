- id: 1021
  dataTypes:
    - github
  name: GitHub Enterprise Member Changes
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Identity and Access Management
  technique: Account Manipulation
  adversary: origin
  references:
    - https://docs.github.com/en/webhooks/webhook-events-and-payloads#member
    - https://attack.mitre.org/techniques/T1098/
  description: |
    Detects changes to enterprise member status including additions and removals. This could indicate unauthorized access management or insider threats attempting to modify organization membership.
    
    Next Steps:
    - Verify if the user performing the action (senderLogin) is authorized to manage members
    - Check if the member changes align with approved access requests or HR processes
    - Review the member account that was added/removed for any suspicious activity
    - Investigate if multiple member changes occurred in a short timeframe
    - Validate with the organization owner if these changes were expected
  where: safe(log.action, "") == "member.added" || safe(log.action, "") == "member.removed" || safe(log.action, "") == "member.edited"
  deduplicateBy:
    - lastEvent.log.member
    - lastEvent.log.action
