- id: 1012
  dataTypes:
    - github
  name: Large File Upload to GitHub Repository
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Exfiltration
  technique: "T1074 - Data Staged"
  adversary: origin
  references:
    - https://docs.github.com/en/repositories/working-with-files/managing-large-files
    - https://attack.mitre.org/techniques/T1074/
  description: |
    Detects large file uploads to GitHub repositories which could indicate data exfiltration, storage of malicious payloads, or attempts to abuse repository storage. Attackers may use repositories to stage stolen data or host malware.
    
    Next Steps:
    1. Review the repository and uploaded files to determine if they are legitimate
    2. Check the user's recent activity for other suspicious commits or repository changes
    3. Verify if the large files contain sensitive data or known malware signatures
    4. Review repository permissions and access controls
    5. Consider implementing Git LFS (Large File Storage) policies if legitimate large files are needed
    6. Contact the user to verify if the upload was intentional
    7. If malicious activity is confirmed, revoke user access and remove the compromised files
  where: |
    safe(log.action, "") == "push" &&
    safe(log.repositorySize, 0) > 100 &&
    safe(log.repositoryName, "") != "" &&
    (safe(log.size, 0) > 50 ||
     (has(log.commits) && size(safe(log.commits, [])) > 0))
  afterEvents:
    - indexPattern: v11-log-github-*
      with:
        - field: log.pusherName.keyword
          operator: filter_term
          value: '{{log.pusherName}}'
        - field: log.repositoryName.keyword
          operator: filter_term
          value: '{{log.repositoryName}}'
      within: now-30m
      count: 3
  deduplicateBy:
    - log.pusherName
    - log.repositoryName
