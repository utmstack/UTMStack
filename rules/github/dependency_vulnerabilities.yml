- id: 1014
  dataTypes:
    - github
  name: Critical Dependency Vulnerability Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Initial Access
  technique: "T1190 - Exploit Public-Facing Application"
  adversary: origin
  references:
    - https://docs.github.com/en/code-security/dependabot/dependabot-alerts/about-dependabot-alerts
    - https://attack.mitre.org/techniques/T1190/
  description: |
    Detects high-severity dependency vulnerabilities identified by Dependabot or dependency scanning. These vulnerabilities could be exploited by attackers to compromise applications or gain unauthorized access to systems.
    
    Next Steps:
    1. Review the vulnerability details and affected dependencies in the repository
    2. Check if the vulnerable dependency is actively used in production code
    3. Assess the exploitability and potential impact on your application
    4. Apply available patches or upgrade to secure versions immediately
    5. If no patch is available, consider implementing compensating controls or removing the dependency
    6. Review all repositories using the same dependency for similar vulnerabilities
    7. Update dependency management policies to prevent future vulnerable dependencies
  where: >
    (safe(log.action, "") == "dependabot_alert.created" ||
     safe(log.action, "") == "dependabot_alert.reintroduced" ||
     safe(log.action, "") == "vulnerability_alert.create") &&
    (safe(log.alert.severity, "") == "critical" ||
     safe(log.alert.severity, "") == "high" ||
     safe(log.severity, "") == "critical" ||
     safe(log.severity, "") == "high") &&
    safe(log.repositoryName, "") != ""
  deduplicateBy:
    - lastEvent.log.repositoryName
    - lastEvent.log.packageName
