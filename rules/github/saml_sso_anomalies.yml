- id: 1018
  dataTypes:
    - github
  name: GitHub SAML SSO Authentication Anomaly
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Initial Access
  technique: "T1078: Valid Accounts"
  adversary: origin
  references:
    - https://docs.github.com/en/organizations/managing-saml-single-sign-on-for-your-organization
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects anomalous SAML SSO authentication events including failures, bypass attempts, or configuration changes. This could indicate unauthorized access attempts or compromise of SAML identity provider.
    
    Next Steps:
    1. Review the authentication logs to identify the source of the anomaly and verify if it's legitimate activity
    2. Check if the user account associated with the SAML SSO event has been compromised
    3. Verify SAML provider configuration and ensure no unauthorized changes have been made
    4. Review organization's SAML SSO settings in GitHub for any recent modifications
    5. Contact the affected user to confirm if they attempted the authentication
    6. If malicious activity is confirmed, disable the user's access and reset SAML configuration
    7. Investigate the identity provider logs for signs of compromise
    8. Consider implementing additional authentication factors for sensitive operations
  where: safe(log.action, "") in ["saml_sso_auth.failure", "saml_sso_auth.bypass", "saml_sso.update", "saml_sso.disable", "saml_sso.enable", "org.saml_sso_response_auth_failure"] || (safe(log.action, "") contains "saml" && (safe(log.action, "") contains "fail" || safe(log.action, "") contains "error"))
  afterEvents:
    - indexPattern: v11-log-github-*
      with:
        - field: log.senderLogin.keyword
          operator: filter_term
          value: '{{log.senderLogin}}'
      within: now-30m
      count: 3
  deduplicateBy:
    - log.senderLogin
    - origin.ip
