- id: 1004
  dataTypes:
    - github
  name: GitHub Branch Protection Bypass Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Defense Evasion
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://docs.github.com/en/webhooks/webhook-events-and-payloads#branch_protection_rule
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects attempts to bypass, disable, or modify branch protection rules which could allow unauthorized code changes to critical branches. Branch protection rules are crucial security controls that prevent direct pushes to important branches, require pull request reviews, and enforce status checks.
    
    Next Steps:
    1. Verify if the user who modified the branch protection rules has legitimate administrative privileges
    2. Review the specific changes made to the branch protection settings
    3. Check for any unauthorized commits or merges that occurred after the protection was modified
    4. Audit recent repository access logs for suspicious activities from the same user
    5. Consider re-enabling or strengthening branch protection rules if they were weakened
    6. Interview the user to understand the business justification for the changes
  where: >
    (safe(log.action, "") == "branch_protection_rule.deleted" || 
     safe(log.action, "") == "branch_protection_rule.edited" ||
     safe(log.action, "") == "branch_protection_rule.disabled" ||
     safe(log.action, "") == "protected_branch.destroy" ||
     safe(log.action, "") == "protected_branch.update_allow_force_pushes" ||
     safe(log.action, "") == "protected_branch.update_allow_deletions" ||
     safe(log.action, "") == "protected_branch.policy_override") &&
    (safe(log.repositoryDefaultBranch, "") != "" ||
     safe(log.repositoryMasterBranch, "") != "" ||
     safe(log.protectedBranch, "") != "" ||
     safe(log.branchName, "") =~ "(?i)^(main|master|prod|production|release|develop)$") &&
    safe(log.senderLogin, "") != ""
  afterEvents:
    - indexPattern: v11-log-github-*
      with:
        - field: log.repositoryName.keyword
          operator: filter_term
          value: '{{log.repositoryName}}'
        - field: log.senderLogin.keyword
          operator: filter_term
          value: '{{log.senderLogin}}'
        - field: log.action.keyword
          operator: filter_match
          value: branch_protection_rule
      within: now-24h
      count: 2
  deduplicateBy:
    - log.repositoryName
    - log.senderLogin
