- id: 1029
  dataTypes:
    - github
  name: Release Tampering
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Initial Access
  technique: Supply Chain Compromise
  adversary: origin
  references:
    - https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
    - https://attack.mitre.org/techniques/T1195/
  description: |
    Detects suspicious modifications to releases including edits, deletions, or rapid changes that could indicate attempts to inject malicious code into software distributions or tamper with release artifacts.
    
    Next Steps:
    1. Review the release modification history and identify what changes were made
    2. Verify if the user who made the changes has legitimate access and authorization
    3. Compare release artifacts before and after the modification for any malicious content
    4. Check for any unusual patterns such as rapid edits or deletions followed by re-releases
    5. Review the user's recent activity for other suspicious behaviors
    6. If tampering is confirmed, immediately notify the repository owners and consider rolling back changes
    7. Audit all downstream systems that may have pulled the tampered release
  where: >-
    safe(log.action, "") in ["edited", "deleted", "unpublished", "prereleased"] &&
    safe(log.release, "") != "" &&
    (safe(log.repository_releases_url, "") != "" || contains(safe(log.event, ""), "release"))
  afterEvents:
    - indexPattern: v11-log-github-*
      with:
        - field: log.repository_name.keyword
          operator: filter_term
          value: '{{log.repository_name}}'
        - field: log.action.keyword
          operator: filter_term
          value: edited
      within: now-4h
      count: 3
  deduplicateBy:
    - lastEvent.log.repository_name
    - lastEvent.log.release.id
