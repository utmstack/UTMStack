- id: 1027
  dataTypes:
    - github
  name: Fork Permission Changes
  impact:
    confidentiality: 2
    integrity: 2
    availability: 1
  category: Privilege Escalation
  technique: "T1069 - Permission Groups Discovery"
  adversary: origin
  references:
    - https://docs.github.com/en/webhooks/webhook-events-and-payloads#fork
    - https://attack.mitre.org/techniques/T1069/
  description: |
    Detects changes to fork permissions or unusual forking activity that could indicate attempts to steal source code or create malicious copies of repositories for supply chain attacks.
    
    Next Steps:
    1. Review the repository that was forked or had its permissions changed
    2. Verify if the user who performed the action has legitimate access to fork repositories  
    3. Check if this is part of normal development workflow or an unauthorized action
    4. Look for any sensitive code or credentials in the forked repository
    5. If suspicious, review the user's recent GitHub activity for other anomalous behavior
    6. Consider revoking fork permissions if unauthorized access is confirmed
    7. Examine the destination of the fork and verify the receiving account is legitimate
    8. Check organizational policies regarding repository forking and ensure compliance
    9. Review repository access logs for any other suspicious activities around the same timeframe
    10. If this appears to be part of a coordinated attack, escalate to security team immediately
  where: >-
    (safe(log.action, "") == "created" && safe(log.forkee, "") != "") ||
    (safe(log.repositoryAllowForking, false) == true && safe(log.action, "") == "edited") ||
    (safe(log.repositoryFork, false) == true && safe(log.repositoryPrivate, false) == false)
  afterEvents:
    - indexPattern: v11-log-github-*
      with:
        - field: log.senderLogin.keyword
          operator: filter_term
          value: '{{safe(log.senderLogin, "")}}'
        - field: log.action.keyword
          operator: filter_term
          value: created
      within: now-24h
      count: 10
  deduplicateBy:
    - lastEvent.log.repositoryName
    - lastEvent.log.senderLogin
