- id: 1008
  dataTypes:
    - github
  name: GitHub SSH Key Management Activity
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Persistence
  technique: Account Manipulation
  adversary: origin
  references:
    - https://docs.github.com/en/authentication/connecting-to-github-with-ssh
    - https://attack.mitre.org/techniques/T1098/
  description: |
    Detects SSH key additions, modifications, or suspicious usage patterns. This could indicate an attacker establishing persistence through SSH keys or unauthorized access to repositories.
    
    Next Steps:
    1. Verify if the SSH key activity was authorized by checking with the user who performed the action
    2. Review the user's recent activity for any other suspicious actions
    3. Check if the SSH key was immediately used to access sensitive repositories
    4. If unauthorized, immediately revoke the SSH key through GitHub settings
    5. Review audit logs for any data access or modifications made using the compromised key
    6. Consider enforcing SSH key rotation policies and requiring additional authentication for key management
  where: safe(log.action, "") in ["public_key.create", "public_key.delete", "public_key.update", "public_key.verify"] || (safe(log.event, "") == "public_key" && safe(log.action, "") in ["create", "delete"]) || (safe(log.programmatic_access_type, "") in ["ssh key", "deploy key"] && safe(log.action, "") in ["git.clone", "git.fetch", "git.push"]) || safe(log.action, "") in ["repo.add_deploy_key", "repo.remove_deploy_key"]
  deduplicateBy:
    - lastEvent.log.senderLogin
    - lastEvent.log.repositoryName
