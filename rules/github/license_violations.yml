- id: 1013
  dataTypes:
    - github
  name: GitHub License Compliance Violation
  impact:
    confidentiality: 1
    integrity: 3
    availability: 1
  category: Resource Development
  technique: Develop Capabilities
  adversary: origin
  references:
    - https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/licensing-a-repository
    - https://attack.mitre.org/techniques/T1587/
  description: |
    Detects potential license violations or changes in repository licensing that could lead to legal compliance issues. This includes removal of license files, addition of incompatible dependencies, or changes to repository visibility that may violate license terms.
    
    Next Steps:
    1. Review the repository changes to understand what license-related modifications were made
    2. Verify if the repository contains proprietary code that requires specific licensing
    3. Check if any dependencies have incompatible licenses with the project's license
    4. Contact the repository owner to ensure compliance with licensing requirements
    5. If a license was removed, verify this was intentional and not malicious
    6. Review organizational policies regarding open source licensing and compliance
    7. Examine the commit details to understand the scope of licensing changes
    8. Validate that repository visibility changes are authorized and compliant
  where: |
    (safe(log.action, "") == "repository.publicized" ||
     safe(log.action, "") == "repository.privatized" ||
     (safe(log.action, "") == "push" && 
      (contains(safe(log.headCommitRemoved, ""), "LICENSE") ||
       contains(safe(log.headCommitRemoved, ""), "COPYING") ||
       contains(safe(log.headCommitModified, ""), "LICENSE") ||
       contains(safe(log.headCommitModified, ""), "package.json") ||
       contains(safe(log.headCommitModified, ""), "requirements.txt") ||
       contains(safe(log.headCommitModified, ""), "Gemfile") ||
       contains(safe(log.headCommitModified, ""), "pom.xml")))) &&
    safe(log.repositoryName, "") != ""
  deduplicateBy:
    - lastEvent.log.repositoryName
    - lastEvent.log.action
