# Rule version v2.0.0

dataTypes:
  - suricata
name: ICMP Tunneling Detection via Suricata
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Command and Control
technique: "T1572 - Protocol Tunneling"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1572/
  - https://www.sans.org/reading-room/whitepapers/covert/icmp-tunneling-is-is-secure-1857
  - https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
description: |
  Detects potential ICMP tunneling activity based on abnormal ICMP echo traffic: a long echo exchange whose packets are much larger than a normal ping. ICMP tunneling is a covert channel technique used by attackers to bypass network security controls and establish command and control communications.

  The rule reads Suricata flow records for ICMP and ICMPv6 echo requests and replies. It matches a flow of at least 10 packets toward the server whose packets average at least 300 bytes in either direction. A normal ping sends packets of about 60 to 100 bytes; tunnels fill the echo payload with data.

  Next Steps:
  1. Investigate the source IP address for other suspicious network activities
  2. Analyze the ICMP packet payload for hidden data or commands
  3. Check if the destination IP is a known external server or suspicious domain
  4. Review network logs for patterns of regular ICMP traffic to the same destination
  5. Examine endpoint logs on the source machine for signs of compromise
  6. Consider blocking ICMP traffic to external destinations if not business-critical
  7. Implement ICMP payload inspection rules to detect tunneling signatures
  8. Monitor for other covert channel techniques from the same source
where: |
  equals("log.eventType", "flow") &&
  oneOf("protocol", ["ICMP", "IPv6-ICMP"]) &&
  oneOf("log.icmp_type", [0, 8, 128, 129]) &&
  greaterOrEqual("log.flow.pkts_toserver", 10) &&
  (
    safe("log.flow.bytes_toserver", 0.0) >= 300.0 * safe("log.flow.pkts_toserver", 0.0) ||
    (greaterThan("log.flow.pkts_toclient", 0) &&
     safe("log.flow.bytes_toclient", 0.0) >= 300.0 * safe("log.flow.pkts_toclient", 0.0))
  )
deduplicateBy:
  - dataSource
  - adversary.ip
  - target.ip
