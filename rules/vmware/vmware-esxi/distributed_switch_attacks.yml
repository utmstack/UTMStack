- id: 1011
  dataTypes:
    - vmware-esxi
  name: Distributed Switch Security Policy Modification
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Network Security
  technique: "T1599 - Network Boundary Bridging"
  adversary: origin
  references:
    - https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.security.doc/GUID-E9A41435-4081-47D9-9B34-48CABE7BF60C.html
    - https://attack.mitre.org/techniques/T1599/
  description: |
    Detects unauthorized changes to distributed switch security policies including promiscuous mode, MAC address changes, or forged transmits settings which could indicate attempts to bypass network security controls.
    
    Next Steps:
    1. Verify the legitimacy of the security policy change with the VMware administrator
    2. Check the user account that made the change and validate it has appropriate permissions
    3. Review vCenter audit logs for other suspicious administrative activities
    4. Examine network traffic patterns for signs of lateral movement or data exfiltration
    5. Verify that the change aligns with documented change management procedures
    6. Consider reverting the security policy change if unauthorized
    7. Monitor for any abnormal network behavior on affected VLANs
  where: |
    safe(log.message, "") != "" && 
    (
      (safe(log.message, "") =~ "(?i)promiscuous.*mode.*change" ||
       safe(log.message, "") =~ "(?i)promiscuous.*accept" ||
       safe(log.message, "") =~ "(?i)forged.*transmit.*change" ||
       safe(log.message, "") =~ "(?i)forged.*transmit.*accept" ||
       safe(log.message, "") =~ "(?i)mac.*address.*change.*policy" ||
       safe(log.message, "") =~ "(?i)security.*policy.*modified" ||
       safe(log.message, "") =~ "(?i)vds.*security.*setting") &&
      (safe(log.process, "") =~ "(?i)hostd" ||
       safe(log.process, "") =~ "(?i)vpxd" ||
       safe(log.process, "") =~ "(?i)vmkernel")
    )
  deduplicateBy:
    - origin.hostname
