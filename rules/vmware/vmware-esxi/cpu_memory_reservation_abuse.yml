- id: 1027
  dataTypes:
    - vmware-esxi
  name: CPU/Memory Reservation Abuse Detection
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: Resource Manipulation
  technique: System Resource Modifications
  adversary: origin
  references:
    - https://docs.vmware.com/en/VMware-vSphere/8.0/vsphere-resource-management/GUID-98BD5A8A-260A-494F-BAAE-74781F5C4B87.html
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects unauthorized or excessive CPU/memory reservation modifications that could lead to resource starvation for other VMs or indicate privilege abuse. This rule identifies suspicious resource allocation changes that may be part of a denial of service attack or unauthorized privilege escalation.
    
    Next Steps:
    1. Verify the legitimacy of the resource allocation changes
    2. Check if the changes were authorized by system administrators
    3. Review the affected VM's resource usage patterns
    4. Investigate any concurrent privilege escalation attempts
    5. Examine system logs for other suspicious administrative activities
    6. Validate current resource reservations against organizational policies
  where: |
    safe(log.process, "") == "hostd" && 
    safe(log.message, "") != "" && 
    (safe(log.message, "").contains("reservation") || safe(log.message, "").contains("resource allocation")) &&
    (safe(log.message, "").contains("changed") || safe(log.message, "").contains("modified") || safe(log.message, "").contains("exceeded") || safe(log.message, "").contains("limit"))
  afterEvents:
    - indexPattern: v11-log-vmware-*
      with:
        - field: origin.hostname.keyword
          operator: filter_term
          value: '{{origin.hostname}}'
      within: now-30m
      count: 5
  deduplicateBy:
    - origin.hostname
    - lastEvent.log.eventInfo
