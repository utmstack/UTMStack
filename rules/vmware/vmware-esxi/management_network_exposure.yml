- id: 1014
  dataTypes:
    - vmware-esxi
  name: Management Network Exposure Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Network Security
  technique: "T1046 - Network Service Scanning"
  adversary: origin
  references:
    - https://cloud.google.com/blog/topics/threat-intelligence/vmware-detection-containment-hardening
    - https://attack.mitre.org/techniques/T1046/
  description: |
    Detects attempts to expose or access ESXi management interfaces from unauthorized networks, including suspicious SSH/HTTPS access attempts, management network misconfigurations, or attempts to bypass network segmentation.
    
    Next Steps:
    - Verify the source IP address attempting to access management interfaces
    - Check if the access attempt is from an authorized management network
    - Review firewall rules for management network segmentation
    - Examine hostd.log and rhttpproxy.log for additional context
    - Check for any recent configuration changes to management network settings
    - Verify SSH and HTTPS access control lists are properly configured
    - If unauthorized, block the source IP and investigate for potential compromise
  where: |
    safe(log.message, "") != "" && 
    (
      (safe(log.message, "") =~ "(?i)management.*network.*access.*denied" ||
       safe(log.message, "") =~ "(?i)ssh.*connection.*refused" ||
       safe(log.message, "") =~ "(?i)https.*unauthorized.*access" ||
       safe(log.message, "") =~ "(?i)management.*interface.*exposed" ||
       safe(log.message, "") =~ "(?i)admin.*port.*scan" ||
       safe(log.message, "") =~ "(?i)firewall.*rule.*bypass.*attempt" ||
       safe(log.message, "") =~ "(?i)management.*vlan.*breach" ||
       safe(log.message, "") =~ "(?i)esxi.*shell.*unauthorized" ||
       safe(log.message, "") =~ "(?i)dcui.*access.*violation") &&
      (safe(log.processName, "") =~ "(?i)hostd" ||
       safe(log.processName, "") =~ "(?i)vmkernel" ||
       safe(log.processName, "") =~ "(?i)sshd" ||
       safe(log.processName, "") =~ "(?i)rhttpproxy")
    ) ||
    (safe(severity, "") == "warning" && 
     safe(log.message, "") =~ "(?i)management.*security")
  deduplicateBy:
    - origin.hostname
