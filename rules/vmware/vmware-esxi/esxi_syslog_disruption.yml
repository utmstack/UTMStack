# Rule version v1.1.0

dataTypes:
  - vmware-esxi
name: ESXi Syslog Forwarding Disruption Detection
impact:
  confidentiality: 1
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1562.002 - Impair Defenses: Disable Windows Event Logging"
adversary: origin
references:
  - https://kb.vmware.com/s/article/2003322
  - https://attack.mitre.org/techniques/T1562/002/
description: |
  Detects attempts to disable or modify ESXi syslog forwarding to prevent security monitoring. Attackers disable syslog to operate without detection by the SIEM. ESXi also reports here when the remote log host becomes unreachable. One alert is raised per ESXi host; repeats are suppressed for seven days.

  Next Steps:
  1. Verify the syslog configuration change was authorized
  2. Re-enable syslog forwarding immediately if unauthorized
  3. Check for suspicious activity during the logging gap
  4. Review ESXi host for signs of compromise
  5. Implement monitoring for syslog service status
  6. Restrict access to syslog configuration
where: |
  exists("event.message") &&
  (
    (contains("event.message", "esxcli system syslog") && (
      contains("event.message", "config set") ||
      contains("event.message", "reload") ||
      contains("event.message", "--loghost")
    )) ||
    (contains("event.message", "syslog") && contains("event.message", "stopped")) ||
    (contains("event.message", "vmsyslogd") && contains("event.message", "terminated")) ||
    (contains("event.message", "syslog") && contains("event.message", "disabled")) ||
    (contains("event.message", "Syslog.global.logHost") && contains("event.message", "changed"))
  )
deduplicateBy:
  - dataSource
