- id: 1012
  dataTypes:
    - vmware-esxi
  name: VLAN Trunk Attack Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Security
  technique: "T1599.001 - Network Boundary Bridging: Network Address Translation Traversal"
  adversary: origin
  references:
    - https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.security.doc/GUID-A7E76D9B-92B4-4AD9-BB77-C3C59BDE37C1.html
    - https://attack.mitre.org/techniques/T1599/001/
  description: |
    Detects potential VLAN trunk attacks including attempts to configure trunk mode (VLAN 4095), unexpected VLAN tagging changes, or double-tagging attempts that could lead to VLAN hopping. These attacks can allow unauthorized network access and traffic interception.
    
    Next Steps:
    1. Immediately review the affected ESXi host's network configuration and port groups
    2. Check virtual switch VLAN settings and verify proper VLAN isolation
    3. Examine recent network configuration changes and identify who made them
    4. Review VM network adapter configurations for unauthorized VLAN assignments
    5. Monitor network traffic for signs of VLAN hopping or unauthorized network access
    6. Verify that trunk ports are properly configured with allowed VLAN lists
    7. Consider implementing additional network segmentation controls
  where: |
    safe(log.message, "") != "" && 
    (
      (safe(log.message, "") =~ "(?i)vlan.*4095" ||
       safe(log.message, "") =~ "(?i)trunk.*mode.*set" ||
       safe(log.message, "") =~ "(?i)vlan.*tag.*mismatch" ||
       safe(log.message, "") =~ "(?i)double.*tag" ||
       safe(log.message, "") =~ "(?i)unexpected.*tagged.*frame" ||
       safe(log.message, "") =~ "(?i)vlan.*hopping" ||
       safe(log.message, "") =~ "(?i)native.*vlan.*change" ||
       safe(log.message, "") =~ "(?i)port.*group.*vlan.*modified") &&
      (safe(log.process, "") =~ "(?i)vmkernel" ||
       safe(log.process, "") =~ "(?i)netcpa" ||
       safe(log.process, "") =~ "(?i)hostd")
    )
  deduplicateBy:
    - origin.hostname
