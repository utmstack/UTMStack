- id: 1005
  dataTypes:
    - vmware-esxi
  name: DRS (Distributed Resource Scheduler) Manipulation Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Virtualization Security
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.resmgmt.doc/GUID-8ACF3502-5314-469F-8CC9-4A9BD5925BC2.html
    - https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.monitoring.doc/GUID-9272E3B2-6A7F-427B-994C-B15FF8CADC25.html
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects unauthorized or suspicious manipulation of DRS (Distributed Resource Scheduler) settings, abnormal resource allocation changes, or attempts to bypass DRS policies that could lead to resource exhaustion or performance degradation. This includes disabling DRS, overriding DRS recommendations, modifying resource pools, or violating affinity/anti-affinity rules.

    Next Steps:
    1. Review the specific DRS configuration changes made and identify the user/administrator responsible
    2. Verify if the changes were authorized through proper change management processes
    3. Check for any performance impacts on the virtualization infrastructure
    4. Examine recent vCenter Server access logs for suspicious administrative activity
    5. Validate current DRS cluster configuration against baseline settings
    6. Review resource pool allocations and VM placement for abnormalities
    7. Check for any related security events or privilege escalation attempts
    8. If unauthorized, restore DRS settings from backup and investigate potential compromise
  where: |
    (safe(log.message, "") =~ "(?i)DRS" && safe(log.message, "") =~ "(?i)(disable|override|bypass|manipulat|tamper)") ||
    (safe(log.message, "") =~ "(?i)(resource.*pool|cluster)" && safe(log.message, "") =~ "(?i)(modify|change|alter)" && safe(log.message, "") =~ "(?i)(unauthorized|denied|failed)") ||
    (safe(log.message, "") =~ "(?i)distributed.*resource.*scheduler" && safe(log.message, "") =~ "(?i)(error|violation|conflict|anomaly)") ||
    (safe(log.eventInfo, "") =~ "(?i)(ClusterReconfigured|DrsVmPoweredOn)" && safe(log.message, "") =~ "(?i)(unauthorized|suspicious|abnormal)") ||
    (safe(log.message, "") =~ "(?i)(affinity|anti-affinity)" && safe(log.message, "") =~ "(?i)(rule|policy)" && safe(log.message, "") =~ "(?i)(violat|breach|bypass)")
  deduplicateBy:
    - origin.hostname
