- id: 1022
  dataTypes:
    - vmware-esxi
  name: Guest Introspection Bypass Attempt
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1211 - Exploitation for Defense Evasion"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1211/
    - https://cloud.google.com/blog/topics/threat-intelligence/vmware-esxi-zero-day-bypass
    - https://www.vmware.com/security/advisories/VMSA-2023-0013.html
  description: |
    Detects potential exploitation of CVE-2023-20867 or similar guest introspection bypass vulnerabilities by monitoring for anomalous vpxuser authentication attempts and Guest Operations without proper authentication.
    
    Next Steps:
    1. Immediately verify the integrity of the affected ESXi host
    2. Check for unauthorized VIB installations or modifications
    3. Review guest VM operations and authentication logs
    4. Inspect network connections from the affected host for lateral movement
    5. Verify all ESXi patches are current, especially for CVE-2023-20867
    6. Consider isolating the host until investigation is complete
    7. Review vCenter logs for related administrative actions
    8. Check for persistence mechanisms or backdoors installed
  where: |
    (contains(safe(log.message, ""), "vpxuser") && contains(safe(log.message, ""), "failed")) ||
    (contains(safe(log.message, ""), "GuestOps") && !contains(safe(log.message, ""), "authentication")) ||
    (contains(safe(log.message, ""), "Guest Introspection") && safe(severity, "") == "error") ||
    (contains(safe(log.message, ""), "esxupdate") && contains(safe(log.message, ""), "VIB installation")) ||
    (contains(safe(log.process, ""), "mux") && contains(safe(log.message, ""), "bypass"))
  afterEvents:
    - indexPattern: v11-log-vmware-esxi-*
      with:
        - field: origin.hostname.keyword
          operator: filter_term
          value: '{{origin.hostname}}'
        - field: log.message
          operator: filter_match
          value: 'GuestOps'
      within: now-30m
      count: 5
  deduplicateBy:
    - origin.hostname
