- id: 1004
  dataTypes:
    - vmware-esxi
  name: Storage vMotion Anomalies Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Virtualization Security
  technique: Storage Migration Tampering
  adversary: origin
  references:
    - https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.vcenterhost.doc/GUID-AB266895-BAA4-4BF3-894E-47F99DC7B77F.html
    - https://www.nakivo.com/blog/vmware-logs-analysis-for-troubleshooting/
  description: |
    Detects anomalous Storage vMotion operations including unauthorized datastore migrations, suspicious disk movements, or storage migration failures that could indicate data exfiltration attempts, storage corruption, or malicious VM manipulation.
    
    Storage vMotion allows migration of virtual machine disk files between datastores without downtime. Anomalous operations may indicate:
    - Unauthorized attempts to move sensitive VM data
    - Storage corruption or integrity violations
    - Failed migrations that could impact availability
    - Malicious attempts to relocate VMs for data access
    
    Next Steps:
    1. Verify the legitimacy of the storage migration operation
    2. Check if the operation was authorized by VMware administrators
    3. Review datastore permissions and access controls
    4. Examine the source and destination datastores for any suspicious activity
    5. Validate VM disk integrity and check for data corruption
    6. Review recent user activities and authentication logs
    7. Monitor for any subsequent VM performance issues or data loss
  where: |
    (safe(log.message, "") =~ "(?i)storage.*vmotion" && safe(log.message, "") =~ "(?i)(failed|error|abort|timeout)") ||
    (safe(log.message, "") =~ "(?i)(vmdk|datastore)" && safe(log.message, "") =~ "(?i)(move|migrate|copy)" && safe(log.message, "") =~ "(?i)(unauthorized|denied|invalid)") ||
    (safe(log.message, "") =~ "(?i)storage.*migration" && safe(log.message, "") =~ "(?i)(corrupt|integrity|checksum|mismatch)") ||
    (safe(log.process, "") =~ "(?i)(vmkfstools|esxcli)" && safe(log.message, "") =~ "(?i)storage" && safe(log.message, "") =~ "(?i)(error|failed|violation)") ||
    (safe(log.eventInfo, "") =~ "(?i)(relocate|storage.*move)" && safe(severity, "") =~ "(?i)(error|critical)")
  afterEvents:
    - indexPattern: v11-log-vmware-*
      with:
        - field: origin.hostname.keyword
          operator: filter_term
          value: '{{origin.hostname}}'
      within: now-1h
      count: 5
  deduplicateBy:
    - origin.hostname
