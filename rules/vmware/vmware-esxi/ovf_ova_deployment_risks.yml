- id: 1019
  dataTypes:
    - vmware-esxi
  name: Suspicious OVF/OVA Deployment
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Deployment Security
  technique: "T1608.004 - Malicious Image Deployment"
  adversary: origin
  references:
    - https://www.nakivo.com/blog/vmware-logs-analysis-for-troubleshooting/
    - https://attack.mitre.org/techniques/T1608/004/
  description: |
    Detects potentially malicious OVF/OVA deployments that could introduce compromised virtual machines into the environment. Monitors for rapid deployments, deployments from unusual sources, or deployments with suspicious configurations.
    
    Next Steps:
    1. Review the source URL/path of the OVF/OVA deployment to verify it's from a trusted source
    2. Check the user account that initiated the deployment for legitimacy
    3. Examine the VM configuration and resource allocation for anomalies
    4. Verify if the deployment follows change management procedures
    5. Scan the deployed VM for malware or suspicious configurations
    6. Review network connections from the newly deployed VM
    7. Check if similar deployments occurred around the same time on other hosts
  where: |
    (safe(log.message, "") contains "ImportVApp" ||
     safe(log.message, "") contains "DeployOvf" ||
     safe(log.message, "") contains "ovftool" ||
     safe(log.message, "") contains ".ovf" ||
     safe(log.message, "") contains ".ova") &&
    (safe(log.message, "") contains "http://" ||
     safe(log.message, "") contains "https://" ||
     safe(log.message, "") contains "ftp://" ||
     safe(log.process, "") == "hostd" ||
     safe(log.severity, "") == "warning" ||
     safe(log.severity, "") == "error")
  afterEvents:
    - indexPattern: v11-log-vmware-esxi-*
      with:
        - field: origin.hostname.keyword
          operator: filter_term
          value: '{{origin.hostname}}'
      within: now-1h
      count: 3
  deduplicateBy:
    - lastEvent.origin.host
