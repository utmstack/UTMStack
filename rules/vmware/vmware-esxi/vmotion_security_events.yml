- id: 1003
  dataTypes:
    - vmware-esxi
  name: vMotion Security Events Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 3
  category: Virtualization Security
  technique: Migration Security
  adversary: origin
  references:
    - https://docs.vmware.com/en/VMware-vSphere/7.0/com.vmware.vsphere.vcenterhost.doc/GUID-3B41119A-1276-404B-8BFB-A32409052449.html
    - https://lantern.splunk.com/Splunk_Platform/UCE/IT_Modernization/Infrastructure_Monitoring/Monitoring_VMware_virtualization_infrastructure/VMotion_events_for_a_specific_virtual_machine
  description: |
    Detects suspicious vMotion activities including unauthorized migrations, failed vMotion attempts, or vMotion operations from untrusted sources. vMotion is a critical VMware feature that allows live migration of virtual machines between ESXi hosts, and security events related to this process could indicate potential attacks on the virtualization infrastructure.

    Next Steps:
    1. Identify the specific VM and ESXi hosts involved in the suspicious vMotion activity
    2. Verify the legitimacy of the migration request and the user/process that initiated it
    3. Check vCenter Server logs for corresponding authentication and authorization events
    4. Review network configuration and ensure vMotion network is properly secured
    5. Examine the destination host for any signs of compromise or unauthorized access
    6. Validate that vMotion operations are following established change management procedures
    7. Monitor for any subsequent suspicious activities on the affected VMs or hosts
    8. Review vMotion network traffic for any anomalies or unauthorized connections
    9. Check for privilege escalation attempts around the time of the failed vMotion
    10. Consider isolating affected VMs if security breach is suspected
  where: "(safe(log.message, \"\") =~ \"(?i)vmotion\" && safe(log.message, \"\") =~ \"(?i)(failed|error|denied|unauthorized)\") || (safe(log.eventInfo, \"\") =~ \"(?i)VmMigratedEvent\" && safe(severity, \"\") =~ \"(?i)(error|critical)\") || (safe(log.message, \"\") =~ \"(?i)(migrate|migration)\" && safe(log.message, \"\") =~ \"(?i)(abort|timeout|invalid|unauthorized)\") || (safe(log.process, \"\") =~ \"(?i)(vpxa|hostd)\" && safe(log.message, \"\") =~ \"(?i)vmotion\" && safe(log.message, \"\") =~ \"(?i)(security|violation|breach)\") || (safe(log.message, \"\") =~ \"(?i)vmotion.*network\" && safe(log.message, \"\") =~ \"(?i)(untrusted|insecure|compromise)\")"
  deduplicateBy:
    - origin.hostname
