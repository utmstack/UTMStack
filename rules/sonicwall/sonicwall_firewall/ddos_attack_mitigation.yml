- id: 1013
  dataTypes:
    - firewall-sonicwall
  name: SonicWall DDoS Attack Detection and Mitigation
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Denial of Service
  technique: "T1498 - Network Denial of Service"
  adversary: origin
  references:
    - https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-4-log-events-reference-guide.pdf
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects potential DDoS attacks based on high volume of connections, flood attacks, or specific DDoS mitigation events triggered by the SonicWall firewall. This rule identifies various indicators of denial of service attacks including flood patterns, connection thresholds, and explicit DDoS events.
    
    Next Steps:
    1. Verify the legitimacy of the source IP address and assess if it's a known threat
    2. Check network traffic patterns and bandwidth utilization during the timeframe
    3. Review SonicWall logs for additional DDoS mitigation events and attack vectors
    4. Implement rate limiting or blocking rules for the attacking IP addresses
    5. Monitor network performance and availability of targeted services
    6. Consider engaging with ISP or DDoS protection services if attack persists
    7. Document the incident for threat intelligence and future prevention measures
  where: safe(log.category, "").contains("Flood") || safe(log.eventName, "").contains("DDoS") || safe(log.message, "").contains("flood") || safe(log.message, "").contains("syn attack") || safe(log.message, "").contains("rate limit") || safe(log.message, "").contains("excessive") || (safe(log.conns, "") != "" && int(safe(log.conns, "0")) > 1000) || safe(action, "") == "drop"
  afterEvents:
    - indexPattern: v11-log-firewall-sonicwall-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-5m
      count: 100
  deduplicateBy:
    - origin.ip
    - target.ip
