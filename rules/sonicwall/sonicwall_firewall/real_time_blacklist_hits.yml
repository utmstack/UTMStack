- id: 1017
  dataTypes:
    - sonicwall_firewall
  name: SonicWall Real-Time Blacklist Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Threat Intelligence
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-4-log-events-reference-guide.pdf
    - https://attack.mitre.org/techniques/T1071/
  description: |
    Detects connections to blacklisted IPs or domains in real-time, indicating potential malware communication or compromise. This rule triggers when SonicWall firewall blocks traffic based on threat intelligence feeds or blacklist databases.
    
    Next Steps:
    1. Investigate the source IP and determine if it's a legitimate internal system
    2. Check the destination IP/domain reputation using threat intelligence sources
    3. Review recent activities on the affected system for signs of compromise
    4. Examine network logs for additional communication attempts to suspicious destinations
    5. Consider isolating the affected system if malware infection is suspected
    6. Update endpoint security tools and run full system scans
    7. Review firewall logs for patterns of blocked connections from the same source
  where: safe(action, "") == "drop" && (safe(log.category, "") == "Blacklist" || safe(log.message, "").contains("blacklist") || safe(log.message, "").contains("blocked") || safe(log.gcat, "") == "Malicious")
  deduplicateBy:
    - origin.ip
    - target.ip
