- id: 1009
  dataTypes:
    - firewall-sonicwall
  name: SonicWall Geo-IP Filter Policy Violation
  impact:
    confidentiality: 2
    integrity: 1
    availability: 1
  category: Policy Violation
  technique: "T1090 - Proxy"
  adversary: origin
  references:
    - https://www.sonicwall.com/support/knowledge-base/how-can-i-configure-sonicwall-geo-ip-filter-using-firewall-access-rules/170505480197552
    - https://attack.mitre.org/techniques/T1090/
  description: |
    Detects when traffic is blocked due to Geo-IP filtering policies on SonicWall firewalls. This could indicate attempts to access resources from restricted geographic locations or potential use of VPNs/proxies to bypass geographic restrictions.
    
    **Next Steps:**
    1. Verify the source IP address and geographic location
    2. Check if the connection attempt is legitimate business traffic
    3. Investigate if VPN/proxy tools are being used to circumvent geographic restrictions
    4. Review user activity from the source IP for suspicious patterns
    5. Consider if Geo-IP policy needs adjustment for legitimate business needs
    6. Check for patterns of repeated attempts from blocked countries
  where: (safe(log.category, "") == "Geo-IP" || safe(log.message, "").contains("Geo-IP") || safe(log.message, "").contains("geographic") || safe(log.message, "").contains("country blocked") || safe(log.gcat, "") != "" || safe(log.af_service, "") == "geo-ip") && (safe(action, "") == "blocked" || safe(action, "") == "dropped" || safe(log.fw_action, "") == "drop") && (safe(origin.geolocation.country, "") != "" || safe(target.geolocation.country, "") != "")
  deduplicateBy:
    - origin.ip
    - origin.geolocation.country
