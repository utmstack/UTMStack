- id: 1022
  dataTypes:
    - sonicwall_firewall
  name: SonicWall Cloud App Security Threat Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Cloud Security
  technique: "T1526 - Cloud Service Discovery"
  adversary: origin
  references:
    - https://www.sonicwall.com/products/cloud-security/cloud-app-security
    - https://attack.mitre.org/techniques/T1526/
  description: |
    Detects security events from SonicWall Cloud App Security including unauthorized cloud application access, suspicious OAuth activities, and cloud-based threats. This rule identifies when SonicWall's cloud security features detect malicious or unauthorized activities in cloud applications.
    
    **Next Steps:**
    1. Review the specific cloud application and threat type identified
    2. Investigate the user account involved for any signs of compromise
    3. Check for any recent OAuth token grants or application permissions
    4. Verify if the cloud application access was legitimate business use
    5. Review firewall logs for related network activity from the same source
    6. Consider implementing additional cloud access policies if needed
    7. If confirmed malicious, revoke OAuth tokens and reset user credentials
  where: |
    (safe(log.app, "").contains("cloud") || safe(log.appName, "").contains("cloud") || safe(log.category, "").contains("cloud") || safe(log.eventName, "").contains("SaaS") || safe(log.eventName, "").contains("OAuth") || safe(log.message, "").contains("cloud app")) &&
    (safe(log.eventName, "").contains("threat") || safe(log.eventName, "").contains("unauthorized") || safe(log.eventName, "").contains("suspicious") || safe(log.eventName, "").contains("blocked") || safe(log.message, "").contains("threat") || safe(log.message, "").contains("unauthorized") || safe(log.result, "") == "blocked" || safe(log.action, "") == "blocked" || safe(log.severity, "") == "high")
  deduplicateBy:
    - lastEvent.log.user
    - lastEvent.log.app
