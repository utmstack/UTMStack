- id: 1003
  dataTypes:
    - firewall-sonicwall
  name: SonicWall Application Control Policy Violation
  impact:
    confidentiality: 2
    integrity: 2
    availability: 1
  category: Policy Violation
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://www.sonicwall.com/techdocs/pdf/sonicos-6-5-4-log-events-reference-guide.pdf
    - https://attack.mitre.org/techniques/T1071/
  description: |
    Detects when users attempt to access blocked applications or violate application control policies on SonicWall firewalls. This may indicate attempts to bypass security controls or use unauthorized software for data exfiltration, command and control communications, or policy circumvention.
    
    Next Steps:
    1. Review the blocked application details and user information
    2. Verify if the application access attempt was legitimate business use
    3. Check if the user has proper authorization for the application
    4. Review application control policies for potential gaps
    5. Investigate if this is part of a pattern of policy violations by the same user
    6. Consider additional user training on acceptable use policies
    7. Monitor for subsequent attempts from the same source
  where: |
    (safe(log.appcat, "") != "" || 
     safe(log.app, "") != "" ||
     safe(log.appName, "") != "" ||
     safe(log.message, "").contains("App Control") ||
     safe(log.eventName, "").contains("Application") ||
     safe(log.category, "").contains("Application Control")) &&
    (safe(action, "") == "blocked" || 
     safe(log.fw_action, "") == "drop" ||
     safe(log.result, "").contains("denied") ||
     safe(actionResult, "") == "denied" ||
     safe(actionResult, "") == "blocked")
  deduplicateBy:
    - origin.ip
    - target.ip
