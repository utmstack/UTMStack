- id: 1004
  dataTypes:
    - rhel_family
  name: Suspicious Firewalld Rule Modification
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Network Security
  technique: "T1562.004 - Impair Defenses: Disable or Modify System Firewall"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1562/004/
    - https://firewalld.org/documentation/man-pages/firewall-cmd.html
  description: |
    Detects unauthorized or suspicious modifications to firewalld rules that could indicate attempts to bypass network security controls or establish persistence. This rule monitors for dangerous firewall commands including adding risky ports, disabling logging, direct rule manipulation, and unauthorized configuration file modifications.
    
    Next Steps:
    1. Verify the legitimacy of the firewall rule changes with the system administrator
    2. Check if the changes were part of authorized maintenance or configuration updates
    3. Review the specific ports/services being opened and assess their security implications
    4. Examine the user context and timing of the changes for suspicious patterns
    5. Check for any corresponding network connections or services using the newly opened ports
    6. Review audit logs for other configuration changes made by the same user/process
    7. If unauthorized, immediately review and revert the firewall changes
    8. Investigate the source of the unauthorized access and potential compromise
  where: |
    (
      safe(log.comm, "") in ["firewall-cmd", "firewalld"] &&
      (
        (safe(log.args, "") contains "--add-port" && 
         (safe(log.args, "") contains "22/tcp" || 
          safe(log.args, "") contains "3389/tcp" ||
          safe(log.args, "") contains "4444/tcp" ||
          safe(log.args, "") contains "5900/tcp")) ||
        (safe(log.args, "") contains "--add-service" &&
         safe(log.args, "") contains "ssh" &&
         safe(log.args, "") contains "--permanent") ||
        safe(log.args, "") contains "--add-rich-rule" ||
        safe(log.args, "") contains "--add-forward-port" ||
        safe(log.args, "") contains "--direct" ||
        safe(log.args, "") contains "--set-log-denied=off" ||
        (safe(log.args, "") contains "--zone=public" &&
         safe(log.args, "") contains "--add-source")
      )
    ) ||
    (
      safe(log.path, "") contains "/etc/firewalld/" &&
      safe(log.syscall, "") in ["2", "257", "82", "83"] &&
      safe(log.comm, "") not in ["firewalld", "firewall-cmd", "systemd"]
    ) ||
    (
      safe(log.message, "") contains "firewalld" &&
      (
        safe(log.message, "") contains "rule added" ||
        safe(log.message, "") contains "rule removed" ||
        safe(log.message, "") contains "zone changed" ||
        safe(log.message, "") contains "panic mode"
      ) &&
      safe(log.uid, "") != "0"
    )
  deduplicateBy:
    - origin.host
    - origin.user
