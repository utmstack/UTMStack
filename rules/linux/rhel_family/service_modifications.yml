- id: 1021
  dataTypes:
    - rhel_family
  name: RHEL Service Modifications Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: System Tampering
  technique: "T1543.003 - Create or Modify System Process"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1543/003/
    - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/configuring_and_managing_security/auditing-the-system_configuring-and-managing-security
  description: |
    Detects unauthorized modifications to systemd services, including creation of new services, modification of existing service files, or changes to service configurations in RHEL systems. This could indicate an attacker attempting to establish persistence or modify system behavior.

    Next Steps:
    1. Verify the legitimacy of the service modification by checking with system administrators
    2. Review the specific service that was modified and its configuration
    3. Check the user account that performed the modification and verify it has appropriate privileges
    4. Examine the service file contents for suspicious commands or configurations
    5. Review system logs around the time of modification for additional suspicious activity
    6. If unauthorized, disable the service immediately and investigate the source of the modification
    7. Check for other recently modified services or system files
    8. Consider reimaging the system if compromise is confirmed
  where: |
    (safe(log.process, "") == "systemctl" && safe(log.action, "") in ["enable", "disable", "mask", "unmask"]) ||
    (safe(log.file_path, "") contains "/etc/systemd/system/" && safe(log.action, "") in ["create", "modify", "write"]) ||
    (safe(log.file_path, "") contains "/usr/lib/systemd/system/" && safe(log.action, "") in ["create", "modify", "write"]) ||
    (safe(log.command, "") contains "systemctl daemon-reload") ||
    (safe(log.event_type, "") == "service_modification" && safe(log.service_name, "") != "")
  deduplicateBy:
    - origin.host
    - lastEvent.log.service_name
