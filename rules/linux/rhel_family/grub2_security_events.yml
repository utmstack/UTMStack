- id: 1023
  dataTypes:
    - rhel_family
  name: GRUB2 Security Event Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Boot Security
  technique: "T1014 - Rootkit"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1014/
    - https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/system_design_guide/protecting-grub-with-a-password_system-design-guide
  description: |
    Detects security-related events in GRUB2 bootloader including password bypass attempts, configuration tampering, unauthorized menu entry modifications, and attempts to disable security features. This rule identifies potential boot-level attacks targeting the GRUB2 bootloader.
    
    Next Steps:
    1. Immediately verify the integrity of GRUB2 configuration files
    2. Check /boot/grub2/grub.cfg and /boot/grub2/user.cfg for unauthorized modifications
    3. Review system boot logs for any anomalous kernel command line parameters
    4. Verify GRUB2 password configuration is intact and properly secured
    5. Check for any unauthorized access to the /boot partition
    6. Investigate any recent system administration activities around boot time
    7. Consider temporarily disabling network boot if enabled until investigation is complete
  where: |
    (safe(log.process, "") == "grub2-setpassword" && safe(log.action, "") in ["execute", "modify"]) ||
    (safe(log.file_path, "") == "/boot/grub2/user.cfg" && safe(log.action, "") in ["modify", "delete"]) ||
    (safe(log.file_path, "") == "/boot/grub2/grub.cfg" && safe(log.action, "") in ["modify", "write"] && safe(log.content, "") contains "password") ||
    (safe(log.command, "") contains "grub2-mkpasswd-pbkdf2") ||
    (safe(log.event_type, "") == "grub_authentication_failure") ||
    (safe(log.message, "") contains "GRUB" && (safe(log.message, "") contains "bypass" || safe(log.message, "") contains "unauthorized" || safe(log.message, "") contains "security")) ||
    (safe(log.file_path, "") contains "/boot/efi/EFI/redhat/" && safe(log.action, "") in ["modify", "delete"]) ||
    (safe(log.kernel_cmdline, "") contains "init=/bin/bash" || safe(log.kernel_cmdline, "") contains "single" || safe(log.kernel_cmdline, "") contains "rd.break" || safe(log.kernel_cmdline, "") contains "systemd.debug_shell")
  deduplicateBy:
    - origin.host
    - lastEvent.log.file_path
