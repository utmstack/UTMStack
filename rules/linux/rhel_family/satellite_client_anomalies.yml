- id: 1006
  dataTypes:
    - rhel_family
  name: RHEL Satellite Client Anomalies Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: System Compromise
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://docs.redhat.com/en/documentation/red_hat_satellite/6.16/html/administering_red_hat_satellite/logging_and_reporting_problems_admin
    - https://attack.mitre.org/techniques/T1071/
  description: |
    Detects anomalous behavior in RHEL Satellite client communications, including unexpected connection patterns, authentication failures, and suspicious command executions that may indicate compromised satellite clients or unauthorized management attempts. This activity could suggest system compromise, man-in-the-middle attacks, or unauthorized access to satellite infrastructure.

    **Next Steps:**
    1. Immediately investigate the source IP and verify if it's a legitimate satellite client
    2. Check satellite server logs for corresponding authentication failures or connection anomalies
    3. Verify the integrity of SSL/TLS certificates used for satellite communications
    4. Review recent changes to satellite client configurations and access policies
    5. Examine the affected host for signs of compromise or unauthorized modifications
    6. Check for any recent software updates, patches, or configuration changes that might cause legitimate failures
    7. If confirmed malicious, isolate the affected client and revoke its certificates
    8. Review other satellite clients for similar anomalous patterns
    9. Validate the satellite server's security posture and access controls
  where: safe(log.process, "") == "satellite-client" && (safe(log.message, "") contains "authentication failed" || safe(log.message, "") contains "unexpected disconnect" || safe(log.message, "") contains "command execution failed" || safe(log.message, "") contains "certificate validation failed" || safe(log.message, "") contains "unauthorized request")
  afterEvents:
    - indexPattern: v11-log-linux-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - target.host
