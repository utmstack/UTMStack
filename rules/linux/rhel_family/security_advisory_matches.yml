- id: 1015
  dataTypes:
    - rhel_family
  name: Red Hat Security Advisory Matches
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Vulnerability Management
  technique: "T1203 - Exploitation for Client Execution"
  adversary: origin
  references:
    - https://access.redhat.com/security/security-updates/
    - https://attack.mitre.org/techniques/T1203/
  description: |
    Detects when system activities match patterns associated with Red Hat Security Advisories (RHSA), indicating potential exploitation of known vulnerabilities or missing security patches. This rule identifies systems that may be vulnerable to known security issues or are experiencing active exploitation attempts.

    Next Steps:
    1. Immediately verify the affected system's patch level and installed packages
    2. Check if the identified CVE or RHSA has been applied to the system
    3. Review system logs for signs of actual exploitation or compromise
    4. Validate package signatures and integrity using rpm verification
    5. Apply missing security updates immediately if patches are available
    6. Monitor the affected system for unusual network activity or process execution
    7. Consider isolating the system if active exploitation is suspected
    8. Document the vulnerability status and remediation actions taken
    9. Review patch management processes to prevent future exposure
    10. Coordinate with security team for incident response if exploitation is confirmed
  solution: Apply the latest Red Hat security updates and patches. Verify package integrity and implement proper patch management procedures.
  where: |
    (safe(log.source, "") contains "rhel" || safe(log.distribution, "") == "rhel") &&
    (
      safe(log.message, "") contains "CVE-" ||
      safe(log.message, "") contains "RHSA-" ||
      safe(log.message, "") contains "security advisory" ||
      safe(log.vulnerability_id, "") != "" ||
      safe(log.event_type, "") == "vulnerability_exploit" ||
      (safe(log.package_name, "") != "" && safe(log.package_version, "") != "" && safe(log.vulnerability_severity, "") in ["Critical", "Important"]) ||
      safe(log.audit_type, "") == "CRYPTO_KEY_USER" ||
      safe(log.audit_type, "") == "CRYPTO_SESSION" ||
      (safe(log.service, "") == "yum" && safe(log.message, "") contains "security update available") ||
      (safe(log.program, "") == "rpm" && safe(log.message, "") contains "signature verification failed")
    )
  deduplicateBy:
    - origin.host
    - log.vulnerability_id
