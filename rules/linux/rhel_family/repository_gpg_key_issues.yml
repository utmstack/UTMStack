- id: 1018
  dataTypes:
    - linux
  name: Repository GPG Key Issues in RHEL
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Package Management Security
  technique: "T1195.001 - Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
  adversary: origin
  references:
    - https://www.redhat.com/en/blog/rpm-gpg-verify-packages
    - https://attack.mitre.org/techniques/T1195/001/
  description: |
    Detects GPG key verification failures, missing GPG keys, or unauthorized repository key changes in RHEL systems. These issues could indicate compromised repositories, man-in-the-middle attacks, or supply chain compromises that may lead to malicious package installation.
    
    Next Steps:
    1. Immediately verify the integrity of the affected repository by checking its official GPG keys
    2. Cross-reference the repository URL and GPG key fingerprint with official sources
    3. Check for any recent changes to repository configurations in /etc/yum.repos.d/
    4. Review recent package installations and updates on the affected system
    5. Verify network connectivity and check for potential man-in-the-middle attacks
    6. Consider temporarily disabling the affected repository until verification is complete
    7. Audit system logs for any suspicious package installations or system modifications
  where: |
    (safe(lastEvent.log.program, "") in ["yum", "dnf", "rpm"] &&
     (safe(lastEvent.log.message, "") =~ "GPG.*key.*error|GPG.*check.*failed|GPG.*signature.*invalid|GPG.*key.*not.*found|GPG.*verification.*failed" ||
      safe(lastEvent.log.message, "") =~ "NOKEY|MISSING_KEY|BAD_SIGNATURE|key.*expired|key.*revoked" ||
      safe(lastEvent.log.gpgcheck, "") == "failed" ||
      safe(lastEvent.log.signature_status, "") in ["invalid", "missing", "expired", "untrusted"])) ||
    (safe(lastEvent.log.message, "") =~ "Repository.*key.*changed|gpgkey.*modified|Importing GPG key" &&
     safe(origin.user, "") != "root")
  deduplicateBy:
    - target.host
    - lastEvent.log.repository
