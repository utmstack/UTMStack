- id: 1017
  dataTypes:
    - rhel_family
  name: System Update Failures in RHEL
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: System Administration
  technique: "T1495 - Firmware Corruption"
  adversary: origin
  references:
    - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/8/html/configuring_basic_system_settings/
    - https://attack.mitre.org/techniques/T1495/
  description: |
    Detects failed system updates in RHEL systems including yum/dnf transaction failures, dependency conflicts, and update interruptions. These failures could indicate system issues, malicious interference, or compromised repositories.
    
    Next Steps:
    1. Review the specific error messages in system logs to determine the root cause
    2. Check network connectivity to package repositories
    3. Verify repository integrity and digital signatures
    4. Examine disk space availability and file system health
    5. Review recent system changes that might have caused dependency conflicts
    6. Check for signs of repository tampering or man-in-the-middle attacks
    7. Validate system clock synchronization as it affects package verification
    8. Consider rolling back recent changes if corruption is suspected
  where: |
    safe(log.program, "") in ["yum", "dnf", "rpm", "systemd"] &&
    (safe(log.message, "") =~ "update.*failed|upgrade.*failed|transaction.*failed|dependency.*error|conflict|broken packages" ||
     safe(log.exit_code, 0) != 0 ||
     safe(log.status, "") in ["failed", "error", "aborted"] ||
     safe(log.message, "") =~ "Error downloading packages|Cannot download|Failed to download|Transaction check error")
  afterEvents:
    - indexPattern: v11-log-linux-*
      with:
        - field: origin.host.keyword
          operator: filter_term
          value: '{{origin.host}}'
      within: now-1h
      count: 5
  deduplicateBy:
    - adversary.host
