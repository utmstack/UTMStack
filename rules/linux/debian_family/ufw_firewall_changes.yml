- id: 1006
  dataTypes:
    - debian_family
  name: UFW Firewall Configuration Changes
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1562.004 - Impair Defenses: Disable or Modify System Firewall"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1562/004/
    - https://help.ubuntu.com/community/UFW
  description: |
    Detects changes to UFW (Uncomplicated Firewall) configuration including rule modifications, firewall disable/enable operations, and logging level changes which could indicate attempts to bypass security controls or create backdoor access.
    
    Next Steps:
    1. Verify the legitimacy of the firewall configuration change
    2. Check if the change was authorized and performed by legitimate administrators
    3. Review the specific UFW rule changes and their potential security impact
    4. Examine concurrent system activities and user sessions
    5. Validate that firewall policies still meet security requirements
    6. Consider reverting unauthorized changes immediately
    7. Review user privileges and access controls for firewall management
  where: |
    (safe(log.process, "") contains "ufw" || safe(log.message, "") contains "ufw") &&
    (safe(log.message, "") contains "Rule added" ||
     safe(log.message, "") contains "Rule deleted" ||
     safe(log.message, "") contains "Rule inserted" ||
     safe(log.message, "") contains "Rule updated" ||
     safe(log.message, "") contains "Firewall stopped" ||
     safe(log.message, "") contains "Firewall reloaded" ||
     safe(log.message, "") contains "Default policy changed" ||
     safe(log.message, "") contains "Logging level changed" ||
     safe(log.message, "") contains "ALLOW" ||
     safe(log.message, "") contains "DENY" ||
     safe(log.message, "") contains "REJECT" ||
     safe(log.message, "") contains "disabled firewall" ||
     safe(log.message, "") contains "enabled firewall")
  deduplicateBy:
    - origin.host
    - origin.user
