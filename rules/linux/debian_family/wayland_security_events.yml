- id: 1014
  dataTypes:
    - debian_family
  name: Wayland Security Event Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Display Server Security
  technique: "T1056 - Input Capture"
  adversary: origin
  references:
    - https://wayland.freedesktop.org/security.html
    - https://attack.mitre.org/techniques/T1056/
  description: |
    Detects security events in Wayland display server including compositor vulnerabilities, protocol violations, and unauthorized client connections. This rule monitors for various security issues that could indicate compromise or misuse of the Wayland display server infrastructure.
    
    Next Steps:
    1. Verify the legitimacy of the Wayland process and its configuration
    2. Check system logs for related security events or crashes
    3. Examine the specific error messages and protocol violations
    4. Review user permissions and access controls for Wayland sockets
    5. Investigate any unauthorized client connections or injection attempts
    6. Monitor for privilege escalation attempts through display server vulnerabilities
    7. Check for any suspicious application installations or modifications
  where: |
    (safe(log.process_name, "") in ["wayland", "weston", "sway", "mutter", "kwin_wayland"] && safe(log.event_type, "") in ["protocol_error", "security_violation", "client_error"]) ||
    (safe(log.wayland_interface, "") != "" && (safe(log.error, "") contains "Permission denied" || safe(log.error, "") contains "Protocol error" || safe(log.error, "") contains "Security context violation" || safe(log.error, "") contains "Unauthorized request")) ||
    (safe(log.message, "") contains "Wayland protocol error" || safe(log.message, "") contains "compositor crash" || safe(log.message, "") contains "invalid surface" || safe(log.message, "") contains "buffer overflow in compositor") ||
    (safe(log.socket_path, "") contains "/run/user/" && safe(log.socket_name, "") contains "wayland" && safe(log.operation, "") in ["unauthorized_connect", "injection_attempt"]) ||
    (safe(log.dbus_interface, "") contains "org.freedesktop.portal" && safe(log.method, "") in ["Screenshot", "Screencast", "RemoteDesktop"] && safe(log.denied, "") == "true") ||
    (safe(log.subsystem, "") == "drm" && safe(log.compositor, "") != "" && safe(log.event, "") in ["mode_setting_failed", "unauthorized_gpu_access"])
  afterEvents:
    - indexPattern: v11-log-linux-*
      with:
        - field: origin.user.keyword
          operator: filter_term
          value: '{{origin.user}}'
        - field: target.host.keyword
          operator: filter_term
          value: '{{target.host}}'
      within: now-20m
      count: 4
  deduplicateBy:
    - adversary.user
    - adversary.host
