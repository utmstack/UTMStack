- id: 1013
  dataTypes:
    - debian_family
  name: X11 Security Violation Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Access Control Violation
  technique: "T1021 - Remote Services"
  adversary: origin
  references:
    - https://www.x.org/wiki/Development/Security/
    - https://attack.mitre.org/techniques/T1021/
  description: |
    Detects X11 security violations including unauthorized display access, MIT-MAGIC-COOKIE bypass attempts, and X11 forwarding abuse. This rule identifies attempts to compromise X11 authentication mechanisms, unauthorized remote display access, and manipulation of X11 authorization files.

    Next Steps:
    1. Investigate the source IP address and user account involved in the violation
    2. Check X11 authentication logs and .Xauthority files for tampering
    3. Review network connections to X11 displays and identify unauthorized access patterns
    4. Examine system logs for privilege escalation attempts related to X11 services
    5. Verify X11 forwarding configurations and SSH tunnel usage
    6. Check for unauthorized xhost commands or display export attempts
    7. Monitor for additional suspicious activity from the same source
  where: |
    (safe(log.facility, "") == "auth" && safe(log.message, "") contains_any ["X11 authentication failed", "Invalid MIT-MAGIC-COOKIE", "X11 connection rejected"]) ||
    (safe(log.process_name, "") == "Xorg" && safe(log.error, "") contains_any ["Permission denied", "Authorization required", "Access control enabled"]) ||
    (safe(log.xauth_event, "") in ["cookie_mismatch", "display_access_denied", "unauthorized_client"]) ||
    (safe(log.command, "") contains_any ["xhost +", "xhost -ac", "export DISPLAY="] && safe(log.user, "") != "root") ||
    (safe(log.file_path, "") contains_any [".Xauthority", "/tmp/.X11-unix/", "/var/run/xauth/"] && safe(log.operation, "") in ["unauthorized_read", "tamper", "steal"]) ||
    (safe(log.network_protocol, "") == "X11" && safe(log.source_ip, "") != "127.0.0.1" && safe(log.event_type, "") in ["connection_attempt", "authentication_bypass"])
  afterEvents:
    - indexPattern: v11-log-linux-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.display.keyword
          operator: filter_term
          value: '{{safe(log.display, "")}}'
      within: now-10m
      count: 3
  deduplicateBy:
    - origin.ip
    - origin.host
