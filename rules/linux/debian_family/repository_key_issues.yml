- id: 1018
  dataTypes:
    - debian_family
  name: Repository Key Issues Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Authentication and Authorization
  technique: Supply Chain Compromise
  adversary: origin
  references:
    - https://wiki.debian.org/SecureApt
    - https://attack.mitre.org/techniques/T1195/
  description: |
    Detects issues with APT repository keys that could indicate attempts to inject malicious packages or compromise the software supply chain. This rule identifies GPG key validation failures, expired keys, unsigned repositories, and other key-related security issues that could be exploited by attackers to deliver malicious software updates.

    Next Steps:
    1. Verify the legitimacy of the repository and its GPG keys
    2. Check if this is a known repository with valid signing keys
    3. Investigate any recent changes to repository configurations
    4. Review package installation logs for suspicious activity
    5. Validate the integrity of installed packages from affected repositories
    6. Consider temporarily disabling the repository until key issues are resolved
    7. Monitor for any unauthorized package installations or system changes
  where: |
    (safe(log.process, "") == "apt" || safe(log.process, "") == "apt-key" || safe(log.process, "") == "gpg") &&
    (
      safe(log.message, "") =~ ".*(NO_PUBKEY|GPG error|key is not certified|KEYEXPIRED).*" ||
      safe(log.message, "") =~ ".*(public key is not available|signatures couldn't be verified).*" ||
      safe(log.message, "") =~ ".*(WARNING: apt does not have a stable CLI interface).*" ||
      safe(log.message, "") =~ ".*(repository.*not signed|Release file.*not valid yet).*" ||
      safe(log.message, "") =~ ".*(apt-key is deprecated|untrusted packages).*"
    )
  afterEvents:
    - indexPattern: v11-log-linux-*
      with:
        - field: origin.host.keyword
          operator: filter_term
          value: '{{origin.host}}'
      within: now-1h
      count: 3
  deduplicateBy:
    - origin.host
    - log.message
