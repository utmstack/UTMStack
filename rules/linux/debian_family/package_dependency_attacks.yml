- id: 1019
  dataTypes:
    - debian_family
  name: Package Dependency Attack Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Software Supply Chain
  technique: "T1195.001 - Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
  adversary: origin
  references:
    - https://www.debian.org/doc/debian-policy/ch-relationships.html
    - https://attack.mitre.org/techniques/T1195/001/
  description: |
    Detects potential dependency confusion or hijacking attacks through unusual package installation patterns, version conflicts, or suspicious dependency resolutions in Debian-based systems. This rule identifies suspicious package management activities that could indicate supply chain attacks.
    
    Next Steps:
    1. Investigate the specific packages being installed or causing dependency conflicts
    2. Verify the legitimacy of package repositories and sources
    3. Check for unauthorized package installations or configuration changes
    4. Review package installation logs for signs of typosquatting or dependency confusion
    5. Validate that packages come from trusted official repositories
    6. Check for any recently added or modified package sources in /etc/apt/sources.list
    7. Investigate any forced installations that bypass dependency checks
  where: |
    (safe(log.process, "") == "apt" || safe(log.process, "") == "apt-get" || safe(log.process, "") == "dpkg") &&
    (
      safe(log.message, "") =~ ".*(dependency problems|but it is not going to be installed).*" ||
      safe(log.message, "") =~ ".*(package.*has no installation candidate|held broken packages).*" ||
      safe(log.message, "") =~ ".*(Conflicts:|Breaks:|but.*is to be installed).*" ||
      safe(log.message, "") =~ ".*(downgrade|force-depends|force-conflicts).*" ||
      safe(log.message, "") =~ ".*(attempting to overwrite|which is also in package).*" ||
      (safe(log.message, "") =~ ".*install.*" && safe(log.message, "") =~ ".*(unofficial|unknown|untrusted).*")
    )
  afterEvents:
    - indexPattern: v11-log-linux-*
      with:
        - field: origin.host.keyword
          operator: filter_term
          value: '{{origin.host}}'
      within: now-2h
      count: 4
  deduplicateBy:
    - origin.host
