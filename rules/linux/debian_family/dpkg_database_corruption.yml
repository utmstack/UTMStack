- id: 1003
  dataTypes:
    - debian_family
  name: DPKG Database Corruption Detected
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: System Integrity
  technique: "T1485 - Data Destruction"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1485/
    - https://wiki.debian.org/Teams/Dpkg
  description: |
    Detects signs of DPKG database corruption or manipulation which could prevent package management, system updates, or indicate system compromise attempts through package database tampering. This could indicate malicious activity targeting system integrity or accidental corruption affecting system maintenance.
    
    Next Steps:
    1. Verify the integrity of the dpkg database by running 'dpkg --audit' and 'dpkg --verify'
    2. Check system logs for any unauthorized access or modification attempts to /var/lib/dpkg/
    3. Review recent package installation or removal activities for anomalies
    4. Examine file permissions and ownership of dpkg database files
    5. Consider restoring from backup if corruption is confirmed and cannot be repaired
    6. Investigate potential root cause including disk errors, improper shutdowns, or malicious activity
  where: |
    safe(log.process, "") contains "dpkg" &&
    (safe(log.message, "") contains "database is locked" ||
     safe(log.message, "") contains "corrupted database" ||
     safe(log.message, "") contains "status database area is locked" ||
     safe(log.message, "") contains "failed to open package info file" ||
     safe(log.message, "") contains "failed to read package info" ||
     safe(log.message, "") contains "parse error" && safe(log.message, "") contains "/var/lib/dpkg" ||
     safe(log.message, "") contains "unable to access dpkg status area" ||
     safe(log.message, "") contains "dpkg was interrupted" ||
     safe(log.message, "") contains "triggers file contains unknown directive")
  deduplicateBy:
    - origin.host
