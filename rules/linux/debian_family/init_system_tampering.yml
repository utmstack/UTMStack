- id: 1010
  dataTypes:
    - debian_family
  name: Init System Tampering Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Persistence
  technique: "T1037 - Boot or Logon Initialization Scripts"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1037/
    - https://www.freedesktop.org/wiki/Software/systemd/
    - https://wiki.debian.org/Init
  description: |
    Detects tampering with init system components including systemd, SysV init scripts, and upstart configurations which could indicate persistence mechanisms, rootkit installation, or system-level backdoors.
    
    Next Steps:
    1. Investigate the specific file or service being modified
    2. Review the user account performing the changes and verify authorization
    3. Check for unauthorized scheduled tasks or services being created
    4. Examine system logs for concurrent suspicious activities
    5. Verify the integrity of critical system files using package managers
    6. Review network connections from the affected system
    7. Consider isolating the system if unauthorized changes are confirmed
  where: |
    (safe(log.path, "") contains "/etc/init.d/" ||
     safe(log.path, "") contains "/etc/systemd/" ||
     safe(log.path, "") contains "/lib/systemd/" ||
     safe(log.path, "") contains "/etc/init/" ||
     safe(log.message, "") contains "/etc/init.d/" ||
     safe(log.message, "") contains "/etc/systemd/" ||
     safe(log.message, "") contains "/lib/systemd/") &&
    (safe(log.message, "") contains "modified" ||
     safe(log.message, "") contains "created" ||
     safe(log.message, "") contains "deleted" ||
     safe(log.message, "") contains "chmod" ||
     safe(log.message, "") contains "chown" ||
     safe(log.message, "") contains "update-rc.d" ||
     safe(log.message, "") contains "insserv" ||
     safe(log.message, "") contains "systemctl preset" ||
     safe(log.message, "") contains "systemctl set-default" ||
     safe(log.message, "") contains "Failed to validate unit file" ||
     safe(log.message, "") contains "Invalid unit file" ||
     safe(log.message, "") contains "Suspicious" ||
     safe(log.message, "") contains "generator" && safe(log.message, "") contains "failed")
  deduplicateBy:
    - origin.host
    - lastEvent.log.path
