- id: 1004
  dataTypes:
    - debian_family
  name: SystemD Service Manipulation
  impact:
    confidentiality: 1
    integrity: 3
    availability: 2
  category: Persistence
  technique: "T1543.002 - Create or Modify System Process: Systemd Services"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1543/002/
    - https://www.freedesktop.org/software/systemd/man/systemd.service.html
  description: |
    Detects suspicious systemd service manipulations including creation of new services, modification of existing services, or attempts to mask/disable critical system services which could indicate persistence mechanisms or system sabotage.
    
    Next Steps:
    1. Verify if the service manipulation was authorized and performed by legitimate administrators
    2. Examine the specific service being modified - check if it's a critical system service
    3. Review the user account and host performing the action for signs of compromise
    4. Investigate any new service files created in /etc/systemd/system/ or /lib/systemd/system/
    5. Check for persistence mechanisms by examining service files for suspicious executables or scripts
    6. Correlate with other system activities around the same time to identify potential attack chains
    7. If unauthorized, immediately disable the suspicious service and investigate the source of compromise
  where: |
    (safe(log.process, "") contains "systemctl" || safe(log.process, "") contains "systemd") &&
    (safe(log.message, "") contains "Created symlink" && safe(log.message, "") contains "/etc/systemd" ||
     safe(log.message, "") contains "Removed symlink" && safe(log.message, "") contains "/etc/systemd" ||
     safe(log.message, "") contains "enable" && safe(log.message, "") contains ".service" ||
     safe(log.message, "") contains "disable" && safe(log.message, "") contains ".service" ||
     safe(log.message, "") contains "mask" && safe(log.message, "") contains ".service" ||
     safe(log.message, "") contains "unmask" && safe(log.message, "") contains ".service" ||
     safe(log.message, "") contains "daemon-reload" ||
     safe(log.message, "") contains "Failed to start" && safe(log.message, "") contains ".service" ||
     safe(log.message, "") contains "Reloading" && safe(log.message, "") contains ".service")
  deduplicateBy:
    - origin.host
    - origin.user
