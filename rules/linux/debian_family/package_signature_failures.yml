- id: 1002
  dataTypes:
    - debian_family
  name: Package Signature Verification Failure
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Package Security
  technique: Supply Chain Compromise
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1195/
    - https://wiki.debian.org/SecureApt#How_to_tell_if_the_key_is_safe
  description: |
    Detects package signature verification failures during APT or DPKG operations, which may indicate tampered packages, compromised repositories, or man-in-the-middle attacks on package downloads. These failures can signal attempts to deliver malicious packages through supply chain attacks.
    
    Next Steps:
    1. Immediately halt any ongoing package installations on the affected system
    2. Verify the integrity of package repositories and GPG keys
    3. Check network logs for signs of man-in-the-middle attacks during package downloads
    4. Review recent package installation history and validate installed packages
    5. Update repository keys and retry package operations from trusted sources
    6. Consider isolating the system until package integrity can be verified
    7. Review system logs for other signs of compromise that may have preceded this event
  where: |
    (safe(log.process, "") contains "dpkg" || safe(log.process, "") contains "apt" || safe(log.process, "") contains "apt-get") &&
    (safe(log.message, "") contains "signature could not be verified" ||
     safe(log.message, "") contains "WARNING: The following packages cannot be authenticated" ||
     safe(log.message, "") contains "BADSIG" ||
     safe(log.message, "") contains "NO_PUBKEY" ||
     safe(log.message, "") contains "invalid signature" ||
     safe(log.message, "") contains "Hash Sum mismatch" ||
     safe(log.message, "") contains "Size mismatch" ||
     safe(log.message, "") contains "Verification failed")
  afterEvents:
    - indexPattern: v11-log-*
      with:
        - field: origin.hostname.keyword
          operator: filter_term
          value: '{{origin.hostname}}'
      within: now-1h
      count: 2
  deduplicateBy:
    - origin.hostname
    - log.message
