- id: 1001
  dataTypes:
    - debian_family
  name: APT Repository Tampering Detected
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: System Manipulation
  technique: "T1195.002 - Supply Chain Compromise: Compromise Software Supply Chain"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1195/002/
    - https://wiki.debian.org/SecureApt
  description: |
    Detects attempts to modify APT repository configurations, add untrusted repositories, or bypass package signing verification, which could indicate supply chain attacks or malicious package installation attempts.
    
    Next Steps:
    1. Verify the legitimacy of any repository modifications by checking with system administrators
    2. Review the specific APT commands executed and their parameters
    3. Check if the repository modifications were authorized and documented
    4. Examine the source of the untrusted repository being added
    5. Verify GPG keys and signatures for any packages installed from modified repositories
    6. Monitor for subsequent package installations from untrusted sources
    7. Consider rolling back unauthorized repository changes
  where: |
    (safe(log.process, "") contains "apt" || safe(log.process, "") contains "apt-get" || safe(log.process, "") contains "apt-key") &&
    (safe(log.message, "") contains "sources.list" || 
     safe(log.message, "") contains "add-apt-repository" ||
     safe(log.message, "") contains "trusted.gpg" ||
     safe(log.message, "") contains "NO_PUBKEY" ||
     safe(log.message, "") contains "GPG error" ||
     safe(log.message, "") contains "could not be verified" ||
     safe(log.message, "") contains "repository" && safe(log.message, "") contains "unsigned")
  deduplicateBy:
    - origin.host
