- id: 1020
  dataTypes:
    - debian_family
  name: Configuration File Changes Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: System Configuration
  technique: "T1543 - Create or Modify System Process"
  adversary: origin
  references:
    - https://www.debian.org/doc/debian-policy/ch-files.html
    - https://attack.mitre.org/techniques/T1543/
  description: |
    Detects unauthorized or suspicious changes to system configuration files that could indicate system compromise or persistence mechanisms. This rule monitors package management activities, configuration file modifications, and changes to critical system files in Debian-based systems.
    
    Next Steps:
    1. Verify if the configuration changes were authorized and part of legitimate system maintenance
    2. Check the specific files modified and assess their security implications
    3. Review recent package installations or updates that may have triggered the changes
    4. Examine system logs for any concurrent suspicious activities
    5. Validate that only authorized administrators performed the changes
    6. Consider reverting unauthorized changes and implementing file integrity monitoring
  where: |
    (
      (safe(log.process, "") == "dpkg" && safe(log.message, "") =~ ".*(conffile|configuration file).*") ||
      (safe(log.process, "") == "apt" && safe(log.message, "") =~ ".*Setting up.*") ||
      safe(log.message, "") =~ ".*(modified|changed|differ).*(/etc/|conf|config).*" ||
      safe(log.message, "") =~ ".*Configuration file.*locally modified.*" ||
      safe(log.message, "") =~ ".*(maintainer script|postinst|preinst|postrm|prerm).*" ||
      safe(log.message, "") =~ ".*dpkg-divert.*" ||
      (safe(log.facility, "") == "authpriv" && safe(log.message, "") =~ ".*/etc/(passwd|shadow|group|sudoers).*")
    ) &&
    safe(log.severity, "") != "info"
  deduplicateBy:
    - adversary.host
    - dataType
