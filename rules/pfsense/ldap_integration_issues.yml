- id: 1020
  dataTypes:
    - firewall-pfsense
  name: pfSense LDAP Integration Issues
  impact:
    confidentiality: 3
    integrity: 2
    availability: 3
  category: Directory Service Failure
  technique: "T1087 - Account Discovery"
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/usermanager/ldap.html
    - https://attack.mitre.org/techniques/T1087/
  description: |
    Detects LDAP integration issues in pfSense including connection failures, binding errors, query timeouts, or certificate problems. These issues can prevent proper authentication and may indicate configuration problems or potential LDAP injection attempts.
    
    Next Steps:
    1. Review pfSense LDAP configuration in System > User Manager > Authentication Servers
    2. Check LDAP server connectivity and certificate validity
    3. Verify LDAP bind credentials and search base DN
    4. Review firewall rules between pfSense and LDAP server
    5. Monitor for repeated failures that may indicate brute force attempts
    6. Check LDAP server logs for corresponding authentication events
  where: (safe(log.eventType, "") == "php-fpm" || safe(log.eventType, "") == "openvpn" || safe(log.eventType, "") == "webConfigurator") && (safe(log.reason, "").contains("LDAP") && (safe(log.reason, "").contains("bind failed") || safe(log.reason, "").contains("connect error") || safe(log.reason, "").contains("certificate verify failed") || safe(log.reason, "").contains("search failed") || safe(log.reason, "").contains("timeout") || safe(log.reason, "").contains("Can't contact LDAP server")))
  afterEvents:
    - indexPattern: v11-log-firewall-pfsense-*
      with:
        - field: log.syslogHost.keyword
          operator: filter_term
          value: '{{log.syslogHost}}'
      within: now-30m
      count: 10
  deduplicateBy:
    - origin.host
    - category
