- id: 1019
  dataTypes:
    - firewall-pfsense
  name: pfSense RADIUS Authentication Failures
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Authentication Failure
  technique: "T1110 - Brute Force"
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/usermanager/radius.html
    - https://attack.mitre.org/techniques/T1110/
  description: |
    Detects multiple RADIUS authentication failures in pfSense, which could indicate brute force attacks, misconfigured credentials, or connectivity issues with the RADIUS server. Repeated failures may suggest an attempted security breach.
    
    Next Steps:
    1. Review the source IP address and verify if it's from a trusted network
    2. Check RADIUS server logs for corresponding authentication attempts
    3. Validate user credentials and account status
    4. Examine network connectivity between pfSense and RADIUS server
    5. Consider implementing IP-based blocking or rate limiting
    6. Review firewall rules and VPN access policies
    7. If pattern continues, consider threat hunting for lateral movement attempts
  where: (safe(log.eventType, "") == "openvpn" || safe(log.eventType, "") == "radiusd" || safe(log.eventType, "") == "mpd") && (safe(log.reason, "").contains("RADIUS") && (safe(log.reason, "").contains("authentication failed") || safe(log.reason, "").contains("Operation timed out") || safe(log.reason, "").contains("No valid Radius responses") || safe(log.reason, "").contains("rad_init_send_request failed") || safe(log.reason, "").contains("Access-Reject")))
  afterEvents:
    - indexPattern: v11-log-firewall-pfsense-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-10m
      count: 5
  deduplicateBy:
    - origin.ip
    - origin.user
