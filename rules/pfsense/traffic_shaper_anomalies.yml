- id: 1008
  dataTypes:
    - firewall-pfsense
  name: Traffic Shaper Queue Overflow
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Resource Development
  technique: Resource Hijacking
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/trafficshaper/index.html
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects abnormal traffic patterns that exceed traffic shaper limits, potentially indicating bandwidth exhaustion attacks or misconfigured traffic policies affecting service availability. This rule monitors kernel events for queue overflows, dropped packets, and bandwidth limit violations that could impact network performance.
    
    Next Steps:
    1. Review pfSense traffic shaper logs and queue statistics to identify which traffic classes are experiencing overflows
    2. Check network utilization graphs and bandwidth consumption patterns during the alert timeframe
    3. Analyze traffic patterns to distinguish between legitimate traffic spikes and potential DoS attacks
    4. Review traffic shaper rules and bandwidth allocations for potential misconfigurations
    5. Examine source IPs and protocols contributing to the bandwidth exhaustion
    6. Consider implementing additional rate limiting or updating traffic shaper policies if necessary
    7. Monitor for sustained patterns that might indicate ongoing attacks or infrastructure issues
  where: safe(log.eventType, "") == "kernel" && safe(log.csvMsg, "").contains("queue") || safe(log.csvMsg, "").contains("shaper") || safe(log.csvMsg, "").contains("bandwidth") || safe(log.csvMsg, "").contains("overflow") || safe(log.csvMsg, "").contains("dropped")
  afterEvents:
    - indexPattern: v11-log-firewall-pfsense-*
      with:
        - field: log.eventType.keyword
          operator: filter_term
          value: 'kernel'
      within: now-5m
      count: 20
  deduplicateBy:
    - lastEvent.log.realInterface
