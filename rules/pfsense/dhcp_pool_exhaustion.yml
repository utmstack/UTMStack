- id: 1010
  dataTypes:
    - firewall-pfsense
  name: DHCP Pool Exhaustion Attack
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Impact
  technique: "T1499.007 - Endpoint Denial of Service: DHCP Starvation"
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/services/dhcp/index.html
    - https://attack.mitre.org/techniques/T1499/007/
  description: |
    Detects rapid DHCP requests that could indicate DHCP starvation attacks attempting to exhaust the IP address pool and prevent legitimate clients from obtaining network access. This attack can cause denial of service by preventing new devices from joining the network.
    
    Next Steps:
    - Investigate the source IP addresses making excessive DHCP requests
    - Check DHCP server logs for unusual lease patterns or exhaustion messages
    - Review network topology for rogue devices or unauthorized DHCP clients
    - Verify DHCP pool configuration and available IP ranges
    - Consider implementing DHCP rate limiting or MAC address filtering
    - Monitor for continued exhaustion attempts after mitigation
  where: safe(log.eventType, "") == "dhcpd" && (safe(log.csvMsg, "").contains("DHCPDISCOVER") || safe(log.csvMsg, "").contains("no free leases"))
  afterEvents:
    - indexPattern: v11-log-firewall-pfsense-*
      with:
        - field: log.eventType.keyword
          operator: filter_term
          value: 'dhcpd'
      within: now-2m
      count: 50
  deduplicateBy:
    - target.host
