- id: 1013
  dataTypes:
    - firewall-pfsense
  name: High Availability CARP Failover Event
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: System Availability
  technique: "T1489 - Service Stop"
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/monitoring/status/carp.html
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects critical CARP (Common Address Redundancy Protocol) events including unexpected failovers, split-brain conditions, or frequent state transitions that could indicate network issues or potential attacks on high availability infrastructure. CARP events may indicate hardware failures, network connectivity issues, or deliberate service disruption attempts.

    Next Steps:
    1. Verify the current CARP master/backup status on all cluster nodes
    2. Check network connectivity between CARP cluster members
    3. Review hardware status and resource utilization on affected nodes
    4. Examine recent configuration changes that might have triggered the failover
    5. Investigate for any suspicious network activity or potential DoS attacks
    6. Validate that failover completed successfully and services are operational
    7. Check firewall logs for any correlation with security events
    8. Review CARP interface configurations for mismatches or errors
    9. Monitor for recurring CARP state changes that might indicate instability
    10. Document the incident and review HA procedures if manual intervention was required
  where: safe(log.eventType, "").contains("carp") && (safe(log.reason, "").contains("BACKUP") || safe(log.reason, "").contains("MASTER") || safe(log.reason, "").contains("INIT") || safe(log.vhid, "") != "")
  deduplicateBy:
    - target.host
    - lastEvent.log.interface
