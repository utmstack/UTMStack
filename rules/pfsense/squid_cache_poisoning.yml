- id: 1018
  dataTypes:
    - firewall-pfsense
  name: pfSense Squid Cache Poisoning Attempt
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Cache Poisoning
  technique: "T1565 - Data Manipulation"
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/troubleshooting/squid.html
    - https://attack.mitre.org/techniques/T1565/
  description: |
    Detects potential cache poisoning attempts against pfSense Squid proxy cache. This includes suspicious cache operations, DNS conflicts, malformed requests, or attempts to inject malicious content into the cache that could affect multiple users. Cache poisoning attacks can compromise the integrity of cached content and potentially serve malicious data to legitimate users.

    **Next Steps:**
    1. Investigate the source IP address for other malicious activities
    2. Review Squid cache logs for additional suspicious patterns
    3. Check DNS resolution logs for any conflicts or manipulations
    4. Verify the legitimacy of PURGE requests and their sources
    5. Consider implementing additional cache validation mechanisms
    6. Review proxy configuration for security hardening opportunities
    7. Monitor affected cached content for integrity
  where: safe(log.eventType, "") == "squid" && (safe(log.reason, "").contains("409") || safe(log.reason, "").contains("DNS conflict") || safe(log.reason, "").contains("cache corruption") || safe(action, "") == "TCP_SWAPFAIL" || safe(action, "").contains("PURGE") && safe(origin.ip, "") != "127.0.0.1" || safe(log.reason, "").contains("swap.state") && safe(log.reason, "").contains("error"))
  afterEvents:
    - indexPattern: v11-log-firewall-pfsense-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-1h
      count: 5
  deduplicateBy:
    - adversary.ip
