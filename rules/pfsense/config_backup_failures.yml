- id: 1024
  dataTypes:
    - firewall-pfsense
  name: pfSense Configuration Backup Failure
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: System Configuration
  technique: Data Destruction
  adversary: system
  references:
    - https://docs.netgate.com/pfsense/en/latest/backup/index.html
    - https://attack.mitre.org/techniques/T1485/
  description: |
    Detects configuration backup failures in pfSense. Failed backups can prevent disaster recovery and may indicate storage issues, permission problems, or potential tampering with backup processes. Regular successful backups are critical for system recovery.
    
    Next Steps:
    1. Check pfSense system logs for detailed error messages about the backup failure
    2. Verify available disk space on the backup destination
    3. Confirm backup directory permissions and accessibility
    4. Review backup schedule configuration and timing
    5. Test manual backup functionality to isolate the issue
    6. Check for any recent system changes that might affect backup processes
    7. Verify network connectivity if backing up to remote locations
    8. Consider implementing backup monitoring and alerting if not already in place
  where: (safe(log.eventType, "") == "system" || safe(log.eventType, "") == "config") && (safe(raw, "").contains("backup failed") || safe(raw, "").contains("config write error") || safe(raw, "").contains("unable to save") || safe(raw, "").contains("backup error") || safe(raw, "").contains("configuration sync failed") || safe(raw, "").contains("xmlrpc sync error"))
  deduplicateBy:
    - target.host
