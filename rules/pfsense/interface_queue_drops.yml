- id: 1015
  dataTypes:
    - firewall-pfsense
  name: Interface Queue Drops - Performance Degradation
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Network Performance
  technique: "T1496 - Resource Hijacking"
  adversary: origin
  references:
    - https://docs.netgate.com/pfsense/en/latest/monitoring/status/interfaces.html
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects excessive packet drops on pfSense interfaces due to queue saturation, which could indicate network congestion, DDoS attacks, or misconfigured traffic shaping policies affecting service availability.

    Next Steps:
    1. Check the interface status and utilization on the pfSense dashboard
    2. Review traffic shaping policies and queue configurations for the affected interface
    3. Analyze network traffic patterns to identify potential DDoS attacks or bandwidth abuse
    4. Examine system resources (CPU, memory) to rule out hardware bottlenecks
    5. Consider implementing or adjusting traffic limiters and Quality of Service (QoS) rules
    6. Monitor for continued drops to determine if this is an ongoing issue
    7. Check for any recent configuration changes that might have caused the problem
  where: (safe(log.eventType, "").contains("kernel") || safe(log.eventType, "").contains("pf")) && safe(log.realInterface, "") != "" && (safe(log.reason, "").contains("drop") || safe(log.reason, "").contains("queue") || safe(log.reason, "").contains("congestion"))
  afterEvents:
    - indexPattern: v11-log-firewall-pfsense-*
      with:
        - field: log.realInterface.keyword
          operator: filter_term
          value: '{{log.realInterface}}'
      within: now-15m
      count: 50
  deduplicateBy:
    - lastEvent.log.realInterface
