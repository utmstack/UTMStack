# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Threat or Cleanup Failure
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Threat Detection
technique: Vendor threat detection
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/EventTypes/
description: Sophos reports a runtime, network, AMSI or outbreak detection, or failed cleanup. Review the exact
  vendor type and remediation status; successful cleanup and resolved events are excluded.
where: (regexMatch("log.type","^Event::Endpoint::(CoreIps|HomeThreatRemnants|HmpaBehaviourPrevented|HmpaThreat|HmpaSafeBrowsing|CoreAmsi|CoreOutbreak|Threat::(CleanupFailed::|Ips|CommandAndControl))"))
  && !regexMatch("log.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
groupBy:
- lastEvent.dataSource
- lastEvent.log.customerId
- lastEvent.log.endpointId
- lastEvent.log.type
- target.host
- target.ip
