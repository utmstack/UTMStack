- id: 1006
  dataTypes:
    - sophos-central
  name: Web Protection Violation Detected
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Web Protection
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/EndpointProtection/webcontrol/index.html
    - https://attack.mitre.org/techniques/T1071/
  description: |
    Detects when Sophos Central blocks access to websites that violate web protection policies. This could indicate attempted access to malicious, inappropriate, or policy-violating websites, potentially indicating command and control communication attempts or policy violations.
    
    Next Steps:
    1. Review the blocked URL and categorization to understand the nature of the violation
    2. Investigate the user's browsing history for additional suspicious activity
    3. Check if the blocked site is part of known malicious infrastructure
    4. Verify if this represents legitimate business access that requires policy adjustment
    5. Correlate with other security events from the same endpoint or user
    6. Consider additional endpoint investigation if malicious intent is suspected
  where: safe(log.type, "") == "Event::Endpoint::WebControlViolation" || safe(log.type, "") == "Event::Endpoint::WebFilteringBlocked"
  deduplicateBy:
    - lastEvent.log.endpointId
    - lastEvent.log.userId
