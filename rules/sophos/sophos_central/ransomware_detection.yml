# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Ransomware Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Ransomware Activity
technique: T1486 - Data Encrypted for Impact
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/EventTypes/
- https://attack.mitre.org/techniques/T1486/
description: Sophos reports ransomware behavior or blocked encryption. Review vendor details and affected files;
  detection or prevention does not prove successful encryption.
where: '(oneOf("event.type", ["Event::Endpoint::Threat::RansomwareDetected", "Event::Endpoint::CryptoGuard::FileEncryption"])
  ||

  (equals("event.name", "CryptoGuard") && equals("event.action", "blocked")) ||

  (equals("event.name", "Ransomware detected") && equals("event.severity", "critical")) ||

  (equals("event.type", "Event::Endpoint::Threat::Detected") && equals("event.threatType", "Ransomware"))) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")'
groupBy:
- lastEvent.dataSource
- lastEvent.event.customerId
- lastEvent.event.endpointId
- lastEvent.event.type
- target.host
- target.ip
