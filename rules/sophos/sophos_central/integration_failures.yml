- id: 1023
  dataTypes:
    - sophos-central
  name: Sophos Central Integration Failure
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Integration Error
  technique: "T1087 - Account Discovery"
  adversary: origin
  references:
    - https://community.sophos.com/kb/en-us/125169
    - https://attack.mitre.org/techniques/T1087/
  description: |
    Detects failures in Sophos Central integrations with third-party systems, SIEM connections, or API integrations that could impact security monitoring and response capabilities. Integration failures can indicate potential security monitoring blind spots or system compromise attempts.
    
    Next Steps:
    1. Review the specific integration that failed and check system logs for detailed error messages
    2. Verify API credentials and authentication tokens are valid and not expired
    3. Check network connectivity between Sophos Central and the target system
    4. Examine the integration configuration for any misconfigurations
    5. Monitor for repeated failures that could indicate deliberate interference
    6. Validate that security monitoring coverage remains adequate during the outage
    7. Consider implementing backup monitoring solutions for critical integrations
  where: |
    safe(log.type, "") in ["integration_error", "api_failure", "connection_failed"] ||
    (safe(log.component, "") =~ "(?i)(integration|api|connector)") ||
    (safe(log.event, "") =~ "(?i)(integration.*fail|api.*error|connection.*timeout)") ||
    (safe(log.message, "") =~ "(?i)(siem.*fail|integration.*error|api.*timeout|webhook.*fail)") ||
    (safe(log.error_code, "") in ["401", "403", "500", "503"] && safe(log.api_endpoint, "") != "")
  deduplicateBy:
    - lastEvent.log.api_endpoint
    - origin.host
