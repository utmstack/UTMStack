- id: 1009
  dataTypes:
    - sophos-central
  name: Data Loss Prevention Policy Triggered
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Data Protection
  technique: "T1567 - Exfiltration Over Web Service"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/datalosspreventionevents/index.html
    - https://attack.mitre.org/techniques/T1567/
  description: |
    Detects when data loss prevention (DLP) policies are triggered, indicating potential attempts to transfer sensitive data outside of authorized channels or violations of data handling policies. This could represent data exfiltration attempts, policy violations, or insider threats.

    Next Steps:
    1. Review the specific DLP rule that was triggered and the data involved
    2. Investigate the user account and endpoint involved in the incident
    3. Analyze the attempted transfer method and destination
    4. Verify if the data transfer was authorized and legitimate
    5. Check for additional DLP violations from the same user or endpoint
    6. Review file access logs and user activity around the time of the incident
    7. Consider implementing additional monitoring for the affected user/endpoint
  where: safe(log.type, "") == "Event::Endpoint::DataLossPrevention" || safe(log.category, "") == "DLP" || (safe(log.action, "") == "blocked" && safe(log.ruleName, "") != "")
  deduplicateBy:
    - lastEvent.host
    - lastEvent.log.ruleName
