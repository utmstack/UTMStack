# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Tamper Protection Warning
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/AccountHealthCheck/FixEndpointTamperProtect/
- https://attack.mitre.org/techniques/T1562/001/
description: Sophos reports a tamper-protection trigger or an account health warning that endpoint/server tamper
  protection is off. Account health warnings can cover multiple devices; they do not identify an attacker. Resolution
  events are excluded.
where: '((equals("log.type", "Event::Endpoint::Threat::TamperProtection") ||

  (equals("log.name", "Tamper protection") && equals("log.severity", "high")) ||

  (equals("log.type", "Event::Endpoint::TamperProtection") && equals("log.action", "blocked"))) || oneOf("log.type",["Event::AccountHealthCheck::EndpointTamperProtectionRaise","Event::AccountHealthCheck::ServerTamperProtectionRaise"]))
  && !regexMatch("log.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")'
groupBy:
- lastEvent.dataSource
- lastEvent.log.customerId
- lastEvent.log.endpointId
- lastEvent.log.type
- target.host
- target.ip
