- id: 1016
  dataTypes:
    - sophos-central
  name: Cloud Security Posture Management Alert
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Cloud Security
  technique: "T1098 - Account Manipulation"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/CloudSecurity/index.html
    - https://attack.mitre.org/techniques/T1098/
  description: |
    Detects cloud security posture management alerts indicating potential misconfigurations or compliance violations in cloud resources that could lead to security exposures. These alerts typically identify issues such as open security groups, unencrypted storage, excessive permissions, or other configuration drift that increases attack surface.
    
    Next Steps:
    1. Review the specific cloud resource and configuration that triggered the alert
    2. Assess the compliance violation details and potential security impact
    3. Verify if the configuration change was authorized and documented
    4. Check for any recent changes to the affected cloud resource
    5. Remediate the misconfiguration according to security best practices
    6. Update security policies and baselines to prevent similar issues
    7. Monitor for additional posture violations across the cloud environment
    8. Consider implementing automated remediation for common misconfigurations
  where: |
    safe(log.type, "") == "cloud_posture" && 
    safe(log.severity, "") in ["high", "critical"] &&
    safe(log.compliance_status, "") == "failed"
  deduplicateBy:
    - lastEvent.log.customerId
    - lastEvent.log.resource_id
