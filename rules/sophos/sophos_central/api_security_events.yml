- id: 1024
  dataTypes:
    - sophos-central
  name: Sophos Central API Security Event
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: API Security
  technique: "T1110 - Brute Force"
  adversary: origin
  references:
    - https://developer.sophos.com/apis
    - https://attack.mitre.org/techniques/T1110/
  description: |
    Detects suspicious API access patterns, authentication failures, or potential abuse of Sophos Central API endpoints that could indicate unauthorized access attempts or API key compromise.
    
    Next Steps:
    1. Identify the source IP address and geolocation of the suspicious API requests
    2. Review API access logs for patterns of failed authentication or rate limiting
    3. Check if the API key or credentials associated with the requests are legitimate
    4. Verify if the API endpoints being accessed are authorized for the requesting user/service
    5. Look for any successful API calls from the same source after failed attempts
    6. Consider implementing additional API rate limiting or blocking the source IP
    7. Review API key management and rotation policies
    8. Correlate with other security events from the same source or user account
  where: |
    (safe(log.type, "") in ["api_auth_failure", "api_rate_limit", "api_unauthorized"] ||
     safe(log.event, "") =~ "(?i)(api.*auth.*fail|api.*unauthoriz|api.*forbidden)") &&
    (safe(log.api_endpoint, "") != "" ||
     safe(log.path, "") =~ "(?i)/api/" ||
     safe(log.request_path, "") =~ "(?i)/api/") &&
    (safe(log.status_code, 0) in [401, 403, 429] ||
     safe(log.response_code, 0) in [401, 403, 429] ||
     safe(log.error, "") =~ "(?i)(unauthorized|forbidden|rate.?limit)")
  afterEvents:
    - indexPattern: v11-log-sophos-central-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - target.host
