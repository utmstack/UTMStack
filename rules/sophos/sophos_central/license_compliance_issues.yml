- id: 1022
  dataTypes:
    - sophos-central
  name: Sophos Central License Compliance Violation
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Compliance Violation
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/Licensing/index.html
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects license compliance issues in Sophos Central, including expired licenses, over-usage, or non-compliant endpoints that could lead to reduced protection or service disruption.
    
    Next Steps:
    1. Immediately verify the license status in Sophos Central dashboard
    2. Check if endpoints are properly managed and licensed
    3. Review license allocation and usage metrics
    4. Contact Sophos support if license issues persist
    5. Ensure all endpoints maintain proper protection coverage
    6. Update license documentation and renewal schedules
  where: |
    safe(log.type, "") in ["Event::Endpoint::NonCompliant", "license_violation", "license_expired"] ||
    (safe(log.name, "") =~ "(?i)(license|compliance)") ||
    (safe(log.event, "") =~ "(?i)(license.*expir|compliance.*violat|license.*exceed)") ||
    (safe(log.message, "") =~ "(?i)(license.*limit|subscription.*expir|compliance.*fail)") ||
    (safe(log.status, "") == "noncompliant" && safe(log.reason, "") =~ "(?i)license")
  deduplicateBy:
    - lastEvent.log.customerId
    - lastEvent.log.endpointId
