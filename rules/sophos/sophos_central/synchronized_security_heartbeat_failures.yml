- id: 1001
  dataTypes:
    - sophos-central
  name: Synchronized Security Heartbeat Failures
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: System Health
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/Heartbeat/index.html
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects when Sophos synchronized security heartbeat fails, indicating potential endpoint protection issues or communication problems between Sophos components. Heartbeat failures can indicate compromised endpoints, network connectivity issues, or attempts to disable security controls.
    
    Next Steps:
    1. Check the endpoint status in Sophos Central console
    2. Verify network connectivity between the endpoint and Sophos Central
    3. Review endpoint logs for signs of tampering or malware interference
    4. Validate that Sophos services are running properly on the affected endpoint
    5. Check for any recent policy changes or system updates that might affect heartbeat
    6. If multiple endpoints are affected, investigate network infrastructure issues
  where: safe(log.type, "") == "Event::Endpoint::SyncSecurity::HeartbeatFailure" || (safe(log.name, "") == "Heartbeat failure" && safe(log.severity, "") in ["high", "critical"])
  afterEvents:
    - indexPattern: v11-log-sophos-central-*
      with:
        - field: log.endpointId.keyword
          operator: filter_term
          value: '{{log.endpointId}}'
      within: now-1h
      count: 3
  deduplicateBy:
    - lastEvent.log.endpointId
