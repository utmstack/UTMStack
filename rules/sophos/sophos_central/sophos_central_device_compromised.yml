# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Potentially Compromised Device
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Threat Detection
technique: Vendor threat detection
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/NetworkAccessEventTypes/
description: Sophos reports a potentially compromised device. Investigate device health and network activity. Blocking
  a peripheral is a separate policy event and does not establish device compromise.
where: (equals("event.type","Event::UAV::PotentiallyCompromisedDevice")) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
groupBy:
- lastEvent.dataSource
- lastEvent.event.customerId
- lastEvent.event.endpointId
- lastEvent.event.type
- target.host
- target.ip
