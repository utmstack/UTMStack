# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Repeated Sophos Central Behavioral Detections
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Threat Detection
technique: Vendor threat detection
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/MaliciousBehaviorTypes/
description: Repeated behavioral detections on the same managed endpoint and Sophos account. Inspect the vendor
  threat name for its specific behavior or MITRE technique; these events do not all indicate process injection.
where: '((oneOf("event.type", ["Event::Endpoint::Threat::BehavioralDetection", "Event::Endpoint::BehaviorDetected"])
  ||

  (oneOf("event.detectionMethod", ["Behavioral", "HIPS"]) && oneOf("event.severity", ["medium", "high", "critical"]))
  ||

  (contains("event.name", "Behavioral") && oneOf("event.severity", ["high", "critical"]))) || equals("event.type","Event::Endpoint::CoreBehavioralDetection"))
  && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$") && (regexMatch("event.endpointId","[^[:space:]]")
  && !oneOf("event.endpointId",["-","n/a","N/A","unknown"])) && (regexMatch("dataSource","[^[:space:]]") && !oneOf("dataSource",["-","n/a","N/A","unknown"]))
  && (regexMatch("event.sophosCentralScope","[^[:space:]]") && !oneOf("event.sophosCentralScope",["-","n/a","N/A","unknown"]))'
afterEvents:
- indexPattern: v11-log-sophos-central-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.sophosCentralScope
    operator: filter_term
    value: '{{.event.sophosCentralScope}}'
  - field: event.endpointId
    operator: filter_term
    value: '{{.event.endpointId}}'
  - field: event.correlationCandidate.sophosCentral.behavior
    operator: filter_term
    value: match
  within: 30m
  count: 3
groupBy:
- lastEvent.dataSource
- lastEvent.event.customerId
- lastEvent.event.endpointId
- lastEvent.event.type
- target.host
- target.ip
