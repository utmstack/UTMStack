- id: 1008
  dataTypes:
    - sophos-central
  name: Device Control Policy Violation
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Device Control
  technique: "T1025 - Data from Removable Media"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/EndpointProtection/ConfigureDeviceControl/index.html
    - https://attack.mitre.org/techniques/T1025/
  description: |
    Detects violations of device control policies when unauthorized devices attempt to connect or transfer data. This could indicate potential data exfiltration attempts or use of unauthorized devices that violate organizational security policies.

    Next Steps:
    1. Verify the legitimacy of the device and user involved in the violation
    2. Check if the device control policy configuration is appropriate for business needs
    3. Review recent file access and transfer activities on the affected endpoint
    4. Investigate whether similar violations have occurred from the same user or endpoint
    5. Examine the device type and determine if it poses a security risk
    6. Consider updating device control policies if legitimate business usage is being blocked
    7. If malicious activity is suspected, isolate the endpoint and perform forensic analysis
    8. Review user training on acceptable device usage policies
  where: safe(log.type, "") == "Event::Endpoint::Device::Blocked" || (safe(log.type, "") == "Event::Endpoint::Device::AlertedOnly" && safe(log.action, "") == "blocked")
  afterEvents:
    - indexPattern: v11-log-sophos-central-*
      with:
        - field: log.endpointId.keyword
          operator: filter_term
          value: '{{log.endpointId}}'
        - field: log.type.keyword
          operator: filter_term
          value: 'Event::Endpoint::Device::Blocked'
      within: now-2h
      count: 3
  deduplicateBy:
    - lastEvent.log.endpointId
    - lastEvent.log.deviceType
