# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Firewall ATP Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Command and Control
technique: T1071 - Application Layer Protocol
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/Alerts/FirewallAlerts/
- https://attack.mitre.org/techniques/T1071/
description: Sophos Firewall ATP logged an attempt to communicate with a known botnet or command-and-control server.
  The notification alone does not prove that the connection succeeded or that the endpoint is compromised.
where: (equals("event.type", "Event::Firewall::FirewallAdvancedThreatProtection")) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
groupBy:
- lastEvent.dataSource
- lastEvent.event.customerId
- lastEvent.event.endpointId
- lastEvent.event.type
- target.host
- target.ip
