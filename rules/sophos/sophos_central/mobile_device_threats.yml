- id: 1004
  dataTypes:
    - sophos-central
  name: Mobile Device Threats
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Mobile Security
  technique: "T1474 - Supply Chain Compromise"
  adversary: origin
  references:
    - https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/MobileControl/index.html
    - https://attack.mitre.org/techniques/T1474/
  description: |
    Detects security threats on mobile devices managed by Sophos Central, including malicious apps, jailbreak/root detection, and policy violations. This rule triggers on various mobile security events that indicate compromised device security or policy non-compliance.
    
    Next Steps:
    1. Immediately isolate the affected mobile device from network access
    2. Review the specific threat type and severity reported by Sophos Central
    3. Check device compliance status and recent app installations
    4. Verify if the device has been jailbroken or rooted
    5. Review user activity and access patterns on the device
    6. Update mobile device policies if necessary
    7. Consider remote wipe if device is compromised and contains sensitive data
    8. Notify the device owner and IT security team
  where: safe(log.endpointType, "") == "mobile" && (safe(log.type, "") in ["Event::Mobile::Threat::Detected", "Event::Mobile::Device::Jailbroken", "Event::Mobile::Device::Rooted", "Event::Mobile::App::Malicious", "Event::Mobile::Compliance::Failed"] || safe(log.threatType, "") != "")
  deduplicateBy:
    - lastEvent.log.endpointId
    - lastEvent.log.userId
