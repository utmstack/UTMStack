# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central CryptoGuard Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Impact
technique: T1486 - Data Encrypted for Impact
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/EventTypes/
- https://attack.mitre.org/techniques/T1486/
description: Sophos reports local or remote ransomware activity. The managed endpoint is the affected target, except
  SMBOrigin, which explicitly identifies the endpoint attempting remote encryption. Remote peer addresses are not
  inferred from the message.
where: (oneOf("log.type",["Event::Endpoint::HmpaCryptoGuardSMBOrigin","Event::Endpoint::HmpaCryptoGuardSMB","Event::Endpoint::HmpaCryptoGuard"]))
  && !regexMatch("log.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
groupBy:
- lastEvent.dataSource
- lastEvent.log.customerId
- lastEvent.log.endpointId
- lastEvent.log.type
- target.host
- target.ip
- adversary.host
- adversary.ip
