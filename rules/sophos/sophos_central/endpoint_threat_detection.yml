# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Sophos Central Endpoint Threat or PUA Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Threat Detection
technique: Vendor threat detection
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/EventTypes/
description: Sophos reports an endpoint threat, potentially unwanted application, or failed PUA cleanup. A PUA can
  be legitimate software restricted by policy. Completed cleanup and dismissed events are excluded.
where: '((oneOf("event.type", ["Event::Endpoint::Threat::Detected", "Event::Endpoint::Threat::HIPSDetected", "Event::Endpoint::Threat::PuaDetected"])
  ||

  (oneOf("event.severity", ["high", "critical"]) && equals("event.category", "threat") && exists("event.threatName")))
  || oneOf("event.type",["Event::Endpoint::CorePuaDetection","Event::Endpoint::CorePuaCleanFailed"])) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")'
groupBy:
- lastEvent.dataSource
- lastEvent.event.customerId
- lastEvent.event.endpointId
- lastEvent.event.type
- target.host
- target.ip
