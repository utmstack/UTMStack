# Sophos Central SIEM event review; impact ratings and history thresholds preserved.
dataTypes:
- sophos-central
name: Rapid Sophos Central ZTNA Authentication Failures
impact:
  confidentiality: 1
  integrity: 2
  availability: 2
category: Credential Access
technique: T1110 - Brute Force
adversary: origin
references:
- https://docs.sophos.com/central/customer/help/en-us/ManageYourProducts/LogsReports/Logs/Events/EventTypes/
- https://attack.mitre.org/tactics/TA0006/
- https://attack.mitre.org/techniques/T1110/
description: Ten ZTNA authentication failures for the same vendor-reported IP and Sophos account in one minute.
  This counts failures, not distinct users, and does not establish password spraying.
where: (equals("event.type", "Event::ZTNA::ZTNAAuthenticationFailure")) && !regexMatch("event.type","(?i)(clean|cleanedup|resolved|dismissed|cancelled|success)$")
  && (regexMatch("event.ip","[^[:space:]]") && !oneOf("event.ip",["-","n/a","N/A","unknown"])) && (regexMatch("dataSource","[^[:space:]]")
  && !oneOf("dataSource",["-","n/a","N/A","unknown"])) && (regexMatch("event.sophosCentralScope","[^[:space:]]") &&
  !oneOf("event.sophosCentralScope",["-","n/a","N/A","unknown"])) && ((inCIDR("event.ip","0.0.0.0/0") || inCIDR("event.ip","::/0"))
  && !inCIDR("event.ip","0.0.0.0/32") && !inCIDR("event.ip","::/128"))
afterEvents:
- indexPattern: v11-log-sophos-central-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.sophosCentralScope
    operator: filter_term
    value: '{{.event.sophosCentralScope}}'
  - field: event.ip
    operator: filter_term
    value: '{{.event.ip}}'
  - field: event.correlationCandidate.sophosCentral.ztnaFailure
    operator: filter_term
    value: match
  within: 1m
  count: 10
groupBy:
- lastEvent.dataSource
- lastEvent.event.sophosCentralScope
- lastEvent.event.ip
