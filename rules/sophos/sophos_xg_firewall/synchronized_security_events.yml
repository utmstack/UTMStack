- id: 1002
  dataTypes:
    - firewall-sophos-xg
  name: Sophos XG Synchronized Security Event
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Endpoint Security
  technique: Security Software Discovery
  adversary: origin
  references:
    - https://docs.sophos.com/nsg/sophos-firewall/20.0/Help/en-us/webhelp/onlinehelp/AdministratorHelp/SynchronizedSecurity/index.html
    - https://attack.mitre.org/techniques/T1518/001/
  description: |
    Detects synchronized security events from Sophos endpoints communicating with the firewall, including heartbeat failures, compromised endpoints, and security status changes. This rule identifies critical security state changes in the Sophos ecosystem that may indicate endpoint compromise, communication failures, or degraded security posture.
    
    Next Steps:
    1. Investigate the specific endpoint device generating the alert
    2. Check the endpoint's security status in Sophos Central console
    3. Verify network connectivity between endpoint and firewall
    4. Review recent security events on the affected endpoint
    5. Examine firewall logs for any blocked communications from the endpoint
    6. If endpoint is compromised, initiate incident response procedures
    7. Consider isolating the endpoint if threat is confirmed
    8. Update endpoint security policies if configuration issues are found
  where: (safe(log.type, "") == "Event" && safe(log.component, "") == "Synchronized Security") || (safe(log.hb_health, "") != "" && safe(log.hb_health, "") != "No Heartbeat" && safe(log.hb_health, "") != "Green") || (safe(log.component, "") == "Heartbeat" && (safe(log.subType, "") == "Missing" || safe(log.subType, "") == "Red" || safe(log.subType, "") == "Yellow"))
  deduplicateBy:
    - adversary.ip
    - adversary.host
