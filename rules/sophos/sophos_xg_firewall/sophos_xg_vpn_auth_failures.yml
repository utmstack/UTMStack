# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Repeated Sophos VPN Authentication Failures
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: T1110 - Brute Force
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
- https://attack.mitre.org/techniques/T1110/
description: Repeated failed SSL VPN, VPN or VPN portal authentication from the same source address and firewall.
  Successful authentication, tunnel termination and IKE parsing errors are excluded.
where: (equals("event.type","Event") && equals("event.subType","Authentication") && oneOf("event.component",["SSL VPN
  Authentication","VPN Authentication","VPN Portal Authentication"]) && equals("actionResult","failed")) && exists("origin.ip")
  && exists("dataSource") && !equals("dataSource","") && exists("event.sophosScope") && !equals("event.sophosScope","")
groupBy:
- lastEvent.dataSource
- lastEvent.event.sophosScope
- adversary.ip
- adversary.user
correlation:
- indexPattern: v11-log-firewall-sophos-xg-*
  within: 15m
  count: 10
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.sophosScope
    operator: filter_term
    value: '{{.event.sophosScope}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.sophosXG.vpnFailure
    operator: filter_term
    value: match
