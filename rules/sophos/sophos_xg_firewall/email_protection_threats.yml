- id: 1004
  dataTypes:
    - firewall-sophos-xg
  name: Sophos XG Email Protection Threat Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Email Security
  technique: "T1566 - Phishing"
  adversary: origin
  references:
    - https://docs.sophos.com/nsg/sophos-firewall/20.0/Help/en-us/webhelp/onlinehelp/AdministratorHelp/EmailProtection/index.html
    - https://attack.mitre.org/techniques/T1566/
  description: |
    Detects email-based threats including spam, phishing attempts, malware attachments, and suspicious email patterns identified by Sophos XG's email protection features. This rule triggers when the email protection component identifies malicious content, blocked messages, virus infections, or suspicious email traffic patterns.
    
    Next Steps:
    1. Review the email content and attachments for malicious indicators
    2. Check the sender's reputation and authentication status
    3. Verify if similar emails were sent to other users
    4. Update email security policies if new threat patterns are identified
    5. Consider blocking the sender domain if confirmed malicious
    6. Notify affected users about potential phishing attempts
  where: (safe(log.type, "") == "Anti-Spam" || safe(log.type, "") == "Mail") && (safe(log.component, "") == "SMTP" || safe(log.component, "") == "POP3" || safe(log.component, "") == "IMAP") && ((safe(log.subType, "") == "Spam" || safe(log.subType, "") == "Virus" || safe(log.subType, "") == "Blocked") || (safe(log.virus, "") != "") || (safe(log.logMessage, "") != "" && (contains(log.logMessage, "spam") || contains(log.logMessage, "phishing") || contains(log.logMessage, "malware") || contains(log.logMessage, "virus"))) || (safe(statusCode, 0) >= 500 && safe(protocol, "") == "SMTP"))
  deduplicateBy:
    - origin.ip
    - target.email
