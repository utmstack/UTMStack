# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Repeated Sophos IPS Priority 1 or 2 Detections
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Intrusion Detection
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
- https://attack.mitre.org/techniques/T1190/
description: Repeated IDP signature/anomaly detections carrying rule priority 1 or 2 (or explicit High/Critical
  severity), from the same source to the same destination on the same firewall. A Drop remains denied; a Detect
  does not prove exploitation succeeded.
where: (equals("event.type","IDP") && oneOf("event.component",["Signatures","Anomaly"]) && oneOf("event.subType",["Detect","Drop"])
  && (oneOf("event.rulepriority",["1","2"]) || oneOf("event.severity",["Critical","High"])) && exists("origin.ip") &&
  exists("target.ip")) && exists("origin.ip") && exists("dataSource") && !equals("dataSource","") && exists("event.sophosScope")
  && !equals("event.sophosScope","")
groupBy:
- lastEvent.dataSource
- lastEvent.event.sophosScope
- adversary.ip
- target.ip
correlation:
- indexPattern: v11-log-firewall-sophos-xg-*
  within: 15m
  count: 3
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.sophosScope
    operator: filter_term
    value: '{{.event.sophosScope}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: target.ip
    operator: filter_term
    value: '{{.target.ip}}'
  - field: event.correlationCandidate.sophosXG.ips
    operator: filter_term
    value: match
