# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Probable Sophos ip spoofing attack
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Impact
technique: T1499 - Endpoint Denial of Service
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
- https://attack.mitre.org/tactics/TA0040
- https://attack.mitre.org/techniques/T1499/
description: IP spoofing is the creation of Internet Protocol (IP) packets which have a modified source address
  in order to either hide the identity of the sender, to impersonate another computer system, or both. It is a technique
  often used by bad actors to invoke DDoS attacks against a target device or the surrounding infrastructure.
where: equals("log.type","Firewall") && equalsIgnoreCase("log.component","IP Spoof")
groupBy:
- lastEvent.dataSource
- lastEvent.log.sophosScope
- adversary.ip
- target.ip
