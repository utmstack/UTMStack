# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Repeated Sophos Advanced Threat Protection Detections
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Malware
technique: T1204 - User Execution
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
- https://attack.mitre.org/techniques/T1204/
description: Repeated ATP Alert or Drop records from the same source address and firewall. ATP signature detection
  does not establish a successful connection or endpoint compromise.
where: (equals("log.type","ATP") && oneOf("log.component",["Firewall","DNS","IPS","Web"]) && oneOf("log.subType",["Alert","Drop"])
  && ((exists("log.malware") && !equals("log.malware","")) || (exists("log.threatname") && !equals("log.threatname",""))))
  && exists("origin.ip") && exists("dataSource") && !equals("dataSource","") && exists("log.sophosScope") && !equals("log.sophosScope","")
groupBy:
- lastEvent.dataSource
- lastEvent.log.sophosScope
- adversary.ip
- target.ip
correlation:
- indexPattern: v11-log-firewall-sophos-xg-*
  within: 30m
  count: 2
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.sophosScope
    operator: filter_term
    value: '{{.log.sophosScope}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.sophosXG.atp
    operator: filter_term
    value: match
