# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Repeated Sophos Advanced Threat Protection Detections
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Malware
technique: T1204 - User Execution
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
- https://attack.mitre.org/techniques/T1204/
description: Repeated ATP Alert or Drop records from the same source address and firewall. ATP signature detection
  does not establish a successful connection or endpoint compromise.
where: (equals("event.type","ATP") && oneOf("event.component",["Firewall","DNS","IPS","Web"]) && oneOf("event.subType",["Alert","Drop"])
  && ((exists("event.malware") && !equals("event.malware","")) || (exists("event.threatname") && !equals("event.threatname",""))))
  && exists("origin.ip") && exists("dataSource") && !equals("dataSource","") && exists("event.sophosScope") && !equals("event.sophosScope","")
groupBy:
- lastEvent.dataSource
- lastEvent.event.sophosScope
- adversary.ip
- target.ip
correlation:
- indexPattern: v11-log-firewall-sophos-xg-*
  within: 30m
  count: 2
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.sophosScope
    operator: filter_term
    value: '{{.event.sophosScope}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.sophosXG.atp
    operator: filter_term
    value: match
