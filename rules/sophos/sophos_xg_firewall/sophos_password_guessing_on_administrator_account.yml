# Sophos source-contract review; thresholds and impact ratings preserved.
dataTypes:
- firewall-sophos-xg
name: Repeated Sophos Administrator Authentication Failures
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: T1110.001 - Brute Force
adversary: origin
references:
- https://docs.sophos.com/nsg/sophos-firewall/20.0/syslog/index.html
- https://attack.mitre.org/tactics/TA0006
- https://attack.mitre.org/techniques/T1110/001/
description: Repeated administrator sign-in failures from the same source address and firewall within 15 minutes.
  Successful administration and unrelated configuration failures are excluded.
where: (equals("event.type","Event") && (oneOf("event.component",["GUI","CLI","API"]) && equals("event.subType","Admin")
  && equals("event.messageId","17507") && equals("actionResult","failed"))) && exists("origin.ip") && exists("dataSource")
  && !equals("dataSource","") && exists("event.sophosScope") && !equals("event.sophosScope","")
groupBy:
- lastEvent.dataSource
- lastEvent.event.sophosScope
- adversary.ip
- adversary.user
correlation:
- indexPattern: v11-log-firewall-sophos-xg-*
  within: 15m
  count: 10
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.sophosScope
    operator: filter_term
    value: '{{.event.sophosScope}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.sophosXG.adminFailure
    operator: filter_term
    value: match
