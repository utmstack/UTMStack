- id: 1009
  dataTypes:
    - firewall-sophos-xg
  name: Sophos XG Firewall Application Risk Changes
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Application Security
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://docs.sophos.com/nsg/sophos-firewall/20.0/Help/en-us/webhelp/onlinehelp/AdministratorHelp/WebProtection/ApplicationControl/index.html
    - https://attack.mitre.org/techniques/T1071/
  description: |
    Detects changes in application risk levels or usage of high-risk applications that could indicate malware communication, data exfiltration attempts, or policy violations. This rule identifies applications with risk levels 4-5 or applications categorized as malware, backdoors, trojans, or botnets.
    
    Next Steps:
    1. Investigate the source IP address and user account associated with the high-risk application usage
    2. Review the specific application being used and its legitimate business purpose
    3. Check for other suspicious network activity from the same source
    4. Verify if the application usage aligns with organizational security policies
    5. Consider blocking or restricting the application if it poses a security risk
    6. Review application control policies and risk categorizations for accuracy
  where: |
    safe(log.type, "") == "Content Filtering" && 
    safe(log.component, "") == "Application" &&
    (safe(log.applicationRisk, "") != "" && 
     (safe(log.applicationRisk, "") == "5" || 
      safe(log.applicationRisk, "") == "4" ||
      (safe(log.applicationCategory, "") contains "malware" ||
       safe(log.applicationCategory, "") contains "backdoor" ||
       safe(log.applicationCategory, "") contains "trojan" ||
       safe(log.applicationCategory, "") contains "botnet")))
  deduplicateBy:
    - origin.ip
    - lastEvent.log.applicationName
