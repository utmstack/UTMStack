- id: 1008
  dataTypes:
    - firewall-sophos-xg
  name: Sophos XG Firewall SD-WAN Link Quality Issues
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Network Performance
  technique: Network Performance Degradation
  adversary: origin
  references:
    - https://docs.sophos.com/nsg/sophos-firewall/19.5/Help/en-us/webhelp/onlinehelp/AdministratorHelp/Routing/SDWANRoutes/RoutingSDWANRoutesManage/index.html
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects SD-WAN link quality degradation including high latency, packet loss, or jitter that could impact application performance or indicate network attacks. These issues can affect business operations and may be indicators of denial of service attacks or network infrastructure problems.

    Next Steps:
    1. Check the affected SD-WAN interfaces and verify their operational status
    2. Review network performance metrics for the impacted links
    3. Correlate with any recent network configuration changes
    4. Investigate if multiple links are affected simultaneously (possible attack)
    5. Contact network team to verify ISP status and connectivity
    6. Consider implementing traffic failover to backup links if available
    7. Monitor for patterns that might indicate intentional network degradation attacks
  where: |
    safe(log.logMessage, "") != "" && 
    safe(log.component, "") == "SD-WAN" && 
    (safe(log.logMessage, "") contains "quality" || 
     safe(log.logMessage, "") contains "latency" || 
     safe(log.logMessage, "") contains "packet loss" ||
     safe(log.logMessage, "") contains "jitter" ||
     safe(log.logMessage, "") contains "degraded" ||
     safe(log.logMessage, "") contains "SLA violation")
  deduplicateBy:
    - lastEvent.log.inInterface
    - lastEvent.log.outInterface
