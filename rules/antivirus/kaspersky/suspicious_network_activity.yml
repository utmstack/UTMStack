- id: 1003
  dataTypes:
    - antivirus-kaspersky
  name: Kaspersky Suspicious Network Activity Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Network Threat
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://support.kaspersky.com/kwts/6.1/267200
    - https://attack.mitre.org/techniques/T1071/
    - https://attack.mitre.org/techniques/T1043/
  description: |
    Detects suspicious network activities including unusual connections, potential C2 communications, or network-based attacks identified by Kaspersky security monitoring. This rule triggers when Kaspersky blocks network connections that match suspicious patterns and multiple similar events occur from the same host.
    
    Next Steps:
    1. Review the source and destination IP addresses for known malicious indicators using threat intelligence feeds
    2. Check if the blocked connection was attempting to reach known C2 servers or suspicious domains
    3. Examine the process that initiated the network connection (check log.processName or log.filePath if available)
    4. Review other security events from the same host within the last hour for additional IOCs
    5. Verify if multiple hosts are exhibiting similar network behavior (potential lateral movement or outbreak)
    6. Check firewall logs for any successful connections to the same destination that may have bypassed Kaspersky
    7. Consider isolating the affected system if C2 communication is confirmed
    8. Run a full system scan on the affected host and check for persistence mechanisms
    9. Review network traffic logs for data exfiltration attempts to the same destination
    10. Document the incident and update block lists with confirmed malicious IPs/domains
  where: |
    safe(log.signatureID, "") != "" && 
    (
      contains(safe(log.message, ""), "suspicious connection") ||
      contains(safe(log.message, ""), "network attack") ||
      contains(safe(log.descMsg, ""), "network") ||
      contains(safe(log.cs1, ""), "NETWORK") ||
      contains(safe(log.cs2, ""), "Net-Worm") ||
      contains(safe(log.cs4, ""), "Net-Worm") ||
      contains(safe(log.message, ""), "port scan") ||
      contains(safe(log.message, ""), "unusual traffic") ||
      (safe(log.dstIP, "") != "" && safe(log.dpt, "") != "")
    ) &&
    safe(log.act, "") == "Blocked"
  afterEvents:
    - indexPattern: v11-log-antivirus-kaspersky-*
      with:
        - field: log.src.keyword
          operator: filter_term
          value: '{{log.src}}'
        - field: log.dstIP.keyword
          operator: filter_term
          value: '{{log.dstIP}}'
      within: now-30m
      count: 5
  deduplicateBy:
    - lastEvent.log.dvchost
    - lastEvent.log.src
    - lastEvent.log.dstIP
