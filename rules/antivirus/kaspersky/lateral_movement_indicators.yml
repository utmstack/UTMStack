# Rule version v1.1.1
dataTypes:
- antivirus-kaspersky
name: Lateral Movement Indicators Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Lateral Movement
technique: T1021 - Remote Services
adversary: origin
references:
- https://attack.mitre.org/tactics/TA0008/
- https://support.kaspersky.com/KESWin/11/en-us/151065.htm
description: "Detects indicators of lateral movement attempts within the network through Kaspersky antivirus logs. \nAttackers use various\
  \ techniques including PSExec, WMI, RDP, SMB shares, and exploitation tools to move \nfrom one compromised system to others, expanding\
  \ their access and control across the network. This rule \nidentifies blocked or detected activities that may indicate lateral movement\
  \ attempts.\n\nNext Steps:\n1. Investigate the source IP and hostname for signs of compromise\n2. Review authentication logs for the\
  \ same time period to identify potential credential theft\n3. Check if the detected tools (PSExec, WMI, RDP) are authorized for use\
  \ in your environment\n4. Examine network traffic between the source and destination systems\n5. Look for other suspicious activities\
  \ from the same source host\n6. Consider isolating affected systems if lateral movement is confirmed\n7. Review similar patterns from\
  \ the same source within the detection window\n\nHistory counts only matching CEF candidates from the same collector and source identity.\n"
where: |
  equals("event.format","cef") && ((equals("event.cn1", "3") || equals("event.cs1", "DETECT") || equals("actionResult", "denied")) &&
  (contains("event.msg", ["psexec", "wmi", "rdp", "smb", "admin$", "ipc$", "c$",
    "remote", "lateral", "pivot"]) ||
   contains("event.cs4", ["exploit", "mimikatz", "bloodhound", "sharphound", "propagat"])) &&
  exists("target.ip") &&
  exists("origin.ip") &&
  safe("origin.ip", "") != safe("target.ip", "")) && exists("event.endpointKey") && exists("event.endpointKeyType") && exists("dataSource")
correlation:
- indexPattern: v11-log-antivirus-kaspersky-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.endpointKeyType
    operator: filter_term
    value: '{{.event.endpointKeyType}}'
  - field: event.endpointKey
    operator: filter_term
    value: '{{.event.endpointKey}}'
  - field: event.correlationCandidate.lateralMovementIndicators
    operator: filter_term
    value: match
  within: 2h
  count: 3
groupBy:
- adversary.ip
- target.ip
