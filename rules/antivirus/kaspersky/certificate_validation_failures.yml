- id: 1008
  dataTypes:
    - antivirus-kaspersky
  name: Kaspersky Certificate Validation Failures
  impact:
    confidentiality: 5
    integrity: 5
    availability: 2
  category: Certificate Security
  technique: "T1553.004 - Subvert Trust Controls: Install Root Certificate"
  adversary: origin
  references:
    - https://support.kaspersky.com/KATA/3.6/en-US/175942.htm
    - https://attack.mitre.org/techniques/T1553/
    - https://attack.mitre.org/techniques/T1553/004/
  description: |
    Detects certificate validation failures that may indicate attempts to bypass security controls, man-in-the-middle attacks, or use of fraudulent certificates. This includes invalid SSL certificates, expired certificates, or suspicious certificate chains. Common Kaspersky events include "SSL connection with invalid certificate detected" and "Certificate verification problem detected".
    
    Next Steps:
    - Identify the source IP and destination URL/domain associated with the certificate failure
    - Check if the certificate issue is widespread or isolated to specific connections
    - Verify if the destination is a legitimate service with a known certificate issue
    - Review proxy/firewall logs for related SSL/TLS interception attempts
    - Check for any recent changes to certificate stores or trusted root CAs
    - Investigate if malware is attempting to establish encrypted C2 channels
    - Consider blocking the destination if it's consistently presenting invalid certificates
  where: |
    safe(log.signatureID, "") != "" && 
    (
      contains(safe(log.msg, ""), "certificate") ||
      contains(safe(log.msg, ""), "SSL") ||
      contains(safe(log.msg, ""), "TLS") ||
      contains(safe(log.cs1, ""), "CERT_") ||
      contains(safe(log.cs4, ""), "Certificate") ||
      contains(safe(log.descMsg, ""), "certificate validation") ||
      contains(safe(log.descMsg, ""), "invalid cert") ||
      contains(safe(log.msg, ""), "SSL connection with invalid certificate") ||
      contains(safe(log.msg, ""), "Certificate verification problem")
    ) &&
    (
      contains(safe(log.msg, ""), "invalid") ||
      contains(safe(log.msg, ""), "expired") ||
      contains(safe(log.msg, ""), "suspicious") ||
      contains(safe(log.msg, ""), "failed") ||
      contains(safe(log.msg, ""), "untrusted") ||
      contains(safe(log.msg, ""), "verification problem") ||
      contains(safe(log.cs1, ""), "FAIL")
    )
  deduplicateBy:
    - origin.host
    - target.host
    - lastEvent.log.dst
