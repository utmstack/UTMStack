- id: 1009
  dataTypes:
    - antivirus-kaspersky
  name: Kaspersky Sandbox Evasion Attempts Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Evasion Techniques
  technique: "T1497 - Virtualization/Sandbox Evasion"
  adversary: origin
  references:
    - https://www.kaspersky.com/enterprise-security/malware-sandbox
    - https://attack.mitre.org/techniques/T1497/
    - https://attack.mitre.org/techniques/T1497/001/
  description: |
    Identifies malware attempting to detect and evade sandbox environments. This includes time-based evasion, environment checks, anti-VM techniques, and other behaviors designed to avoid analysis in controlled environments.
    
    Next Steps:
    1. Immediately isolate the affected system to prevent potential malware spread
    2. Review the process that triggered the sandbox evasion detection
    3. Check for any suspicious parent processes or child processes
    4. Collect memory dumps and samples for deeper analysis
    5. Review recent file downloads and email attachments on the affected system
    6. Check if similar detection occurred on other systems in the network
    7. Consider submitting the sample to Kaspersky for further analysis
  where: |
    safe(log.signatureID, "") != "" && 
    (
      contains(safe(log.cefMsg, ""), "sandbox") ||
      contains(safe(log.cefMsg, ""), "evasion") ||
      contains(safe(log.cefMsg, ""), "anti-VM") ||
      contains(safe(log.cefMsg, ""), "virtualization") ||
      contains(safe(log.cefMsgAll, ""), "sandbox") ||
      contains(safe(log.cefMsgAll, ""), "evasion") ||
      contains(safe(log.cs1, ""), "SANDBOX_") ||
      contains(safe(log.cs4, ""), "Evasion") ||
      contains(safe(log.cs4, ""), "AntiVM") ||
      contains(safe(log.cs4, ""), "environment check") ||
      contains(safe(log.cs4, ""), "time delay") ||
      contains(safe(log.cs4, ""), "VM detection") ||
      (safe(log.cat, "") == "Behavior Detection" && 
        (contains(safe(log.cefMsg, ""), "delay") || contains(safe(log.cefMsg, ""), "sleep")))
    )
  deduplicateBy:
    - origin.host
    - log.cs4
