- id: 1013
  dataTypes:
    - antivirus-kaspersky
  name: Process Hollowing Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1055.012 - Process Injection: Process Hollowing"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1055/012/
    - https://www.kaspersky.com/enterprise-security/wiki-section/products/behavior-based-protection
  description: |
    Detects process hollowing attempts where malware creates a new process in suspended state, unmaps its memory, and replaces it with malicious code. This advanced technique is used to evade detection by hiding malicious code within legitimate processes.
    
    Next Steps:
    1. Immediately isolate the affected system to prevent lateral movement
    2. Identify the parent process that initiated the hollowing attempt
    3. Check for persistence mechanisms on the affected host
    4. Review process creation events around the same timeframe
    5. Collect memory dumps for forensic analysis
    6. Search for similar patterns across other endpoints
    7. Update endpoint protection policies to block the identified threat
  solution: |
    1. Quarantine the affected process and any related files
    2. Perform full system scan with updated antivirus signatures
    3. Review and update application whitelisting policies
    4. Implement additional process monitoring and behavioral analysis
    5. Consider deploying endpoint detection and response (EDR) solutions
    6. Update incident response procedures for process injection attacks
  where: |
    (safe(log.signatureID, "") == "3" || safe(log.cs1, "") == "DETECT") &&
    (safe(log.message, "").contains("hollow") || safe(log.message, "").contains("RunPE") || 
     safe(log.message, "").contains("suspend") || safe(log.message, "").contains("NtUnmapViewOfSection") || 
     safe(log.message, "").contains("ZwUnmapViewOfSection") ||
     safe(log.cs4, "").contains("hollow") || safe(log.cs4, "").contains("RunPE") || 
     safe(log.cs4, "").contains("replace") ||
     safe(log.cefMsg, "").contains("hollow") || safe(log.cefMsg, "").contains("suspended") || 
     safe(log.cefMsg, "").contains("unmap")) &&
    int(safe(log.cefDeviceSeverity, "0")) >= 3
  deduplicateBy:
    - lastEvent.origin.host
    - lastEvent.log.cs5
