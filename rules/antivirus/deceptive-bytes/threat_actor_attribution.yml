- id: 1023
  dataTypes:
    - antivirus-deceptive-bytes
  name: Threat Actor Attribution
  impact:
    confidentiality: 4
    integrity: 4
    availability: 3
  category: Threat Intelligence
  technique: "T1583 - Acquire Infrastructure"
  adversary: origin
  references:
    - https://attack.mitre.org/groups/
    - https://malpedia.caad.fkie.fraunhofer.de/
  description: |
    Correlates observed attack patterns, tools, techniques, and infrastructure with known threat actor profiles to provide attribution intelligence and identify potential threat actors based on high-confidence indicators.
    
    Next Steps:
    1. Review the attributed threat actor profile and historical campaigns for context
    2. Analyze the specific TTPs (Tactics, Techniques, and Procedures) that triggered the attribution
    3. Check for related activity from the same actor across other systems or time periods
    4. Correlate with threat intelligence feeds to validate attribution confidence
    5. Document observed infrastructure and tooling for future threat hunting
    6. Consider implementing specific detections for this actor's known techniques
    7. Share attribution indicators with security teams for enhanced monitoring
    8. Escalate to incident response team if high-profile threat actor is identified
  where: |
    safe(lastEvent.log.eventType, "") == "threat_attribution" &&
    safe(lastEvent.log.attributionConfidence, 0) >= 70 &&
    safe(lastEvent.log.actorProfile, "") != "" &&
    safe(lastEvent.log.deceptionTriggered, false) == true &&
    (safe(lastEvent.log.ttpsMatched, 0) >= 3 ||
     safe(lastEvent.log.infrastructureMatch, false) == true ||
     safe(lastEvent.log.toolingFingerprint, "") != "") &&
    safe(lastEvent.log.historicalCampaignMatch, false) == true
  deduplicateBy:
    - lastEvent.log.actorProfile
    - lastEvent.log.campaignId
    - lastEvent.origin.host
