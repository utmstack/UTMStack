- id: 1021
  dataTypes:
    - deceptive-bytes
  name: Nation-State Tactic Detection
  impact:
    confidentiality: 5
    integrity: 5
    availability: 3
  category: Advanced Persistent Threat
  technique: "T1595 - Active Scanning / Nation-State Attack Patterns"
  adversary: origin
  references:
    - https://attack.mitre.org/groups/
    - https://www.cisa.gov/topics/cyber-threats-and-advisories/advanced-persistent-threats
  description: |
    Detects sophisticated attack patterns and techniques commonly associated with nation-state actors including advanced persistence mechanisms, custom tooling, and strategic lateral movement.
    
    Next Steps:
    1) Immediately isolate affected systems and preserve forensic evidence
    2) Review all decoy interactions and identify compromised credentials
    3) Check for lateral movement attempts from the source IP across all systems
    4) Analyze custom tools or malware samples if detected
    5) Engage incident response team for potential APT activity
    6) Review network traffic for command & control communications
    7) Implement enhanced monitoring on high-value targets identified in the attack
  where: >
    safe(log.event_type, "") in ["decoy_interaction", "honeypot_access", "deception_triggered"] &&
    safe(log.threat_level, "") == "critical" &&
    (safe(log.attack_sophistication, "") == "advanced" || safe(log.threat_score, 0) >= 85) &&
    (safe(log.apt_indicators, false) == true ||
     safe(log.custom_malware, false) == true ||
     safe(log.advanced_ttps, false) == true ||
     safe(log.targeted_decoys, 0) > 1 ||
     safe(log.persistence_attempt, false) == true)
  deduplicateBy:
    - origin.ip
    - origin.host
