- id: 1015
  dataTypes:
    - antivirus-esmc-eset
  name: Firewall Rule Violations
  impact:
    confidentiality: 3
    integrity: 3
    availability: 4
  category: Network Security
  technique: "T1071 - Application Layer Protocol"
  adversary: origin
  references:
    - https://help.eset.com/protect_cloud/en-US/events-exported-to-json-format.html
    - https://attack.mitre.org/techniques/T1071/
  description: |
    Detects firewall rule violations and suspicious network connection attempts blocked by ESET Firewall, including potential command and control communications or data exfiltration attempts. This rule triggers when ESET blocks network connections to suspicious ports or when high/medium severity events are detected.
    
    Next Steps:
    1. Review the blocked connection details including source IP, destination IP, and port
    2. Check if the source IP is associated with any known compromised systems
    3. Investigate the process that initiated the blocked connection
    4. Review ESET logs for additional context about why the connection was blocked
    5. If the blocked connection appears malicious, check for other indicators of compromise on the affected system
    6. Consider adding permanent firewall rules to block persistent malicious connection attempts
  where: |
    safe(lastEvent.action, "") in ["blocked", "denied", "dropped"] &&
    safe(origin.ip, "") != "" &&
    safe(target.ip, "") != "" &&
    (
      safe(target.port, 0) in [22, 23, 445, 3389, 4444, 8080, 8443] ||
      safe(lastEvent.severity, "") in ["high", "medium"]
    )
  deduplicateBy:
    - origin.ip
    - target.ip
    - target.port
