# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: ESET Inbound Botnet Communication Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Command and Control
technique: "T1071 - Application Layer Protocol"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1071/
description: |
  Detects an inbound firewall detection whose event or detection name identifies botnet command-and-control activity. The managed endpoint is the network destination and the remote source is the alert adversary. A blocked attempt does not establish an active infection or successful communication; review the reported action and endpoint evidence. Records without a known direction cannot select a remote adversary side.

  Next Steps:
  1. Review the managed endpoint and the reported outcome before choosing containment
  2. Use the managed endpoint identity and network destination to identify the affected system
  3. Review the structured event, detection name, endpoint addresses, and process fields; use the protected raw event for additional context
  4. Investigate relevant process activity on the affected host
  5. Scan the system with ESET and assess any detections
  6. Check other systems in the network for similar C2 communication attempts
  7. Update firewall rules to block any identified C2 server IPs found in the logs
  8. Consider reimaging the system if the infection persists
  9. Review ESET logs for the time period around this detection to identify related malicious activity
where: |
  (equals("log.eventType", "FirewallAggregated_Event") &&
  (regexMatch("log.threat_name", "(?i)(botnet|cnc[.]generic|c&c|command and control)") || regexMatch("log.event", "(?i)(botnet|cnc[.]generic|c&c|command and control)")) &&
  equals("log.inbound", true) && exists("origin.ip")) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - adversary.ip
  - lastEvent.log.threat_name
