- id: 1017
  dataTypes:
    - antivirus-esmc-eset
  name: Data Loss Prevention Alert
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Data Protection
  technique: "T1005 - Data from Local System"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1005/
    - https://help.eset.com/protect_admin/10.1/en-US/events-exported-to-json-format.html
  description: |
    Detects when sensitive data is being accessed or transferred in violation of data loss prevention policies, potentially indicating data exfiltration attempts. This rule monitors ESET DLP events that indicate blocked, quarantined, or policy violations.
    
    Next Steps:
    1. Identify the user and endpoint involved in the DLP violation
    2. Review the specific data that triggered the DLP alert (check log.jsonMessage for details)
    3. Contact the user to understand the business justification for the action
    4. Check for any patterns of similar violations from the same user or endpoint
    5. Review DLP policies to ensure they are properly configured and not overly restrictive
    6. If malicious intent is suspected, initiate incident response procedures
    7. Consider additional monitoring of the user's activities and data access patterns
    8. Document the incident and any remediation actions taken
  where: safe(log.jsonMessage, "").contains("DLP") && (safe(log.jsonMessage, "").contains("blocked") || safe(log.jsonMessage, "").contains("quarantined") || safe(log.jsonMessage, "").contains("violation") || safe(log.jsonMessage, "").contains("policy"))
  deduplicateBy:
    - lastEvent.origin.user
    - lastEvent.origin.host
