# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: Advanced Heuristic Detection Triggers
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion, Privilege Escalation
technique: "T1055 - Process Injection"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1055/
description: |
  Detects three antivirus heuristic detections in thirty minutes on the same managed endpoint when ESET reports an explicit cleaned, deleted, quarantined, or blocked action without an action error. Detection labels are matched in structured threat or scanner fields; remediation does not establish a successful network connection.

  Next Steps:
  - Review the affected hostname and user context to understand the scope
  - Check the process name (if available) that triggered the detection
  - Verify if the action taken (cleaned/deleted/quarantined) was successful
  - Look for related alerts from the same host within the past 24 hours
  - If multiple hosts show similar detections, investigate potential lateral movement
  - Consider isolating the affected system if threat persists
  - Review ESET console link (if available) for detailed threat information
  - Check file hash against threat intelligence databases if available
  - Capture and analyze the malicious file sample if quarantined
  - Review system logs for any unusual activities before and after detection
  - Update ESET signatures and run a full system scan
where: |
  (equals("event.eventType", "Threat_Event") &&
  (regexMatch("event.threat_name", "(?i)(heuristic|newheur|suspicious behavior)") || regexMatch("event.threat_type", "(?i)(heuristic|newheur|suspicious behavior)") || regexMatch("event.scanner_id", "(?i)(heuristic|newheur|suspicious behavior)")) &&
  regexMatch("action", "(?i)^(cleaned|deleted|quarantined|blocked|denied|prevented)$") &&
  (!exists("event.action_error") || equals("event.action_error", "")) &&
  !equals("event.threat_handled", false)) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("event.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("event.endpointKey") && !equals("event.endpointKey", "")
afterEvents:
  - indexPattern: v11-log-antivirus-esmc-eset-*
    with:
      - field: dataSource
        operator: filter_term
        value: '{{.dataSource}}'
      - field: event.endpointKeyType
        operator: filter_term
        value: '{{.event.endpointKeyType}}'
      - field: event.endpointKey
        operator: filter_term
        value: '{{.event.endpointKey}}'
      - field: event.correlationCandidate.heuristicRemediation
        operator: filter_term
        value: 'match'
    within: 30m
    count: 3
groupBy:
  - lastEvent.dataSource
  - lastEvent.event.endpointKeyType
  - lastEvent.event.endpointKey
  - lastEvent.event.eventType
