# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: Machine Learning Detection Anomalies
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1204.002 - User Execution: Malicious File"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1204/002/
description: |
  Detects antivirus detections that explicitly identify machine learning in the structured detection type, detection name, or scanner identity. ESET does not publish an exhaustive value vocabulary for these fields; the retained label heuristic does not claim coverage of every engine/version.

  Next Steps:
  - Immediately investigate the affected host for signs of compromise
  - Review the threat details in the log message to understand the malware type and behavior
  - Check if the malware was successfully blocked or quarantined
  - Look for similar detections across other hosts in your environment
  - Consider isolating the affected system if the threat was not successfully contained
  - Review process activity around the time of detection for suspicious behavior
  - Collect and analyze the malware sample if available for threat intelligence
  - Update security policies to prevent similar threats
  - Check for any data exfiltration or lateral movement attempts from the affected host
where: |
  (equals("event.eventType", "Threat_Event") &&
  (regexMatch("event.threat_name", "(?i)machine[ -]learning") ||
   regexMatch("event.threat_type", "(?i)machine[ -]learning") ||
   regexMatch("event.scanner_id", "(?i)machine[ -]learning"))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("event.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("event.endpointKey") && !equals("event.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.event.endpointKeyType
  - lastEvent.event.endpointKey
  - lastEvent.event.threat_name
