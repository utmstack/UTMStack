# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: ESET Repeated Quarantine Failures
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1562/001/
description: |
  Detects five antivirus quarantine or cleaning failures in one hour on the same managed endpoint. The action_error field must explicitly report an error for a relevant remediation operation; unrelated endpoint activity cannot satisfy the threshold.

  Next Steps:
  1. Identify the specific file or threat that cannot be quarantined
  2. Check the file permissions and processes locking the file
  3. Attempt manual quarantine or deletion in safe mode
  4. Review the malware's persistence mechanisms
  5. Consider isolating the endpoint for manual remediation
  6. Run a boot-time scan if available
where: |
  (equals("log.eventType", "Threat_Event") && equals("actionResult", "failure") &&
  regexMatch("log.actionerror", "(?s).+") &&
  (regexMatch("action", "(?i)(quarantin|clean)") || regexMatch("log.actionerror", "(?i)(quarantin|clean)"))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
afterEvents:
  - indexPattern: v11-log-antivirus-esmc-eset-*
    with:
      - field: dataSource
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.endpointKeyType
        operator: filter_term
        value: '{{.log.endpointKeyType}}'
      - field: log.endpointKey
        operator: filter_term
        value: '{{.log.endpointKey}}'
      - field: log.correlationCandidate.quarantineFailure
        operator: filter_term
        value: 'match'
    within: 1h
    count: 5
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
