# Rule version v1.0.0

dataTypes:
  - antivirus-esmc-eset
name: ESET Network Attack Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Initial Access
technique: "T1190 - Exploit Public-Facing Application"
adversary: origin
references:
  - https://help.eset.com/protect_admin/13.1/en-US/events-exported-to-json-format.html
  - https://attack.mitre.org/techniques/T1190/
description: |
  Detects an explicitly blocked firewall event that identifies an attack, exploitation, intrusion, or named detection. A generic firewall policy block alone is not enough. Physical source and destination addresses remain unchanged; this rule attributes the network attempt to its source. Botnet detections use the separate direction-aware rules so an outbound client is not labeled as the remote command-and-control endpoint.

  Next Steps:
  1. Review the attack details in ESET console to identify the specific vulnerability or attack pattern
  2. Check if the source IP is known malicious using threat intelligence sources
  3. Verify if other systems received similar attacks from the same source
  4. Review firewall logs for additional suspicious activity from the source IP
  5. Consider blocking the source IP at the perimeter firewall if attacks persist
  6. Update network security policies and ensure all systems are patched
where: |
  (equals("log.eventType", "FirewallAggregated_Event") && equals("actionResult", "denied") &&
  exists("origin.ip") &&
  !regexMatch("log.threatname", "(?i)(botnet|cnc[.]generic|c&c|command and control)") &&
  !regexMatch("log.event", "(?i)(botnet|cnc[.]generic|c&c|command and control)") &&
  (regexMatch("log.event", "(?i)(attack|exploit|intrusion)") ||
   (exists("log.threatname") && !oneOf("log.threatname", ["", "unknown", "-"])))) &&
  exists("dataSource") && !oneOf("dataSource", ["", "unknown", "-"]) &&
  oneOf("log.endpointKeyType", ["uuid", "host", "ip"]) &&
  exists("log.endpointKey") && !equals("log.endpointKey", "")
groupBy:
  - lastEvent.dataSource
  - lastEvent.log.endpointKeyType
  - lastEvent.log.endpointKey
  - adversary.ip
  - lastEvent.log.threatname
