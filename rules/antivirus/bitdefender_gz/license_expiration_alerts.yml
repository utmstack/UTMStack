- id: 1008
  dataTypes:
    - antivirus-bitdefender-gz
  name: Bitdefender GravityZone License Expiration Alert
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: System Health
  technique: "T1489 - Service Stop"
  adversary: origin
  references:
    - https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
    - https://attack.mitre.org/techniques/T1489/
  description: |
    Detects license expiration events for Bitdefender GravityZone that could lead to protection gaps. License expiration can leave systems vulnerable to malware and other security threats due to lack of updates and real-time protection.
    
    Next Steps:
    1. Verify the license status in the Bitdefender GravityZone console
    2. Check the exact expiration date and renewal status
    3. Contact your licensing administrator or vendor for immediate renewal
    4. Review all affected systems to ensure continued protection
    5. Document the license renewal process to prevent future expirations
    6. Set up proactive license monitoring alerts at 30, 15, and 7 days before expiration
    7. Ensure backup security measures are in place during any protection gaps
    8. Review system logs for any security events that occurred during the protection gap
    9. Consider implementing a license management system for all security tools
  where: |
    safe(log.eventType, "") == "license_expired" || 
    safe(log.eventType, "") == "license_expiring" || 
    safe(log.eventType, "") == "license_about_to_expire" ||
    (safe(log.eventType, "") == "Product ModulesStatus" && safe(log.restData, "").contains("license")) ||
    (safe(log.severity, "") == "high" && safe(log.restData, "").contains("license expir"))
  deduplicateBy:
    - log.hostId
    - log.productVersion
