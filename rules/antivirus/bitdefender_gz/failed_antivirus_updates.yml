- id: 1003
  dataTypes:
    - antivirus-bitdefender-gz
  name: Failed Antivirus Updates Across Multiple Endpoints
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: System
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects when antivirus signature updates fail on endpoints. This could indicate network connectivity issues, update server problems, or potentially malicious interference with security updates.
    
    Next Steps:
    - Check network connectivity between affected endpoints and update servers
    - Review update server logs for errors or performance issues
    - Verify BitDefender GravityZone server status and disk space
    - Check for any firewall or proxy configuration changes
    - Look for signs of malicious activity attempting to disable security updates
    - Consider manually triggering updates on affected endpoints
    - Review system logs for any related errors during the update window
  where: |
    safe(log.eventType, "") == "Update" &&
    (safe(log.restData, "").contains("failed") || safe(log.restData, "").contains("error")) &&
    safe(log.hostId, "") != ""
  deduplicateBy:
    - lastEvent.log.hostId
