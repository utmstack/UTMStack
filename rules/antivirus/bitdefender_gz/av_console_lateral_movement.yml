# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Sensitive Task Activity Across Endpoints
impact:
  confidentiality: 1
  integrity: 2
  availability: 1
category: Lateral Movement
technique: T1072 - Software Deployment Tools
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1072/
description: 'A successful task with a name indicating uninstall, quarantine restoration, script execution or command execution is accompanied
  by at least three similarly classified records of the same task type and creator on other endpoints within one hour. This is an event
  count, not three distinct endpoints. Normal scan/update status events do not count. Task labels and bursts alone do not prove console
  compromise or lateral movement. Check the creator, actual task operation and approved change record before containment.

  '
where: equals("log.correlationCandidate.av_console_lateral_movement","match")
correlation:
- indexPattern: v11-log-antivirus-bitdefender-gz-*
  within: 1h
  count: 3
  with:
  - field: log.correlationCandidate.av_console_lateral_movement
    operator: filter_term
    value: match
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.BitdefenderGZCompanyId
    operator: filter_term
    value: '{{.log.BitdefenderGZCompanyId}}'
  - field: log.endpointKeyType
    operator: filter_term
    value: '{{.log.endpointKeyType}}'
  - field: log.endpointKey
    operator: must_not_term
    value: '{{.log.endpointKey}}'
  - field: log.suid
    operator: filter_term
    value: '{{.log.suid}}'
  - field: log.BitdefenderGZTaskType
    operator: filter_term
    value: '{{.log.BitdefenderGZTaskType}}'
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- lastEvent.log.BitdefenderGZTaskName
