# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Ransomware Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Impact
technique: T1486 - Data Encrypted for Impact
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1486/
description: 'The vendor attack classification, ransomware-mitigation module or detection name identifies ransomware-related activity.
  The finding may describe an attempt that was blocked or remediated; it does not establish that files were encrypted. Promptly review
  the vendor action, affected files, processes and accessible shares, and contain supported active activity according to the incident
  response plan.

  '
where: 'regexMatch("log.BitdefenderGZAttackTypes", "(?i)Ransomware") ||

  equals("log.BitdefenderGZModule", "ransomware-mitigation") ||

  contains("target.malware", "Ransom") ||

  contains("log.BitdefenderGZDetectionName", "Ransom")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- lastEvent.log.BitdefenderGZIncidentId
