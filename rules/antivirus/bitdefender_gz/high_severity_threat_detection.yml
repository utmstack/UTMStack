# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone High Severity Malware Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: 'T1204.002 - User Execution: Malicious File'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1204/002/
description: 'GravityZone reports an antimalware, behavioral or HyperDetect event with CEF severity at least 8. This is the vendor event
  priority, not proof of compromise. actionResult=denied means the recorded action explicitly blocked or quarantined; success is qualified
  remediation, and failure means the vendor reports the threat still present. An absent result is unknown. Review target.malware, hashes,
  log.filePath and log.BitdefenderGZMalwareType; the latter describes the infected-object category, not the SDK malware type.

  '
where: 'oneOf("log.BitdefenderGZModule", ["av", "avc", "hd"]) &&

  greaterOrEqual("log.cefSeverity", 8)

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.malware
