# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone High Severity Targeted or Sandbox Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: 'T1204.002 - User Execution: Malicious File'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1204/002/
- https://attack.mitre.org/techniques/T1110/
description: 'A high-severity vendor detection indicates a targeted-attack label, sandbox finding or credential-access technique. These
  indicators do not establish an advanced persistent actor. Review the detection and endpoint evidence before attributing a campaign.

  '
where: "greaterOrEqual(\"log.cefSeverity\", 8) &&\n(\n  (equals(\"log.BitdefenderGZModule\", \"hd\") &&\n   regexMatch(\"log.BitdefenderGZAttackTypes\"\
  , \"(?i)targeted attack\")) ||\n  equals(\"log.BitdefenderGZModule\", \"network-sandboxing\") ||\n  equals(\"log.BitdefenderGZDetectionAttackTechnique\"\
  , \"credentialAccess\")\n)\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- lastEvent.log.BitdefenderGZDetectionName
