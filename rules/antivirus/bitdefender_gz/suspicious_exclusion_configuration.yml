- id: 1007
  dataTypes:
    - antivirus-bitdefender-gz
  name: Bitdefender GravityZone Suspicious Exclusions Added
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects when exclusions are added to Bitdefender GravityZone configuration. Attackers often add exclusions to prevent antivirus from scanning malicious files or directories.
    
    Next Steps:
    1. Identify what exclusions were added and the paths/processes being excluded
    2. Verify if the exclusion was authorized through proper change management
    3. Check if the excluded paths contain suspicious files or known malware locations
    4. Review the user account that made the configuration change
    5. Look for any malware detections before and after the exclusion was added
    6. Consider removing unauthorized exclusions and scanning the previously excluded areas
  where: (safe(log.eventType, "") == "configuration_change" && safe(log.restData, "") contains "exclusion") || (safe(log.eventType, "") == "policy_change" && (safe(log.restData, "") contains "exclusion" || safe(log.restData, "") contains "whitelist")) || (safe(log.restData, "") contains "exclusion_added" || safe(log.restData, "") contains "whitelist_added")
  deduplicateBy:
    - log.hostId
    - log.deviceIps
