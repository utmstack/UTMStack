# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Malware Not Remediated
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1562/001/
description: 'An AntiMalware event reports failure to remediate (still present), or reports a positive present-malware counter while
  quarantine and cleaned counters are zero. This establishes a remediation concern, not that a process executed or the endpoint is compromised.
  Ignored and report-only actions alone are not mapped to failure. Review the complete counters and vendor final action, object type,
  file/process and endpoint state; prioritize containment if active compromise is confirmed or strongly supported.

  '
where: "equals(\"log.eventType\", \"AntiMalware\") &&\n(\n  oneOf(\"actionResult\", [\"failure\", \"failed\"]) ||\n  (greaterOrEqual(\"\
  log.BitdefenderGZPresentMalwareCnt\", 1) &&\n   equals(\"log.BitdefenderGZQuarantinedMalwareCnt\", 0) &&\n   equals(\"log.BitdefenderGZCleanedMalwareCnt\"\
  , 0))\n)\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.malware
