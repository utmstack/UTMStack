# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Exclusion-Related Task Succeeded
impact:
  confidentiality: 1
  integrity: 1
  availability: 0
category: Defense Evasion
technique: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1562/001/
description: 'GravityZone reports success for a task whose vendor-provided name mentions an exclusion or allowlist. Task names are labels,
  not a configuration diff; confirm what changed and whether it was authorized before attributing defense evasion. Generic policy, scan
  and configuration tasks do not match. The full label is retained in log.taskName and log.msg.

  '
where: equals("log.BitdefenderGZModule","task-status") && equals("actionResult","success") && regexMatch("log.taskName","(?i)(exclusion|exclude|whitelist|allowlist)")
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKey
- lastEvent.log.taskName
