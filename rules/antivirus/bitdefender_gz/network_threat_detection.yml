# Rule version v3.0.1

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Network Attack Blocked
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Command and Control
technique: T1071 - Application Layer Protocol
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1071/
description: 'At least five high-severity firewall or Network Attack Defense records explicitly report blocking from the same source
  address to the same managed endpoint within two hours. Unrelated activity and report-only events do not count. This is blocked attack
  activity, not a successful connection or confirmed compromise. Investigate repeated targeting and the protection outcome.

  '
where: equals("event.correlationCandidate.networkThreatDetection","match")
correlation:
- indexPattern: v11-log-antivirus-bitdefender-gz-*
  within: 2h
  count: 5
  with:
  - field: event.correlationCandidate.networkThreatDetection
    operator: filter_term
    value: match
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.BitdefenderGZCompanyId
    operator: filter_term
    value: '{{.event.BitdefenderGZCompanyId}}'
  - field: event.endpointKeyType
    operator: filter_term
    value: '{{.event.endpointKeyType}}'
  - field: event.endpointKey
    operator: filter_term
    value: '{{.event.endpointKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
groupBy:
- lastEvent.dataSource
- lastEvent.event.BitdefenderGZCompanyId
- lastEvent.event.endpointKeyType
- lastEvent.event.endpointKey
- adversary.ip
