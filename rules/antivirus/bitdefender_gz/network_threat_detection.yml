- id: 1018
  dataTypes:
    - antivirus-bitdefender-gz
  name: Network-Based Threat Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 3
  category: Network Attack
  technique: "T1071 - Application Layer Protocol: Command and Control"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1071/
    - https://www.bitdefender.com/business/support/en/77209-135324-event-types.html
  description: |
    Detects network-based threats including C2 communications, malicious network activity, and suspicious network connections identified by Bitdefender GravityZone.
    
    Next Steps:
    1. Identify the affected host using log.hostId and check for other security events from this system
    2. Review origin.ip to determine if it's a known malicious IP or C2 server
    3. Check firewall logs for any blocked or allowed connections to/from the suspicious IP
    4. Investigate running processes on the affected host for signs of malware
    5. Review network traffic patterns for data exfiltration attempts
    6. If ransomware is detected, immediately isolate the affected system
    7. Collect network packet captures if available for deeper analysis
    8. Check if other hosts have communicated with the same external IP address
    9. Submit suspicious IPs to threat intelligence platforms for reputation checking
    10. Document findings and update firewall rules to block confirmed malicious IPs
  where: |
    safe(log.eventType, "") == "network-sandboxing" || 
    safe(log.eventType, "") == "fw" ||
    (safe(origin.ip, "") != "" && safe(log.eventType, "").contains("network")) ||
    (safe(log.message, "").contains("network") || safe(log.message, "").contains("connection") || safe(log.message, "").contains("c2") || safe(log.message, "").contains("command")) ||
    safe(log.severity, "") == "critical" ||
    safe(log.product, "").contains("network")
  afterEvents:
    - indexPattern: v11-log-antivirus-bitdefender-gz-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-6h
      count: 5
      or:
        - indexPattern: v11-log-antivirus-bitdefender-gz-*
          with:
            - field: log.hostId.keyword
              operator: filter_term
              value: '{{log.hostId}}'
            - field: log.eventType.keyword
              operator: filter_term
              value: 'network-sandboxing'
          within: now-12h
          count: 2
  deduplicateBy:
    - origin.ip
    - log.hostId
