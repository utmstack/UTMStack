# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Protection Module Disabled
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: 'T1562.001 - Impair Defenses: Disable or Modify Tools'
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1562/001/
description: 'A protection-module status event reports a disabled behavioral, power-user, data-protection or application-control module.
  Verify the applied policy and expected licensing or maintenance state. The status does not identify who changed the configuration
  or establish a malicious override. Real-time antimalware status has a separate rule.

  '
where: equals("event.BitdefenderGZModule", "modules") && (oneOf("event.avcstatus",["0"]) || equals("event.BitdefenderGZAvcStatus","0") ||
  equals("event.pustatus","0") || equals("event.BitdefenderGZPuStatus","0") || equals("event.dlpstatus","0") || equals("event.BitdefenderGZDlpStatus","0")
  || equals("event.appcontrolstatus","0") || equals("event.BitdefenderGZAppControlStatus","0"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.BitdefenderGZCompanyId
- lastEvent.event.endpointKeyType
- lastEvent.event.endpointKey
- lastEvent.event.BitdefenderGZModule
