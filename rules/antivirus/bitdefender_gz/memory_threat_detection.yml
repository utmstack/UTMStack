# Rule version v3.0.0

dataTypes:
- antivirus-bitdefender-gz
name: Bitdefender GravityZone Memory or Exploit-Related Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: T1055 - Process Injection
adversary: origin
references:
- https://www.bitdefender.com/business/support/en/77212-237089-event-types.html
- https://www.bitdefender.com/business/support/en/77212-237090-syslog-events.html
- https://attack.mitre.org/techniques/T1055/
description: 'GravityZone reports an Anti-Exploit event, a HyperDetect exploit classification, or antimalware against a process object.
  These signals do not prove successful exploitation or the absence of an on-disk artifact. Review the vendor exploit classification,
  process command and parent information, action and endpoint evidence before containment.

  '
where: "equals(\"log.BitdefenderGZModule\", \"antiexploit\") ||\n(equals(\"log.BitdefenderGZModule\", \"hd\") &&\n regexMatch(\"log.BitdefenderGZAttackType\"\
  , \"(?i)exploits\")) ||\n(equals(\"log.BitdefenderGZMalwareType\", \"process\") &&\n oneOf(\"log.BitdefenderGZModule\", [\"av\", \"\
  avc\", \"hd\"]))\n"
groupBy:
- lastEvent.dataSource
- lastEvent.log.BitdefenderGZCompanyId
- lastEvent.log.endpointKeyType
- lastEvent.log.endpointKey
- target.process
