- id: 1017
  dataTypes:
    - antivirus-sentinel-one
  name: SentinelOne Suspicious Script Execution Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Malicious Code
  technique: "T1059 - Command and Scripting Interpreter"
  adversary: origin
  references:
    - https://www.sentinelone.com/platform/singularity-cloud-workload-security/
    - https://attack.mitre.org/techniques/T1059/
  description: |
    Detects suspicious script execution activities including PowerShell, Python, Bash, or other scripting interpreters that may indicate malicious activity or fileless attacks. SentinelOne's behavioral detection engine identifies these patterns as potential threats that could compromise system integrity.
    
    Next Steps:
    1. Review the specific script or command that triggered the alert in the SentinelOne console
    2. Check if the script execution is authorized and part of normal operations
    3. Investigate the process tree to understand the parent process and execution chain
    4. Look for encoded or obfuscated commands within the script content
    5. Check for persistence mechanisms or scheduled tasks created by the script
    6. Review network connections initiated by the script process
    7. If confirmed malicious, isolate the affected endpoint and perform threat hunting across the environment
  where: |
    safe(log.eventDescription, "") != "" && 
    (
      contains(lower(safe(log.eventDescription, "")), "script execution") ||
      contains(lower(safe(log.eventDescription, "")), "powershell") ||
      contains(lower(safe(log.eventDescription, "")), "python") ||
      contains(lower(safe(log.eventDescription, "")), "bash") ||
      contains(lower(safe(log.eventDescription, "")), "cmd.exe") ||
      contains(lower(safe(log.eventDescription, "")), "fileless") ||
      contains(lower(safe(log.eventDescription, "")), "interpreter") ||
      contains(lower(safe(log.eventDescription, "")), "suspicious process") ||
      contains(lower(safe(log.eventDescription, "")), "malicious script")
    ) &&
    (safe(log.endpointDeviceName, "") != "" || safe(log.sourceIps, "") != "")
  deduplicateBy:
    - log.endpointDeviceName
