- id: 1007
  dataTypes:
    - antivirus-sentinel-one
  name: Deep Visibility Threat Indicators
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Threat Intelligence
  technique: "T1070 - Indicator Removal on Host"
  adversary: origin
  references:
    - https://www.sentinelone.com/blog/rapid-threat-hunting-with-deep-visibility-feature-spotlight/
    - https://attack.mitre.org/techniques/T1070/
  description: |
    Detects advanced threat indicators through SentinelOne's deep visibility monitoring. This rule triggers when specific threat-related events are detected in the SentinelOne logs.
    
    Next Steps:
    1. Review the event description to understand the specific threat indicator
    2. Check the affected host (syslogHost) for signs of compromise
    3. Investigate any associated user accounts (sourceUser, destinationUser)
    4. Review source IP addresses for suspicious origins
    5. Check if this is part of a larger attack campaign
    6. Consider isolating the affected endpoint if threat is confirmed
  where: safe(log.eventDescription, "") != "" && (safe(log.eventDescription, "").contains("threat") || safe(log.eventDescription, "").contains("malware") || safe(log.eventDescription, "").contains("suspicious") || safe(log.eventDescription, "").contains("malicious"))
  deduplicateBy:
    - lastEvent.log.syslogHost
    - lastEvent.log.eventDescription
