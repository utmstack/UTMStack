- id: 1002
  dataTypes:
    - antivirus-sentinel-one
  name: SentinelOne Advanced Behavioral Threat Patterns
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Advanced Threat Detection
  technique: "T1055 - Process Injection"
  adversary: origin
  references:
    - https://www.sentinelone.com/platform/behavioral-ai/
    - https://attack.mitre.org/tactics/TA0002/
    - https://attack.mitre.org/techniques/T1055/
  description: |
    Detects advanced behavioral threat patterns including process injection, privilege escalation attempts, lateral movement patterns, and sophisticated malware behaviors identified by SentinelOne's behavioral AI engine.
    
    Next Steps:
    1. Immediately isolate the affected endpoint using SentinelOne console
    2. Review the specific behavioral pattern detected and associated processes
    3. Check for any parent-child process relationships that may indicate injection or escalation
    4. Investigate any network connections from the suspicious processes
    5. Collect forensic data from the endpoint if available
    6. Review user activity logs for the associated account
    7. Check if similar behavioral patterns have been detected on other endpoints
    8. Consider threat hunting for related IOCs across the environment
  where: safe(log.eventDescription, "") =~ "(?i)(behavioral|behavior detected|anomalous behavior|suspicious activity|threat behavior|malicious behavior)" && (safe(log.eventDescription, "") =~ "(?i)(injection|escalation|lateral|persistence|evasion|defense bypass)" || safe(log.restData, "") =~ "(?i)(process injection|privilege escalation|lateral movement|persistence mechanism)") && safe(log.endpointDeviceName, "") != ""
  deduplicateBy:
    - log.endpointDeviceName
    - log.eventDescription
