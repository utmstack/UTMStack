- id: 1014
  dataTypes:
    - antivirus-sentinel-one
  name: SentinelOne Offline Agent Detection Patterns
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Availability
  technique: "T1529 - System Shutdown/Reboot"
  adversary: origin
  references:
    - https://support.sentinelone.com/hc/en-us/articles/360057987594-Agent-Connectivity-and-Network-Requirements
    - https://attack.mitre.org/techniques/T1529/
  description: |
    Detects patterns of SentinelOne agents going offline, which could indicate network issues, deliberate disconnection to evade monitoring, or system compromise. Multiple agents offline simultaneously may indicate coordinated attack or infrastructure issues.
    
    Next Steps:
    1. Verify the affected endpoint(s) network connectivity and power status
    2. Check if the offline event corresponds to scheduled maintenance or known system reboots
    3. Review recent endpoint activity logs for suspicious processes or commands before disconnection
    4. Investigate if multiple agents went offline simultaneously (potential infrastructure issue)
    5. Check for any tampering attempts on the SentinelOne agent service
    6. Verify agent version and ensure it's not outdated or corrupted
    7. Contact the endpoint user to confirm if the system is physically accessible
    8. If suspicious, isolate the endpoint and perform forensic analysis
  where: safe(log.eventDescription, "") =~ ".*(agent|endpoint).*(offline|disconnect|unreachable).*" || safe(log.sourceGpName, "") =~ ".*(offline|disconnected).*" || (safe(log.endpointDeviceName, "") != "" && safe(log.eventDescription, "") =~ ".*(connection lost|not responding|unavailable).*")
  deduplicateBy:
    - log.endpointDeviceName
