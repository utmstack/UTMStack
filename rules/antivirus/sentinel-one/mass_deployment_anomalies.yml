- id: 1015
  dataTypes:
    - antivirus-sentinel-one
  name: SentinelOne Mass Deployment Anomalies
  impact:
    confidentiality: 2
    integrity: 2
    availability: 1
  category: Execution
  technique: "T1608.002 - Deploy: Upload Tool"
  adversary: origin
  references:
    - https://support.sentinelone.com/hc/en-us/articles/360052967133-Deploy-Windows-Agents
    - https://attack.mitre.org/techniques/T1608/002/
  description: |
    Detects anomalous mass deployment activities in SentinelOne, including rapid agent installations, bulk policy changes, or mass updates that could indicate unauthorized deployment, supply chain attack, or insider threat activity.
    
    Next Steps:
    1. Verify if the mass deployment was authorized and scheduled
    2. Check the source user account for signs of compromise or unauthorized access
    3. Review the specific deployment details (number of agents, target systems, deployment method)
    4. Compare deployment patterns with historical baseline for this account
    5. Investigate any unusual deployment configurations or policy changes
    6. Check for any failed deployments or errors during the mass operation
    7. Verify the integrity of the deployed agents or updates
    8. Contact the account owner to confirm the legitimacy of the activity
    9. Review SentinelOne console logs for additional deployment context
    10. Check for concurrent suspicious activities across affected endpoints
  where: safe(log.eventDescription, "").matches(".*(?i)(mass|bulk|batch).*(deploy|install|update).*") || safe(log.eventDescription, "").matches(".*(?i)(deploy|install).*(multiple|many|bulk).*") || safe(log.eventDescription, "").matches(".*(?i)(agent|endpoint).*(bulk|mass).*") || safe(log.sourceGpName, "").matches(".*(?i)(deploy|install|bulk|mass).*")
  afterEvents:
    - indexPattern: v11-log-antivirus-sentinel-one-*
      with:
        - field: log.accName.keyword
          operator: filter_term
          value: '{{log.accName}}'
        - field: log.sourceGpName.keyword
          operator: filter_term
          value: '{{log.sourceGpName}}'
      within: now-1h
      count: 10
  deduplicateBy:
    - lastEvent.log.accName
    - lastEvent.log.sourceGpName
