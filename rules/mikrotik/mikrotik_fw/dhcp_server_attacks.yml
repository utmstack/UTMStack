- id: 1015
  dataTypes:
    - firewall-mikrotik
  name: MikroTik DHCP Server Attack
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Network Attack
  technique: "T1557 - Adversary-in-the-Middle"
  adversary: origin
  references:
    - https://timigate.com/2018/05/enable-rogue-dhcp-detection-on-mikrotik-routeros.html
    - https://attack.mitre.org/techniques/T1557/
  description: |
    Detects potential DHCP server attacks including rogue DHCP server deployment, DHCP exhaustion attempts, or unauthorized DHCP configuration changes that could lead to man-in-the-middle attacks or network disruption. These attacks can compromise network integrity by intercepting traffic or causing denial of service.
    
    Next Steps:
    1. Verify if the source IP is an authorized DHCP server in your network
    2. Check DHCP server logs for unusual lease patterns or exhaustion
    3. Monitor for rogue DHCP responses from unauthorized devices
    4. Review network topology for unauthorized devices offering DHCP services
    5. Implement DHCP snooping and trusted port configurations
    6. Check for DHCP lease depletion and unusual discovery patterns
  where: |
    (safe(log.topics, "") contains "dhcp" && 
     (safe(log.restData, "") contains "deauth" || 
      safe(log.restData, "") contains "no more free" ||
      safe(log.restData, "") contains "offering" ||
      safe(log.restData, "") contains "discover")) ||
    (safe(log.topics, "") contains "system" && 
     safe(log.restData, "") contains "dhcp" &&
     (safe(log.restData, "") contains "server" || safe(log.restData, "") contains "pool"))
  deduplicateBy:
    - adversary.ip
    - target.ip
