- id: 1027
  dataTypes:
    - firewall-mikrotik
  name: MikroTik License Violation or Tampering Detected
  impact:
    confidentiality: 1
    integrity: 3
    availability: 2
  category: License Compliance
  technique: "T1027.002 - Obfuscated Files or Information: Software Packing"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328149/RouterOS+license+keys
    - https://attack.mitre.org/techniques/T1027/002/
  description: |
    Detects potential license violations, tampering attempts, or unauthorized license modifications on MikroTik devices. This could indicate attempts to bypass licensing restrictions or use pirated software.
    
    Next Steps:
    1. Verify the license status of the affected MikroTik device
    2. Check if the device is using a legitimate license key
    3. Review system logs for any unauthorized configuration changes
    4. Ensure the device firmware is from official MikroTik sources
    5. Investigate if the device has been compromised or tampered with
    6. Contact MikroTik support if license issues persist
  where: |
    (safe(log.topics, "") == "system" || contains(safe(log.topics, ""), "system")) &&
    (contains(lower(safe(log.kvMessage, "")), "license") && 
     (contains(lower(safe(log.kvMessage, "")), "invalid") ||
      contains(lower(safe(log.kvMessage, "")), "expired") ||
      contains(lower(safe(log.kvMessage, "")), "violation") ||
      contains(lower(safe(log.kvMessage, "")), "trial") ||
      contains(lower(safe(log.kvMessage, "")), "software id") ||
      contains(lower(safe(log.kvMessage, "")), "system id")))
  deduplicateBy:
    - origin.mac
