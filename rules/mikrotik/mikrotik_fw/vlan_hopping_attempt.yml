- id: 1020
  dataTypes:
    - mikrotik_fw
  name: VLAN Hopping Attempt Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Segmentation Bypass
  technique: "T1599.001 - Network Boundary Bridging: VLAN Hopping"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/88014957/VLAN
    - https://attack.mitre.org/techniques/T1599/001/
  description: |
    Detects potential VLAN hopping attempts where an attacker tries to bypass network segmentation by sending packets with multiple VLAN tags or manipulating VLAN configurations. This rule identifies suspicious network traffic patterns that may indicate double-tagging attacks, switch spoofing, or other VLAN manipulation techniques commonly used to gain unauthorized access to network segments.
    
    Next Steps:
    1. Immediately isolate the suspected source IP and MAC address from the network
    2. Review switch port configurations for the affected interfaces
    3. Examine VLAN configurations for any unauthorized changes or misconfigurations
    4. Check for spanning tree protocol violations or unusual network topology changes
    5. Review firewall logs for any successful connections between VLANs that should be isolated
    6. Verify that trunk ports are properly configured with allowed VLAN lists
    7. Investigate if the source MAC address is legitimate or spoofed
    8. Check for any recent changes to network infrastructure or VLAN policies
    9. Monitor for additional attempts from the same source or related networks
    10. Consider implementing 802.1Q-in-Q (QinQ) protection if not already in place
  where: safe(log.chain, "") != "" && (safe(log.chain, "").contains("vlan") || safe(log.chain, "").contains("invalid") || safe(log.len, 0) > 1522 || safe(log.topics, "").contains("vlan"))
  afterEvents:
    - indexPattern: v11-log-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-10m
      count: 5
  deduplicateBy:
    - origin.ip
    - origin.mac
