- id: 1026
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Netinstall Attempts Detected
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: System Manipulation
  technique: "T1601 - Modify System Image"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/24805390/Netinstall
    - https://attack.mitre.org/techniques/T1601/
  description: |
    Detects attempts to use Netinstall on MikroTik devices, which could indicate an attempt to bypass security controls or install malicious firmware. Netinstall re-formats the system drive and reinstalls RouterOS, potentially allowing attackers to gain persistent access or install backdoors.
    
    Next Steps:
    1. Immediately investigate the source IP address attempting Netinstall
    2. Verify if this is authorized maintenance activity
    3. Check device physical access logs and security camera footage
    4. Review network traffic for suspicious communications to/from the device
    5. If unauthorized, isolate the affected device and examine for signs of compromise
    6. Verify firmware integrity and check for unauthorized modifications
    7. Review authentication logs for any suspicious access attempts
    8. Consider implementing additional physical security controls for critical network devices
  where: |
    (safe(log.topics, "") == "system" || contains(safe(log.topics, ""), "system")) &&
    (contains(lower(safe(log.kvMessage, "")), "netinstall") || 
     contains(lower(safe(log.kvMessage, "")), "pxe boot") ||
     contains(lower(safe(log.kvMessage, "")), "bootp") ||
     contains(lower(safe(log.kvMessage, "")), "tftp") && contains(lower(safe(log.kvMessage, "")), "boot"))
  afterEvents:
    - indexPattern: v11-log-firewall-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-30m
      count: 3
  deduplicateBy:
    - origin.ip
