- id: 1012
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Firewall Rule Bypass Attempt
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1562.004 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://medium.com/tenable-techblog/mikrotik-firewall-nat-bypass-b8d46398bf24
    - https://attack.mitre.org/techniques/T1562/004/
  description: |
    Detects attempts to bypass MikroTik firewall rules through various methods including Winbox port exploitation (CVE-2019-3924), unauthorized rule modifications, or suspicious connection patterns that indicate firewall evasion techniques. This rule identifies potential attackers attempting to circumvent network security controls by exploiting MikroTik RouterOS vulnerabilities or manipulating firewall configurations.
    
    Next Steps:
    1. Immediately review the source IP address and verify if it's authorized to access the MikroTik device
    2. Check MikroTik device logs for any unauthorized configuration changes or rule modifications
    3. Verify if Winbox service (port 8291) should be accessible from the detected source IP
    4. Review current firewall rules for any recent unauthorized changes or disabled rules
    5. Check for signs of CVE-2019-3924 exploitation if Winbox access is detected
    6. Monitor for additional suspicious network activity from the same source IP
    7. Consider implementing additional access controls or updating RouterOS firmware if vulnerabilities are confirmed
    8. Document the incident and implement network segmentation if breach is confirmed
  where: |
    (safe(target.port, 0) == 8291 && safe(origin.ip, "") != "" && safe(log.chain, "") contains "input") ||
    (safe(log.topics, "") contains "firewall" && safe(log.restData, "") contains "rule" && 
     (safe(log.restData, "") contains "removed" || safe(log.restData, "") contains "disabled")) ||
    (safe(log.restData, "") contains "drop" && safe(target.port, 0) in [5678, 20561])
  afterEvents:
    - indexPattern: v11-log-firewall-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-10m
      count: 5
  deduplicateBy:
    - origin.ip
    - target.port
