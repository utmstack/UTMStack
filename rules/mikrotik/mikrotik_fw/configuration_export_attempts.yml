- id: 1008
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Configuration Export Activity
  impact:
    confidentiality: 3
    integrity: 1
    availability: 1
  category: Collection
  technique: "T1602 - Data from Configuration Repository"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328094/Log
    - https://attack.mitre.org/techniques/T1602/
  description: |
    Configuration export activity detected on MikroTik device, which could indicate unauthorized attempts to steal device configuration. This activity may be part of reconnaissance or data collection efforts by attackers seeking to understand network infrastructure and security controls.
    
    Next Steps:
    1. Verify if the configuration export was authorized and performed by legitimate administrators
    2. Check the source IP address and determine if it's from a trusted management network
    3. Review recent authentication logs for the device to identify the user who performed the export
    4. Examine the timing of the export activity - was it during business hours or maintenance windows?
    5. Check for any subsequent suspicious activities from the same source IP
    6. Verify the integrity of the exported configuration and ensure no sensitive information was compromised
    7. Review firewall rules and access controls to prevent unauthorized configuration access
  where: |
    safe(log.topics, "") =~ ".*system.*info.*" && 
    (safe(log.kvMessage, "") =~ ".*export.*config.*" ||
     safe(log.kvMessage, "") =~ ".*configuration.*export.*" ||
     safe(log.kvMessage, "") =~ ".*/export.*" ||
     safe(log.restData, "") =~ ".*export.*config.*") &&
    safe(origin.ip, "") != ""
  deduplicateBy:
    - origin.ip
