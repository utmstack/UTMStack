- id: 1018
  dataTypes:
    - mikrotik_fw
  name: Wireless Security Breach Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Wireless Attack
  technique: Wireless Exploitation
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/224559120/WiFi
    - https://attack.mitre.org/techniques/T1580/
  description: |
    Detects potential wireless security breaches including deauthentication attacks, unauthorized access point connections, or suspicious wireless client behavior on MikroTik wireless infrastructure. This rule identifies patterns indicative of wireless attacks such as excessive deauthentication frames, disassociation attacks, or dropped wireless connections.
    
    Next Steps:
    1. Verify the wireless client MAC address and check if it's a known authorized device
    2. Review wireless access point logs for authentication failures or connection patterns
    3. Check for rogue access points in the vicinity using wireless scanning tools
    4. Analyze the frequency and timing of wireless events to determine if it's an automated attack
    5. Investigate physical security around wireless access points
    6. Review wireless security policies and ensure WPA3/WPA2 encryption is properly configured
    7. Consider implementing MAC address filtering or 802.1X authentication if not already in place
    8. Monitor for additional suspicious wireless activity from the same or related MAC addresses
  where: |
    safe(log.topics, "") == "wireless" && 
    (safe(log.chain, "").contains("deauth") ||
     safe(log.chain, "").contains("disassoc") ||
     safe(log.chain, "").contains("drop") ||
     safe(log.chain, "").contains("reject"))
  afterEvents:
    - indexPattern: v11-log-mikrotik-*
      with:
        - field: origin.mac.keyword
          operator: filter_term
          value: '{{origin.mac}}'
        - field: log.topics.keyword
          operator: filter_term
          value: 'wireless'
      within: now-15m
      count: 20
  deduplicateBy:
    - origin.mac
