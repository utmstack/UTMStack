- id: 1024
  dataTypes:
    - mikrotik_fw
  name: MikroTik Address List Abuse
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Security Policy Bypass
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/250708066/Firewall
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects suspicious activities related to MikroTik address lists including unauthorized modifications, excessive additions, or attempts to manipulate whitelist/blacklist entries which could indicate privilege escalation or security bypass attempts.
    
    Next Steps:
    1. Review the source IP and verify if it's authorized to modify address lists
    2. Check the specific address list modifications being performed
    3. Correlate with user authentication logs to identify the user account
    4. Verify if the changes align with approved network security policies
    5. Check for any unauthorized access or compromised admin accounts
    6. Review firewall logs for any unusual traffic patterns following the changes
  where: |
    (safe(log.topics, "") contains "firewall" && 
     (safe(lastEvent.raw, "") contains "address-list add" ||
      safe(lastEvent.raw, "") contains "address-list remove" ||
      safe(lastEvent.raw, "") contains "address-list set" ||
      safe(lastEvent.raw, "") contains "src-address-list" ||
      safe(lastEvent.raw, "") contains "dst-address-list") &&
     (safe(log.action, "") in ["add", "remove", "set"] ||
      safe(lastEvent.raw, "") contains "whitelist" ||
      safe(lastEvent.raw, "") contains "blacklist" ||
      safe(lastEvent.raw, "") contains "trusted" ||
      safe(lastEvent.raw, "") contains "allowed" ||
      safe(lastEvent.raw, "") contains "banned")) ||
    (safe(log.chain, "") in ["input", "forward"] && 
     safe(lastEvent.raw, "") contains "address-list" &&
     safe(log.action, "") == "accept" &&
     safe(origin.ip, "") != "" &&
     !safe(origin.ip, "").startsWith("192.168.") &&
     !safe(origin.ip, "").startsWith("10.") &&
     !safe(origin.ip, "").startsWith("172."))
  afterEvents:
    - indexPattern: v11-log-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.topics.keyword
          operator: filter_term
          value: 'firewall'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - lastEvent.raw
