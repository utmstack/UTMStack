- id: 1014
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Routing Table Attack
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Network Manipulation
  technique: "T1584 - Compromise Infrastructure: Domains"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328094/Log
    - https://attack.mitre.org/techniques/T1584/
  description: |
    Detects potential routing table manipulation attacks including unauthorized route additions, deletions, or modifications that could redirect traffic through malicious paths or cause network disruption. Attackers may manipulate routing tables to intercept traffic, redirect communications, or create denial of service conditions.
    
    Next Steps:
    1. Investigate the source IP and verify if the routing changes were authorized
    2. Review all recent routing table modifications and compare with change management records
    3. Check for additional suspicious network configuration changes on the same device
    4. Verify network traffic flows to ensure no traffic redirection has occurred
    5. Review admin access logs to identify who made the routing changes
    6. Consider implementing change control mechanisms for critical network infrastructure
  where: |
    safe(log.topics, "") contains "system" && 
    (safe(log.restData, "") contains "route" || safe(log.restData, "") contains "routing") &&
    (safe(log.restData, "") contains "added" || 
     safe(log.restData, "") contains "changed" || 
     safe(log.restData, "") contains "removed" ||
     safe(log.restData, "") contains "table")
  deduplicateBy:
    - origin.ip
