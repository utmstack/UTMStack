- id: 1007
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Web Interface Brute Force Attack
  impact:
    confidentiality: 2
    integrity: 2
    availability: 3
  category: Credential Access
  technique: "T1110.001 - Brute Force: Password Guessing"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328094/Log
    - https://attack.mitre.org/techniques/T1110/001/
  description: |
    Multiple failed web interface login attempts detected on MikroTik device, indicating potential brute force attack against WebFig or management interface. This activity suggests an attacker is attempting to gain unauthorized access to the device's management interface.

    Next Steps:
    1. Investigate the source IP address for legitimacy and check threat intelligence feeds
    2. Review successful logins from the same IP address within the timeframe
    3. Check if the target device has default or weak credentials configured
    4. Verify if the web interface should be accessible from the source network
    5. Consider implementing rate limiting or IP blocking on the device
    6. Review network segmentation to ensure management interfaces are properly isolated
    7. Check for any successful authentications following the failed attempts
    8. Monitor for lateral movement attempts if credentials were compromised
  where: |
    safe(log.topics, "") =~ ".*system.*error.*" && 
    safe(log.kvMessage, "") =~ ".*login failure.*web.*" &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.kvMessage
          operator: filter_match
          value: 'login failure web'
      within: now-10m
      count: 10
  deduplicateBy:
    - origin.ip
