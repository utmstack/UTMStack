- id: 1010
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Suspicious Script Execution
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Execution
  technique: "T1059 - Command and Scripting Interpreter"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328094/Log
    - https://attack.mitre.org/techniques/T1059/
  description: |
    Suspicious script execution detected on MikroTik device, which could indicate unauthorized command execution or system compromise. This rule detects script-related activities that may indicate malicious automation or unauthorized system changes.

    Next Steps:
    1. Review the specific script commands executed and verify if they are authorized
    2. Check the source IP address for any unauthorized access patterns
    3. Examine system configuration changes that occurred during the timeframe
    4. Verify administrative access logs for the affected device
    5. Review scheduler entries for any unauthorized or suspicious automated tasks
    6. Check for any privilege escalation attempts or configuration tampering
    7. Correlate with network traffic to identify potential data exfiltration
  where: |
    safe(log.topics, "") =~ ".*script.*" && 
    (safe(log.message, "") =~ ".*script.*run.*" ||
     safe(log.message, "") =~ ".*script.*execute.*" ||
     safe(log.message, "") =~ ".*scheduler.*script.*" ||
     safe(log.message, "") =~ ".*system script.*") &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.topics.keyword
          operator: filter_match
          value: script
      within: now-5m
      count: 10
  deduplicateBy:
    - origin.ip
