- id: 1021
  dataTypes:
    - mikrotik_fw
  name: MikroTik Queue Manipulation Attempt
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: Network Attack
  technique: "T1496 - Resource Hijacking"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/display/ROS/Queues
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects attempts to manipulate MikroTik queue configurations which could lead to bandwidth theft, QoS bypass, or denial of service. This includes unauthorized modifications to queue tree, simple queues, or queue types that could impact network performance.
    
    Next Steps:
    1. Verify if the queue modification was authorized by checking change management records
    2. Review the specific queue changes made and assess their impact on network performance
    3. Check if the source IP has legitimate administrative access to the MikroTik device
    4. Monitor for additional configuration changes from the same source
    5. If unauthorized, immediately review and restore proper queue configurations
    6. Consider implementing additional access controls for queue management
    7. Check for signs of bandwidth abuse or QoS policy violations
    8. Review logs for other suspicious administrative activities from the same source
  where: |
    safe(log.topics, "") contains "queue" && 
    (safe(log.kvMessage, "") contains "queue tree add" ||
     safe(log.kvMessage, "") contains "queue simple add" ||
     safe(log.kvMessage, "") contains "queue tree set" ||
     safe(log.kvMessage, "") contains "queue simple set" ||
     safe(log.kvMessage, "") contains "queue tree remove" ||
     safe(log.kvMessage, "") contains "queue simple remove" ||
     safe(log.kvMessage, "") contains "queue type set" ||
     safe(log.raw, "") contains "queue tree add" ||
     safe(log.raw, "") contains "queue simple add" ||
     safe(log.raw, "") contains "queue tree set" ||
     safe(log.raw, "") contains "queue simple set" ||
     safe(log.raw, "") contains "queue tree remove" ||
     safe(log.raw, "") contains "queue simple remove" ||
     safe(log.raw, "") contains "queue type set")
  deduplicateBy:
    - origin.ip
    - origin.host
