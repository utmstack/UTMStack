- id: 1023
  dataTypes:
    - mikrotik_fw
  name: MikroTik Connection Limit Violation
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Resource Exhaustion
  technique: "T1499 - Endpoint Denial of Service"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/130220087/Connection+tracking
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects violations of connection limits on MikroTik devices, including attempts to exceed maximum concurrent connections, connection rate limits, or connection tracking table exhaustion which could indicate DoS attacks or resource exhaustion attempts.
    
    Next Steps:
    1. Review the source IP and determine if it's legitimate traffic or an attack
    2. Check MikroTik device performance metrics and connection table utilization
    3. Examine network traffic patterns from the source IP for anomalies
    4. Consider implementing rate limiting or blocking the source IP if malicious
    5. Review firewall rules and connection limits configuration
    6. Monitor for additional connection limit violations from the same or different sources
  where: |
    (safe(log.topics, "") contains "firewall" && 
     safe(log.raw, "") contains_any(["connection limit", "conn-limit", "connection tracking", "conntrack full", "max connections", "connection overflow"])) ||
    (safe(log.chain, "") == "input" && 
     safe(log.action, "") == "drop" && 
     safe(log.raw, "") contains_any(["new", "established"]) &&
     safe(log.proto, "") == "tcp") ||
    (safe(log.topics, "") contains "system" && 
     safe(log.raw, "") contains_any(["connection table full", "tracking table overflow"]))
  deduplicateBy:
    - adversary.ip
