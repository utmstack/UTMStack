- id: 1003
  dataTypes:
    - firewall-mikrotik
  name: MikroTik API Unauthorized Access Attempts
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Unauthorized Access
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/2228226/API
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects unauthorized access attempts to MikroTik API service on ports 8728 (API) or 8729 (API-SSL). Multiple connection attempts from external sources may indicate reconnaissance or exploitation attempts against the API service.
    
    Next Steps:
    1. Verify the legitimacy of the source IP attempting API access
    2. Check if the API access is from authorized management networks
    3. Review MikroTik device logs for successful authentication attempts
    4. Consider implementing IP restrictions for API access
    5. Monitor for any configuration changes made through the API
    6. If unauthorized, block the source IP and review API security settings
  where: (safe(target.port, 0) == 8728 || safe(target.port, 0) == 8729 || safe(origin.port, 0) == 8728 || safe(origin.port, 0) == 8729) && safe(origin.ip, "") != "" && safe(protocol, "") == "tcp" && (safe(log.chain, "") contains "input" || safe(log.restData, "") contains "drop")
  afterEvents:
    - indexPattern: v11-log-firewall-mikrotik-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: target.port
          operator: filter_term
          value: '8728'
      within: now-15m
      count: 20
      or:
        - indexPattern: v11-log-firewall-mikrotik-*
          with:
            - field: origin.ip.keyword
              operator: filter_term
              value: '{{origin.ip}}'
            - field: target.port
              operator: filter_term
              value: '8729'
          within: now-15m
          count: 20
  deduplicateBy:
    - origin.ip
    - target.port
