- id: 1009
  dataTypes:
    - firewall-mikrotik
  name: MikroTik Backup File Access
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Collection
  technique: "T1560 - Archive Collected Data"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328094/Log
    - https://attack.mitre.org/techniques/T1560/
  description: |
    Backup file access detected on MikroTik device, which could indicate unauthorized attempts to access or exfiltrate backup configurations. This activity may represent an attempt to steal sensitive configuration data or credentials stored in device backups.

    Next Steps:
    1. Verify if the backup operation was authorized and performed by legitimate administrators
    2. Check the source IP address for suspicious activity or unauthorized access patterns
    3. Review recent authentication logs for the device to identify the user who performed the backup
    4. Examine the timing of backup operations - operations outside business hours may be suspicious
    5. Validate that proper backup retention and security policies are in place
    6. Consider implementing additional access controls for backup operations
  where: |
    safe(lastEvent.log.topics, "") =~ ".*system.*" && 
    (safe(lastEvent.log.kvMessage, "") =~ ".*backup.*create.*" ||
     safe(lastEvent.log.kvMessage, "") =~ ".*backup.*download.*" ||
     safe(lastEvent.log.kvMessage, "") =~ ".*backup.*restore.*" ||
     safe(lastEvent.log.kvMessage, "") =~ ".*\\.backup.*") &&
    safe(origin.ip, "") != ""
  deduplicateBy:
    - adversary.ip
