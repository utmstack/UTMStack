- id: 1019
  dataTypes:
    - mikrotik_fw
  name: Bridge Security Issue Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Network Security
  technique: "T1599 - Network Boundary Bridging"
  adversary: origin
  references:
    - https://help.mikrotik.com/docs/spaces/ROS/pages/328353/Securing+your+router
    - https://attack.mitre.org/techniques/T1599/
  description: |
    Detects potential bridge security issues including MAC flooding, STP manipulation, or unauthorized bridge port activity that could indicate network segmentation bypass attempts or Layer 2 attacks against network infrastructure.
    
    Next Steps:
    1. Investigate the source MAC address and determine if it's a legitimate device
    2. Check bridge port configurations and verify authorized devices
    3. Review network topology for potential segmentation bypass
    4. Examine STP configuration and verify root bridge settings
    5. Monitor for additional bridge-related anomalies from the same source
    6. Consider implementing port security measures if unauthorized activity is confirmed
  where: |
    safe(log.topics, "") == "bridge" && 
    (safe(log.chain, "").contains("loop") ||
     safe(log.chain, "").contains("flood") ||
     safe(log.action, "") == "drop" ||
     safe(log.proto, "").contains("stp"))
  deduplicateBy:
    - origin.mac
    - log.chain
