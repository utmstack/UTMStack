- id: 1023
  dataTypes:
    - rfc-6587
  name: TCP Stream Reassembly Attack Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Network Security
  technique: Stream Fragmentation Attack
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1499/002/
    - https://datatracker.ietf.org/doc/html/rfc6587
    - https://www.ciscopress.com/articles/article.asp?p=24685&seqNum=4
  description: |
    Detects attacks targeting TCP stream reassembly mechanisms including overlapping segments, out-of-order fragments designed to evade IDS/IPS, and reassembly buffer exhaustion attempts.
    
    Next Steps:
    - Investigate the source IP address for other suspicious activities
    - Check if the source IP is known malicious in threat intelligence feeds
    - Review firewall/IDS logs for additional attack patterns from the same source
    - Examine destination port to identify targeted service
    - Consider blocking the source IP if attacks persist
    - Analyze packet captures to understand the specific evasion technique being used
    - Check system performance metrics for signs of resource exhaustion
  where: |
    (safe(log.tcp_overlap_conflict, false) == true &&
     safe(log.tcp_overlap_bytes, 0) > 100) ||
    (safe(log.tcp_out_of_order_count, 0) > 20 &&
     safe(log.tcp_segment_size, 0) < 100) ||
    (safe(log.tcp_reassembly_gap, false) == true &&
     safe(log.tcp_reassembly_gap_size, 0) > 1000) ||
    (safe(log.tcp_fragment_overlap, false) == true &&
     safe(log.tcp_fragment_count, 0) > 50) &&
    has(origin.ip) && safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: target.port.keyword
          operator: filter_term
          value: '{{target.port}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - target.ip
    - target.port
