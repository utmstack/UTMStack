- id: 1008
  dataTypes:
    - rfc-6587
  name: TCP Window Size Attack Detection
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: Network Security
  technique: "T1498.001 - Network Denial of Service: Direct Network Flood"
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc793#section-3.2
    - https://attack.mitre.org/techniques/T1498/001/
  description: |
    Detects TCP window size manipulation attacks including zero window probes, window scaling attacks, and Silly Window Syndrome that can lead to performance degradation or denial of service. These attacks exploit TCP flow control mechanisms to disrupt normal network communication.
    
    Next Steps:
    1. Investigate the source IP for additional suspicious network activity
    2. Check target services for performance degradation or service disruption
    3. Analyze packet captures to confirm attack patterns and methodology
    4. Review firewall logs for blocking recommendations
    5. Consider rate limiting or blocking the source IP if confirmed malicious
    6. Document the attack vector and update network security policies
  where: |
    (safe(log.tcp_window_size, -1) == 0 && 
     safe(log.tcp_flags, "") !~ "SYN|FIN|RST") ||
    (safe(log.tcp_window_scale, 0) > 14) ||
    (safe(log.tcp_window_size, 0) > 0 && safe(log.tcp_window_size, 0) < 100 &&
     safe(log.tcp_segment_len, 0) > 0) &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: target.port.keyword
          operator: filter_term
          value: '{{target.port}}'
      within: now-15m
      count: 20
  deduplicateBy:
    - origin.ip
    - target.port
