- id: 1022
  dataTypes:
    - rfc-6587
  name: TCP Connection Hijacking Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Security
  technique: "T1563.001 - Remote Service Session Hijacking: SSH Hijacking"
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc6587
    - https://attack.mitre.org/techniques/T1563/001/
  description: |
    Detects potential TCP connection hijacking attempts through sequence number prediction, unexpected RST packets, or mid-stream IP address changes that could indicate session takeover.
    
    Next Steps:
    1. Immediately isolate the affected systems to prevent further compromise
    2. Review network traffic logs for the source IP to identify scope of attack
    3. Check for any unauthorized access or data exfiltration from affected sessions
    4. Analyze packet captures to confirm sequence number anomalies
    5. Review authentication logs for any suspicious activity around the same timeframe
    6. Update firewall rules to block the attacker's IP address
    7. Consider implementing TCP sequence number randomization if not already enabled
    8. Document all findings for incident response and potential law enforcement involvement
  where: |
    (safe(log.tcp_seq_anomaly, false) == true &&
     safe(log.tcp_flags, "") =~ "PSH|ACK") ||
    (safe(log.tcp_unexpected_rst, false) == true &&
     safe(log.tcp_established_conn, false) == true) ||
    (safe(log.tcp_mid_stream_syn, false) == true) ||
    (safe(log.tcp_seq_jump, 0) > 1000000 &&
     safe(log.tcp_flags, "") !~ "SYN") &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: log.tcp_stream.keyword
          operator: filter_term
          value: '{{log.tcp_stream}}'
      within: now-10m
      count: 5
  deduplicateBy:
    - adversary.ip
    - target.ip
    - lastEvent.log.tcp_stream
