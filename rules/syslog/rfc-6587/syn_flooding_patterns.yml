- id: 1012
  dataTypes:
    - rfc-6587
  name: SYN Flooding Attack Pattern
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Network Attack
  technique: Resource Exhaustion
  adversary: origin
  references:
    - https://www.cloudflare.com/learning/ddos/syn-flood-ddos-attack/
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects SYN flood attack patterns where an attacker sends high volumes of SYN packets to overwhelm the target server and exhaust resources by creating half-open connections. This rule monitors for suspicious patterns in syslog messages that indicate potential SYN flooding activity.
    
    Next Steps:
    - Investigate the source IP address (origin.ip) for reputation and geolocation
    - Check if the source IP is spoofed or part of a botnet
    - Review firewall logs for additional connection attempts from the same source
    - Analyze network traffic patterns for the affected destination port
    - Consider implementing rate limiting or SYN cookies on the affected service
    - Block the source IP at the firewall level if confirmed malicious
    - Monitor for similar attacks from different source IPs
    - Document the incident and update security policies as needed
  where: |
    (safe(log.message, "").contains("SYN") && safe(log.message, "").contains("flood")) ||
    (safe(log.protocol, "") == "TCP" && 
     safe(log.action, "").contains("drop") && 
     safe(log.message, "").contains("rate limit"))
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.protocol.keyword
          operator: filter_term
          value: TCP
      within: now-1m
      count: 50
  deduplicateBy:
    - origin.ip
    - target.port
