- id: 1003
  dataTypes:
    - syslog
  name: RFC-6587 Message Delimiter Injection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Injection Attack
  technique: Log Injection
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc6587#section-3.4
    - https://attack.mitre.org/techniques/T1027/
    - https://owasp.org/www-community/attacks/Log_Injection
  description: |
    Detects attempts to inject message delimiters (LF characters or octet count sequences) within syslog messages to manipulate message boundaries and potentially hide malicious activity or corrupt log parsing.
    
    Next Steps:
    1. Review the source IP address and determine if it's an authorized syslog sender
    2. Examine the raw log message content for signs of delimiter injection patterns
    3. Check if the syslog server configuration properly validates message boundaries
    4. Look for other suspicious activities from the same source IP in recent logs
    5. Consider implementing stricter input validation on the syslog receiver
    6. If confirmed malicious, block the source IP and investigate potential log tampering
  where: |
    safe(log.transport, "") == "tcp" &&
    (
      (safe(log.message, "").contains("\n") && safe(log.framing, "") == "octet-counting") ||
      safe(log.embedded_delimiter, false) == true ||
      safe(log.message, "").matches(".*\\d+\\s<\\d+>.*") ||
      safe(log.delimiter_count, 0) > 1
    )
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.app_name.keyword
          operator: filter_term
          value: '{{log.app_name}}'
      within: now-1h
      count: 3
  deduplicateBy:
    - adversary.ip
    - lastEvent.log.app_name
