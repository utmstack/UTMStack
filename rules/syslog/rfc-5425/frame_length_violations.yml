- id: 1006
  dataTypes:
    - rfc-5425
  name: RFC-5425 Frame Length Violations
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Protocol Violations
  technique: Message Framing Attack
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5425#section-4.3
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects violations in RFC-5425 syslog frame length that could indicate message tampering, buffer overflow attempts, or protocol exploitation. Frame length violations may cause message truncation or parsing errors and can be indicative of attempts to bypass syslog parsing mechanisms or cause denial of service.
    
    Next Steps:
    1. Examine the source IP for patterns of malicious activity
    2. Check if frame length violations correlate with other protocol anomalies
    3. Review syslog receiver logs for parsing errors or crashes
    4. Validate legitimate syslog sources are properly configured
    5. Consider implementing rate limiting for sources generating frame violations
    6. Analyze message content for signs of injection attacks or malformed data
  where: |
    safe(log.protocol, "") == "rfc-5425" && (
      safe(log.frame_length, 0) > 8192 ||
      safe(log.frame_length, 0) < 1 ||
      safe(log.actual_length, 0) != safe(log.frame_length, 0) ||
      (safe(log.frame_length, 0) > 2048 && safe(log.strict_mode, false) == true)
    )
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - target.ip
