- id: 1022
  dataTypes:
    - rfc-5425
  name: RFC-5425 TLS Alert Protocol Abuse
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: TLS Security
  technique: Alert Protocol Manipulation
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5425
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects suspicious patterns in TLS alert messages that may indicate protocol abuse, DoS attempts, or exploitation attempts in RFC-5425 syslog communications. This rule identifies fatal TLS alerts, excessive alert counts, specific suspicious alert codes, and known malicious alert descriptions that could indicate an attack against the secure syslog infrastructure.
    
    Next Steps:
    1. Investigate the source IP address generating the TLS alerts
    2. Review TLS handshake logs for the affected connection
    3. Check if the alerts are part of a coordinated attack pattern
    4. Verify the legitimacy of the syslog client attempting to connect
    5. Examine network traffic for signs of protocol manipulation or DoS attempts
    6. Review TLS certificate validity and configuration
    7. Consider temporarily blocking the source IP if malicious activity is confirmed
    8. Update TLS configuration if protocol vulnerabilities are discovered
  where: (safe(log.tls_alert_level, "") == "fatal" || safe(log.tls_alert_count, 0) > 10 || safe(log.tls_alert_code, 0) in [10, 21, 22, 50, 51, 60, 70, 71, 80, 86, 90, 100, 110, 111, 112, 113, 114, 115] || safe(log.message, "") =~ ".*unexpected.*alert.*" || safe(log.tls_alert_description, "") in ["unexpected_message", "decompression_failure", "decrypt_error", "export_restriction", "protocol_version", "insufficient_security", "internal_error", "decode_error", "unsupported_extension", "certificate_unobtainable", "unrecognized_name", "bad_certificate_status_response", "bad_certificate_hash_value"]) && safe(log.protocol, "") == "syslog-tls"
  afterEvents:
    - indexPattern: v11-log-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.tls_alert_level.keyword
          operator: filter_term
          value: fatal
      within: now-10m
      count: 5
  deduplicateBy:
    - adversary.ip
    - lastEvent.log.tls_alert_code
