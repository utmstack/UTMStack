- id: 1016
  dataTypes:
    - rfc-5425
  name: SNI Spoofing Attempts Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Security
  technique: Server Name Indication Spoofing
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5425
    - https://attack.mitre.org/techniques/T1090/
  description: |
    Detects potential SNI (Server Name Indication) spoofing attempts where the SNI field does not match the certificate common name or where multiple different SNI values are used from the same source in a short time period. This technique is commonly used in man-in-the-middle attacks and SSL/TLS interception to bypass security controls.
    
    Next Steps:
    - Investigate the source IP address for other suspicious network activity
    - Verify the legitimacy of the TLS certificates involved
    - Check if the destination servers are legitimate or potentially compromised
    - Review network traffic patterns from the source IP for additional indicators of compromise
    - Consider blocking the source IP if malicious activity is confirmed
  where: |
    safe(log.tls_sni, "") != "" && 
    safe(log.tls_cert_cn, "") != "" && 
    safe(log.tls_sni, "") != safe(log.tls_cert_cn, "") &&
    !safe(log.tls_cert_san, "").contains(safe(log.tls_sni, ""))
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.tls_sni.keyword
          operator: must_not_term
          value: '{{log.tls_sni}}'
      within: now-5m
      count: 3
  deduplicateBy:
    - origin.ip
    - log.tls_sni
