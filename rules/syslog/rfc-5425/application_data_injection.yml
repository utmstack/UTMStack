- id: 1024
  dataTypes:
    - rfc-5425
  name: RFC-5425 Application Data Injection Attack
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: TLS Security
  technique: Data Injection
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5425
    - https://attack.mitre.org/techniques/T1055/
  description: |
    Detects potential application data injection attacks in TLS-secured syslog communications, including plaintext injection and message manipulation attempts. This rule identifies suspicious syslog frames with anomalous lengths, unencrypted application data, control characters in messages, and other indicators of injection attacks.
    
    Next Steps:
    1. Investigate the source IP address for other suspicious activities
    2. Review TLS certificate chain and encryption status for the connection
    3. Examine the content of the syslog messages for malicious payloads
    4. Check for additional injection attempts from the same source
    5. Verify syslog server configuration and security controls
    6. Analyze network traffic patterns for signs of ongoing attacks
  where: (safe(log.syslog_frame_length, 0) > 8192 || safe(log.syslog_msg_length, 0) != safe(log.actual_msg_length, 0) || safe(log.message, "") =~ ".*[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F].*" || safe(log.tls_content_type, "") == "application_data" && safe(log.tls_encrypted, false) == false || safe(log.syslog_frame_error, "") =~ ".*length.*mismatch.*" || safe(log.message, "") =~ ".*injection.*detect.*" || safe(log.syslog_msg, "") =~ ".*<script.*>.*</script>.*" || safe(log.structured_data, "") =~ ".*[\\x00-\\x1F\\x7F].*" || safe(log.tls_error, "") =~ ".*plaintext.*inject.*" || safe(log.syslog_priority, 0) > 191) && safe(log.protocol, "") == "syslog-tls"
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.syslog_frame_length
          operator: filter_term
          value: '>8192'
      within: now-5m
      count: 5
  deduplicateBy:
    - origin.ip
