- id: 1004
  dataTypes:
    - rfc-5425
  name: TLS Session Resumption Attack Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Network Security
  technique: Session Hijacking
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5425
    - https://attack.mitre.org/techniques/T1563/
  description: |
    Detects potential TLS session resumption attacks in RFC-5425 syslog connections where attackers attempt to reuse or hijack existing TLS sessions. This rule identifies suspicious session resumption failures, mismatched session IDs, expired tickets, and other anomalies that may indicate an active session hijacking attempt.
    
    Next Steps:
    1. Investigate the source IP address for any known malicious activity or unusual geographic location
    2. Review TLS certificate validity and check for certificate-based attacks
    3. Examine network logs for any unusual connection patterns or traffic volume from the source
    4. Verify the legitimacy of the syslog client attempting session resumption
    5. Check for concurrent sessions from the same source that might indicate session cloning
    6. Review firewall and IDS logs for additional suspicious network activity
    7. Consider temporarily blocking the source IP if attack indicators are confirmed
    8. Update TLS configuration to enforce stronger session management policies
  where: (safe(log.message, "") contains "session resumption failed" || safe(log.message, "") contains "session id mismatch" || safe(log.message, "") contains "session ticket expired" || safe(log.message, "") contains "session cache" || safe(log.message, "") contains "resumption handshake failed" || safe(log.message, "") contains "session not found" || safe(log.message, "") contains "invalid session ticket" || safe(log.message, "") contains "session reuse") && safe(log.severity, 10) <= 4 && (safe(log.structured_data, "") contains "tls" || safe(log.app_name, "") contains "syslog")
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.hostname.keyword
          operator: filter_term
          value: '{{safe(log.hostname, "")}}'
      within: now-30m
      count: 10
  deduplicateBy:
    - origin.ip
    - lastEvent.host
