- id: 1021
  dataTypes:
  - rfc-5425
  name: RFC-5425 TLS Record Layer Attack Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: TLS Security
  technique: "T1573 - Encrypted Channel"
  adversary: origin
  references:
  - https://datatracker.ietf.org/doc/html/rfc5425
  - https://attack.mitre.org/techniques/T1573/
  description: |
    Detects potential attacks against the TLS record layer in RFC-5425 syslog communications, including MAC verification failures, record size violations, and encryption anomalies. These attacks may indicate attempts to compromise secure syslog transmission or intercept sensitive log data.

    Next Steps:
    1. Verify the source IP and destination of the TLS connection
    2. Check for other TLS-related errors from the same source
    3. Review firewall and network logs for suspicious activity
    4. Validate TLS certificate chain and configuration
    5. Consider implementing additional network monitoring
    6. If confirmed malicious, block the source IP and investigate potential data compromise
  where: |
    (safe(log.tls_alert_code, 0) == 20 ||
     safe(log.tls_alert_description, "") == "bad_record_mac" ||
     safe(log.tls_error, "") =~ ".*record.*mac.*fail.*" ||
     safe(log.tls_record_size, 0) > 16384 ||
     safe(log.message, "") =~ ".*TLSCiphertext.*length.*exceed.*" ||
     safe(log.tls_record_type, "") == "invalid" ||
     safe(log.tls_error, "") =~ ".*decrypt.*error.*record.*") &&
    safe(log.protocol, "") == "syslog-tls"
  afterEvents:
  - indexPattern: v11-log-syslog-*
    with:
    - field: origin.ip.keyword
      operator: filter_term
      value: '{{origin.ip}}'
    - field: log.protocol.keyword
      operator: filter_term
      value: syslog-tls
    within: now-5m
    count: 3
  deduplicateBy:
  - origin.ip
  - target.ip
