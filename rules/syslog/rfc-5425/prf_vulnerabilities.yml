- id: 1020
  dataTypes:
    - rfc-5425
  name: PRF Vulnerability Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Cryptographic Attack
  technique: Pseudo-Random Function Attack
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5246
    - https://attack.mitre.org/techniques/T1040/
  description: |
    Detects potential vulnerabilities in the Pseudo-Random Function (PRF) implementation including weak PRF algorithms, PRF computation errors, or attempts to exploit known PRF weaknesses. This rule identifies TLS connections using deprecated MD5-based PRF algorithms, PRF computation errors, missing extended master secret extensions, and key derivation failures that could indicate cryptographic attacks or implementation weaknesses.
    
    Next Steps:
    1. Investigate the source IP address for additional suspicious TLS/SSL activity
    2. Review TLS/SSL configuration on affected systems to ensure strong cryptographic algorithms
    3. Check for signs of man-in-the-middle attacks or downgrade attempts
    4. Verify certificate validity and ensure proper PKI implementation
    5. Update TLS implementations to use modern, secure PRF algorithms (SHA-256 or better)
    6. Enable extended master secret extension support where possible
    7. Monitor for patterns of cryptographic protocol exploitation
  where: |
    safe(log.tls_prf_algorithm, "").contains("MD5") ||
    safe(log.tls_prf_error, "") != "" ||
    (safe(log.tls_version, "") == "TLS1.0" && 
     safe(log.tls_prf_algorithm, "") != "TLS_PRF_SHA256") ||
    safe(log.tls_master_secret_error, "") != "" ||
    safe(log.tls_key_derivation_error, "") != "" ||
    (safe(log.tls_extended_master_secret, "false") == "false" &&
     safe(log.tls_version, "").contains("TLS1.2"))
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.event_type.keyword
          operator: filter_term
          value: 'tls_error'
      within: now-30m
      count: 5
  deduplicateBy:
    - origin.ip
    - log.tls_prf_algorithm
