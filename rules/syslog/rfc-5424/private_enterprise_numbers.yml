- id: 1018
  dataTypes:
    - rfc-5424
  name: RFC-5424 Private Enterprise Number Abuse
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Identity Spoofing
  technique: Vendor Impersonation
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5424#section-7.2.2
    - https://www.iana.org/assignments/enterprise-numbers/enterprise-numbers
  description: |
    Detects suspicious use of Private Enterprise Numbers (PEN) in RFC-5424 structured data elements. This includes mismatched enterprise IDs, use of well-known vendor PENs by unexpected sources, invalid PEN formats, or attempts to impersonate legitimate vendors through enterprise number manipulation.
    
    Next Steps:
    1. Investigate the source device and verify its legitimacy
    2. Check if the enterprise ID matches the expected vendor for the device
    3. Review recent configuration changes on the logging device
    4. Validate the structured data format against RFC-5424 specifications
    5. Correlate with other authentication or configuration change events
    6. If confirmed malicious, block the source IP and review all logs from this source
    7. Contact the vendor if legitimate enterprise numbers are being misused
  where: |
    safe(log.structured_data, "") != "" && safe(log.structured_data, "") != "-" && (
      (safe(log.sd_id, "") matches "@[0-9]+" && safe(log.enterpriseId, "") != "" && 
       safe(log.enterpriseId, "") != safe(substring(safe(log.sd_id, ""), indexOf(safe(log.sd_id, ""), "@") + 1), "")) ||
      (safe(log.sd_id, "") matches "@(9|11|25|311|674|1213|2620|2636|8072|25623|32473|41514)" && 
       safe(log.device_vendor, "") !in ["Cisco", "HP", "Palo Alto", "Juniper", "Microsoft", "VMware", "Fortinet"]) ||
      (safe(log.sd_id, "") matches "@0+[1-9]") ||
      (safe(log.sd_id, "") matches "@[0-9]{8,}") ||
      (safe(log.enterpriseId, "") matches "^0+$") ||
      (safe(log.structured_data, "") matches "\\[[^@]+@[^0-9]")
    )
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.enterpriseId.keyword
          operator: filter_term
          value: '{{log.enterpriseId}}'
      within: now-2h
      count: 3
  deduplicateBy:
    - origin.ip
    - log.enterpriseId
