- id: 1001
  dataTypes:
    - rfc-5424
  name: RFC-5424 Structured Data Format Violations
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Protocol Violation
  technique: "T1565 - Data Manipulation"
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5424#section-6.3
    - https://attack.mitre.org/techniques/T1565/
  description: |
    Detects violations in RFC-5424 structured data format, which may indicate log tampering, parsing evasion attempts, or misconfigured systems. Structured data must follow specific syntax rules including proper SD-ELEMENT formatting with square brackets and no empty elements.
    
    Next Steps:
    1. Examine the source system generating malformed structured data
    2. Check for signs of log tampering or injection attempts
    3. Verify system configuration and log parsing rules
    4. Review recent changes to logging infrastructure
    5. Correlate with other suspicious activities from the same source
  where: |
    safe(log.structuredData, "") != "" && 
    safe(log.structuredData, "") != "-" &&
    (!safe(log.structuredData, "").startsWith("[") || 
     !safe(log.structuredData, "").endsWith("]") ||
     safe(log.structuredData, "").contains("[]") ||
     !safe(log.structuredData, "").matches("^(\\[[^\\]]+\\])+$"))
  deduplicateBy:
    - origin.ip
    - origin.host
