- id: 1022
  dataTypes:
    - rfc-5424
  name: Syslog Sequence ID Gap Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Message Loss Detection
  technique: "T1070.002 - Clear Linux or Mac System Logs"
  adversary: origin
  references:
    - https://datatracker.ietf.org/doc/html/rfc5424#section-7.3.1
    - https://datatracker.ietf.org/doc/html/rfc5848#section-4.2.2
    - https://attack.mitre.org/techniques/T1070/002/
  description: |
    Detects gaps in RFC-5424 syslog sequence IDs which may indicate message loss, deletion, or tampering. The sequenceId parameter must increment by 1 for each message from the same source. Gaps suggest either network issues, deliberate message deletion, or an attacker attempting to hide their activities.
    
    Next Steps:
    1. Investigate the source system (hostname/IP) for any network connectivity issues or system problems
    2. Check if there are any maintenance windows or scheduled downtime that could explain the gap
    3. Review system logs on the source device for any evidence of log tampering or deletion
    4. Examine the missing sequence numbers to determine the scope of potential data loss
    5. Correlate with other security events from the same source around the time of the gap
    6. Verify syslog daemon configuration and storage capacity on the source system
    7. If tampering is suspected, perform forensic analysis of the source system
    8. Consider implementing additional log integrity monitoring mechanisms
  where: |
    safe(log.sequence_id, 0) > 0 &&
    safe(log.previous_sequence_id, 0) > 0 &&
    (safe(log.sequence_id, 0) - safe(log.previous_sequence_id, 0) > 1 ||
     (safe(log.sequence_id, 0) == 1 && safe(log.previous_sequence_id, 0) < 2147483647) ||
     safe(log.sequence_id, 0) < safe(log.previous_sequence_id, 0))
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.hostname.keyword
          operator: filter_term
          value: '{{log.hostname}}'
      within: now-1h
      count: 5
  deduplicateBy:
    - origin.ip
    - log.hostname
    - log.app_name
