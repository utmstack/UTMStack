- id: 1004
  dataTypes:
    - cef
  name: CEF Severity Mismatches
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Anomaly Detection
  technique: "T1070 - Indicator Removal on Host: Log Manipulation"
  adversary: origin
  references:
    - https://www.splunk.com/en_us/blog/learn/common-event-format-cef.html
    - https://attack.mitre.org/techniques/T1070/
  description: |
    Detects mismatches between CEF severity levels and event content, which could indicate log tampering, misconfiguration, or attempts to downgrade the importance of security events. This rule identifies cases where high-severity events are marked with low severity values, low-severity events marked with high severity, invalid severity ranges, or significant severity changes.
    
    Next Steps:
    1. Review the specific CEF event and verify the severity level matches the event content
    2. Check if there are patterns of severity mismatches from the same device or vendor
    3. Investigate potential log tampering or system misconfiguration
    4. Validate CEF device configuration and parsing rules
    5. Cross-reference with other security events from the same timeframe
    6. Consider implementing stricter CEF validation rules if systematic issues are found
    7. Document any legitimate reasons for severity mismatches for future reference
  where: |
    (safe(log.cef_severity, 0) <= 3 && 
     (contains(safe(log.cef_name, ""), "attack") || contains(safe(log.cef_name, ""), "breach") || 
      contains(safe(log.cef_name, ""), "critical") || contains(safe(log.cef_name, ""), "exploit") || 
      contains(safe(log.cef_name, ""), "malware") || contains(safe(log.cef_name, ""), "ransomware") ||
      contains(safe(log.cef_extensions, ""), "attack") || contains(safe(log.cef_extensions, ""), "exploit") || 
      contains(safe(log.cef_extensions, ""), "malware"))) ||
    (safe(log.cef_severity, 0) >= 8 && 
     (contains(safe(log.cef_name, ""), "info") || contains(safe(log.cef_name, ""), "debug") || 
      contains(safe(log.cef_name, ""), "test") || contains(safe(log.cef_name, ""), "heartbeat") || 
      contains(safe(log.cef_name, ""), "keepalive") ||
      startsWith(safe(log.cef_device_event_class_id, ""), "info"))) ||
    (safe(log.cef_severity, -1) < 0 || safe(log.cef_severity, -1) > 10) ||
    (safe(log.previous_severity, -1) != -1 && 
     ((safe(log.cef_severity, 0) - safe(log.previous_severity, 0)) > 5 || 
      (safe(log.previous_severity, 0) - safe(log.cef_severity, 0)) > 5))
  afterEvents:
    - indexPattern: v11-log-syslog-*
      with:
        - field: log.cef_device_vendor.keyword
          operator: filter_term
          value: '{{log.cef_device_vendor}}'
        - field: log.cef_device_product.keyword
          operator: filter_term
          value: '{{log.cef_device_product}}'
      within: now-2h
      count: 20
  deduplicateBy:
    - lastEvent.log.cef_device_vendor
    - lastEvent.log.cef_device_product
    - lastEvent.log.cef_device_event_class_id
