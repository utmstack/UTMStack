- id: 1024
  dataTypes:
    - cef
  name: CEF Message Truncation Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Log Integrity
  technique: "T1070.001 - Indicator Removal: Clear Windows Event Logs"
  adversary: system
  references:
    - https://attack.mitre.org/techniques/T1070/001/
    - https://www.elastic.co/guide/en/integrations/current/cef.html
  description: |
    Detects truncated CEF messages that may indicate log tampering, transmission errors, or attempts to hide malicious activity by truncating log entries. Monitors for incomplete CEF headers or extensions.
    
    Next Steps:
    1. Investigate the source system generating truncated CEF messages
    2. Check network connectivity and log transmission mechanisms between the source and collector
    3. Review system resources (disk space, memory) on the logging infrastructure
    4. Examine if truncation patterns correlate with specific timeframes or security events
    5. Validate CEF message formatting and parsing configuration
    6. Check for potential log tampering or evasion attempts
    7. Review recent system changes or updates that might affect log generation
  where: |
    safe(log.dataType, "") == "cef" &&
    (
      (safe(log.raw, "") != "" && !contains(safe(log.raw, ""), "|") && size(safe(log.raw, "")) > 0) ||
      (safe(log.raw, "") != "" && size(split(safe(log.raw, ""), "|")) < 7) ||
      (safe(log.message, "") != "" && endsWith(safe(log.message, ""), "...")) ||
      (safe(log.message, "") != "" && endsWith(safe(log.message, ""), "[truncated]")) ||
      (safe(log.message, "") != "" && contains(safe(log.message, ""), "message too long")) ||
      (safe(log.deviceVendor, "") == "" && safe(log.deviceProduct, "") == "") ||
      (safe(log.raw, "") != "" && size(safe(log.raw, "")) == 1024) ||
      (safe(log.raw, "") != "" && size(safe(log.raw, "")) == 2048) ||
      (safe(log.raw, "") != "" && size(safe(log.raw, "")) == 4096) ||
      (safe(log.extension, "") != "" && !contains(safe(log.extension, ""), "="))
    )
  deduplicateBy:
    - lastEvent.origin.host
    - lastEvent.log.deviceProduct
