- id: 1021
  dataTypes:
    - cef
  name: CEF File Hash Mismatch Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: File Integrity
  technique: "T1565.001 - Data Manipulation: Stored Data Manipulation"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1565/001/
    - https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-8.4/pdfdoc/cef-implementation-standard/cef-implementation-standard.pdf
  description: |
    Detects file hash mismatches in CEF logs which may indicate file tampering, malware infection, or unauthorized modifications to critical files. This rule monitors custom string fields (cs1-cs6) for hash values and their labels, as well as dedicated hash fields to identify discrepancies.

    **Next Steps:**
    1. Verify the affected file integrity by recalculating its hash
    2. Check if the file modification was authorized and documented
    3. Investigate the source and timing of the file change
    4. Review system logs for unauthorized access or malware activity
    5. Compare with known good file versions or backups
    6. If malicious activity is confirmed, isolate the affected system and initiate incident response procedures
  where: |
    safe(log.dataType, "") == "cef" && 
    (
      (safe(log.cs1Label, "") in ["hash", "fileHash", "md5", "sha1", "sha256"] && safe(log.cs1, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.cs2Label, "") in ["hash", "fileHash", "md5", "sha1", "sha256"] && safe(log.cs2, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.cs3Label, "") in ["hash", "fileHash", "md5", "sha1", "sha256"] && safe(log.cs3, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.cs4Label, "") in ["hash", "fileHash", "md5", "sha1", "sha256"] && safe(log.cs4, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.cs5Label, "") in ["hash", "fileHash", "md5", "sha1", "sha256"] && safe(log.cs5, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.cs6Label, "") in ["hash", "fileHash", "md5", "sha1", "sha256"] && safe(log.cs6, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.fileHash, "") != "" && contains(safe(log.message, ""), "mismatch")) ||
      (safe(log.oldFileHash, "") != "" && safe(log.fileHash, "") != "" && safe(log.oldFileHash, "") != safe(log.fileHash, "")) ||
      contains(safe(log.message, ""), "hash mismatch") ||
      contains(safe(log.message, ""), "checksum failure") ||
      contains(safe(log.message, ""), "integrity violation")
    )
  deduplicateBy:
    - adversary.host
    - lastEvent.log.fname
