- id: 1013
  dataTypes:
    - cef
  name: CEF Delimiter Escaping Failures
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Data Integrity
  technique: "T1070.003 - Indicator Removal on Host: Clear Command History"
  adversary: origin
  references:
    - https://www.microfocus.com/documentation/arcsight/arcsight-smartconnectors-8.3/cef-implementation-standard/Content/CEF/Chapter%201%20What%20is%20CEF.htm
    - https://attack.mitre.org/techniques/T1070/003/
  description: |
    Detects improper escaping of pipe delimiters in CEF (Common Event Format) messages which can lead to field injection, log parsing errors, or attempts to manipulate log analysis. CEF format requires pipe characters (|) to be escaped with backslashes (\\|) when they appear in field values. Unescaped pipes can cause parsing confusion, field boundary corruption, and potential log injection attacks.
    
    **Next Steps:**
    1. Review the source system generating malformed CEF messages
    2. Check if this represents a legitimate configuration issue or potential attack attempt
    3. Examine the raw log message for signs of intentional manipulation
    4. Verify CEF parser configuration and update if necessary
    5. Monitor for additional malformed messages from the same source
    6. Consider implementing stricter input validation on log sources
    7. Review access controls for systems generating CEF logs
  where: |
    (
      (safe(log.deviceVendor, "").contains("|") && !safe(log.deviceVendor, "").contains("\\|")) ||
      (safe(log.deviceProduct, "").contains("|") && !safe(log.deviceProduct, "").contains("\\|")) ||
      (safe(log.deviceVersion, "").contains("|") && !safe(log.deviceVersion, "").contains("\\|")) ||
      (safe(log.name, "").contains("|") && !safe(log.name, "").contains("\\|")) ||
      (safe(log.message, "").matches(".*[^\\\\]\\|.*\\|.*\\|.*\\|.*\\|.*\\|.*\\|.*") && 
       !safe(log.message, "").startsWith("CEF:")) ||
      (safe(log.cs1, "").contains("|") && !safe(log.cs1, "").contains("\\|")) ||
      (safe(log.cs2, "").contains("|") && !safe(log.cs2, "").contains("\\|")) ||
      (safe(log.message, "").matches(".*=.*\\|.*=.*") && 
       safe(log.message, "").matches(".*[^\\\\]=.*\\|.*"))
    )
  deduplicateBy:
    - lastEvent.origin.ip
    - lastEvent.log.deviceVendor
    - lastEvent.log.deviceProduct
