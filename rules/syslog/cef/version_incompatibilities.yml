- id: 1025
  dataTypes:
    - cef
  name: CEF Version Incompatibility Detection
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: System Configuration
  technique: "T1562.006 - Impair Defenses: Indicator Blocking"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1562/006/
    - https://stackoverflow.com/questions/45450507/in-common-event-format-cef-how-is-the-field-version-used-in-a-real-life-applic
  description: |
    Detects CEF version incompatibilities or malformed CEF headers that may cause parsing errors, data loss, or indicate attempts to evade logging systems by using invalid CEF formats. This rule identifies CEF events with unsupported versions, malformed headers, invalid pipe separators, or missing required fields.
    
    Next Steps:
    1. Verify the CEF format specification compliance of the generating device
    2. Check if the device firmware/software is up to date
    3. Review log parsing configurations and update CEF parsers if needed
    4. Investigate if malformed CEF events are intentional evasion attempts
    5. Validate that critical security events are not being lost due to parsing failures
    6. Contact vendor support if the device is generating non-standard CEF formats
    7. Consider implementing backup parsing mechanisms for critical security devices
    8. Monitor for patterns of CEF format violations that might indicate compromise
  where: |
    safe(log.dataType, "") == "cef" &&
    (
      (safe(log.cefVersion, "") != "" && safe(log.cefVersion, "") != "0" && safe(log.cefVersion, "") != "1") ||
      (safe(log.raw, "") != "" && !startsWith(safe(log.raw, ""), "CEF:")) ||
      (safe(log.raw, "") != "" && contains(safe(log.raw, ""), "CEF:") && !startsWith(safe(log.raw, ""), "CEF:0") && !startsWith(safe(log.raw, ""), "CEF:1")) ||
      (safe(log.deviceVendor, "") != "" && contains(safe(log.deviceVendor, ""), "|")) ||
      (safe(log.deviceProduct, "") != "" && contains(safe(log.deviceProduct, ""), "|")) ||
      (safe(log.deviceVersion, "") != "" && contains(safe(log.deviceVersion, ""), "|")) ||
      (safe(log.severity, "") != "" && (int(safe(log.severity, "0")) < 0 || int(safe(log.severity, "0")) > 10)) ||
      (safe(log.raw, "") != "" && contains(safe(log.raw, ""), "||")) ||
      (safe(log.deviceEventClassId, "") == "" && safe(log.name, "") == "")
    )
  deduplicateBy:
    - origin.host
    - dataSource
