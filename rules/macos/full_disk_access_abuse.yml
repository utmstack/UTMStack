- id: 1023
  dataTypes:
    - macos
  name: Full Disk Access Abuse Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Privilege Escalation
  technique: "T1548.004 - Abuse Elevation Control Mechanism: Elevated Execution with Prompt"
  adversary: origin
  references:
    - https://www.huntress.com/blog/full-transparency-controlling-apples-tcc
    - https://attack.mitre.org/techniques/T1548/004/
  description: |
    Detects suspicious Full Disk Access (FDA) usage, including unexpected processes gaining FDA permissions or potential TCC database manipulation attempts. This rule identifies when applications request or are granted Full Disk Access privileges, which could indicate privilege escalation attempts or malicious software trying to bypass macOS security controls.
    
    Next Steps:
    1. Investigate the process that requested or was granted Full Disk Access permissions
    2. Verify if the application legitimately requires FDA access for its functionality
    3. Check if the TCC database has been tampered with or modified unexpectedly
    4. Review user activity around the time of the FDA request to identify potential social engineering
    5. Examine system logs for any unauthorized changes to privacy settings
    6. Validate the digital signature and source of the application requesting FDA access
  where: |
    (safe(log.subsystem, "") == "com.apple.TCC" && safe(log.eventMessage, "") contains "kTCCServiceSystemPolicyAllFiles") ||
    (safe(log.process, "") == "tccd" && safe(log.eventMessage, "") contains "SystemPolicyAllFiles") ||
    (safe(log.eventMessage, "") contains "Full Disk Access" && (safe(log.eventMessage, "") contains "granted" || safe(log.eventMessage, "") contains "allowed")) ||
    (safe(log.eventMessage, "") contains "TCC.db" && (safe(log.eventMessage, "") contains "modified" || safe(log.eventMessage, "") contains "accessed")) ||
    (safe(log.eventMessage, "") contains "com.apple.TCC" && safe(log.eventMessage, "") contains "write")
  deduplicateBy:
    - lastEvent.log.process
    - origin.user
