- id: 1014
  dataTypes:
    - macos
  name: Safari Extension Abuse
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Persistence
  technique: "T1176 - Browser Extensions"
  adversary: origin
  references:
    - https://developer.apple.com/documentation/safariservices/safari_app_extensions
    - https://attack.mitre.org/techniques/T1176/
  description: |
    Detects suspicious Safari extension installations or modifications that could be used for credential theft, session hijacking, or data exfiltration. This rule monitors Safari extension-related activities including installations, loading, enabling, and potential security violations.

    Next Steps:
    1. Identify the specific Safari extension involved in the alert
    2. Review the extension's permissions and capabilities
    3. Check if the extension was installed from Apple's official Safari Extensions Gallery
    4. Examine the extension's code signature and developer certificate
    5. Review the user's browsing history and recent downloads
    6. Check for any unauthorized modifications to Safari's extension directory
    7. Verify if the extension has network communication capabilities
    8. Review any recent changes to Safari's security settings
    9. Consider temporarily disabling the extension while investigating
    10. Monitor for additional suspicious browser behavior or network traffic
  where: |
    (safe(log.subsystem, "") == "com.apple.Safari" && 
     safe(log.category, "") == "Extensions" &&
     (safe(log.eventMessage, "") contains "install" || 
      safe(log.eventMessage, "") contains "load" || 
      safe(log.eventMessage, "") contains "enable")) ||
    (safe(log.process, "") == "Safari" && 
     (safe(log.eventMessage, "") contains "extension" &&
      (safe(log.eventMessage, "") contains "unsigned" ||
       safe(log.eventMessage, "") contains "untrusted" ||
       safe(log.eventMessage, "") contains "modified" ||
       safe(log.eventMessage, "") contains "injected"))) ||
    (safe(log.eventMessage, "") contains "Safari/Extensions" && 
     (safe(log.eventMessage, "") contains "unauthorized" ||
      safe(log.eventMessage, "") contains "suspicious" ||
      safe(log.eventMessage, "") contains "malicious")) ||
    (safe(log.subsystem, "") == "com.apple.WebKit" && 
     safe(log.eventMessage, "") contains "extension" &&
     safe(log.messageType, "") == "error")
  afterEvents:
    - indexPattern: v11-log-macos-*
      with:
        - field: origin.user.keyword
          operator: filter_term
          value: '{{origin.user}}'
      within: now-24h
      count: 2
  deduplicateBy:
    - origin.user
    - origin.host
