- id: 1022
  dataTypes:
    - macos
  name: Contacts and Calendar Access Violations
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Privacy Violation
  technique: "T1005 - Data from Local System"
  adversary: origin
  references:
    - https://www.rainforestqa.com/blog/macos-tcc-db-deep-dive
    - https://attack.mitre.org/techniques/T1005/
  description: |
    Detects unauthorized or suspicious access attempts to contacts and calendar data, including repeated permission requests that may indicate data harvesting attempts.
    
    Next Steps:
    1. Investigate the application or process requesting access to contacts/calendar data
    2. Verify if the access request is legitimate for the application's functionality
    3. Check the TCC (Transparency, Consent, and Control) database for unauthorized permissions
    4. Review user behavior and determine if the user knowingly granted permissions
    5. Examine system logs for additional privacy violations or suspicious activities
    6. Consider revoking unauthorized permissions through System Preferences > Security & Privacy
    7. If malicious activity is confirmed, isolate the affected system and perform malware analysis
    8. Review other applications with similar privacy permissions for potential compromise
  where: |
    (safe(log.subsystem, "") == "com.apple.TCC" && (safe(log.eventMessage, "") contains "AddressBook" || safe(log.eventMessage, "") contains "Calendar")) ||
    (safe(log.process, "") == "tccd" && (safe(log.eventMessage, "") contains "kTCCServiceAddressBook" || safe(log.eventMessage, "") contains "kTCCServiceCalendar")) ||
    (safe(log.eventMessage, "") contains "ContactsAgent" && safe(log.eventMessage, "") contains "denied") ||
    (safe(log.eventMessage, "") contains "CalendarAgent" && safe(log.eventMessage, "") contains "unauthorized") ||
    (safe(log.eventMessage, "") contains "privacy" && (safe(log.eventMessage, "") contains "contacts" || safe(log.eventMessage, "") contains "calendar"))
  deduplicateBy:
    - origin.host
    - origin.user
