- id: 1009
  dataTypes:
    - macos
  name: Directory Service Modifications Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Persistence
  technique: "T1136.001 - Create Account: Local Account"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://developer.apple.com/documentation/os/logging
    - https://support.apple.com/guide/directory-utility/welcome/mac
  description: |
    Detects modifications to macOS Directory Services including user and group changes, authentication modifications, and potential privilege escalation through directory service manipulation. This rule monitors for suspicious activities involving directory service processes that could indicate account creation, modification, or privilege escalation attempts.

    Next Steps:
    1. Verify the legitimacy of the directory service modifications by checking with system administrators
    2. Investigate the user account and process that initiated the directory service changes
    3. Review system logs for any related authentication events or privilege escalation attempts
    4. Check for any unauthorized user accounts or group memberships that may have been created
    5. Examine the timing and frequency of directory service modifications for patterns of abuse
    6. Correlate with other security events such as login attempts or file access patterns
    7. If unauthorized, disable affected accounts immediately and reset passwords for compromised accounts
  where: |
    (safe(log.process, "") in ["DirectoryService", "opendirectoryd", "dscl", "dseditgroup", "dsimport"] ||
     safe(log.subsystem, "") == "com.apple.opendirectoryd" ||
     safe(log.subsystem, "") == "com.apple.DirectoryServices") &&
    (safe(log.eventMessage, "") contains "create" ||
     safe(log.eventMessage, "") contains "modify" ||
     safe(log.eventMessage, "") contains "delete" ||
     safe(log.eventMessage, "") contains "passwd" ||
     safe(log.eventMessage, "") contains "group" ||
     safe(log.eventMessage, "") contains "admin" ||
     safe(log.eventMessage, "") contains "sudoers" ||
     safe(log.eventMessage, "") contains "AuthenticationAuthority" ||
     safe(log.eventMessage, "") contains "GeneratedUID") &&
    safe(log.messageType, "") != "debug"
  deduplicateBy:
    - origin.host
    - origin.user
