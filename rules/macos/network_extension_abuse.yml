- id: 1027
  dataTypes:
    - macos
  name: Suspicious Network Extension Activity
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Collection
  technique: "T1185 - Man in the Browser"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1185/
    - https://developer.apple.com/documentation/networkextension
  description: |
    Detects potentially malicious network extension activities that could be used for traffic interception, data exfiltration, or man-in-the-middle attacks. Network extensions in macOS can be abused by malware to intercept network traffic, modify DNS responses, or establish unauthorized proxy connections.
    
    Next Steps:
    1. Identify the specific network extension causing the alerts
    2. Verify if the extension is legitimate and properly signed
    3. Check for unusual network traffic patterns from the affected system
    4. Review installed applications and their network extension components
    5. Examine system logs for related authentication or authorization failures
    6. Consider removing unauthorized or suspicious network extensions
    7. Monitor for data exfiltration attempts or unauthorized network connections
  where: |
    (safe(log.subsystem, "") == "com.apple.networkextension" || 
     safe(log.process, "") contains "NEFilterProvider" ||
     safe(log.process, "") contains "NEAppProxyProvider") &&
    (safe(log.eventMessage, "") contains "content filter" ||
     safe(log.eventMessage, "") contains "packet tunnel" ||
     safe(log.eventMessage, "") contains "proxy provider" ||
     safe(log.eventMessage, "") contains "DNS proxy" ||
     safe(log.eventType, "") == "error" ||
     safe(log.eventMessage, "") contains "failed to validate" ||
     safe(log.eventMessage, "") contains "unauthorized extension")
  afterEvents:
    - indexPattern: v11-log-macos-*
      with:
        - field: origin.host.keyword
          operator: filter_term
          value: '{{origin.host}}'
        - field: log.subsystem.keyword
          operator: filter_term
          value: 'com.apple.networkextension'
      within: now-30m
      count: 5
  deduplicateBy:
    - origin.host
    - adversary.host
