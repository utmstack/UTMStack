- id: 1011
  dataTypes:
    - macos
  name: FileVault Tampering Attempts
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: System Integrity
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://support.apple.com/guide/mac-help/protect-data-on-your-mac-with-filevault-mh11785/mac
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects attempts to tamper with or disable FileVault encryption, which could indicate an attempt to bypass security controls or access encrypted data. This rule monitors FileVault subsystem logs and fdesetup process errors that may indicate unauthorized access attempts or configuration changes.

    **Next Steps:**
    1. Verify the legitimacy of the FileVault operation and the user account involved
    2. Check if this activity was part of authorized system maintenance
    3. Review system logs for any preceding suspicious activities from the same user
    4. Examine the specific error messages or events that triggered this alert
    5. Verify FileVault status and configuration integrity
    6. Consider temporarily disabling the affected user account if unauthorized activity is suspected
  where: |
    (safe(log.subsystem, "") == "com.apple.security.filevault" && 
     (safe(log.eventMessage, "") contains "disable" || 
      safe(log.eventMessage, "") contains "bypass" || 
      safe(log.eventMessage, "") contains "unlock" ||
      safe(log.eventMessage, "") contains "error" ||
      safe(log.eventMessage, "") contains "failed")) ||
    (safe(log.process, "") == "fdesetup" && 
     safe(log.messageType, "") == "error") ||
    (safe(log.eventMessage, "") contains "FileVault" && 
     (safe(log.eventMessage, "") contains "tampering" ||
      safe(log.eventMessage, "") contains "modification" ||
      safe(log.eventMessage, "") contains "unauthorized"))
  deduplicateBy:
    - origin.user
    - origin.host
