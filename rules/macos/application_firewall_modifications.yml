- id: 1026
  dataTypes:
    - macos
  name: Application Firewall Configuration Modified
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Defense Evasion
  technique: "T1562.004 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1562/004/
    - https://support.apple.com/guide/security/firewall-protection-secf6b7ccbd5/web
  description: |
    Detects modifications to the macOS Application Layer Firewall (ALF) configuration, which could indicate an attempt to disable security controls or allow malicious network connections. This rule monitors changes to firewall settings through the socketfilterfw utility or ALF subsystem events.
    
    Next Steps:
    - Verify if the firewall modification was authorized by checking with system administrators
    - Review the specific changes made to the firewall configuration
    - Check if the modification aligns with approved security policies
    - Investigate the user account and process that initiated the change
    - Review surrounding system activity for signs of compromise
    - Validate that legitimate business requirements justify the firewall changes
    - Consider rolling back unauthorized changes and implementing additional monitoring
  where: |
    (safe(lastEvent.log.process, "") == "socketfilterfw" || safe(lastEvent.log.subsystem, "") == "com.apple.alf") &&
    (safe(lastEvent.log.eventMessage, "") contains "setglobalstate" ||
     safe(lastEvent.log.eventMessage, "") contains "setloggingmode" ||
     safe(lastEvent.log.eventMessage, "") contains "allowsigned" ||
     safe(lastEvent.log.eventMessage, "") contains "firewall configuration changed" ||
     safe(lastEvent.log.eventMessage, "") contains "ALF settings modified")
  deduplicateBy:
    - lastEvent.origin.host
    - lastEvent.log.process
