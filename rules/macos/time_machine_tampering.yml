- id: 1012
  dataTypes:
    - macos
  name: Time Machine Tampering
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: Data Protection
  technique: "T1490 - Inhibit System Recovery"
  adversary: origin
  references:
    - https://support.apple.com/guide/mac-help/back-up-your-mac-with-time-machine-mh35860/mac
    - https://attack.mitre.org/techniques/T1490/
  description: |
    Detects attempts to tamper with Time Machine backups, which could indicate an attacker trying to prevent system recovery or destroy backup data. This includes deletion, corruption, disabling, or unauthorized modification of Time Machine backup processes and data.
    
    Next Steps:
    1. Verify the legitimacy of the Time Machine operation by checking if it was authorized by an administrator
    2. Examine the user account and process that initiated the Time Machine changes
    3. Check for signs of ransomware or malware that may be attempting to destroy backups
    4. Review system logs for additional suspicious activities around the same timeframe
    5. Verify Time Machine backup integrity and restore capabilities
    6. Consider isolating the affected system if ransomware activity is suspected
  where: |
    (safe(log.subsystem, "") == "com.apple.TimeMachine" && 
     (safe(log.eventMessage, "") contains "delete" || 
      safe(log.eventMessage, "") contains "corrupt" || 
      safe(log.eventMessage, "") contains "failed" ||
      safe(log.eventMessage, "") contains "error" ||
      safe(log.eventMessage, "") contains "exclude")) ||
    (safe(log.process, "") == "tmutil" && 
     (safe(log.eventMessage, "") contains "disable" ||
      safe(log.eventMessage, "") contains "delete" ||
      safe(log.eventMessage, "") contains "removedestination")) ||
    (safe(log.eventMessage, "") contains "Time Machine" && 
     (safe(log.eventMessage, "") contains "tampering" ||
      safe(log.eventMessage, "") contains "modification" ||
      safe(log.eventMessage, "") contains "unauthorized" ||
      safe(log.eventMessage, "") contains "backup deletion"))
  deduplicateBy:
    - adversary.host
    - lastEvent.log.process
