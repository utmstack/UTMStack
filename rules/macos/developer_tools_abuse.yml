- id: 1024
  dataTypes:
    - macos
  name: Developer Tools Security Policy Bypass
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Defense Evasion
  technique: "T1553.001 - Subvert Trust Controls: Gatekeeper Bypass"
  adversary: origin
  references:
    - https://www.sentinelone.com/labs/bypassing-macos-tcc-user-privacy-protections-by-accident-and-design/
    - https://attack.mitre.org/techniques/T1553/001/
  description: |
    Detects abuse of developer tools permissions to run unsigned code or bypass security policies, including suspicious use of kTCCServiceDeveloperTool permissions. This rule identifies when macOS security controls like Gatekeeper are being bypassed or when unsigned code is being executed through developer tool privileges.

    Next Steps:
    1. Identify the user account and process that triggered the developer tools bypass
    2. Verify if the user has legitimate developer tool access requirements
    3. Check if any unsigned applications were recently executed on the system
    4. Review System Preferences > Security & Privacy > Privacy tab for recent developer tool permissions
    5. Examine the process tree to understand what application requested these permissions
    6. If unauthorized, revoke developer tool permissions and investigate for potential malware
    7. Review other security policy changes or bypasses on the same system
    8. Check for any recently installed applications that might have requested these permissions
  where: |
    (safe(log.subsystem, "") == "com.apple.TCC" && safe(log.eventMessage, "") contains "kTCCServiceDeveloperTool") ||
    (safe(log.process, "") == "tccd" && safe(log.eventMessage, "") contains "DeveloperTool") ||
    (safe(log.eventMessage, "") contains "security policy" && safe(log.eventMessage, "") contains "bypass") ||
    (safe(log.eventMessage, "") contains "unsigned" && (safe(log.eventMessage, "") contains "allowed" || safe(log.eventMessage, "") contains "executed")) ||
    (safe(log.eventMessage, "") contains "Gatekeeper" && safe(log.eventMessage, "") contains "disabled") ||
    (safe(log.eventMessage, "") contains "spctl" && safe(log.eventMessage, "") contains "developer-id")
  deduplicateBy:
    - origin.host
    - origin.user
