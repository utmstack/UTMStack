- id: 1029
  dataTypes:
    - macos
  name: T2 Security Chip Anomalous Activity
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Initial Access
  technique: "T1200 - Hardware Additions"
  adversary: system
  references:
    - https://attack.mitre.org/techniques/T1200/
    - https://support.apple.com/guide/security/secure-boot-secac71d5623/web
  description: |
    Detects suspicious activities related to the T2 security chip including potential bypass attempts, firmware modifications, or secure boot violations. The T2 chip is Apple's security coprocessor that provides secure boot capabilities and hardware-level security features.
    
    Next Steps:
    1. Immediately check the affected system's physical security and location
    2. Verify system integrity by running Apple Diagnostics (hold D while booting)
    3. Check for unauthorized physical access or tampering with the device
    4. Review System Information > Hardware > Controller for T2 chip status
    5. Examine Console.app logs for additional T2/bridgeOS entries around the incident time
    6. Verify secure boot status in System Preferences > Startup Security Utility
    7. Check for any recent firmware updates or modifications
    8. Consider re-imaging the system if hardware tampering is suspected
    9. Report to incident response team if physical security breach is confirmed
  where: |
    (safe(log.subsystem, "") contains "com.apple.security" ||
     safe(log.subsystem, "") contains "com.apple.sepos" ||
     safe(log.process, "") contains "bridgeOS" ||
     safe(log.process, "") contains "sepOS" ||
     safe(log.eventMessage, "") contains "T2" ||
     safe(log.eventMessage, "") contains "secure boot") &&
    (safe(log.eventMessage, "") contains "verification failed" ||
     safe(log.eventMessage, "") contains "signature invalid" ||
     safe(log.eventMessage, "") contains "firmware" ||
     safe(log.eventMessage, "") contains "checkm8" ||
     safe(log.eventMessage, "") contains "checkra1n" ||
     safe(log.eventMessage, "") contains "ECID" ||
     safe(log.eventMessage, "") contains "activation lock bypass" ||
     safe(log.eventMessage, "") contains "SMC payload" ||
     safe(log.eventType, "") == "error" ||
     safe(log.eventMessage, "") contains "security policy violation")
  deduplicateBy:
    - lastEvent.target.host
