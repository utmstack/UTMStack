- id: 1025
  dataTypes:
    - macos
  name: Homebrew Package Tampering Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Initial Access
  technique: "T1195.001 - Supply Chain Compromise: Compromise Software Dependencies and Development Tools"
  adversary: origin
  references:
    - https://www.securityweek.com/homebrew-macos-users-targeted-with-information-stealer-malware/
    - https://attack.mitre.org/techniques/T1195/001/
  description: |
    Detects potential Homebrew package tampering, malicious formula modifications, or suspicious package installation activities that could indicate supply chain attacks targeting macOS systems through compromised Homebrew packages.
    
    Next Steps:
    1. Immediately isolate the affected system to prevent further compromise
    2. Verify the integrity of installed Homebrew packages using 'brew doctor' and 'brew audit'
    3. Check the modification history of Homebrew formulas in /usr/local/Homebrew/Library/Taps
    4. Review network connections and DNS queries related to package downloads
    5. Scan the system for indicators of compromise including unusual processes or network activity
    6. Reinstall Homebrew and affected packages from trusted sources if tampering is confirmed
    7. Review user activity logs for suspicious administrative actions
  where: |
    (safe(log.process, "") == "brew" && (safe(log.eventMessage, "") contains "formula" && safe(log.eventMessage, "") contains "modified")) ||
    (safe(log.eventMessage, "") contains "homebrew" && (safe(log.eventMessage, "") contains "curl" || safe(log.eventMessage, "") contains "wget")) ||
    (safe(log.eventMessage, "") contains "/usr/local/Homebrew" && safe(log.eventMessage, "") contains "permission") ||
    (safe(log.eventMessage, "") contains "brew" && safe(log.eventMessage, "") contains "checksum") ||
    (safe(log.eventMessage, "") contains "Cellar" && (safe(log.eventMessage, "") contains "tamper" || safe(log.eventMessage, "") contains "integrity")) ||
    (safe(log.process, "") contains "Terminal" && safe(log.eventMessage, "") contains "HOMEBREW_NO_INSECURE_REDIRECT")
  deduplicateBy:
    - origin.user
    - origin.host
