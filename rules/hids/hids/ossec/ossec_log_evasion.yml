# Rule version v1.0.0

dataTypes:
  - hids
name: HIDS Event Flooding for Log Evasion
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1562.002 - Impair Defenses: Disable Windows Event Logging"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1562/002/
  - https://documentation.wazuh.com/current/user-manual/capabilities/log-data-collection/index.html
description: |
  Detects event flooding patterns where an attacker generates excessive benign events to bury malicious activities in noise, overwhelm the HIDS manager, or trigger log rotation to destroy evidence.

  Next Steps:
  1. Identify the source host generating excessive events
  2. Check the event types and patterns for artificial generation
  3. Review the host for signs of concurrent malicious activity
  4. Check if log rotation occurred during the flooding period
  5. Increase event queue size and log retention temporarily
  6. Investigate the host for compromise indicators
where: |
  contains("log.message", "Event queue is full") ||
  contains("log.message", "Dropping event") ||
  contains("log.message", "event rate exceeded") ||
  contains("log.message", "too many events") ||
  contains("log.message", "queue overflow") ||
  contains("log.message", "Agent flooding")
afterEvents:
  - indexPattern: v11-log-hids-*
    with:
      - field: target.host
        operator: filter_term
        value: '{{.target.host}}'
    within: now-10m
    count: 100
groupBy:
  - target.host
