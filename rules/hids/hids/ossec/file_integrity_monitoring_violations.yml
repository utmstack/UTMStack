# Rule version v1.0.0

dataTypes:
- hids
name: File Integrity Monitoring Violation
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1070 - Indicator Removal on Host"
adversary: origin
references:
- https://attack.mitre.org/techniques/T1070/
- https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html
description: |
  Detects file integrity monitoring (FIM) violations indicating unauthorized modifications to critical system files, configuration files, or monitored directories. This could indicate malware installation, configuration tampering, or persistence mechanisms.
  
  Next Steps:
  1. Immediately investigate the affected host to identify the source of the file modification
  2. Review system logs and process activity around the time of the FIM violation
  3. Check if the modification was part of an authorized change or system update
  4. If unauthorized, preserve the modified file for forensic analysis
  5. Review user accounts and active sessions on the affected system
  6. Check for other suspicious activities or IOCs on the host
  7. Consider isolating the system if malicious activity is confirmed
  8. Restore modified files from known-good backups if tampering is confirmed
  9. Document all findings and update security controls as needed
where: |
  equals("log.module", "syscheck") &&
  exists("log.event_type") &&
  (equals("log.event_type", "modified") ||
   equals("log.event_type", "deleted") ||
   equals("log.event_type", "added")) &&
  exists("log.file_path") &&
  (regexMatch("log.file_path", ".*(\/etc\/|\/boot\/|\/bin\/|\/sbin\/|\/usr\/bin\/|\/usr\/sbin\/|system32|syswow64|drivers).*") ||
   regexMatch("log.file_path", ".*(passwd|shadow|sudoers|hosts|resolv\.conf|sshd_config|httpd\.conf|nginx\.conf).*") ||
   regexMatch("log.file_path", ".*\.(exe|dll|sys|drv|so|dylib|kext)$")) &&
  exists("target.host")
afterEvents:
- indexPattern: v11-log-hids-*
  with:
  - field: target.host
    operator: filter_term
    value: '{{.target.host}}'
  - field: log.file_path
    operator: filter_term
    value: '{{.log.file_path}}'
  within: now-1h
  count: 3
groupBy:
  - lastEvent.log.event_type
  - lastEvent.log.file_path
  - target.host
