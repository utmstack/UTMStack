# Rule version v1.0.0

dataTypes:
  - hids
name: Syscheck Exclusion List Modification
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://documentation.wazuh.com/current/user-manual/capabilities/file-integrity/index.html
description: |
  Detects modifications to syscheck exclusion lists in OSSEC/Wazuh, which attackers may abuse to exclude their malware directories or persistence mechanisms from file integrity monitoring.

  Next Steps:
  1. Review the modified exclusion configuration
  2. Check which directories or files were added to exclusions
  3. Verify the change was authorized by security team
  4. Scan excluded directories for malicious files
  5. Restore the syscheck configuration from backup
  6. Investigate why an attacker had access to modify HIDS config
where: |
  (equals("log.module", "syscheck") || contains("log.message", "ossec")) &&
  (contains("log.message", "ossec.conf") || contains("log.message", "agent.conf")) &&
  (contains("log.message", "ignore") || contains("log.message", "no_diff") ||
   contains("log.message", "exclude") || contains("log.message", "syscheck")) &&
  (contains("log.message", "modified") || contains("log.message", "changed"))
groupBy:
  - target.host
