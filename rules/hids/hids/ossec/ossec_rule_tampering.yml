# Rule version v1.0.0

dataTypes:
  - hids
name: OSSEC/Wazuh Rule and Configuration Tampering
impact:
  confidentiality: 2
  integrity: 3
  availability: 3
category: Defense Evasion
technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://documentation.wazuh.com/current/user-manual/reference/ossec-conf/index.html
description: |
  Detects modifications to OSSEC/Wazuh configuration files (ossec.conf, local_rules.xml, local_decoder.xml) which attackers tamper with to disable detection rules or blind the security monitoring system.

  Next Steps:
  1. Identify who modified the OSSEC/Wazuh configuration
  2. Compare the modified configuration against a known-good baseline
  3. Check if any detection rules were disabled or weakened
  4. Verify the configuration change was authorized
  5. Restore configuration from backup if tampered
  6. Restart the OSSEC/Wazuh service and verify it is functioning
  7. Investigate the attack chain that led to configuration tampering
where: |
  (equals("log.module", "syscheck") || contains("log.message", "ossec")) &&
  (contains("log.message", "ossec.conf") || contains("log.message", "local_rules.xml") ||
   contains("log.message", "local_decoder.xml") || contains("log.message", "agent.conf") ||
   (contains("log.message", "shared/") && contains("log.message", ".conf"))) &&
  (contains("log.message", "modified") || contains("log.message", "changed") ||
   contains("log.message", "deleted") || contains("log.message", "added"))
groupBy:
  - lastEvent.log.file_path
  - target.host
