# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb SSRF Attack Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Web Application Attack
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.4.3/administration-guide/210196/blocking-known-attacks
- https://attack.mitre.org/techniques/T1190/
description: |
  Detects an explicit SSRF classification or a vendor message identifying server-side request forgery. A localhost URL or internal address alone is insufficient.

  Both Alert (log-only) and explicit blocking decisions are covered. Check log.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review log.subtype, log.attacktype, log.signatureid and log.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("log.type", "attack") &&
  regexMatch("log.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  ((regexMatch("log.subtype", "(?i)^(SSRF|Server.Side Request Forgery)$") || regexMatch("log.attacktype", "(?i)^(SSRF|Server.Side Request Forgery)$") || regexMatch("log.signaturesubclass", "(?i)^(SSRF|Server.Side Request Forgery)$")) || ((equalsIgnoreCase("log.maintype", "Signature Detection") || (!exists("log.subtype") && !exists("log.attacktype"))) && regexMatch("log.msg", "(?i)\\b(ssrf|server[ _-]*side[ _-]*request[ _-]*forgery)\\b")))
groupBy:
- adversary.ip
- target.ip
