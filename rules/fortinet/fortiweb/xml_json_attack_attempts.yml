- id: 1009
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb XML/JSON Attack Attempt Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Web Application Security
  technique: "T1059 - Command and Scripting Interpreter"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
    - https://attack.mitre.org/techniques/T1059/
    - https://attack.mitre.org/techniques/T1027/
  description: |
    Detects XML and JSON based attacks including XXE injection, JSON injection, malformed data structures, and parser exploitation attempts on FortiWeb protected applications.
    
    Next Steps:
    1. Review the attack payload in FortiWeb logs to understand the specific attack vector
    2. Check if the attack was successfully blocked or if any requests bypassed the WAF
    3. Identify the targeted application and verify its XML/JSON parsing configuration
    4. Review application logs for any signs of successful exploitation
    5. Consider blocking the source IP if multiple attacks are detected
    6. Update WAF signatures and security policies if new attack patterns are identified
  where: safe(origin.ip, "") != "" && safe(log.type, "") == "attack" && (safe(log.msg, "") contains "XML" || safe(log.msg, "") contains "JSON" || safe(log.msg, "") contains "XXE" || safe(log.msg, "") contains "parser" || safe(log.msg, "") contains "malformed" || safe(log.attack_type, "") in ["xml_injection", "json_injection", "xxe_attack"] || safe(log.trigger_policy, "") contains "xml" || safe(log.trigger_policy, "") contains "json" || safe(log.subtype, "") == "signature-detection") && safe(action, "") in ["deny", "alert", "block"]
  deduplicateBy:
    - origin.ip
    - target.ip
