# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb OWASP Top 10 Violation Attempts
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb-cloud/23.3.0/user-guide/552829/known-attacks
- https://owasp.org/www-project-top-ten/
- https://attack.mitre.org/techniques/T1190/
description: |
  Detects repeated medium-or-higher HTTP protocol violations that FortiWeb assigns to an OWASP category. Low-severity missing Content-Type, duplicate parameters and information disclosures are excluded from this rule.

  Both Alert (log-only) and explicit blocking decisions are covered. Check event.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review event.subtype, event.attacktype, event.signatureid and event.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("event.type", "attack") &&
  regexMatch("event.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  (equalsIgnoreCase("event.maintype", "HTTP Protocol Constraints") && regexMatch("event.owasptop10", "(?i)^A[0-9]{1,2}:") && regexMatch("event.severitylevel", "(?i)^(Medium|High|Critical)$") && regexMatch("event.subtype", "(?i)^(Illegal (URL Parameter Value|Character in URL|HTTP Method)|NULL Character in (URL|Param[e]?ter Value|Parameter Value))$")) &&
  exists("event.subtype")
afterEvents:
- indexPattern: v11-log-firewall-fortiweb-*
  with:
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: target.ip
    operator: filter_term
    value: '{{.target.ip}}'
  - field: event.type
    operator: filter_term
    value: '{{.event.type}}'
  - field: event.subtype
    operator: filter_term
    value: '{{.event.subtype}}'
  - field: event.action
    operator: filter_term
    value: '{{.event.action}}'
  - field: event.maintype
    operator: filter_term
    value: '{{.event.maintype}}'
  - field: event.severitylevel
    operator: filter_term
    value: '{{.event.severitylevel}}'
  - field: event.owasptop10
    operator: filter_term
    value: '{{.event.owasptop10}}'
  within: 15m
  count: 5
deduplicateBy:
- adversary.ip
- target.ip
- lastEvent.event.subtype
