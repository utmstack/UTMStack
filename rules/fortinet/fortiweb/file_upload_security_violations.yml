# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb File Upload Security Violation Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Resource Development
technique: 'T1608 - Stage Capabilities: Upload Malware'
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
- https://attack.mitre.org/techniques/T1608/
- https://attack.mitre.org/techniques/T1505/003/
description: |
  Detects repeated file-upload or antivirus policy violations against the same application and attack subtype. A policy violation is not proof of a web shell or successful malware upload.

  Both Alert (log-only) and explicit blocking decisions are covered. Check log.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review log.subtype, log.attacktype, log.signatureid and log.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("log.type", "attack") &&
  regexMatch("log.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  equals("log.fileUploadViolation", "true") && exists("log.subtype")
afterEvents:
- indexPattern: v11-log-firewall-fortiweb-*
  with:
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: target.ip
    operator: filter_term
    value: '{{.target.ip}}'
  - field: log.type
    operator: filter_term
    value: '{{.log.type}}'
  - field: log.subtype
    operator: filter_term
    value: '{{.log.subtype}}'
  - field: log.action
    operator: filter_term
    value: '{{.log.action}}'
  - field: log.fileUploadViolation
    operator: filter_term
    value: '{{.log.fileUploadViolation}}'
  within: 30m
  count: 3
deduplicateBy:
- adversary.ip
- target.ip
- lastEvent.log.subtype
