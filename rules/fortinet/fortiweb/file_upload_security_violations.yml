# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb File Upload Security Violation Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Resource Development
technique: 'T1608 - Stage Capabilities: Upload Malware'
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
- https://attack.mitre.org/techniques/T1608/
- https://attack.mitre.org/techniques/T1505/003/
description: |
  Detects repeated file-upload or antivirus policy violations against the same application and attack subtype. A policy violation is not proof of a web shell or successful malware upload.

  Both Alert (log-only) and explicit blocking decisions are covered. Check event.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review event.subtype, event.attacktype, event.signatureid and event.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("event.type", "attack") &&
  regexMatch("event.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  equals("event.fileUploadViolation", "true") && exists("event.subtype")
afterEvents:
- indexPattern: v11-log-firewall-fortiweb-*
  with:
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: target.ip
    operator: filter_term
    value: '{{.target.ip}}'
  - field: event.type
    operator: filter_term
    value: '{{.event.type}}'
  - field: event.subtype
    operator: filter_term
    value: '{{.event.subtype}}'
  - field: event.action
    operator: filter_term
    value: '{{.event.action}}'
  - field: event.fileUploadViolation
    operator: filter_term
    value: '{{.event.fileUploadViolation}}'
  within: 30m
  count: 3
deduplicateBy:
- adversary.ip
- target.ip
- lastEvent.event.subtype
