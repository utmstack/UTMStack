- id: 1016
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb Custom Signature Matches Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Web Application Security
  technique: Custom Rule Violation
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/445549/attack
    - https://attack.mitre.org/techniques/T1190/
  description: |
    Detects when FortiWeb custom signatures are matched, indicating potential attacks against web applications using organization-specific detection rules. Custom signatures are typically created to detect application-specific vulnerabilities or attack patterns not covered by default signatures.
    
    Next Steps:
    1. Review the specific custom signature that was triggered and its purpose
    2. Examine the source IP address for reputation and previous malicious activity
    3. Check the targeted URL/application for any signs of compromise
    4. Review WAF logs for other attack attempts from the same source
    5. Consider blocking the source IP if multiple high-severity signatures are triggered
    6. Validate that the custom signature is not causing false positives
    7. Correlate with network traffic patterns to identify potential attack campaigns
    8. Check if the signature matches are part of a coordinated attack across multiple applications
  where: safe(log.message, "") contains "attack" && safe(log.message, "") contains "signature" && safe(log.priority, "") in ["critical", "high"] && safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-fortiweb-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.message
          operator: filter_match
          value: 'attack'
      within: now-15m
      count: 5
  deduplicateBy:
    - origin.ip
    - target.url
