- id: 1021
  dataTypes:
    - firewall-fortiweb
  name: Zero-Day Attack Pattern Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Web Application Security
  technique: "T1190 - Exploit Public-Facing Application"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
    - https://attack.mitre.org/techniques/T1190/
  description: |
    Detects potential zero-day attack patterns through anomalous behavior, unknown attack signatures, and suspicious payload characteristics that deviate from normal web traffic patterns in FortiWeb logs.
    
    Next Steps:
    1. Investigate the source IP address to determine if it's a known malicious actor
    2. Review the specific attack patterns and payloads in the log messages
    3. Check if similar attack patterns have been observed from other source IPs
    4. Analyze the targeted application or URL path for vulnerabilities
    5. Consider implementing temporary IP blocking if attack persists
    6. Review FortiWeb signature updates and consider custom signatures for repeated patterns
    7. Correlate with other security events from the same time period
  where: |
    safe(origin.ip, "") != "" &&
    (
      safe(log.message, "").contains("unknown") ||
      safe(log.message, "").contains("anomaly") ||
      safe(log.message, "").contains("suspicious") ||
      safe(log.message, "").contains("0day") ||
      safe(log.message, "").contains("zero-day") ||
      safe(log.message, "").contains("exploit") ||
      safe(log.message, "").contains("payload") ||
      safe(log.message, "").contains("attack")
    )
  afterEvents:
    - indexPattern: v11-log-firewall-fortiweb-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-1h
      count: 5
  deduplicateBy:
    - origin.ip
