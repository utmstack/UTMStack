- id: 1018
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb HTTP Header Injection Attempts
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Injection Attack
  technique: "T1190 - Exploit Public-Facing Application"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/445549/attack
    - https://attack.mitre.org/techniques/T1190/
    - https://owasp.org/www-community/attacks/HTTP_Response_Splitting
  description: |
    Detects HTTP header injection attempts including CRLF injection, header smuggling, and other header manipulation attacks that could lead to cache poisoning, session hijacking, or response splitting attacks.
    
    Next Steps:
    1. Review the source IP address for reputation and previous malicious activity
    2. Examine the full HTTP request to understand the injection payload
    3. Check if the attack was successful by reviewing application logs
    4. Verify that the FortiWeb protection policy is configured correctly
    5. Consider blocking the source IP if multiple injection attempts are detected
    6. Review all requests from this IP for other attack patterns
    7. Ensure web application is patched against header injection vulnerabilities
  where: |
    safe(log.type, "") == "attack" && 
    (safe(log.subtype, "") in ["header_injection", "http_header_injection", "crlf_injection"] ||
     safe(log.msg, "").contains("header injection") ||
     safe(log.msg, "").contains("CRLF injection") ||
     safe(log.msg, "").contains("\\r\\n") ||
     safe(log.msg, "").contains("%0d%0a") ||
     safe(log.msg, "").contains("%0D%0A")) &&
    safe(action, "") in ["Alert", "Block", "Deny"] &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-fortiweb-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.type.keyword
          operator: filter_term
          value: 'attack'
      within: now-1h
      count: 3
  deduplicateBy:
    - origin.ip
