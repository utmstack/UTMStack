- id: 1014
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb IP Reputation Block
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Malicious Source
  technique: "T1190 - Exploit Public-Facing Application"
  adversary: origin
  references:
    - https://help.fortinet.com/fweb/580/Content/FortiWeb/fortiweb-admin/device_reputation.htm
    - https://attack.mitre.org/techniques/T1190/
  description: |
    Detects when FortiWeb blocks access based on IP reputation or device reputation scoring. This indicates connection attempts from known malicious sources or devices with poor reputation due to previous security violations.
    
    Next Steps:
    1. Review the blocked IP address reputation in threat intelligence databases
    2. Check if the source IP has been involved in previous security incidents
    3. Analyze the attack patterns and targeted resources from this IP
    4. Consider implementing permanent IP blocking if reputation consistently poor
    5. Review FortiWeb IP reputation threshold settings for appropriate sensitivity
    6. Check for any false positives if legitimate services are being blocked
  where: |
    safe(log.type, "") == "attack" && 
    (contains(safe(log.message, ""), "reputation") || 
     contains(safe(log.message, ""), "bad IP") ||
     contains(safe(log.message, ""), "blacklist") ||
     contains(safe(log.message, ""), "blocklist") ||
     contains(safe(log.attack_type, ""), "reputation") ||
     safe(log.subtype, "") == "ip_reputation" ||
     safe(log.subtype, "") == "device_reputation") &&
    safe(action, "") == "blocked" &&
    safe(origin.ip, "") != ""
  deduplicateBy:
    - adversary.ip
