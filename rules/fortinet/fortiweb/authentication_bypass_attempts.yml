# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb Authentication Bypass Attempt Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Initial Access
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
- https://attack.mitre.org/techniques/T1078/
- https://attack.mitre.org/techniques/T1190/
description: |
  Detects explicit authentication or authorization bypass classifications/messages. A notification policy name, login failure or account lockout alone is insufficient.

  Both Alert (log-only) and explicit blocking decisions are covered. Check log.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review log.subtype, log.attacktype, log.signatureid and log.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("log.type", "attack") &&
  regexMatch("log.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  ((regexMatch("log.subtype", "(?i)^(Authentication Bypass|Authorization Bypass|auth_bypass)$") || regexMatch("log.attacktype", "(?i)^(Authentication Bypass|Authorization Bypass|auth_bypass)$") || regexMatch("log.signaturesubclass", "(?i)^(Authentication Bypass|Authorization Bypass|auth_bypass)$")) || ((equalsIgnoreCase("log.maintype", "Signature Detection") || (!exists("log.subtype") && !exists("log.attacktype"))) && regexMatch("log.msg", "(?i)\\b(auth(?:entication|orization)?[ _-]*bypass)\\b")))
groupBy:
- adversary.ip
- target.ip
