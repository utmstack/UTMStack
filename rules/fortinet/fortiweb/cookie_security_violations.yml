- id: 1010
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb Cookie Security Violation Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Web Application Security
  technique: "T1539 - Steal Web Session Cookie"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
    - https://help.fortinet.com/fweb/583/Content/FortiWeb/fortiweb-admin/cookie_security.htm
    - https://attack.mitre.org/techniques/T1539/
  description: |
    Detects cookie security violations including cookie poisoning, cookie tampering, missing security attributes, and unauthorized cookie manipulation attempts on FortiWeb protected applications. These attacks may indicate attempts to hijack user sessions, bypass authentication, or perform cross-site scripting attacks.
    
    Next Steps:
    1. Review the source IP address for previous malicious activity
    2. Check if the affected application has proper cookie security settings (HttpOnly, Secure, SameSite attributes)
    3. Verify if the cookie manipulation attempt was successful by reviewing subsequent logs from the same source
    4. Consider blocking the source IP if multiple cookie security violations are detected
    5. Review FortiWeb security policies to ensure cookie protection features are properly configured
    6. Check for any successful authentication or data access following the cookie manipulation attempt
  where: |
    safe(origin.ip, "") != "" && 
    (
      safe(log.msg, "") contains "cookie" ||
      safe(log.msg, "") contains "Cookie" ||
      safe(log.msg, "") contains "poisoning" ||
      safe(log.msg, "") contains "tampering" ||
      safe(log.msg, "") contains "cookie-security"
    ) &&
    safe(action, "") in ["deny", "alert", "block"]
  deduplicateBy:
    - origin.ip
