# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb SQL Injection Attack Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Web Application Attack
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.4.3/administration-guide/210196/blocking-known-attacks
- https://attack.mitre.org/techniques/T1190/
description: |
  Detects SQL injection classified by FortiWeb, including extended signatures. A single classified attack is sufficient; unrelated requests must not be required to satisfy a history threshold.

  Both Alert (log-only) and explicit blocking decisions are covered. Check event.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review event.subtype, event.attacktype, event.signatureid and event.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("event.type", "attack") &&
  regexMatch("event.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  ((regexMatch("event.subtype", "(?i)^(SQL Injection(?:\\s*\\(Extended\\))?|SQLi)$") || regexMatch("event.attacktype", "(?i)^(SQL Injection(?:\\s*\\(Extended\\))?|SQLi)$") || regexMatch("event.signaturesubclass", "(?i)^(SQL Injection(?:\\s*\\(Extended\\))?|SQLi)$")) || ((!exists("event.subtype") && !exists("event.attacktype")) && regexMatch("event.msg", "(?i)\\b(sql[ _-]*injection|sqli)\\b")))
groupBy:
- adversary.ip
- target.ip
