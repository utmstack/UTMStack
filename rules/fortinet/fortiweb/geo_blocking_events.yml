- id: 1013
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb Geo-blocking Policy Violation
  impact:
    confidentiality: 2
    integrity: 1
    availability: 2
  category: Access Control Violation
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.6.0/administration-guide
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects when FortiWeb geo-blocking policies block access attempts from restricted geographical locations. This could indicate unauthorized access attempts from forbidden regions or potential evasion techniques using VPNs or proxies to bypass geographic restrictions.
    
    Next Steps:
    1. Review the blocked country to verify if it matches your geo-blocking policy
    2. Check if this is a legitimate user attempting to access from a restricted location (e.g., employee traveling)
    3. Investigate the source IP for known VPN or proxy services
    4. Look for patterns of repeated attempts from the same country or IP range
    5. Verify if the blocked requests targeted sensitive resources or admin interfaces
    6. Consider updating geo-blocking policies if legitimate business needs are being impacted
  where: |
    (safe(log.type, "") == "attack" || safe(log.type, "") == "traffic") && 
    (contains(safe(log.message, ""), "geo block") || 
     contains(safe(log.message, ""), "geo-block") ||
     contains(safe(log.message, ""), "geographic") ||
     contains(safe(log.message, ""), "country block") ||
     safe(log.subtype, "") == "geo_block") &&
    safe(action, "") == "blocked" &&
    safe(origin.ip, "") != "" &&
    safe(origin.geolocation.country, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-fortiweb-*
      with:
        - field: origin.geolocation.country.keyword
          operator: filter_term
          value: '{{origin.geolocation.country}}'
        - field: action.keyword
          operator: filter_term
          value: 'blocked'
      within: now-1h
      count: 10
  deduplicateBy:
    - origin.geolocation.country
    - target.ip
