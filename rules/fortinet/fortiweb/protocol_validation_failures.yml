- id: 1017
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb Protocol Validation Failures
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Protocol Anomaly
  technique: Protocol Manipulation
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects protocol validation failures in FortiWeb, indicating attempts to bypass security controls through malformed or non-compliant HTTP/HTTPS requests. These attacks may attempt to exploit vulnerabilities in web applications or the FortiWeb itself through protocol manipulation.
    
    Next Steps:
    1. Review the specific protocol violation details in the alert to understand the attack vector
    2. Check if the source IP has a history of malicious activity or is from a suspicious location
    3. Analyze web server logs for any successful requests from the same source
    4. Verify that FortiWeb security policies are properly configured to block protocol violations
    5. Consider blocking the source IP if multiple violations are detected
    6. Review application logs for any signs of successful exploitation
  where: safe(log.type, "") == "attack" && (safe(log.subtype, "") in ["http_protocol_validation", "protocol_constraint_violation"] || safe(log.message, "").contains("protocol violation") || safe(log.message, "").contains("invalid HTTP") || safe(log.message, "").contains("malformed request")) && safe(log.action, "") in ["Alert", "Block", "Deny"] && safe(origin.ip, "") != ""
  deduplicateBy:
    - origin.ip
    - target.port
