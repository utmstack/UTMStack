- id: 1006
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb Session Management Attack Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Web Application Security
  technique: "T1550.004 - Use Alternate Authentication Material: Web Session Cookie"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.2.2/log-message-reference/252057/event
    - https://attack.mitre.org/techniques/T1550/004/
  description: |
    Detects session management attacks including session hijacking, session fixation, and unauthorized session manipulation attempts on FortiWeb protected applications. These attacks attempt to compromise user sessions to gain unauthorized access.
    
    Next Steps:
    1. Review the source IP address and check for other suspicious activities from the same origin
    2. Examine the specific attack patterns in the log messages to understand the attack vector
    3. Check if the attacker successfully compromised any sessions by reviewing subsequent authentication logs
    4. Consider blocking the source IP if multiple attempts are detected
    5. Review and strengthen session management configurations in FortiWeb
    6. Notify the application owner and security team about the potential session attack
  where: |
    safe(origin.ip, "") != "" && 
    safe(log.msg, "") != "" &&
    (
      safe(log.msg, "") contains "session" ||
      safe(log.msg, "") contains "Session" ||
      safe(log.msg, "") contains "cookie" ||
      safe(log.msg, "") contains "Cookie" ||
      safe(log.msg, "") contains "JSESSIONID" ||
      safe(log.msg, "") contains "hijack" ||
      safe(log.msg, "") contains "fixation"
    ) &&
    safe(action, "") in ["deny", "alert", "block"]
  afterEvents:
    - indexPattern: v11-log-firewall-fortiweb-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 3
  deduplicateBy:
    - origin.ip
    - target.ip
