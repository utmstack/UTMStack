# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb Web Shell Upload Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Persistence
technique: 'T1505.003 - Server Software Component: Web Shell'
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.4.3/administration-guide/210196/blocking-known-attacks
- https://attack.mitre.org/techniques/T1505/003/
description: |
  Detects an explicit web-shell classification or named web-shell evidence in a FortiWeb attack message. Generic upload restrictions and script file extensions alone are insufficient.

  Both Alert (log-only) and explicit blocking decisions are covered. Check log.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review log.subtype, log.attacktype, log.signatureid and log.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("log.type", "attack") &&
  regexMatch("log.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  ((regexMatch("log.subtype", "(?i)^(Web.?Shells?)$") || regexMatch("log.attacktype", "(?i)^(Web.?Shells?)$") || regexMatch("log.signaturesubclass", "(?i)^(Web.?Shells?)$")) || ((equalsIgnoreCase("log.maintype", "Signature Detection") || (!exists("log.subtype") && !exists("log.attacktype"))) && regexMatch("log.msg", "(?i)\\b(web[ _-]*shell|backdoor[ _-]*upload|China[ _-]*Chopper|c99shell|r57shell|weevely|b374k)\\b")))
groupBy:
- adversary.ip
- target.ip
