- id: 1003
  dataTypes:
    - firewall-fortiweb
  name: FortiWeb Bot Detection and Mitigation
  impact:
    confidentiality: 2
    integrity: 1
    availability: 3
  category: Bot Protection
  technique: "T1496 - Resource Hijacking"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortiweb/7.4.3/administration-guide/210196/blocking-known-attacks
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects bot activity, crawlers, and automated tools attempting to access protected web applications, including bad bots, scrapers, and vulnerability scanners. This rule triggers when FortiWeb's bot detection mechanisms identify and block suspicious automated traffic.
    
    Next Steps:
    1. Review the source IP address and check its reputation in threat intelligence databases
    2. Analyze the user agent string and request patterns for bot-like behavior
    3. Check if the IP is associated with known bot networks or data centers
    4. Review the frequency and pattern of requests from this source
    5. Consider implementing rate limiting or CAPTCHA challenges for suspicious sources
    6. If confirmed as malicious, add the IP to a permanent block list
    7. Review web application logs for any successful data extraction or scanning attempts
    8. Ensure bot protection policies are properly configured and up to date
    9. Monitor for any attempts to bypass bot detection mechanisms
    10. Review FortiWeb policies to ensure they are tuned appropriately for legitimate traffic
  where: |
    safe(action, "") in ["deny", "captcha", "rate_limit"] && 
    (safe(log.message, "") =~ "(?i)(bot.*detect|bad.*bot|web.*scrap|vuln.*scan|crawler|automated.*tool|suspicious.*user.*agent)" ||
    safe(log.message, "") =~ "(?i)(bot|spider|scraper|scan|nikto|nmap|masscan|zgrab|gobuster|sqlmap|dirb|dirbuster|wfuzz)")
  deduplicateBy:
    - origin.ip
