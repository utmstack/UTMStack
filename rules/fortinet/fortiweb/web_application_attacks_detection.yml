# Rule version v1.1.0

dataTypes:
- firewall-fortiweb
name: FortiWeb Web Application Attack Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: T1190 - Exploit Public-Facing Application
adversary: origin
references:
- https://docs.fortinet.com/document/fortiweb/7.6.0/administration-guide/981691/syntax-based-sql-xss-injection-detection
- https://attack.mitre.org/techniques/T1190/
description: |
  Detects repeated Generic Attacks (including Extended) classifications from FortiWeb against the same application. Dedicated SQLi, XSS Known Exploits and malware rules handle those classes. Routine geographic/IP-reputation blocks are excluded.

  Both Alert (log-only) and explicit blocking decisions are covered. Check event.action and actionResult to distinguish detection from prevention; neither establishes successful exploitation. Review event.subtype, event.attacktype, event.signatureid and event.msg, then validate the request and outcome in application logs before escalating.
where: |
  exists("origin.ip") && exists("target.ip") && equalsIgnoreCase("event.type", "attack") &&
  regexMatch("event.action", "(?i)^(alert|alert_deny|deny|denied|block|blocked|period_block)$") &&
  regexMatch("event.subtype", "(?i)^Generic Attacks(?:\\s*\\(Extended\\))?$") &&
  exists("event.subtype")
afterEvents:
- indexPattern: v11-log-firewall-fortiweb-*
  with:
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: target.ip
    operator: filter_term
    value: '{{.target.ip}}'
  - field: event.type
    operator: filter_term
    value: '{{.event.type}}'
  - field: event.subtype
    operator: filter_term
    value: '{{.event.subtype}}'
  - field: event.action
    operator: filter_term
    value: '{{.event.action}}'
  within: 15m
  count: 3
deduplicateBy:
- adversary.ip
- target.ip
- lastEvent.event.subtype
