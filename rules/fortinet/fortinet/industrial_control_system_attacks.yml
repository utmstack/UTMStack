- id: 1017
  dataTypes:
    - firewall-fortigate-traffic
  name: Industrial Control System Attack Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: ICS/SCADA Attack
  technique: "T0836 - Modify Parameter"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortigate/7.0.4/fortios-log-message-reference/656858/log-id-definitions
    - https://attack.mitre.org/techniques/T0836/
    - https://attack.mitre.org/techniques/T0882/
  description: |
    Detects potential attacks targeting Industrial Control Systems (ICS) or SCADA networks. This includes attempts to access OT protocols, modify control logic, or exploit vulnerabilities in industrial equipment. Industrial control systems are critical infrastructure components that manage physical processes in sectors like manufacturing, energy, water treatment, and transportation.
    
    Next Steps:
    1. Immediately isolate the affected ICS network segment to prevent lateral movement
    2. Review firewall logs for the source IP to identify attack patterns and targeted systems
    3. Check if the source IP has accessed other critical OT assets or attempted to modify control logic
    4. Verify the integrity of PLC configurations and control logic on targeted systems
    5. Contact the ICS/SCADA team and incident response team for immediate investigation
    6. Review network segmentation between IT and OT networks for potential weaknesses
    7. Consider blocking the source IP at the perimeter if confirmed malicious
  where: |
    (
      safe(target.port, 0) in [502, 102, 20000, 44818, 47808, 4840, 34980] ||
      safe(log.service, "") in ["modbus", "s7", "dnp3", "iec-104", "opcua", "bacnet", "ethernetip"] ||
      safe(log.appcat, "") == "Industrial" ||
      safe(log.app, "").contains("scada") ||
      safe(log.app, "").contains("industrial")
    ) &&
    (
      safe(log.action, "") in ["deny", "block", "reset"] ||
      safe(log.attack, "") != "" ||
      safe(log.threat, "") != ""
    )
  afterEvents:
    - indexPattern: v11-log-fortinet-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.appcat.keyword
          operator: filter_term
          value: 'Industrial'
      within: now-15m
      count: 5
  deduplicateBy:
    - origin.ip
    - target.ip
