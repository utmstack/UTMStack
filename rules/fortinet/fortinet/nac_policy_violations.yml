- id: 1020
  dataTypes:
    - firewall-fortigate-traffic
  name: Network Access Control Policy Violation
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Unauthorized Access
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://www.fortinet.com/resources/cyberglossary/what-is-network-access-control
    - https://attack.mitre.org/techniques/T1078/
    - https://attack.mitre.org/techniques/T1133/
  description: |
    Detects violations of Network Access Control (NAC) policies including unauthorized device access, authentication failures, or attempts to access restricted network segments. This may indicate rogue devices or compromised credentials.
    
    Next Steps:
    1. Identify the device attempting access using the MAC address and IP address from the alert
    2. Check if the device is known to the organization and should have access
    3. Review the NAC policy that was violated to understand what restrictions were breached
    4. Investigate if the MAC address shows signs of spoofing by comparing with known device records
    5. Check for any successful authentications from the same device before/after the violation
    6. If the device is unauthorized, locate and remove it from the network
    7. If legitimate, review and update NAC policies or device authentication credentials
    8. Monitor for additional attempts from the same MAC/IP combination
  where: |
    (
      safe(log.subtype, "") == "nac" ||
      safe(log.type, "") == "nac" ||
      safe(log.service, "") == "802.1x" ||
      safe(log.logid, "") in ["0102048000", "0102048001", "0102048002", "0102048003"]
    ) &&
    (
      safe(log.msg, "").contains("nac violation") ||
      safe(log.msg, "").contains("unauthorized device") ||
      safe(log.msg, "").contains("authentication failed") ||
      safe(log.msg, "").contains("access denied") ||
      safe(log.msg, "").contains("rogue device") ||
      safe(log.msg, "").contains("mac spoofing") ||
      safe(log.msg, "").contains("vlan violation") ||
      safe(log.authstatus, "") == "failed" ||
      safe(log.nacstatus, "") in ["denied", "quarantine", "violation"]
    ) &&
    safe(action, "") in ["deny", "block", "quarantine"]
  deduplicateBy:
    - origin.ip
    - origin.mac
