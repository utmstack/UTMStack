- id: 1019
  dataTypes:
    - firewall-fortigate-traffic
  name: Endpoint Compliance Policy Violation
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Policy Violation
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://www.fortinet.com/products/network-access-control
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects when an endpoint fails compliance checks including outdated antivirus signatures, missing patches, unauthorized software, or security policy violations. This may indicate vulnerable or compromised systems attempting network access.
    
    Next Steps:
    1. Identify the affected endpoint and user from the alert details
    2. Review the specific compliance failure reason in the FortiGate logs
    3. Check if this is a recurring issue for the same endpoint
    4. Verify the endpoint's current security posture (antivirus status, patch level, installed software)
    5. If outdated antivirus: Update signatures immediately
    6. If missing patches: Schedule critical updates
    7. If unauthorized software: Remove and investigate why it was installed
    8. Consider temporarily isolating the endpoint until compliance is restored
    9. Review network access logs for any suspicious activity from this endpoint
    10. Update endpoint compliance policies if false positives are occurring
  where: |
    (
      safe(log.subtype, "") in ["endpoint", "compliance", "host"] ||
      safe(log.type, "") == "endpoint" ||
      safe(log.logid, "") in ["0102043008", "0102043009", "0102043010"]
    ) &&
    (
      safe(log.message, "").contains("compliance failed") ||
      safe(log.message, "").contains("policy violation") ||
      safe(log.message, "").contains("antivirus outdated") ||
      safe(log.message, "").contains("patch missing") ||
      safe(log.message, "").contains("unauthorized software") ||
      safe(log.message, "").contains("security policy") ||
      safe(log.status, "") == "non-compliant" ||
      safe(log.compliance, "") == "failed" ||
      safe(log.verdict, "") == "violation"
    ) &&
    safe(action, "") in ["deny", "quarantine", "isolate", "block"]
  afterEvents:
    - indexPattern: v11-log-fortinet-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: origin.host.keyword
          operator: filter_term
          value: '{{origin.host}}'
      within: now-24h
      count: 3
  deduplicateBy:
    - origin.ip
    - origin.host
