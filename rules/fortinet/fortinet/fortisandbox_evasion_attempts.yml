- id: 1016
  dataTypes:
    - fortinet
  name: FortiSandbox Evasion Attempts Detected
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Malware
  technique: "T1497 - Virtualization/Sandbox Evasion"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortisandbox/4.4.4/log-message-reference/183685/event
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/techniques/T1497/
  description: |
    Detects attempts to evade FortiSandbox analysis through various techniques such as sandbox detection, anti-debugging, or environment checks. This could indicate malware trying to avoid detection by checking for virtualized environments or analysis tools.
    
    Next Steps:
    1. Investigate the source IP address for other suspicious activities
    2. Review the FortiSandbox detailed analysis report for the file or URL
    3. Check if the file hash or URL has been flagged by other threat intelligence sources
    4. Examine network traffic patterns from the affected source to identify potential command and control communications
    5. Consider blocking the source IP if malicious behavior is confirmed
    6. Update security policies to prevent similar evasion attempts
  where: |
    safe(log.subtype, "") == "fortisandbox" && 
    safe(log.level, "") == "alert" &&
    (
      safe(log.message, "").contains("sandbox evasion") ||
      safe(log.message, "").contains("anti-debugging") ||
      safe(log.message, "").contains("environment check") ||
      safe(log.message, "").contains("vm detection") ||
      safe(log.threat, "").contains("evasion") ||
      safe(log.behavior, "").contains("sandbox aware") ||
      safe(log.verdict, "") == "suspicious" && safe(log.message, "").contains("analysis failed")
    )
  deduplicateBy:
    - origin.ip
