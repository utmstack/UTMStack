- id: 1006
  dataTypes:
    - firewall-fortigate-traffic
  name: Fortinet Application Control Policy Violations
  impact:
    confidentiality: 2
    integrity: 2
    availability: 1
  category: Policy Violation
  technique: "T1562.001 - Impair Defenses: Disable or Modify Tools"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortigate/7.4.1/administration-guide/618581/application-control
    - https://attack.mitre.org/techniques/T1562/001/
  description: |
    Detects multiple application control policy violations from the same source, indicating potential attempts to bypass security controls or use of prohibited applications. This could indicate an attacker or malicious insider attempting to use unauthorized applications that could be used for data exfiltration, command and control communication, or other malicious activities.
    
    Next Steps:
    - Identify the source IP and determine if it belongs to a legitimate user or system
    - Review the blocked applications to understand what was attempted
    - Check if the source has attempted other policy violations or suspicious activities
    - Verify if the user has a legitimate business need for the blocked applications
    - Review application control policies to ensure they align with business requirements
    - Consider blocking the source IP if the activity appears malicious
    - Document the incident and escalate if policy violations persist
  where: safe(log.kvMessage, "") != "" && safe(log.kvMessage, "").contains("type=utm") && safe(log.kvMessage, "").contains("subtype=app-ctrl") && safe(log.kvMessage, "").contains("action=blocked") && safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-firewall-fortigate-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.kvMessage.keyword
          operator: filter_match
          value: 'subtype=app-ctrl'
        - field: log.kvMessage.keyword
          operator: filter_match
          value: 'action=blocked'
      within: now-30m
      count: 10
  deduplicateBy:
    - origin.ip
