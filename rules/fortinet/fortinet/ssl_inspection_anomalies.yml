- id: 1009
  dataTypes:
    - firewall-fortigate-traffic
  name: Fortinet SSL/TLS Inspection Anomalies
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Suspicious Activity
  technique: "T1573 - Encrypted Channel"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortigate/7.4.1/administration-guide/593133/ssl-ssh-inspection
    - https://attack.mitre.org/techniques/T1573/
  description: |
    Detects SSL/TLS inspection anomalies including certificate issues, protocol violations, or attempts to bypass SSL inspection. These anomalies may indicate attempts to evade security controls, man-in-the-middle attacks, or compromised certificates being used for malicious communications.
    
    Next Steps:
    1. Review the specific SSL/TLS error message in the log.msg field to understand the nature of the anomaly
    2. Check if the source IP is from a known/trusted internal device or an external entity
    3. Verify if the destination is a legitimate service or potentially malicious domain
    4. Examine certificate details if available to identify self-signed, expired, or untrusted certificates
    5. Check for any security tools or legitimate applications that might trigger false positives
    6. If suspicious, consider blocking the source IP temporarily and investigating the endpoint for compromise
  where: |
    (safe(log.msg, "") =~ ".*ssl.*" || safe(log.msg, "") =~ ".*tls.*" || safe(log.msg, "") =~ ".*certificate.*") &&
    (safe(log.msg, "") =~ ".*error.*" || safe(log.msg, "") =~ ".*fail.*" || safe(log.msg, "") =~ ".*invalid.*" || 
     safe(log.msg, "") =~ ".*untrusted.*" || safe(log.msg, "") =~ ".*expired.*" || safe(log.msg, "") =~ ".*self.*signed.*" ||
     safe(action, "") == "blocked" || safe(action, "") == "deny") &&
    safe(origin.ip, "") != ""
  deduplicateBy:
    - origin.ip
    - target.ip
