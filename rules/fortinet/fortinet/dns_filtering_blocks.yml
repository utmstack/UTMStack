- id: 1018
  dataTypes:
    - firewall-fortigate-traffic
  name: DNS Filtering High-Risk Domain Blocked
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: C2 Communication
  technique: Command and Control
  adversary: origin
  references:
    - https://www.fortinet.com/support/support-services/fortiguard-security-subscriptions/dns-security
    - https://attack.mitre.org/techniques/T1071/004/
    - https://attack.mitre.org/techniques/T1568/
  description: |
    Detects when DNS filtering blocks access to high-risk domains, including malicious newly registered domains, parked domains, DNS tunneling attempts, or known C2 servers. This indicates potential malware communication attempts or compromised systems.
    
    Next Steps:
    1. Identify the blocked domain from the log.msg field and verify its reputation
    2. Check if the source IP corresponds to a legitimate user or system
    3. Review other DNS queries from the same source IP for patterns
    4. Scan the source system for malware or suspicious processes
    5. Check for any successful connections to suspicious domains before the block
    6. Update endpoint security and run full system scan on affected hosts
    7. Consider isolating the system if multiple C2 attempts are detected
  where: |
    safe(log.type, "") == "dns" &&
    safe(action, "") in ["block", "deny", "blocked"] &&
    (
      safe(log.msg, "").contains("dns blocked") ||
      safe(log.msg, "").contains("malicious domain") ||
      safe(log.msg, "").contains("botnet c&c") ||
      safe(log.msg, "").contains("dga domain") ||
      safe(log.msg, "").contains("dns tunneling") ||
      safe(log.msg, "").contains("reputation")
    )
  deduplicateBy:
    - origin.ip
    - target.ip
