- id: 1010
  dataTypes:
    - firewall-fortigate-traffic
  name: Fortinet VPN Tunnel Connection Failures
  impact:
    confidentiality: 2
    integrity: 1
    availability: 3
  category: Connection Issues
  technique: "T1021 - Remote Services"
  adversary: origin
  references:
    - https://docs.fortinet.com/document/fortigate/7.4.1/administration-guide/762116/ipsec-vpn
    - https://attack.mitre.org/techniques/T1021/
  description: |
    Detects multiple VPN tunnel connection failures which could indicate connection issues, authentication problems, or potential unauthorized access attempts. This rule monitors for VPN tunnel down events, disconnections, and error messages that may signal connectivity problems or security incidents.
    
    Next Steps:
    1. Review the VPN tunnel logs to identify the specific error messages and failure reasons
    2. Check if the failures are from legitimate users experiencing connectivity issues
    3. Verify VPN tunnel configuration and ensure certificates/keys are valid
    4. Look for patterns in the source IPs - are failures coming from specific geographic regions?
    5. Check authentication logs for any concurrent failed login attempts
    6. Review firewall policies to ensure VPN traffic is properly allowed
    7. If unauthorized access is suspected, consider blocking the source IP temporarily
  where: |
    safe(log.type, "") == "event" && 
    safe(log.subtype, "") == "vpn" && 
    (safe(log.action, "") == "tunnel-down" || 
     safe(log.action, "") == "tunnel-disconnect" ||
     safe(log.msg, "").contains("fail") ||
     safe(log.msg, "").contains("error") ||
     safe(log.status, "") == "negotiate_error") &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-fortinet-fortigate-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.type.keyword
          operator: filter_term
          value: event
        - field: log.subtype.keyword
          operator: filter_term
          value: vpn
      within: now-1h
      count: 10
  deduplicateBy:
    - origin.ip
    - lastEvent.log.tunnelid
