- id: 1008
  dataTypes:
    - aws
  name: AWS Security Group Modifications
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Configuration Change
  technique: "T1562.007 - Impair Defenses: Disable or Modify Cloud Firewall"
  adversary: origin
  references:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    - https://attack.mitre.org/techniques/T1562/007/
  description: |
    Detects modifications to AWS security groups that could weaken network security posture. Monitors for changes that add permissive rules or remove restrictive rules, particularly those allowing unrestricted access (0.0.0.0/0 or ::/0).
    
    Next Steps:
    1. Review the security group change details in CloudTrail logs
    2. Verify if the change was authorized and follows security policies
    3. Check the user/role that made the modification
    4. Assess if the new rules expose sensitive resources
    5. If unauthorized, immediately revert the changes
    6. Review other recent activities from the same source IP or user
    7. Consider implementing preventive controls via AWS Config rules or SCPs
  where: |
    safe(log.eventSource, "") == "ec2.amazonaws.com" && 
    safe(log.eventName, "") in ["AuthorizeSecurityGroupIngress", "AuthorizeSecurityGroupEgress", "RevokeSecurityGroupIngress", "RevokeSecurityGroupEgress", "CreateSecurityGroup", "DeleteSecurityGroup", "ModifySecurityGroupRules"] &&
    safe(log.sourceIPAddress, "") != "" &&
    safe(log.errorCode, "") == "" &&
    (
      (has(log.requestParameters.ipPermissions) && (
        contains(safe(log.requestParameters.ipPermissions.ipProtocol, ""), "-1") ||
        contains(safe(log.requestParameters.ipPermissions.cidrIp, ""), "0.0.0.0/0") ||
        contains(safe(log.requestParameters.ipPermissions.ipv6CidrIp, ""), "::/0")
      )) ||
      (has(log.requestParameters.ipRanges) && 
        contains(safe(log.requestParameters.ipRanges.cidrIp, ""), "0.0.0.0/0")) ||
      (has(log.requestParameters.ipv6Ranges) && 
        contains(safe(log.requestParameters.ipv6Ranges.cidrIpv6, ""), "::/0"))
    )
  afterEvents:
    - indexPattern: v11-log-aws-*
      with:
        - field: log.sourceIPAddress.keyword
          operator: filter_term
          value: '{{log.sourceIPAddress}}'
        - field: log.eventSource.keyword
          operator: filter_term
          value: 'ec2.amazonaws.com'
      within: now-30m
      count: 3
  deduplicateBy:
    - log.sourceIPAddress
    - log.userIdentity.arn
