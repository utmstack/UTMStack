- id: 1009
  dataTypes:
    - aws
  name: AWS Network ACL Changes
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Configuration Change
  technique: "T1562.007 - Impair Defenses: Disable or Modify Cloud Firewall"
  adversary: origin
  references:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    - https://attack.mitre.org/techniques/T1562/007/
  description: |
    Detects changes to AWS Network ACLs that could compromise network security. Network ACLs act as a virtual firewall for controlling traffic in and out of subnets. This rule monitors for creation, modification, or deletion of network ACL rules that may allow unauthorized access or disrupt network connectivity.
    
    Next Steps:
    1. Review the CloudTrail logs to identify what specific changes were made to the Network ACL
    2. Verify if the user/role making the changes has legitimate authorization for network configuration
    3. Check the modified ACL rules to ensure they don't expose sensitive resources or violate security policies
    4. Review the source IP address to confirm it matches expected administrative access patterns
    5. If changes are unauthorized, immediately revert the Network ACL modifications
    6. Consider implementing preventive controls using AWS Config rules or SCPs to restrict Network ACL changes
    7. Document the incident and update network security procedures if needed
  where: |
    safe(log.eventSource, "") == "ec2.amazonaws.com" && 
    safe(log.eventName, "") in ["CreateNetworkAcl", "DeleteNetworkAcl", "CreateNetworkAclEntry", "DeleteNetworkAclEntry", "ReplaceNetworkAclEntry", "ReplaceNetworkAclAssociation"] &&
    safe(log.sourceIPAddress, "") != "" &&
    safe(log.errorCode, "") == "" &&
    safe(log.userIdentityType, "") != "AWSService"
  deduplicateBy:
    - log.sourceIPAddress
    - log.userIdentityArn
    - log.awsRegion
