- id: 1016
  dataTypes:
    - json-input
  name: JSON-LD Context Loading Attack
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Injection Attack
  technique: "T1190 - Exploit Public-Facing Application"
  adversary: origin
  references:
    - https://github.com/json-ld/json-ld.org/issues/213
    - https://attack.mitre.org/techniques/T1190/
  description: |
    Detects attempts to load malicious JSON-LD contexts from untrusted HTTP sources or DNS poisoning attempts targeting context URLs. Attackers may try to alter the meaning of data fields through malicious context documents by serving malicious @context definitions over insecure HTTP connections or through compromised context URLs.
    
    Next Steps:
    1. Investigate the source IP for other suspicious activities
    2. Check if the context URL is legitimate and verify its SSL certificate
    3. Examine application logs for any data parsing anomalies
    4. Review network traffic for DNS poisoning attempts
    5. Validate all JSON-LD context sources are using HTTPS
    6. Check for unauthorized modifications to application configuration
    7. Monitor for follow-up exploitation attempts or data exfiltration
  where: |
    safe(log.method, "") == "GET" && 
    safe(log.path, "").contains("@context") && 
    (safe(log.url, "").startsWith("http://") || 
     safe(log.context_url, "").startsWith("http://") ||
     (safe(log.user_agent, "").contains("json-ld") && 
      safe(log.referrer, "").startsWith("http://")))
  deduplicateBy:
    - adversary.ip
