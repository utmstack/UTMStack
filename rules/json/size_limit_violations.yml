- id: 1008
  dataTypes:
    - json-input
  name: JSON Size Limit Violation Detection
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Resource Exhaustion
  technique: "T1499 - Endpoint Denial of Service"
  adversary: origin
  references:
    - https://www.acunetix.com/blog/articles/json-web-token-jwt-attacks-vulnerabilities/
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects attempts to send oversized JSON payloads that could lead to denial of service, memory exhaustion, or buffer overflow conditions. This rule identifies JSON payloads exceeding size limits, error messages indicating payload size violations, HTTP 413 responses, or excessive array/object counts that may indicate an attempt to overwhelm the application.
    
    Next Steps:
    - Review the source IP and identify if this is legitimate traffic or an attack
    - Check application logs for additional context about the oversized payload
    - Verify JSON parsing configuration and size limits are properly set
    - Monitor for additional size limit violations from the same source
    - Consider implementing rate limiting or blocking the source if malicious
    - Analyze the content of the oversized payload if available to understand attack patterns
  where: |
    (safe(log.content_length, 0) > 1048576) ||
    (safe(log.json_size, 0) > 1048576) ||
    (safe(log.payload_size, 0) > 1048576) ||
    (safe(log.error, "") contains "payload too large") ||
    (safe(log.error, "") contains "size limit exceeded") ||
    (safe(log.parser_error, "") contains "maximum size") ||
    (safe(log.response_code, 0) == 413) ||
    (safe(log.array_length, 0) > 10000) ||
    (safe(log.object_count, 0) > 10000)
  afterEvents:
    - indexPattern: v11-log-json-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-5m
      count: 3
  deduplicateBy:
    - origin.ip
    - lastEvent.log.request_id
