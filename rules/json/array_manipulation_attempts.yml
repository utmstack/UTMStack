- id: 1005
  dataTypes:
    - json-input
  name: JSON Array Manipulation Attack
  impact:
    confidentiality: 3
    integrity: 4
    availability: 3
  category: Data Manipulation
  technique: Array Manipulation
  adversary: origin
  references:
    - https://medium.com/dataseries/working-with-json-injection-attacks-90eda79305e2
    - https://attack.mitre.org/techniques/T1565/001/
  description: |
    Detects attempts to manipulate JSON arrays including oversized arrays, array injection attacks, and attempts to bypass security controls through array manipulation techniques. This rule identifies various indicators of malicious array manipulation such as excessive array sizes, array-related errors, injection patterns, and suspicious array characteristics.
    
    Next Steps:
    1. Investigate the source IP address and associated user account
    2. Review the full JSON payload for malicious content
    3. Check application logs for related errors or exceptions
    4. Analyze the timing and frequency of array manipulation attempts
    5. Verify if the manipulation attempt was successful or blocked
    6. Review network traffic for additional suspicious activity from the same source
    7. Consider implementing additional input validation and rate limiting
  where: |
    (safe(log.array_size, 0) > 10000 ||
     safe(log.error, "").contains("array overflow") ||
     safe(log.error, "").contains("array bounds") ||
     safe(log.error, "").contains("invalid array") ||
     safe(log.message, "").contains("array manipulation") ||
     safe(log.message, "").contains("array injection") ||
     safe(log.payload, "").contains("[][]") ||
     safe(log.payload, "").contains("[null,null,null") ||
     (safe(log.array_count, 0) > 100 && safe(log.unique_values, 0) < 5) ||
     (safe(log.empty_arrays, 0) > 50) ||
     safe(log.nested_arrays, 0) > 10) &&
    safe(origin.ip, "") != ""
  deduplicateBy:
    - origin.ip
