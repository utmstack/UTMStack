- id: 1001
  dataTypes:
    - json-input
  name: JSON Schema Validation Failure Detected
  impact:
    confidentiality: 1
    integrity: 3
    availability: 2
  category: Input Validation
  technique: "T1059 - Command and Scripting Interpreter"
  adversary: origin
  references:
    - https://www.invicti.com/learn/json-injection/
    - https://attack.mitre.org/techniques/T1059/
  description: |
    Detects JSON schema validation failures which may indicate attempts to bypass input validation or exploit parser vulnerabilities. Multiple failures from the same source could indicate reconnaissance or attack attempts.
    
    Next Steps:
    1. Review the failed JSON payload and validation error details
    2. Check if this is part of a pattern of validation bypass attempts
    3. Examine the source IP for other suspicious activities
    4. Verify application input validation controls are properly configured
    5. Consider blocking the source if multiple validation failures are detected
    6. Review application logs for potential injection attempts
  where: |
    (safe(log.error_type, "") == "schema_validation_failed" || 
     safe(log.error_type, "") == "invalid_schema" ||
     safe(log.error_type, "") == "validation_error" ||
     safe(log.message, "").contains("schema validation") ||
     safe(log.message, "").contains("invalid JSON schema") ||
     safe(log.message, "").contains("failed to validate")) &&
    safe(origin.ip, "") != ""
  afterEvents:
    - indexPattern: v11-log-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
