- id: 1007
  dataTypes:
    - json-input
  name: JSON Encoding Attack Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Encoding Attack
  technique: "T1027 - Obfuscated Files or Information"
  adversary: origin
  references:
    - https://pragmaticwebsecurity.com/articles/spasecurity/json-stringify-xss
    - https://attack.mitre.org/techniques/T1027/
  description: |
    Detects attempts to exploit JSON encoding vulnerabilities including Unicode manipulation, Base64 encoding attacks, and character escape sequence abuse. These attacks can be used to bypass security controls, inject malicious code, or cause application errors.
    
    Next Steps:
    1. Examine the raw log data for malicious encoding patterns
    2. Check if the encoding attack successfully bypassed input validation
    3. Review application logs for any errors or unexpected behavior
    4. Verify if the attack originated from known attack sources
    5. Implement proper input validation and encoding controls
    6. Monitor for additional attacks from the same source IP
  where: >
    (safe(log.encoding_error, "") != "") ||
    (safe(log.unicode_error, false) == true) ||
    (safe(log.raw, "") contains "\\u0000") ||
    (safe(log.raw, "") contains "\\x00") ||
    (safe(log.parser_warning, "") contains "invalid encoding") ||
    (safe(log.parser_warning, "") contains "truncated unicode") ||
    (safe(log.content_length, 0) > 0 && safe(log.decoded_length, 0) > 0 && log.decoded_length > log.content_length * 10) ||
    (safe(log.character_encoding, "") != "UTF-8" && safe(log.character_encoding, "") != "")
  deduplicateBy:
    - adversary.ip
