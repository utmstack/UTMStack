- id: 1023
  dataTypes:
    - json-input
  name: JSON Memory Exhaustion Attack
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Resource Exhaustion
  technique: "T1499.001 - Endpoint Denial of Service: OS Exhaustion Flood"
  adversary: origin
  references:
    - https://cloud.google.com/dataflow/docs/guides/common-errors
    - https://attack.mitre.org/techniques/T1499/001/
  description: |
    Detects attempts to exhaust system memory through malicious JSON payloads. This includes extremely large JSON documents, deeply nested structures, or patterns that cause excessive memory allocation during parsing.
    
    Next Steps:
    1. Review the JSON payload size and structure in the logs
    2. Check system memory usage and application performance metrics
    3. Examine the source IP for other memory exhaustion attempts
    4. Implement JSON parsing limits and validate input size restrictions
    5. Monitor for subsequent attacks from the same source
    6. Consider blocking the source IP if attacks persist
  where: >
    (safe(log.error, "") contains "out of memory" ||
     safe(log.error, "") contains "memory exhausted" ||
     safe(log.error_type, "") == "OOM" ||
     safe(log.error_type, "") == "OutOfMemoryError" ||
     safe(log.memory_usage_percent, 0) > 90 ||
     safe(log.json_size_bytes, 0) > 104857600 ||
     (safe(log.gc_thrashing, false) == true && safe(log.component, "") == "json_parser") ||
     safe(log.message, "") contains "GC thrashing" ||
     safe(log.allocation_failure, "") == "json_parse")
  deduplicateBy:
    - origin.ip
    - target.host
