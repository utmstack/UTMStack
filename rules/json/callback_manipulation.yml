- id: 1025
  dataTypes:
    - json-input
  name: JSON Callback Manipulation Attack
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Code Injection
  technique: "JSONP Injection"
  adversary: origin
  references:
    - https://securitycafe.ro/2017/01/18/practical-jsonp-injection/
    - https://cheatsheetseries.owasp.org/cheatsheets/AJAX_Security_Cheat_Sheet.html
    - https://attack.mitre.org/techniques/T1059/007/
  description: |
    Detects attempts to manipulate JSON callbacks (JSONP) to execute arbitrary JavaScript code. This includes injecting malicious callback functions, manipulating existing callbacks, or exploiting JSONP endpoints for cross-site scripting attacks.
    
    Next Steps:
    1. Immediately block the source IP if confirmed malicious
    2. Review all JSONP endpoints for proper input validation
    3. Examine HTTP request logs for additional malicious callback attempts
    4. Check Content Security Policy (CSP) configuration
    5. Validate callback parameter sanitization on affected endpoints
    6. Monitor for successful code execution indicators
    7. Review authentication logs for account compromise
    8. Consider implementing strict callback whitelisting
  where: >
    (safe(log.callback, "") contains "<script" ||
     safe(log.callback, "") contains "javascript:" ||
     safe(log.callback, "") contains "eval(" ||
     safe(log.jsonp_callback, "") !~ "^[a-zA-Z_$][a-zA-Z0-9_$]*$" ||
     safe(log.error, "") contains "invalid callback" ||
     safe(log.security_event, "") == "jsonp_injection" ||
     (safe(log.request_parameter, "") == "callback" && 
      (safe(log.parameter_value, "") contains "alert(" || 
       safe(log.parameter_value, "") contains "document." ||
       safe(log.parameter_value, "") contains "window.")) ||
     safe(log.csp_violation, "") contains "jsonp" ||
     safe(log.blocked_action, "") == "callback_execution")
  deduplicateBy:
    - origin.ip
    - lastEvent.log.callback
