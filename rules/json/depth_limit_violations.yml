- id: 1009
  dataTypes:
    - json-input
  name: JSON Depth Limit Violation Detection
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Resource Exhaustion
  technique: Nested Structure Attack
  adversary: origin
  references:
    - https://danaepp.com/attacking-apis-using-json-injection
    - https://attack.mitre.org/techniques/T1499/002/
  description: |
    Detects attempts to send deeply nested JSON structures that could cause parser stack overflow, excessive memory usage, or denial of service conditions. This attack technique involves crafting JSON payloads with excessive nesting levels to overwhelm parsing resources and potentially crash applications.
    
    Next Steps:
    1. Examine the raw JSON payload in the log.raw field to confirm the nesting structure
    2. Check application logs for any parser errors, memory spikes, or service crashes
    3. Review the source IP for other suspicious JSON parsing attempts
    4. Validate JSON parsing configurations and depth limits in affected applications
    5. Consider implementing or adjusting JSON depth validation controls
    6. Monitor system resources (CPU, memory) during the timeframe of the alert
  where: >
    (safe(log.nesting_depth, 0) > 100) ||
    (safe(log.json_depth, 0) > 100) ||
    (safe(log.max_depth_exceeded, false) == true) ||
    (safe(log.error, "") contains "maximum depth") ||
    (safe(log.error, "") contains "nesting too deep") ||
    (safe(log.parser_error, "") contains "recursion limit") ||
    (safe(log.parser_error, "") contains "stack overflow") ||
    (safe(log.processing_time, 0) > 5000 && safe(log.json_depth, 0) > 50)
  afterEvents:
    - indexPattern: v11-log-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-10m
      count: 3
  deduplicateBy:
    - adversary.ip
