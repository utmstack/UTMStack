- id: 1022
  dataTypes:
    - json-input
  name: JSON Reference Loop Attack
  impact:
    confidentiality: 1
    integrity: 3
    availability: 3
  category: Resource Exhaustion
  technique: "T1499 - Endpoint Denial of Service"
  adversary: origin
  references:
    - https://bishopfox.com/blog/json-interoperability-vulnerabilities
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects attempts to create circular references or reference loops in JSON data that could lead to infinite loops, memory exhaustion, or parser crashes. This attack exploits JSON parsers that don't properly handle circular references.

    Next Steps:
    1. Investigate the source IP address and any associated user accounts
    2. Review application logs for patterns of similar attacks
    3. Check if the JSON parser has proper depth limits and circular reference detection
    4. Implement rate limiting for JSON processing endpoints
    5. Consider updating JSON parsing libraries to versions with better protection
    6. Monitor system resources (CPU, memory) for signs of exhaustion
    7. Block the attacking IP if confirmed malicious
  where: >
    (safe(log.error, "") contains "circular reference" ||
     safe(log.error, "") contains "reference loop" ||
     safe(log.error_type, "") == "circular_dependency" ||
     safe(log.parser_error, "") contains "maximum recursion" ||
     safe(log.message, "") contains "infinite loop detected" ||
     safe(log.json_depth, 0) > 100 ||
     (safe(log.error_code, "") == "ERR_JSON_CIRCULAR_REF" || 
      safe(log.error_code, "") == "ERR_MAX_RECURSION"))
  deduplicateBy:
    - origin.ip
