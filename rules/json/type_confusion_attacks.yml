- id: 1006
  dataTypes:
    - json-input
  name: JSON Type Confusion Attack Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Application Attack
  technique: Type Confusion
  adversary: origin
  references:
    - https://bishopfox.com/blog/json-interoperability-vulnerabilities
    - https://attack.mitre.org/techniques/T1055/
  description: |
    Detects attempts to exploit type confusion vulnerabilities in JSON parsing where attackers manipulate data types to bypass security controls or cause unexpected behavior. This attack can lead to privilege escalation, data corruption, or application crashes by sending unexpected data types to parsers that don't properly validate input.
    
    Next Steps:
    1. Examine the specific JSON payload and field that triggered the type confusion
    2. Review application logs for any errors or unexpected behavior following the attack
    3. Check if the attack resulted in any privilege escalation or unauthorized access
    4. Validate input sanitization and type checking mechanisms in the affected application
    5. Consider implementing stricter JSON schema validation
    6. Monitor for any subsequent malicious activity from the same source
  where: >
    (safe(log.algorithm, "") != "" && safe(log.expected_algorithm, "") != "" && log.algorithm != log.expected_algorithm) ||
    (safe(log.data_type_mismatch, false) == true) ||
    (safe(log.parser_error, "") contains "type mismatch") ||
    (safe(log.validation_error, "") contains "unexpected type") ||
    (safe(log.json_field_type, "") != "" && safe(log.expected_field_type, "") != "" && log.json_field_type != log.expected_field_type)
  deduplicateBy:
    - origin.ip
    - origin.host
