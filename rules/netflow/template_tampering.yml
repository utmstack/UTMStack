- id: 1025
  dataTypes:
    - netflow
  name: NetFlow Template Tampering Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Defense Evasion
  technique: "T1565 - Data Stored Object Manipulation"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1565/
    - https://www.cisco.com/en/US/technologies/tk648/tk362/technologies_white_paper09186a00800a3db9.html
  description: |
    Detects potential NetFlow template tampering by identifying flows with invalid or suspicious field combinations, abnormal timestamps, or flows that appear to be crafted to evade detection. This includes flows where FirstSwitched timestamp is greater than LastSwitched, identical input/output interfaces (excluding interface 0), or identical source and destination IP addresses.
    
    **Next Steps:**
    1. Verify the NetFlow exporter configuration and template definitions
    2. Check for any unauthorized modifications to NetFlow collection infrastructure
    3. Review network device logs for configuration changes or unauthorized access
    4. Analyze the source IP for other suspicious network activities
    5. Validate NetFlow data integrity by comparing with other network monitoring sources
    6. Consider implementing NetFlow template validation and monitoring controls
  where: (safe(log.FirstSwitched, "") != "" && safe(log.LastSwitched, "") != "" && safe(log.FirstSwitched, "") > safe(log.LastSwitched, "")) || (safe(log.InputInterface, "") == safe(log.OutputInterface, "") && safe(log.InputInterface, "") != "" && safe(log.InputInterface, "") != "0") || (safe(origin.ip, "") == safe(target.ip, "") && safe(origin.ip, "") != "")
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
