- id: 1012
  dataTypes:
    - netflow
  name: Protocol Distribution Anomaly Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Network Analysis
  technique: "T1046 - Network Service Discovery"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1046/
    - https://www.cisco.com/en/US/technologies/tk648/tk362/technologies_white_paper09186a00800a3db9.html
  description: |
    Detects significant changes in protocol distribution patterns that may indicate network reconnaissance, protocol abuse, or the presence of malicious traffic attempting to blend with normal protocols. This rule identifies unusual protocol usage patterns including uncommon protocol types, large data transfers on non-standard protocols, and significant changes in protocol distribution ratios.
    
    Next Steps:
    1. Investigate the source IP address for other suspicious activities
    2. Analyze the specific protocols being used and their typical usage patterns
    3. Review network flow data for the time period to identify baseline deviations
    4. Check for correlation with known attack indicators or threat intelligence
    5. Examine payload content if available to determine the nature of the traffic
    6. Consider implementing additional monitoring on the affected network segments
  where: |
    (
      safe(lastEvent.log.protocol, "") != "6" && 
      safe(lastEvent.log.protocol, "") != "17" && 
      safe(lastEvent.log.protocol, "") != "1" &&
      safe(lastEvent.log.bytes, 0) > 10485760
    ) ||
    (
      safe(lastEvent.log.protocol, "") == "41" ||
      safe(lastEvent.log.protocol, "") == "43" ||
      safe(lastEvent.log.protocol, "") == "44" ||
      safe(lastEvent.log.protocol, "") == "51" ||
      safe(lastEvent.log.protocol, "") == "58" ||
      safe(lastEvent.log.protocol, "") == "60"
    ) ||
    (
      safe(lastEvent.log.protocol_distribution_change, 0) > 30 &&
      safe(lastEvent.log.flow_count, 0) > 1000
    ) ||
    (
      safe(lastEvent.log.protocol, "") == "0" &&
      safe(lastEvent.log.bytes, 0) > 0
    )
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: lastEvent.log.protocol.keyword
          operator: filter_term
          value: '{{lastEvent.log.protocol}}'
      within: now-4h
      count: 100
  deduplicateBy:
    - origin.ip
    - lastEvent.log.protocol
