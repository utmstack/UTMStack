- id: 1017
  dataTypes:
    - netflow
  name: SNMP Reflection Attack Detection
  impact:
    confidentiality: 2
    integrity: 1
    availability: 3
  category: DDoS Attack
  technique: Network Denial of Service
  adversary: origin
  references:
    - https://www.us-cert.gov/ncas/alerts/TA14-017A
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects potential SNMP reflection attacks by identifying suspicious SNMP traffic patterns on port 161 with high volume or packet counts. SNMP reflection attacks exploit misconfigured SNMP devices to amplify attack traffic.

    Next Steps:
    1. Verify the source IP is legitimate and not spoofed
    2. Check if SNMP devices in your network are properly configured with community strings
    3. Implement rate limiting on SNMP traffic
    4. Block traffic from known reflection sources
    5. Monitor for additional reflection attack patterns
    6. Consider disabling SNMP on internet-facing devices if not required
  where: (safe(target.port, 0) == 161 || safe(origin.port, 0) == 161) && safe(protocol, "") == "17" && (safe(target.bytesSent, 0) > 5000 || safe(origin.bytesSent, 0) > 5000 || safe(target.packagesSent, 0) > 20 || safe(origin.packagesSent, 0) > 20)
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: target.port
          operator: filter_term
          value: '161'
      within: now-5m
      count: 50
  deduplicateBy:
    - origin.ip
    - target.ip
