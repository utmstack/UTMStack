- id: 1003
  dataTypes:
    - netflow
  name: Abnormal Connection Pattern Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: Command and Control
  technique: Command and Control
  adversary: origin
  references:
    - https://www.cisco.com/en/US/technologies/tk648/tk362/technologies_white_paper09186a00800a3db9.html
    - https://attack.mitre.org/tactics/TA0011/
  description: |
    Detects unusual connection patterns including rapid connections to multiple hosts, unusual port combinations, or connections to rare ports that could indicate reconnaissance, lateral movement, or command and control activity. This rule triggers when a source IP makes connections to high ports (>1024) with small packet counts, potentially indicating scanning or automated communication.
    
    Next Steps:
    1. Investigate the source IP's recent connection history and geolocation
    2. Analyze the target ports and destinations to identify potential attack patterns
    3. Check for additional network anomalies from the same source
    4. Review endpoint activity on the source system for signs of compromise
    5. Correlate with threat intelligence feeds for known C2 infrastructure
    6. Consider blocking the source IP if malicious activity is confirmed
  where: |
    safe(origin.ip, "") != "" &&
    safe(target.port, 0) > 1024 &&
    safe(target.port, 0) != 3389 &&
    safe(target.port, 0) != 8080 &&
    safe(target.port, 0) != 8443 &&
    safe(protocol, "") != "" &&
    safe(log.packets, 0) < 100
  afterEvents:
    - indexPattern: v11-log-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-5m
      count: 20
  deduplicateBy:
    - origin.ip
