- id: 1009
  dataTypes:
    - netflow
  name: Peer-to-Peer Traffic Detection
  impact:
    confidentiality: 2
    integrity: 2
    availability: 3
  category: Unauthorized Network Activity
  technique: "T1572 - Protocol Tunneling"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1572/
    - https://www.cisco.com/en/US/technologies/tk648/tk362/technologies_white_paper09186a00800a3db9.html
  description: |
    Detects potential peer-to-peer traffic based on high port numbers and bidirectional data flows characteristic of P2P applications. P2P protocols often use high, non-standard port numbers and exhibit specific traffic patterns that can indicate unauthorized file sharing, cryptocurrency mining, or other P2P activities that may violate organizational policies or consume excessive bandwidth.
    
    Next Steps:
    1. Verify if the detected traffic is authorized P2P activity
    2. Check the application or process generating the traffic
    3. Analyze traffic patterns to determine if it's legitimate business communication
    4. Review network policies regarding P2P applications
    5. Consider blocking P2P traffic if not business-justified
    6. Monitor for potential data exfiltration or malware communication
  where: safe(origin.ip, "") != "" && safe(target.ip, "") != "" && safe(origin.port, 0) > 6000 && safe(target.port, 0) > 6000 && safe(origin.bytesSent, 0) > 100000 && safe(protocol, "") == "6"
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: dataType.keyword
          operator: filter_term
          value: netflow
      within: now-30m
      count: 15
  deduplicateBy:
    - origin.ip
