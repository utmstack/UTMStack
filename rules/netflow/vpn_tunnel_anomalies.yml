- id: 1011
  dataTypes:
    - netflow
  name: VPN Tunnel Anomalies Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Security
  technique: "T1572 - Protocol Tunneling"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1572/
    - https://www.cisco.com/c/en/us/td/docs/security/asa/special/netflow/asa_netflow.html
  description: |
    Detects anomalies in VPN tunnel traffic patterns including unusual data volumes, connection patterns, or protocol violations that may indicate compromised VPN credentials or tunnel exploitation. This rule monitors IPSec (ports 500/4500), OpenVPN (port 1194), PPTP (port 1723), ESP (protocol 50), and GRE (protocol 47) traffic for suspicious patterns.
    
    **Next Steps:**
    1. Investigate the source IP for previous VPN authentication events and verify legitimate user access
    2. Check VPN server logs for any authentication anomalies or failed login attempts from the same IP
    3. Analyze the data volume and connection patterns to determine if they match normal user behavior
    4. Verify if the VPN credentials associated with this traffic are compromised by checking for concurrent logins from different locations
    5. Review network traffic logs to identify any data exfiltration or lateral movement attempts
    6. Consider temporarily disabling the affected VPN account pending investigation
  where: |
    (
      (safe(origin.port, 0) == 500 || safe(origin.port, 0) == 4500 || 
       safe(target.port, 0) == 500 || safe(target.port, 0) == 4500 ||
       safe(origin.port, 0) == 1194 || safe(target.port, 0) == 1194 ||
       safe(origin.port, 0) == 1723 || safe(target.port, 0) == 1723) &&
      (
        safe(origin.bytesSent, 0) > 104857600 ||
        safe(origin.packagesSent, 0) > 100000 ||
        safe(log.duration, 0) < 5
      )
    ) ||
    (
      safe(protocol, "") == "50" && 
      safe(origin.bytesSent, 0) > 52428800
    ) ||
    (
      safe(protocol, "") == "47" &&
      safe(log.flow_count, 0) > 50
    )
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-1h
      count: 10
  deduplicateBy:
    - origin.ip
    - target.ip
