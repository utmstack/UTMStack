- id: 1024
  dataTypes:
    - netflow
  name: NetFlow Collector Overload Attack
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Denial of Service
  technique: Network Denial of Service
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1498/
    - https://www.cisco.com/c/en/us/support/docs/security/secure-network-analytics-flow-collector-4300/222009-troubleshoot-netflow-ipfix-telemetry-ing.html
  description: |
    Detects potential NetFlow collector overload attacks by identifying excessive flow records from a single source or unusually high packet rates that could overwhelm the collector infrastructure. This type of attack can cause denial of service by flooding the NetFlow collector with malicious or excessive flow data.

    Next Steps:
    1. Immediately investigate the source IP address and determine if it's a legitimate network device
    2. Check NetFlow collector performance metrics and resource utilization
    3. Review network traffic patterns to identify if this is part of a larger DDoS attack
    4. Consider implementing rate limiting or filtering rules for the source IP
    5. Verify collector configuration and capacity planning
    6. Monitor for similar patterns from other source IPs that might indicate a coordinated attack
  where: safe(origin.ip, "") != "" && (safe(log.PacketCount, 0) > 10000 || safe(log.ByteCount, 0) > 10000000)
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-1m
      count: 100
  deduplicateBy:
    - origin.ip
    - target.ip
