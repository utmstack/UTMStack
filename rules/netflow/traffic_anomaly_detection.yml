- id: 1001
  dataTypes:
    - netflow
  name: Unusual Traffic Volume Anomaly Detection
  impact:
    confidentiality: 2
    integrity: 1
    availability: 3
  category: Network Activity
  technique: "T1048 - Exfiltration Over Alternative Protocol"
  adversary: origin
  references:
    - https://www.cisco.com/en/US/technologies/tk648/tk362/technologies_white_paper09186a00800a3db9.html
    - https://attack.mitre.org/techniques/T1048/
  description: |
    Detects unusual traffic volumes that could indicate data exfiltration, DDoS attacks, or other anomalous network behavior. This rule triggers when a single source IP generates traffic exceeding normal thresholds within a short time window.
    
    Next Steps:
    1. Investigate the source IP address and its geolocation
    2. Review the destination IPs and ports involved in the high-volume traffic
    3. Analyze the timing patterns of the traffic to identify if it's automated
    4. Check if the source IP is internal or external to your network
    5. Review firewall logs and network monitoring tools for additional context
    6. If confirmed malicious, implement IP blocking and investigate potential data compromise
    7. Monitor for similar patterns from other IP addresses
  where: |
    safe(origin.ip, "") != "" && 
    safe(origin.bytesSent, 0) > 10000000 &&
    safe(origin.packagesSent, 0) > 10000
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-15m
      count: 3
  deduplicateBy:
    - origin.ip
    - target.ip
