- id: 1022
  dataTypes:
    - netflow
  name: Service Discovery Patterns in NetFlow
  impact:
    confidentiality: 2
    integrity: 1
    availability: 1
  category: Network Reconnaissance
  technique: "T1046 - Network Service Scanning"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1046/
    - https://www.iana.org/assignments/ipfix/ipfix.xhtml
  description: |
    Detects service discovery patterns where a single source is probing multiple common service ports across different targets, indicating systematic service enumeration. This behavior is commonly observed during reconnaissance phases of attacks where adversaries scan for available services.
    
    Next Steps:
    1. Investigate the source IP address for legitimacy and ownership
    2. Check if the scanning activity corresponds to authorized vulnerability assessments
    3. Review firewall and IDS logs for additional suspicious activity from the same source
    4. Examine target systems for any successful connections or exploitation attempts
    5. Consider blocking the source IP if unauthorized scanning is confirmed
    6. Monitor for privilege escalation or lateral movement attempts from compromised systems
  where: safe(origin.ip, "") != "" && safe(target.ip, "") != "" && safe(target.port, 0) in [21, 22, 23, 25, 80, 110, 139, 143, 443, 445, 1433, 1521, 3306, 3389, 5432, 5900, 8080, 8443, 9090]
  afterEvents:
    - indexPattern: v11-log-netflow-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-10m
      count: 15
  deduplicateBy:
    - origin.ip
