- id: 1015
  dataTypes:
    - netflow
  name: DNS Query Anomaly Detection
  impact:
    confidentiality: 3
    integrity: 2
    availability: 2
  category: DNS Security
  technique: "T1071.004 - DNS Tunneling"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1071/004/
    - https://www.cisco.com/c/en/us/td/docs/net_mgmt/netflow_collection_engine/3-6/user/guide/format.html
  description: |
    Detects anomalous DNS query patterns including DNS tunneling, DGA domains, excessive queries, cache poisoning attempts, and suspicious query types that may indicate malware communication or data exfiltration. This rule identifies suspicious DNS traffic patterns such as oversized queries/responses, excessive query volumes, unusual query types, TCP-based DNS queries, and unauthorized DNS servers.
    
    Next Steps:
    1. Investigate the source IP address for other suspicious network activity
    2. Analyze DNS query logs for the specific domains being queried
    3. Check if the queries contain encoded data or random-looking domain names
    4. Verify if the DNS server being used is authorized for the network
    5. Look for patterns of data exfiltration through DNS responses
    6. Examine query timing patterns for potential C2 communication
    7. Cross-reference with threat intelligence feeds for known malicious domains
    8. Monitor for additional anomalous DNS behavior from the same source
    9. Consider blocking the source IP if malicious activity is confirmed
    10. Review network configuration to ensure proper DNS filtering is in place
  where: |
    (
      (safe(target.port, 0) == 53 || safe(origin.port, 0) == 53) &&
      (
        safe(log.bytes, 0) > 512 && safe(protocol, "") == "17" ||
        safe(log.query_count, 0) > 1000 ||
        safe(log.unique_domains, 0) > 100 ||
        safe(log.txt_queries, 0) > 10 ||
        safe(log.failed_queries, 0) > 50
      )
    ) ||
    (
      safe(target.port, 0) == 53 &&
      safe(log.query_length, 0) > 100
    ) ||
    (
      safe(target.port, 0) == 53 &&
      safe(log.subdomain_depth, 0) > 5
    ) ||
    (
      (safe(target.port, 0) == 53 || safe(origin.port, 0) == 53) &&
      safe(protocol, "") == "6"
    ) ||
    (
      safe(target.port, 0) == 53 &&
      safe(log.non_standard_query_type, "false") == "true"
    ) ||
    (
      safe(target.port, 0) == 53 &&
      safe(log.response_size, 0) > 4096
    ) ||
    (
      safe(origin.port, 0) == 53 &&
      safe(origin.ip, "") != safe(log.authorized_dns_server, "")
    )
  deduplicateBy:
    - origin.ip
    - target.ip
