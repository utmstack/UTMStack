- id: 1014
  dataTypes:
    - netflow
  name: Traffic Redirection and Hijacking Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Manipulation
  technique: Man-in-the-Middle
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1557/
    - https://documentation.meraki.com/MX/Monitoring_and_Reporting/NetFlow_Overview
  description: |
    Detects potential traffic redirection, BGP hijacking, or man-in-the-middle attacks by identifying unusual routing patterns, unexpected next-hop changes, or traffic flowing through suspicious intermediate nodes. This rule monitors for anomalous network behaviors including BGP route modifications, TTL variance indicating rerouting, asymmetric routing patterns, and traffic flowing through unexpected geographic locations.

    Next Steps:
    1. Investigate the source and destination IPs involved in the traffic redirection
    2. Check BGP routing tables for unauthorized route advertisements or hijacking
    3. Analyze network topology to identify if traffic is taking unexpected paths
    4. Review firewall and router logs for configuration changes
    5. Verify if the next-hop changes are authorized maintenance activities
    6. Check for DNS poisoning or ARP spoofing attacks that could redirect traffic
    7. Correlate with threat intelligence feeds for known malicious infrastructure
    8. Monitor for data exfiltration attempts through redirected traffic
    9. Contact network administrators to verify any recent routing changes
    10. Consider implementing additional network monitoring for affected segments
  where: |
    (
      safe(log.next_hop_changed, "false") == "true" &&
      safe(log.flow_count, 0) > 100
    ) ||
    (
      safe(log.bgp_next_hop, "") != safe(log.expected_next_hop, "") &&
      safe(log.bytes, 0) > 10485760
    ) ||
    (
      safe(log.ttl_variance, 0) > 5 &&
      safe(origin.ip, "") == safe(log.previous_origin_ip, "")
    ) ||
    (
      safe(target.port, 0) == 179 && 
      safe(log.bgp_updates, 0) > 50
    ) ||
    (
      safe(log.route_changed, "false") == "true" &&
      safe(log.sensitive_traffic, "false") == "true"
    ) ||
    (
      safe(origin.geolocation.country, "") != safe(log.expected_country, "") &&
      safe(log.critical_infrastructure, "false") == "true"
    ) ||
    (
      safe(log.asymmetric_routing, "false") == "true" &&
      safe(log.bytes, 0) > 52428800
    )
  afterEvents:
    - indexPattern: v11-log-*
      with:
        - field: target.ip.keyword
          operator: filter_term
          value: '{{target.ip}}'
      within: now-2h
      count: 20
  deduplicateBy:
    - origin.ip
    - target.ip
    - log.next_hop
