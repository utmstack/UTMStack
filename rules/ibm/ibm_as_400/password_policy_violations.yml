- id: 1006
  dataTypes:
    - ibm-as400
  name: IBM AS/400 Password Policy Violations
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Account Management
  technique: "T1201 - Password Policy Discovery"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/i/7.4?topic=entries-audit-journal-qaudjrn-entry-types
    - https://attack.mitre.org/techniques/T1201/
  description: |
    Detects password policy violations on IBM AS/400 systems including invalid password attempts, password expiration issues, and password composition violations. These events may indicate attempts to bypass security controls or compromised accounts.
    
    Next Steps:
    - Investigate the affected user account for signs of compromise
    - Review recent authentication attempts from the same user or IP
    - Check if this is part of a pattern of policy violations
    - Verify if the user needs password reset assistance or security awareness training
    - Monitor for any successful authentications following these violations
  where: |
    safe(log.event_type, "") in ["PW", "VP"] && 
    (
      safe(log.message, "").contains("password policy") ||
      safe(log.message, "").contains("Password policy") ||
      safe(log.message, "").contains("password expired") ||
      safe(log.message, "").contains("Password expired") ||
      safe(log.message, "").contains("password invalid") ||
      safe(log.message, "").contains("Password invalid") ||
      safe(log.message, "").contains("password composition") ||
      safe(log.message, "").contains("Password composition") ||
      safe(log.message, "").contains("password reuse") ||
      safe(log.message, "").contains("Password reuse") ||
      safe(log.message, "").contains("password minimum") ||
      safe(log.message, "").contains("Password minimum")
    )
  deduplicateBy:
    - origin.user
