- id: 1002
  dataTypes:
    - ibm-as400
  name: IBM AS/400 Object Authority Violation Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Access Control
  technique: "T1078.003 - Valid Accounts: Local Accounts"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/i/7.5?topic=entries-af-authority-failure-journal
    - https://attack.mitre.org/techniques/T1078/003/
  description: |
    Detects object authority violations and authorization failures in IBM AS/400 systems indicating potential unauthorized access attempts. This rule identifies various authority failure patterns including AF journal entries, explicit authority failures, and access denied messages.
    
    Next Steps:
    1. Identify the user account involved in the authority violation
    2. Review the specific object or resource that was accessed
    3. Verify if the access attempt was legitimate business activity
    4. Check user permissions and role assignments
    5. Investigate any recent changes to user privileges
    6. Review surrounding log entries for additional context
    7. Consider implementing additional access controls if needed
  where: |
    safe(log.message, "") != "" && 
    (
      (contains(safe(log.message, ""), "AF") && contains(safe(log.message, ""), "Authority")) ||
      contains(safe(log.message, ""), "authority failure") ||
      contains(safe(log.message, ""), "authorization failed") ||
      contains(safe(log.message, ""), "access denied") ||
      contains(safe(log.message, ""), "not authorized to") ||
      contains(safe(log.message, ""), "insufficient authority") ||
      contains(safe(log.message, ""), "object authority") ||
      contains(safe(log.message, ""), "AUTFAIL")
    )
  afterEvents:
    - indexPattern: v11-log-ibm-as400-*
      with:
        - field: log.message
          operator: filter_match
          value: "authority failure"
      within: now-30m
      count: 5
  deduplicateBy:
    - adversary.user
    - adversary.host
