- id: 1014
  dataTypes:
    - ibm-aix
  name: IBM AIX Firewall Policy Violation
  impact:
    confidentiality: 2
    integrity: 2
    availability: 3
  category: Network Security
  technique: "T1210 - Exploitation of Remote Services"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/aix/7.2?topic=security-ip-security-firewall
    - https://attack.mitre.org/techniques/T1210/
  description: |
    Detects firewall policy violations on IBM AIX systems, including blocked connections, unauthorized access attempts, and potential security breach attempts through the firewall.
    
    Next Steps:
    1. Review the source IP address and port to determine if this is a legitimate connection attempt
    2. Check if the blocked connection is part of a larger pattern of attacks from the same source
    3. Verify firewall rules are correctly configured and not blocking legitimate traffic
    4. If malicious, consider blocking the source IP at the network perimeter
    5. Review system logs for any successful connections from the same source
    6. Document the incident and update firewall rules if necessary
  where: >
    (
      safe(log.eventType, "") == "ipfwall" ||
      safe(log.eventType, "") == "ipf" ||
      safe(log.eventType, "") == "firewall" ||
      safe(action, "").contains("DENY") ||
      safe(action, "").contains("BLOCK") ||
      safe(action, "").contains("REJECT")
    ) && 
    (
      safe(log.message, "").contains("denied") ||
      safe(log.message, "").contains("blocked") ||
      safe(log.message, "").contains("rejected") ||
      safe(log.message, "").contains("policy violation") ||
      safe(log.message, "").contains("unauthorized access") ||
      safe(log.message, "").contains("firewall rule") ||
      safe(origin.port, 0) > 0
    )
  afterEvents:
    - indexPattern: v11-log-ibm-aix-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: origin.port
          operator: filter_term
          value: '{{origin.port}}'
      within: now-5m
      count: 20
  deduplicateBy:
    - origin.ip
    - origin.port
