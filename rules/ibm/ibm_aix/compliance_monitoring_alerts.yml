- id: 1016
  dataTypes:
    - ibm-aix
  name: IBM AIX Compliance Monitoring Alerts
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Compliance
  technique: "T1518.001 - Security Software Discovery"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/aix/7.2?topic=subsystem-compliance-monitoring
    - https://attack.mitre.org/techniques/T1518/001/
  description: |
    Detects compliance monitoring events and security policy violations in IBM AIX systems, including failed security checks, policy exceptions, and compliance scan failures.
    
    Next Steps:
    1. Review the specific compliance failure or policy violation in the log details
    2. Check if the user account involved has appropriate permissions for the attempted action
    3. Verify if this is a legitimate security check or potential security bypass attempt
    4. Review audit logs for any related suspicious activities from the same user or host
    5. If audit command failed (returnCode != 0), investigate what audit operation was attempted
    6. Check system compliance status and ensure all security policies are properly configured
  where: (safe(log.eventType, "") == "COMPLIANCE_FAIL" || safe(log.eventType, "") == "POLICY_VIOLATION") || (safe(log.msg, "").contains("compliance") && (safe(log.msg, "").contains("failed") || safe(log.msg, "").contains("violation"))) || (safe(action, "") == "AUDIT" && safe(log.returnCode, "") != "0") || (safe(log.commandType, "") == "audit" && safe(log.returnCode, "") != "0")
  deduplicateBy:
    - origin.user
    - from.host
