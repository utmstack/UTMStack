- id: 1004
  dataTypes:
    - ibm-aix
  name: IBM AIX Enhanced RBAC Privilege Abuse
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Privilege Escalation
  technique: "T1078 - Valid Accounts"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/aix/7.2?topic=rbac-enhanced-role-based-access-control
    - https://attack.mitre.org/techniques/T1078/
  description: |
    Detects abuse of Enhanced RBAC features in IBM AIX 7.1+, including excessive use of privileged commands, unauthorized role switching, or suspicious patterns in RBAC command execution.
    
    Next Steps:
    1. Review the user account that triggered this alert - verify if they have legitimate access to execute these privileged commands
    2. Check the specific commands executed (lspv, lsvg, lsdev, lscfg, lsattr) to understand what system information was accessed
    3. Review audit logs for any role changes or privilege modifications around the same timeframe
    4. If USER_Role events with non-zero return codes are detected, investigate failed role switching attempts
    5. Check if the user ID differs from the OS user ID, which may indicate privilege escalation
    6. Contact the user or their manager to verify if this activity was authorized
    7. Review RBAC configuration to ensure proper role assignments and restrictions are in place
  where: (safe(log.commandType, "").matches("^(lspv|lsvg|lsdev|lscfg|lsattr)$") && safe(origin.user, "") != "root") || (safe(log.message, "").contains("RBAC") && safe(log.message, "").contains("privilege") && safe(action, "") != "") || (safe(log.eventType, "") == "USER_Role" && safe(log.returnCode, "") != "0") || (safe(log.osUserID, "") != safe(log.osUserID, "") && safe(action, "").contains("EXEC"))
  afterEvents:
    - indexPattern: v11-log-ibm-aix-*
      with:
        - field: origin.user.keyword
          operator: filter_term
          value: '{{origin.user}}'
        - field: log.commandType.keyword
          operator: filter_match
          value: 'ls*'
      within: now-10m
      count: 20
  deduplicateBy:
    - adversary.user
    - lastEvent.log.commandType
