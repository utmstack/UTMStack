- id: 1025
  dataTypes:
    - ibm-aix
  name: IBM AIX Core Dump Security Analysis
  impact:
    confidentiality: 3
    integrity: 2
    availability: 3
  category: Security Events
  technique: "T1055 - Process Injection"
  adversary: origin
  references:
    - https://www.halock.com/configuring-log-event-source-series-ibm-aix/
    - https://attack.mitre.org/techniques/T1055/
  description: |
    Detects and analyzes core dump events in IBM AIX that could indicate process crashes due to exploitation attempts, buffer overflows, or malicious code execution. Core dumps can be signs of:
    - Buffer overflow exploitation attempts
    - Process injection techniques
    - Memory corruption attacks
    - System instability from malicious activity
    
    Next Steps:
    1. Identify the process that created the core dump from log.pid and log.objName fields
    2. Review the process command line and user context from origin.user
    3. Check if the core dump was from a critical system process or user application
    4. Analyze the core dump file if available to determine the cause of the crash
    5. Look for any suspicious activity from the same user or process before the crash
    6. Verify if this is a known application issue or potential security incident
    7. If suspicious, isolate the affected system and conduct forensic analysis
  where: (safe(log.eventType, "") != "" && (safe(log.eventType, "").toLowerCase().contains("core") || safe(log.eventType, "").toLowerCase().contains("dump") || safe(log.eventType, "").toLowerCase().contains("segfault") || safe(log.eventType, "").toLowerCase().contains("sigsegv"))) || (safe(log.msg, "") != "" && (safe(log.msg, "").toLowerCase().contains("core dumped") || safe(log.msg, "").toLowerCase().contains("segmentation fault") || safe(log.msg, "").toLowerCase().contains("memory violation") || safe(log.msg, "").toLowerCase().contains("buffer overflow"))) || (safe(origin.command, "") != "" && safe(origin.command, "").toLowerCase().contains("core"))
  deduplicateBy:
    - origin.user
    - log.pid
    - target.host
