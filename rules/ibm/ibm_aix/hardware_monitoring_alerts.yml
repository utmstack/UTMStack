- id: 1023
  dataTypes:
    - ibm-aix
  name: IBM AIX Hardware Monitoring Alerts
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Hardware Events
  technique: "T1529 - System Shutdown/Reboot"
  adversary: origin
  references:
    - https://www.ibm.com/support/pages/ibm-aix-how-store-error-log-errpt-messages-local-and-remote-syslog-files
    - https://attack.mitre.org/techniques/T1529/
  description: |
    Monitors hardware-related events and failures in IBM AIX systems including disk failures, memory errors, CPU faults, and other hardware anomalies that could indicate impending system failure or tampering.
    
    Next Steps:
    1. Immediately check the affected system's hardware status using 'errpt -a' command
    2. Review system diagnostics with 'diag' command for detailed hardware analysis
    3. Check for recent hardware changes or physical access to the system
    4. If disk errors: Run 'lspv' and 'lsvg' to check disk and volume group status
    5. If memory errors: Run 'lsattr -El mem0' to check memory configuration
    6. Monitor system performance for degradation using 'topas' or 'nmon'
    7. Schedule emergency maintenance if critical hardware failure is imminent
    8. Document all hardware events for trend analysis and preventive maintenance
  where: safe(log.eventType, "") != "" && safe(from.host, "") != "" && (safe(log.eventType, "").toLowerCase().contains("hardware") || safe(log.eventType, "").toLowerCase().contains("disk") || safe(log.eventType, "").toLowerCase().contains("memory") || safe(log.eventType, "").toLowerCase().contains("cpu") || safe(log.eventType, "").toLowerCase().contains("errpt") || safe(log.msg, "").toLowerCase().contains("hardware error") || safe(log.msg, "").toLowerCase().contains("disk failure") || safe(log.msg, "").toLowerCase().contains("memory fault") || safe(log.msg, "").toLowerCase().contains("sysplanar"))
  deduplicateBy:
    - lastEvent.target.host
    - lastEvent.log.eventType
