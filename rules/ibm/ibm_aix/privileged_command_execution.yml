- id: 1019
  dataTypes:
    - ibm-aix
  name: IBM AIX Privileged Command Execution
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Privilege Escalation
  technique: "T1548.003 - Abuse Elevation Control Mechanism: Sudo and Sudo Caching"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/aix/7.2?topic=commands-privileged-command-database
    - https://attack.mitre.org/techniques/T1548/003/
  description: |
    Detects execution of privileged commands by users in IBM AIX systems, including sudo usage, setuid/setgid command execution, and privileged shell access. This rule monitors for various indicators of privilege escalation attempts or legitimate privileged operations that may warrant security review.
    
    Next Steps:
    1. Verify if the privileged command execution was authorized and legitimate
    2. Check the user account performing the privileged actions for suspicious activity
    3. Review the specific command executed and its context
    4. Examine system logs for any unauthorized privilege escalation attempts
    5. Validate that proper approval processes were followed for privileged access
    6. Monitor for any subsequent suspicious activities from the same user or system
    7. Consider implementing additional monitoring for the affected user account
    8. Review audit trails to determine if the privilege escalation aligns with business requirements
    9. Check for any policy violations related to privileged access management
    10. Investigate the source of the command execution and validate the authentication chain
  where: |
    (safe(log.commandType, "") == "sudo" || safe(log.commandType, "") == "su") ||
    (safe(origin.command, "").contains("sudo") || safe(origin.command, "").contains("su ")) ||
    (safe(log.eventType, "") == "PRIV_CMD" || safe(log.eventType, "") == "SETUID_EXEC") ||
    (safe(action, "").contains("PRIVILEGED") || safe(action, "").contains("ELEVATED")) ||
    (safe(log.msg, "").contains("privilege") && safe(log.msg, "").contains("command")) ||
    (safe(origin.user, "") != "root" && 
     (safe(origin.command, "").contains("chmod") || 
      safe(origin.command, "").contains("chown") || 
      safe(origin.command, "").contains("mount")))
  deduplicateBy:
    - origin.user
    - origin.host
