- id: 1012
  dataTypes:
    - ibm-aix
  name: IBM AIX Kerberos Authentication Anomaly
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Authentication
  technique: "T1558.003 - Steal or Forge Kerberos Tickets: Kerberoasting"
  adversary: origin
  references:
    - https://www.ibm.com/docs/en/aix/7.2?topic=kerberos-network-authentication-service
    - https://attack.mitre.org/techniques/T1558/003/
  description: |
    Detects anomalous Kerberos authentication events on IBM AIX systems, including failed authentication attempts, ticket manipulation, and potential Kerberos attacks. This rule monitors for various Kerberos-related error conditions and suspicious authentication patterns that may indicate an attack.
    
    Next Steps:
    1. Verify the affected user account and check for legitimate authentication attempts
    2. Review the timing and frequency of authentication failures
    3. Investigate the source IP address for other suspicious activities
    4. Check for any unusual service ticket requests or ticket manipulation
    5. Monitor for privilege escalation attempts following authentication events
    6. Consider implementing additional monitoring for the affected user account
  where: >
    (
      safe(log.eventType, "") == "krb5kdc" ||
      safe(log.eventType, "") == "kadmind" ||
      safe(log.eventType, "") == "auth" ||
      safe(log.msg, "").contains("krb5") ||
      safe(log.msg, "").contains("kerberos")
    ) && 
    (
      safe(log.msg, "").contains("authentication failed") ||
      safe(log.msg, "").contains("preauthentication failed") ||
      safe(log.msg, "").contains("ticket expired") ||
      safe(log.msg, "").contains("invalid ticket") ||
      safe(log.msg, "").contains("KDC_ERR") ||
      safe(log.msg, "").contains("TGT request") ||
      safe(action, "").contains("LOGON")
    )
  afterEvents:
    - indexPattern: v11-log-ibm-aix-*
      with:
        - field: log.osUserID.keyword
          operator: filter_term
          value: '{{log.osUserID}}'
      within: now-5m
      count: 10
  deduplicateBy:
    - origin.user
    - origin.host
