# Rule version v1.0.0

dataTypes:
  - redis
name: Redis Persistence Mechanism Abuse Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1505: Server Software Component"
adversary: origin
references:
  - https://medium.com/@knownsec404team/rce-exploits-of-redis-based-on-master-slave-replication-ef7a664ce1d0
  - https://attack.mitre.org/techniques/T1505/
description: |
  Detects attempts to abuse Redis persistence mechanisms for maintaining unauthorized access, including suspicious RDB/AOF operations, module loading for backdoors, or configuration changes to establish persistence.
  
  Next Steps:
  1. Immediately review the Redis server configuration changes and module operations
  2. Check if any unauthorized modules were loaded using MODULE LIST command
  3. Examine Redis data directory for suspicious files (crontab, authorized_keys, shell scripts)
  4. Review Redis access logs for the source IP and authentication method used
  5. Verify if RDB/AOF files have been written to unusual locations
  6. Check system cron jobs and SSH authorized_keys for signs of compromise
  7. Consider rotating Redis passwords and implementing ACL restrictions
  8. Enable Redis command logging if not already active for forensic analysis
where: |
  exists("log.message") && (
    (regexMatch("log.message", "(?i)CONFIG\\s+SET\\s+(save|appendonly|appendfsync|aof-rewrite)")) ||
    (regexMatch("log.message", "(?i)MODULE\\s+LOAD\\s+") && !regexMatch("log.message", "(?i)(redis[_-]?search|redis[_-]?graph|redis[_-]?timeseries|redis[_-]?json|redis[_-]?bloom)")) ||
    (regexMatch("log.message", "(?i)CONFIG\\s+SET\\s+dir\\s+/(root|home|usr|etc|var/spool/cron)")) ||
    (regexMatch("log.message", "(?i)CONFIG\\s+SET\\s+dbfilename\\s+(crontab|authorized_keys|passwd|shadow|\\.bashrc|\\.profile)")) ||
    (regexMatch("log.message", "(?i)(BGREWRITEAOF|BGSAVE)") && regexMatch("log.message", "(?i)(ssh|cron|bash|shell)")) ||
    (equals("log.roleEnc", "master") && regexMatch("log.message", "(?i)Synchronization\\s+with\\s+replica.*module\\s+load")) ||
    (regexMatch("log.message", "(?i)MODULE\\s+(LIST|UNLOAD)") && equals("log.levelEnc", "error"))
  )
groupBy:
  - adversary.host
  - adversary.ip
