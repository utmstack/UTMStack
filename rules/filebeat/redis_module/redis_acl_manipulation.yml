# Rule version v1.0.0

dataTypes:
  - redis
name: Redis ACL Manipulation Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1098 - Account Manipulation"
adversary: origin
references:
  - https://redis.io/docs/latest/operate/oss_and_stack/management/security/acl/
  - https://attack.mitre.org/techniques/T1098/
description: |
  Detects manipulation of Redis ACL to create backdoor accounts, modify existing user permissions, or disable authentication. Attackers use ACL SETUSER to create persistent access with full privileges.

  Next Steps:
  1. Review the ACL changes to identify unauthorized user modifications
  2. List all current Redis users with ACL LIST
  3. Remove unauthorized user accounts
  4. Verify the default user is properly restricted
  5. Check for requirepass/masterauth changes
  6. Implement ACL file persistence and monitoring
where: |
  exists("log.message") &&
  (
    regexMatch("log.message", "(?i)ACL\\s+SETUSER") ||
    regexMatch("log.message", "(?i)ACL\\s+DELUSER") ||
    regexMatch("log.message", "(?i)ACL\\s+SAVE") ||
    regexMatch("log.message", "(?i)ACL\\s+LOAD") ||
    regexMatch("log.message", "(?i)CONFIG\\s+SET\\s+requirepass") ||
    regexMatch("log.message", "(?i)CONFIG\\s+SET\\s+masterauth") ||
    (contains("log.message", "ACL SETUSER") && contains("log.message", "allcommands")) ||
    (contains("log.message", "ACL SETUSER") && contains("log.message", "allkeys"))
  )
afterEvents:
  - indexPattern: v11-log-redis-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-10m
    count: 3
groupBy:
  - adversary.host
  - adversary.user
