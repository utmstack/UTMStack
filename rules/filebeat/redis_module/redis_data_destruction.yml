# Rule version v1.0.0

dataTypes:
  - redis
name: Redis Data Destruction Detection
impact:
  confidentiality: 1
  integrity: 3
  availability: 3
category: Data Destruction
technique: "T1485 - Data Destruction"
adversary: origin
references:
  - https://redis.io/docs/latest/commands/flushall/
  - https://attack.mitre.org/techniques/T1485/
description: |
  Detects Redis data destruction commands including FLUSHALL, FLUSHDB, and DEBUG SLEEP that could indicate an attacker wiping data or preparing for ransomware. These commands irreversibly delete all data from Redis databases.

  Next Steps:
  1. Verify if the FLUSH command was authorized
  2. Check if RDB/AOF persistence files are intact for recovery
  3. Identify the source of the destructive command
  4. Restore data from backups immediately if unauthorized
  5. Restrict FLUSH commands via Redis ACL
  6. Monitor for ransom messages or follow-up demands
where: |
  exists("log.message") &&
  (
    regexMatch("log.message", "(?i)FLUSHALL") ||
    regexMatch("log.message", "(?i)FLUSHDB") ||
    regexMatch("log.message", "(?i)DEBUG\\s+SET-ACTIVE-EXPIRE") ||
    (contains("log.message", "CONFIG SET") && contains("log.message", "save") && contains("log.message", "\"\"")) ||
    regexMatch("log.message", "(?i)CONFIG\\s+SET\\s+appendonly\\s+no")
  )
afterEvents:
  - indexPattern: v11-log-redis-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-10m
    count: 3
groupBy:
  - adversary.host
  - adversary.user
