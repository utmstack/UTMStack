# Rule version v1.0.0

dataTypes:
  - nginx
name: Lua Script Injection Attempt
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1059 - Command and Scripting Interpreter"
adversary: origin
references:
  - https://github.com/openresty/lua-nginx-module#security-considerations
  - https://attack.mitre.org/techniques/T1059/
description: |
  Detects potential Lua script injection attempts through malicious input patterns in requests that could be processed by Nginx Lua modules, potentially leading to remote code execution.
  
  Next Steps:
  1. Review the source IP address and check if it's known or trusted
  2. Examine the full request details to understand the injection attempt
  3. Check if your Nginx configuration uses Lua modules (openresty/lua-nginx-module)
  4. Review Nginx error logs for any script execution errors
  5. Block the source IP if confirmed malicious
  6. Update WAF rules to prevent similar injection attempts
  7. Consider disabling unnecessary Lua functionality if not required
where: |
  (contains("origin.path", "lua") || 
   contains("log.request", "_by_lua") || 
   contains("log.message", "lua")) && 
  (contains("log.request", "os.execute") || 
   contains("log.request", "io.popen") || 
   contains("log.request", "loadstring") ||
   contains("origin.path", "../") ||
   contains("log.referrer", "os.execute"))
afterEvents:
  - indexPattern: v11-log-nginx-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: now-30m
    count: 5
groupBy:
  - adversary.ip
  - adversary.path
