# Rule version v1.0.0

dataTypes:
  - nginx
name: Nginx Authentication Brute Force Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Brute Force
technique: "T1110 - Brute Force"
adversary: origin
references:
  - https://owasp.org/www-community/attacks/Brute_force_attack
  - https://attack.mitre.org/techniques/T1110/
description: |
  Detects brute force authentication attacks against Nginx-served applications by monitoring for repeated 401/403 responses from the same source IP. Identifies credential stuffing, password spraying, and automated login attempts.

  Next Steps:
  1. Review the source IP reputation and geolocation
  2. Check the targeted authentication endpoints
  3. Determine if any successful logins occurred after the failures
  4. Implement rate limiting and account lockout policies
  5. Deploy CAPTCHA on login endpoints
  6. Block the source IP if attack is confirmed
where: |
  exists("origin.ip") &&
  (equals("log.statusCode", 401) || equals("log.statusCode", 403)) &&
  exists("origin.path") &&
  (
    contains("origin.path", "login") ||
    contains("origin.path", "signin") ||
    contains("origin.path", "auth") ||
    contains("origin.path", "admin") ||
    contains("origin.path", "wp-login") ||
    contains("origin.path", "user/login") ||
    contains("origin.path", "account") ||
    contains("origin.path", "session")
  )
afterEvents:
  - indexPattern: v11-log-nginx-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.statusCode
        operator: filter_term
        value: '401'
    within: now-5m
    count: 10
    or:
      - indexPattern: v11-log-nginx-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
          - field: log.statusCode
            operator: filter_term
            value: '403'
        within: now-5m
        count: 10
deduplicateBy:
  - adversary.ip
  - adversary.path
