# Rule version v1.0.0

dataTypes:
  - nginx
name: Nginx Authentication Bypass Attempt Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Credential Access
technique: "T1212 - Exploitation for Credential Access"
adversary: origin
references:
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/04-Authentication_Testing/
  - https://attack.mitre.org/techniques/T1212/
description: |
  Detects authentication bypass attempts targeting Nginx-served applications including URL manipulation to bypass access controls, header injection for auth bypass, and exploitation of misconfigured location blocks.

  Next Steps:
  1. Review the request URL and headers for bypass techniques
  2. Check if the authentication bypass was successful (2xx response to protected resource)
  3. Verify Nginx location block configurations for access control gaps
  4. Test for additional authentication bypass vectors
  5. Implement proper authentication at the application layer
  6. Block the source IP if confirmed malicious
where: |
  exists("origin.ip") &&
  exists("origin.path") &&
  (
    regexMatch("origin.path", "(?i)/admin.*/\\.\\./") ||
    regexMatch("origin.path", "(?i)/(admin|manager|console|dashboard)/;/") ||
    contains("origin.path", "%00") ||
    contains("origin.path", "..;/") ||
    contains("origin.path", ";.css") ||
    contains("origin.path", ";.js") ||
    contains("origin.path", ";.png") ||
    regexMatch("origin.path", "(?i)/[^/]*admin[^/]*/\\s") ||
    (exists("log.request") && (
      regexMatch("log.request", "(?i)X-Original-URL:\\s*/admin") ||
      regexMatch("log.request", "(?i)X-Rewrite-URL:\\s*/admin") ||
      regexMatch("log.request", "(?i)X-Custom-IP-Authorization:\\s*127\\.0\\.0\\.1") ||
      contains("log.request", "X-Forwarded-For: 127.0.0.1")
    ))
  )
afterEvents:
  - indexPattern: v11-log-nginx-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: origin.path
        operator: filter_match
        value: 'admin OR manager OR console OR dashboard'
    within: now-10m
    count: 5
groupBy:
  - adversary.ip
  - target.ip
