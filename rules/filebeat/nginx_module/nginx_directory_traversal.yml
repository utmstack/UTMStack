# Rule version v1.0.0

dataTypes:
  - nginx
name: Nginx Directory Traversal Attack Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Path Traversal
technique: "T1083 - File and Directory Discovery"
adversary: origin
references:
  - https://owasp.org/www-community/attacks/Path_Traversal
  - https://attack.mitre.org/techniques/T1083/
description: |
  Detects path traversal attacks targeting Nginx web servers using encoded and unencoded directory traversal sequences. Attackers use these techniques to access files outside the web root, potentially reading sensitive configuration files or system data.

  Next Steps:
  1. Review the full request URL for directory traversal payloads
  2. Check if any sensitive files were successfully accessed (200 response)
  3. Examine the target paths to determine what files were being targeted
  4. Verify Nginx configuration prevents directory traversal
  5. Implement proper path normalization and validation
  6. Block the source IP if confirmed malicious
where: |
  exists("origin.ip") &&
  exists("origin.path") &&
  (
    contains("origin.path", "../") ||
    contains("origin.path", "..\\") ||
    contains("origin.path", "%2e%2e/") ||
    contains("origin.path", "%2e%2e%2f") ||
    contains("origin.path", "..%2f") ||
    contains("origin.path", "%2e%2e\\") ||
    contains("origin.path", "..%5c") ||
    contains("origin.path", "%252e%252e") ||
    contains("origin.path", "%%c0%af") ||
    contains("origin.path", "%c0%ae%c0%ae") ||
    (contains("origin.path", "/etc/passwd") || contains("origin.path", "/etc/shadow")) ||
    (contains("origin.path", "windows/system32") || contains("origin.path", "win.ini"))
  )
afterEvents:
  - indexPattern: v11-log-nginx-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: origin.path
        operator: filter_match
        value: '../ OR ..%2f OR %2e%2e OR etc/passwd OR win.ini'
    within: now-10m
    count: 5
groupBy:
  - adversary.ip
  - target.ip
