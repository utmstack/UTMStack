# Rule version v1.0.0

dataTypes:
  - haproxy
name: HAProxy SSRF via Backend Manipulation Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Server-Side Request Forgery
technique: "T1090 - Proxy"
adversary: origin
references:
  - https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
  - https://attack.mitre.org/techniques/T1090/
description: |
  Detects SSRF attacks through HAProxy by identifying Host header manipulation, X-Forwarded-Host injection, and requests targeting internal IP addresses or cloud metadata endpoints.

  Next Steps:
  1. Review the request headers for Host manipulation
  2. Check if internal services were accessed through HAProxy
  3. Verify HAProxy ACL and backend configurations
  4. Implement strict Host header validation
  5. Block access to internal IP ranges and metadata endpoints
  6. Block the source IP if confirmed malicious
where: |
  exists("origin.ip") &&
  (
    (exists("log.request") && (
      regexMatch("log.request", "(?i)Host:\\s*(127\\.0\\.0\\.1|localhost|169\\.254\\.169\\.254)") ||
      regexMatch("log.request", "(?i)X-Forwarded-Host:\\s*(127\\.0\\.0\\.1|localhost|10\\.)") ||
      contains("log.request", "169.254.169.254") ||
      contains("log.request", "metadata.google.internal")
    )) ||
    (exists("origin.path") && (
      contains("origin.path", "169.254.169.254") ||
      contains("origin.path", "localhost") ||
      regexMatch("origin.path", "(?i)@(127\\.0\\.0\\.1|10\\.|192\\.168\\.)")
    ))
  )
afterEvents:
  - indexPattern: v11-log-haproxy-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: origin.path
        operator: filter_match
        value: '169.254.169.254 OR localhost OR 127.0.0.1 OR metadata'
    within: now-10m
    count: 3
groupBy:
  - adversary.ip
  - target.ip
