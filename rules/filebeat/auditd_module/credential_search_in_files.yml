# Rule version v1.0.0

dataTypes:
  - auditd
name: Credential Search in Files Detected
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
category: Credential Access
technique: "T1552.001 - Unsecured Credentials: Credentials In Files"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/execve/lnx_auditd_find_cred_in_files.yml
description: |
  Detects the use of grep or find commands to search for credentials, passwords, tokens, or secrets within files. Attackers commonly search configuration files, scripts, and environment files for hardcoded credentials that can be used for lateral movement or privilege escalation.

  Next Steps:
  1. Identify the user performing the credential search and verify authorization
  2. Review which files and directories were searched
  3. Check if any credentials were found and subsequently used
  4. Look for data exfiltration activity following the credential search
  5. Audit configuration files for hardcoded credentials and remove them
  6. Implement secrets management solutions to reduce credential exposure
where: |
  equals("action", "auditd.log") &&
  equals("log.record_type", "EXECVE") &&
  exists("log.auditd.log.proctitle") &&
  (contains("log.auditd.log.proctitle", "grep") || contains("log.auditd.log.proctitle", "find")) &&
  contains("log.auditd.log.proctitle", ["password", "passwd", "credential", "secret", "token", "api_key", "apikey", "api-key", "AWS_SECRET", "AWS_ACCESS", "PRIVATE_KEY", "private_key"])
afterEvents:
  - indexPattern: v11-log-auditd-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-15m
    count: 3
groupBy:
  - adversary.host
  - adversary.user
