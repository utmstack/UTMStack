# Rule version v1.0.0

dataTypes:
  - auditd
name: Namespace Manipulation for Container Escape
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Privilege Escalation
technique: "T1611 - Escape to Host"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1611/
description: |
  Detects setns and unshare syscalls used for Linux namespace manipulation, which can be abused for container escape by joining the host's namespaces from within a container.

  Next Steps:
  1. Identify the process performing namespace manipulation
  2. Determine if the process is running inside a container
  3. Check which namespaces are being joined or created
  4. Review container security context and capabilities
  5. Check for privilege escalation after namespace manipulation
  6. Isolate the container host if escape is confirmed
where: |
  equals("action", "auditd.log") &&
  equals("log.record_type", "SYSCALL") &&
  (equals("log.syscall", "setns") || equals("log.syscall", "unshare")) &&
  !oneOf("log.exe", ["/usr/bin/unshare", "/usr/sbin/ip"]) &&
  !contains("log.exe", ["systemd", "runc", "containerd", "dockerd"])
groupBy:
  - adversary.host
  - adversary.user
