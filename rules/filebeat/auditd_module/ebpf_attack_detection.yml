# Rule version v1.0.0

dataTypes:
  - auditd
name: Malicious eBPF Program Loading via bpf() Syscall
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Defense Evasion
technique: "T1014 - Rootkit"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1014/
  - https://www.elastic.co/security-labs/a-peek-behind-the-bpf-curtain
description: |
  Detects the bpf() syscall being used to load eBPF programs, which can be abused for rootkit functionality. eBPF allows kernel-level code execution and can intercept network traffic, hide processes, and tamper with system calls.

  Next Steps:
  1. Identify the process and user invoking the bpf() syscall
  2. Determine the BPF program type being loaded
  3. Check if the source is a legitimate monitoring tool (cilium, falco, bpftrace)
  4. List loaded BPF programs with bpftool
  5. If unauthorized, investigate the binary and its origin
  6. Reboot the system to unload malicious BPF programs
where: |
  equals("action", "auditd.log") &&
  equals("log.record_type", "SYSCALL") &&
  equals("log.syscall", "bpf") &&
  !(contains("log.exe", "/usr/bin/bpftool") || contains("log.exe", "cilium") ||
    contains("log.exe", "falco") || contains("log.exe", "bpftrace") ||
    contains("log.exe", "systemd"))
groupBy:
  - adversary.host
  - adversary.user
