# Rule version v1.0.0

dataTypes:
  - auditd
name: Privilege Escalation Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: "T1548 - Abuse Elevation Control Mechanism"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1548/
  - https://attack.mitre.org/techniques/T1068/
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
description: |
  Detects privilege escalation attempts including sudo usage, setuid/setgid operations, and capability changes in audit logs. This rule monitors for suspicious elevation of privileges through various system calls and commands.
  
  Next Steps:
  1. Verify the legitimacy of the privilege escalation attempt by checking if it aligns with authorized administrative activities
  2. Review the user account performing the escalation and validate their authorization level
  3. Examine the context and timing of the escalation - check for unusual patterns or off-hours activity
  4. Investigate any subsequent actions taken by the user after privilege escalation
  5. Check for signs of lateral movement or unauthorized access to sensitive resources
  6. Review system logs for any failed privilege escalation attempts from the same user
  7. If unauthorized, immediately revoke elevated privileges and investigate potential compromise
where: |
  equals("action", "auditd.log") &&
  (equals("log.auditd.record_type", "SYSCALL") ||
   equals("log.auditd.record_type", "CAPSET")) &&
  (equals("log.auditd.syscall", "setuid") ||
   equals("log.auditd.syscall", "setgid") ||
   equals("log.auditd.syscall", "setreuid") ||
   equals("log.auditd.syscall", "setregid")) &&
  !contains("log.auditd.exe", "sudo") &&
  !contains("log.auditd.exe", "su") &&
  !contains("log.auditd.exe", "crond") &&
  !contains("log.auditd.exe", "sshd")
afterEvents:
  - indexPattern: v11-log-auditd-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-5m
    count: 3
groupBy:
  - lastEvent.log.auditd.uid
  - adversary.host
