# Rule version v1.0.0

dataTypes:
  - auditd
name: Shell Profile Modification for Persistence
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Persistence
technique: "T1546.004 - Event Triggered Execution: Unix Shell Configuration Modification"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1546/004/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_unix_shell_configuration_modification.yml
description: |
  Detects modification of shell profile files (.bashrc, .bash_profile, .zshrc, .profile, /etc/profile, /etc/bash.bashrc) via auditd file access monitoring. Attackers add malicious commands to these files to establish persistence, as the commands execute every time a user opens a new shell session. This is a stealthy persistence mechanism that survives reboots.

  Next Steps:
  1. Review the contents of the modified profile file for malicious additions
  2. Look for reverse shells, download commands, or environment variable manipulation
  3. Identify the user and process that modified the file
  4. Compare the file against a known-good baseline or version control
  5. Check if the modification was made interactively or by an automated process
  6. Search for similar modifications on other user profiles
  7. Remove the malicious additions and monitor for re-insertion
where: |
  equals("action", "auditd.log") &&
  (contains("log.auditd.log.name", ".bashrc") ||
   contains("log.auditd.log.name", ".bash_profile") ||
   contains("log.auditd.log.name", ".zshrc") ||
   contains("log.auditd.log.name", ".profile") ||
   contains("log.auditd.log.name", "/etc/profile") ||
   contains("log.auditd.log.name", "/etc/bash.bashrc") ||
   contains("log.auditd.log.name", "/etc/profile.d/")) &&
  !oneOf("log.auditd.log.exe", ["/usr/bin/dpkg", "/usr/bin/rpm", "/usr/bin/apt", "/usr/bin/yum", "/usr/bin/dnf"])
groupBy:
  - lastEvent.log.auditd.log.name
  - adversary.host
