# Rule version v1.0.0

dataTypes:
  - auditd
name: Audit Rule Modifications
impact:
  confidentiality: 2
  integrity: 3
  availability: 1
category: Defense Evasion
technique: "T1070.002 - Indicator Removal on Host: Clear Linux or Mac System Logs"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1070/002/
  - https://access.redhat.com/articles/4409591
description: |
  Detects attempts to modify audit rules which could indicate an attacker trying to evade detection by disabling or modifying audit logging mechanisms. This activity is commonly observed when attackers attempt to cover their tracks after gaining system access.
  
  Next Steps:
  1. Investigate the user account (log.auid) that initiated the audit rule modification
  2. Review the specific audit rule changes made by examining the audit configuration
  3. Check for other suspicious activities on the affected host around the same time
  4. Verify if the modification was authorized and part of legitimate administrative tasks
  5. Examine system logs for any events that occurred before or after the audit rule modification
  6. Consider isolating the affected system if unauthorized modifications are confirmed
where: (equals("log.type", "CONFIG_CHANGE") || equals("log.type", "DAEMON_CONFIG")) && (equals("log.exe", "/sbin/auditctl") || equals("log.exe", "/usr/sbin/auditctl") || equals("log.exe", "/sbin/augenrules") || equals("log.exe", "/usr/sbin/augenrules"))
groupBy:
  - lastEvent.log.auid
  - adversary.host
