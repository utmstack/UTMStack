# Rule version v1.0.0

dataTypes:
  - auditd
name: Log Tampering Attempts
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1070.002 - Indicator Removal on Host: Clear Linux or Mac System Logs"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1070/002/
  - https://www.redhat.com/en/blog/configure-linux-auditing-auditd
description: |
  Detects attempts to tamper with or delete audit logs which could indicate malicious activity. 
  This rule identifies file operations targeting critical log directories such as /var/log/audit/, 
  /var/log/messages, and /var/log/secure that involve deletion or write access.
  
  Next Steps:
  1. Investigate the user and process responsible for the log tampering attempt
  2. Check for any recent privilege escalation activities on the affected host
  3. Verify if legitimate administrative activities were scheduled during this time
  4. Review backup logs and file integrity monitoring for evidence of actual log deletion
  5. Examine other system logs for signs of additional malicious activity
  6. Consider isolating the affected system if evidence of compromise is found
where: |
  equals("log.type", "PATH") &&
  (contains("log.name", "/var/log/audit/") || contains("log.name", "/var/log/messages") ||
   contains("log.name", "/var/log/secure") || contains("log.name", "/var/log/auth.log") ||
   contains("log.name", "/var/log/syslog")) &&
  equals("log.nametype", "DELETE") &&
  !oneOf("log.exe", ["/usr/sbin/logrotate", "/usr/lib/rsyslog", "/usr/sbin/rsyslogd"])
groupBy:
  - adversary.host
  - adversary.user
