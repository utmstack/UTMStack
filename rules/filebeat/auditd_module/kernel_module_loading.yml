# Rule version v1.0.0

dataTypes:
  - auditd
name: Kernel Module Loading Detection
impact:
  confidentiality: 2
  integrity: 3
  availability: 3
category: Persistence
technique: "T1547.006 - Boot or Logon Autostart Execution: Kernel Modules and Extensions"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1547/006/
  - https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-module-auditd.html
description: |
  Detects when kernel modules are loaded into the system. Attackers may load malicious kernel modules for rootkit installation, privilege escalation, or to hide their activities. This rule monitors both syscall-based module loading (init_module, finit_module) and kernel module events.
  
  Next Steps:
  1. Verify the legitimacy of the loaded kernel module by checking its source and signature
  2. Examine the process that initiated the module loading and its parent processes
  3. Check for any suspicious file modifications or network connections around the time of module loading
  4. Review system logs for any other anomalous activities on the affected host
  5. Consider isolating the system if unauthorized kernel module loading is confirmed
  6. Perform memory analysis to detect any rootkit or malicious module presence
where: equals("action", "auditd.log") && ((equals("log.record_type", "SYSCALL") && (equals("log.syscall", "init_module") || equals("log.syscall", "finit_module"))) || (equals("log.record_type", "KERN_MODULE") && equals("log.res", "1")))
groupBy:
  - lastEvent.log.name
  - adversary.host
