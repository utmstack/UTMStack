# Rule version v1.0.0

dataTypes:
  - auditd
name: Sudoers File Modification for Privilege Persistence
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1548.003 - Abuse Elevation Control Mechanism: Sudo and Sudo Caching"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1548/003/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/file_event/file_event_lnx_persistence_sudoers_files.yml
description: |
  Detects creation or modification of files in /etc/sudoers or /etc/sudoers.d/. Attackers modify sudoers configuration to grant persistent passwordless root access to compromised user accounts. This is a critical privilege persistence technique that survives password resets and can grant full system control.

  Next Steps:
  1. Immediately review the contents of the modified sudoers file
  2. Look for NOPASSWD entries or ALL=(ALL) grants for non-admin users
  3. Identify the user and process that made the modification
  4. Check if visudo was used (legitimate) or direct file editing (suspicious)
  5. Revert unauthorized changes immediately
  6. Audit all sudoers.d/ drop-in files for unauthorized entries
  7. Review sudo logs for commands executed with the unauthorized privileges
  8. Check for lateral movement from the affected user account
where: |
  equals("action", "auditd.log") &&
  (contains("log.auditd.log.name", "/etc/sudoers") ||
   contains("log.auditd.log.name", "/etc/sudoers.d/")) &&
  !equals("log.auditd.log.exe", "/usr/sbin/visudo") &&
  !oneOf("log.auditd.log.exe", ["/usr/bin/dpkg", "/usr/bin/rpm", "/usr/bin/apt", "/usr/bin/yum", "/usr/bin/dnf"])
groupBy:
  - lastEvent.log.auditd.log.name
  - adversary.host
