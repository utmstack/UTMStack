# Rule version v1.0.0

dataTypes:
  - kafka
name: Kafka Topic Deletion Detection
impact:
  confidentiality: 1
  integrity: 3
  availability: 3
category: Data Destruction
technique: "T1485 - Data Destruction"
adversary: origin
references:
  - https://kafka.apache.org/documentation/#topicconfigs
  - https://attack.mitre.org/techniques/T1485/
description: |
  Detects Kafka topic deletion operations that could result in message data loss. Topic deletion is a destructive operation that permanently removes all messages and partitions.

  Next Steps:
  1. Verify if the topic deletion was authorized
  2. Identify the user or service that initiated the deletion
  3. Check if any dependent applications were affected
  4. Review if message data can be recovered from other consumers
  5. Restrict topic deletion via Kafka ACLs
  6. Implement topic deletion protection for critical topics
where: |
  exists("log.message") &&
  (
    contains("log.message", "Topic deletion") ||
    (contains("log.message", "DeleteTopics") && !contains("log.message", "TOPIC_AUTHORIZATION_FAILED")) ||
    contains("log.message", "Deleting topic") ||
    (contains("log.message", "topic") && contains("log.message", "marked for deletion")) ||
    contains("log.message", "TopicDeletion")
  )
afterEvents:
  - indexPattern: v11-log-kafka-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-10m
    count: 3
groupBy:
  - adversary.host
  - adversary.user
