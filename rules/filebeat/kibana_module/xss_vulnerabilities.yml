# Rule version v1.0.0

dataTypes:
  - kibana
name: XSS Attack Attempt Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Execution
technique: "T1059.007 - Cross-Site Scripting"
adversary: origin
references:
  - https://www.elastic.co/guide/en/kibana/current/security-best-practices.html
  - https://attack.mitre.org/techniques/T1059/007/
description: |
  Detects potential XSS attack attempts in Kibana through malicious script injection in search queries, field formatters, or visualization titles. This rule identifies common XSS patterns including script tags, JavaScript execution, and event handlers that could indicate an attempt to inject malicious code into Kibana interfaces.
  
  Next Steps:
  1. Review the specific log message and action that triggered this alert
  2. Check the user's recent activity in Kibana for other suspicious actions
  3. Examine the affected Kibana component for potential compromise
  4. Review Kibana access logs for the source IP and user
  5. Consider blocking the source IP if malicious activity is confirmed
  6. Update Kibana security configurations and input validation
  7. Implement Content Security Policy (CSP) headers to prevent XSS execution
  8. Review and sanitize all user inputs in Kibana dashboards and visualizations
where: |
  (equals("log.component", "visualize") ||
   equals("log.component", "discover") ||
   equals("log.component", "security")) &&
  (
    regexMatch("log.actionMessage", ".*<script.*>.*</script>.*") ||
    contains("log.actionMessage", "javascript:") ||
    contains("log.actionMessage", "onerror=") ||
    contains("log.actionMessage", "onload=") ||
    contains("log.actionMessage", "<iframe") ||
    contains("log.actionMessage", "eval(") ||
    contains("log.actionMessage", "Function(")
  )
groupBy:
  - lastEvent.log.component
  - adversary.user
