# Rule version v1.0.0

dataTypes:
  - logstash
name: Logstash Unauthorized Pipeline Deployment Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Data Manipulation
technique: "T1565 - Data Manipulation"
adversary: origin
references:
  - https://www.elastic.co/guide/en/logstash/current/configuration.html
  - https://attack.mitre.org/techniques/T1565/
description: |
  Detects unauthorized Logstash pipeline deployment or modification that could intercept, modify, or redirect log data. Attackers can inject pipelines to exfiltrate data, drop security events, or inject false data.

  Next Steps:
  1. Review the pipeline configuration changes
  2. Verify the deployment was authorized
  3. Check pipeline outputs for unauthorized destinations
  4. Review pipeline filters for data manipulation logic
  5. Restrict pipeline management API access
  6. Implement pipeline configuration version control
where: |
  exists("log.message") &&
  (
    (contains("log.message", "pipeline") && contains("log.message", "reloaded")) ||
    (contains("log.message", "Pipeline") && contains("log.message", "started")) ||
    (contains("log.message", "new pipeline") && !contains("log.message", "main")) ||
    contains("log.message", "pipeline_config_changed") ||
    (contains("log.message", "Pipelines running") && contains("log.message", "changed")) ||
    (contains("log.message", "_node/pipelines") && contains("log.message", "PUT"))
  )
groupBy:
  - adversary.host
  - adversary.user
