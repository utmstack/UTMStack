# Rule version v1.0.0

dataTypes:
  - logstash
name: Logstash Malicious Plugin Installation Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Supply Chain
technique: "T1195.002 - Supply Chain Compromise: Compromise Software Supply Chain"
adversary: origin
references:
  - https://www.elastic.co/guide/en/logstash/current/working-with-plugins.html
  - https://attack.mitre.org/techniques/T1195/002/
description: |
  Detects installation of unofficial or potentially malicious Logstash plugins. Attackers install custom plugins to intercept data, execute code, or establish persistence within the log pipeline.

  Next Steps:
  1. Review the plugin being installed and its source
  2. Verify the plugin is from the official Elastic plugin repository
  3. Check plugin code for malicious functionality
  4. Remove unauthorized plugins immediately
  5. Restrict plugin installation to authorized administrators
  6. Maintain an allowlist of approved plugins
where: |
  exists("log.message") &&
  (
    contains("log.message", "logstash-plugin install") ||
    (contains("log.message", "Installing") && contains("log.message", "plugin")) ||
    (contains("log.message", "plugin") && contains("log.message", "installed successfully")) ||
    contains("log.message", "logstash-plugin update") ||
    (contains("log.message", "gem install") && contains("log.message", "logstash")) ||
    (contains("log.message", "plugin") && contains("log.message", "loaded") && !contains("log.message", "logstash-input-") && !contains("log.message", "logstash-output-elasticsearch"))
  )
groupBy:
  - adversary.host
  - adversary.user
