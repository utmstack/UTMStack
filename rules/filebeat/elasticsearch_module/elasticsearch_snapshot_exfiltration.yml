# Rule version v1.0.0

dataTypes:
  - elasticsearch
name: Elasticsearch Snapshot Exfiltration Detection
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
category: Data Exfiltration
technique: "T1048 - Exfiltration Over Alternative Protocol"
adversary: origin
references:
  - https://www.elastic.co/guide/en/elasticsearch/reference/current/snapshot-restore.html
  - https://attack.mitre.org/techniques/T1048/
description: |
  Detects creation of snapshot repositories pointing to external or attacker-controlled storage (S3, NFS, Azure, GCS). Attackers register external snapshot destinations to exfiltrate index data in bulk.

  Next Steps:
  1. Review the snapshot repository configuration and endpoint
  2. Verify the repository URL/bucket is a legitimate company resource
  3. Check what indices are included in snapshot operations
  4. Remove unauthorized snapshot repositories
  5. Restrict _snapshot API access to administrator accounts
  6. Monitor outbound network traffic from the Elasticsearch cluster
where: |
  exists("log.message") &&
  (
    (contains("log.message", "_snapshot") && contains("log.message", "repository")) ||
    (contains("log.message", "snapshot") && contains("log.message", "created")) ||
    contains("log.message", "put_repository") ||
    (contains("log.message", "repository") && (
      contains("log.message", "s3://") ||
      contains("log.message", "gs://") ||
      contains("log.message", "azure://") ||
      contains("log.message", "hdfs://")
    )) ||
    (contains("log.message", "register repository") && exists("origin.ip"))
  )
groupBy:
  - adversary.host
  - adversary.ip
