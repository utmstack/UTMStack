# Rule version v1.0.0

dataTypes:
  - elasticsearch
name: Elasticsearch Node Compromise Indicators
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Initial Access
technique: System Compromise
adversary: origin
references:
  - https://www.elastic.co/guide/en/elasticsearch/reference/current/audit-event-types.html
  - https://attack.mitre.org/techniques/T1190/
description: Detects patterns indicating potential compromise of an Elasticsearch node, including authentication failures from unusual locations and critical errors.
where: (equals("action", "authentication_failed") || equals("severity", "high")) && exists("origin.ip") && exists("log.nodeName")
afterEvents:
  - indexPattern: v11-log-elasticsearch-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: action
        operator: filter_term
        value: 'authentication_failed'
    within: now-15m
    count: 5
groupBy:
  - lastEvent.log.nodeName
  - adversary.ip
