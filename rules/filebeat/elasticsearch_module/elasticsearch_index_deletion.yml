# Rule version v1.0.0

dataTypes:
  - elasticsearch
name: Elasticsearch Bulk Index Deletion Detection
impact:
  confidentiality: 1
  integrity: 3
  availability: 3
category: Data Destruction
technique: "T1485 - Data Destruction"
adversary: origin
references:
  - https://www.elastic.co/guide/en/elasticsearch/reference/current/indices-delete-index.html
  - https://attack.mitre.org/techniques/T1485/
description: |
  Detects bulk index deletion operations in Elasticsearch that could indicate data destruction or ransomware attacks targeting cluster data. Monitors for wildcard index deletions and multiple sequential index delete operations.

  Next Steps:
  1. Verify if the index deletion was authorized
  2. Check if the deleted indices can be restored from snapshots
  3. Identify the user or API key that performed the deletion
  4. Review cluster settings for destructive_requires_name configuration
  5. Enable action.destructive_requires_name to prevent wildcard deletions
  6. Restrict delete index permissions to administrator roles
where: |
  exists("log.message") &&
  (
    (contains("log.message", "delete_index") || contains("log.message", "DeleteIndex")) ||
    (contains("log.message", "indices") && contains("log.message", "deleted")) ||
    (contains("log.message", "DELETE") && regexMatch("log.message", "(?i)/[a-z_*-]+\\s+HTTP")) ||
    (contains("log.message", "index") && contains("log.message", "closed") && contains("log.message", "deleted"))
  )
afterEvents:
  - indexPattern: v11-log-elasticsearch-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.message
        operator: filter_match
        value: 'delete_index OR DeleteIndex OR deleted'
    within: now-10m
    count: 3
groupBy:
  - adversary.ip
  - target.ip
