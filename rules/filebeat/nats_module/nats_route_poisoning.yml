# Rule version v1.0.0

dataTypes:
  - nats
name: NATS Unauthorized Route Poisoning Detection
impact:
  confidentiality: 2
  integrity: 3
  availability: 3
category: Network Manipulation
technique: "T1557 - Adversary-in-the-Middle"
adversary: origin
references:
  - https://docs.nats.io/running-a-nats-service/configuration/clustering
  - https://attack.mitre.org/techniques/T1557/
description: |
  Detects unauthorized route advertisements and cluster join attempts in NATS. Attackers inject rogue routes to intercept messages, disrupt cluster operations, or perform man-in-the-middle attacks.

  Next Steps:
  1. Verify the connecting route/node is an authorized cluster member
  2. Review the cluster route configuration
  3. Check for any unauthorized servers in the cluster
  4. Disconnect unauthorized routes immediately
  5. Implement route authentication and TLS verification
  6. Monitor cluster topology for unexpected changes
where: |
  exists("log.message") &&
  (
    (contains("log.message", "route") && contains("log.message", "added")) ||
    (contains("log.message", "route") && contains("log.message", "connected")) ||
    (contains("log.message", "cluster") && contains("log.message", "unauthorized")) ||
    (contains("log.message", "gateway") && contains("log.message", "unknown")) ||
    (contains("log.message", "leaf node") && contains("log.message", "unauthorized")) ||
    (equals("log.severity", "ERROR") && contains("log.message", "route") && contains("log.message", "TLS"))
  )
groupBy:
  - adversary.host
  - adversary.user
