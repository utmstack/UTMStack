# Rule version v1.0.0

dataTypes:
  - nats
name: NATS JetStream Unauthorized Deletion Detection
impact:
  confidentiality: 1
  integrity: 3
  availability: 3
category: Data Destruction
technique: "T1485 - Data Destruction"
adversary: origin
references:
  - https://docs.nats.io/nats-concepts/jetstream
  - https://attack.mitre.org/techniques/T1485/
description: |
  Detects unauthorized deletion of NATS JetStream streams or consumers that could result in permanent message data loss. Monitors for stream and consumer deletion operations.

  Next Steps:
  1. Verify if the stream/consumer deletion was authorized
  2. Identify the user and client that initiated the deletion
  3. Assess the impact of data loss from deleted streams
  4. Check if stream data can be recovered from replicas
  5. Restrict stream management permissions
  6. Implement stream deletion protection policies
where: |
  exists("log.message") &&
  (
    (contains("log.message", "stream") && contains("log.message", "deleted")) ||
    (contains("log.message", "consumer") && contains("log.message", "deleted")) ||
    contains("log.message", "JSApiStreamDelete") ||
    contains("log.message", "JSApiConsumerDelete") ||
    (contains("log.message", "JetStream") && contains("log.message", "purge"))
  )
groupBy:
  - adversary.host
  - adversary.user
