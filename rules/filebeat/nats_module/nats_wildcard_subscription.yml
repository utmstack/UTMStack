# Rule version v1.0.0

dataTypes:
  - nats
name: NATS Wildcard Subscription Monitoring Detection
impact:
  confidentiality: 3
  integrity: 1
  availability: 1
category: Collection
technique: "T1040 - Network Sniffing"
adversary: origin
references:
  - https://docs.nats.io/nats-concepts/subjects#wildcards
  - https://attack.mitre.org/techniques/T1040/
description: |
  Detects NATS ">" wildcard subscriptions that capture all messages across all subjects. This pattern is used by attackers to intercept and monitor all messaging traffic within the NATS cluster.

  Next Steps:
  1. Identify the client that created the wildcard subscription
  2. Verify if the subscription is from a legitimate monitoring service
  3. Review the account and user permissions for the subscriber
  4. Remove unauthorized wildcard subscriptions
  5. Implement subject-level ACLs to restrict subscriptions
  6. Monitor the subscriber for data exfiltration
where: |
  exists("log.message") &&
  (
    regexMatch("log.message", "(?i)subscribe\\s+>") ||
    (contains("log.message", "SUB >") && !contains("log.message", "system")) ||
    (contains("log.message", "subscription") && contains("log.message", ">") && !contains("log.message", "_INBOX")) ||
    (contains("log.message", "wildcard") && contains("log.message", "subscription"))
  )
groupBy:
  - adversary.host
  - adversary.user
