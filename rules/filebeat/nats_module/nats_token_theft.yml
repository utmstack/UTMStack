# Rule version v1.0.0

dataTypes:
  - nats
name: NATS Credential Theft Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1528 - Steal Application Access Token"
adversary: origin
references:
  - https://docs.nats.io/running-a-nats-service/configuration/securing_nats/auth_intro
  - https://attack.mitre.org/techniques/T1528/
description: |
  Detects credential theft attempts in NATS including repeated authentication failures, token replay attempts, and unauthorized credential access patterns that go beyond simple JWT validation failures.

  Next Steps:
  1. Review the authentication failure patterns and source hosts
  2. Check if any stolen credentials were successfully used
  3. Rotate compromised credentials immediately
  4. Review NATS account and user configurations
  5. Implement IP-based access restrictions
  6. Monitor for lateral movement using stolen credentials
where: |
  exists("log.message") &&
  (
    (contains("log.message", "authentication") && contains("log.message", "failed")) ||
    (contains("log.message", "Authorization") && contains("log.message", "Violation")) ||
    (contains("log.message", "nkey") && contains("log.message", "not found")) ||
    (contains("log.message", "token") && contains("log.message", "expired")) ||
    (contains("log.message", "credentials") && contains("log.message", "invalid")) ||
    (contains("log.message", "bad client credentials") && exists("origin.ip"))
  )
afterEvents:
  - indexPattern: v11-log-nats-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
      - field: log.message
        operator: filter_match
        value: 'authentication failed OR Authorization Violation OR credentials invalid'
    within: now-10m
    count: 10
groupBy:
  - adversary.host
  - adversary.user
