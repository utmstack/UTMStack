# Rule version v1.0.0

dataTypes:
  - iis
name: IIS 8.3 Short Filename Enumeration Attack
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Discovery
technique: "T1083 - Discovery: File and Directory Discovery"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1083/
  - https://soroush.secproject.com/blog/2014/07/iis-short-file-name-disclosure-vulnerability/
description: |
  Detects attempts to enumerate 8.3 short filenames using the tilde (~) character, which can reveal sensitive file and directory names on IIS servers. This attack technique exploits the Windows 8.3 filename convention to discover files and directories that may not be publicly accessible through normal browsing.
  
  Next Steps:
  1. Review the source IP addresses attempting this enumeration
  2. Check if any sensitive files or directories were successfully discovered
  3. Verify IIS configuration to disable 8.3 filename generation if not needed
  4. Implement request filtering to block requests containing tilde characters
  5. Monitor for subsequent attacks from the same sources
  6. Consider implementing rate limiting for suspicious request patterns
where: |
  contains("target.path", "~") &&
  (regexMatch("target.path", ".*~[0-9].*") || regexMatch("target.path", ".*~[0-9]\\*.*")) &&
  (equals("log.statusCode", 404) || equals("log.statusCode", 400) || equals("log.statusCode", 200)) &&
  (equals("log.subStatusCode", 0) || equals("log.subStatusCode", 2)) &&
  !regexMatch("target.path", "(?i).*\\.(css|js|jpg|jpeg|png|gif|ico).*")
afterEvents:
  - indexPattern: v11-log-iis-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: target.path
        operator: filter_match
        value: '~'
    within: now-5m
    count: 10
deduplicateBy:
  - adversary.ip
  - target.path
