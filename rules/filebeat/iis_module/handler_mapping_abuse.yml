# Rule version v1.0.0

dataTypes:
  - iis
name: IIS Handler Mapping Abuse Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1505.004 - Server Software Component: IIS Components"
adversary: origin
references:
  - https://www.robwillis.info/2022/11/analyzing-detecting-iis-backdoors/
  - https://attack.mitre.org/techniques/T1505/004/
description: |
  Detects attempts to abuse IIS handler mappings for persistence or code execution through unusual file extensions. 
  Attackers may register malicious handlers for specific file extensions to execute code on IIS servers.
  
  Next Steps:
  1. Examine the requested file path and extension for legitimacy
  2. Check if the file extension is expected in the web application
  3. Review recent IIS configuration changes for handler mapping modifications
  4. Analyze response content and size for signs of code execution
  5. Investigate the source IP for other suspicious activity
  6. Review access logs for patterns of automated tool usage
where: |
  exists("target.path") &&
  (contains("target.path", ".rem") ||
   contains("target.path", ".soap") ||
   contains("target.path", ".asax") || contains("target.path", ".ascx") ||
   contains("target.path", ".compiled") ||
   contains("target.path", ".browser") || contains("target.path", ".webinfo") ||
   contains("target.path", ".resx") || contains("target.path", ".resources") ||
   contains("target.path", ".mdf") || contains("target.path", ".ldf") ||
   contains("target.path", ".cdx")) &&
  (equals("log.method", "POST") || equals("log.method", "PUT"))
afterEvents:
  - indexPattern: v11-log-iis-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: now-10m
    count: 5
groupBy:
  - adversary.ip
  - target.path
