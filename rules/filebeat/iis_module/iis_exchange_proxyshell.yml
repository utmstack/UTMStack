# Rule version v1.0.0

dataTypes:
  - iis
name: IIS Exchange ProxyShell/ProxyLogon Attack Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Exploitation
technique: "T1190 - Exploit Public-Facing Application"
adversary: origin
references:
  - https://www.microsoft.com/en-us/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
  - https://attack.mitre.org/techniques/T1190/
description: |
  Detects exploitation attempts targeting Microsoft Exchange Server vulnerabilities including ProxyShell (CVE-2021-34473, CVE-2021-34523, CVE-2021-31207), ProxyLogon (CVE-2021-26855, CVE-2021-27065), and ProxyNotShell (CVE-2022-41040, CVE-2022-41082) through IIS access logs.

  Next Steps:
  1. Immediately verify the Exchange Server patch level
  2. Check for web shells in Exchange directories
  3. Review mailbox access logs for unauthorized access
  4. Look for suspicious PowerShell execution on the Exchange server
  5. Check for lateral movement from the Exchange server
  6. Patch Exchange Server and rotate credentials immediately
where: |
  exists("origin.ip") &&
  exists("target.path") &&
  (
    contains("target.path", "/autodiscover/autodiscover.json") ||
    contains("target.path", "/mapi/nspi/") ||
    contains("target.path", "/mapi/emsmdb/") ||
    regexMatch("target.path", "(?i)/autodiscover/.*@.*/mapi/") ||
    regexMatch("target.path", "(?i)/owa/.*@.*/powershell") ||
    contains("target.path", "/ecp/DDI/DDIService.svc") ||
    contains("target.path", "/ews/exchange.asmx") ||
    regexMatch("target.path", "(?i)/owa/auth/.*\\.(aspx|ashx)") ||
    contains("target.path", "/powershell/?X-Rps-CAT=") ||
    contains("target.path", "X-BEResource=") ||
    regexMatch("target.path", "(?i)/ecp/(auth|default\\.flt|main\\.css)") ||
    (contains("target.path", "/aspnet_client/") && regexMatch("target.path", "(?i)\\.(aspx|ashx|asmx)$"))
  )
groupBy:
  - adversary.ip
  - target.path
