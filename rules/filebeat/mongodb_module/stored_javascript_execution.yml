# Rule version v1.0.0

dataTypes:
  - mongodb
name: MongoDB Stored JavaScript Execution
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1059 - Command and Scripting Interpreter"
adversary: origin
references:
  - https://www.mongodb.com/docs/manual/core/server-side-javascript/
  - https://attack.mitre.org/techniques/T1059/
description: |
  Detects execution of stored JavaScript functions or server-side JavaScript which could be used for code injection attacks or unauthorized operations.
  
  Next Steps:
  1. Review the JavaScript code being executed to determine if it's legitimate
  2. Check the source IP and user account for signs of compromise
  3. Audit recent changes to system.js collection for malicious stored procedures
  4. Review MongoDB access logs for other suspicious activities from the same source
  5. Consider disabling server-side JavaScript execution if not required
  6. Implement strict access controls for JavaScript execution privileges
where: equals("log.component", "COMMAND") && (contains("log.message", "$where") || contains("log.message", "$function") || contains("log.message", "mapReduce") || contains("log.message", "system.js")) && !equals("log.severity", "low")
afterEvents:
  - indexPattern: v11-log-mongodb-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-10m
    count: 3
groupBy:
  - adversary.host
  - adversary.user
