# Rule version v1.0.0

dataTypes:
  - mongodb
name: MongoDB Rogue Replica Set Reconfiguration Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Lateral Movement
technique: "T1210 - Exploitation of Remote Services"
adversary: origin
references:
  - https://www.mongodb.com/docs/manual/reference/command/replSetReconfig/
  - https://attack.mitre.org/techniques/T1210/
description: |
  Detects MongoDB replica set reconfiguration that could indicate injection of rogue replica members. Attackers use rs.reconfig() to add unauthorized nodes that receive copies of all data, enabling exfiltration.

  Next Steps:
  1. Review the replica set configuration changes
  2. Verify all replica set members are authorized
  3. Check for any new or unknown member hosts
  4. Remove unauthorized replica set members immediately
  5. Restrict replSetReconfig to authorized administrator accounts
  6. Monitor network connections to all replica set members
where: |
  exists("log.message") &&
  (
    contains("log.message", "replSetReconfig") ||
    contains("log.message", "rs.reconfig") ||
    contains("log.message", "replSetInitiate") ||
    (contains("log.message", "replSet") && contains("log.message", "added member")) ||
    (contains("log.message", "replSet") && contains("log.message", "config change")) ||
    contains("log.message", "replSetStepDown")
  )
afterEvents:
  - indexPattern: v11-log-mongodb-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-15m
    count: 2
groupBy:
  - adversary.host
  - adversary.user
