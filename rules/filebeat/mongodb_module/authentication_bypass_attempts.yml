# Rule version v1.0.0

dataTypes:
  - mongodb
name: MongoDB Authentication Bypass Attempts
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: "T1078 - Valid Accounts"
adversary: origin
references:
  - https://www.mongodb.com/docs/manual/reference/log-messages/
  - https://attack.mitre.org/techniques/T1078/
description: |
  Detects multiple failed authentication attempts followed by a successful login from the same source, which may indicate authentication bypass or brute force attempts that succeeded.
  
  Next Steps:
  1. Review the source IP/hostname for legitimacy
  2. Check if the successful authentication was for a privileged account
  3. Examine MongoDB audit logs for any unauthorized database operations following the successful login
  4. Verify if the authentication pattern matches known user behavior
  5. Consider blocking the source IP if confirmed malicious
  6. Reset credentials for affected accounts if compromise is suspected
  7. Review MongoDB configuration for security weaknesses
  8. Check for any privilege escalation attempts post-authentication
where: |
  equals("log.component", "ACCESS") && 
  contains("log.message", "Authentication") &&
  (contains("log.message", "failed") || contains("log.message", "unsuccessful")) &&
  exists("origin.host")
afterEvents:
  - indexPattern: v11-log-mongodb-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
      - field: log.message
        operator: filter_match
        value: 'Authentication failed'
    within: now-5m
    count: 10
groupBy:
  - adversary.host
  - adversary.user
