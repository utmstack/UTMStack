# Rule version v1.0.0

dataTypes:
  - apache
  - nginx
  - iis
name: Server-Side Template Injection (SSTI) Attempt Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: "T1190 - Exploit Public-Facing Application"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_ssti_in_access_logs.yml
  - https://portswigger.net/research/server-side-template-injection
description: |
  Detects Server-Side Template Injection (SSTI) payloads in web server access logs. SSTI occurs when user input is unsafely embedded into server-side templates, allowing attackers to execute arbitrary code on the server. Common targets include Jinja2, Twig, Freemarker, Velocity, and Smarty template engines.

  Next Steps:
  1. Analyze the full request to determine the specific template engine being targeted
  2. Check if the injection was successful by examining response codes and sizes
  3. Review the target application for SSTI vulnerabilities
  4. Block the source IP at the WAF/firewall
  5. Check for signs of remote code execution on the web server
  6. Review application code for unsafe template rendering of user input
  7. Implement input validation and template sandboxing
where: |
  exists("log.request") &&
  exists("origin.ip") &&
  (
    (contains("log.request", "{{") && contains("log.request", "}}") && (
      contains("log.request", "__class__") ||
      contains("log.request", "__mro__") ||
      contains("log.request", "__subclasses__") ||
      contains("log.request", "__globals__") ||
      contains("log.request", "__builtins__") ||
      contains("log.request", "__import__") ||
      contains("log.request", "config.items")
    )) ||
    (contains("log.request", "${") && (
      contains("log.request", "Runtime") ||
      contains("log.request", "getRuntime") ||
      contains("log.request", "exec(") ||
      contains("log.request", "ProcessBuilder") ||
      contains("log.request", "T(java")
    )) ||
    contains("log.request", "freemarker.template.utility.Execute") ||
    contains("log.request", "freemarker.template.utility.ObjectConstructor") ||
    contains("log.request", "freemarker.template.utility.JythonRuntime") ||
    ((contains("log.request", "={%") || contains("log.request", "=%7B%25")) && (
      contains("log.request", "import") || contains("log.request", "system")
    )) ||
    (contains("log.request", "<%=") && contains("log.request", "exec")) ||
    (contains("log.request", "#set($") && contains("log.request", "getRuntime")) ||
    (contains("log.request", "{*") && contains("log.request", "exec")) ||
    regexMatch("log.request", "(?i)\\$\\{T\\(java\\.lang")
  )
afterEvents:
  - indexPattern: v11-log-apache-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: now-15m
    count: 3
    or:
      - indexPattern: v11-log-nginx-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
        within: now-15m
        count: 3
      - indexPattern: v11-log-iis-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
        within: now-15m
        count: 3
groupBy:
  - lastEvent.log.request
  - adversary.ip
