# Rule version v1.0.0

dataTypes:
  - apache
name: Web Server Compromise Indicators
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1505.003 - Server Software Component: Web Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://httpd.apache.org/docs/2.4/logs.html
description: |
  Detects indicators of web server compromise through suspicious file access patterns commonly associated with web shells and backdoors. This rule identifies requests to potentially malicious files with suspicious names or in upload directories that could indicate successful deployment of web shells.
  
  Next Steps:
  1. Immediately investigate the requested file path and verify if the file exists on the web server
  2. Check the source IP for other suspicious activity and recent access patterns
  3. Review web server logs around the time of the request for additional indicators
  4. Scan the web server for web shells and malicious files, particularly in upload directories
  5. If confirmed malicious, isolate the affected server and initiate incident response procedures
  6. Review application security controls and file upload mechanisms
where: |
  exists("log.request") && 
  equals("log.statusCode", 200) &&
  (
    contains("log.request", ".php") && (
      contains("log.request", "shell") ||
      contains("log.request", "c99") ||
      contains("log.request", "r57") ||
      contains("log.request", "wso") ||
      contains("log.request", "b374k") ||
      contains("log.request", "eval") ||
      contains("log.request", "base64")
    ) ||
    regexMatch("log.request", ".*\\.(jsp|jspx|asp|aspx|ashx|asmx)$") && (
      contains("log.request", "cmd") ||
      contains("log.request", "shell") ||
      contains("log.request", "upload")
    ) ||
    contains("log.request", "/uploads/") && regexMatch("log.request", ".*\\.(php|jsp|asp|aspx)$")
  )
afterEvents:
  - indexPattern: v11-log-apache-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.statusCode
        operator: filter_term
        value: '200'
    within: now-1h
    count: 3
groupBy:
  - lastEvent.log.request
  - adversary.ip
