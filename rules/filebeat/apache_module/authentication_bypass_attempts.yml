# Rule version v1.0.0

dataTypes:
  - apache
name: Authentication Bypass Attempts
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: "T1212 - Exploitation for Credential Access"
adversary: origin
references:
  - https://httpd.apache.org/docs/2.4/howto/auth.html
  - https://attack.mitre.org/techniques/T1212/
description: |
  Detects attempts to bypass authentication mechanisms through various techniques including HTTP verb tampering, authentication header manipulation, session fixation, or exploiting authentication logic flaws in protected resources.
  
  Next Steps:
  1. Investigate the source IP address and check for patterns of attack behavior
  2. Review Apache access logs for the timeframe around the alert to understand the full attack sequence
  3. Examine the specific requests made to protected resources and authentication endpoints
  4. Check if the attempts were successful by looking for subsequent 200 status codes from the same IP
  5. Verify the integrity of authentication configuration files (.htaccess, .htpasswd)
  6. Review user accounts for any unauthorized access or privilege escalation
  7. Consider implementing additional authentication controls like rate limiting or IP blocking
  8. Update WAF rules to detect and block similar bypass attempts
where: |
  exists("origin.ip") &&
  (
    ((equals("log.statusCode", 401) || equals("log.statusCode", 403)) &&
     (equals("log.method", "OPTIONS") ||
      equals("log.method", "PATCH") ||
      equals("log.method", "PUT") ||
      equals("log.method", "TRACE") ||
      equals("log.method", "CONNECT") ||
      equals("log.method", "PROPFIND"))) ||
    ((contains("origin.path", "/admin") ||
      contains("origin.path", "/api/") ||
      contains("origin.path", "/private") ||
      contains("origin.path", "/.htaccess") ||
      contains("origin.path", "/.htpasswd")) &&
     (contains("log.request", "Authorization: Basic Og==") ||
      contains("log.request", "Authorization: Bearer null") ||
      contains("log.request", "X-Original-URL:") ||
      contains("log.request", "X-Rewrite-URL:") ||
      contains("origin.path", "..;/") ||
      contains("origin.path", "%2e%2e")))
  )
afterEvents:
  - indexPattern: v11-log-apache-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.statusCode
        operator: filter_term
        value: '401'
    within: now-10m
    count: 5
    or:
      - indexPattern: v11-log-apache-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
          - field: log.statusCode
            operator: filter_term
            value: '403'
        within: now-10m
        count: 5
groupBy:
  - adversary.ip
  - adversary.path
