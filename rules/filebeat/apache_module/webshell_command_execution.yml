# Rule version v1.0.0

dataTypes:
  - apache
  - nginx
  - iis
name: Webshell Command Execution in Web Requests
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1505.003 - Server Software Component: Web Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_win_webshells_in_access_logs.yml
description: |
  Detects OS command execution patterns in web server GET requests that indicate active webshell usage. Attackers use webshells to execute commands like whoami, net user, ipconfig, and cmd /c directly through URL parameters. These patterns are strong indicators of a compromised web server with an active attacker.

  Next Steps:
  1. Immediately isolate the compromised web server
  2. Identify the specific webshell file being used to execute commands
  3. Analyze the commands executed to understand attacker objectives
  4. Check for credential harvesting, lateral movement, and data staging
  5. Scan the entire web directory for additional webshells
  6. Review how the webshell was initially deployed
  7. Perform full forensic analysis and incident response
where: |
  exists("log.request") &&
  exists("origin.ip") &&
  (
    regexMatch("log.request", "(?i)[?&][a-z]+=whoami") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=net%20user") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=net%20localgroup") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=cmd%20/c") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=cmd\\.exe") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=ipconfig") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=systeminfo") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=tasklist") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=netstat") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=ping%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=type%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=dir%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=cat%20/etc") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=uname") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=id$") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=ifconfig") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=ls%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=pwd$") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=wget%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=curl%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=powershell") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=certutil") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=bitsadmin") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=wmic%20") ||
    regexMatch("log.request", "(?i)[?&][a-z]+=reg%20query") ||
    regexMatch("log.request", "(?i)[?&](cmd|exec|command|execute|run|shell|c|q)=")
  )
afterEvents:
  - indexPattern: v11-log-apache-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: now-30m
    count: 2
    or:
      - indexPattern: v11-log-nginx-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
        within: now-30m
        count: 2
      - indexPattern: v11-log-iis-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
        within: now-30m
        count: 2
groupBy:
  - lastEvent.log.request
  - adversary.ip
