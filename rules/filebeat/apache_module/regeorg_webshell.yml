# Rule version v1.0.0

dataTypes:
  - apache
  - nginx
  - iis
name: ReGeorg Tunneling Webshell Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: "T1505.003 - Server Software Component: Web Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_webshell_regeorg.yml
  - https://github.com/sensepost/reGeorg
description: |
  Detects ReGeorg tunneling webshell command patterns in web server access logs. ReGeorg creates a SOCKS proxy through a web shell, allowing attackers to tunnel arbitrary TCP traffic through a compromised web server. This is commonly used for lateral movement and pivoting within internal networks.

  Next Steps:
  1. Immediately identify and remove the ReGeorg webshell file from the web server
  2. Determine how the webshell was initially deployed (file upload vulnerability, RCE)
  3. Analyze network connections tunneled through the webshell
  4. Check for lateral movement to internal systems through the tunnel
  5. Review web server file integrity for additional webshells
  6. Block the attacker's source IP and any proxy destinations
  7. Perform full incident response on the compromised web server
where: |
  exists("log.request") &&
  exists("origin.ip") &&
  (
    (contains("log.request", "cmd=read") && contains("log.request", "mark=")) ||
    (contains("log.request", "cmd=connect") && contains("log.request", "target=")) ||
    contains("log.request", "cmd=disconnect") ||
    (contains("log.request", "cmd=forward") && contains("log.request", "mark=")) ||
    regexMatch("log.request", "(?i)\\?(cmd|action)=(read|connect|disconnect|forward)&")
  )
groupBy:
  - lastEvent.log.request
  - adversary.ip
