# Rule version v1.0.0

dataTypes:
  - apache
name: Apache XXE Injection Attack Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: XML Injection
technique: "T1190 - Exploit Public-Facing Application"
adversary: origin
references:
  - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing
  - https://attack.mitre.org/techniques/T1190/
description: |
  Detects XML External Entity (XXE) injection payloads in Apache web server requests. XXE attacks can lead to file disclosure, SSRF, denial of service, and remote code execution by exploiting XML parsers that process external entity definitions.

  Next Steps:
  1. Review the request body and headers for XML payloads with external entities
  2. Identify the application endpoint processing XML input
  3. Check if sensitive files were disclosed (e.g., /etc/passwd, web.config)
  4. Disable external entity processing in XML parsers
  5. Implement input validation for XML content
  6. Block the source IP if confirmed malicious
where: |
  exists("origin.ip") &&
  (
    (exists("origin.path") && (
      regexMatch("origin.path", "(?i)<!DOCTYPE.*ENTITY") ||
      regexMatch("origin.path", "(?i)<!ENTITY.*SYSTEM") ||
      contains("origin.path", "<!ENTITY") ||
      contains("origin.path", "%xxe;") ||
      contains("origin.path", "file:///etc/passwd") ||
      contains("origin.path", "file:///c:/windows")
    )) ||
    (exists("log.request") && (
      contains("log.request", "<!DOCTYPE") ||
      contains("log.request", "<!ENTITY") ||
      contains("log.request", "SYSTEM \"file://") ||
      contains("log.request", "SYSTEM \"http://") ||
      contains("log.request", "SYSTEM \"expect://") ||
      contains("log.request", "SYSTEM \"php://")
    ))
  )
afterEvents:
  - indexPattern: v11-log-apache-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: now-10m
    count: 3
groupBy:
  - adversary.ip
  - target.ip
