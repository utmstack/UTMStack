# Rule version v1.0.0

dataTypes:
  - apache
  - nginx
  - iis
name: Git Repository Exposure Detected on Web Server
impact:
  confidentiality: 3
  integrity: 2
  availability: 0
category: Reconnaissance
technique: "T1083 - File and Directory Discovery"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1083/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_source_code_enumeration.yml
description: |
  Detects HTTP requests attempting to access .git/ directories and related version control files on web servers. Exposed Git repositories can reveal source code, credentials, API keys, database connection strings, and internal infrastructure details. Attackers enumerate these paths to find sensitive information for further exploitation.

  Next Steps:
  1. Verify if the .git directory is actually accessible on the web server
  2. If exposed, immediately block access to .git paths in web server configuration
  3. Rotate any credentials or API keys that may have been exposed in the repository
  4. Review the git history for committed secrets using tools like truffleHog or git-secrets
  5. Check for access from the same IP to other sensitive paths
  6. Audit web server configurations across all environments
  7. Implement web server rules to deny access to hidden directories
where: |
  exists("log.request") &&
  exists("origin.ip") &&
  (
    contains("log.request", "/.git/") ||
    contains("log.request", "/.git/HEAD") ||
    contains("log.request", "/.git/config") ||
    contains("log.request", "/.git/index") ||
    contains("log.request", "/.git/refs/") ||
    contains("log.request", "/.git/objects/") ||
    contains("log.request", "/.git/logs/") ||
    contains("log.request", "/.git/packed-refs") ||
    contains("log.request", "/.git/info/") ||
    contains("log.request", "/.gitignore") ||
    contains("log.request", "/.svn/") ||
    contains("log.request", "/.svn/entries") ||
    contains("log.request", "/.hg/") ||
    contains("log.request", "/.env") ||
    contains("log.request", "/.DS_Store") ||
    contains("log.request", "/wp-config.php.bak") ||
    contains("log.request", "/config.php.bak") ||
    contains("log.request", "/.htpasswd") ||
    contains("log.request", "/web.config.bak")
  )
afterEvents:
  - indexPattern: v11-log-apache-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
    within: now-15m
    count: 5
    or:
      - indexPattern: v11-log-nginx-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
        within: now-15m
        count: 5
      - indexPattern: v11-log-iis-*
        with:
          - field: origin.ip
            operator: filter_term
            value: '{{.origin.ip}}'
        within: now-15m
        count: 5
deduplicateBy:
  - adversary.ip
  - target.ip
