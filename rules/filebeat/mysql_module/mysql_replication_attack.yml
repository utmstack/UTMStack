# Rule version v1.0.0

dataTypes:
  - mysql
name: MySQL Rogue Replication Attack Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Lateral Movement
technique: "T1210 - Exploitation of Remote Services"
adversary: origin
references:
  - https://dev.mysql.com/doc/refman/8.0/en/replication-security.html
  - https://attack.mitre.org/techniques/T1210/
description: |
  Detects potential rogue MySQL replication attacks where an attacker sets up unauthorized replication to exfiltrate data or inject malicious changes. Monitors for CHANGE MASTER/REPLICATION SOURCE commands and suspicious replication configuration changes.

  Next Steps:
  1. Verify the replication configuration change was authorized
  2. Check the master/source host address for legitimacy
  3. Review replication user account permissions
  4. Verify replication channel integrity
  5. Check for data that may have been exfiltrated via replication
  6. Disable unauthorized replication immediately
where: |
  exists("log.msg") &&
  (
    regexMatch("log.msg", "(?i)CHANGE\\s+MASTER\\s+TO") ||
    regexMatch("log.msg", "(?i)CHANGE\\s+REPLICATION\\s+SOURCE\\s+TO") ||
    regexMatch("log.msg", "(?i)START\\s+SLAVE") ||
    regexMatch("log.msg", "(?i)START\\s+REPLICA") ||
    regexMatch("log.msg", "(?i)SET\\s+GLOBAL\\s+server_id") ||
    (contains("log.msg", "replication") && contains("log.msg", "error")) ||
    (contains("log.msg", "slave") && contains("log.msg", "connected"))
  )
afterEvents:
  - indexPattern: v11-log-mysql-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-10m
    count: 2
groupBy:
  - adversary.host
  - adversary.user
