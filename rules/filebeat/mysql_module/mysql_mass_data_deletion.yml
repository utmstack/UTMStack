# Rule version v1.0.0

dataTypes:
  - mysql
name: MySQL Mass Data Deletion Detection
impact:
  confidentiality: 1
  integrity: 3
  availability: 3
category: Data Destruction
technique: "T1485 - Data Destruction"
adversary: origin
references:
  - https://dev.mysql.com/doc/refman/8.0/en/truncate-table.html
  - https://attack.mitre.org/techniques/T1485/
description: |
  Detects mass data deletion operations in MySQL including TRUNCATE TABLE, DROP TABLE, DROP DATABASE, and DELETE without WHERE clauses. These operations can indicate data destruction attacks or ransomware targeting databases.

  Next Steps:
  1. Identify the user account performing the destructive operation
  2. Verify if the operation was authorized
  3. Check if backup systems are intact and uncompromised
  4. Review the scope of data loss and affected tables/databases
  5. Initiate data recovery from backups if unauthorized
  6. Revoke DROP and DELETE privileges from non-administrative accounts
where: |
  exists("log.msg") &&
  (
    regexMatch("log.msg", "(?i)TRUNCATE\\s+(TABLE\\s+)?\\w") ||
    regexMatch("log.msg", "(?i)DROP\\s+TABLE\\s+(IF\\s+EXISTS\\s+)?\\w") ||
    regexMatch("log.msg", "(?i)DROP\\s+DATABASE\\s+(IF\\s+EXISTS\\s+)?\\w") ||
    regexMatch("log.msg", "(?i)DELETE\\s+FROM\\s+\\w+\\s*;") ||
    regexMatch("log.msg", "(?i)DELETE\\s+FROM\\s+\\w+\\s*$")
  )
afterEvents:
  - indexPattern: v11-log-mysql-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
      - field: log.msg
        operator: filter_match
        value: 'TRUNCATE OR DROP TABLE OR DROP DATABASE OR DELETE FROM'
    within: now-15m
    count: 3
groupBy:
  - adversary.host
  - adversary.user
