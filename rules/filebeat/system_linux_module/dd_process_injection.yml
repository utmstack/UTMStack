# Rule version v1.0.0

dataTypes:
  - linux
name: Process Memory Injection via dd
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1055.009 - Process Injection: Proc Memory"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1055/009/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_dd_process_injection.yml
description: |
  Detects the use of dd to write to /proc/PID/mem, which is a process injection technique. By writing directly to a process's memory space through the proc filesystem, attackers can inject malicious code into legitimate running processes to evade detection and gain the process's privileges.

  Next Steps:
  1. Identify the target process whose memory was written to
  2. Examine the source data being injected into the process
  3. Check if the target process is a privileged or security-sensitive process
  4. Review the injecting process and its parent chain
  5. Dump and analyze the target process memory for injected code
  6. Investigate the system for additional process injection attempts
where: |
  contains("log.message", "dd ") &&
  regexMatch("log.message", "/proc/[0-9]+/mem")
groupBy:
  - origin.host
  - origin.user
