# Rule version v1.0.0

dataTypes:
  - linux
name: Perl Reverse Shell Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1059 - Command and Scripting Interpreter"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_perl_reverse_shell.yml
description: |
  Detects Perl-based reverse shell execution patterns using fdopen with Socket library. This is a well-known post-exploitation technique where attackers use Perl's built-in networking capabilities to establish a reverse shell connection back to their command and control server.

  Next Steps:
  1. Immediately isolate the affected system from the network
  2. Identify the destination IP and port of the reverse shell connection
  3. Determine how the attacker gained initial access to execute Perl
  4. Check for other compromised systems connecting to the same C2 address
  5. Review process tree to identify the parent process that spawned Perl
  6. Examine the system for persistence mechanisms and lateral movement
where: |
  contains("log.message", "perl") &&
  (
    (contains("log.message", "fdopen") && contains("log.message", "Socket")) ||
    (contains("log.message", "socket") && contains("log.message", "connect") && contains("log.message", "open") && contains("log.message", "STDIN"))
  )
groupBy:
  - origin.host
  - origin.ip
