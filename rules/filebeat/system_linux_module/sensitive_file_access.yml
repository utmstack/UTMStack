# Rule version v1.0.0

dataTypes:
  - linux
name: Suspicious Access to Sensitive System Files
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: "T1003.008 - OS Credential Dumping: /etc/passwd and /etc/shadow"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1003/008/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_sensitive_file_access.yml
description: |
  Detects suspicious access to critical system files including /etc/passwd, /etc/shadow, /etc/sudoers, /etc/crontab, and sensitive directories like /boot, /bin, /sbin. While system administrators may legitimately access these files, unusual access patterns can indicate credential theft, privilege escalation, or system tampering.

  Next Steps:
  1. Verify the user account accessing the sensitive files and their authorization
  2. Check the specific command used (cat, vi, nano, cp, scp)
  3. Determine if this aligns with legitimate administrative activity
  4. Review the access context - was it from an interactive session or automated process?
  5. Check for concurrent suspicious activities (reverse shells, lateral movement)
  6. If unauthorized, immediately reset affected credentials
  7. Audit file permissions on sensitive files
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)(cat|less|more|head|tail|vi|vim|nano|emacs|sed|awk)\\s+/etc/(shadow|gshadow)") ||
   regexMatch("log.message", "(?i)(vi|vim|nano|emacs|sed)\\s+/etc/(passwd|sudoers|crontab)") ||
   regexMatch("log.message", "(?i)(vi|vim|nano|emacs|sed)\\s+/etc/ssh/sshd_config") ||
   regexMatch("log.message", "(?i)(cp|scp|rsync)\\s+/etc/(shadow|gshadow|passwd)"))
afterEvents:
  - indexPattern: v11-log-linux-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-15m
    count: 3
groupBy:
  - origin.host
  - origin.user
