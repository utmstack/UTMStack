# Rule version v1.0.0

dataTypes:
  - linux
name: Comprehensive Reverse Shell Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Command and Control
technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/builtin/lnx_shell_susp_rev_shells.yml
  - https://www.revshells.com/
description: |
  Detects multiple reverse shell patterns in Linux system logs including bash, netcat, python, perl, ruby, socat, awk, xterm, and telnet variants. Reverse shells are one of the most common post-exploitation techniques used by attackers to establish interactive command and control channels from a compromised host back to their infrastructure.

  Next Steps:
  1. Immediately isolate the affected host from the network
  2. Identify the source process and user that spawned the reverse shell
  3. Determine the destination IP and port of the outbound connection
  4. Check for webshell presence or initial access vector that led to the reverse shell
  5. Review all processes and network connections on the compromised host
  6. Search for lateral movement from this host to other systems
  7. Collect forensic artifacts (memory dump, disk image) before remediation
  8. Block the C2 IP at the firewall and hunt for it across all systems
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)bash\\s+-i\\s+>&\\s*/dev/tcp/") ||
   regexMatch("log.message", "(?i)exec\\s+\\d+<>/dev/tcp/") ||
   regexMatch("log.message", "(?i)(nc|ncat|netcat)\\s+.*\\s+-(e|c)\\s+(/bin/)?(ba)?sh") ||
   regexMatch("log.message", "(?i)python[23]?\\s+-c\\s+.*socket.*pty.*spawn") ||
   regexMatch("log.message", "(?i)python[23]?\\s+-c\\s+.*socket.*connect.*subprocess") ||
   regexMatch("log.message", "(?i)perl\\s+-e\\s+.*socket.*INET.*exec") ||
   regexMatch("log.message", "(?i)perl\\s+-MIO\\s+-e") ||
   regexMatch("log.message", "(?i)php\\s+-r\\s+.*fsockopen") ||
   regexMatch("log.message", "(?i)ruby\\s+-rsocket\\s+-e") ||
   regexMatch("log.message", "(?i)ruby\\s+-e\\s+.*TCPSocket") ||
   regexMatch("log.message", "(?i)socat\\s+.*exec.*tcp") ||
   regexMatch("log.message", "(?i)socat\\s+.*tcp.*exec") ||
   regexMatch("log.message", "(?i)awk\\s+.*\\/inet\\/tcp\\/") ||
   regexMatch("log.message", "(?i)xterm\\s+-display\\s+\\d+") ||
   regexMatch("log.message", "(?i)telnet\\s+.*\\|\\s*/bin/(ba)?sh") ||
   regexMatch("log.message", "(?i)mkfifo\\s+/tmp/.*&&.*nc\\s+") ||
   regexMatch("log.message", "(?i)mknod\\s+/tmp/.*&&.*nc\\s+"))
groupBy:
  - origin.host
  - origin.user
