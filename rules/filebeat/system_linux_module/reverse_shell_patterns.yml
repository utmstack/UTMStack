# Rule version v1.0.0

dataTypes:
  - linux
name: Reverse Shell Patterns in System Logs
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Execution
technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/004/
description: |
  Detects common reverse shell patterns in system logs including bash TCP redirects, netcat shells, python socket connections, and other common reverse shell one-liners.

  Next Steps:
  1. Immediately isolate the affected system
  2. Identify the destination IP and port of the reverse shell
  3. Determine the initial access vector
  4. Check for data exfiltration or lateral movement
  5. Block the C2 IP at the network perimeter
  6. Perform full incident response on the host
where: |
  regexMatch("log.message", "(?i)bash\\s+-i\\s+>&\\s+/dev/tcp/") ||
  regexMatch("log.message", "(?i)python[23]?\\s+-c\\s+.*socket.*connect") ||
  regexMatch("log.message", "(?i)nc\\s+(-e|--exec)\\s+/bin/(ba)?sh") ||
  regexMatch("log.message", "(?i)socat\\s+.*exec.*tcp") ||
  regexMatch("log.message", "(?i)perl\\s+-e\\s+.*socket.*INET") ||
  regexMatch("log.message", "(?i)php\\s+-r\\s+.*fsockopen") ||
  regexMatch("log.message", "(?i)ruby\\s+-rsocket") ||
  regexMatch("log.message", "(?i)mkfifo\\s+/tmp/.*\\|.*nc\\s+")
groupBy:
  - origin.host
  - origin.ip
