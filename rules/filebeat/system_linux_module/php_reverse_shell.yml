# Rule version v1.0.0

dataTypes:
  - linux
name: PHP Reverse Shell Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Command and Control
technique: "T1059 - Command and Scripting Interpreter"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_php_reverse_shell.yml
description: |
  Detects PHP being used to establish a reverse shell via fsockopen or similar network functions. This is commonly seen on compromised web servers where an attacker leverages PHP's built-in socket functions to create a reverse connection. The presence of php -r with fsockopen in command lines is a strong indicator of active exploitation.

  Next Steps:
  1. Immediately isolate the affected web server from the network
  2. Identify the webshell or vulnerable application that triggered the PHP reverse shell
  3. Check for uploaded PHP files in web-accessible directories
  4. Review web server access logs for the initial exploitation request
  5. Determine the destination C2 IP and block it at the firewall
  6. Audit all PHP files on the server for additional webshells
  7. Patch the vulnerable application and restore from clean backup
where: |
  exists("log.message") &&
  regexMatch("log.message", "(?i)php\\s+-r\\s+.*fsockopen")
groupBy:
  - origin.host
  - origin.user
