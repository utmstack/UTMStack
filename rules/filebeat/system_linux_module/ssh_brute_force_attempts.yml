# Rule version v1.0.0

dataTypes:
  - linux
name: SSH Brute Force Attempts
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: "T1110.001 - Brute Force: Password Guessing"
adversary: origin
references:
  - https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-module-system.html
  - https://attack.mitre.org/techniques/T1110/001/
description: |
  Detects multiple failed SSH authentication attempts from the same source IP address, indicating a potential brute force attack against SSH services. This rule identifies patterns where an attacker attempts to guess passwords by making repeated login attempts.

  Next Steps:
  1. Immediately block the attacking IP address at the firewall level
  2. Review SSH logs for the timeframe to identify targeted usernames
  3. Check if any successful logins occurred from the same IP after failed attempts
  4. Verify SSH configuration follows security best practices (disable root login, use key-based authentication)
  5. Consider implementing fail2ban or similar intrusion prevention tools
  6. Monitor for lateral movement if any accounts were compromised
  7. Review other systems for similar brute force attempts from the same IP
  8. Consider adding the IP to threat intelligence feeds if confirmed malicious
where: contains("log.message", "Failed password") && contains("log.message", "ssh") && exists("origin.ip")
afterEvents:
  - indexPattern: v11-log-linux-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: log.message
        operator: filter_match
        value: "Failed password"
    within: now-5m
    count: 10
groupBy:
  - origin.ip
  - target.ip
