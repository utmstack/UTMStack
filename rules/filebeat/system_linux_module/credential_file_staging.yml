# Rule version v1.0.0

dataTypes:
  - linux
name: Credential File Copied to Staging Directory
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1552.001 - Unsecured Credentials: Credentials In Files"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_cp_passwd_or_shadow_tmp.yml
description: |
  Detects the copying of credential files (/etc/passwd, /etc/shadow, /etc/gshadow) to world-readable staging directories like /tmp or /dev/shm. This is a direct indicator of credential theft where an attacker stages sensitive files for exfiltration or offline password cracking. Legitimate administrators never copy these files to /tmp.

  Next Steps:
  1. Immediately remove the copied credential files from /tmp or /dev/shm
  2. Identify the user account that performed the copy
  3. Check if the shadow file was accessed - if so, assume all local passwords are compromised
  4. Force password resets for all local accounts on the affected system
  5. Investigate how the attacker gained the privileges to read /etc/shadow
  6. Look for exfiltration attempts (scp, curl, nc) from the same host
  7. Check for password cracking tool downloads or execution
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)cp\\s+/etc/(passwd|shadow|gshadow)\\s+/tmp") ||
   regexMatch("log.message", "(?i)cp\\s+/etc/(passwd|shadow|gshadow)\\s+/dev/shm") ||
   regexMatch("log.message", "(?i)cp\\s+/etc/(passwd|shadow|gshadow)\\s+/var/tmp") ||
   regexMatch("log.message", "(?i)cat\\s+/etc/(shadow|gshadow)\\s*>\\s*/tmp/") ||
   regexMatch("log.message", "(?i)cat\\s+/etc/(shadow|gshadow)\\s*>\\s*/dev/shm/"))
groupBy:
  - origin.host
  - origin.user
