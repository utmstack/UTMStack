# Rule version v1.0.0

dataTypes:
  - linux
name: Setcap Privilege Escalation via cap_setuid
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: "T1548 - Abuse Elevation Control Mechanism"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1548/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_cap_setuid.yml
  - https://gtfobins.github.io/
description: |
  Detects the use of setcap to grant cap_setuid or other dangerous capabilities to binaries. Linux capabilities allow splitting root privileges into distinct units. The cap_setuid capability allows a process to change its UID, effectively gaining root access. Attackers use setcap to create persistent privilege escalation backdoors that are harder to detect than traditional SUID bits.

  Next Steps:
  1. Identify the binary that was granted dangerous capabilities
  2. Determine if this is a legitimate administrative action
  3. Check the binary's integrity against package manager records
  4. Remove unauthorized capabilities: setcap -r /path/to/binary
  5. Search for other binaries with dangerous capabilities: getcap -r / 2>/dev/null
  6. Investigate how the attacker gained the privileges needed to run setcap
  7. Check if the capability-enhanced binary has been used for privilege escalation
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)setcap\\s+.*cap_setuid") ||
   regexMatch("log.message", "(?i)setcap\\s+.*cap_setgid") ||
   regexMatch("log.message", "(?i)setcap\\s+.*cap_sys_admin") ||
   regexMatch("log.message", "(?i)setcap\\s+.*cap_sys_ptrace") ||
   regexMatch("log.message", "(?i)setcap\\s+.*cap_dac_override") ||
   regexMatch("log.message", "(?i)setcap\\s+.*cap_net_raw") ||
   regexMatch("log.message", "(?i)setcap\\s+.*cap_net_admin"))
groupBy:
  - origin.host
  - origin.user
