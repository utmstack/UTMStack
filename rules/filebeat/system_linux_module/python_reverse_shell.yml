# Rule version v1.0.0

dataTypes:
  - linux
name: Python Reverse Shell Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Command and Control
technique: "T1059.006 - Command and Scripting Interpreter: Python"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/006/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_python_reverse_shell.yml
description: |
  Detects Python being used with socket and pty modules to establish a reverse shell. This is a very common post-exploitation technique, particularly after webshell access or application-level compromise. The combination of socket+pty+spawn+connect is a strong indicator of malicious activity.

  Next Steps:
  1. Immediately isolate the affected host from the network
  2. Identify the parent process that spawned Python (web server, cron, etc.)
  3. Determine the destination IP and port of the outbound connection
  4. Check for webshell files if the parent process is a web server
  5. Review Python process arguments and any scripts referenced
  6. Search for additional persistence mechanisms on the host
  7. Hunt for the same C2 IP across all monitored systems
where: |
  exists("log.message") &&
  regexMatch("log.message", "(?i)python[23]?\\s+-c\\s+.*socket.*pty.*spawn") &&
  contains("log.message", "connect")
groupBy:
  - origin.host
  - origin.user
