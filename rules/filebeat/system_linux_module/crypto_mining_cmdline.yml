# Rule version v1.0.0

dataTypes:
  - linux
name: Cryptocurrency Mining Command Line Indicators
impact:
  confidentiality: 1
  integrity: 2
  availability: 3
category: Resource Hijacking
technique: "T1496 - Resource Hijacking"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1496/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_crypto_mining.yml
description: |
  Detects cryptocurrency mining software execution based on distinctive command-line arguments. This includes mining-specific parameters such as --cpu-priority, --donate-level, stratum+tcp://, --algo=rx/0, and other Monero/XMR mining indicators. Unauthorized crypto mining is a common objective of automated Linux exploits and worms.

  Next Steps:
  1. Identify and terminate the mining process immediately
  2. Determine the mining pool and wallet address being used
  3. Check CPU utilization to confirm active mining
  4. Investigate how the miner was installed (exploit, compromised credentials, malicious package)
  5. Search for persistence mechanisms (cron jobs, systemd services, init scripts)
  6. Check for additional compromised hosts mining to the same pool
  7. Remove all mining-related files and restore system to clean state
  8. Patch the vulnerability that led to the initial compromise
where: |
  exists("log.message") &&
  (contains("log.message", "--donate-level") ||
   contains("log.message", "stratum+tcp://") ||
   contains("log.message", "stratum+ssl://") ||
   contains("log.message", "stratum+tls://") ||
   contains("log.message", "--coin=") ||
   regexMatch("log.message", "(?i)--algo=(rx/0|cn/|randomx|cryptonight)") ||
   contains("log.message", "--cpu-priority") ||
   contains("log.message", "--threads=") ||
   regexMatch("log.message", "(?i)(xmrig|xmr-stak|cpuminer|minerd|cgminer|bfgminer|ethminer|nbminer|t-rex)") ||
   contains("log.message", "pool.minexmr.com") ||
   contains("log.message", "pool.hashvault.pro"))
groupBy:
  - origin.host
  - origin.user
