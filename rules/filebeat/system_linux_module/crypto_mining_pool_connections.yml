# Rule version v1.0.0

dataTypes:
  - linux
name: Cryptocurrency Mining Pool Connection
impact:
  confidentiality: 1
  integrity: 2
  availability: 3
category: Resource Hijacking
technique: "T1496 - Resource Hijacking"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1496/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/network_connection/net_connection_lnx_crypto_mining_indicators.yml
description: |
  Detects network connections or DNS lookups to known cryptocurrency mining pool hostnames. This covers major Monero, Bitcoin, and Ethereum mining pools. Connections to these hosts from production servers are almost always indicators of unauthorized cryptocurrency mining.

  Next Steps:
  1. Identify the process making connections to mining pools
  2. Terminate the mining process and remove associated files
  3. Block mining pool domains and IPs at the firewall/proxy
  4. Check for persistence mechanisms maintaining the miner
  5. Investigate the initial compromise vector
  6. Audit other systems for similar mining pool connections
  7. Review DNS logs for mining pool lookups from other hosts
where: |
  exists("log.message") &&
  regexMatch("log.message", "(?i)(pool\\.minergate\\.com|xmrpool\\.eu|moneropool\\.com|monerohash\\.com|minexmr\\.com|pool\\.hashvault\\.pro|xmr\\.nanopool\\.org|xmr\\.2miners\\.com|pool\\.supportxmr\\.com|xmr-eu1\\.nanopool\\.org|xmr-eu2\\.nanopool\\.org|xmr-us-east1\\.nanopool\\.org|xmr-us-west1\\.nanopool\\.org|xmr-asia1\\.nanopool\\.org|randomxmonero\\.auto|gulf\\.moneroocean\\.stream|xmr\\.herominers\\.com|pool\\.xmr\\.pt|xmr\\.f2pool\\.com|xmrpool\\.net|xmr-eu\\.dwarfpool\\.com|monero\\.crypto-pool\\.fr|mine\\.c3pool\\.com)")
groupBy:
  - origin.host
  - origin.user
