# Rule version v1.0.0

dataTypes:
  - linux
name: Bash /dev/tcp Reverse Shell Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Command and Control
technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/builtin/lnx_susp_dev_tcp.yml
description: |
  Detects the classic bash reverse shell pattern using /dev/tcp, including "bash -i >& /dev/tcp/" and "exec 3<>/dev/tcp/" variants. The /dev/tcp pseudo-device is a bash built-in for TCP connections and its use in command lines is almost exclusively malicious. This is one of the most commonly used reverse shell techniques.

  Next Steps:
  1. Immediately isolate the affected host from the network
  2. Extract the destination IP and port from the /dev/tcp path
  3. Block the C2 IP at the network perimeter
  4. Identify the user account and process tree that executed the command
  5. Check for initial access vector and persistence mechanisms
  6. Hunt for the same C2 IP across all systems
  7. Perform full forensic analysis of the compromised host
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)bash\\s+-i\\s+>&\\s*/dev/tcp/") ||
   regexMatch("log.message", "(?i)exec\\s+\\d+<>/dev/tcp/") ||
   contains("log.message", "/dev/tcp/"))
groupBy:
  - origin.host
  - origin.user
