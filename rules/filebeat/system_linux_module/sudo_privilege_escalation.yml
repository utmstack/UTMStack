# Rule version v1.0.0

dataTypes:
  - linux
name: Sudo Privilege Escalation Attempts
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: "T1548.003 - Abuse Elevation Control Mechanism: Sudo and Sudo Caching"
adversary: origin
references:
  - https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-module-system.html
  - https://attack.mitre.org/techniques/T1548/003/
description: |
  Detects unauthorized sudo usage attempts and privilege escalation through sudo command execution. This rule identifies failed sudo attempts including users not in sudoers file, authentication failures, and command restrictions.
  
  Next Steps:
  1. Verify the legitimacy of the user attempting sudo access
  2. Review the specific command that was attempted
  3. Check if this is part of a broader privilege escalation campaign
  4. Examine system logs for additional suspicious activity from this user/host
  5. Consider implementing additional sudo restrictions if unauthorized access attempts persist
  6. Correlate with other authentication events from the same user or host
where: contains("log.message", "sudo") && (contains("log.message", "NOT in sudoers") || contains("log.message", "authentication failure") || contains("log.message", "command not allowed")) && exists("origin.host")
afterEvents:
  - indexPattern: v11-log-linux-*
    with:
      - field: origin.host
        operator: filter_term
        value: '{{.origin.host}}'
    within: now-10m
    count: 3
groupBy:
  - origin.host
  - origin.user
