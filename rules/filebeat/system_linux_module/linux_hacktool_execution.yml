# Rule version v1.0.0

dataTypes:
  - linux
name: Linux Hack Tool Execution
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: "T1588.002 - Obtain Capabilities: Tool"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1588/002/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_hktl_execution.yml
description: |
  Detects execution of known offensive security and hacking tools on Linux systems. This includes C2 frameworks (Cobalt Strike, Sliver, Havoc, Merlin), post-exploitation tools (LinPEAS, pspy, Chisel), credential attack tools (Hydra, John, Hashcat, Mimikatz), network attack tools (CrackMapExec, Impacket, Responder), and vulnerability scanners (sqlmap, Nikto, ncrack). The presence of these tools on a production system is a strong indicator of compromise.

  Next Steps:
  1. Immediately isolate the affected host from the network
  2. Identify the user account executing the tool and determine if it is compromised
  3. Check how the tool was installed (downloaded, transferred, compiled on host)
  4. Review process history and network connections for scope of attack
  5. Search for additional compromised hosts using the same tools
  6. Collect forensic artifacts from the system
  7. Remove the offensive tools and remediate the compromise
  8. Reset credentials for any accounts accessed from the compromised host
where: |
  exists("log.message") &&
  regexMatch("log.message", "(?i)(crackmapexec|cme\\s|evil-winrm|sliver-client|sliver-server|havoc|merlin|msfconsole|msfvenom|meterpreter|pspy|pspy64|linpeas|linpeas\\.sh|winpeas|linenum|linux-exploit-suggester|les\\.sh|linux-smart-enumeration|lse\\.sh|hydra|john |johntheripper|hashcat|ncrack|medusa|patator|sqlmap|sqlninja|nikto|gobuster|feroxbuster|dirbuster|dirb |ffuf |wfuzz|nuclei |subfinder|amass |masscan|nmap\\s|responder|impacket|secretsdump|chisel|ligolo|bloodhound-python|sharphound|rubeus|mimikatz|lazagne|enum4linux|smbmap|cracklord|thc-hydra)")
groupBy:
  - origin.host
  - origin.user
