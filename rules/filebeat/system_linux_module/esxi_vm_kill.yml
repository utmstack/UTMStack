# Rule version v1.0.0

dataTypes:
  - linux
name: ESXi VM Process Kill - Ransomware Precursor
impact:
  confidentiality: 2
  integrity: 3
  availability: 3
category: Impact
technique: "T1529 - System Shutdown/Reboot"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1529/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_esxcli_vm_kill.yml
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-039a
description: |
  Detects the use of esxcli to kill virtual machine processes on VMware ESXi hypervisors. This is a critical pre-encryption step used by ransomware groups (ESXiArgs, Royal, LockBit, BlackBasta) to shut down VMs before encrypting their VMDK files. The esxcli vm process kill command is the standard method used by ESXi ransomware variants.

  Next Steps:
  1. THIS IS A CRITICAL ALERT - immediately isolate the ESXi host from the network
  2. Check if ransomware encryption has already begun (look for .encrypted, .locked extensions on datastores)
  3. Identify all VMs that were killed and assess business impact
  4. Determine how the attacker gained access to the ESXi host (CVE exploitation, stolen credentials)
  5. Verify ESXi host integrity and check for dropped ransomware binaries
  6. Check for ransom notes on datastores
  7. Do NOT restart VMs until forensic analysis is complete
  8. Activate incident response and business continuity procedures
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)esxcli\\s+vm\\s+process\\s+kill") ||
   regexMatch("log.message", "(?i)vim-cmd\\s+vmsvc/power\\.off") ||
   regexMatch("log.message", "(?i)esxcli\\s+vm\\s+process\\s+list"))
groupBy:
  - origin.host
  - origin.user
