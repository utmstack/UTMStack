# Rule version v1.0.0

dataTypes:
  - linux
name: Netcat Reverse Shell Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Command and Control
technique: "T1059 - Command and Scripting Interpreter"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_netcat_reverse_shell.yml
description: |
  Detects netcat (nc/ncat/netcat) being used with -c or -e flags to spawn a shell, which is the most common method of establishing a reverse shell on Linux systems. This is almost never used legitimately and is a strong indicator of active compromise.

  Next Steps:
  1. Immediately isolate the affected host from the network
  2. Identify the user and parent process that executed netcat
  3. Determine the destination IP and port of the reverse shell connection
  4. Check for initial access vectors (webshell, exploited service, stolen credentials)
  5. Search for persistence mechanisms installed by the attacker
  6. Review network connections from the host for additional C2 channels
  7. Hunt for the same destination IP across all monitored systems
where: |
  exists("log.message") &&
  regexMatch("log.message", "(?i)(nc|ncat|netcat)\\s+.*-(e|c)\\s+(/bin/)?(ba)?sh")
groupBy:
  - origin.host
  - origin.user
