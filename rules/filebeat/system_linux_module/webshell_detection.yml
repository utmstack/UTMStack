# Rule version v1.0.0

dataTypes:
  - linux
name: Webshell Activity - Web Server Spawning Suspicious Commands
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Persistence
technique: "T1505.003 - Server Software Component: Web Shell"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml
description: |
  Detects web server processes (httpd, nginx, apache2, tomcat, java) spawning reconnaissance or system commands such as whoami, ifconfig, uname, id, cat, crontab, wget, curl. This pattern strongly indicates an active webshell being used by an attacker to execute commands on the compromised server.

  Next Steps:
  1. Immediately isolate the web server from the network
  2. Identify the specific webshell file by reviewing web server access logs around the alert time
  3. Search for recently created or modified files in web-accessible directories
  4. Check for uploaded files with PHP, JSP, ASP, or CGI extensions
  5. Review the commands executed through the webshell to assess scope of compromise
  6. Look for lateral movement or data exfiltration from this host
  7. Patch the vulnerability that allowed the webshell upload
  8. Restore web application files from a clean, verified backup
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)(httpd|nginx|apache2|tomcat|catalina|java).*child process.*(whoami|ifconfig|uname|id |cat |crontab|wget |curl )") ||
   regexMatch("log.message", "(?i)(httpd|nginx|apache2|tomcat|catalina)\\[\\d+\\].*exec.*(whoami|ifconfig|uname|/bin/id|/bin/cat|/bin/sh|/bin/bash|wget|curl)") ||
   (contains("log.message", ["httpd", "nginx", "apache2", "tomcat"]) &&
    contains("log.message", ["whoami", "ifconfig", "uname -a", "/etc/passwd", "id;", "cat /etc"])))
groupBy:
  - origin.host
  - origin.user
