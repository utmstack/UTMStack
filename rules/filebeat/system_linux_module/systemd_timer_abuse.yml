# Rule version v1.0.0

dataTypes:
  - linux
name: Malicious Systemd Timer Creation
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Persistence
technique: "T1053.006 - Scheduled Task/Job: Systemd Timers"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1053/006/
description: |
  Detects creation or enablement of systemd timer units through system logs, which attackers use for persistent scheduled execution of malicious payloads.

  Next Steps:
  1. Review the timer unit and associated service unit file contents
  2. Check the ExecStart directive for suspicious binaries or scripts
  3. Verify the timer was created by an authorized administrator
  4. Compare against baseline of known legitimate timers
  5. If unauthorized, disable the timer and investigate
where: |
  (contains("log.message", "systemd") || contains("log.message", "systemctl")) &&
  contains("log.message", ".timer") &&
  (contains("log.message", "enabled") || contains("log.message", "Created symlink")) &&
  !contains("log.message", ["logrotate", "man-db", "fstrim", "apt-daily", "snapd", "certbot", "unattended-upgrades"])
groupBy:
  - origin.host
  - origin.user
