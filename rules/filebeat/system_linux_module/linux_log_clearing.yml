# Rule version v1.0.0

dataTypes:
  - linux
name: Linux Log File Clearing
impact:
  confidentiality: 1
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1070.002 - Indicator Removal: Clear Linux or Mac System Logs"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1070/002/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml
description: |
  Detects commands used to delete or overwrite Linux log files in /var/log. Attackers frequently clear logs to cover their tracks after compromising a system. Commands like rm, shred, unlink, and truncation of log files are indicators of anti-forensic activity.

  Next Steps:
  1. Identify the user account and process that deleted the log files
  2. Check for any remaining log entries before the clearing event
  3. Review remote syslog backups or SIEM data for the deleted timeframe
  4. Investigate what the attacker was trying to hide
  5. Look for other anti-forensic activities (history deletion, timestamp manipulation)
  6. Check for active compromise indicators on the system
  7. Preserve all remaining forensic artifacts immediately
  8. Consider the system compromised and investigate lateral movement
where: |
  exists("log.message") &&
  (regexMatch("log.message", "(?i)(rm|shred|unlink)\\s+(-rf?\\s+)?/var/log") ||
   regexMatch("log.message", "(?i)>\\s*/var/log/(syslog|auth\\.log|messages|secure|wtmp|btmp|lastlog)") ||
   regexMatch("log.message", "(?i)truncate\\s+(-s\\s+0\\s+)?/var/log/") ||
   regexMatch("log.message", "(?i)cat\\s+/dev/null\\s*>\\s*/var/log/"))
groupBy:
  - origin.host
  - origin.user
