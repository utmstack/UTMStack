# Rule version v1.0.0

dataTypes:
  - linux
name: Immutable File Flag Removal via chattr
impact:
  confidentiality: 1
  integrity: 3
  availability: 2
category: Defense Evasion
technique: "T1222.002 - File and Directory Permissions Modification: Linux and Mac File and Directory Permissions Modification"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1222/002/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_chattr_immutable_removal.yml
description: |
  Detects the removal of the immutable flag from files using chattr -i. The immutable flag prevents files from being modified or deleted, even by root. Ransomware and rootkits commonly remove this flag before modifying or encrypting protected system files.

  Next Steps:
  1. Identify which files had their immutable flag removed
  2. Check if those files were subsequently modified or deleted
  3. Look for ransomware indicators (encryption, ransom notes)
  4. Examine the process and user that executed chattr
  5. Verify the integrity of the affected files
  6. Restore the immutable flag on critical system files
where: |
  contains("log.message", "chattr") &&
  contains("log.message", "-i")
groupBy:
  - origin.host
  - origin.user
