# Rule version v1.0.0

dataTypes:
  - linux
name: Suspicious Package Installation Detected
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Execution
technique: "T1072 - Software Deployment Tools"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1072/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_install_suspicious_packages.yml
description: |
  Detects the installation of offensive security tools or suspicious packages via apt, yum, or dnf. Packages like nmap, netcat, wireshark, proxychains, socat, and similar tools are commonly installed by attackers during post-exploitation for reconnaissance, pivoting, and lateral movement.

  Next Steps:
  1. Verify if the package installation was authorized by system administrators
  2. Identify the user who installed the package and their access context
  3. Check for other reconnaissance or exploitation activity from the same user
  4. Review if the tools were actually used after installation
  5. Remove unauthorized tools and restrict package installation privileges
  6. Investigate how the attacker obtained privileges to install packages
where: |
  contains("log.message", ["apt install", "apt-get install", "yum install", "dnf install"]) &&
  contains("log.message", ["nmap", "netcat", "ncat", "wireshark", "tshark", "proxychains", "socat", "masscan", "hydra", "john", "hashcat", "aircrack", "ettercap", "responder", "mimikatz", "crackmapexec", "enum4linux"])
groupBy:
  - origin.host
  - origin.user
