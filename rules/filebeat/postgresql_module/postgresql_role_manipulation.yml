# Rule version v1.0.0

dataTypes:
  - postgresql
name: PostgreSQL Superuser Role Manipulation Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: "T1098 - Account Manipulation"
adversary: origin
references:
  - https://www.postgresql.org/docs/current/sql-createrole.html
  - https://attack.mitre.org/techniques/T1098/
description: |
  Detects creation or modification of PostgreSQL roles with SUPERUSER, CREATEDB, CREATEROLE, or REPLICATION privileges. Attackers escalate privileges by creating backdoor superuser accounts or modifying existing roles.

  Next Steps:
  1. Verify if the role creation/modification was authorized
  2. Identify the user who performed the operation
  3. Review the granted privileges and assess risk
  4. Check for other unauthorized role changes
  5. Remove unauthorized roles or privileges immediately
  6. Implement role-based access control with least privilege
where: |
  exists("log.msg") &&
  (
    regexMatch("log.msg", "(?i)CREATE\\s+ROLE\\s+\\w+.*SUPERUSER") ||
    regexMatch("log.msg", "(?i)ALTER\\s+ROLE\\s+\\w+.*SUPERUSER") ||
    regexMatch("log.msg", "(?i)CREATE\\s+USER\\s+\\w+.*SUPERUSER") ||
    regexMatch("log.msg", "(?i)ALTER\\s+USER\\s+\\w+.*SUPERUSER") ||
    regexMatch("log.msg", "(?i)GRANT\\s+.*\\bSUPERUSER\\b") ||
    regexMatch("log.msg", "(?i)(CREATE|ALTER)\\s+(ROLE|USER)\\s+\\w+.*CREATEROLE") ||
    regexMatch("log.msg", "(?i)(CREATE|ALTER)\\s+(ROLE|USER)\\s+\\w+.*REPLICATION") ||
    regexMatch("log.msg", "(?i)GRANT\\s+.*TO\\s+.*WITH\\s+ADMIN\\s+OPTION")
  )
afterEvents:
  - indexPattern: v11-log-postgresql-*
    with:
      - field: target.host
        operator: filter_term
        value: '{{.target.host}}'
    within: now-10m
    count: 3
groupBy:
  - lastEvent.log.sessionId
  - adversary.host
