# Rule version v1.0.0

dataTypes:
  - postgresql
name: PostgreSQL Foreign Data Wrapper Exfiltration Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Data Exfiltration
technique: "T1048 - Exfiltration Over Alternative Protocol"
adversary: origin
references:
  - https://www.postgresql.org/docs/current/postgres-fdw.html
  - https://attack.mitre.org/techniques/T1048/
description: |
  Detects abuse of PostgreSQL Foreign Data Wrappers (FDW) for data exfiltration. Attackers create foreign servers pointing to external systems to transfer data out of the database through SQL queries.

  Next Steps:
  1. Review the foreign server and user mapping configurations
  2. Verify the external server address is legitimate
  3. Check what data is accessible through the foreign tables
  4. Remove unauthorized foreign servers and user mappings
  5. Restrict CREATE SERVER and CREATE FOREIGN TABLE privileges
  6. Monitor network connections from the database server
where: |
  exists("log.msg") &&
  (
    regexMatch("log.msg", "(?i)CREATE\\s+SERVER\\s+\\w+\\s+FOREIGN\\s+DATA\\s+WRAPPER") ||
    regexMatch("log.msg", "(?i)CREATE\\s+FOREIGN\\s+TABLE") ||
    regexMatch("log.msg", "(?i)CREATE\\s+USER\\s+MAPPING\\s+FOR") ||
    regexMatch("log.msg", "(?i)CREATE\\s+EXTENSION\\s+(IF\\s+NOT\\s+EXISTS\\s+)?postgres_fdw") ||
    regexMatch("log.msg", "(?i)CREATE\\s+EXTENSION\\s+(IF\\s+NOT\\s+EXISTS\\s+)?file_fdw") ||
    regexMatch("log.msg", "(?i)IMPORT\\s+FOREIGN\\s+SCHEMA")
  )
groupBy:
  - lastEvent.log.sessionId
  - adversary.host
