# Rule version v1.0.0

dataTypes:
  - postgresql
name: PostgreSQL dblink Exfiltration Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Data Exfiltration
technique: "T1048 - Exfiltration Over Alternative Protocol"
adversary: origin
references:
  - https://www.postgresql.org/docs/current/dblink.html
  - https://attack.mitre.org/techniques/T1048/
description: |
  Detects use of dblink_connect to establish connections to external database servers for data exfiltration. Attackers use dblink to transfer data from compromised databases to attacker-controlled servers.

  Next Steps:
  1. Review the dblink connection string for the target server
  2. Verify if the external connection was authorized
  3. Check what queries were executed through dblink
  4. Remove the dblink extension if not needed
  5. Implement network-level restrictions on outbound database connections
  6. Audit database extensions and revoke unnecessary permissions
where: |
  exists("log.msg") &&
  (
    regexMatch("log.msg", "(?i)dblink_connect\\s*\\(") ||
    regexMatch("log.msg", "(?i)dblink\\s*\\(") ||
    regexMatch("log.msg", "(?i)dblink_exec\\s*\\(") ||
    regexMatch("log.msg", "(?i)CREATE\\s+EXTENSION\\s+(IF\\s+NOT\\s+EXISTS\\s+)?dblink") ||
    (contains("log.msg", "dblink") && regexMatch("log.msg", "(?i)host(addr)?\\s*=\\s*[0-9]+\\.[0-9]+"))
  )
groupBy:
  - lastEvent.log.sessionId
  - adversary.host
