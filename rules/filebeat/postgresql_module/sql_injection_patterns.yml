# Rule version v1.0.0

dataTypes:
  - postgresql
name: PostgreSQL SQL Injection Attack Detected
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Initial Access
technique: "T1190 - Exploit Public-Facing Application"
adversary: origin
references:
  - https://www.postgresql.org/docs/current/sql-syntax.html
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05-Testing_for_SQL_Injection
description: |
  Detects SQL injection patterns in PostgreSQL logs including common injection techniques, error-based injections, and malicious SQL syntax patterns.
  
  Next Steps:
  1. Review the SQL query that triggered this alert to confirm if it contains injection patterns
  2. Identify the source IP/host and user account associated with the session
  3. Check for any successful data access or schema modifications following this attempt
  4. Review application logs to identify the input vector used for injection
  5. Consider blocking the source IP if multiple injection attempts are detected
  6. Patch or update the vulnerable application code to properly sanitize inputs
where: |
  equals("log.messageType", "ERROR") &&
  (regexMatch("log.msg", "(?i)(['\");]\\s*(OR|AND)\\s+[0-9]+=\\s*[0-9]+)") ||
   regexMatch("log.msg", "(?i)(UNION\\s+(ALL\\s+)?SELECT)") ||
   regexMatch("log.msg", "(?i)(';\\s*(DROP|ALTER|TRUNCATE)\\s+(TABLE|DATABASE))") ||
   contains("log.msg", "xp_cmdshell") ||
   regexMatch("log.msg", "(?i)(WAITFOR\\s+DELAY|pg_sleep)") ||
   contains("log.msg", "1=1") ||
   contains("log.msg", "' OR '"))
afterEvents:
  - indexPattern: v11-log-postgresql-*
    with:
      - field: target.host
        operator: filter_term
        value: '{{.target.host}}'
      - field: log.messageType
        operator: filter_term
        value: 'ERROR'
    within: now-15m
    count: 5
groupBy:
  - lastEvent.log.sessionId
  - target.host
