- id: 1033
  dataTypes:
    - wineventlog
  name: DCOM Lateral Movement Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Lateral Movement
  technique: "T1021.003 - Remote Services: Distributed Component Object Model"
  adversary: origin
  references:
    - https://medium.com/@cY83rR0H1t/detecting-dcom-lateral-movement-ee2b461a8705
    - https://attack.mitre.org/techniques/T1021/003/
  description: |
    Detects potential DCOM lateral movement attempts by monitoring for suspicious process creation with DCOM-related command line parameters. Looks for processes with automation embedding flags and specific DCOM object CLSIDs commonly abused for lateral movement such as ShellWindows and MMC20.Application.
    
    Next Steps:
    1. Investigate the source host and user account that initiated the DCOM activity
    2. Review network connections between the source and target systems around the time of the alert
    3. Check for additional lateral movement indicators on both source and target systems
    4. Examine the specific DCOM objects and CLSIDs being accessed for known malicious usage
    5. Verify if the DCOM activity aligns with legitimate business processes or scheduled tasks
    6. Look for privilege escalation attempts following the lateral movement
    7. Check for any data exfiltration or persistence mechanisms deployed post-compromise
  where: safe(log.eventCode, "") == "4688" && safe(log.winlogEventDataProcessCommandLine, "") != "" && (contains(safe(log.winlogEventDataProcessCommandLine, ""), "/automation -Embedding") || contains(safe(log.winlogEventDataProcessCommandLine, ""), "9BA05972-F6A8-11CF-A442-00A0C90A8F39") || contains(safe(log.winlogEventDataProcessCommandLine, ""), "c08afd90-f2a1-11d1-8455-00a0c91f3880") || contains(safe(log.winlogEventDataProcessCommandLine, ""), "MMC20.Application") || contains(safe(log.winlogEventDataProcessCommandLine, ""), "Document.Application.ShellExecute") || contains(safe(log.winlogEventDataProcessCommandLine, ""), "GetTypeFromCLSID") || contains(safe(log.winlogEventDataProcessCommandLine, ""), "GetTypeFromProgID"))
  afterEvents:
    - indexPattern: v11-log-wineventlog-*
      with:
        - field: origin.host.keyword
          operator: filter_term
          value: '{{origin.host}}'
        - field: log.eventCode.keyword
          operator: filter_term
          value: '4624'
        - field: log.winlogEventDataLogonType.keyword
          operator: filter_term
          value: '3'
      within: now-5m
      count: 1
  deduplicateBy:
    - origin.host
    - log.winlogEventDataProcessName
