# Rule version v1.0.0

dataTypes:
  - wineventlog
name: AS-REP Roasting Attack Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1558.004 - Steal or Forge Kerberos Tickets: AS-REP Roasting"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1558/004/
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4768
  - https://blog.harmj0y.net/activedirectory/roasting-as-reps/
description: |
  Detects AS-REP Roasting attacks targeting accounts with Kerberos pre-authentication disabled.
  Attackers request AS-REP messages encrypted with RC4 (0x17) for accounts that do not require
  pre-authentication, enabling offline password cracking. This is a companion technique to Kerberoasting
  and targets a different set of vulnerable accounts.

  Next Steps:
  1. Identify accounts with pre-authentication disabled and evaluate business justification
  2. Enable Kerberos pre-authentication on all identified accounts
  3. Verify the requesting source IP is not a known attack tool
  4. Reset passwords for targeted accounts using strong, complex passwords
  5. Audit Active Directory for accounts with DONT_REQUIRE_PREAUTH flag
  6. Monitor for subsequent credential usage from the requesting IP
where: |
  !oneOf("dataSource", ["", "unknown"]) &&
  exists("log.authenticationSource") && exists("log.authenticationSourceType") && exists("log.authenticationSourceDomain") &&
  (
  equals("log.eventCode", "4768") &&
  equals("log.channel", "Security") &&
  equals("log.eventDataTicketEncryptionType", "23") &&
  equals("log.eventDataPreAuthType", "0") &&
  !regexMatch("target.user", "(?i)\\$$") &&
  exists("target.user")
  )
afterEvents:
  - indexPattern: v11-log-wineventlog-*
    with:
      - field: dataSource.keyword
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.authenticationSource.keyword
        operator: filter_term
        value: '{{.log.authenticationSource}}'
      - field: log.authenticationSourceType.keyword
        operator: filter_term
        value: '{{.log.authenticationSourceType}}'
      - field: log.authenticationSourceDomain.keyword
        operator: filter_term
        value: '{{.log.authenticationSourceDomain}}'
      - field: log.authenticationCandidate.asrepRoastingDetection.keyword
        operator: filter_term
        value: match
      - field: log.eventCode
        operator: filter_term
        value: '{{.log.eventCode}}'
      - field: log.eventDataTicketEncryptionType
        operator: filter_term
        value: '{{.log.eventDataTicketEncryptionType}}'
      - field: log.eventDataPreAuthType
        operator: filter_term
        value: '{{.log.eventDataPreAuthType}}'
    within: 15m
    count: 3
groupBy:
  - dataSource
  - lastEvent.log.authenticationSourceType
  - lastEvent.log.authenticationSource
  - lastEvent.log.authenticationSourceDomain
  - target.user
