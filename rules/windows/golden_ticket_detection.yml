# Rule version v1.1.0

dataTypes:
  - wineventlog
name: Golden Ticket Attack Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Credential Access
technique: "T1558.001 - Steal or Forge Kerberos Tickets: Golden Ticket"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1558/001/
  - https://adsecurity.org/?p=1640
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventID=4769
description: |
  Detects Golden Ticket attacks where adversaries forge Kerberos TGTs using the KRBTGT account
  hash, granting unlimited domain access. The rule detects anomalous TGT usage patterns including
  TGS requests with unusual encryption types, tickets with abnormally long lifetimes, and Kerberos
  authentication from non-domain-controller sources for the KRBTGT service.

  It alerts on failed TGS requests for the krbtgt service (4769) and on special logons that
  hold SeTcbPrivilege (4672) for accounts other than the built-in SYSTEM, LOCAL SERVICE and
  NETWORK SERVICE identities, which are recognised by SID so that translated names such as
  SISTEMA or Système are excluded too. TGT requests (4768) are not used: a forged TGT is never
  requested from the KDC, a failed request issues no ticket, and RC4 tickets are routinely
  issued to accounts that still hold only RC4 keys. Three matching events from one source
  within 30 minutes are required, and one alert is raised per domain controller and account;
  repeats are suppressed for seven days.

  Next Steps:
  1. Immediately verify if the KRBTGT account password has been compromised
  2. Reset the KRBTGT password TWICE to invalidate all existing tickets
  3. Identify the source host and investigate for full domain compromise
  4. Review all domain admin activity from the suspected timeframe
  5. Check for DCSync or NTDS.dit extraction as precursor activities
  6. Audit all privileged account access across the domain
  7. Consider rebuilding the domain if compromise is confirmed
  8. Implement Kerberos armoring and constrained delegation
where: |
  !oneOf("dataSource", ["", "unknown"]) &&
  exists("log.authenticationSource") && exists("log.authenticationSourceType") && exists("log.authenticationSourceDomain") &&
  (
  (
    equals("log.eventCode", "4769") &&
    equals("log.channel", "Security") &&
    equals("log.eventDataServiceName", "krbtgt") &&
    !equals("log.eventDataStatus", "0") &&
    exists("log.authenticationSource")
  ) ||
  (
    equals("log.eventCode", "4672") &&
    equals("log.channel", "Security") &&
    contains("log.eventDataPrivilegeList", "SeTcbPrivilege") &&
    !oneOf("log.eventDataSubjectUserSid", ["S-1-5-18", "S-1-5-19", "S-1-5-20"]) &&
    !regexMatch("log.eventDataSubjectUserName", "(?i)^(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)$") &&
    !regexMatch("log.eventDataSubjectUserName", "(?i)\\$$")
  )
  )
afterEvents:
  - indexPattern: v11-log-wineventlog-*
    with:
      - field: dataSource.keyword
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.authenticationSource.keyword
        operator: filter_term
        value: '{{.log.authenticationSource}}'
      - field: log.authenticationSourceType.keyword
        operator: filter_term
        value: '{{.log.authenticationSourceType}}'
      - field: log.authenticationSourceDomain.keyword
        operator: filter_term
        value: '{{.log.authenticationSourceDomain}}'
      - field: log.authenticationCandidate.goldenTicketDetection.keyword
        operator: filter_term
        value: match
      - field: log.eventCode
        operator: filter_term
        value: '{{.log.eventCode}}'
    within: 30m
    count: 3
deduplicateBy:
  - dataSource
  - adversary.user
