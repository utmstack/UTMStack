# Rule version v1.3.0
dataTypes:
  - wineventlog
name: 'Windows: Audit Policy or Event Log Tampering'
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: 'T1562.002 - Impair Defenses: Disable Windows Event Logging'
adversary: origin
description: Detects clearing of event logs (event 104) or command-line tampering with auditing/logging (auditpol /clear or /set ...disable, wevtutil cl, Clear-EventLog, fsutil usn deletejournal). Complements the Security-log-cleared (1102) rule. Event 104 counts only from the event log service (provider Microsoft-Windows-Eventlog), because other programs, such as Azure AD Connect (Directory Synchronization), use the same event number for unrelated messages. One alert is raised per computer and provider; repeats are suppressed for seven days.
references:
  - https://attack.mitre.org/techniques/T1562/002/
where: |
  (equals("log.eventCode", "104") && equals("log.providerName", "Microsoft-Windows-Eventlog")) || (equals("log.eventCode", 4688) && regexMatch("log.data.CommandLine", "(?i)(auditpol.*/clear|auditpol.*/set.*(success|failure):disable|wevtutil.*(cl |clear-log)|Clear-EventLog|fsutil.*usn.*deletejournal|Remove-EventLog)"))
deduplicateBy:
  - dataSource
  - lastEvent.log.providerName
