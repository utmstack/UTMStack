# Rule version v1.0.3

dataTypes:
  - "wineventlog"
name: "Windows: New Windows Service Created to start from windows root path. Suspicious event as the binary may have been dropped using Windows Admin Shares"
impact:
  confidentiality: 1
  integrity: 2
  availability: 3
category: "Execution"
technique: "T1021.002 - Remote Services: SMB/Windows Admin Shares"
adversary: target
description: "Adversaries may use Valid Accounts to interact with a remote network share using Server Message Block (SMB). 
              The adversary may then perform actions as the logged-on user."
references:
  - "https://attack.mitre.org/techniques/T1021/002/"
where: |
  equals("event.eventCode", 7045) && oneOf("event.channel", ["system", "System"]) && (contains("event.eventDataImagePath", "%systemroot%") || regexMatch("event.eventDataImagePath", "(?i).:.[Ww]indows.")) && !regexMatch("event.eventDataImagePath", "(?i)(System32|SysWOW64|WinSxS|Microsoft.NET|servicing|SystemApps|drivers|Installer)") && regexMatch("event.eventDataImagePath", "[.]exe")
groupBy:
  - dataSource
deduplicateBy: []
