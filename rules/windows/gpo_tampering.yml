- id: 1026
  dataTypes:
    - wineventlog
  name: GPO Tampering Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Policy Violation
  technique: "T1484.001 - Domain Policy Modification: Group Policy Modification"
  adversary: origin
  references:
    - https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/component-updates/command-line-process-auditing
    - https://attack.mitre.org/techniques/T1484/001/
  description: |
    Detects modifications to Group Policy Objects (GPOs) which could indicate an adversary attempting to escalate privileges, deploy malware across the domain, or establish persistence. GPO tampering is a common technique used by attackers to enforce malicious configurations or deploy payloads to multiple systems simultaneously.
    
    **Next Steps:**
    1. Immediately review the specific GPO that was modified and identify what changes were made
    2. Verify if the modification was authorized by checking with the responsible administrator
    3. Examine the user account that made the changes for signs of compromise
    4. Review recent authentication logs for the user account to identify potential lateral movement
    5. Check domain controllers for additional suspicious activities around the same timeframe
    6. If unauthorized, immediately revert the GPO changes and investigate the compromise vector
    7. Consider temporarily disabling the affected user account pending investigation
  where: safe(log.winlogEventId, "") == "5136" && safe(log.winlogProviderName, "") == "Microsoft-Windows-Security-Auditing" && contains(safe(log.winlogEventDataObjectDN, ""), "CN=Policies,CN=System")
  deduplicateBy:
    - origin.user
    - origin.host
