# Rule version v1.0.3
dataTypes:
  - wineventlog
name: "Windows: Multiple Logon Failure Followed by Logon Success"
impact:
  confidentiality: 2
  integrity: 2
  availability: 3
category: "Credential Access"
technique: "T1110 - Brute Force"
adversary: origin
description: "This rule is triggered when a sequence of multiple failed login attempts followed immediately by a successful login from the same IP address or source is detected. This unusual sequence of events may indicate a possible unauthorized access attempt using a brute force or password guessing technique. The purpose of this rule is to identify suspicious patterns of login activity and alert you to potential unauthorized access attempts."
references:
  - "https://attack.mitre.org/tactics/TA0006/"
  - "https://attack.mitre.org/techniques/T1110/"
where: |
  !oneOf("dataSource", ["", "unknown"]) &&
  exists("log.authenticationSource") && exists("log.authenticationSourceType") && exists("log.authenticationSourceDomain") && exists("target.user") &&
  (
  equals("log.eventCode", 4624)
  )
afterEvents:
  - indexPattern: v11-log-wineventlog-*
    with:
      - field: dataSource.keyword
        operator: filter_term
        value: '{{.dataSource}}'
      - field: log.authenticationSource.keyword
        operator: filter_term
        value: '{{.log.authenticationSource}}'
      - field: log.authenticationSourceType.keyword
        operator: filter_term
        value: '{{.log.authenticationSourceType}}'
      - field: log.authenticationSourceDomain.keyword
        operator: filter_term
        value: '{{.log.authenticationSourceDomain}}'
      - field: log.authenticationCandidate.bruteforceAttack.keyword
        operator: filter_term
        value: match
      - field: log.eventCode
        operator: filter_term
        value: 4625
      - field: target.user.keyword
        operator: filter_term
        value: '{{.target.user}}'
    within: 5m
    count: 10
deduplicateBy:
  - dataSource
  - lastEvent.log.authenticationSourceType
  - lastEvent.log.authenticationSource
  - lastEvent.log.authenticationSourceDomain
  - target.user
