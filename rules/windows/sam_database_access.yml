- id: 1021
  dataTypes:
    - wineventlog
  name: SAM Database Access Attempt
  impact:
    confidentiality: 3
    integrity: 3
    availability: 1
  category: Credential Access
  technique: "T1003.002 - OS Credential Dumping: Security Account Manager"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1003/002/
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4661
  description: |
    Detects attempts to access the Security Account Manager (SAM) database, which contains local user account hashes. This activity may indicate credential dumping attempts by attackers trying to extract password hashes for offline cracking or lateral movement.
    
    Next Steps:
    1. Immediately investigate the user account and process that accessed the SAM database
    2. Check for any unusual processes running on the affected system
    3. Review recent logon events and privilege escalation activities
    4. Examine network connections from the affected host for lateral movement
    5. Consider isolating the affected system if malicious activity is confirmed
    6. Review security policies for SAM database access permissions
    7. Check for presence of credential dumping tools or suspicious files
  where: |
    safe(log.eventCode, "") == "4663" && 
    safe(log.winlogChannel, "") == "Security" &&
    (
      safe(log.winlog.event_data.ObjectName, "") =~ ".*\\\\SAM$" ||
      safe(log.winlog.event_data.ObjectName, "") =~ ".*\\\\SECURITY$" ||
      safe(log.winlog.event_data.ObjectName, "") =~ ".*\\\\SYSTEM$"
    ) &&
    safe(log.winlog.event_data.AccessMask, "") in ["0x20019", "0x1f01ff", "0x40", "0x20", "0x1"]
  deduplicateBy:
    - origin.host
    - origin.user
