# Rule version v1.1.0

dataTypes:
  - wineventlog
name: AdminSDHolder Abuse Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence, Privilege Escalation
technique: "T1098 - Account Manipulation"
adversary: origin
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://adsecurity.org/?p=1906
  - https://docs.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-c--protected-accounts-and-groups-in-active-directory
description: |
  Detects modifications to the AdminSDHolder object which can be used for persistence by granting elevated privileges. The SDProp process propagates these permissions to protected groups every 60 minutes, making this a critical security event. It reads directory service change events (5136), whose ObjectDN field names the changed object; access events (4662) name objects by GUID and cannot identify AdminSDHolder. Changes made by SYSTEM (S-1-5-18) are excluded. One alert is raised per domain controller and account; repeats are suppressed for seven days.
  
  Next Steps:
  1. Immediately review the user account that performed the modification
  2. Check if the modification was authorized and part of legitimate administrative activities
  3. Examine the specific permissions that were changed on the AdminSDHolder object
  4. Monitor for privilege escalation activities in the next 60 minutes (SDProp cycle)
  5. Review all members of protected groups for unauthorized additions
  6. Audit recent administrative activities by the same user account
  7. Consider temporarily disabling the user account if unauthorized activity is suspected
where: |
  equals("log.eventCode", 5136) &&
  equals("log.channel", "Security") &&
  contains("log.data.ObjectDN", "CN=AdminSDHolder,CN=System") &&
  !equals("log.eventDataSubjectUserSid", "S-1-5-18")
deduplicateBy:
  - dataSource
  - lastEvent.log.eventDataSubjectUserSid
