- id: 1025
  dataTypes:
    - wineventlog
  name: AdminSDHolder Abuse Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Persistence
  technique: "T1098 - Account Manipulation"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1098/
    - https://adsecurity.org/?p=1906
    - https://docs.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-c--protected-accounts-and-groups-in-active-directory
  description: |
    Detects modifications to the AdminSDHolder object which can be used for persistence by granting elevated privileges. The SDProp process propagates these permissions to protected groups every 60 minutes, making this a critical security event.
    
    Next Steps:
    1. Immediately review the user account that performed the modification
    2. Check if the modification was authorized and part of legitimate administrative activities
    3. Examine the specific permissions that were changed on the AdminSDHolder object
    4. Monitor for privilege escalation activities in the next 60 minutes (SDProp cycle)
    5. Review all members of protected groups for unauthorized additions
    6. Audit recent administrative activities by the same user account
    7. Consider temporarily disabling the user account if unauthorized activity is suspected
  where: |
    safe(log.eventCode, "") in ["4662", "5136", "4670"] && 
    safe(log.winlogChannel, "") == "Security" &&
    (
      safe(log.winlog.event_data.ObjectName, "") =~ ".*CN=AdminSDHolder,CN=System.*" ||
      safe(log.winlog.event_data.ObjectDN, "") =~ ".*CN=AdminSDHolder,CN=System.*"
    ) &&
    (
      safe(log.winlog.event_data.OperationType, "") in ["Object Access", "Write Property"] ||
      safe(log.winlog.event_data.AccessMask, "") in ["0x20000", "0x40000", "0x80000"] ||
      safe(log.action, "") =~ ".*Permissions.*changed.*"
    ) &&
    safe(log.winlogEventDataSubjectUserName, "") != "SYSTEM"
  deduplicateBy:
    - lastEvent.log.winlogEventDataSubjectUserName
    - lastEvent.log.winlog.event_data.ObjectName
