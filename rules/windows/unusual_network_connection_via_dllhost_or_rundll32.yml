# Rule version v1.0.3

dataTypes:
  - "wineventlog"
name: "Windows: Unusual Network Connection via DllHost or via RunDLL32"
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: "Defense Evasion"
technique: "T1218 - System Binary Proxy Execution"
adversary: target
description: "Identifies unusual instances of dllhost.exe making outbound network connections. This may indicate adversarial Command
              and Control activity. Identifies unusual instances of rundll32.exe making outbound network connections. This may indicate adversarial Command
              and Control activity."
references:
  - "https://attack.mitre.org/tactics/TA0005/"
  - "https://attack.mitre.org/techniques/T1218/"
where: regexMatch("log.eventDataProcessName", "(dllhost.exe|rundll32.exe)") && !inCIDR("origin.ip", "10.0.0.0/8") && !inCIDR("origin.ip", "172.16.0.0/12") && !inCIDR("origin.ip", "192.168.0.0/16") && !inCIDR("origin.ip", "127.0.0.0/8") && !inCIDR("origin.ip", "169.254.0.0/16") && !inCIDR("origin.ip", "198.18.0.0/15") && !inCIDR("origin.ip", "224.0.0.0/4") && !inCIDR("origin.ip", "240.0.0.0/4")
groupBy:
  - origin.host
  - target.user
