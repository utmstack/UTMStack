- id: 1023
  dataTypes:
    - nids
  name: Preprocessor Security Event
  impact:
    confidentiality: 2
    integrity: 2
    availability: 3
  category: Network Anomaly
  technique: "T1498 - Network Denial of Service"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1498/
    - https://docs.snort.org/start/preprocessors
  description: |
    Detects security events triggered by NIDS preprocessors including port scans, protocol anomalies, and potential DoS attempts. These events indicate suspicious network activity that could represent reconnaissance, exploitation attempts, or network attacks.
    
    Next Steps:
    - Investigate the source IP address for other suspicious activities
    - Check if the IP is from an internal or external source
    - Review the specific preprocessor that triggered the event
    - Analyze network traffic patterns from the source
    - Consider blocking the IP if it's external and showing malicious behavior
    - Check for any associated application layer attacks or exploitation attempts
  where: |
    safe(log.event_type, "") == "preprocessor" &&
    origin.ip != "" &&
    (safe(log.preprocessor_name, "") in ["portscan", "frag3", "stream5", "http_inspect", "smtp", "ssh"]) &&
    (safe(log.alert_msg, "") contains "scan" || 
     safe(log.alert_msg, "") contains "anomaly" ||
     safe(log.alert_msg, "") contains "flood" ||
     safe(log.alert_msg, "") contains "fragmentation")
  deduplicateBy:
    - adversary.ip
    - lastEvent.log.preprocessor_name
