- id: 1004
  dataTypes:
    - nids
  name: NIDS Evasion Technique Detection
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Evasion Detection
  technique: "T1027 - Obfuscated Files or Information"
  adversary: origin
  references:
    - https://www.snort.org/faq/why-are-stream5-alerts-unavailable-for-packets
    - https://attack.mitre.org/techniques/T1027/
    - https://attack.mitre.org/techniques/T1562/
  description: |
    Detects attempts to evade NIDS detection through various techniques including obfuscation, encryption, tunneling, timing manipulation, or packet crafting designed to bypass security monitoring. This rule identifies sophisticated attackers attempting to avoid detection by network intrusion detection systems.

    Next Steps:
    1. Analyze the specific evasion technique used in the log.evasionTechnique field
    2. Review network traffic patterns from the source IP for additional suspicious activity
    3. Check if the source IP has been involved in other security incidents
    4. Examine packet captures around the event timestamp for detailed analysis
    5. Verify if legitimate applications might be causing false positives
    6. Consider blocking or monitoring the source IP if malicious intent is confirmed
    7. Update detection signatures if new evasion techniques are identified
  where: |
    safe(log.eventType, "") in ["evasion_attempt", "obfuscation_detected", "bypass_attempt"] &&
    safe(origin.ip, "") != "" &&
    (safe(log.evasionTechnique, "") in ["fragmentation", "obfuscation", "tunneling", "encryption", "timing_attack"] ||
     safe(log.alertName, "") =~ "(?i)(evasion|bypass|obfuscat|tunnel|covert)") &&
    safe(log.confidence, 0) >= 70
  afterEvents:
    - indexPattern: v11-log-nids-suricata-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-1h
      count: 2
  deduplicateBy:
    - origin.ip
