- id: 1025
  dataTypes:
    - nids
  name: Stream Reassembly Anomaly
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Network Anomaly
  technique: "T1001 - Data Obfuscation"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1001/
    - https://blog.snort.org/2020/10/stream-tcp-reassembly.html
  description: |
    Detects issues with TCP stream reassembly that may indicate evasion attempts, fragmentation attacks, or network performance problems. Stream reassembly anomalies can be used by attackers to evade detection by fragmenting malicious payloads or exploiting network stack vulnerabilities.

    Next Steps:
    1. Review the specific stream event type and reassembly error details
    2. Analyze the network traffic pattern between the source and destination IPs
    3. Check for signs of deliberate fragmentation or evasion techniques
    4. Investigate if this is part of a larger attack campaign
    5. Consider implementing stricter stream reassembly policies if attacks are confirmed
    6. Monitor for additional anomalous network behavior from the same source
  where: |
    safe(log.event_type, "") == "stream" &&
    safe(origin.ip, "") != "" &&
    (safe(log.stream_event, "") in ["overlap", "gap", "retransmission", "out_of_order", "reassembly_error"]) &&
    (safe(log.alert_msg, "") contains "stream" || 
     safe(log.alert_msg, "") contains "reassembly" ||
     safe(log.alert_msg, "") contains "overlap" ||
     safe(log.alert_msg, "") contains "segment")
  afterEvents:
    - indexPattern: v11-log-suricata-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: target.ip.keyword
          operator: filter_term
          value: '{{target.ip}}'
      within: now-5m
      count: 20
  deduplicateBy:
    - origin.ip
    - target.ip
