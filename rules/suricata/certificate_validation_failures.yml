- id: 1019
  dataTypes:
    - nids
  name: Certificate Validation Failures
  impact:
    confidentiality: 2
    integrity: 3
    availability: 1
  category: Network Security
  technique: "T1557 - Man-in-the-Middle"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1557/
    - https://www.rfc-editor.org/rfc/rfc5280
  description: |
    Detects certificate validation failures including invalid certificate chains, hostname mismatches, revoked certificates, untrusted certificate authorities, or certificate pinning violations. These failures may indicate man-in-the-middle attacks, expired certificates, or misconfigured SSL/TLS implementations.

    Next Steps:
    1. Investigate the certificate details and validation error type
    2. Check if the certificate has expired or been revoked
    3. Verify the certificate chain and trusted root authorities
    4. Examine network traffic for signs of interception or manipulation
    5. Review SSL/TLS configuration on both client and server sides
    6. Consider implementing certificate pinning if not already in place
    7. Monitor for repeated failures from the same source or destination
  where: |
    safe(log.event_type, "") in ["certificate_error", "cert_validation_failed", "ssl_error"] && (
      safe(log.error_type, "") in ["hostname_mismatch", "invalid_chain", "untrusted_root", "revoked", "expired"] ||
      safe(log.certificate_valid, true) == false ||
      safe(log.chain_valid, true) == false ||
      safe(log.revocation_status, "") == "revoked" ||
      safe(log.pinning_violation, false) == true ||
      safe(log.common_name_mismatch, false) == true
    )
  afterEvents:
    - indexPattern: v11-log-nids-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.event_type.keyword
          operator: filter_term
          value: certificate_error
      within: now-1h
      count: 3
  deduplicateBy:
    - origin.ip
    - target.ip
    - lastEvent.log.certificate_fingerprint
