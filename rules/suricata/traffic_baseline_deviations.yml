- id: 1003
  dataTypes:
    - nids
  name: NIDS Traffic Baseline Deviation Detection
  impact:
    confidentiality: 2
    integrity: 2
    availability: 3
  category: Anomaly Detection
  technique: Statistical Analysis
  adversary: origin
  references:
    - https://www.stamus-networks.com/blog/network-anomaly-detection
    - https://attack.mitre.org/techniques/T1498/
  description: |
    Detects significant deviations from normal network traffic patterns, including unusual traffic volumes, connection rates, or bandwidth utilization that may indicate DDoS attacks or data exfiltration.
    
    Next Steps:
    1. Review the traffic patterns and compare with historical baselines
    2. Investigate the source IP for signs of compromise or malicious activity
    3. Check if the traffic spike is legitimate (software updates, backups, etc.)
    4. Analyze destination IPs to identify potential data exfiltration targets
    5. Monitor for additional anomalous behavior from the same source
    6. Consider implementing rate limiting if DDoS activity is confirmed
  where: |
    safe(log.eventType, "") in ["traffic_anomaly", "baseline_deviation", "threshold_exceeded"] &&
    safe(origin.ip, "") != "" &&
    (safe(log.bytesTransferred, 0) > 1000000000 ||
     safe(log.packetsPerSecond, 0) > 10000 ||
     safe(log.connectionRate, 0) > 1000 ||
     safe(log.deviationPercent, 0) > 200)
  afterEvents:
    - indexPattern: v11-log-nids-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
      within: now-30m
      count: 10
  deduplicateBy:
    - origin.ip
    - target.ip
