- id: 1007
  dataTypes:
    - generic
  name: Encoding Detection Issues
  impact:
    confidentiality: 1
    integrity: 3
    availability: 2
  category: Data Integrity
  technique: "T1132 - Data Encoding"
  adversary: origin
  references:
    - https://owasp.org/www-community/attacks/Unicode_Encoding
    - https://attack.mitre.org/techniques/T1132/
  description: |
    Detects encoding-related issues that could indicate data corruption, encoding attacks, or attempts to bypass security filters through encoding manipulation. These errors may suggest attempts to evade detection, exploit vulnerabilities, or corrupt data integrity.
    
    Next Steps:
    1. Review the specific encoding error messages to understand the nature of the issue
    2. Check if the errors are coming from a specific source IP or application
    3. Investigate if this is part of a larger pattern of suspicious activity
    4. Verify if legitimate applications are misconfigured and causing encoding errors
    5. Look for correlating events such as injection attempts or data exfiltration
    6. Check system logs for any file corruption or data integrity issues
  where: |
    safe(log.message, "").contains("encoding error") ||
    safe(log.message, "").contains("charset error") ||
    safe(log.message, "").contains("decode error") ||
    safe(log.message, "").contains("unicode error") ||
    safe(log.message, "").contains("utf-8 error") ||
    safe(log.message, "").contains("utf8 error") ||
    safe(log.message, "").contains("invalid encoding") ||
    safe(log.message, "").contains("character encoding") ||
    safe(log.message, "").contains("encoding exception") ||
    safe(log.message, "").contains("malformed unicode") ||
    safe(log.message, "").contains("illegal character") ||
    safe(log.message, "").contains("invalid byte sequence") ||
    safe(log.message, "").contains("encoding mismatch")
  deduplicateBy:
    - lastEvent.origin.ip
