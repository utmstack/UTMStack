- id: 1013
  dataTypes:
    - generic
  name: Binary Data in Text Logs
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Data Anomaly
  technique: Binary Payload Injection
  adversary: origin
  references:
    - https://owasp.org/www-community/attacks/Binary_planting
    - https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
  description: |
    Detects presence of binary data or non-printable characters in text logs which could indicate encoding evasion, malware payloads, or attempts to corrupt log processing systems. Binary data in text logs is often a sign of malicious activity or system compromise.
    
    Next Steps:
    - Investigate the source IP/host that generated the binary data in logs
    - Check if the binary patterns match known malware signatures or file headers (PE, ELF, ZIP, etc.)
    - Review other logs from the same source for additional suspicious activity
    - Determine if this is a legitimate application behavior or potential security incident
    - Examine if log injection or corruption attempts are being made
    - Consider blocking or rate-limiting the source if malicious activity is confirmed
  where: |
    safe(log.message, "") != "" && (
      safe(log.message, "").matches(".*[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\xFF]+.*") ||
      safe(log.message, "").matches(".*\\\\x[8-9A-Fa-f][0-9A-Fa-f].*") ||
      safe(log.message, "").matches(".*\\\\x[0-7][0-9A-Fa-f].*") ||
      safe(log.message, "").matches(".*\xEF\xBB\xBF.*") ||
      safe(log.message, "").matches(".*\xFF\xFE.*") ||
      safe(log.message, "").matches(".*\xFE\xFF.*") ||
      safe(log.message, "").matches(".*[\x80-\xFF]{3,}.*") ||
      safe(log.message, "").matches(".*MZ.{0,100}This program.*") ||
      safe(log.message, "").matches(".*\x4D\x5A.*") ||
      safe(log.message, "").matches(".*\x7FELF.*") ||
      safe(log.message, "").matches(".*PK\x03\x04.*") ||
      safe(log.message, "").matches(".*\x50\x4B\x03\x04.*") ||
      safe(log.message, "").matches(".*\x1F\x8B\x08.*") ||
      safe(log.message, "").matches(".*GIF8[79]a.*") ||
      safe(log.message, "").matches(".*\x89PNG.*") ||
      safe(log.message, "").matches(".*\xFF\xD8\xFF.*") ||
      (safe(log.message, "").size() > 0 && 
       safe(log.message, "").matches(".*[^\x20-\x7E\x09\x0A\x0D].*") && 
       !safe(log.message, "").matches(".*[a-zA-Z0-9 .,!?:;'\"-]{10,}.*"))
    )
  deduplicateBy:
    - origin.ip
