- id: 1024
  dataTypes:
    - generic
  name: Regular Expression DoS Attack
  impact:
    confidentiality: 1
    integrity: 1
    availability: 3
  category: Denial of Service
  technique: "T1499: Endpoint Denial of Service"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1499/
    - https://owasp.org/www-community/attacks/Regular_expression_Denial_of_Service_-_ReDoS
  description: |
    Detects patterns that could cause catastrophic backtracking in regular expression engines, leading to CPU exhaustion and denial of service. These patterns exploit the way regex engines process certain repetitive patterns, causing exponential time complexity.
    
    Next Steps:
    1. Identify the source IP address and check if it's sending multiple requests with similar patterns
    2. Review application logs for high CPU usage or timeout errors during the time of the attack
    3. Check if the regex patterns are being submitted through user input fields or API endpoints
    4. Consider implementing input validation and regex complexity limits
    5. If confirmed malicious, block the source IP at firewall level
    6. Review and optimize any regular expressions used in the application to prevent ReDoS vulnerabilities
    7. Monitor for additional suspicious patterns from the same source
    8. Document the incident for future reference and security awareness training
  solution: |
    Implement input validation to reject potentially malicious regex patterns, add regex complexity limits, 
    and consider using alternative string matching methods for user inputs. Block the attacking IP address 
    and review application code for vulnerable regex implementations.
  where: |
    (safe(log.message, "").contains("aaaaaaaaaaaaaaaaaaaaaa") ||
     safe(log.message, "").contains("(.*+)*") ||
     safe(log.message, "").contains("(.*)*+") ||
     safe(log.message, "").contains("(.+)+") ||
     safe(log.message, "").contains("([a-zA-Z]+)*") ||
     safe(log.message, "").contains("(a|a)*") ||
     safe(log.message, "").contains("(a*)*") ||
     safe(log.message, "").contains("(a+)+") ||
     safe(log.message, "").contains("(a{1,32767}){1,32767}") ||
     safe(log.message, "").contains("^(a+)+$") ||
     safe(log.message, "").contains("([a-zA-Z0-9])*([a-zA-Z0-9])*"))
  deduplicateBy:
    - origin.ip
