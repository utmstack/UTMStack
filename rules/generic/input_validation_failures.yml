- id: 1006
  dataTypes:
    - generic
  name: Input Validation Failures Detection
  impact:
    confidentiality: 2
    integrity: 3
    availability: 2
  category: Data Quality
  technique: "T1059 - Command and Scripting Interpreter"
  adversary: origin
  references:
    - https://owasp.org/www-community/attacks/Input_Validation_Attacks
    - https://attack.mitre.org/techniques/T1059/
  description: |
    Detects events indicating input validation failures, which could indicate attempts to inject malicious data or bypass security controls. These failures may be signs of SQL injection, command injection, or other input-based attacks.
    
    Next Steps:
    1. Review the source IP address and check if it's associated with known malicious activity
    2. Examine the specific validation errors to understand what type of input was rejected
    3. Check application logs for the full context of the validation failure
    4. Look for patterns in the failed validation attempts (e.g., SQL keywords, script tags, command characters)
    5. Verify if the same source has successful requests before/after the failures
    6. Consider blocking the source IP if malicious intent is confirmed
    7. Review application input validation mechanisms for potential bypasses
    8. Correlate with WAF logs if available to understand attack vectors
  where: |
    safe(log.message, "") != "" && (
      safe(log.message, "").contains("validation failed") ||
      safe(log.message, "").contains("invalid input") ||
      safe(log.message, "").contains("validation error") ||
      safe(log.message, "").contains("input rejected") ||
      safe(log.message, "").contains("format error") ||
      safe(log.message, "").contains("illegal character") ||
      safe(log.message, "").contains("malformed request") ||
      safe(log.message, "").contains("parameter validation") ||
      safe(log.message, "").contains("input sanitization") ||
      safe(log.message, "").contains("injection attempt")
    )
  deduplicateBy:
    - origin.ip
