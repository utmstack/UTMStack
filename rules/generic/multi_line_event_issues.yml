- id: 1017
  dataTypes:
    - generic
  name: Multi-line Event Processing Issues
  impact:
    confidentiality: 1
    integrity: 3
    availability: 2
  category: System
  technique: Data Manipulation
  adversary: origin
  references:
    - https://github.com/fluent/fluentd/issues/2585
    - https://attack.mitre.org/techniques/T1565/
  description: |
    Detects potential issues with multi-line event processing where logs contain unexpected newline characters or excessive line breaks that could cause parsing failures or log injection attempts.
    
    Next Steps:
    1. Review the source application generating these logs to determine if multi-line output is expected
    2. Check log parsing configuration to ensure multi-line patterns are properly configured
    3. Investigate if this could be a log injection attempt by examining the content around newline characters
    4. Verify log collection agents are configured to handle multi-line events appropriately
    5. Consider implementing stricter input validation if logs are from user-controlled sources
  where: |
    safe(log.message, "").contains("\n") &&
    (size(safe(log.message, "")) > 4096 || 
     (size(safe(log.message, "").split("\n")) - 1) > 10)
  deduplicateBy:
    - origin.hostname
    - log.source
