- id: 1023
  dataTypes:
    - generic
  name: Stack Overflow Exploitation Attempt
  impact:
    confidentiality: 3
    integrity: 3
    availability: 3
  category: Memory Corruption
  technique: "T1203 - Exploitation for Client Execution"
  adversary: origin
  references:
    - https://attack.mitre.org/techniques/T1203/
    - https://cwe.mitre.org/data/definitions/121.html
  description: |
    Detects patterns commonly used in stack overflow exploitation attempts including long strings of repeated characters, shellcode patterns, or memory addresses that may indicate buffer overflow exploitation.
    
    Next Steps:
    1. Identify the affected system or application from the log source
    2. Check if the overflow attempt was successful by looking for:
       - Process crashes or unexpected terminations
       - New processes spawned with elevated privileges
       - Unusual network connections from the affected system
    3. Review application logs for any error messages or crash dumps
    4. If exploitation is confirmed:
       - Isolate the affected system
       - Capture memory dump for forensic analysis
       - Check for persistence mechanisms
    5. Update or patch the vulnerable application
    6. Consider implementing ASLR, DEP, or stack canaries if not already enabled
  where: |
    (safe(log.message, "").matches(".*[A-Za-z]{500,}.*") ||
     safe(log.message, "").matches(".*\\x90{20,}.*") ||
     safe(log.message, "").matches(".*\\x41{100,}.*") ||
     safe(log.message, "").matches(".*0x[0-9a-fA-F]{8,}.*0x[0-9a-fA-F]{8,}.*") ||
     safe(log.message, "").matches(".*\\xeb\\x[0-9a-fA-F]{2}.*") ||
     safe(log.message, "").matches(".*\\x31\\xc0\\x50\\x68.*") ||
     safe(log.message, "").matches(".*%[0-9]{4,}\\$.*") ||
     safe(log.message, "").matches(".*\\x00{50,}.*") ||
     safe(log.message, "").length() > 10000)
  deduplicateBy:
    - origin.ip
    - origin.hostname
