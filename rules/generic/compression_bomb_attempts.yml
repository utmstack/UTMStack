- id: 1019
  dataTypes:
    - generic
  name: Compression Bomb Attempts
  impact:
    confidentiality: 1
    integrity: 2
    availability: 3
  category: Attack
  technique: "T1499 - Endpoint Denial of Service: Resource Exhaustion"
  adversary: origin
  references:
    - https://www.wallarm.com/what/zip-bomb
    - https://encyclopedia.kaspersky.com/glossary/zip-bomb/
    - https://attack.mitre.org/techniques/T1499/
  description: |
    Detects potential compression bomb attempts in log processing where compressed archives show extreme compression ratios or recursive structures that could cause resource exhaustion.
    
    Next Steps:
    1. Identify the source of the compression bomb attempt by reviewing the origin IP and associated logs
    2. Check system resource utilization (CPU, memory, disk) for signs of exhaustion
    3. Review any file processing or decompression services that may have been targeted
    4. Block the source IP if malicious activity is confirmed
    5. Implement file size and compression ratio limits on file processing services
    6. Review logs for other suspicious activities from the same source
  where: |
    (safe(log.message, "") contains "zip bomb") ||
    (safe(log.message, "") contains "compression bomb") ||
    (safe(log.message, "") contains "overlapped components") ||
    (safe(log.message, "") contains "excessive compression ratio") ||
    (safe(log.message, "") contains "recursive compression detected") ||
    (safe(log.message, "") contains "decompression limit") ||
    (safe(log.message, "") contains "resource exhaustion")
  deduplicateBy:
    - origin.ip
