# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated AKS Secret Writes or Deletes
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aksaudit
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://attack.mitre.org/techniques/T1552/007/
description: 'At least five completed successful Secret writes/deletes by one actor in one cluster and collector in 30 minutes.
  This detects modification, not secret reading or credential theft; routine controllers and deployment automation require environment-specific
  tuning.

  '
where: '(equalsIgnoreCase("log.azureKind","kubernetes") && equalsIgnoreCase("log.azureKubernetes.stage","ResponseComplete") &&
  equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.azureKubernetes.objectRef.resource","secrets") && oneOf("log.azureKubernetes.verb",["create",
  "update", "delete", "deletecollection", "patch"])) && exists("dataSource") && !equals("dataSource","") && exists("log.azureScopeType")
  && !equals("log.azureScopeType","") && exists("log.azureScope") && !equals("log.azureScope","") && exists("log.azureActorType")
  && !equals("log.azureActorType","") && exists("log.azureActor") && !equals("log.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: log.azureActorType
    operator: filter_term
    value: '{{.log.azureActorType}}'
  - field: log.azureActor
    operator: filter_term
    value: '{{.log.azureActor}}'
  - field: log.correlationCandidate.azure_kubernetes_secret_access
    operator: filter_term
    value: 'true'
  within: 30m
  count: 5
