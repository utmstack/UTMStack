# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated AKS Secret Writes or Deletes
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/aksaudit
- https://kubernetes.io/docs/concepts/configuration/secret/
- https://attack.mitre.org/techniques/T1552/007/
description: 'At least five completed successful Secret writes/deletes by one actor in one cluster and collector in 30 minutes.
  This detects modification, not secret reading or credential theft; routine controllers and deployment automation require environment-specific
  tuning.

  '
where: '(equalsIgnoreCase("event.azureKind","kubernetes") && equalsIgnoreCase("event.azureKubernetes.stage","ResponseComplete") &&
  equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("event.azureKubernetes.objectRef.resource","secrets") && oneOf("event.azureKubernetes.verb",["create",
  "update", "delete", "deletecollection", "patch"])) && exists("dataSource") && !equals("dataSource","") && exists("event.azureScopeType")
  && !equals("event.azureScopeType","") && exists("event.azureScope") && !equals("event.azureScope","") && exists("event.azureActorType")
  && !equals("event.azureActorType","") && exists("event.azureActor") && !equals("event.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.azureScopeType
    operator: filter_term
    value: '{{.event.azureScopeType}}'
  - field: event.azureScope
    operator: filter_term
    value: '{{.event.azureScope}}'
  - field: event.azureActorType
    operator: filter_term
    value: '{{.event.azureActorType}}'
  - field: event.azureActor
    operator: filter_term
    value: '{{.event.azureActor}}'
  - field: event.correlationCandidate.azureKubernetesSecretAccess
    operator: filter_term
    value: 'true'
  within: 30m
  count: 5
