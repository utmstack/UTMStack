# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Successful Key Vault Secret or Key Reads
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Collection
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/key-vault/general/logging
- https://attack.mitre.org/techniques/T1530/
description: 'At least 20 successful SecretGet, SecretList or KeyGet operations by one actor against one vault and collector in
  ten minutes. Unrelated AuditEvent operations and denied access cannot satisfy the threshold.

  '
where: '(equalsIgnoreCase("event.azureKind","keyvault") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("event.azureOperation","SecretGet")
  || equalsIgnoreCase("event.azureOperation","SecretList") || equalsIgnoreCase("event.azureOperation","KeyGet"))) && exists("dataSource")
  && !equals("dataSource","") && exists("event.azureScopeType") && !equals("event.azureScopeType","") && exists("event.azureScope") &&
  !equals("event.azureScope","") && exists("event.azureActorType") && !equals("event.azureActorType","") && exists("event.azureActor")
  && !equals("event.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.azureScopeType
    operator: filter_term
    value: '{{.event.azureScopeType}}'
  - field: event.azureScope
    operator: filter_term
    value: '{{.event.azureScope}}'
  - field: event.azureActorType
    operator: filter_term
    value: '{{.event.azureActorType}}'
  - field: event.azureActor
    operator: filter_term
    value: '{{.event.azureActor}}'
  - field: event.correlationCandidate.keyVaultAccessSpikes
    operator: filter_term
    value: 'true'
  within: 10m
  count: 20
