# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Successful Key Vault Secret or Key Reads
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Collection
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/key-vault/general/logging
- https://attack.mitre.org/techniques/T1530/
description: 'At least 20 successful SecretGet, SecretList or KeyGet operations by one actor against one vault and collector in
  ten minutes. Unrelated AuditEvent operations and denied access cannot satisfy the threshold.

  '
where: '(equalsIgnoreCase("log.azureKind","keyvault") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("log.azureOperation","SecretGet")
  || equalsIgnoreCase("log.azureOperation","SecretList") || equalsIgnoreCase("log.azureOperation","KeyGet"))) && exists("dataSource")
  && !equals("dataSource","") && exists("log.azureScopeType") && !equals("log.azureScopeType","") && exists("log.azureScope") &&
  !equals("log.azureScope","") && exists("log.azureActorType") && !equals("log.azureActorType","") && exists("log.azureActor")
  && !equals("log.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: log.azureActorType
    operator: filter_term
    value: '{{.log.azureActorType}}'
  - field: log.azureActor
    operator: filter_term
    value: '{{.log.azureActor}}'
  - field: log.correlationCandidate.key_vault_access_spikes
    operator: filter_term
    value: 'true'
  within: 10m
  count: 20
