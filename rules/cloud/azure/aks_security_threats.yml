# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated AKS Resource Changes
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
- https://attack.mitre.org/techniques/T1610/
description: 'Repeated successful Azure control-plane changes by the same actor. These operations do not by themselves prove container
  compromise.

  '
where: '((equalsIgnoreCase("log.azureKind","activity") || equalsIgnoreCase("log.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && regexMatch("log.azureOperation","(?i)^Microsoft\\.(ContainerService|Kubernetes)/.+/(write|create|exec)$")) && exists("dataSource")
  && !equals("dataSource","") && exists("log.azureScopeType") && !equals("log.azureScopeType","") && exists("log.azureScope") &&
  !equals("log.azureScope","") && exists("log.azureActorType") && !equals("log.azureActorType","") && exists("log.azureActor")
  && !equals("log.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: log.azureActorType
    operator: filter_term
    value: '{{.log.azureActorType}}'
  - field: log.azureActor
    operator: filter_term
    value: '{{.log.azureActor}}'
  - field: log.correlationCandidate.aksSecurityThreats
    operator: filter_term
    value: 'true'
  within: 30m
  count: 10
