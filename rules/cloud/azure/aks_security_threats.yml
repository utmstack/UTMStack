# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated AKS Resource Changes
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-containers-introduction
- https://attack.mitre.org/techniques/T1610/
description: 'Repeated successful Azure control-plane changes by the same actor. These operations do not by themselves prove container
  compromise.

  '
where: '((equalsIgnoreCase("event.azureKind","activity") || equalsIgnoreCase("event.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && regexMatch("event.azureOperation","(?i)^Microsoft\\.(ContainerService|Kubernetes)/.+/(write|create|exec)$")) && exists("dataSource")
  && !equals("dataSource","") && exists("event.azureScopeType") && !equals("event.azureScopeType","") && exists("event.azureScope") &&
  !equals("event.azureScope","") && exists("event.azureActorType") && !equals("event.azureActorType","") && exists("event.azureActor")
  && !equals("event.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.azureScopeType
    operator: filter_term
    value: '{{.event.azureScopeType}}'
  - field: event.azureScope
    operator: filter_term
    value: '{{.event.azureScope}}'
  - field: event.azureActorType
    operator: filter_term
    value: '{{.event.azureActorType}}'
  - field: event.azureActor
    operator: filter_term
    value: '{{.event.azureActor}}'
  - field: event.correlationCandidate.aksSecurityThreats
    operator: filter_term
    value: 'true'
  within: 30m
  count: 10
