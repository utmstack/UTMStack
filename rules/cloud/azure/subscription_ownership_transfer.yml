# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure Subscription Owner Role Assigned
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Identity and Access Management
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/role-based-access-control/change-history-report
- https://attack.mitre.org/techniques/T1078/
description: 'A successful role assignment at subscription scope explicitly targets the built-in Owner role in the request body.
  The actor authorization role is not used as the granted role; a role assignment does not prove billing ownership transfer.

  '
where: '(equalsIgnoreCase("log.azureKind","activity") || equalsIgnoreCase("log.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && equalsIgnoreCase("log.azureOperation","Microsoft.Authorization/roleAssignments/write") && regexMatch("log.resourceId","(?i)^/subscriptions/[^/]+/providers/Microsoft\\.Authorization/roleAssignments/[^/]+$")
  && regexMatch("log.azureRequestBody.properties.roleDefinitionId","(?i)/providers/Microsoft\\.Authorization/roleDefinitions/8e3af657-a8ff-443c-a75c-2fe8c4bcb635$")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
