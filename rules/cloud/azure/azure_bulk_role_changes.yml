# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure AD Bulk Privileged Role Assignment Changes
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: T1098 - Account Manipulation
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-assign-roles
- https://attack.mitre.org/techniques/T1098/
description: 'Detects mass privileged role assignment changes in Azure AD. Multiple role assignments in a short time window indicate
  an attacker rapidly escalating privileges across multiple accounts for persistence and lateral movement.


  Next Steps:

  1. Review all role assignments made in the burst

  2. Identify the admin account making the changes

  3. Check if these changes were part of an approved onboarding or migration

  4. Review the specific roles assigned (Global Admin, Exchange Admin, etc.)

  5. If unauthorized, revert all role assignments and investigate the admin account

  6. Enable Azure PIM for just-in-time role activation

  '
where: '(equalsIgnoreCase("event.azureKind","audit") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("event.azureOperation","Add
  member to role") || equalsIgnoreCase("event.azureOperation","Add eligible member to role") || equalsIgnoreCase("event.azureOperation","Add
  member to role completed (PIM activation)") || equalsIgnoreCase("event.azureOperation","Add eligible member to role in PIM completed")
  || equalsIgnoreCase("event.azureOperation","Add eligible member to role in PIM completed (permanent)") || equalsIgnoreCase("event.azureOperation","Add
  eligible member to role in PIM completed (timebound)") || equalsIgnoreCase("event.azureOperation","Add member to role in PIM completed
  (permanent)") || equalsIgnoreCase("event.azureOperation","Add member to role in PIM completed (timebound)"))) && exists("dataSource")
  && !equals("dataSource","") && exists("event.azureScopeType") && !equals("event.azureScopeType","") && exists("event.azureScope") &&
  !equals("event.azureScope","") && exists("event.azureActorType") && !equals("event.azureActorType","") && exists("event.azureActor")
  && !equals("event.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.azureScopeType
    operator: filter_term
    value: '{{.event.azureScopeType}}'
  - field: event.azureScope
    operator: filter_term
    value: '{{.event.azureScope}}'
  - field: event.azureActorType
    operator: filter_term
    value: '{{.event.azureActorType}}'
  - field: event.azureActor
    operator: filter_term
    value: '{{.event.azureActor}}'
  - field: event.correlationCandidate.azureBulkRoleChanges
    operator: filter_term
    value: 'true'
  within: 30m
  count: 10
