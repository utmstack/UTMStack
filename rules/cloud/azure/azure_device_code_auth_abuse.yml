# Azure rule contract review v2.1.0
dataTypes:
- azure
name: High Risk Device Code Sign-in
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Initial Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-device-code
- https://attack.mitre.org/techniques/T1078/
description: 'A successful device-code sign-in carries high or active risk. Routine device-code use without that risk signal is
  excluded.

  '
where: 'equalsIgnoreCase("log.azureKind","signin") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.properties.authenticationProtocol","deviceCode")
  && (equalsIgnoreCase("log.properties.riskState","atRisk") || equalsIgnoreCase("log.properties.riskState","confirmedCompromised")
  || equalsIgnoreCase("log.properties.riskLevelDuringSignIn","high"))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
