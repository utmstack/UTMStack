# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure Storage Public Access Configuration Written
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Collection
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/activity-log-schema
- https://attack.mitre.org/techniques/T1530/
description: 'A successful storage-account write explicitly allows blob public access, or a container write specifies Blob/Container
  public access. The request body must be present. An account-level permission alone does not make every blob public, and a written
  value does not prove it changed.

  '
where: '(equalsIgnoreCase("event.azureKind","activity") || equalsIgnoreCase("event.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && ((equalsIgnoreCase("event.azureOperation","Microsoft.Storage/storageAccounts/write") && equals("event.azureRequestBody.properties.allowBlobPublicAccess","true"))
  || (equalsIgnoreCase("event.azureOperation","Microsoft.Storage/storageAccounts/blobServices/containers/write") && oneOf("event.azureRequestBody.properties.publicAccess",["Blob",
  "Container"])))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
