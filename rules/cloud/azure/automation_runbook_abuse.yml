# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure Automation Runbook, Job or Schedule Changed
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Execution
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/automation/automation-runbook-types
- https://attack.mitre.org/techniques/T1059/
description: 'A successful Azure Automation runbook write/publish, job creation or schedule write. The management operation alone
  does not prove malicious execution.

  '
where: '(equalsIgnoreCase("event.azureKind","activity") || equalsIgnoreCase("event.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && regexMatch("event.azureOperation","(?i)^Microsoft\\.Automation/automationAccounts/(runbooks/(write|publish/action)|jobs/write|schedules/write)$")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
