# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Entra Invalid-Credential Sign-ins
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/active-directory/identity-protection/concept-identity-protection-risks
- https://attack.mitre.org/techniques/T1110/
description: 'At least 15 sign-ins report invalid credentials (50126) from one client address in 15 minutes in the same directory
  and collector. This threshold does not establish distinct-user password spraying; locked/disabled accounts are excluded.

  '
where: '(equalsIgnoreCase("log.azureKind","signin") && equalsIgnoreCase("actionResult","failure") && equals("log.properties.status.errorCode",50126))
  && exists("dataSource") && !equals("dataSource","") && exists("log.azureScopeType") && !equals("log.azureScopeType","") && exists("log.azureScope")
  && !equals("log.azureScope","") && exists("origin.ip") && !equals("origin.ip","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.azureAdPasswordSpray
    operator: filter_term
    value: 'true'
  within: 15m
  count: 15
