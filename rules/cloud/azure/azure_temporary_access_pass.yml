# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Temporary Access Pass Registered
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
- https://attack.mitre.org/techniques/T1078/004/
description: 'A successful admin security-info registration explicitly identifies Temporary Access Pass as the authentication method.
  Other authentication-method registrations are excluded.

  '
where: 'equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.azureOperation","Admin
  registered security info") && (exists(''log.properties.additionalDetails.#(key=="AuthenticationMethod").value'') && (equalsIgnoreCase("log.properties.additionalDetails.#(key==\"AuthenticationMethod\").value","Temporary
  Access Pass") || equalsIgnoreCase("log.properties.additionalDetails.#(key==\"AuthenticationMethod\").value","TemporaryAccessPass")))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
