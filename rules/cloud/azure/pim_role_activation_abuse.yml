# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Entra PIM Role Activations
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Privilege Escalation
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/active-directory/privileged-identity-management/pim-configure
- https://attack.mitre.org/techniques/T1078/
description: 'At least three completed eligible-member additions or PIM role activations by one actor in one directory and collector
  in four hours. Review approved role activation workflows; count alone does not prove privilege abuse.

  '
where: '(equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("log.azureOperation","Add
  member to role completed (PIM activation)") || equalsIgnoreCase("log.azureOperation","Add eligible member to role in PIM completed")
  || equalsIgnoreCase("log.azureOperation","Add eligible member to role in PIM completed (permanent)") || equalsIgnoreCase("log.azureOperation","Add
  eligible member to role in PIM completed (timebound)") || equalsIgnoreCase("log.azureOperation","Add member to role in PIM completed
  (permanent)") || equalsIgnoreCase("log.azureOperation","Add member to role in PIM completed (timebound)"))) && exists("dataSource")
  && !equals("dataSource","") && exists("log.azureScopeType") && !equals("log.azureScopeType","") && exists("log.azureScope") &&
  !equals("log.azureScope","") && exists("log.azureActorType") && !equals("log.azureActorType","") && exists("log.azureActor")
  && !equals("log.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: log.azureActorType
    operator: filter_term
    value: '{{.log.azureActorType}}'
  - field: log.azureActor
    operator: filter_term
    value: '{{.log.azureActor}}'
  - field: log.correlationCandidate.pim_role_activation_abuse
    operator: filter_term
    value: 'true'
  within: 4h
  count: 3
