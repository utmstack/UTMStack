# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Successful Entra ROPC Sign-ins
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth-ropc
- https://attack.mitre.org/techniques/T1078/
description: 'At least five successful ROPC sign-ins by one actor in one directory and collector in one hour. Review legacy authentication
  use; this does not itself prove a stolen password.

  '
where: '(equalsIgnoreCase("log.azureKind","signin") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.properties.authenticationProtocol","ropc"))
  && exists("dataSource") && !equals("dataSource","") && exists("log.azureScopeType") && !equals("log.azureScopeType","") && exists("log.azureScope")
  && !equals("log.azureScope","") && exists("log.azureActorType") && !equals("log.azureActorType","") && exists("log.azureActor")
  && !equals("log.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: log.azureActorType
    operator: filter_term
    value: '{{.log.azureActorType}}'
  - field: log.azureActor
    operator: filter_term
    value: '{{.log.azureActor}}'
  - field: log.correlationCandidate.azureRopcAuthentication
    operator: filter_term
    value: 'true'
  within: 1h
  count: 5
