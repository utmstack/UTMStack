# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Successful Entra ROPC Sign-ins
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth-ropc
- https://attack.mitre.org/techniques/T1078/
description: 'At least five successful ROPC sign-ins by one actor in one directory and collector in one hour. Review legacy authentication
  use; this does not itself prove a stolen password.

  '
where: '(equalsIgnoreCase("event.azureKind","signin") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("event.properties.authenticationProtocol","ropc"))
  && exists("dataSource") && !equals("dataSource","") && exists("event.azureScopeType") && !equals("event.azureScopeType","") && exists("event.azureScope")
  && !equals("event.azureScope","") && exists("event.azureActorType") && !equals("event.azureActorType","") && exists("event.azureActor")
  && !equals("event.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.azureScopeType
    operator: filter_term
    value: '{{.event.azureScopeType}}'
  - field: event.azureScope
    operator: filter_term
    value: '{{.event.azureScope}}'
  - field: event.azureActorType
    operator: filter_term
    value: '{{.event.azureActorType}}'
  - field: event.azureActor
    operator: filter_term
    value: '{{.event.azureActor}}'
  - field: event.correlationCandidate.azureRopcAuthentication
    operator: filter_term
    value: 'true'
  within: 1h
  count: 5
