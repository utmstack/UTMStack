# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Domain Federation Configuration Changed
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/whatis-fed
- https://attack.mitre.org/techniques/T1556/
description: 'A successful federation/authentication configuration change. Review the configuration diff and approved administration;
  this is not proof of a forged SAML token.

  '
where: 'equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("log.azureOperation","Set
  federation settings on domain") || equalsIgnoreCase("log.azureOperation","Set domain authentication") || equalsIgnoreCase("log.azureOperation","Set
  DomainFederationSettings"))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
