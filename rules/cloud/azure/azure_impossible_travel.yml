# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure AD Impossible Travel Sign-In
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Initial Access
technique: T1078 - Valid Accounts
adversary: origin
references:
- https://learn.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
- https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
- https://attack.mitre.org/techniques/T1078/
description: 'Detects Azure Identity Protection impossible travel alerts where a user signs in from geographically distant locations
  in a timeframe that makes physical travel impossible. This strongly indicates credential theft or session hijacking.


  Next Steps:

  1. Contact the user to verify both sign-in locations

  2. Check if a VPN or proxy could explain the geolocation discrepancy

  3. Review the sign-in details (device, browser, app) for both locations

  4. If unauthorized, force password reset and revoke all sessions

  5. Review data access and actions from the suspicious location

  6. Enable location-based conditional access policies

  7. Check for other users with similar patterns from the same locations

  '
where: '(equalsIgnoreCase("event.azureKind","risk") && oneOf("event.properties.riskEventType",["impossibleTravel", "unlikelyTravel"])
  && !oneOf("event.properties.riskState",["dismissed", "remediated", "confirmedSafe"])) || (equalsIgnoreCase("event.azureKind","signin")
  && (exists("event.properties.riskEventTypes_v2.#(==\"impossibleTravel\")") || exists("event.properties.riskEventTypes_v2.#(==\"unlikelyTravel\")")
  || exists("event.properties.riskEventTypesv2.#(==\"impossibleTravel\")") || exists("event.properties.riskEventTypesv2.#(==\"unlikelyTravel\")")
  || exists("event.properties.riskEventTypes.#(==\"impossibleTravel\")") || exists("event.properties.riskEventTypes.#(==\"unlikelyTravel\")"))
  && !oneOf("event.properties.riskState",["dismissed", "remediated", "confirmedSafe"]))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
