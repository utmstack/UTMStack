# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Microsoft Defender for Cloud High Severity Alert
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Intrusion Detection
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-overview
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/alerts-schemas
- https://attack.mitre.org/tactics/TA0001/
description: 'A Security-category record reports high alert severity. Alert issuance is not treated as a successful attacker connection.

  '
where: '(equalsIgnoreCase("log.category","Security") || equalsIgnoreCase("log.category.value","Security")) && (equalsIgnoreCase("log.properties.severity","High")
  || equalsIgnoreCase("log.properties.Severity","High") || equalsIgnoreCase("log.properties.alertSeverity","High")) && regexMatch("log.azureOperation","(?i)^Microsoft\\.Security/")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
