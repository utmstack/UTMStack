# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Forwarded High Severity Security Alert
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Threat Detection
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/sentinel/security-alert-schema
- https://attack.mitre.org/techniques/T1562/
description: 'A new high severity record in the documented SecurityAlert schema. The vendor/product identity is retained; the schema
  does not require VendorName to equal Microsoft Sentinel. This is an upstream finding, not a successful attacker action.

  '
where: 'equalsIgnoreCase("log.azureKind","securityalert") && equalsIgnoreCase("log.AlertSeverity","High") && equalsIgnoreCase("log.Status","New")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.SystemAlertId
