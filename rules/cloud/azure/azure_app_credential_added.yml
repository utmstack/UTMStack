# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Application Credential Configuration Changed
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Persistence
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity-platform/howto-create-service-principal-portal
- https://attack.mitre.org/techniques/T1098/001/
description: 'A completed explicit credential-management operation or application credential-property update. The property update
  may add, replace or remove credentials; inspect the old and new values.

  '
where: 'equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && ((equalsIgnoreCase("log.azureOperation","Add
  service principal credentials") || equalsIgnoreCase("log.azureOperation","Update application - Certificates and secrets management"))
  || (equalsIgnoreCase("log.azureOperation","Update application") && (exists("log.properties.targetResources.#(modifiedProperties.#(displayName==\"KeyCredentials\"))")
  || exists("log.properties.targetResources.#(modifiedProperties.#(displayName==\"PasswordCredentials\"))"))))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
