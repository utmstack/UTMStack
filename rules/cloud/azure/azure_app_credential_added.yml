# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Application Credential Configuration Changed
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Persistence
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity-platform/howto-create-service-principal-portal
- https://attack.mitre.org/techniques/T1098/001/
description: 'A completed explicit credential-management operation or application credential-property update. The property update
  may add, replace or remove credentials; inspect the old and new values.

  '
where: 'equalsIgnoreCase("event.azureKind","audit") && equalsIgnoreCase("actionResult","success") && ((equalsIgnoreCase("event.azureOperation","Add
  service principal credentials") || equalsIgnoreCase("event.azureOperation","Update application - Certificates and secrets management"))
  || (equalsIgnoreCase("event.azureOperation","Update application") && (exists("event.properties.targetResources.#(modifiedProperties.#(displayName==\"KeyCredentials\"))")
  || exists("event.properties.targetResources.#(modifiedProperties.#(displayName==\"PasswordCredentials\"))"))))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
