# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Application Role Assignment
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity-platform/app-objects-and-service-principals
- https://attack.mitre.org/techniques/T1098/003/
description: 'A successful application role assignment. Permission privilege and malicious intent require reviewing the specific
  grant; consent has a separate rule.

  '
where: 'equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.azureOperation","Add
  app role assignment to service principal")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
