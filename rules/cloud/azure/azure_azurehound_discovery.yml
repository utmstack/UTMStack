# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Entra Sign-in with AzureHound User Agent
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Discovery
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://bloodhound.readthedocs.io/en/latest/data-collection/azurehound.html
- https://attack.mitre.org/techniques/T1087/004/
description: 'A sign-in reports an AzureHound user agent. This string can be changed or spoofed and does not prove discovery completed.

  '
where: 'equalsIgnoreCase("log.azureKind","signin") && regexMatch("log.properties.userAgent","(?i)(^|[^a-z])azurehound([^a-z]|$)")

  '
deduplicateBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
