# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure AD Anomalous Token Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: T1528 - Steal Application Access Token
adversary: origin
references:
- https://learn.microsoft.com/en-us/graph/api/resources/riskdetection?view=graph-rest-1.0
- https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
- https://attack.mitre.org/techniques/T1528/
description: 'Detects Azure Identity Protection alerts for anomalous tokens with unusual lifetime, unfamiliar locations, or other
  suspicious properties. These indicate potential token theft or manipulation.


  Next Steps:

  1. Review the token properties that triggered the anomaly detection

  2. Check the user''s recent sign-in activity for suspicious patterns

  3. Verify the source IP and device used for the authentication

  4. Check for impossible travel or unfamiliar location patterns

  5. If compromise is suspected, revoke all refresh tokens for the user

  6. Force MFA re-registration if MFA token was compromised

  7. Review conditional access policies for token protection gaps

  '
where: '(equalsIgnoreCase("event.azureKind","risk") && oneOf("event.properties.riskEventType",["anomalousToken"]) && !oneOf("event.properties.riskState",["dismissed",
  "remediated", "confirmedSafe"])) || (equalsIgnoreCase("event.azureKind","signin") && (exists("event.properties.riskEventTypes_v2.#(==\"anomalousToken\")")
  || exists("event.properties.riskEventTypesv2.#(==\"anomalousToken\")") || exists("event.properties.riskEventTypes.#(==\"anomalousToken\")"))
  && !oneOf("event.properties.riskState",["dismissed", "remediated", "confirmedSafe"]))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
