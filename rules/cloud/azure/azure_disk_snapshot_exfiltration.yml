# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure Disk or Snapshot Access Granted
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Data Exfiltration
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/virtual-machines/disks-incremental-snapshots
- https://attack.mitre.org/techniques/T1537/
description: 'A successful disk/snapshot access-export request. This grants access; it does not prove data exfiltration occurred.

  '
where: '(equalsIgnoreCase("log.azureKind","activity") || equalsIgnoreCase("log.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && regexMatch("log.azureOperation","(?i)^Microsoft\\.Compute/(snapshots|disks)/(beginGetAccess/action|export/action)$")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
