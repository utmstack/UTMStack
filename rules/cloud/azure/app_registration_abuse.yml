# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Entra Application Registration or Consent
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Persistence
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/active-directory/develop/app-objects-and-service-principals
- https://attack.mitre.org/techniques/T1098/001/
description: 'Repeated successful application/service-principal creation or consent by one actor in one directory. Review approved
  provisioning and consent workflows.

  '
where: '(equalsIgnoreCase("log.azureKind","audit") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("log.azureOperation","Add
  application") || equalsIgnoreCase("log.azureOperation","Add service principal") || equalsIgnoreCase("log.azureOperation","Consent
  to application"))) && exists("dataSource") && !equals("dataSource","") && exists("log.azureScopeType") && !equals("log.azureScopeType","")
  && exists("log.azureScope") && !equals("log.azureScope","") && exists("log.azureActorType") && !equals("log.azureActorType","")
  && exists("log.azureActor") && !equals("log.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.azureScopeType
    operator: filter_term
    value: '{{.log.azureScopeType}}'
  - field: log.azureScope
    operator: filter_term
    value: '{{.log.azureScope}}'
  - field: log.azureActorType
    operator: filter_term
    value: '{{.log.azureActorType}}'
  - field: log.azureActor
    operator: filter_term
    value: '{{.log.azureActor}}'
  - field: log.correlationCandidate.app_registration_abuse
    operator: filter_term
    value: 'true'
  within: 1h
  count: 3
