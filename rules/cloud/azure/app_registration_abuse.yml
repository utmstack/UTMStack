# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Repeated Entra Application Registration or Consent
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Persistence
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/azure/active-directory/develop/app-objects-and-service-principals
- https://attack.mitre.org/techniques/T1098/001/
description: 'Repeated successful application/service-principal creation or consent by one actor in one directory. Review approved
  provisioning and consent workflows.

  '
where: '(equalsIgnoreCase("event.azureKind","audit") && equalsIgnoreCase("actionResult","success") && (equalsIgnoreCase("event.azureOperation","Add
  application") || equalsIgnoreCase("event.azureOperation","Add service principal") || equalsIgnoreCase("event.azureOperation","Consent
  to application"))) && exists("dataSource") && !equals("dataSource","") && exists("event.azureScopeType") && !equals("event.azureScopeType","")
  && exists("event.azureScope") && !equals("event.azureScope","") && exists("event.azureActorType") && !equals("event.azureActorType","")
  && exists("event.azureActor") && !equals("event.azureActor","")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
correlation:
- indexPattern: v11-log-azure-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.azureScopeType
    operator: filter_term
    value: '{{.event.azureScopeType}}'
  - field: event.azureScope
    operator: filter_term
    value: '{{.event.azureScope}}'
  - field: event.azureActorType
    operator: filter_term
    value: '{{.event.azureActorType}}'
  - field: event.azureActor
    operator: filter_term
    value: '{{.event.azureActor}}'
  - field: event.correlationCandidate.appRegistrationAbuse
    operator: filter_term
    value: 'true'
  within: 1h
  count: 3
