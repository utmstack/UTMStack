# Azure rule contract review v2.1.0
dataTypes:
- azure
name: Azure Key Vault Configuration Changed
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Credential Access
technique: ''
adversary: origin
description: 'A completed successful vault configuration write. It does not establish access to secrets or keys.

  '
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://attack.mitre.org/techniques/T1552/
- https://attack.mitre.org/tactics/TA0006/
- https://learn.microsoft.com/en-us/azure/key-vault/general/security-features
where: '(equalsIgnoreCase("event.azureKind","activity") || equalsIgnoreCase("event.azureKind","eventgrid")) && equalsIgnoreCase("actionResult","success")
  && equalsIgnoreCase("event.azureOperation","Microsoft.KeyVault/vaults/write")

  '
groupBy:
- lastEvent.dataSource
- lastEvent.event.azureScopeType
- lastEvent.event.azureScope
- lastEvent.event.azureOperation
- adversary.user
- adversary.ip
