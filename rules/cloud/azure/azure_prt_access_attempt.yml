# Azure rule contract review v2.1.0
dataTypes:
- azure
name: High Risk Primary Refresh Token Sign-in
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Credential Access
technique: ''
adversary: origin
references:
- https://learn.microsoft.com/en-us/azure/azure-monitor/platform/resource-logs-schema
- https://learn.microsoft.com/en-us/entra/identity/devices/concept-primary-refresh-token
- https://attack.mitre.org/techniques/T1528/
description: 'A successful sign-in using a primary refresh token carries high or active risk. Token type alone does not indicate
  theft or access to token storage.

  '
where: 'equalsIgnoreCase("log.azureKind","signin") && equalsIgnoreCase("actionResult","success") && equalsIgnoreCase("log.properties.incomingTokenType","primaryRefreshToken")
  && (equalsIgnoreCase("log.properties.riskState","atRisk") || equalsIgnoreCase("log.properties.riskState","confirmedCompromised")
  || equalsIgnoreCase("log.properties.riskLevelDuringSignIn","high"))

  '
groupBy:
- lastEvent.dataSource
- lastEvent.log.azureScopeType
- lastEvent.log.azureScope
- lastEvent.log.azureOperation
- adversary.user
- adversary.ip
