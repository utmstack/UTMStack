# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EC2 Flow Log Deletion
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Defense Evasion
technique: T1562 - Impair Defenses
adversary: origin
description: Identifies the deletion of one or more flow logs in AWS Elastic Compute Cloud (EC2). An adversary may delete
  flow logs in an attempt to evade defenses
references:
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/delete-flow-logs.html
- https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeleteFlowLogs.html
- https://attack.mitre.org/tactics/TA0005/
- https://attack.mitre.org/techniques/T1562/
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "ec2.amazonaws.com") &&
  equals("event.eventName", "DeleteFlowLogs") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
