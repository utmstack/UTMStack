# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EC2 Traffic Mirroring Configuration Request
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Exfiltration
technique: T1020 - Automated Exfiltration
adversary: origin
description: |
  Identifies a successful request to create a traffic mirror filter, rule, session or target. Inspect the configuration and destination to determine whether packet mirroring is active and authorized; creating a filter alone does not prove that traffic was captured.
references:
- https://attack.mitre.org/tactics/TA0010/
- https://attack.mitre.org/techniques/T1020/
- https://attack.mitre.org/tactics/TA0009/
- https://attack.mitre.org/techniques/T1074/
- https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_TrafficMirrorFilter.html
- https://github.com/easttimor/aws-incident-response
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "ec2.amazonaws.com") &&
  (equals("log.eventName", "CreateTrafficMirrorFilter") ||
  equals("log.eventName", "CreateTrafficMirrorFilterRule") ||
  equals("log.eventName", "CreateTrafficMirrorSession") ||
  equals("log.eventName", "CreateTrafficMirrorTarget")) &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
