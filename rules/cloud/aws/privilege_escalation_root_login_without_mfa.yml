# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Root Login Without MFA
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Initial Access
technique: T1078 - Valid Accounts
adversary: origin
description: Identifies attempts to login to AWS as the root user without using multi-factor authentication (MFA). Amazon
  AWS best practices indicate that the root user should be protected by MFA
references:
- https://attack.mitre.org/tactics/TA0004/
- https://attack.mitre.org/techniques/T1078/
- https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "signin.amazonaws.com") &&
  equals("event.eventName", "ConsoleLogin") &&
  equals("event.userIdentity.type", "Root") &&
  equals("event.additionalEventData.MFAUsed", "No") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
