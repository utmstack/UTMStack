# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Console Logins from Different Countries
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: 'T1078.004 - Valid Accounts: Cloud Accounts'
adversary: origin
references:
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
- https://attack.mitre.org/techniques/T1078/004/
description: |
  Detects successful console logins by the same principal and account from different geolocated countries within 30 minutes. VPNs, proxies and geolocation changes can produce this sequence; it does not establish impossible travel. Verify the sign-ins with the account owner.
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","signin.amazonaws.com") &&
  oneOf("log.eventName",["ConsoleLogin"]) &&
  equals("actionResult","success") &&
  regexMatch("origin.geolocation.countryCode","^[A-Z]{2}$"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("log.awsActorKeyType") &&
  !equals("log.awsActorKeyType","") &&
  exists("log.awsActorKey") &&
  !equals("log.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: log.awsActorKeyType
    operator: filter_term
    value: '{{.log.awsActorKeyType}}'
  - field: log.awsActorKey
    operator: filter_term
    value: '{{.log.awsActorKey}}'
  - field: log.correlationCandidate.consoleLoginImpossibleTravel
    operator: filter_term
    value: match
  - field: origin.geolocation.countryCode
    operator: must_not_term
    value: '{{.origin.geolocation.countryCode}}'
  within: 30m
  count: 1
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- adversary.geolocation.countryCode
