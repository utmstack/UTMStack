# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Console Logins from Different Countries
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: 'T1078.004 - Valid Accounts: Cloud Accounts'
adversary: origin
references:
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
- https://attack.mitre.org/techniques/T1078/004/
description: |
  Detects successful console logins by the same principal and account from different geolocated countries within 30 minutes. VPNs, proxies and geolocation changes can produce this sequence; it does not establish impossible travel. Verify the sign-ins with the account owner.
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource","signin.amazonaws.com") &&
  oneOf("event.eventName",["ConsoleLogin"]) &&
  equals("actionResult","success") &&
  regexMatch("origin.geolocation.countryCode","^[A-Z]{2}$"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.consoleLoginImpossibleTravel
    operator: filter_term
    value: match
  - field: origin.geolocation.countryCode
    operator: must_not_term
    value: '{{.origin.geolocation.countryCode}}'
  within: 30m
  count: 1
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- adversary.geolocation.countryCode
