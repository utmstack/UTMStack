# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Security Group Modifications
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: 'T1562.007 - Impair Defenses: Disable or Modify Cloud Firewall'
adversary: origin
references:
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
- https://attack.mitre.org/techniques/T1562/007/
description: |
  Detects modifications to AWS security groups that could weaken network security posture. Monitors for changes that add permissive rules or remove restrictive rules, particularly those allowing unrestricted access (0.0.0.0/0 or ::/0).

  Next Steps:
  1. Review the security group change details in CloudTrail logs
  2. Verify if the change was authorized and follows security policies
  3. Check the user/role that made the modification
  4. Assess if the new rules expose sensitive resources
  5. If unauthorized, immediately revert the changes
  6. Review other recent activities from the same source IP or user
  7. Consider implementing preventive controls via AWS Config rules or SCPs
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource","ec2.amazonaws.com") &&
  oneOf("event.eventName",["AuthorizeSecurityGroupIngress", "AuthorizeSecurityGroupEgress", "ModifySecurityGroupRules"]) &&
  equals("actionResult","success") &&
  (exists('event.requestParameters.ipPermissions.items.#(ipRanges.items.#(cidrIp=="0.0.0.0/0"))') ||
  exists('event.requestParameters.ipPermissions.items.#(ipv6Ranges.items.#(cidrIpv6=="::/0"))') ||
  exists('event.requestParameters.securityGroupRuleSet.items.#(securityGroupRule.cidrIpv4=="0.0.0.0/0")') ||
  exists('event.requestParameters.securityGroupRuleSet.items.#(securityGroupRule.cidrIpv6=="::/0")')))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.securityGroupModifications
    operator: filter_term
    value: match
  within: 30m
  count: 3
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- lastEvent.event.sourceIPAddress
- lastEvent.event.userIdentity.arn
