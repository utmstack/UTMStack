# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EBS Snapshot Sharing Permission Added
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Exfiltration
technique: T1537 - Transfer Data to Cloud Account
adversary: origin
references:
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-modifying-snapshot-permissions.html
- https://attack.mitre.org/techniques/T1537/
description: |
  Detects a successful ModifySnapshotAttribute request that adds volume-creation permissions. Removal-only changes do not match. Review the added accounts or public group; sharing permission does not establish completed data exfiltration.
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource","ec2.amazonaws.com") &&
  oneOf("event.eventName",["ModifySnapshotAttribute"]) &&
  equals("actionResult","success") &&
  (greaterThan("event.requestParameters.createVolumePermission.add.items.#",0) ||
  greaterThan("event.requestParameters.createVolumePermission.add.#",0) ||
  (equals("event.requestParameters.attribute","createVolumePermission") &&
  equals("event.requestParameters.operationType","add") &&
  (greaterThan("event.requestParameters.userIds.#",0) ||
  greaterThan("event.requestParameters.userGroups.#",0)))))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- lastEvent.event.requestParameters.snapshotId
