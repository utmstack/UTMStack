# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated AWS VPC Flow Log Deletion Requests
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Defense Evasion
adversary: origin
references:
- https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
description: |
  Detects repeated successful DeleteFlowLogs API requests from the same source and AWS account within 24 hours. Review the flow-log identifiers and any per-resource failures in the response. API success alone does not prove that every requested log was deleted.
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","ec2.amazonaws.com") &&
  oneOf("log.eventName",["DeleteFlowLogs"]) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.vpc_flow_log_anomalies
    operator: filter_term
    value: match
  within: 24h
  count: 2
deduplicateBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.sourceIPAddress
- lastEvent.log.userIdentity.arn
- lastEvent.log.awsRegion
