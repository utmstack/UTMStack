# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Unusual API Call Patterns
impact:
  confidentiality: 2
  integrity: 1
  availability: 1
category: Discovery
adversary: origin
references:
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
- https://attack.mitre.org/techniques/T1580/
description: |
  Detects unusual API call patterns in AWS that may indicate unauthorized access or reconnaissance activities. This rule triggers when multiple sensitive API calls are made from the same source IP within a short time window, suggesting potential enumeration or discovery activities by attackers.

  Next Steps:
  - Review the source IP address and determine if it's authorized for AWS API access
  - Check if the user identity associated with these calls is legitimate and expected
  - Examine the specific API calls made to understand the reconnaissance pattern and scope
  - Review CloudTrail logs for the full session to identify any successful exploitation attempts
  - Check if any resources were modified or accessed following the reconnaissance activities
  - Verify if the API calls originated from expected geographical locations
  - Consider blocking the source IP if unauthorized activity is confirmed
  - Implement additional monitoring for the affected account and resources
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (exists("log.eventSource") &&

  exists("log.sourceIPAddress") &&
  exists("log.eventName") &&
  (
    oneOf("log.eventName", ["DescribeSecurityGroups", "DescribeNetworkAcls", "DescribeVpcs", "DescribeSubnets", "DescribeRouteTables", "DescribeInstances", "DescribeSnapshots", "DescribeVolumes", "DescribeImages", "DescribeKeyPairs", "ListBuckets", "GetBucketAcl", "GetBucketPolicy", "ListAccessKeys", "ListUsers", "ListRoles", "ListPolicies", "GetAccountAuthorizationDetails", "GenerateCredentialReport", "GetCredentialReport"])
  ) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.unusualApiCallPatterns
    operator: filter_term
    value: match
  within: 10m
  count: 50
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.sourceIPAddress
technique: T1580 - Cloud Infrastructure Discovery
