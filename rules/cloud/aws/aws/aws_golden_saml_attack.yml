# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS SAML Role Assumption After Provider Change
impact:
  confidentiality: 3
  integrity: 3
  availability: 3
category: Credential Access
technique: T1556 - Modify Authentication Process
adversary: origin
references:
- https://www.cyberark.com/resources/threat-research-blog/golden-saml-newly-discovered-attack-technique-forges-authentication-to-cloud-apps
- https://attack.mitre.org/techniques/T1556/
description: |
  Detects a successful AssumeRoleWithSAML request after a successful SAML provider creation or update in the same AWS account and collector within 24 hours. The provider change can be by a different administrator. This sequence requires investigation and does not prove that a SAML assertion was forged.
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "sts.amazonaws.com") &&
  equals("log.eventName", "AssumeRoleWithSAML") &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: log.correlationCandidate.samlProviderChange
    operator: filter_term
    value: match
  within: 24h
  count: 1
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- lastEvent.log.requestParametersRoleArn
