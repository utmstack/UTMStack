# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS SecurityHub Finding Evasion
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Defense Evasion
technique: T1562 - Impair Defenses
adversary: origin
references:
- https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-findings.html
- https://attack.mitre.org/techniques/T1562/
description: |
  Detects attempts to suppress or manipulate AWS SecurityHub findings through BatchUpdateFindings, DeleteInsight, or UpdateFindings operations. Attackers use these to hide evidence of their activities from security monitoring.

  Next Steps:
  1. Review what findings were modified or suppressed and their severity
  2. Check the user identity performing these actions for legitimacy
  3. Investigate whether this was part of legitimate finding management workflow
  4. Review the original findings that were suppressed for security relevance
  5. Check for other defense evasion activities from the same user or IP
  6. Restore suppressed findings if the action was unauthorized
  7. Review SecurityHub aggregation and automation rules for tampering
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "securityhub.amazonaws.com") &&
  oneOf("event.eventName", ["BatchUpdateFindings", "DeleteInsight", "UpdateFindings", "DeleteActionTarget"]) &&
  equals("actionResult","success") &&
  !equals("event.userIdentity.type", "AWSService"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.awsSecurityhubFindingEvasion
    operator: filter_term
    value: match
  within: 30m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- lastEvent.event.eventName
