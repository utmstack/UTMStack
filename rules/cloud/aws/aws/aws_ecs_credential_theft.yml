# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated ECS Task API Requests by an Assumed Role
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: System Integrity
adversary: origin
references:
- https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
description: |
  Detects repeated successful DescribeTaskDefinition, RunTask or StartTask requests by an assumed role. These CloudTrail management calls do not establish access to the task credential endpoint or credential theft. Review the role, task and requested operations for authorization.
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "ecs.amazonaws.com") &&
  oneOf("event.eventName", ["DescribeTaskDefinition", "RunTask", "StartTask"]) &&
  equals("actionResult","success") &&
  equals("event.userIdentity.type", "AssumedRole") &&
  contains("event.userIdentity.arn", ":assumed-role/"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.awsEcsCredentialTheft
    operator: filter_term
    value: match
  within: 30m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- lastEvent.event.sourceIPAddress
