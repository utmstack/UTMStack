# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS S3 Bulk Data Exfiltration Detected
impact:
  confidentiality: 2
  integrity: 1
  availability: 1
category: Data Exfiltration
technique: T1530 - Data from Cloud Storage Object
adversary: origin
references:
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging.html
- https://attack.mitre.org/techniques/T1530/
description: |
  Detects bulk GetObject operations from S3 buckets indicating potential data exfiltration. When an attacker gains access to AWS credentials, they may attempt to download large amounts of data from S3 buckets in a short period.

  Next Steps:
  1. Identify the S3 bucket(s) targeted and classify the data sensitivity
  2. Review the IAM principal performing the downloads and verify authorization
  3. Check the source IP address for known threat indicators
  4. Examine the volume and types of objects downloaded
  5. Verify if this matches any legitimate data processing or backup patterns
  6. If unauthorized, revoke the credentials used and block the source IP
  7. Enable S3 server access logging for affected buckets
  8. Review S3 bucket policies and tighten access controls
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "s3.amazonaws.com") &&
  equals("event.eventName", "GetObject") &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.s3BulkDataExfiltration
    operator: filter_term
    value: match
  within: 15m
  count: 100
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- lastEvent.event.requestParameters.bucketName
