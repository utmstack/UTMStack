# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS S3 Public Access Controls Relaxed
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Collection
technique: T1530 - Data from Cloud Storage Object
adversary: origin
references:
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
- https://attack.mitre.org/techniques/T1530/
description: |
  Detects a successful public ACL change or removal/relaxation of bucket Public Access Block controls. Account-level and bucket policies can still prevent public access. Review the effective controls before concluding that data is exposed.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("actionResult","success") &&
  (equals("log.eventSource","s3.amazonaws.com") &&
  oneOf("log.eventName",["PutBucketAcl", "PutObjectAcl"]) &&
  (oneOf("log.requestParameters.xamzacl",["public-read", "public-read-write"]) ||
  exists('log.requestParameters.AccessControlPolicy.AccessControlList.Grant.#(Grantee.URI=="http://acs.amazonaws.com/groups/global/AllUsers")')) ||
  equals("log.eventSource","s3.amazonaws.com") &&
  oneOf("log.eventName",["DeleteBucketPublicAccessBlock"]) ||
  (equals("log.eventSource","s3.amazonaws.com") &&
  oneOf("log.eventName",["PutBucketPublicAccessBlock"]) &&
  (equals("log.requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls",false) ||
  equals("log.requestParameters.PublicAccessBlockConfiguration.IgnorePublicAcls",false) ||
  equals("log.requestParameters.PublicAccessBlockConfiguration.BlockPublicPolicy",false) ||
  equals("log.requestParameters.PublicAccessBlockConfiguration.RestrictPublicBuckets",false)))))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.requestParameters.bucketName
- lastEvent.log.userIdentity.accessKeyId
