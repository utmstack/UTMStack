# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated AWS SSO Permission Set Changes
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Privilege Escalation
adversary: origin
references:
- https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
- https://attack.mitre.org/techniques/T1098/
description: |
  Detects repeated successful permission-set creation, policy attachment, deletion or inline-policy updates in AWS SSO from the same source and account. These administrative operations do not establish a failed login or compromised SSO session.
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource","sso.amazonaws.com") &&
  oneOf("event.eventName",["CreatePermissionSet", "AttachManagedPolicyToPermissionSet", "DeletePermissionSet", "PutInlinePolicyToPermissionSet"]) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: event.correlationCandidate.awsSsoSuspiciousActivities
    operator: filter_term
    value: match
  within: 30m
  count: 10
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- lastEvent.event.sourceIPAddress
- lastEvent.event.userIdentity.principalId
technique: T1098 - Account Manipulation
