# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Secrets Manager Suspicious Access Pattern
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
adversary: origin
references:
- https://docs.aws.amazon.com/secretsmanager/latest/userguide/monitoring-cloudtrail.html
- https://attack.mitre.org/techniques/T1555/006/
description: |
  Detects unusual access patterns to AWS Secrets Manager that could indicate credential theft or unauthorized access attempts. This rule monitors for multiple GetSecretValue or BatchGetSecretValue operations from the same source within a short time window, which may indicate an attacker attempting to harvest credentials.

  Next Steps:
  1. Review the CloudTrail logs for the identified user/role to understand which secrets were accessed
  2. Check if the accessing identity has legitimate business need for these secrets
  3. Verify if the access pattern matches normal usage for this identity
  4. Review the source IP addresses and locations for anomalies
  5. If unauthorized, immediately rotate the accessed secrets and review IAM permissions
  6. Check for any subsequent API calls using potentially compromised credentials
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "secretsmanager.amazonaws.com") &&
  (equals("event.eventName", "GetSecretValue") ||
  equals("event.eventName", "BatchGetSecretValue")) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.secretsManagerSuspiciousAccess
    operator: filter_term
    value: match
  - field: event.eventName
    operator: filter_term
    value: GetSecretValue
  within: 10m
  count: 10
  or:
  - indexPattern: v11-log-aws-*
    with:
    - field: dataSource
      operator: filter_term
      value: '{{.dataSource}}'
    - field: event.awsAccountKeyType
      operator: filter_term
      value: '{{.event.awsAccountKeyType}}'
    - field: event.awsAccountKey
      operator: filter_term
      value: '{{.event.awsAccountKey}}'
    - field: event.awsActorKeyType
      operator: filter_term
      value: '{{.event.awsActorKeyType}}'
    - field: event.awsActorKey
      operator: filter_term
      value: '{{.event.awsActorKey}}'
    - field: event.correlationCandidate.secretsManagerSuspiciousAccess
      operator: filter_term
      value: match
    - field: event.eventName
      operator: filter_term
      value: BatchGetSecretValue
    within: 10m
    count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- lastEvent.event.sourceIPAddress
- lastEvent.event.userIdentityArn
technique: 'T1555.006 - Credentials from Password Stores: Cloud Secrets Management Stores'
