# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS SSM SendCommand Remote Execution
impact:
  confidentiality: 2
  integrity: 3
  availability: 2
category: Execution
technique: T1059 - Command and Scripting Interpreter
adversary: origin
references:
- https://docs.aws.amazon.com/systems-manager/latest/userguide/run-command.html
- https://attack.mitre.org/techniques/T1059/
description: |
  Detects AWS Systems Manager SendCommand API calls which allow remote command execution on EC2 instances. Attackers with sufficient IAM permissions abuse SSM to execute commands across multiple instances without SSH/RDP access.

  Next Steps:
  1. Review the command document and parameters sent to the instances
  2. Verify the user identity has legitimate need for remote command execution
  3. Check the target instances and whether they should be managed via SSM
  4. Review the command output for suspicious activity
  5. Correlate with instance-level logs for the executed commands
  6. If unauthorized, cancel pending commands and investigate the user
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "ssm.amazonaws.com") &&
  oneOf("log.eventName", ["SendCommand", "StartSession"]) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("log.awsActorKeyType") &&
  !equals("log.awsActorKeyType","") &&
  exists("log.awsActorKey") &&
  !equals("log.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: log.awsActorKeyType
    operator: filter_term
    value: '{{.log.awsActorKeyType}}'
  - field: log.awsActorKey
    operator: filter_term
    value: '{{.log.awsActorKey}}'
  - field: log.correlationCandidate.awsSsmSendcommandAbuse
    operator: filter_term
    value: match
  within: 30m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.user
- lastEvent.log.eventName
