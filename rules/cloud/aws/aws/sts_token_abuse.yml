# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS STS Token Abuse Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 1
category: Privilege Escalation
technique: T1078.004 - Cloud Accounts
adversary: origin
references:
- https://docs.aws.amazon.com/IAM/latest/UserGuide/cloudtrail-integration.html
- https://attack.mitre.org/techniques/T1078/004/
- https://www.elastic.co/security-labs/exploring-aws-sts-assumeroot
description: |
  Detects potential abuse of AWS STS AssumeRole operations. This rule identifies when roles are assumed from unusual IP addresses or when there are multiple role assumptions in a short time period, which could indicate lateral movement or privilege escalation. The rule specifically flags AssumeRole operations performed without MFA authentication.

  Next Steps:
  1. Verify if the source IP address belongs to your organization's known IP ranges
  2. Check if the assumed role is appropriate for the user or service that initiated the request
  3. Review the user identity and verify if this is expected behavior for this account
  4. Examine CloudTrail logs for other suspicious activities from the same source IP or user identity
  5. If unauthorized, immediately revoke the temporary credentials and review IAM policies
  6. Consider implementing MFA requirements for sensitive role assumptions
  7. Review and potentially restrict the trust policy for the assumed role
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "sts.amazonaws.com") &&
  equals("log.eventName", "AssumeRole") &&
  equals("actionResult","success") &&
  equals("log.userIdentity.sessionContext.attributes.mfaAuthenticated", "false") &&
  !equals("log.userIdentity.type", "AWSService") &&
  !contains("log.userAgent", "aws-sdk") &&
  !contains("log.userAgent", "Botocore"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.stsTokenAbuse
    operator: filter_term
    value: match
  within: 15m
  count: 20
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.userIdentityArn
- adversary.ip
