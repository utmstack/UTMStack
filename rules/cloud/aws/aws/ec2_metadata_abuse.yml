# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EC2 Metadata Token Requirement Relaxed
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: 'T1552.005 - Unsecured Credentials: Cloud Instance Metadata API'
adversary: origin
references:
- https://hackingthe.cloud/aws/exploitation/ec2-metadata-ssrf/
- https://attack.mitre.org/techniques/T1552/005/
description: |
  Detects a successful ModifyInstanceMetadataOptions request setting httpTokens to optional. This permits use of IMDSv1; it does not prove that instance credentials were accessed. Verify the change and instance metadata configuration.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","ec2.amazonaws.com") &&
  oneOf("log.eventName",["ModifyInstanceMetadataOptions"]) &&
  equals("actionResult","success") &&
  equals("log.requestParameters.httpTokens","optional"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.sourceIPAddress
- lastEvent.log.userIdentityAccountId
