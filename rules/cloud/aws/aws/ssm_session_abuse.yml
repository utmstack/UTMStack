# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Systems Manager Session Abuse
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Lateral Movement
technique: T1021 - Remote Services
adversary: origin
references:
- https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
- https://attack.mitre.org/techniques/T1021/
description: |
  Detects suspicious use of AWS Systems Manager (SSM) for remote access including StartSession, SendCommand, and SendSSHPublicKey. Attackers use SSM to establish interactive sessions or execute commands on EC2 instances without requiring direct SSH access or security group changes.

  Next Steps:
  1. Verify the IAM principal initiating the SSM session is authorized for remote access
  2. Review the target instance(s) and confirm legitimate operational need
  3. Check the commands sent via SendCommand for suspicious payloads
  4. Review the source IP address for unusual origins
  5. Examine the timing of the session for off-hours access
  6. If unauthorized, terminate active sessions and review instance for compromise
  7. Implement SSM session logging to S3 and CloudWatch for audit trails
  8. Restrict SSM access using IAM policies with condition keys
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "ssm.amazonaws.com") &&
  oneOf("event.eventName", ["StartSession", "ResumeSession", "SendCommand", "StartAutomationExecution"]) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.ssmSessionAbuse
    operator: filter_term
    value: match
  within: 30m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- lastEvent.event.eventName
