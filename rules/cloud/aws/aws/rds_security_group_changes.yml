# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS RDS Security Group Internet Ingress Added
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Defense Evasion
technique: 'T1562.007 - Impair Defenses: Disable or Modify Cloud Firewall'
adversary: origin
references:
- https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/logging-using-cloudtrail.html
- https://attack.mitre.org/techniques/T1562/007/
description: |
  Detects a successful AuthorizeDBSecurityGroupIngress request allowing 0.0.0.0/0. Revoking a permission does not add exposure. Review the database security group and business justification.
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","rds.amazonaws.com") &&
  oneOf("log.eventName",["AuthorizeDBSecurityGroupIngress"]) &&
  equals("actionResult","success") &&
  (equals("log.requestParameters.cidrip","0.0.0.0/0") ||
  equals("log.requestParameters.cidrIp","0.0.0.0/0")))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.eventName
- lastEvent.log.userIdentityArn
