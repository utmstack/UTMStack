# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated AWS Administrative Policy Attachments
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
adversary: origin
references:
- https://bishopfox.com/blog/privilege-escalation-in-aws
- https://attack.mitre.org/techniques/T1098/
description: |
  Detects repeated successful attachment of the AWS-managed AdministratorAccess or IAMFullAccess policy to a role or user by the same actor and account within one hour. Review whether these grants were approved. The request alone does not identify a Lambda execution role.
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","iam.amazonaws.com") &&
  oneOf("log.eventName",["AttachRolePolicy", "AttachUserPolicy"]) &&
  equals("actionResult","success") &&
  regexMatch("log.requestParameters.policyArn","^arn:(aws|aws-cn|aws-us-gov):iam::aws:policy/(AdministratorAccess|IAMFullAccess)$"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("log.awsActorKeyType") &&
  !equals("log.awsActorKeyType","") &&
  exists("log.awsActorKey") &&
  !equals("log.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: log.awsActorKeyType
    operator: filter_term
    value: '{{.log.awsActorKeyType}}'
  - field: log.awsActorKey
    operator: filter_term
    value: '{{.log.awsActorKey}}'
  - field: log.correlationCandidate.lambdaPrivilegeEscalation
    operator: filter_term
    value: match
  within: 1h
  count: 2
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- lastEvent.log.requestParameters.roleArn
- lastEvent.log.userIdentity.arn
technique: T1098 - Account Manipulation
