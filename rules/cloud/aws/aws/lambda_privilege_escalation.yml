# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated AWS Administrative Policy Attachments
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
adversary: origin
references:
- https://bishopfox.com/blog/privilege-escalation-in-aws
- https://attack.mitre.org/techniques/T1098/
description: |
  Detects repeated successful attachment of the AWS-managed AdministratorAccess or IAMFullAccess policy to a role or user by the same actor and account within one hour. Review whether these grants were approved. The request alone does not identify a Lambda execution role.
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource","iam.amazonaws.com") &&
  oneOf("event.eventName",["AttachRolePolicy", "AttachUserPolicy"]) &&
  equals("actionResult","success") &&
  regexMatch("event.requestParameters.policyArn","^arn:(aws|aws-cn|aws-us-gov):iam::aws:policy/(AdministratorAccess|IAMFullAccess)$"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.lambdaPrivilegeEscalation
    operator: filter_term
    value: match
  within: 1h
  count: 2
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- lastEvent.event.requestParameters.roleArn
- lastEvent.event.userIdentity.arn
technique: T1098 - Account Manipulation
