# Rule contract revision 2026-09-25; SDK v1.1.36 (gap-fill set).
dataTypes:
- aws
name: AWS Security Hub Disabled
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Defense Evasion
technique: T1685 - Disable or Modify Cloud Logs
adversary: origin
description: Identifies DisableSecurityHub, turning off the central threat dashboard and aggregate findings, an anti-forensics step.
references:
- https://docs.aws.amazon.com/securityhub/latest/APIReference/API_DisableSecurityHub.html
where: |
  equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource", "securityhub.amazonaws.com") &&
  equals("log.eventName", "DisableSecurityHub") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
