# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS IAM Privilege Escalation Path Detection
impact:
  confidentiality: 3
  integrity: 3
  availability: 2
category: Privilege Escalation
technique: T1098 - Account Manipulation
adversary: origin
references:
- https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_manage.html
- https://attack.mitre.org/techniques/T1098/
- https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/
description: |
  Detects IAM actions commonly chained for privilege escalation including PassRole, CreatePolicyVersion, AttachUserPolicy, and AssumeRole. Attackers exploit these API calls to elevate their permissions within an AWS environment by creating new policy versions with elevated privileges or assuming roles with higher access.

  Next Steps:
  1. Review the IAM actions performed and determine if they constitute a privilege escalation chain
  2. Check the IAM principal and verify their authorized permission level
  3. Examine the policy document or role being targeted for overly permissive access
  4. Verify through change management if these IAM changes were approved
  5. If unauthorized, immediately revert the IAM changes and rotate credentials
  6. Review IAM Access Analyzer findings for excessive permissions
  7. Implement permission boundaries to limit privilege escalation paths
  8. Enable AWS CloudTrail Insights for anomaly detection on IAM operations
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "iam.amazonaws.com") &&
  oneOf("event.eventName", ["CreatePolicyVersion", "SetDefaultPolicyVersion", "AttachUserPolicy", "AttachGroupPolicy", "AttachRolePolicy", "PutUserPolicy", "PutGroupPolicy", "PutRolePolicy", "AddUserToGroup"]) &&
  equals("actionResult","success"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.iamPrivilegeEscalationPaths
    operator: filter_term
    value: match
  within: 30m
  count: 3
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.user
- lastEvent.event.eventName
