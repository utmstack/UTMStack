# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS WAF Rule or Rule Group Deletion
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Defense Evasion
technique: T1562 - Impair Defenses
adversary: origin
description: Identifies the deletion of a specified AWS Web Application Firewall (WAF) rule or rule group
references:
- https://attack.mitre.org/tactics/TA0005/
- https://attack.mitre.org/techniques/T1562/
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/waf/delete-rule-group.html
- https://docs.aws.amazon.com/waf/latest/APIReference/API_waf_DeleteRuleGroup.html
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (oneOf("event.eventSource", ["waf.amazonaws.com", "waf-regional.amazonaws.com", "wafv2.amazonaws.com"]) &&
  (equals("event.eventName", "DeleteRule") ||
  equals("event.eventName", "DeleteRuleGroup")) &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
