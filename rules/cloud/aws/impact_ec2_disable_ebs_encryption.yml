# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EC2 Encryption Disabled
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Impact
technique: T1565 - Data Manipulation
adversary: origin
description: Identifies disabling of Amazon Elastic Block Store (EBS) encryption by default in the current region. Disabling
  encryption by default does not change the encryption status of your existing volumes
references:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1565/
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/disable-ebs-encryption-by-default.html
- https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DisableEbsEncryptionByDefault.html
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "ec2.amazonaws.com") &&
  equals("event.eventName", "DisableEbsEncryptionByDefault") &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
