# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS IAM Assume Role Policy Update
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Initial Access
technique: T1078 - Valid Accounts
adversary: origin
description: Identifies attempts to modify an AWS IAM Assume Role Policy. An adversary may attempt to modify the AssumeRolePolicy
  of a misconfigured role in order to gain the privileges of that role
references:
- https://attack.mitre.org/tactics/TA0004/
- https://attack.mitre.org/techniques/T1078/
- https://labs.bishopfox.com/tech-blog/5-privesc-attack-vectors-in-aws
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "iam.amazonaws.com") &&
  equals("event.eventName", "UpdateAssumeRolePolicy"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
