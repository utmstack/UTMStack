# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS Management Console Brute Force of Root User Identity
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: T1110 - Brute Force
adversary: origin
description: Identifies a high number of failed authentication attempts to the AWS management console for the Root user identity.
  An adversary may attempt to brute force the password for the Root user identity, as it has complete access to all services
  and resources for the AWS account
references:
- https://attack.mitre.org/tactics/TA0006/
- https://attack.mitre.org/techniques/T1110/
- https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","signin.amazonaws.com") &&
  oneOf("log.eventName",["ConsoleLogin"]) &&
  equals("log.userIdentity.type","Root") &&
  oneOf("actionResult",["failure", "denied"]))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("origin.ip") &&
  !equals("origin.ip","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: origin.ip
    operator: filter_term
    value: '{{.origin.ip}}'
  - field: log.correlationCandidate.credentialAccessRootConsoleFailureBruteForce
    operator: filter_term
    value: match
  within: 15m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
