# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS EC2 Snapshot Activity
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Exfiltration
technique: T1537 - Transfer Data to Cloud Account
adversary: origin
description: An attempt was made to modify AWS EC2 snapshot attributes. Snapshots are sometimes shared by threat actors in
  order to exfiltrate bulk data from an EC2 fleet. If the permissions were modified, verify the snapshot was not shared with
  an unauthorized or unexpected AWS account
references:
- https://attack.mitre.org/tactics/TA0010/
- https://attack.mitre.org/techniques/T1537/
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/modify-snapshot-attribute.html
- https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifySnapshotAttribute.html
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "ec2.amazonaws.com") &&
  equals("event.eventName", "ModifySnapshotAttribute"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
