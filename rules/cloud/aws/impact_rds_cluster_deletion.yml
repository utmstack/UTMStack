# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: AWS RDS Cluster Deletion
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: Impact
technique: T1485 - Data Destruction
adversary: origin
description: Identifies the deletion of an Amazon Relational Database Service (RDS) Aurora database cluster or global database
  cluster
references:
- https://attack.mitre.org/tactics/TA0040/
- https://attack.mitre.org/techniques/T1485/
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/rds/delete-db-cluster.html
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteDBCluster.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/rds/delete-global-cluster.html
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteGlobalCluster.html
where: |
  equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource", "rds.amazonaws.com") &&
  oneOf("event.eventName", ["DeleteDBCluster", "DeleteGlobalCluster"]) &&
  equals("actionResult","success"))
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
