# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated Malformed AWS IAM Trust Policy Updates
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Privilege Escalation
technique: T1098 - Account Manipulation
adversary: origin
description: |
  Detects repeated UpdateAssumeRolePolicy requests rejected with MalformedPolicyDocument or MalformedPolicyDocumentException by the same actor and account. This is a rejected trust-policy update, not a failed AssumeRole authentication or password brute force. Review the proposed policy and administrative workflow.
references:
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAssumeRolePolicy.html
- https://attack.mitre.org/techniques/T1098/
where: |
  (equals("event.awsRecordType","cloudtrail") &&
  (equals("event.eventSource","iam.amazonaws.com") &&
  oneOf("event.eventName",["UpdateAssumeRolePolicy"]) &&
  oneOf("event.errorCode",["MalformedPolicyDocument", "MalformedPolicyDocumentException"]) &&
  equals("actionResult","failure"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("event.awsAccountKeyType") &&
  !equals("event.awsAccountKeyType","") &&
  exists("event.awsAccountKey") &&
  !equals("event.awsAccountKey","") &&
  exists("event.awsActorKeyType") &&
  !equals("event.awsActorKeyType","") &&
  exists("event.awsActorKey") &&
  !equals("event.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: event.awsAccountKeyType
    operator: filter_term
    value: '{{.event.awsAccountKeyType}}'
  - field: event.awsAccountKey
    operator: filter_term
    value: '{{.event.awsAccountKey}}'
  - field: event.awsActorKeyType
    operator: filter_term
    value: '{{.event.awsActorKeyType}}'
  - field: event.awsActorKey
    operator: filter_term
    value: '{{.event.awsActorKey}}'
  - field: event.correlationCandidate.credentialAccessAwsIamAssumeRoleBruteForce
    operator: filter_term
    value: match
  within: 15m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.event.awsAccountKeyType
- lastEvent.event.awsAccountKey
- adversary.ip
- adversary.user
