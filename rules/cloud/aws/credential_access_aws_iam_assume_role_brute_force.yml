# Rule contract revision 2026-09-17; SDK v1.1.31.
dataTypes:
- aws
name: Repeated Malformed AWS IAM Trust Policy Updates
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Privilege Escalation
technique: T1098 - Account Manipulation
adversary: origin
description: |
  Detects repeated UpdateAssumeRolePolicy requests rejected with MalformedPolicyDocument or MalformedPolicyDocumentException by the same actor and account. This is a rejected trust-policy update, not a failed AssumeRole authentication or password brute force. Review the proposed policy and administrative workflow.
references:
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAssumeRolePolicy.html
- https://attack.mitre.org/techniques/T1098/
where: |
  (equals("log.awsRecordType","cloudtrail") &&
  (equals("log.eventSource","iam.amazonaws.com") &&
  oneOf("log.eventName",["UpdateAssumeRolePolicy"]) &&
  oneOf("log.errorCode",["MalformedPolicyDocument", "MalformedPolicyDocumentException"]) &&
  equals("actionResult","failure"))) &&
  exists("dataSource") &&
  !equals("dataSource","") &&
  exists("log.awsAccountKeyType") &&
  !equals("log.awsAccountKeyType","") &&
  exists("log.awsAccountKey") &&
  !equals("log.awsAccountKey","") &&
  exists("log.awsActorKeyType") &&
  !equals("log.awsActorKeyType","") &&
  exists("log.awsActorKey") &&
  !equals("log.awsActorKey","")
afterEvents:
- indexPattern: v11-log-aws-*
  with:
  - field: dataSource
    operator: filter_term
    value: '{{.dataSource}}'
  - field: log.awsAccountKeyType
    operator: filter_term
    value: '{{.log.awsAccountKeyType}}'
  - field: log.awsAccountKey
    operator: filter_term
    value: '{{.log.awsAccountKey}}'
  - field: log.awsActorKeyType
    operator: filter_term
    value: '{{.log.awsActorKeyType}}'
  - field: log.awsActorKey
    operator: filter_term
    value: '{{.log.awsActorKey}}'
  - field: log.correlationCandidate.credential_access_aws_iam_assume_role_brute_force
    operator: filter_term
    value: match
  within: 15m
  count: 5
groupBy:
- lastEvent.dataSource
- lastEvent.log.awsAccountKeyType
- lastEvent.log.awsAccountKey
- adversary.ip
- adversary.user
