# Rule version v1.1.2

dataTypes:
- o365
name: Suspicious Mail Forwarding Rule Creation
description: |
  An inbox rule was created or changed with a ForwardTo, ForwardAsAttachmentTo or RedirectTo setting. Rules that send a mailbox's mail to an outside address are a common sign that the mailbox has been taken over.

  Check the destination in the rule parameters, who made the change and recent sign-ins for the mailbox. Clearing a forwarding setting in an existing rule also raises this alert. The alert does not by itself establish compromise or an external recipient.
category: Collection
technique: 'T1114.003 - Email Collection: Email Forwarding Rule'
adversary: origin
impact:
  confidentiality: 2
  integrity: 1
  availability: 0
references:
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
- https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/set-inboxrule?view=exchange-ps
where: |
  equals("event.Workload", "Exchange") && equals("actionResult", "success") && oneOf("action", ["New-InboxRule", "Set-InboxRule"]) && (equals("event.o365InboxForwardingChange", "true") || exists("event.Parameters.#(Name==ForwardTo).Name") || exists("event.Parameters.#(Name==ForwardAsAttachmentTo).Name") || exists("event.Parameters.#(Name==RedirectTo).Name"))
groupBy:
- lastEvent.tenantId
- lastEvent.event.OrganizationId
- dataSource
- adversary.user
- lastEvent.action
