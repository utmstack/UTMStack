# Rule version v1.1.0

dataTypes:
  - "o365"
name: "Potential Password Spraying of Microsoft 365 User Accounts"
impact:
  confidentiality: 3
  integrity: 2
  availability: 2
category: "Credential Access"
technique: "T1110 - Brute Force"
adversary: origin
references:
  - "https://attack.mitre.org/techniques/T1110/"
  - "https://attack.mitre.org/tactics/TA0006/"
description: "Credential Access consists of techniques for stealing credentials like account names and passwords. Techniques used to get credentials include keylogging or credential dumping. Using legitimate credentials can give adversaries access to systems, make them harder to detect, and provide the opportunity to create more accounts to help achieve their goals.<br>
  Identifies a high number (50) of failed Microsoft 365 sign-ins (UserLoginFailed) from a single IP address within 10 minutes, which could be indicative of a password spraying attack. An adversary may attempt a password spraying attack to obtain unauthorized access to user accounts. Company internet gateways carry many ordinary failures, such as multi-factor prompts and expired sessions, so the threshold is set above that everyday volume. One alert is raised per IP address; repeats for the same address are suppressed for seven days."
where: |
  oneOf("event.Workload", ["Exchange", "AzureActiveDirectory"]) && oneOf("action", ["UserLoginFailed", "PasswordLogonInitialAuthUsingPassword"]) && oneOf("actionResult", ["failed", "denied"]) && exists("origin.ip")
afterEvents:
  - indexPattern: v11-log-o365-*
    with:
      - field: origin.ip
        operator: filter_term
        value: '{{.origin.ip}}'
      - field: action
        operator: filter_term
        value: 'UserLoginFailed'
    within: 10m
    count: 50
deduplicateBy:
  - adversary.ip
