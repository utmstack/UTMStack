# Rule version v1.1.0

dataTypes:
- o365
name: Office 365 Mailbox Client Access Changed
description: |
  An administrator changed client access settings on a mailbox with Set-CASMailbox. Examine the changed protocol or access setting and the affected mailbox before deciding whether follow-up is needed.

  Review the actor, affected object, change request and authorized owner. This alert reports an audited configuration change; it does not by itself establish compromise, an external recipient, or a currently enabled setting.
category: Administrative Awareness
technique: Administrative mailbox access change
adversary: origin
impact:
  confidentiality: 1
  integrity: 1
  availability: 0
references:
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
- https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/set-casmailbox?view=exchange-ps
where: |
  equals("log.Workload", "Exchange") && equals("actionResult", "success") && equals("action", "Set-CASMailbox")
groupBy:
- lastEvent.tenantId
- lastEvent.log.OrganizationId
- dataSource
- adversary.user
- lastEvent.action
- lastEvent.log.ObjectId
- target.user
- lastEvent.log.MailboxOwnerUPN
