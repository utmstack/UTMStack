# Rule version v1.0.0

dataTypes:
  - o365
name: Office 365 Impossible Travel Login Detection
impact:
  confidentiality: 3
  integrity: 2
  availability: 1
category: Credential Access
technique: "T1078 - Valid Accounts"
adversary: origin
references:
  - https://learn.microsoft.com/en-us/microsoft-365/security/office-365-security/detect-and-remediate-outlook-rules-forms-attack
  - https://attack.mitre.org/techniques/T1078/
description: |
  Detects Office 365 sign-ins from geographically impossible locations by correlating successful logins from different countries within a short time window. This pattern strongly indicates credential compromise and unauthorized account access.

  Next Steps:
  1. Review the login locations and IP addresses for the affected user
  2. Check if the user uses VPN services that could explain different geolocations
  3. Verify with the user whether both login sessions are legitimate
  4. Review the actions performed in each session for data access or configuration changes
  5. Check for inbox rule creation or mail forwarding changes
  6. If compromised, immediately reset user credentials and revoke all active sessions
  7. Enable MFA if not already configured
  8. Review the affected user's mailbox for signs of data theft
where: |
  equals("action", "UserLoggedIn") &&
  equals("actionResult", "Success") &&
  exists("origin.geolocation.countryCode")
afterEvents:
  - indexPattern: v11-log-o365-*
    with:
      - field: origin.user
        operator: filter_term
        value: '{{.origin.user}}'
      - field: action
        operator: filter_term
        value: UserLoggedIn
      - field: origin.geolocation.countryCode
        operator: must_not_term
        value: '{{.origin.geolocation.countryCode}}'
    within: now-30m
    count: 1
groupBy:
  - adversary.geolocation.countryCode
  - adversary.user
