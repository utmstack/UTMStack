# Rule version v1.1.0

dataTypes:
- o365
name: Office 365 Mail Connector Changed
description: |
  An inbound or outbound Exchange Online mail connector was created, changed or removed. Review routing and authentication settings in the audited object and confirm the administrator intended the change.

  Review the actor, affected object, change request and authorized owner. This alert reports an audited configuration change; it does not by itself establish compromise, an external recipient, or a currently enabled setting.
category: Administrative Awareness
technique: Administrative mail flow change
adversary: origin
impact:
  confidentiality: 1
  integrity: 1
  availability: 0
references:
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
- https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/new-inboundconnector?view=exchange-ps
where: |
  equals("log.Workload", "Exchange") && equals("actionResult", "success") && oneOf("action", ["New-InboundConnector", "Set-InboundConnector", "Remove-InboundConnector", "New-OutboundConnector", "Set-OutboundConnector", "Remove-OutboundConnector"])
groupBy:
- lastEvent.tenantId
- lastEvent.log.OrganizationId
- dataSource
- adversary.user
- lastEvent.action
- lastEvent.log.ObjectId
- target.user
- lastEvent.log.MailboxOwnerUPN
