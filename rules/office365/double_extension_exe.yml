# Rule version v1.0.0

dataTypes:
  - o365
name: Microsoft 365 Double-Extension Executable Staged
impact:
  confidentiality: 2
  integrity: 2
  availability: 1
category: Collection
technique: "T1036 - Masquerading"
adversary: origin
references:
  - https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Microsoft%20365/Hunting%20Queries/double_file_ext_exes.yaml
  - https://attack.mitre.org/techniques/T1036/
description: |
  Detects files on OneDrive for Business or SharePoint Online whose name contains a hidden ".exe." double extension (e.g., "invoice.exe.pdf", "report.exe.docx"). Attackers use double extensions to disguise malicious executables as documents so users and security tooling treat them as benign.

  Verified against live Unified Audit data: file operations carry target.filename (full name) and log.SourceFileExtension (real last extension). The rule fires when the name embeds ".exe." but the true extension is not "exe".

  Next Steps:
  1. Identify the file, its location, and the user who uploaded/accessed it
  2. Download and detonate the file in a sandbox to confirm executability
  3. Check the upload source (phishing link, external sharing, client IP)
  4. Look for other users accessing the same file
  5. If malicious, remove the file and notify users who opened it
where: |
  oneOf("action", ["FileAccessed", "FileDownloaded", "FilePreviewed", "FileShared"]) &&
  exists("target.filename") &&
  contains("target.filename", ".exe.") &&
  !equals("log.SourceFileExtension", "exe")
groupBy:
  - adversary.user
  - origin.ip
