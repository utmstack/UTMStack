# Rule version v1.1.1

dataTypes:
- o365
name: Office 365 Mailbox Delegate Permission Changed
description: |
  An administrator changed mailbox FullAccess, SendAs or SendOnBehalf access through mailbox or recipient permission cmdlets, or supplied GrantSendOnBehalfTo to Set-Mailbox. Microsoft may also emit routine service-account mailbox permission maintenance; verify the actor and mailbox before escalation.

  Review the actor, affected object, change request and authorized owner. This alert reports an audited configuration change; it does not by itself establish compromise, an external recipient, or a currently enabled setting.
category: Administrative Awareness
technique: 'T1098.002 - Account Manipulation: Additional Email Delegate Permissions'
adversary: origin
impact:
  confidentiality: 1
  integrity: 1
  availability: 0
references:
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
- https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/add-mailboxpermission?view=exchange-ps
where: |
  equals("log.Workload", "Exchange") && equals("actionResult", "success") && (oneOf("action", ["Add-MailboxPermission", "Remove-MailboxPermission", "Add-RecipientPermission", "Remove-RecipientPermission"]) || (equals("action", "Set-Mailbox") && (equals("log.o365SendOnBehalfChange", "true") || exists("log.Parameters.#(Name==GrantSendOnBehalfTo).Name"))))
groupBy:
- lastEvent.tenantId
- lastEvent.log.OrganizationId
- dataSource
- adversary.user
- lastEvent.action
