# Rule version v1.1.0

dataTypes:
- o365
name: Office 365 Mailbox Folder Permission Changed
description: |
  An Exchange mailbox folder permission was added, modified or removed. This includes audited mailbox activity operations and Exchange administrator cmdlets, which can grant or revoke access to messages in a folder.

  Review the actor, affected object, change request and authorized owner. This alert reports an audited configuration change; it does not by itself establish compromise, an external recipient, or a currently enabled setting.
category: Administrative Awareness
technique: 'T1098.002 - Account Manipulation: Additional Email Delegate Permissions'
adversary: origin
impact:
  confidentiality: 1
  integrity: 1
  availability: 0
references:
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
- https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/add-mailboxfolderpermission?view=exchange-ps
where: |
  equals("log.Workload", "Exchange") && equals("actionResult", "success") && oneOf("action", ["Add-MailboxFolderPermission", "Set-MailboxFolderPermission", "Remove-MailboxFolderPermission", "AddFolderPermissions", "ModifyFolderPermissions", "RemoveFolderPermissions"])
groupBy:
- lastEvent.tenantId
- lastEvent.log.OrganizationId
- dataSource
- adversary.user
- lastEvent.action
- lastEvent.log.ObjectId
- target.user
- lastEvent.log.MailboxOwnerUPN
- lastEvent.log.folderId
