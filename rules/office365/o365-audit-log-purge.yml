# Rule version v1.1.0

name: O365 Audit Log Purge
description: |
  Detects the two Microsoft 365 operations that remove investigation data: a Data Security Investigations purge job being started (DSIPurgeStarted, which deletes the items found by an investigation from their mailboxes and sites) and an audit log search job being deleted (AuditSearchDeleted). Attackers commonly destroy evidence to cover their tracks after compromising an environment, and both operations are rare administrator actions. Ordinary mailbox purges (HardDelete) are not audit data; mass purging is covered by the Mass Email Deletion rule. One alert is raised per user and operation; repeats are suppressed for seven days.
category: "Defense Evasion"
technique: "T1070 - Indicator Removal"
references:
  - "https://learn.microsoft.com/en-us/purview/audit-log-activities"
  - "https://attack.mitre.org/techniques/T1070/"
dataTypes:
  - o365
adversary: origin
impact:
  confidentiality: 2
  integrity: 3
  availability: 0
where: oneOf("action", ["DSIPurgeStarted", "AuditSearchDeleted"])
deduplicateBy:
  - adversary.user
  - lastEvent.action
