# Rule version v1.1.1

dataTypes:
- o365
name: Office 365 Mailbox Forwarding Setting Changed
description: |
  An administrator changed a mailbox forwarding parameter using Set-Mailbox: ForwardingAddress, ForwardingSmtpAddress or DeliverToMailboxAndForward. Inspect the recorded value to learn whether this enabled, redirected, changed or cleared forwarding.

  Review the actor, affected object, change request and authorized owner. This alert reports an audited configuration change; it does not by itself establish compromise, an external recipient, or a currently enabled setting.
category: Administrative Awareness
technique: 'T1114.003 - Email Collection: Email Forwarding Rule'
adversary: origin
impact:
  confidentiality: 1
  integrity: 1
  availability: 0
references:
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://learn.microsoft.com/en-us/office/office-365-management-api/office-365-management-activity-api-schema
- https://learn.microsoft.com/en-us/powershell/module/exchangepowershell/set-mailbox?view=exchange-ps
where: |
  equals("log.Workload", "Exchange") && equals("actionResult", "success") && equals("action", "Set-Mailbox") && (equals("log.o365MailboxForwardingChange", "true") || exists("log.Parameters.#(Name==ForwardingAddress).Name") || exists("log.Parameters.#(Name==ForwardingSmtpAddress).Name") || exists("log.Parameters.#(Name==DeliverToMailboxAndForward).Name"))
groupBy:
- lastEvent.tenantId
- lastEvent.log.OrganizationId
- dataSource
- adversary.user
- lastEvent.action
