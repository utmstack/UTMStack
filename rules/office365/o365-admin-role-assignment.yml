# Rule version v1.1.0

name: O365 Admin Role Assignment
description: |
  Detects when an administrator assigns a directory role (Add member to role.) in Azure Active Directory. This activity can indicate account compromise or insider threat where an attacker escalates privileges to maintain persistence within the tenant. Ordinary group membership changes and user consent grants are not role assignments and do not trigger this rule. One alert is raised per actor and assigned account; repeats of the same assignment are suppressed for seven days.
category: "Persistence"
technique: "T1136 - Create Account"
references:
  - "https://learn.microsoft.com/en-us/purview/audit-log-activities"
  - "https://attack.mitre.org/techniques/T1136/"
dataTypes:
  - o365
adversary: origin
impact:
  confidentiality: 2
  integrity: 3
  availability: 0
where: equals("log.Workload", "AzureActiveDirectory") && equals("action", "Add member to role.") && equals("actionResult", "success")
deduplicateBy:
  - adversary.user
  - lastEvent.log.ObjectId
