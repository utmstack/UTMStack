- id: 1026
  dataTypes:
    - azure
  name: ExpressRoute Configuration Changes
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Network Security
  technique: "T1046 - Network Service Discovery"
  adversary: origin
  references:
    - https://learn.microsoft.com/en-us/azure/expressroute/monitor-expressroute
    - https://attack.mitre.org/techniques/T1046/
  description: |
    Detects configuration changes to Azure ExpressRoute circuits which could indicate unauthorized network modifications or attempts to bypass security controls. ExpressRoute circuits provide private connectivity between Azure and on-premises infrastructure, making unauthorized changes particularly concerning for network security.
    
    Next Steps:
    1. Verify the change was authorized and performed by legitimate administrators
    2. Review the specific configuration changes made to the ExpressRoute circuit
    3. Check if the change aligns with documented change management procedures
    4. Investigate the source IP and user account that performed the change
    5. Validate that no unauthorized access to critical network segments occurred
    6. Review related network logs for any suspicious activity following the change
  where: safe(log.operationName, "") == "Microsoft.Network/expressRouteCircuits/write" || safe(log.operationName, "") == "Microsoft.Network/expressRouteCircuits/delete" || (safe(log.resourceId, "").contains("/expressRouteCircuits/") && safe(log.operationName, "").contains("write"))
  deduplicateBy:
    - lastEvent.log.resourceId
