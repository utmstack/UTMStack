- id: 1007
  dataTypes:
    - azure
  name: Network Security Group Modifications
  impact:
    confidentiality: 3
    integrity: 3
    availability: 2
  category: Network Security Configuration Change
  technique: "T1562.007 - Impair Defenses: Disable or Modify Cloud Firewall"
  adversary: origin
  references:
    - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-nsg-manage-log
    - https://attack.mitre.org/techniques/T1562/007/
  description: |
    Detects modifications to Azure Network Security Groups which could indicate attempts to bypass network security controls or create backdoor access. Network Security Groups control traffic flow to Azure resources and unauthorized changes could expose critical infrastructure.
    
    Next Steps:
    1. Verify the legitimacy of the NSG modification with the responsible administrator
    2. Review the specific security rules that were added, modified, or deleted
    3. Check if the modification aligns with approved change management processes
    4. Investigate the source IP and user account that performed the change
    5. Review other recent Azure activity from the same user or IP address
    6. Validate that the NSG changes don't expose critical resources to unauthorized access
    7. Check if the changes affect production workloads or sensitive environments
  where: |
    safe(log.operationName, "").contains("Microsoft.Network/networkSecurityGroups") &&
    (safe(log.operationName, "").contains("/write") || 
     safe(log.operationName, "").contains("/delete") || 
     safe(log.operationName, "").contains("/securityRules/write")) &&
    safe(log.category, "") == "Administrative" &&
    safe(log.resultType, "") == "Success"
  deduplicateBy:
    - origin.ip
    - log.resourceId
