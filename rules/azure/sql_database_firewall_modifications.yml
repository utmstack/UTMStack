- id: 1009
  dataTypes:
    - azure
  name: SQL Database Firewall Rule Modifications
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Database Security Configuration
  technique: Remote Services
  adversary: origin
  references:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/activity-log-schema
    - https://attack.mitre.org/techniques/T1021/
  description: |
    Detects modifications to Azure SQL Database firewall rules which could allow unauthorized access to sensitive data. This includes both creation and deletion of firewall rules that control network access to SQL databases.
    
    Next Steps:
    1. Verify the legitimacy of the firewall rule modification
    2. Check if the change was authorized and documented
    3. Review the source IP and user making the modification
    4. Assess if the new firewall rule creates security risks
    5. Monitor for subsequent database access attempts from newly allowed IPs
    6. Review Azure Activity Logs for related database activities
  where: |
    safe(log.operationName, "").contains("Microsoft.Sql/servers") &&
    (safe(log.operationName, "").contains("/firewallRules/write") || safe(log.operationName, "").contains("/firewallRules/delete")) &&
    safe(log.category, "") == "Administrative" &&
    actionResult == "accepted"
  deduplicateBy:
    - origin.ip
    - log.resourceId
