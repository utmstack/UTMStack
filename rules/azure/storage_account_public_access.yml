- id: 1008
  dataTypes:
    - azure
  name: Storage Account Public Access Enabled
  impact:
    confidentiality: 3
    integrity: 2
    availability: 1
  category: Data Exposure Risk
  technique: "T1530 - Data from Cloud Storage Object"
  adversary: origin
  references:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/activity-log-schema
    - https://attack.mitre.org/techniques/T1530/
  description: |
    Detects when public access is enabled on Azure Storage Accounts which could lead to unauthorized data exposure. 
    This configuration change creates a significant security risk as it allows anonymous access to stored data.

    Next Steps:
    1. Immediately review the affected storage account configuration
    2. Verify if public access was intentionally enabled and properly authorized
    3. Check if any sensitive data is stored in the account
    4. Review access logs for any unauthorized access attempts
    5. Consider disabling public access if not required for business operations
    6. Implement network restrictions and access policies if public access is necessary
    7. Monitor for any data exfiltration activities
  where: |
    safe(lastEvent.log.operationName, "").contains("Microsoft.Storage/storageAccounts") &&
    (safe(lastEvent.log.operationName, "").contains("/write") || safe(lastEvent.log.operationName, "").contains("/blobServices/write")) &&
    safe(lastEvent.log.category, "") == "Administrative" &&
    safe(lastEvent.log.actionResult, "") == "accepted" &&
    (safe(lastEvent.log.properties, "").contains("allowBlobPublicAccess") || safe(lastEvent.log.properties, "").contains("publicAccess"))
  deduplicateBy:
    - lastEvent.log.resourceId
    - lastEvent.log.aadObjectId
