- id: 1006
  dataTypes:
    - azure
  name: Resource Group Mass Modifications
  impact:
    confidentiality: 2
    integrity: 3
    availability: 3
  category: Cloud Infrastructure Modification
  technique: "T1496 - Resource Hijacking"
  adversary: origin
  references:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/activity-log-schema
    - https://attack.mitre.org/techniques/T1496/
  description: |
    Detects mass modifications to Azure resource groups which could indicate unauthorized infrastructure changes or resource hijacking attempts. This rule triggers when multiple resource group write or delete operations are performed by the same user from the same IP address within a 15-minute window.
    
    Next Steps:
    1. Investigate the user account (log.aadObjectId) performing the modifications
    2. Review the specific resource groups being modified
    3. Check if the operations align with scheduled maintenance or legitimate business activities
    4. Verify the source IP address and geolocation for suspicious activity
    5. Review Azure Activity Logs for the full scope of changes made
    6. Check for any privilege escalation or unauthorized access to the account
    7. If malicious, immediately revoke access and assess impact on affected resources
  where: |
    safe(log.operationName, "").contains("Microsoft.Resources/subscriptions/resourceGroups") &&
    (safe(log.operationName, "").contains("/write") || safe(log.operationName, "").contains("/delete")) &&
    safe(log.category, "") == "Administrative" &&
    safe(log.resultSignature, "") == "Succeeded"
  afterEvents:
    - indexPattern: v11-log-azure-*
      with:
        - field: origin.ip.keyword
          operator: filter_term
          value: '{{origin.ip}}'
        - field: log.aadObjectId.keyword
          operator: filter_term
          value: '{{log.aadObjectId}}'
      within: now-15m
      count: 10
  deduplicateBy:
    - origin.ip
    - log.aadObjectId
