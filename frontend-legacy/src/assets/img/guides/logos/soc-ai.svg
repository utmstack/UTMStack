<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Neural network connections to shield (behind shield) -->
  <!-- Top connections -->
  <line x1="150" y1="20" x2="90" y2="8" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="150" y1="20" x2="210" y2="8" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="150" y1="20" x2="150" y2="2" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <!-- Upper left connections -->
  <line x1="42" y1="68" x2="14" y2="42" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="42" y1="68" x2="8" y2="80" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="42" y1="68" x2="24" y2="108" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Upper right connections -->
  <line x1="258" y1="68" x2="286" y2="42" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="258" y1="68" x2="292" y2="80" stroke="#60a5fa" stroke-width="1.2" opacity="0.4"/>
  <line x1="258" y1="68" x2="276" y2="108" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Mid left connections -->
  <line x1="42" y1="136" x2="10" y2="140" stroke="#60a5fa" stroke-width="1.2" opacity="0.35"/>
  <line x1="42" y1="136" x2="16" y2="170" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Mid right connections -->
  <line x1="258" y1="136" x2="290" y2="140" stroke="#60a5fa" stroke-width="1.2" opacity="0.35"/>
  <line x1="258" y1="136" x2="284" y2="170" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <!-- Lower connections -->
  <line x1="110" y1="210" x2="70" y2="240" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="210" x2="230" y2="240" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="150" y1="230" x2="150" y2="268" stroke="#60a5fa" stroke-width="1.2" opacity="0.35"/>
  <line x1="150" y1="230" x2="110" y2="270" stroke="#60a5fa" stroke-width="1" opacity="0.25"/>
  <line x1="150" y1="230" x2="190" y2="270" stroke="#60a5fa" stroke-width="1" opacity="0.25"/>

  <!-- Inter-node connections (between outer nodes) -->
  <line x1="90" y1="8" x2="14" y2="42" stroke="#93c5fd" stroke-width="0.8" opacity="0.2"/>
  <line x1="210" y1="8" x2="286" y2="42" stroke="#93c5fd" stroke-width="0.8" opacity="0.2"/>
  <line x1="8" y1="80" x2="10" y2="140" stroke="#93c5fd" stroke-width="0.8" opacity="0.2"/>
  <line x1="292" y1="80" x2="290" y2="140" stroke="#93c5fd" stroke-width="0.8" opacity="0.2"/>
  <line x1="16" y1="170" x2="70" y2="240" stroke="#93c5fd" stroke-width="0.8" opacity="0.15"/>
  <line x1="284" y1="170" x2="230" y2="240" stroke="#93c5fd" stroke-width="0.8" opacity="0.15"/>
  <line x1="70" y1="240" x2="110" y2="270" stroke="#93c5fd" stroke-width="0.8" opacity="0.15"/>
  <line x1="230" y1="240" x2="190" y2="270" stroke="#93c5fd" stroke-width="0.8" opacity="0.15"/>
  <line x1="150" y1="2" x2="90" y2="8" stroke="#93c5fd" stroke-width="0.8" opacity="0.2"/>
  <line x1="150" y1="2" x2="210" y2="8" stroke="#93c5fd" stroke-width="0.8" opacity="0.2"/>

  <!-- Outer neural nodes -->
  <!-- Top cluster -->
  <circle cx="150" cy="2" r="5" fill="#3b82f6" filter="url(#nodeGlow)"/>
  <circle cx="90" cy="8" r="4" fill="#60a5fa" opacity="0.8"/>
  <circle cx="210" cy="8" r="4" fill="#60a5fa" opacity="0.8"/>
  <!-- Left cluster -->
  <circle cx="14" cy="42" r="4.5" fill="#60a5fa" opacity="0.85"/>
  <circle cx="8" cy="80" r="4" fill="#3b82f6" filter="url(#nodeGlow)"/>
  <circle cx="24" cy="108" r="3" fill="#93c5fd" opacity="0.7"/>
  <circle cx="10" cy="140" r="3.5" fill="#60a5fa" opacity="0.75"/>
  <circle cx="16" cy="170" r="3" fill="#93c5fd" opacity="0.6"/>
  <!-- Right cluster -->
  <circle cx="286" cy="42" r="4.5" fill="#60a5fa" opacity="0.85"/>
  <circle cx="292" cy="80" r="4" fill="#3b82f6" filter="url(#nodeGlow)"/>
  <circle cx="276" cy="108" r="3" fill="#93c5fd" opacity="0.7"/>
  <circle cx="290" cy="140" r="3.5" fill="#60a5fa" opacity="0.75"/>
  <circle cx="284" cy="170" r="3" fill="#93c5fd" opacity="0.6"/>
  <!-- Bottom cluster -->
  <circle cx="70" cy="240" r="3.5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="230" cy="240" r="3.5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="150" cy="268" r="4.5" fill="#3b82f6" filter="url(#nodeGlow)"/>
  <circle cx="110" cy="270" r="3" fill="#93c5fd" opacity="0.6"/>
  <circle cx="190" cy="270" r="3" fill="#93c5fd" opacity="0.6"/>

  <!-- Shield (on top of everything) -->
  <path d="M150 20L42 68v68c0 64 46 120 108 142 62-22 108-78 108-142V68z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  <path d="M150 38L56 78v58c0 56 40 104 94 124 54-20 94-68 94-124V78z" fill="url(#shieldInner)" opacity="0.3"/>

  <!-- 3D Padlock -->
  <g transform="translate(0, 18)">
    <!-- Lock shackle shadow -->
    <path d="M132 118 V100 C132 82 168 82 168 100 V118" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" opacity="0.15"/>
    <!-- Lock shackle -->
    <path d="M130 116 V98 C130 80 170 80 170 98 V116" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
    <!-- Shackle highlight -->
    <path d="M134 116 V100 C134 86 150 82 150 82" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Lock body shadow -->
    <rect x="120" y="120" width="64" height="52" rx="8" fill="#0f172a" opacity="0.15" transform="translate(2,2)"/>
    <!-- Lock body main face -->
    <rect x="118" y="118" width="64" height="52" rx="8" fill="white" opacity="0.95"/>
    <!-- Lock body top edge (3D) -->
    <rect x="118" y="118" width="64" height="6" rx="3" fill="white" opacity="0.5"/>
    <!-- Lock body left edge (3D darker) -->
    <rect x="118" y="118" width="4" height="52" rx="2" fill="#e2e8f0" opacity="0.6"/>
    <!-- Lock body right edge (3D lighter) -->
    <rect x="178" y="118" width="4" height="52" rx="2" fill="#f8fafc" opacity="0.4"/>

    <!-- Keyhole circle -->
    <circle cx="150" cy="140" r="9" fill="#1e3a8a"/>
    <!-- Keyhole highlight ring -->
    <circle cx="150" cy="140" r="9" fill="none" stroke="#0f172a" stroke-width="1" opacity="0.2"/>
    <!-- Keyhole slot -->
    <rect x="146" y="143" width="8" height="14" rx="2" fill="#1e3a8a"/>
    <!-- Keyhole inner shine -->
    <circle cx="148" cy="138" r="2" fill="#3b82f6" opacity="0.4"/>
  </g>
</svg>
