<div class="logstash-filter-wrapper">
  <div *ngIf="show" class="alert alert-info alert-styled-right">
    Read the logs filter documentation at
    <a class="text-blue-800 font-size-base font-weight-semibold"
       href="https://documentation.utmstack.com/v11/rules-and-filters/implementing-filters"
       target="_blank"
       rel="noopener noreferrer"
    >
      UTMStack filters documentation
    </a>
  </div>
  <form #form="ngForm" class="logstash-filter-form">
    <div class="row">
      <div class="col-6 form-group w-25">
        <label class="form-control-label" for="filterName">Filter name</label>
        <input name="filterName" [(ngModel)]="filter.filterName" [disabled]="disable" class="form-control" placeholder="" id="filterName">
      </div>
      <div class="col-6 form-group w-25">
        <div class="form-group-select">
          <label>Data Types:</label>
          <ng-select required="true"
                     name="datatype"
                     disabled="true"
                     (scrollToEnd)="loadDataTypes()"
                     [items]="(types$ | async)"
                     [loading]="loadingDataTypes"
                     [(ngModel)]="filter.datatype"
                     #dataTypesField="ngModel"
                     [ngClass]="{'is-invalid': dataTypesField.invalid && dataTypesField.touched}"
                     [trackByFn]="trackByFn"
                     [virtualScroll]="true"
                     bindLabel="dataType"
                     class="flex-item type-select"
                     placeholder="Choose data types">
          </ng-select>
          <div *ngIf="dataTypesField.invalid && dataTypesField.touched"
               class="invalid-feedback">
            Data type is required.
          </div>
        </div>
      </div>
    </div>

    <div class="form-group yaml-editor-group">
      <label class="form-control-label">Filter definition</label>
      <div class="yaml-editor-container">
        <ngx-monaco-editor
          #editorContainer
          class="template-editor"
          name="logstashFilter"
          [options]="editorOptions"
          [(ngModel)]="filter.logstashFilter"
          (ngModelChange)="onEditorChange($event)">
        </ngx-monaco-editor>
      </div>
    </div>

    <div class="d-flex justify-content-end align-items-center mt-3 form-actions">
      <button (click)="close.emit('close')" class="btn utm-button utm-button-grey">
        Cancel
      </button>
      <button (click)="save()"
              [disabled]="form.invalid || disable"
              class="btn utm-button utm-button-primary mx-3">
        <i [ngClass]="saving?'icon-spinner2 spinner':'icon-database-edit2'"></i>
        Save
      </button>
    </div>
  </form>
</div>
