<div class="modal-header">
  <h3>
    <i *ngIf="icon" [class]="icon" class="mr-2"></i>
    {{name}}
  </h3>
  <button *ngIf="showCloseButton"
          class="btn-close"
          (click)="closeModal.emit(true); activeModal.dismiss('closed')">
    <i class="icon-cross"></i>
  </button>
</div>
