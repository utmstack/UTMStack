management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: ['health', 'info', 'jhimetrics', 'prometheus' ]
  endpoint:
    health:
      show-details: when_authorized
      roles: ["ROLE_ADMIN", "ROLE_USER"]
      probes:
        enabled: true
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,db
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
        step: 60
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    tags:
      application: ${spring.application.name}
    web:
      server:
        request:
          autotime:
            enabled: true

spring:
  application:
    name: UTMStack-API
  profiles:
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      # hibernate.id.new_generator_mappings (Hibernate 5) removed in 6.x; its 'true' value
      # was the H5 default and H6 uses the new-generator behavior unconditionally.
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        # Boot 3 removed SpringPhysicalNamingStrategy; CamelCaseToUnderscoresNamingStrategy is
        # its behavior-identical Hibernate 6 replacement (camelCase field -> snake_case column,
        # which several entities rely on since not every field has an explicit @Column(name=...)).
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        # Boot 4 relocated SpringImplicitNamingStrategy: org.springframework.boot.orm.jpa.hibernate
        # (Boot 3) -> org.springframework.boot.hibernate (spring-boot-hibernate artifact).
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  task:
    execution:
      thread-name-prefix: utm-stack-cloud-backend-task-
      pool:
        core-size: 2
        max-size: 1000
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: utmstack-api-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

jhipster:
  api-docs:
    default-include-pattern: ${server.servlet.context-path:}/api/.*
    management-include-pattern: ${server.servlet.context-path:}/management/.*
    title: UTMStack Backend API
    description: UTMStack Backend API documentation
    version: 10.1.0
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    content-security-policy: "default-src 'self' https://fonts.googleapis.com/css* https://fonts.gstatic.com/s/poppins/v20*; frame-src 'self' data:; script-src 'self' https://storage.googleapis.com*; style-src 'self' https://fonts.googleapis.com/css*; img-src 'self' data:; font-src 'self' data:"

# application:
