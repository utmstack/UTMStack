  contact: {}
  description: UTMStack backend API — manages IAM, modules, flows, incidents, compliance
    and audit data.
  title: UTMStack Backend Service
  version: "1.0"
paths:
  /ad-audit/stats:
    get:
      description: 'Roll-up for the User Auditor overview: lifecycle counts and by-domain
        breakdown, scoped to the caller''s tenant.'
      produces:
      - application/json
