      description: |-
        Lists every registered forwarder-module collector (the picker
        feed), each tagged with status "online" or "offline". Only
        online ones can currently receive a config push.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CollectorResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List forwarder collectors
      tags:
      - Integrations
  /integrations/collectors/{id}/certificates:
    put:
      consumes:
      - application/json
      description: |-
        Forwards a base64-encoded PEM cert/key/(optional CA) triple
        to agent-manager's reserved __tls_certs__ SetCollectorConfig
        channel (action:"apply") and blocks until the forwarder
        acknowledges. The backend never encrypts this payload —
        agent-manager seals it before relaying to the forwarder.
      parameters:
      - description: Collector ID
        in: path
        name: id
        required: true
        type: integer
      - description: Base64-encoded PEM cert/key/(optional) CA
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetForwarderCertificatesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ConfigKnowledgeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Push cert/key/(optional CA) certificates to a forwarder
      tags:
      - Integrations
  /integrations/collectors/{id}/data-types/{dataType}:
    get:
      description: |-
        Reads back the collector_integration_config row agent-manager
        already persisted for this (collector, data_type) pair — a
        pure read, no CollectorStream push involved. configured=false
        means the integration was never remotely enabled/disabled for
        this collector.
      parameters:
      - description: Collector ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data type / integration name
        in: path
        name: dataType
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetDataTypeConfigResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the persisted desired-state config of a data-type integration
      tags:
      - Integrations
    put:
      consumes:
      - application/json
      description: |-
        Pushes a remote config to the forwarder collector via
        agent-manager's SetCollectorConfig RPC and blocks until the
        collector acknowledges (or the request times out).
      parameters:
      - description: Collector ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data type / integration name
        in: path
        name: dataType
        required: true
        type: string
      - description: Desired config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SetDataTypeConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ConfigKnowledgeResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enable or disable a data-type integration on a forwarder
      tags:
      - Integrations
  /integrations/collectors/{id}/tls-status:
    get:
      description: |-
        Queries the forwarder's on-disk TLS certificate state via
        the same reserved __tls_certs__ channel (action:"status").
        No secret material travels in the response.
      parameters:
      - description: Collector ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TLSStatusResponse'
        "400":
