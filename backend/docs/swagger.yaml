    - MIN_HITS_REQUIRED
    - THRESHOLD_MAX
    type: string
    x-enum-comments:
      RuleMinHitsRequired: pass if count >= ruleValue
      RuleThresholdMax: pass if count <= ruleValue; 0 means "none allowed"
    x-enum-varnames:
    - RuleMinHitsRequired
    - RuleThresholdMax
  domain.CheckStrategy:
    enum:
