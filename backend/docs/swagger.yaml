info:
  contact: {}
  description: UTMStack backend API — manages IAM, modules, flows, incidents, compliance
    and audit data.
  title: UTMStack Backend Service
  version: "1.0"
paths:
  /ad-audit/stats:
    get:
      description: 'Roll-up for the User Auditor overview: lifecycle counts, by-domain
        breakdown and the distinct tenant list.'
      parameters:
      - description: Scope the counts to a tenant
        in: query
        name: tenantId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ADUserStats'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: AD user inventory stats
      tags:
      - AD Audit
  /ad-audit/users:
    get:
      parameters:
      - description: Substring on samAccountName/sid
        in: query
        name: search
        type: string
      - description: Filter by tenant
        in: query
        name: tenantId
        type: string
      - description: Filter by active
        in: query
        name: active
        type: boolean
      - description: 'Lifecycle bucket: active|disabled|deleted|stale|service (overrides
          active)'
        in: query
        name: status
        type: string
      - description: 'Sort: recent (last seen) or name (default)'
        in: query
        name: sort
        type: string
      - description: Page (0-based)
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Total records
              type: string
          schema:
            items:
              $ref: '#/definitions/domain.ADUser'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List AD users
      tags:
      - AD Audit
    post:
      consumes:
      - application/json
      description: Internal endpoint the ad-audit plugin calls to upsert the users
        that changed since its last flush.
      parameters:
      - description: Users to upsert
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.IngestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest AD users (internal)
      tags:
      - AD Audit
  /ad-audit/users/sync:
    get:
      description: Internal endpoint the ad-audit plugin calls at startup to seed
        its in-memory cache.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ADUser'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Export all AD users (internal)
      tags:
      - AD Audit
  /adversary/alerts:
    post:
      consumes:
      - application/json
      parameters:
      - description: Optional filters
        in: body
        name: filters
        schema:
          items:
            $ref: '#/definitions/common_models.FilterType'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AdversaryResponse'
            type: array
        "204":
          description: No content — index missing or no results
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fetch adversary alerts grouped by adversary host
      tags:
      - Alerts
  /alert-tag-rules:
    get:
      parameters:
      - description: Filter by ID
        in: query
        name: id
        type: integer
      - description: Filter by name
        in: query
        name: name
        type: string
      - description: Filter by condition field
        in: query
        name: conditionField
        type: string
      - description: Filter by condition value
        in: query
        name: conditionValue
        type: string
      - description: Filter by active status
        in: query
        name: ruleActive
        type: boolean
      - description: Filter by deleted status
        in: query
        name: ruleDeleted
        type: boolean
      - description: Comma-separated tag IDs
        in: query
        name: tagIds
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Total items
              type: string
          schema:
            items:
              $ref: '#/definitions/dto.AlertTagRuleResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List alert tag rules
      tags:
      - Alert Tag Rules
    post:
      consumes:
      - application/json
      parameters:
      - description: Alert tag rule
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAlertTagRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AlertTagRuleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create alert tag rule
      tags:
      - Alert Tag Rules
    put:
      consumes:
      - application/json
      parameters:
      - description: Alert tag rule
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAlertTagRuleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AlertTagRuleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update alert tag rule
      tags:
      - Alert Tag Rules
  /alert-tag-rules/{id}:
    delete:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Deleted
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete alert tag rule
      tags:
      - Alert Tag Rules
    get:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AlertTagRuleResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get alert tag rule by ID
      tags:
      - Alert Tag Rules
  /alert-tag-rules/get-by-ids:
    get:
      parameters:
      - collectionFormat: csv
        description: Rule IDs (repeated param)
        in: query
        items:
          type: integer
        name: ids
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AlertTagRuleResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get alert tag rules by IDs
      tags:
      - Alert Tag Rules
  /api-keys:
    get:
      parameters:
      - description: default 1
        in: query
        name: page
        type: integer
      - description: default 20
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIKeyListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - API Keys
    post:
      consumes:
      - application/json
      parameters:
      - description: API key name, allowed IPs and optional expiry
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.APIKeyUpsertRequest'
      produces:
      - application/json
      responses:
