name: Build & Push Golang Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string
      flags:
        required: false
        type: string
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: ^1.20
        id: go

      - name: Running Tests
        working-directory: ./${{inputs.image_name}}
        run: go test -v ./...
  
      - name: Build Binary
        working-directory: ./${{inputs.image_name}}
        env:
          GOAMD64: v1
          CGO_CFLAGS: "-march=x86-64 -mtune=generic"
          CGO_CXXFLAGS: "-march=x86-64 -mtune=generic"
        run: |
          if [ -n "${{inputs.flags}}" ]; then
            go build -o ${{inputs.image_name}} -v -ldflags "${{inputs.flags}}" .
          else
            go build -o ${{inputs.image_name}} -v .
          fi
          if readelf -n "${{inputs.image_name}}" 2>/dev/null | grep -qE 'x86 ISA needed:.*x86-64-v[234]'; then
            echo "FAIL: ${{inputs.image_name}} requires x86-64-v2+ ISA" >&2
            exit 1
          fi
          if objdump -d "${{inputs.image_name}}" 2>/dev/null | awk '/<x_cgo_getstackbound>:/,/^$/' | grep -qE '\sv[a-z]+'; then
            echo "FAIL: ${{inputs.image_name}} contains AVX instructions in x_cgo_getstackbound" >&2
            exit 1
          fi
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: utmstack
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{inputs.image_name}}
          push: true
          tags: ghcr.io/utmstack/utmstack/${{inputs.image_name}}:${{inputs.tag}}