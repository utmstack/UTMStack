name: "Frontend - Build Federation Image"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v11.2.10). The image will be tagged as <version>-federation"
        required: true
        type: string

jobs:
  build_frontend_federation:
    name: Build Frontend Federation Image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20.20.2: Angular 20 requires node ^20.19.0 (S18/S20, 2026-11-12).
          # npm 10 preserves the committed lockfileVersion 2. Mirrors
          # reusable-node.yml.
          node-version: '20.20.2'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          export NODE_OPTIONS=--max_old_space_size=8192
          npm install
          npm run-script build

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: utmstack
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the Federation Image
        uses: docker/build-push-action@v6
        with:
          context: /home/runner/work/UTMStack/UTMStack/frontend/
          push: true
          provenance: false
          tags: ghcr.io/utmstack/utmstack/frontend:${{ inputs.version }}-federation
