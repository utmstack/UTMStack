name: Build & Push Node Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 18.20.8: Angular CLI 17 requires >= v18.13 (S17, 2026-11-05).
          # npm 10 on 18.x preserves the existing lockfileVersion 2 (verified:
          # `npm install` on 18.20.8 rewrote no version field), so `npm ci` on
          # Node 18 stays reproducible against the v2 lock. (S16 ran on
          # 16.20.2 / npm 8; S15 and earlier on 14.20.0 / npm 6 / v1 lock.)
          node-version: '18.20.8'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build
        working-directory: ./${{inputs.image_name}}
        run: |
          export NODE_OPTIONS=--max_old_space_size=8192
          npm install
          npm run-script build

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: utmstack
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the Image
        uses: docker/build-push-action@v6
        with:
          context: /home/runner/work/UTMStack/UTMStack/${{inputs.image_name}}/
          push: true
          tags: ghcr.io/utmstack/utmstack/${{inputs.image_name}}:${{inputs.tag}}