name: Build & Push Node Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20.20.2: Angular 20 requires node ^20.19.0 (S18/S20, 2026-11-12).
          # npm 10 on 20.x preserves the committed lockfileVersion 2 (verified in
          # a clean CI-replica build), so the build stays reproducible.
          # (S17 ran on 18.20.8/Angular 17; S16 on 16.20.2/npm 8; S15 on 14.20.0/npm 6/v1 lock.)
          node-version: '20.20.2'

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build
        working-directory: ./${{inputs.image_name}}
        run: |
          export NODE_OPTIONS=--max_old_space_size=8192
          npm install
          npm run-script build

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: utmstack
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the Image
        uses: docker/build-push-action@v6
        with:
          context: /home/runner/work/UTMStack/UTMStack/${{inputs.image_name}}/
          push: true
          tags: ghcr.io/utmstack/utmstack/${{inputs.image_name}}:${{inputs.tag}}