name: "v12 - Build & Deploy Pipeline"

on:
  push:
    branches:
      - 'release/v12**'
  release:
    types: [published]

concurrency:
  group: v12-build-deploy-pipeline
  cancel-in-progress: false

jobs:
  setup_deployment:
    name: Setup Deployment
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.set-env.outputs.tag }}
      environment: ${{ steps.set-env.outputs.environment }}
      cm_url: ${{ steps.set-env.outputs.cm_url }}
      event_processor_tag: ${{ steps.set-env.outputs.event_processor_tag }}
      enterprise_version: ${{ steps.set-env.outputs.enterprise_version }}
    steps:
      - name: Determine Build Environment
        id: set-env
        run: |
          # =====================================================================
          # DEV — push to release/v12**
          # Version = <branch-base>-dev.N, auto-incremented via CM.
          # =====================================================================
          if ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v12') }}; then
            ENVIRONMENT="dev"
            CM_URL="https://cm.dev.utmstack.com"
            echo "Environment: $ENVIRONMENT"
            echo "CM URL: $CM_URL"

            # Extract version from branch name (e.g. release/v12.2.1 → v12.2.1)
            BRANCH_VERSION=$(echo "${{ github.ref }}" | sed 's|refs/heads/release/||')
            echo "Branch version: $BRANCH_VERSION"

            RESPONSE=$(curl -s "${CM_URL}/api/v1/versions/latest?product=utmstack-v12-dev")
            LATEST_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')
            echo "Latest version from CM: $LATEST_VERSION"

            if [ -n "$LATEST_VERSION" ]; then
              LATEST_BASE=$(echo "$LATEST_VERSION" | sed 's/-dev\.[0-9]*$//')
              if [ "$BRANCH_VERSION" = "$LATEST_BASE" ]; then
                DEV_NUM=$(echo "$LATEST_VERSION" | grep -oP '(?<=-dev\.)\d+')
                NEW_DEV_NUM=$((DEV_NUM + 1))
                TAG="${BRANCH_VERSION}-dev.${NEW_DEV_NUM}"
                echo "Versions match, incrementing: $TAG"
              else
                TAG="${BRANCH_VERSION}-dev.1"
                echo "Versions don't match, starting fresh: $TAG"
              fi
            else
              TAG="${BRANCH_VERSION}-dev.1"
              echo "No previous version found, starting fresh: $TAG"
            fi

            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
            echo "cm_url=$CM_URL" >> $GITHUB_OUTPUT
            echo "event_processor_tag=${{ vars.TW_EVENT_PROCESSOR_VERSION_DEV }}" >> $GITHUB_OUTPUT
            echo "enterprise_version=${{ vars.ENTERPRISE_ARTIFACTS_VERSION_DEV }}" >> $GITHUB_OUTPUT

          # =====================================================================
          # PRODUCTION — release.published (prerelease or not)
          #
          # The tag is taken directly from the release event — no CM queries.
          # Always runs a full build and deploys to our production instances.
          # =====================================================================
          elif ${{ github.event_name == 'release' }}; then
            CM_URL="https://cm.utmstack.com"
            TAG="${{ github.event.release.tag_name }}"
            echo "Event: release, tag=$TAG"

            if [[ ! "$TAG" =~ ^v12\. ]]; then
              echo "⏭️ Skipping: tag '$TAG' is not a v12 release."
              exit 0
            fi

            echo "Environment: production (our instances)"
            echo "CM URL: $CM_URL"

            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "cm_url=$CM_URL" >> $GITHUB_OUTPUT
            echo "event_processor_tag=${{ vars.TW_EVENT_PROCESSOR_VERSION_PROD }}" >> $GITHUB_OUTPUT
            echo "enterprise_version=${{ vars.ENTERPRISE_ARTIFACTS_VERSION_PROD }}" >> $GITHUB_OUTPUT
          fi
  build_agent:
    name: Build Agent Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [setup_deployment]
    if: ${{ needs.setup_deployment.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            agent/updater/go.sum

      - name: Build agent + updater binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi

          cd ${{ github.workspace }}/agent
          go build -o "utmstack_agent_service_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" -v -ldflags "-X 'github.com/utmstack/UTMStack/agent/config.REPLACE_KEY=${{ secrets.AGENT_SECRET_PREFIX }}'" .

          cd ${{ github.workspace }}/agent/updater
          go build -o "utmstack_updater_service_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" .

      - name: Upload agent binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            agent/utmstack_agent_service_${{ matrix.goos }}_${{ matrix.goarch }}*
            agent/updater/utmstack_updater_service_${{ matrix.goos }}_${{ matrix.goarch }}*
          retention-days: 1
  sign_agent_windows:
    name: Sign Windows Agent Binaries
    needs: [build_agent, setup_deployment]
    # Signing (GCP KMS + jsign) only matters for binaries customers actually
    # install — dev builds only ever reach our own dev instances, so skip it
    # there to save the job time and avoid depending on external signers.
    if: ${{ needs.setup_deployment.outputs.tag != '' && needs.setup_deployment.outputs.environment == 'production' }}
    uses: ./.github/workflows/reusable-sign-agent.yml
    with:
      os: windows
      artifact_pattern: agent-bin-windows-*
      signed_artifact_name: agents-windows-signed
      gcp_project_id: ${{ vars.GCP_PROJECT_PROD }}
      kms_location: ${{ vars.KMS_KEYRING_LOCATION }}
      kms_keyring: ${{ vars.KMS_KEYRING_NAME }}
      kms_key: ${{ vars.KMS_KEY_NAME }}
      binaries: |
        utmstack_agent_service_windows_amd64.exe
        utmstack_agent_service_windows_arm64.exe
        updater/utmstack_updater_service_windows_amd64.exe
        updater/utmstack_updater_service_windows_arm64.exe
    secrets: inherit
  sign_agent_macos:
    name: Sign macOS Agent Binaries
    needs: [build_agent, setup_deployment]
    # Same reasoning as sign_agent_windows — also skips Apple notarization's
    # queue time, which is the least predictable step in the whole pipeline.
    if: ${{ needs.setup_deployment.outputs.tag != '' && needs.setup_deployment.outputs.environment == 'production' }}
    uses: ./.github/workflows/reusable-sign-agent.yml
    with:
      os: macos
      artifact_pattern: agent-bin-darwin-*
      signed_artifact_name: agents-darwin-signed
      binaries: |
        utmstack_agent_service_darwin_arm64
        updater/utmstack_updater_service_darwin_arm64
    secrets: inherit
  build_utmstack_collector:
    name: Build UTMStack Collector
    needs: [setup_deployment]
    if: ${{ needs.setup_deployment.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: collectors/utmstack/go.mod
          cache-dependency-path: |
            collectors/utmstack/go.sum
            collectors/as400/go.sum
            collectors/forwarder/go.sum

      - name: Build UTMStack Collectors
        run: |
          echo "Building UTMStack Collector..."
          cd ${{ github.workspace }}/collectors/utmstack
          GOOS=linux GOARCH=amd64 go build -o utmstack_collector -v -ldflags "-X 'github.com/utmstack/UTMStack/collectors/utmstack/config.REPLACE_KEY=${{ secrets.AGENT_SECRET_PREFIX }}'" .

          echo "Building UTMStack AS400 Collector..."
          cd ${{ github.workspace }}/collectors/as400
          GOOS=linux GOARCH=amd64 go build -o utmstack_as400_collector_service -v -ldflags "-X 'github.com/utmstack/UTMStack/collectors/as400/config.REPLACE_KEY=${{ secrets.AGENT_SECRET_PREFIX }}'" .

          echo "Building UTMStack Forwarder..."
          cd ${{ github.workspace }}/collectors/forwarder
          GOOS=linux GOARCH=amd64 go build -o utmstack_forwarder -v -ldflags "-X 'github.com/utmstack/UTMStack/collectors/forwarder/config.REPLACE_KEY=${{ secrets.AGENT_SECRET_PREFIX }}'" .

      - name: Upload collector binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: utmstack-collectors
          path: |
            ${{ github.workspace }}/collectors/utmstack/utmstack_collector
            ${{ github.workspace }}/collectors/as400/utmstack_as400_collector_service
            ${{ github.workspace }}/collectors/forwarder/utmstack_forwarder
          retention-days: 1
  build_agent_manager:
    name: Build Agent Manager Microservice
    needs: [build_agent, sign_agent_windows, sign_agent_macos, build_utmstack_collector, setup_deployment]
    # Signing jobs are skipped (not "success") on dev — only require them when
    # we're actually shipping to customers.
    if: >-
      ${{ always() && needs.build_agent.result == 'success' && needs.build_utmstack_collector.result == 'success' &&
          needs.setup_deployment.outputs.tag != '' &&
          (needs.setup_deployment.outputs.environment != 'production' ||
           (needs.sign_agent_windows.result == 'success' && needs.sign_agent_macos.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-manager/go.mod
          cache-dependency-path: agent-manager/go.sum

      - name: Download Linux agents from artifact
        uses: actions/download-artifact@v4
        with:
          pattern: agent-bin-linux-*
          path: ${{ github.workspace }}/agent
          merge-multiple: true

      - name: Download signed Windows agents from artifact
        if: needs.setup_deployment.outputs.environment == 'production'
        uses: actions/download-artifact@v4
        with:
          name: agents-windows-signed
          path: ${{ github.workspace }}/agent

      - name: Download unsigned Windows agents from artifact
        if: needs.setup_deployment.outputs.environment != 'production'
        uses: actions/download-artifact@v4
        with:
          pattern: agent-bin-windows-*
          path: ${{ github.workspace }}/agent
          merge-multiple: true

      - name: Download UTMStack Collectors from artifacts
        uses: actions/download-artifact@v4
        with:
          name: utmstack-collectors
          path: ${{ github.workspace }}/collector-binaries

      - name: Download signed macOS agents from artifact
        if: needs.setup_deployment.outputs.environment == 'production'
        uses: actions/download-artifact@v4
        with:
          name: agents-darwin-signed
          path: ${{ github.workspace }}/agent-darwin

      - name: Download unsigned macOS agents from artifact
        if: needs.setup_deployment.outputs.environment != 'production'
        uses: actions/download-artifact@v4
        with:
          pattern: agent-bin-darwin-*
          path: ${{ github.workspace }}/agent-darwin
          merge-multiple: true

      - name: Prepare dependencies for Agent Manager Image
        env:
          GH_TOKEN: ${{ secrets.READ_PRIVATE_REPO }}
          ENTERPRISE_VERSION: ${{ needs.setup_deployment.outputs.enterprise_version }}
        run: |
          cd ${{ github.workspace }}/agent-manager
          GOOS=linux GOARCH=amd64  go build -o agent-manager -v .

          mkdir -p ./dependencies/collector
          cp "${{ github.workspace }}/collector-binaries/utmstack/utmstack_collector" ./dependencies/collector/
          cp "${{ github.workspace }}/collectors/utmstack/version.json" ./dependencies/collector/

          mkdir -p ./dependencies/collector/as400
          gh release download "$ENTERPRISE_VERSION" \
            --repo utmstack/UTMStackEnterprise \
            --pattern as400-collector.jar \
            --output ./dependencies/collector/as400/as400-collector.jar \
            --clobber

          cp "${{ github.workspace }}/collectors/as400/version.json" ./dependencies/collector/as400/
          cp "${{ github.workspace }}/collector-binaries/as400/utmstack_as400_collector_service" ./dependencies/collector/as400/

          mkdir -p ./dependencies/collector/forwarder
          cp "${{ github.workspace }}/collector-binaries/forwarder/utmstack_forwarder" ./dependencies/collector/forwarder/
          cp "${{ github.workspace }}/collectors/forwarder/version.json" ./dependencies/collector/forwarder/

          mkdir -p ./dependencies/agent/

          # Linux agents
          cp "${{ github.workspace }}/agent/utmstack_agent_service_linux_amd64" ./dependencies/agent/
          cp "${{ github.workspace }}/agent/utmstack_agent_service_linux_arm64" ./dependencies/agent/
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_linux_amd64" ./dependencies/agent/
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_linux_arm64" ./dependencies/agent/

          # Windows agents
          cp "${{ github.workspace }}/agent/utmstack_agent_service_windows_amd64.exe" ./dependencies/agent/
          cp "${{ github.workspace }}/agent/utmstack_agent_service_windows_arm64.exe" ./dependencies/agent/
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_windows_amd64.exe" ./dependencies/agent/
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_windows_arm64.exe" ./dependencies/agent/

          # macOS agents (signed and notarized in production; unsigned in dev)
          cp "${{ github.workspace }}/agent-darwin/utmstack_agent_service_darwin_arm64" ./dependencies/agent/
          cp "${{ github.workspace }}/agent-darwin/updater/utmstack_updater_service_darwin_arm64" ./dependencies/agent/
          gh release download "$ENTERPRISE_VERSION" \
            --repo utmstack/UTMStackEnterprise \
            --pattern utmstack-collector-mac \
            --output ./dependencies/agent/utmstack-collector-mac \
            --clobber

          # TODO: Remove legacy binary names after all agents have migrated to new naming convention
          # Legacy names for backwards compatibility with existing agents
          cp "${{ github.workspace }}/agent/utmstack_agent_service_linux_amd64" ./dependencies/agent/utmstack_agent_service
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_linux_amd64" ./dependencies/agent/utmstack_updater_service
          cp "${{ github.workspace }}/agent/utmstack_agent_service_windows_amd64.exe" ./dependencies/agent/utmstack_agent_service.exe
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_windows_amd64.exe" ./dependencies/agent/utmstack_updater_service.exe
          cp "${{ github.workspace }}/agent/utmstack_agent_service_windows_arm64.exe" ./dependencies/agent/utmstack_agent_service_arm64.exe
          cp "${{ github.workspace }}/agent/updater/utmstack_updater_service_windows_arm64.exe" ./dependencies/agent/utmstack_updater_service_arm64.exe

          cp "${{ github.workspace }}/agent/version.json" ./dependencies/agent/

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: utmstack
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the Agent Manager Image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-manager
          push: true
          provenance: false
          tags: ghcr.io/utmstack/utmstack/agent-manager:${{ needs.setup_deployment.outputs.tag }}
          cache-from: type=gha,scope=agent-manager
          cache-to: type=gha,mode=max,scope=agent-manager
  build_plugins:
    name: Build Event Processor Plugin (${{ matrix.plugin }})
    needs: [setup_deployment]
    if: ${{ needs.setup_deployment.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - alerts
          - aws
          - azure
          - bitdefender
          - events
          - gcp
          - geolocation
          - inputs
          - o365
          - sophos
          - stats
          - soc-ai
          - crowdstrike
          - feeds
          - ad-audit
          - soar
          - playground
    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugins/${{ matrix.plugin }}/go.mod
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum

      - name: Build plugin
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          cd ${{ github.workspace }}/plugins/${{ matrix.plugin }}
          go build -o com.utmstack.${{ matrix.plugin }}.plugin -v .

      - name: Upload plugin binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bin-${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/com.utmstack.${{ matrix.plugin }}.plugin
          retention-days: 1
  build_event_processor:
    name: Build Event Processor Microservice
    needs: [build_plugins, setup_deployment]
    if: ${{ always() && needs.build_plugins.result == 'success' && needs.setup_deployment.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the right branch
        uses: actions/checkout@v4

      - name: Download plugin binaries from artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-bin-*
          path: ${{ github.workspace }}/plugin-binaries
          merge-multiple: true

      - name: Restore plugin binary permissions
        run: chmod +x ./plugin-binaries/*

      - name: Prepare Dependencies for Event Processor Image
        env:
          GH_TOKEN: ${{ secrets.READ_PRIVATE_REPO }}
          ENTERPRISE_VERSION: ${{ needs.setup_deployment.outputs.enterprise_version }}
        run: |
          mkdir -p ./geolocation
          curl -sSL "https://storage.googleapis.com/utmstack-updates/dependencies/geolocation/asn-blocks-v4.csv" -o ./geolocation/asn-blocks-v4.csv
          curl -sSL "https://storage.googleapis.com/utmstack-updates/dependencies/geolocation/asn-blocks-v6.csv" -o ./geolocation/asn-blocks-v6.csv
          curl -sSL "https://storage.googleapis.com/utmstack-updates/dependencies/geolocation/blocks-v4.csv" -o ./geolocation/blocks-v4.csv
          curl -sSL "https://storage.googleapis.com/utmstack-updates/dependencies/geolocation/blocks-v6.csv" -o ./geolocation/blocks-v6.csv
          curl -sSL "https://storage.googleapis.com/utmstack-updates/dependencies/geolocation/locations-en.csv" -o ./geolocation/locations-en.csv

          # Enterprise entitlements plugin (prebuilt, from private UTMStackEnterprise release)
          gh release download "$ENTERPRISE_VERSION" \
            --repo utmstack/UTMStackEnterprise \
            --pattern entitlements \
            --output ./plugin-binaries/com.utmstack.entitlements.plugin \
            --clobber
          chmod +x ./plugin-binaries/com.utmstack.entitlements.plugin

      - name: Setup BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: utmstack
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push the Event Processor Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./event_processor.Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/utmstack/utmstack/eventprocessor:${{ needs.setup_deployment.outputs.tag }}
          build-args: |
            BASE_IMAGE=ghcr.io/threatwinds/eventprocessor/base:${{ needs.setup_deployment.outputs.event_processor_tag }}
          cache-from: type=gha,scope=event-processor
          cache-to: type=gha,mode=max,scope=event-processor
  build_backend:
    name: Build Backend Microservice
    needs: [setup_deployment]
    if: ${{ needs.setup_deployment.outputs.tag != '' }}
    uses: ./.github/workflows/reusable-golang.yml
    with:
      image_name: backend
      tag: ${{ needs.setup_deployment.outputs.tag }}
      build_context: "."
      dockerfile: "./backend/Dockerfile"
      # NOTE: `secrets.*` is NOT allowed in `with:`. The values are passed via the
      # `secrets:` block below and expanded here as shell env vars at build time.
      flags: >-
        -X 'github.com/utmstack/utmstack/backend/modules/billing.PublicKey=${CM_SIGN_PUBLIC_KEY}'
        -X 'github.com/utmstack/utmstack/backend/modules/billing.EncryptSalt=${CM_ENCRYPT_SALT}'
    secrets:
      API_SECRET: ${{ secrets.API_SECRET }}
      CM_SIGN_PUBLIC_KEY: ${{ secrets.CM_SIGN_PUBLIC_KEY }}
      CM_ENCRYPT_SALT: ${{ secrets.CM_ENCRYPT_SALT }}
  build_frontend:
    name: Build Frontend Microservice
    needs: [setup_deployment]
    if: ${{ needs.setup_deployment.outputs.tag != '' }}
    uses: ./.github/workflows/reusable-node.yml
    with:
      image_name: frontend
      tag: ${{ needs.setup_deployment.outputs.tag }}
  all_builds_complete:
    name: All Builds Complete
    needs: [
      build_agent_manager,
      build_event_processor,
      build_backend,
      build_frontend
    ]
    if: ${{ always() && needs.build_agent_manager.result == 'success' && needs.build_event_processor.result == 'success' && needs.build_backend.result == 'success' && needs.build_frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "✅ All builds completed successfully."
  generate_changelog:
    name: Generate Changelog
    needs: [all_builds_complete, setup_deployment]
    if: ${{ needs.setup_deployment.outputs.tag != '' && github.event_name == 'release' }}
    uses: ./.github/workflows/generate-changelog.yml
    with:
      current_tag: ${{ needs.setup_deployment.outputs.tag }}
    secrets:
      THREATWINDS_API_KEY: ${{ secrets.THREATWINDS_API_KEY }}
      THREATWINDS_API_SECRET: ${{ secrets.THREATWINDS_API_SECRET }}

  # Installer build runs on any GitHub release event (prerelease or not).
  # The binary is uploaded to the release that triggered this pipeline.
  build_installer_release:
    name: Build & Upload Installer
    needs: [generate_changelog, setup_deployment]
    if: ${{ always() && needs.setup_deployment.result == 'success' && needs.setup_deployment.outputs.tag != '' && github.event_name == 'release' && needs.generate_changelog.result != 'cancelled' }}
    uses: ./.github/workflows/installer-release.yml
    with:
      version: ${{ needs.setup_deployment.outputs.tag }}
      version_major: v12
      environment: ${{ needs.setup_deployment.outputs.environment }}
      changelog: ${{ needs.generate_changelog.outputs.changelog }}
    secrets:
      API_SECRET: ${{ secrets.API_SECRET }}
      CM_ENCRYPT_SALT: ${{ secrets.CM_ENCRYPT_SALT }}
      CM_SIGN_PUBLIC_KEY: ${{ secrets.CM_SIGN_PUBLIC_KEY }}

  deploy_installer_dev:
    name: Deploy Installer (Dev)
    needs: [all_builds_complete, setup_deployment]
    if: ${{ always() && needs.all_builds_complete.result == 'success' && needs.setup_deployment.outputs.tag != '' && needs.setup_deployment.outputs.environment == 'dev' }}
    uses: ./.github/workflows/installer-release.yml
    with:
      version: ${{ needs.setup_deployment.outputs.tag }}
      version_major: v12
      environment: dev
    secrets:
      API_SECRET: ${{ secrets.API_SECRET }}
      CM_ENCRYPT_SALT: ${{ secrets.CM_ENCRYPT_SALT }}
      CM_SIGN_PUBLIC_KEY: ${{ secrets.CM_SIGN_PUBLIC_KEY }}
      
  publish_new_version:
    name: Publish New Version to Customer Manager
    needs: [all_builds_complete, generate_changelog, setup_deployment]
    if: ${{ always() && needs.all_builds_complete.result == 'success' && needs.setup_deployment.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish version
        env:
          CHANGELOG_CONTENT: ${{ needs.generate_changelog.outputs.changelog }}
          ENVIRONMENT: ${{ needs.setup_deployment.outputs.environment }}
          TAG: ${{ needs.setup_deployment.outputs.tag }}
          CM_URL: ${{ needs.setup_deployment.outputs.cm_url }}
        run: |
          # Use AI changelog for production releases, generic for dev.
          if [ "$ENVIRONMENT" != "dev" ] && [ -n "$CHANGELOG_CONTENT" ]; then
            changelog="$CHANGELOG_CONTENT"
          else
            changelog="Development build $TAG - Internal testing release"
          fi

          echo "Environment: $ENVIRONMENT"
          echo "CM URL: $CM_URL"
          echo "Tag: $TAG"

          # Select CM_SERVICE_ACCOUNT and product slug based on environment
          if [ "$ENVIRONMENT" = "dev" ]; then
            cmAuth=$(echo '${{ secrets.CM_SERVICE_ACCOUNT_DEV }}' | jq -r '.')
            PRODUCT_SLUG="utmstack-v12-dev"
          else
            cmAuth=$(echo '${{ secrets.CM_SERVICE_ACCOUNT_PROD }}' | jq -r '.')
            PRODUCT_SLUG="utmstack-v12"
          fi

          id=$(echo "$cmAuth" | jq -r '.id')
          key=$(echo "$cmAuth" | jq -r '.key')

          body=$(jq -n \
            --arg version "$TAG" \
            --arg changelog "$changelog" \
            --arg product_slug "$PRODUCT_SLUG" \
            '{version: $version, changelog: $changelog, product_slug: $product_slug}'
          )

          response=$(curl -s -X POST "${CM_URL}/api/v1/versions/register" \
            -H "Content-Type: application/json" \
            -H "id: $id" \
            -H "key: $key" \
            -d "$body")

          echo "Response: $response"
  schedule:
    name: Schedule release to our instances
    needs: [publish_new_version, setup_deployment]
    if: ${{ always() && needs.publish_new_version.result == 'success' && needs.setup_deployment.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: ${{ needs.setup_deployment.outputs.environment }}
      TAG: ${{ needs.setup_deployment.outputs.tag }}
      CM_URL: ${{ needs.setup_deployment.outputs.cm_url }}
      SCHEDULE_INSTANCES_DEV: ${{ vars.SCHEDULE_INSTANCES_DEV }}
      SCHEDULE_INSTANCES_PROD: ${{ vars.SCHEDULE_INSTANCES_PROD }}
      CM_AUTH_DEV: ${{ secrets.CM_SERVICE_ACCOUNT_DEV }}
      CM_AUTH_PROD: ${{ secrets.CM_SERVICE_ACCOUNT_PROD }}
    steps:
      - name: Schedule updates
        run: |
          echo "🔍 Environment: $ENVIRONMENT"
          echo "🔍 Version: $TAG"
          echo "🔍 CM URL: $CM_URL"

          # Values are passed in via `env:` (not interpolated directly into this
          # script) so embedded quotes in the JSON can't corrupt the shell parsing.
          if [ "$ENVIRONMENT" = "dev" ]; then
            targets_json="$SCHEDULE_INSTANCES_DEV"
            auth_json="$CM_AUTH_DEV"
            targets_var_name="SCHEDULE_INSTANCES_DEV"
          else
            targets_json="$SCHEDULE_INSTANCES_PROD"
            auth_json="$CM_AUTH_PROD"
            targets_var_name="SCHEDULE_INSTANCES_PROD"
          fi

          if ! echo "$targets_json" | jq empty > /dev/null 2>&1; then
            echo "❌ $targets_var_name is not valid JSON: $targets_json"
            exit 1
          fi

          # Extract id and key from auth JSON
          auth_id=$(echo "$auth_json" | jq -r '.id')
          auth_key=$(echo "$auth_json" | jq -r '.key')

          # Targets are grouped by product_id (CM scopes instances/versions by
          # product and /api/v1/updates requires it): {"<product_id>": ["<instance_id>", ...]}
          scheduled=0
          for product_id in $(echo "$targets_json" | jq -r 'keys[]'); do
            for instance_id in $(echo "$targets_json" | jq -r --arg p "$product_id" '.[$p][]'); do
              echo "📅 Scheduling release for instance: $instance_id (product: $product_id)"

              response=$(curl -s -w "\n%{http_code}" -X POST "${CM_URL}/api/v1/updates" \
                -H "Content-Type: application/json" \
                -H "id: $auth_id" \
                -H "key: $auth_key" \
                -d "{\"instances_ids\": [\"$instance_id\"], \"version\": \"$TAG\", \"product_id\": \"$product_id\"}")

              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')

              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                echo "✅ Successfully scheduled for instance: $instance_id"
                scheduled=$((scheduled + 1))
              else
                echo "❌ Failed to schedule for instance: $instance_id (HTTP $http_code)"
                echo "Response: $body"
                exit 1
              fi
            done
          done

          if [ "$scheduled" -eq 0 ]; then
            echo "❌ No instances were scheduled — check $targets_var_name"
            exit 1
          fi

          echo "✅ Scheduled release for all $scheduled instance(s) with version $TAG"
